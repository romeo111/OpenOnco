# OpenOnco funding configuration — enables the GitHub "Sponsor" button.
#
# Everything is commented out until a fiscal host / sponsor account exists.
# OpenOnco has no legal entity yet, and Ukraine-resident maintainers cannot use
# direct Stripe payouts — so the recommended path is a FISCAL HOST first
# (Open Source Collective or Open Source Europe). See
# promo/funding-and-distribution.md §2 for the rationale and steps.
#
# Uncomment and fill in once set up:
#
# github: [openonco]                 # GitHub Sponsors — needs a GitHub org + fiscal host
# open_collective: openonco          # after creating an Open Collective (via OSC/OSE)
# custom: ["https://openonco.info"]  # a donate/landing link
