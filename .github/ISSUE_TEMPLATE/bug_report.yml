name: Bug report
description: Report a reproducible website, engine or integration issue
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only. Report security vulnerabilities privately through the Security tab."
  - type: input
    id: location
    attributes:
      label: Page, component or commit
      placeholder: https://openonco.info/ukr/kb.html
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include language, browser and a minimal synthetic input if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove all patient information, credentials and private identifiers.
