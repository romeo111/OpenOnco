name: Validate Knowledge Base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "knowledge_base/**"
      - "specs/**"
      - "scripts/**"
      - "tests/**"
      - "docs/try.html"
      - "docs/ukr/try.html"
      - "docs/style.css"
      - "docs/sw.js"
      - "docs/manifest.webmanifest"
      - "pyproject.toml"
      - "requirements.lock"
      - "requirements.txt"
      - "serverless/**"
      - "api/**"
      - ".env.example"
      - ".github/workflows/validate-kb.yml"
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Validate YAML schema + referential integrity
        run: |
          python scripts/audit_validator.py --human

      - name: Verify public example plans
        run: |
          python -m scripts.audit_examples

      - name: Audit executable algorithm conditions
        run: |
          python -m scripts.audit_algorithm_conditions

      - name: Verify synthetic DLBCL review contracts (not clinical approval)
        run: |
          python -m scripts.build_clinician_review --check --output-dir /tmp/dlbcl-review

      - name: Run tests
        # Failure injection against the JavaScript served to users, without
        # downloading Pyodide or sending a clinical profile to a server.
        run: |
          node tests/browser_engine_loading.cjs
          node tests/browser_report_export.cjs
          node tests/browser_bundle_versions.cjs

      - name: Verify preferred core transfer budget and identical clinical content
        run: python -m scripts.audit_core_transport

      - name: Run Python tests
        run: |
          python -m pytest \
            tests/test_audit_validator_contracts.py \
            tests/test_run_scheduled_audit.py \
            tests/test_audit_writers.py \
            tests/test_algorithm_regimen_routing_contracts.py \
            tests/test_legacy_regimen_normalization.py \
            tests/test_esophageal_1l_algorithm.py \
            tests/test_clinical_question_endpoint.py \
            tests/test_clinical_api_languages.py \
            tests/test_clinical_locales.py \
            tests/test_engine_validation_fail_closed.py \
            tests/test_clinician_review.py \
            tests/test_dlbcl_engine.py \
            tests/test_source_ref_integrity.py \
            tests/test_site_head_faq.py \
            tests/test_site_discovery.py \
            tests/test_site_languages.py \
            tests/test_public_layout_parity.py \
            tests/test_browser_runtime_content.py \
            tests/test_profile_engine_bundle.py \
            tests/test_audit_core_transport.py \
            tests/test_daily_refresh_delivery.py \
            tests/test_safe_yaml_runtime.py \
            tests/test_plan_source_links.py \
            tests/test_patient_render.py \
            tests/test_patient_abbreviation_integrity.py \
            tests/test_patient_localization_inventory.py \
            tests/test_patient_question_translations.py \
            tests/test_patient_rationale_translations.py \
            tests/test_build_site.py::test_static_assets_present \
            tests/test_build_site.py::test_try_page_wires_pyodide_and_form \
            tests/test_build_site.py::test_try_page_has_pwa_manifest_and_build_status \
            -v

      - name: Check source-bound patient note drafts
        run: python -m scripts.audit_patient_localization --check-note-drafts


      - name: Lint (blocking critical correctness rules)
        run: |
          python -m ruff check --select E9,F63,F7,F82 knowledge_base/ serverless/ api/ tests/
