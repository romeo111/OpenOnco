slug: first-clinician-reviewed-plans
date: 2026-04-24
published: 2026-07-19
author: OpenOnco
tags: [validation, clinical]

title:
  en: Practising oncologists reviewed the engine's plans for the first time
  uk: Практикуючі онкологи вперше перевірили плани, згенеровані engine

summary:
  en: >-
    The engine produced treatment plans for a real patient, and the oncologists
    who read them judged them strong. One case does not validate a system — but
    it is the first signal from outside the project's own scoring.
  uk: >-
    Engine побудував плани лікування для реального пацієнта, і онкологи, які їх
    прочитали, оцінили їх як сильні. Один випадок не валідує систему — але це
    перший сигнал ззовні, а не з власної системи оцінювання проєкту.

body:
  en:
    - type: p
      text: >-
        Until this point, the project measured itself. There is an internal
        scoring script that rates a generated plan out of 100, and it is a
        reasonable proxy for whether the machinery is behaving. It is not
        evidence that the output is any good.
    - type: p
      text: >-
        In April 2026 the engine generated treatment plans for a real patient —
        the two-track output the charter requires, standard and aggressive,
        with sources attached to each recommendation. Practising oncologists
        read them and judged them strong.
    - type: h2
      text: What this changes
    - type: p
      text: >-
        The success metric. Clinician judgement now sits above the internal
        rubric: when a change would raise the score but a reviewing oncologist
        would think less of the output, the score is wrong. That reordering is
        the point of this post.
    - type: h2
      text: What it does not establish
    - type: ul
      items:
        - >-
          **One case is not validation.** It is a single patient, one disease
          area, and a handful of readers. Nothing here supports a claim about
          accuracy in general.
        - >-
          **The reviewers assessed plans, not outcomes.** They judged whether
          the reasoning and the cited options were sound — not whether a
          patient did better. Those are different questions, and only the
          second one is clinical evidence.
        - >-
          **Nothing about the disclaimer changes.** This remains a research and
          support tool, not a medical device, and every plan it produces still
          has to be verified by the treating oncologist.
    - type: h2
      text: On publishing the case itself
    - type: p
      text: >-
        The charter (§9.3) sets three conditions before any real case can
        become public: informed consent from the patient, removal of all
        identifying information, and ethics committee approval from the
        treating institution. The project owner reports all three are now in
        place.
    - type: p
      text: >-
        Publishing the case as "Reference Case #0" is a separate step and has
        not been done yet. This post deliberately carries no clinical detail
        about the patient — it does not need any to make its point.
  uk:
    - type: p
      text: >-
        Досі проєкт вимірював сам себе. Є внутрішній скрипт оцінювання, який дає
        згенерованому плану бал зі 100, і це прийнятний непрямий показник того,
        що механізм працює як задумано. Але це не доказ, що результат хороший.
    - type: p
      text: >-
        У квітні 2026 року engine побудував плани лікування для реального
        пацієнта — той самий двотрековий результат, якого вимагає статут,
        стандартний та агресивний, із джерелами до кожної рекомендації.
        Практикуючі онкологи прочитали їх і оцінили як сильні.
    - type: h2
      text: Що це змінює
    - type: p
      text: >-
        Метрику успіху. Судження лікаря тепер стоїть вище за внутрішню шкалу:
        якщо зміна підвищує бал, але онколог-рецензент оцінив би результат
        гірше, то помиляється бал. Саме заради цієї переоцінки й написано цей
        допис.
    - type: h2
      text: Чого це не доводить
    - type: ul
      items:
        - >-
          **Один випадок — не валідація.** Це один пацієнт, одна нозологічна
          ділянка й кілька читачів. Ніщо тут не підтверджує тверджень про
          точність загалом.
        - >-
          **Рецензенти оцінювали плани, а не наслідки.** Вони судили, чи
          обґрунтовані міркування й наведені варіанти, — а не чи стало
          пацієнтові краще. Це різні питання, і клінічним доказом є лише друге.
        - >-
          **Застереження не змінюється.** Це залишається дослідницьким і
          допоміжним інструментом, а не медичним пристроєм, і кожен план, який
          він створює, має перевірити лікуючий онколог.
    - type: h2
      text: Про публікацію самого випадку
    - type: p
      text: >-
        Статут (§9.3) висуває три умови, перш ніж реальний випадок може стати
        публічним: інформована згода пацієнта, вилучення всієї ідентифікаційної
        інформації та схвалення етичного комітету закладу, де проводили
        лікування. Власник проєкту повідомляє, що всі три виконано.
    - type: p
      text: >-
        Публікація випадку як «Reference Case #0» — окремий крок, і його ще не
        зроблено. Цей допис свідомо не містить жодних клінічних деталей про
        пацієнта — вони не потрібні, щоб донести його суть.
