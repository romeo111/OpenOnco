slug: prevention-plans-live
date: 2026-05-19
published: 2026-07-19
author: OpenOnco
tags: [prevention, governance, knowledge-base]

title:
  en: Prevention plans, for people who do not have cancer yet
  uk: Плани профілактики — для тих, хто ще не має раку

summary:
  en: >-
    The charter was amended to cover people at elevated risk but without a
    diagnosis. The engine now produces a Prevention Plan alongside the
    Treatment Plan, and the first pilots are live on the site.
  uk: >-
    Статут доповнено, щоб охопити людей із підвищеним ризиком, але без
    діагнозу. Engine тепер будує План профілактики поряд із Планом лікування, а
    перші пілоти вже доступні на сайті.

body:
  en:
    - type: p
      text: >-
        Until now the engine had exactly one answer for a patient with no
        confirmed disease: "could not resolve disease." That is correct and
        useless. A person with chronic hepatitis C, or a confirmed Lynch
        syndrome carrier, has a real and actionable cancer risk long before
        there is anything to stage.
    - type: p
      text: >-
        CHARTER §3 is now amended to cover them — specifically, HCP-mediated
        prevention and early-diagnosis recommendations for at-risk asymptomatic
        individuals: first-degree relatives, IARC Group 1 chronic infections,
        and occupational exposures.
    - type: h2
      text: How it works
    - type: p
      text: >-
        A profile with no confirmed disease but at least one fired
        prevention-eligible red flag now routes to Prevention Plan generation
        instead of that dead-end warning. Same engine, same knowledge base,
        same citation requirements.
    - type: p
      text: >-
        Every prevention pathway ships at least two tracks — the intervention,
        and an observation track for declining it. That is not a stylistic
        choice: presenting a single binding directive would break the
        non-device positioning in CHARTER §15.2 C4.
    - type: h2
      text: What is live
    - type: p
      text: >-
        32 prevention case pages, covering all seven IARC Group 1 infectious
        etiologies (HCV, H. pylori, HBV, HPV, HIV, EBV, HTLV-1), hereditary
        carrier pilots, and occupational, chronic-condition and iatrogenic
        exposures. They are in the gallery and the plan-builder dropdown.
    - type: h2
      text: What was deliberately left out
    - type: p
      text: >-
        Path B — prevention advice direct to a patient, with no clinician in
        the loop — is parked, because it would trigger re-classification as a
        medical device under §15.3.
    - type: p
      text: >-
        The scope document says plainly that this is a narrowing to fit the
        current charter rather than the intended endpoint. Worth recording
        while it is still inconvenient to admit.
  uk:
    - type: p
      text: >-
        Досі engine мав рівно одну відповідь для пацієнта без підтвердженої
        хвороби: «не вдалося визначити захворювання». Це правильно й
        безкорисно. Людина з хронічним гепатитом C або підтверджений носій
        синдрому Лінча має реальний і керований ризик раку задовго до того, як
        зʼявиться щось, що можна стадіювати.
    - type: p
      text: >-
        Тепер CHARTER §3 доповнено, щоб охопити їх — а саме рекомендаціями з
        профілактики та ранньої діагностики, опосередкованими лікарем, для
        асимптомних осіб із групи ризику: родичів першого ступеня, хронічних
        інфекцій групи 1 за IARC та професійних експозицій.
    - type: h2
      text: Як це працює
    - type: p
      text: >-
        Профіль без підтвердженої хвороби, але щонайменше з одним спрацьованим
        red flag, придатним для профілактики, тепер маршрутизується до
        генерації Плану профілактики замість тієї тупикової відповіді. Той
        самий engine, та сама база знань, ті самі вимоги до цитувань.
    - type: p
      text: >-
        Кожен профілактичний маршрут має щонайменше два треки — втручання та
        трек спостереження на випадок відмови від нього. Це не питання стилю:
        подання єдиної обовʼязкової директиви зруйнувало б позиціювання
        «не медичний пристрій» за CHARTER §15.2 C4.
    - type: h2
      text: Що вже доступно
    - type: p
      text: >-
        32 сторінки профілактичних кейсів, що охоплюють усі сім інфекційних
        етіологій групи 1 за IARC (HCV, H. pylori, HBV, HPV, HIV, EBV, HTLV-1),
        пілоти зі спадковими носійствами, а також професійні, повʼязані з
        хронічними станами та ятрогенні експозиції. Вони є в галереї та у
        випадному списку конструктора планів.
    - type: h2
      text: Що свідомо лишили поза межами
    - type: p
      text: >-
        Шлях B — поради з профілактики напряму пацієнтові, без лікаря в
        ланцюжку — відкладено, бо це запустило б перекваліфікацію в медичний
        пристрій за §15.3.
    - type: p
      text: >-
        Документ про межі прямо каже, що це звуження задля відповідності
        чинному статуту, а не бажана кінцева точка. Це варто зафіксувати, поки
        визнавати таке ще незручно.
