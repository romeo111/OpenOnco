title:
  en: Five views of what OpenOnco can do
  uk: П’ять способів побачити можливості OpenOnco
summary:
  en: The capabilities page gained five compact views of the platform, its pipeline and its limits.
  uk: Сторінка можливостей отримала п’ять стислих оглядів платформи, її роботи та обмежень.
body:
  en:
  - type: p
    text: The capabilities page gained five compact views of the platform, its pipeline and its limits.
  - type: p
    text: Visitors can move from a broad overview to specific parts without reading one long wall
      of text. The page describes software scope; it does not certify clinical accuracy.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/81cab412db) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Сторінка можливостей отримала п’ять стислих оглядів платформи, її роботи та обмежень.
  - type: p
    text: Від загального огляду можна перейти до конкретної частини без суцільного довгого тексту.
      Сторінка описує можливості програми, а не підтверджує клінічну точність.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/81cab412db).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
