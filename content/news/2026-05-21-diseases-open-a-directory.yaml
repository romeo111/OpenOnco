title:
  en: The disease count became a doorway
  uk: Лічильник захворювань став входом до каталогу
summary:
  en: The disease number on the home page now opens the disease directory instead of ending the journey.
  uk: Кількість захворювань на головній тепер веде до каталогу, а не завершує шлях читача.
body:
  en:
  - type: p
    text: The disease number on the home page now opens the disease directory instead of ending the
      journey.
  - type: p
    text: A count is useful only if readers can inspect the records behind it. The directory makes
      that next step visible; the number itself says nothing about review readiness.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/3e56efa785) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Кількість захворювань на головній тепер веде до каталогу, а не завершує шлях читача.
  - type: p
    text: Число корисне, коли можна переглянути записи за ним. Каталог відкриває такий шлях; сама
      кількість нічого не говорить про готовність до клінічного використання.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/3e56efa785).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
