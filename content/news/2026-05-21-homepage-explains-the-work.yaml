title:
  en: The home page explains the work
  uk: Головна сторінка пояснює роботу
summary:
  en: A home-page rewrite put the intended workflow and its limits ahead of a feature list.
  uk: Оновлена головна сторінка ставить спосіб використання та його межі перед списком функцій.
body:
  en:
  - type: p
    text: A home-page rewrite put the intended workflow and its limits ahead of a feature list.
  - type: p
    text: It frames OpenOnco as a source-linked drafting aid for a clinician, with attention to checking
      missed details. A polished landing page is not evidence that every pathway has clinical sign-off.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/392cd01595) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Оновлена головна сторінка ставить спосіб використання та його межі перед списком функцій.
  - type: p
    text: OpenOnco показано як інструмент підготовки чернетки з джерелами для лікаря, з увагою до
      пропущених деталей. Гарна сторінка не означає клінічного погодження кожного маршруту.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/392cd01595).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
