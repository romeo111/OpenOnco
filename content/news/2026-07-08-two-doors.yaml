slug: two-doors
date: 2026-07-08
published: 2026-07-19
author: OpenOnco
tags: [site, governance, patients]

title:
  en: Two doors — and why patients get a different one
  uk: Двоє дверей — і чому пацієнти заходять в інші

summary:
  en: >-
    The homepage now routes clinicians and patients to different places.
    Patients get help understanding a plan and preparing questions, not
    treatment recommendations — a line that has to hold for both safety and
    regulatory reasons.
  uk: >-
    Головна сторінка тепер веде лікарів і пацієнтів у різні місця. Пацієнти
    отримують допомогу в розумінні плану й підготовці запитань, а не
    рекомендації щодо лікування — ця межа має триматися і з міркувань безпеки, і
    з регуляторних.

body:
  en:
    - type: p
      text: >-
        Patients were already arriving. A site about cancer treatment, indexed
        and public, gets read by people who have cancer — not only by the
        oncologists it was written for. Pretending otherwise is not a safety
        measure; it just means those readers get a page designed for someone
        else.
    - type: p
      text: >-
        So the homepage now asks who you are and routes accordingly. Clinicians
        go to the plan builder and the knowledge base. Patients go to a
        free-text tumour board where they can describe a situation in ordinary
        language.
    - type: h2
      text: The line that has to hold
    - type: p
      text: >-
        What patients get is help understanding a plan and preparing questions
        for their own oncologist. Not verdicts. Not treatment recommendations.
    - type: callout
      tone: warn
      text: >-
        This is not a cosmetic distinction. A direct-to-patient clinical
        service would re-classify this software as a medical device under
        CHARTER §15.3 — with everything that implies. The education and
        question-preparation framing is what keeps it on the right side of that
        line.
    - type: p
      text: >-
        Being straight about the state of the paperwork: the charter's own §2
        and §15 C1 text still says "HCP-only" in places. That text has not
        caught up with what the site now does, and reconciling it is open work
        rather than something already handled.
    - type: h2
      text: Language now follows the reader
    - type: p
      text: >-
        Shipped the same day: the site picks a language by IP. English is the
        default everywhere; only a Ukrainian IP flips to the `/ukr/` twin, and
        any failed lookup falls back to English. An explicit click on the
        language switch is remembered and always wins over detection.
    - type: p
      text: >-
        Crawlers are exempt so both language trees stay indexable, and the
        script never fires inside an embedded frame. The privacy disclosure for
        the IP lookup is on the specs page.
  uk:
    - type: p
      text: >-
        Пацієнти вже приходили. Публічний проіндексований сайт про лікування
        раку читають люди, які на рак хворіють, — а не лише онкологи, для яких
        його писали. Вдавати протилежне — не захід безпеки; це просто означає,
        що ці читачі потрапляють на сторінку, зроблену не для них.
    - type: p
      text: >-
        Тож головна сторінка тепер питає, хто ви, і скеровує відповідно. Лікарі
        йдуть до конструктора планів і бази знань. Пацієнти — до вільнотекстового
        туморборду, де ситуацію можна описати звичайною мовою.
    - type: h2
      text: Межа, яка має триматися
    - type: p
      text: >-
        Пацієнти отримують допомогу в розумінні плану й підготовці запитань до
        власного онколога. Не вироки. Не рекомендації щодо лікування.
    - type: callout
      tone: warn
      text: >-
        Це не косметична різниця. Клінічний сервіс напряму для пацієнта
        перекваліфікував би це програмне забезпечення в медичний пристрій за
        CHARTER §15.3 — з усіма наслідками. Саме рамка «освіта й підготовка
        запитань» утримує проєкт по правильний бік цієї межі.
    - type: p
      text: >-
        Чесно про стан документів: у тексті самого статуту §2 та §15 C1 місцями
        досі написано «лише для медичних працівників». Цей текст не наздогнав
        того, що сайт робить зараз, і його узгодження — відкрита робота, а не
        щось уже владнане.
    - type: h2
      text: Мова тепер підлаштовується під читача
    - type: p
      text: >-
        Того ж дня запрацював вибір мови за IP. Англійська — типова всюди; лише
        українська IP-адреса перемикає на дзеркало `/ukr/`, а будь-яка невдала
        перевірка повертає англійську. Явний клік на перемикачі мови
        запамʼятовується і завжди має перевагу над визначенням.
    - type: p
      text: >-
        Пошукові роботи виключені, щоб обидві мовні гілки лишалися
        індексованими, а сам скрипт ніколи не спрацьовує всередині вбудованого
        фрейму. Повідомлення про приватність щодо IP-перевірки є на сторінці
        специфікацій.
