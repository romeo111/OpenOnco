title:
  en: Some prose conditions became checkable
  uk: Частину текстових умов зроблено перевірюваними
summary:
  en: Existing algorithm conditions were connected to structured findings and red flags where matching
    fields existed.
  uk: Наявні умови алгоритмів пов’язано зі структурованими знахідками та попередженнями там, де були
    відповідні поля.
body:
  en:
  - type: p
    text: Existing algorithm conditions were connected to structured findings and red flags where
      matching fields existed.
  - type: p
    text: That lets tests inspect part of the routing logic instead of relying on prose alone. It
      does not imply that every narrative condition is now encoded or clinically approved.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/e21a0fefcf) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Наявні умови алгоритмів пов’язано зі структурованими знахідками та попередженнями там,
      де були відповідні поля.
  - type: p
    text: Так тести можуть перевіряти частину маршрутизації, а не покладатися лише на текст. Це не
      означає, що всі словесні умови вже формалізовано чи клінічно погоджено.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/e21a0fefcf).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
