title:
  en: Find an example before filling a form
  uk: Знайдіть приклад перед заповненням форми
summary:
  en: A searchable picker made verified treatment examples easier to locate in the Plan Builder.
  uk: Пошук прикладів полегшив вибір перевіреного демонстраційного сценарію в Конструкторі плану.
body:
  en:
  - type: p
    text: A searchable picker made verified treatment examples easier to locate in the Plan Builder.
  - type: p
    text: The examples demonstrate input shapes and generated output. They are reference cases for
      testing the software, not ready-made plans for a real person.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/10b665db17) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Пошук прикладів полегшив вибір перевіреного демонстраційного сценарію в Конструкторі плану.
  - type: p
    text: Приклади показують формат вхідних даних і результату. Це контрольні сценарії для перевірки
      програми, а не готові плани для конкретної людини.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/10b665db17).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
