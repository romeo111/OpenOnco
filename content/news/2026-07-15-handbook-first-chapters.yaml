body:
  en:
  - type: p
    text: The first Handbook release added five chapters, search, a quiz and a reviewer workflow.
  - type: p
    text: Readers can learn how the project is organised before opening a clinical draft. The reviewer
      workflow records feedback; a chapter being online is not a clinical endorsement.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/32413c4816) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Перший випуск Посібника додав п’ять розділів, пошук, перевірочні запитання та процес рецензування.
  - type: p
    text: Читач може зрозуміти будову проєкту до відкриття клінічної чернетки. Процес рецензування
      фіксує відгуки; опублікований розділ не є клінічним схваленням.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/32413c4816).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
