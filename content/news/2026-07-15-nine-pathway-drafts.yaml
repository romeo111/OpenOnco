title:
  en: Nine gaps received draft pathways
  uk: Для дев’яти прогалин з’явилися чернетки маршрутів
summary:
  en: Nine adult disease areas with little first-line coverage received authored draft pathways.
  uk: Для дев’яти напрямів лікування дорослих із недостатнім охопленням створено чернетки маршрутів
    першої лінії.
body:
  en:
  - type: p
    text: Nine adult disease areas with little first-line coverage received authored draft pathways.
  - type: p
    text: The change widened draft coverage and made missing paths visible to testing. It did not
      make those pathways clinically signed off; review status must be checked on each page.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/97ee273a91) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Для дев’яти напрямів лікування дорослих із недостатнім охопленням створено чернетки маршрутів
      першої лінії.
  - type: p
    text: Зміна розширила охоплення чернетками й дала змогу перевіряти відсутні маршрути. Вона не
      надала їм клінічного погодження; статус треба дивитися на кожній сторінці.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/97ee273a91).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
