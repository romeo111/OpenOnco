body:
  en:
  - type: p
    text: Curated examples gained patient-view companions alongside their professional versions.
  - type: p
    text: The paired pages let a reader compare technical and plain-language presentation of the
      same fictional scenario. They do not turn a sample case into personal advice.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/62c51a5392) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: До відібраних прикладів додано зрозуміліші пацієнтські версії поряд із фаховими.
  - type: p
    text: Парні сторінки допомагають порівняти фаховий і простіший виклад одного вигаданого сценарію.
      Вони не перетворюють приклад на персональну пораду.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/62c51a5392).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
