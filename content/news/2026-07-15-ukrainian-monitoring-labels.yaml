title:
  en: Monitoring speaks more Ukrainian
  uk: Моніторинг отримав більше українських назв
summary:
  en: Ukrainian report output gained monitoring-phase labels and checkpoint wording.
  uk: Український звіт отримав назви етапів моніторингу й контрольних точок.
body:
  en:
  - type: p
    text: Ukrainian report output gained monitoring-phase labels and checkpoint wording.
  - type: p
    text: Clearer labels make a draft easier to read without changing the underlying monitoring rules.
      As with other translated clinical content, wording still needs review in context.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/692a81f3fe) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Український звіт отримав назви етапів моніторингу й контрольних точок.
  - type: p
    text: Зрозуміліші підписи полегшують читання чернетки й не змінюють самих правил моніторингу.
      Як і інші клінічні переклади, формулювання потребують контекстної перевірки.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/692a81f3fe).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
