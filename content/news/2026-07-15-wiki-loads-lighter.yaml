title:
  en: A smaller doorway into the Wiki
  uk: Легший вхід до Вікі
summary:
  en: A site change reduced the main Wiki page from about 2 MB to about 18 KB and deferred font loading.
  uk: Оновлення сайту зменшило головну сторінку Вікі приблизно з 2 МБ до 18 КБ і відклало завантаження
    шрифтів.
body:
  en:
  - type: p
    text: A site change reduced the main Wiki page from about 2 MB to about 18 KB and deferred font
      loading.
  - type: p
    text: The lighter entry page matters on slower connections and phones. The size change concerns
      the landing page, not the total knowledge-base download or evidence quality.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/73c5a575ca) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Оновлення сайту зменшило головну сторінку Вікі приблизно з 2 МБ до 18 КБ і відклало завантаження
      шрифтів.
  - type: p
    text: Легша стартова сторінка важлива для повільного зв’язку й телефонів. Зміна розміру стосується
      входу до Вікі, а не всієї бази знань чи якості доказів.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/73c5a575ca).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
