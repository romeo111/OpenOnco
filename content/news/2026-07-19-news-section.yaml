slug: news-and-comments
date: 2026-07-19
author: OpenOnco
tags: [site, community]

title:
  en: This section is new, and it is open for comment
  uk: Цей розділ новий, і він відкритий для коментарів

summary:
  en: >-
    Release notes and governance decisions now have a home on the site instead of
    living only in commit messages. Every post takes comments — with a few rules
    that a cancer-information site genuinely needs.
  uk: >-
    Нотатки до релізів і рішення governance тепер мають місце на сайті, а не
    живуть лише в повідомленнях комітів. Кожен допис приймає коментарі — з
    кількома правилами, які справді потрібні сайту про онкологію.

body:
  en:
    - type: p
      text: >-
        Until now, everything about how OpenOnco changes lived in commit messages,
        review documents and specs. That is fine for contributors reading the
        repository and useless for a clinician who wants to know what moved this
        month. This section is the fix.
    - type: p
      text: >-
        Posts are written in both English and Ukrainian, and they are checked into
        the repository as structured YAML under `content/news/`. They are built by
        the same pipeline as the rest of the site, so a post is reviewable as a
        diff like everything else here.
    - type: h2
      text: One request
    - type: p
      text: >-
        Comment threads are public and indexed by search engines, so please keep
        your own medical details out of them — a diagnosis or a set of test
        results is not something you can really take back once it is on a public
        page.
    - type: p
      text: >-
        And if you have found something clinically wrong in the knowledge base, a
        comment is not the fastest route. Open an issue tagged `clinical-error`
        instead: per CHARTER §9.1 that path has a triage SLA of 48 hours, and it
        leaves a public record of the fix.
    - type: h2
      text: How comments work
    - type: p
      text: >-
        You do not need an account. Type a name and a comment and post it — no
        sign-up, no login, no GitHub. The comment box runs on infrastructure the
        project controls, so there is no third-party advertising and no tracking
        network attached to it.
    - type: p
      text: >-
        Each article has one comment thread shared between its English and
        Ukrainian versions, so a discussion does not get split in half by which
        language you happened to be reading in.
  uk:
    - type: p
      text: >-
        Досі все про те, як змінюється OpenOnco, жило в повідомленнях комітів,
        оглядових документах і специфікаціях. Це нормально для контрибʼюторів, які
        читають репозиторій, і марно для лікаря, який хоче знати, що змінилося цього
        місяця. Цей розділ це виправляє.
    - type: p
      text: >-
        Дописи пишуться англійською та українською й зберігаються в репозиторії як
        структурований YAML у `content/news/`. Вони збираються тим самим пайплайном,
        що й решта сайту, тож допис можна переглянути як diff, як і все інше тут.
    - type: h2
      text: Одне прохання
    - type: p
      text: >-
        Гілки коментарів публічні й індексуються пошуковими системами, тож, будь
        ласка, не пишіть у них власні медичні дані — діагноз чи результати аналізів
        уже майже неможливо відкликати, коли вони опинилися на публічній сторінці.
    - type: p
      text: >-
        А якщо ви знайшли клінічно неправильну інформацію в базі знань, коментар —
        не найшвидший шлях. Натомість відкрийте issue з міткою `clinical-error`:
        згідно з CHARTER §9.1 для цього шляху діє SLA 48 годин на тріаж, і він
        залишає публічний слід про виправлення.
    - type: h2
      text: Як працюють коментарі
    - type: p
      text: >-
        Акаунт не потрібен. Введіть імʼя та коментар і надішліть — без реєстрації,
        без входу, без GitHub. Форма коментарів працює на інфраструктурі, яку
        контролює проєкт, тож тут немає ані сторонньої реклами, ані трекінгових
        мереж.
    - type: p
      text: >-
        У кожної статті одна спільна гілка коментарів для англійської та
        української версій — обговорення не ділиться навпіл залежно від того, якою
        мовою ви читали.
