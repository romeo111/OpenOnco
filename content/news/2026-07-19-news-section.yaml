slug: news-and-comments
date: 2026-07-19
author: OpenOnco
tags: [site, community]

title:
  en: This section is new, and it is open for comment
  uk: Цей розділ новий, і він відкритий для коментарів

summary:
  en: >-
    Release notes and governance decisions now have a home on the site instead of
    living only in commit messages. Every post takes comments — with a few rules
    that a cancer-information site genuinely needs.
  uk: >-
    Нотатки до релізів і рішення governance тепер мають місце на сайті, а не
    живуть лише в повідомленнях комітів. Кожен допис приймає коментарі — з
    кількома правилами, які справді потрібні сайту про онкологію.

body:
  en:
    - type: p
      text: >-
        Until now, everything about how OpenOnco changes lived in commit messages,
        review documents and specs. That is fine for contributors reading the
        repository and useless for a clinician who wants to know what moved this
        month. This section is the fix.
    - type: p
      text: >-
        Posts are written in both English and Ukrainian, and they are checked into
        the repository as structured YAML under `content/news/`. They are built by
        the same pipeline as the rest of the site, so a post is reviewable as a
        diff like everything else here.
    - type: h2
      text: Why comments have rules
    - type: p
      text: >-
        Open comments on a site about cancer treatment carry two risks that a
        comment box on a normal software project does not, so it is worth being
        direct about both.
    - type: p
      text: >-
        The first is that people post their own medical details. A comment thread
        is public, permanent and indexed by search engines. Please do not put a
        diagnosis, test results, dates, or anything identifying you or a patient
        into a comment — a public page is the wrong place for it, and once it is
        indexed it is not really retractable.
    - type: p
      text: >-
        The second is that comments can read as advice. They are not. Comments are
        readers' opinions; they are not reviewed by the clinical leads, and they
        carry none of the source-citation guarantees that the knowledge base does.
        Nothing on this site replaces your treating oncologist.
    - type: callout
      tone: warn
      text: >-
        Nobody monitors comments for urgent problems. In a clinical emergency,
        contact your treating team or emergency services — not a web page.
    - type: h2
      text: Where to report a clinical error
    - type: p
      text: >-
        If you have found something clinically wrong in the knowledge base, a
        comment is not the fastest route. Open an issue tagged `clinical-error`
        instead: per CHARTER §9.1 that path has a triage SLA of 48 hours and an
        assessment SLA of 7 days, and it produces a public record of the fix.
    - type: h2
      text: How comments work technically
    - type: p
      text: >-
        Comments are hosted on GitHub Discussions through
        [giscus](https://giscus.app/), so the project stores no commenter data of
        its own and there is no third-party advertising or tracking involved.
      # A deliberate consequence: commenting needs a GitHub account.
    - type: p
      text: >-
        The widget is not loaded until you press the button. Simply reading a post
        sends no request to giscus or GitHub — which matters more than usual when
        the page someone is quietly reading is about their diagnosis.
  uk:
    - type: p
      text: >-
        Досі все про те, як змінюється OpenOnco, жило в повідомленнях комітів,
        оглядових документах і специфікаціях. Це нормально для контрибʼюторів, які
        читають репозиторій, і марно для лікаря, який хоче знати, що змінилося цього
        місяця. Цей розділ це виправляє.
    - type: p
      text: >-
        Дописи пишуться англійською та українською й зберігаються в репозиторії як
        структурований YAML у `content/news/`. Вони збираються тим самим пайплайном,
        що й решта сайту, тож допис можна переглянути як diff, як і все інше тут.
    - type: h2
      text: Чому в коментарів є правила
    - type: p
      text: >-
        Відкриті коментарі на сайті про лікування онкології несуть два ризики, яких
        немає у звичайного програмного проєкту, тож про обидва варто сказати прямо.
    - type: p
      text: >-
        Перший — люди публікують власні медичні дані. Гілка коментарів публічна,
        постійна та індексується пошуковими системами. Будь ласка, не пишіть у
        коментарях діагноз, результати аналізів, дати чи будь-що, що ідентифікує вас
        або пацієнта: публічна сторінка — неправильне місце для цього, а після
        індексації це вже майже неможливо відкликати.
    - type: p
      text: >-
        Другий — коментарі можуть сприйматися як порада. Це не порада. Коментарі —
        думки читачів; вони не перевіряються клінічними лідами й не мають жодних
        гарантій цитування джерел, які має база знань. Ніщо на цьому сайті не
        замінює вашого лікуючого онколога.
    - type: callout
      tone: warn
      text: >-
        Ніхто не відстежує коментарі на предмет термінових проблем. У невідкладній
        ситуації звертайтеся до лікуючої команди або екстреної допомоги, а не до
        вебсторінки.
    - type: h2
      text: Куди повідомляти про клінічну помилку
    - type: p
      text: >-
        Якщо ви знайшли клінічно неправильну інформацію в базі знань, коментар — не
        найшвидший шлях. Натомість відкрийте issue з міткою `clinical-error`: згідно
        з CHARTER §9.1 для цього шляху діє SLA 48 годин на тріаж і 7 днів на оцінку,
        і він залишає публічний слід про виправлення.
    - type: h2
      text: Як коментарі влаштовані технічно
    - type: p
      text: >-
        Коментарі розміщені в GitHub Discussions через
        [giscus](https://giscus.app/), тож проєкт не зберігає власних даних
        коментаторів, і тут немає жодної сторонньої реклами чи трекінгу.
    - type: p
      text: >-
        Віджет не завантажується, доки ви не натиснете кнопку. Просте читання допису
        не надсилає жодного запиту до giscus чи GitHub — а це важливіше, ніж
        зазвичай, коли сторінка, яку хтось тихо читає, стосується його діагнозу.
