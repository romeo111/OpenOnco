slug: what-nccn-2a-actually-means
date: 2026-07-20
kind: explainer
author: OpenOnco
tags: [guidelines, evidence]

sources:
  - citation: >-
      Desai AP, Go RS, Poonacha TK. Category of evidence and consensus
      underlying National Comprehensive Cancer Network guidelines: Is there
      evidence of progress? International Journal of Cancer, 2021;148(2):429-436
    id: "32674225"
  - citation: >-
      Poonacha TK, Go RS. Level of scientific evidence underlying
      recommendations arising from the National Comprehensive Cancer Network
      clinical practice guidelines. Journal of Clinical Oncology,
      2011;29(2):186-191
    id: "21149653"
  - citation: >-
      National Comprehensive Cancer Network. NCCN Categories of Evidence and
      Consensus
    id: https://www.nccn.org/guidelines/category_1

title:
  en: What NCCN category 2A actually means
  uk: Що насправді означає категорія 2A у NCCN

summary:
  en: >-
    2A is widely read as "weak evidence, weak recommendation." It is not. The
    panel agreement behind 2A is the same as behind category 1 — and 2A is what
    you get by default when no category is printed at all.
  uk: >-
    2A часто читають як «слабкі докази, слабка рекомендація». Це не так.
    Узгодженість панелі за 2A така сама, як за категорією 1, — а ще 2A діє за
    замовчуванням, коли категорію взагалі не вказано.

body:
  en:
    - type: p
      text: >-
        NCCN grades each recommendation on a scale that combines two separate
        things: how strong the underlying evidence is, and how much the panel
        agreed. Reading the label as a single measure of confidence is where
        the misunderstanding starts.
    - type: h2
      text: The part people get wrong
    - type: p
      text: >-
        Category 1 and category 2A require **the same level of panel
        agreement** — NCCN's "uniform consensus," defined as at least 85%
        support. They differ only in the evidence beneath them: category 1
        rests on high-level evidence such as randomised phase 3 trials, 2A on
        lower-level evidence.
    - type: p
      text: >-
        So 2A does not mean the panel was lukewarm. It means the panel was just
        as united, on a thinner evidence base.
    - type: p
      text: >-
        The categories that do encode disagreement are further down: 2B is
        lower-level evidence with only 50–85% panel support, and category 3
        means real dispute, with at least a quarter of the panel objecting.
    - type: h2
      text: 2A is also the default
    - type: p
      text: >-
        Every NCCN guideline carries a standing line: *all recommendations are
        category 2A unless otherwise indicated*. A recommendation with no
        visible category is not unclassified — it is 2A.
    - type: h2
      text: How much of the guidelines this covers
    - type: p
      text: >-
        An independent academic analysis — not an NCCN publication — reviewed
        the 2019 guidelines for the ten most common cancers in the United
        States and counted 1,818 staging, treatment and surveillance
        recommendations. Of those, 7% were category 1, **87% were 2A**, 6% were
        2B, and none were category 3.
    - type: p
      text: >-
        The same authors had counted 1,023 recommendations in 2010 and found
        essentially the same distribution. The guidelines grew by 77% over the
        decade; the proportion resting on high-level evidence barely moved.
    - type: callout
      tone: info
      text: >-
        Two caveats on that number. It covers roughly ten of NCCN's eighty-plus
        guidelines and excludes screening and supportive care, so it is not a
        figure for NCCN as a whole. And it is a count of recommendations, which
        says nothing about how often each one is actually used.
    - type: h2
      text: Why this matters for reading a plan
    - type: p
      text: >-
        Most of oncology practice runs on expert consensus rather than phase 3
        trials, and the guidelines say so openly if you read the categories
        correctly. That is not a scandal — much of medicine could never be
        randomised — but it does change what "guideline-recommended" is
        evidence of.
    - type: p
      text: >-
        OpenOnco surfaces the category alongside each cited recommendation for
        this reason. A clinician should be able to see whether they are looking
        at a randomised result or a room full of experts who agreed.
  uk:
    - type: p
      text: >-
        NCCN оцінює кожну рекомендацію за шкалою, що поєднує дві різні речі:
        наскільки сильні докази під нею і наскільки панель була згодна. Помилка
        починається там, де мітку читають як один показник впевненості.
    - type: h2
      text: Те, що розуміють неправильно
    - type: p
      text: >-
        Категорія 1 і категорія 2A вимагають **однакового рівня згоди панелі** —
        це «одностайний консенсус» NCCN, тобто щонайменше 85% підтримки.
        Різниця лише в доказах під ними: категорія 1 спирається на докази
        високого рівня, як-от рандомізовані дослідження третьої фази, а 2A — на
        докази нижчого рівня.
    - type: p
      text: >-
        Тобто 2A не означає, що панель вагалася. Означає, що вона була так само
        одностайна, але на тоншій доказовій базі.
    - type: p
      text: >-
        Незгоду кодують категорії нижче: 2B — це докази нижчого рівня лише з
        50–85% підтримки панелі, а категорія 3 означає справжню суперечку, коли
        заперечує щонайменше чверть панелі.
    - type: h2
      text: 2A ще й діє за замовчуванням
    - type: p
      text: >-
        У кожній настанові NCCN є постійний рядок: *усі рекомендації належать до
        категорії 2A, якщо не зазначено інше*. Рекомендація без видимої
        категорії не є некласифікованою — вона 2A.
    - type: h2
      text: Яку частину настанов це охоплює
    - type: p
      text: >-
        Незалежний академічний аналіз — не публікація NCCN — переглянув настанови
        2019 року для десяти найпоширеніших видів раку в США й нарахував 1 818
        рекомендацій щодо стадіювання, лікування та спостереження. З них 7%
        належали до категорії 1, **87% — до 2A**, 6% — до 2B, і жодна — до
        категорії 3.
    - type: p
      text: >-
        Ті самі автори нарахували 1 023 рекомендації у 2010 році й отримали
        практично той самий розподіл. За десятиліття настанови зросли на 77%, а
        частка тих, що спираються на докази високого рівня, майже не змінилася.
    - type: callout
      tone: info
      text: >-
        Два застереження до цього числа. Воно охоплює приблизно десять із
        понад вісімдесяти настанов NCCN і не включає скринінг та підтримувальну
        терапію, тож це не показник для NCCN загалом. І це підрахунок
        рекомендацій, який нічого не каже про те, як часто кожну з них реально
        застосовують.
    - type: h2
      text: Чому це важливо під час читання плану
    - type: p
      text: >-
        Більша частина онкологічної практики тримається на експертному
        консенсусі, а не на дослідженнях третьої фази, — і настанови кажуть про
        це відкрито, якщо правильно читати категорії. Це не скандал: багато що в
        медицині неможливо рандомізувати. Але це змінює те, доказом чого є фраза
        «рекомендовано настановами».
    - type: p
      text: >-
        Саме тому OpenOnco показує категорію поруч із кожною цитованою
        рекомендацією. Лікар має бачити, перед ним рандомізований результат чи
        кімната експертів, які дійшли згоди.
