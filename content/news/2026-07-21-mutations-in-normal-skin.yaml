slug: cancer-mutations-in-normal-skin
date: 2026-07-21
kind: explainer
author: OpenOnco
tags: [biology, biomarkers]

sources:
  - citation: >-
      Martincorena I, Roshan A, Gerstung M, et al. High burden of somatic
      mutations in normal human skin. Science, 2015;348(6237):880-886
    id: "25999502"
  - citation: >-
      Martincorena I, Jones PH, Campbell PJ. Constrained positive selection on
      cancer mutations in normal skin. PNAS, 2016;113(9):E1128-E1129
    id: "26884187"
  - citation: >-
      Fowler JC, King C, Bryant C, et al. Selection of Oncogenic Mutant Clones
      in Normal Human Skin Varies with Body Site. Cancer Discovery,
      2021;11(2):340-361
    id: "33087317"

title:
  en: Normal skin is already full of "cancer" mutations
  uk: Здорова шкіра вже повна «ракових» мутацій

summary:
  en: >-
    Sequencing physiologically normal eyelid skin found driver mutations — the
    same ones found in tumours — in roughly a quarter of cells, at about 140
    per square centimetre. The skin was working fine. A driver mutation alone
    does not make cancer.
  uk: >-
    Секвенування фізіологічно нормальної шкіри повік виявило драйверні мутації —
    ті самі, що й у пухлинах, — приблизно у чверті клітин, близько 140 на
    квадратний сантиметр. Шкіра працювала нормально. Сама лише драйверна
    мутація ще не робить рак.

body:
  en:
    - type: p
      text: >-
        In 2015 a group sequenced 74 cancer genes to very high depth across 234
        tiny biopsies of normal eyelid skin — about 5 cm² in total, from four
        adults aged 55 to 73 having blepharoplasty. The tissue was
        histologically and physiologically normal. The question was what a
        lifetime of sunlight had already written into it.
    - type: h2
      text: What they found
    - type: ul
      items:
        - >-
          Positively selected driver mutations — in `NOTCH1`, `NOTCH2`,
          `NOTCH3`, `TP53`, `FAT1` and `RBM10` — present in an estimated
          **18–32% of cells**. The authors' own summary is "over a quarter."
        - "Roughly **140 driver mutations per square centimetre** of skin."
        - >-
          An overall burden of 2–6 mutations per megabase per cell, carrying a
          clear ultraviolet signature.
        - >-
          On average 0.27 driver point mutations per cell — against 2.7 per
          cell in a cutaneous squamous cell carcinoma, roughly tenfold higher.
    - type: p
      text: >-
        The epidermis kept working normally throughout. Whole fields of skin
        were carrying mutations that, found in a tumour, would be reported as
        drivers.
    - type: h2
      text: What this does and does not mean
    - type: p
      text: >-
        It does not mean these mutations are harmless, and it does not mean
        the tissue is pre-cancerous in any clinically actionable sense. What it
        establishes is narrower and more useful: **finding a driver mutation in
        a sample is not by itself evidence of cancer.** Context — how many, in
        what combination, in what tissue architecture — is doing most of the
        work.
    - type: callout
      tone: warn
      text: >-
        Read the numbers as a floor, not a census. Only 74 genes were
        sequenced, so anything outside that panel went uncounted. And the
        donors were older adults sampled at chronically sun-exposed skin — a
        later study found mutant clone density varies substantially by body
        site, so this describes aged photodamaged eyelid, not skin in general.
    - type: h2
      text: Why a decision-support project cares
    - type: p
      text: >-
        Because "a driver mutation was found" is a sentence that arrives in
        clinical reports and gets read as more than it is. A knowledge base
        that maps biomarkers to treatment has to encode which findings are
        actionable in which disease context, rather than treating any hit in a
        cancer gene as meaningful on its own.
  uk:
    - type: p
      text: >-
        У 2015 році група дослідників глибоко просеквенувала 74 онкологічні гени
        у 234 крихітних біоптатах нормальної шкіри повік — загалом близько 5 см²,
        від чотирьох дорослих віком 55–73 роки, яким робили блефаропластику.
        Тканина була гістологічно та фізіологічно нормальною. Питання полягало в
        тому, що встигло вписати в неї життя під сонцем.
    - type: h2
      text: Що знайшли
    - type: ul
      items:
        - >-
          Драйверні мутації під позитивним добором — у `NOTCH1`, `NOTCH2`,
          `NOTCH3`, `TP53`, `FAT1` і `RBM10` — приблизно у **18–32% клітин**.
          Власне формулювання авторів — «понад чверть».
        - "Близько **140 драйверних мутацій на квадратний сантиметр** шкіри."
        - >-
          Загальне навантаження 2–6 мутацій на мегабазу на клітину з виразною
          ультрафіолетовою сигнатурою.
        - >-
          У середньому 0,27 драйверної точкової мутації на клітину — проти 2,7 у
          плоскоклітинному раку шкіри, тобто приблизно вдесятеро більше.
    - type: p
      text: >-
        Епідерміс при цьому працював нормально. Цілі поля шкіри несли мутації,
        які, знайдені в пухлині, описали б як драйверні.
    - type: h2
      text: Що це означає, а що ні
    - type: p
      text: >-
        Це не означає, що такі мутації нешкідливі, і не означає, що тканина є
        передраковою в клінічно значущому сенсі. Установлено вужче й корисніше:
        **знахідка драйверної мутації сама по собі не є доказом раку.** Основну
        роботу виконує контекст — скільки їх, у якому поєднанні, за якої
        архітектури тканини.
    - type: callout
      tone: warn
      text: >-
        Читайте ці числа як нижню межу, а не як перепис. Просеквенували лише 74
        гени, тож усе поза цією панеллю не враховано. А донорами були літні люди
        з хронічно засмаглої ділянки — пізніше дослідження показало, що щільність
        мутантних клонів помітно різниться залежно від ділянки тіла. Тож ідеться
        про постарілу фотопошкоджену шкіру повік, а не про шкіру загалом.
    - type: h2
      text: Чому це важливо для системи підтримки рішень
    - type: p
      text: >-
        Бо фраза «виявлено драйверну мутацію» потрапляє в клінічні висновки — і
        її читають як більше, ніж вона є. База знань, яка повʼязує біомаркери з
        лікуванням, має кодувати, які знахідки actionable у якому клінічному
        контексті, а не вважати значущим будь-яке влучання в онкоген.
