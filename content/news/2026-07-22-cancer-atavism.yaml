slug: cancer-atavism
date: 2026-07-22
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [biology, evolution, research]

sources:
  - citation: >-
      Trigos AS, Pearson RB, Papenfuss AT, Goode DL. Altered interactions between
      unicellular and multicellular genes drive hallmarks of transformation in a
      diverse range of solid tumours. PNAS. 2017.
    id: "10.1073/pnas.1617743114"
  - citation: >-
      Daignan-Fornier B, Pradeu T. Critically assessing atavism, an
      evolution-centered and deterministic hypothesis on cancer. BioEssays. 2024.
    id: "10.1002/bies.202300221"

title:
  en: Is cancer returning to a unicellular past?
  uk: Чи повертається рак до одноклітинного минулого?

summary:
  en: >-
    Some tumours express older evolutionary gene programmes more strongly and
    multicellular programmes less strongly. That observation is real; the
    proposed “atavism” explanation remains a contested research hypothesis.
  uk: >-
    Деякі пухлини сильніше експресують давніші еволюційні генні програми й
    слабше — програми багатоклітинності. Це реальне спостереження, але
    пояснення через «атавізм» лишається дискусійною гіпотезою.

body:
  en:
    - type: p
      text: >-
        Cancer is sometimes described as a return to an ancient, unicellular
        mode of life. The phrase comes from the atavism hypothesis: the idea
        that a tumour reactivates programmes that pre-date multicellular
        animals while losing programmes needed for tissue cooperation.
    - type: p
      text: >-
        A 2017 analysis compared tumour and matched normal tissue across seven
        TCGA cohorts. Genes with very old evolutionary origins were more often
        up-regulated in the tumours, while genes that arose with animal
        multicellularity were more often down-regulated. The pattern is
        interesting, and the authors explicitly discussed it in atavism terms.
    - type: h2
      text: Why that is not a settled account of cancer
    - type: p
      text: >-
        Old genes include much of the cell-cycle, DNA-replication and basic
        metabolic machinery. Genes associated with multicellularity include
        differentiation, adhesion and tissue signalling. Rapidly dividing,
        poorly differentiated cells can therefore show this pattern without
        literally retracing evolution.
    - type: callout
      tone: info
      text: >-
        The atavism model is a useful way to ask research questions, not a
        validated biomarker, treatment target or basis for a treatment choice.
    - type: p
      text: >-
        Critical reviews also point to a methodological question: estimating
        the evolutionary age of genes is difficult, and different methods can
        change the apparent pattern. The careful conclusion is narrower than
        the headline: tumours often disrupt the balance between ancient core
        functions and multicellular tissue functions; why they do so remains
        open.
  uk:
    - type: p
      text: >-
        Рак іноді описують як повернення до давнього одноклітинного способу
        життя. Ця фраза походить з гіпотези атавізму: пухлина нібито знову
        вмикає програми, старші за багатоклітинних тварин, і втрачає програми
        співпраці клітин у тканині.
    - type: p
      text: >-
        У дослідженні 2017 року порівняли пухлинну та відповідну нормальну
        тканину в семи когортах TCGA. Гени з дуже давнім еволюційним походженням
        частіше були активнішими в пухлинах, а гени, що виникли разом із
        багатоклітинністю тварин, — менш активними. Спостереження цікаве, і
        автори прямо обговорювали його мовою атавізму.
    - type: h2
      text: Чому це не усталене пояснення раку
    - type: p
      text: >-
        До давніх генів належить значна частина механізмів клітинного циклу,
        реплікації ДНК і базового метаболізму. З багатоклітинністю пов’язані
        диференціація, адгезія та сигнали між тканинами. Тому швидко поділювані,
        погано диференційовані клітини можуть давати такий патерн без буквального
        «руху назад» еволюцією.
    - type: callout
      tone: info
      text: >-
        Модель атавізму допомагає ставити наукові питання, але не є валідованим
        біомаркером, мішенню лікування чи підставою для вибору терапії.
    - type: p
      text: >-
        Критичні огляди нагадують і про методологічну проблему: визначати
        еволюційний вік генів складно, а метод змінює картину. Обережний висновок
        вужчий за яскравий заголовок: пухлини часто порушують баланс між давніми
        базовими функціями та функціями багатоклітинної тканини; причина цього
        ще відкрита.
