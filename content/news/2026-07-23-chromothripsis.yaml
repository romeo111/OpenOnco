slug: chromothripsis-and-genome-chaos
date: 2026-07-23
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [genomics, chromothripsis, research]

sources:
  - citation: >-
      Stephens PJ, Greenman CD, Fu B, et al. Massive genomic rearrangement
      acquired in a single catastrophic event during cancer development. Cell. 2011.
    id: "10.1016/j.cell.2010.11.055"
  - citation: >-
      Cortés-Ciriano I, Lee JJ, Xi R, et al. Comprehensive analysis of
      chromothripsis in 2,658 human cancers using whole-genome sequencing.
      Nature Genetics. 2020.
    id: "10.1038/s41588-019-0576-7"
  - citation: >-
      Liu G, Stevens JB, Horne SD, et al. Genome chaos: survival strategy during
