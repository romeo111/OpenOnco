title:
  en: When a chromosome breaks apart in one event
  uk: Коли хромосома руйнується за одну подію

summary:
  en: >-
    Chromothripsis is a well-established pattern of catastrophic chromosome
    rearrangement. “Genome chaos” is a broader, less standard interpretation
    of such crises — not a synonym and not a settled survival strategy.
  uk: >-
    Хромотрипсис — добре встановлений патерн катастрофічних перебудов хромосом.
    «Геномний хаос» — ширше й менш стандартне тлумачення таких криз, а не
    синонім і не доведена стратегія виживання.

body:
  en:
    - type: p
      text: >-
        Chromothripsis means that one or a few chromosomes acquire tens to
        hundreds of rearrangements in a single cellular catastrophe. DNA
        fragments are put back together in a disordered way, producing a
        distinctive pattern in whole-genome sequencing.
    - type: p
      text: >-
        The best-supported mechanism involves a chromosome that is misplaced
        into a micronucleus during cell division. The micronuclear envelope can
        rupture, leaving the chromosome vulnerable to extensive damage before
        fragments are reassembled. Large cancer-genome studies now find
        chromothripsis far more often than early estimates suggested.
    - type: h2
      text: Not every dramatic term describes the same thing
    - type: p
      text: >-
        Genome chaos is a broader term used mainly by one research tradition
        for rapid karyotype reorganisation under severe stress. It groups
        chromothripsis with several other patterns. That framing should not be
        confused with the sequencing-defined phenomenon of chromothripsis.
    - type: p
      text: >-
        Most cells that suffer extensive chromosome fragmentation die. A small
        number of survivors can carry a new, stable-enough genome on which
        selection later acts. Calling the event a purposeful “survival strategy”
        is one hypothesis; the mainstream account is a catastrophic accident
        whose rare survivors may subsequently gain an advantage.
    - type: callout
      tone: info
      text: >-
        Chromothripsis helps explain how a cancer genome can change abruptly.
        It does not, by itself, say what treatment a particular tumour needs.
  uk:
    - type: p
      text: >-
        Хромотрипсис означає, що одна або кілька хромосом набувають десятків чи
        сотень перебудов у межах однієї клітинної катастрофи. Фрагменти ДНК
        з’єднуються у безладному порядку й залишають характерний слід у
        повногеномному секвенуванні.
    - type: p
      text: >-
        Найкраще підтверджений механізм пов’язаний із хромосомою, що під час
        поділу помилково потрапила до мікроядра. Його оболонка може розірватися,
        і хромосома зазнає великого ушкодження до повторного з’єднання
        фрагментів. Великі геномні дослідження виявляють хромотрипсис значно
        частіше, ніж ранні оцінки.
    - type: h2
      text: Не всі гучні терміни означають одне й те саме
    - type: p
      text: >-
        «Геномний хаос» — ширший термін, уживаний переважно однією науковою
        традицією для швидкої перебудови каріотипу під сильним стресом. Він
        об’єднує хромотрипсис із кількома іншими патернами, але не є його
        синонімом.
    - type: p
      text: >-
        Більшість клітин із масивною фрагментацією хромосом гине. Невелика
        частина виживає з новим, достатньо стабільним геномом, на який згодом
        діє відбір. Називати це цілеспрямованою «стратегією виживання» — одна
        гіпотеза; поширеніше пояснення — катастрофа, чиї рідкісні вижилі клітини
        можуть потім отримати перевагу.
    - type: callout
      tone: info
      text: >-
        Хромотрипсис пояснює, як геном пухлини може різко змінюватися. Сам по
        собі він не визначає лікування конкретної пухлини.
