slug: adaptive-mutability-under-drug-pressure
date: 2026-07-24
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [resistance, colorectal-cancer, research]

sources:
  - citation: >-
      Russo M, Crisafulli G, Sogari A, et al. Adaptive mutability of colorectal
      cancers in response to targeted therapies. Science. 2019.
    id: "10.1126/science.aav4474"
  - citation: >-
      Russo M, Pompei S, Sogari A, et al. A modified fluctuation-test framework
      characterizes the population dynamics and mutation rate of colorectal
      cancer persister cells. Nature Genetics. 2022.
    id: "10.1038/s41588-022-01105-z"
  - citation: >-
      Diaz LA Jr, Williams RT, Wu J, et al. The molecular evolution of acquired
      resistance to targeted EGFR blockade in colorectal cancers. Nature. 2012.
    id: "10.1038/nature11219"

title:
  en: Can treatment-tolerant cancer cells become temporarily more mutable?
  uk: Чи можуть стійкі до лікування клітини тимчасово ставати більш мутабельними?

summary:
  en: >-
    In colorectal-cancer models, a small population of cells that persists
    during targeted treatment temporarily changed DNA-repair programmes. It is
    an intriguing mechanism, but its contribution to resistance in patients is
    still not settled.
  uk: >-
    У моделях колоректального раку невелика популяція клітин, що виживає під
    час таргетного лікування, тимчасово змінювала програми ремонту ДНК. Це
    цікава гіпотеза механізму, але її внесок у резистентність у пацієнтів ще не
    встановлено.

body:
  en:
    - type: p
      text: >-
        Resistance is often described as selection of a resistant clone that
        was already present. That is a well-documented route, but laboratory
        studies suggest a second possibility: a small drug-tolerant population
        may temporarily enter a state in which it makes more genetic errors.
    - type: p
      text: >-
        In 2019, researchers studying colorectal-cancer models exposed to
        EGFR-targeted treatment found that persister cells reduced expression of
        mismatch-repair and homologous-recombination genes while increasing
        error-prone DNA polymerases. The changes reversed after treatment was
        withdrawn.
    - type: h2
      text: A careful reading of the numbers
    - type: p
      text: >-
        The 2019 study showed altered repair capacity and reporter evidence of
        increased mutability; it did not report a global fold increase in
        point mutations. A 2022 follow-up estimated a temporary 7- to 50-fold
        increase in mutation rate in two cell-line settings. That number should
        not be retroactively attributed to the earlier study.
    - type: p
      text: >-
        Neither experiment proved that this state creates the specific
        resistance mutations seen in patients. It may operate alongside the
        expansion of pre-existing resistant cells, and its relative importance
        in real tumours remains unknown.
    - type: callout
      tone: info
      text: >-
        This is research on a possible route to resistance, not evidence that a
        person’s tumour will respond to or escape a particular therapy.
  uk:
    - type: p
      text: >-
        Резистентність часто пояснюють відбором стійкого клону, який існував ще
        до лікування. Це добре задокументований шлях, але лабораторні роботи
        припускають і другий: мала популяція клітин, що терпить препарат, може
        тимчасово увійти в стан із більшою кількістю генетичних помилок.
    - type: p
      text: >-
        У 2019 році дослідники моделей колоректального раку під дією
        EGFR-таргетного лікування побачили в клітинах-персистерах нижчу
        експресію генів репарації неспарених основ і гомологічної рекомбінації
        та вищу — помилкових ДНК-полімераз. Після відміни препарату зміни
        зникали.
    - type: h2
      text: Як обережно читати числа
    - type: p
      text: >-
        Робота 2019 року показала зміну репарації та ознаки більшої
        мутабельності в репортерних тестах; вона не давала кратного зростання
        загальної кількості точкових мутацій. Наступна робота 2022 року оцінила
        тимчасове зростання швидкості мутацій у 7–50 разів у двох клітинних
        моделях. Це число не слід приписувати першому дослідженню.
    - type: p
      text: >-
        Жоден експеримент не довів, що саме цей стан створює мутації
        резистентності, які трапляються в пацієнтів. Він може діяти поруч із
        розростанням уже наявних стійких клітин, а його частка в реальних
        пухлинах невідома.
    - type: callout
      tone: info
      text: >-
        Це дослідження можливого шляху резистентності, а не доказ того, що
        конкретна пухлина людини відповість на певну терапію або уникне її.
