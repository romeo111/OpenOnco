    id: "10.1111/mec.17682"

title:
  en: Cancers that pass between animals
  uk: Раки, що передаються між тваринами

summary:
  en: >-
    A few animal cancers persist as clonal lineages that can move from one host
    to another. The oldest known example is a dog cancer likely thousands — not
    eleven thousand — years old. This is not a naturally occurring human cancer.
  uk: >-
    Кілька раків у тварин існують як клональні лінії, здатні переходити між
    господарями. Найдавніший відомий приклад у собак існує тисячі, а не
    одинадцять тисяч років. Це не природно поширюваний рак людини.

body:
  en:
    - type: p
      text: >-
        Most cancers begin and end in one body. A few exceptions are living
        cancer-cell lineages that move between hosts: canine transmissible
        venereal tumour in dogs, two facial-tumour lineages in Tasmanian devils,
        and several transmissible neoplasias in marine bivalves.
    - type: p
      text: >-
        Their routes differ. Dog tumour cells are transferred during mating;
        devil facial tumours during biting; bivalve cancer cells can be shed
        into seawater and taken up by filter-feeding animals. These are genuine
        cancer-cell transfers, not viruses that merely raise cancer risk.
    - type: h2
      text: The famous dog lineage is younger than the usual headline
    - type: p
      text: >-
        An early two-genome estimate led to the widely repeated figure of
        roughly 11,000 years for canine transmissible venereal tumour. A later
        time-resolved analysis of 546 tumour exomes estimated its origin at
        about 6,200 years ago, with a broad uncertainty interval. The age is a
        molecular-clock estimate, not a date on a calendar.
    - type: p
      text: >-
        Counts also change as wildlife is sampled: a 2024 review counted eleven
        known lineages, and reports in 2025 raised the total to at least thirteen.
        A lineage count is not the same as a count of affected species.
    - type: callout
      tone: warn
      text: >-
        Naturally self-sustaining transmissible cancer lineages have not been
        documented in humans. Rare transplant-related or maternal-fetal transfer
        events are not the same phenomenon.
  uk:
    - type: p
      text: >-
        Більшість раків починаються й закінчуються в одному організмі. Є кілька
        винятків — живі лінії ракових клітин, що переходять між господарями:
        трансмісивна венерична пухлина собак, дві лінії пухлин обличчя
        тасманійських дияволів і кілька трансмісивних неоплазій морських
        двостулкових молюсків.
    - type: p
      text: >-
        Шляхи передачі різні. Клітини собачої пухлини передаються під час
        парування; пухлини дияволів — через укуси; клітини раку молюсків можуть
        потрапляти у воду й поглинатися тваринами, що фільтрують її. Це справжнє
        перенесення ракових клітин, а не віруси, які лише підвищують ризик раку.
    - type: h2
      text: Відома собача лінія молодша за звичний заголовок
    - type: p
      text: >-
        Рання оцінка на основі двох геномів породила часто повторювану цифру
        приблизно 11 000 років для трансмісивної венеричної пухлини собак.
        Пізніший часовий аналіз 546 екзомів пухлин оцінив її походження приблизно
        у 6 200 років, із широким інтервалом невизначеності. Це молекулярний
        годинник, а не календарна дата.
    - type: p
      text: >-
        Кількість ліній також змінюється з новими дослідженнями тварин: огляд
        2024 року нарахував одинадцять, а повідомлення 2025 року підняли число
        щонайменше до тринадцяти. Кількість ліній — не те саме, що кількість
        уражених видів.
    - type: callout
      tone: warn
      text: >-
        Природно самопідтримуваних трансмісивних ліній раку в людей не
        зафіксовано. Рідкісні події перенесення при трансплантації чи від матері
        до плода — інше явище.
