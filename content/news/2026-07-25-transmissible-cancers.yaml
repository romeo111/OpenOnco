slug: transmissible-cancers-in-animals
date: 2026-07-25
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [comparative-oncology, evolution, biology]

sources:
  - citation: >-
      Baez-Ortega A, Gori K, Strakova A, et al. Somatic evolution and global
      expansion of an ancient transmissible cancer lineage. Science. 2019.
    id: "10.1126/science.aau9923"
  - citation: >-
      Bramwell G, DeGregori J, Thomas F, Ujvari B. Transmissible cancers, the
      genomes that do not melt down. Evolution. 2024.
    id: "10.1093/evolut/qpae063"
  - citation: >-
      Yonemitsu MA, Sevigny JK, Vandepas LE, et al. Multiple lineages of
