    id: "https://www.nccn.org/docs/default-source/default-document-library/gl-submission-process-faqs_11_27-24.pdf?sfvrsn=88670faf_3"

title:
  en: Who can ask NCCN to change a guideline?
  uk: Хто може попросити NCCN змінити настанову?

summary:
  en: >-
    NCCN accepts guideline-change submissions from clinicians, patient advocates,
    organisations, payers and industry. The process has a common form and a
    fixed timetable, but it is not a guarantee that every request reaches a vote.
  uk: >-
    NCCN приймає запити на зміну настанов від клініцистів, пацієнтських
    адвокатів, організацій, платників та індустрії. Процес має спільну форму й
    чіткі строки, але не гарантує, що кожен запит дійде до голосування.

body:
  en:
    - type: p
      text: >-
        A clinical guideline is not written only by its named panel. NCCN’s
        published process accepts external requests for changes from industry,
        organisations, clinicians and clinical groups, patient advocates, and
        payers. All use the same online submission route; an NCCN account is
        required, but it is free to create.
    - type: p
      text: >-
        Timing matters. Requests must arrive at least four weeks, or 28 days,
        before the relevant annual panel meeting. Annual meeting dates are
        published; interim dates are not. A late request may wait until the
        following annual update rather than the next few weeks.
    - type: h2
      text: What happens after a submission
    - type: p
      text: >-
        NCCN says requests that meet its requirements are discussed and voted
        on by the panel. The eventual transparency record gives the decision
        and the aggregate panel vote. It does not reveal every panellist’s
        vote or the confidential discussion.
    - type: p
      text: >-
        “Every submission is voted on” has an important qualifier. A request
        can be closed at intake if it does not meet requirements, and a request
        already decided without new evidence can also be closed. Publication of
        the outcome normally follows the guideline update, on average months
        after the meeting.
    - type: callout
      tone: info
      text: >-
        This describes NCCN’s published policy, not an independent audit of
        whether every submission achieves the same outcome.
  uk:
    - type: p
      text: >-
        Клінічну настанову пише не лише її названа панель. За оприлюдненим
        процесом NCCN приймає зовнішні запити на зміни від індустрії,
        організацій, клініцистів і клінічних груп, пацієнтських адвокатів та
        платників. Усі користуються однією онлайн-формою; обліковий запис NCCN
        потрібен, але його можна створити безкоштовно.
    - type: p
      text: >-
        Важливий строк. Запит треба подати щонайменше за чотири тижні, або 28
        днів, до відповідного щорічного засідання панелі. Дати щорічних засідань
        публічні, проміжних — ні. Запізнілий запит може чекати наступного
        річного оновлення, а не кілька тижнів.
    - type: h2
      text: Що відбувається після подання
    - type: p
      text: >-
        NCCN повідомляє, що запити, які відповідають вимогам, панель обговорює
        й ставить на голосування. У підсумковому документі прозорості є рішення
        та сукупний голос панелі. Там немає голосу кожного учасника чи
        конфіденційного обговорення.
    - type: p
      text: >-
        У фрази «кожен запит голосується» є важлива умова. Запит можуть закрити
        на етапі прийому, якщо він не відповідає вимогам; повторний уже
        розглянутий запит без нових даних також можуть закрити. Результат
        зазвичай з’являється разом з оновленням настанови — в середньому через
        місяці після засідання.
    - type: callout
      tone: info
      text: >-
        Це опис опублікованої політики NCCN, а не незалежний аудит того, чи всі
        подання мають однаковий результат.
