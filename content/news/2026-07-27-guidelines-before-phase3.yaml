slug: guidelines-before-confirmatory-trials
date: 2026-07-27
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [guidelines, evidence, clinical-trials]

sources:
  - citation: >-
      Mohyuddin GR, Almasri J, Goodman A, Haslam A, Prasad V. The lifecycle and
      evolution of new regimens on the NCCN Guidelines for newly diagnosed
      multiple myeloma. The Oncologist. 2025.
    id: "10.1093/oncolo/oyae332"

title:
  en: Why a guideline can list a regimen before a phase 3 trial reports
  uk: Чому настанова може містити схему раніше за звіт фази 3

summary:
  en: >-
    In a study of new multiple-myeloma regimens, NCCN listing often preceded
    reported phase 3 data. That is a description of one guideline history, not
    evidence that guidelines routinely run ahead of regulators or that all early
    listings are equally supported.
  uk: >-
    У дослідженні нових схем при мієломі внесення до NCCN часто передувало
    оприлюдненню даних фази 3. Це опис історії однієї настанови, а не доказ, що
    настанови систематично випереджають регуляторів або що всі ранні внесення
    однаково підкріплені.

body:
  en:
    - type: p
      text: >-
        Randomised phase 3 trials are valuable, but they are not the only
        information a guideline panel sees. A panel can weigh prospective phase
        1 or 2 data, biological rationale, feasibility, safety, unmet need and
        other evidence while confirmatory trials are still running.
    - type: p
      text: >-
        A 2025 study followed 21 regimens newly added to NCCN guidance for
        newly diagnosed multiple myeloma. The median interval from first
        prospective clinical data to guideline listing was 15 months. Where
        phase 3 data later appeared after a listing, the median interval was
        about three and a half years.
    - type: h2
      text: What the study does — and does not — show
    - type: p
      text: >-
        The sequence was not universal. Some phase 3 data preceded listing, and
        four of the 21 regimens still had no phase 3 trial at the study’s cutoff.
        The analysis looked at a specific disease and a specific guideline
        history, not every cancer recommendation.
    - type: p
      text: >-
        It also did not analyse FDA approval dates. It can support the narrower
        conclusion that NCCN listing in this setting frequently preceded
        reported randomised confirmatory data — not the larger claim that
        guidelines generally precede regulators.
    - type: callout
      tone: info
      text: >-
        Evidence develops over time. A guideline category and its cited studies
        are more informative than the simple question of whether a phase 3
        paper has appeared.
  uk:
    - type: p
      text: >-
        Рандомізовані дослідження фази 3 цінні, але це не єдина інформація, яку
        бачить панель настанов. Вона може зважати на проспективні дані фаз 1–2,
        біологічне обґрунтування, здійсненність, безпеку, незадоволену потребу
        та інші дані, поки підтверджувальні дослідження тривають.
    - type: p
      text: >-
        Робота 2025 року простежила 21 схему, додану до NCCN для вперше
        діагностованої множинної мієломи. Медіана від перших проспективних
        клінічних даних до внесення в настанову становила 15 місяців. Там, де
        дані фази 3 з’являлися після внесення, медіана була приблизно три з
        половиною роки.
    - type: h2
      text: Що показує — і чого не показує — це дослідження
    - type: p
      text: >-
        Така послідовність не була універсальною. Для деяких схем дані фази 3
        передували внесенню, а для чотирьох із 21 схем на момент зрізу даних
        фази 3 ще не було. Аналіз стосувався певної хвороби й історії однієї
        настанови, а не кожної онкологічної рекомендації.
    - type: p
      text: >-
        Він також не аналізував дати схвалень FDA. Тому підтримує вужчий
        висновок: у цій ситуації внесення до NCCN часто передувало
        оприлюдненню рандомізованих підтверджувальних даних, але не ширше
        твердження, що настанови загалом випереджають регуляторів.
    - type: callout
      tone: info
      text: >-
        Докази розвиваються в часі. Категорія настанови й наведені в ній
        дослідження інформативніші, ніж просте питання, чи вже вийшла стаття
        фази 3.
