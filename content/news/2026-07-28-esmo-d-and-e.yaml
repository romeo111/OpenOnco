title:
  en: What ESMO grades D and E actually say
  uk: Що насправді означають оцінки ESMO D та E

summary:
  en: >-
    ESMO’s D and E grades mean evidence against efficacy or evidence of an
    adverse outcome. They do not mean merely that evidence is missing; that
    situation belongs to grade C.
  uk: >-
    Оцінки ESMO D та E означають дані проти ефективності або дані про
    несприятливий наслідок. Вони не означають просто відсутність доказів: для
    цього існує оцінка C.

body:
  en:
    - type: p
      text: >-
        ESMO Clinical Practice Guidelines attach a letter grade, A through E,
        to the strength of a recommendation and a separate Roman-numeral level,
        I through V, to the underlying evidence. The two labels answer
        different questions and should be read together.
    - type: p
      text: >-
        Grade A means strong evidence for efficacy with substantial clinical
        benefit. Grade B describes efficacy with more limited benefit. Grade C
        is the middle category: evidence may be insufficient, or the likely
        benefit may not outweigh harms, costs or other disadvantages.
    - type: h2
      text: D and E are active negative findings
    - type: p
      text: >-
        Grade D is moderate evidence against efficacy or for an adverse outcome,
        so the intervention is generally not recommended. Grade E is strong
        evidence against efficacy or for an adverse outcome, so it is never
        recommended. Demonstrated harm can therefore matter even if some
        efficacy signal exists.
    - type: p
      text: >-
        “Moderate” and “strong” here describe the strength of the negative
        evidence, not a percentage probability that a treatment does not work.
        The ESMO Magnitude of Clinical Benefit Scale is separate again: it asks
        how much benefit a positive study provides, not whether to recommend an
        intervention.
  uk:
    - type: p
      text: >-
        У клінічних настановах ESMO є буквена оцінка A–E для сили рекомендації
        та окремий римський рівень I–V для підставних доказів. Ці дві позначки
        відповідають на різні питання, тому їх слід читати разом.
    - type: p
      text: >-
        Оцінка A означає сильні докази ефективності з істотною клінічною
        користю. B описує ефективність із більш обмеженою користю. C — середня
        категорія: доказів може бракувати або очікувана користь може не
        переважати шкоду, вартість чи інші недоліки.
    - type: h2
      text: D та E — це активні негативні висновки
    - type: p
      text: >-
        D означає помірні докази проти ефективності або на користь
        несприятливого наслідку, тому втручання загалом не рекомендують. E
        означає сильні такі докази, тому втручання ніколи не рекомендують.
        Доведена шкода може бути важливою навіть за наявності певного сигналу
        ефективності.
    - type: p
      text: >-
        «Помірні» й «сильні» тут описують силу негативних доказів, а не
        відсоткову ймовірність того, що лікування не працює. Шкала величини
        клінічної користі ESMO-MCBS — окремий інструмент: вона питає, наскільки
        велика користь у позитивному дослідженні, а не чи варто рекомендувати
        втручання.
