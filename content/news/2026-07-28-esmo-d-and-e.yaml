sources:
  - citation: >-
      Le Rhun E, Weller M, Brandsma D, et al. EANO-ESMO Clinical Practice
      Guidelines for leptomeningeal metastasis from solid tumours. Annals of
      Oncology. 2017.
    id: "10.1093/annonc/mdx221"
  - citation: >-
      Dykewicz CA. Summary of the guidelines for preventing opportunistic
