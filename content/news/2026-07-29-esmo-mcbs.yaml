slug: esmo-mcbs-statistical-significance
date: 2026-07-29
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [evidence, esmo, clinical-trials]

sources:
  - citation: >-
      Cherny NI, Sullivan R, Dafni U, et al. A standardised, generic, validated
      approach to stratify the magnitude of clinical benefit anticipated from
      anti-cancer therapies: ESMO-MCBS. Annals of Oncology. 2015.
    id: "10.1093/annonc/mdv249"
  - citation: >-
      Cherny NI, Oosting SF, Dafni U, et al. ESMO Magnitude of Clinical Benefit
      Scale version 2.0. Annals of Oncology. 2025.
    id: "10.1016/j.annonc.2025.04.006"
  - citation: >-
      Moore MJ, Goldstein D, Hamm J, et al. Erlotinib plus gemcitabine compared
      with gemcitabine alone in advanced pancreatic cancer. JCO. 2007.
    id: "10.1200/JCO.2006.07.9525"

title:
  en: Statistically significant is not automatically worthwhile
  uk: Статистично значуще — не автоматично клінічно важливе

summary:
  en: >-
    ESMO-MCBS scores the size of benefit in studies that are already
    statistically positive. Its purpose is to distinguish a small, formal
    effect from one likely to matter to patients.
  uk: >-
    ESMO-MCBS оцінює розмір користі в дослідженнях, які вже статистично
    позитивні. Її мета — відрізнити невеликий формальний ефект від ефекту, що
    ймовірно має значення для пацієнтів.

body:
  en:
    - type: p
      text: >-
        A p-value can say that an observed difference is unlikely to be due to
        chance under a statistical model. It does not say whether the difference
        is large enough to change a person’s experience, time without disease
        progression, or survival in a meaningful way.
    - type: p
      text: >-
        ESMO created its Magnitude of Clinical Benefit Scale for that second
        question. It is applied to trials that have already met their formal
        positive criterion. The scale then considers relative effect, absolute
        gain, quality of life and toxicity, using different forms for different
        trial designs.
    - type: h2
      text: A positive trial can receive the lowest non-curative score
    - type: p
      text: >-
        In the survival-based forms, a large-looking relative effect is not
        enough: the observed median gain must also clear a minimum threshold.
        This design intentionally downgrades statistically significant results
        with clinically trivial benefit.
    - type: p
      text: >-
        For example, a pancreatic-cancer trial of gemcitabine plus erlotinib
        reported a statistically significant survival difference of about ten
        days. The example does not invalidate the trial; it illustrates why
        “significant” and “substantial” are separate claims.
    - type: callout
      tone: info
      text: >-
        Thresholds depend on the ESMO-MCBS version and the trial form. Any exact
        score should therefore state the version used.
  uk:
    - type: p
      text: >-
        p-значення може сказати, що за статистичною моделлю спостережена різниця
        навряд чи виникла випадково. Воно не говорить, чи достатньо велика ця
        різниця, щоб помітно змінити досвід людини, час без прогресування або
        виживаність.
    - type: p
      text: >-
        Шкалу величини клінічної користі ESMO створили саме для другого
        питання. Її застосовують до досліджень, які вже виконали формальний
        позитивний критерій. Далі шкала враховує відносний ефект, абсолютний
        приріст, якість життя й токсичність, використовуючи різні форми для
        різних дизайнів досліджень.
    - type: h2
      text: Позитивне дослідження може отримати найнижчу некуративну оцінку
    - type: p
      text: >-
        У формах, заснованих на виживаності, великого на вигляд відносного
        ефекту недостатньо: спостережений приріст медіани теж має пройти
        мінімальний поріг. Такий дизайн навмисно знижує оцінку статистично
        значущих результатів із клінічно мізерною користю.
    - type: p
      text: >-
        Наприклад, у дослідженні раку підшлункової залози гемцитабін із
        ерлотинібом дав статистично значущу різницю виживаності приблизно в
        десять днів. Це не знецінює дослідження; приклад показує, чому
        «значуще» й «істотне» — різні твердження.
    - type: callout
      tone: info
      text: >-
        Пороги залежать від версії ESMO-MCBS і форми дослідження. Тому разом із
        точною оцінкою завжди варто вказувати використану версію.
