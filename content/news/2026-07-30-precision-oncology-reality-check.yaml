slug: precision-oncology-reality-check
date: 2026-07-30
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [precision-oncology, biomarkers, clinical-trials]

sources:
  - citation: >-
      Le Tourneau C, Delord JP, Gonçalves A, et al. Molecularly targeted therapy
      based on tumour molecular profiling versus conventional therapy for advanced
      cancer (SHIVA). Lancet Oncology. 2015.
    id: "10.1016/S1470-2045(15)00188-6"
  - citation: >-
      Flaherty KT, Gray RJ, Chen AP, et al. Molecular Landscape and Actionable
      Alterations in NCI-MATCH. Journal of Clinical Oncology. 2020.
    id: "10.1200/JCO.19.03010"
  - citation: >-
      André F, Filleron T, Kamal M, et al. Genomics to select treatment for
      patients with metastatic breast cancer. Nature. 2022.
    id: "10.1038/s41586-022-05068-3"

title:
  en: "Precision oncology: what the famous reality checks actually found"
  uk: "Precision oncology: що насправді показали відомі «перевірки реальністю»"

summary:
  en: >-
    SHIVA and NCI-MATCH did not show that all biomarker-matched therapy fails.
    They showed how steep the route from sequencing to treatment can be and how
    weak-evidence matches in late-line disease often underdeliver.
  uk: >-
    SHIVA та NCI-MATCH не показали, що вся терапія за біомаркером не працює.
    Вони показали, наскільки стрімкий шлях від секвенування до лікування і як
    поєднання зі слабкими доказами в пізніх лініях часто дають менше, ніж
    очікується.

body:
  en:
    - type: p
      text: >-
        The promise of precision oncology is intuitive: find a molecular
        alteration and match it to a drug. The difficult part is that an
        alteration may be biologically real while still being a weak predictor
        of benefit from one particular drug in one particular cancer.
    - type: p
      text: >-
        In the randomised SHIVA trial, 195 people with refractory metastatic
        solid tumours received either an off-label targeted drug selected by a
        pre-specified molecular algorithm or treatment of physician’s choice.
        Median progression-free survival was 2.3 versus 2.0 months, with no
        statistically significant difference.
    - type: h2
      text: A match is also an operational funnel
    - type: p
      text: >-
        NCI-MATCH sequenced 5,540 successful tumour samples. An alteration
        actionable for a study arm was found in 37.6%, but only 17.8% were
        assigned to an arm after molecular and clinical exclusions. About 70%
        of assigned participants started treatment. The gap is part biology,
        part evidence quality, and part trial logistics.
    - type: p
      text: >-
        The more useful conclusion is conditional. In SAFIR02-BREAST, matched
        treatment improved progression-free survival for high-evidence ESCAT
        tier I or II alterations, but not for unselected alterations. “Matched”
        is therefore not a single evidence category.
    - type: callout
      tone: info
      text: >-
        Molecular profiling can be valuable. These trials argue for matching
        that is evidence-tiered and clinically contextual, not for abandoning
        molecular matching altogether.
  uk:
    - type: p
      text: >-
        Обіцянка precision oncology інтуїтивна: знайти молекулярну зміну й
        підібрати до неї препарат. Складність у тому, що зміна може бути
        біологічно реальною, але лишатися слабким предиктором користі від одного
        конкретного препарату при одному конкретному раку.
    - type: p
      text: >-
        У рандомізованому дослідженні SHIVA 195 людей із рефрактерними
        метастатичними солідними пухлинами отримали або таргетний препарат поза
        показанням, обраний за наперед заданим молекулярним алгоритмом, або
        лікування на розсуд лікаря. Медіана виживаності без прогресування була
        2,3 проти 2,0 місяця без статистично значущої різниці.
    - type: h2
      text: Підбір — це також операційна воронка
    - type: p
      text: >-
        У NCI-MATCH успішно секвенували 5 540 зразків пухлин. Зміну, придатну
        для дослідницької гілки, знайшли у 37,6%, але після молекулярних і
        клінічних виключень лише 17,8% призначили до гілки. Приблизно 70%
        призначених почали лікування. Розрив пояснюється і біологією, і якістю
        доказів, і логістикою досліджень.
    - type: p
      text: >-
        Корисніший висновок умовний. У SAFIR02-BREAST підібране лікування
        покращило виживаність без прогресування для змін високих рівнів доказів
        ESCAT I–II, але не для невідібраних змін. Отже, «підібране» — не одна
        категорія доказів.
    - type: callout
      tone: info
      text: >-
        Молекулярне профілювання може бути цінним. Ці дослідження говорять на
        користь підбору з урахуванням рівня доказів і клінічного контексту, а
        не на користь відмови від молекулярного підбору взагалі.
