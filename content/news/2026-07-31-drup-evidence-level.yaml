slug: drup-evidence-level-and-outcomes
date: 2026-07-31
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [precision-oncology, basket-trials, evidence]

sources:
  - citation: >-
      van der Velden DL, Hoes LR, van der Wijngaart H, et al. The Drug
