title:
  en: "DRUP: a basket trial does not make all biomarkers equally strong"
  uk: "DRUP: basket-дослідження не робить усі біомаркери однаково сильними"

summary:
  en: >-
    Cohorts in the Dutch DRUP programme produced sharply different outcomes.
    The contrast is not evidence that actionability tiers do not matter; its
    own later analysis argues that strong biological and prior clinical evidence
    tracked with the better-performing targets.
  uk: >-
    Когорти нідерландської програми DRUP дали дуже різні результати. Цей
    контраст не доводить, що рівні actionability неважливі; пізніший власний
    аналіз програми показує, що кращим мішеням відповідали сильне біологічне та
    попереднє клінічне обґрунтування.

body:
  en:
    - type: p
      text: >-
        Drug rediscovery trials test approved cancer drugs outside their usual
        indication when a tumour has a potentially relevant molecular feature.
        They are an efficient way to learn, but their inclusion rule is broader
        than a guarantee that every drug–biomarker pair is equally convincing.
    - type: p
      text: >-
        DRUP’s tumour-agnostic cohort of microsatellite-instable tumours treated
        with nivolumab reported a clinical benefit rate of 63%. By contrast,
        palbociclib or ribociclib alone in cancers with cyclin D–CDK4/6-pathway
        alterations had a 16-week clinical benefit rate of 15% and an objective
        response rate of 0% in a pooled DRUP and MoST analysis.
    - type: h2
      text: Keep the endpoints straight
    - type: p
      text: >-
        Both headline percentages are clinical benefit rates, not response
        rates. They count either a confirmed response or stable disease lasting
        at least sixteen weeks. Calling the 15% figure a response rate would
        turn a zero-response cohort into a misleadingly positive one.
    - type: p
      text: >-
        The lesson is not that formal evidence levels fail to predict outcomes.
        A 2026 DRUP analysis concluded that high-performing targets shared
        strong biological rationale and prior clinical activity, whereas some
        weaker biomarkers had modest activity. Equal access to a basket-trial
        cohort is not equal evidence.
  uk:
    - type: p
      text: >-
        Дослідження повторного використання препаратів тестують уже схвалені
        онкологічні засоби поза звичним показанням, коли пухлина має потенційно
        релевантну молекулярну ознаку. Це ефективний спосіб навчатися, але його
        критерій включення ширший за гарантію, що кожна пара «препарат —
        біомаркер» однаково переконлива.
    - type: p
      text: >-
        У пухлинно-незалежній когорті DRUP із мікросателітно-нестабільними
        пухлинами, які отримували ніволумаб, клінічна користь становила 63%.
        Натомість палбоцикліб або рибоцикліб як монотерапія при змінах шляху
        cyclin D–CDK4/6 дали 15% клінічної користі на 16-му тижні та 0%
        об’єктивних відповідей у спільному аналізі DRUP і MoST.
    - type: h2
      text: Не плутаймо кінцеві точки
    - type: p
      text: >-
        Обидва відсотки — це клінічна користь, а не частота відповіді. До неї
        входить або підтверджена відповідь, або стабільна хвороба щонайменше 16
        тижнів. Назвати 15% частотою відповідей означало б перетворити когорту
        з нульовою відповіддю на оманливо позитивну.
    - type: p
      text: >-
        Висновок не в тому, що формальні рівні доказів не передбачають
        результат. Аналіз DRUP 2026 року дійшов висновку, що найкращі мішені
        мали сильне біологічне обґрунтування та попередню клінічну активність,
        тоді як деякі слабші біомаркери давали скромну активність. Рівний доступ
        до basket-когорти не означає рівні докази.
