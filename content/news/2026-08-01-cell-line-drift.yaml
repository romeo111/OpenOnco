slug: cell-line-drift-between-labs
date: 2026-08-01
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [research-methods, cell-lines, reproducibility]

sources:
  - citation: >-
      Ben-David U, Siranosian B, Ha G, et al. Genetic and transcriptional
      evolution alters cancer cell line drug response. Nature. 2018.
    id: "10.1038/s41586-018-0409-3"
  - citation: >-
      Quevedo R, Smirnov P, Tkachuk D, et al. Assessment of genetic drift in
      large pharmacogenomic studies. Cell Systems. 2020.
    id: "10.1016/j.cels.2020.08.012"

title:
  en: The same cancer cell line can become different experiments
  uk: Та сама клітинна лінія раку може стати різними експериментами

summary:
  en: >-
    Laboratory versions of the widely used MCF7 breast-cancer cell line differed
    genetically and in drug response. The finding is a reminder that a cell-line
    name is not a complete experimental description.
  uk: >-
    Лабораторні версії широко вживаної лінії раку молочної залози MCF7
    відрізнялися генетично й за відповіддю на препарати. Це нагадує, що назва
    клітинної лінії — не повний опис експерименту.

body:
  en:
    - type: p
      text: >-
        Cancer cell lines are indispensable research tools, but they continue
        to evolve while laboratories grow, freeze, thaw and passage them. Two
        flasks labelled with the same cell-line name may share an origin without
        being genetically identical today.
    - type: p
      text: >-
        A 2018 study characterised 27 laboratory strains of MCF7, a widely used
        breast-cancer cell line. Only 35% of coding point mutations and indels
        were shared by all 27 strains. Ten chromosome arms differed in at least
        one comparison.
    - type: h2
      text: The divergence changed drug results
    - type: p
      text: >-
        When those strains were tested against 321 anticancer compounds, 55
        compounds strongly inhibited growth in at least one strain. Of those 55,
        48 were completely inactive in at least one other strain. The relevant
        denominator is the compounds active somewhere, not all compounds tested.
    - type: p
      text: >-
        This does not make cell-line research useless. It makes provenance,
        passage history, authentication, genomic characterisation and
        replication meaningful parts of the result. Independent work confirms
        that genetic drift can complicate pharmacogenomic comparisons.
    - type: callout
      tone: info
      text: >-
        A promising result in one cell line is an early research signal, not a
        clinical claim and not evidence that the same effect will occur in a
        person.
  uk:
    - type: p
      text: >-
        Клітинні лінії раку — незамінний інструмент досліджень, але вони
        продовжують еволюціонувати, поки лабораторії їх вирощують,
        заморожують, розморожують і пасажують. Дві колби з однією назвою лінії
        можуть мати спільне походження, але вже не бути генетично ідентичними.
    - type: p
      text: >-
        У роботі 2018 року охарактеризували 27 лабораторних штамів MCF7,
        широко вживаної лінії раку молочної залози. Лише 35% кодуючих точкових
        мутацій та інделів були спільними для всіх 27 штамів. Десять плечей
        хромосом відрізнялися хоча б в одному попарному порівнянні.
    - type: h2
      text: Розходження змінило результати з препаратами
    - type: p
      text: >-
        Коли ці штами перевірили на 321 протипухлинній сполуці, 55 із них сильно
        пригнічували ріст хоча б одного штаму. Із цих 55 сорок вісім були
        повністю неактивні хоча б в одному іншому штамі. Важливий знаменник —
        сполуки, активні десь, а не всі перевірені сполуки.
    - type: p
      text: >-
        Це не робить дослідження клітинних ліній марними. Це робить походження,
        історію пасажів, автентифікацію, геномну характеристику й повторення
        змістовними частинами результату. Незалежна робота також підтверджує,
        що генетичний дрейф ускладнює фармакогеномні порівняння.
    - type: callout
      tone: info
      text: >-
        Обнадійливий результат в одній клітинній лінії — ранній науковий
        сигнал, а не клінічне твердження й не доказ того, що такий самий ефект
        буде в людини.
