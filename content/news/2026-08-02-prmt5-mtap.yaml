      Cancer Discovery. 2023.
    id: "10.1158/2159-8290.CD-23-0669"

title:
  en: How a “common essential” gene can still hide a selective weakness
  uk: Як «загально необхідний» ген може приховувати вибіркову вразливість

summary:
  en: >-
    MTAP deletion can make cancer cells more sensitive to PRMT5 inhibition, even
    though PRMT5 is broadly essential to proliferating cells. The story is a
    lesson in how the kind of genetic screen used can conceal a biomarker signal.
  uk: >-
    Втрата MTAP може зробити ракові клітини чутливішими до інгібування PRMT5,
    хоча PRMT5 широко необхідний клітинам, що проліферують. Це історія про те,
    як тип генетичного скринінгу може приховати сигнал біомаркера.

body:
  en:
    - type: p
      text: >-
        Synthetic lethality describes a situation in which two disruptions
        together are far more damaging than either alone. Three independent
        studies in 2016 found that deletion of MTAP, often co-deleted with
        CDKN2A, can increase dependence on the methyltransferase PRMT5.
    - type: p
      text: >-
        The subtlety is that PRMT5 is not a dependency unique to MTAP-deleted
        tumours. It is broadly required by proliferating cells and appears on
        DepMap lists of common essential genes. MTAP deletion appears to create
        a partly inhibited state that may widen a therapeutic window, rather
        than inventing the dependency from nothing.
    - type: h2
      text: Why the screen matters
    - type: p
      text: >-
        A complete CRISPR knockout can make a gene look pan-lethal and obscure a
        selective biomarker association. RNA interference partially suppresses
        genes instead; analyses comparing the approaches identified PRMT5 as an
        example where the MTAP signal becomes visible with partial suppression.
    - type: p
      text: >-
        That is a methodological warning, not a claim that an earlier filter
        literally discarded the original PRMT5 discovery. The initial finding
        came from RNAi-based screens. Clinical validation is still early, and
        no PRMT5 inhibitor was FDA-approved as of July 2026.
    - type: callout
      tone: info
      text: >-
        A plausible therapeutic window in laboratory models is not a treatment
        recommendation. It is a reason to test a careful clinical hypothesis.
  uk:
    - type: p
      text: >-
        Синтетична летальність — ситуація, коли дві порушені функції разом
        шкодять значно більше, ніж кожна окремо. Три незалежні роботи 2016 року
        показали, що втрата MTAP, часто спільна з делецією CDKN2A, може посилити
        залежність від метилтрансферази PRMT5.
    - type: p
      text: >-
        Тонкість у тому, що PRMT5 — не залежність, унікальна для пухлин без
        MTAP. Він загалом необхідний клітинам, що проліферують, і входить до
        списків DepMap загально необхідних генів. Втрата MTAP, імовірно,
        створює частково пригнічений стан і може розширити терапевтичне вікно,
        а не створює залежність із нуля.
    - type: h2
      text: Чому важливий тип скринінгу
    - type: p
      text: >-
        Повний нокаут CRISPR може зробити ген панлетальним і приховати вибірковий
        зв’язок із біомаркером. RNAi лише частково пригнічує гени; порівняння
        підходів назвали PRMT5 прикладом, де сигнал MTAP стає видимим за
        часткового пригнічення.
    - type: p
      text: >-
        Це методологічне застереження, а не твердження, що якийсь ранній фільтр
        буквально відкинув первинне відкриття PRMT5. Воно походило зі
        RNAi-скринінгів. Клінічна перевірка ще рання, і станом на липень 2026
        інгібіторів PRMT5, схвалених FDA, не було.
    - type: callout
      tone: info
      text: >-
        Правдоподібне терапевтичне вікно в лабораторних моделях — не
        рекомендація лікування. Це причина перевірити обережну клінічну гіпотезу.
