slug: prmt5-mtap-and-common-essential-genes
date: 2026-08-02
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [synthetic-lethality, prmt5, research-methods]

sources:
  - citation: >-
      Kryukov GV, Wilson FH, Ruth JR, et al. MTAP deletion confers enhanced
      dependency on the PRMT5 arginine methyltransferase in cancer cells.
      Science. 2016.
    id: "10.1126/science.aad5214"
  - citation: >-
      Krill-Burger JM, Dempster JM, Borah AA, et al. Partial gene suppression
      improves identification of cancer vulnerabilities when CRISPR-Cas9
      knockout is pan-lethal. Genome Biology. 2023.
    id: "10.1186/s13059-023-03020-w"
  - citation: >-
