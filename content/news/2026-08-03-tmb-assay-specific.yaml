slug: tmb-ten-is-assay-specific
date: 2026-08-03
published: 2026-08-03
kind: explainer
author: OpenOnco
tags: [biomarkers, immunotherapy, tmb]

sources:
  - citation: >-
      Marabelle A, Fakih M, Lopez J, et al. Association of tumour mutational
      burden with outcomes in advanced solid tumours treated with pembrolizumab:
      KEYNOTE-158. Lancet Oncology. 2020.
    id: "10.1016/S1470-2045(20)30445-9"
  - citation: >-
      Vega DM, Yee LM, McShane LM, et al. Aligning tumour mutational burden
      quantification across diagnostic platforms: phase II of the Friends of
      Cancer Research TMB Harmonization Project. Annals of Oncology. 2021.
    id: "10.1016/j.annonc.2021.09.016"
  - citation: >-
      Marcus L, Fashoyin-Aje LA, Donoghue M, et al. FDA Approval Summary:
      Pembrolizumab for tumour mutational burden-high solid tumours. Clinical
      Cancer Research. 2021.
    id: "10.1158/1078-0432.CCR-21-0327"

title:
  en: Why TMB ≥10 mutations/Mb is not a universal biological line
  uk: Чому TMB ≥10 мутацій/Мб — не універсальна біологічна межа

summary:
  en: >-
    The FDA’s tumour-agnostic TMB-high indication for pembrolizumab used a
    particular assay and counting rule. The same numeric threshold cannot simply
    be copied to every sequencing panel or every tumour type.
  uk: >-
    Пухлинно-незалежне показання FDA для пембролізумабу за високого TMB
    використовувало конкретний тест і правило підрахунку. Той самий числовий
    поріг не можна просто переносити на кожну панель секвенування чи тип пухлини.

body:
  en:
    - type: p
      text: >-
        In KEYNOTE-158, previously treated advanced solid tumours with tissue
        tumour mutational burden of at least 10 mutations per megabase had a
        29% objective response rate to pembrolizumab, compared with 6% below
        that cut-off. The single-arm study showed enrichment for response; it
        did not establish a randomised survival benefit.
    - type: p
      text: >-
        The number 10 belonged to FoundationOne CDx, the assay used in that
        trial and approved as its companion diagnostic. Tumour mutational burden
        depends on panel size, which variants are counted, allele-frequency
        cut-offs, filtering and bioinformatic processing. It is a measurement,
        not one invariant biological substance.
    - type: h2
      text: Same number, different test, different classification
    - type: p
      text: >-
        Harmonisation studies show that applying the same number across panels
        can misclassify patients. Other panels may need a lower or higher
        calibrated threshold to approximate the FoundationOne result, and small
        panels have more variability at clinically used cut-offs.
    - type: p
      text: >-
        The threshold is also biologically imperfect. Within KEYNOTE-158,
        response was lower in the 10 to under 13 mutations/Mb group than at
        higher TMB. Some tumour types do not show the same relationship between
        mutation burden, immune infiltration and response. Regulatory adoption
        therefore differs across regions.
    - type: callout
      tone: warn
      text: >-
        A TMB value is interpretable only with its assay, tumour type and
        clinical setting. A number copied without those details is incomplete.
  uk:
    - type: p
      text: >-
        У KEYNOTE-158 раніше ліковані поширені солідні пухлини з тканинним
        мутаційним навантаженням щонайменше 10 мутацій на мегабазу мали 29%
        об’єктивних відповідей на пембролізумаб проти 6% нижче порогу.
        Одногрупове дослідження показало збагачення на відповідь, але не
        встановило рандомізовану користь для виживаності.
    - type: p
      text: >-
        Число 10 належало FoundationOne CDx — тесту, використаному в
        дослідженні та схваленому як супутня діагностика. TMB залежить від
        розміру панелі, того, які варіанти рахують, порогів алельної частоти,
        фільтрації та біоінформатичної обробки. Це вимірювання, а не одна
        незмінна біологічна речовина.
    - type: h2
      text: Те саме число, інший тест, інша класифікація
    - type: p
      text: >-
        Гармонізаційні дослідження показують, що застосування одного числа до
        різних панелей може неправильно класифікувати пацієнтів. Щоб наблизити
        результат FoundationOne, іншим панелям може бути потрібен нижчий або
        вищий відкалібрований поріг, а малі панелі мають більшу варіабельність
        біля клінічно вживаних відсічок.
    - type: p
      text: >-
        Поріг також біологічно недосконалий. У KEYNOTE-158 відповідь у групі
        10–<13 мутацій/Мб була нижчою, ніж за вищого TMB. У деяких типах пухлин
        зв’язок між мутаційним навантаженням, імунною інфільтрацією та відповіддю
        інший. Тому регуляторне застосування відрізняється між регіонами.
    - type: callout
      tone: warn
      text: >-
        Значення TMB можна інтерпретувати лише разом із тестом, типом пухлини та
        клінічним контекстом. Число без цих деталей неповне.
