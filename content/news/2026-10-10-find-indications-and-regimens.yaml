title:
  en: Find the indication behind a regimen
  uk: Знайдіть показання за схемою лікування
summary:
  en: Bilingual discovery pages made indication and regimen records easier to browse.
  uk: Двомовні сторінки пошуку полегшили перегляд показань і схем лікування.
body:
  en:
  - type: p
    text: Bilingual discovery pages made indication and regimen records easier to browse.
  - type: p
    text: A record is a starting point for checking its scope and sources, not permission to use
      a treatment. The change also added participation resources for contributors.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/594bce3245) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Двомовні сторінки пошуку полегшили перегляд показань і схем лікування.
  - type: p
    text: Запис — початок перевірки меж застосування та джерел, а не дозвіл застосувати лікування.
      Зміна також додала матеріали для учасників проєкту.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/594bce3245).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
