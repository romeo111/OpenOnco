title:
  en: The public site opened in more languages
  uk: Публічний сайт відкрився більшою кількістю мов
summary:
  en: The public interface expanded to six languages, including new Handbook drafts.
  uk: Публічний інтерфейс розширено до шести мов, зокрема з новими чернетками Посібника.
body:
  en:
  - type: p
    text: The public interface expanded to six languages, including new Handbook drafts.
  - type: p
    text: Navigation and explanatory copy became easier to reach beyond English and Ukrainian. These
      were draft translations, with source text retained where verification was incomplete.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/693477beec) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Публічний інтерфейс розширено до шести мов, зокрема з новими чернетками Посібника.
  - type: p
    text: 'Навігація та пояснення стали доступнішими за межами англійської й української. Це були
      чернетки перекладу: оригінал залишали там, де перевірку ще не завершено.'
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/693477beec).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
