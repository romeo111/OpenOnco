slug: wiki-finds-the-source
date: 2026-10-10
published: 2026-10-13
kind: project
author: OpenOnco
tags: [onco-wiki, discovery, languages]

title:
  en: From a disease name to the record behind it
  uk: Від назви хвороби — до запису, на якому все ґрунтується

summary:
  en: >-
    OpenOnco now has 103 disease landing pages in English and Ukrainian.
    Wiki discovery also connects indications and regimens across six interface
    languages, with provenance and review limits visible.
  uk: >-
    Для 103 захворювань з’явилися сторінки англійською та українською.
    Пошук у Wiki також пов’язує показання і схеми лікування в інтерфейсі
    шістьма мовами, показуючи джерела та межі рецензування.

body:
  en:
    - type: p
      text: >-
        A search result that ends at a coverage table is hard to inspect.
        The [Onco Wiki](/kb.html) now offers a dedicated landing page for each of
        103 diseases in English and Ukrainian. A page links back to the
        versioned knowledge-base record, its references, related entries and
        visible review caveats.
    - type: p
      text: >-
        Discovery widened too: indication and regimen filters are available
        in the English, Ukrainian, Spanish, Portuguese, German and French
        interfaces. The linked clinical records retain their source language
        where translation or clinical review is incomplete. That distinction
        matters more than a page merely looking multilingual.
    - type: p
      text: >-
        The [disease-page release](https://github.com/romeo111/OpenOnco/pull/649)
        and [six-language discovery release](https://github.com/romeo111/OpenOnco/pull/653)
        show what was shipped and checked. Neither release changed treatment
        recommendations in the clinical knowledge base.
  uk:
    - type: p
      text: >-
        Результат пошуку, що закінчується рядком у таблиці покриття, складно
        перевірити. Тепер [Onco Wiki](/ukr/kb.html) має окрему сторінку для кожного
        зі 103 захворювань англійською та українською. Сторінка пов’язана
        з версійним записом бази знань, його джерелами, спорідненими записами
        та видимими застереженнями щодо рецензування.
    - type: p
      text: >-
        Розширився й пошук: фільтри показань і схем лікування доступні в
        англійському, українському, іспанському, португальському, німецькому
        та французькому інтерфейсах. Пов’язані клінічні записи зберігають
        мову оригіналу там, де переклад або клінічне рецензування ще не
        завершені. Ця відмінність важливіша за сам вигляд багатомовної сторінки.
    - type: p
      text: >-
        У [релізі сторінок захворювань](https://github.com/romeo111/OpenOnco/pull/649)
        і [релізі пошуку шістьма мовами](https://github.com/romeo111/OpenOnco/pull/653)
        описано зроблене та перевірки. Жоден із них не змінював рекомендацій
        щодо лікування в клінічній базі знань.
