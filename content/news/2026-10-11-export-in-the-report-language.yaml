title:
  en: Export the language you actually see
  uk: Експортуйте тією мовою, яку бачите
summary:
  en: Report export now follows the displayed language and discloses any patient-text fallback.
  uk: Експорт звіту тепер відповідає мові на екрані й позначає неперекладений фрагмент.
body:
  en:
  - type: p
    text: Report export now follows the displayed language and discloses any patient-text fallback.
  - type: p
    text: This reduces surprises when sharing a draft with a clinician. If a passage remains in its
      source language, the export says so instead of silently passing it off as translated.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/4b33babf07) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Експорт звіту тепер відповідає мові на екрані й позначає неперекладений фрагмент.
  - type: p
    text: Так менше несподіванок, коли чернетку передають лікарю. Якщо уривок лишився мовою оригіналу,
      експорт це зазначає, а не видає його за переклад.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/4b33babf07).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
