title:
  en: Show missing data before options
  uk: Показувати брак даних перед варіантами
summary:
  en: Patient-facing drafts now surface data gaps before listing treatment options.
  uk: Пацієнтські чернетки тепер показують брак даних до переліку варіантів лікування.
body:
  en:
  - type: p
    text: Patient-facing drafts now surface data gaps before listing treatment options.
  - type: p
    text: That ordering makes uncertainty visible at the point a reader might otherwise focus on
      a named option. Missing data still require a clinician to resolve; the page cannot fill them
      in.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/d570977e88) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Пацієнтські чернетки тепер показують брак даних до переліку варіантів лікування.
  - type: p
    text: Такий порядок показує невизначеність саме там, де читач міг би зосередитися на назві варіанта.
      Відсутні дані має з’ясувати лікар; сторінка не домислює їх.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/d570977e88).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
