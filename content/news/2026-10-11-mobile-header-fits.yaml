title:
  en: A shorter menu for small screens
  uk: Коротше меню для малих екранів
summary:
  en: The mobile header was simplified and navigation links were aligned.
  uk: Мобільну шапку спрощено, а посилання меню вирівняно.
body:
  en:
  - type: p
    text: The mobile header was simplified and navigation links were aligned.
  - type: p
    text: Readers should be able to reach the Wiki, tools and project pages without a crowded first
      screen. The same links remain available; the layout changed.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/449134c336) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Мобільну шапку спрощено, а посилання меню вирівняно.
  - type: p
    text: Читач має діставатися до Вікі, інструментів і сторінок проєкту без перевантаженого першого
      екрана. Посилання залишилися; змінилося компонування.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/449134c336).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
