title:
  en: Sources closer to the patient report
  uk: Джерела ближче до пацієнтського звіту
summary:
  en: Patient report output began exposing source links and auditing the scope of localization.
  uk: Пацієнтський звіт почав показувати посилання на джерела й перевіряти обсяг перекладу.
body:
  en:
  - type: p
    text: Patient report output began exposing source links and auditing the scope of localization.
  - type: p
    text: The purpose is to make a statement easier to trace back, including when a translated explanation
      is incomplete. A visible citation is a route to verification, not an endorsement by itself.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/05ba808246) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Пацієнтський звіт почав показувати посилання на джерела й перевіряти обсяг перекладу.
  - type: p
    text: Це допомагає простежити твердження до джерела, зокрема якщо переклад пояснення неповний.
      Видиме посилання — шлях до перевірки, а не підтвердження саме по собі.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/05ba808246).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
