slug: translation-safety-net
date: 2026-10-11
published: 2026-10-13
kind: project
author: OpenOnco
tags: [translations, safety, review]

title:
  en: When a translation drops a safety clause, show the source
  uk: Якщо переклад губить застереження, показуємо оригінал

summary:
  en: >-
    Recent checks found omitted warnings and altered dosing language in
    clinical translation drafts. Affected passages now display the complete
    English source with a visible language label while review remains pending.
  uk: >-
    Перевірки знайшли пропущені застереження й змінену частоту дозування в
    чернетках медичних перекладів. Уражені фрагменти тепер показують повний
    англійський оригінал із позначкою мови; рецензування ще потрібне.

body:
  en:
    - type: p
      text: >-
        A fluent sentence can still be an unsafe translation. In the Spanish,
        Portuguese, German and French clinical drafts, checks found passages
        that lost a treatment-hold condition, a frailty alternative or an
        adverse-effect warning. Separate checks found a daily maintenance dose
        rendered as weekly and an omitted injection-site instruction.
    - type: p
      text: >-
        For the affected passages, the site now shows the complete English
        source and identifies its language instead of presenting a shorter
        translation as complete. Draft checks look for these known omissions
        and frequency changes. The review state remains pending; this is not a
        claim that every translation has been clinically approved.
    - type: callout
      tone: info
      text: >-
        This is a safety fallback for published wording. It does not revise
        the underlying clinical knowledge base or choose a different treatment.
    - type: p
      text: >-
        The work is documented in the
        [dosing-language fix](https://github.com/romeo111/OpenOnco/pull/666)
        and the
        [safety-clause fix](https://github.com/romeo111/OpenOnco/pull/667).
  uk:
    - type: p
      text: >-
        Граматично гладке речення теж може бути небезпечним перекладом.
        В іспанських, португальських, німецьких і французьких медичних
        чернетках перевірки виявили фрагменти, де зникла умова тимчасового
        припинення лікування, альтернатива для ослабленого пацієнта або
        попередження про побічну дію. Інші перевірки знайшли щоденну
        підтримувальну дозу, передану як щотижневу, та пропущену інструкцію
        щодо місця ін’єкції.
    - type: p
      text: >-
        У таких фрагментах сайт тепер показує повний англійський оригінал
        з видимою позначкою мови, а не видає скорочений переклад за повний.
        Нові перевірки шукають саме ці відомі пропуски та зміни частоти.
        Статус рецензування лишається відкритим: це не означає, що всі
        переклади вже клінічно схвалені.
    - type: callout
      tone: info
      text: >-
        Це захисний механізм для опублікованого тексту. Він не змінює
        клінічну базу знань і не обирає інше лікування.
    - type: p
      text: >-
        Деталі — у виправленнях
        [мови дозування](https://github.com/romeo111/OpenOnco/pull/666)
        та
        [пропущених застережень](https://github.com/romeo111/OpenOnco/pull/667).
