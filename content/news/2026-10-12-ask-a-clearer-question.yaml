slug: ask-a-clearer-question
date: 2026-10-12
published: 2026-10-13
kind: project
author: OpenOnco
tags: [tumor-board, privacy, interface]

title:
  en: A better question starts before the text box
  uk: Краще запитання починається ще до поля вводу

summary:
  en: >-
    The Tumor Board page now explains what the draft can do, who will review it,
    and where the information goes before anyone types a case.
  uk: >-
    Сторінка консиліумного запитання тепер пояснює можливості чернетки, роль
    лікаря та шлях даних ще до того, як хтось почне описувати випадок.

body:
  en:
    - type: p
      text: >-
        The old page opened with “AI draft” and an API setting. That made the
        technical machinery more prominent than the question a person came to
        ask. The [updated question page](/ask.html) now starts with the task:
        describe a de-identified oncology case or treatment-plan question and
        get a structured discussion draft.
    - type: p
      text: >-
        Clinicians and patients see separate explanations of how to use that
        draft. A privacy panel appears before the text field: a submitted
        question leaves the browser for the configured API server and may be
        sent to a model provider. The page asks users to omit identifying
        patient details. API settings and examples remain available, but no
        longer compete with the question itself.
    - type: callout
      tone: warn
      text: >-
        This is a discussion draft, not a treatment decision. A qualified
        clinician must check the case facts, cited evidence and unresolved
        details before using it in care.
    - type: p
      text: >-
        The interface update is live in all 11 site languages. It does not
        change the endpoint, usage quota or clinical rule engine. See
        [the merged change](https://github.com/romeo111/OpenOnco/pull/668)
        for the implementation and checks.
  uk:
    - type: p
      text: >-
        Раніше сторінка починалася зі слів «AI draft» і налаштування API.
        Технічна частина випереджала запитання, з яким людина прийшла.
        [Оновлена сторінка](/ukr/ask.html) тепер починається із завдання:
        описати онкологічний випадок або запитання щодо плану лікування без
        персональних даних і отримати структуровану чернетку для обговорення.
    - type: p
      text: >-
        Лікарі й пацієнти бачать окремі пояснення, як працювати з чернеткою.
        Перед полем вводу розміщено повідомлення про приватність: запитання
        надходить із браузера на налаштований API-сервер і може передаватися
        провайдеру моделі. Сторінка просить не додавати даних, за якими можна
        встановити особу пацієнта. Налаштування API та приклади залишилися,
        але не заважають сформулювати запитання.
    - type: callout
      tone: warn
      text: >-
        Це чернетка для обговорення, а не рішення про лікування. Перед
        використанням у допомозі кваліфікований лікар має перевірити факти
        випадку, джерела й невирішені питання.
    - type: p
      text: >-
        Інтерфейс оновлено всіма 11 мовами сайту. Адреса API, ліміт
        використання та клінічний рушій правил не змінилися. Деталі й
        перевірки — в [об’єднаній зміні](https://github.com/romeo111/OpenOnco/pull/668).
