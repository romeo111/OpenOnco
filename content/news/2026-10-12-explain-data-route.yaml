body:
  en:
  - type: p
    text: All eleven language editions gained clearer browser, server and model-provider data-flow
      wording.
  - type: p
    text: 'The distinction matters: the browser Plan Builder and the submitted Tumor Board question
      do not have the same data path. Readers should see that before entering a case.'
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/57182d2985) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Усі одинадцять мовних версій отримали зрозуміліший опис шляху даних через браузер, сервер
      і провайдера моделі.
  - type: p
    text: 'Різниця важлива: локальний Конструктор плану й надіслане запитання консиліуму мають різні
      шляхи даних. Це варто знати до введення випадку.'
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/57182d2985).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
