title:
  en: Keyboard focus crosses the report
  uk: Клавіатурний фокус проходить крізь звіт
summary:
  en: Keyboard navigation now wraps at the report iframe boundaries.
  uk: Клавіатурна навігація тепер переходить через межі вбудованого звіту.
body:
  en:
  - type: p
    text: Keyboard navigation now wraps at the report iframe boundaries.
  - type: p
    text: This is a small access fix for people moving through the page without a mouse. It changes
      focus behavior, not the report content.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/cbb7ce965d) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Клавіатурна навігація тепер переходить через межі вбудованого звіту.
  - type: p
    text: Це невелике покращення доступності для тих, хто користується сторінкою без миші. Воно змінює
      поведінку фокуса, а не вміст звіту.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/cbb7ce965d).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
