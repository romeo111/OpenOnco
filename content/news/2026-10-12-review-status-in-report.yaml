title:
  en: Review status belongs in the report
  uk: Статус перевірки має бути у звіті
summary:
  en: Patient reports began displaying the current content-review status beside findings.
  uk: Пацієнтські звіти почали показувати поточний статус перевірки вмісту поряд зі знахідками.
body:
  en:
  - type: p
    text: Patient reports began displaying the current content-review status beside findings.
  - type: p
    text: A reader can distinguish a drafted explanation from one that has completed clinical review.
      Technical tests and translation checks are separate from clinical approval.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/1d5853e850) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Пацієнтські звіти почали показувати поточний статус перевірки вмісту поряд зі знахідками.
  - type: p
    text: Читач може відрізнити чернетку пояснення від матеріалу після клінічного перегляду. Технічні
      тести та перевірка перекладу — не клінічне схвалення.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/1d5853e850).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
