title:
  en: Check input before server work
  uk: Перевіряти ввід до роботи сервера
summary:
  en: Clinical request fields are now validated before quota accounting and engine processing.
  uk: Поля клінічного запиту тепер перевіряють до обліку квоти й запуску рушія.
body:
  en:
  - type: p
    text: Clinical request fields are now validated before quota accounting and engine processing.
  - type: p
    text: Malformed data should fail clearly instead of entering later steps. The change concerns
      input handling; it does not change the clinical meaning of a valid result.
  - type: p
    text: Read the [original change](https://github.com/romeo111/OpenOnco/commit/f6772cdd02) for
      the implementation record. This retrospective note was written on 13 October 2026.
  uk:
  - type: p
    text: Поля клінічного запиту тепер перевіряють до обліку квоти й запуску рушія.
  - type: p
    text: Некоректні дані мають відхилятися зрозуміло, а не потрапляти в наступні етапи. Зміна стосується
      обробки вводу, а не клінічного змісту коректного результату.
  - type: p
    text: Деталі реалізації — у [первинній зміні](https://github.com/romeo111/OpenOnco/commit/f6772cdd02).
      Цю ретроспективну нотатку написано 13 жовтня 2026 року.
