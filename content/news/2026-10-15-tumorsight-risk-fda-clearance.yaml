slug: tumorsight-risk-fda-clearance
date: 2026-10-15
published: 2026-10-19
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, breast-cancer, evidence]
title:
  en: TumorSight Risk is FDA-cleared. What does its score mean?
  uk: TumorSight Risk має дозвіл FDA. Що означає його оцінка?
summary:
  en: The MRI-based risk tool has regulatory clearance and retrospective validation. It answers a different question from OpenOnco's open rules; neither proves better treatment outcomes.
  uk: Інструмент оцінки ризику за МРТ має дозвіл регулятора й ретроспективну валідацію. Він відповідає на інше запитання, ніж відкриті правила OpenOnco; жоден не довів поліпшення результатів лікування.
sources:
  - citation: "SimBioSys. TumorSight Risk clearance announcement. 15 October 2026."
    id: "https://simbiosys.com/2026/10/15/simbiosys-secures-fda-clearance-for-tumorsight-risk/"
  - citation: "US FDA. TumorSight Risk 510(k) K260023, decision 25 September 2026; indications and validation summary. Accessed 19 October 2026."
    id: "https://www.accessdata.fda.gov/cdrh_docs/pdf26/K260023.pdf"
  - citation: "SimBioSys. TumorSight Risk product description. Accessed 19 October 2026."
    id: "https://simbiosys.com/tumorsight-risk/"
  - citation: "OpenOnco. Public repository, MIT code licence, documentation and limitations. Accessed 19 October 2026."
    id: "https://github.com/romeo111/OpenOnco"
body:
  en:
    - type: p
      text: "SimBioSys announced TumorSight Risk on 15 October, after the FDA cleared it on 25 September (K260023). The software combines pre-treatment contrast-enhanced breast MRI with age, race, stage, nodal status and grade to estimate recurrence risk at five and ten years. Its cleared use is limited to adult women with HR-positive, HER2-negative, stage I–IIIA breast cancer and N0 or N1 nodes. It informs a physician alongside other clinical factors; it does not select treatment."
    - type: p
      text: "The FDA file describes a retrospective validation in 2,129 patients at four US sites. Observed five-year recurrence was 2.2% in the lowest score band (515 patients) and 13.6% in the highest (218 patients); these are group estimates, not anyone's personal prognosis. This supports risk stratification, but a retrospective study and 510(k) clearance do not show that using the score improves survival or changes treatment safely."
    - type: p
      text: "TumorSight Risk uses imaging and clinical data through a company-operated product; the checked product page gives no public price or source-code licence. OpenOnco instead offers a free browser workflow and MIT-licensed, source-linked rules for reviewing oncology pathways. Its public rules can be inspected and challenged, but OpenOnco cannot read MRI scans or calculate this recurrence score, and has no comparable FDA clearance or head-to-head outcomes evidence. The tools may complement a clinical discussion. Sources and comparison checked 19 October 2026. This article does not replace a qualified physician."
  uk:
    - type: p
      text: "15 жовтня SimBioSys повідомила про TumorSight Risk; FDA дозволило його продаж ще 25 вересня (K260023). Програма поєднує МРТ молочної залози з контрастуванням до лікування з даними про вік, расу, стадію, стан лімфовузлів і ступінь злоякісності, щоб оцінити ризик рецидиву через п'ять і десять років. Дозволене застосування обмежене дорослими жінками з HR-позитивним, HER2-негативним раком молочної залози стадії I–IIIA і статусом вузлів N0 або N1. Результат допомагає лікарю разом з іншими клінічними даними, але не обирає лікування."
    - type: p
      text: "У документах FDA описано ретроспективну перевірку на 2 129 пацієнтках у чотирьох центрах США. Спостережуваний п'ятирічний ризик рецидиву становив 2,2% у групі з найнижчими оцінками (515 осіб) і 13,6% у групі з найвищими (218 осіб). Це групові оцінки, а не особистий прогноз. Дані підтримують розподіл за ризиком, але ретроспективне дослідження й дозвіл FDA за процедурою 510(k) не доводять, що застосування оцінки поліпшує виживаність або безпечно змінює лікування."
    - type: p
      text: "TumorSight Risk використовує зображення та клінічні дані через продукт компанії; на перевіреній сторінці немає публічної ціни чи ліцензії на вихідний код. OpenOnco натомість пропонує безкоштовний браузерний інструмент і відкриті правила з джерелами за ліцензією MIT для аналізу онкологічних маршрутів. Ці правила можна перевіряти й оскаржувати, але OpenOnco не аналізує МРТ, не обчислює такий ризик і не має зіставного дозволу FDA або прямого дослідження результатів лікування. Інструменти можуть доповнювати клінічне обговорення. Джерела й порівняння перевірено 19 жовтня 2026 року. Стаття не замінює консультації кваліфікованого лікаря."
translations:
  es:
    title: TumorSight Risk tiene autorización de la FDA. ¿Qué significa su puntuación?
    summary: La herramienta de riesgo basada en RM cuenta con autorización regulatoria y validación retrospectiva. Responde a una pregunta distinta de las reglas abiertas de OpenOnco; ninguna demuestra mejores resultados terapéuticos.
    body:
      - type: p
        text: "SimBioSys anunció TumorSight Risk el 15 de octubre, después de que la FDA autorizara su comercialización el 25 de septiembre (K260023). El programa combina resonancia magnética mamaria con contraste previa al tratamiento con edad, raza, estadio, estado ganglionar y grado para estimar el riesgo de recurrencia a cinco y diez años. Su uso autorizado se limita a mujeres adultas con cáncer de mama HR positivo, HER2 negativo, en estadio I–IIIA y ganglios N0 o N1. Informa al médico junto con otros factores clínicos; no elige el tratamiento."
      - type: p
        text: "El expediente de la FDA describe una validación retrospectiva de 2.129 pacientes en cuatro centros de EE. UU. La recurrencia observada a cinco años fue del 2,2 % en el grupo de puntuación más baja (515 pacientes) y del 13,6 % en el más alto (218 pacientes). Son estimaciones de grupos, no el pronóstico personal de nadie. Los datos respaldan la estratificación del riesgo, pero ni el estudio retrospectivo ni la autorización 510(k) demuestran que usar la puntuación mejore la supervivencia o cambie el tratamiento de forma segura."
      - type: p
        text: "TumorSight Risk utiliza imágenes y datos clínicos mediante un producto de la empresa; la página consultada no publica precio ni licencia del código fuente. OpenOnco ofrece, en cambio, un flujo gratuito en el navegador y reglas con fuentes bajo licencia MIT para revisar rutas oncológicas. Sus reglas públicas se pueden examinar y cuestionar, pero OpenOnco no analiza resonancias ni calcula esta puntuación, y no cuenta con una autorización comparable de la FDA ni con evidencia comparativa directa sobre resultados clínicos. Las herramientas pueden complementarse en una discusión clínica. Fuentes y comparación verificadas el 19 de octubre de 2026. Este artículo no sustituye a un médico cualificado."
  pt:
    title: TumorSight Risk recebeu autorização da FDA. O que significa a pontuação?
    summary: A ferramenta de risco baseada em RM tem autorização regulatória e validação retrospetiva. Responde a uma pergunta diferente das regras abertas do OpenOnco; nenhuma demonstra melhores resultados terapêuticos.
    body:
      - type: p
        text: "A SimBioSys anunciou o TumorSight Risk em 15 de outubro, depois de a FDA autorizar a sua comercialização em 25 de setembro (K260023). O programa combina ressonância magnética mamária com contraste antes do tratamento com idade, raça, estádio, estado ganglionar e grau para estimar o risco de recorrência aos cinco e dez anos. A utilização autorizada limita-se a mulheres adultas com cancro da mama HR positivo, HER2 negativo, estádio I–IIIA e gânglios N0 ou N1. Informa o médico em conjunto com outros fatores clínicos; não escolhe o tratamento."
      - type: p
        text: "O processo da FDA descreve uma validação retrospetiva de 2 129 doentes em quatro centros dos EUA. A recorrência observada aos cinco anos foi de 2,2% no grupo com pontuação mais baixa (515 doentes) e de 13,6% no mais alto (218 doentes). São estimativas de grupos, não o prognóstico individual de alguém. Os dados sustentam a estratificação do risco, mas nem o estudo retrospetivo nem a autorização 510(k) demonstram que usar a pontuação melhora a sobrevivência ou altera o tratamento com segurança."
      - type: p
        text: "O TumorSight Risk utiliza imagens e dados clínicos através de um produto da empresa; a página consultada não publica preço nem licença do código-fonte. O OpenOnco oferece, em contrapartida, um fluxo gratuito no navegador e regras com fontes sob licença MIT para rever percursos oncológicos. As regras públicas podem ser examinadas e questionadas, mas o OpenOnco não analisa ressonâncias nem calcula esta pontuação, e não dispõe de autorização FDA comparável nem de provas comparativas diretas sobre resultados clínicos. As ferramentas podem complementar-se numa discussão clínica. Fontes e comparação verificadas em 19 de outubro de 2026. Este artigo não substitui um médico qualificado."
  de:
    title: TumorSight Risk hat eine FDA-Freigabe. Was bedeutet der Score?
    summary: Das MRT-basierte Risikowerkzeug hat eine behördliche Freigabe und retrospektive Validierung. Es beantwortet eine andere Frage als OpenOncos offene Regeln; keines belegt bessere Behandlungsergebnisse.
    body:
      - type: p
        text: "SimBioSys stellte TumorSight Risk am 15. Oktober vor, nachdem die FDA das Produkt am 25. September freigegeben hatte (K260023). Die Software kombiniert kontrastverstärkte Brust-MRT vor der Behandlung mit Alter, ethnischer Zuordnung, Stadium, Lymphknotenstatus und Tumorgrad, um das Rückfallrisiko nach fünf und zehn Jahren zu schätzen. Die zugelassene Anwendung beschränkt sich auf erwachsene Frauen mit HR-positivem, HER2-negativem Brustkrebs im Stadium I–IIIA und N0- oder N1-Knotenstatus. Sie unterstützt ärztliche Einschätzungen zusammen mit anderen klinischen Faktoren; sie wählt keine Therapie aus."
      - type: p
        text: "Die FDA-Unterlagen beschreiben eine retrospektive Validierung mit 2.129 Patientinnen an vier US-Standorten. Nach fünf Jahren lag die beobachtete Rückfallrate in der niedrigsten Score-Gruppe bei 2,2 % (515 Personen), in der höchsten bei 13,6 % (218 Personen). Das sind Gruppenschätzungen, keine persönliche Prognose. Die Daten stützen eine Risikoeinteilung; weder die retrospektive Studie noch die 510(k)-Freigabe zeigen jedoch, dass die Nutzung des Scores das Überleben verbessert oder Therapieänderungen sicher macht."
      - type: p
        text: "TumorSight Risk verarbeitet Bild- und klinische Daten in einem Produkt des Unternehmens; die geprüfte Produktseite nennt weder einen öffentlichen Preis noch eine Quellcodelizenz. OpenOnco bietet dagegen einen kostenlosen Browser-Ablauf und MIT-lizenzierte, quellenbelegte Regeln zur Prüfung onkologischer Behandlungspfade. Die öffentlichen Regeln lassen sich prüfen und hinterfragen; OpenOnco wertet aber keine MRT-Bilder aus, berechnet diesen Score nicht und hat weder eine vergleichbare FDA-Freigabe noch direkte Vergleichsdaten zu Behandlungsergebnissen. Beide Werkzeuge können eine klinische Besprechung ergänzen. Quellen und Vergleich geprüft am 19. Oktober 2026. Dieser Artikel ersetzt keine qualifizierte ärztliche Beratung."
  fr:
    title: TumorSight Risk a reçu une autorisation de la FDA. Que signifie son score ?
    summary: Cet outil de risque fondé sur l’IRM bénéficie d’une autorisation réglementaire et d’une validation rétrospective. Il répond à une autre question que les règles ouvertes d’OpenOnco ; aucun ne démontre de meilleurs résultats thérapeutiques.
    body:
      - type: p
        text: "SimBioSys a annoncé TumorSight Risk le 15 octobre, après son autorisation de mise sur le marché par la FDA le 25 septembre (K260023). Le logiciel associe une IRM mammaire avec injection avant traitement à l’âge, la race, le stade, le statut ganglionnaire et le grade pour estimer le risque de récidive à cinq et dix ans. Son usage autorisé se limite aux femmes adultes atteintes d’un cancer du sein HR positif, HER2 négatif, de stade I–IIIA et de statut ganglionnaire N0 ou N1. Il informe le médecin avec d’autres facteurs cliniques ; il ne choisit pas le traitement."
      - type: p
        text: "Le dossier de la FDA décrit une validation rétrospective sur 2 129 patientes dans quatre centres américains. La récidive observée à cinq ans était de 2,2 % dans la tranche de scores la plus basse (515 patientes) et de 13,6 % dans la plus haute (218 patientes). Ce sont des estimations de groupe, pas un pronostic individuel. Les données étayent une stratification du risque, mais ni l’étude rétrospective ni l’autorisation 510(k) ne montrent que l’utilisation du score améliore la survie ou permet de modifier le traitement sans risque."
      - type: p
        text: "TumorSight Risk utilise des images et des données cliniques dans un produit de l’entreprise ; la page consultée ne publie ni prix ni licence de code source. OpenOnco propose quant à lui un outil gratuit dans le navigateur et des règles sourcées sous licence MIT pour examiner les parcours oncologiques. Ses règles publiques peuvent être vérifiées et contestées, mais OpenOnco n’analyse pas les IRM, ne calcule pas ce score et ne dispose ni d’une autorisation FDA comparable ni de données comparatives directes sur les résultats cliniques. Les outils peuvent se compléter lors d’une discussion clinique. Sources et comparaison vérifiées le 19 octobre 2026. Cet article ne remplace pas un médecin qualifié."
  it:
    title: TumorSight Risk ha l’autorizzazione FDA. Che cosa significa il punteggio?
    summary: Lo strumento di rischio basato sulla RM ha autorizzazione regolatoria e validazione retrospettiva. Risponde a una domanda diversa dalle regole aperte di OpenOnco; nessuno dei due dimostra esiti terapeutici migliori.
    body:
      - type: p
        text: "SimBioSys ha annunciato TumorSight Risk il 15 ottobre, dopo l’autorizzazione alla commercializzazione della FDA del 25 settembre (K260023). Il software combina la risonanza magnetica mammaria con contrasto eseguita prima del trattamento con età, razza, stadio, stato linfonodale e grado per stimare il rischio di recidiva a cinque e dieci anni. L’uso autorizzato è limitato a donne adulte con carcinoma mammario HR positivo, HER2 negativo, stadio I–IIIA e linfonodi N0 o N1. Affianca il giudizio del medico e gli altri fattori clinici; non sceglie la terapia."
      - type: p
        text: "Il fascicolo FDA descrive una validazione retrospettiva su 2.129 pazienti in quattro centri statunitensi. La recidiva osservata a cinque anni è stata del 2,2% nella fascia di punteggio più bassa (515 pazienti) e del 13,6% in quella più alta (218 pazienti). Sono stime per gruppi, non prognosi individuali. I dati sostengono la stratificazione del rischio, ma né lo studio retrospettivo né l’autorizzazione 510(k) dimostrano che usare il punteggio migliori la sopravvivenza o renda sicuro modificare la terapia."
      - type: p
        text: "TumorSight Risk usa immagini e dati clinici tramite un prodotto aziendale; la pagina esaminata non pubblica prezzo o licenza del codice sorgente. OpenOnco offre invece uno strumento gratuito nel browser e regole con fonti sotto licenza MIT per esaminare i percorsi oncologici. Le regole pubbliche sono verificabili e contestabili, ma OpenOnco non analizza la RM, non calcola questo punteggio e non dispone né di un’autorizzazione FDA comparabile né di studi diretti sugli esiti a confronto. Gli strumenti possono integrarsi nel confronto clinico. Fonti e confronto verificati il 19 ottobre 2026. Questo articolo non sostituisce un medico qualificato."
  da:
    title: TumorSight Risk er godkendt af FDA. Hvad betyder scoren?
    summary: Det MR-baserede risikoværktøj har myndighedsgodkendelse og retrospektiv validering. Det besvarer et andet spørgsmål end OpenOncos åbne regler; ingen af dem dokumenterer bedre behandlingsresultater.
    body:
      - type: p
        text: "SimBioSys annoncerede TumorSight Risk den 15. oktober, efter at FDA gav markedsføringstilladelse den 25. september (K260023). Softwaren kombinerer kontrastforstærket bryst-MR før behandling med alder, race, stadium, lymfeknudestatus og tumorgrad for at anslå risikoen for tilbagefald efter fem og ti år. Den godkendte anvendelse er begrænset til voksne kvinder med HR-positiv, HER2-negativ brystkræft i stadium I–IIIA og N0- eller N1-knudestatus. Resultatet støtter lægen sammen med andre kliniske oplysninger; det vælger ikke behandling."
      - type: p
        text: "FDA's dokumentation beskriver retrospektiv validering af 2.129 patienter på fire amerikanske centre. Den observerede tilbagefaldsrate efter fem år var 2,2 % i den laveste scoregruppe (515 patienter) og 13,6 % i den højeste (218 patienter). Det er gruppeskøn, ikke en personlig prognose. Data støtter risikoinddeling, men hverken det retrospektive studie eller 510(k)-godkendelsen viser, at brug af scoren forbedrer overlevelsen eller gør ændret behandling sikker."
      - type: p
        text: "TumorSight Risk bruger billeder og kliniske data i virksomhedens produkt; den gennemgåede produktside oplyser hverken offentlig pris eller kildekodelicens. OpenOnco tilbyder derimod et gratis browserværktøj og kildebelagte regler under MIT-licens til gennemgang af onkologiske forløb. De offentlige regler kan undersøges og udfordres, men OpenOnco analyserer ikke MR-billeder, beregner ikke denne score og har hverken tilsvarende FDA-godkendelse eller direkte sammenlignende dokumentation for behandlingsresultater. Værktøjerne kan supplere en klinisk drøftelse. Kilder og sammenligning kontrolleret 19. oktober 2026. Artiklen erstatter ikke en kvalificeret læge."
  sv:
    title: TumorSight Risk har fått FDA-godkännande. Vad betyder poängen?
    summary: Det MR-baserade riskverktyget har myndighetsgodkännande och retrospektiv validering. Det besvarar en annan fråga än OpenOncos öppna regler; ingetdera visar bättre behandlingsresultat.
    body:
      - type: p
        text: "SimBioSys presenterade TumorSight Risk den 15 oktober efter att FDA godkänt marknadsföring den 25 september (K260023). Programvaran kombinerar kontrastförstärkt bröst-MR före behandling med ålder, ras, stadium, lymfkörtelstatus och tumörgrad för att uppskatta återfallsrisken efter fem och tio år. Det godkända användningsområdet är begränsat till vuxna kvinnor med HR-positiv, HER2-negativ bröstcancer i stadium I–IIIA och N0- eller N1-status. Resultatet hjälper läkaren tillsammans med andra kliniska faktorer; det väljer inte behandling."
      - type: p
        text: "FDA:s dokument beskriver en retrospektiv validering med 2 129 patienter vid fyra amerikanska centra. Den observerade återfallsfrekvensen efter fem år var 2,2 % i gruppen med lägst poäng (515 patienter) och 13,6 % i gruppen med högst poäng (218 patienter). Det är gruppskattningar, inte en individuell prognos. Uppgifterna stöder riskindelning, men varken den retrospektiva studien eller 510(k)-godkännandet visar att poängen förbättrar överlevnaden eller gör behandlingsändringar säkra."
      - type: p
        text: "TumorSight Risk använder bilder och kliniska data i företagets produkt; den granskade produktsidan anger varken offentligt pris eller källkodslicens. OpenOnco erbjuder i stället ett gratis webbläsarverktyg och källbelagda regler med MIT-licens för att granska onkologiska vårdvägar. De öppna reglerna kan kontrolleras och ifrågasättas, men OpenOnco analyserar inte MR-bilder, beräknar inte denna poäng och har varken motsvarande FDA-godkännande eller direkta jämförande data om behandlingsresultat. Verktygen kan komplettera en klinisk diskussion. Källor och jämförelse kontrollerade den 19 oktober 2026. Artikeln ersätter inte en kvalificerad läkare."
  nb:
    title: TumorSight Risk har FDA-klarering. Hva betyr skåren?
    summary: Det MR-baserte risikoverktøyet har regulatorisk klarering og retrospektiv validering. Det svarer på et annet spørsmål enn OpenOncos åpne regler; ingen av dem dokumenterer bedre behandlingsresultater.
    body:
      - type: p
        text: "SimBioSys kunngjorde TumorSight Risk 15. oktober, etter at FDA ga klarering 25. september (K260023). Programvaren kombinerer kontrastforsterket bryst-MR før behandling med alder, rase, stadium, lymfeknutestatus og tumorgrad for å anslå tilbakefallsrisiko etter fem og ti år. Godkjent bruk er begrenset til voksne kvinner med HR-positiv, HER2-negativ brystkreft i stadium I–IIIA og N0- eller N1-status. Resultatet støtter legen sammen med andre kliniske opplysninger; det velger ikke behandling."
      - type: p
        text: "FDA-dokumentene beskriver retrospektiv validering av 2 129 pasienter ved fire amerikanske sentre. Observert tilbakefall etter fem år var 2,2 % i gruppen med lavest skår (515 pasienter) og 13,6 % i gruppen med høyest skår (218 pasienter). Dette er gruppeanslag, ikke en personlig prognose. Dataene støtter risikoinndeling, men verken den retrospektive studien eller 510(k)-klareringen viser at bruk av skåren forbedrer overlevelse eller gjør behandlingsendringer trygge."
      - type: p
        text: "TumorSight Risk bruker bilder og kliniske data i selskapets produkt; den gjennomgåtte produktsiden oppgir verken offentlig pris eller kildekodelisens. OpenOnco tilbyr derimot et gratis nettleserverktøy og kildebelagte regler med MIT-lisens for gjennomgang av onkologiske behandlingsforløp. De åpne reglene kan undersøkes og utfordres, men OpenOnco analyserer ikke MR-bilder, beregner ikke denne skåren og har verken tilsvarende FDA-klarering eller direkte sammenlignende dokumentasjon for behandlingsresultater. Verktøyene kan utfylle en klinisk drøfting. Kilder og sammenligning kontrollert 19. oktober 2026. Artikkelen erstatter ikke en kvalifisert lege."
  fi:
    title: TumorSight Risk sai FDA:n myyntiluvan. Mitä pistemäärä tarkoittaa?
    summary: Magneettikuvaukseen perustuvalla riskityökalulla on viranomaislupa ja retrospektiivinen validointi. Se vastaa eri kysymykseen kuin OpenOncon avoimet säännöt; kummankaan ei ole osoitettu parantavan hoitotuloksia.
    body:
      - type: p
        text: "SimBioSys julkisti TumorSight Riskin 15. lokakuuta sen jälkeen, kun FDA oli antanut sille myyntiluvan 25. syyskuuta (K260023). Ohjelma yhdistää ennen hoitoa tehdyn varjoainetehosteisen rinnan magneettikuvauksen ikään, rotuluokitukseen, taudin levinneisyysasteeseen, imusolmuketilanteeseen ja kasvaimen erilaistumisasteeseen arvioidakseen uusiutumisriskin viiden ja kymmenen vuoden kohdalla. Hyväksytty käyttö rajoittuu aikuisiin naisiin, joilla on HR-positiivinen, HER2-negatiivinen vaiheen I–IIIA rintasyöpä ja N0- tai N1-imusolmuketilanne. Tulos tukee lääkäriä muiden kliinisten tietojen rinnalla; se ei valitse hoitoa."
      - type: p
        text: "FDA:n asiakirjassa kuvataan retrospektiivinen validointi 2 129 potilaalla neljässä yhdysvaltalaisessa keskuksessa. Havaittu uusiutuminen viidessä vuodessa oli 2,2 % pienimmän pistemäärän ryhmässä (515 potilasta) ja 13,6 % suurimman ryhmässä (218 potilasta). Nämä ovat ryhmätason arvioita, eivät henkilökohtaisia ennusteita. Tiedot tukevat riskiluokittelua, mutta retrospektiivinen tutkimus tai 510(k)-lupa ei osoita, että pistemäärän käyttö parantaa eloonjäämistä tai tekee hoidon muuttamisesta turvallista."
      - type: p
        text: "TumorSight Risk käyttää kuvia ja kliinisiä tietoja yrityksen tuotteessa; tarkistetulla tuotesivulla ei julkaista hintaa eikä lähdekoodilisenssiä. OpenOnco puolestaan tarjoaa maksuttoman selaintyökalun ja MIT-lisensoidut, lähteisiin perustuvat säännöt onkologisten hoitopolkujen tarkasteluun. Julkisia sääntöjä voi tutkia ja kyseenalaistaa, mutta OpenOnco ei analysoi magneettikuvia, laske tätä pistemäärää eikä sillä ole vastaavaa FDA-lupaa tai suoraa vertailevaa näyttöä hoitotuloksista. Työkalut voivat täydentää kliinistä keskustelua. Lähteet ja vertailu tarkistettu 19. lokakuuta 2026. Artikkeli ei korvaa pätevää lääkäriä."
