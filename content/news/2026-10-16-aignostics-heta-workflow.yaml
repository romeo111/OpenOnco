title:
  en: Aignostics launches HETA Clinical. Where does OpenOnco fit?
  uk: Aignostics запускає HETA Clinical. Яке місце OpenOnco?
summary:
  en: Image analysis and cited pathway review solve different problems. The launch is real; claims of fewer failed tests still need clinical evidence.
  uk: Аналіз зображень і перевірка маршрутів за джерелами вирішують різні завдання. Запуск відбувся, але твердження про менше невдалих тестів потребує клінічних доказів.
sources:
  - citation: "Aignostics. HETA Clinical launch announcement. 16 October 2026."
    id: "https://www.aignostics.com/news/aignostics-launches-heta-clinical-a-new-family-of-ai-products-that-speed-up-pathology-workflows-and-reduce-failed-molecular-tests"
  - citation: "Aignostics. HETA Clinical product description and research-use disclaimer. Accessed 18 October 2026."
    id: "https://www.aignostics.com/clinical/heta-clinical"
  - citation: "Standvoss K et al. Atlas H&E-TME: Scalable AI-Based Tissue Profiling at Expert Pathologist-Level Accuracy. arXiv:2606.12346v2. 14 July 2026."
    id: "https://arxiv.org/abs/2606.12346"
  - citation: "OpenOnco. Public repository, license and project documentation. Accessed 18 October 2026."
    id: "https://github.com/romeo111/OpenOnco"
body:
  en:
    - type: p
      text: "On 16 October, Aignostics announced four HETA Clinical tools for H&E whole-slide images: slide quality, tumor detection, mitotic count and tumor cellularity. It says these may help laboratories prioritize cases and avoid failed molecular tests. The release's 10–20% failure estimate comes from conversations with pathologists, not a published evaluation of these four tools. The product page says research use only, not for diagnostic procedures. A June HETA preprint evaluates cell classification, not whether these tools reduce failed tests or improve patient outcomes."
    - type: p
      text: "HETA analyzes tissue images; OpenOnco's free browser workflow organizes source-linked oncology rules and publishes code under the MIT license. OpenOnco cannot assess slides or count tumor cells. The checked Aignostics pages request a demo and list no routine price or public license for HETA Clinical. No head-to-head evidence shows either tool is more accurate. Image quality review and evidence review may complement each other. Sources and comparison checked 18 October 2026. This is background information, not a substitute for a qualified clinician."
  uk:
    - type: p
      text: "16 жовтня Aignostics оголосила про чотири інструменти HETA Clinical для цифрових зображень цілих зрізів, пофарбованих гематоксиліном та еозином: оцінювання якості, виявлення пухлини, підрахунок мітозів і визначення частки пухлинних клітин. Компанія стверджує, що вони можуть допомогти лабораторіям визначати пріоритетність випадків і уникати невдалих молекулярних тестів. Оцінка 10–20% невдалих тестів у повідомленні походить із розмов з патоморфологами, а не з опублікованої оцінки цих чотирьох інструментів. На сторінці продукту зазначено: лише для досліджень, не для діагностики. Червневий препринт про HETA оцінює класифікацію клітин, а не зменшення кількості невдалих тестів чи поліпшення результатів лікування."
    - type: p
      text: "HETA аналізує зображення тканин; безкоштовний браузерний інструмент OpenOnco впорядковує онкологічні правила з посиланнями на джерела, а його код опубліковано за ліцензією MIT. OpenOnco не оцінює зрізи й не рахує пухлинні клітини. На перевірених сторінках Aignostics пропонують замовити демонстрацію, але не вказують звичайної ціни чи публічної ліцензії для HETA Clinical. Прямих доказів вищої точності одного з інструментів немає. Перевірка якості зображень і аналіз доказів можуть доповнювати одне одного. Джерела й порівняння перевірено 18 жовтня 2026 року. Це довідковий матеріал, а не заміна консультації кваліфікованого лікаря."
translations:
  es:
    title: Aignostics lanza HETA Clinical. ¿Dónde encaja OpenOnco?
    summary: El análisis de imágenes y la revisión de rutas con fuentes resuelven problemas distintos. El lanzamiento es real; la reducción de pruebas fallidas aún requiere evidencia clínica.
    body:
      - type: p
        text: "El 16 de octubre, Aignostics anunció cuatro herramientas HETA Clinical para imágenes digitales de portaobjetos completos teñidos con hematoxilina y eosina: calidad de la imagen, detección tumoral, recuento de mitosis y celularidad tumoral. Según la empresa, podrían ayudar a los laboratorios a priorizar casos y evitar pruebas moleculares fallidas. Su estimación de un 10–20 % de fallos procede de conversaciones con patólogos, no de una evaluación publicada de estas cuatro herramientas. La página del producto indica que es solo para investigación, no para procedimientos diagnósticos. Un preprint de junio sobre HETA evalúa la clasificación celular, no la reducción de pruebas fallidas ni mejores resultados para pacientes."
      - type: p
        text: "HETA analiza imágenes de tejido; el flujo gratuito de OpenOnco en el navegador organiza reglas oncológicas con fuentes y publica su código bajo licencia MIT. OpenOnco no evalúa portaobjetos ni cuenta células tumorales. Las páginas revisadas de Aignostics ofrecen solicitar una demostración, pero no indican el precio habitual ni una licencia pública para HETA Clinical. No hay evidencia comparativa directa de que una herramienta sea más precisa. La revisión de imágenes y la de evidencia pueden complementarse. Fuentes y comparación verificadas el 18 de octubre de 2026. Este texto es informativo y no sustituye a un profesional sanitario cualificado."
  pt:
    title: Aignostics lança HETA Clinical. Onde entra o OpenOnco?
    summary: A análise de imagens e a revisão de percursos com fontes resolvem problemas diferentes. O lançamento é real; menos testes falhados ainda exige provas clínicas.
    body:
      - type: p
        text: "Em 16 de outubro, a Aignostics anunciou quatro ferramentas HETA Clinical para imagens digitais de lâminas inteiras coradas com hematoxilina e eosina: qualidade da imagem, deteção de tumor, contagem de mitoses e celularidade tumoral. Segundo a empresa, podem ajudar os laboratórios a priorizar casos e evitar testes moleculares falhados. A estimativa de 10–20% de falhas vem de conversas com patologistas, não de uma avaliação publicada destas quatro ferramentas. A página do produto indica uso exclusivo em investigação, não em procedimentos diagnósticos. Um preprint de junho sobre o HETA avalia a classificação celular, não a redução de testes falhados nem melhores resultados para doentes."
      - type: p
        text: "O HETA analisa imagens de tecido; o fluxo gratuito do OpenOnco no navegador organiza regras oncológicas com fontes e publica o código sob licença MIT. O OpenOnco não avalia lâminas nem conta células tumorais. As páginas consultadas da Aignostics permitem pedir uma demonstração, mas não indicam o preço habitual nem uma licença pública para o HETA Clinical. Não há prova comparativa direta de maior precisão de qualquer ferramenta. A revisão de imagens e a da evidência podem complementar-se. Fontes e comparação verificadas em 18 de outubro de 2026. Este texto é informativo e não substitui um profissional de saúde qualificado."
  de:
    title: Aignostics startet HETA Clinical. Wo steht OpenOnco?
    summary: Bildanalyse und quellenbasierte Prüfung von Behandlungspfaden lösen verschiedene Aufgaben. Ob weniger Tests scheitern, muss klinisch belegt werden.
    body:
      - type: p
        text: "Am 16. Oktober kündigte Aignostics vier HETA-Clinical-Werkzeuge für digitale Hämatoxylin-Eosin-Ganzschnittbilder an: Prüfung der Bildqualität, Tumorerkennung, Mitosezählung und Bestimmung des Tumorzellanteils. Laut Unternehmen könnten sie Laboren helfen, Fälle zu priorisieren und fehlgeschlagene molekulare Tests zu vermeiden. Die Schätzung von 10–20 % fehlgeschlagenen Tests beruht auf Gesprächen mit Pathologen, nicht auf einer veröffentlichten Bewertung dieser vier Werkzeuge. Die Produktseite kennzeichnet sie als nur für Forschungszwecke und nicht für diagnostische Verfahren. Ein HETA-Preprint vom Juni prüft die Zellklassifikation, nicht weniger Testausfälle oder bessere Behandlungsergebnisse."
      - type: p
        text: "HETA analysiert Gewebebilder; OpenOncos kostenloser Browser-Ablauf ordnet onkologische Regeln mit Quellen und veröffentlicht seinen Code unter der MIT-Lizenz. OpenOnco bewertet keine Schnitte und zählt keine Tumorzellen. Die geprüften Aignostics-Seiten bieten eine Demo auf Anfrage, nennen aber weder einen regulären Preis noch eine öffentliche Lizenz für HETA Clinical. Es gibt keinen direkten Beleg, dass eines der Werkzeuge genauer ist. Bildqualitäts- und Evidenzprüfung können sich ergänzen. Quellen und Vergleich geprüft am 18. Oktober 2026. Dieser Hintergrundtext ersetzt keine qualifizierte ärztliche Beratung."
  fr:
    title: Aignostics lance HETA Clinical. Quelle place pour OpenOnco ?
    summary: L'analyse d'images et l'examen de parcours sourcés répondent à des besoins distincts. La baisse des tests échoués reste à démontrer cliniquement.
    body:
      - type: p
        text: "Le 16 octobre, Aignostics a annoncé quatre outils HETA Clinical pour les images numériques de lames entières colorées à l'hématoxyline-éosine : contrôle de la qualité, détection tumorale, comptage des mitoses et mesure de la cellularité tumorale. Selon l'entreprise, ils pourraient aider les laboratoires à hiérarchiser les cas et à éviter des tests moléculaires infructueux. Son estimation de 10 à 20 % d'échecs vient d'échanges avec des pathologistes, pas d'une évaluation publiée de ces quatre outils. La page du produit précise : réservé à la recherche, pas aux procédures diagnostiques. Une prépublication de juin sur HETA évalue la classification cellulaire, pas la réduction des échecs ni l'amélioration des résultats pour les patients."
      - type: p
        text: "HETA analyse des images de tissus ; l'outil gratuit d'OpenOnco dans le navigateur organise des règles oncologiques sourcées et publie son code sous licence MIT. OpenOnco n'évalue pas les lames et ne compte pas les cellules tumorales. Les pages d'Aignostics consultées proposent une démonstration, sans indiquer de prix courant ni de licence publique pour HETA Clinical. Aucune comparaison directe ne montre qu'un outil est plus précis. L'examen des images et celui des données probantes peuvent se compléter. Sources et comparaison vérifiées le 18 octobre 2026. Ce texte informatif ne remplace pas un avis médical qualifié."
  it:
    title: Aignostics lancia HETA Clinical. Dove si colloca OpenOnco?
    summary: Analisi delle immagini e revisione di percorsi con fonti affrontano problemi diversi. La riduzione dei test falliti richiede ancora prove cliniche.
    body:
      - type: p
        text: "Il 16 ottobre Aignostics ha annunciato quattro strumenti HETA Clinical per immagini digitali di vetrini interi colorati con ematossilina ed eosina: qualità dell'immagine, rilevamento del tumore, conteggio delle mitosi e cellularità tumorale. Secondo l'azienda, potrebbero aiutare i laboratori a dare priorità ai casi ed evitare test molecolari falliti. La stima del 10–20% di fallimenti deriva da colloqui con patologi, non da una valutazione pubblicata di questi quattro strumenti. La pagina del prodotto li indica come solo per la ricerca, non per procedure diagnostiche. Un preprint di giugno su HETA valuta la classificazione cellulare, non la riduzione dei test falliti o il miglioramento degli esiti per i pazienti."
      - type: p
        text: "HETA analizza immagini tissutali; il flusso gratuito di OpenOnco nel browser organizza regole oncologiche con fonti e pubblica il codice con licenza MIT. OpenOnco non valuta vetrini né conta cellule tumorali. Le pagine consultate di Aignostics invitano a richiedere una demo, ma non indicano un prezzo ordinario né una licenza pubblica per HETA Clinical. Nessuna prova comparativa diretta dimostra che uno strumento sia più accurato. La revisione delle immagini e quella delle prove possono integrarsi. Fonti e confronto verificati il 18 ottobre 2026. Questo testo informativo non sostituisce il parere di un medico qualificato."
  da:
    title: Aignostics lancerer HETA Clinical. Hvor passer OpenOnco ind?
    summary: Billedanalyse og kildebelagt gennemgang af behandlingsforløb løser forskellige opgaver. Færre mislykkede test kræver stadig klinisk dokumentation.
    body:
      - type: p
        text: "Den 16. oktober annoncerede Aignostics fire HETA Clinical-værktøjer til digitale helsnitsbilleder farvet med hæmatoxylin og eosin: kontrol af billedkvalitet, tumordetektion, mitosetælling og måling af tumorcelleandel. Ifølge virksomheden kan de hjælpe laboratorier med at prioritere sager og undgå mislykkede molekylære test. Dens skøn på 10–20 % mislykkede test bygger på samtaler med patologer, ikke en offentliggjort evaluering af de fire værktøjer. Produktsiden angiver kun forskningsbrug, ikke diagnostiske procedurer. Et HETA-præprint fra juni vurderer celleklassifikation, ikke færre mislykkede test eller bedre patientresultater."
      - type: p
        text: "HETA analyserer vævsbilleder; OpenOncos gratis browserforløb organiserer onkologiske regler med kilder og udgiver koden under MIT-licens. OpenOnco vurderer ikke vævssnit og tæller ikke tumorceller. De gennemgåede Aignostics-sider tilbyder en demo efter forespørgsel, men oplyser hverken normal pris eller offentlig licens for HETA Clinical. Ingen direkte sammenligning viser, at det ene værktøj er mere præcist. Billedkvalitetskontrol og evidensgennemgang kan supplere hinanden. Kilder og sammenligning kontrolleret 18. oktober 2026. Dette er baggrundsinformation og erstatter ikke kvalificeret lægelig rådgivning."
  sv:
    title: Aignostics lanserar HETA Clinical. Var passar OpenOnco in?
    summary: Bildanalys och källbelagd granskning av vårdvägar löser olika uppgifter. Färre misslyckade tester behöver fortfarande kliniskt stöd.
    body:
      - type: p
        text: "Den 16 oktober tillkännagav Aignostics fyra HETA Clinical-verktyg för digitala helglasbilder färgade med hematoxylin och eosin: kontroll av bildkvalitet, tumördetektion, mitosräkning och mätning av tumörcellshalt. Enligt företaget kan de hjälpa laboratorier att prioritera fall och undvika misslyckade molekylära tester. Uppskattningen att 10–20 % av testerna misslyckas bygger på samtal med patologer, inte på en publicerad utvärdering av de fyra verktygen. Produktsidan anger endast forskningsbruk, inte diagnostiska förfaranden. Ett HETA-preprint från juni utvärderar cellklassificering, inte färre misslyckade tester eller bättre patientutfall."
      - type: p
        text: "HETA analyserar vävnadsbilder; OpenOncos kostnadsfria webbläsarflöde ordnar onkologiska regler med källor och publicerar koden under MIT-licens. OpenOnco bedömer inte glas och räknar inte tumörceller. De granskade Aignostics-sidorna erbjuder demo på begäran men anger varken ordinarie pris eller offentlig licens för HETA Clinical. Ingen direkt jämförelse visar att något av verktygen är mer träffsäkert. Bildkvalitetskontroll och evidensgranskning kan komplettera varandra. Källor och jämförelse kontrollerade den 18 oktober 2026. Texten är bakgrundsinformation och ersätter inte kvalificerad medicinsk rådgivning."
  nb:
    title: Aignostics lanserer HETA Clinical. Hvor passer OpenOnco inn?
    summary: Bildeanalyse og kildebasert gjennomgang av behandlingsløp løser ulike oppgaver. Færre mislykkede tester trenger fortsatt klinisk dokumentasjon.
    body:
      - type: p
        text: "16. oktober kunngjorde Aignostics fire HETA Clinical-verktøy for digitale helsnittsbilder farget med hematoksylin og eosin: kontroll av bildekvalitet, påvisning av tumor, telling av mitoser og måling av tumorcelleandel. Ifølge selskapet kan de hjelpe laboratorier med å prioritere prøver og unngå mislykkede molekylære tester. Anslaget om at 10–20 % av testene mislykkes, bygger på samtaler med patologer, ikke en publisert evaluering av disse fire verktøyene. Produktsiden angir kun forskningsbruk, ikke diagnostiske prosedyrer. Et HETA-preprint fra juni vurderer celleklassifisering, ikke færre mislykkede tester eller bedre pasientutfall."
      - type: p
        text: "HETA analyserer vevsbilder; OpenOncos gratis nettleserløsning organiserer onkologiske regler med kilder og publiserer koden under MIT-lisens. OpenOnco vurderer ikke snitt og teller ikke tumorceller. Aignostics-sidene som ble gjennomgått, tilbyr demo på forespørsel, men oppgir verken ordinær pris eller offentlig lisens for HETA Clinical. Ingen direkte sammenligning viser at ett av verktøyene er mer nøyaktig. Kontroll av bildekvalitet og gjennomgang av evidens kan utfylle hverandre. Kilder og sammenligning kontrollert 18. oktober 2026. Dette er bakgrunnsinformasjon og erstatter ikke kvalifisert medisinsk rådgivning."
  fi:
    title: Aignostics julkaisi HETA Clinicalin. Mihin OpenOnco sopii?
    summary: Kuvanalyysi ja lähteistettyjen hoitopolkujen tarkastelu ratkaisevat eri ongelmia. Väite epäonnistuneiden testien vähenemisestä tarvitsee kliinistä näyttöä.
    body:
      - type: p
        text: "Aignostics ilmoitti 16. lokakuuta neljästä HETA Clinical -työkalusta hematoksyliinillä ja eosiinilla värjättyjen kokonaisten kudosleikkeiden digikuviin: kuvan laadun arviointi, kasvaimen tunnistus, mitoosien laskenta ja kasvainsolujen osuuden arviointi. Yrityksen mukaan ne voivat auttaa laboratorioita priorisoimaan tapauksia ja välttämään epäonnistuneita molekyylitestejä. Arvio 10–20 prosentin epäonnistumisesta perustuu patologien kanssa käytyihin keskusteluihin, ei näiden neljän työkalun julkaistuun arviointiin. Tuotesivu rajaa käytön tutkimukseen, ei diagnostisiin toimenpiteisiin. Kesäkuinen HETA-esijulkaisu arvioi solujen luokittelua, ei testien epäonnistumisen tai potilastulosten muutosta."
      - type: p
        text: "HETA analysoi kudoskuvia; OpenOncon maksuton selainpalvelu järjestää lähteistettyjä onkologisia sääntöjä ja julkaisee koodinsa MIT-lisenssillä. OpenOnco ei arvioi leikekuvia eikä laske kasvainsoluja. Tarkistetuilla Aignostics-sivuilla voi pyytää esittelyä, mutta niillä ei ilmoiteta HETA Clinicalin tavanomaista hintaa tai julkista lisenssiä. Suora vertailunäyttö ei osoita kumpaakaan tarkemmaksi. Kuvanlaadun tarkistus ja tutkimusnäytön arviointi voivat täydentää toisiaan. Lähteet ja vertailu tarkistettu 18. lokakuuta 2026. Tämä on taustatietoa, ei korvaa pätevän lääkärin arviota."
