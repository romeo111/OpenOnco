slug: nhs-galleri-primary-endpoint
date: 2026-09-22
published: 2026-10-16
kind: explainer
series: openonco-three-day
series_format: research
author: OpenOnco
tags: [research, screening, evidence]
title:
  en: A multicancer blood test missed its main screening goal
  uk: Аналіз крові на кілька видів раку не досяг головної мети скринінгу
summary:
  en: In a randomized trial of 142,250 people, adding the Galleri test did not reduce the combined rate of stage III–IV cancers across 12 prespecified types.
  uk: У рандомізованому дослідженні за участю 142 250 людей додавання тесту Galleri не знизило сукупну частоту раку III–IV стадії серед 12 заздалегідь визначених типів.
sources:
  - citation: "Sasieni P, et al. Effect of Screening with Multicancer Early-Detection Test on Late-Stage Cancer Diagnosis. N Engl J Med. Published online 22 September 2026."
    id: "10.1056/NEJMoa2505723"
  - citation: "Sasieni P, et al. NHS-Galleri: Primary results from a randomised controlled trial. J Clin Oncol. ASCO 2026 abstract LBA100; data current 26 May 2026."
    id: "10.1200/JCO.2026.44.17_suppl.LBA100"
  - citation: "NHS-Galleri trial registration. ClinicalTrials.gov."
    id: "https://clinicaltrials.gov/study/NCT05611632"
body:
  en:
    - type: p
      text: "The headline-friendly result was fewer stage IV diagnoses. The trial's prespecified main question was different: did adding the test reduce stage III and IV cancers combined? After three annual screening rounds, it did not."
    - type: p
      text: "The English NHS-Galleri trial randomly assigned 142,250 people aged 50–77: 71,122 had their blood tested and 71,128 had blood stored while receiving usual care. The test was added to routine care; the trial did not compare it with replacing established screening."
    - type: p
      text: "Across 12 prespecified cancer types, 706 people in the test group and 688 in the control group received a stage III or IV diagnosis. The incidence-rate ratio was 1.03 (95% confidence interval 0.92–1.14; P=0.63). That does not show a reduction in the primary outcome."
    - type: p
      text: "Stage IV alone, a key secondary outcome, occurred in 342 versus 397 people (incidence-rate ratio 0.86; 95% confidence interval 0.74–1.00). This signal deserves follow-up, but it does not reverse the negative primary result or yet establish fewer cancer deaths."
    - type: p
      text: "Fewer than 1% of participants had trial-related adverse events, with none classified as serious. Mortality, downstream investigations, psychological effects and possible overdiagnosis need further reporting. Results concern this test, these 12 cancers and this age group in England; they cannot be generalized to every cancer or screening decision."
    - type: p
      text: "Tumor Board lens, not a live run: imagine an asymptomatic 60-year-old asking whether a headline means this blood test can replace routine screening. That is a population-screening question, not a treatment case. The trial studied an addition to usual care, so it cannot answer the replacement question. This is an editorial draft for discussion, not individual guidance."
  uk:
    - type: p
      text: "Зручний для заголовків результат — менше діагнозів IV стадії. Але заздалегідь визначене головне питання було іншим: чи зменшує додатковий тест сукупну кількість випадків III та IV стадії? Після трьох щорічних раундів скринінгу — ні."
    - type: p
      text: "Англійське дослідження NHS-Galleri випадково розподілило 142 250 людей віком 50–77 років: у 71 122 зразок крові перевіряли тестом, у 71 128 його зберігали, а люди отримували звичайну медичну допомогу. Тест додавали до звичайної допомоги; заміну усталеного скринінгу не досліджували."
    - type: p
      text: "Серед 12 заздалегідь визначених типів раку діагноз III або IV стадії отримали 706 людей у групі тесту і 688 у контрольній групі. Відношення частот становило 1,03 (95% довірчий інтервал 0,92–1,14; P=0,63). Зменшення за головним показником дослідження не показано."
    - type: p
      text: "Лише IV стадію, важливий вторинний показник, діагностували у 342 проти 397 людей (відношення частот 0,86; 95% довірчий інтервал 0,74–1,00). Цей сигнал потребує подальшого спостереження, але не змінює негативного результату за головним показником і поки не доводить зменшення смертності від раку."
    - type: p
      text: "Менш ніж у 1% учасників зафіксували пов’язані з дослідженням небажані явища; серйозних серед них не було. Дані про смертність, подальші обстеження, психологічні наслідки й можливу надмірну діагностику ще потребують публікації. Висновки стосуються саме цього тесту, цих 12 типів раку та цієї вікової групи в Англії."
    - type: p
      text: "Погляд Туморборду, без реального запуску: уявімо людину 60 років без симптомів, яка питає, чи означає заголовок можливість замінити звичайний скринінг цим аналізом. Це питання популяційного скринінгу, а не випадок вибору лікування. Досліджували додавання тесту до звичайної допомоги, тому на питання заміни воно не відповідає. Це редакційна чернетка для обговорення, не індивідуальна порада."
translations:
  es:
    title: El análisis de sangre multicáncer no alcanzó su principal objetivo
    summary: En un ensayo aleatorizado de 142 250 personas, añadir Galleri no redujo la tasa conjunta de cánceres en estadio III–IV de 12 tipos predefinidos.
    body:
      - type: p
        text: "El dato más atractivo para un titular fue que hubo menos diagnósticos en estadio IV. Pero la pregunta principal, fijada antes del ensayo, era otra: ¿reducía el test los cánceres en estadios III y IV combinados? Tras tres rondas anuales de cribado, no lo hizo."
      - type: p
        text: "El ensayo NHS-Galleri en Inglaterra asignó al azar a 142 250 personas de 50–77 años: se analizó la sangre de 71 122 y se almacenó la de 71 128 mientras recibían la atención habitual. El test se añadió a esa atención; no se estudió como sustituto del cribado establecido."
      - type: p
        text: "En los 12 tipos de cáncer predefinidos, 706 personas del grupo del test y 688 del grupo control recibieron un diagnóstico en estadio III o IV. La razón de tasas de incidencia fue 1,03 (intervalo de confianza del 95%: 0,92–1,14; P=0,63). No se demostró una reducción en el resultado principal."
      - type: p
        text: "El estadio IV por separado, un resultado secundario importante, se diagnosticó en 342 frente a 397 personas (razón de tasas 0,86; intervalo de confianza del 95%: 0,74–1,00). Es una señal que merece seguimiento, pero no cambia el resultado principal negativo ni demuestra aún menos muertes por cáncer."
      - type: p
        text: "Menos del 1% de los participantes tuvo acontecimientos adversos relacionados con el ensayo; ninguno fue grave. Falta informar más sobre mortalidad, pruebas posteriores, efectos psicológicos y posible sobrediagnóstico. Los datos se refieren a este test, estos 12 cánceres y esta edad en Inglaterra; no se pueden extender a toda decisión de cribado."
      - type: p
        text: "Mirada del Tumor Board, sin ejecución real: imaginemos a una persona asintomática de 60 años que pregunta si el titular permite sustituir el cribado habitual por este análisis. Es una pregunta de cribado poblacional, no un caso de tratamiento. El ensayo estudió añadir el test, por lo que no responde a la pregunta sobre sustituirlo. Es un borrador editorial para conversar, no una recomendación individual."
  pt:
    title: O teste sanguíneo multicancro não atingiu o objetivo principal
    summary: Num ensaio aleatorizado com 142 250 pessoas, acrescentar o Galleri não reduziu a taxa conjunta de cancros em estádio III–IV de 12 tipos predefinidos.
    body:
      - type: p
        text: "O resultado mais apelativo para manchetes foi o menor número de diagnósticos em estádio IV. Mas a pergunta principal, definida antes do ensaio, era outra: o teste reduzia os cancros em estádios III e IV em conjunto? Após três rondas anuais de rastreio, não reduziu."
      - type: p
        text: "O ensaio inglês NHS-Galleri distribuiu aleatoriamente 142 250 pessoas dos 50 aos 77 anos: analisou-se o sangue de 71 122 e armazenou-se o de 71 128, que receberam os cuidados habituais. O teste foi acrescentado a esses cuidados; não se estudou a substituição do rastreio estabelecido."
      - type: p
        text: "Nos 12 tipos de cancro predefinidos, 706 pessoas no grupo do teste e 688 no grupo de controlo tiveram diagnóstico em estádio III ou IV. A razão das taxas de incidência foi 1,03 (intervalo de confiança de 95%: 0,92–1,14; P=0,63). Não se demonstrou redução no resultado principal."
      - type: p
        text: "O estádio IV isoladamente, um resultado secundário importante, foi diagnosticado em 342 contra 397 pessoas (razão das taxas 0,86; intervalo de confiança de 95%: 0,74–1,00). É um sinal a acompanhar, mas não altera o resultado principal negativo nem demonstra ainda menos mortes por cancro."
      - type: p
        text: "Menos de 1% dos participantes teve acontecimentos adversos relacionados com o ensaio; nenhum foi grave. Faltam mais dados sobre mortalidade, exames subsequentes, efeitos psicológicos e possível sobrediagnóstico. Os resultados dizem respeito a este teste, estes 12 cancros e esta faixa etária em Inglaterra; não se estendem a todas as decisões de rastreio."
      - type: p
        text: "Perspetiva do Tumor Board, sem execução real: imaginemos uma pessoa assintomática de 60 anos que pergunta se a manchete permite substituir o rastreio habitual por esta análise. É uma questão de rastreio populacional, não um caso de tratamento. O ensaio estudou a adição do teste e não responde à questão da substituição. É um rascunho editorial para discussão, não aconselhamento individual."
  de:
    title: Multikrebs-Bluttest verfehlte sein wichtigstes Screeningziel
    summary: In einer randomisierten Studie mit 142 250 Personen senkte Galleri zusätzlich zur üblichen Versorgung die gemeinsame Rate von Krebs im Stadium III–IV bei zwölf vorab festgelegten Krebsarten nicht.
    body:
      - type: p
        text: "Für Schlagzeilen attraktiv war die geringere Zahl von Diagnosen im Stadium IV. Die vorab festgelegte Hauptfrage war jedoch eine andere: Verringert der zusätzliche Test die Zahl der Diagnosen in den Stadien III und IV zusammen? Nach drei jährlichen Screeningrunden tat er das nicht."
      - type: p
        text: "In der englischen NHS-Galleri-Studie wurden 142 250 Menschen im Alter von 50–77 Jahren zufällig zugeteilt: Bei 71 122 wurde die Blutprobe getestet, bei 71 128 eingelagert, während sie die übliche Versorgung erhielten. Der Test kam zusätzlich hinzu; ein Ersatz etablierter Früherkennungsangebote wurde nicht untersucht."
      - type: p
        text: "Bei zwölf vorab festgelegten Krebsarten erhielten 706 Menschen in der Testgruppe und 688 in der Kontrollgruppe eine Diagnose im Stadium III oder IV. Das Inzidenzratenverhältnis betrug 1,03 (95%-Konfidenzintervall 0,92–1,14; P=0,63). Der primäre Endpunkt zeigte keine Verringerung."
      - type: p
        text: "Stadium IV allein, ein wichtiger sekundärer Endpunkt, wurde bei 342 gegenüber 397 Menschen diagnostiziert (Ratenverhältnis 0,86; 95%-Konfidenzintervall 0,74–1,00). Dieses Signal verdient weitere Beobachtung, ändert aber das negative Primärergebnis nicht und belegt noch keine geringere Krebssterblichkeit."
      - type: p
        text: "Weniger als 1% der Teilnehmenden hatte studienbezogene unerwünschte Ereignisse; keines war schwerwiegend. Zu Sterblichkeit, Folgeuntersuchungen, psychischen Folgen und möglicher Überdiagnose sind weitere Berichte nötig. Die Ergebnisse betreffen diesen Test, diese zwölf Krebsarten und diese Altersgruppe in England, nicht jede Screeningentscheidung."
      - type: p
        text: "Tumor-Board-Perspektive, kein Live-Lauf: Man stelle sich eine beschwerdefreie 60-jährige Person vor, die fragt, ob die Schlagzeile den Ersatz üblicher Früherkennung durch diesen Bluttest rechtfertigt. Das ist eine Frage des Bevölkerungsscreenings, kein Behandlungsfall. Die Studie prüfte einen Zusatz zur üblichen Versorgung und kann die Ersatzfrage nicht beantworten. Dies ist ein redaktioneller Gesprächsentwurf, keine individuelle Empfehlung."
  fr:
    title: Le test sanguin multicancer n’a pas atteint son objectif principal
    summary: Dans un essai randomisé de 142 250 personnes, l’ajout de Galleri n’a pas réduit le taux combiné de cancers de stade III–IV parmi douze types prédéfinis.
    body:
      - type: p
        text: "Le résultat qui se prête aux gros titres était la diminution des diagnostics au stade IV. Mais la question principale, définie à l’avance, était différente : l’ajout du test réduisait-il les cancers de stades III et IV pris ensemble ? Après trois campagnes annuelles de dépistage, non."
      - type: p
        text: "L’essai anglais NHS-Galleri a réparti au hasard 142 250 personnes de 50 à 77 ans : le sang de 71 122 personnes a été analysé et celui de 71 128 autres conservé, avec les soins habituels. Le test s’ajoutait à ces soins ; son remplacement du dépistage établi n’a pas été étudié."
      - type: p
        text: "Pour douze types de cancer prédéfinis, 706 personnes du groupe testé et 688 du groupe témoin ont reçu un diagnostic de stade III ou IV. Le rapport des taux d’incidence était de 1,03 (intervalle de confiance à 95% : 0,92–1,14 ; P=0,63). Le critère principal ne montre pas de réduction."
      - type: p
        text: "Le stade IV seul, critère secondaire important, a été diagnostiqué chez 342 contre 397 personnes (rapport des taux 0,86 ; intervalle de confiance à 95% : 0,74–1,00). Ce signal mérite un suivi, mais ne change pas le résultat principal négatif et ne démontre pas encore une baisse des décès par cancer."
      - type: p
        text: "Moins de 1% des participants ont eu un événement indésirable lié à l’essai ; aucun n’était grave. Il faut encore des données sur la mortalité, les examens ultérieurs, les effets psychologiques et un éventuel surdiagnostic. Les résultats concernent ce test, ces douze cancers et cette tranche d’âge en Angleterre, pas toute décision de dépistage."
      - type: p
        text: "Regard du Tumor Board, sans lancement réel : imaginons une personne de 60 ans sans symptôme demandant si le titre permet de remplacer le dépistage habituel par cette analyse. C’est une question de dépistage en population, pas un cas de traitement. L’essai a étudié un ajout aux soins habituels et ne répond pas à la question du remplacement. Il s’agit d’un brouillon éditorial pour la discussion, pas d’un conseil individuel."
  it:
    title: Il test sanguigno multicancro non ha raggiunto l’obiettivo principale
    summary: In uno studio randomizzato su 142 250 persone, aggiungere Galleri non ha ridotto il tasso combinato di tumori allo stadio III–IV fra dodici tipi prestabiliti.
    body:
      - type: p
        text: "Il dato più adatto ai titoli era il minor numero di diagnosi allo stadio IV. Ma la domanda principale, definita in anticipo, era diversa: aggiungere il test riduceva i tumori agli stadi III e IV considerati insieme? Dopo tre cicli annuali di screening, no."
      - type: p
        text: "Lo studio inglese NHS-Galleri ha assegnato casualmente 142 250 persone di 50–77 anni: il sangue di 71 122 è stato analizzato e quello di 71 128 conservato, mentre ricevevano le cure abituali. Il test si aggiungeva a queste cure; non è stato studiato come sostituto dello screening consolidato."
      - type: p
        text: "Per dodici tipi di tumore prestabiliti, 706 persone nel gruppo del test e 688 nel gruppo di controllo hanno ricevuto una diagnosi allo stadio III o IV. Il rapporto tra i tassi di incidenza era 1,03 (intervallo di confidenza al 95%: 0,92–1,14; P=0,63). Non è emersa una riduzione dell’esito principale."
      - type: p
        text: "Il solo stadio IV, importante esito secondario, è stato diagnosticato in 342 contro 397 persone (rapporto tra i tassi 0,86; intervallo di confidenza al 95%: 0,74–1,00). È un segnale da seguire, ma non modifica l’esito principale negativo e non dimostra ancora una minore mortalità per cancro."
      - type: p
        text: "Meno dell’1% dei partecipanti ha avuto eventi avversi legati allo studio; nessuno è stato grave. Servono ulteriori dati su mortalità, accertamenti successivi, effetti psicologici e possibile sovradiagnosi. I risultati riguardano questo test, questi dodici tumori e questa fascia d’età in Inghilterra, non ogni scelta di screening."
      - type: p
        text: "Prospettiva del Tumor Board, senza uso dal vivo: immaginiamo una persona di 60 anni senza sintomi che chiede se il titolo consenta di sostituire lo screening abituale con questo esame. È una questione di screening di popolazione, non un caso terapeutico. Lo studio ha valutato l’aggiunta del test e non risponde alla domanda sulla sostituzione. È una bozza editoriale per discutere, non un consiglio individuale."
  da:
    title: Blodprøve for flere kræftformer nåede ikke sit vigtigste screeningsmål
    summary: I et randomiseret forsøg med 142 250 personer sænkede Galleri som tillæg til sædvanlig behandling ikke den samlede forekomst af kræft i stadie III–IV blandt tolv forudvalgte kræftformer.
    body:
      - type: p
        text: "Det mest overskriftsvenlige resultat var færre diagnoser i stadie IV. Men det på forhånd fastlagte hovedspørgsmål var et andet: Mindskede den ekstra test kræft i stadie III og IV tilsammen? Efter tre årlige screeningsrunder gjorde den ikke."
      - type: p
        text: "Det engelske NHS-Galleri-forsøg fordelte tilfældigt 142 250 personer på 50–77 år: Blodet fra 71 122 blev testet, mens blodet fra 71 128 blev opbevaret, og de fik sædvanlig behandling. Testen blev lagt oveni; den blev ikke undersøgt som erstatning for etableret screening."
      - type: p
        text: "For tolv på forhånd udvalgte kræftformer fik 706 i testgruppen og 688 i kontrolgruppen en diagnose i stadie III eller IV. Incidensrateratioen var 1,03 (95% konfidensinterval 0,92–1,14; P=0,63). Det primære resultat viste ingen reduktion."
      - type: p
        text: "Stadie IV alene, et vigtigt sekundært mål, blev diagnosticeret hos 342 mod 397 personer (rateratio 0,86; 95% konfidensinterval 0,74–1,00). Signalet bør følges, men ændrer ikke det negative primære resultat og dokumenterer endnu ikke færre kræftdødsfald."
      - type: p
        text: "Under 1% af deltagerne havde forsøgsrelaterede bivirkninger; ingen var alvorlige. Der mangler mere viden om dødelighed, efterfølgende undersøgelser, psykiske følger og mulig overdiagnostik. Resultaterne gælder denne test, disse tolv kræftformer og denne aldersgruppe i England, ikke enhver beslutning om screening."
      - type: p
        text: "Tumor Board-perspektiv, ikke et live-kørselsresultat: Forestil dig en symptomfri 60-årig, der spørger, om overskriften betyder, at blodprøven kan erstatte almindelig screening. Det er et spørgsmål om befolkningsscreening, ikke et behandlingsforløb. Forsøget undersøgte et tillæg til sædvanlig behandling og besvarer ikke spørgsmålet om erstatning. Dette er et redaktionelt udkast til drøftelse, ikke individuel rådgivning."
  sv:
    title: Blodprov för flera cancerformer nådde inte sitt främsta screeningmål
    summary: I en randomiserad studie med 142 250 personer minskade Galleri som tillägg till ordinarie vård inte den samlade förekomsten av cancer i stadium III–IV bland tolv förutbestämda cancerformer.
    body:
      - type: p
        text: "Det mest rubrikvänliga resultatet var färre diagnoser i stadium IV. Men den i förväg bestämda huvudfrågan var en annan: Minskade det extra testet cancer i stadium III och IV sammantaget? Efter tre årliga screeningomgångar gjorde det inte det."
      - type: p
        text: "Den engelska NHS-Galleri-studien lottade 142 250 personer i åldern 50–77 år: Blodet från 71 122 testades, medan blodet från 71 128 lagrades och de fick ordinarie vård. Testet lades till vården; det undersöktes inte som ersättning för etablerad screening."
      - type: p
        text: "För tolv förutbestämda cancerformer fick 706 personer i testgruppen och 688 i kontrollgruppen en diagnos i stadium III eller IV. Incidenskvoten var 1,03 (95% konfidensintervall 0,92–1,14; P=0,63). Det primära utfallet visade ingen minskning."
      - type: p
        text: "Stadium IV för sig, ett viktigt sekundärt utfall, diagnostiserades hos 342 jämfört med 397 personer (incidenskvot 0,86; 95% konfidensintervall 0,74–1,00). Signalen behöver följas upp men ändrar inte det negativa primärresultatet och visar ännu inte färre dödsfall i cancer."
      - type: p
        text: "Färre än 1% av deltagarna hade studierelaterade biverkningar; ingen var allvarlig. Fler uppgifter behövs om dödlighet, fortsatta undersökningar, psykiska effekter och möjlig överdiagnostik. Resultaten gäller detta test, dessa tolv cancerformer och denna åldersgrupp i England, inte varje beslut om screening."
      - type: p
        text: "Tumor Board-perspektiv, ingen verklig körning: Tänk dig en symtomfri 60-åring som frågar om rubriken betyder att blodprovet kan ersätta vanlig screening. Det är en fråga om befolkningsscreening, inte ett behandlingsfall. Studien prövade ett tillägg till ordinarie vård och kan inte besvara frågan om ersättning. Detta är ett redaktionellt diskussionsutkast, inte individuella råd."
  nb:
    title: Blodprøve for flere kreftformer nådde ikke hovedmålet for screening
    summary: I en randomisert studie med 142 250 personer reduserte ikke Galleri som tillegg til vanlig helsehjelp den samlede forekomsten av kreft i stadium III–IV blant tolv forhåndsbestemte kreftformer.
    body:
      - type: p
        text: "Det mest overskriftsvennlige funnet var færre diagnoser i stadium IV. Men det forhåndsbestemte hovedspørsmålet var et annet: Reduserte den ekstra testen kreft i stadium III og IV samlet? Etter tre årlige screeningrunder gjorde den ikke det."
      - type: p
        text: "Den engelske NHS-Galleri-studien fordelte tilfeldig 142 250 personer i alderen 50–77 år: Blodet til 71 122 ble testet, mens blodet til 71 128 ble lagret og de fikk vanlig helsehjelp. Testen kom i tillegg; den ble ikke undersøkt som erstatning for etablert screening."
      - type: p
        text: "For tolv forhåndsbestemte kreftformer fikk 706 personer i testgruppen og 688 i kontrollgruppen en diagnose i stadium III eller IV. Insidensrateratioen var 1,03 (95% konfidensintervall 0,92–1,14; P=0,63). Det primære utfallet viste ingen reduksjon."
      - type: p
        text: "Stadium IV alene, et viktig sekundært utfall, ble diagnostisert hos 342 mot 397 personer (rateratio 0,86; 95% konfidensintervall 0,74–1,00). Signalet bør følges opp, men endrer ikke det negative primærresultatet og dokumenterer ennå ikke færre dødsfall av kreft."
      - type: p
        text: "Færre enn 1% av deltakerne hadde studierelaterte uønskede hendelser; ingen var alvorlige. Det trengs mer informasjon om dødelighet, videre undersøkelser, psykiske følger og mulig overdiagnostikk. Resultatene gjelder denne testen, disse tolv kreftformene og denne aldersgruppen i England, ikke enhver beslutning om screening."
      - type: p
        text: "Tumor Board-perspektiv, uten faktisk kjøring: Tenk deg en symptomfri 60-åring som spør om overskriften betyr at blodprøven kan erstatte vanlig screening. Det gjelder befolkningsscreening, ikke et behandlingstilfelle. Studien undersøkte et tillegg til vanlig helsehjelp og kan ikke svare på spørsmålet om erstatning. Dette er et redaksjonelt utkast til samtale, ikke individuelle råd."
  fi:
    title: Usean syövän verikoe ei saavuttanut seulonnan päätavoitetta
    summary: Satunnaistetussa 142 250 henkilön tutkimuksessa Galleri-testin lisääminen tavanomaiseen hoitoon ei vähentänyt 12 ennalta määritellyn syöpätyypin III–IV vaiheen syöpien yhteistä ilmaantuvuutta.
    body:
      - type: p
        text: "Otsikoihin sopiva tulos oli IV vaiheen diagnoosien pienempi määrä. Ennalta määritelty pääkysymys oli kuitenkin toinen: vähensikö lisätesti III ja IV vaiheen syöpiä yhteensä? Kolmen vuosittaisen seulontakierroksen jälkeen näin ei ollut."
      - type: p
        text: "Englannissa tehdyssä NHS-Galleri-tutkimuksessa 142 250 iältään 50–77-vuotiasta henkilöä satunnaistettiin: 71 122:n verinäyte testattiin ja 71 128:n näyte säilytettiin heidän saadessaan tavanomaista hoitoa. Testi lisättiin tavanomaiseen hoitoon; vakiintuneen seulonnan korvaamista ei tutkittu."
      - type: p
        text: "Kahdessatoista ennalta määritellyssä syöpätyypissä 706 testiryhmän ja 688 vertailuryhmän henkilöä sai III tai IV vaiheen diagnoosin. Ilmaantuvuussuhde oli 1,03 (95%:n luottamusväli 0,92–1,14; P=0,63). Ensisijaisessa tuloksessa ei osoitettu vähennystä."
      - type: p
        text: "Pelkkä IV vaihe, tärkeä toissijainen tulos, todettiin 342:lla verrattuna 397 henkilöön (ilmaantuvuussuhde 0,86; 95%:n luottamusväli 0,74–1,00). Havainto vaatii seurantaa, mutta ei muuta kielteistä päätulosta eikä vielä osoita syöpäkuolleisuuden vähenevän."
      - type: p
        text: "Alle 1%:lla osallistujista oli tutkimukseen liittyviä haittatapahtumia; yksikään ei ollut vakava. Kuolleisuudesta, jatkotutkimuksista, psyykkisistä vaikutuksista ja mahdollisesta ylidiagnostiikasta tarvitaan lisää tietoa. Tulokset koskevat tätä testiä, näitä kahtatoista syöpätyyppiä ja tätä ikäryhmää Englannissa, eivät kaikkia seulontapäätöksiä."
      - type: p
        text: "Tumor Board -näkökulma, ei todellinen ajo: Kuvitellaan oireeton 60-vuotias, joka kysyy, voiko verikoe otsikon perusteella korvata tavallisen seulonnan. Se on väestöseulontaa koskeva kysymys, ei hoitotapaus. Tutkimuksessa testattiin lisäystä tavanomaiseen hoitoon, joten se ei vastaa korvaamista koskevaan kysymykseen. Tämä on keskustelua varten laadittu toimituksellinen luonnos, ei henkilökohtainen ohje."
