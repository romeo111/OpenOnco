slug: prevision-open-source-comparison
date: 2026-09-24
published: 2026-10-17
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, open-source, evidence]
title:
  en: Prevision raised $5.4m. What does open source offer?
  uk: Prevision залучила $5,4 млн. Що дає відкритий код?
summary:
  en: The lab assay and OpenOnco answer different questions. Open code makes rules inspectable; funding alone says nothing about patient outcomes.
  uk: Лабораторний тест і OpenOnco відповідають на різні запитання. Відкритий код дозволяє перевіряти правила; саме фінансування не доводить користі для пацієнтів.
sources:
  - citation: "Prevision Medicine. Press release announcing a $5.4m seed round. 24 September 2026."
    id: "https://www.previsionmedicine.com/news/press-release-prevision-medicine-raises-5-4m-in-seed-funding-round"
  - citation: "Prevision Medicine. Products: PrevisionOne and disease-specific drug tests. Accessed 17 October 2026."
    id: "https://www.previsionmedicine.com/products"
  - citation: "OpenOnco. Public repository and README: licenses, deterministic engine, browser Plan Builder and limitations. Accessed 17 October 2026."
    id: "https://github.com/romeo111/OpenOnco"
body:
  en:
    - type: p
      text: "On 24 September, Prevision Medicine announced a $5.4m seed round for its functional oncology testing platform. According to the company, PrevisionOne measures how living tumor cells respond to drugs. The funding figure is its announcement, not an independently measured treatment benefit."
    - type: p
      text: "The overlap with OpenOnco is the treatment discussion, not the method. Prevision describes a proprietary laboratory assay requiring a patient sample; OpenOnco publishes source-linked deterministic rules and MIT-licensed code, with a free browser Plan Builder. A rule cannot measure a tumor's drug response, and a laboratory result does not replace guideline review."
    - type: p
      text: "Open source wins on a narrower, verifiable point: anyone can inspect, reuse and challenge OpenOnco's code. That does not establish better accuracy or patient outcomes than Prevision. The cited company pages do not provide a head-to-head comparison; their clinical claims need to be assessed on their own evidence."
    - type: p
      text: "Illustrative discussion only: a fictional tumor board receiving a drug-sensitivity report would check the assay's validation beside established evidence. OpenOnco could organize cited pathway options, but neither tool should choose treatment for a real person without qualified clinical review. Comparison checked 17 October 2026."
  uk:
    - type: p
      text: "24 вересня Prevision Medicine оголосила про залучення $5,4 млн початкового фінансування для платформи функціонального тестування в онкології. За описом компанії, PrevisionOne вимірює реакцію живих пухлинних клітин на ліки. Сума фінансування походить із повідомлення компанії, а не з незалежного вимірювання користі лікування."
    - type: p
      text: "Спільна з OpenOnco тема — обговорення лікування, але методи різні. Prevision описує власний лабораторний тест, для якого потрібен зразок пацієнта. OpenOnco публікує детерміновані правила з джерелами й код під ліцензією MIT та має безкоштовний браузерний конструктор планів. Правило не вимірює чутливість пухлини до ліків, а лабораторний результат не замінює аналізу настанов."
    - type: p
      text: "Перевага відкритого коду тут вужча й перевірювана: кожен може вивчити, повторно використати й оскаржити код OpenOnco. Це не доводить кращої точності чи результатів для пацієнтів порівняно з Prevision. Наведені сторінки компанії не містять прямого порівняння; клінічні твердження треба оцінювати за окремими доказами."
    - type: p
      text: "Лише умовне обговорення: вигаданий консиліум, отримавши звіт про чутливість до ліків, перевірив би валідацію тесту поруч із усталеними доказами. OpenOnco може впорядкувати варіанти з посиланнями, але жоден інструмент не має обирати лікування реальній людині без перевірки кваліфікованим лікарем. Порівняння перевірено 17 жовтня 2026 року."
translations:
  es:
    title: Prevision recaudó 5,4 millones de dólares. ¿Qué aporta el código abierto?
    summary: La prueba de laboratorio y OpenOnco responden preguntas distintas. El código abierto permite revisar las reglas; la financiación no demuestra resultados clínicos.
    body:
      - type: p
        text: "El 24 de septiembre, Prevision Medicine anunció una ronda inicial de 5,4 millones de dólares para su plataforma de pruebas funcionales en oncología. Según la empresa, PrevisionOne mide cómo responden a los fármacos las células tumorales vivas. La cifra procede de su comunicado, no de una medición independiente del beneficio terapéutico."
      - type: p
        text: "El punto común con OpenOnco es la discusión del tratamiento, no el método. Prevision describe una prueba de laboratorio propia que requiere una muestra del paciente; OpenOnco publica reglas deterministas con fuentes y código bajo licencia MIT, además de un generador de planes gratuito en el navegador. Una regla no mide la respuesta del tumor a un fármaco, y un resultado de laboratorio no sustituye la revisión de las guías."
      - type: p
        text: "La ventaja verificable del código abierto es más concreta: cualquiera puede examinar, reutilizar y cuestionar el código de OpenOnco. Eso no demuestra mayor precisión ni mejores resultados para pacientes que Prevision. Las páginas citadas de la empresa no ofrecen una comparación directa; sus afirmaciones clínicas requieren evaluar las pruebas correspondientes."
      - type: p
        text: "Ejemplo ficticio, sin consejo clínico: un comité oncológico que recibiera un informe de sensibilidad a fármacos comprobaría la validación de la prueba junto con la evidencia establecida. OpenOnco podría ordenar opciones con fuentes, pero ninguna herramienta debe elegir el tratamiento de una persona real sin revisión médica cualificada. Comparación verificada el 17 de octubre de 2026."
  pt:
    title: A Prevision angariou 5,4 milhões de dólares. O que oferece o código aberto?
    summary: O teste laboratorial e o OpenOnco respondem a perguntas diferentes. O código aberto permite inspecionar as regras; o financiamento não demonstra resultados clínicos.
    body:
      - type: p
        text: "Em 24 de setembro, a Prevision Medicine anunciou uma ronda inicial de 5,4 milhões de dólares para a sua plataforma de testes funcionais em oncologia. Segundo a empresa, o PrevisionOne mede a resposta de células tumorais vivas aos medicamentos. O valor vem do comunicado da empresa, não de uma medição independente de benefício terapêutico."
      - type: p
        text: "O ponto comum com o OpenOnco é a discussão do tratamento, não o método. A Prevision descreve um teste laboratorial próprio que exige uma amostra do doente; o OpenOnco publica regras determinísticas com fontes e código sob licença MIT, além de um construtor de planos gratuito no navegador. Uma regra não mede a resposta de um tumor a um fármaco, e um resultado laboratorial não substitui a análise das orientações clínicas."
      - type: p
        text: "A vantagem verificável do código aberto é mais específica: qualquer pessoa pode inspecionar, reutilizar e questionar o código do OpenOnco. Isso não demonstra maior precisão nem melhores resultados para doentes do que a Prevision. As páginas citadas da empresa não apresentam uma comparação direta; as suas alegações clínicas exigem avaliação das provas próprias."
      - type: p
        text: "Exemplo fictício, sem aconselhamento clínico: uma equipa multidisciplinar que recebesse um relatório de sensibilidade a fármacos verificaria a validação do teste perante a evidência estabelecida. O OpenOnco poderia organizar opções com fontes, mas nenhuma ferramenta deve escolher o tratamento de uma pessoa real sem revisão por um médico qualificado. Comparação verificada em 17 de outubro de 2026."
  de:
    title: Prevision sammelte 5,4 Millionen Dollar ein. Was bietet Open Source?
    summary: Labortest und OpenOnco beantworten unterschiedliche Fragen. Offener Code macht Regeln prüfbar; eine Finanzierung belegt keine Behandlungsergebnisse.
    body:
      - type: p
        text: "Am 24. September gab Prevision Medicine eine Anschubfinanzierung von 5,4 Millionen Dollar für seine funktionelle onkologische Testplattform bekannt. Laut Unternehmen misst PrevisionOne, wie lebende Tumorzellen auf Medikamente reagieren. Die Finanzierungssumme stammt aus der Unternehmensmitteilung und belegt keinen unabhängig gemessenen Behandlungsnutzen."
      - type: p
        text: "Die Überschneidung mit OpenOnco betrifft die Behandlungsdiskussion, nicht die Methode. Prevision beschreibt einen eigenen Labortest mit Patientenprobe; OpenOnco veröffentlicht deterministische Regeln mit Quellen und MIT-lizenzierten Code sowie einen kostenlosen Plan Builder im Browser. Eine Regel misst keine Arzneimittelreaktion des Tumors, und ein Laborergebnis ersetzt keine Leitlinienprüfung."
      - type: p
        text: "Der überprüfbare Vorteil von Open Source ist enger gefasst: Jeder kann OpenOncos Code prüfen, wiederverwenden und hinterfragen. Das beweist weder höhere Genauigkeit noch bessere Behandlungsergebnisse als bei Prevision. Die zitierten Unternehmensseiten liefern keinen direkten Vergleich; klinische Aussagen müssen anhand eigener Evidenz bewertet werden."
      - type: p
        text: "Nur ein fiktives Beispiel, keine medizinische Beratung: Ein Tumorboard würde bei einem Bericht zur Arzneimittelempfindlichkeit die Validierung des Tests neben der etablierten Evidenz prüfen. OpenOnco könnte belegte Behandlungsoptionen ordnen; keines der Werkzeuge sollte ohne qualifizierte ärztliche Prüfung eine Therapie für einen realen Menschen auswählen. Vergleich geprüft am 17. Oktober 2026."
  fr:
    title: Prevision a levé 5,4 millions de dollars. Que permet l’open source ?
    summary: Le test de laboratoire et OpenOnco répondent à des questions différentes. Le code ouvert rend les règles vérifiables ; une levée de fonds ne prouve aucun bénéfice clinique.
    body:
      - type: p
        text: "Le 24 septembre, Prevision Medicine a annoncé une levée de fonds d’amorçage de 5,4 millions de dollars pour sa plateforme de tests fonctionnels en oncologie. Selon l’entreprise, PrevisionOne mesure la réaction de cellules tumorales vivantes aux médicaments. Ce montant provient de son communiqué et ne mesure pas indépendamment un bénéfice thérapeutique."
      - type: p
        text: "Le point commun avec OpenOnco est la discussion du traitement, pas la méthode. Prevision décrit un test de laboratoire propriétaire nécessitant un prélèvement ; OpenOnco publie des règles déterministes sourcées et du code sous licence MIT, ainsi qu’un outil gratuit de préparation de plans dans le navigateur. Une règle ne mesure pas la réponse d’une tumeur à un médicament, et un résultat de laboratoire ne remplace pas l’examen des recommandations."
      - type: p
        text: "L’avantage vérifiable du code ouvert est plus précis : chacun peut examiner, réutiliser et contester le code d’OpenOnco. Cela ne prouve ni une meilleure précision ni de meilleurs résultats pour les patients que Prevision. Les pages de l’entreprise citées n’offrent pas de comparaison directe ; ses affirmations cliniques doivent être évaluées à partir de leurs propres données."
      - type: p
        text: "Exemple fictif, sans conseil médical : face à un rapport de sensibilité aux médicaments, une réunion de concertation pluridisciplinaire vérifierait la validation du test à côté des données établies. OpenOnco pourrait organiser des options sourcées, mais aucun outil ne devrait choisir un traitement pour une personne réelle sans examen médical qualifié. Comparaison vérifiée le 17 octobre 2026."
  it:
    title: Prevision ha raccolto 5,4 milioni di dollari. Cosa offre l’open source?
    summary: Il test di laboratorio e OpenOnco rispondono a domande diverse. Il codice aperto rende verificabili le regole; i finanziamenti non dimostrano benefici clinici.
    body:
      - type: p
        text: "Il 24 settembre Prevision Medicine ha annunciato un finanziamento iniziale di 5,4 milioni di dollari per la sua piattaforma di test funzionali in oncologia. Secondo l’azienda, PrevisionOne misura la risposta delle cellule tumorali vive ai farmaci. La cifra proviene dal comunicato aziendale, non da una misura indipendente del beneficio terapeutico."
      - type: p
        text: "Il punto comune con OpenOnco è la discussione terapeutica, non il metodo. Prevision descrive un test di laboratorio proprietario che richiede un campione del paziente; OpenOnco pubblica regole deterministiche con fonti e codice con licenza MIT, oltre a un generatore gratuito di piani nel browser. Una regola non misura la risposta di un tumore a un farmaco e un risultato di laboratorio non sostituisce la verifica delle linee guida."
      - type: p
        text: "Il vantaggio verificabile dell’open source è più preciso: chiunque può esaminare, riutilizzare e contestare il codice di OpenOnco. Questo non dimostra maggiore accuratezza o risultati migliori per i pazienti rispetto a Prevision. Le pagine aziendali citate non offrono un confronto diretto; le affermazioni cliniche richiedono una valutazione delle prove pertinenti."
      - type: p
        text: "Solo un esempio immaginario, non un consiglio medico: un gruppo oncologico che ricevesse un referto di sensibilità ai farmaci ne verificherebbe la validazione accanto alle evidenze consolidate. OpenOnco potrebbe ordinare opzioni con fonti, ma nessuno strumento dovrebbe scegliere una terapia per una persona reale senza revisione medica qualificata. Confronto verificato il 17 ottobre 2026."
  da:
    title: Prevision rejste 5,4 mio. dollar. Hvad tilbyder open source?
    summary: Laboratorietesten og OpenOnco besvarer forskellige spørgsmål. Åben kode gør reglerne efterprøvelige; finansiering dokumenterer ikke behandlingsresultater.
    body:
      - type: p
        text: "Den 24. september annoncerede Prevision Medicine en seed-runde på 5,4 mio. dollar til sin platform for funktionelle kræfttests. Ifølge virksomheden måler PrevisionOne, hvordan levende tumorceller reagerer på lægemidler. Beløbet stammer fra virksomhedens meddelelse og er ikke et uafhængigt mål for behandlingseffekt."
      - type: p
        text: "Fællespunktet med OpenOnco er behandlingsdrøftelsen, ikke metoden. Prevision beskriver en proprietær laboratorietest, der kræver en patientprøve; OpenOnco offentliggør deterministiske regler med kilder og MIT-licenseret kode samt en gratis planbygger i browseren. En regel måler ikke en tumors lægemiddelrespons, og et laboratorieresultat erstatter ikke gennemgang af retningslinjer."
      - type: p
        text: "Den efterprøvelige fordel ved open source er mere afgrænset: Alle kan undersøge, genbruge og udfordre OpenOncos kode. Det viser ikke højere nøjagtighed eller bedre resultater for patienter end Prevision. De citerede virksomhedssider giver ingen direkte sammenligning; kliniske påstande skal vurderes på deres eget evidensgrundlag."
      - type: p
        text: "Kun et fiktivt eksempel, ikke lægelig rådgivning: Et tumorboard, der modtog en rapport om lægemiddelfølsomhed, ville kontrollere testens validering sammen med etableret evidens. OpenOnco kunne organisere kildebelagte muligheder, men ingen af værktøjerne bør vælge behandling for en virkelig person uden kvalificeret lægelig gennemgang. Sammenligningen blev kontrolleret 17. oktober 2026."
  sv:
    title: Prevision tog in 5,4 miljoner dollar. Vad erbjuder öppen källkod?
    summary: Laboratorietestet och OpenOnco svarar på olika frågor. Öppen kod gör reglerna granskbara; finansiering visar inte bättre behandlingsresultat.
    body:
      - type: p
        text: "Den 24 september meddelade Prevision Medicine en såddfinansiering på 5,4 miljoner dollar för sin plattform för funktionella cancertester. Enligt företaget mäter PrevisionOne hur levande tumörceller svarar på läkemedel. Beloppet kommer från företagets pressmeddelande och är inget oberoende mått på behandlingsnytta."
      - type: p
        text: "Likheten med OpenOnco gäller behandlingsdiskussionen, inte metoden. Prevision beskriver ett egenutvecklat laboratorietest som kräver ett patientprov; OpenOnco publicerar deterministiska regler med källor och kod med MIT-licens samt en kostnadsfri planbyggare i webbläsaren. En regel mäter inte tumörens läkemedelssvar, och ett laboratoriesvar ersätter inte granskning av riktlinjer."
      - type: p
        text: "Den verifierbara fördelen med öppen källkod är snävare: vem som helst kan granska, återanvända och ifrågasätta OpenOncos kod. Det visar inte högre träffsäkerhet eller bättre patientutfall än Prevision. De citerade företagssidorna ger ingen direkt jämförelse; kliniska påståenden måste bedömas utifrån sin egen evidens."
      - type: p
        text: "Endast ett fiktivt exempel, inte medicinsk rådgivning: en tumörkonferens som fick en rapport om läkemedelskänslighet skulle kontrollera testets validering mot etablerad evidens. OpenOnco skulle kunna ordna källbelagda alternativ, men inget verktyg bör välja behandling för en verklig person utan kvalificerad läkargranskning. Jämförelsen kontrollerades 17 oktober 2026."
  nb:
    title: Prevision hentet 5,4 millioner dollar. Hva gir åpen kildekode?
    summary: Laboratorietesten og OpenOnco svarer på ulike spørsmål. Åpen kode gjør reglene etterprøvbare; finansiering dokumenterer ikke bedre behandlingsresultater.
    body:
      - type: p
        text: "Den 24. september kunngjorde Prevision Medicine en såkornrunde på 5,4 millioner dollar for plattformen sin for funksjonelle krefttester. Ifølge selskapet måler PrevisionOne hvordan levende tumorceller reagerer på legemidler. Beløpet kommer fra selskapets melding og er ikke et uavhengig mål på behandlingsnytte."
      - type: p
        text: "Fellespunktet med OpenOnco er behandlingsdiskusjonen, ikke metoden. Prevision beskriver en egenutviklet laboratorietest som krever en pasientprøve; OpenOnco publiserer deterministiske regler med kilder og MIT-lisensiert kode samt en gratis planbygger i nettleseren. En regel måler ikke en tumors legemiddelrespons, og et laboratoriesvar erstatter ikke gjennomgang av retningslinjer."
      - type: p
        text: "Den etterprøvbare fordelen med åpen kildekode er mer avgrenset: Alle kan undersøke, gjenbruke og utfordre OpenOncos kode. Det viser ikke høyere treffsikkerhet eller bedre pasientutfall enn Prevision. De siterte selskapssidene gir ingen direkte sammenligning; kliniske påstander må vurderes ut fra sitt eget kunnskapsgrunnlag."
      - type: p
        text: "Bare et fiktivt eksempel, ikke medisinske råd: Et tverrfaglig tumormøte som mottok en rapport om legemiddelfølsomhet, ville kontrollere testens validering opp mot etablert evidens. OpenOnco kunne organisere alternativer med kilder, men ingen av verktøyene bør velge behandling for en virkelig person uten kvalifisert legegjennomgang. Sammenligningen ble kontrollert 17. oktober 2026."
  fi:
    title: Prevision keräsi 5,4 miljoonaa dollaria. Mitä avoin lähdekoodi tarjoaa?
    summary: Laboratoriotesti ja OpenOnco vastaavat eri kysymyksiin. Avoin koodi tekee säännöistä tarkistettavia; rahoitus ei osoita parempia hoitotuloksia.
    body:
      - type: p
        text: "Prevision Medicine ilmoitti 24. syyskuuta 5,4 miljoonan dollarin siemenrahoituksesta toiminnallisten syöpätestien alustalleen. Yhtiön mukaan PrevisionOne mittaa elävien kasvainsolujen vastetta lääkkeisiin. Summa perustuu yhtiön tiedotteeseen eikä ole riippumaton mitta hoidon hyödystä."
      - type: p
        text: "OpenOncon kanssa yhteistä on hoitokeskustelu, ei menetelmä. Prevision kuvaa omaa laboratoriotestiään, joka vaatii potilasnäytteen; OpenOnco julkaisee lähteistetyt deterministiset säännöt ja MIT-lisensoidun koodin sekä maksuttoman selaimessa toimivan suunnitelmatyökalun. Sääntö ei mittaa kasvaimen lääkevastetta, eikä laboratoriotulos korvaa hoitosuositusten arviointia."
      - type: p
        text: "Avoimen lähdekoodin todennettava etu on rajatumpi: kuka tahansa voi tarkastella, käyttää uudelleen ja kyseenalaistaa OpenOncon koodia. Tämä ei osoita Previsionia parempaa tarkkuutta tai potilastuloksia. Viitatut yrityksen sivut eivät sisällä suoraa vertailua; kliiniset väitteet on arvioitava omien näyttöjensä perusteella."
      - type: p
        text: "Vain kuvitteellinen esimerkki, ei lääketieteellinen neuvo: lääkeherkkyysraportin saava moniammatillinen hoitokokous tarkistaisi testin validoinnin vakiintuneen näytön rinnalla. OpenOnco voisi järjestää lähteistettyjä vaihtoehtoja, mutta kumpikaan työkalu ei saa valita oikean ihmisen hoitoa ilman pätevän lääkärin arviota. Vertailu tarkistettu 17. lokakuuta 2026."
