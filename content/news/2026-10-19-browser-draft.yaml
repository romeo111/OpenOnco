slug: browser-draft-stays-here
date: 2026-10-19
published: 2026-10-19
kind: project
series: openonco-three-day
series_format: platform
author: OpenOnco
tags: [platform, plan-builder, privacy]
title:
  en: Pause a Plan Builder example without losing the form
  uk: Зупиніть роботу з прикладом у Plan Builder, не втрачаючи форму
summary:
  en: Unfinished inputs can return in the same browser. The saved form is a convenience, not a clinical record or a saved treatment plan.
  uk: Незавершені дані можна відновити в тому самому браузері. Збережена форма — це зручність, а не медична документація чи збережений план лікування.
sources:
  - citation: "OpenOnco. Live Plan Builder interface and privacy notice. Checked 19 October 2026."
    id: "https://openonco.info/try.html"
  - citation: "OpenOnco. Plan Builder draft storage, restoration and Clear implementation. Repository commit 68d280c, checked 19 October 2026."
    id: "https://github.com/romeo111/OpenOnco/blob/68d280c52713086b9efd76abb804a673f1b34937/scripts/build_site.py#L5929-L5970"
  - citation: "OpenOnco. Clear control removes the saved browser draft. Repository commit 68d280c, checked 19 October 2026."
    id: "https://github.com/romeo111/OpenOnco/blob/68d280c52713086b9efd76abb804a673f1b34937/scripts/build_site.py#L7999-L8013"
body:
  en:
    - type: p
      text: "The [Plan Builder](/try.html) can keep unfinished form answers, the selected questionnaire, editing mode and raw JSON text in this browser's localStorage. When you return, it tries to restore those inputs. The Clear button removes the saved draft. The generated Plan itself is not part of this saved form draft."
    - type: p
      text: "Imagine a wholly fictional lymphoma example: you select a questionnaire, enter a stage, then close the tab. Returning in the same browser may let you continue or correct those fields. This is a convenience, not cloud sync or a medical record. Saving may fail if browser storage is blocked, and another user of a shared browser could see the inputs. Use invented, non-identifiable examples only. Restored text is not clinically validated; a qualified clinician must assess any real case. This article does not replace a doctor. Feature checked 19 October 2026."
  uk:
    - type: p
      text: "[Plan Builder](/ukr/try.html) може зберігати незавершені відповіді форми, вибраний опитувальник, режим редагування й текст JSON у локальному сховищі цього браузера. Коли ви повертаєтеся, сторінка намагається відновити ці дані. Кнопка «Очистити» видаляє збережену чернетку. Створений план не входить до цієї збереженої чернетки форми."
    - type: p
      text: "Уявіть цілком вигаданий приклад лімфоми: ви вибрали опитувальник, указали стадію й закрили вкладку. Повернувшись у тому самому браузері, ви можете продовжити або виправити ці поля. Це зручна функція, а не хмарна синхронізація чи медична документація. Якщо сховище браузера заблоковано, збереження може не спрацювати; на спільному пристрої інша людина може побачити введене. Використовуйте лише вигадані приклади без ідентифікаційних даних. Відновлений текст не означає клінічної перевірки; реальний випадок має оцінити кваліфікований лікар. Матеріал не замінює лікаря. Функцію перевірено 19 жовтня 2026 року."
translations:
  es:
    title: Pausar un ejemplo en Plan Builder sin perder el formulario
    summary: Los datos incompletos pueden recuperarse en el mismo navegador. El formulario guardado facilita la tarea; no es una historia clínica ni un plan terapéutico guardado.
    body:
      - type: p
        text: "[Plan Builder](/es/try.html) puede guardar respuestas incompletas del formulario, el cuestionario elegido, el modo de edición y el texto JSON en el almacenamiento local de este navegador. Al volver, intenta recuperar esos datos. El botón «Borrar» elimina el borrador guardado. El plan generado no forma parte de este borrador del formulario."
      - type: p
        text: "Imagine un ejemplo de linfoma totalmente ficticio: elige un cuestionario, introduce un estadio y cierra la pestaña. Al regresar en el mismo navegador, puede continuar o corregir esos campos. Es una comodidad, no una sincronización en la nube ni una historia clínica. Si el navegador bloquea el almacenamiento, puede que no se guarde; otra persona que use un navegador compartido podría ver los datos. Utilice solo ejemplos inventados y sin datos identificativos. El texto recuperado no está validado clínicamente; un profesional cualificado debe valorar cualquier caso real. Este artículo no sustituye a un médico. Función verificada el 19 de octubre de 2026."
  pt:
    title: Pausar um exemplo no Plan Builder sem perder o formulário
    summary: Os dados incompletos podem ser recuperados no mesmo navegador. O formulário guardado é uma conveniência, não um registo clínico nem um plano terapêutico guardado.
    body:
      - type: p
        text: "O [Plan Builder](/pt/try.html) pode guardar respostas incompletas do formulário, o questionário selecionado, o modo de edição e o texto JSON no armazenamento local deste navegador. Ao regressar, tenta recuperar esses dados. O botão «Limpar» remove o rascunho guardado. O plano gerado não faz parte deste rascunho do formulário."
      - type: p
        text: "Imagine um exemplo de linfoma totalmente fictício: escolhe um questionário, indica um estádio e fecha o separador. Ao voltar no mesmo navegador, pode continuar ou corrigir esses campos. É uma conveniência, não sincronização na nuvem nem um registo clínico. Se o armazenamento do navegador estiver bloqueado, a gravação pode falhar; outra pessoa num navegador partilhado poderá ver os dados. Use apenas exemplos inventados e sem dados identificativos. O texto recuperado não tem validação clínica; um profissional qualificado deve avaliar qualquer caso real. Este artigo não substitui um médico. Função verificada em 19 de outubro de 2026."
  de:
    title: Ein Plan-Builder-Beispiel unterbrechen, ohne das Formular zu verlieren
    summary: Unfertige Eingaben können im selben Browser wieder erscheinen. Das gespeicherte Formular ist eine Arbeitshilfe, keine Patientenakte und kein gespeicherter Therapieplan.
    body:
      - type: p
        text: "Der [Plan Builder](/de/try.html) kann unvollständige Formularantworten, den gewählten Fragebogen, den Bearbeitungsmodus und den JSON-Text im lokalen Speicher dieses Browsers ablegen. Beim nächsten Besuch versucht die Seite, diese Eingaben wiederherzustellen. Die Schaltfläche „Löschen“ entfernt den gespeicherten Entwurf. Der erzeugte Plan gehört nicht zu diesem gespeicherten Formularentwurf."
      - type: p
        text: "Stellen Sie sich ein vollständig erfundenes Lymphom-Beispiel vor: Sie wählen einen Fragebogen, tragen ein Stadium ein und schließen den Tab. Im selben Browser können Sie später die Felder weiterbearbeiten oder korrigieren. Das ist eine Arbeitshilfe, keine Cloud-Synchronisierung oder Patientenakte. Ist der Browserspeicher gesperrt, kann das Speichern fehlschlagen; andere Nutzer eines gemeinsam verwendeten Browsers könnten die Eingaben sehen. Nutzen Sie nur erfundene Beispiele ohne identifizierende Daten. Wiederhergestellter Text ist nicht klinisch validiert; echte Fälle müssen qualifizierte Behandelnde prüfen. Dieser Artikel ersetzt keinen Arzt. Funktion geprüft am 19. Oktober 2026."
  fr:
    title: Interrompre un exemple dans Plan Builder sans perdre le formulaire
    summary: Les saisies inachevées peuvent réapparaître dans le même navigateur. Le formulaire sauvegardé est une aide pratique, pas un dossier médical ni un plan de traitement conservé.
    body:
      - type: p
        text: "[Plan Builder](/fr/try.html) peut conserver les réponses inachevées du formulaire, le questionnaire choisi, le mode de saisie et le texte JSON dans le stockage local de ce navigateur. À votre retour, la page tente de restaurer ces données. Le bouton « Effacer » supprime le brouillon enregistré. Le plan généré ne fait pas partie de ce brouillon de formulaire."
      - type: p
        text: "Imaginez un exemple de lymphome entièrement fictif : vous choisissez un questionnaire, indiquez un stade, puis fermez l'onglet. En revenant dans le même navigateur, vous pouvez poursuivre ou corriger ces champs. C'est une aide pratique, pas une synchronisation dans le nuage ni un dossier médical. Si le stockage du navigateur est bloqué, l'enregistrement peut échouer ; une autre personne utilisant un navigateur partagé pourrait voir les saisies. Utilisez seulement des exemples inventés et non identifiables. Un texte restauré n'est pas validé cliniquement ; tout cas réel doit être évalué par un professionnel qualifié. Cet article ne remplace pas un médecin. Fonction vérifiée le 19 octobre 2026."
  it:
    title: Interrompere un esempio in Plan Builder senza perdere il modulo
    summary: I dati incompleti possono riapparire nello stesso browser. Il modulo salvato è una comodità, non una cartella clinica né un piano terapeutico conservato.
    body:
      - type: p
        text: "[Plan Builder](/it/try.html) può salvare le risposte incomplete del modulo, il questionario selezionato, la modalità di modifica e il testo JSON nella memoria locale di questo browser. Al ritorno, la pagina tenta di ripristinare questi dati. Il pulsante «Cancella» elimina la bozza salvata. Il piano generato non fa parte di questa bozza del modulo."
      - type: p
        text: "Immagini un esempio di linfoma del tutto inventato: sceglie un questionario, inserisce uno stadio e chiude la scheda. Tornando nello stesso browser, può continuare o correggere quei campi. È una comodità, non una sincronizzazione nel cloud né una cartella clinica. Se la memoria del browser è bloccata, il salvataggio può fallire; chi usa un browser condiviso potrebbe vedere i dati. Usi solo esempi inventati e non identificabili. Il testo ripristinato non è validato clinicamente; un professionista qualificato deve valutare ogni caso reale. Questo articolo non sostituisce un medico. Funzione verificata il 19 ottobre 2026."
  da:
    title: Sæt et eksempel i Plan Builder på pause uden at miste formularen
    summary: Ufærdige indtastninger kan gendannes i samme browser. Den gemte formular er en hjælp, ikke en patientjournal eller en gemt behandlingsplan.
    body:
      - type: p
        text: "[Plan Builder](/da/try.html) kan gemme ufærdige formularsvar, det valgte spørgeskema, redigeringstilstanden og JSON-teksten i denne browsers lokale lager. Når du vender tilbage, forsøger siden at gendanne indtastningerne. Knappen »Ryd« fjerner den gemte kladde. Den genererede plan er ikke en del af denne gemte formularkladde."
      - type: p
        text: "Forestil dig et helt opdigtet lymfomeksempel: Du vælger et spørgeskema, angiver et stadie og lukker fanen. I samme browser kan du senere fortsætte eller rette felterne. Det er en praktisk hjælp, ikke skysynkronisering eller en patientjournal. Hvis browserlageret er blokeret, kan lagringen mislykkes; andre brugere af en delt browser kan se indtastningerne. Brug kun opdigtede eksempler uden identificerende oplysninger. Gendannet tekst er ikke klinisk valideret; en kvalificeret kliniker skal vurdere enhver reel sag. Artiklen erstatter ikke en læge. Funktionen blev kontrolleret 19. oktober 2026."
  sv:
    title: Pausa ett exempel i Plan Builder utan att förlora formuläret
    summary: Ofärdiga inmatningar kan återställas i samma webbläsare. Det sparade formuläret är en hjälp, inte en journal eller en sparad behandlingsplan.
    body:
      - type: p
        text: "[Plan Builder](/sv/try.html) kan spara ofärdiga formulärsvar, det valda frågeformuläret, redigeringsläget och JSON-texten i webbläsarens lokala lagring. När du återkommer försöker sidan återställa uppgifterna. Knappen »Rensa« tar bort det sparade utkastet. Den genererade planen ingår inte i detta sparade formulärutkast."
      - type: p
        text: "Tänk dig ett helt påhittat lymfomexempel: Du väljer ett frågeformulär, anger ett stadium och stänger fliken. I samma webbläsare kan du senare fortsätta eller rätta fälten. Det är en bekvämlighet, inte molnsynkronisering eller en patientjournal. Om webbläsarlagringen är blockerad kan sparandet misslyckas; andra som använder en delad webbläsare kan se uppgifterna. Använd bara påhittade exempel utan identifierande uppgifter. Återställd text är inte kliniskt validerad; en kvalificerad kliniker måste bedöma verkliga fall. Artikeln ersätter inte en läkare. Funktionen kontrollerades den 19 oktober 2026."
  nb:
    title: Sett et eksempel i Plan Builder på pause uten å miste skjemaet
    summary: Uferdige inntastinger kan gjenopprettes i samme nettleser. Det lagrede skjemaet er en hjelp, ikke en pasientjournal eller en lagret behandlingsplan.
    body:
      - type: p
        text: "[Plan Builder](/nb/try.html) kan lagre uferdige skjemasvar, valgt spørreskjema, redigeringsmodus og JSON-tekst i denne nettleserens lokale lagring. Når du kommer tilbake, forsøker siden å gjenopprette opplysningene. Knappen «Tøm» fjerner det lagrede utkastet. Den genererte planen er ikke en del av dette lagrede skjemautkastet."
      - type: p
        text: "Tenk deg et helt oppdiktet lymfomeksempel: Du velger et spørreskjema, angir et stadium og lukker fanen. I samme nettleser kan du senere fortsette eller rette feltene. Dette er en praktisk hjelp, ikke skysynkronisering eller en pasientjournal. Hvis nettleserlagring er blokkert, kan lagring mislykkes; andre som bruker en delt nettleser, kan se opplysningene. Bruk bare oppdiktede eksempler uten identifiserende opplysninger. Gjenopprettet tekst er ikke klinisk validert; en kvalifisert kliniker må vurdere reelle tilfeller. Artikkelen erstatter ikke en lege. Funksjonen ble kontrollert 19. oktober 2026."
  fi:
    title: Keskeytä Plan Builder -esimerkki menettämättä lomaketta
    summary: Keskeneräiset tiedot voivat palautua samassa selaimessa. Tallennettu lomake on apuväline, ei potilaskertomus tai tallennettu hoitosuunnitelma.
    body:
      - type: p
        text: "[Plan Builder](/fi/try.html) voi tallentaa keskeneräiset lomakevastaukset, valitun kyselylomakkeen, muokkaustilan ja JSON-tekstin tämän selaimen paikalliseen tallennustilaan. Kun palaat sivulle, se yrittää palauttaa tiedot. Tyhjennä-painike poistaa tallennetun luonnoksen. Luotu hoitosuunnitelma ei kuulu tähän tallennettuun lomakeluonnokseen."
      - type: p
        text: "Kuvittele täysin keksitty lymfoomaesimerkki: valitset kyselylomakkeen, merkitset taudin vaiheen ja suljet välilehden. Samassa selaimessa voit myöhemmin jatkaa tai korjata kenttiä. Tämä on käytännön apu, ei pilvisynkronointi tai potilaskertomus. Jos selaimen tallennustila on estetty, tallennus voi epäonnistua; jaetun selaimen toinen käyttäjä voi nähdä tiedot. Käytä vain keksittyjä esimerkkejä ilman tunnistettavia henkilötietoja. Palautettu teksti ei ole kliinisesti validoitu; pätevän lääkärin on arvioitava todelliset tapaukset. Artikkeli ei korvaa lääkäriä. Toiminto tarkistettu 19. lokakuuta 2026."
