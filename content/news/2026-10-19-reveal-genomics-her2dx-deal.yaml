tags: [startup-watch, breast-cancer, genomics, evidence]
title:
  en: Hologic plans to buy Reveal Genomics. What does HER2DX add?
  uk: Hologic планує придбати Reveal Genomics. Що дає HER2DX?
summary:
  en: The deal is not closed. A 27-gene tissue test and OpenOnco's public rules answer different questions; changed decisions are not proof of better outcomes.
  uk: Угоду ще не завершено. Тест тканини за 27 генами й відкриті правила OpenOnco відповідають на різні запитання; зміна рішень не доводить кращих результатів лікування.
sources:
  - citation: "Hologic. Definitive agreement to acquire Reveal Genomics; closing conditions. 19 October 2026."
    id: "https://www.hologic.com/about/press-release/hologic-signs-definitive-agreement-acquire-reveal-genomics"
  - citation: "Reveal Genomics. HER2DX product, laboratory and European regulatory information. Accessed 20 October 2026."
    id: "https://www.reveal-genomics.com/her2dx"
  - citation: "Martínez-Sáez O et al. Clinical decision impact of HER2DX: prospective observational study in 297 patients. ESMO Real World Data and Digital Oncology, 2025."
    id: "https://doi.org/10.1016/j.esmorw.2025.100123"
  - citation: "OpenOnco. Public repository, licence and workflow documentation. Accessed 20 October 2026."
    id: "https://github.com/romeo111/OpenOnco"
body:
  en:
    - type: p
      text: "On 19 October, Hologic said it signed an agreement to acquire Barcelona startup Reveal Genomics. The deal still needs Spanish regulatory approval and other closing conditions. Reveal's HER2DX measures expression of 27 genes in preserved breast-tumor tissue and combines it with stage and nodal status to report relapse risk, likelihood of a pathological complete response and ERBB2 expression. Reveal says the US test runs in a CLIA-certified, CAP-accredited laboratory; European CE marking is still underway. Its product page asks clinicians to contact the company to order and publishes no price or source-code licence."
    - type: p
      text: "In a prospective observational study at 12 Spanish hospitals, clinicians reported treatment adjustments after HER2DX in 48.1% of 297 cases. The study had no randomized comparison or evidence that those changes improved survival; several authors had company roles or interests. OpenOnco instead offers free browser-based review of source-linked oncology rules under an MIT code licence. Anyone can inspect those rules, but OpenOnco cannot analyze tumor tissue or produce a HER2DX score. A genomic test cannot replace checking guidelines either. There is no head-to-head outcomes comparison. Sources and comparison checked 20 October 2026. This article does not replace a qualified physician."
  uk:
    - type: p
      text: "19 жовтня Hologic повідомила, що підписала угоду про придбання барселонського стартапу Reveal Genomics. Для завершення ще потрібні дозвіл регулятора Іспанії та виконання інших умов. Тест HER2DX вимірює експресію 27 генів у збереженій тканині пухлини молочної залози й поєднує її зі стадією та станом лімфовузлів, щоб оцінити ризик рецидиву, імовірність повної патоморфологічної відповіді та експресію ERBB2. За даними Reveal, у США тест виконують у лабораторії з сертифікацією CLIA й акредитацією CAP; європейське маркування CE ще оформлюють. Сторінка продукту пропонує звернутися для замовлення й не публікує ціни чи ліцензії на код."
    - type: p
      text: "У проспективному спостережному дослідженні 12 лікарень Іспанії лікарі повідомили про зміни лікувальних рішень після HER2DX у 48,1% із 297 випадків. Не було рандомізованого порівняння чи доказів, що ці зміни поліпшили виживаність; частина авторів мала посади або інтереси в компанії. OpenOnco натомість безкоштовно дає в браузері перегляд онкологічних правил із джерелами, а його код має ліцензію MIT. Правила можна перевіряти, але OpenOnco не аналізує пухлинну тканину й не формує оцінку HER2DX. Геномний тест теж не замінює перевірки настанов. Прямого порівняння результатів немає. Джерела й порівняння перевірено 20 жовтня 2026 року. Стаття не замінює консультації кваліфікованого лікаря."
translations:
  es:
    title: Hologic planea comprar Reveal Genomics. ¿Qué aporta HER2DX?
    summary: La compra aún no se ha cerrado. Una prueba de tejido de 27 genes y las reglas públicas de OpenOnco responden preguntas distintas; cambiar decisiones no demuestra mejores resultados.
    body:
      - type: p
        text: "El 19 de octubre, Hologic anunció que había firmado un acuerdo para adquirir la empresa emergente barcelonesa Reveal Genomics. La operación aún requiere autorización regulatoria española y otras condiciones de cierre. HER2DX mide la expresión de 27 genes en tejido conservado de cáncer de mama y la combina con el estadio y el estado ganglionar para informar del riesgo de recaída, la probabilidad de respuesta patológica completa y la expresión de ERBB2. Según Reveal, en EE. UU. la prueba se realiza en un laboratorio certificado por CLIA y acreditado por CAP; el marcado CE europeo sigue en trámite. Su página pide contactar para solicitarla y no publica precio ni licencia del código fuente."
      - type: p
        text: "En un estudio observacional prospectivo de 12 hospitales españoles, los médicos comunicaron cambios en las decisiones terapéuticas tras HER2DX en el 48,1 % de 297 casos. No hubo comparación aleatorizada ni pruebas de que esos cambios mejoraran la supervivencia; varios autores tenían cargos o intereses en la empresa. OpenOnco ofrece, en cambio, revisión gratuita en el navegador de reglas oncológicas con fuentes, con código bajo licencia MIT. Cualquiera puede revisar las reglas, pero OpenOnco no analiza tejido tumoral ni genera una puntuación HER2DX. Una prueba genómica tampoco sustituye la revisión de las guías. No existe comparación directa de resultados clínicos. Fuentes y comparación verificadas el 20 de octubre de 2026. Este artículo no sustituye a un médico cualificado."
  pt:
    title: A Hologic planeia comprar a Reveal Genomics. O que acrescenta o HER2DX?
    summary: O negócio ainda não foi concluído. Um teste de tecido de 27 genes e as regras públicas do OpenOnco respondem a perguntas diferentes; mudar decisões não prova melhores resultados.
    body:
      - type: p
        text: "Em 19 de outubro, a Hologic anunciou ter assinado um acordo para adquirir a startup de Barcelona Reveal Genomics. A operação ainda depende da aprovação do regulador espanhol e de outras condições de conclusão. O HER2DX mede a expressão de 27 genes em tecido conservado de tumor da mama e combina-a com o estádio e o estado ganglionar para informar sobre risco de recaída, probabilidade de resposta patológica completa e expressão de ERBB2. Segundo a Reveal, nos EUA o teste é feito num laboratório certificado pela CLIA e acreditado pela CAP; a marcação CE europeia ainda está em curso. A página pede contacto para encomendar e não publica preço nem licença do código-fonte."
      - type: p
        text: "Num estudo observacional prospetivo em 12 hospitais espanhóis, os médicos comunicaram alterações nas decisões terapêuticas após o HER2DX em 48,1% de 297 casos. Não houve comparação aleatorizada nem provas de que essas alterações melhorassem a sobrevivência; vários autores tinham funções ou interesses na empresa. O OpenOnco oferece, em vez disso, revisão gratuita no navegador de regras oncológicas com fontes, com código sob licença MIT. Qualquer pessoa pode inspecionar as regras, mas o OpenOnco não analisa tecido tumoral nem produz uma pontuação HER2DX. Um teste genómico também não substitui a análise das orientações clínicas. Não há comparação direta de resultados clínicos. Fontes e comparação verificadas em 20 de outubro de 2026. Este artigo não substitui um médico qualificado."
  de:
    title: Hologic will Reveal Genomics übernehmen. Was bringt HER2DX?
    summary: Die Übernahme ist noch nicht abgeschlossen. Ein Gewebetest mit 27 Genen und OpenOncos öffentliche Regeln beantworten unterschiedliche Fragen; geänderte Entscheidungen belegen keine besseren Ergebnisse.
    body:
      - type: p
        text: "Am 19. Oktober teilte Hologic mit, eine Vereinbarung zur Übernahme des Start-ups Reveal Genomics aus Barcelona unterzeichnet zu haben. Der Abschluss hängt noch von der spanischen behördlichen Genehmigung und weiteren Bedingungen ab. HER2DX misst die Expression von 27 Genen in konserviertem Brusttumorgewebe und kombiniert sie mit Tumorstadium und Lymphknotenstatus, um Rückfallrisiko, Wahrscheinlichkeit einer pathologischen Komplettremission und ERBB2-Expression auszugeben. Laut Reveal erfolgt der Test in den USA in einem CLIA-zertifizierten und CAP-akkreditierten Labor; die europäische CE-Kennzeichnung ist noch im Verfahren. Die Produktseite fordert zur Kontaktaufnahme für Bestellungen auf und veröffentlicht weder Preis noch Quellcodelizenz."
      - type: p
        text: "In einer prospektiven Beobachtungsstudie an 12 spanischen Kliniken berichteten Ärztinnen und Ärzte nach HER2DX in 48,1 % von 297 Fällen über geänderte Therapieentscheidungen. Es gab keinen randomisierten Vergleich und keinen Nachweis, dass diese Änderungen das Überleben verbesserten; mehrere Autorinnen und Autoren hatten Funktionen oder Interessen bei der Firma. OpenOnco bietet stattdessen im Browser eine kostenlose Prüfung quellenbelegter Onkologieregeln mit MIT-lizenziertem Code. Die Regeln sind einsehbar, doch OpenOnco analysiert kein Tumorgewebe und erstellt keinen HER2DX-Score. Auch ein Gentest ersetzt keine Leitlinienprüfung. Ein direkter Vergleich klinischer Ergebnisse fehlt. Quellen und Vergleich geprüft am 20. Oktober 2026. Dieser Artikel ersetzt keine qualifizierte ärztliche Beratung."
  fr:
    title: Hologic prévoit de racheter Reveal Genomics. Qu'apporte HER2DX ?
    summary: Le rachat n'est pas finalisé. Un test tissulaire de 27 gènes et les règles publiques d'OpenOnco répondent à des questions distinctes ; modifier des décisions ne prouve pas de meilleurs résultats.
    body:
      - type: p
        text: "Le 19 octobre, Hologic a annoncé avoir signé un accord pour acquérir la jeune entreprise barcelonaise Reveal Genomics. La transaction reste soumise à l'autorisation des autorités espagnoles et à d'autres conditions de clôture. HER2DX mesure l'expression de 27 gènes dans du tissu tumoral mammaire conservé et l'associe au stade et au statut ganglionnaire pour rendre compte du risque de rechute, de la probabilité de réponse pathologique complète et de l'expression d'ERBB2. Selon Reveal, le test américain est réalisé dans un laboratoire certifié CLIA et accrédité CAP ; le marquage CE européen est encore en cours. La page invite à contacter l'entreprise pour commander, sans publier de prix ni de licence du code source."
      - type: p
        text: "Dans une étude observationnelle prospective menée dans 12 hôpitaux espagnols, les médecins ont déclaré des modifications de leurs décisions thérapeutiques après HER2DX dans 48,1 % des 297 cas. Il n'y avait ni comparaison randomisée ni preuve que ces changements amélioraient la survie ; plusieurs auteurs avaient des fonctions ou des intérêts dans l'entreprise. OpenOnco propose plutôt un examen gratuit, dans le navigateur, de règles oncologiques sourcées, avec un code sous licence MIT. Ces règles sont vérifiables, mais OpenOnco n'analyse pas les tissus tumoraux et ne produit pas de score HER2DX. Un test génomique ne remplace pas non plus l'examen des recommandations. Aucune comparaison directe des résultats cliniques n'existe. Sources et comparaison vérifiées le 20 octobre 2026. Cet article ne remplace pas un médecin qualifié."
  it:
    title: Hologic intende acquisire Reveal Genomics. Cosa aggiunge HER2DX?
    summary: L'acquisizione non è conclusa. Un test tissutale di 27 geni e le regole pubbliche di OpenOnco rispondono a domande diverse; cambiare decisioni non prova esiti migliori.
    body:
      - type: p
        text: "Il 19 ottobre Hologic ha annunciato di aver firmato un accordo per acquisire la startup barcellonese Reveal Genomics. L'operazione richiede ancora l'autorizzazione delle autorità spagnole e altre condizioni di chiusura. HER2DX misura l'espressione di 27 geni nel tessuto conservato di tumore mammario e la combina con stadio e stato linfonodale per riportare il rischio di recidiva, la probabilità di risposta patologica completa e l'espressione di ERBB2. Secondo Reveal, negli Stati Uniti il test è eseguito in un laboratorio certificato CLIA e accreditato CAP; la marcatura CE europea è ancora in corso. La pagina invita a contattare l'azienda per ordinare e non pubblica prezzo né licenza del codice sorgente."
      - type: p
        text: "In uno studio osservazionale prospettico condotto in 12 ospedali spagnoli, i medici hanno riferito modifiche delle decisioni terapeutiche dopo HER2DX nel 48,1% di 297 casi. Non c'era un confronto randomizzato né prova che i cambiamenti migliorassero la sopravvivenza; diversi autori avevano ruoli o interessi nell'azienda. OpenOnco offre invece nel browser una revisione gratuita di regole oncologiche con fonti, con codice sotto licenza MIT. Le regole sono verificabili, ma OpenOnco non analizza tessuto tumorale né produce un punteggio HER2DX. Anche un test genomico non sostituisce la verifica delle linee guida. Non esiste un confronto diretto degli esiti clinici. Fonti e confronto verificati il 20 ottobre 2026. Questo articolo non sostituisce un medico qualificato."
  da:
    title: Hologic vil købe Reveal Genomics. Hvad bidrager HER2DX med?
    summary: Købet er endnu ikke afsluttet. En vævstest af 27 gener og OpenOncos offentlige regler besvarer forskellige spørgsmål; ændrede beslutninger beviser ikke bedre resultater.
    body:
      - type: p
        text: "Den 19. oktober meddelte Hologic, at selskabet havde underskrevet en aftale om at overtage startupvirksomheden Reveal Genomics fra Barcelona. Handlen kræver stadig spansk myndighedsgodkendelse og opfyldelse af andre afslutningsbetingelser. HER2DX måler ekspressionen af 27 gener i konserveret brysttumorvæv og kombinerer den med stadium og lymfeknudestatus for at angive tilbagefaldsrisiko, sandsynlighed for komplet patologisk respons og ERBB2-ekspression. Ifølge Reveal udføres testen i USA på et CLIA-certificeret og CAP-akkrediteret laboratorium; europæisk CE-mærkning er stadig undervejs. Produktsiden beder klinikere kontakte selskabet for bestilling og offentliggør hverken pris eller kildekodelicens."
      - type: p
        text: "I et prospektivt observationsstudie på 12 spanske hospitaler rapporterede læger ændrede behandlingsbeslutninger efter HER2DX i 48,1 % af 297 tilfælde. Der var ingen randomiseret sammenligning eller dokumentation for, at ændringerne forbedrede overlevelsen; flere forfattere havde stillinger eller interesser i selskabet. OpenOnco tilbyder i stedet gratis gennemgang af kildebelagte onkologiregler i browseren, med kode under MIT-licens. Reglerne kan kontrolleres, men OpenOnco analyserer ikke tumorvæv og giver ingen HER2DX-score. En genomisk test erstatter heller ikke kontrol af retningslinjer. Der findes ingen direkte sammenligning af kliniske resultater. Kilder og sammenligning kontrolleret 20. oktober 2026. Artiklen erstatter ikke en kvalificeret læge."
  sv:
    title: Hologic planerar att köpa Reveal Genomics. Vad tillför HER2DX?
    summary: Affären är inte slutförd. Ett vävnadstest med 27 gener och OpenOncos öppna regler svarar på olika frågor; ändrade beslut bevisar inte bättre resultat.
    body:
      - type: p
        text: "Den 19 oktober meddelade Hologic att bolaget undertecknat ett avtal om att förvärva startupföretaget Reveal Genomics i Barcelona. Affären kräver fortfarande spanskt myndighetsgodkännande och andra villkor för att slutföras. HER2DX mäter uttrycket av 27 gener i bevarad brösttumörvävnad och kombinerar detta med stadium och lymfkörtelstatus för att rapportera återfallsrisk, sannolikhet för patologisk komplett respons och ERBB2-uttryck. Enligt Reveal utförs testet i USA i ett CLIA-certifierat och CAP-ackrediterat laboratorium; europeisk CE-märkning pågår fortfarande. Produktsidan ber vårdpersonal ta kontakt för beställning och publicerar varken pris eller källkodslicens."
      - type: p
        text: "I en prospektiv observationsstudie vid 12 spanska sjukhus rapporterade läkare ändrade behandlingsbeslut efter HER2DX i 48,1 % av 297 fall. Det fanns ingen randomiserad jämförelse eller belägg för att ändringarna förbättrade överlevnaden; flera författare hade roller eller intressen i företaget. OpenOnco erbjuder i stället kostnadsfri granskning av källbelagda onkologiska regler i webbläsaren, med kod under MIT-licens. Reglerna kan kontrolleras, men OpenOnco analyserar inte tumörvävnad och ger ingen HER2DX-poäng. Ett genomiskt test ersätter inte heller granskning av riktlinjer. Ingen direkt jämförelse av kliniska resultat finns. Källor och jämförelse kontrollerade den 20 oktober 2026. Artikeln ersätter inte en kvalificerad läkare."
  nb:
    title: Hologic vil kjøpe Reveal Genomics. Hva tilfører HER2DX?
    summary: Oppkjøpet er ikke fullført. En vevstest av 27 gener og OpenOncos åpne regler svarer på ulike spørsmål; endrede beslutninger beviser ikke bedre resultater.
    body:
      - type: p
        text: "Den 19. oktober opplyste Hologic at selskapet hadde undertegnet en avtale om å kjøpe oppstartsbedriften Reveal Genomics i Barcelona. Oppkjøpet krever fortsatt godkjenning fra spanske myndigheter og andre vilkår for å bli fullført. HER2DX måler uttrykket av 27 gener i konservert brystsvulstvev og kombinerer det med stadium og lymfeknutestatus for å rapportere tilbakefallsrisiko, sannsynlighet for patologisk komplett respons og ERBB2-uttrykk. Ifølge Reveal utføres testen i USA i et CLIA-sertifisert og CAP-akkreditert laboratorium; europeisk CE-merking pågår fortsatt. Produktsiden ber klinikere ta kontakt for bestilling og oppgir verken pris eller kildekodelisens."
      - type: p
        text: "I en prospektiv observasjonsstudie ved 12 spanske sykehus rapporterte leger endrede behandlingsbeslutninger etter HER2DX i 48,1 % av 297 tilfeller. Det var ingen randomisert sammenligning eller bevis for at endringene forbedret overlevelsen; flere forfattere hadde roller eller interesser i selskapet. OpenOnco tilbyr i stedet gratis gjennomgang av kildebelagte onkologiregler i nettleseren, med kode under MIT-lisens. Reglene kan kontrolleres, men OpenOnco analyserer ikke svulstvev og gir ingen HER2DX-skår. En genomisk test erstatter heller ikke gjennomgang av retningslinjer. Det finnes ingen direkte sammenligning av kliniske resultater. Kilder og sammenligning kontrollert 20. oktober 2026. Artikkelen erstatter ikke en kvalifisert lege."
  fi:
    title: Hologic aikoo ostaa Reveal Genomicsin. Mitä HER2DX tuo lisää?
    summary: Kauppa ei ole vielä toteutunut. 27 geenin kudostesti ja OpenOncon avoimet säännöt vastaavat eri kysymyksiin; muuttuneet päätökset eivät todista parempia hoitotuloksia.
    body:
      - type: p
        text: "Hologic ilmoitti 19. lokakuuta allekirjoittaneensa sopimuksen barcelonalaisen Reveal Genomics -kasvuyrityksen ostamisesta. Kauppa vaatii vielä Espanjan viranomaisen hyväksynnän ja muiden ehtojen täyttymisen. HER2DX mittaa 27 geenin ilmentymistä säilötyssä rintakasvainkudoksessa ja yhdistää tiedon taudin levinneisyysasteeseen ja imusolmuketilanteeseen arvioidakseen uusiutumisriskiä, patologisen täydellisen vasteen todennäköisyyttä ja ERBB2:n ilmentymistä. Revealin mukaan testi tehdään Yhdysvalloissa CLIA-sertifioidussa ja CAP-akkreditoidussa laboratoriossa; eurooppalainen CE-merkintäprosessi on kesken. Tuotesivu pyytää ottamaan yhteyttä tilausta varten eikä julkaise hintaa tai lähdekoodilisenssiä."
      - type: p
        text: "Prospektiivisessa havainnoivassa tutkimuksessa 12 espanjalaisessa sairaalassa lääkärit ilmoittivat hoitopäätösten muuttuneen HER2DX:n jälkeen 48,1 prosentissa 297 tapauksesta. Satunnaistettua vertailua tai näyttöä siitä, että muutokset paransivat eloonjäämistä, ei ollut; useilla kirjoittajilla oli työtehtäviä tai sidonnaisuuksia yhtiössä. OpenOnco tarjoaa puolestaan maksuttoman, selaimessa toimivan katsauksen lähteistettyihin onkologisiin sääntöihin MIT-lisensoidulla koodilla. Säännöt ovat tarkistettavia, mutta OpenOnco ei analysoi kasvainkudosta eikä tuota HER2DX-pistemäärää. Genomitesti ei myöskään korvaa hoitosuositusten tarkistamista. Suoraa vertailua kliinisistä tuloksista ei ole. Lähteet ja vertailu tarkistettu 20. lokakuuta 2026. Artikkeli ei korvaa pätevää lääkäriä."
