kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, pathology, precision-oncology, evidence]
title:
  en: Sophont predicts gene activity from slides. What is established?
  uk: Sophont прогнозує активність генів за зрізами. Що вже доведено?
summary:
  en: Holon-S1 predicts spatial signals from pathology images; OpenOnco reviews cited rules. Neither has shown better patient outcomes from this comparison.
  uk: Holon-S1 прогнозує просторові сигнали за патологічними зображеннями; OpenOnco допомагає переглядати правила з джерелами. Це порівняння не доводить кращих результатів лікування.
sources:
  - citation: "Sophont. Holon-S1 launch announcement. 20 October 2026."
    id: "https://www.prnewswire.com/news-releases/sophont-launches-holon-s1-to-reveal-tumor-biology-from-routine-pathology-slides-302914452.html"
  - citation: "Sophont. Holon-S1 product and access information. Accessed 21 October 2026."
    id: "https://sophont.med/holon/"
  - citation: "Muhammad H et al. Holon-S1 Technical Report. Sophont, 13 October 2026."
    id: "https://sophont.med/blog/holon/"
  - citation: "OpenOnco. Public capabilities, limitations and source repository. Accessed 21 October 2026."
    id: "https://openonco.info/capabilities.html"
  - citation: "OpenOnco. MIT licence and public source repository. Accessed 21 October 2026."
    id: "https://github.com/romeo111/OpenOnco"
body:
  en:
    - type: p
      text: "On 20 October, startup Sophont announced Holon-S1. It predicts where genes and biological programs may be active in a tumour from a routine H&E pathology slide. Sophont offers an interactive example and invites research collaborations. Its company-authored technical report, dated 13 October, describes retrospective evaluations and biomarker case studies. A prediction from an image is not a direct measurement of gene expression. These materials do not establish that using the model improves treatment choices or survival."
    - type: p
      text: "The tools address different steps. Holon-S1 studies tissue images to generate research hypotheses; OpenOnco's free, MIT-licensed browser tool displays source-linked oncology rules and alternative tumour-board plan drafts, but cannot read slides or measure gene expression. OpenOnco's code and rules are public, although clinical content remains under review. On 21 October, Sophont's product page did not publish a Holon-S1 source-code licence or price; access is offered through contact. Neither tool replaces pathology, molecular testing or clinician judgement, and there is no head-to-head clinical outcomes comparison. This article does not replace a qualified physician."
  uk:
    - type: p
      text: "20 жовтня стартап Sophont представив Holon-S1. Модель прогнозує, де в пухлині можуть бути активними гени та біологічні програми, за звичайним гістологічним зрізом, забарвленим гематоксиліном і еозином. Sophont показує інтерактивний приклад і запрошує до дослідницької співпраці. Технічний звіт компанії від 13 жовтня описує ретроспективні перевірки й приклади пошуку біомаркерів. Прогноз за зображенням не є прямим вимірюванням експресії генів. Ці матеріали не доводять, що застосування моделі поліпшує вибір лікування або виживаність."
    - type: p
      text: "Інструменти працюють на різних етапах. Holon-S1 аналізує зображення тканини для дослідницьких гіпотез; безкоштовний браузерний OpenOnco з кодом під ліцензією MIT показує онкологічні правила з джерелами та альтернативні чернетки для консиліуму, але не читає зрізи й не вимірює експресію генів. Код і правила OpenOnco відкриті, хоча клінічний вміст ще проходить перевірку. Станом на 21 жовтня сторінка Sophont не публікувала ліцензії на код Holon-S1 чи ціни; доступ пропонували через звернення до компанії. Жоден інструмент не замінює патологічне чи молекулярне дослідження або рішення лікаря; прямого порівняння клінічних результатів немає. Стаття не замінює консультації кваліфікованого лікаря."
translations:
  es:
    title: Sophont predice actividad génica a partir de láminas. ¿Qué está demostrado?
    summary: Holon-S1 predice señales espaciales en imágenes patológicas; OpenOnco permite revisar reglas con fuentes. Esta comparación no demuestra mejores resultados clínicos.
    body:
      - type: p
        text: "El 20 de octubre, la empresa emergente Sophont anunció Holon-S1. Predice dónde podrían estar activos genes y programas biológicos en un tumor a partir de una lámina histológica habitual teñida con hematoxilina y eosina. Sophont ofrece un ejemplo interactivo e invita a colaborar en investigación. Su informe técnico, elaborado por la empresa y fechado el 13 de octubre, describe evaluaciones retrospectivas y casos de búsqueda de biomarcadores. Una predicción basada en una imagen no es una medición directa de la expresión génica. Estos materiales no demuestran que usar el modelo mejore las decisiones terapéuticas o la supervivencia."
      - type: p
        text: "Las herramientas intervienen en etapas distintas. Holon-S1 estudia imágenes de tejido para generar hipótesis de investigación; OpenOnco, gratuito y con código bajo licencia MIT, muestra en el navegador reglas oncológicas con fuentes y borradores alternativos para el comité de tumores, pero no lee láminas ni mide expresión génica. El código y las reglas de OpenOnco son públicos, aunque su contenido clínico sigue en revisión. El 21 de octubre, la página de Sophont no publicaba una licencia del código de Holon-S1 ni un precio; ofrecía acceso mediante contacto. Ninguna herramienta sustituye la anatomía patológica, las pruebas moleculares o el criterio médico; no existe una comparación directa de resultados clínicos. Este artículo no sustituye a un médico cualificado."
  pt:
    title: A Sophont prevê atividade genética em lâminas. O que está demonstrado?
    summary: O Holon-S1 prevê sinais espaciais em imagens de patologia; o OpenOnco permite rever regras com fontes. Esta comparação não prova melhores resultados clínicos.
    body:
      - type: p
        text: "Em 20 de outubro, a startup Sophont anunciou o Holon-S1. O modelo prevê onde genes e programas biológicos poderão estar ativos num tumor a partir de uma lâmina histológica habitual corada com hematoxilina e eosina. A Sophont disponibiliza um exemplo interativo e convida a colaborações de investigação. O relatório técnico da própria empresa, datado de 13 de outubro, descreve avaliações retrospetivas e estudos de caso sobre biomarcadores. Uma previsão baseada numa imagem não é uma medição direta da expressão genética. Estes materiais não demonstram que o uso do modelo melhore decisões terapêuticas ou a sobrevivência."
      - type: p
        text: "As ferramentas atuam em etapas diferentes. O Holon-S1 analisa imagens de tecido para gerar hipóteses de investigação; o OpenOnco, gratuito e com código sob licença MIT, mostra no navegador regras oncológicas com fontes e rascunhos alternativos para discussão em reunião multidisciplinar, mas não lê lâminas nem mede expressão genética. O código e as regras do OpenOnco são públicos, embora o conteúdo clínico ainda esteja em revisão. Em 21 de outubro, a página da Sophont não publicava licença do código do Holon-S1 nem preço; oferecia acesso mediante contacto. Nenhuma ferramenta substitui a anatomia patológica, os testes moleculares ou o juízo clínico; não existe comparação direta de resultados clínicos. Este artigo não substitui um médico qualificado."
  de:
    title: Sophont sagt Genaktivität aus Gewebeschnitten voraus. Was ist belegt?
    summary: Holon-S1 sagt räumliche Signale aus Pathologiebildern voraus; OpenOnco zeigt belegte Regeln. Dieser Vergleich belegt keine besseren Behandlungsergebnisse.
    body:
      - type: p
        text: "Am 20. Oktober stellte das Start-up Sophont Holon-S1 vor. Das Modell sagt anhand eines üblichen, mit Hämatoxylin und Eosin gefärbten Gewebeschnitts voraus, wo Gene und biologische Programme in einem Tumor aktiv sein könnten. Sophont zeigt ein interaktives Beispiel und lädt zur Forschungszusammenarbeit ein. Der unternehmenseigene technische Bericht vom 13. Oktober beschreibt retrospektive Auswertungen und Fallbeispiele zur Biomarkersuche. Eine Vorhersage aus einem Bild ist keine direkte Messung der Genexpression. Die veröffentlichten Materialien belegen nicht, dass der Einsatz des Modells Therapieentscheidungen oder das Überleben verbessert."
      - type: p
        text: "Die Werkzeuge betreffen unterschiedliche Schritte. Holon-S1 untersucht Gewebebilder, um Forschungshypothesen zu entwickeln. Das kostenlose, MIT-lizenzierte Browserwerkzeug OpenOnco zeigt onkologische Regeln mit Quellen und alternative Entwürfe für die Tumorkonferenz, kann aber weder Schnitte lesen noch Genexpression messen. OpenOncos Code und Regeln sind öffentlich, während die klinischen Inhalte noch geprüft werden. Am 21. Oktober veröffentlichte Sophonts Produktseite weder eine Quellcodelizenz für Holon-S1 noch einen Preis; für den Zugang soll man Kontakt aufnehmen. Keines der Werkzeuge ersetzt Pathologie, molekulare Tests oder ärztliche Beurteilung; ein direkter Vergleich klinischer Ergebnisse fehlt. Dieser Artikel ersetzt keine qualifizierte ärztliche Beratung."
  fr:
    title: Sophont prédit l'activité des gènes sur lames. Que sait-on vraiment ?
    summary: Holon-S1 prédit des signaux spatiaux à partir d'images de pathologie ; OpenOnco présente des règles sourcées. Cette comparaison ne prouve aucun bénéfice clinique.
    body:
      - type: p
        text: "Le 20 octobre, la jeune entreprise Sophont a annoncé Holon-S1. Ce modèle prédit où des gènes et des programmes biologiques pourraient être actifs dans une tumeur à partir d'une lame histologique courante colorée à l'hématoxyline-éosine. Sophont propose un exemple interactif et invite à des collaborations de recherche. Son rapport technique, rédigé par l'entreprise et daté du 13 octobre, décrit des évaluations rétrospectives et des études de cas sur les biomarqueurs. Une prédiction tirée d'une image n'est pas une mesure directe de l'expression génique. Ces documents ne démontrent pas que l'utilisation du modèle améliore les choix thérapeutiques ou la survie."
      - type: p
        text: "Les outils interviennent à des étapes différentes. Holon-S1 étudie des images de tissus pour produire des hypothèses de recherche ; OpenOnco, gratuit et doté d'un code sous licence MIT, affiche dans le navigateur des règles oncologiques sourcées et des projets d'options pour la réunion de concertation pluridisciplinaire, mais ne lit pas les lames et ne mesure pas l'expression génique. Le code et les règles d'OpenOnco sont publics, tandis que son contenu clinique reste en cours de révision. Au 21 octobre, la page de Sophont ne publiait ni licence du code d'Holon-S1 ni prix ; l'accès passait par une prise de contact. Aucun outil ne remplace l'anatomopathologie, les tests moléculaires ou le jugement clinique ; aucune comparaison directe des résultats cliniques n'existe. Cet article ne remplace pas un médecin qualifié."
  it:
    title: Sophont predice l'attività genica dai vetrini. Che cosa è dimostrato?
    summary: Holon-S1 predice segnali spaziali dalle immagini istologiche; OpenOnco mostra regole con fonti. Questo confronto non dimostra migliori esiti clinici.
    body:
      - type: p
        text: "Il 20 ottobre la startup Sophont ha annunciato Holon-S1. Il modello prevede dove geni e programmi biologici potrebbero essere attivi in un tumore a partire da un comune vetrino istologico colorato con ematossilina ed eosina. Sophont offre un esempio interattivo e invita a collaborazioni di ricerca. Il rapporto tecnico redatto dall'azienda, datato 13 ottobre, descrive valutazioni retrospettive e casi di ricerca di biomarcatori. Una previsione ricavata da un'immagine non è una misura diretta dell'espressione genica. Questi materiali non dimostrano che l'uso del modello migliori le scelte terapeutiche o la sopravvivenza."
      - type: p
        text: "Gli strumenti operano in fasi diverse. Holon-S1 studia immagini tissutali per formulare ipotesi di ricerca; OpenOnco, gratuito e con codice sotto licenza MIT, mostra nel browser regole oncologiche con fonti e bozze alternative per il gruppo multidisciplinare, ma non legge vetrini né misura l'espressione genica. Il codice e le regole di OpenOnco sono pubblici, mentre i contenuti clinici sono ancora in revisione. Al 21 ottobre la pagina di Sophont non pubblicava una licenza del codice di Holon-S1 né un prezzo; proponeva di contattare l'azienda per l'accesso. Nessuno dei due strumenti sostituisce l'anatomia patologica, i test molecolari o il giudizio clinico; manca un confronto diretto degli esiti clinici. Questo articolo non sostituisce un medico qualificato."
  da:
    title: Sophont forudsiger genaktivitet fra vævssnit. Hvad er dokumenteret?
    summary: Holon-S1 forudsiger rumlige signaler fra patologibilleder; OpenOnco viser regler med kilder. Sammenligningen dokumenterer ikke bedre behandlingsresultater.
    body:
      - type: p
        text: "Den 20. oktober annoncerede startupvirksomheden Sophont Holon-S1. Modellen forudsiger, hvor gener og biologiske programmer kan være aktive i en tumor ud fra et almindeligt vævssnit farvet med hæmatoxylin og eosin. Sophont viser et interaktivt eksempel og inviterer til forskningssamarbejde. Virksomhedens egen tekniske rapport fra 13. oktober beskriver retrospektive evalueringer og eksempler på biomarkørforskning. En forudsigelse ud fra et billede er ikke en direkte måling af genekspression. Materialet dokumenterer ikke, at brug af modellen forbedrer behandlingsvalg eller overlevelse."
      - type: p
        text: "Værktøjerne bruges på forskellige trin. Holon-S1 undersøger vævsbilleder for at danne forskningshypoteser; det gratis, MIT-licenserede browserbaserede OpenOnco viser onkologiske regler med kilder og alternative udkast til drøftelse på en tværfaglig konference, men kan ikke læse vævssnit eller måle genekspression. OpenOncos kode og regler er offentlige, mens det kliniske indhold stadig gennemgås. Den 21. oktober offentliggjorde Sophonts produktside hverken kildekodelicens for Holon-S1 eller pris; adgang blev tilbudt via kontakt. Ingen af værktøjerne erstatter patologi, molekylære tests eller lægelig vurdering, og der findes ingen direkte sammenligning af kliniske resultater. Artiklen erstatter ikke en kvalificeret læge."
  sv:
    title: Sophont förutsäger genaktivitet från vävnadssnitt. Vad är belagt?
    summary: Holon-S1 förutsäger rumsliga signaler från patologibilder; OpenOnco visar regler med källor. Jämförelsen visar inte bättre kliniska resultat.
    body:
      - type: p
        text: "Den 20 oktober presenterade startupföretaget Sophont Holon-S1. Modellen förutsäger var gener och biologiska program kan vara aktiva i en tumör utifrån ett vanligt vävnadssnitt färgat med hematoxylin och eosin. Sophont visar ett interaktivt exempel och bjuder in till forskningssamarbete. Företagets egen tekniska rapport, daterad den 13 oktober, beskriver retrospektiva utvärderingar och fallstudier om biomarkörer. En förutsägelse från en bild är inte en direkt mätning av genuttryck. Materialet visar inte att användning av modellen förbättrar behandlingsval eller överlevnad."
      - type: p
        text: "Verktygen används i olika steg. Holon-S1 undersöker vävnadsbilder för att skapa forskningshypoteser; kostnadsfria, MIT-licensierade OpenOnco visar källbelagda onkologiska regler och alternativa utkast för multidisciplinär tumörkonferens i webbläsaren, men kan inte läsa vävnadssnitt eller mäta genuttryck. OpenOncos kod och regler är offentliga, men det kliniska innehållet granskas fortfarande. Den 21 oktober publicerade Sophonts produktsida varken någon källkodslicens för Holon-S1 eller något pris; tillgång erbjöds via kontakt. Inget av verktygen ersätter patologi, molekylära tester eller läkarens bedömning, och ingen direkt jämförelse av kliniska resultat finns. Artikeln ersätter inte en kvalificerad läkare."
  nb:
    title: Sophont forutsier genaktivitet fra vevssnitt. Hva er dokumentert?
    summary: Holon-S1 forutsier romlige signaler fra patologibilder; OpenOnco viser regler med kilder. Sammenligningen dokumenterer ikke bedre kliniske resultater.
    body:
      - type: p
        text: "Den 20. oktober lanserte oppstartsbedriften Sophont Holon-S1. Modellen forutsier hvor gener og biologiske programmer kan være aktive i en svulst ut fra et vanlig vevssnitt farget med hematoksylin og eosin. Sophont viser et interaktivt eksempel og inviterer til forskningssamarbeid. Selskapets egen tekniske rapport fra 13. oktober beskriver retrospektive evalueringer og kasus om biomarkører. En forutsigelse fra et bilde er ikke en direkte måling av genuttrykk. Materialet dokumenterer ikke at bruk av modellen forbedrer behandlingsvalg eller overlevelse."
      - type: p
        text: "Verktøyene brukes i ulike trinn. Holon-S1 undersøker vevsbilder for å danne forskningshypoteser; gratis, MIT-lisensierte OpenOnco viser kildebelagte onkologiske regler og alternative utkast for tverrfaglig kreftmøte i nettleseren, men kan ikke lese vevssnitt eller måle genuttrykk. OpenOncos kode og regler er offentlige, mens det kliniske innholdet fortsatt vurderes. Den 21. oktober oppga Sophonts produktside verken kildekodelisens for Holon-S1 eller pris; tilgang ble tilbudt ved kontakt. Ingen av verktøyene erstatter patologi, molekylære tester eller legens vurdering, og det finnes ingen direkte sammenligning av kliniske resultater. Artikkelen erstatter ikke en kvalifisert lege."
  fi:
    title: Sophont ennustaa geenien aktiivisuutta kudosleikkeistä. Mitä on osoitettu?
    summary: Holon-S1 ennustaa alueellisia signaaleja patologian kuvista; OpenOnco näyttää lähteistetyt säännöt. Vertailu ei osoita parempia hoitotuloksia.
    body:
      - type: p
        text: "Sophont-yritys julkisti Holon-S1:n 20. lokakuuta. Malli ennustaa tavallisesta hematoksyliinillä ja eosiinilla värjätystä kudosleikkeestä, missä geenit ja biologiset ohjelmat saattavat olla aktiivisia kasvaimessa. Sophont esittää vuorovaikutteisen esimerkin ja kutsuu tutkimusyhteistyöhön. Yhtiön oma 13. lokakuuta päivätty tekninen raportti kuvaa retrospektiivisiä arviointeja ja biomarkkereita koskevia tapausesimerkkejä. Kuvasta tehty ennuste ei ole geenien ilmentymisen suora mittaus. Aineisto ei osoita, että mallin käyttö parantaisi hoitovalintoja tai elossaoloa."
      - type: p
        text: "Työkalut toimivat eri vaiheissa. Holon-S1 tutkii kudoskuvia tutkimushypoteesien muodostamiseksi. Maksuton, MIT-lisensoitu OpenOnco näyttää selaimessa lähteistettyjä onkologisia sääntöjä ja vaihtoehtoisia luonnoksia moniammatillisen kokouksen keskusteluun, mutta se ei lue kudosleikkeitä eikä mittaa geenien ilmentymistä. OpenOncon koodi ja säännöt ovat julkisia, vaikka kliininen sisältö on yhä arvioitavana. Sophontin tuotesivu ei 21. lokakuuta ilmoittanut Holon-S1:n lähdekoodilisenssiä eikä hintaa; käyttöä tarjottiin yhteydenoton kautta. Kumpikaan työkalu ei korvaa patologista tai molekyylitutkimusta eikä lääkärin harkintaa, eikä kliinisistä tuloksista ole suoraa vertailua. Artikkeli ei korvaa pätevää lääkäriä."
