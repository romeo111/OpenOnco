title:
  en: Biodesix plans a CT-and-blood lung test. What exists today?
  uk: Biodesix планує тест для легень за КТ і кров’ю. Що вже існує?
summary:
  en: A new lung-nodule test is in development, with first data promised for December. We compare its proposed workflow with OpenOnco’s current role.
  uk: Новий тест для легеневих вузлів розробляють, а перші дані обіцяють у грудні. Порівнюємо його майбутню роль із нинішніми функціями OpenOnco.
sources:
  - citation: "Biodesix. Digital Diagnostics announcement, 19 October 2026. Accessed 22 October 2026."
    id: "https://investors.biodesix.com/news-releases/news-release-details/biodesix-adds-digital-diagnostics-lung-pipeline-creating-new"
  - citation: "Biodesix. Nodify Lung test information. Accessed 22 October 2026."
    id: "https://www.biodesix.com/tests/nodify-lung"
  - citation: "OpenOnco. Capabilities and clinical-review status. Accessed 22 October 2026."
    id: "https://openonco.info/capabilities.html"
  - citation: "OpenOnco. Public source and MIT licence. Accessed 22 October 2026."
    id: "https://github.com/romeo111/OpenOnco"
body:
  en:
    - type: p
      text: "On 19 October, Biodesix announced a digital diagnostic in development with Vanderbilt: it would extract features from CT images of lung nodules and complement its existing Nodify Lung blood tests. The company expects first performance data on 3 December 2026 and commercial availability in 2028. Its announced prospective STRATIFY study is intended to collect matched imaging, blood-marker and outcome data. These are plans, not published validation of the new combined test. No sensitivity, specificity or patient-outcome result for that test was supplied in the announcement."
    - type: p
      text: "The products answer different questions. Biodesix aims to estimate whether a lung nodule is malignant from images and blood; OpenOnco does not interpret scans or blood samples. Its free, MIT-licensed, public rules and cited sources help draft oncology discussion paths after clinical facts are known. Clinical content in OpenOnco remains under review. As checked on 22 October, Biodesix described the planned test but did not publish its price or source-code licence. No direct study compares the tools, and neither announcement justifies a claim of better survival. A clinician must interpret findings and choose care; this article is not a substitute for a physician."
  uk:
    - type: p
      text: "19 жовтня Biodesix повідомила про цифровий діагностичний тест, який розробляє разом із Vanderbilt: він має виділяти ознаки з КТ-зображень легеневих вузлів і доповнювати наявні аналізи крові Nodify Lung. Компанія очікує перші дані про точність 3 грудня 2026 року, а комерційну доступність — у 2028 році. Заплановане проспективне дослідження STRATIFY має зібрати зіставлені дані зображень, маркерів крові та клінічних наслідків. Це плани, а не опубліковане підтвердження якості нового комбінованого тесту. У повідомленні немає його чутливості, специфічності чи результатів для пацієнтів."
    - type: p
      text: "Продукти відповідають на різні питання. Biodesix прагне оцінювати злоякісність легеневого вузла за зображенням і кров’ю; OpenOnco не аналізує скани чи зразки крові. Його безкоштовні відкриті правила під ліцензією MIT і джерела допомагають готувати чернетки маршрутів для онкологічного консиліуму, коли клінічні факти вже відомі. Клінічний вміст OpenOnco ще перевіряють. Станом на 22 жовтня Biodesix описала майбутній тест, але не опублікувала його ціну чи ліцензію коду. Прямого дослідження для порівняння цих інструментів немає, як і підстав заявляти про краще виживання. Висновки й лікування визначає лікар; ця стаття не замінює його консультацію."
translations:
  es:
    title: Biodesix planea una prueba pulmonar con TC y sangre. ¿Qué existe hoy?
    summary: Se desarrolla una prueba para nódulos pulmonares; los primeros datos se esperan en diciembre. Comparamos su función prevista con la actual de OpenOnco.
    body:
      - type: p
        text: "El 19 de octubre, Biodesix anunció una prueba digital en desarrollo con Vanderbilt: extraería características de imágenes de TC de nódulos pulmonares y complementaría sus análisis de sangre Nodify Lung. La empresa espera los primeros datos de rendimiento el 3 de diciembre de 2026 y su comercialización en 2028. El estudio prospectivo STRATIFY anunciado pretende reunir datos vinculados de imagen, marcadores sanguíneos y resultados clínicos. Son planes, no una validación publicada de la nueva prueba combinada. El anuncio no aportó cifras de sensibilidad, especificidad ni resultados en pacientes para esa prueba."
      - type: p
        text: "Los productos responden a preguntas distintas. Biodesix busca estimar si un nódulo es maligno mediante imágenes y sangre; OpenOnco no interpreta escáneres ni muestras. Sus reglas públicas y gratuitas, bajo licencia MIT y con fuentes citadas, ayudan a preparar borradores para el comité de tumores cuando ya se conocen los datos clínicos. El contenido clínico de OpenOnco sigue en revisión. A 22 de octubre, Biodesix no había publicado el precio ni la licencia del código de la prueba prevista. No existe una comparación directa ni evidencia de mejor supervivencia. El médico debe interpretar los hallazgos y decidir la atención; este artículo no sustituye su consulta."
  pt:
    title: Biodesix planeia um teste pulmonar com TC e sangue. O que existe hoje?
    summary: Está em desenvolvimento um teste para nódulos pulmonares; os primeiros dados são esperados em dezembro. Comparamos o seu papel previsto com o do OpenOnco.
    body:
      - type: p
        text: "Em 19 de outubro, a Biodesix anunciou um teste digital em desenvolvimento com a Vanderbilt: extrairia características de imagens de TC de nódulos pulmonares e complementaria os seus testes sanguíneos Nodify Lung. A empresa prevê os primeiros dados de desempenho para 3 de dezembro de 2026 e disponibilidade comercial em 2028. O estudo prospetivo STRATIFY anunciado pretende reunir dados correspondentes de imagem, marcadores sanguíneos e resultados clínicos. São planos, não validação publicada do novo teste combinado. O anúncio não apresentou sensibilidade, especificidade nem resultados em doentes para esse teste."
      - type: p
        text: "Os produtos respondem a perguntas diferentes. A Biodesix pretende estimar se um nódulo é maligno com imagens e sangue; o OpenOnco não interpreta exames nem amostras. As suas regras públicas, gratuitas e sob licença MIT, com fontes citadas, ajudam a preparar rascunhos para discussão oncológica após serem conhecidos os dados clínicos. O conteúdo clínico do OpenOnco continua em revisão. Em 22 de outubro, a Biodesix não tinha publicado o preço nem a licença do código do teste planeado. Não há comparação direta nem prova de melhor sobrevivência. Cabe ao médico interpretar os achados e decidir os cuidados; este artigo não substitui a consulta médica."
  de:
    title: Biodesix plant einen Lungen-Test aus CT und Blut. Was gibt es schon?
    summary: Ein Test für Lungenknoten wird entwickelt; erste Daten sind für Dezember angekündigt. Wir vergleichen den geplanten Einsatz mit OpenOncos heutiger Funktion.
    body:
      - type: p
        text: "Am 19. Oktober kündigte Biodesix einen mit Vanderbilt entwickelten digitalen Test an: Er soll Merkmale aus CT-Bildern von Lungenknoten auslesen und die bestehenden Bluttests Nodify Lung ergänzen. Das Unternehmen erwartet erste Leistungsdaten am 3. Dezember 2026 und eine Markteinführung 2028. Die angekündigte prospektive STRATIFY-Studie soll zusammengehörige Bild-, Blutmarker- und Ergebnisdaten erfassen. Das sind Pläne, keine veröffentlichte Validierung des neuen kombinierten Tests. Die Mitteilung enthält für ihn weder Sensitivität und Spezifität noch Ergebnisse für Patienten."
      - type: p
        text: "Die Produkte beantworten verschiedene Fragen. Biodesix will anhand von Bildern und Blut einschätzen, ob ein Lungenknoten bösartig ist; OpenOnco wertet weder Scans noch Proben aus. Seine kostenlosen, öffentlichen Regeln unter MIT-Lizenz und Quellen helfen, Entwürfe für Tumorkonferenzen zu erstellen, sobald klinische Fakten vorliegen. OpenOncos klinische Inhalte werden noch geprüft. Am 22. Oktober waren für den geplanten Biodesix-Test weder Preis noch Quellcodelizenz veröffentlicht. Es gibt keinen direkten Vergleich und keinen Beleg für längeres Überleben. Befunde und Versorgung gehören in ärztliche Hände; dieser Artikel ersetzt keine ärztliche Beratung."
  fr:
    title: Biodesix prévoit un test pulmonaire par scanner et sang. Qu'existe-t-il déjà ?
    summary: Un test des nodules pulmonaires est en développement ; les premières données sont annoncées pour décembre. Comparaison avec le rôle actuel d'OpenOnco.
    body:
      - type: p
        text: "Le 19 octobre, Biodesix a annoncé un test numérique en développement avec Vanderbilt : il extrairait des caractéristiques d'images de scanner de nodules pulmonaires et compléterait ses analyses sanguines Nodify Lung. La société attend les premières données de performance le 3 décembre 2026 et une commercialisation en 2028. L'étude prospective STRATIFY annoncée doit recueillir des données appariées d'imagerie, de marqueurs sanguins et de résultats cliniques. Ce sont des projets, pas une validation publiée du nouveau test combiné. Le communiqué ne fournit pour ce test ni sensibilité, ni spécificité, ni résultats chez les patients."
      - type: p
        text: "Ces produits répondent à des questions différentes. Biodesix veut estimer le risque de malignité d'un nodule à partir d'images et de sang ; OpenOnco n'analyse ni scanners ni prélèvements. Ses règles publiques et gratuites sous licence MIT, accompagnées de sources, aident à préparer des projets pour la réunion de concertation oncologique une fois les faits cliniques connus. Le contenu clinique d'OpenOnco reste en cours de vérification. Au 22 octobre, Biodesix ne publiait ni prix ni licence du code du test prévu. Aucune comparaison directe ni preuve d'une meilleure survie n'existe. Le médecin doit interpréter les résultats et décider des soins ; cet article ne remplace pas une consultation médicale."
  it:
    title: Biodesix progetta un test polmonare con TC e sangue. Cosa esiste oggi?
    summary: Un test per noduli polmonari è in sviluppo; i primi dati sono attesi a dicembre. Confrontiamo il suo ruolo previsto con quello attuale di OpenOnco.
    body:
      - type: p
        text: "Il 19 ottobre Biodesix ha annunciato un test digitale in sviluppo con Vanderbilt: dovrebbe estrarre caratteristiche dalle immagini TC dei noduli polmonari e integrare gli esami del sangue Nodify Lung già disponibili. L'azienda prevede i primi dati sulle prestazioni il 3 dicembre 2026 e la disponibilità commerciale nel 2028. Lo studio prospettico STRATIFY annunciato mira a raccogliere dati abbinati di immagini, marcatori ematici ed esiti clinici. Sono progetti, non una validazione pubblicata del nuovo test combinato. Il comunicato non riporta sensibilità, specificità o esiti per i pazienti relativi a quel test."
      - type: p
        text: "I prodotti rispondono a domande diverse. Biodesix vuole stimare se un nodulo sia maligno usando immagini e sangue; OpenOnco non analizza scansioni né campioni. Le sue regole pubbliche e gratuite con licenza MIT e fonti citate aiutano a preparare bozze per il team oncologico dopo che i dati clinici sono noti. I contenuti clinici di OpenOnco sono ancora in revisione. Al 22 ottobre Biodesix non aveva pubblicato prezzo o licenza del codice del test previsto. Non esiste un confronto diretto né una prova di maggiore sopravvivenza. Spetta al medico interpretare i risultati e decidere le cure; questo articolo non sostituisce una visita medica."
  da:
    title: Biodesix planlægger en lungetest med CT og blod. Hvad findes nu?
    summary: En test for lungeknuder er under udvikling; de første data ventes i december. Vi sammenligner den planlagte rolle med OpenOncos nuværende funktion.
    body:
      - type: p
        text: "Den 19. oktober annoncerede Biodesix en digital test under udvikling med Vanderbilt: Den skal udlede kendetegn fra CT-billeder af lungeknuder og supplere de eksisterende Nodify Lung-blodprøver. Virksomheden forventer de første data om testens ydeevne den 3. december 2026 og kommerciel adgang i 2028. Det annoncerede prospektive STRATIFY-studie skal indsamle sammenhørende data om billeder, blodmarkører og kliniske udfald. Det er planer, ikke offentliggjort validering af den nye kombinerede test. Meddelelsen oplyser hverken sensitivitet, specificitet eller patientudfald for testen."
      - type: p
        text: "Produkterne besvarer forskellige spørgsmål. Biodesix vil vurdere, om en lungeknude er ondartet ud fra billeder og blod; OpenOnco fortolker hverken scanninger eller prøver. Dets gratis, offentlige regler under MIT-licens og kildehenvisninger hjælper med udkast til onkologisk drøftelse, når de kliniske fakta kendes. OpenOncos kliniske indhold er stadig under gennemgang. Den 22. oktober havde Biodesix ikke offentliggjort pris eller kodelicens for den planlagte test. Der findes ingen direkte sammenligning eller dokumentation for bedre overlevelse. En læge skal fortolke fund og vælge behandling; artiklen erstatter ikke lægelig rådgivning."
  sv:
    title: Biodesix planerar ett lungtest med CT och blod. Vad finns i dag?
    summary: Ett test för lungnoduli utvecklas; första data väntas i december. Vi jämför dess planerade roll med OpenOncos nuvarande funktion.
    body:
      - type: p
        text: "Den 19 oktober presenterade Biodesix ett digitalt test som utvecklas med Vanderbilt: det ska hämta egenskaper från CT-bilder av lungnoduli och komplettera de befintliga blodtesterna Nodify Lung. Företaget väntar de första prestandadata den 3 december 2026 och kommersiell tillgång 2028. Den aviserade prospektiva STRATIFY-studien ska samla matchade bild-, blodmarkör- och utfallsdata. Detta är planer, inte publicerad validering av det nya kombinerade testet. Pressmeddelandet anger varken sensitivitet, specificitet eller patientutfall för testet."
      - type: p
        text: "Produkterna svarar på olika frågor. Biodesix vill bedöma om en lungnodulus är malign utifrån bilder och blod; OpenOnco tolkar varken skanningar eller prover. Dess kostnadsfria, offentliga regler med MIT-licens och källhänvisningar hjälper till att ta fram utkast för onkologiska diskussioner när kliniska fakta är kända. OpenOncos kliniska innehåll granskas fortfarande. Den 22 oktober hade Biodesix inte publicerat pris eller källkodslicens för det planerade testet. Ingen direkt jämförelse eller evidens för bättre överlevnad finns. En läkare måste tolka fynd och besluta om vård; artikeln ersätter inte läkarkonsultation."
  nb:
    title: Biodesix planlegger en lungetest med CT og blod. Hva finnes nå?
    summary: En test for lungeknuter utvikles; de første dataene ventes i desember. Vi sammenligner den planlagte rollen med OpenOncos nåværende funksjon.
    body:
      - type: p
        text: "19. oktober kunngjorde Biodesix en digital test under utvikling med Vanderbilt: Den skal hente trekk fra CT-bilder av lungeknuter og supplere de eksisterende Nodify Lung-blodprøvene. Selskapet venter de første ytelsesdataene 3. desember 2026 og kommersiell tilgjengelighet i 2028. Den varslede prospektive STRATIFY-studien skal samle sammenkoblede data om bilder, blodmarkører og kliniske utfall. Dette er planer, ikke publisert validering av den nye kombinerte testen. Meldingen oppgir verken sensitivitet, spesifisitet eller pasientutfall for testen."
      - type: p
        text: "Produktene svarer på ulike spørsmål. Biodesix vil vurdere om en lungeknute er ondartet ved hjelp av bilder og blod; OpenOnco tolker verken skanninger eller prøver. De gratis, offentlige reglene med MIT-lisens og kildehenvisninger hjelper med utkast til onkologiske drøftinger når kliniske fakta er kjent. OpenOncos kliniske innhold er fortsatt under gjennomgang. Per 22. oktober hadde Biodesix ikke publisert pris eller kildekodelisens for den planlagte testen. Det finnes ingen direkte sammenligning eller dokumentasjon på bedre overlevelse. En lege må tolke funn og velge behandling; artikkelen erstatter ikke legekonsultasjon."
  fi:
    title: Biodesix suunnittelee keuhkotestiä TT-kuvista ja verestä. Mitä on jo saatavilla?
    summary: Keuhkokyhmyjen testi on kehitteillä, ja ensimmäisiä tuloksia odotetaan joulukuussa. Vertaamme sen suunniteltua tehtävää OpenOncon nykyiseen käyttöön.
    body:
      - type: p
        text: "Biodesix ilmoitti 19. lokakuuta Vanderbiltin kanssa kehitteillä olevasta digitaalisesta testistä: sen on tarkoitus poimia piirteitä keuhkokyhmyjen TT-kuvista ja täydentää nykyisiä Nodify Lung -verikokeita. Yhtiö odottaa ensimmäisiä suorituskykytietoja 3. joulukuuta 2026 ja kaupallista saatavuutta vuonna 2028. Ilmoitetun prospektiivisen STRATIFY-tutkimuksen on tarkoitus kerätä toisiinsa yhdistettyjä kuva-, verimerkkiaine- ja kliinisiä tulostietoja. Nämä ovat suunnitelmia, eivät uuden yhdistetyn testin julkaistua validointia. Tiedote ei antanut testille herkkyys- tai spesifisyyslukuja eikä potilastuloksia."
      - type: p
        text: "Tuotteet vastaavat eri kysymyksiin. Biodesix pyrkii arvioimaan kuvien ja veren avulla, onko keuhkokyhmy pahanlaatuinen; OpenOnco ei tulkitse kuvia eikä näytteitä. Sen ilmaiset, julkiset MIT-lisensoidut säännöt ja lähdeviitteet auttavat laatimaan keskusteluluonnoksia, kun kliiniset tiedot ovat selvillä. OpenOncon kliininen sisältö on yhä arvioitavana. Biodesix ei ollut 22. lokakuuta julkaissut suunnitellun testin hintaa tai lähdekoodin lisenssiä. Työkaluja ei ole verrattu suoraan eikä paremmasta eloonjäämisestä ole näyttöä. Lääkärin tulee tulkita löydökset ja päättää hoidosta; artikkeli ei korvaa lääkärin arviota."
