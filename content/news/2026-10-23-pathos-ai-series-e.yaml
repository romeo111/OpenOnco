title:
  en: Pathos raises $237 million for AI-led drug development. What is proven?
  uk: Pathos залучила $237 млн на розробку ліків із ШІ. Що доведено?
summary:
  en: Its Foundry platform helps choose oncology assets and design trials; a funding round does not establish better patient outcomes.
  uk: Платформа Foundry допомагає обирати онкологічні препарати для розробки й планувати дослідження; раунд фінансування не доводить кращих результатів для пацієнтів.
sources:
- citation: Pathos AI. Series E company announcement, 23 October 2026. Checked 25 October 2026.
  id: https://www.pathos.com/pathos-ai-secures-237-million-in-series-e-financing-to-scale-agentic-ai-drug-development-platform-and-advance-oncology-pipeline
- citation: Pathos AI. PathOS platform and Foundry product description. Checked 25 October 2026.
  id: https://www.pathos.com/platform
- citation: OpenOnco. Capabilities and clinical limitations. Checked 25 October 2026.
  id: https://openonco.info/capabilities.html
- citation: OpenOnco. Public source and MIT licence. Checked 25 October 2026.
  id: https://github.com/romeo111/OpenOnco
body:
  en:
  - type: p
    text: 'On 23 October, Pathos AI said it closed a $237 million Series E round at an approximately $3 billion valuation. The company says the money will expand Foundry and advance its oncology drug pipeline, including JSKN016 toward a registration study. On its product page, Pathos describes Scout for selecting investigational assets, Sprint for trial execution and Foundry as their shared AI core. Its claim of access to more than 200 petabytes of linked oncology data is company-reported. Financing and scale are not clinical endpoints: this announcement contains no controlled evidence that Foundry improves survival or trial success.'
  - type: p
    text: OpenOnco serves a different workflow. Its public, MIT-licensed rules and citations help draft options for clinical discussion from structured facts; the site is free to read, but clinical content remains under review. Pathos uses proprietary multimodal data to choose and develop drugs, not to offer a public treatment-plan service. Its public pages do not list a Foundry source-code licence or user price; that does not tell us its private contract terms. OpenOnco cannot discover drugs or validate Pathos's models, and no direct clinical comparison establishes either tool as more effective. The useful question is whether each claim can be checked at its own stage of work. This article does not replace a physician. Sources checked 25 October 2026.
  uk:
  - type: p
    text: '23 жовтня Pathos AI повідомила про завершення раунду фінансування Series E на $237 млн за оцінки компанії приблизно у $3 млрд. За словами Pathos, кошти підуть на розвиток Foundry та онкологічних препаратів у її портфелі, зокрема на підготовку реєстраційного дослідження JSKN016. На сторінці продукту компанія описує Scout для вибору дослідних препаратів, Sprint для проведення випробувань і Foundry як спільну основу з ШІ. Заява про доступ до понад 200 петабайт пов''язаних онкологічних даних походить від самої компанії. Фінансування й масштаб даних не є клінічними результатами: повідомлення не містить контрольованих доказів, що Foundry поліпшує виживання чи успішність випробувань.'
  - type: p
    text: OpenOnco працює на іншому етапі. Його відкриті правила під ліцензією MIT і посилання на джерела допомагають створювати чернетки варіантів для клінічного обговорення на основі структурованих даних; сайт можна читати безкоштовно, але клінічний вміст ще проходить перевірку. Pathos використовує закриті мультимодальні дані для вибору й розробки ліків, а не пропонує публічний сервіс планів лікування. На відкритих сторінках Pathos немає ліцензії на код Foundry чи ціни для користувача; це не розкриває приватних умов контрактів. OpenOnco не відкриває нові препарати й не перевіряє моделі Pathos; прямого клінічного порівняння ефективності цих інструментів немає. Важливо перевіряти заяви кожного на відповідному етапі роботи. Стаття не замінює консультацію лікаря. Джерела перевірено 25 жовтня 2026 року.
translations:
  es:
    title: Pathos recauda 237 millones de dólares para el desarrollo de fármacos impulsado por la IA. ¿Qué está demostrado?
    summary: Su plataforma Foundry ayuda a elegir activos oncológicos y diseñar ensayos; una ronda de financiación no establece mejores resultados para los pacientes.
    body:
    - type: p
      text: 'El 23 de octubre, Pathos AI dijo que había cerrado una ronda Serie E de 237 millones de dólares con una valoración de aproximadamente 3 mil millones de dólares. La compañía dice que el dinero ampliará Foundry y avanzará en su cartera de medicamentos oncológicos, incluido JSKN016, hacia un estudio de registro. En la página de su producto, Pathos describe Scout para seleccionar fármacos en investigación y Sprint para ejecutar ensayos clínicos y a Foundry como su núcleo de IA compartido. Su afirmación de acceso a más de 200 petabytes de datos oncológicos vinculados procede de la propia empresa. La financiación y la escala no son criterios de valoración clínicos: este anuncio no contiene evidencia controlada de que Foundry mejore la supervivencia o la tasa de éxito de los ensayos.'
    - type: p
      text: OpenOnco ofrece un flujo de trabajo diferente. Sus reglas públicas bajo licencia MIT y las referencias a las fuentes ayudan a redactar opciones para la discusión clínica a partir de hechos estructurados; el sitio es de lectura gratuita, pero el contenido clínico sigue bajo revisión. Pathos utiliza datos multimodales patentados para elegir y desarrollar medicamentos, no para ofrecer un servicio público de plan de tratamiento. Sus páginas públicas no incluyen una licencia de código fuente de Foundry ni un precio para el usuario; eso no nos dice los términos de su contrato privado. OpenOnco no puede descubrir fármacos ni validar los modelos de Pathos, y no existe una comparación clínica directa que demuestre que una herramienta sea más eficaz que la otra. La pregunta útil es si cada afirmación puede comprobarse en su propia etapa de trabajo. Este artículo no reemplaza a un médico. Fuentes consultadas el 25 de octubre de 2026.
  pt:
    title: Pathos arrecada US$ 237 milhões para o desenvolvimento de medicamentos apoiados por IA. O que está comprovado?
    summary: A plataforma Foundry ajuda a selecionar candidatos a medicamentos oncológicos e a planear ensaios clínicos; uma rodada de financiamento não estabelece melhores resultados para os pacientes.
    body:
    - type: p
      text: 'Em 23 de outubro, a Pathos AI disse que fechou uma rodada da Série E de US$ 237 milhões com uma avaliação de aproximadamente US$ 3 bilhões. A empresa afirma que o dinheiro expandirá a Foundry e avançará seu pipeline de medicamentos oncológicos, incluindo o JSKN016, para um estudo de registro. Na página do produto, Pathos descreve o Scout para selecionar ativos investigacionais, o Sprint para conduzir ensaios clínicos e o Foundry como seu núcleo de IA compartilhado. Sua alegação de acesso a mais de 200 petabytes de dados oncológicos vinculados é relatada pela empresa. O financiamento e a escala não são desfechos clínicos: este anúncio não contém nenhuma evidência controlada de que o Foundry melhore a sobrevivência ou o sucesso do ensaio.'
    - type: p
      text: OpenOnco atende a um fluxo de trabalho diferente. Suas regras e citações públicas licenciadas pelo MIT ajudam a elaborar opções para discussão clínica a partir de fatos estruturados; o site é de leitura gratuita, mas o conteúdo clínico permanece sob revisão. A Pathos utiliza dados multimodais proprietários para escolher e desenvolver medicamentos, e não para oferecer um serviço público de plano de tratamento. Suas páginas públicas não listam uma licença de código-fonte do Foundry ou preço de usuário; isso não nos diz os termos do contrato privado. A OpenOnco não se destina à descoberta de medicamentos ou validar os modelos do Pathos, e nenhuma comparação clínica direta estabelece qualquer ferramenta como mais eficaz. A questão útil é se cada afirmação pode ser verificada na sua própria fase de trabalho. Este artigo não substitui um médico. Fontes verificadas em 25 de outubro de 2026.
  de:
    title: Pathos sammelt 237 Millionen US-Dollar für die KI-gesteuerte Arzneimittelentwicklung. Was ist bewiesen?
    summary: Die Foundry-Plattform soll Wirkstoffkandidaten auswählen und Studien planen. Eine Finanzierungsrunde belegt keine besseren Behandlungsergebnisse.
    body:
    - type: p
      text: 'Am 23. Oktober gab Pathos AI bekannt, dass es eine Serie-E-Runde im Wert von 237 Millionen US-Dollar mit einer Bewertung von etwa 3 Milliarden US-Dollar abgeschlossen hat. Das Unternehmen sagt, dass das Geld Foundry erweitern und seine Onkologie-Arzneimittelpipeline, einschließlich JSKN016, im Hinblick auf eine Zulassungsstudie vorantreiben wird. Auf seiner Produktseite beschreibt Pathos Scout zur Auswahl von Wirkstoffkandidaten, Sprint zur Durchführung klinischer Studien und Foundry als ihren gemeinsamen KI-Kern. Die Angabe zum Zugriff auf mehr als 200 Petabyte verknüpfter onkologischer Daten wird vom Unternehmen angegeben. Finanzierung und Umfang sind keine klinischen Endpunkte: Diese Ankündigung enthält keine kontrollierten Beweise dafür, dass Foundry das Überleben oder den Studienerfolg verbessert.'
    - type: p
      text: OpenOnco bedient einen anderen Workflow. Seine öffentlich einsehbaren Regeln unter MIT-Lizenz und Quellenangaben helfen dabei, Optionen für die klinische Diskussion auf der Grundlage strukturierter Fakten zu entwerfen; Die Nutzung der Website ist kostenlos, klinische Inhalte werden jedoch noch geprüft. Pathos nutzt proprietäre multimodale Daten zur Auswahl und Entwicklung von Arzneimitteln und nicht, um einen öffentlichen Behandlungsplandienst anzubieten. Auf den öffentlichen Seiten wird weder eine Foundry-Quellcode-Lizenz noch ein Benutzerpreis aufgeführt. das sagt uns nichts über die privaten Vertragsbedingungen. OpenOnco ist nicht für die Entdeckung neuer Wirkstoffe ausgelegt noch Pathos-Modelle validieren, und kein direkter klinischer Vergleich ergibt, dass eines der beiden Tools wirksamer ist. Die sinnvolle Frage ist, ob jede Aussage in seinem eigenen Arbeitsstadium überprüft werden kann. Dieser Artikel ersetzt keinen Arzt. Quellen überprüft am 25. Oktober 2026.
  fr:
    title: Pathos lève 237 millions de dollars pour le développement de médicaments basés sur l'IA. Qu'est-ce qui est prouvé ?
    summary: Sa plateforme Foundry aide à choisir les candidats médicaments en oncologie et à concevoir des essais ; une levée de fonds ne démontre pas de meilleurs résultats pour les patients.
    body:
    - type: p
      text: 'Le 23 octobre, Pathos AI a annoncé avoir clôturé un tour de table de série E de 237 millions de dollars pour une valorisation d''environ 3 milliards de dollars. La société affirme que l’argent permettra d’étendre Foundry et de faire progresser son pipeline de médicaments oncologiques, y compris le JSKN016, vers une étude d’enregistrement. Sur sa page produit, Pathos décrit Scout pour la sélection des candidats médicaments expérimentaux, Sprint pour l''exécution des essais et Foundry comme noyau d''IA partagé. Sa revendication d''accès à plus de 200 pétaoctets de données liées en oncologie est rapportée par l''entreprise. Le financement et l''échelle ne sont pas des critères cliniques : cette annonce ne contient aucune preuve contrôlée que Foundry améliore la survie ou le succès des essais.'
    - type: p
      text: OpenOnco sert un flux de travail différent. Ses règles publiques sous licence MIT et ses références aux sources aident à rédiger des options de discussion clinique à partir de faits structurés ; la lecture du site est gratuite, mais le contenu clinique reste en cours de révision. Pathos utilise des données multimodales exclusives pour choisir et développer des médicaments, et non pour proposer un service public de plan de traitement. Ses pages publiques ne répertorient pas de licence de code source Foundry ni de prix d'utilisation ; cela ne nous indique pas les termes de son contrat privé. OpenOnco n’est pas conçu pour découvrir de nouveaux médicaments ni valider les modèles de Pathos, et aucune comparaison clinique directe n'établit que l'un ou l'autre outil est plus efficace. La question utile est de savoir si chaque affirmation peut être vérifiée à son propre stade de travail. Cet article ne remplace pas un médecin. Sources vérifiées le 25 octobre 2026.
  it:
    title: Pathos raccoglie 237 milioni di dollari per lo sviluppo di farmaci guidati dall'intelligenza artificiale. Cosa è dimostrato?
    summary: La sua piattaforma Foundry aiuta a scegliere i candidati farmaci oncologici e a progettare studi clinici; un round di finanziamento non garantisce risultati migliori per i pazienti.
    body:
    - type: p
      text: 'Il 23 ottobre, Pathos AI ha dichiarato di aver chiuso un round di serie E da 237 milioni di dollari con una valutazione di circa 3 miliardi di dollari. L''azienda afferma che il denaro espanderà Foundry e farà avanzare la sua pipeline di farmaci oncologici, incluso JSKN016, verso uno studio di registrazione. Nella pagina del prodotto, Pathos descrive Scout per la selezione deli candidati farmaci sperimentali, Sprint per la conduzione degli studi clinici e Foundry come il nucleo AI condiviso. La sua dichiarazione di accesso a più di 200 petabyte di dati oncologici collegati è segnalata dall''azienda. Il finanziamento e la portata non sono endpoint clinici: questo annuncio non contiene prove controllate che Foundry migliori la sopravvivenza o il successo della sperimentazione.'
    - type: p
      text: OpenOnco offre un flusso di lavoro diverso. Le sue regole pubbliche sotto licenza MIT e le citazioni delle fonti, aiutano a elaborare opzioni per la discussione clinica a partire da fatti strutturati; la lettura del sito è gratuita, ma i contenuti clinici rimangono in fase di revisione. Pathos utilizza dati multimodali proprietari per scegliere e sviluppare farmaci, non per offrire un servizio di piano di trattamento pubblico. Le sue pagine pubbliche non elencano la licenza del codice sorgente Foundry o il prezzo per l'utente; questo non ci dice i suoi termini contrattuali privati. OpenOnco non è progettato per scoprire nuovi farmaci o convalidare i modelli di Pathos e nessun confronto clinico diretto stabilisce che uno degli strumenti sia più efficace. La domanda utile è se ciascuna affermazione può essere verificata nella propria fase di lavoro. Questo articolo non sostituisce il medico. Fonti controllate il 25 ottobre 2026.
  da:
    title: Pathos får 237 millioner dollar til AI-støttet lægemiddeludvikling. Hvad er dokumenteret?
    summary: Foundry skal hjælpe med at vælge kræftlægemidler til udvikling og planlægge forsøg. Finansiering dokumenterer ikke bedre patientresultater.
    body:
    - type: p
      text: 'Den 23. oktober meddelte Pathos AI, at virksomheden havde afsluttet en Series E-finansieringsrunde på 237 millioner dollar til en værdiansættelse på cirka 3 milliarder dollar. Ifølge virksomheden skal pengene udvide Foundry og fremme dens kræftlægemidler under udvikling, herunder JSKN016 mod et registreringsstudie. På produktsiden beskrives Scout til udvælgelse af forsøgspræparater, Sprint til gennemførelse af kliniske forsøg og Foundry som deres fælles AI-grundlag. Oplysningen om adgang til mere end 200 petabyte sammenkædede kræftdata kommer fra virksomheden selv. Penge og datamængde er ikke kliniske resultater: meddelelsen fremlægger ingen kontrolleret dokumentation for, at Foundry forbedrer overlevelse eller forsøgenes succes.'
    - type: p
      text: OpenOnco bruges til en anden opgave. Dets offentlige regler under MIT-licens og kildehenvisninger hjælper med at udarbejde udkast til klinisk drøftelse ud fra strukturerede oplysninger. Siden kan læses gratis, men det kliniske indhold er stadig under gennemgang. Pathos anvender egne multimodale data til at vælge og udvikle lægemidler, ikke til at tilbyde en offentlig tjeneste med behandlingsplaner. De offentlige sider oplyser hverken en kildekodelicens for Foundry eller en brugerpris; private aftalevilkår kendes derfor ikke. OpenOnco er ikke et system til lægemiddelopdagelse og kan ikke validere Pathos’ modeller. Ingen direkte klinisk sammenligning viser, at det ene værktøj er mere effektivt. Hver påstand må vurderes ud fra sit formål. Artiklen erstatter ikke en læge. Kilder kontrolleret 25. oktober 2026.
  sv:
    title: Pathos tar in 237 miljoner dollar för AI-stödd läkemedelsutveckling. Vad är belagt?
    summary: Foundry ska hjälpa till att välja läkemedelskandidater och planera studier. Finansiering visar inte bättre patientresultat.
    body:
    - type: p
      text: 'Den 23 oktober meddelade Pathos AI att bolaget tagit in 237 miljoner dollar i en Series E-runda, till en värdering på omkring 3 miljarder dollar. Enligt bolaget ska pengarna utveckla Foundry och driva dess cancerläkemedel vidare, däribland JSKN016 mot en registreringsstudie. På produktsidan beskrivs Scout för urval av prövningsläkemedel, Sprint för genomförande av kliniska studier och Foundry som deras gemensamma AI-kärna. Uppgiften om tillgång till över 200 petabyte sammanlänkade cancerdata kommer från bolaget självt. Finansiering och datamängd är inga kliniska effektmått: meddelandet ger inga kontrollerade belägg för att Foundry förbättrar överlevnad eller studiers framgång.'
    - type: p
      text: OpenOnco har ett annat användningsområde. Dess offentliga regler under MIT-licens och källhänvisningar hjälper till att ta fram utkast för klinisk diskussion utifrån strukturerade uppgifter. Webbplatsen är gratis att läsa, men det kliniska innehållet granskas fortfarande. Pathos använder egna multimodala data för att välja och utveckla läkemedel, inte för att erbjuda en offentlig tjänst med behandlingsplaner. På de offentliga sidorna anges varken Foundrys källkodslicens eller ett användarpris; privata avtalsvillkor är därför okända. OpenOnco är inte byggt för läkemedelsupptäckt och kan inte validera Pathos modeller. Ingen direkt klinisk jämförelse visar att det ena verktyget är effektivare. Varje påstående bör granskas utifrån sitt syfte. Artikeln ersätter inte en läkare. Källor kontrollerade den 25 oktober 2026.
  nb:
    title: Pathos henter inn 237 millioner dollar til KI-støttet legemiddelutvikling. Hva er dokumentert?
    summary: Foundry skal hjelpe med å velge legemiddelkandidater og planlegge studier. Finansiering viser ikke bedre pasientutfall.
    body:
    - type: p
      text: '23. oktober opplyste Pathos AI at selskapet hadde hentet inn 237 millioner dollar i en Series E-runde, til en verdsettelse på om lag 3 milliarder dollar. Ifølge selskapet skal pengene utvide Foundry og videreutvikle kreftlegemidlene i porteføljen, blant annet JSKN016 mot en registreringsstudie. På produktsiden beskrives Scout for valg av legemiddelkandidater, Sprint for gjennomføring av kliniske studier og Foundry som deres felles KI-kjerne. Opplysningen om tilgang til over 200 petabyte sammenkoblede kreftdata kommer fra selskapet selv. Finansiering og datamengde er ikke kliniske endepunkter: meldingen gir ingen kontrollert dokumentasjon på at Foundry forbedrer overlevelse eller studiesuksess.'
    - type: p
      text: OpenOnco brukes i en annen arbeidsflyt. Offentlige regler under MIT-lisens og kildehenvisninger hjelper med å lage utkast til klinisk diskusjon ut fra strukturerte opplysninger. Nettstedet er gratis å lese, men det kliniske innholdet er fortsatt under vurdering. Pathos bruker egne multimodale data til å velge og utvikle legemidler, ikke til å tilby en offentlig tjeneste med behandlingsplaner. De offentlige sidene oppgir verken kildekodelisens for Foundry eller brukerpris; private avtalevilkår er derfor ukjente. OpenOnco er ikke laget for legemiddeloppdagelse og kan ikke validere Pathos-modellene. Ingen direkte klinisk sammenligning viser at ett av verktøyene er mer effektivt. Hver påstand må vurderes i lys av formålet. Artikkelen erstatter ikke en lege. Kilder kontrollert 25. oktober 2026.
  fi:
    title: Pathos keräsi 237 miljoonaa dollaria tekoälyä hyödyntävään lääkekehitykseen. Mitä on osoitettu?
    summary: Foundry tukee syöpälääkkeiden valintaa kehitykseen ja tutkimusten suunnittelua. Rahoitus ei osoita parempia hoitotuloksia.
    body:
    - type: p
      text: 'Pathos AI ilmoitti 23. lokakuuta saaneensa 237 miljoonan dollarin Series E -rahoituksen. Yhtiön arvoksi arvioitiin noin 3 miljardia dollaria. Yhtiön mukaan varat käytetään Foundryn laajentamiseen ja sen syöpälääkeohjelmien edistämiseen, mukaan lukien JSKN016:n viemiseen kohti rekisteröintitutkimusta. Tuotesivulla Scout kuvataan tutkittavien lääkekandidaattien valinnan välineeksi, Sprint kliinisten tutkimusten toteutuksen tueksi ja Foundry niiden yhteiseksi tekoälypohjaksi. Väite pääsystä yli 200 petatavuun yhdistettyä syöpäaineistoa on yhtiön oma ilmoitus. Rahoitus ja aineiston koko eivät ole kliinisiä tuloksia: tiedote ei esitä kontrolloitua näyttöä siitä, että Foundry parantaisi elossaoloa tai tutkimusten onnistumista.'
    - type: p
      text: OpenOnco palvelee eri tarkoitusta. Sen julkiset MIT-lisensoidut säännöt ja lähdeviitteet auttavat laatimaan vaihtoehtoja kliiniseen keskusteluun jäsennellyistä tiedoista. Sivustoa voi lukea maksutta, mutta kliinistä sisältöä tarkistetaan yhä. Pathos käyttää omia monimuotoisia aineistojaan lääkkeiden valintaan ja kehittämiseen; se ei tarjoa julkista hoitosuunnitelmapalvelua. Sen julkisilla sivuilla ei ilmoiteta Foundryn lähdekoodin lisenssiä tai käyttäjähintaa, joten yksityisten sopimusten ehdot eivät ole tiedossa. OpenOnco ei ole lääkekehitysjärjestelmä eikä voi validoida Pathosin malleja. Suoraa kliinistä vertailua työkalujen paremmuudesta ei ole. Kukin väite on arvioitava omassa käyttötarkoituksessaan. Tämä artikkeli ei korvaa lääkäriä. Lähteet tarkistettu 25. lokakuuta 2026.
