title:
  en: TuMatch gets a study green light. What does it establish?
  uk: TuMatch отримав дозвіл на дослідження. Що це доводить?
summary:
  en: Vivan says a prospective study will enroll at least 10 people with colorectal cancer. Permission to study a tool is not proof of patient benefit.
  uk: Vivan повідомляє про проспективне дослідження щонайменше за участю 10 людей із колоректальним раком. Дозвіл на дослідження не доводить користі для пацієнтів.
sources:
  - citation: "Vivan Therapeutics company announcement, republished by Abu Dhabi Blog, 23 October 2026. Accessed 24 October 2026."
    id: "https://blog.abudhabicityguide.com/hub71-startup-vivan-therapeutics-set-to-begin-tumatch-clinical-registration-study-at-burjeel-cancer-institute-abu-dhabi/"
  - citation: "Vivan Therapeutics. TuMatch product information. Accessed 24 October 2026."
    id: "https://www.vivantx.com/tumatch"
  - citation: "OpenOnco. Capabilities, limitations and review status. Accessed 24 October 2026."
    id: "https://openonco.info/capabilities.html"
  - citation: "OpenOnco. Public source and MIT licence. Accessed 24 October 2026."
    id: "https://github.com/romeo111/OpenOnco"
body:
  en:
    - type: p
      text: "On 23 October, Vivan Therapeutics said it had permission to start a prospective TuMatch study at Burjeel Cancer Institute in Abu Dhabi. The company says it will enroll at least 10 people with colorectal cancer and collect clinical outcomes and health-economics data. That is permission to investigate, not a published result or marketing authorization for the software. The announcement gives no outcome data from this study and no comparison group. Vivan's product page says TuMatch matches tumour genomic profiles to a proprietary drug-response dataset informed by fruit-fly models and produces ranked options for oncologists. Claims on that page about longer life or more effective combinations are company claims, not results of the announced study."
    - type: p
      text: "OpenOnco handles a different step: its free, MIT-licensed public rules use structured clinical facts and cited sources to draft options for discussion. It does not test drugs in fly models or predict an individual response. Its clinical content is still under review. As checked on 24 October, Vivan's product page offers a free introductory call but does not publish a TuMatch test price or source-code licence; a free call is not a free test. No head-to-head clinical study shows either tool improves outcomes over the other. An oncologist must interpret the evidence and decide care. This article does not replace a physician."
  uk:
    - type: p
      text: "23 жовтня Vivan Therapeutics повідомила, що отримала дозвіл розпочати проспективне дослідження TuMatch в Інституті раку Burjeel в Абу-Дабі. За словами компанії, до нього залучать щонайменше 10 людей із колоректальним раком і збиратимуть дані про клінічні результати та економіку охорони здоров’я. Це дозвіл на дослідження, а не опублікований результат чи дозвіл на продаж програми. Повідомлення не містить результатів цього дослідження або групи порівняння. За описом продукту, TuMatch зіставляє геномний профіль пухлини із закритим набором даних про реакцію на ліки, зокрема з моделей на плодових мушках, і ранжує варіанти для онколога. Заяви сайту про довше життя чи ефективніші комбінації є заявами компанії, а не результатами анонсованого дослідження."
    - type: p
      text: "OpenOnco працює на іншому етапі: його безкоштовні відкриті правила під ліцензією MIT використовують структуровані клінічні факти та джерела для підготовки чернеток варіантів до обговорення. Він не випробовує ліки на моделях мушок і не прогнозує індивідуальну відповідь. Його клінічний вміст ще проходить перевірку. Станом на 24 жовтня сайт Vivan пропонував безкоштовну вступну розмову, але не публікував ціну тесту TuMatch чи ліцензію коду; безкоштовна розмова не означає безкоштовний тест. Прямого клінічного порівняння результатів інструментів немає. Докази й лікування оцінює онколог; ця стаття не замінює консультацію лікаря."
translations:
  es:
    title: TuMatch recibe permiso para un estudio. ¿Qué demuestra?
    summary: Vivan anuncia un estudio prospectivo con al menos 10 personas con cáncer colorrectal. Permitir un estudio no demuestra beneficio para los pacientes.
    body:
      - type: p
        text: "El 23 de octubre, Vivan Therapeutics dijo haber recibido permiso para iniciar un estudio prospectivo de TuMatch en el Burjeel Cancer Institute de Abu Dabi. Según la empresa, incluirá al menos a 10 personas con cáncer colorrectal y recogerá resultados clínicos y datos económicos sanitarios. Es permiso para investigar, no un resultado publicado ni autorización para comercializar el software. El anuncio no ofrece resultados del estudio ni un grupo de comparación. La página del producto dice que TuMatch relaciona perfiles genómicos tumorales con datos propios de respuesta a fármacos, basados también en modelos de mosca de la fruta, y ordena opciones para el oncólogo. Las promesas de mayor supervivencia o combinaciones más eficaces son afirmaciones de la empresa, no resultados de este estudio."
      - type: p
        text: "OpenOnco actúa en otra etapa: sus reglas públicas y gratuitas, bajo licencia MIT, usan datos clínicos estructurados y fuentes citadas para preparar borradores de opciones. No ensaya fármacos en moscas ni predice una respuesta individual. Su contenido clínico sigue en revisión. A 24 de octubre, Vivan ofrecía una llamada introductoria gratuita, pero no publicaba el precio de TuMatch ni la licencia de su código; una llamada gratis no equivale a una prueba gratuita. Ningún estudio clínico directo demuestra que un instrumento mejore los resultados frente al otro. El oncólogo debe interpretar la evidencia y decidir la atención; este artículo no sustituye una consulta médica."
  pt:
    title: TuMatch recebe autorização para um estudo. O que demonstra?
    summary: A Vivan anuncia um estudo prospetivo com pelo menos 10 pessoas com cancro colorretal. Autorizar o estudo não demonstra benefício para os doentes.
    body:
      - type: p
        text: "Em 23 de outubro, a Vivan Therapeutics afirmou ter recebido autorização para iniciar um estudo prospetivo do TuMatch no Burjeel Cancer Institute, em Abu Dhabi. Segundo a empresa, incluirá pelo menos 10 pessoas com cancro colorretal e recolherá resultados clínicos e dados de economia da saúde. É autorização para investigar, não um resultado publicado nem autorização de comercialização do software. O anúncio não apresenta resultados deste estudo nem grupo de comparação. A página do produto diz que o TuMatch relaciona perfis genómicos tumorais com dados próprios de resposta a fármacos, também informados por modelos de mosca-da-fruta, e ordena opções para o oncologista. As promessas de maior sobrevivência ou combinações mais eficazes são alegações da empresa, não resultados do estudo anunciado."
      - type: p
        text: "O OpenOnco atua noutra etapa: as suas regras públicas e gratuitas, sob licença MIT, usam dados clínicos estruturados e fontes citadas para preparar opções a discutir. Não testa fármacos em moscas nem prevê a resposta individual. O conteúdo clínico continua em revisão. Em 24 de outubro, a Vivan oferecia uma chamada introdutória gratuita, mas não publicava o preço do TuMatch nem a licença do código; chamada gratuita não significa teste gratuito. Não há estudo clínico direto que demonstre melhores resultados de uma ferramenta face à outra. Cabe ao oncologista interpretar a evidência e decidir os cuidados; este artigo não substitui a consulta médica."
  de:
    title: TuMatch darf untersucht werden. Was beweist das?
    summary: Vivan kündigt eine prospektive Studie mit mindestens 10 Menschen mit Darmkrebs an. Die Erlaubnis zur Studie belegt keinen Nutzen für Patienten.
    body:
      - type: p
        text: "Am 23. Oktober erklärte Vivan Therapeutics, die Genehmigung für eine prospektive TuMatch-Studie am Burjeel Cancer Institute in Abu Dhabi erhalten zu haben. Laut Unternehmen sollen mindestens 10 Menschen mit Darmkrebs teilnehmen; klinische Ergebnisse und gesundheitsökonomische Daten werden erfasst. Das ist eine Studiengenehmigung, kein veröffentlichtes Ergebnis und keine Marktzulassung für die Software. Die Mitteilung enthält weder Ergebnisse dieser Studie noch eine Vergleichsgruppe. Laut Produktseite gleicht TuMatch Tumor-Genomprofile mit firmeneigenen Daten zur Arzneimittelwirkung ab, die auch aus Fruchtfliegenmodellen stammen, und ordnet Optionen für Onkologen. Aussagen über längeres Leben oder wirksamere Kombinationen sind Firmenbehauptungen, keine Ergebnisse der angekündigten Studie."
      - type: p
        text: "OpenOnco setzt an einem anderen Schritt an: Seine kostenlosen, öffentlichen Regeln unter MIT-Lizenz nutzen strukturierte klinische Fakten und Quellen für Entwürfe zur Diskussion. Es testet keine Medikamente an Fliegen und sagt keine individuelle Wirkung voraus. Die klinischen Inhalte werden noch geprüft. Am 24. Oktober bot Vivan ein kostenloses Erstgespräch an, veröffentlichte aber weder einen TuMatch-Preis noch eine Quellcodelizenz; ein Gratisgespräch bedeutet keinen kostenlosen Test. Keine direkte klinische Studie zeigt bessere Ergebnisse des einen gegenüber dem anderen Werkzeug. Ein Onkologe muss die Evidenz bewerten und die Behandlung entscheiden; dieser Artikel ersetzt keine ärztliche Beratung."
  fr:
    title: TuMatch obtient le feu vert pour une étude. Que prouve-t-il ?
    summary: Vivan annonce une étude prospective auprès d'au moins 10 personnes atteintes d'un cancer colorectal. Autoriser l'étude ne prouve aucun bénéfice clinique.
    body:
      - type: p
        text: "Le 23 octobre, Vivan Therapeutics a déclaré avoir obtenu l'autorisation de lancer une étude prospective de TuMatch au Burjeel Cancer Institute, à Abou Dabi. Selon l'entreprise, elle inclura au moins 10 personnes atteintes d'un cancer colorectal et recueillera des résultats cliniques et des données médico-économiques. Il s'agit d'une autorisation d'étudier, pas d'un résultat publié ni d'une autorisation de commercialiser le logiciel. Le communiqué ne présente aucun résultat de cette étude ni groupe comparateur. La page produit indique que TuMatch rapproche les profils génomiques tumoraux de données propriétaires de réponse aux médicaments, issues aussi de modèles chez la drosophile, et classe des options pour l'oncologue. Les promesses de survie prolongée ou de combinaisons plus efficaces sont des affirmations de l'entreprise, pas des résultats de cette étude."
      - type: p
        text: "OpenOnco intervient à une autre étape : ses règles publiques et gratuites sous licence MIT utilisent des données cliniques structurées et des sources citées pour préparer des options à discuter. Il ne teste pas de médicaments chez la mouche et ne prédit pas une réponse individuelle. Son contenu clinique reste en cours de révision. Au 24 octobre, Vivan proposait un appel de présentation gratuit, mais ne publiait ni prix de TuMatch ni licence de son code ; un appel gratuit ne signifie pas un test gratuit. Aucune étude clinique directe ne démontre que l'un améliore davantage les résultats que l'autre. L'oncologue doit interpréter les preuves et décider des soins ; cet article ne remplace pas une consultation médicale."
  it:
    title: TuMatch ottiene il via libera per uno studio. Cosa dimostra?
    summary: Vivan annuncia uno studio prospettico con almeno 10 persone con tumore del colon-retto. Il permesso di studiare lo strumento non prova benefici clinici.
    body:
      - type: p
        text: "Il 23 ottobre Vivan Therapeutics ha dichiarato di aver ottenuto il permesso di avviare uno studio prospettico su TuMatch al Burjeel Cancer Institute di Abu Dhabi. Secondo l'azienda, coinvolgerà almeno 10 persone con tumore del colon-retto e raccoglierà esiti clinici e dati di economia sanitaria. È un'autorizzazione alla ricerca, non un risultato pubblicato né un'autorizzazione a commercializzare il software. Il comunicato non presenta esiti dello studio né un gruppo di confronto. La pagina del prodotto dice che TuMatch confronta profili genomici tumorali con dati proprietari di risposta ai farmaci, basati anche su modelli di moscerino della frutta, e ordina opzioni per l'oncologo. Le promesse di maggiore sopravvivenza o combinazioni più efficaci sono affermazioni aziendali, non risultati dello studio annunciato."
      - type: p
        text: "OpenOnco agisce in una fase diversa: le sue regole pubbliche e gratuite con licenza MIT usano dati clinici strutturati e fonti citate per preparare bozze di opzioni da discutere. Non prova farmaci nei moscerini né predice la risposta individuale. I contenuti clinici sono ancora in revisione. Al 24 ottobre Vivan offriva una chiamata introduttiva gratuita, ma non pubblicava il prezzo di TuMatch né la licenza del codice; chiamata gratuita non significa test gratuito. Nessuno studio clinico diretto dimostra risultati migliori di uno strumento rispetto all'altro. L'oncologo deve interpretare le prove e decidere le cure; questo articolo non sostituisce una visita medica."
  da:
    title: TuMatch får grønt lys til et studie. Hvad viser det?
    summary: Vivan annoncerer et prospektivt studie med mindst 10 personer med tarmkræft. Tilladelse til et studie dokumenterer ikke patientgevinst.
    body:
      - type: p
        text: "Den 23. oktober oplyste Vivan Therapeutics, at virksomheden havde fået tilladelse til at starte et prospektivt TuMatch-studie på Burjeel Cancer Institute i Abu Dhabi. Ifølge virksomheden skal mindst 10 personer med tarmkræft deltage, og der skal indsamles kliniske resultater og sundhedsøkonomiske data. Det er tilladelse til forskning, ikke et offentliggjort resultat eller markedsføringstilladelse til softwaren. Meddelelsen indeholder hverken resultater fra studiet eller en sammenligningsgruppe. Ifølge produktsiden matcher TuMatch tumorers genomprofiler med virksomhedens egne data om lægemiddelrespons, også baseret på bananfluemodeller, og rangerer muligheder for onkologer. Løfter om længere levetid eller mere effektive kombinationer er virksomhedens påstande, ikke resultater fra det annoncerede studie."
      - type: p
        text: "OpenOnco bruges på et andet trin: Dets gratis, offentlige regler under MIT-licens bruger strukturerede kliniske oplysninger og kildehenvisninger til udkast, der kan drøftes. Det tester ikke lægemidler i fluer og forudsiger ikke individuel respons. Det kliniske indhold gennemgås stadig. Den 24. oktober tilbød Vivan en gratis indledende samtale, men oplyste hverken TuMatch-pris eller kodelicens; en gratis samtale er ikke en gratis test. Intet direkte klinisk studie viser bedre resultater med det ene værktøj frem for det andet. En onkolog må vurdere evidensen og beslutte behandlingen; artiklen erstatter ikke lægelig rådgivning."
  sv:
    title: TuMatch får klartecken för en studie. Vad visar det?
    summary: Vivan aviserar en prospektiv studie med minst 10 personer med tjock- eller ändtarmscancer. Tillstånd att studera verktyget visar ingen patientnytta.
    body:
      - type: p
        text: "Den 23 oktober sade Vivan Therapeutics att företaget fått tillstånd att inleda en prospektiv studie av TuMatch vid Burjeel Cancer Institute i Abu Dhabi. Enligt företaget ska minst 10 personer med tjock- eller ändtarmscancer ingå, och kliniska utfall och hälsoekonomiska data samlas in. Det är tillstånd att forska, inte publicerade resultat eller marknadsgodkännande för programvaran. Meddelandet redovisar varken resultat från studien eller någon jämförelsegrupp. Enligt produktsidan matchar TuMatch tumörers genomprofiler mot företagets egna data om läkemedelssvar, som även bygger på bananflugemodeller, och rangordnar alternativ för onkologer. Löften om längre överlevnad eller effektivare kombinationer är företagsanspråk, inte resultat från den aviserade studien."
      - type: p
        text: "OpenOnco används i ett annat steg: dess kostnadsfria, offentliga regler med MIT-licens använder strukturerade kliniska fakta och källor för utkast att diskutera. Det testar inte läkemedel i flugor och förutsäger inte individuellt svar. Det kliniska innehållet granskas fortfarande. Den 24 oktober erbjöd Vivan ett gratis introduktionssamtal men publicerade varken TuMatch-pris eller källkodslicens; ett gratis samtal är inte ett gratis test. Ingen direkt klinisk studie visar bättre utfall med det ena verktyget än det andra. En onkolog måste tolka evidensen och besluta om vård; artikeln ersätter inte läkarbesök."
  nb:
    title: TuMatch får klarsignal for en studie. Hva viser det?
    summary: Vivan varsler en prospektiv studie med minst 10 personer med tykk- eller endetarmskreft. Tillatelse til å studere verktøyet viser ikke pasientnytte.
    body:
      - type: p
        text: "23. oktober sa Vivan Therapeutics at selskapet hadde fått tillatelse til å starte en prospektiv TuMatch-studie ved Burjeel Cancer Institute i Abu Dhabi. Ifølge selskapet skal minst 10 personer med tykk- eller endetarmskreft delta, og kliniske utfall og helseøkonomiske data samles inn. Dette er tillatelse til forskning, ikke publiserte resultater eller markedsføringstillatelse for programvaren. Meldingen gir verken resultater fra studien eller en sammenligningsgruppe. Ifølge produktsiden kobler TuMatch svulsters genomprofiler til selskapets egne data om legemiddelrespons, også basert på bananfluemodeller, og rangerer alternativer for onkologer. Løfter om lengre overlevelse eller mer effektive kombinasjoner er selskapets påstander, ikke resultater fra den varslede studien."
      - type: p
        text: "OpenOnco brukes på et annet trinn: De gratis, offentlige reglene med MIT-lisens bruker strukturerte kliniske opplysninger og kilder til utkast for diskusjon. Det tester ikke legemidler i fluer og forutsier ikke individuell respons. Det kliniske innholdet er fortsatt under gjennomgang. Per 24. oktober tilbød Vivan en gratis innledende samtale, men oppga verken TuMatch-pris eller kildekodelisens; en gratis samtale er ikke en gratis test. Ingen direkte klinisk studie viser bedre utfall med det ene verktøyet enn det andre. En onkolog må tolke dokumentasjonen og bestemme behandlingen; artikkelen erstatter ikke legekonsultasjon."
  fi:
    title: TuMatch saa luvan tutkimukseen. Mitä se osoittaa?
    summary: Vivan kertoo prospektiivisesta tutkimuksesta, johon osallistuu vähintään 10 paksu- tai peräsuolisyöpää sairastavaa. Tutkimuslupa ei osoita potilashyötyä.
    body:
      - type: p
        text: "Vivan Therapeutics kertoi 23. lokakuuta saaneensa luvan aloittaa TuMatchin prospektiivisen tutkimuksen Burjeel Cancer Institutessa Abu Dhabissa. Yhtiön mukaan siihen osallistuu vähintään 10 paksu- tai peräsuolisyöpää sairastavaa, ja tutkimuksessa kerätään kliinisiä tuloksia sekä terveystaloudellisia tietoja. Lupa koskee tutkimusta; se ei ole julkaistu tulos eikä ohjelmiston myyntilupa. Tiedotteessa ei esitetä tutkimustuloksia eikä vertailuryhmää. Tuotesivun mukaan TuMatch vertaa kasvaimen genomiprofiilia yhtiön omaan lääkevastetietoon, jota on saatu myös banaanikärpäsmalleista, ja asettaa vaihtoehdot järjestykseen onkologille. Lupaukset pidemmästä eliniästä tai tehokkaammista yhdistelmistä ovat yhtiön väitteitä, eivät ilmoitetun tutkimuksen tuloksia."
      - type: p
        text: "OpenOnco toimii eri vaiheessa: sen ilmaiset, julkiset MIT-lisensoidut säännöt käyttävät rakenteisia kliinisiä tietoja ja lähteitä keskusteluluonnosten tekemiseen. Se ei testaa lääkkeitä kärpäsmalleissa eikä ennusta yksilöllistä vastetta. Sen kliininen sisältö on yhä arvioitavana. Vivan tarjosi 24. lokakuuta ilmaisen alkukeskustelun, mutta ei julkaissut TuMatchin hintaa tai lähdekoodin lisenssiä; ilmainen keskustelu ei tarkoita ilmaista testiä. Suoraa kliinistä vertailua työkalujen potilastuloksista ei ole. Onkologin tulee arvioida näyttö ja päättää hoidosta; artikkeli ei korvaa lääkärin arviota."
