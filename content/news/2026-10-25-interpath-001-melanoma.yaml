title:
  en: After melanoma surgery, an individualized mRNA therapy reduced recurrence in a phase 3 trial
  uk: Після операції з приводу меланоми індивідуалізована мРНК-терапія зменшила частоту рецидивів у дослідженні III фази
summary:
  en: At two years, 82.2% versus 70.0% of participants were alive without recurrence; survival benefit remains unproven.
  uk: Через два роки без рецидиву залишалися 82,2% проти 70,0% учасників; перевагу щодо загального виживання ще не доведено.
sources:
- citation: Long GV, et al. INTerpath-001 phase 3 results. ESMO Congress 2026, abstract LBA1, presented 24 October 2026. Numerical results reported by trial sponsors 22 October 2026; full peer-reviewed paper pending.
  id: https://www.merck.com/news/merck-and-moderna-will-present-results-from-landmark-phase-3-interpath-001-trial-for-intismeran-autogene-plus-keytruda-pembrolizumab-at-esmo-2026-presidential-symposium/
- citation: INTerpath-001 trial registration, NCT05933577. ClinicalTrials.gov. Checked 25 October 2026.
  id: https://clinicaltrials.gov/study/NCT05933577
body:
  en:
  - type: p
    text: The word ‘vaccine’ makes for a striking headline. This trial tested an experimental, tumor-matched mRNA treatment after surgery, not a vaccine that prevents melanoma in healthy people. Its results were presented at ESMO on 24 October 2026; the detailed figures below come from the trial sponsors' 22 October release, ahead of the peer-reviewed paper.
  - type: p
    text: 'INTerpath-001 randomly assigned 1,137 people with completely removed, high-risk stage IIB–IV cutaneous melanoma: 757 received individualized intismeran autogene plus pembrolizumab, and 380 received placebo plus pembrolizumab. It was a double-blind phase 3 trial. Median follow-up was 24.6 months.'
  - type: p
    text: 'At two years, 82.2% in the combination group versus 70.0% in the control group were alive without recurrence: an absolute difference of 12.2 percentage points. The recurrence-or-death hazard ratio was 0.58 (95% confidence interval 0.45–0.75). Freedom from distant metastasis at two years was 88.5% versus 80.2%. These are time-to-event estimates, not counts of people cured.'
  - type: p
    text: Treatment-related grade 3–5 adverse events occurred in 107 of 755 people (14.2%) given the combination and 51 of 380 (13.4%) given control treatment. Fever and injection-site pain were common with intismeran. Overall survival data remain immature and did not yet show a statistically significant difference. The treatment is investigational; these results do not establish benefit in other cancers or prove longer life.
  - type: p
    text: 'Tumor Board lens, not a live run: imagine a fictional patient asking whether this headline applies after melanoma surgery. A review would first check the exact stage, complete resection, cutaneous origin, trial eligibility and the still-uncertain survival outcome. This is an editorial draft for discussion, not a treatment recommendation or a substitute for a clinician. Sources checked 25 October 2026.'
  uk:
  - type: p
    text: Слово «вакцина» добре виглядає в заголовку. Але тут випробовували експериментальну мРНК-терапію, підібрану за пухлиною після операції, а не щеплення для запобігання меланомі в здорових людей. Результати представили на ESMO 24 жовтня 2026 року; наведені цифри походять із повідомлення організаторів дослідження від 22 жовтня, до виходу рецензованої статті.
  - type: p
    text: У подвійному сліпому рандомізованому дослідженні III фази INTerpath-001 взяли участь 1 137 людей після повного видалення шкірної меланоми високого ризику стадії IIB–IV. Індивідуалізований препарат intismeran autogene разом із пембролізумабом отримували 757 учасників, плацебо разом із пембролізумабом — 380. Медіана спостереження становила 24,6 місяця.
  - type: p
    text: 'Через два роки живими без рецидиву залишалися 82,2% у групі комбінації проти 70,0% у контрольній групі: абсолютна різниця — 12,2 відсоткового пункта. Відношення ризиків рецидиву або смерті становило 0,58 (95% довірчий інтервал 0,45–0,75). Без віддалених метастазів через два роки залишалися 88,5% проти 80,2%. Це оцінки за часом до події, а не кількість людей, яких вилікували.'
  - type: p
    text: Пов'язані з лікуванням небажані явища 3–5 ступеня виникли у 107 із 755 людей (14,2%) у групі комбінації та 51 із 380 (13,4%) у контролі. Для intismeran частими були гарячка й біль у місці ін'єкції. Дані щодо загального виживання ще незрілі і поки не показали статистично значущої різниці. Терапія залишається дослідною; ці результати не доводять користі за інших видів раку чи подовження життя.
  - type: p
    text: 'Погляд Туморборду, без реального запуску: уявімо вигаданого пацієнта, який питає, чи стосується його цей заголовок після операції з приводу меланоми. Для обговорення спершу треба уточнити стадію, повноту видалення, походження пухлини зі шкіри, відповідність критеріям дослідження та невизначеність щодо загального виживання. Це редакційна чернетка, а не рекомендація щодо лікування чи заміна консультації лікаря. Джерела перевірено 25 жовтня 2026 року.'
translations:
  es:
    title: Después de la cirugía de melanoma, una terapia individualizada con ARNm redujo la recurrencia en un ensayo de fase 3
    summary: A los dos años, el 82,2% versus el 70,0% de los participantes estaban vivos sin recurrencia; El beneficio de supervivencia aún no se ha demostrado.
    body:
    - type: p
      text: La palabra “vacuna” constituye un titular sorprendente. Este ensayo probó un tratamiento experimental de ARNm compatible con tumores después de la cirugía, no una vacuna que previene el melanoma en personas sanas. Sus resultados fueron presentados en ESMO el 24 de octubre de 2026; Las cifras detalladas a continuación provienen del comunicado de los patrocinadores del ensayo del 22 de octubre, antes del artículo revisado por pares.
    - type: p
      text: 'INTerpath-001 asignó al azar a 1137 personas con melanoma cutáneo en estadio IIB-IV de alto riesgo y extirpado completamente: 757 recibieron intismeran autógeno individualizado más pembrolizumab y 380 recibieron placebo más pembrolizumab. Fue un ensayo de fase 3 doble ciego. La mediana de seguimiento fue de 24,6 meses.'
    - type: p
      text: 'A los dos años, el 82,2% en el grupo de combinación versus el 70,0% en el grupo de control estaban vivos sin recurrencia: una diferencia absoluta de 12,2 puntos porcentuales. El índice de riesgo de recurrencia o muerte fue de 0,58 (intervalo de confianza del 95%: 0,45 a 0,75). La ausencia de metástasis a distancia a los dos años fue del 88,5% frente al 80,2%. Estas son estimaciones del tiempo transcurrido hasta el evento, no recuentos de personas curadas.'
    - type: p
      text: Se produjeron eventos adversos de grado 3 a 5 relacionados con el tratamiento en 107 de 755 personas (14,2%) que recibieron la combinación y en 51 de 380 (13,4%) que recibieron el tratamiento de control. La fiebre y el dolor en el lugar de la inyección fueron comunes con intismeran. Los datos de supervivencia general siguen siendo inmaduros y aún no muestran una diferencia estadísticamente significativa. El tratamiento sigue en investigación; estos resultados no establecen beneficios en otros cánceres ni demuestran una vida más larga.
    - type: p
      text: 'Perspectiva del Tumor Board, sin ejecutar el servicio: imaginemos a una persona ficticia que pregunta si este titular le afecta tras una cirugía de melanoma. Primero habría que comprobar el estadio, la resección completa, el origen cutáneo, los criterios del ensayo y la incertidumbre sobre la supervivencia global. Es un borrador editorial para debatir, no una recomendación terapéutica ni un sustituto del médico. Fuentes verificadas el 25 de octubre de 2026.'
  pt:
    title: Após a cirurgia de melanoma, uma terapia individualizada com mRNA reduziu a recorrência em um estudo de fase 3
    summary: Aos dois anos, 82,2% versus 70,0% dos participantes estavam vivos sem recorrência; o benefício de sobrevivência permanece não comprovado.
    body:
    - type: p
      text: A palavra “vacina” é uma manchete impressionante. Este ensaio testou um tratamento experimental de mRNA compatível com o tumor após a cirurgia, e não uma vacina que previne o melanoma em pessoas saudáveis. Os seus resultados foram apresentados na ESMO em 24 de outubro de 2026; os números detalhados abaixo vêm do comunicado dos patrocinadores do estudo em 22 de outubro, antes do artigo revisado por pares.
    - type: p
      text: 'O INTerpath-001 distribuiu aleatoriamente 1.137 pessoas com melanoma cutâneo de alto risco em estágio IIB-IV completamente removido: 757 receberam intismerano autógeno individualizado mais pembrolizumabe, e 380 receberam placebo mais pembrolizumabe. Foi um estudo duplo-cego de fase 3. O acompanhamento médio foi de 24,6 meses.'
    - type: p
      text: 'Aos dois anos, 82,2% no grupo combinado versus 70,0% no grupo controle estavam vivos sem recorrência: uma diferença absoluta de 12,2 pontos percentuais. A taxa de risco de recorrência ou morte foi de 0,58 (intervalo de confiança de 95% 0,45–0,75). A ausência de metástase à distância em dois anos foi de 88,5% versus 80,2%. Estas são estimativas do tempo até o evento, e não contagens de pessoas curadas.'
    - type: p
      text: Eventos adversos de grau 3–5 relacionados ao tratamento ocorreram em 107 de 755 pessoas (14,2%) que receberam a combinação e 51 de 380 (13,4%) que receberam tratamento de controle. Febre e dor no local da injeção foram comuns com intismeran. Os dados de sobrevivência global permanecem imaturos e ainda não mostraram uma diferença estatisticamente significativa. O tratamento é experimental; esses resultados não estabelecem benefícios em outros tipos de câncer nem comprovam vida mais longa.
    - type: p
      text: 'Perspetiva do Tumor Board, sem executar o serviço: imaginemos uma pessoa fictícia que pergunta se esta notícia se aplica após uma cirurgia ao melanoma. Seria preciso verificar o estádio, a resseção completa, a origem cutânea, os critérios do ensaio e a incerteza quanto à sobrevivência global. Este é um rascunho editorial para discussão, não uma recomendação terapêutica nem um substituto do médico. Fontes verificadas em 25 de outubro de 2026.'
  de:
    title: Nach einer Melanomoperation reduzierte eine individualisierte mRNA-Therapie in einer Phase-3-Studie das Wiederauftreten
    summary: Nach zwei Jahren lebten 82,2 % gegenüber 70,0 % der Teilnehmer ohne erneutes Auftreten; Der Überlebensvorteil bleibt unbewiesen.
    body:
    - type: p
      text: Das Wort „Impfstoff“ sorgt für eine auffällige Schlagzeile. In dieser Studie wurde eine experimentelle, auf den Tumor abgestimmte mRNA-Behandlung nach einer Operation getestet, kein Impfstoff, der Melanomen bei gesunden Menschen vorbeugt. Die Ergebnisse wurden am 24. Oktober 2026 bei ESMO vorgestellt; Die detaillierten Zahlen unten stammen aus der Veröffentlichung der Studiensponsoren vom 22. Oktober vor der Veröffentlichung des Peer-Review-Papiers.
    - type: p
      text: 'INTerpath-001 ordnete nach dem Zufallsprinzip 1.137 Personen mit vollständig entferntem Hautmelanom im Hochrisikostadium IIB–IV zu: 757 erhielten individualisiertes Intismeran-Autogen plus Pembrolizumab und 380 erhielten Placebo plus Pembrolizumab. Es handelte sich um eine doppelblinde Phase-3-Studie. Die mittlere Nachbeobachtungszeit betrug 24,6 Monate.'
    - type: p
      text: 'Nach zwei Jahren lebten 82,2 % in der Kombinationsgruppe gegenüber 70,0 % in der Kontrollgruppe ohne erneutes Auftreten: ein absoluter Unterschied von 12,2 Prozentpunkten. Das Rezidiv-oder-Todes-Risikoverhältnis betrug 0,58 (95 %-Konfidenzintervall 0,45–0,75). Die Abwesenheit von Fernmetastasen nach zwei Jahren betrug 88,5 % gegenüber 80,2 %. Hierbei handelt es sich um Schätzungen der Zeit bis zum Auftreten des Ereignisses, nicht um die Anzahl der geheilten Personen.'
    - type: p
      text: Behandlungsbedingte unerwünschte Ereignisse vom Grad 3–5 traten bei 107 von 755 Personen (14,2 %) unter der Kombinationstherapie und bei 51 von 380 (13,4 %) unter der Kontrollbehandlung auf. Bei Intismeran traten häufig Fieber und Schmerzen an der Injektionsstelle auf. Die Daten zum Gesamtüberleben sind noch unausgereift und zeigten noch keinen statistisch signifikanten Unterschied. Die Behandlung ist experimentell; Diese Ergebnisse belegen weder einen Nutzen bei anderen Krebsarten noch beweisen sie eine längere Lebensdauer.
    - type: p
      text: 'Blick des Tumor Boards, ohne tatsächliche Nutzung des Dienstes: Eine fiktive Person fragt, ob diese Meldung nach einer Melanomoperation auf sie zutrifft. Zunächst wären Stadium, vollständige Entfernung, Ursprung in der Haut, Studienkriterien und die Unsicherheit beim Gesamtüberleben zu prüfen. Dies ist ein redaktioneller Diskussionsentwurf, keine Behandlungsempfehlung und kein Ersatz für ärztlichen Rat. Quellen geprüft am 25. Oktober 2026.'
  fr:
    title: Après une chirurgie du mélanome, une thérapie individualisée à base d'ARNm a réduit la récidive dans un essai de phase 3
    summary: À deux ans, 82,2 % contre 70,0 % des participants étaient en vie sans récidive ; le bénéfice en matière de survie reste à prouver.
    body:
    - type: p
      text: Le mot « vaccin » fait la une des journaux. Cet essai a testé un traitement expérimental par ARNm adapté à la tumeur après une intervention chirurgicale, et non un vaccin qui prévient le mélanome chez les personnes en bonne santé. Ses résultats ont été présentés à l'ESMO le 24 octobre 2026 ; les chiffres détaillés ci-dessous proviennent du communiqué des promoteurs de l'essai du 22 octobre, avant la publication de l'article évalué par des pairs.
    - type: p
      text: 'INTerpath-001 a réparti au hasard 1 137 personnes atteintes d''un mélanome cutané de stade IIB – IV à haut risque complètement éliminé : 757 ont reçu de l''intismeran autogène individualisé plus du pembrolizumab, et 380 ont reçu un placebo plus du pembrolizumab. Il s’agissait d’un essai de phase 3 en double aveugle. Le suivi médian était de 24,6 mois.'
    - type: p
      text: 'Après deux ans, 82,2 % des patients du groupe combiné contre 70,0 % des patients du groupe témoin étaient en vie sans récidive : une différence absolue de 12,2 points de pourcentage. Le rapport de risque de récidive ou de décès était de 0,58 (intervalle de confiance à 95 % : 0,45 à 0,75). L''absence de métastases à distance à deux ans était de 88,5 % contre 80,2 %. Il s’agit d’estimations du temps écoulé avant l’événement et non du nombre de personnes guéries.'
    - type: p
      text: Des événements indésirables de grade 3 à 5 liés au traitement sont survenus chez 107 des 755 personnes (14,2 %) ayant reçu l'association et 51 des 380 (13,4 %) ayant reçu le traitement témoin. La fièvre et les douleurs au site d'injection étaient fréquentes avec l'intismeran. Les données de survie globale restent immatures et n’ont pas encore montré de différence statistiquement significative. Le traitement est expérimental ; ces résultats n’établissent pas de bénéfice dans d’autres cancers ni ne prouvent une durée de vie plus longue.
    - type: p
      text: 'Point de vue du Tumor Board, sans utilisation réelle du service : imaginons une personne fictive qui demande si ce résultat la concerne après une opération du mélanome. Il faudrait d’abord vérifier le stade, la résection complète, l’origine cutanée, les critères de l’essai et l’incertitude sur la survie globale. C’est un brouillon éditorial destiné à la discussion, pas une recommandation thérapeutique ni un substitut à un médecin. Sources vérifiées le 25 octobre 2026.'
  it:
    title: Dopo l’intervento chirurgico per il melanoma, una terapia personalizzata con mRNA ha ridotto le recidive in uno studio di fase 3
    summary: A due anni, l’82,2% contro il 70,0% dei partecipanti era vivo senza recidiva; il beneficio in termini di sopravvivenza rimane non dimostrato.
    body:
    - type: p
      text: La parola “vaccino” costituisce un titolo sorprendente. Questo studio ha testato un trattamento sperimentale con mRNA compatibile con il tumore dopo l’intervento chirurgico, non un vaccino che previene il melanoma nelle persone sane. I suoi risultati sono stati presentati all’ESMO il 24 ottobre 2026; i dati dettagliati riportati di seguito provengono dal rilascio del 22 ottobre da parte degli sponsor dello studio, prima del documento sottoposto a revisione paritaria.
    - type: p
      text: 'INTerpath-001 ha assegnato in modo casuale 1.137 persone con melanoma cutaneo di stadio IIB-IV ad alto rischio, completamente rimosso: 757 hanno ricevuto autogene intismeran personalizzato più pembrolizumab e 380 hanno ricevuto placebo più pembrolizumab. Si trattava di uno studio di fase 3 in doppio cieco. Il follow-up mediano è stato di 24,6 mesi.'
    - type: p
      text: 'A due anni, l''82,2% nel gruppo di combinazione contro il 70,0% nel gruppo di controllo era vivo senza recidiva: una differenza assoluta di 12,2 punti percentuali. Il rapporto di rischio di recidiva o morte era 0,58 (intervallo di confidenza al 95% 0,45-0,75). La libertà da metastasi a distanza a due anni è stata dell''88,5% contro l''80,2%. Queste sono stime relative al tempo trascorso all’evento, non il conteggio delle persone guarite.'
    - type: p
      text: Eventi avversi di grado 3-5 correlati al trattamento si sono verificati in 107 persone su 755 (14,2%) trattate con la combinazione e in 51 su 380 (13,4%) trattate con il trattamento di controllo. Febbre e dolore al sito di iniezione erano comuni con Intismeran. I dati sulla sopravvivenza globale rimangono immaturi e non hanno ancora mostrato una differenza statisticamente significativa. Il trattamento è sperimentale; questi risultati non stabiliscono benefici in altri tumori né dimostrano una vita più lunga.
    - type: p
      text: 'Prospettiva del Tumor Board, senza usare realmente il servizio: immaginiamo una persona fittizia che chiede se la notizia la riguardi dopo un intervento per melanoma. Occorre prima verificare lo stadio, la resezione completa, l’origine cutanea, i criteri dello studio e l’incertezza sulla sopravvivenza globale. Questa è una bozza editoriale per la discussione, non una raccomandazione terapeutica né un sostituto del medico. Fonti verificate il 25 ottobre 2026.'
  da:
    title: Efter melanomkirurgi reducerede en individualiseret mRNA-terapi tilbagefald i et fase 3-forsøg
    summary: Efter to år var 82,2 % versus 70,0 % af deltagerne i live uden gentagelse; overlevelsesgevinst forbliver ubevist.
    body:
    - type: p
      text: Ordet 'vaccine' giver en slående overskrift. Dette forsøg testede en eksperimentel, tumor-matchet mRNA-behandling efter operation, ikke en vaccine, der forhindrer melanom hos raske mennesker. Dets resultater blev præsenteret på ESMO den 24. oktober 2026; de detaljerede tal nedenfor stammer fra forsøgssponsorernes udgivelse den 22. oktober forud for det peer-reviewede papir.
    - type: p
      text: 'INTerpath-001 tilfældigt tildelte 1.137 personer med fuldstændigt fjernet højrisikostadie IIB-IV kutant melanom: 757 modtog individualiseret intismeran autogen plus pembrolizumab, og 380 modtog placebo plus pembrolizumab. Det var et dobbeltblindt fase 3 forsøg. Median opfølgning var 24,6 måneder.'
    - type: p
      text: 'Efter to år var 82,2 % i kombinationsgruppen versus 70,0 % i kontrolgruppen i live uden gentagelse: en absolut forskel på 12,2 procentpoint. Risikoen for gentagelse eller død var 0,58 (95 % konfidensinterval 0,45-0,75). Frihed fra fjernmetastaser efter to år var 88,5 % mod 80,2 %. Disse er tid-til-hændelse-estimater, ikke tællinger af helbredte mennesker.'
    - type: p
      text: Behandlingsrelaterede bivirkninger af grad 3-5 forekom hos 107 ud af 755 personer (14,2 %), der fik kombinationen, og 51 ud af 380 (13,4 %) fik kontrolbehandling. Feber og smerter på injektionsstedet var almindelige med intismeran. Data om samlet overlevelse forbliver umodne og viste endnu ikke en statistisk signifikant forskel. Behandlingen er fortsat under afprøvning; disse resultater fastslår ikke fordele ved andre kræftformer eller beviser længere levetid.
    - type: p
      text: 'Tumor Board-perspektiv, uden faktisk at køre tjenesten: Forestil dig en opdigtet person, der spørger, om resultatet gælder efter en melanomoperation. Først må man undersøge stadium, fuldstændig fjernelse, oprindelse i huden, forsøgets kriterier og usikkerheden om samlet overlevelse. Dette er et redaktionelt udkast til drøftelse, ikke en behandlingsanbefaling eller en erstatning for en læge. Kilder kontrolleret 25. oktober 2026.'
  sv:
    title: Efter melanomkirurgi minskade en individualiserad mRNA-terapi återfall i en fas 3-studie
    summary: Efter två år levde 82,2 % jämfört med 70,0 % av deltagarna utan återfall; överlevnadsvinsten förblir obevisad.
    body:
    - type: p
      text: Ordet "vaccin" är en slående rubrik. Detta försök testade en experimentell, tumörmatchad mRNA-behandling efter operation, inte ett vaccin som förhindrar melanom hos friska människor. Dess resultat presenterades på ESMO den 24 oktober 2026; de detaljerade siffrorna nedan kommer från testsponsorernas release den 22 oktober, före den peer-reviewed artikeln.
    - type: p
      text: 'INTerpath-001 slumpmässigt tilldelade 1 137 personer med helt avlägsnat, högriskstadium IIB–IV kutant melanom: 757 fick individualiserad intismeran autogen plus pembrolizumab och 380 fick placebo plus pembrolizumab. Det var en dubbelblind fas 3-studie. Medianuppföljningen var 24,6 månader.'
    - type: p
      text: 'Efter två år levde 82,2 % i kombinationsgruppen mot 70,0 % i kontrollgruppen utan återfall: en absolut skillnad på 12,2 procentenheter. Riskkvoten för återfall eller död var 0,58 (95 % konfidensintervall 0,45–0,75). Friheten från fjärrmetastaser efter två år var 88,5 % mot 80,2 %. Dessa är uppskattningar av tid till händelse, inte antalet botade personer.'
    - type: p
      text: Behandlingsrelaterade biverkningar av grad 3–5 inträffade hos 107 av 755 personer (14,2 %) som fick kombinationen och 51 av 380 (13,4 %) som fick kontrollbehandling. Feber och smärta på injektionsstället var vanliga med intismeran. Data om total överlevnad förblir omogna och visade ännu inte någon statistiskt signifikant skillnad. Behandlingen är fortfarande under prövning; dessa resultat visar inte fördelar i andra cancerformer eller bevisar längre liv.
    - type: p
      text: 'Tumor Board-perspektiv, utan att tjänsten faktiskt körts: Föreställ dig en påhittad person som undrar om resultatet gäller efter en melanomoperation. Först behöver stadium, fullständig borttagning, ursprung i huden, studiens kriterier och osäkerheten om total överlevnad granskas. Detta är ett redaktionellt diskussionsutkast, inte en behandlingsrekommendation eller en ersättning för läkare. Källor kontrollerade den 25 oktober 2026.'
  nb:
    title: Etter melanomkirurgi reduserte en individualisert mRNA-terapi tilbakefall i en fase 3-studie
    summary: Etter to år var 82,2 % versus 70,0 % av deltakerne i live uten gjentakelse; overlevelsesfordelen forblir uprøvd.
    body:
    - type: p
      text: Ordet "vaksine" gir en slående overskrift. Denne studien testet en eksperimentell, tumortilpasset mRNA-behandling etter operasjon, ikke en vaksine som forhindrer melanom hos friske mennesker. Resultatene ble presentert på ESMO 24. oktober 2026; de detaljerte tallene nedenfor kommer fra prøvesponsorenes utgivelse 22. oktober, i forkant av fagfellevurdert papir.
    - type: p
      text: 'INTerpath-001 tildelte tilfeldig 1 137 personer med fullstendig fjernet, høyrisiko stadium IIB–IV kutant melanom: 757 fikk individualisert intismeran autogen pluss pembrolizumab, og 380 fikk placebo pluss pembrolizumab. Det var en dobbeltblind fase 3-forsøk. Median oppfølging var 24,6 måneder.'
    - type: p
      text: 'Etter to år var 82,2 % i kombinasjonsgruppen mot 70,0 % i kontrollgruppen i live uten tilbakefall: en absolutt forskjell på 12,2 prosentpoeng. Risikoen for gjentakelse eller død var 0,58 (95 % konfidensintervall 0,45–0,75). Frihet fra fjernmetastaser etter to år var 88,5 % mot 80,2 %. Dette er tid-til-hendelse estimater, ikke tellinger av personer som er helbredet.'
    - type: p
      text: Behandlingsrelaterte bivirkninger av grad 3–5 forekom hos 107 av 755 personer (14,2 %) som fikk kombinasjonen og 51 av 380 (13,4 %) som fikk kontrollbehandling. Feber og smerter på injeksjonsstedet var vanlig med intismeran. Data om totaloverlevelse forblir umodne og viste ennå ikke en statistisk signifikant forskjell. Behandlingen er fortsatt under utprøving; disse resultatene viser ikke nytte ved andre kreftformer eller beviser lengre levetid.
    - type: p
      text: 'Tumor Board-perspektiv, uten at tjenesten faktisk er kjørt: Se for deg en oppdiktet person som spør om resultatet gjelder etter en melanomoperasjon. Først må stadium, fullstendig fjerning, opprinnelse i huden, studiens kriterier og usikkerheten om totaloverlevelse vurderes. Dette er et redaksjonelt utkast til diskusjon, ikke en behandlingsanbefaling eller en erstatning for lege. Kilder kontrollert 25. oktober 2026.'
  fi:
    title: Yksilöllinen mRNA-hoito vähensi melanooman uusiutumista leikkauksen jälkeen vaiheen III tutkimuksessa
    summary: Kahden vuoden kohdalla 82,2 % ja 70,0 % osallistujista oli elossa ilman uusiutumista. Vaikutusta kokonaiselossaoloon ei ole vielä osoitettu.
    body:
    - type: p
      text: ”Syöpärokote” on houkutteleva otsikko. Tutkimuksessa kuitenkin arvioitiin leikkauksen jälkeen annettavaa kokeellista mRNA-hoitoa, joka suunniteltiin yksilöllisesti kasvaimen perusteella. Kyse ei ole terveiden ihmisten melanoomaa ehkäisevästä rokotteesta. Tulokset esiteltiin ESMO-kokouksessa 24. lokakuuta 2026. Alla olevat luvut ovat tutkimuksen rahoittajien 22. lokakuuta julkaisemasta tiedotteesta; vertaisarvioitu artikkeli ei ole vielä ilmestynyt.
    - type: p
      text: Kaksoissokkoutettuun, satunnaistettuun vaiheen III INTerpath-001-tutkimukseen osallistui 1 137 henkilöä, joilta suuren riskin IIB–IV-vaiheen ihomelanooma oli poistettu kokonaan. Yksilöllistä intismeran autogene -valmistetta ja pembrolitsumabia sai 757 osallistujaa; lumelääkettä ja pembrolitsumabia sai 380. Seuranta-ajan mediaani oli 24,6 kuukautta.
    - type: p
      text: Kahden vuoden kohdalla 82,2 % yhdistelmähoitoryhmästä ja 70,0 % vertailuryhmästä oli elossa ilman uusiutumista. Absoluuttinen ero oli 12,2 prosenttiyksikköä. Uusiutumisen tai kuoleman riskisuhde oli 0,58 (95 %:n luottamusväli 0,45–0,75). Ilman etäpesäkkeitä oli 88,5 % ja 80,2 %. Nämä ovat aikatapahtuma-analyysin arvioita, eivät parantuneiden henkilöiden määriä.
    - type: p
      text: Hoitoon liittyviä vaikeusasteen 3–5 haittatapahtumia oli 107:llä 755:stä (14,2 %) yhdistelmähoitoa saaneesta ja 51:llä 380:stä (13,4 %) vertailuryhmässä. Kuume ja pistoskohdan kipu olivat yleisiä intismeran-hoidon yhteydessä. Kokonaiselossaolon seuranta on vielä kesken eikä tilastollisesti merkitsevää eroa ole osoitettu. Hoito on tutkimusvaiheessa; tulokset eivät osoita hyötyä muissa syövissä eivätkä eliniän pitenemistä.
    - type: p
      text: 'Tumor Board -näkökulma, ilman palvelun todellista käyttöä: kuvitellaan henkilö, joka kysyy, koskeeko tulos häntä melanoomaleikkauksen jälkeen. Ensin on tarkistettava taudin vaihe, kasvaimen täydellinen poisto, alkuperä ihossa, tutkimuksen valintakriteerit ja epävarmuus kokonaiselossaolosta. Tämä on keskustelua varten laadittu toimituksellinen luonnos, ei hoitosuositus eikä lääkärin arvion korvike. Lähteet tarkistettu 25. lokakuuta 2026.'
