title:
  en: PDAOAI found a liver cancer signal. What does it tell us?
  uk: PDAOAI знайшла сигнал при раку печінки. Що він означає?
summary:
  en: A four-gene score was linked to survival, but it has not shown who benefits from treatment. We compare this research tool with OpenOnco.
  uk: Показник за чотирма генами пов’язаний із виживаністю, але не показує, кому допоможе лікування. Порівнюємо дослідницький інструмент з OpenOnco.
sources:
- citation: Oncotelic Therapeutics. PDAOAI liver cancer announcement, 26 October 2026. Checked 26 October 2026.
  id: https://www.globenewswire.com/news-release/2026/10/26/3388030/0/en/oncotelic-announces-pdaoai-identification-of-a-four-gene-liver-cancer-signature.html
- citation: Chang W-H et al. Partitioned Literature Aggregation and Transcriptomic Survival Analysis. Biomedicines, 23 October 2026. Checked 26 October 2026.
  id: https://www.mdpi.com/2227-9059/14/11/2438
