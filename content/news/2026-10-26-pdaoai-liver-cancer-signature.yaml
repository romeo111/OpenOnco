body:
  en:
  - type: p
    text: On 26 October, Oncotelic announced a published PDAOAI liver cancer study. PDAOAI groups PubMed abstracts by disease and proposes hypotheses to test. The 23 October paper links a four-gene score (FKBP1A, EIF4E, RRAGC, PPARGC1A) to overall survival in hepatocellular carcinoma, including an independent Japanese cohort of 203 patients. This retrospective result concerns prognosis; it does not show who benefits from everolimus or Sapu003. The paper did not comprehensively test repeat-run stability. The press release says “without prompt engineering”, while the Methods describe standardized prompts and GPT-5.
  - type: p
    text: 'OpenOnco supports clinical discussion: readers can inspect its MIT-licensed rules and cited sources, and use the website free of charge. PDAOAI supports research and drug discovery using literature and gene-expression data. Its public pages list neither a source-code licence nor a standard user price; private terms are unknown. OpenOnco’s clinical content is still under review, and there is no direct outcome comparison. These tools could complement each other, but neither the study nor the announcement validates a patient treatment choice. This article does not replace a physician. Sources checked 26 October 2026.'
  uk:
  - type: p
    text: 26 жовтня Oncotelic повідомила про публікацію дослідження раку печінки за участю PDAOAI. Платформа групує анотації PubMed за захворюваннями й пропонує гіпотези для перевірки. У статті від 23 жовтня показник за чотирма генами (FKBP1A, EIF4E, RRAGC, PPARGC1A) пов’язаний із загальною виживаністю при гепатоцелюлярній карциномі, зокрема в незалежній японській групі з 203 пацієнтів. Цей ретроспективний результат стосується прогнозу; він не показує, кому допоможуть еверолімус або Sapu003. Автори не провели повної перевірки стабільності результатів при повторних запусках. У пресрелізі сказано «без конструювання промптів», хоча в методах статті описані стандартизовані запити й модель GPT-5.
  - type: p
    text: 'OpenOnco допомагає готувати матеріали для клінічного обговорення: читачі можуть перевірити правила під ліцензією MIT і посилання на джерела та безкоштовно користуватися сайтом. PDAOAI призначена для досліджень і пошуку ліків за літературою та даними експресії генів. На її відкритих сторінках не вказані ні ліцензія на вихідний код, ні стандартна ціна для користувача; приватні умови невідомі. Клінічний вміст OpenOnco ще проходить перевірку, а прямого порівняння результатів немає. Інструменти можуть доповнювати один одного, проте ні дослідження, ні повідомлення компанії не підтверджують конкретний вибір лікування пацієнта. Стаття не замінює консультації лікаря. Джерела перевірено 26 жовтня 2026 року.'
translations:
  es:
    title: PDAOAI encontró una señal de cáncer de hígado. ¿Qué nos dice?
    summary: Una puntuación de cuatro genes se vinculó con la supervivencia, pero no ha demostrado quién se beneficia del tratamiento. Comparamos esta herramienta de investigación con OpenOnco.
    body:
    - type: p
      text: El 26 de octubre, Oncotelic anunció la publicación de un estudio PDAOAI sobre cáncer de hígado. PDAOAI agrupa resúmenes de PubMed por enfermedad y propone hipótesis que después deben comprobarse. El artículo del 23 de octubre vincula una puntuación de cuatro genes (FKBP1A, EIF4E, RRAGC, PPARGC1A) con la supervivencia global en el carcinoma hepatocelular, incluida una cohorte japonesa independiente de 203 pacientes. Este resultado retrospectivo se refiere al pronóstico; no muestra quién se beneficia de everolimus o Sapu003. El artículo no probó exhaustivamente la estabilidad de las ejecuciones repetidas. El comunicado de prensa dice «sin ingeniería de instrucciones», aunque la sección de métodos describe instrucciones estandarizadas y GPT-5.
    - type: p
      text: 'OpenOnco apoya el debate clínico: los lectores pueden inspeccionar sus reglas bajo licencia MIT y las fuentes citadas, y utilizar el sitio web de forma gratuita. PDAOAI apoya la investigación y el descubrimiento de fármacos a partir de publicaciones y datos de expresión genética. Sus páginas públicas no incluyen ni una licencia de código fuente ni un precio de usuario estándar; se desconocen las condiciones de los acuerdos privados. El contenido clínico de OpenOnco aún está bajo revisión y no existe una comparación directa de resultados. Estas herramientas podrían complementarse entre sí, pero ni el estudio ni el anuncio validan la elección de tratamiento para una persona. Este artículo no reemplaza a un médico. Fuentes consultadas el 26 de octubre de 2026.'
  pt:
    title: PDAOAI encontrou um sinal de câncer de fígado. O que isso nos diz?
    summary: Uma escore de quatro genes foi associada à sobrevida, mas não mostrou quem se beneficia do tratamento. Comparamos esta ferramenta de pesquisa com o OpenOnco.
    body:
    - type: p
      text: Em 26 de outubro, a Oncotelic anunciou a publicação de um estudo sobre câncer de fígado que utilizou o PDAOAI. PDAOAI agrupa resumos do PubMed por doença e propõe hipóteses a serem testadas. O artigo de 23 de outubro relaciona uma escore de quatro genes (FKBP1A, EIF4E, RRAGC, PPARGC1A) à sobrevida global no carcinoma hepatocelular, incluindo uma coorte japonesa independente de 203 pacientes. Este resultado retrospectivo diz respeito ao prognóstico; não mostra quem se beneficia com everolimus ou Sapu003. O artigo não testou exaustivamente a estabilidade em repetições. O comunicado de imprensa diz “sem engenharia de prompts”, embora a seção de métodos descreva prompts padronizados e GPT-5.
    - type: p
      text: 'OpenOnco apoia a discussão clínica: os leitores podem inspecionar suas regras sob licença MIT e fontes citadas e usar o site gratuitamente. O PDAOAI apoia a pesquisa e a descoberta de medicamentos usando literatura e dados de expressão genética. Suas páginas públicas não listam uma licença de código-fonte nem um preço padrão para o usuário; as condições de acordos privados são desconhecidas. O conteúdo clínico do OpenOnco ainda está em revisão e não há comparação direta de resultados. Estas ferramentas poderiam complementar-se, mas nem o estudo nem o anúncio validam uma escolha de tratamento para um paciente. Este artigo não substitui um médico. Fontes verificadas em 26 de outubro de 2026.'
  de:
    title: PDAOAI fand ein Leberkrebssignal. Was sagt es uns?
    summary: Ein Vier-Gen-Score wurde mit dem Überleben in Verbindung gebracht, es konnte jedoch nicht gezeigt werden, wer von der Behandlung profitiert. Wir vergleichen dieses Forschungswerkzeug mit OpenOnco.
    body:
    - type: p
      text: Am 26. Oktober berichtete Oncotelic über eine veröffentlichte Leberkrebsstudie mit PDAOAI. PDAOAI gruppiert PubMed-Abstracts nach Krankheiten und schlägt Hypothesen zum Testen vor. Die Arbeit vom 23. Oktober verknüpft einen Vier-Gen-Score (FKBP1A, EIF4E, RRAGC, PPARGC1A) mit dem Gesamtüberleben bei hepatozellulärem Karzinom, auch in einer unabhängigen japanischen Kohorte von 203 Patienten. Dieses retrospektive Ergebnis betrifft die Prognose; es zeigt nicht, wer von Everolimus oder Sapu003 profitiert. In der Arbeit wurde die Stabilität bei Wiederholungsläufen nicht umfassend getestet. In der Pressemitteilung heißt es „ohne Prompt Engineering“, während die Methoden standardisierte Prompts und GPT-5 beschreiben.
    - type: p
      text: 'OpenOnco unterstützt die klinische Diskussion: Leser können die unter MIT-Lizenz veröffentlichten Regeln und zitierten Quellen einsehen und die Website kostenlos nutzen. PDAOAI unterstützt Forschung und Arzneimittelentwicklung anhand von Literatur- und Genexpressionsdaten. Auf den öffentlichen Seiten wird weder eine Quellcode-Lizenz noch ein Standardpreis für Nutzer genannt; private Vertragsbedingungen sind unbekannt. Der klinische Inhalt von OpenOnco wird noch überprüft und es gibt keinen direkten Vergleich der Ergebnisse. Diese Instrumente könnten einander ergänzen, aber weder die Studie noch die Pressemitteilung belegen eine Behandlungsentscheidung für Patienten. Dieser Artikel ersetzt keinen Arzt. Quellen überprüft am 26. Oktober 2026.'
  fr:
    title: PDAOAI a trouvé un signal de cancer du foie. Que nous dit-il ?
    summary: Un score de quatre gènes a été lié à la survie, mais il n'a pas permis de déterminer à qui profite le traitement. Nous comparons cet outil de recherche à OpenOnco.
    body:
    - type: p
      text: Le 26 octobre, Oncotelic a annoncé la publication d'une étude sur le cancer du foie utilisant PDAOAI. PDAOAI regroupe les résumés PubMed par maladie et propose des hypothèses à tester. L'article du 23 octobre relie un score de quatre gènes (FKBP1A, EIF4E, RRAGC, PPARGC1A) à la survie globale dans le carcinome hépatocellulaire, y compris dans une cohorte japonaise indépendante de 203 patients. Ce résultat rétrospectif concerne le pronostic ; il n'indique pas qui bénéficie de l'évérolimus ou du Sapu003. L’article n’a pas testé de manière exhaustive la stabilité des résultats lors de répétitions. Le communiqué de presse indique « sans ingénierie des prompts », tandis que les méthodes décrivent des prompts standardisés et GPT-5.
    - type: p
      text: 'OpenOnco soutient la discussion clinique : les lecteurs peuvent consulter ses règles sous licence MIT et ses sources citées, et utiliser le site Web gratuitement. PDAOAI soutient la recherche et la découverte de médicaments en utilisant la littérature et les données sur l''expression génétique. Ses pages publiques ne répertorient ni une licence de code source ni un prix d''utilisation standard ; les conditions contractuelles privées ne sont pas connues. Le contenu clinique d’OpenOnco est toujours en cours de révision et il n’existe aucune comparaison directe des résultats. Ces outils pourraient se compléter, mais ni l''étude ni l''annonce ne justifient un choix de traitement pour un patient. Cet article ne remplace pas un médecin. Sources vérifiées le 26 octobre 2026.'
  it:
    title: PDAOAI ha trovato un segnale di tumore del fegato. Cosa ci dice?
    summary: Un punteggio di quattro geni è stato collegato alla sopravvivenza, ma non ha mostrato chi trae beneficio dal trattamento. Confrontiamo questo strumento di ricerca con OpenOnco.
    body:
    - type: p
      text: Il 26 ottobre, Oncotelic ha annunciato la pubblicazione di uno studio sul tumore del fegato condotto con PDAOAI. PDAOAI raggruppa gli abstract PubMed per malattia e propone ipotesi da testare. L'articolo del 23 ottobre collega un punteggio di quattro geni (FKBP1A, EIF4E, RRAGC, PPARGC1A) alla sopravvivenza globale nel carcinoma epatocellulare, anche in una coorte giapponese indipendente di 203 pazienti. Questo risultato retrospettivo riguarda la prognosi; non mostra chi trae beneficio da everolimus o Sapu003. L'articolo non ha testato in modo completo la stabilità nelle prove ripetute. Il comunicato stampa dice «senza ingegneria dei prompt», mentre la sezione Metodi descrive prompt standardizzati e GPT-5.
    - type: p
      text: 'OpenOnco supporta la discussione clinica: i lettori possono verificare le regole con licenza MIT e le fonti citate e utilizzare il sito Web gratuitamente. PDAOAI supporta la ricerca e la scoperta di farmaci utilizzando la letteratura e i dati sull''espressione genetica. Le sue pagine pubbliche non elencano né una licenza per il codice sorgente né un prezzo utente standard; le condizioni contrattuali private non sono note. Il contenuto clinico di OpenOnco è ancora in fase di revisione e non esiste un confronto diretto dei risultati. Questi strumenti potrebbero completarsi a vicenda, ma né lo studio né l’annuncio giustificano una scelta terapeutica per un paziente. Questo articolo non sostituisce il medico. Fonti controllate il 26 ottobre 2026.'
  da:
    title: PDAOAI fandt et signal ved leverkræft. Hvad betyder det?
    summary: En score baseret på fire gener hang sammen med overlevelse, men viser ikke, hvem der får gavn af behandling. Vi sammenligner forskningsværktøjet med OpenOnco.
    body:
    - type: p
      text: Den 26. oktober fortalte Oncotelic om en offentliggjort undersøgelse af leverkræft med PDAOAI. Platformen grupperer PubMed-resuméer efter sygdom og foreslår hypoteser, som kan undersøges. Artiklen fra 23. oktober knytter en score baseret på fire gener (FKBP1A, EIF4E, RRAGC, PPARGC1A) til samlet overlevelse ved hepatocellulært karcinom, også i en uafhængig japansk gruppe på 203 patienter. Det retrospektive fund handler om prognose; det viser ikke, hvem der får gavn af everolimus eller Sapu003. Forfatterne undersøgte ikke grundigt, om gentagne kørsler giver stabile resultater. Pressemeddelelsen taler om »uden prompt-engineering«, mens metodeafsnittet beskriver standardiserede prompts og GPT-5.
    - type: p
      text: 'OpenOnco hjælper med at forberede klinisk drøftelse: læsere kan gennemgå regler under MIT-licens og kildehenvisninger, og hjemmesiden er gratis at bruge. PDAOAI støtter forskning og lægemiddelopdagelse med litteratur og data om genekspression. Dets offentlige sider oplyser hverken en kildekodelicens eller en standardpris; private aftalevilkår kendes ikke. OpenOncos kliniske indhold er stadig under gennemgang, og der findes ingen direkte sammenligning af patientresultater. Værktøjerne kan supplere hinanden, men hverken undersøgelsen eller meddelelsen begrunder et behandlingsvalg for en patient. Artiklen erstatter ikke en læge. Kilder kontrolleret 26. oktober 2026.'
  sv:
    title: PDAOAI fann en signal vid levercancer. Vad betyder den?
    summary: Ett mått baserat på fyra gener hängde samman med överlevnad men visar inte vem som har nytta av behandling. Vi jämför forskningsverktyget med OpenOnco.
    body:
    - type: p
      text: Den 26 oktober berättade Oncotelic om en publicerad studie av levercancer med PDAOAI. Plattformen grupperar PubMed-sammanfattningar efter sjukdom och föreslår hypoteser att undersöka. Artikeln från den 23 oktober kopplar ett mått baserat på fyra gener (FKBP1A, EIF4E, RRAGC, PPARGC1A) till total överlevnad vid hepatocellulär cancer, även i en oberoende japansk grupp med 203 patienter. Det retrospektiva fyndet gäller prognos; det visar inte vem som har nytta av everolimus eller Sapu003. Författarna undersökte inte ingående om upprepade körningar ger stabila resultat. Pressmeddelandet säger ”utan prompt engineering”, medan metodavsnittet beskriver standardiserade promptar och GPT-5.
    - type: p
      text: 'OpenOnco hjälper till att förbereda kliniska diskussioner: läsare kan granska regler under MIT-licens och källhänvisningar, och webbplatsen är gratis att använda. PDAOAI stöder forskning och läkemedelsutveckling med litteratur och genuttrycksdata. På de offentliga sidorna anges varken någon licens för källkoden eller något standardpris; privata avtalsvillkor är okända. OpenOncos kliniska innehåll granskas fortfarande, och det finns ingen direkt jämförelse av patientresultat. Verktygen kan komplettera varandra, men varken studien eller meddelandet motiverar ett behandlingsval för en patient. Artikeln ersätter inte en läkare. Källor kontrollerade den 26 oktober 2026.'
  nb:
    title: PDAOAI fant et signal ved leverkreft. Hva betyr det?
    summary: En skår basert på fire gener hang sammen med overlevelse, men viser ikke hvem som har nytte av behandling. Vi sammenligner forskningsverktøyet med OpenOnco.
    body:
    - type: p
      text: Den 26. oktober fortalte Oncotelic om en publisert studie av leverkreft med PDAOAI. Plattformen grupperer PubMed-sammendrag etter sykdom og foreslår hypoteser som kan undersøkes. Artikkelen fra 23. oktober knytter en skår basert på fire gener (FKBP1A, EIF4E, RRAGC, PPARGC1A) til totaloverlevelse ved hepatocellulært karsinom, også i en uavhengig japansk gruppe på 203 pasienter. Dette retrospektive funnet gjelder prognose; det viser ikke hvem som har nytte av everolimus eller Sapu003. Forfatterne undersøkte ikke grundig om gjentatte kjøringer gir stabile resultater. Pressemeldingen sier «uten prompt engineering», mens metodeavsnittet beskriver standardiserte prompter og GPT-5.
    - type: p
      text: 'OpenOnco hjelper med å forberede kliniske diskusjoner: leserne kan kontrollere regler under MIT-lisens og kildehenvisninger, og nettstedet er gratis å bruke. PDAOAI støtter forskning og legemiddelutvikling med litteratur og data om genuttrykk. De offentlige sidene oppgir verken en kildekodelisens eller en standardpris; private avtalevilkår er ukjente. OpenOncos kliniske innhold er fortsatt under gjennomgang, og det finnes ingen direkte sammenligning av pasientutfall. Verktøyene kan utfylle hverandre, men verken studien eller meldingen begrunner et behandlingsvalg for en pasient. Artikkelen erstatter ikke en lege. Kilder kontrollert 26. oktober 2026.'
  fi:
    title: PDAOAI löysi maksasyöpään liittyvän signaalin. Mitä se kertoo?
    summary: Neljään geeniin perustuva pisteytys liittyi elossaoloon, mutta ei osoita, kuka hyötyisi hoidosta. Vertaamme tutkimustyökalua OpenOncoon.
    body:
    - type: p
      text: Oncotelic kertoi 26. lokakuuta julkaistusta maksasyöpätutkimuksesta, jossa käytettiin PDAOAI:ta. Alusta ryhmittelee PubMedin tiivistelmiä sairauden mukaan ja ehdottaa testattavia hypoteeseja. Lokakuun 23. päivänä julkaistu artikkeli yhdistää neljään geeniin (FKBP1A, EIF4E, RRAGC, PPARGC1A) perustuvan pisteytyksen maksasolusyöpää sairastavien kokonaiselossaoloon, myös erillisessä 203 potilaan japanilaisessa aineistossa. Takautuva havainto koskee ennustetta; se ei osoita, kuka hyötyisi everolimuusista tai Sapu003:sta. Tutkijat eivät arvioineet kattavasti, pysyvätkö tulokset samoina toistetuissa ajoissa. Lehdistötiedote puhuu toiminnasta ”ilman promptien suunnittelua”, vaikka artikkelin menetelmissä kuvataan vakioituja prompteja ja GPT-5-mallia.
    - type: p
      text: 'OpenOnco auttaa valmistelemaan kliinistä keskustelua: lukijat voivat tarkastaa MIT-lisenssillä julkaistut säännöt ja lähdeviitteet, ja sivuston käyttö on maksutonta. PDAOAI tukee tutkimusta ja lääkeaihioiden etsintää kirjallisuuden ja geenien ilmentymistietojen avulla. Sen julkisilla sivuilla ei ilmoiteta lähdekoodin lisenssiä eikä vakiohintaa; yksityisten sopimusten ehdot eivät ole tiedossa. OpenOncon kliinistä sisältöä tarkistetaan edelleen, eikä potilastuloksista ole suoraa vertailua. Työkalut voivat täydentää toisiaan, mutta tutkimus tai yhtiön ilmoitus ei perustele yksittäisen potilaan hoitovalintaa. Artikkeli ei korvaa lääkäriä. Lähteet tarkistettu 26.10.2026.'
