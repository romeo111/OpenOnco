body:
  en:
  - type: p
    text: On 27 October, Genomate Health and VivaMed BioPharma announced a partnership to seek new cancer uses for existing drugs. Genomate ranks targeted therapies from a tumor’s molecular profile; VivaMed’s BioAtlas maps disease biology and possible drug opportunities. The announcement names no drug candidate, clinical trial or patient outcome from the partnership. A 2021 paper retrospectively applied an earlier digital drug-assignment system to 113 treated SHIVA01 participants. Higher scores were associated with longer progression-free survival (3.95 versus 1.95 months in high- and low-score groups). Treatment had not been assigned using that score. This association does not prove that today’s service improves outcomes or that the partnership will deliver a therapy.
  - type: p
    text: Genomate’s U.S. second-opinion service adds expert review of an existing tumor NGS report and lists a $1,495 price. The product pages checked do not list an open-source code licence. OpenOnco’s MIT-licensed rules and citations are public and its website is free; its clinical content remains under review and it does not provide an oncologist’s case review. These workflows could complement each other. No direct clinical comparison establishes that either improves patient outcomes more than the other. A partnership is a research plan, not a treatment result. This article does not replace a physician. Sources checked 27 October 2026.
  uk:
  - type: p
    text: 27 жовтня Genomate Health і VivaMed BioPharma оголосили про партнерство для пошуку нових онкологічних застосувань уже відомих препаратів. Genomate ранжує таргетні методи лікування за молекулярним профілем пухлини; платформа BioAtlas від VivaMed зіставляє біологію хвороб із можливостями для розробки ліків. У повідомленні не названо ні препарату, ні клінічного дослідження, ні результатів для пацієнтів у межах партнерства. У статті 2021 року попередню систему молекулярного ранжування ретроспективно застосували до даних 113 учасників SHIVA01, які отримували лікування. Вищі бали були пов’язані з довшою виживаністю без прогресування (3,95 проти 1,95 місяця в групах із високими й низькими балами). Лікування не призначали за цими балами. Такий зв’язок не доводить, що нинішній сервіс поліпшує результати або що партнерство приведе до нового лікування.
  - type: p
    text: Американський сервіс другої думки Genomate додає експертний перегляд наявного звіту молекулярного профілювання пухлини (NGS); на сайті вказано ціну $1 495. На перевірених сторінках продукту немає відкритої ліцензії на код. Правила OpenOnco під ліцензією MIT і посилання на джерела є публічними, а сайт безкоштовний; його клінічний вміст ще проходить перевірку і він не надає індивідуальної консультації онколога. Ці підходи можуть доповнювати один одного. Прямого клінічного порівняння немає, тож перевага жодного з них щодо результатів для пацієнтів не доведена. Партнерство — це план досліджень, а не результат лікування. Стаття не замінює консультації лікаря. Джерела перевірено 27 жовтня 2026 року.
translations:
  es:
    title: Genomate y VivaMed buscan nuevos usos para medicamentos contra el cáncer. ¿Qué se sabe?
    summary: La alianza une la priorización molecular de tratamientos con la búsqueda de nuevos usos para fármacos; los datos retrospectivos no demuestran un beneficio de esta colaboración.
    body:
    - type: p
      text: El 27 de octubre, Genomate Health y VivaMed BioPharma anunciaron una asociación para buscar nuevos usos contra el cáncer para los medicamentos existentes. Genomate prioriza las terapias dirigidas según el perfil molecular de un tumor; BioAtlas de VivaMed relaciona la biología de las enfermedades con posibles oportunidades farmacológicas. El anuncio no menciona ningún fármaco candidato, ensayo clínico o resultado para pacientes de la asociación. Un artículo de 2021 aplicó retrospectivamente un sistema digital de asignación de medicamentos anterior a 113 participantes de SHIVA01 que habían recibido tratamiento. Las puntuaciones más altas se asociaron con una supervivencia libre de progresión más prolongada (3,95 frente a 1,95 meses en los grupos de puntuación alta y baja). El tratamiento no se había asignado utilizando esa puntuación. Esta asociación no prueba que el servicio actual mejore los resultados o que la asociación dé lugar a un nuevo tratamiento.
    - type: p
      text: El servicio de segunda opinión de Genomate en EE. UU. incluye una revisión por especialistas de un informe de secuenciación tumoral (NGS) ya disponible y anuncia un precio de 1.495 dólares estadounidenses. Las páginas del producto consultadas no incluyen una licencia de código fuente abierto. Las reglas de OpenOnco bajo licencia MIT y sus referencias son públicas y su sitio web es gratuito; su contenido clínico permanece bajo revisión y no proporciona una evaluación individual por un oncólogo. Estos flujos de trabajo podrían complementarse entre sí. Ninguna comparación clínica directa establece que alguno mejore los resultados de los pacientes más que el otro. Una asociación es un plan de investigación, no el resultado de un tratamiento. Este artículo no reemplaza a un médico. Fuentes consultadas el 27 de octubre de 2026.
  pt:
    title: Genomate e VivaMed procuram novos usos para medicamentos oncológicos. O que se sabe?
    summary: A parceria combina a priorização molecular de tratamentos com a procura de novos usos para medicamentos; os dados retrospetivos não demonstram benefício desta colaboração.
    body:
    - type: p
      text: Em 27 de outubro, a Genomate Health e a VivaMed BioPharma anunciaram uma parceria para buscar novas aplicações oncológicas para medicamentos existentes. Genomate prioriza terapias dirigidas a partir do perfil molecular de um tumor; o BioAtlas da VivaMed mapeia a biologia das doenças e possíveis oportunidades terapêuticas. O anúncio não menciona nenhum candidato a medicamento, ensaio clínico ou resultado de paciente da parceria. Um artigo de 2021 aplicou retrospectivamente um sistema digital anterior de atribuição de medicamentos a 113 participantes do SHIVA01 que tinham recebido tratamento. Pontuações mais altas foram associadas a maior sobrevida livre de progressão (3,95 versus 1,95 meses em grupos com pontuação alta e baixa). O tratamento não foi atribuído usando essa pontuação. Esta associação não prova que o serviço atual melhore os resultados ou que a parceria resulte numa nova terapêutica.
    - type: p
      text: O serviço de segunda opinião da Genomate nos EUA inclui a revisão por especialistas de um relatório já existente de sequenciação tumoral (NGS) e lista um preço de US$ 1.495. As páginas de produtos verificadas não listam uma licença de código-fonte aberto. As regras sob licença MIT e referências às fontes da OpenOnco são públicas e seu site é gratuito; seu conteúdo clínico permanece sob revisão e não oferece a avaliação individual de um caso por um oncologista. Esses fluxos de trabalho podem se complementar. Nenhuma comparação clínica direta estabelece que um deles melhora mais os resultados dos pacientes do que o outro. Uma parceria é um plano de pesquisa, não um resultado de tratamento. Este artigo não substitui um médico. Fontes verificadas em 27 de outubro de 2026.
  de:
    title: Genomate und VivaMed suchen nach neuen Einsatzmöglichkeiten für Krebsmedikamente. Was ist bekannt?
    summary: Die Partnerschaft verbindet die molekulare Priorisierung von Therapien mit der Suche nach neuen Anwendungen für Arzneimittel. Frühere retrospektive Daten belegen noch keinen Nutzen dieser Zusammenarbeit.
    body:
    - type: p
      text: Am 27. Oktober gaben Genomate Health und VivaMed BioPharma eine Partnerschaft bekannt, um neue Anwendungen vorhandener Arzneimittel gegen Krebs zu untersuchen. Genomate priorisiert zielgerichtete Therapien anhand des molekularen Profils eines Tumors; der BioAtlas von VivaMed bildet die Krankheitsbiologie und mögliche therapeutische Ansätze ab. In der Ankündigung werden weder einen Wirkstoffkandidaten noch eine klinische Studie oder Patientenergebnisse aus der Partnerschaft genannt. In einer Arbeit aus dem Jahr 2021 wurde ein früheres digitales System zur Therapiepriorisierung retrospektiv auf 113 behandelte Teilnehmende der SHIVA01-Studie angewendet. Höhere Scores waren mit einem längeren progressionsfreien Überleben verbunden (3,95 gegenüber 1,95 Monaten in den Gruppen mit hohem und niedrigem Score). Die Behandlung war nicht anhand dieses Scores zugeteilt worden. Dieser Zusammenhang beweist nicht, dass der heutige Service die Ergebnisse verbessert oder dass die Partnerschaft
        zu einer neuen Behandlung führt.
    - type: p
      text: Der Zweitmeinungsdienst von Genomate in den USA umfasst die fachärztliche Prüfung eines bereits vorliegenden Tumorberichts aus der Sequenzierung (NGS) und nennt einen Preis von 1.495 US-Dollar. Auf den überprüften Produktseiten ist keine Open-Source-Code-Lizenz aufgeführt. Die unter MIT-Lizenz veröffentlichten Regeln und Quellenangaben von OpenOnco sind öffentlich und die Website ist kostenlos. Die klinischen Inhalte werden noch geprüft; eine individuelle Fallbeurteilung durch einen Onkologen bietet OpenOnco nicht. Diese Arbeitsabläufe könnten sich gegenseitig ergänzen. Kein direkter klinischer Vergleich zeigt, dass eines davon die Patientenergebnisse stärker verbessert als das andere. Eine Partnerschaft ist ein Forschungsplan, kein Behandlungsergebnis. Dieser Artikel ersetzt keinen Arzt. Quellen überprüft am 27. Oktober 2026.
  fr:
    title: Genomate et VivaMed recherchent de nouvelles utilisations pour les médicaments contre le cancer. Que sait-on ?
    summary: Le partenariat associe la priorisation moléculaire des traitements à la recherche de nouveaux usages des médicaments ; les données rétrospectives ne démontrent pas un bénéfice de cette collaboration.
    body:
    - type: p
      text: Le 27 octobre, Genomate Health et VivaMed BioPharma ont annoncé un partenariat visant à rechercher de nouvelles indications en oncologie pour des médicaments existants. Genomate classe les thérapies ciblées à partir du profil moléculaire d’une tumeur ; le BioAtlas de VivaMed cartographie la biologie des maladies et de possibles pistes thérapeutiques. L’annonce ne mentionne aucun candidat médicament, essai clinique ou résultat pour les patients issus du partenariat. Un article de 2021 a appliqué rétrospectivement un système numérique d’attribution de médicaments antérieur à 113 participants de l’essai SHIVA01 ayant reçu un traitement. Des scores plus élevés étaient associés à une survie sans progression plus longue (3,95 contre 1,95 mois dans les groupes à score élevé et faible). Le traitement n’avait pas été attribué à l’aide de ce score. Cette association ne prouve pas que le service actuel améliore les résultats ou que le partenariat aboutira à un nouveau traitement.
    - type: p
      text: Le service américain de deuxième avis de Genomate ajoute une expertise d’un compte rendu déjà disponible de séquençage tumoral (NGS) et indique un prix de 1 495 $. Les pages produits vérifiées ne répertorient pas de licence de code open source. Les règles sous licence MIT et références aux sources d'OpenOnco sont publiques et son site Web est gratuit ; son contenu clinique reste en cours de révision et il ne propose pas d’examen individuel par un oncologue. Ces flux de travail pourraient se compléter. Aucune comparaison clinique directe n’établit que l’un ou l’autre améliore davantage les résultats pour les patients que l’autre. Un partenariat est un plan de recherche et non un résultat de traitement. Cet article ne remplace pas un médecin. Sources vérifiées le 27 octobre 2026.
  it:
    title: Genomate e VivaMed cercano nuovi usi per i farmaci antitumorali. Cosa è noto?
    summary: La collaborazione unisce la priorità molecolare dei trattamenti alla ricerca di nuovi impieghi dei farmaci; i dati retrospettivi non ne dimostrano un beneficio clinico.
    body:
    - type: p
      text: Il 27 ottobre, Genomate Health e VivaMed BioPharma hanno annunciato una partnership per cercare nuove indicazioni oncologiche per farmaci esistenti. Genomate assegna una priorità alle terapie mirate in base al profilo molecolare di un tumore; il BioAtlas di VivaMed mappa la biologia delle malattie e le possibili opportunità terapeutiche. L'annuncio non menziona alcun candidato farmaco, sperimentazione clinica o risultato sui pazienti della partnership. Uno studio del 2021 ha applicato retrospettivamente un precedente sistema digitale di assegnazione dei farmaci a 113 partecipanti trattati nello studio SHIVA01. I punteggi più alti erano associati a una sopravvivenza libera da progressione più lunga (3,95 contro 1,95 mesi nei gruppi con punteggio alto e basso). Il trattamento non era stato assegnato utilizzando quel punteggio. Questa associazione non dimostra che il servizio odierno migliori i risultati o che la partnership porterà a una nuova terapia.
    - type: p
      text: Il servizio di seconda opinione statunitense di Genomate include la revisione specialistica di un referto già disponibile di sequenziamento tumorale (NGS) e indica un prezzo di 1.495 dollari. Le pagine del prodotto consultate non elencano una licenza di codice open source. Le regole sotto licenza MIT e i riferimenti alle fonti di OpenOnco sono pubbliche e il suo sito Web è gratuito; il suo contenuto clinico rimane in fase di revisione e non fornisce una valutazione individuale da parte di un oncologo. Questi flussi di lavoro potrebbero completarsi a vicenda. Nessun confronto clinico diretto stabilisce che uno dei due migliori i risultati dei pazienti più dell'altro. Una partnership è un piano di ricerca, non un risultato del trattamento. Questo articolo non sostituisce il medico. Fonti controllate il 27 ottobre 2026.
  da:
    title: Genomate og VivaMed søger nye anvendelser af kræftlægemidler. Hvad ved vi?
    summary: Samarbejdet forbinder molekylær prioritering af behandlinger med forskning i nye anvendelser af lægemidler. Tidligere retrospektive data dokumenterer ikke en gevinst ved samarbejdet.
    body:
    - type: p
      text: Den 27. oktober meddelte Genomate Health og VivaMed BioPharma, at de vil samarbejde om at undersøge nye anvendelser af eksisterende kræftlægemidler. Genomate prioriterer målrettede behandlinger ud fra en tumors molekylære profil; VivaMeds BioAtlas kortlægger sygdomsbiologi og mulige behandlingsmuligheder. Meddelelsen nævner hverken en konkret lægemiddelkandidat, et klinisk forsøg eller patientresultater fra samarbejdet. I en artikel fra 2021 blev et tidligere digitalt system til prioritering af lægemidler anvendt retrospektivt på 113 behandlede deltagere i SHIVA01. Højere scorer hang sammen med længere progressionsfri overlevelse (3,95 mod 1,95 måneder i grupperne med høj og lav score). Behandlingen var ikke valgt efter denne score. Sammenhængen beviser ikke, at den nuværende tjeneste forbedrer resultater, eller at samarbejdet fører til en ny behandling.
    - type: p
      text: Genomates amerikanske tjeneste for en fornyet lægefaglig vurdering omfatter ekspertgennemgang af en allerede eksisterende rapport om tumorsekventering (NGS) og angiver en pris på 1.495 amerikanske dollar. De undersøgte produktsider angiver ingen åben kildekodelicens. OpenOncos regler under MIT-licens og kildehenvisninger er offentlige, og hjemmesiden er gratis. Det kliniske indhold er stadig under gennemgang, og OpenOnco tilbyder ikke en onkologs individuelle vurdering. Arbejdsgangene kan supplere hinanden. Ingen direkte klinisk sammenligning viser, at det ene værktøj forbedrer patientresultater mere end det andet. Et samarbejde er en forskningsplan, ikke et behandlingsresultat. Artiklen erstatter ikke en læge. Kilder kontrolleret 27. oktober 2026.
  sv:
    title: Genomate och VivaMed söker nya användningar för cancerläkemedel. Vad vet vi?
    summary: Samarbetet förenar molekylär prioritering av behandlingar med forskning om nya läkemedelsanvändningar. Tidigare retrospektiva data kan inte visa om samarbetet ger nytta.
    body:
    - type: p
      text: Den 27 oktober meddelade Genomate Health och VivaMed BioPharma ett samarbete för att undersöka nya användningar av befintliga cancerläkemedel. Genomate prioriterar riktade behandlingar utifrån en tumörs molekylära profil; VivaMeds BioAtlas kartlägger sjukdomsbiologi och möjliga behandlingsmöjligheter. Meddelandet namnger varken någon läkemedelskandidat, någon klinisk studie eller några patientresultat från samarbetet. I en artikel från 2021 användes ett tidigare digitalt system för läkemedelsprioritering retrospektivt på 113 behandlade deltagare i SHIVA01. Högre poäng var kopplade till längre progressionsfri överlevnad (3,95 mot 1,95 månader i grupperna med hög respektive låg poäng). Behandlingen hade inte valts utifrån denna poäng. Sambandet bevisar inte att dagens tjänst förbättrar resultaten eller att samarbetet leder till en ny behandling.
    - type: p
      text: Genomates amerikanska tjänst för en förnyad medicinsk bedömning omfattar expertgranskning av en befintlig rapport om tumörsekvensering (NGS) och anger priset 1 495 amerikanska dollar. På de granskade produktsidorna anges ingen öppen källkodslicens. OpenOncos regler under MIT-licens och källhänvisningar är offentliga, och webbplatsen är gratis. Det kliniska innehållet granskas fortfarande och OpenOnco erbjuder inte en onkologs individuella bedömning. Arbetsflödena kan komplettera varandra. Ingen direkt klinisk jämförelse visar att det ena verktyget förbättrar patientresultat mer än det andra. Ett samarbete är en forskningsplan, inte ett behandlingsresultat. Artikeln ersätter inte en läkare. Källor kontrollerade den 27 oktober 2026.
  nb:
    title: Genomate og VivaMed søker nye bruksområder for kreftlegemidler. Hva vet vi?
    summary: Samarbeidet kobler molekylær prioritering av behandlinger med forskning på nye bruksområder for legemidler. Tidligere retrospektive data dokumenterer ikke en gevinst ved samarbeidet.
    body:
    - type: p
      text: Den 27. oktober kunngjorde Genomate Health og VivaMed BioPharma et samarbeid om å undersøke nye bruksområder for eksisterende kreftlegemidler. Genomate prioriterer målrettede behandlinger ut fra svulstens molekylære profil; VivaMeds BioAtlas kartlegger sykdomsbiologi og mulige behandlingsmuligheter. Meldingen navngir verken en konkret legemiddelkandidat, en klinisk studie eller pasientresultater fra samarbeidet. I en artikkel fra 2021 ble et tidligere digitalt system for prioritering av legemidler brukt retrospektivt på 113 behandlede deltakere i SHIVA01. Høyere skår var knyttet til lengre progresjonsfri overlevelse (3,95 mot 1,95 måneder i gruppene med høy og lav skår). Behandlingen var ikke valgt ut fra denne skåren. Sammenhengen beviser ikke at dagens tjeneste forbedrer resultatene, eller at samarbeidet fører til en ny behandling.
    - type: p
      text: Genomates amerikanske tjeneste for en ny medisinsk vurdering omfatter ekspertgjennomgang av en eksisterende rapport om svulstsekvensering (NGS) og oppgir en pris på 1 495 amerikanske dollar. De undersøkte produktsidene oppgir ingen åpen kildekodelisens. OpenOncos regler under MIT-lisens og kildehenvisninger er offentlige, og nettstedet er gratis. Det kliniske innholdet er fortsatt under gjennomgang, og OpenOnco tilbyr ikke en onkologs individuelle vurdering. Arbeidsflytene kan utfylle hverandre. Ingen direkte klinisk sammenligning viser at det ene verktøyet forbedrer pasientutfall mer enn det andre. Et samarbeid er en forskningsplan, ikke et behandlingsresultat. Artikkelen erstatter ikke en lege. Kilder kontrollert 27. oktober 2026.
  fi:
    title: Genomate ja VivaMed etsivät syöpälääkkeille uusia käyttötarkoituksia. Mitä tiedetään?
    summary: Yhteistyö yhdistää hoitojen molekyyliperusteisen priorisoinnin lääkkeiden uusien käyttötapojen tutkimiseen. Aiempi takautuva aineisto ei osoita yhteistyön hyötyä.
    body:
    - type: p
      text: Genomate Health ja VivaMed BioPharma ilmoittivat 27. lokakuuta yhteistyöstä, jossa etsitään nykyisille lääkkeille uusia käyttötarkoituksia syövän hoidossa. Genomate asettaa täsmähoitoja järjestykseen kasvaimen molekyyliprofiilin perusteella; VivaMedin BioAtlas kartoittaa sairauksien biologiaa ja mahdollisia lääkeaihioita. Tiedotteessa ei nimetä yhteistyöhön liittyvää lääkeainetta, kliinistä tutkimusta eikä potilastuloksia. Vuonna 2021 julkaistussa tutkimuksessa aiempaa digitaalista lääkkeiden priorisointijärjestelmää sovellettiin takautuvasti 113 hoitoa saaneen SHIVA01-osallistujan tietoihin. Korkeammat pisteet liittyivät pidempään aikaan ilman taudin etenemistä (3,95 kuukautta korkean ja 1,95 kuukautta matalan pistemäärän ryhmässä). Hoitoa ei ollut valittu tämän pistemäärän perusteella. Yhteys ei todista, että nykyinen palvelu parantaa hoitotuloksia tai että yhteistyö johtaa uuteen hoitoon.
    - type: p
      text: Genomaten yhdysvaltalainen toisen lääketieteellisen arvion palvelu sisältää asiantuntijoiden tekemän arvion jo saatavilla olevasta kasvaimen sekvensointiraportista (NGS), ja sen ilmoitettu hinta on 1 495 Yhdysvaltain dollaria. Tarkistetuilla tuotesivuilla ei ilmoiteta avointa lähdekoodilisenssiä. OpenOncon MIT-lisensoidut säännöt ja lähdeviitteet ovat julkisia ja sivusto on maksuton. Sen kliinistä sisältöä tarkistetaan edelleen, eikä se tarjoa onkologin henkilökohtaista arviota. Työkalut voivat täydentää toisiaan. Suoraa kliinistä vertailua siitä, kumpi parantaisi potilastuloksia enemmän, ei ole. Yhteistyö on tutkimussuunnitelma, ei hoitotulos. Artikkeli ei korvaa lääkäriä. Lähteet tarkistettu 27.10.2026.
