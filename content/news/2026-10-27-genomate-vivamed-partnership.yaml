title:
  en: Genomate and VivaMed seek new uses for cancer drugs. What is known?
  uk: Genomate і VivaMed шукають нові застосування онкопрепаратів. Що відомо?
summary:
  en: A new partnership joins molecular drug ranking with drug repurposing; earlier retrospective evidence does not prove benefit from the partnership.
  uk: Нове партнерство поєднує молекулярне ранжування ліків із пошуком нових застосувань; попередні ретроспективні дані не доводять користі самого партнерства.
sources:
- citation: Genomate Health. Genomate and VivaMed partnership announcement, 27 October 2026. Checked 27 October 2026.
  id: https://www.genomate.health/news-article/genomate-and-vivamed-to-rescue-and-repurpose-oncology-drugs-with-ai-and-clinical-data
- citation: Genomate Health. Technology and molecular therapy ranking. Checked 27 October 2026.
  id: https://www.genomate.health/company/our-technology
- citation: VivaMed BioPharma. BioAtlas platform description. Checked 27 October 2026.
  id: https://www.vivamed.com/
- citation: Petak I et al. Retrospective digital drug-assignment analysis in SHIVA01. npj Precision Oncology, 2021. Checked 27 October 2026.
  id: https://pmc.ncbi.nlm.nih.gov/articles/PMC8222375/
- citation: Le Tourneau C et al. Original randomized SHIVA01 trial. Lancet Oncology, 2015. Checked 27 October 2026.
  id: https://pubmed.ncbi.nlm.nih.gov/26342236/
- citation: Genomate Health. U.S. second-opinion service and listed price. Checked 27 October 2026.
