slug: lunit-summit-scope-io
date: 2026-10-28
published: 2026-10-28
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, digital-pathology, biomarkers, immunotherapy]
title:
  en: Lunit and Summit will study tumor slides for ivonescimab biomarkers
  uk: Lunit і Summit досліджуватимуть знімки пухлин для пошуку біомаркерів івонесцимабу
summary:
  en: Their research agreement uses AI pathology to explore tissue patterns. It reports no new clinical outcome or treatment-selection result.
  uk: Дослідницька угода передбачає аналіз тканинних зображень за допомогою ШІ. Нових клінічних результатів чи даних про вибір лікування поки немає.
sources:
  - citation: "Lunit and Summit Therapeutics. Joint research announcement dated 23 October 2026, posted by Lunit 26 October 2026. Checked 28 October 2026."
    id: https://www.lunit.io/en/media-hub/lunit-and-summit-therapeutics-announce-agreement-to-apply-ai-powered-scope-io-platform-for-tumor-microenvironment-analysis-in-immuno-oncology-development/
  - citation: "Lunit. SCOPE IO product description and research-use limitation. Checked 28 October 2026."
    id: https://www.lunit.io/en/precision-oncology/scope-io/
  - citation: "OpenOnco. Capabilities, limitations, public code and source records. Checked 28 October 2026."
    id: https://openonco.info/capabilities.html
  - citation: "OpenOnco. MIT code licence. Checked 28 October 2026."
    id: https://github.com/romeo111/OpenOnco/blob/1a17a5ae64/LICENSE
body:
  en:
    - type: p
      text: "Lunit and Summit Therapeutics announced a research agreement dated 23 October and posted on Lunit's site on 26 October. Lunit's SCOPE IO will analyze routine H&E-stained tumor slides from Summit's ivonescimab development programs. The aim is to explore features of the tumor microenvironment that might help future biomarker research and patient stratification. The announcement gives no new clinical outcome, validated biomarker or evidence that the software can select treatment for a patient."
    - type: p
      text: "SCOPE IO is an image-analysis product for biopharma research. Its product page describes measurements of immune and tissue patterns and marks it **research use only**, not for diagnostic decisions. The checked page does not publish a price or an open-source code licence. This agreement is a plan to study slides, not proof that a slide-derived signal predicts benefit from ivonescimab."
    - type: p
      text: "[OpenOnco](/capabilities.html) works with structured cancer knowledge and entered profile fields to draft source-linked discussion paths; it does not analyze pathology images. Its code is public under MIT and the website is free, but clinical content remains under review. The two tools address different questions and could complement one another. No direct study shows that either improves outcomes more than the other. This article does not replace a physician or guide an individual treatment choice. Sources checked 28 October 2026."
  uk:
    - type: p
      text: "Lunit і Summit Therapeutics уклали дослідницьку угоду: повідомлення датоване 23 жовтня, а на сайті Lunit з'явилося 26 жовтня. SCOPE IO від Lunit аналізуватиме звичайні гістологічні зображення пухлин, забарвлених гематоксиліном і еозином (H&E), у програмах розробки івонесцимабу компанії Summit. Мета — дослідити особливості мікрооточення пухлини для майбутнього пошуку біомаркерів і поділу учасників досліджень на групи. Повідомлення не містить нових клінічних результатів, валідованого біомаркера чи доказів, що програма може вибирати лікування для пацієнта."
    - type: p
      text: "SCOPE IO — продукт для аналізу зображень у біофармацевтичних дослідженнях. На сторінці продукту описано вимірювання імунних і тканинних ознак та зазначено **лише для дослідницького використання**, не для діагностичних рішень. Перевірена сторінка не публікує ціну чи відкриту ліцензію на код. Угода означає намір вивчати зображення, а не доказ того, що виявлена на них ознака передбачає користь від івонесцимабу."
    - type: p
      text: "[OpenOnco](/ukr/capabilities.html) працює зі структурованими знаннями про рак і введеними полями профілю, створюючи чернетки маршрутів обговорення з посиланнями на джерела; гістологічні зображення він не аналізує. Його код відкритий за ліцензією MIT, сайт безкоштовний, але клінічний вміст ще проходить рецензування. Інструменти відповідають на різні запитання й можуть доповнювати один одного. Прямого дослідження, яке доводить більший вплив одного з них на результати лікування, немає. Матеріал не замінює лікаря й не визначає індивідуальний вибір лікування. Джерела перевірено 28 жовтня 2026 року."
translations:
  es:
    title: Lunit y Summit estudiarán imágenes tumorales para buscar biomarcadores de ivonescimab
    summary: El acuerdo de investigación emplea patología con IA para explorar patrones tisulares. No aporta resultados clínicos nuevos ni datos sobre selección terapéutica.
    body:
      - type: p
        text: "Lunit y Summit Therapeutics anunciaron un acuerdo de investigación fechado el 23 de octubre y publicado en la web de Lunit el 26 de octubre. SCOPE IO de Lunit analizará imágenes habituales de tumores teñidos con hematoxilina y eosina (H&E) en los programas de desarrollo de ivonescimab de Summit. El objetivo es explorar rasgos del microambiente tumoral que podrían servir para futuras investigaciones de biomarcadores y estratificación de participantes. El anuncio no aporta resultados clínicos nuevos, biomarcadores validados ni pruebas de que el programa pueda elegir un tratamiento para un paciente."
      - type: p
        text: "SCOPE IO analiza imágenes para investigación biofarmacéutica. Su página describe mediciones de patrones inmunitarios y tisulares y lo identifica como **solo para investigación**, no para decisiones diagnósticas. La página consultada no publica un precio ni una licencia de código abierto. El acuerdo es un plan para estudiar imágenes, no una prueba de que una señal obtenida de ellas prediga el beneficio de ivonescimab."
      - type: p
        text: "[OpenOnco](/es/capabilities.html) usa conocimiento oncológico estructurado y campos introducidos en un perfil para crear borradores de rutas de discusión con fuentes; no analiza imágenes histológicas. Su código es público bajo MIT y la web es gratuita, pero su contenido clínico sigue en revisión. Ambos instrumentos responden a preguntas distintas y podrían complementarse. Ningún estudio comparativo directo demuestra que uno mejore más los resultados clínicos que el otro. Este artículo no sustituye al médico ni orienta una decisión terapéutica individual. Fuentes verificadas el 28 de octubre de 2026."
  pt:
    title: Lunit e Summit vão estudar imagens tumorais em busca de biomarcadores do ivonescimab
    summary: O acordo de investigação usa patologia com IA para explorar padrões tecidulares. Não apresenta novos resultados clínicos nem dados de seleção terapêutica.
    body:
      - type: p
        text: "Lunit e Summit Therapeutics anunciaram um acordo de investigação datado de 23 de outubro e publicado no sítio da Lunit a 26 de outubro. O SCOPE IO da Lunit analisará imagens habituais de tumores corados com hematoxilina e eosina (H&E) nos programas de desenvolvimento do ivonescimab da Summit. Pretende-se explorar características do microambiente tumoral que possam apoiar futura investigação de biomarcadores e estratificação de participantes. O anúncio não apresenta novos resultados clínicos, biomarcadores validados nem provas de que o programa possa selecionar um tratamento para um doente."
      - type: p
        text: "O SCOPE IO analisa imagens para investigação biofarmacêutica. A sua página descreve medições de padrões imunitários e tecidulares e identifica-o como **apenas para investigação**, não para decisões diagnósticas. A página consultada não divulga preço nem licença de código aberto. O acordo é um plano para estudar imagens, não prova de que um sinal obtido delas preveja benefício com ivonescimab."
      - type: p
        text: "O [OpenOnco](/pt/capabilities.html) usa conhecimento oncológico estruturado e campos introduzidos num perfil para criar rascunhos de percursos de discussão com fontes; não analisa imagens histológicas. O código é público sob licença MIT e o sítio é gratuito, mas o conteúdo clínico continua em revisão. As ferramentas respondem a perguntas diferentes e podem complementar-se. Não existe estudo comparativo direto que demonstre maior melhoria dos resultados clínicos com uma delas. Este artigo não substitui um médico nem orienta uma escolha terapêutica individual. Fontes verificadas em 28 de outubro de 2026."
  de:
    title: Lunit und Summit untersuchen Tumorbilder auf mögliche Ivonescimab-Biomarker
    summary: Die Forschungsvereinbarung nutzt KI-Pathologie zur Untersuchung von Gewebemustern. Neue klinische Ergebnisse oder Daten zur Therapiewahl liegen nicht vor.
    body:
      - type: p
        text: "Lunit und Summit Therapeutics meldeten eine Forschungsvereinbarung vom 23. Oktober; Lunit veröffentlichte sie am 26. Oktober auf seiner Website. SCOPE IO von Lunit soll routinemäßige, mit Hämatoxylin und Eosin (H&E) gefärbte Tumorschnitte aus Summits Ivonescimab-Entwicklungsprogrammen auswerten. Ziel ist die Untersuchung von Merkmalen der Tumormikroumgebung für künftige Biomarkerforschung und die Einteilung von Studienteilnehmenden. Die Mitteilung enthält keine neuen klinischen Ergebnisse, keinen validierten Biomarker und keinen Beleg dafür, dass die Software für einzelne Patienten eine Therapie auswählen kann."
      - type: p
        text: "SCOPE IO ist ein Bildanalyseprodukt für biopharmazeutische Forschung. Die Produktseite beschreibt Messungen von Immun- und Gewebemustern und kennzeichnet es als **nur für Forschungszwecke**, nicht für diagnostische Entscheidungen. Auf der geprüften Seite stehen weder ein Preis noch eine Open-Source-Lizenz für den Code. Die Vereinbarung ist ein Plan zur Untersuchung von Bildern, kein Beweis dafür, dass ein daraus abgeleitetes Signal einen Nutzen von Ivonescimab vorhersagt."
      - type: p
        text: "[OpenOnco](/de/capabilities.html) nutzt strukturiertes Krebswissen und eingegebene Profildaten, um quellenbasierte Entwürfe für die Diskussion zu erstellen; histologische Bilder analysiert es nicht. Der Code ist unter MIT öffentlich, die Website kostenlos, doch die klinischen Inhalte werden noch geprüft. Die Werkzeuge beantworten verschiedene Fragen und könnten sich ergänzen. Keine direkte Vergleichsstudie belegt für eines der beiden bessere Behandlungsergebnisse. Dieser Artikel ersetzt keinen Arzt und leitet keine individuelle Therapiewahl an. Quellen geprüft am 28. Oktober 2026."
  fr:
    title: Lunit et Summit étudieront des lames tumorales à la recherche de biomarqueurs de l'ivonescimab
    summary: Leur accord de recherche utilise l'anatomopathologie assistée par IA pour explorer des motifs tissulaires. Aucun nouveau résultat clinique ni donnée de choix thérapeutique n'est présenté.
    body:
      - type: p
        text: "Lunit et Summit Therapeutics ont annoncé un accord de recherche daté du 23 octobre, publié sur le site de Lunit le 26 octobre. SCOPE IO de Lunit analysera des lames tumorales courantes colorées à l'hématoxyline et à l'éosine (H&E) dans les programmes de développement de l'ivonescimab de Summit. L'objectif est d'explorer des caractéristiques du microenvironnement tumoral utiles à de futures recherches sur les biomarqueurs et à la stratification des participants. L'annonce ne présente aucun nouveau résultat clinique, biomarqueur validé ni preuve que le logiciel puisse choisir un traitement pour un patient."
      - type: p
        text: "SCOPE IO est un produit d'analyse d'images destiné à la recherche biopharmaceutique. Sa page décrit la mesure de motifs immunitaires et tissulaires et indique **réservé à la recherche**, non destiné aux décisions diagnostiques. La page consultée ne publie ni tarif ni licence de code libre. Cet accord est un projet d'étude de lames, pas la preuve qu'un signal tiré des images prédit un bénéfice de l'ivonescimab."
      - type: p
        text: "[OpenOnco](/fr/capabilities.html) utilise des connaissances structurées sur le cancer et des champs saisis dans un profil pour produire des ébauches de parcours de discussion avec leurs sources ; il n'analyse pas les images histologiques. Son code est public sous licence MIT et le site est gratuit, mais le contenu clinique reste en cours de révision. Les deux outils répondent à des questions différentes et pourraient se compléter. Aucune étude comparative directe ne montre que l'un améliore davantage les résultats cliniques. Cet article ne remplace pas un médecin et ne guide pas un choix thérapeutique individuel. Sources vérifiées le 28 octobre 2026."
  it:
    title: Lunit e Summit studieranno immagini tumorali per cercare biomarcatori di ivonescimab
    summary: L'accordo di ricerca usa la patologia con IA per esplorare caratteristiche dei tessuti. Non presenta nuovi esiti clinici né dati sulla scelta delle terapie.
    body:
      - type: p
        text: "Lunit e Summit Therapeutics hanno annunciato un accordo di ricerca datato 23 ottobre e pubblicato sul sito di Lunit il 26 ottobre. SCOPE IO di Lunit analizzerà immagini comuni di tumori colorati con ematossilina ed eosina (H&E) nei programmi di sviluppo di ivonescimab di Summit. Lo scopo è esplorare caratteristiche del microambiente tumorale utili alla futura ricerca sui biomarcatori e alla stratificazione dei partecipanti. L'annuncio non riporta nuovi esiti clinici, biomarcatori validati né prove che il programma possa scegliere una terapia per un paziente."
      - type: p
        text: "SCOPE IO analizza immagini per la ricerca biofarmaceutica. La pagina del prodotto descrive misure di caratteristiche immunitarie e tissutali e lo indica come **solo per uso di ricerca**, non per decisioni diagnostiche. La pagina consultata non pubblica un prezzo né una licenza open source per il codice. L'accordo è un piano per studiare immagini, non prova che un segnale ricavato da esse predica un beneficio da ivonescimab."
      - type: p
        text: "[OpenOnco](/it/capabilities.html) usa conoscenze oncologiche strutturate e campi inseriti in un profilo per produrre bozze di percorsi di discussione con le fonti; non analizza immagini istologiche. Il codice è pubblico con licenza MIT e il sito è gratuito, ma il contenuto clinico è ancora in revisione. I due strumenti rispondono a domande diverse e potrebbero integrarsi. Nessuno studio comparativo diretto dimostra che uno migliori più dell'altro gli esiti clinici. Questo articolo non sostituisce il medico né guida una scelta terapeutica individuale. Fonti verificate il 28 ottobre 2026."
  da:
    title: Lunit og Summit vil undersøge tumorbilleder for mulige biomarkører for ivonescimab
    summary: Forskningsaftalen bruger AI-patologi til at undersøge vævsmønstre. Den fremlægger ingen nye kliniske resultater eller data om behandlingsvalg.
    body:
      - type: p
        text: "Lunit og Summit Therapeutics annoncerede en forskningsaftale dateret 23. oktober; Lunit lagde meddelelsen på sit websted 26. oktober. SCOPE IO fra Lunit skal analysere rutinemæssige tumorbilleder farvet med hæmatoxylin og eosin (H&E) fra Summits udviklingsprogrammer for ivonescimab. Målet er at undersøge træk ved tumorens mikromiljø til fremtidig biomarkørforskning og opdeling af forsøgsdeltagere. Meddelelsen indeholder ingen nye kliniske resultater, ingen valideret biomarkør og intet belæg for, at programmet kan vælge behandling for en patient."
      - type: p
        text: "SCOPE IO analyserer billeder til biofarmaceutisk forskning. Produktsiden beskriver måling af immun- og vævsmønstre og mærker det **kun til forskning**, ikke til diagnostiske beslutninger. Den undersøgte side oplyser hverken pris eller open source-licens for koden. Aftalen er en plan om at undersøge billeder, ikke bevis for, at et signal fra dem kan forudsige gavn af ivonescimab."
      - type: p
        text: "[OpenOnco](/da/capabilities.html) bruger struktureret viden om kræft og indtastede profilfelter til at lave kildebelagte udkast til drøftelse; det analyserer ikke histologiske billeder. Koden er offentligt tilgængelig under MIT, og webstedet er gratis, men det kliniske indhold er stadig under gennemgang. Værktøjerne besvarer forskellige spørgsmål og kan supplere hinanden. Intet direkte sammenlignende studie viser, at det ene forbedrer behandlingsresultater mere end det andet. Artiklen erstatter ikke en læge og vejleder ikke i individuelle behandlingsvalg. Kilder kontrolleret 28. oktober 2026."
  sv:
    title: Lunit och Summit ska undersöka tumörbilder efter möjliga biomarkörer för ivonescimab
    summary: Forskningsavtalet använder AI-patologi för att studera vävnadsmönster. Det redovisar inga nya kliniska resultat eller data om behandlingsval.
    body:
      - type: p
        text: "Lunit och Summit Therapeutics tillkännagav ett forskningsavtal daterat den 23 oktober; Lunit publicerade det på sin webbplats den 26 oktober. SCOPE IO från Lunit ska analysera rutinmässiga tumörbilder färgade med hematoxylin och eosin (H&E) från Summits utvecklingsprogram för ivonescimab. Syftet är att undersöka egenskaper hos tumörens mikromiljö inför framtida biomarkörforskning och indelning av studiedeltagare. Tillkännagivandet innehåller inga nya kliniska resultat, ingen validerad biomarkör och inga belägg för att programmet kan välja behandling åt en patient."
      - type: p
        text: "SCOPE IO analyserar bilder för biofarmaceutisk forskning. Produktsidan beskriver mätningar av immun- och vävnadsmönster och anger **endast för forskning**, inte för diagnostiska beslut. Den granskade sidan publicerar varken pris eller öppen källkodslicens. Avtalet är en plan för att studera bilder, inte bevis för att en bildbaserad signal förutsäger nytta av ivonescimab."
      - type: p
        text: "[OpenOnco](/sv/capabilities.html) använder strukturerad kunskap om cancer och inmatade profilfält för att skapa källhänvisade utkast för diskussion; det analyserar inte histologiska bilder. Koden är offentlig med MIT-licens och webbplatsen är gratis, men det kliniska innehållet granskas fortfarande. Verktygen svarar på olika frågor och kan komplettera varandra. Ingen direkt jämförande studie visar att det ena förbättrar behandlingsresultat mer än det andra. Artikeln ersätter inte en läkare och vägleder inte ett individuellt behandlingsval. Källor kontrollerade den 28 oktober 2026."
  nb:
    title: Lunit og Summit skal undersøke svulstbilder for mulige biomarkører for ivonescimab
    summary: Forskningsavtalen bruker KI-patologi til å studere vevsmønstre. Den legger ikke frem nye kliniske resultater eller data om behandlingsvalg.
    body:
      - type: p
        text: "Lunit og Summit Therapeutics kunngjorde en forskningsavtale datert 23. oktober; Lunit publiserte den på sitt nettsted 26. oktober. SCOPE IO fra Lunit skal analysere rutinemessige svulstbilder farget med hematoksylin og eosin (H&E) fra Summits utviklingsprogrammer for ivonescimab. Målet er å undersøke trekk ved svulstens mikromiljø for fremtidig biomarkørforskning og inndeling av studiedeltakere. Meldingen inneholder ingen nye kliniske resultater, ingen validert biomarkør og ingen dokumentasjon for at programmet kan velge behandling for en pasient."
      - type: p
        text: "SCOPE IO analyserer bilder til biofarmasøytisk forskning. Produktsiden beskriver måling av immun- og vevsmønstre og merker det **kun til forskning**, ikke til diagnostiske beslutninger. Den undersøkte siden oppgir verken pris eller lisens for åpen kildekode. Avtalen er en plan om å studere bilder, ikke bevis for at et signal fra dem kan forutsi nytte av ivonescimab."
      - type: p
        text: "[OpenOnco](/nb/capabilities.html) bruker strukturert kunnskap om kreft og innlagte profilfelt til å lage kildebelagte utkast til diskusjon; det analyserer ikke histologiske bilder. Koden er offentlig under MIT, og nettstedet er gratis, men det kliniske innholdet gjennomgås fortsatt. Verktøyene svarer på ulike spørsmål og kan utfylle hverandre. Ingen direkte sammenlignende studie viser at det ene forbedrer behandlingsresultater mer enn det andre. Artikkelen erstatter ikke en lege og veileder ikke individuelle behandlingsvalg. Kilder kontrollert 28. oktober 2026."
  fi:
    title: Lunit ja Summit tutkivat kasvainkuvia ivonescimabin mahdollisten biomarkkereiden löytämiseksi
    summary: Tutkimussopimus käyttää tekoälypatologiaa kudoskuvioiden tutkimiseen. Uusia kliinisiä tuloksia tai tietoja hoidon valinnasta ei esitetä.
    body:
      - type: p
        text: "Lunit ja Summit Therapeutics ilmoittivat 23. lokakuuta päivätystä tutkimussopimuksesta; Lunit julkaisi tiedotteen sivustollaan 26. lokakuuta. Lunitin SCOPE IO analysoi tavanomaisia hematoksyliinillä ja eosiinilla (H&E) värjättyjä kasvainkuvia Summitin ivonescimabin kehitysohjelmista. Tavoitteena on tutkia kasvaimen mikroympäristön piirteitä tulevaa biomarkkeritutkimusta ja tutkimukseen osallistuvien ryhmittelyä varten. Tiedotteessa ei esitetä uusia kliinisiä tuloksia, validoitua biomarkkeria eikä näyttöä siitä, että ohjelma voisi valita potilaan hoidon."
      - type: p
        text: "SCOPE IO analysoi kuvia biolääketieteellistä tutkimusta varten. Tuotesivu kuvaa immuuni- ja kudoskuvioiden mittaamista ja merkitsee tuotteen **vain tutkimuskäyttöön**, ei diagnostisiin päätöksiin. Tarkistetulla sivulla ei kerrota hintaa eikä avointa lähdekoodilisenssiä. Sopimus on suunnitelma kuvien tutkimiseksi, ei todiste siitä, että niistä saatu signaali ennustaisi ivonescimabin hyötyä."
      - type: p
        text: "[OpenOnco](/fi/capabilities.html) käyttää jäsenneltyä syöpätietoa ja syötettyjä profiilikenttiä lähteisiin viittaavien keskusteluluonnosten laatimiseen; se ei analysoi histologisia kuvia. Koodi on julkinen MIT-lisenssillä ja sivusto on maksuton, mutta kliininen sisältö on edelleen tarkastettavana. Työkalut vastaavat eri kysymyksiin ja voivat täydentää toisiaan. Suora vertaileva tutkimus ei osoita kummankaan parantavan hoitotuloksia toista enemmän. Artikkeli ei korvaa lääkäriä eikä ohjaa yksilöllistä hoitovalintaa. Lähteet tarkistettu 28. lokakuuta 2026."
