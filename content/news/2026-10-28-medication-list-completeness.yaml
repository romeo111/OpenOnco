slug: medication-list-completeness
date: 2026-10-28
published: 2026-10-28
kind: project
series: openonco-three-day
series_format: platform
author: OpenOnco
tags: [platform, plan-builder, medicines, safety]
title:
  en: A medicine list can be partial, and Plan Builder says so
  uk: Перелік ліків може бути неповним — Plan Builder це позначає
summary:
  en: Record current medicines in the form and state whether the list is partial or complete according to you. This is no interaction check.
  uk: Запишіть поточні ліки у формі й зазначте, чи перелік, за вашими даними, частковий або повний. Це не перевірка взаємодій.
sources:
  - citation: "OpenOnco. Plan Builder and its medicine-list notice. Checked 28 October 2026."
    id: https://openonco.info/try.html
  - citation: "OpenOnco. Medication editor copy and completeness choices, repository master checked 28 October 2026."
    id: https://github.com/romeo111/OpenOnco/blob/43a4c5c2cb/scripts/medication_editor.py
  - citation: "OpenOnco. Plan Builder medicine-list workflow and limitations, README checked 28 October 2026."
    id: https://github.com/romeo111/OpenOnco/blob/43a4c5c2cb/README.md
body:
  en:
    - type: p
      text: "In [Plan Builder](/try.html), open **Concomitant medicines** in the ordinary form. Choose current medicines from the catalog, mark the list as partial or complete according to you, then select **Save medication list**. The form also offers an unknown status when no medicine is selected. You need not edit JSON. The form keeps this information in the local browser draft."
    - type: p
      text: "Imagine a wholly fictional profile with one listed medicine and a second medicine absent from the catalog. Mark the list **partial**; do not present the one selected item as a complete medication history. Previous cancer treatments are recorded separately. A ‘complete’ label is only the user's statement, not an independent verification."
    - type: p
      text: "The catalog is limited, and this feature does not check every drug interaction or establish that a proposed plan is safe. Use invented, non-identifiable examples on this public site. A clinician must review any real medication history and treatment decision. This article does not replace a doctor. Feature and sources checked 28 October 2026."
  uk:
    - type: p
      text: "У [Plan Builder](/ukr/try.html) відкрийте розділ **Супутні ліки** у звичайній формі. Виберіть ліки, які приймаються зараз, із каталогу, позначте перелік як частковий або повний за вашими даними й натисніть **Зберегти перелік ліків**. Якщо ліків не вибрано, доступний і статус «невідомо». Редагувати JSON не потрібно. Форма зберігає ці дані в локальній чернетці браузера."
    - type: p
      text: "Уявімо повністю вигаданий профіль: один препарат є в каталозі, а другого там немає. Позначте перелік як **частковий**; не подавайте один вибраний препарат як повну історію прийому ліків. Попереднє лікування раку записується окремо. Позначка «повний» відображає лише заяву користувача, а не незалежну перевірку."
    - type: p
      text: "Каталог обмежений, а ця функція не перевіряє всі лікарські взаємодії й не доводить безпечності запропонованого плану. На публічному сайті використовуйте лише вигадані приклади без даних, за якими можна встановити особу. Реальний перелік ліків і рішення щодо лікування має оцінити лікар. Матеріал не замінює консультації лікаря. Функцію та джерела перевірено 28 жовтня 2026 року."
translations:
  es:
    title: La lista de medicamentos puede ser parcial, y Plan Builder lo indica
    summary: Registre los medicamentos actuales e indique si la lista es parcial o completa según usted. Esto no comprueba las interacciones.
    body:
      - type: p
        text: "En [Plan Builder](/es/try.html), abra **Medicamentos concomitantes** en el formulario habitual. Elija los medicamentos actuales del catálogo, marque la lista como parcial o completa según usted y pulse **Guardar lista de medicamentos**. Si no selecciona ninguno, también puede indicar que la lista es desconocida. No hace falta editar JSON. El formulario conserva estos datos en el borrador local del navegador."
      - type: p
        text: "Imagine un perfil totalmente ficticio con un medicamento incluido y otro ausente del catálogo. Marque la lista como **parcial**; no presente el único medicamento seleccionado como una historia farmacológica completa. Los tratamientos oncológicos previos se registran por separado. «Completa» refleja solo la declaración del usuario, no una comprobación independiente."
      - type: p
        text: "El catálogo es limitado: esta función no comprueba todas las interacciones farmacológicas ni demuestra que un plan propuesto sea seguro. Use solo ejemplos inventados y no identificables en este sitio público. Un profesional sanitario debe revisar cualquier lista real de medicamentos y decisión terapéutica. Este artículo no sustituye al médico. Función y fuentes verificadas el 28 de octubre de 2026."
  pt:
    title: A lista de medicamentos pode ser parcial, e o Plan Builder assinala-o
    summary: Registe os medicamentos atuais e indique se a lista é parcial ou completa segundo si. Isto não verifica interações.
    body:
      - type: p
        text: "No [Plan Builder](/pt/try.html), abra **Medicamentos concomitantes** no formulário habitual. Escolha os medicamentos atuais do catálogo, assinale a lista como parcial ou completa segundo si e selecione **Guardar lista de medicamentos**. Se não selecionar nenhum, também pode indicar que a lista é desconhecida. Não precisa de editar JSON. O formulário mantém estes dados no rascunho local do navegador."
      - type: p
        text: "Imagine um perfil totalmente fictício com um medicamento presente no catálogo e outro ausente. Assinale a lista como **parcial**; não apresente o único medicamento selecionado como um historial completo. Os tratamentos oncológicos anteriores são registados separadamente. «Completa» reflete apenas a declaração do utilizador, não uma verificação independente."
      - type: p
        text: "O catálogo é limitado: esta função não verifica todas as interações medicamentosas nem demonstra que um plano proposto seja seguro. Use apenas exemplos inventados e não identificáveis neste sítio público. Um profissional de saúde deve rever qualquer lista real de medicamentos e decisão terapêutica. Este artigo não substitui um médico. Função e fontes verificadas em 28 de outubro de 2026."
  de:
    title: Eine Medikamentenliste darf unvollständig sein – Plan Builder kennzeichnet das
    summary: Erfassen Sie aktuelle Medikamente und geben Sie an, ob die Liste Ihrer Einschätzung nach unvollständig oder vollständig ist. Das ist keine Interaktionsprüfung.
    body:
      - type: p
        text: "Öffnen Sie im normalen Formular des [Plan Builders](/de/try.html) den Abschnitt **Begleitmedikation**. Wählen Sie aktuelle Medikamente aus dem Katalog, kennzeichnen Sie die Liste als unvollständig oder nach eigener Angabe vollständig und klicken Sie auf **Medikamentenliste speichern**. Wenn Sie kein Medikament auswählen, ist auch der Status unbekannt möglich. JSON müssen Sie nicht bearbeiten. Das Formular behält diese Angaben im lokalen Browserentwurf."
      - type: p
        text: "Stellen Sie sich ein vollständig erfundenes Profil vor: Ein Medikament steht im Katalog, ein zweites fehlt. Kennzeichnen Sie die Liste als **unvollständig**; das eine ausgewählte Mittel ist keine vollständige Medikamentenanamnese. Frühere Krebsbehandlungen werden getrennt erfasst. „Vollständig“ ist nur eine Angabe der nutzenden Person und keine unabhängige Prüfung."
      - type: p
        text: "Der Katalog ist begrenzt. Diese Funktion prüft nicht alle Arzneimittelwechselwirkungen und belegt nicht, dass ein vorgeschlagener Plan sicher ist. Verwenden Sie auf dieser öffentlichen Website nur erfundene, nicht identifizierbare Beispiele. Eine medizinische Fachperson muss jede echte Medikamentenanamnese und Therapieentscheidung prüfen. Dieser Artikel ersetzt keinen Arzt. Funktion und Quellen geprüft am 28. Oktober 2026."
  fr:
    title: Une liste de médicaments peut être partielle, et Plan Builder le signale
    summary: Notez les médicaments actuels et indiquez si la liste est partielle ou complète selon vous. Ce n'est pas une vérification des interactions.
    body:
      - type: p
        text: "Dans le formulaire habituel de [Plan Builder](/fr/try.html), ouvrez **Médicaments concomitants**. Choisissez les médicaments actuels du catalogue, indiquez si la liste est partielle ou complète selon vous, puis cliquez sur **Enregistrer la liste des médicaments**. Si vous ne sélectionnez aucun médicament, le statut inconnu est aussi possible. Aucune modification du JSON n'est nécessaire. Le formulaire conserve ces données dans le brouillon local du navigateur."
      - type: p
        text: "Imaginez un profil entièrement fictif : un médicament figure dans le catalogue, un second en est absent. Indiquez une liste **partielle** ; le seul médicament sélectionné ne constitue pas un historique médicamenteux complet. Les traitements anticancéreux antérieurs sont consignés séparément. « Complète » exprime uniquement la déclaration de l'utilisateur, sans vérification indépendante."
      - type: p
        text: "Le catalogue est limité. Cette fonction ne vérifie pas toutes les interactions médicamenteuses et ne prouve pas qu'un plan proposé est sûr. Sur ce site public, utilisez seulement des exemples inventés et non identifiables. Un professionnel de santé doit examiner tout véritable historique médicamenteux et toute décision thérapeutique. Cet article ne remplace pas un médecin. Fonction et sources vérifiées le 28 octobre 2026."
  it:
    title: L'elenco dei farmaci può essere parziale, e Plan Builder lo segnala
    summary: Registra i farmaci attuali e indica se l'elenco è parziale o completo secondo te. Non è un controllo delle interazioni.
    body:
      - type: p
        text: "Nel modulo ordinario di [Plan Builder](/it/try.html), apri **Farmaci concomitanti**. Scegli i farmaci attuali dal catalogo, indica se l'elenco è parziale o completo secondo te e seleziona **Salva elenco dei farmaci**. Se non selezioni alcun farmaco, puoi anche indicare uno stato sconosciuto. Non occorre modificare il JSON. Il modulo conserva questi dati nella bozza locale del browser."
      - type: p
        text: "Immagina un profilo del tutto inventato: un farmaco compare nel catalogo e un secondo manca. Indica un elenco **parziale**; l'unico farmaco selezionato non rappresenta una storia farmacologica completa. Le terapie oncologiche precedenti sono registrate separatamente. «Completo» riflette solo la dichiarazione dell'utente, non una verifica indipendente."
      - type: p
        text: "Il catalogo è limitato. Questa funzione non verifica tutte le interazioni farmacologiche né dimostra che un piano proposto sia sicuro. Su questo sito pubblico usa solo esempi inventati e non identificabili. Un professionista sanitario deve esaminare ogni reale elenco di farmaci e decisione terapeutica. Questo articolo non sostituisce il medico. Funzione e fonti verificate il 28 ottobre 2026."
  da:
    title: En medicinliste kan være delvis – Plan Builder viser det
    summary: Registrér den aktuelle medicin, og angiv, om listen efter din vurdering er delvis eller komplet. Dette er ikke et tjek af interaktioner.
    body:
      - type: p
        text: "Åbn **Samtidig medicin** i den almindelige formular i [Plan Builder](/da/try.html). Vælg aktuel medicin fra kataloget, angiv listen som delvis eller komplet ifølge dig, og vælg **Gem medicinlisten**. Formularen tilbyder også status ukendt, når ingen medicin er valgt. Du behøver ikke redigere JSON. Formularen beholder oplysningerne i browserens lokale kladde."
      - type: p
        text: "Forestil dig en helt opdigtet profil: Ét lægemiddel findes i kataloget, mens et andet mangler. Angiv listen som **delvis**; det ene valgte lægemiddel udgør ikke en fuldstændig medicinhistorik. Tidligere kræftbehandling registreres særskilt. »Komplet« er kun brugerens egen oplysning, ikke en uafhængig kontrol."
      - type: p
        text: "Kataloget er begrænset. Funktionen undersøger ikke alle lægemiddelinteraktioner og viser ikke, at en foreslået plan er sikker. Brug kun opdigtede, ikke-identificerbare eksempler på dette offentlige websted. En sundhedsfaglig person skal gennemgå enhver virkelig medicinhistorik og behandlingsbeslutning. Artiklen erstatter ikke en læge. Funktion og kilder kontrolleret 28. oktober 2026."
  sv:
    title: En läkemedelslista kan vara ofullständig – Plan Builder visar det
    summary: Ange aktuella läkemedel och om listan enligt dig är delvis eller fullständig. Detta är ingen kontroll av interaktioner.
    body:
      - type: p
        text: "Öppna **Samtidiga läkemedel** i det vanliga formuläret i [Plan Builder](/sv/try.html). Välj aktuella läkemedel ur katalogen, markera listan som delvis eller fullständig enligt dig och välj **Spara läkemedelslistan**. Formuläret erbjuder också status okänd när inget läkemedel har valts. Du behöver inte redigera JSON. Formuläret sparar uppgifterna i webbläsarens lokala utkast."
      - type: p
        text: "Tänk dig en helt påhittad profil: Ett läkemedel finns i katalogen, men ett annat saknas. Markera listan som **delvis**; det enda valda läkemedlet är ingen fullständig läkemedelshistorik. Tidigare cancerbehandling registreras separat. ”Fullständig” är bara användarens uppgift, inte en oberoende kontroll."
      - type: p
        text: "Katalogen är begränsad. Funktionen kontrollerar inte alla läkemedelsinteraktioner och visar inte att en föreslagen plan är säker. Använd bara påhittade exempel utan identifierande uppgifter på denna offentliga webbplats. Vårdpersonal måste granska varje verklig läkemedelshistorik och behandlingsbeslut. Artikeln ersätter inte en läkare. Funktion och källor kontrollerade den 28 oktober 2026."
  nb:
    title: En legemiddelliste kan være ufullstendig – Plan Builder viser det
    summary: Registrer aktuelle legemidler og om listen etter din vurdering er delvis eller fullstendig. Dette er ingen kontroll av interaksjoner.
    body:
      - type: p
        text: "Åpne **Samtidige legemidler** i det vanlige skjemaet i [Plan Builder](/nb/try.html). Velg aktuelle legemidler fra katalogen, merk listen som delvis eller fullstendig ifølge deg, og velg **Lagre legemiddellisten**. Skjemaet tilbyr også status ukjent når ingen legemidler er valgt. Du trenger ikke redigere JSON. Skjemaet beholder opplysningene i nettleserens lokale utkast."
      - type: p
        text: "Tenk deg en helt oppdiktet profil: Ett legemiddel finnes i katalogen, mens et annet mangler. Merk listen som **delvis**; det ene valgte legemiddelet er ingen fullstendig legemiddelhistorikk. Tidligere kreftbehandling registreres separat. «Fullstendig» er bare brukerens egen opplysning, ikke en uavhengig kontroll."
      - type: p
        text: "Katalogen er begrenset. Funksjonen kontrollerer ikke alle legemiddelinteraksjoner og viser ikke at en foreslått plan er trygg. Bruk bare oppdiktede eksempler uten identifiserende opplysninger på dette offentlige nettstedet. Helsepersonell må gjennomgå enhver reell legemiddelhistorikk og behandlingsbeslutning. Artikkelen erstatter ikke en lege. Funksjon og kilder kontrollert 28. oktober 2026."
  fi:
    title: Lääkeluettelo voi olla osittainen – Plan Builder kertoo sen
    summary: Kirjaa nykyiset lääkkeet ja ilmoita, onko luettelo mielestäsi osittainen vai täydellinen. Tämä ei tarkista yhteisvaikutuksia.
    body:
      - type: p
        text: "Avaa [Plan Builderin](/fi/try.html) tavallisesta lomakkeesta **Samanaikaiset lääkkeet**. Valitse nykyiset lääkkeet luettelosta, merkitse luettelo osittaiseksi tai ilmoituksesi mukaan täydelliseksi ja valitse **Tallenna lääkeluettelo**. Jos et valitse lääkkeitä, myös tila tuntematon on mahdollinen. JSONia ei tarvitse muokata. Lomake säilyttää tiedot selaimen paikallisessa luonnoksessa."
      - type: p
        text: "Kuvittele täysin keksitty profiili: yksi lääke on luettelossa, mutta toinen puuttuu. Merkitse lista **osittaiseksi**; yksi valittu lääke ei ole täydellinen lääkehistoria. Aiemmat syöpähoidot kirjataan erikseen. Merkintä ”täydellinen” on vain käyttäjän oma ilmoitus, ei riippumaton tarkistus."
      - type: p
        text: "Luettelo on rajallinen. Toiminto ei tarkista kaikkia lääkeyhteisvaikutuksia eikä osoita ehdotetun hoitosuunnitelman olevan turvallinen. Käytä tällä julkisella sivustolla vain keksittyjä esimerkkejä, joista henkilöä ei voi tunnistaa. Terveydenhuollon ammattilaisen on arvioitava todellinen lääkehistoria ja hoitopäätös. Artikkeli ei korvaa lääkäriä. Toiminto ja lähteet tarkistettu 28. lokakuuta 2026."
