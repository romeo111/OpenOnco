slug: tempus-xr-ivdr
date: 2026-10-29
published: 2026-10-29
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, precision-oncology, diagnostics, regulation]
title:
  en: Tempus says its xR assay gained EU Class C certification. What does that mean?
  uk: Tempus повідомляє про сертифікацію аналізу xR у ЄС за класом C. Що це означає?
summary:
  en: A regulatory milestone for an RNA test is distinct from proof of better treatment outcomes. The assay and OpenOnco solve different problems.
  uk: Регуляторний крок для РНК-тесту не доводить кращих результатів лікування. Аналіз і OpenOnco розв'язують різні завдання.
sources:
  - citation: "Tempus AI. xR EU IVDR Class C certification announcement, 26 October 2026. Checked 29 October 2026."
    id: https://investors.tempus.com/news-releases/news-release-details/tempus-receives-ivdr-certification-xr-rna-sequencing-solid-tumor
  - citation: "Tempus AI. xR RNA-sequencing product description for life sciences. Checked 29 October 2026. This page is not the EU certificate or certified intended-use document."
    id: https://www.tempus.com/solutions/ls-xr/
  - citation: "Ireland Health Products Regulatory Authority. IVDR transitional provisions and Class C deadline. Checked 29 October 2026."
    id: https://www.hpra.ie/regulation/medical-devices/manufacturers-and-authorised-representatives/ivdr-transitional-provisions
  - citation: "OpenOnco. Current capabilities, source-linked rule drafts and clinical-review limits. Checked 29 October 2026."
    id: https://openonco.info/capabilities.html
  - citation: "OpenOnco. Public MIT source licence. Checked 29 October 2026."
    id: https://github.com/romeo111/OpenOnco/blob/aef520fcd4/LICENSE
body:
  en:
    - type: p
      text: "On 26 October, Tempus AI announced that its xR RNA assay had received EU In Vitro Diagnostic Regulation (IVDR) Class C certification. According to the company, xR examines solid-tumor tissue for gene rearrangements and selected splice variants. Its product page describes an RNA-sequencing laboratory workflow. The announcement describes a quality-management-system scope but does not provide the certificate number, notified body or full EU intended-use document; those details were not independently checked here."
    - type: p
      text: "This is a regulatory milestone, not a new treatment trial. The Irish regulator lists 31 December 2028 as the transition deadline for eligible legacy Class C devices. The announcement does not report a patient-outcome comparison or prove that xR-guided care extends life. The checked Tempus product page does not state a public price or offer an open-source code licence. It also describes a broader research-facing xR offering; its full menu should not be assumed to be the certified EU configuration."
    - type: p
      text: "[OpenOnco](/capabilities.html) does not sequence tissue. It uses entered clinical and molecular fields plus public, MIT-licensed rules and cited sources to draft discussion paths on a free website; much of its clinical content still awaits review. A laboratory result and a source-linked discussion draft could serve different stages of care, but no direct study compares their effects on outcomes. This article is not a test recommendation, treatment advice or a substitute for a physician. Sources checked 29 October 2026."
  uk:
    - type: p
      text: "26 жовтня Tempus AI повідомила, що її РНК-аналіз xR отримав сертифікацію за регламентом ЄС щодо діагностики in vitro (IVDR), клас C. За словами компанії, xR досліджує тканину солідних пухлин на перебудови генів та окремі варіанти сплайсингу. Сторінка продукту описує лабораторний процес секвенування РНК. У повідомленні наведено сферу дії системи управління якістю, але немає номера сертифіката, назви нотифікованого органу чи повного документа про призначення тесту в ЄС; ці подробиці тут незалежно не перевірено."
    - type: p
      text: "Це регуляторний крок, а не нове дослідження лікування. Ірландський регулятор указує 31 грудня 2028 року як кінець перехідного періоду для відповідних раніше зареєстрованих пристроїв класу C. Повідомлення не містить порівняння результатів лікування пацієнтів і не доводить, що рішення на основі xR подовжують життя. На перевіреній сторінці Tempus немає публічної ціни чи відкритої ліцензії на код. Там також описано ширший дослідницький варіант xR; не слід вважати, що весь його перелік можливостей входить до сертифікованої в ЄС конфігурації."
    - type: p
      text: "[OpenOnco](/ukr/capabilities.html) не секвенує тканини. Він використовує введені клінічні та молекулярні дані, публічні правила за ліцензією MIT і джерела, щоб на безкоштовному сайті створювати чернетки для обговорення; значна частина клінічного вмісту ще очікує рецензування. Лабораторний результат і чернетка з посиланнями на джерела можуть бути корисними на різних етапах, але прямого дослідження їхнього впливу на результати немає. Ця стаття не рекомендує тест чи лікування й не замінює лікаря. Джерела перевірено 29 жовтня 2026 року."
translations:
  es:
    title: Tempus afirma que xR obtuvo la certificación europea de clase C. ¿Qué significa?
    summary: Un avance regulatorio para una prueba de ARN no demuestra mejores resultados terapéuticos. El ensayo y OpenOnco resuelven problemas distintos.
    body:
      - type: p
        text: "El 26 de octubre, Tempus AI anunció que su ensayo de ARN xR había obtenido la certificación de clase C conforme al Reglamento europeo de productos sanitarios para diagnóstico in vitro (IVDR). Según la empresa, xR examina tejido de tumores sólidos para detectar reordenamientos génicos y determinadas variantes de empalme. La página del producto describe un proceso de laboratorio de secuenciación de ARN. El comunicado menciona el alcance del sistema de gestión de calidad, pero no facilita el número de certificado, el organismo notificado ni el documento completo de uso previsto en la UE; aquí no se han verificado esos detalles de forma independiente."
      - type: p
        text: "Es un hito regulatorio, no un nuevo ensayo terapéutico. La autoridad irlandesa fija el 31 de diciembre de 2028 como fin del período transitorio para los dispositivos heredados de clase C que cumplan los requisitos. El comunicado no compara resultados clínicos ni demuestra que la atención guiada por xR prolongue la vida. La página de Tempus consultada no publica precio ni licencia de código abierto. Además, describe una oferta xR más amplia orientada a la investigación; no cabe suponer que todas esas funciones formen parte de la configuración certificada en la UE."
      - type: p
        text: "[OpenOnco](/es/capabilities.html) no secuencia tejidos. Usa datos clínicos y moleculares introducidos, reglas públicas bajo licencia MIT y fuentes citadas para elaborar borradores de discusión en una web gratuita; gran parte de su contenido clínico aún está pendiente de revisión. Un resultado de laboratorio y un borrador con fuentes pueden servir en fases distintas, pero ningún estudio directo compara sus efectos en los resultados. Este artículo no recomienda pruebas ni tratamientos y no sustituye al médico. Fuentes verificadas el 29 de octubre de 2026."
  pt:
    title: A Tempus afirma que o xR obteve certificação europeia de classe C. O que significa?
    summary: Um marco regulamentar para um teste de ARN não prova melhores resultados terapêuticos. O ensaio e o OpenOnco resolvem problemas diferentes.
    body:
      - type: p
        text: "Em 26 de outubro, a Tempus AI anunciou que o seu ensaio de ARN xR recebeu certificação de classe C ao abrigo do Regulamento europeu dos dispositivos médicos para diagnóstico in vitro (IVDR). Segundo a empresa, o xR examina tecido de tumores sólidos para identificar rearranjos génicos e determinadas variantes de splicing. A página do produto descreve um processo laboratorial de sequenciação de ARN. O comunicado descreve o âmbito do sistema de gestão da qualidade, mas não apresenta o número do certificado, o organismo notificado nem o documento completo de finalidade prevista na UE; estes detalhes não foram verificados independentemente aqui."
      - type: p
        text: "É um marco regulamentar, não um novo ensaio terapêutico. A autoridade irlandesa indica 31 de dezembro de 2028 como fim da transição para os dispositivos antigos elegíveis de classe C. O comunicado não compara resultados dos doentes nem demonstra que cuidados orientados pelo xR prolonguem a vida. A página da Tempus consultada não publica preço nem licença de código aberto. Também descreve uma oferta xR mais ampla para investigação; não se deve presumir que todas as suas funções integrem a configuração certificada na UE."
      - type: p
        text: "O [OpenOnco](/pt/capabilities.html) não sequencia tecidos. Usa dados clínicos e moleculares introduzidos, regras públicas sob licença MIT e fontes citadas para preparar rascunhos de discussão num sítio gratuito; muito do conteúdo clínico ainda aguarda revisão. Um resultado laboratorial e um rascunho com fontes podem servir etapas diferentes, mas nenhum estudo direto compara os seus efeitos nos resultados. Este artigo não recomenda testes nem tratamentos e não substitui um médico. Fontes verificadas em 29 de outubro de 2026."
  de:
    title: Tempus meldet eine EU-Zertifizierung der Klasse C für xR. Was bedeutet das?
    summary: Ein regulatorischer Schritt für einen RNA-Test belegt keine besseren Behandlungsergebnisse. Der Test und OpenOnco erfüllen unterschiedliche Aufgaben.
    body:
      - type: p
        text: "Am 26. Oktober teilte Tempus AI mit, sein RNA-Test xR habe eine Zertifizierung der Klasse C nach der EU-Verordnung für In-vitro-Diagnostika (IVDR) erhalten. Laut Unternehmen untersucht xR Gewebe solider Tumoren auf Genumlagerungen und bestimmte Spleißvarianten. Die Produktseite beschreibt einen Laborablauf zur RNA-Sequenzierung. Die Mitteilung nennt den Geltungsbereich des Qualitätsmanagementsystems, aber weder Zertifikatsnummer noch Benannte Stelle oder das vollständige Dokument zur EU-Zweckbestimmung; diese Angaben wurden hier nicht unabhängig geprüft."
      - type: p
        text: "Das ist ein regulatorischer Schritt, keine neue Therapiestudie. Die irische Behörde nennt den 31. Dezember 2028 als Ende der Übergangsfrist für geeignete bisherige Produkte der Klasse C. Die Mitteilung vergleicht keine Behandlungsergebnisse und belegt nicht, dass xR-gestützte Versorgung das Leben verlängert. Die geprüfte Tempus-Seite veröffentlicht weder einen Preis noch eine Open-Source-Lizenz. Sie beschreibt zudem ein breiteres xR-Angebot für die Forschung; dessen gesamter Funktionsumfang darf nicht mit der EU-zertifizierten Konfiguration gleichgesetzt werden."
      - type: p
        text: "[OpenOnco](/de/capabilities.html) sequenziert kein Gewebe. Es nutzt eingegebene klinische und molekulare Daten, öffentliche Regeln unter MIT-Lizenz und zitierte Quellen, um auf einer kostenlosen Website Entwürfe für die Diskussion zu erstellen; ein großer Teil der klinischen Inhalte wartet noch auf Prüfung. Laborergebnis und quellenbasierter Entwurf können in verschiedenen Schritten nützlich sein, doch keine direkte Studie vergleicht ihre Wirkung auf Behandlungsergebnisse. Dieser Artikel empfiehlt weder Test noch Therapie und ersetzt keinen Arzt. Quellen geprüft am 29. Oktober 2026."
  fr:
    title: Tempus annonce une certification européenne de classe C pour xR. Que signifie-t-elle ?
    summary: Une étape réglementaire pour un test ARN ne prouve pas de meilleurs résultats thérapeutiques. Le test et OpenOnco répondent à des besoins différents.
    body:
      - type: p
        text: "Le 26 octobre, Tempus AI a annoncé que son test ARN xR avait obtenu une certification de classe C au titre du règlement européen sur les dispositifs de diagnostic in vitro (IVDR). Selon l'entreprise, xR analyse des tissus de tumeurs solides pour détecter des réarrangements géniques et certaines variantes d'épissage. La page produit décrit un processus de laboratoire de séquençage ARN. Le communiqué décrit le champ du système de gestion de la qualité, mais ne donne ni numéro de certificat, ni organisme notifié, ni document complet définissant l'usage prévu dans l'UE ; ces éléments n'ont pas été vérifiés indépendamment ici."
      - type: p
        text: "C'est une étape réglementaire, pas un nouvel essai thérapeutique. L'autorité irlandaise indique le 31 décembre 2028 comme fin de la transition pour les anciens dispositifs de classe C admissibles. Le communiqué ne compare pas les résultats des patients et ne prouve pas qu'une prise en charge guidée par xR prolonge la vie. La page Tempus consultée ne publie ni prix ni licence de code libre. Elle décrit aussi une offre xR plus large destinée à la recherche ; il ne faut pas supposer que toutes ses fonctions figurent dans la configuration certifiée pour l'UE."
      - type: p
        text: "[OpenOnco](/fr/capabilities.html) ne séquence pas les tissus. Il utilise des données cliniques et moléculaires saisies, des règles publiques sous licence MIT et des sources citées pour produire des ébauches de discussion sur un site gratuit ; une grande partie de son contenu clinique attend encore une révision. Un résultat de laboratoire et une ébauche sourcée peuvent servir à différentes étapes, mais aucune étude directe ne compare leurs effets sur les résultats. Cet article ne recommande ni test ni traitement et ne remplace pas un médecin. Sources vérifiées le 29 octobre 2026."
  it:
    title: Tempus annuncia la certificazione europea di classe C per xR. Che cosa significa?
    summary: Un traguardo regolatorio per un test RNA non dimostra migliori esiti terapeutici. Il test e OpenOnco svolgono compiti diversi.
    body:
      - type: p
        text: "Il 26 ottobre Tempus AI ha annunciato che il suo test RNA xR ha ottenuto la certificazione di classe C ai sensi del regolamento europeo sui dispositivi diagnostici in vitro (IVDR). Secondo l'azienda, xR analizza tessuti di tumori solidi per identificare riarrangiamenti genici e specifiche varianti di splicing. La pagina del prodotto descrive un processo di laboratorio di sequenziamento dell'RNA. Il comunicato indica l'ambito del sistema di gestione della qualità, ma non fornisce numero del certificato, organismo notificato né documento completo della destinazione d'uso nell'UE; questi dettagli non sono stati verificati in modo indipendente qui."
      - type: p
        text: "È un traguardo regolatorio, non un nuovo studio terapeutico. L'autorità irlandese indica il 31 dicembre 2028 come termine della transizione per i dispositivi precedenti di classe C idonei. Il comunicato non confronta esiti dei pazienti e non dimostra che un'assistenza guidata da xR prolunghi la vita. La pagina Tempus consultata non pubblica prezzo né licenza open source. Descrive anche un'offerta xR più ampia per la ricerca; non si deve presumere che tutte le sue funzioni rientrino nella configurazione certificata nell'UE."
      - type: p
        text: "[OpenOnco](/it/capabilities.html) non sequenzia tessuti. Usa dati clinici e molecolari inseriti, regole pubbliche con licenza MIT e fonti citate per produrre bozze di discussione su un sito gratuito; buona parte del contenuto clinico attende ancora revisione. Un risultato di laboratorio e una bozza con fonti possono servire in fasi diverse, ma nessuno studio diretto ne confronta gli effetti sugli esiti. Questo articolo non raccomanda test o terapie e non sostituisce il medico. Fonti verificate il 29 ottobre 2026."
  da:
    title: Tempus oplyser, at xR er EU-certificeret i klasse C. Hvad betyder det?
    summary: Et regulatorisk skridt for en RNA-test er ikke bevis for bedre behandlingsresultater. Testen og OpenOnco løser forskellige opgaver.
    body:
      - type: p
        text: "Den 26. oktober oplyste Tempus AI, at virksomhedens RNA-test xR havde fået klasse C-certificering efter EU's forordning om in vitro-diagnostik (IVDR). Ifølge virksomheden undersøger xR væv fra solide tumorer for genetiske omlejringer og bestemte splejsningsvarianter. Produktsiden beskriver en laboratorieproces med RNA-sekventering. Meddelelsen beskriver kvalitetsstyringssystemets omfang, men angiver hverken certifikatnummer, bemyndiget organ eller det fulde dokument om den tilsigtede anvendelse i EU; disse oplysninger er ikke uafhængigt kontrolleret her."
      - type: p
        text: "Det er et regulatorisk skridt, ikke et nyt behandlingsforsøg. Den irske myndighed angiver 31. december 2028 som slutdato for overgangsperioden for berettigede ældre klasse C-enheder. Meddelelsen sammenligner ikke patientresultater og viser ikke, at behandling styret af xR forlænger livet. Den gennemgåede Tempus-side oplyser hverken offentlig pris eller open source-licens. Den beskriver også et bredere xR-tilbud til forskning; man bør ikke antage, at alle dets funktioner er del af den EU-certificerede konfiguration."
      - type: p
        text: "[OpenOnco](/da/capabilities.html) sekventerer ikke væv. Det bruger indtastede kliniske og molekylære oplysninger, offentlige regler under MIT-licens og citerede kilder til at lave udkast til drøftelse på et gratis websted; meget af det kliniske indhold afventer stadig gennemgang. Et laboratorieresultat og et kildebelagt udkast kan bruges på forskellige trin, men ingen direkte undersøgelse sammenligner deres virkning på behandlingsresultater. Artiklen anbefaler hverken test eller behandling og erstatter ikke en læge. Kilder kontrolleret 29. oktober 2026."
  sv:
    title: Tempus uppger att xR fått EU-certifiering i klass C. Vad betyder det?
    summary: Ett regulatoriskt steg för ett RNA-test visar inte bättre behandlingsresultat. Testet och OpenOnco har olika uppgifter.
    body:
      - type: p
        text: "Den 26 oktober meddelade Tempus AI att företagets RNA-test xR fått klass C-certifiering enligt EU:s förordning om in vitro-diagnostik (IVDR). Enligt företaget undersöker xR vävnad från solida tumörer för genetiska omarrangemang och utvalda splitsningsvarianter. Produktsidan beskriver ett laboratorieflöde för RNA-sekvensering. Meddelandet anger kvalitetsledningssystemets omfattning men inte certifikatnummer, anmält organ eller det fullständiga dokumentet om avsedd användning i EU; dessa uppgifter har inte kontrollerats oberoende här."
      - type: p
        text: "Detta är ett regulatoriskt steg, ingen ny behandlingsstudie. Den irländska myndigheten anger den 31 december 2028 som slutdatum för övergången för äldre berättigade produkter i klass C. Meddelandet jämför inte patientresultat och visar inte att vård vägledd av xR förlänger livet. Den granskade Tempus-sidan anger varken offentligt pris eller öppen källkodslicens. Den beskriver också ett bredare xR-erbjudande för forskning; alla dess funktioner kan inte antas ingå i den EU-certifierade konfigurationen."
      - type: p
        text: "[OpenOnco](/sv/capabilities.html) sekvenserar inte vävnad. Det använder inmatade kliniska och molekylära uppgifter, offentliga regler med MIT-licens och citerade källor för att skapa utkast för diskussion på en gratis webbplats; mycket av det kliniska innehållet väntar fortfarande på granskning. Ett laboratorieresultat och ett källhänvisat utkast kan fylla olika funktioner, men ingen direkt studie jämför deras effekt på behandlingsresultat. Artikeln rekommenderar varken test eller behandling och ersätter inte en läkare. Källor kontrollerade den 29 oktober 2026."
  nb:
    title: Tempus opplyser at xR er EU-sertifisert i klasse C. Hva betyr det?
    summary: Et regulatorisk steg for en RNA-test viser ikke bedre behandlingsresultater. Testen og OpenOnco løser ulike oppgaver.
    body:
      - type: p
        text: "Den 26. oktober kunngjorde Tempus AI at selskapets RNA-test xR hadde fått klasse C-sertifisering etter EUs forordning om in vitro-diagnostikk (IVDR). Ifølge selskapet undersøker xR vev fra solide svulster for genetiske omorganiseringer og utvalgte spleisevarianter. Produktsiden beskriver en laboratorieprosess med RNA-sekvensering. Meldingen beskriver kvalitetsstyringssystemets omfang, men gir verken sertifikatnummer, teknisk kontrollorgan eller hele dokumentet om tiltenkt bruk i EU; disse opplysningene er ikke kontrollert uavhengig her."
      - type: p
        text: "Dette er et regulatorisk steg, ikke en ny behandlingsstudie. Den irske myndigheten oppgir 31. desember 2028 som sluttdato for overgangsperioden for kvalifiserte eldre produkter i klasse C. Meldingen sammenligner ikke pasientresultater og viser ikke at behandling styrt av xR forlenger livet. Den gjennomgåtte Tempus-siden oppgir verken offentlig pris eller lisens for åpen kildekode. Den beskriver også et bredere xR-tilbud for forskning; man bør ikke anta at alle funksjonene er del av den EU-sertifiserte konfigurasjonen."
      - type: p
        text: "[OpenOnco](/nb/capabilities.html) sekvenserer ikke vev. Det bruker innlagte kliniske og molekylære opplysninger, offentlige regler under MIT-lisens og siterte kilder til å lage utkast for diskusjon på et gratis nettsted; mye av det kliniske innholdet venter fortsatt på gjennomgang. Et laboratorieresultat og et kildebelagt utkast kan være nyttige i ulike trinn, men ingen direkte studie sammenligner virkningen deres på behandlingsresultater. Artikkelen anbefaler verken test eller behandling og erstatter ikke en lege. Kilder kontrollert 29. oktober 2026."
  fi:
    title: Tempus kertoo xR-testinsä saaneen EU:n C-luokan sertifioinnin. Mitä se tarkoittaa?
    summary: RNA-testin sääntelyyn liittyvä askel ei todista parempia hoitotuloksia. Testi ja OpenOnco palvelevat eri tarkoituksia.
    body:
      - type: p
        text: "Tempus AI ilmoitti 26. lokakuuta, että sen xR-RNA-testi on saanut EU:n in vitro -diagnostiikka-asetuksen (IVDR) mukaisen C-luokan sertifioinnin. Yhtiön mukaan xR tutkii kiinteiden kasvainten kudosta geenien uudelleenjärjestymien ja tiettyjen silmukointimuunnosten löytämiseksi. Tuotesivu kuvaa RNA-sekvensointiin perustuvaa laboratorioprosessia. Tiedotteessa kerrotaan laadunhallintajärjestelmän kattavuus, mutta ei sertifikaatin numeroa, ilmoitettua laitosta eikä koko EU:n käyttötarkoitusasiakirjaa; näitä tietoja ei ole tarkistettu riippumattomasti tässä."
      - type: p
        text: "Kyse on sääntelyyn liittyvästä askeleesta, ei uudesta hoitotutkimuksesta. Irlannin viranomainen ilmoittaa 31. joulukuuta 2028 siirtymäajan päättymispäiväksi ehdot täyttäville aiemmille C-luokan laitteille. Tiedote ei vertaa potilaiden hoitotuloksia eikä osoita xR:n ohjaaman hoidon pidentävän elämää. Tarkistetulla Tempus-sivulla ei ilmoiteta julkista hintaa eikä avoimen lähdekoodin lisenssiä. Se kuvaa myös laajempaa tutkimuskäyttöön tarkoitettua xR-tarjontaa; kaikkien sen toimintojen ei pidä olettaa kuuluvan EU:ssa sertifioituun kokoonpanoon."
      - type: p
        text: "[OpenOnco](/fi/capabilities.html) ei sekvensoi kudosta. Se käyttää syötettyjä kliinisiä ja molekyylitietoja, MIT-lisensoituja julkisia sääntöjä ja viitattuja lähteitä laatiakseen keskusteluluonnoksia maksuttomalla sivustolla; suuri osa kliinisestä sisällöstä odottaa yhä arviointia. Laboratoriotulos ja lähteisiin perustuva luonnos voivat palvella eri vaiheissa, mutta suora tutkimus ei vertaa niiden vaikutusta hoitotuloksiin. Artikkeli ei suosittele testiä tai hoitoa eikä korvaa lääkäriä. Lähteet tarkistettu 29. lokakuuta 2026."
