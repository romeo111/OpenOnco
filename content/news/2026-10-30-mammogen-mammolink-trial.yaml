slug: mammogen-mammolink-trial
date: 2026-10-30
published: 2026-10-30
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, breast-cancer, diagnostics, clinical-research]
title:
  en: Mammogen brings an RNA breast test study to mobile mammography sites
  uk: Mammogen залучає мобільні мамографічні центри до дослідження РНК-тесту
summary:
  en: A Florida partnership will test a blood assay alongside breast imaging. The planned study has no reported outcomes yet.
  uk: Партнерство у Флориді досліджуватиме аналіз крові поруч із мамографією. Результатів запланованого дослідження ще немає.
sources:
  - citation: "Mammogen. Mammogen and MammoLink partnership announcement, 27 October 2026. Checked 30 October 2026."
    id: https://www.globenewswire.com/news-release/2026/10/27/3388846/0/en/mammogen-and-mammolink-partner-to-advance-a-new-model-for-community-based-breast-cancer-detection.html
  - citation: "Mammogen. genTRU-breast product and clinical-development status. Checked 30 October 2026."
    id: https://www.mammogen.bio/learn-more-about-gentru-breast
  - citation: "OpenOnco. Current capabilities and clinical-review limits. Checked 30 October 2026."
    id: https://openonco.info/capabilities.html
  - citation: "OpenOnco. Public MIT source licence at the current repository revision. Checked 30 October 2026."
    id: https://github.com/romeo111/OpenOnco/blob/3f5cdf4acc/LICENSE
body:
  en:
    - type: p
      text: "On 27 October, Mammogen announced that MammoLink will bring its KATELYN-ERIN study into Florida communities through mobile 3D mammography sites. The company plans to evaluate genTRU-breast, a blood test measuring cell-free RNA, in approximately 2,600 women, comparing test results with biopsy-confirmed pathology. MammoLink reports a network of six mobile mammography units. These are company descriptions of a planned study and a delivery partnership, not published diagnostic results."
    - type: p
      text: "Mammogen describes genTRU-breast as a test in clinical development intended to complement breast imaging, particularly where dense tissue complicates interpretation. Its product page cites earlier internal performance figures, but says prospective validation is ongoing. The partnership release gives no prospective sensitivity, specificity, false-positive rate, effect on biopsy decisions or patient outcomes. A trial site can bring a study closer to people; it cannot establish that a test works until the results are available. The checked product page states neither a public price nor a public source-code licence."
    - type: p
      text: "[OpenOnco](/capabilities.html) addresses a different step: it takes entered clinical and molecular information and produces source-linked discussion drafts using public MIT-licensed rules on a free website. It does not analyze blood or mammograms, and much clinical content still needs review. A diagnostic assay could eventually provide data for later clinical discussion; no direct study shows that combining these tools improves outcomes. This article is not screening or treatment advice and does not replace a physician. Sources checked 30 October 2026."
  uk:
    - type: p
      text: "27 жовтня Mammogen повідомила, що MammoLink долучить до дослідження KATELYN-ERIN громади Флориди через мобільні центри 3D-мамографії. Компанія планує оцінити genTRU-breast — аналіз крові на позаклітинну РНК — приблизно у 2 600 жінок, порівнюючи його результати з патологічним висновком, підтвердженим біопсією. MammoLink повідомляє про мережу із шести мобільних мамографічних установок. Це опис запланованого дослідження й партнерства від компаній, а не опубліковані результати діагностики."
    - type: p
      text: "Mammogen описує genTRU-breast як тест на етапі клінічної розробки, який має доповнювати візуалізацію молочної залози, особливо коли щільна тканина ускладнює оцінювання. Сторінка продукту наводить попередні внутрішні показники, але зазначає, що проспективна перевірка триває. У повідомленні немає проспективних даних про чутливість, специфічність, хибнопозитивні результати, вплив на рішення про біопсію чи результати для пацієнток. Доступніше місце дослідження саме по собі не доводить ефективності тесту. На перевіреній сторінці немає публічної ціни чи відкритої ліцензії на код."
    - type: p
      text: "[OpenOnco](/ukr/capabilities.html) працює на іншому етапі: з уведених клінічних і молекулярних даних він створює чернетки для обговорення з посиланнями на джерела, використовуючи публічні правила за ліцензією MIT на безкоштовному сайті. Він не аналізує кров чи мамограми, а значна частина клінічного вмісту ще потребує рецензування. Діагностичний тест у майбутньому міг би дати дані для подальшого обговорення; прямого доказу поліпшення результатів від поєднання цих інструментів немає. Стаття не радить скринінг чи лікування й не замінює лікаря. Джерела перевірено 30 жовтня 2026 року."
translations:
  es:
    title: Mammogen lleva un estudio de un análisis de ARN a centros móviles de mamografía
    summary: Una alianza en Florida evaluará un análisis de sangre junto con la mamografía. El estudio previsto aún no tiene resultados.
    body:
      - type: p
        text: "El 27 de octubre, Mammogen anunció que MammoLink llevará el estudio KATELYN-ERIN a comunidades de Florida mediante centros móviles de mamografía 3D. La empresa prevé evaluar genTRU-breast, un análisis sanguíneo de ARN libre de células, en aproximadamente 2.600 mujeres, comparando sus resultados con la anatomía patológica confirmada por biopsia. MammoLink informa de una red de seis unidades móviles. Son descripciones empresariales de un estudio previsto y una alianza asistencial, no resultados diagnósticos publicados."
      - type: p
        text: "Mammogen describe genTRU-breast como una prueba en desarrollo clínico destinada a complementar la imagen mamaria, especialmente cuando el tejido denso dificulta la interpretación. La página del producto cita cifras internas anteriores, pero indica que la validación prospectiva continúa. El comunicado no ofrece sensibilidad, especificidad, tasa de falsos positivos, impacto en las decisiones de biopsia ni resultados para las pacientes del estudio prospectivo. Acercar el estudio a las personas no demuestra por sí mismo que la prueba funcione. La página consultada no publica precio ni licencia de código fuente."
      - type: p
        text: "[OpenOnco](/es/capabilities.html) actúa en otra fase: con datos clínicos y moleculares introducidos elabora borradores de discusión con fuentes mediante reglas públicas bajo licencia MIT en una web gratuita. No analiza sangre ni mamografías, y gran parte del contenido clínico aún requiere revisión. Una prueba diagnóstica podría aportar datos para una discusión posterior; ningún estudio directo demuestra mejores resultados al combinar estas herramientas. Este artículo no aconseja pruebas de cribado ni tratamientos y no sustituye al médico. Fuentes verificadas el 30 de octubre de 2026."
  pt:
    title: Mammogen leva estudo de teste de ARN a unidades móveis de mamografia
    summary: Uma parceria na Florida avaliará uma análise ao sangue juntamente com a mamografia. O estudo planeado ainda não apresentou resultados.
    body:
      - type: p
        text: "Em 27 de outubro, a Mammogen anunciou que a MammoLink levará o estudo KATELYN-ERIN a comunidades da Florida através de unidades móveis de mamografia 3D. A empresa planeia avaliar o genTRU-breast, uma análise sanguínea de ARN livre de células, em cerca de 2 600 mulheres, comparando os resultados com a análise anatomopatológica confirmada por biópsia. A MammoLink refere uma rede de seis unidades móveis. São descrições das empresas sobre um estudo planeado e uma parceria de prestação de serviços, não resultados diagnósticos publicados."
      - type: p
        text: "A Mammogen descreve o genTRU-breast como um teste em desenvolvimento clínico destinado a complementar a imagiologia mamária, sobretudo quando o tecido denso dificulta a interpretação. A página do produto cita números internos anteriores, mas afirma que a validação prospetiva continua. O comunicado não apresenta sensibilidade, especificidade, taxa de falsos positivos, efeito nas decisões de biópsia nem resultados para as doentes do estudo prospetivo. Aproximar o estudo das pessoas não demonstra, por si só, que o teste funciona. A página consultada não publica preço nem licença do código-fonte."
      - type: p
        text: "O [OpenOnco](/pt/capabilities.html) atua noutra etapa: usa dados clínicos e moleculares introduzidos para criar rascunhos de discussão com fontes, através de regras públicas sob licença MIT num sítio gratuito. Não analisa sangue nem mamografias, e muito do conteúdo clínico ainda precisa de revisão. Um teste diagnóstico poderia fornecer dados para discussão posterior; nenhum estudo direto mostra melhores resultados ao combinar estas ferramentas. Este artigo não aconselha rastreio nem tratamento e não substitui um médico. Fontes verificadas em 30 de outubro de 2026."
  de:
    title: Mammogen bringt eine RNA-Teststudie zu mobilen Mammografie-Standorten
    summary: Eine Partnerschaft in Florida untersucht einen Bluttest ergänzend zur Mammografie. Ergebnisse der geplanten Studie liegen noch nicht vor.
    body:
      - type: p
        text: "Am 27. Oktober gab Mammogen bekannt, dass MammoLink die KATELYN-ERIN-Studie über mobile 3D-Mammografie-Standorte in Gemeinden Floridas bringen wird. Das Unternehmen plant, genTRU-breast, einen Bluttest auf zellfreie RNA, bei etwa 2.600 Frauen zu untersuchen und die Testergebnisse mit biopsiebestätigten pathologischen Befunden zu vergleichen. MammoLink berichtet von einem Netz aus sechs mobilen Einheiten. Dies sind Unternehmensangaben zu einer geplanten Studie und einer Versorgungspartnerschaft, keine veröffentlichten Diagnoseergebnisse."
      - type: p
        text: "Mammogen beschreibt genTRU-breast als Test in klinischer Entwicklung, der die Brustbildgebung ergänzen soll, insbesondere wenn dichtes Gewebe die Befundung erschwert. Die Produktseite nennt frühere interne Leistungsdaten, weist aber auf die laufende prospektive Validierung hin. Die Mitteilung enthält keine prospektiven Werte zu Sensitivität, Spezifität, falsch positiven Befunden, Auswirkungen auf Biopsieentscheidungen oder Ergebnissen für Patientinnen. Ein wohnortnaher Studienort beweist noch keine Testleistung. Die geprüfte Seite nennt weder einen öffentlichen Preis noch eine öffentliche Quellcodelizenz."
      - type: p
        text: "[OpenOnco](/de/capabilities.html) setzt an einer anderen Stelle an: Aus eingegebenen klinischen und molekularen Daten erstellt es auf einer kostenlosen Website quellenbelegte Diskussionsentwürfe mit öffentlichen Regeln unter MIT-Lizenz. Es untersucht weder Blut noch Mammografien; viele klinische Inhalte müssen noch geprüft werden. Ein Diagnosetest könnte später Daten für eine klinische Diskussion liefern, doch keine direkte Studie belegt bessere Ergebnisse durch die Kombination. Dieser Artikel ist keine Empfehlung für Screening oder Behandlung und ersetzt keinen Arzt. Quellen geprüft am 30. Oktober 2026."
  fr:
    title: Mammogen étend l'étude d'un test ARN aux unités mobiles de mammographie
    summary: Un partenariat en Floride évaluera une analyse sanguine en complément de la mammographie. L'étude prévue n'a pas encore de résultats.
    body:
      - type: p
        text: "Le 27 octobre, Mammogen a annoncé que MammoLink mènera l'étude KATELYN-ERIN dans des communautés de Floride grâce à des unités mobiles de mammographie 3D. L'entreprise prévoit d'évaluer genTRU-breast, un test sanguin d'ARN acellulaire, chez environ 2 600 femmes, en comparant les résultats à l'analyse anatomopathologique confirmée par biopsie. MammoLink indique disposer de six unités mobiles. Il s'agit des descriptions des entreprises d'une étude prévue et d'un partenariat de terrain, pas de résultats diagnostiques publiés."
      - type: p
        text: "Mammogen présente genTRU-breast comme un test en développement clinique destiné à compléter l'imagerie mammaire, notamment lorsque la densité du tissu complique la lecture. La page produit cite d'anciens chiffres internes, mais précise que la validation prospective se poursuit. Le communiqué ne donne ni sensibilité ni spécificité prospectives, ni taux de faux positifs, ni effet sur les décisions de biopsie ou les résultats des patientes. Rapprocher une étude des personnes ne prouve pas que le test fonctionne. La page consultée ne publie ni prix ni licence de code source."
      - type: p
        text: "[OpenOnco](/fr/capabilities.html) intervient à une autre étape : à partir des données cliniques et moléculaires saisies, il produit sur un site gratuit des ébauches de discussion sourcées grâce à des règles publiques sous licence MIT. Il n'analyse ni sang ni mammographies, et une grande partie du contenu clinique doit encore être révisée. Un test diagnostique pourrait fournir des données pour une discussion ultérieure ; aucune étude directe ne démontre une amélioration des résultats en combinant ces outils. Cet article ne recommande ni dépistage ni traitement et ne remplace pas un médecin. Sources vérifiées le 30 octobre 2026."
  it:
    title: Mammogen porta uno studio su un test RNA nei centri mobili di mammografia
    summary: Una collaborazione in Florida valuterà un esame del sangue accanto alla mammografia. Lo studio previsto non ha ancora risultati.
    body:
      - type: p
        text: "Il 27 ottobre Mammogen ha annunciato che MammoLink porterà lo studio KATELYN-ERIN nelle comunità della Florida tramite unità mobili per la mammografia 3D. L'azienda prevede di valutare genTRU-breast, un esame del sangue per l'RNA libero da cellule, in circa 2.600 donne, confrontando i risultati con l'esame istopatologico confermato da biopsia. MammoLink dichiara una rete di sei unità mobili. Sono descrizioni aziendali di uno studio previsto e di una collaborazione sul territorio, non risultati diagnostici pubblicati."
      - type: p
        text: "Mammogen descrive genTRU-breast come un test in sviluppo clinico pensato per affiancare l'imaging mammario, soprattutto quando il tessuto denso ne rende difficile la lettura. La pagina del prodotto cita dati interni precedenti, ma precisa che la validazione prospettica è ancora in corso. Il comunicato non riporta sensibilità, specificità, tasso di falsi positivi, effetto sulle decisioni di biopsia o esiti delle pazienti nello studio prospettico. Avvicinare uno studio alle persone non dimostra che il test funzioni. La pagina consultata non pubblica prezzo né licenza del codice sorgente."
      - type: p
        text: "[OpenOnco](/it/capabilities.html) opera in una fase diversa: dai dati clinici e molecolari inseriti genera su un sito gratuito bozze di discussione con fonti, usando regole pubbliche con licenza MIT. Non analizza sangue o mammografie e molti contenuti clinici richiedono ancora revisione. Un test diagnostico potrebbe fornire dati per una discussione successiva; nessuno studio diretto dimostra migliori esiti combinando questi strumenti. Questo articolo non consiglia screening o terapie e non sostituisce il medico. Fonti verificate il 30 ottobre 2026."
  da:
    title: Mammogen bringer studie af RNA-test til mobile mammografienheder
    summary: Et samarbejde i Florida skal undersøge en blodprøve ved siden af mammografi. Det planlagte studie har endnu ingen resultater.
    body:
      - type: p
        text: "Den 27. oktober meddelte Mammogen, at MammoLink vil bringe KATELYN-ERIN-studiet til lokalsamfund i Florida via mobile enheder til 3D-mammografi. Virksomheden planlægger at undersøge genTRU-breast, en blodprøve for cellefrit RNA, hos cirka 2.600 kvinder og sammenligne testresultaterne med biopsibekræftede patologiske fund. MammoLink oplyser at have seks mobile enheder. Dette er virksomhedernes beskrivelser af et planlagt studie og et samarbejde om adgang, ikke offentliggjorte diagnostiske resultater."
      - type: p
        text: "Mammogen beskriver genTRU-breast som en test under klinisk udvikling, der skal supplere brystbilleddiagnostik, især når tæt væv gør tolkningen vanskelig. Produktsiden nævner tidligere interne præstationstal, men angiver, at prospektiv validering fortsætter. Meddelelsen giver ingen prospektive tal for sensitivitet, specificitet, falsk positive resultater, effekt på beslutninger om biopsi eller patientudfald. At gøre et studie lettere tilgængeligt viser ikke i sig selv, at testen virker. Den gennemgåede side oplyser hverken offentlig pris eller kildekodelicens."
      - type: p
        text: "[OpenOnco](/da/capabilities.html) bruges på et andet trin: Ud fra indtastede kliniske og molekylære oplysninger laver det kildebelagte udkast til drøftelse på et gratis websted med offentlige regler under MIT-licens. Det analyserer hverken blod eller mammografier, og meget klinisk indhold mangler stadig gennemgang. En diagnostisk test kunne senere levere data til klinisk drøftelse; ingen direkte undersøgelse viser bedre resultater ved at kombinere værktøjerne. Artiklen er ikke råd om screening eller behandling og erstatter ikke en læge. Kilder kontrolleret 30. oktober 2026."
  sv:
    title: Mammogen tar en studie av RNA-test till mobila mammografienheter
    summary: Ett samarbete i Florida ska utvärdera ett blodprov tillsammans med mammografi. Den planerade studien har ännu inga resultat.
    body:
      - type: p
        text: "Den 27 oktober meddelade Mammogen att MammoLink ska ta KATELYN-ERIN-studien till lokalsamhällen i Florida genom mobila enheter för 3D-mammografi. Företaget planerar att utvärdera genTRU-breast, ett blodprov för cellfritt RNA, hos cirka 2 600 kvinnor och jämföra testresultaten med biopsibekräftade patologiska fynd. MammoLink uppger sig ha sex mobila enheter. Detta är företagens beskrivningar av en planerad studie och ett samarbete om tillgång, inte publicerade diagnostiska resultat."
      - type: p
        text: "Mammogen beskriver genTRU-breast som ett test under klinisk utveckling avsett att komplettera bröstavbildning, särskilt när tät vävnad försvårar tolkningen. Produktsidan citerar tidigare interna prestandasiffror men säger att prospektiv validering pågår. Pressmeddelandet ger inga prospektiva uppgifter om sensitivitet, specificitet, falskt positiva svar, effekt på biopsibeslut eller patientutfall. Att föra en studie närmare människor visar inte i sig att testet fungerar. Den granskade sidan anger varken offentligt pris eller källkodslicens."
      - type: p
        text: "[OpenOnco](/sv/capabilities.html) verkar i ett annat steg: utifrån inmatade kliniska och molekylära uppgifter skapar det källhänvisade diskussionsutkast på en gratis webbplats med offentliga regler under MIT-licens. Det analyserar varken blod eller mammografier, och mycket kliniskt innehåll behöver fortfarande granskas. Ett diagnostiskt test skulle senare kunna ge data för klinisk diskussion; ingen direkt studie visar bättre utfall när verktygen kombineras. Artikeln är inte råd om screening eller behandling och ersätter inte en läkare. Källor kontrollerade den 30 oktober 2026."
  nb:
    title: Mammogen tar studie av RNA-test til mobile mammografienheter
    summary: Et samarbeid i Florida skal undersøke en blodprøve sammen med mammografi. Den planlagte studien har ennå ingen resultater.
    body:
      - type: p
        text: "Den 27. oktober kunngjorde Mammogen at MammoLink skal bringe KATELYN-ERIN-studien til lokalsamfunn i Florida gjennom mobile enheter for 3D-mammografi. Selskapet planlegger å undersøke genTRU-breast, en blodprøve for cellefritt RNA, hos rundt 2 600 kvinner og sammenligne testresultatene med biopsibekreftede patologiske funn. MammoLink oppgir å ha seks mobile enheter. Dette er selskapenes beskrivelser av en planlagt studie og et samarbeid om tilgang, ikke publiserte diagnostiske resultater."
      - type: p
        text: "Mammogen beskriver genTRU-breast som en test under klinisk utvikling som skal supplere brystavbildning, særlig når tett vev gjør tolkningen vanskelig. Produktsiden viser til tidligere interne ytelsestall, men sier at prospektiv validering pågår. Meldingen gir ingen prospektive tall for sensitivitet, spesifisitet, falskt positive svar, virkning på beslutninger om biopsi eller pasientutfall. At studien kommer nærmere folk, viser ikke i seg selv at testen virker. Den undersøkte siden oppgir verken offentlig pris eller kildekodelisens."
      - type: p
        text: "[OpenOnco](/nb/capabilities.html) virker på et annet trinn: basert på innlagte kliniske og molekylære opplysninger lager det kildebelagte utkast til diskusjon på et gratis nettsted med offentlige regler under MIT-lisens. Det analyserer verken blod eller mammografier, og mye klinisk innhold trenger fortsatt gjennomgang. En diagnostisk test kan senere gi data til klinisk diskusjon; ingen direkte studie viser bedre resultater når verktøyene kombineres. Artikkelen gir ikke råd om screening eller behandling og erstatter ikke en lege. Kilder kontrollert 30. oktober 2026."
  fi:
    title: Mammogen vie RNA-testitutkimuksen liikkuviin mammografiayksiköihin
    summary: Floridalainen yhteistyö arvioi verikoetta mammografian rinnalla. Suunnitellusta tutkimuksesta ei ole vielä tuloksia.
    body:
      - type: p
        text: "Mammogen ilmoitti 27. lokakuuta, että MammoLink tuo KATELYN-ERIN-tutkimuksen Floridan yhteisöihin liikkuvien 3D-mammografiayksiköiden kautta. Yhtiö aikoo arvioida genTRU-breast-testiä, joka mittaa verestä soluvapaata RNA:ta, noin 2 600 naisella ja verrata tuloksia koepalalla vahvistettuun patologiseen löydökseen. MammoLink kertoo kuuden liikkuvan yksikön verkostosta. Nämä ovat yritysten kuvauksia suunnitellusta tutkimuksesta ja palveluyhteistyöstä, eivät julkaistuja diagnostisia tuloksia."
      - type: p
        text: "Mammogen kuvaa genTRU-breastin kliinisessä kehityksessä olevaksi testiksi, jonka on tarkoitus täydentää rintojen kuvantamista etenkin tiheän kudoksen vaikeuttaessa tulkintaa. Tuotesivu mainitsee aiempia sisäisiä suorituskykylukuja mutta toteaa prospektiivisen validoinnin jatkuvan. Tiedotteessa ei esitetä tulevan tutkimuksen herkkyyttä, spesifisyyttä, väärien positiivisten osuutta, vaikutusta koepalapäätöksiin eikä potilastuloksia. Tutkimuksen tuominen lähemmäs ihmisiä ei vielä osoita testin toimivan. Tarkistetulla sivulla ei ilmoiteta julkista hintaa tai lähdekoodilisenssiä."
      - type: p
        text: "[OpenOnco](/fi/capabilities.html) toimii eri vaiheessa: se laatii syötetyistä kliinisistä ja molekyylitiedoista lähteistettyjä keskusteluluonnoksia maksuttomalla sivustolla julkisilla MIT-lisensoiduilla säännöillä. Se ei analysoi verta eikä mammografiakuvia, ja suuri osa kliinisestä sisällöstä tarvitsee vielä arviointia. Diagnostinen testi voisi myöhemmin tarjota tietoa kliiniseen keskusteluun; suora tutkimus ei osoita työkalujen yhdistämisen parantavan tuloksia. Artikkeli ei ole seulonta- tai hoito-ohje eikä korvaa lääkäriä. Lähteet tarkistettu 30. lokakuuta 2026."
