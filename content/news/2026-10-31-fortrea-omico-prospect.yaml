slug: fortrea-omico-prospect
date: 2026-10-31
published: 2026-10-31
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, precision-oncology, clinical-trials, access]
title:
  en: Fortrea and Omico link genomic screening with oncology trial planning
  uk: Fortrea й Omico поєднують геномний скринінг із плануванням онкологічних досліджень
summary:
  en: An Australian nonprofit's profiling network may help plan biomarker-led trials. The new partnership has not yet reported recruitment or patient outcomes.
  uk: Мережа геномного профілювання австралійської неприбуткової організації може допомогти планувати дослідження за біомаркерами. Результатів залучення чи лікування в новому партнерстві ще немає.
sources:
  - citation: "Fortrea and Omico. Collaboration announcement, 22 October 2026. Checked 31 October 2026."
    id: https://ir.fortrea.com/news-releases/news-release-details/fortrea-and-omico-collaboration-advance-biomarker-led-oncology
  - citation: "Omico. Cancer Screening Program information sheet: referral, profiling and Molecular Oncology Board workflow. Checked 31 October 2026."
    id: https://www.omico.com.au/wp-content/uploads/2024/03/CaSP-General-Information-Sheet_V1.4-CLEAN-1.pdf
  - citation: "Omico. 2025 annual report, PrOSPeCT and CaSP service description. Checked 31 October 2026."
    id: https://www.omico.com.au/wp-content/uploads/2025/10/Omico_Annual-Report_2025_V2.2.pdf
  - citation: "OpenOnco. Current capabilities and clinical-review limits. Checked 31 October 2026."
    id: https://openonco.info/capabilities.html
  - citation: "OpenOnco. Public MIT source licence at the current repository revision. Checked 31 October 2026."
    id: https://github.com/romeo111/OpenOnco/blob/84d5e6b7e6/LICENSE
body:
  en:
    - type: p
      text: "On 22 October, clinical-research company Fortrea and Australian nonprofit Omico announced a collaboration to plan biomarker-led oncology trials and identify possible participants. Omico's PrOSPeCT program offers eligible people in Australia comprehensive tumour genomic profiling and potential trial matching at no cost to the patient. The partners report more than 23,000 consented people in Omico's clinical-genomic databases and referrals from more than 1,600 clinicians. Those figures describe an existing network, not enrolment caused by this partnership."
    - type: p
      text: "Omico's published patient information describes a concrete pathway: a treating oncologist refers the person, existing tumour tissue goes for profiling, and a Molecular Oncology Board reviews results before sending a report with possible trial matches to the clinician. Fortrea plans to use population insights for study planning, site selection and recruitment. The 22 October announcement reports no new trial enrolment, faster recruitment, improved survival or direct comparison with another service. The checked Omico material does not publish a source-code licence for this workflow."
    - type: p
      text: "[OpenOnco](/capabilities.html) offers a free, public website with MIT-licensed rules and cited sources for drafting oncology discussion paths from entered information. It neither sequences tumour tissue nor provides Omico's clinical board and referral network; much of its clinical content still needs review. A genomic report and a source-linked draft may support different steps, but their combined effect has not been tested here. This article is not a trial referral, treatment advice or a substitute for a physician. Sources checked 31 October 2026."
  uk:
    - type: p
      text: "22 жовтня компанія з організації клінічних досліджень Fortrea та австралійська неприбуткова організація Omico оголосили про співпрацю для планування онкологічних досліджень за біомаркерами й пошуку можливих учасників. Програма PrOSPeCT від Omico надає відповідним критеріям людям в Австралії комплексне геномне профілювання пухлини та можливість підбору дослідження без оплати з боку пацієнта. Партнери повідомляють про понад 23 000 людей, які дали згоду на включення до клініко-геномних баз Omico, і направлення від понад 1 600 клініцистів. Це масштаб наявної мережі, а не кількість учасників, залучених завдяки новому партнерству."
    - type: p
      text: "Оприлюднені матеріали Omico описують конкретний маршрут: лікуючий онколог направляє людину, раніше отриману тканину пухлини профілюють, а молекулярний онкологічний консиліум переглядає результати й надсилає лікарю звіт із можливими відповідними дослідженнями. Fortrea планує використовувати відомості про групи пацієнтів для планування досліджень, вибору центрів і набору учасників. Повідомлення від 22 жовтня не містить даних про новий набір, прискорення набору, поліпшення виживаності чи пряме порівняння з іншим сервісом. Перевірені матеріали Omico не публікують ліцензії на код цього процесу."
    - type: p
      text: "[OpenOnco](/ukr/capabilities.html) — безкоштовний публічний сайт із правилами за ліцензією MIT і посиланнями на джерела для створення чернеток онкологічних маршрутів із уведених даних. Він не секвенує тканину пухлини й не має клінічного консиліуму та мережі направлень Omico; значна частина його клінічного вмісту ще потребує рецензування. Геномний звіт і чернетка з джерелами можуть допомагати на різних етапах, але ефект їх поєднання тут не перевірено. Стаття не є направленням на дослідження чи порадою щодо лікування й не замінює лікаря. Джерела перевірено 31 жовтня 2026 року."
translations:
  es:
    title: Fortrea y Omico conectan el perfil genómico con la planificación de ensayos oncológicos
    summary: Una red australiana sin ánimo de lucro podría ayudar a planificar ensayos guiados por biomarcadores. La nueva alianza aún no comunica datos de inclusión ni resultados clínicos.
    body:
      - type: p
        text: "El 22 de octubre, la empresa de investigación clínica Fortrea y la organización australiana sin ánimo de lucro Omico anunciaron una colaboración para planificar ensayos oncológicos guiados por biomarcadores e identificar posibles participantes. El programa PrOSPeCT de Omico ofrece a personas que cumplen los requisitos en Australia un perfil genómico tumoral completo y posibles coincidencias con ensayos, sin coste para el paciente. Los socios indican más de 23.000 personas que han dado su consentimiento en las bases clínico-genómicas de Omico y derivaciones de más de 1.600 profesionales clínicos. Esas cifras describen una red existente, no inclusiones causadas por la nueva alianza."
      - type: p
        text: "La información pública de Omico describe un recorrido concreto: el oncólogo tratante deriva a la persona, se analiza tejido tumoral obtenido previamente y un comité de oncología molecular revisa los resultados antes de enviar al médico un informe con posibles ensayos. Fortrea prevé utilizar información sobre poblaciones para planificar estudios, seleccionar centros y captar participantes. El comunicado del 22 de octubre no presenta nuevas inclusiones, reclutamiento más rápido, mayor supervivencia ni comparación directa con otro servicio. Los materiales de Omico consultados no publican una licencia del código de este proceso."
      - type: p
        text: "[OpenOnco](/es/capabilities.html) ofrece una web pública y gratuita con reglas bajo licencia MIT y fuentes citadas para elaborar borradores de discusión oncológica a partir de datos introducidos. No secuencia tejido tumoral ni dispone del comité clínico y la red de derivación de Omico; gran parte de su contenido clínico aún requiere revisión. Un informe genómico y un borrador con fuentes pueden apoyar fases distintas, pero aquí no se ha estudiado el efecto de combinarlos. Este artículo no es una derivación a un ensayo ni consejo terapéutico y no sustituye al médico. Fuentes verificadas el 31 de octubre de 2026."
  pt:
    title: Fortrea e Omico ligam o perfil genómico ao planeamento de ensaios oncológicos
    summary: Uma rede australiana sem fins lucrativos poderá apoiar ensaios orientados por biomarcadores. A nova parceria ainda não comunicou recrutamento nem resultados clínicos.
    body:
      - type: p
        text: "Em 22 de outubro, a empresa de investigação clínica Fortrea e a organização australiana sem fins lucrativos Omico anunciaram uma colaboração para planear ensaios oncológicos orientados por biomarcadores e identificar possíveis participantes. O programa PrOSPeCT da Omico oferece a pessoas elegíveis na Austrália perfil genómico tumoral abrangente e possíveis correspondências com ensaios, sem custo para o doente. Os parceiros referem mais de 23 000 pessoas que deram consentimento nas bases clínico-genómicas da Omico e encaminhamentos de mais de 1 600 profissionais clínicos. Estes números descrevem uma rede já existente, não inscrições causadas pela nova parceria."
      - type: p
        text: "A informação pública da Omico descreve um percurso concreto: o oncologista assistente encaminha a pessoa, tecido tumoral já recolhido é analisado e um conselho de oncologia molecular revê os resultados antes de enviar ao médico um relatório com possíveis ensaios. A Fortrea pretende usar informação sobre grupos de doentes para planear estudos, selecionar centros e recrutar participantes. O comunicado de 22 de outubro não apresenta novas inscrições, recrutamento mais rápido, maior sobrevivência nem comparação direta com outro serviço. Os materiais consultados da Omico não publicam licença para o código deste processo."
      - type: p
        text: "O [OpenOnco](/pt/capabilities.html) oferece um sítio público e gratuito com regras sob licença MIT e fontes citadas para elaborar rascunhos de discussão oncológica a partir de dados introduzidos. Não sequencia tecido tumoral nem dispõe do conselho clínico e da rede de encaminhamento da Omico; muito do seu conteúdo clínico ainda precisa de revisão. Um relatório genómico e um rascunho com fontes podem ajudar em etapas diferentes, mas o efeito da sua combinação não foi estudado aqui. Este artigo não é um encaminhamento para ensaio nem conselho terapêutico e não substitui um médico. Fontes verificadas em 31 de outubro de 2026."
  de:
    title: Fortrea und Omico verbinden Genomprofilierung mit der Planung von Krebsstudien
    summary: Ein australisches gemeinnütziges Netzwerk könnte biomarkerbasierte Studien unterstützen. Für die neue Partnerschaft liegen noch keine Rekrutierungs- oder Behandlungsergebnisse vor.
    body:
      - type: p
        text: "Am 22. Oktober kündigten das klinische Forschungsunternehmen Fortrea und die australische gemeinnützige Organisation Omico eine Zusammenarbeit zur Planung biomarkerbasierter Krebsstudien und zur Suche nach möglichen Teilnehmenden an. Omicos PrOSPeCT-Programm bietet berechtigten Menschen in Australien umfassende genomische Tumorprofilierung und mögliche Studienzuordnung ohne Kosten für die Patientinnen und Patienten. Die Partner nennen mehr als 23.000 Personen mit Einwilligung in Omicos klinisch-genomischen Datenbanken und Überweisungen von mehr als 1.600 klinisch Tätigen. Diese Zahlen beschreiben ein bestehendes Netzwerk, keine durch die neue Partnerschaft bewirkte Studienteilnahme."
      - type: p
        text: "Omicos öffentliche Patienteninformation beschreibt einen konkreten Ablauf: Die behandelnde Onkologin oder der behandelnde Onkologe überweist die Person, zuvor entnommenes Tumorgewebe wird profiliert, und ein molekulares Onkologieboard prüft die Ergebnisse, bevor es einen Bericht mit möglichen passenden Studien an die Praxis sendet. Fortrea will Populationsdaten für Studienplanung, Standortauswahl und Rekrutierung nutzen. Die Mitteilung vom 22. Oktober nennt weder neue Studieneinschlüsse noch schnellere Rekrutierung, längeres Überleben oder einen direkten Vergleich mit einem anderen Dienst. Die geprüften Omico-Unterlagen veröffentlichen keine Quellcodelizenz für diesen Ablauf."
      - type: p
        text: "[OpenOnco](/de/capabilities.html) bietet eine kostenlose öffentliche Website mit MIT-lizenzierten Regeln und zitierten Quellen, um aus eingegebenen Informationen Entwürfe für onkologische Diskussionen zu erstellen. Es sequenziert kein Tumorgewebe und besitzt weder Omicos klinisches Board noch dessen Überweisungsnetz; viele klinische Inhalte müssen noch geprüft werden. Ein Genombericht und ein quellenbelegter Entwurf können unterschiedliche Schritte unterstützen, doch die Wirkung ihrer Kombination wurde hier nicht untersucht. Dieser Artikel ist weder Studienüberweisung noch Therapieempfehlung und ersetzt keinen Arzt. Quellen geprüft am 31. Oktober 2026."
  fr:
    title: Fortrea et Omico relient le profilage génomique à la planification d'essais en oncologie
    summary: Un réseau australien à but non lucratif pourrait aider à planifier des essais fondés sur les biomarqueurs. Le nouveau partenariat ne présente encore ni recrutement ni résultats cliniques.
    body:
      - type: p
        text: "Le 22 octobre, l'entreprise de recherche clinique Fortrea et l'organisation australienne à but non lucratif Omico ont annoncé une collaboration pour planifier des essais oncologiques fondés sur les biomarqueurs et repérer de possibles participants. Le programme PrOSPeCT d'Omico propose aux personnes admissibles en Australie un profilage génomique tumoral complet et une recherche de correspondances avec des essais, sans frais pour le patient. Les partenaires évoquent plus de 23 000 personnes consentantes dans les bases clinico-génomiques d'Omico et des orientations provenant de plus de 1 600 professionnels de santé. Ces chiffres décrivent un réseau existant, pas des inclusions dues au nouveau partenariat."
      - type: p
        text: "La documentation publique d'Omico décrit un parcours concret : l'oncologue traitant oriente la personne, un tissu tumoral déjà prélevé est profilé, puis un comité d'oncologie moléculaire examine les résultats et transmet au médecin un rapport indiquant d'éventuels essais correspondants. Fortrea prévoit d'utiliser les données sur les populations pour planifier les études, choisir les centres et recruter. Le communiqué du 22 octobre ne rapporte ni nouvelles inclusions, ni recrutement accéléré, ni survie améliorée, ni comparaison directe avec un autre service. Les documents Omico consultés ne publient pas de licence du code de ce processus."
      - type: p
        text: "[OpenOnco](/fr/capabilities.html) propose un site public et gratuit, des règles sous licence MIT et des sources citées pour rédiger des ébauches de discussion oncologique à partir de données saisies. Il ne séquence pas les tissus tumoraux et ne dispose ni du comité clinique ni du réseau d'orientation d'Omico ; une grande partie de son contenu clinique doit encore être révisée. Un rapport génomique et une ébauche sourcée peuvent aider à différentes étapes, mais leur effet combiné n'a pas été étudié ici. Cet article n'est ni une orientation vers un essai ni un conseil thérapeutique et ne remplace pas un médecin. Sources vérifiées le 31 octobre 2026."
  it:
    title: Fortrea e Omico collegano il profilo genomico alla pianificazione di studi oncologici
    summary: Una rete australiana senza scopo di lucro potrebbe aiutare a pianificare studi basati sui biomarcatori. La nuova collaborazione non riporta ancora arruolamenti o esiti clinici.
    body:
      - type: p
        text: "Il 22 ottobre l'azienda di ricerca clinica Fortrea e l'organizzazione australiana senza scopo di lucro Omico hanno annunciato una collaborazione per pianificare studi oncologici guidati da biomarcatori e individuare possibili partecipanti. Il programma PrOSPeCT di Omico offre alle persone idonee in Australia un profilo genomico tumorale completo e possibili corrispondenze con studi clinici, senza costi per il paziente. I partner riferiscono oltre 23.000 persone che hanno dato il consenso nelle banche dati clinico-genomiche di Omico e invii da più di 1.600 professionisti clinici. Sono cifre della rete esistente, non arruolamenti prodotti dalla nuova collaborazione."
      - type: p
        text: "Le informazioni pubbliche di Omico descrivono un percorso concreto: l'oncologo curante invia la persona, il tessuto tumorale già raccolto viene profilato e un comitato di oncologia molecolare esamina i risultati prima di trasmettere al medico un rapporto con possibili studi pertinenti. Fortrea intende usare informazioni sui gruppi di pazienti per pianificare studi, scegliere i centri e reclutare partecipanti. Il comunicato del 22 ottobre non riporta nuovi arruolamenti, reclutamento più rapido, maggiore sopravvivenza o confronti diretti con altri servizi. I materiali Omico consultati non pubblicano una licenza del codice sorgente per questo processo."
      - type: p
        text: "[OpenOnco](/it/capabilities.html) offre un sito pubblico gratuito con regole sotto licenza MIT e fonti citate per creare bozze di discussione oncologica dai dati inseriti. Non sequenzia tessuto tumorale e non dispone del comitato clinico né della rete di invio di Omico; molti contenuti clinici richiedono ancora revisione. Un rapporto genomico e una bozza con fonti possono sostenere fasi diverse, ma il loro effetto combinato non è stato studiato qui. Questo articolo non è un invio a uno studio né un consiglio terapeutico e non sostituisce il medico. Fonti verificate il 31 ottobre 2026."
  da:
    title: Fortrea og Omico forbinder genomprofilering med planlægning af kræftforsøg
    summary: Et australsk nonprofitnetværk kan støtte biomarkørstyrede forsøg. Det nye samarbejde har endnu ikke oplyst rekruttering eller patientresultater.
    body:
      - type: p
        text: "Den 22. oktober annoncerede klinikforskningsvirksomheden Fortrea og den australske nonprofitorganisation Omico et samarbejde om at planlægge biomarkørstyrede kræftforsøg og finde mulige deltagere. Omicos PrOSPeCT-program tilbyder berettigede personer i Australien omfattende genomprofilering af tumorer og mulig matchning til forsøg uden betaling fra patienten. Partnerne oplyser, at over 23.000 personer har givet samtykke til Omicos klinisk-genomiske databaser, og at over 1.600 klinikere har henvist patienter. Tallene beskriver et eksisterende netværk, ikke deltagelse skabt af det nye samarbejde."
      - type: p
        text: "Omicos offentlige patientinformation beskriver et konkret forløb: Den behandlende onkolog henviser personen, tidligere udtaget tumorvæv profileres, og et molekylært onkologisk panel gennemgår resultaterne, før lægen får en rapport med mulige forsøgs-match. Fortrea vil bruge oplysninger om patientgrupper til studieplanlægning, valg af centre og rekruttering. Meddelelsen af 22. oktober angiver hverken nye forsøgsdeltagere, hurtigere rekruttering, bedre overlevelse eller direkte sammenligning med andre tjenester. De gennemgåede Omico-materialer offentliggør ikke en kildekodelicens for dette forløb."
      - type: p
        text: "[OpenOnco](/da/capabilities.html) tilbyder et gratis offentligt websted med MIT-licenserede regler og citerede kilder til at lave udkast til onkologisk drøftelse ud fra indtastede oplysninger. Det sekventerer ikke tumorvæv og har hverken Omicos kliniske panel eller henvisningsnetværk; meget klinisk indhold mangler stadig gennemgang. En genomrapport og et kildebelagt udkast kan støtte forskellige trin, men virkningen af at kombinere dem er ikke undersøgt her. Artiklen er hverken henvisning til et forsøg eller behandlingsråd og erstatter ikke en læge. Kilder kontrolleret 31. oktober 2026."
  sv:
    title: Fortrea och Omico kopplar genomprofilering till planering av cancerstudier
    summary: Ett australiskt ideellt nätverk kan stödja biomarkörstyrda studier. Det nya samarbetet har ännu inga rapporterade rekryterings- eller patientresultat.
    body:
      - type: p
        text: "Den 22 oktober meddelade kliniska forskningsföretaget Fortrea och den australiska ideella organisationen Omico ett samarbete för att planera biomarkörstyrda cancerstudier och hitta möjliga deltagare. Omicos PrOSPeCT-program erbjuder behöriga personer i Australien omfattande genomprofilering av tumörer och möjliga matchningar till studier utan kostnad för patienten. Partnerna uppger att fler än 23 000 personer har samtyckt till Omicos klinisk-genomiska databaser och att fler än 1 600 kliniker har remitterat patienter. Siffrorna beskriver ett befintligt nätverk, inte deltagande som skapats av det nya samarbetet."
      - type: p
        text: "Omicos offentliga patientinformation beskriver ett konkret flöde: Behandlande onkolog remitterar personen, tidigare insamlad tumörvävnad profileras och en molekylär onkologisk expertgrupp granskar resultaten innan läkaren får en rapport med möjliga studiematchningar. Fortrea planerar att använda information om patientgrupper för studieplanering, val av centra och rekrytering. Meddelandet från den 22 oktober redovisar varken nya studiedeltagare, snabbare rekrytering, förbättrad överlevnad eller direkt jämförelse med andra tjänster. De granskade Omico-dokumenten publicerar ingen källkodslicens för detta arbetsflöde."
      - type: p
        text: "[OpenOnco](/sv/capabilities.html) erbjuder en gratis offentlig webbplats med MIT-licensierade regler och citerade källor för att skapa utkast till onkologisk diskussion från inmatad information. Det sekvenserar inte tumörvävnad och har varken Omicos kliniska expertgrupp eller remissnätverk; mycket kliniskt innehåll behöver fortfarande granskas. En genomrapport och ett källhänvisat utkast kan stödja olika steg, men effekten av att kombinera dem har inte studerats här. Artikeln är varken en remiss till en studie eller behandlingsråd och ersätter inte en läkare. Källor kontrollerade den 31 oktober 2026."
  nb:
    title: Fortrea og Omico kobler genomprofilering til planlegging av kreftstudier
    summary: Et australsk ideelt nettverk kan støtte biomarkørstyrte studier. Det nye samarbeidet har ennå ingen rapporterte rekrutterings- eller pasientresultater.
    body:
      - type: p
        text: "Den 22. oktober kunngjorde forskningsselskapet Fortrea og den australske ideelle organisasjonen Omico et samarbeid for å planlegge biomarkørstyrte kreftstudier og finne mulige deltakere. Omicos PrOSPeCT-program tilbyr kvalifiserte personer i Australia omfattende genomprofilering av svulster og mulige treff i studier uten kostnad for pasienten. Partnerne oppgir at mer enn 23 000 personer har samtykket til Omicos klinisk-genomiske databaser, og at mer enn 1 600 klinikere har henvist pasienter. Tallene beskriver et eksisterende nettverk, ikke deltakelse skapt av det nye samarbeidet."
      - type: p
        text: "Omicos offentlige pasientinformasjon beskriver et konkret forløp: Behandlende onkolog henviser personen, tidligere innsamlet svulstvev profileres, og et molekylært onkologisk fagpanel vurderer resultatene før legen får en rapport med mulige studietreff. Fortrea planlegger å bruke informasjon om pasientgrupper til studieplanlegging, valg av sentre og rekruttering. Meldingen fra 22. oktober rapporterer verken nye studiedeltakere, raskere rekruttering, bedre overlevelse eller direkte sammenligning med andre tjenester. De gjennomgåtte Omico-dokumentene publiserer ingen kildekodelisens for denne prosessen."
      - type: p
        text: "[OpenOnco](/nb/capabilities.html) tilbyr et gratis offentlig nettsted med MIT-lisensierte regler og siterte kilder for å lage utkast til onkologisk diskusjon fra innlagte opplysninger. Det sekvenserer ikke svulstvev og har verken Omicos kliniske fagpanel eller henvisningsnettverk; mye klinisk innhold trenger fortsatt gjennomgang. En genomrapport og et kildebelagt utkast kan støtte ulike trinn, men virkningen av å kombinere dem er ikke undersøkt her. Artikkelen er verken henvisning til en studie eller behandlingsråd og erstatter ikke en lege. Kilder kontrollert 31. oktober 2026."
  fi:
    title: Fortrea ja Omico yhdistävät genomiprofiloinnin syöpätutkimusten suunnitteluun
    summary: Australialainen voittoa tavoittelematon verkosto voi tukea biomarkkereihin perustuvia tutkimuksia. Uusi yhteistyö ei vielä raportoi rekrytoinnista tai potilastuloksista.
    body:
      - type: p
        text: "Kliinisen tutkimuksen yritys Fortrea ja australialainen voittoa tavoittelematon Omico ilmoittivat 22. lokakuuta yhteistyöstä biomarkkereihin perustuvien syöpätutkimusten suunnittelussa ja mahdollisten osallistujien löytämisessä. Omicon PrOSPeCT-ohjelma tarjoaa ehdot täyttäville ihmisille Australiassa kattavan kasvaimen genomiprofiloinnin ja mahdollisia tutkimusosumia potilaalle maksutta. Kumppanien mukaan yli 23 000 henkilöä on antanut suostumuksensa Omicon kliinis-genomisiin tietokantoihin ja yli 1 600 kliinikkoa on tehnyt lähetteitä. Luvut kuvaavat olemassa olevaa verkostoa, eivät uuden yhteistyön tuottamaa tutkimusosallistumista."
      - type: p
        text: "Omicon julkinen potilasohje kuvaa konkreettisen prosessin: Hoitava onkologi lähettää potilaan, aiemmin otettu kasvainkudos profiloidaan, ja molekyylionkologinen asiantuntijaryhmä arvioi tulokset ennen kuin lääkäri saa raportin mahdollisista tutkimusosumista. Fortrea aikoo käyttää potilasryhmätietoja tutkimusten suunnitteluun, tutkimuskeskusten valintaan ja rekrytointiin. Lokakuun 22. päivän tiedote ei kerro uusista osallistujista, nopeammasta rekrytoinnista, paremmasta eloonjäämisestä eikä suorasta vertailusta muihin palveluihin. Tarkistetut Omicon aineistot eivät julkaise tämän prosessin lähdekoodilisenssiä."
      - type: p
        text: "[OpenOnco](/fi/capabilities.html) tarjoaa maksuttoman julkisen sivuston, jolla MIT-lisensoidut säännöt ja viitatut lähteet auttavat laatimaan syöpää koskevia keskusteluluonnoksia syötetyistä tiedoista. Se ei sekvensoi kasvainkudosta eikä tarjoa Omicon kliinistä asiantuntijaryhmää tai läheteverkostoa; suuri osa sen kliinisestä sisällöstä odottaa yhä arviointia. Genomiraportti ja lähteistetty luonnos voivat tukea eri vaiheita, mutta niiden yhdistämisen vaikutusta ei ole tässä tutkittu. Artikkeli ei ole tutkimuslähete eikä hoito-ohje eikä korvaa lääkäriä. Lähteet tarkistettu 31. lokakuuta 2026."
