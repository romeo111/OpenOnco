slug: pillar-mrdtect-aml
date: 2026-11-01
published: 2026-11-01
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, leukemia, diagnostics, molecular-monitoring]
title:
  en: Pillar launches an AML research panel for two residual-disease markers
  uk: Pillar випускає дослідницьку панель для двох маркерів залишкової хвороби при ГМЛ
summary:
  en: MRDTect combines NPM1 and FLT3-ITD analysis in one laboratory workflow. Its stated analytical performance is not evidence of clinical benefit.
  uk: MRDTect поєднує аналіз NPM1 і FLT3-ITD в одному лабораторному процесі. Заявлені аналітичні характеристики не доводять клінічної користі.
sources:
  - citation: "Pillar Biosciences. MRDTect NPM1 and FLT3 ITD Panel launch, 22 October 2026. Checked 1 November 2026."
    id: https://www.pillarbiosci.com/pillar-biosciences-launches-kitted-ngs-panel-to-support-measurable-residual-disease-mrd-detection-in-acute-myeloid-leukemia-aml.htm
  - citation: "Pillar Biosciences. MRDTect NPM1 and FLT3 ITD product specifications and research-use-only status. Checked 1 November 2026."
    id: https://www.pillarbiosci.com/products/mrdtect-npm1-and-flt3-itd-panel
  - citation: "OpenOnco. Current capabilities and clinical-review limits. Checked 1 November 2026."
    id: https://openonco.info/capabilities.html
  - citation: "OpenOnco. Public MIT source licence at the current repository revision. Checked 1 November 2026."
    id: https://github.com/romeo111/OpenOnco/blob/8fdb79df56/LICENSE
body:
  en:
    - type: p
      text: "On 22 October, Pillar Biosciences launched MRDTect NPM1 and FLT3 ITD, a next-generation sequencing kit for research on measurable residual disease in acute myeloid leukemia (AML). It combines detection of NPM1 mutations and FLT3 internal tandem duplications from one DNA input in a laboratory's own sequencing workflow. Both the launch and the product page explicitly say research use only, not for diagnostic procedures."
    - type: p
      text: "Pillar reports detection at 0.005% variant allele frequency and testing of more than 200 libraries across its own and four partner laboratories. The product page says detection depends on DNA input and sequencing depth; its displayed mapping metrics come from internal reference-material tests. These are company-reported analytical findings, not a published comparison showing fewer relapses, longer survival or better treatment decisions. The checked pages list kit components but no public price or source-code licence for the analysis software."
    - type: p
      text: "[OpenOnco](/capabilities.html) works at another step: its free website uses entered information, public MIT-licensed rules and cited sources to draft oncology discussion paths. It does not analyze blood or marrow, and much clinical content still awaits review. A research assay could generate data for later discussion, but the tools have not been directly compared for patient outcomes. This article is not a recommendation to use an assay or choose treatment and does not replace a physician. Sources checked 1 November 2026."
  uk:
    - type: p
      text: "22 жовтня Pillar Biosciences випустила MRDTect NPM1 and FLT3 ITD — набір для секвенування нового покоління з метою дослідження вимірюваної залишкової хвороби при гострому мієлоїдному лейкозі (ГМЛ). Він поєднує виявлення мутацій NPM1 і внутрішніх тандемних дуплікацій FLT3 в одному лабораторному процесі з однієї проби ДНК. І повідомлення, і сторінка продукту прямо зазначають: лише для досліджень, не для діагностичних процедур."
    - type: p
      text: "Pillar повідомляє про виявлення варіантів за частки алеля 0,005% та перевірку понад 200 бібліотек у власній і чотирьох партнерських лабораторіях. Сторінка продукту уточнює, що виявлення залежить від кількості ДНК та глибини секвенування, а наведені показники вирівнювання походять із внутрішніх тестів на референтних матеріалах. Це заявлені компанією аналітичні дані, а не опубліковане порівняння, яке доводить менше рецидивів, довше життя чи кращі рішення щодо лікування. Перевірені сторінки перелічують склад набору, але не подають публічної ціни чи ліцензії на код аналітичного ПЗ."
    - type: p
      text: "[OpenOnco](/ukr/capabilities.html) працює на іншому етапі: безкоштовний сайт використовує введені дані, публічні правила за ліцензією MIT і джерела для створення чернеток онкологічних маршрутів. Він не аналізує кров чи кістковий мозок, а значна частина клінічного вмісту ще очікує рецензування. Дослідницький аналіз може дати дані для подальшого обговорення, але прямого порівняння впливу цих інструментів на результати пацієнтів немає. Стаття не рекомендує аналіз чи лікування й не замінює лікаря. Джерела перевірено 1 листопада 2026 року."
translations:
  es:
    title: Pillar lanza un panel de investigación sobre dos marcadores de enfermedad residual en LMA
    summary: MRDTect reúne el análisis de NPM1 y FLT3-ITD en un proceso de laboratorio. Su rendimiento analítico declarado no demuestra beneficio clínico.
    body:
      - type: p
        text: "El 22 de octubre, Pillar Biosciences lanzó MRDTect NPM1 and FLT3 ITD, un kit de secuenciación de nueva generación para investigar la enfermedad residual medible en la leucemia mieloide aguda (LMA). Reúne la detección de mutaciones NPM1 y duplicaciones internas en tándem de FLT3 a partir de una sola muestra de ADN en el propio laboratorio. Tanto el comunicado como la página del producto indican expresamente que es solo para investigación y no para procedimientos diagnósticos."
      - type: p
        text: "Pillar comunica detección con una frecuencia alélica de variante del 0,005% y pruebas de más de 200 bibliotecas en sus laboratorios y en cuatro laboratorios asociados. La página del producto precisa que la detección depende de la cantidad de ADN y de la profundidad de secuenciación; las métricas de alineamiento publicadas proceden de pruebas internas con materiales de referencia. Son hallazgos analíticos comunicados por la empresa, no una comparación publicada que demuestre menos recaídas, mayor supervivencia o mejores decisiones terapéuticas. Las páginas consultadas enumeran componentes del kit, pero no un precio público ni licencia del código del programa de análisis."
      - type: p
        text: "[OpenOnco](/es/capabilities.html) interviene en otra fase: su web gratuita utiliza datos introducidos, reglas públicas bajo licencia MIT y fuentes citadas para elaborar borradores de discusión oncológica. No analiza sangre ni médula ósea, y gran parte de su contenido clínico sigue pendiente de revisión. Un ensayo de investigación podría aportar datos para una discusión posterior, pero no existe una comparación directa de los efectos de estas herramientas sobre los resultados de los pacientes. Este artículo no recomienda una prueba ni un tratamiento y no sustituye al médico. Fuentes verificadas el 1 de noviembre de 2026."
  pt:
    title: Pillar lança painel de investigação de dois marcadores de doença residual na LMA
    summary: O MRDTect reúne a análise de NPM1 e FLT3-ITD num processo laboratorial. O desempenho analítico declarado não demonstra benefício clínico.
    body:
      - type: p
        text: "Em 22 de outubro, a Pillar Biosciences lançou o MRDTect NPM1 and FLT3 ITD, um kit de sequenciação de nova geração para investigar doença residual mensurável na leucemia mieloide aguda (LMA). Reúne a deteção de mutações NPM1 e duplicações internas em tandem de FLT3 a partir de uma única amostra de ADN no próprio laboratório. Tanto o comunicado como a página do produto dizem explicitamente que se destina apenas a investigação, não a procedimentos de diagnóstico."
      - type: p
        text: "A Pillar refere deteção com frequência alélica da variante de 0,005% e testes de mais de 200 bibliotecas no seu laboratório e em quatro laboratórios parceiros. A página do produto esclarece que a deteção depende da quantidade de ADN e da profundidade de sequenciação; as métricas de alinhamento apresentadas vêm de testes internos com materiais de referência. São resultados analíticos comunicados pela empresa, não uma comparação publicada que demonstre menos recaídas, maior sobrevivência ou melhores decisões terapêuticas. As páginas consultadas listam os componentes do kit, mas não um preço público nem a licença do código do software de análise."
      - type: p
        text: "O [OpenOnco](/pt/capabilities.html) atua noutra etapa: o sítio gratuito usa dados introduzidos, regras públicas sob licença MIT e fontes citadas para criar rascunhos de discussão oncológica. Não analisa sangue nem medula óssea, e muito do seu conteúdo clínico continua a aguardar revisão. Um ensaio de investigação poderia fornecer dados para discussão posterior, mas não existe comparação direta dos efeitos destas ferramentas nos resultados dos doentes. Este artigo não recomenda uma análise nem um tratamento e não substitui um médico. Fontes verificadas em 1 de novembro de 2026."
  de:
    title: Pillar bringt ein Forschungs-Panel für zwei Restkrankheitsmarker bei AML heraus
    summary: MRDTect vereint die Analyse von NPM1 und FLT3-ITD in einem Laborablauf. Die angegebene analytische Leistung belegt keinen klinischen Nutzen.
    body:
      - type: p
        text: "Am 22. Oktober brachte Pillar Biosciences MRDTect NPM1 and FLT3 ITD auf den Markt, ein Kit zur Sequenzierung der nächsten Generation für die Forschung zur messbaren Resterkrankung bei akuter myeloischer Leukämie (AML). Es vereint den Nachweis von NPM1-Mutationen und internen Tandemduplikationen von FLT3 aus einer DNA-Probe im eigenen Laborablauf. Sowohl die Mitteilung als auch die Produktseite stellen ausdrücklich klar: nur für Forschungszwecke, nicht für diagnostische Verfahren."
      - type: p
        text: "Pillar berichtet über den Nachweis bei einer Variantenallelfrequenz von 0,005 % und Tests mit mehr als 200 Bibliotheken im eigenen und in vier Partnerlaboren. Laut Produktseite hängt der Nachweis von DNA-Menge und Sequenziertiefe ab; die angezeigten Mapping-Werte stammen aus internen Tests mit Referenzmaterial. Das sind vom Unternehmen berichtete analytische Befunde, kein veröffentlichter Vergleich, der weniger Rückfälle, längeres Überleben oder bessere Therapieentscheidungen zeigt. Die geprüften Seiten nennen Kitbestandteile, aber weder einen öffentlichen Preis noch eine Quellcodelizenz für die Analysesoftware."
      - type: p
        text: "[OpenOnco](/de/capabilities.html) setzt an einer anderen Stelle an: Die kostenlose Website erstellt aus eingegebenen Daten, öffentlichen MIT-lizenzierten Regeln und zitierten Quellen Entwürfe für onkologische Diskussionen. Sie analysiert weder Blut noch Knochenmark; viele klinische Inhalte warten noch auf Prüfung. Ein Forschungstest könnte Daten für eine spätere Diskussion liefern, doch es gibt keinen direkten Vergleich der Auswirkungen dieser Werkzeuge auf Patientenergebnisse. Der Artikel empfiehlt weder Test noch Behandlung und ersetzt keinen Arzt. Quellen geprüft am 1. November 2026."
  fr:
    title: Pillar lance un panel de recherche pour deux marqueurs de maladie résiduelle dans la LAM
    summary: MRDTect réunit l'analyse de NPM1 et FLT3-ITD dans un même processus de laboratoire. Les performances analytiques annoncées ne prouvent aucun bénéfice clinique.
    body:
      - type: p
        text: "Le 22 octobre, Pillar Biosciences a lancé MRDTect NPM1 and FLT3 ITD, un kit de séquençage de nouvelle génération destiné à la recherche sur la maladie résiduelle mesurable dans la leucémie aiguë myéloïde (LAM). Il réunit la détection des mutations NPM1 et des duplications internes en tandem de FLT3 à partir d'un seul échantillon d'ADN dans le laboratoire utilisateur. Le communiqué et la page produit précisent explicitement : usage réservé à la recherche, pas aux procédures diagnostiques."
      - type: p
        text: "Pillar annonce une détection à une fréquence allélique de variant de 0,005 % et des essais sur plus de 200 bibliothèques dans son laboratoire et quatre laboratoires partenaires. La page produit précise que la détection dépend de la quantité d'ADN et de la profondeur de séquençage ; les mesures d'alignement affichées proviennent de tests internes sur des matériaux de référence. Il s'agit de résultats analytiques communiqués par l'entreprise, pas d'une comparaison publiée montrant moins de rechutes, une survie prolongée ou de meilleures décisions thérapeutiques. Les pages consultées indiquent les composants du kit, mais ni prix public ni licence du code du logiciel d'analyse."
      - type: p
        text: "[OpenOnco](/fr/capabilities.html) intervient à une autre étape : son site gratuit utilise les données saisies, des règles publiques sous licence MIT et des sources citées pour rédiger des ébauches de discussion oncologique. Il n'analyse ni le sang ni la moelle osseuse, et une grande partie de son contenu clinique attend encore une révision. Un test de recherche pourrait apporter des données à discuter ensuite, mais aucune comparaison directe n'évalue l'effet de ces outils sur les résultats des patients. Cet article ne recommande ni test ni traitement et ne remplace pas un médecin. Sources vérifiées le 1er novembre 2026."
  it:
    title: Pillar lancia un pannello di ricerca per due marcatori di malattia residua nella LMA
    summary: MRDTect unisce l'analisi di NPM1 e FLT3-ITD in un unico processo di laboratorio. Le prestazioni analitiche dichiarate non provano un beneficio clinico.
    body:
      - type: p
        text: "Il 22 ottobre Pillar Biosciences ha lanciato MRDTect NPM1 and FLT3 ITD, un kit di sequenziamento di nuova generazione per la ricerca sulla malattia residua misurabile nella leucemia mieloide acuta (LMA). Riunisce il rilevamento delle mutazioni NPM1 e delle duplicazioni interne in tandem di FLT3 da un solo campione di DNA nel laboratorio utilizzatore. Il comunicato e la pagina del prodotto precisano esplicitamente: solo per ricerca, non per procedure diagnostiche."
      - type: p
        text: "Pillar riferisce un rilevamento a una frequenza allelica della variante dello 0,005% e prove su oltre 200 librerie nel proprio laboratorio e in quattro laboratori partner. La pagina del prodotto chiarisce che il rilevamento dipende dalla quantità di DNA e dalla profondità del sequenziamento; le metriche di allineamento mostrate derivano da test interni su materiali di riferimento. Sono risultati analitici comunicati dall'azienda, non un confronto pubblicato che dimostri meno recidive, maggiore sopravvivenza o migliori decisioni terapeutiche. Le pagine consultate elencano i componenti del kit, ma non un prezzo pubblico né una licenza del codice del software di analisi."
      - type: p
        text: "[OpenOnco](/it/capabilities.html) opera in una fase diversa: il sito gratuito usa dati inseriti, regole pubbliche con licenza MIT e fonti citate per preparare bozze di discussione oncologica. Non analizza sangue né midollo osseo e molti contenuti clinici attendono ancora revisione. Un test di ricerca potrebbe fornire dati per una discussione successiva, ma non esiste un confronto diretto degli effetti di questi strumenti sugli esiti dei pazienti. Questo articolo non consiglia test o trattamenti e non sostituisce il medico. Fonti verificate il 1° novembre 2026."
  da:
    title: Pillar lancerer forskningspanel for to restsygdomsmarkører ved AML
    summary: MRDTect samler analyse af NPM1 og FLT3-ITD i én laboratorieproces. Den oplyste analytiske ydeevne er ikke bevis for klinisk gevinst.
    body:
      - type: p
        text: "Den 22. oktober lancerede Pillar Biosciences MRDTect NPM1 and FLT3 ITD, et kit til næste generations sekventering til forskning i målbar restsygdom ved akut myeloid leukæmi (AML). Det kombinerer påvisning af NPM1-mutationer og interne tandemduplikationer i FLT3 fra én DNA-prøve i laboratoriets egen sekventeringsproces. Både meddelelsen og produktsiden siger udtrykkeligt: kun til forskning, ikke til diagnostiske procedurer."
      - type: p
        text: "Pillar oplyser påvisning ved en variantallelfrekvens på 0,005 % og test af over 200 biblioteker i eget laboratorium og fire partnerlaboratorier. Ifølge produktsiden afhænger påvisningen af DNA-mængde og sekventeringsdybde; de viste mappingtal kommer fra interne tests med referencematerialer. Det er virksomhedens analytiske resultater, ikke en offentliggjort sammenligning, der viser færre tilbagefald, længere overlevelse eller bedre behandlingsbeslutninger. De gennemgåede sider angiver kittets dele, men hverken offentlig pris eller kildekodelicens for analysesoftwaren."
      - type: p
        text: "[OpenOnco](/da/capabilities.html) bruges på et andet trin: Det gratis websted anvender indtastede oplysninger, offentlige MIT-licenserede regler og citerede kilder til at lave udkast til onkologisk drøftelse. Det analyserer hverken blod eller knoglemarv, og meget klinisk indhold mangler stadig gennemgang. En forskningstest kunne give data til senere drøftelse, men værktøjernes effekt på patientresultater er ikke sammenlignet direkte. Artiklen anbefaler hverken test eller behandling og erstatter ikke en læge. Kilder kontrolleret 1. november 2026."
  sv:
    title: Pillar lanserar forskningspanel för två markörer för kvarvarande sjukdom vid AML
    summary: MRDTect förenar analys av NPM1 och FLT3-ITD i ett laboratorieflöde. Den uppgivna analytiska prestandan visar ingen klinisk nytta.
    body:
      - type: p
        text: "Den 22 oktober lanserade Pillar Biosciences MRDTect NPM1 and FLT3 ITD, ett kit för nästa generations sekvensering avsett för forskning om mätbar kvarvarande sjukdom vid akut myeloisk leukemi (AML). Det förenar påvisning av NPM1-mutationer och interna tandemduplikationer i FLT3 från ett DNA-prov i laboratoriets eget sekvenseringsflöde. Både pressmeddelandet och produktsidan anger uttryckligen: endast för forskning, inte för diagnostiska förfaranden."
      - type: p
        text: "Pillar uppger påvisning vid en variantallelfrekvens på 0,005 % och tester av över 200 bibliotek i det egna laboratoriet och fyra partnerlaboratorier. Produktsidan förklarar att påvisningen beror på DNA-mängd och sekvenseringsdjup; de visade mappningsmåtten kommer från interna tester med referensmaterial. Detta är företagets analytiska resultat, ingen publicerad jämförelse som visar färre återfall, längre överlevnad eller bättre behandlingsbeslut. De granskade sidorna listar kitets delar men inget offentligt pris eller någon källkodslicens för analysprogrammet."
      - type: p
        text: "[OpenOnco](/sv/capabilities.html) används i ett annat steg: den gratis webbplatsen använder inmatade uppgifter, offentliga MIT-licensierade regler och citerade källor för att skapa utkast till onkologisk diskussion. Den analyserar varken blod eller benmärg, och mycket kliniskt innehåll väntar fortfarande på granskning. Ett forskningstest skulle kunna ge data för senare diskussion, men verktygens effekt på patientutfall har inte jämförts direkt. Artikeln rekommenderar varken test eller behandling och ersätter inte en läkare. Källor kontrollerade den 1 november 2026."
  nb:
    title: Pillar lanserer forskningspanel for to markører for restsykdom ved AML
    summary: MRDTect samler analyse av NPM1 og FLT3-ITD i én laboratorieprosess. Oppgitt analytisk ytelse viser ikke klinisk nytte.
    body:
      - type: p
        text: "Den 22. oktober lanserte Pillar Biosciences MRDTect NPM1 and FLT3 ITD, et sett for nestegenerasjons sekvensering til forskning på målbar restsykdom ved akutt myelogen leukemi (AML). Det kombinerer påvisning av NPM1-mutasjoner og interne tandemduplikasjoner i FLT3 fra én DNA-prøve i laboratoriets egen sekvenseringsprosess. Både meldingen og produktsiden sier uttrykkelig: kun til forskning, ikke til diagnostiske prosedyrer."
      - type: p
        text: "Pillar oppgir påvisning ved en variantallelfrekvens på 0,005 % og tester av mer enn 200 biblioteker i eget og fire partnerlaboratorier. Ifølge produktsiden avhenger påvisningen av DNA-mengde og sekvenseringsdybde; de viste kartleggingsmålene kommer fra interne tester med referansemateriale. Dette er selskapets analytiske funn, ikke en publisert sammenligning som viser færre tilbakefall, lengre overlevelse eller bedre behandlingsbeslutninger. De gjennomgåtte sidene oppgir settets deler, men verken offentlig pris eller kildekodelisens for analyseprogramvaren."
      - type: p
        text: "[OpenOnco](/nb/capabilities.html) brukes på et annet trinn: Det gratis nettstedet bruker innlagte opplysninger, offentlige MIT-lisensierte regler og siterte kilder til å lage utkast for onkologisk diskusjon. Det analyserer verken blod eller beinmarg, og mye klinisk innhold venter fortsatt på gjennomgang. En forskningstest kan gi data til senere drøfting, men verktøyenes virkning på pasientutfall er ikke sammenlignet direkte. Artikkelen anbefaler verken test eller behandling og erstatter ikke en lege. Kilder kontrollert 1. november 2026."
  fi:
    title: Pillar julkaisee tutkimuspaneelin kahdelle AML:n jäännöstaudin merkkiaineelle
    summary: MRDTect yhdistää NPM1:n ja FLT3-ITD:n analyysin samaan laboratorioprosessiin. Ilmoitettu analyyttinen suorituskyky ei osoita kliinistä hyötyä.
    body:
      - type: p
        text: "Pillar Biosciences julkaisi 22. lokakuuta MRDTect NPM1 and FLT3 ITD -testipaketin seuraavan sukupolven sekvensointiin akuutin myelooisen leukemian (AML) mitattavan jäännöstaudin tutkimuksessa. Se yhdistää NPM1-mutaatioiden ja FLT3-geenin sisäisten tandemduplikaatioiden tunnistamisen yhdestä DNA-näytteestä laboratorion omassa sekvensointiprosessissa. Sekä tiedote että tuotesivu sanovat nimenomaisesti: vain tutkimuskäyttöön, ei diagnostisiin toimenpiteisiin."
      - type: p
        text: "Pillar ilmoittaa havaitsemisesta 0,005 prosentin varianttialleeliosuudella ja yli 200 näytekirjaston testaamisesta omassa ja neljässä yhteistyölaboratoriossa. Tuotesivun mukaan havaitseminen riippuu DNA:n määrästä ja sekvensointisyvyydestä; esitetyt kohdistusluvut ovat peräisin sisäisistä vertailumateriaalikokeista. Ne ovat yrityksen raportoimia analyyttisiä havaintoja, eivät julkaistu vertailu, joka osoittaisi vähemmän uusiutumisia, pidempää elossaoloa tai parempia hoitopäätöksiä. Tarkistetut sivut listaavat paketin osat, mutta eivät julkista hintaa tai analyysiohjelmiston lähdekoodilisenssiä."
      - type: p
        text: "[OpenOnco](/fi/capabilities.html) toimii toisessa vaiheessa: maksuton sivusto käyttää syötettyjä tietoja, julkisia MIT-lisensoituja sääntöjä ja viitattuja lähteitä syöpää koskevien keskusteluluonnosten laatimiseen. Se ei analysoi verta eikä luuydintä, ja suuri osa kliinisestä sisällöstä odottaa vielä arviointia. Tutkimustesti voisi tuottaa tietoa myöhempään keskusteluun, mutta työkalujen vaikutusta potilastuloksiin ei ole verrattu suoraan. Artikkeli ei suosittele testiä tai hoitoa eikä korvaa lääkäriä. Lähteet tarkistettu 1. marraskuuta 2026."
