slug: dellphi-305-sclc
date: 2026-10-24
published: 2026-11-02
kind: explainer
series: openonco-three-day
series_format: research
author: OpenOnco
tags: [research, lung-cancer, immunotherapy, evidence]
title:
  en: 'DeLLphi-305: longer survival in a small-cell lung cancer maintenance trial'
  uk: 'DeLLphi-305: довше виживання в дослідженні підтримувальної терапії дрібноклітинного раку легень'
summary:
  en: In 563 people, median survival from maintenance randomization was 21.1 versus 12.7 months; grade 3 or higher adverse events were also more frequent.
  uk: Серед 563 учасників медіана виживання від початку підтримувальної терапії становила 21,1 проти 12,7 місяця; тяжкі небажані явища також були частішими.
sources:
  - citation: "Pérol M, et al. Tarlatamab–Durvalumab Maintenance for Extensive-Stage Small-Cell Lung Cancer. New England Journal of Medicine, published 24 October 2026. DOI 10.1056/NEJMoa2609482. Checked 2 November 2026."
    id: https://pubmed.ncbi.nlm.nih.gov/42929702/
  - citation: "DeLLphi-305, NCT06211036. ClinicalTrials.gov registration. Checked 2 November 2026."
    id: https://clinicaltrials.gov/study/NCT06211036
body:
  en:
    - type: p
      text: >-
        DeLLphi-305, published on 24 October 2026, tested a maintenance treatment for extensive-stage small-cell lung cancer. In this international, open-label, randomized phase 3 trial, 563 people whose cancer had not progressed after initial chemoimmunotherapy were assigned to tarlatamab plus durvalumab (282) or durvalumab alone (281). Survival was measured from randomization at the start of maintenance, not from diagnosis. The results are a prespecified interim analysis with a 7 July 2026 data cutoff.
    - type: p
      text: >-
        Median overall survival was 21.1 versus 12.7 months, an 8.4-month difference between group medians; the hazard ratio for death was 0.42 (95% confidence interval 0.32–0.54). Median time without progression was 7.4 versus 1.9 months. These are group estimates, not a forecast of how long one person will live. The headline number of a 58% lower hazard of death is a relative comparison, not a 58-percentage-point increase in survival.
    - type: p
      text: >-
        Grade 3 or higher adverse events occurred in 46.8% with the combination and 40.6% with durvalumab alone. Cytokine release syndrome, mostly grade 1 or 2, affected nearly half the combination group. The open-label design and interim follow-up limit certainty about long-term outcomes. The evidence applies to people who had no progression after the specified initial treatment; it does not establish benefit for every small-cell lung cancer setting. Trial funding came from Amgen and AstraZeneca.
    - type: p
      text: >-
        Tumor Board lens, without a live run: a wholly fictional person asks if this result applies after initial treatment. A discussion draft would first check cancer extent, the exact initial regimen, whether progression occurred, current condition and access to the treatment, then weigh the survival results against monitoring and toxicity. This is not an individual treatment plan or a substitute for a doctor. Sources checked 2 November 2026.
  uk:
    - type: p
      text: >-
        У дослідженні DeLLphi-305, опублікованому 24 жовтня 2026 року, перевіряли підтримувальну терапію при поширеному дрібноклітинному раку легень. У міжнародному відкритому рандомізованому дослідженні III фази 563 людини без прогресування після початкової хіміоімунотерапії отримували тарлатамаб із дурвалумабом (282) або лише дурвалумаб (281). Виживання рахували від розподілу на групи на початку підтримувальної терапії, а не від діагнозу. Це запланований проміжний аналіз зі зрізом даних 7 липня 2026 року.
    - type: p
      text: >-
        Медіана загального виживання становила 21,1 проти 12,7 місяця — різниця медіан між групами 8,4 місяця; відношення ризиків смерті 0,42 (95% довірчий інтервал 0,32–0,54). Медіана часу без прогресування становила 7,4 проти 1,9 місяця. Це групові оцінки, а не прогноз тривалості життя окремої людини. Заголовок про зниження ризику смерті на 58% описує відносне порівняння, а не приріст виживання на 58 відсоткових пунктів.
    - type: p
      text: >-
        Небажані явища 3-го ступеня або тяжчі виникали у 46,8% учасників у групі комбінації та 40,6% у групі дурвалумабу. Синдром вивільнення цитокінів, переважно 1–2-го ступеня, спостерігали майже в половини учасників групи комбінації. Відкритий дизайн і проміжний період спостереження обмежують висновки щодо віддалених результатів. Дані стосуються людей без прогресування після визначеного початкового лікування, а не кожної ситуації з дрібноклітинним раком легень. Дослідження фінансували Amgen і AstraZeneca.
    - type: p
      text: >-
        Погляд Tumor Board, без реального запуску: цілком вигадана людина запитує, чи стосується її результат після початкового лікування. У чернетці для обговорення слід уточнити поширеність хвороби, точну початкову схему, наявність прогресування, поточний стан і доступність лікування, а потім зіставити показники виживання з потребою моніторингу та ризиком токсичності. Це не індивідуальний план лікування і не заміна лікаря. Джерела перевірено 2 листопада 2026 року.
translations:
  es:
    title: 'DeLLphi-305: mayor supervivencia en un ensayo de mantenimiento para cáncer de pulmón microcítico'
    summary: 'En 563 personas, la supervivencia mediana desde la aleatorización para mantenimiento fue de 21,1 frente a 12,7 meses; también hubo más eventos adversos graves.'
    body:
      - type: p
        text: >-
          DeLLphi-305, publicado el 24 de octubre de 2026, estudió el mantenimiento en el cáncer de pulmón microcítico en estadio extendido. En este ensayo internacional, abierto y aleatorizado de fase 3, 563 personas sin progresión tras la quimioinmunoterapia inicial recibieron tarlatamab más durvalumab (282) o durvalumab solo (281). La supervivencia se midió desde la aleatorización al inicio del mantenimiento, no desde el diagnóstico. Es un análisis intermedio previsto, con corte de datos el 7 de julio de 2026.
      - type: p
        text: >-
          La mediana de supervivencia global fue de 21,1 frente a 12,7 meses: una diferencia de 8,4 meses entre medianas; el cociente de riesgos de muerte fue 0,42 (intervalo de confianza del 95%: 0,32–0,54). La mediana sin progresión fue de 7,4 frente a 1,9 meses. Son estimaciones grupales, no predicciones individuales. El titular de una reducción del riesgo relativo de muerte del 58% no significa 58 puntos porcentuales más de supervivencia.
      - type: p
        text: >-
          Hubo eventos adversos de grado 3 o superior en el 46,8% con la combinación y el 40,6% con durvalumab solo. El síndrome de liberación de citocinas, principalmente de grado 1 o 2, afectó a casi la mitad del grupo combinado. El diseño abierto y el seguimiento intermedio limitan las conclusiones a largo plazo. Los resultados se aplican a personas sin progresión tras el tratamiento inicial especificado, no a todas las situaciones de este cáncer. Financiaron el estudio Amgen y AstraZeneca.
      - type: p
        text: >-
          Perspectiva del Tumor Board, sin ejecutar el servicio: una persona totalmente ficticia pregunta si el resultado le corresponde tras el tratamiento inicial. Un borrador para debatir comprobaría la extensión del cáncer, el tratamiento previo exacto, la progresión, el estado actual y el acceso, y ponderaría supervivencia, vigilancia y toxicidad. No es un plan individual ni sustituye al médico. Fuentes verificadas el 2 de noviembre de 2026.
  pt:
    title: 'DeLLphi-305: sobrevivência mais longa num ensaio de manutenção do cancro do pulmão de pequenas células'
    summary: 'Em 563 pessoas, a sobrevivência mediana desde a aleatorização para manutenção foi de 21,1 contra 12,7 meses; os eventos adversos graves também foram mais frequentes.'
    body:
      - type: p
        text: >-
          O DeLLphi-305, publicado em 24 de outubro de 2026, estudou a manutenção no cancro do pulmão de pequenas células em estádio extenso. Neste ensaio internacional, aberto, aleatorizado e de fase 3, 563 pessoas sem progressão após a quimioimunoterapia inicial receberam tarlatamab mais durvalumab (282) ou apenas durvalumab (281). A sobrevivência foi medida desde a aleatorização no início da manutenção, não desde o diagnóstico. Trata-se de uma análise intercalar planeada, com dados até 7 de julho de 2026.
      - type: p
        text: >-
          A sobrevivência global mediana foi de 21,1 contra 12,7 meses: diferença de 8,4 meses entre medianas; o hazard ratio para morte foi 0,42 (intervalo de confiança de 95%: 0,32–0,54). A mediana sem progressão foi de 7,4 contra 1,9 meses. São estimativas de grupos, não previsões individuais. A redução relativa de 58% no risco instantâneo de morte não equivale a mais 58 pontos percentuais de sobrevivência.
      - type: p
        text: >-
          Ocorreram eventos adversos de grau 3 ou superior em 46,8% com a combinação e 40,6% com durvalumab isolado. A síndrome de libertação de citocinas, sobretudo de grau 1 ou 2, afetou quase metade do grupo da combinação. O desenho aberto e o seguimento intercalar limitam as conclusões de longo prazo. Os resultados dizem respeito a pessoas sem progressão após o tratamento inicial especificado, não a todas as situações desta doença. Amgen e AstraZeneca financiaram o estudo.
      - type: p
        text: >-
          Perspetiva do Tumor Board, sem executar o serviço: uma pessoa totalmente fictícia pergunta se o resultado se aplica após o tratamento inicial. Um rascunho para discussão verificaria a extensão da doença, o esquema prévio exato, eventual progressão, estado atual e acesso, e ponderaria sobrevivência, vigilância e toxicidade. Não é um plano individual nem substitui o médico. Fontes verificadas em 2 de novembro de 2026.
  de:
    title: 'DeLLphi-305: längeres Überleben in einer Erhaltungstherapie-Studie bei kleinzelligem Lungenkrebs'
    summary: 'Bei 563 Personen betrug das mediane Überleben ab Randomisierung zur Erhaltungstherapie 21,1 gegenüber 12,7 Monaten; schwere Nebenwirkungen waren ebenfalls häufiger.'
    body:
      - type: p
        text: >-
          DeLLphi-305, veröffentlicht am 24. Oktober 2026, untersuchte die Erhaltungstherapie bei kleinzelligem Lungenkrebs im ausgedehnten Stadium. In dieser internationalen, offenen, randomisierten Phase-3-Studie erhielten 563 Personen ohne Fortschreiten nach anfänglicher Chemoimmuntherapie Tarlatamab plus Durvalumab (282) oder Durvalumab allein (281). Das Überleben wurde ab der Randomisierung zu Beginn der Erhaltungstherapie gemessen, nicht ab Diagnose. Berichtet wird eine vorab geplante Zwischenanalyse mit Datenschnitt vom 7. Juli 2026.
      - type: p
        text: >-
          Das mediane Gesamtüberleben betrug 21,1 gegenüber 12,7 Monaten, ein Unterschied von 8,4 Monaten zwischen den Gruppenmedianen; die Hazard Ratio für Tod lag bei 0,42 (95-%-Konfidenzintervall 0,32–0,54). Das mediane progressionsfreie Überleben betrug 7,4 gegenüber 1,9 Monaten. Das sind Gruppenschätzungen, keine individuelle Prognose. Die relative Verringerung der Sterbe-Hazard um 58 % bedeutet keinen Anstieg der Überlebensquote um 58 Prozentpunkte.
      - type: p
        text: >-
          Nebenwirkungen vom Grad 3 oder höher traten bei 46,8 % unter der Kombination und 40,6 % unter Durvalumab allein auf. Ein Zytokinfreisetzungssyndrom, meist Grad 1 oder 2, betraf fast die Hälfte der Kombinationsgruppe. Das offene Design und die Zwischenbeobachtung begrenzen Aussagen über langfristige Ergebnisse. Die Daten gelten für Personen ohne Fortschreiten nach der festgelegten Anfangstherapie, nicht für jede Situation mit diesem Krebs. Finanziert wurde die Studie von Amgen und AstraZeneca.
      - type: p
        text: >-
          Blick des Tumor Boards, ohne tatsächliche Nutzung des Dienstes: Eine vollständig erfundene Person fragt nach der Bedeutung nach ihrer Anfangstherapie. Ein Diskussionsentwurf würde Ausbreitung, genaue Vorbehandlung, Fortschreiten, aktuellen Zustand und Zugang prüfen und Überlebensdaten gegen Überwachung und Toxizität abwägen. Dies ist kein individueller Behandlungsplan und ersetzt keinen Arzt. Quellen geprüft am 2. November 2026.
  fr:
    title: 'DeLLphi-305 : survie prolongée dans un essai de traitement d’entretien du cancer du poumon à petites cellules'
    summary: 'Chez 563 personnes, la survie médiane depuis la randomisation pour le traitement d’entretien était de 21,1 contre 12,7 mois ; les événements indésirables sévères étaient aussi plus fréquents.'
    body:
      - type: p
        text: >-
          DeLLphi-305, publié le 24 octobre 2026, a étudié le traitement d’entretien du cancer du poumon à petites cellules au stade étendu. Dans cet essai international, ouvert, randomisé et de phase 3, 563 personnes sans progression après une chimio-immunothérapie initiale ont reçu tarlatamab plus durvalumab (282) ou durvalumab seul (281). La survie a été mesurée depuis la randomisation au début de l’entretien, pas depuis le diagnostic. Il s’agit d’une analyse intermédiaire prévue, avec arrêt des données au 7 juillet 2026.
      - type: p
        text: >-
          La survie globale médiane était de 21,1 contre 12,7 mois, soit 8,4 mois d’écart entre les médianes ; le rapport des risques instantanés de décès était de 0,42 (intervalle de confiance à 95 % : 0,32–0,54). La survie médiane sans progression était de 7,4 contre 1,9 mois. Ce sont des estimations de groupe, pas un pronostic individuel. Une baisse relative de 58 % du risque instantané ne correspond pas à 58 points de pourcentage de survie supplémentaires.
      - type: p
        text: >-
          Des événements indésirables de grade 3 ou supérieur sont survenus chez 46,8 % sous association et 40,6 % sous durvalumab seul. Le syndrome de libération des cytokines, surtout de grade 1 ou 2, a touché près de la moitié du groupe associé. L’absence d’aveugle et le suivi intermédiaire limitent les conclusions à long terme. Ces données concernent les personnes sans progression après le traitement initial précisé, pas toutes les situations de cette maladie. L’essai a été financé par Amgen et AstraZeneca.
      - type: p
        text: >-
          Regard du Tumor Board, sans exécution réelle du service : une personne entièrement fictive demande si ce résultat la concerne après son traitement initial. Une ébauche de discussion vérifierait l’étendue, le traitement exact, une éventuelle progression, l’état actuel et l’accès, puis pèserait survie, surveillance et toxicité. Ce n’est pas un plan individuel et cela ne remplace pas un médecin. Sources vérifiées le 2 novembre 2026.
  it:
    title: 'DeLLphi-305: sopravvivenza più lunga in uno studio sul mantenimento del carcinoma polmonare a piccole cellule'
    summary: 'In 563 persone, la sopravvivenza mediana dalla randomizzazione al mantenimento è stata di 21,1 contro 12,7 mesi; anche gli eventi avversi gravi erano più frequenti.'
    body:
      - type: p
        text: >-
          DeLLphi-305, pubblicato il 24 ottobre 2026, ha studiato il mantenimento nel carcinoma polmonare a piccole cellule in stadio esteso. In questo studio internazionale, in aperto, randomizzato e di fase 3, 563 persone senza progressione dopo chemioimmunoterapia iniziale hanno ricevuto tarlatamab più durvalumab (282) o solo durvalumab (281). La sopravvivenza è stata misurata dalla randomizzazione all’inizio del mantenimento, non dalla diagnosi. È un’analisi intermedia predefinita con dati fino al 7 luglio 2026.
      - type: p
        text: >-
          La sopravvivenza globale mediana è stata di 21,1 contro 12,7 mesi: una differenza di 8,4 mesi tra le mediane; l’hazard ratio di morte era 0,42 (intervallo di confidenza al 95%: 0,32–0,54). La mediana senza progressione era di 7,4 contro 1,9 mesi. Sono stime di gruppo, non previsioni individuali. La riduzione relativa del 58% del rischio istantaneo di morte non equivale a 58 punti percentuali di sopravvivenza in più.
      - type: p
        text: >-
          Eventi avversi di grado 3 o superiore si sono verificati nel 46,8% con la combinazione e nel 40,6% con durvalumab solo. La sindrome da rilascio di citochine, soprattutto di grado 1 o 2, ha interessato quasi metà del gruppo combinato. Il disegno in aperto e il follow-up intermedio limitano le conclusioni a lungo termine. I dati riguardano persone senza progressione dopo il trattamento iniziale specificato, non ogni situazione di questa malattia. Amgen e AstraZeneca hanno finanziato lo studio.
      - type: p
        text: >-
          Prospettiva del Tumor Board, senza eseguire il servizio: una persona del tutto immaginaria chiede se il risultato si applichi dopo il trattamento iniziale. Una bozza di discussione verificherebbe estensione, schema precedente esatto, progressione, condizioni attuali e accesso, poi valuterebbe sopravvivenza, monitoraggio e tossicità. Non è un piano individuale né sostituisce il medico. Fonti verificate il 2 novembre 2026.
  da:
    title: 'DeLLphi-305: længere overlevelse i et vedligeholdelsesforsøg ved småcellet lungekræft'
    summary: 'Blandt 563 personer var medianoverlevelsen fra lodtrækning til vedligeholdelse 21,1 mod 12,7 måneder; alvorlige bivirkninger var også hyppigere.'
    body:
      - type: p
        text: >-
          DeLLphi-305, offentliggjort 24. oktober 2026, undersøgte vedligeholdelsesbehandling ved småcellet lungekræft i udbredt stadium. I dette internationale, åbne, randomiserede fase 3-forsøg fik 563 personer uden progression efter indledende kemoimmunterapi tarlatamab plus durvalumab (282) eller durvalumab alene (281). Overlevelsen blev målt fra lodtrækningen ved vedligeholdelsens start, ikke fra diagnosen. Dette er en planlagt interimanalyse med dataskæring 7. juli 2026.
      - type: p
        text: >-
          Median samlet overlevelse var 21,1 mod 12,7 måneder, en forskel på 8,4 måneder mellem gruppemedianer; hazard ratio for død var 0,42 (95 % konfidensinterval 0,32–0,54). Median tid uden progression var 7,4 mod 1,9 måneder. Det er gruppeestimater, ikke en individuel prognose. Den relative reduktion på 58 % i døds-hazard betyder ikke 58 procentpoint højere overlevelse.
      - type: p
        text: >-
          Bivirkninger af grad 3 eller højere forekom hos 46,8 % med kombinationen og 40,6 % med durvalumab alene. Cytokinfrigivelsessyndrom, overvejende grad 1 eller 2, ramte næsten halvdelen i kombinationsgruppen. Det åbne design og den foreløbige opfølgning begrænser viden om langtidseffekter. Resultaterne gælder personer uden progression efter den angivne indledende behandling, ikke alle situationer med denne kræftform. Amgen og AstraZeneca finansierede forsøget.
      - type: p
        text: >-
          Tumor Board-perspektiv uden faktisk kørsel af tjenesten: En helt opdigtet person spørger, om resultatet gælder efter indledende behandling. Et diskussionsudkast ville kontrollere udbredelse, præcis tidligere behandling, progression, aktuel tilstand og adgang samt afveje overlevelse mod overvågning og toksicitet. Det er ikke en individuel behandlingsplan og erstatter ikke en læge. Kilder kontrolleret 2. november 2026.
  sv:
    title: 'DeLLphi-305: längre överlevnad i en underhållsstudie vid småcellig lungcancer'
    summary: 'Bland 563 personer var medianöverlevnaden från randomisering till underhållsbehandling 21,1 mot 12,7 månader; allvarliga biverkningar var också vanligare.'
    body:
      - type: p
        text: >-
          DeLLphi-305, publicerad den 24 oktober 2026, undersökte underhållsbehandling vid småcellig lungcancer i utbrett stadium. I denna internationella, öppna, randomiserade fas 3-studie fick 563 personer utan progression efter inledande kemoimmunterapi tarlatamab plus durvalumab (282) eller enbart durvalumab (281). Överlevnaden räknades från randomiseringen vid start av underhållsbehandling, inte från diagnos. Detta är en förplanerad interimsanalys med databrytpunkt den 7 juli 2026.
      - type: p
        text: >-
          Median total överlevnad var 21,1 mot 12,7 månader, en skillnad på 8,4 månader mellan gruppmedianerna; hasardkvoten för död var 0,42 (95 % konfidensintervall 0,32–0,54). Median tid utan progression var 7,4 mot 1,9 månader. Det är gruppskattningar, inte en individuell prognos. En relativ minskning med 58 % av dödshasarden innebär inte 58 procentenheter högre överlevnad.
      - type: p
        text: >-
          Biverkningar av grad 3 eller högre inträffade hos 46,8 % med kombinationen och 40,6 % med enbart durvalumab. Cytokinfrisättningssyndrom, främst grad 1 eller 2, drabbade nästan hälften i kombinationsgruppen. Den öppna utformningen och interimsuppföljningen begränsar slutsatser om långtidseffekter. Resultaten gäller personer utan progression efter den angivna initiala behandlingen, inte alla situationer med denna cancerform. Amgen och AstraZeneca finansierade studien.
      - type: p
        text: >-
          Tumor Board-perspektiv utan att tjänsten körts: En helt påhittad person frågar om resultatet gäller efter initial behandling. Ett diskussionsutkast skulle kontrollera utbredning, exakt tidigare behandling, progression, aktuellt tillstånd och tillgång samt väga överlevnad mot övervakning och toxicitet. Detta är ingen individuell behandlingsplan och ersätter inte en läkare. Källor kontrollerade den 2 november 2026.
  nb:
    title: 'DeLLphi-305: lengre overlevelse i en vedlikeholdsstudie ved småcellet lungekreft'
    summary: 'Blant 563 personer var medianoverlevelsen fra randomisering til vedlikehold 21,1 mot 12,7 måneder; alvorlige bivirkninger var også vanligere.'
    body:
      - type: p
        text: >-
          DeLLphi-305, publisert 24. oktober 2026, undersøkte vedlikeholdsbehandling ved småcellet lungekreft i utbredt stadium. I denne internasjonale, åpne, randomiserte fase 3-studien fikk 563 personer uten progresjon etter innledende kjemoimmunterapi tarlatamab pluss durvalumab (282) eller durvalumab alene (281). Overlevelsen ble målt fra randomiseringen ved starten av vedlikeholdet, ikke fra diagnosen. Dette er en planlagt interimanalyse med datakutt 7. juli 2026.
      - type: p
        text: >-
          Median totaloverlevelse var 21,1 mot 12,7 måneder, en forskjell på 8,4 måneder mellom gruppemedianene; hasardratio for død var 0,42 (95 % konfidensintervall 0,32–0,54). Median tid uten progresjon var 7,4 mot 1,9 måneder. Dette er gruppeestimater, ikke en individuell prognose. En relativ reduksjon på 58 % i dødsrisiko over tid betyr ikke 58 prosentpoeng høyere overlevelse.
      - type: p
        text: >-
          Bivirkninger av grad 3 eller høyere forekom hos 46,8 % med kombinasjonen og 40,6 % med durvalumab alene. Cytokinfrigjøringssyndrom, hovedsakelig grad 1 eller 2, rammet nesten halvparten i kombinasjonsgruppen. Åpent design og foreløpig oppfølging begrenser konklusjoner om langtidsresultater. Funnene gjelder personer uten progresjon etter den angitte første behandlingen, ikke alle situasjoner med denne kreftformen. Amgen og AstraZeneca finansierte studien.
      - type: p
        text: >-
          Tumor Board-perspektiv uten faktisk kjøring av tjenesten: En helt oppdiktet person spør om resultatet gjelder etter innledende behandling. Et diskusjonsutkast ville kontrollere utbredelse, nøyaktig tidligere behandling, progresjon, nåværende tilstand og tilgang, og veie overlevelse mot overvåking og toksisitet. Dette er ingen individuell behandlingsplan og erstatter ikke lege. Kilder kontrollert 2. november 2026.
  fi:
    title: 'DeLLphi-305: pidempi elinaika pienisoluisen keuhkosyövän ylläpitohoitotutkimuksessa'
    summary: '563 henkilön tutkimuksessa elinajan mediaani ylläpitohoidon satunnaistamisesta oli 21,1 vs. 12,7 kuukautta; vaikeat haitat olivat myös yleisempiä.'
    body:
      - type: p
        text: >-
          DeLLphi-305, joka julkaistiin 24. lokakuuta 2026, tutki laajalle levinneen pienisoluisen keuhkosyövän ylläpitohoitoa. Tässä kansainvälisessä, avoimessa, satunnaistetussa vaiheen 3 tutkimuksessa 563 henkilöä, joiden tauti ei ollut edennyt alkuvaiheen kemoimmunoterapian jälkeen, sai tarlatamabia ja durvalumabia (282) tai durvalumabia yksin (281). Elinaika mitattiin ylläpitohoidon alun satunnaistamisesta, ei diagnoosista. Kyseessä on ennalta suunniteltu välianalyysi; tietojen katkaisupäivä oli 7. heinäkuuta 2026.
      - type: p
        text: >-
          Kokonaiselinajan mediaani oli 21,1 vs. 12,7 kuukautta, ryhmien mediaanien ero 8,4 kuukautta; kuoleman hasardisuhde oli 0,42 (95 %:n luottamusväli 0,32–0,54). Etenemättömän ajan mediaani oli 7,4 vs. 1,9 kuukautta. Nämä ovat ryhmäarvioita, eivät yksilöllisiä ennusteita. Kuoleman hetkellisen riskin 58 %:n suhteellinen pieneneminen ei tarkoita 58 prosenttiyksikön lisäystä elossaoloon.
      - type: p
        text: >-
          Asteen 3 tai vakavampia haittatapahtumia ilmeni 46,8 %:lla yhdistelmäryhmässä ja 40,6 %:lla pelkkää durvalumabia saaneista. Sytokiinivapautumisoireyhtymä, useimmiten astetta 1 tai 2, koski lähes puolta yhdistelmäryhmästä. Avoin asetelma ja välivaiheen seuranta rajoittavat pitkän aikavälin päätelmiä. Tulokset koskevat henkilöitä, joiden tauti ei edennyt määritellyn alkuhoidon jälkeen, eivät kaikkia tämän syövän tilanteita. Amgen ja AstraZeneca rahoittivat tutkimuksen.
      - type: p
        text: >-
          Tumor Board -näkökulma ilman palvelun todellista käyttöä: täysin kuvitteellinen henkilö kysyy, koskeeko tulos häntä alkuhoidon jälkeen. Keskusteluluonnoksessa tarkistettaisiin taudin levinneisyys, tarkka aiempi hoito, eteneminen, nykytila ja saatavuus sekä punnittaisiin elinaikatuloksia seurannan ja haittojen rinnalla. Tämä ei ole yksilöllinen hoitosuunnitelma eikä korvaa lääkäriä. Lähteet tarkistettu 2. marraskuuta 2026.
