  - citation: "University College London. UCL spinout Octopath AI launches with £1.5 million investment and grant funding, 2 November 2026. Checked 2 November 2026."
    id: https://www.ucl.ac.uk/news/2026/nov/ucl-spinout-octopathai-aims-develop-tool-precision-cancer-treatment
  - citation: "Octopath AI. Digital pathology products and workflow. Checked 2 November 2026."
