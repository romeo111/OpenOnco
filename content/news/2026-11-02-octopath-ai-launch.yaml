body:
  en:
    - type: p
      text: >-
        On 2 November, UCL announced the launch of its spinout Octopath AI with £1.5 million in seed investment and grant funding. The company says its Kraken and Nemo models count and classify cells on routine digital tissue slides. Its site lists H&E and immunohistochemistry tools, including tumour cellularity and biomarker scoring. UCL says the underlying training set contains 14.1 million labelled cells across 14 tissue and cancer types. Those are company and university descriptions, not proof that a diagnostic service has improved patient outcomes.
    - type: p
      text: >-
        There is published research: a post-hoc analysis used 414 pretreatment rectal-cancer biopsies from the ARISTOTLE trial and found that AI-measured tumour cell density was associated with different outcomes between treatment groups. Its authors call the finding hypothesis-generating and request independent retrospective and prospective evaluation. Octopath's own validation page labels the listed products research use only. Joining an MHRA regulatory sandbox is not regulatory approval. Its evaluation licence supplies object code, excludes source code and clinical patient-management use, and records £1 consideration; this is not a public clinical price list.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) addresses a different step: its free public site and MIT-licensed code use entered clinical context, versioned rules and cited sources to draft discussion paths. It cannot read pathology slides or replace a pathologist. Much of its clinical content still needs review. Octopath could measure tissue features for later discussion, while OpenOnco can show the reasoning behind a draft; neither a direct outcome comparison nor superiority is established. This article does not recommend a test or treatment and does not replace a doctor. Sources checked 2 November 2026.
  uk:
    - type: p
      text: >-
        2 листопада UCL повідомив про запуск свого стартапу Octopath AI із 1,5 млн фунтів посівних інвестицій і грантів. За описом компанії, моделі Kraken і Nemo підраховують та класифікують клітини на звичайних цифрових гістологічних препаратах. На сайті перелічено інструменти для препаратів H&E та імуногістохімії, зокрема оцінювання клітинності пухлини й біомаркерів. UCL повідомляє про навчальний набір із 14,1 млн розмічених клітин 14 типів тканин і раку. Це описи компанії та університету, а не доказ поліпшення результатів пацієнтів.
    - type: p
      text: >-
        Наукові дані є: у вторинному аналізі дослідження ARISTOTLE використали 414 біопсій до лікування раку прямої кишки й виявили зв'язок між виміряною ШІ щільністю пухлинних клітин та відмінностями результатів у групах лікування. Автори називають висновок гіпотезою, що потребує незалежної ретроспективної й проспективної перевірки. Власна сторінка Octopath позначає перелічені продукти як призначені лише для досліджень. Участь у регуляторній пісочниці MHRA не є дозволом на клінічне застосування. Ліцензія на оцінювання надає лише виконуваний код, виключає вихідний код і ведення пацієнтів та передбачає платіж £1; це не публічний прайс клінічного сервісу.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) працює на іншому етапі: безкоштовний публічний сайт і код за ліцензією MIT використовують введений клінічний контекст, версійні правила та джерела для чернеток маршрутів обговорення. Він не аналізує гістологічні зображення й не замінює патолога. Значна частина клінічного вмісту ще потребує рецензування. Octopath може вимірювати ознаки тканини для подальшого обговорення, а OpenOnco показує підстави чернетки; прямого порівняння впливу на результати пацієнтів чи доведеної переваги немає. Стаття не рекомендує обстеження або лікування й не замінює лікаря. Джерела перевірено 2 листопада 2026 року.
translations:
  es:
    title: Octopath AI inicia su actividad para contar células en imágenes de tumores
    summary: La empresa surgida de UCL obtuvo 1,5 millones de libras para analizar imágenes histológicas. Sus productos declarados son solo para investigación; no se ha demostrado beneficio clínico.
    body:
      - type: p
        text: >-
          El 2 de noviembre, UCL anunció el lanzamiento de su empresa derivada Octopath AI con 1,5 millones de libras en financiación inicial y subvenciones. Según la empresa, sus modelos Kraken y Nemo cuentan y clasifican células en preparaciones histológicas digitales habituales. Su web presenta herramientas para tinciones H&E e inmunohistoquímicas, incluida la medición de celularidad tumoral y biomarcadores. UCL informa de 14,1 millones de células etiquetadas de 14 tipos de tejidos y cánceres en el conjunto de entrenamiento. Son descripciones de la empresa y la universidad, no pruebas de mejores resultados para pacientes.
      - type: p
        text: >-
          Existe investigación publicada: un análisis posterior del ensayo ARISTOTLE utilizó 414 biopsias de cáncer rectal anteriores al tratamiento y halló una asociación entre la densidad de células tumorales medida por IA y distintos resultados entre los grupos terapéuticos. Los autores consideran el hallazgo generador de hipótesis y piden validación retrospectiva y prospectiva independiente. La página de Octopath clasifica sus productos como solo para investigación. Participar en un entorno regulatorio de pruebas de la MHRA no equivale a autorización. Su licencia de evaluación ofrece código ejecutable, excluye el código fuente y el uso para gestionar pacientes, y prevé un pago de £1; no es una tarifa clínica pública.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) actúa en otra fase: su web gratuita y su código MIT usan contexto clínico introducido, reglas versionadas y fuentes citadas para elaborar borradores de discusión. No interpreta imágenes histológicas ni sustituye al patólogo; gran parte del contenido clínico sigue pendiente de revisión. Octopath puede medir rasgos tisulares para discutirlos después, mientras OpenOnco muestra las razones de un borrador. No hay comparación directa de resultados ni superioridad demostrada. Este artículo no recomienda pruebas o tratamientos ni sustituye al médico. Fuentes verificadas el 2 de noviembre de 2026.
  pt:
    title: Octopath AI é lançada para contar células em imagens de tumores
    summary: A empresa nascida na UCL obteve 1,5 milhões de libras para análise de lâminas digitais. Os produtos indicados são só para investigação; o benefício clínico não foi demonstrado.
    body:
      - type: p
        text: >-
          Em 2 de novembro, a UCL anunciou o lançamento da sua spin-off Octopath AI com 1,5 milhões de libras em investimento inicial e bolsas. Segundo a empresa, os modelos Kraken e Nemo contam e classificam células em lâminas histológicas digitais comuns. O sítio apresenta ferramentas para H&E e imunohistoquímica, incluindo celularidade tumoral e marcadores biológicos. A UCL refere um conjunto de treino com 14,1 milhões de células anotadas de 14 tipos de tecidos e cancro. São descrições da empresa e da universidade, não prova de melhores resultados para doentes.
      - type: p
        text: >-
          Há investigação publicada: uma análise pós-hoc do ensaio ARISTOTLE usou 414 biópsias de cancro do reto anteriores ao tratamento e encontrou associação entre a densidade de células tumorais medida por IA e resultados diferentes entre grupos terapêuticos. Os autores consideram o resultado gerador de hipóteses e pedem avaliação independente retrospetiva e prospetiva. A página da Octopath classifica os produtos como apenas para investigação. Participar numa sandbox regulatória da MHRA não é aprovação. A licença de avaliação fornece código executável, exclui o código-fonte e a gestão de doentes e prevê £1 de contrapartida; não é uma tabela pública de preços clínicos.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) atua noutra etapa: o sítio gratuito e o código MIT usam contexto clínico introduzido, regras com versões e fontes citadas para criar rascunhos de discussão. Não lê lâminas histológicas nem substitui o patologista; muito do conteúdo clínico ainda aguarda revisão. A Octopath pode medir características do tecido para discussão posterior, enquanto o OpenOnco mostra o raciocínio de um rascunho. Não há comparação direta de resultados nem superioridade demonstrada. Este artigo não recomenda testes ou tratamentos e não substitui um médico. Fontes verificadas em 2 de novembro de 2026.
  de:
    title: Octopath AI startet mit Zellzählung auf digitalen Tumorpräparaten
    summary: Das UCL-Spin-off erhielt 1,5 Millionen Pfund für die Analyse digitaler Gewebeschnitte. Die aufgeführten Produkte sind nur für Forschung vorgesehen; ein klinischer Nutzen ist nicht belegt.
    body:
      - type: p
        text: >-
          Am 2. November meldete UCL den Start seines Spin-offs Octopath AI mit 1,5 Millionen Pfund an Startkapital und Fördermitteln. Laut Unternehmen zählen und klassifizieren Kraken und Nemo Zellen auf üblichen digitalen Gewebeschnitten. Die Website nennt Werkzeuge für H&E- und immunhistochemische Präparate, darunter Tumorzellularität und Biomarker-Bewertung. UCL berichtet von 14,1 Millionen markierten Zellen aus 14 Gewebe- und Krebsarten im Trainingsdatensatz. Das sind Angaben des Unternehmens und der Universität, kein Nachweis besserer Behandlungsergebnisse.
      - type: p
        text: >-
          Veröffentlichte Forschung liegt vor: Eine nachträgliche Analyse der ARISTOTLE-Studie nutzte 414 vor der Behandlung entnommene Rektumkarzinom-Biopsien und fand einen Zusammenhang zwischen KI-gemessener Tumorzelldichte und unterschiedlichen Ergebnissen der Behandlungsgruppen. Die Autoren bezeichnen das Ergebnis als hypothesengenerierend und fordern unabhängige retrospektive und prospektive Prüfung. Octopath kennzeichnet seine Produkte als nur für Forschungszwecke. Die Teilnahme an einer MHRA-Regulierungs-Sandbox ist keine Zulassung. Die Evaluierungslizenz liefert ausführbaren Code, schließt Quellcode und Patientenmanagement aus und nennt £1 Gegenleistung; das ist keine öffentliche Preisliste für klinische Nutzung.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) setzt an anderer Stelle an: Die kostenlose Website und der MIT-lizenzierte Code erstellen mit eingegebenem klinischem Kontext, versionierten Regeln und zitierten Quellen Diskussionsentwürfe. Sie lesen keine Gewebeschnitte und ersetzen keine Pathologin oder keinen Pathologen; viele klinische Inhalte benötigen noch Prüfung. Octopath kann Gewebemerkmale für spätere Gespräche messen, OpenOnco zeigt die Begründung eines Entwurfs. Ein direkter Ergebnisvergleich oder eine Überlegenheit ist nicht belegt. Dieser Text empfiehlt weder Untersuchung noch Behandlung und ersetzt keinen Arzt. Quellen geprüft am 2. November 2026.
  fr:
    title: Octopath AI se lance dans le comptage des cellules sur lames tumorales numériques
    summary: L'entreprise issue de l'UCL a obtenu 1,5 million de livres pour analyser des lames. Ses produits indiqués restent réservés à la recherche ; le bénéfice clinique n'est pas démontré.
    body:
      - type: p
        text: >-
          Le 2 novembre, l'UCL a annoncé le lancement de sa jeune entreprise Octopath AI avec 1,5 million de livres de financement initial et de subventions. Selon l'entreprise, Kraken et Nemo comptent et classent les cellules sur des lames histologiques numériques courantes. Son site présente des outils pour les colorations H&E et immunohistochimiques, notamment la cellularité tumorale et la mesure de biomarqueurs. L'UCL annonce 14,1 millions de cellules annotées provenant de 14 types de tissus et cancers dans le jeu d'entraînement. Ce sont des descriptions institutionnelles, pas une preuve d'amélioration des résultats des patients.
      - type: p
        text: >-
          Des travaux sont publiés : une analyse a posteriori de l'essai ARISTOTLE a exploité 414 biopsies de cancer du rectum prélevées avant traitement et trouvé une association entre la densité de cellules tumorales mesurée par IA et des résultats différents selon les groupes thérapeutiques. Les auteurs jugent le résultat générateur d'hypothèses et demandent des évaluations indépendantes rétrospectives et prospectives. Octopath indique que ses produits sont réservés à la recherche. Une participation au bac à sable réglementaire de la MHRA n'est pas une autorisation. La licence d'évaluation fournit le code exécutable, exclut le code source et la prise en charge des patients, et prévoit une contrepartie de £1 ; ce n'est pas un tarif clinique public.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) intervient à une autre étape : son site gratuit et son code sous licence MIT utilisent le contexte clinique saisi, des règles versionnées et des sources citées pour rédiger des pistes de discussion. Il ne lit pas les lames et ne remplace pas le pathologiste ; beaucoup de contenu clinique reste à vérifier. Octopath peut mesurer des caractéristiques tissulaires pour une discussion ultérieure, tandis qu'OpenOnco expose le raisonnement d'un brouillon. Aucune comparaison directe des résultats ni supériorité n'est établie. Ce texte ne recommande ni examen ni traitement et ne remplace pas un médecin. Sources vérifiées le 2 novembre 2026.
  it:
    title: Octopath AI avvia il conteggio delle cellule nelle immagini digitali dei tumori
    summary: Lo spin-off UCL ha ottenuto 1,5 milioni di sterline per analizzare vetrini digitali. I prodotti elencati sono solo per ricerca; il beneficio clinico non è dimostrato.
    body:
      - type: p
        text: >-
          Il 2 novembre UCL ha annunciato il lancio dello spin-off Octopath AI con 1,5 milioni di sterline tra investimento iniziale e sovvenzioni. Secondo l'azienda, i modelli Kraken e Nemo contano e classificano le cellule su comuni vetrini istologici digitali. Il sito presenta strumenti per H&E e immunoistochimica, tra cui cellularità tumorale e valutazione di biomarcatori. UCL riferisce un insieme di addestramento di 14,1 milioni di cellule annotate di 14 tipi di tessuti e tumori. Sono dichiarazioni dell'azienda e dell'università, non prove di migliori esiti per i pazienti.
      - type: p
        text: >-
          Esiste ricerca pubblicata: un'analisi post hoc dello studio ARISTOTLE ha esaminato 414 biopsie di cancro rettale pretrattamento e ha trovato un'associazione tra densità di cellule tumorali misurata dall'IA ed esiti diversi tra gruppi terapeutici. Gli autori definiscono il risultato generatore di ipotesi e chiedono valutazioni indipendenti retrospettive e prospettiche. Octopath indica i prodotti come destinati solo alla ricerca. L'adesione a una sandbox regolatoria MHRA non è un'autorizzazione. La licenza di valutazione fornisce codice eseguibile, esclude sorgente e gestione dei pazienti e prevede £1 di corrispettivo; non è un listino clinico pubblico.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) opera in un'altra fase: il sito gratuito e il codice MIT usano contesto clinico inserito, regole versionate e fonti citate per creare bozze di discussione. Non legge vetrini e non sostituisce il patologo; molti contenuti clinici attendono ancora revisione. Octopath può misurare caratteristiche del tessuto per una discussione successiva, mentre OpenOnco mostra le ragioni di una bozza. Non esiste un confronto diretto degli esiti né una superiorità dimostrata. L'articolo non raccomanda esami o terapie e non sostituisce un medico. Fonti verificate il 2 novembre 2026.
  da:
    title: Octopath AI lanceres for at tælle celler på digitale tumorsnit
    summary: UCL-spinoutet har fået 1,5 millioner pund til analyse af digitale vævssnit. De nævnte produkter er kun til forskning; klinisk nytte er ikke påvist.
    body:
      - type: p
        text: >-
          Den 2. november annoncerede UCL lanceringen af sit spinout Octopath AI med 1,5 millioner pund i startinvestering og tilskud. Ifølge virksomheden tæller og klassificerer Kraken og Nemo celler på almindelige digitale vævssnit. Hjemmesiden viser værktøjer til H&E og immunhistokemi, herunder tumorcellularitet og biomarkørvurdering. UCL angiver et træningssæt med 14,1 millioner mærkede celler fra 14 vævs- og kræfttyper. Det er virksomhedens og universitetets beskrivelser, ikke bevis for bedre patientresultater.
      - type: p
        text: >-
          Der findes publiceret forskning: En efterfølgende analyse af ARISTOTLE-forsøget brugte 414 biopsier fra endetarmskræft før behandling og fandt en sammenhæng mellem AI-målt tumorcelletæthed og forskellige resultater mellem behandlingsgrupper. Forfatterne kalder fundet hypotesegenererende og efterlyser uafhængig retrospektiv og prospektiv afprøvning. Octopath mærker produkterne kun til forskning. Deltagelse i MHRA's regulatoriske sandkasse er ikke en godkendelse. Evalueringslicensen leverer kun eksekverbar kode, udelukker kildekode og patientbehandling og anfører £1 som modydelse; det er ikke en offentlig klinisk prisliste.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) arbejder på et andet trin: Det gratis websted og MIT-licenseret kode bruger indtastet klinisk kontekst, versionerede regler og kildehenvisninger til diskussionsudkast. Det læser ikke vævssnit og erstatter ikke en patolog; meget klinisk indhold mangler fortsat gennemgang. Octopath kan måle vævstræk til senere samtale, mens OpenOnco viser begrundelsen for et udkast. Der er hverken direkte resultat-sammenligning eller påvist overlegenhed. Artiklen anbefaler ikke test eller behandling og erstatter ikke en læge. Kilder kontrolleret 2. november 2026.
  sv:
    title: Octopath AI lanseras för att räkna celler på digitala tumörsnitt
    summary: UCL-avknoppningen fick 1,5 miljoner pund för analys av digitala vävnadssnitt. De angivna produkterna är endast för forskning; klinisk nytta är inte visad.
    body:
      - type: p
        text: >-
          Den 2 november meddelade UCL att avknoppningen Octopath AI lanserats med 1,5 miljoner pund i såddfinansiering och bidrag. Enligt företaget räknar och klassificerar modellerna Kraken och Nemo celler på vanliga digitala vävnadssnitt. Webbplatsen listar verktyg för H&E och immunhistokemi, bland annat tumörcellularitet och biomarkörbedömning. UCL uppger ett träningsmaterial med 14,1 miljoner märkta celler från 14 vävnads- och cancertyper. Det är beskrivningar från företag och universitet, inte bevis för bättre patientutfall.
      - type: p
        text: >-
          Publicerad forskning finns: En efterhandsanalys av ARISTOTLE-studien använde 414 rektalcancerbiopsier tagna före behandling och fann ett samband mellan AI-mätt tumörcelltäthet och olika utfall mellan behandlingsgrupper. Författarna kallar fyndet hypotesgenererande och efterfrågar oberoende retrospektiv och prospektiv prövning. Octopath märker produkterna endast för forskning. Deltagande i MHRA:s regulatoriska testmiljö är inget godkännande. Utvärderingslicensen ger körbar kod, utesluter källkod och patienthantering och anger £1 i ersättning; det är ingen offentlig klinisk prislista.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) arbetar i ett annat steg: Den kostnadsfria webbplatsen och MIT-licensierade koden använder inmatad klinisk kontext, versionshanterade regler och citerade källor för diskussionsutkast. Den läser inte vävnadssnitt och ersätter inte en patolog; mycket kliniskt innehåll behöver ännu granskas. Octopath kan mäta vävnadsegenskaper för senare diskussion, medan OpenOnco visar grunden för ett utkast. Varken direkta utfallsjämförelser eller överlägsenhet är visade. Texten rekommenderar inte test eller behandling och ersätter inte läkare. Källor kontrollerade den 2 november 2026.
  nb:
    title: Octopath AI lanseres for å telle celler på digitale tumorsnitt
    summary: UCL-utspringet fikk 1,5 millioner pund til analyse av digitale vevssnitt. De oppførte produktene er bare til forskning; klinisk nytte er ikke dokumentert.
    body:
      - type: p
        text: >-
          Den 2. november kunngjorde UCL lanseringen av utspringet Octopath AI med 1,5 millioner pund i såkorninvestering og tilskudd. Ifølge selskapet teller og klassifiserer Kraken og Nemo celler på vanlige digitale vevssnitt. Nettstedet viser verktøy for H&E og immunhistokjemi, blant annet tumorcellularitet og biomarkørskåring. UCL oppgir et treningssett med 14,1 millioner merkede celler fra 14 vevs- og krefttyper. Dette er beskrivelser fra selskapet og universitetet, ikke bevis for bedre pasientutfall.
      - type: p
        text: >-
          Publisert forskning finnes: En etteranalyse av ARISTOTLE-studien brukte 414 biopsier fra endetarmskreft før behandling og fant en sammenheng mellom KI-målt tumorcelletetthet og ulike resultater mellom behandlingsgrupper. Forfatterne kaller funnet hypotesedannende og ber om uavhengig retrospektiv og prospektiv vurdering. Octopath merker produktene kun for forskning. Deltakelse i MHRAs regulatoriske sandkasse er ingen godkjenning. Evalueringslisensen leverer kjørbar kode, utelukker kildekode og pasientbehandling og angir £1 i vederlag; dette er ingen offentlig klinisk prisliste.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) arbeider på et annet trinn: Det gratis nettstedet og MIT-lisensiert kode bruker inntastet klinisk kontekst, versjonerte regler og kildehenvisninger for diskusjonsutkast. Det leser ikke vevssnitt og erstatter ikke en patolog; mye klinisk innhold trenger fortsatt gjennomgang. Octopath kan måle vevstrekk for senere diskusjon, mens OpenOnco viser begrunnelsen for et utkast. Verken direkte sammenligning av utfall eller overlegenhet er vist. Artikkelen anbefaler ikke test eller behandling og erstatter ikke lege. Kilder kontrollert 2. november 2026.
  fi:
    title: Octopath AI aloittaa solujen laskennan digitaalisista kasvainleikkeistä
    summary: UCL:n spinout sai 1,5 miljoonaa puntaa digitaalisten kudosleikkeiden analyysiin. Luetellut tuotteet ovat vain tutkimuskäyttöön; kliinistä hyötyä ei ole osoitettu.
    body:
      - type: p
        text: >-
          UCL ilmoitti 2. marraskuuta Octopath AI -spinoutin käynnistymisestä 1,5 miljoonan punnan siemenrahoituksella ja apurahoilla. Yrityksen mukaan Kraken ja Nemo laskevat ja luokittelevat soluja tavanomaisista digitaalisista kudosleikkeistä. Sivusto esittelee H&E- ja immunohistokemiallisia työkaluja, muun muassa kasvaimen solupitoisuuden ja biomarkkerien arviointiin. UCL:n mukaan koulutusaineistossa on 14,1 miljoonaa merkittyä solua 14 kudos- ja syöpätyypistä. Nämä ovat yrityksen ja yliopiston kuvauksia, eivät näyttöä paremmista potilastuloksista.
      - type: p
        text: >-
          Julkaistua tutkimusta on: ARISTOTLE-tutkimuksen jälkianalyysissa käytettiin 414 ennen hoitoa otettua peräsuolisyöpäbiopsiaa ja havaittiin yhteys tekoälyn mittaaman kasvainsolutiheyden ja hoitoryhmien erilaisten tulosten välillä. Tekijät pitävät löydöstä hypoteesia luovana ja pyytävät riippumatonta takautuvaa ja etenevää arviointia. Octopath merkitsee tuotteensa vain tutkimuskäyttöön. Osallistuminen MHRA:n sääntelykokeiluun ei ole hyväksyntä. Arviointilisenssi tarjoaa suoritettavan koodin, sulkee pois lähdekoodin ja potilaiden hoitokäytön sekä mainitsee £1:n vastikkeen; tämä ei ole julkinen kliininen hinnasto.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) toimii eri vaiheessa: Maksuton sivusto ja MIT-lisensoitu koodi käyttävät syötettyä kliinistä tietoa, versioituja sääntöjä ja lähdeviitteitä keskusteluluonnosten laatimiseen. Se ei tulkitse kudosleikkeitä eikä korvaa patologia; suuri osa kliinisestä sisällöstä odottaa vielä tarkistusta. Octopath voi mitata kudoksen piirteitä myöhempää keskustelua varten, kun OpenOnco näyttää luonnoksen perustelut. Suoraa tulosvertailua tai paremmuutta ei ole osoitettu. Teksti ei suosittele tutkimusta tai hoitoa eikä korvaa lääkäriä. Lähteet tarkistettu 2. marraskuuta 2026.
