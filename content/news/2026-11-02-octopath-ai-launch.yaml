slug: octopath-ai-launch
date: 2026-11-02
published: 2026-11-02
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, digital-pathology, artificial-intelligence, research]
title:
  en: Octopath AI launches to count cells on cancer slides
  uk: Octopath AI запускається для підрахунку клітин на цифрових зображеннях пухлин
summary:
  en: The UCL spinout raised £1.5 million for slide-analysis tools. Its listed products remain research-use-only; clinical benefit is unproven.
  uk: Стартап із UCL залучив 1,5 млн фунтів на аналіз цифрових гістологічних препаратів. Заявлені продукти поки лише для досліджень; клінічної користі не доведено.
