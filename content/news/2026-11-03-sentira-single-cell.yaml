slug: sentira-single-cell
date: 2026-11-03
published: 2026-11-03
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup-watch, single-cell, cancer-research, artificial-intelligence]
title:
  en: "Sentira Single Cell: an AI notebook for research, not a tumour-board verdict"
  uk: "Sentira Single Cell: ШІ-нотатник для досліджень, а не висновок онкоконсиліуму"
summary:
  en: 10x Genomics launched a cloud tool for exploring single-cell data. Its auditable notebook is useful to researchers, but clinical benefit has not been established.
  uk: 10x Genomics запустила хмарний інструмент для аналізу даних окремих клітин. Дослідникам доступний перевірюваний нотатник, але клінічну користь не доведено.
sources:
  - citation: "10x Genomics. Sentira Single Cell commercial launch, 2 November 2026. Checked 3 November 2026."
    id: https://www.prnewswire.com/news-releases/10x-genomics-launches-sentira-single-cell-a-new-agentic-ai-experience-for-chromium-analysis-302925391.html
  - citation: "10x Genomics. Sentira Single Cell user guide and research workflow. Checked 3 November 2026."
    id: https://www.10xgenomics.com/support/software/sentira/latest/getting-started
  - citation: "10x Genomics. Sentira cloud billing and credits. Checked 3 November 2026."
    id: https://www.10xgenomics.com/support/software/sentira/latest/miscellaneous/billing
  - citation: "10x Genomics. Cloud Services Terms, updated 29 October 2026. Checked 3 November 2026."
    id: https://www.10xgenomics.com/legal/cloud-terms-of-use
  - citation: "OpenOnco. Public capabilities, clinical-review status and MIT licence. Checked 3 November 2026."
    id: https://github.com/romeo111/OpenOnco/blob/f5e36cc838/README.md
body:
  en:
    - type: p
      text: >-
        On 2 November, 10x Genomics announced the commercial launch of Sentira Single Cell. Researchers can upload Chromium single-cell data and ask questions in ordinary language. The AI proposes an analysis plan for review, runs it in 10x Cloud and returns an editable notebook containing methods and code. That record is valuable for checking an analysis; it does not establish that the answer is biologically correct. The announcement includes a comment from a Dana-Farber cancer researcher, but reports no clinical trial or patient-outcome comparison.
    - type: p
      text: >-
        Sentira is a research workflow for uploaded laboratory data, with promotional credits followed by usage-based cloud charges. Its cloud terms restrict use to research rather than diagnosis. We found no public source-code licence for the Sentira application in the checked product documentation; an editable output notebook is not the same as an open-source service. Independent evidence that this launch improves cancer diagnosis, treatment choices or survival was not provided. The AI may help frame hypotheses, which still need human and experimental scrutiny.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) works at a different step: its free public site and MIT-licensed code use entered clinical context, versioned rules and cited sources to draft discussion paths. It does not analyse single-cell files, and much clinical content still awaits review. A laboratory might use Sentira to explore cell populations and OpenOnco to inspect the basis of a separate clinical discussion; neither product has shown superiority in a direct comparison. This article offers no individual treatment advice and does not replace a doctor. Sources checked 3 November 2026.
  uk:
    - type: p
      text: >-
        2 листопада 10x Genomics оголосила про комерційний запуск Sentira Single Cell. Дослідники можуть завантажити дані окремих клітин, отримані на платформі Chromium, і ставити запитання звичайною мовою. ШІ пропонує план аналізу для перевірки, виконує його в 10x Cloud і повертає редагований нотатник із методами та кодом. Такий запис допомагає перевіряти аналіз, але не доводить біологічної правильності висновку. У повідомленні наведено коментар дослідника раку з Dana-Farber, проте немає клінічного випробування чи порівняння результатів лікування пацієнтів.
    - type: p
      text: >-
        Sentira — дослідницький процес для завантажених лабораторних даних: після промокредитів діє оплата за використання хмари. Умови хмарного сервісу обмежують застосування дослідженнями, а не діагностикою. У перевіреній документації продукту ми не знайшли публічної ліцензії на вихідний код застосунку Sentira; редагований нотатник із результатом не робить сам сервіс відкритим. Незалежних доказів того, що цей запуск покращує діагностику раку, вибір лікування чи виживаність, не наведено. Гіпотези ШІ потребують перевірки людьми та експериментами.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) працює на іншому етапі: його безкоштовний сайт і код за ліцензією MIT використовують введений клінічний контекст, версійні правила та цитовані джерела для чернеток шляхів обговорення. Він не аналізує файли окремих клітин, а значна частина клінічного вмісту ще чекає рецензування. Лабораторія може досліджувати клітинні популяції в Sentira, а підстави окремої клінічної дискусії переглядати в OpenOnco; перевагу жодного продукту в прямому порівнянні не доведено. Стаття не дає індивідуальних порад щодо лікування й не замінює лікаря. Джерела перевірено 3 листопада 2026 року.
translations:
  es:
    title: "Sentira Single Cell: un cuaderno de IA para investigación, no un dictamen clínico"
    summary: 10x Genomics lanzó una herramienta en la nube para explorar datos de células individuales. El cuaderno permite revisar el análisis, pero no se ha demostrado beneficio clínico.
    body:
      - type: p
        text: >-
          El 2 de noviembre, 10x Genomics anunció el lanzamiento comercial de Sentira Single Cell. Los investigadores pueden cargar datos de células individuales de Chromium y formular preguntas en lenguaje corriente. La IA propone un plan para revisión, lo ejecuta en 10x Cloud y devuelve un cuaderno editable con métodos y código. Ese registro ayuda a comprobar el análisis, pero no demuestra que la conclusión biológica sea correcta. El comunicado cita a un investigador oncológico de Dana-Farber, sin presentar un ensayo clínico ni una comparación de resultados en pacientes.
      - type: p
        text: >-
          Sentira sirve para investigar datos de laboratorio cargados en la nube: tras los créditos promocionales, se cobra según el uso. Las condiciones del servicio limitan su aplicación a la investigación, no al diagnóstico. En la documentación consultada no encontramos una licencia pública del código fuente de la aplicación Sentira; un cuaderno de resultados editable no convierte el servicio en software abierto. No se aportaron pruebas independientes de mejoras en el diagnóstico del cáncer, las decisiones terapéuticas o la supervivencia. Las hipótesis de la IA requieren revisión humana y experimental.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) aborda otra etapa: su web gratuita y su código con licencia MIT usan contexto clínico introducido, reglas versionadas y fuentes citadas para elaborar borradores de discusión. No analiza archivos de células individuales y gran parte de su contenido clínico aún requiere revisión. Un laboratorio podría explorar poblaciones celulares con Sentira y consultar en OpenOnco las bases de otra discusión clínica; ninguno ha demostrado superioridad en una comparación directa. Este artículo no ofrece consejos terapéuticos individuales ni sustituye al médico. Fuentes verificadas el 3 de noviembre de 2026.
  pt:
    title: "Sentira Single Cell: um caderno de IA para investigação, não um parecer clínico"
    summary: A 10x Genomics lançou uma ferramenta na nuvem para explorar dados de células individuais. O caderno permite rever a análise, mas não há benefício clínico demonstrado.
    body:
      - type: p
        text: >-
          Em 2 de novembro, a 10x Genomics anunciou o lançamento comercial do Sentira Single Cell. Investigadores podem carregar dados de células individuais do Chromium e fazer perguntas em linguagem corrente. A IA propõe um plano para revisão, executa-o na 10x Cloud e devolve um caderno editável com métodos e código. Esse registo permite verificar a análise, mas não prova que a conclusão biológica esteja correta. O comunicado cita um investigador de cancro da Dana-Farber, sem apresentar ensaio clínico nem comparação de resultados em doentes.
      - type: p
        text: >-
          O Sentira destina-se à investigação com dados laboratoriais carregados na nuvem: depois dos créditos promocionais, a utilização é paga. Os termos do serviço restringem o uso à investigação, não ao diagnóstico. Na documentação consultada não encontrámos uma licença pública para o código-fonte da aplicação Sentira; um caderno de resultados editável não torna o serviço de código aberto. Não foram apresentados dados independentes de melhoria no diagnóstico do cancro, nas escolhas terapêuticas ou na sobrevivência. As hipóteses da IA exigem avaliação humana e experimental.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) atua noutra etapa: o sítio gratuito e o código com licença MIT usam contexto clínico introduzido, regras com versões e fontes citadas para criar rascunhos de discussão. Não analisa ficheiros de células individuais e muito conteúdo clínico ainda aguarda revisão. Um laboratório pode explorar populações celulares no Sentira e consultar no OpenOnco as bases de outra discussão clínica; nenhum demonstrou superioridade numa comparação direta. Este artigo não dá conselhos terapêuticos individuais nem substitui um médico. Fontes verificadas em 3 de novembro de 2026.
  de:
    title: "Sentira Single Cell: KI-Notizbuch für Forschung, kein Tumorboard-Urteil"
    summary: 10x Genomics startet ein Cloud-Werkzeug zur Analyse einzelner Zellen. Das bearbeitbare Notizbuch erleichtert die Prüfung, ein klinischer Nutzen ist nicht belegt.
    body:
      - type: p
        text: >-
          Am 2. November kündigte 10x Genomics den kommerziellen Start von Sentira Single Cell an. Forschende können Chromium-Einzelzelldaten hochladen und Fragen in Alltagssprache stellen. Die KI schlägt einen zu prüfenden Analyseplan vor, führt ihn in der 10x Cloud aus und liefert ein bearbeitbares Notizbuch mit Methoden und Code. Das erleichtert die Kontrolle der Analyse, beweist aber nicht, dass die biologische Schlussfolgerung richtig ist. Die Mitteilung zitiert einen Krebsforscher von Dana-Farber, enthält jedoch weder eine klinische Studie noch einen Vergleich von Behandlungsergebnissen.
      - type: p
        text: >-
          Sentira ist ein Forschungsablauf für hochgeladene Labordaten: Nach Aktionsguthaben fallen nutzungsabhängige Cloud-Kosten an. Die Vertragsbedingungen beschränken die Nutzung auf Forschung statt Diagnostik. In der geprüften Dokumentation fanden wir keine öffentliche Quellcodelizenz für die Sentira-Anwendung; ein bearbeitbares Ergebnisnotizbuch macht den Dienst nicht quelloffen. Unabhängige Belege für bessere Krebsdiagnostik, Therapieentscheidungen oder Überlebenschancen wurden nicht vorgelegt. KI-Hypothesen benötigen menschliche und experimentelle Prüfung.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) setzt an anderer Stelle an: Die kostenlose Website und der MIT-lizenzierte Code erstellen mit eingegebenem klinischem Kontext, versionierten Regeln und zitierten Quellen Diskussionsentwürfe. Einzelzelldateien analysiert das Projekt nicht; viele klinische Inhalte müssen noch geprüft werden. Ein Labor könnte mit Sentira Zellpopulationen untersuchen und mit OpenOnco die Grundlagen einer anderen klinischen Diskussion prüfen. Eine Überlegenheit in einem direkten Vergleich ist für keines der Produkte belegt. Dieser Text gibt keine individuelle Therapieempfehlung und ersetzt keinen Arzt. Quellen geprüft am 3. November 2026.
  fr:
    title: "Sentira Single Cell : un carnet d'IA pour la recherche, pas un avis de concertation"
    summary: 10x Genomics lance un outil cloud pour explorer les données unicellulaires. Son carnet modifiable facilite la vérification, mais aucun bénéfice clinique n'est démontré.
    body:
      - type: p
        text: >-
          Le 2 novembre, 10x Genomics a annoncé le lancement commercial de Sentira Single Cell. Les chercheurs peuvent charger des données unicellulaires Chromium et poser des questions en langage courant. L'IA propose un plan à examiner, l'exécute dans 10x Cloud et rend un carnet modifiable contenant méthodes et code. Cette trace facilite le contrôle de l'analyse sans prouver la justesse biologique de la conclusion. Le communiqué cite un chercheur en oncologie de Dana-Farber, mais ne présente ni essai clinique ni comparaison des résultats des patients.
      - type: p
        text: >-
          Sentira sert à étudier des données de laboratoire chargées dans le cloud : après les crédits promotionnels, la facturation dépend de l'usage. Les conditions du service limitent l'utilisation à la recherche, et non au diagnostic. Nous n'avons trouvé aucune licence publique du code source de l'application Sentira dans la documentation examinée ; un carnet de résultats modifiable ne rend pas le service libre. Aucune preuve indépendante d'une amélioration du diagnostic du cancer, des choix thérapeutiques ou de la survie n'a été fournie. Les hypothèses de l'IA exigent un contrôle humain et expérimental.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) intervient à une autre étape : son site gratuit et son code sous licence MIT utilisent le contexte clinique saisi, des règles versionnées et des sources citées pour produire des pistes de discussion. Il n'analyse pas les fichiers unicellulaires et une grande partie de son contenu clinique reste à vérifier. Un laboratoire pourrait explorer les populations cellulaires avec Sentira et examiner dans OpenOnco les bases d'une autre discussion clinique ; aucune supériorité n'est établie par comparaison directe. Ce texte ne donne pas de conseil thérapeutique individuel et ne remplace pas un médecin. Sources vérifiées le 3 novembre 2026.
  it:
    title: "Sentira Single Cell: un quaderno IA per la ricerca, non un verdetto clinico"
    summary: 10x Genomics lancia uno strumento cloud per esplorare dati di singole cellule. Il quaderno modificabile aiuta la verifica, ma il beneficio clinico non è dimostrato.
    body:
      - type: p
        text: >-
          Il 2 novembre 10x Genomics ha annunciato il lancio commerciale di Sentira Single Cell. I ricercatori possono caricare dati di singole cellule Chromium e porre domande in linguaggio comune. L'IA propone un piano da esaminare, lo esegue in 10x Cloud e restituisce un quaderno modificabile con metodi e codice. Questa traccia aiuta a controllare l'analisi, ma non dimostra che la conclusione biologica sia corretta. Il comunicato cita un ricercatore oncologico del Dana-Farber, senza presentare uno studio clinico né un confronto degli esiti dei pazienti.
      - type: p
        text: >-
          Sentira è destinato alla ricerca su dati di laboratorio caricati nel cloud: esauriti i crediti promozionali, si paga in base all'uso. Le condizioni del servizio ne limitano l'impiego alla ricerca, non alla diagnosi. Nella documentazione esaminata non abbiamo trovato una licenza pubblica del codice sorgente dell'applicazione Sentira; un quaderno di risultati modificabile non rende aperto il servizio. Non sono state fornite prove indipendenti di miglioramenti nella diagnosi oncologica, nelle scelte terapeutiche o nella sopravvivenza. Le ipotesi dell'IA richiedono verifica umana e sperimentale.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) opera in un'altra fase: il sito gratuito e il codice con licenza MIT usano il contesto clinico inserito, regole versionate e fonti citate per preparare bozze di discussione. Non analizza file di singole cellule e molti contenuti clinici attendono ancora revisione. Un laboratorio potrebbe esplorare popolazioni cellulari con Sentira ed esaminare in OpenOnco le basi di un'altra discussione clinica; nessuno dei due ha dimostrato superiorità in un confronto diretto. Questo articolo non dà consigli terapeutici individuali e non sostituisce un medico. Fonti verificate il 3 novembre 2026.
  da:
    title: "Sentira Single Cell: en AI-notesbog til forskning, ikke en klinisk konklusion"
    summary: 10x Genomics lancerer et cloudværktøj til at udforske enkeltcelledata. Den redigerbare notesbog hjælper med kontrol, men klinisk gevinst er ikke påvist.
    body:
      - type: p
        text: >-
          Den 2. november annoncerede 10x Genomics den kommercielle lancering af Sentira Single Cell. Forskere kan uploade Chromium-enkeltcelledata og stille spørgsmål i almindeligt sprog. AI foreslår en analyseplan til gennemgang, udfører den i 10x Cloud og leverer en redigerbar notesbog med metoder og kode. Det gør analysen lettere at kontrollere, men beviser ikke, at den biologiske konklusion er korrekt. Meddelelsen citerer en kræftforsker fra Dana-Farber, men indeholder hverken et klinisk forsøg eller en sammenligning af patientresultater.
      - type: p
        text: >-
          Sentira er til forskning i uploadede laboratoriedata: Efter introduktionskreditter betales der efter cloudforbrug. Tjenestens vilkår begrænser brugen til forskning, ikke diagnostik. Vi fandt ingen offentlig kildekodelicens til Sentira-applikationen i den gennemgåede dokumentation; en redigerbar resultatnotesbog gør ikke selve tjenesten open source. Der blev ikke fremlagt uafhængig dokumentation for bedre kræftdiagnostik, behandlingsvalg eller overlevelse. AI-hypoteser kræver menneskelig og eksperimentel kontrol.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) arbejder på et andet trin: Det gratis website og den MIT-licenserede kode bruger indtastet klinisk kontekst, versionsstyrede regler og citerede kilder til udkast til drøftelse. Det analyserer ikke enkeltcellefiler, og meget klinisk indhold mangler stadig gennemgang. Et laboratorium kan undersøge cellepopulationer med Sentira og kontrollere grundlaget for en anden klinisk drøftelse i OpenOnco; ingen af produkterne har vist overlegenhed i en direkte sammenligning. Artiklen giver ikke individuel behandlingsrådgivning og erstatter ikke en læge. Kilder kontrolleret 3. november 2026.
  sv:
    title: "Sentira Single Cell: en AI-anteckningsbok för forskning, inte ett kliniskt utlåtande"
    summary: 10x Genomics lanserar ett molnverktyg för att utforska encellsdata. Den redigerbara anteckningsboken underlättar granskning, men klinisk nytta är inte visad.
    body:
      - type: p
        text: >-
          Den 2 november tillkännagav 10x Genomics den kommersiella lanseringen av Sentira Single Cell. Forskare kan ladda upp Chromium-encellsdata och ställa frågor på vanligt språk. AI föreslår en analysplan för granskning, kör den i 10x Cloud och lämnar en redigerbar anteckningsbok med metoder och kod. Det gör analysen lättare att kontrollera men bevisar inte att den biologiska slutsatsen är korrekt. Pressmeddelandet citerar en cancerforskare vid Dana-Farber men redovisar varken en klinisk prövning eller en jämförelse av patientutfall.
      - type: p
        text: >-
          Sentira är ett forskningsflöde för uppladdade laboratoriedata: Efter introduktionskrediter tas användningsbaserade molnavgifter ut. Tjänstevillkoren begränsar användningen till forskning, inte diagnostik. Vi fann ingen offentlig källkodslicens för Sentira-applikationen i den granskade dokumentationen; en redigerbar resultatanteckningsbok gör inte tjänsten öppen källkod. Oberoende belägg för bättre cancerdiagnostik, behandlingsval eller överlevnad presenterades inte. AI-hypoteser kräver mänsklig och experimentell granskning.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) verkar i ett annat steg: Den kostnadsfria webbplatsen och den MIT-licensierade koden använder angiven klinisk kontext, versionshanterade regler och citerade källor för utkast till diskussion. Den analyserar inte encellsfiler och mycket kliniskt innehåll återstår att granska. Ett laboratorium kan undersöka cellpopulationer med Sentira och granska grunden för en annan klinisk diskussion i OpenOnco; ingetdera har visat överlägsenhet i en direkt jämförelse. Artikeln ger inga individuella behandlingsråd och ersätter inte en läkare. Källor kontrollerade 3 november 2026.
  nb:
    title: "Sentira Single Cell: en KI-notatbok for forskning, ikke en klinisk konklusjon"
    summary: 10x Genomics lanserer et skyverktøy for å utforske enkeltcelledata. Den redigerbare notatboken gjør kontroll mulig, men klinisk nytte er ikke påvist.
    body:
      - type: p
        text: >-
          Den 2. november kunngjorde 10x Genomics den kommersielle lanseringen av Sentira Single Cell. Forskere kan laste opp Chromium-enkeltcelledata og stille spørsmål på vanlig språk. KI foreslår en analyseplan til gjennomgang, kjører den i 10x Cloud og leverer en redigerbar notatbok med metoder og kode. Det gjør analysen lettere å kontrollere, men beviser ikke at den biologiske konklusjonen er riktig. Pressemeldingen siterer en kreftforsker fra Dana-Farber, men presenterer verken en klinisk studie eller en sammenligning av pasientutfall.
      - type: p
        text: >-
          Sentira er et forskningsverktøy for opplastede laboratoriedata: Etter introduksjonskreditter betaler man etter skybruk. Tjenestevilkårene begrenser bruken til forskning, ikke diagnostikk. Vi fant ingen offentlig kildekodelisens for Sentira-applikasjonen i dokumentasjonen vi undersøkte; en redigerbar resultatnotatbok gjør ikke selve tjenesten til åpen kildekode. Uavhengige bevis for bedre kreftdiagnostikk, behandlingsvalg eller overlevelse ble ikke lagt frem. KI-hypoteser trenger menneskelig og eksperimentell kontroll.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) brukes på et annet trinn: Det gratis nettstedet og den MIT-lisensierte koden bruker innlagt klinisk kontekst, versjonerte regler og siterte kilder til diskusjonsutkast. Det analyserer ikke enkeltcellefiler, og mye klinisk innhold venter fortsatt på gjennomgang. Et laboratorium kan utforske cellepopulasjoner med Sentira og undersøke grunnlaget for en annen klinisk diskusjon i OpenOnco; ingen av dem har vist overlegenhet i en direkte sammenligning. Artikkelen gir ikke individuelle behandlingsråd og erstatter ikke en lege. Kilder kontrollert 3. november 2026.
  fi:
    title: "Sentira Single Cell: tekoälymuistikirja tutkimukseen, ei hoitopäätös"
    summary: 10x Genomics julkaisi pilvityökalun yksittäisten solujen datan tutkimiseen. Muokattava muistikirja helpottaa tarkistusta, mutta kliinistä hyötyä ei ole osoitettu.
    body:
      - type: p
        text: >-
          10x Genomics ilmoitti Sentira Single Cellin kaupallisesta julkaisusta 2. marraskuuta. Tutkijat voivat ladata Chromiumin yksittäisten solujen dataa ja esittää kysymyksiä tavallisella kielellä. Tekoäly ehdottaa tarkistettavaa analyysisuunnitelmaa, suorittaa sen 10x Cloudissa ja palauttaa muokattavan muistikirjan, jossa ovat menetelmät ja koodi. Tämä auttaa tarkistamaan analyysin mutta ei todista biologisen päätelmän oikeellisuutta. Tiedotteessa lainataan Dana-Farberin syöpätutkijaa, mutta siinä ei esitetä kliinistä koetta eikä potilastulosten vertailua.
      - type: p
        text: >-
          Sentira on ladattujen laboratoriotietojen tutkimiseen tarkoitettu työnkulku: Alkuhyvitysten jälkeen pilven käytöstä veloitetaan kulutuksen mukaan. Palveluehdot rajaavat käytön tutkimukseen, eivät diagnostiikkaan. Tarkistamastamme dokumentaatiosta emme löytäneet julkista lähdekoodilisenssiä Sentira-sovellukselle; muokattava tulosmuistikirja ei tee palvelusta avointa lähdekoodia. Riippumatonta näyttöä syöpädiagnostiikan, hoitovalintojen tai eloonjäämisen paranemisesta ei esitetty. Tekoälyn hypoteesit vaativat ihmisten ja kokeiden tekemää tarkistusta.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) toimii eri vaiheessa: Maksuton verkkosivusto ja MIT-lisensoitu koodi käyttävät syötettyä kliinistä kontekstia, versioituja sääntöjä ja viitattuja lähteitä keskusteluluonnosten laatimiseen. Se ei analysoi yksittäisten solujen tiedostoja, ja suuri osa kliinisestä sisällöstä odottaa vielä tarkistusta. Laboratorio voisi tutkia solupopulaatioita Sentiralla ja tarkastella erillisen kliinisen keskustelun perusteita OpenOncossa; kummankaan paremmuutta ei ole osoitettu suorassa vertailussa. Artikkeli ei anna yksilöllisiä hoito-ohjeita eikä korvaa lääkäriä. Lähteet tarkistettu 3. marraskuuta 2026.
