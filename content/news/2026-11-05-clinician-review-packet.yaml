    id: https://github.com/romeo111/OpenOnco/blob/ec0f1ce4d0/scripts/review_assets/review.js
body:
  en:
    - type: p
      text: >-
        The [DLBCL first-line review packet](/review/dlbcl-1l/) lets a clinician inspect 26 synthetic scenarios rather than a polished screenshot. Each case links to its invented input, the actual generated plan and the decision trace. The index groups cases by questions such as missing data, eligibility and organ function. These are examples for finding mistakes, not patient records.
    - type: p
      text: >-
        Imagine reviewing a fictional case with an unknown CD20 result. Open its input and output, check what the engine did with the unknown value, then mark the scenario “needs changes” and explain why. Comments stay in this browser; **Export my review (JSON)** downloads a copy. The packet itself is currently in English. No feedback is uploaded automatically, and a browser note is not a clinical sign-off.
    - type: p
      text: >-
        The page explicitly says independent clinician review is pending. Its 109 engineering checks show that technical contracts passed, not that every clinical route is correct. The packet records seven targeted input findings to examine. Use only invented cases here; no treatment decision should rely on this review packet. This article does not replace a doctor. Feature and sources checked 5 November 2026.
  uk:
    - type: p
      text: >-
        [Пакет рецензування першої лінії ДВКЛ](/review/dlbcl-1l/) дає лікареві змогу перевірити 26 вигаданих сценаріїв замість відшліфованого знімка екрана. Для кожного випадку доступні вигадані вхідні дані, фактично створений план і хід рішення. Сценарії згруповано за питаннями, зокрема браком даних, відповідністю умовам і функцією органів. Це приклади для пошуку помилок, а не медичні записи пацієнтів.
    - type: p
      text: >-
        Уявімо вигаданий випадок із невідомим результатом CD20. Відкрийте вхідні дані й результат, перевірте, як система опрацювала невідоме значення, позначте сценарій «потребує змін» і поясніть чому. Коментарі залишаються в цьому браузері; кнопка **Export my review (JSON)** завантажує копію. Сам пакет наразі англомовний. Відгук не завантажується на сервер автоматично, а запис у браузері не є клінічним затвердженням.
    - type: p
      text: >-
        На сторінці прямо зазначено, що незалежне клінічне рецензування ще очікується. Її 109 інженерних перевірок свідчать про виконання технічних умов, а не про правильність кожного клінічного маршруту. Пакет також містить сім цільових знахідок щодо вхідних даних для розгляду. Використовуйте тут лише вигадані випадки; рішення про лікування не можна ґрунтувати на цьому пакеті. Стаття не замінює лікаря. Функцію й джерела перевірено 5 листопада 2026 року.
translations:
  es:
    title: "Abra un borrador real, examine su trazado y deje una revisión"
    summary: El paquete de revisión de LDCBG muestra 26 casos ficticios con entradas, planes generados y trazas de decisión; los comentarios permanecen en el navegador hasta su exportación.
    body:
      - type: p
        text: >-
          El [paquete de revisión de primera línea de LDCBG](/review/dlbcl-1l/) permite al profesional examinar 26 casos ficticios, no solo una captura preparada. Cada caso enlaza su entrada inventada, el plan realmente generado y la traza de decisión. El índice agrupa casos por cuestiones como datos ausentes, elegibilidad y función orgánica. Son ejemplos para detectar errores, no historias clínicas.
      - type: p
        text: >-
          Imagine un caso ficticio con un resultado CD20 desconocido. Abra la entrada y la salida, compruebe cómo trató el sistema ese valor, marque «necesita cambios» y explique por qué. Los comentarios quedan en este navegador; **Export my review (JSON)** descarga una copia. El paquete está actualmente en inglés. No se envían comentarios automáticamente y una nota del navegador no constituye aprobación clínica.
      - type: p
        text: >-
          La página indica que falta revisión clínica independiente. Sus 109 controles de ingeniería acreditan requisitos técnicos, no la corrección de cada ruta clínica. El paquete señala siete hallazgos concretos sobre los datos de entrada para examinar. Use solo casos inventados; ninguna decisión terapéutica debe basarse en este paquete. El artículo no sustituye al médico. Función y fuentes verificadas el 5 de noviembre de 2026.
  pt:
    title: "Abra um rascunho real, examine o percurso da decisão e deixe uma revisão"
    summary: O pacote de revisão de LDGCB apresenta 26 cenários fictícios com dados, planos e percursos de decisão; os comentários ficam no navegador até serem exportados.
    body:
      - type: p
        text: >-
          O [pacote de revisão da primeira linha de LDGCB](/review/dlbcl-1l/) permite ao clínico examinar 26 cenários fictícios, em vez de uma imagem preparada. Cada caso liga aos dados inventados, ao plano efetivamente gerado e ao percurso da decisão. O índice agrupa casos por questões como dados em falta, elegibilidade e função dos órgãos. São exemplos para encontrar erros, não registos de doentes.
      - type: p
        text: >-
          Imagine um caso fictício com resultado CD20 desconhecido. Abra os dados e o resultado, verifique como o sistema tratou esse valor, assinale «precisa de alterações» e explique porquê. Os comentários ficam neste navegador; **Export my review (JSON)** descarrega uma cópia. O pacote está atualmente em inglês. Nenhum comentário é enviado automaticamente e uma nota no navegador não equivale a aprovação clínica.
      - type: p
        text: >-
          A página indica que a revisão clínica independente está pendente. As 109 verificações de engenharia confirmam requisitos técnicos, não a correção de cada percurso clínico. O pacote assinala sete problemas específicos dos dados de entrada para análise. Use apenas casos inventados; nenhuma decisão terapêutica deve apoiar-se neste pacote. Este artigo não substitui um médico. Função e fontes verificadas em 5 de novembro de 2026.
  de:
    title: "Einen echten Entwurf öffnen, die Entscheidungsspur prüfen, Rückmeldung geben"
    summary: Das DLBCL-Prüfpaket zeigt 26 erfundene Szenarien mit Eingaben, erzeugten Plänen und Entscheidungsspuren; Rückmeldungen bleiben bis zum Export im Browser.
    body:
      - type: p
        text: >-
          Das [Prüfpaket zur DLBCL-Erstlinie](/review/dlbcl-1l/) lässt Fachleute 26 erfundene Szenarien statt eines vorbereiteten Screenshots prüfen. Jeder Fall verlinkt auf die erfundenen Eingaben, den tatsächlich erzeugten Plan und die Entscheidungsspur. Der Index gruppiert Fälle etwa nach fehlenden Daten, Eignung und Organfunktion. Es sind Beispiele zur Fehlersuche, keine Patientenakten.
      - type: p
        text: >-
          Stellen Sie sich einen erfundenen Fall mit unbekanntem CD20-Ergebnis vor. Öffnen Sie Eingabe und Ausgabe, prüfen Sie den Umgang mit dem unbekannten Wert, markieren Sie „Änderungen nötig“ und begründen Sie dies. Kommentare bleiben in diesem Browser; **Export my review (JSON)** lädt eine Kopie herunter. Das Paket ist derzeit englischsprachig. Nichts wird automatisch hochgeladen, und eine Browsernotiz ist keine klinische Freigabe.
      - type: p
        text: >-
          Die Seite erklärt ausdrücklich, dass eine unabhängige klinische Prüfung aussteht. Die 109 technischen Prüfungen belegen bestandene technische Anforderungen, nicht die Richtigkeit jedes klinischen Wegs. Sieben gezielte Befunde zu den Eingaben sind zur Prüfung vermerkt. Verwenden Sie nur erfundene Fälle; Therapieentscheidungen dürfen nicht auf diesem Paket beruhen. Der Artikel ersetzt keinen Arzt. Funktion und Quellen geprüft am 5. November 2026.
  fr:
    title: "Ouvrir un vrai brouillon, examiner sa trace, laisser un avis"
    summary: Le dossier de revue du LDGCB expose 26 scénarios fictifs avec données, plans produits et traces de décision ; les commentaires restent dans le navigateur jusqu'à l'export.
    body:
      - type: p
        text: >-
          Le [dossier de revue du traitement initial du LDGCB](/review/dlbcl-1l/) permet aux cliniciens d'examiner 26 scénarios fictifs plutôt qu'une capture préparée. Chaque cas donne accès aux données inventées, au plan réellement produit et à la trace de décision. L'index regroupe les cas selon les données manquantes, l'éligibilité ou la fonction des organes. Ce sont des exemples pour repérer les erreurs, pas des dossiers de patients.
      - type: p
        text: >-
          Imaginez un cas fictif avec un résultat CD20 inconnu. Ouvrez les données et la sortie, vérifiez le traitement de cette inconnue, choisissez « modifications nécessaires » et expliquez pourquoi. Les commentaires restent dans ce navigateur ; **Export my review (JSON)** télécharge une copie. Le dossier est actuellement en anglais. Rien n'est envoyé automatiquement et une note dans le navigateur ne vaut pas validation clinique.
      - type: p
        text: >-
          La page précise qu'une revue clinique indépendante est encore attendue. Ses 109 contrôles techniques attestent des exigences techniques, pas de la justesse de chaque parcours clinique. Sept constats ciblés concernant les données d'entrée sont signalés pour examen. N'utilisez que des cas fictifs ; aucune décision thérapeutique ne doit reposer sur ce dossier. Ce texte ne remplace pas un médecin. Fonction et sources vérifiées le 5 novembre 2026.
  it:
    title: "Apri una bozza reale, esamina la traccia e lascia una valutazione"
    summary: Il pacchetto di revisione del DLBCL mostra 26 scenari fittizi con dati, piani generati e tracce decisionali; i commenti restano nel browser fino all'esportazione.
    body:
      - type: p
        text: >-
          Il [pacchetto di revisione della prima linea per DLBCL](/review/dlbcl-1l/) permette ai clinici di esaminare 26 scenari fittizi anziché un'immagine preparata. Ogni caso collega i dati inventati, il piano effettivamente generato e la traccia decisionale. L'indice raggruppa casi per dati mancanti, idoneità e funzione d'organo. Sono esempi per individuare errori, non cartelle cliniche.
      - type: p
        text: >-
          Immagini un caso fittizio con risultato CD20 sconosciuto. Apra dati e risultato, verifichi come il sistema ha gestito l'incertezza, selezioni «richiede modifiche» e spieghi perché. I commenti restano in questo browser; **Export my review (JSON)** ne scarica una copia. Il pacchetto è attualmente in inglese. Nulla viene caricato automaticamente e una nota nel browser non costituisce approvazione clinica.
      - type: p
        text: >-
          La pagina dichiara che la revisione clinica indipendente è ancora in attesa. I 109 controlli ingegneristici attestano il superamento di requisiti tecnici, non la correttezza di ogni percorso clinico. Sono indicati sette rilievi mirati sui dati in ingresso da esaminare. Usi solo casi inventati; nessuna decisione terapeutica deve basarsi su questo pacchetto. L'articolo non sostituisce un medico. Funzione e fonti verificate il 5 novembre 2026.
  da:
    title: "Åbn et faktisk udkast, undersøg beslutningssporet, giv feedback"
    summary: DLBCL-gennemgangspakken viser 26 opdigtede scenarier med input, genererede planer og beslutningsspor; feedback bliver i browseren indtil eksport.
    body:
      - type: p
        text: >-
          [Gennemgangspakken for DLBCL i første linje](/review/dlbcl-1l/) lader klinikere undersøge 26 opdigtede scenarier frem for et forberedt skærmbillede. Hver sag linker til opdigtet input, den faktisk genererede plan og beslutningssporet. Oversigten grupperer sager efter blandt andet manglende data, egnethed og organfunktion. Det er eksempler til at finde fejl, ikke patientjournaler.
      - type: p
        text: >-
          Forestil dig en opdigtet sag med ukendt CD20-resultat. Åbn input og output, kontrollér hvordan systemet håndterede det ukendte, markér «kræver ændringer» og forklar hvorfor. Kommentarer bliver i denne browser; **Export my review (JSON)** henter en kopi. Pakken er i øjeblikket på engelsk. Intet uploades automatisk, og en browsernote er ikke klinisk godkendelse.
      - type: p
        text: >-
          Siden siger udtrykkeligt, at uafhængig klinisk gennemgang afventer. De 109 tekniske kontroller viser, at tekniske krav er opfyldt, ikke at alle kliniske veje er korrekte. Syv målrettede fund om input skal undersøges. Brug kun opdigtede sager; behandlingsbeslutninger må ikke bygge på pakken. Artiklen erstatter ikke en læge. Funktion og kilder kontrolleret 5. november 2026.
  sv:
    title: "Öppna ett verkligt utkast, granska beslutsspåret, lämna återkoppling"
    summary: DLBCL-paketet visar 26 påhittade scenarier med indata, genererade planer och beslutsspår; återkoppling stannar i webbläsaren tills den exporteras.
    body:
      - type: p
        text: >-
          [Granskningspaketet för DLBCL i första linjen](/review/dlbcl-1l/) låter kliniker granska 26 påhittade scenarier i stället för en förberedd skärmbild. Varje fall länkar till påhittade indata, den faktiskt genererade planen och beslutsspåret. Översikten grupperar fall efter bland annat saknade uppgifter, lämplighet och organfunktion. Det är exempel för att hitta fel, inte patientjournaler.
      - type: p
        text: >-
          Föreställ dig ett påhittat fall med okänt CD20-resultat. Öppna indata och utdata, kontrollera hur systemet hanterade det okända värdet, välj ”behöver ändras” och förklara varför. Kommentarer stannar i denna webbläsare; **Export my review (JSON)** hämtar en kopia. Paketet är för närvarande på engelska. Inget skickas upp automatiskt och en webbläsaranteckning är inget kliniskt godkännande.
      - type: p
        text: >-
          Sidan anger uttryckligen att oberoende klinisk granskning återstår. De 109 tekniska kontrollerna visar uppfyllda tekniska krav, inte att varje klinisk väg är korrekt. Sju riktade fynd om indata behöver granskas. Använd bara påhittade fall; behandlingsbeslut får inte bygga på paketet. Artikeln ersätter inte en läkare. Funktion och källor kontrollerade 5 november 2026.
  nb:
    title: "Åpne et faktisk utkast, gransk beslutningssporet, gi tilbakemelding"
    summary: DLBCL-pakken viser 26 oppdiktede scenarioer med inndata, genererte planer og beslutningsspor; tilbakemeldinger forblir i nettleseren til eksport.
    body:
      - type: p
        text: >-
          [Gjennomgangspakken for DLBCL i førstelinje](/review/dlbcl-1l/) lar klinikere granske 26 oppdiktede scenarioer fremfor et tilrettelagt skjermbilde. Hvert tilfelle lenker til oppdiktede inndata, planen som faktisk ble generert, og beslutningssporet. Oversikten grupperer tilfeller etter blant annet manglende data, egnethet og organfunksjon. Dette er eksempler for å finne feil, ikke pasientjournaler.
      - type: p
        text: >-
          Tenk deg et oppdiktet tilfelle med ukjent CD20-resultat. Åpne inndata og resultat, kontroller hvordan systemet behandlet den ukjente verdien, merk «trenger endringer» og forklar hvorfor. Kommentarene blir i denne nettleseren; **Export my review (JSON)** laster ned en kopi. Pakken er foreløpig på engelsk. Ingenting lastes opp automatisk, og et nettlesernotat er ikke klinisk godkjenning.
      - type: p
        text: >-
          Siden sier uttrykkelig at uavhengig klinisk gjennomgang gjenstår. De 109 tekniske kontrollene viser at tekniske krav er oppfylt, ikke at hver kliniske vei er riktig. Syv målrettede funn om inndata må undersøkes. Bruk bare oppdiktede tilfeller; behandlingsbeslutninger må ikke bygge på pakken. Artikkelen erstatter ikke en lege. Funksjon og kilder kontrollert 5. november 2026.
  fi:
    title: "Avaa todellinen luonnos, tarkista päätöksen jälki, jätä palaute"
    summary: DLBCL-arviointipaketti näyttää 26 kuvitteellista tapausta syötteineen, luotuine suunnitelmineen ja päätösjälkineen; palaute säilyy selaimessa vientiin asti.
    body:
      - type: p
        text: >-
          [DLBCL:n ensilinjan arviointipaketti](/review/dlbcl-1l/) antaa kliinikolle 26 kuvitteellista tapausta tarkasteltavaksi valmiin kuvakaappauksen sijaan. Jokaisesta tapauksesta voi avata keksityt syötteet, todella tuotetun suunnitelman ja päätöksen jäljen. Hakemisto ryhmittelee tapaukset esimerkiksi puuttuvien tietojen, soveltuvuuden ja elintoiminnan mukaan. Ne ovat virheiden etsintään tarkoitettuja esimerkkejä, eivät potilaskertomuksia.
      - type: p
        text: >-
          Kuvittele tapaus, jossa CD20-tulos on tuntematon. Avaa syöte ja tulos, tarkista miten järjestelmä käsitteli tuntemattoman arvon, merkitse «vaatii muutoksia» ja perustele. Kommentit pysyvät tässä selaimessa; **Export my review (JSON)** lataa kopion. Paketti on toistaiseksi englanninkielinen. Mitään ei lähetetä automaattisesti, eikä selaimen merkintä ole kliininen hyväksyntä.
      - type: p
        text: >-
          Sivulla todetaan selvästi, että riippumaton kliininen arviointi odottaa. Sen 109 teknistä tarkistusta osoittavat teknisten ehtojen täyttyneen, eivät jokaisen kliinisen reitin oikeellisuutta. Tarkasteltavana on seitsemän syötetietoihin liittyvää havaintoa. Käytä vain keksittyjä tapauksia; hoitopäätös ei saa perustua tähän pakettiin. Artikkeli ei korvaa lääkäriä. Toiminto ja lähteet tarkistettu 5. marraskuuta 2026.
