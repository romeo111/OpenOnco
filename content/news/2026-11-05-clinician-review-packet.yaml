title:
  en: "Open a real draft, inspect its trace, leave a review"
  uk: "Відкрийте чернетку, перевірте хід рішення, залиште відгук"
summary:
  en: The DLBCL review packet exposes 26 synthetic scenarios with inputs, generated plans and decision traces; feedback stays in the browser until exported.
  uk: Пакет рецензування ДВКЛ показує 26 вигаданих сценаріїв із вхідними даними, планами й ходом рішення; відгук залишається в браузері до експорту.
