  - citation: "OpenOnco. DLBCL first-line clinician review packet, 26 synthetic scenarios. Checked 5 November 2026."
    id: https://openonco.info/review/dlbcl-1l/
  - citation: "OpenOnco. Review packet instructions and clinical status. Checked 5 November 2026."
    id: https://github.com/romeo111/OpenOnco/blob/ec0f1ce4d0/docs/review/dlbcl-1l/README.md
