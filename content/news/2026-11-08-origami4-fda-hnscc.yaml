slug: origami4-fda-hnscc
date: 2026-11-05
published: 2026-11-08
kind: explainer
series: openonco-three-day
series_format: research
author: OpenOnco
tags: [research, head-and-neck-cancer, fda, evidence]
title:
  en: 'OrigAMI-4: FDA approval rests on response, with benefit still to be confirmed'
  uk: 'OrigAMI-4: схвалення FDA ґрунтується на відповіді, клінічну користь ще треба підтвердити'
summary:
  en: 'In a 102-person, single-arm study, 42% had a measured tumour response. The accelerated approval does not yet establish longer survival.'
  uk: 'У дослідженні без групи порівняння за участю 102 людей відповідь пухлини зафіксували у 42%. Прискорене схвалення ще не доводить подовження життя.'
sources:
  - citation: 'US FDA. Accelerated approval of amivantamab and hyaluronidase-lpuj for recurrent or metastatic head and neck squamous cell carcinoma, 5 November 2026. Checked 8 November 2026.'
    id: https://www.fda.gov/drugs/cancer-approvals/fda-grants-accelerated-approval-amivantamab-and-hyaluronidase-lpuj-recurrent-or-metastatic-head-and
  - citation: 'OrigAMI-4, NCT06385080. ClinicalTrials.gov registration. Checked 8 November 2026.'
    id: https://clinicaltrials.gov/study/NCT06385080
  - citation: 'US FDA. Accelerated Approval Program: surrogate endpoints and confirmatory studies. Checked 8 November 2026.'
    id: https://www.fda.gov/drugs/nda-and-bla-approvals/accelerated-approval-program
  - citation: 'OpenOnco Tumor Board. Product page, checked 8 November 2026.'
    id: https://openonco.info/ask.html
body:
  en:
    - type: p
      text: >-
        On 5 November 2026, the US FDA granted accelerated approval to subcutaneous amivantamab and hyaluronidase-lpuj for adults with recurrent or metastatic head and neck squamous cell carcinoma after progression on platinum chemotherapy and an anti-PD-(L)1 antibody. HPV-associated oropharyngeal squamous cell carcinoma is excluded. This is a US regulatory decision for a defined population, not a general approval for all head and neck cancers.
    - type: p
      text: >-
        The supporting OrigAMI-4 study was multicentre, open-label and had no randomized control group. Its main efficacy population comprised 102 people. An independent central review found tumour responses in 42% (95% confidence interval 32–52%), roughly 43 of 102 people; 56% of responders had a response lasting at least six months. These are response measures, not proof of longer survival. Without a concurrent comparator, this study cannot measure how much better the drug is than another treatment.
    - type: p
      text: >-
        FDA warnings include administration or allergic reactions, lung inflammation, skin and eye toxicity, and harm to an embryo or fetus. The FDA summary does not provide rates for these harms in this population. Accelerated approval relies on an outcome expected to predict benefit; clinical benefit still needs confirmation. A response in a study group is no promise for an individual.
    - type: p
      text: >-
        Tumor Board lens, without a live run: for a wholly fictional person with recurrent disease, a discussion draft would first check pathology, the precise tumour site and HPV status, prior platinum and anti-PD-(L)1 exposure, and current condition. It would flag the missing survival comparison and safety questions rather than prescribe a regimen. [OpenOnco Tumor Board](/ask.html) is a draft tool, not a clinician. This article is not an individual treatment plan or a substitute for a doctor. Sources checked 8 November 2026.
  uk:
    - type: p
      text: >-
        5 листопада 2026 року FDA США надало прискорене схвалення підшкірній комбінації амівантамабу з гіалуронідазою-lpuj для дорослих із рецидивним або метастатичним плоскоклітинним раком голови та шиї після прогресування на платиновій хіміотерапії та антитілі проти PD-(L)1. Плоскоклітинний рак ротоглотки, пов’язаний із ВПЛ, виключено. Це рішення регулятора США для визначеної групи, а не схвалення для всіх видів раку голови та шиї.
    - type: p
      text: >-
        OrigAMI-4 було багатоцентровим відкритим дослідженням без рандомізованої контрольної групи. Основна група оцінки ефективності налічувала 102 людини. За незалежною централізованою оцінкою відповідь пухлини отримали у 42% (95% довірчий інтервал 32–52%) — приблизно 43 зі 102; у 56% тих, хто відповів, вона тривала щонайменше шість місяців. Це показники відповіді, а не доказ подовження життя. Без одночасної групи порівняння дослідження не визначає перевагу над іншим лікуванням.
    - type: p
      text: >-
        FDA попереджає про реакції на введення або алергічні реакції, запалення легень, ураження шкіри та очей і шкоду для ембріона або плода. У короткому повідомленні FDA немає частоти цих явищ саме в цій групі. Прискорене схвалення спирається на проміжний показник, клінічну користь ще потрібно підтвердити. Відповідь у групі дослідження не гарантує результату окремій людині.
    - type: p
      text: >-
        Погляд Tumor Board, без реального запуску: для цілком вигаданої людини з рецидивом чернетка для обговорення спочатку перевірила б гістологію, точне розташування пухлини та статус ВПЛ, попереднє застосування платини й анти-PD-(L)1, а також поточний стан. Вона позначила б відсутність порівняння виживаності та питання безпеки, а не призначала схему. [OpenOnco Tumor Board](/ukr/ask.html) створює чернетки і не замінює лікаря. Матеріал не є індивідуальним планом лікування. Джерела перевірено 8 листопада 2026 року.
translations:
  es:
    title: 'OrigAMI-4: la aprobación de la FDA se basa en la respuesta; el beneficio clínico aún debe confirmarse'
    summary: 'En un estudio sin grupo de comparación de 102 personas, el 42% tuvo respuesta tumoral. La aprobación acelerada aún no demuestra mayor supervivencia.'
    body:
      - type: p
        text: >-
          El 5 de noviembre de 2026, la FDA de EE. UU. concedió la aprobación acelerada a amivantamab con hialuronidasa-lpuj por vía subcutánea para adultos con carcinoma escamoso de cabeza y cuello recurrente o metastásico tras progresión con quimioterapia con platino y un anticuerpo anti-PD-(L)1. Se excluye el carcinoma escamoso orofaríngeo asociado al VPH. Es una decisión regulatoria estadounidense para una población definida, no para todos los cánceres de cabeza y cuello.
      - type: p
        text: >-
          OrigAMI-4 fue multicéntrico, abierto y sin grupo control aleatorizado. Su población principal de eficacia incluyó a 102 personas. Una revisión central independiente encontró respuesta tumoral en el 42% (intervalo de confianza del 95%: 32–52%), aproximadamente 43 de 102; en el 56% de quienes respondieron, la respuesta duró al menos seis meses. Son medidas de respuesta, no prueba de mayor supervivencia. Sin comparación simultánea, no se puede cuantificar una ventaja frente a otro tratamiento.
      - type: p
        text: >-
          La FDA advierte de reacciones a la administración o alérgicas, inflamación pulmonar, toxicidad cutánea y ocular y daño embriofetal. Su resumen no indica la frecuencia de estos efectos en esta población. La aprobación acelerada se basa en un indicador que se espera que prediga beneficio; el beneficio clínico aún debe confirmarse. Una respuesta grupal no garantiza el resultado individual.
      - type: p
        text: >-
          Perspectiva del Tumor Board, sin ejecutar el servicio: ante una persona enteramente ficticia con recidiva, un borrador comprobaría primero la anatomía patológica, el sitio tumoral y el VPH, la exposición previa a platino y anti-PD-(L)1 y el estado actual. Señalaría la falta de comparación de supervivencia y las dudas de seguridad, sin prescribir un régimen. [OpenOnco Tumor Board](/es/ask.html) produce borradores y no sustituye a un médico. Este artículo no es un plan individual. Fuentes verificadas el 8 de noviembre de 2026.
  pt:
    title: 'OrigAMI-4: a aprovação da FDA baseia-se na resposta; o benefício clínico ainda precisa de confirmação'
    summary: 'Num estudo sem grupo de comparação com 102 pessoas, 42% tiveram resposta tumoral. A aprovação acelerada ainda não demonstra maior sobrevivência.'
    body:
      - type: p
        text: >-
          Em 5 de novembro de 2026, a FDA dos EUA concedeu aprovação acelerada ao amivantamab com hialuronidase-lpuj subcutâneo para adultos com carcinoma espinocelular da cabeça e pescoço recorrente ou metastático após progressão com quimioterapia à base de platina e um anticorpo anti-PD-(L)1. Exclui-se o carcinoma espinocelular da orofaringe associado ao HPV. É uma decisão regulatória dos EUA para uma população definida, não para todos os cancros da cabeça e pescoço.
      - type: p
        text: >-
          O OrigAMI-4 foi multicêntrico, aberto e sem grupo de controlo aleatorizado. A população principal de eficácia incluiu 102 pessoas. Uma avaliação central independente encontrou resposta tumoral em 42% (intervalo de confiança de 95%: 32–52%), cerca de 43 em 102; em 56% dos respondedores, a resposta durou pelo menos seis meses. São medidas de resposta, não prova de maior sobrevivência. Sem comparação simultânea, não é possível quantificar uma vantagem face a outro tratamento.
      - type: p
        text: >-
          A FDA alerta para reações à administração ou alérgicas, inflamação pulmonar, toxicidade cutânea e ocular e danos embriofetais. O seu resumo não apresenta a frequência destes efeitos nesta população. A aprovação acelerada assenta num indicador que se espera prever benefício; o benefício clínico ainda precisa de confirmação. Uma resposta no grupo não garante o resultado individual.
      - type: p
        text: >-
          Perspetiva do Tumor Board, sem execução real: para uma pessoa inteiramente fictícia com recidiva, um rascunho verificaria primeiro a patologia, o local exato e o HPV, a exposição anterior a platina e anti-PD-(L)1 e o estado atual. Assinalaria a falta de comparação de sobrevivência e as questões de segurança, sem prescrever um regime. O [OpenOnco Tumor Board](/pt/ask.html) produz rascunhos e não substitui um médico. Este texto não é um plano individual. Fontes verificadas em 8 de novembro de 2026.
  de:
    title: 'OrigAMI-4: FDA-Zulassung beruht auf Ansprechen; klinischer Nutzen muss noch bestätigt werden'
    summary: 'In einer einarmigen Studie mit 102 Personen sprachen 42% der Tumoren an. Die beschleunigte Zulassung belegt noch kein längeres Überleben.'
    body:
      - type: p
        text: >-
          Am 5. November 2026 erteilte die US-FDA eine beschleunigte Zulassung für subkutanes Amivantamab mit Hyaluronidase-lpuj bei Erwachsenen mit rezidiviertem oder metastasiertem Plattenepithelkarzinom im Kopf-Hals-Bereich nach Progress unter platinhaltiger Chemotherapie und einem Anti-PD-(L)1-Antikörper. HPV-assoziierte Plattenepithelkarzinome des Oropharynx sind ausgenommen. Dies ist eine US-Entscheidung für eine bestimmte Gruppe, keine Zulassung für alle Kopf-Hals-Tumoren.
      - type: p
        text: >-
          OrigAMI-4 war multizentrisch und offen, ohne randomisierte Kontrollgruppe. Die primäre Wirksamkeitsgruppe umfasste 102 Personen. Eine unabhängige zentrale Begutachtung stellte bei 42% ein Tumoransprechen fest (95%-Konfidenzintervall 32–52%), also bei ungefähr 43 von 102; bei 56% der Ansprechenden hielt es mindestens sechs Monate an. Das sind Ansprechraten, kein Beleg für längeres Überleben. Ohne gleichzeitige Vergleichsgruppe lässt sich ein Vorteil gegenüber einer anderen Behandlung nicht beziffern.
      - type: p
        text: >-
          Die FDA warnt vor Verabreichungs- oder allergischen Reaktionen, Lungenentzündung, Haut- und Augentoxizität sowie Schädigung von Embryo oder Fötus. Ihre Kurzmitteilung nennt für diese Gruppe keine Häufigkeiten. Die beschleunigte Zulassung stützt sich auf einen erwarteten Surrogatindikator; der klinische Nutzen muss noch bestätigt werden. Ein Ansprechen in der Studiengruppe verspricht kein individuelles Ergebnis.
      - type: p
        text: >-
          Tumor-Board-Perspektive, ohne tatsächlichen Durchlauf: Bei einer vollständig erfundenen Person mit Rückfall würde ein Diskussionsentwurf zunächst Pathologie, genauen Tumorort und HPV-Status, frühere Platin- und Anti-PD-(L)1-Therapie sowie den aktuellen Zustand prüfen. Er würde die fehlenden Überlebensvergleichsdaten und Sicherheitsfragen markieren, ohne eine Behandlung zu verordnen. Das [OpenOnco Tumor Board](/de/ask.html) erstellt Entwürfe und ersetzt keinen Arzt. Dieser Text ist kein individueller Therapieplan. Quellen geprüft am 8. November 2026.
  fr:
    title: 'OrigAMI-4 : autorisation de la FDA fondée sur la réponse, bénéfice clinique encore à confirmer'
    summary: 'Dans une étude sans bras comparateur portant sur 102 personnes, 42% ont eu une réponse tumorale. L’autorisation accélérée ne démontre pas encore une survie prolongée.'
    body:
      - type: p
        text: >-
          Le 5 novembre 2026, la FDA américaine a accordé une autorisation accélérée à l’amivantamab avec hyaluronidase-lpuj sous-cutané chez les adultes atteints d’un carcinome épidermoïde de la tête et du cou récidivant ou métastatique après progression sous chimiothérapie à base de platine et anticorps anti-PD-(L)1. Le carcinome épidermoïde de l’oropharynx associé au HPV est exclu. Il s’agit d’une décision américaine pour une population définie, pas pour tous les cancers de la tête et du cou.
      - type: p
        text: >-
          OrigAMI-4 était multicentrique, ouvert et sans groupe témoin randomisé. Sa population principale d’efficacité comptait 102 personnes. Une évaluation centrale indépendante a constaté une réponse tumorale chez 42% (intervalle de confiance à 95% : 32–52%), soit environ 43 personnes sur 102 ; chez 56% des répondeurs, elle a duré au moins six mois. Ce sont des mesures de réponse, pas une preuve de survie prolongée. Sans comparateur concomitant, aucun avantage par rapport à un autre traitement ne peut être chiffré.
      - type: p
        text: >-
          La FDA avertit de réactions à l’administration ou allergiques, d’inflammation pulmonaire, de toxicités cutanées et oculaires et de risques pour l’embryon ou le fœtus. Son résumé ne donne pas leur fréquence dans cette population. L’autorisation accélérée repose sur un indicateur censé prédire un bénéfice ; le bénéfice clinique reste à confirmer. La réponse d’un groupe ne garantit aucun résultat individuel.
      - type: p
        text: >-
          Point de vue du Tumor Board, sans exécution réelle : pour une personne entièrement fictive en rechute, un brouillon vérifierait d’abord l’anatomopathologie, le site précis et le statut HPV, les traitements antérieurs au platine et anti-PD-(L)1 ainsi que l’état actuel. Il signalerait l’absence de comparaison de survie et les questions de sécurité, sans prescrire de protocole. [OpenOnco Tumor Board](/fr/ask.html) prépare des brouillons et ne remplace pas un médecin. Ce texte n’est pas un plan individuel. Sources vérifiées le 8 novembre 2026.
  it:
    title: 'OrigAMI-4: approvazione FDA basata sulla risposta; beneficio clinico ancora da confermare'
    summary: 'In uno studio senza gruppo di confronto su 102 persone, il 42% ha avuto una risposta tumorale. L’approvazione accelerata non dimostra ancora una sopravvivenza maggiore.'
    body:
      - type: p
        text: >-
          Il 5 novembre 2026 la FDA statunitense ha concesso l’approvazione accelerata ad amivantamab con ialuronidasi-lpuj sottocutaneo per adulti con carcinoma squamocellulare della testa e del collo recidivante o metastatico dopo progressione con chemioterapia a base di platino e un anticorpo anti-PD-(L)1. È escluso il carcinoma squamocellulare orofaringeo associato all’HPV. È una decisione statunitense per una popolazione definita, non per tutti i tumori testa-collo.
      - type: p
        text: >-
          OrigAMI-4 era multicentrico, in aperto e senza controllo randomizzato. La popolazione principale di efficacia comprendeva 102 persone. Una revisione centrale indipendente ha rilevato risposta tumorale nel 42% (intervallo di confidenza al 95%: 32–52%), circa 43 su 102; nel 56% dei rispondenti la risposta è durata almeno sei mesi. Sono misure di risposta, non prova di maggiore sopravvivenza. Senza confronto contemporaneo non si può quantificare un vantaggio rispetto a un’altra terapia.
      - type: p
        text: >-
          La FDA avverte del rischio di reazioni alla somministrazione o allergiche, infiammazione polmonare, tossicità cutanea e oculare e danno embriofetale. La sintesi non ne indica la frequenza in questa popolazione. L’approvazione accelerata si basa su un indicatore ritenuto predittivo di beneficio; il beneficio clinico va ancora confermato. Una risposta nel gruppo non garantisce un esito individuale.
      - type: p
        text: >-
          Prospettiva del Tumor Board, senza esecuzione reale: per una persona interamente fittizia con recidiva, una bozza per la discussione verificherebbe prima istologia, sede precisa e stato HPV, precedenti trattamenti con platino e anti-PD-(L)1 e condizioni attuali. Segnalerebbe l’assenza di un confronto sulla sopravvivenza e i dubbi sulla sicurezza, senza prescrivere un regime. [OpenOnco Tumor Board](/it/ask.html) crea bozze e non sostituisce il medico. Questo testo non è un piano individuale. Fonti verificate l’8 novembre 2026.
  da:
    title: 'OrigAMI-4: FDA-godkendelse bygger på respons; klinisk gevinst mangler bekræftelse'
    summary: 'I et studie uden sammenligningsgruppe med 102 personer havde 42% tumorrespons. Den fremskyndede godkendelse viser endnu ikke længere overlevelse.'
    body:
      - type: p
        text: >-
          Den 5. november 2026 gav den amerikanske FDA fremskyndet godkendelse til subkutan amivantamab med hyaluronidase-lpuj til voksne med tilbagevendende eller metastatisk pladecellekræft i hoved og hals efter progression på platinbaseret kemoterapi og et anti-PD-(L)1-antistof. HPV-relateret pladecellekræft i mundsvælget er undtaget. Det er en amerikansk afgørelse for en afgrænset gruppe, ikke for alle kræftformer i hoved og hals.
      - type: p
        text: >-
          OrigAMI-4 var et multicenterstudie uden blinding og uden randomiseret kontrolgruppe. Den primære effektgruppe omfattede 102 personer. En uafhængig central vurdering fandt tumorrespons hos 42% (95% konfidensinterval 32–52%), omtrent 43 af 102; hos 56% af dem med respons varede den mindst seks måneder. Det er responsmål, ikke bevis for længere overlevelse. Uden en samtidig sammenligningsgruppe kan en fordel over en anden behandling ikke beregnes.
      - type: p
        text: >-
          FDA advarer om reaktioner ved indgivelse eller allergi, lungebetændelse, hud- og øjentoksicitet samt skade på embryo eller foster. Kortmeddelelsen angiver ikke hyppigheden i denne gruppe. Den fremskyndede godkendelse bygger på et mål, som forventes at forudsige gevinst; den kliniske gevinst skal stadig bekræftes. Respons i en studiegruppe lover ikke et individuelt resultat.
      - type: p
        text: >-
          Tumor Board-perspektiv, uden faktisk kørsel: For en helt opdigtet person med tilbagefald ville et diskussionsudkast først kontrollere patologi, præcis tumorplacering og HPV-status, tidligere platin- og anti-PD-(L)1-behandling samt aktuel tilstand. Det ville markere manglende overlevelsessammenligning og sikkerhedsspørgsmål uden at ordinere behandling. [OpenOnco Tumor Board](/da/ask.html) laver udkast og erstatter ikke en læge. Artiklen er ikke en individuel behandlingsplan. Kilder kontrolleret 8. november 2026.
  sv:
    title: 'OrigAMI-4: FDA-godkännandet bygger på respons; klinisk nytta måste bekräftas'
    summary: 'I en studie utan jämförelsegrupp med 102 personer sågs tumörrespons hos 42%. Det snabba godkännandet visar ännu inte längre överlevnad.'
    body:
      - type: p
        text: >-
          Den 5 november 2026 gav amerikanska FDA ett påskyndat godkännande för subkutant amivantamab med hyaluronidas-lpuj till vuxna med återkommande eller metastaserad skivepitelcancer i huvud och hals efter progression med platinabaserad kemoterapi och en anti-PD-(L)1-antikropp. HPV-associerad skivepitelcancer i orofarynx omfattas inte. Beslutet gäller en avgränsad grupp i USA, inte all huvud- och halscancer.
      - type: p
        text: >-
          OrigAMI-4 var en öppen multicenterstudie utan randomiserad kontrollgrupp. Den huvudsakliga effektpopulationen bestod av 102 personer. En oberoende central granskning fann tumörrespons hos 42% (95% konfidensintervall 32–52%), ungefär 43 av 102; hos 56% av dem som svarade varade responsen i minst sex månader. Det är responsmått, inte bevis för längre överlevnad. Utan samtidig jämförelse kan en fördel gentemot annan behandling inte beräknas.
      - type: p
        text: >-
          FDA varnar för administrations- eller allergiska reaktioner, lunginflammation, hud- och ögontoxicitet samt skador på embryo eller foster. Sammanfattningen anger inte hur vanliga dessa var i gruppen. Det påskyndade godkännandet bygger på ett mått som väntas förutsäga nytta; klinisk nytta behöver fortfarande bekräftas. Respons i en studiegrupp garanterar inget individuellt resultat.
      - type: p
        text: >-
          Tumor Board-perspektiv, utan faktisk körning: För en helt påhittad person med återfall skulle ett diskussionsutkast först kontrollera patologi, exakt tumörlokal och HPV-status, tidigare platina- och anti-PD-(L)1-behandling samt aktuellt tillstånd. Det skulle markera avsaknaden av överlevnadsjämförelse och säkerhetsfrågor utan att ordinera en behandling. [OpenOnco Tumor Board](/sv/ask.html) skapar utkast och ersätter inte läkare. Artikeln är ingen individuell behandlingsplan. Källor kontrollerade 8 november 2026.
  nb:
    title: 'OrigAMI-4: FDA-godkjenning bygger på respons; klinisk nytte må bekreftes'
    summary: 'I en studie uten sammenligningsgruppe med 102 personer hadde 42% svulstrespons. Den fremskyndede godkjenningen viser ennå ikke lengre overlevelse.'
    body:
      - type: p
        text: >-
          Den 5. november 2026 ga amerikanske FDA fremskyndet godkjenning til subkutan amivantamab med hyaluronidase-lpuj for voksne med tilbakevendende eller metastatisk plateepitelkreft i hode og hals etter progresjon på platinabasert kjemoterapi og et anti-PD-(L)1-antistoff. HPV-assosiert plateepitelkreft i orofarynx er unntatt. Dette er en amerikansk beslutning for en avgrenset gruppe, ikke for all hode- og halskreft.
      - type: p
        text: >-
          OrigAMI-4 var en åpen multisenterstudie uten randomisert kontrollgruppe. Den primære effektgruppen omfattet 102 personer. En uavhengig sentral vurdering fant svulstrespons hos 42% (95% konfidensintervall 32–52%), omtrent 43 av 102; hos 56% av dem som responderte, varte responsen minst seks måneder. Dette er responsmål, ikke bevis for lengre overlevelse. Uten samtidig sammenligning kan en fordel fremfor annen behandling ikke beregnes.
      - type: p
        text: >-
          FDA advarer om reaksjoner ved administrasjon eller allergi, pneumonitt, hud- og øyetoksisitet og skade på embryo eller foster. Oppsummeringen oppgir ikke hyppighet i denne gruppen. Fremskyndet godkjenning bygger på et mål som forventes å forutsi nytte; klinisk nytte må fortsatt bekreftes. Respons i en studiegruppe garanterer ikke et individuelt resultat.
      - type: p
        text: >-
          Tumor Board-perspektiv, uten faktisk kjøring: For en helt oppdiktet person med tilbakefall ville et diskusjonsutkast først kontrollere patologi, nøyaktig svulststed og HPV-status, tidligere platina- og anti-PD-(L)1-behandling og nåværende tilstand. Det ville markere manglende overlevelsessammenligning og sikkerhetsspørsmål uten å forskrive behandling. [OpenOnco Tumor Board](/nb/ask.html) lager utkast og erstatter ikke en lege. Artikkelen er ingen individuell behandlingsplan. Kilder kontrollert 8. november 2026.
  fi:
    title: 'OrigAMI-4: FDA:n hyväksyntä perustuu vasteeseen; kliininen hyöty on vielä vahvistettava'
    summary: 'Vertailuryhmättömässä 102 henkilön tutkimuksessa 42%:lla todettiin kasvainvaste. Nopeutettu hyväksyntä ei vielä osoita pidempää elossaoloa.'
    body:
      - type: p
        text: >-
          Yhdysvaltain FDA myönsi 5. marraskuuta 2026 nopeutetun hyväksynnän ihon alle annettavalle amivantamabin ja hyaluronidaasi-lpuj:n yhdistelmälle aikuisille, joilla uusiutunut tai etäpesäkkeinen pään ja kaulan alueen levyepiteelisyöpä on edennyt platinapohjaisen solunsalpaajahoidon ja anti-PD-(L)1-vasta-aineen jälkeen. HPV:hen liittyvä suunielun levyepiteelisyöpä on rajattu pois. Päätös koskee määriteltyä ryhmää Yhdysvalloissa, ei kaikkia pään ja kaulan syöpiä.
      - type: p
        text: >-
          OrigAMI-4 oli avoin monikeskustutkimus ilman satunnaistettua vertailuryhmää. Tehon ensisijaiseen arviointiin kuului 102 henkilöä. Riippumaton keskitetty arvio totesi kasvainvasteen 42%:lla (95%:n luottamusväli 32–52%), noin 43:lla 102:sta; 56%:lla vasteen saaneista se kesti vähintään kuusi kuukautta. Nämä ovat vastemittareita, eivät näyttöä pidemmästä elossaolosta. Ilman samanaikaista vertailua etua toiseen hoitoon nähden ei voi mitata.
      - type: p
        text: >-
          FDA varoittaa antamiseen liittyvistä tai allergisista reaktioista, keuhkotulehduksesta, iho- ja silmähaitoista sekä alkio- ja sikiöhaitoista. Yhteenveto ei kerro niiden yleisyyttä tässä ryhmässä. Nopeutettu hyväksyntä perustuu hyötyä ennakoivaksi oletettuun mittariin; kliininen hyöty on vielä vahvistettava. Tutkimusryhmän vaste ei takaa yksilön tulosta.
      - type: p
        text: >-
          Tumor Board -näkökulma ilman todellista ajoa: täysin kuvitteellisen uusiutumisesta kärsivän henkilön keskusteluluonnoksessa tarkistettaisiin ensin patologia, tarkka kasvainpaikka ja HPV-tila, aiempi platina- ja anti-PD-(L)1-hoito sekä nykyinen vointi. Siinä merkittäisiin puuttuva elossaolovertailu ja turvallisuuskysymykset, eikä määrättäisi hoitoa. [OpenOnco Tumor Board](/fi/ask.html) tuottaa luonnoksia eikä korvaa lääkäriä. Tämä ei ole yksilöllinen hoitosuunnitelma. Lähteet tarkistettu 8. marraskuuta 2026.
