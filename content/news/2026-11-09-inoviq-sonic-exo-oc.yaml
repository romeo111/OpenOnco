slug: inoviq-sonic-exo-oc
date: 2026-11-02
published: 2026-11-09
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, ovarian-cancer, diagnostics, evidence]
title:
  en: 'INOVIQ and Sonic: an ovarian cancer test enters laboratory validation'
  uk: 'INOVIQ і Sonic: тест на рак яєчників переходить до лабораторної перевірки'
summary:
  en: 'A 2 November agreement will test whether EXO-OC can work in a US laboratory. The deal is an option to validate, not a commercial launch or proof of screening benefit.'
  uk: 'Угода від 2 листопада передбачає перевірку EXO-OC у лабораторії США. Це можливість провести валідацію, а не початок продажу чи доказ користі скринінгу.'
sources:
  - citation: 'INOVIQ. ASX announcement: validation and licence option agreement with Sonic Healthcare USA, 2 November 2026. Checked 9 November 2026.'
    id: https://www.inoviq.com/site/PDF/4901d492-a948-4b14-8fae-c713d0edb635/IIQsignsEXOOCvalidationagreementwithSonicHealthcare
  - citation: 'INOVIQ. EXO-OC ovarian cancer test product page. Checked 9 November 2026; its earlier performance figures differ from the updated figures in the 2 November announcement.'
    id: https://www.inoviq.com/site/pipeline/exo-ovarian-cancer-test-1
  - citation: 'OpenOnco. README and product limitations, repository master checked 9 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/0b0cfc270f90858508161e0ecc96d2aacaa5a424/README.md
  - citation: 'OpenOnco. MIT code licence, repository master checked 9 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/0b0cfc270f90858508161e0ecc96d2aacaa5a424/LICENSE
body:
  en:
    - type: p
      text: >-
        On 2 November 2026, INOVIQ announced a validation and licence-option agreement with Sonic Healthcare USA for EXO-OC, its developing blood test for early ovarian cancer detection. Sonic's present commitment is to transfer, optimise and validate the test in its New York laboratory. Sonic has not agreed to sell it. A future US laboratory-developed test would require successful validation, exercise of the option and further commercial talks. The company's target of early 2028 is a plan, not an availability date.
    - type: p
      text: >-
        EXO-OC isolates extracellular vesicles from blood and combines vesicle microRNA markers with CA125 in a machine-learning algorithm. INOVIQ reports that an updated algorithm reached 92.3% sensitivity for stage I/II and 92.5% across stages at 98% specificity in a 498-sample retrospective case-control study. Those are company-reported estimates from selected stored samples, not performance in a general screening population. The company explicitly says Sonic has not independently validated these results. Its current product page still displays older figures; we use the dated announcement for the updated figures.
    - type: p
      text: >-
        That distinction matters: a laboratory transfer agreement does not show that screening detects disease early enough to improve outcomes, nor does it establish false-positive rates in routine use. This is a diagnostic being developed for an initial higher-risk population, while wider screening remains a later ambition. The company has not published a user price in the cited materials. Claims about future access and revenue are forecasts, not observed results.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) answers a different question. Its free, MIT-licensed code exposes versioned oncology rules and source citations to support a reviewable discussion draft; it does not analyse blood, diagnose ovarian cancer or have clinical validation. EXO-OC's proprietary laboratory assay could supply biological evidence, while OpenOnco could help organise questions and citations after a diagnosis. Neither replaces a clinician, and there is no head-to-head evidence that one improves outcomes more than the other. Sources and product pages checked 9 November 2026. This article is not medical advice.
  uk:
    - type: p
      text: >-
        2 листопада 2026 року INOVIQ оголосила про угоду з Sonic Healthcare USA щодо валідації та опціону на ліцензію для EXO-OC — розроблюваного аналізу крові для раннього виявлення раку яєчників. Наразі Sonic має перенести тест у свою лабораторію в штаті Нью-Йорк, оптимізувати й перевірити його. Компанія не зобов’язалася продавати тест. Майбутній лабораторний тест у США залежить від успішної перевірки, реалізації опціону та подальших переговорів. Початок 2028 року — ціль INOVIQ, а не підтверджена дата доступності.
    - type: p
      text: >-
        EXO-OC виділяє з крові позаклітинні везикули й поєднує їхні мікроРНК-маркери з CA125 у алгоритмі машинного навчання. За повідомленням INOVIQ, оновлений алгоритм у ретроспективному дослідженні «випадок–контроль» на 498 зразках досяг чутливості 92,3% для стадій I/II та 92,5% для всіх стадій за специфічності 98%. Це оцінки компанії на відібраних збережених зразках, а не результати скринінгу загальної популяції. INOVIQ прямо зазначає, що Sonic ще не підтвердила їх незалежно. На сторінці продукту залишилися старі показники; для нових ми використали датоване повідомлення.
    - type: p
      text: >-
        Передача тесту в лабораторію не доводить, що скринінг виявляє хворобу достатньо рано, щоб поліпшити результати лікування, і не встановлює частоту хибнопозитивних відповідей у звичайній практиці. Спершу діагностику планують для групи підвищеного ризику; ширший скринінг — подальша мета. У наведених джерелах компанія не оприлюднила ціну для користувача. Заяви про майбутню доступність і доходи є прогнозами.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) розв’язує інше завдання. Безкоштовний код з ліцензією MIT відкриває версійні онкологічні правила й посилання на джерела для перевірюваної чернетки обговорення; сервіс не аналізує кров, не діагностує рак яєчників і не має клінічної валідації. Власний лабораторний тест EXO-OC може дати біологічні дані, а OpenOnco — допомогти впорядкувати питання та джерела після встановлення діагнозу. Жоден інструмент не замінює лікаря; прямих доказів переваги одного щодо клінічних результатів немає. Джерела й сторінки продуктів перевірено 9 листопада 2026 року. Матеріал не є медичною порадою.
translations:
  es:
    title: 'INOVIQ y Sonic: una prueba de cáncer de ovario entra en validación de laboratorio'
    summary: 'El acuerdo del 2 de noviembre llevará EXO-OC a un laboratorio estadounidense para validarlo; no supone lanzamiento comercial ni prueba de beneficio del cribado.'
    body:
      - type: p
        text: >-
          El 2 de noviembre de 2026, INOVIQ anunció un acuerdo de validación y opción de licencia con Sonic Healthcare USA para EXO-OC, un análisis de sangre en desarrollo para detectar precozmente el cáncer de ovario. Por ahora, Sonic se compromete a transferir, optimizar y validar la prueba en su laboratorio de Nueva York; no se ha comprometido a venderla. Una futura prueba desarrollada en laboratorio en EE. UU. dependerá de la validación, del ejercicio de la opción y de nuevas negociaciones. La meta de principios de 2028 es un plan de INOVIQ, no una fecha confirmada de disponibilidad.
      - type: p
        text: >-
          EXO-OC aísla vesículas extracelulares de la sangre y combina marcadores de microARN de esas vesículas con CA125 mediante aprendizaje automático. Según INOVIQ, un algoritmo actualizado alcanzó una sensibilidad del 92,3% en estadios I/II y del 92,5% en todos los estadios, con una especificidad del 98%, en un estudio retrospectivo de casos y controles con 498 muestras. Son estimaciones de la empresa en muestras almacenadas seleccionadas, no resultados de cribado poblacional. INOVIQ señala que Sonic aún no las ha validado de forma independiente. Su página de producto conserva cifras anteriores; para las nuevas usamos el anuncio fechado.
      - type: p
        text: >-
          Un acuerdo para transferir la prueba no demuestra que el cribado detecte la enfermedad con antelación suficiente para mejorar resultados ni establece los falsos positivos en la práctica. El desarrollo apunta primero a mujeres de mayor riesgo; el cribado amplio es una aspiración posterior. Los materiales citados no publican un precio para usuarios. La futura disponibilidad y los ingresos son previsiones, no resultados observados.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) responde a otra necesidad: su código gratuito con licencia MIT expone reglas oncológicas versionadas y fuentes para un borrador revisable. No analiza sangre, no diagnostica cáncer de ovario ni cuenta con validación clínica. La prueba de laboratorio propietaria EXO-OC podría aportar datos biológicos; OpenOnco podría organizar preguntas y fuentes tras un diagnóstico. Ninguno sustituye al médico y no hay comparación directa que demuestre mejores resultados de uno frente al otro. Fuentes y productos comprobados el 9 de noviembre de 2026. Este artículo no es consejo médico.
  pt:
    title: 'INOVIQ e Sonic: teste para cancro do ovário entra em validação laboratorial'
    summary: 'O acordo de 2 de novembro levará o EXO-OC a um laboratório nos EUA para validação; não é um lançamento comercial nem prova de benefício do rastreio.'
    body:
      - type: p
        text: >-
          Em 2 de novembro de 2026, a INOVIQ anunciou um acordo de validação e opção de licença com a Sonic Healthcare USA para o EXO-OC, uma análise ao sangue em desenvolvimento para detetar precocemente o cancro do ovário. Por agora, a Sonic compromete-se a transferir, otimizar e validar o teste no seu laboratório de Nova Iorque; não se comprometeu a vendê-lo. Um futuro teste desenvolvido em laboratório nos EUA dependerá da validação, do exercício da opção e de novas negociações. O início de 2028 é uma meta da INOVIQ, não uma data confirmada de disponibilidade.
      - type: p
        text: >-
          O EXO-OC isola vesículas extracelulares do sangue e combina marcadores de microARN dessas vesículas com CA125 num algoritmo de aprendizagem automática. Segundo a INOVIQ, o algoritmo atualizado obteve sensibilidade de 92,3% nos estádios I/II e 92,5% em todos os estádios, com especificidade de 98%, num estudo retrospetivo de casos e controlos com 498 amostras. São estimativas da empresa em amostras armazenadas selecionadas, não resultados de rastreio populacional. A INOVIQ afirma que a Sonic ainda não os validou de forma independente. A página do produto apresenta valores anteriores; para os novos usamos o anúncio datado.
      - type: p
        text: >-
          Um acordo de transferência não demonstra que o rastreio detete a doença cedo o suficiente para melhorar resultados, nem estabelece a taxa de falsos positivos no uso habitual. O desenvolvimento visa primeiro mulheres de maior risco; o rastreio alargado é uma ambição posterior. Os materiais citados não divulgam o preço para utilizadores. A futura disponibilidade e as receitas são previsões, não resultados observados.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) responde a outra questão: o código gratuito sob licença MIT expõe regras oncológicas versionadas e fontes para um rascunho verificável. Não analisa sangue, não diagnostica cancro do ovário e não tem validação clínica. O ensaio laboratorial proprietário EXO-OC poderá fornecer dados biológicos; o OpenOnco poderá organizar perguntas e fontes após o diagnóstico. Nenhum substitui um médico e não há comparação direta que prove melhores resultados de um face ao outro. Fontes e produtos verificados em 9 de novembro de 2026. Este texto não é aconselhamento médico.
  de:
    title: 'INOVIQ und Sonic: Eierstockkrebs-Bluttest geht in die Laborvalidierung'
    summary: 'Eine Vereinbarung vom 2. November soll EXO-OC in einem US-Labor prüfen. Sie bedeutet weder Markteinführung noch nachgewiesenen Screening-Nutzen.'
    body:
      - type: p
        text: >-
          Am 2. November 2026 meldete INOVIQ eine Vereinbarung zur Validierung und Lizenzoption mit Sonic Healthcare USA für EXO-OC, einen Bluttest in Entwicklung zur Früherkennung von Eierstockkrebs. Sonic verpflichtet sich derzeit zur Übertragung, Optimierung und Validierung im Labor in New York, nicht zum Verkauf. Ein künftiger US-Labortest setzt erfolgreiche Validierung, Ausübung der Option und weitere Verhandlungen voraus. Anfang 2028 ist ein Ziel von INOVIQ, kein bestätigter Verfügbarkeitstermin.
      - type: p
        text: >-
          EXO-OC isoliert extrazelluläre Vesikel aus Blut und kombiniert deren Mikro-RNA-Marker mit CA125 in einem Algorithmus des maschinellen Lernens. Laut INOVIQ erzielte ein aktualisierter Algorithmus in einer retrospektiven Fall-Kontroll-Studie mit 498 Proben 92,3% Sensitivität für Stadium I/II und 92,5% über alle Stadien bei 98% Spezifität. Das sind Unternehmensangaben anhand ausgewählter gelagerter Proben, keine Ergebnisse eines Bevölkerungsscreenings. INOVIQ betont, dass Sonic diese Werte noch nicht unabhängig validiert hat. Die Produktseite zeigt ältere Zahlen; für die aktuellen verwenden wir die datierte Meldung.
      - type: p
        text: >-
          Ein Labortransfer belegt weder, dass Screening die Erkrankung früh genug erkennt, um Behandlungsergebnisse zu verbessern, noch die Falsch-Positiv-Rate im Alltag. Zunächst ist der Test für Frauen mit erhöhtem Risiko vorgesehen; breiteres Screening ist ein späteres Ziel. In den zitierten Unterlagen steht kein Nutzerpreis. Aussagen zu Zugang und Umsatz sind Prognosen, keine beobachteten Ergebnisse.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) erfüllt eine andere Aufgabe: Der kostenlose MIT-lizenzierte Code legt versionierte Onkologieregeln und Quellen für einen überprüfbaren Diskussionsentwurf offen. Er analysiert kein Blut, diagnostiziert keinen Eierstockkrebs und ist klinisch nicht validiert. Der proprietäre Labortest EXO-OC könnte biologische Daten liefern, OpenOnco nach einer Diagnose Fragen und Belege ordnen. Keines ersetzt ärztliche Beurteilung; es gibt keinen direkten Nachweis besserer Behandlungsergebnisse des einen gegenüber dem anderen. Quellen und Produktseiten geprüft am 9. November 2026. Dies ist keine medizinische Beratung.
  fr:
    title: 'INOVIQ et Sonic : un test du cancer de l’ovaire passe à la validation en laboratoire'
    summary: 'L’accord du 2 novembre prévoit la validation d’EXO-OC dans un laboratoire américain, sans lancement commercial ni preuve de bénéfice du dépistage.'
    body:
      - type: p
        text: >-
          Le 2 novembre 2026, INOVIQ a annoncé un accord de validation et d’option de licence avec Sonic Healthcare USA pour EXO-OC, un test sanguin en développement pour détecter précocement le cancer de l’ovaire. Pour l’instant, Sonic doit transférer, optimiser et valider le test dans son laboratoire de New York ; elle ne s’est pas engagée à le vendre. Un futur test de laboratoire américain dépendra d’une validation réussie, de l’exercice de l’option et d’autres négociations. Début 2028 est un objectif d’INOVIQ, pas une date de disponibilité confirmée.
      - type: p
        text: >-
          EXO-OC isole les vésicules extracellulaires du sang et associe leurs marqueurs microARN au CA125 dans un algorithme d’apprentissage automatique. Selon INOVIQ, un algorithme actualisé a atteint une sensibilité de 92,3% aux stades I/II et de 92,5% tous stades confondus, avec une spécificité de 98%, dans une étude cas-témoins rétrospective de 498 échantillons. Ce sont des estimations de l’entreprise sur des échantillons conservés et sélectionnés, pas des résultats de dépistage en population générale. INOVIQ précise que Sonic ne les a pas encore validées indépendamment. La page produit affiche d’anciens chiffres ; nous utilisons l’annonce datée pour les nouveaux.
      - type: p
        text: >-
          Un transfert en laboratoire ne prouve ni que le dépistage repère la maladie assez tôt pour améliorer les résultats, ni le taux de faux positifs en pratique. Le développement vise d’abord les femmes à risque accru ; le dépistage élargi est un objectif ultérieur. Les documents cités ne publient pas de prix pour l’utilisateur. L’accès futur et les recettes annoncés sont des prévisions.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) répond à un autre besoin : son code gratuit sous licence MIT expose des règles oncologiques versionnées et des sources pour un brouillon vérifiable. Il n’analyse pas le sang, ne diagnostique pas le cancer de l’ovaire et ne dispose pas de validation clinique. Le test de laboratoire propriétaire EXO-OC pourrait fournir des données biologiques ; OpenOnco pourrait organiser questions et sources après un diagnostic. Aucun ne remplace un médecin et aucune comparaison directe ne prouve de meilleurs résultats de l’un face à l’autre. Sources et produits vérifiés le 9 novembre 2026. Ce texte n’est pas un conseil médical.
  it:
    title: 'INOVIQ e Sonic: un test per il cancro ovarico passa alla validazione in laboratorio'
    summary: 'L’accordo del 2 novembre prevede la verifica di EXO-OC in un laboratorio USA, non un lancio commerciale né la prova di beneficio dello screening.'
    body:
      - type: p
        text: >-
          Il 2 novembre 2026 INOVIQ ha annunciato un accordo di validazione e opzione di licenza con Sonic Healthcare USA per EXO-OC, un esame del sangue in sviluppo per la diagnosi precoce del cancro ovarico. Per ora Sonic si impegna a trasferire, ottimizzare e validare il test nel proprio laboratorio di New York, non a venderlo. Un futuro test sviluppato in laboratorio negli USA richiederà validazione positiva, esercizio dell’opzione e ulteriori trattative. L’inizio del 2028 è un obiettivo di INOVIQ, non una data certa di disponibilità.
      - type: p
        text: >-
          EXO-OC isola vescicole extracellulari dal sangue e combina marcatori di microRNA delle vescicole con CA125 in un algoritmo di apprendimento automatico. Secondo INOVIQ, l’algoritmo aggiornato ha ottenuto sensibilità del 92,3% negli stadi I/II e del 92,5% in tutti gli stadi, con specificità del 98%, in uno studio retrospettivo caso-controllo su 498 campioni. Sono stime aziendali su campioni conservati selezionati, non risultati di screening nella popolazione generale. INOVIQ specifica che Sonic non le ha ancora validate indipendentemente. La pagina del prodotto riporta cifre precedenti; per quelle nuove usiamo il comunicato datato.
      - type: p
        text: >-
          Un accordo di trasferimento non dimostra che lo screening individui la malattia abbastanza presto da migliorare gli esiti né stabilisce i falsi positivi nell’uso ordinario. Il primo obiettivo sono donne a rischio elevato; uno screening più ampio resta un progetto successivo. Nei materiali citati non compare un prezzo per l’utente. Accesso e ricavi futuri sono previsioni, non risultati osservati.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) svolge un compito diverso: il codice gratuito con licenza MIT rende consultabili regole oncologiche versionate e fonti per una bozza verificabile. Non analizza il sangue, non diagnostica il cancro ovarico e non ha validazione clinica. Il test di laboratorio proprietario EXO-OC potrebbe fornire dati biologici; OpenOnco potrebbe organizzare domande e fonti dopo una diagnosi. Nessuno sostituisce il medico e non esiste un confronto diretto che provi migliori esiti per uno dei due. Fonti e prodotti verificati il 9 novembre 2026. Questo testo non è un consiglio medico.
  da:
    title: 'INOVIQ og Sonic: blodprøve for æggestokkræft skal valideres i laboratorium'
    summary: 'Aftalen fra 2. november sender EXO-OC til validering i et amerikansk laboratorium; den er hverken lancering eller dokumentation for screeninggevinst.'
    body:
      - type: p
        text: >-
          Den 2. november 2026 annoncerede INOVIQ en aftale om validering og licensoption med Sonic Healthcare USA for EXO-OC, en blodprøve under udvikling til tidlig påvisning af æggestokkræft. Sonic skal foreløbig overføre, optimere og validere testen i sit laboratorium i New York; selskabet har ikke forpligtet sig til at sælge den. En fremtidig amerikansk laboratorieudviklet test kræver vellykket validering, udnyttelse af optionen og yderligere forhandlinger. Begyndelsen af 2028 er INOVIQs mål, ikke en bekræftet tilgængelighedsdato.
      - type: p
        text: >-
          EXO-OC isolerer ekstracellulære vesikler fra blod og kombinerer vesiklernes mikroRNA-markører med CA125 i en maskinlæringsalgoritme. Ifølge INOVIQ opnåede en opdateret algoritme 92,3% sensitivitet for stadie I/II og 92,5% på tværs af stadier ved 98% specificitet i en retrospektiv case-kontrol-undersøgelse med 498 prøver. Det er virksomhedens estimater fra udvalgte opbevarede prøver, ikke resultater fra befolkningsscreening. INOVIQ understreger, at Sonic endnu ikke har valideret dem uafhængigt. Produktsiden viser ældre tal; vi bruger den daterede meddelelse til de nye.
      - type: p
        text: >-
          En aftale om laboratorieoverførsel viser hverken, at screening opdager sygdommen tidligt nok til at forbedre udfald, eller hvor ofte falsk positive resultater forekommer i praksis. Udviklingen retter sig først mod kvinder med forhøjet risiko; bred screening er et senere mål. De citerede dokumenter oplyser ingen brugerpris. Fremtidig adgang og omsætning er prognoser, ikke observerede resultater.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) løser en anden opgave: Den gratis MIT-licenserede kode viser versionerede onkologiske regler og kilder til et efterprøvbart diskussionsudkast. Den analyserer ikke blod, diagnosticerer ikke æggestokkræft og er ikke klinisk valideret. Den proprietære laboratorietest EXO-OC kan måske levere biologiske data, mens OpenOnco kan organisere spørgsmål og kilder efter en diagnose. Ingen af dem erstatter en læge, og ingen direkte sammenligning viser bedre kliniske udfald for den ene. Kilder og produkter kontrolleret 9. november 2026. Artiklen er ikke lægelig rådgivning.
  sv:
    title: 'INOVIQ och Sonic: blodtest för äggstockscancer går till laboratorievalidering'
    summary: 'Avtalet den 2 november innebär att EXO-OC ska valideras i ett amerikanskt laboratorium, inte att testet lanserats eller att screeningnytta bevisats.'
    body:
      - type: p
        text: >-
          Den 2 november 2026 meddelade INOVIQ ett avtal om validering och licensoption med Sonic Healthcare USA för EXO-OC, ett blodtest under utveckling för tidig upptäckt av äggstockscancer. Sonic ska nu överföra, optimera och validera testet i sitt laboratorium i New York; företaget har inte åtagit sig att sälja det. Ett framtida laboratorieutvecklat test i USA kräver lyckad validering, att optionen utnyttjas och fler förhandlingar. Tidigt 2028 är INOVIQs mål, inte ett bekräftat datum för tillgänglighet.
      - type: p
        text: >-
          EXO-OC isolerar extracellulära vesiklar ur blod och kombinerar vesiklarnas mikroRNA-markörer med CA125 i en maskininlärningsalgoritm. Enligt INOVIQ nådde en uppdaterad algoritm 92,3% sensitivitet i stadium I/II och 92,5% över alla stadier vid 98% specificitet i en retrospektiv fall-kontrollstudie med 498 prover. Det är företagets uppskattningar från utvalda lagrade prover, inte resultat från screening i befolkningen. INOVIQ säger uttryckligen att Sonic ännu inte har validerat dem oberoende. Produktsidan visar äldre siffror; vi använder det daterade meddelandet för de nya.
      - type: p
        text: >-
          Ett avtal om laboratorieöverföring visar varken att screening upptäcker sjukdom tillräckligt tidigt för att förbättra utfall eller hur ofta falskt positiva svar uppstår i vården. Utvecklingen riktas först mot kvinnor med förhöjd risk; bredare screening är ett senare mål. De citerade dokumenten anger inget användarpris. Framtida tillgång och intäkter är prognoser, inte observerade resultat.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) fyller en annan funktion: Den kostnadsfria MIT-licensierade koden visar versionshanterade onkologiska regler och källor för ett granskningsbart diskussionsutkast. Den analyserar inte blod, diagnostiserar inte äggstockscancer och är inte kliniskt validerad. Det proprietära laboratorietestet EXO-OC skulle kunna ge biologiska data, medan OpenOnco kan ordna frågor och källor efter en diagnos. Inget av dem ersätter läkare, och ingen direkt jämförelse visar bättre kliniska utfall för det ena. Källor och produkter kontrollerade 9 november 2026. Artikeln är inte medicinsk rådgivning.
  nb:
    title: 'INOVIQ og Sonic: blodprøve for eggstokkreft går til laboratorievalidering'
    summary: 'Avtalen 2. november sender EXO-OC til validering i et amerikansk laboratorium; den er verken lansering eller bevis for screeningnytte.'
    body:
      - type: p
        text: >-
          Den 2. november 2026 kunngjorde INOVIQ en avtale om validering og lisensopsjon med Sonic Healthcare USA for EXO-OC, en blodprøve under utvikling for tidlig påvisning av eggstokkreft. Sonic skal foreløpig overføre, optimalisere og validere testen i sitt laboratorium i New York; selskapet har ikke forpliktet seg til å selge den. En fremtidig laboratorieutviklet test i USA forutsetter vellykket validering, at opsjonen brukes og videre forhandlinger. Tidlig 2028 er INOVIQs mål, ikke en bekreftet tilgjengelighetsdato.
      - type: p
        text: >-
          EXO-OC isolerer ekstracellulære vesikler fra blod og kombinerer vesiklenes mikroRNA-markører med CA125 i en maskinlæringsalgoritme. Ifølge INOVIQ nådde en oppdatert algoritme 92,3% sensitivitet for stadium I/II og 92,5% på tvers av stadier ved 98% spesifisitet i en retrospektiv kasus-kontrollstudie med 498 prøver. Dette er selskapets estimater fra utvalgte lagrede prøver, ikke resultater fra befolkningsscreening. INOVIQ understreker at Sonic ennå ikke har validert dem uavhengig. Produktsiden viser eldre tall; vi bruker den daterte meldingen for de nye.
      - type: p
        text: >-
          En avtale om laboratorieoverføring viser verken at screening oppdager sykdom tidlig nok til å forbedre utfall, eller hvor ofte falskt positive svar oppstår i vanlig bruk. Utviklingen retter seg først mot kvinner med forhøyet risiko; bredere screening er et senere mål. De siterte dokumentene oppgir ingen brukerpris. Fremtidig tilgang og inntekter er prognoser, ikke observerte resultater.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) løser en annen oppgave: Den gratis MIT-lisensierte koden viser versjonerte onkologiregler og kilder for et etterprøvbart diskusjonsutkast. Den analyserer ikke blod, diagnostiserer ikke eggstokkreft og er ikke klinisk validert. Den proprietære laboratorietesten EXO-OC kan kanskje gi biologiske data, mens OpenOnco kan ordne spørsmål og kilder etter en diagnose. Ingen av dem erstatter lege, og ingen direkte sammenligning viser bedre kliniske utfall for den ene. Kilder og produkter kontrollert 9. november 2026. Artikkelen er ikke medisinske råd.
  fi:
    title: 'INOVIQ ja Sonic: munasarjasyövän veritesti siirtyy laboratoriovalidointiin'
    summary: 'Marraskuun 2. päivän sopimus vie EXO-OC:n yhdysvaltalaiseen laboratorioon validoitavaksi; se ei ole myyntijulkaisu eikä näyttö seulonnan hyödystä.'
    body:
      - type: p
        text: >-
          INOVIQ ilmoitti 2. marraskuuta 2026 Sonic Healthcare USA:n kanssa solmitusta EXO-OC-veritestin validointi- ja lisenssioptiosopimuksesta. Kehitteillä oleva testi pyrkii havaitsemaan munasarjasyövän varhain. Sonicin nykyinen tehtävä on siirtää, optimoida ja validoida testi New Yorkin laboratoriossa; se ei ole sitoutunut myymään testiä. Mahdollinen tuleva yhdysvaltalainen laboratoriossa kehitetty testi edellyttää onnistunutta validointia, option käyttöä ja uusia neuvotteluja. Vuoden 2028 alku on INOVIQin tavoite, ei vahvistettu saatavuuspäivä.
      - type: p
        text: >-
          EXO-OC eristää verestä solunulkoisia vesikkeleitä ja yhdistää niiden mikroRNA-merkkiaineita CA125-arvoon koneoppimisalgoritmissa. INOVIQin mukaan päivitetty algoritmi saavutti retrospektiivisessä 498 näytteen tapaus-verrokkitutkimuksessa 92,3%:n herkkyyden vaiheissa I/II ja 92,5%:n herkkyyden kaikissa vaiheissa 98%:n spesifisyydellä. Nämä ovat yhtiön arvioita valikoiduista säilytetyistä näytteistä, eivät väestöseulonnan tuloksia. INOVIQ sanoo suoraan, ettei Sonic ole vielä vahvistanut lukuja riippumattomasti. Tuotesivu näyttää vanhempia lukuja; uusille käytämme päivättyä tiedotetta.
      - type: p
        text: >-
          Laboratoriosiirtoa koskeva sopimus ei osoita, että seulonta löytäisi taudin riittävän varhain parantaakseen hoitotuloksia, eikä se kerro väärien positiivisten tulosten yleisyyttä arjessa. Kehitys kohdistuu aluksi suuren riskin naisiin; laajempi seulonta on myöhempi tavoite. Lainatuissa aineistoissa ei ilmoiteta käyttäjähintaa. Tuleva saatavuus ja tulot ovat ennusteita, eivät havaittuja tuloksia.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) vastaa eri kysymykseen: Sen maksuton MIT-lisensoitu koodi avaa versioidut onkologiasäännöt ja lähteet tarkistettavaa keskusteluluonnosta varten. Se ei analysoi verta, diagnosoi munasarjasyöpää eikä ole kliinisesti validoitu. EXO-OC:n omisteinen laboratoriotesti voisi tuottaa biologista tietoa, kun taas OpenOnco voisi järjestää kysymykset ja lähteet diagnoosin jälkeen. Kumpikaan ei korvaa lääkäriä, eikä suoraa näyttöä toisen paremmista hoitotuloksista ole. Lähteet ja tuotesivut tarkistettu 9. marraskuuta 2026. Artikkeli ei ole lääketieteellinen ohje.
