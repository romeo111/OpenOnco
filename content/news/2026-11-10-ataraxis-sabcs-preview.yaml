series_format: startup
author: OpenOnco
tags: [startup, breast-cancer, pathology, evidence]
title:
  en: 'Ataraxis previews nine breast cancer studies; the results still matter more than the schedule'
  uk: 'Ataraxis анонсує дев’ять досліджень раку молочної залози: результати важливіші за розклад'
summary:
  en: 'The company lists nine SABCS presentations for December. Existing research supports retrospective prognosis, while the newly announced treatment-benefit findings still need scrutiny.'
  uk: 'Компанія анонсувала дев’ять виступів на SABCS у грудні. Попереднє дослідження стосується ретроспективного прогнозу; нові висновки про користь лікування ще належить оцінити.'
sources:
  - citation: 'Ataraxis AI. SABCS 2026 presentation announcement, 9 November 2026. Checked 10 November 2026.'
    id: https://www.ataraxis.ai/resources/ataraxis-ai-to-present-9-studies-at-sabcs-2026
  - citation: 'Ataraxis AI. Ataraxis Breast product overview and access information. Checked 10 November 2026.'
    id: https://www.ataraxis.ai/ataraxis-breast-overview
  - citation: 'Witowski et al. Multi-modal AI for comprehensive breast cancer prognostication. Nature Communications, 20 May 2026. Checked 10 November 2026.'
    id: https://www.nature.com/articles/s41467-026-73088-y
  - citation: 'OpenOnco. Product description and limitations, master checked 10 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/b5a7742559cefb52357d7cdb7ec45e8419c8cf7e/README.md
  - citation: 'OpenOnco. MIT licence, master checked 10 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/b5a7742559cefb52357d7cdb7ec45e8419c8cf7e/LICENSE
body:
  en:
    - type: p
      text: >-
        On 9 November 2026, Ataraxis AI announced nine Ataraxis Breast studies scheduled for the December San Antonio Breast Cancer Symposium. Two are listed for the first general session: analyses of the TAILORx and SWOG-8814 trial datasets. Others concern recurrence prediction, chemotherapy benefit and response before surgery. This is a dated presentation schedule, not nine newly published results. The company calls the work validation; the new findings must be judged from the actual presentations and methods.
    - type: p
      text: >-
        Its existing peer-reviewed Nature Communications paper studied 8,161 women, including 3,502 in external evaluation cohorts. A pathology-slide-plus-clinical-data model ranked recurrence risk retrospectively (pooled C-index 0.71). That is evidence about prognosis, not proof that using the test changes treatment decisions or improves survival. Ataraxis says its current clinician-ordered tests analyse existing breast tissue slides; patient cost depends on insurance. The cited product pages do not provide public model code or an open licence.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) is a free, MIT-licensed, source-cited oncology knowledge base for reviewable discussion drafts. Its rules can be inspected, but it does not read pathology slides, predict an individual recurrence risk or have clinical validation. Ataraxis could add a laboratory-derived risk estimate; OpenOnco could help organise source-linked questions for a clinician. These are different workflows, with no direct evidence that either improves outcomes more. Sources checked 10 November 2026. This article does not replace medical advice.
  uk:
    - type: p
      text: >-
        9 листопада 2026 року Ataraxis AI анонсувала дев’ять досліджень Ataraxis Breast для грудневого симпозіуму SABCS. Два виступи в першій загальній сесії присвячені аналізу даних випробувань TAILORx і SWOG-8814. Інші стосуються прогнозу рецидиву, користі хіміотерапії та відповіді на лікування до операції. Це датований розклад виступів, а не дев’ять нових опублікованих результатів. Компанія називає роботу валідацією; нові висновки слід оцінювати за самими доповідями та методами.
    - type: p
      text: >-
        У попередній рецензованій статті Nature Communications вивчали 8 161 жінку, зокрема 3 502 в когортах зовнішньої перевірки. Модель, що поєднує цифрові зображення тканини й клінічні дані, ретроспективно розрізняла ризик рецидиву (об’єднаний C-індекс 0,71). Це дані про прогноз, а не доказ того, що застосування тесту змінює лікування чи подовжує життя. За даними Ataraxis, лікар замовляє аналіз уже наявних зразків тканини; витрати пацієнта залежать від страхування. У наведеній документації немає відкритого коду моделі чи відкритої ліцензії.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) — безкоштовна онкологічна база знань із кодом під ліцензією MIT та посиланнями на джерела для перевірюваних чернеток обговорення. Її правила можна переглянути, але вона не аналізує зображення тканин, не прогнозує індивідуальний ризик рецидиву й не має клінічної валідації. Ataraxis може додати лабораторну оцінку ризику, а OpenOnco — впорядкувати запитання з джерелами для лікаря. Це різні робочі процеси; прямих доказів переваги будь-якого з них щодо клінічних результатів немає. Джерела перевірено 10 листопада 2026 року. Матеріал не замінює консультації лікаря.
translations:
  es:
    title: 'Ataraxis anuncia nueve estudios sobre cáncer de mama; habrá que examinar los resultados'
    summary: 'La empresa programa nueve presentaciones en SABCS; la evidencia previa es pronóstica y retrospectiva, mientras los nuevos hallazgos sobre beneficio terapéutico requieren evaluación.'
    body:
      - type: p
        text: >-
          El 9 de noviembre de 2026, Ataraxis AI anunció nueve estudios de Ataraxis Breast para el simposio SABCS de diciembre. Dos presentaciones de la primera sesión general analizan datos de los ensayos TAILORx y SWOG-8814. Las demás abordan recurrencia, beneficio de la quimioterapia y respuesta antes de la cirugía. Es un calendario de presentaciones, no nueve resultados recién publicados. La empresa habla de validación; los nuevos hallazgos deberán examinarse junto con sus métodos.
      - type: p
        text: >-
          Un artículo previo revisado por pares en Nature Communications incluyó a 8.161 mujeres, 3.502 de ellas en cohortes de evaluación externa. Un modelo de imágenes histológicas y datos clínicos distinguió retrospectivamente el riesgo de recurrencia (índice C combinado de 0,71). Es evidencia pronóstica, no prueba de que usar la prueba cambie decisiones terapéuticas o mejore la supervivencia. Según Ataraxis, el médico solicita el análisis de tejido ya obtenido; el coste depende del seguro. Las páginas citadas no ofrecen código público del modelo ni licencia abierta.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) es una base de conocimiento oncológico gratuita, con licencia MIT, reglas inspeccionables y fuentes para borradores revisables. No analiza láminas histológicas, no predice el riesgo individual de recurrencia y no tiene validación clínica. Ataraxis podría aportar una estimación de laboratorio; OpenOnco, preguntas con fuentes para el médico. Son procesos distintos y no hay comparación directa que demuestre mejores resultados clínicos con uno de ellos. Fuentes consultadas el 10 de noviembre de 2026. Este artículo no sustituye el consejo médico.
  pt:
    title: 'Ataraxis anuncia nove estudos sobre cancro da mama; os resultados ainda precisam de análise'
    summary: 'A empresa agendou nove apresentações no SABCS; a evidência anterior é prognóstica e retrospetiva, enquanto as novas alegações sobre benefício terapêutico exigem avaliação.'
    body:
      - type: p
        text: >-
          Em 9 de novembro de 2026, a Ataraxis AI anunciou nove estudos Ataraxis Breast para o simpósio SABCS de dezembro. Duas apresentações da primeira sessão geral analisam dados dos ensaios TAILORx e SWOG-8814. As restantes abordam recorrência, benefício da quimioterapia e resposta antes da cirurgia. É um calendário de apresentações, não nove resultados novos publicados. A empresa fala em validação; as conclusões novas terão de ser avaliadas com os respetivos métodos.
      - type: p
        text: >-
          Um artigo anterior revisto por pares na Nature Communications incluiu 8 161 mulheres, das quais 3 502 em coortes de avaliação externa. Um modelo de imagens histológicas e dados clínicos distinguiu retrospetivamente o risco de recorrência (índice C combinado de 0,71). Isto é evidência prognóstica, não prova de que o teste altere decisões terapêuticas ou aumente a sobrevivência. Segundo a Ataraxis, o médico requisita a análise de tecido já recolhido; o custo depende do seguro. As páginas citadas não disponibilizam o código do modelo nem uma licença aberta.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) é uma base de conhecimento oncológico gratuita, com licença MIT, regras inspecionáveis e fontes para rascunhos verificáveis. Não analisa lâminas histológicas, não prevê o risco individual de recorrência e não tem validação clínica. A Ataraxis poderá fornecer uma estimativa laboratorial; o OpenOnco poderá organizar perguntas com fontes para o médico. São fluxos distintos e não há comparação direta que demonstre melhores resultados clínicos para qualquer um. Fontes verificadas em 10 de novembro de 2026. Este artigo não substitui aconselhamento médico.
  de:
    title: 'Ataraxis kündigt neun Brustkrebsstudien an; die Ergebnisse müssen noch geprüft werden'
    summary: 'Neun SABCS-Vorträge sind angekündigt. Die bisherige Evidenz betrifft rückblickende Prognosen; neue Aussagen zum Therapienutzen müssen geprüft werden.'
    body:
      - type: p
        text: >-
          Am 9. November 2026 kündigte Ataraxis AI neun Ataraxis-Breast-Studien für das SABCS-Symposium im Dezember an. Zwei Vorträge der ersten Hauptsitzung analysieren Daten der Studien TAILORx und SWOG-8814. Weitere Themen sind Rückfallrisiko, Nutzen einer Chemotherapie und Ansprechen vor der Operation. Ein Vortragsprogramm ist noch keine Veröffentlichung von neun neuen Ergebnissen. Das Unternehmen spricht von Validierung; die neuen Befunde müssen anhand der Vorträge und Methoden beurteilt werden.
      - type: p
        text: >-
          Eine frühere begutachtete Arbeit in Nature Communications umfasste 8.161 Frauen, darunter 3.502 in externen Prüfkohorten. Ein Modell aus Gewebebildern und klinischen Daten unterschied rückblickend Rückfallrisiken (gepoolter C-Index 0,71). Das belegt prognostische Leistung, aber nicht, dass der Test Therapieentscheidungen verändert oder das Überleben verbessert. Laut Ataraxis bestellt ein Arzt die Untersuchung bereits entnommenen Gewebes; Eigenkosten hängen von der Versicherung ab. Die zitierten Produktseiten veröffentlichen weder Modellcode noch eine offene Lizenz.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) ist eine kostenlose onkologische Wissensbasis mit MIT-Lizenz, einsehbaren Regeln und Quellen für überprüfbare Diskussionsentwürfe. Es analysiert keine Gewebeschnitte, sagt kein individuelles Rückfallrisiko voraus und ist nicht klinisch validiert. Ataraxis könnte eine Labor-Risikoeinschätzung liefern; OpenOnco könnte Fragen mit Quellen für den Arzt ordnen. Das sind verschiedene Abläufe, ohne direkten Nachweis besserer klinischer Ergebnisse für eines der Angebote. Quellen geprüft am 10. November 2026. Dieser Text ersetzt keine ärztliche Beratung.
  fr:
    title: 'Ataraxis annonce neuf études sur le cancer du sein; les résultats restent à examiner'
    summary: 'Neuf présentations sont prévues au SABCS. Les données antérieures concernent un pronostic rétrospectif; les nouvelles affirmations sur le bénéfice thérapeutique demandent une évaluation.'
    body:
      - type: p
        text: >-
          Le 9 novembre 2026, Ataraxis AI a annoncé neuf études Ataraxis Breast pour le symposium SABCS de décembre. Deux présentations de la première séance générale analysent les données des essais TAILORx et SWOG-8814. Les autres portent sur la récidive, le bénéfice de la chimiothérapie et la réponse avant chirurgie. Il s’agit d’un programme, non de neuf résultats nouvellement publiés. L’entreprise parle de validation; les nouveaux résultats devront être évalués avec leurs méthodes.
      - type: p
        text: >-
          Un article antérieur évalué par les pairs dans Nature Communications portait sur 8 161 femmes, dont 3 502 dans des cohortes de validation externe. Un modèle combinant lames histologiques et données cliniques distinguait rétrospectivement les risques de récidive (indice C regroupé de 0,71). C’est une preuve pronostique, non la preuve que le test change les traitements ou améliore la survie. Selon Ataraxis, le médecin commande l’analyse de tissus déjà prélevés; le coût dépend de l’assurance. Les pages citées ne publient ni le code du modèle ni une licence ouverte.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) est une base de connaissances oncologiques gratuite, sous licence MIT, avec règles consultables et sources pour des brouillons vérifiables. Il n’analyse pas de lames, ne prédit pas le risque individuel de récidive et n’a pas de validation clinique. Ataraxis pourrait apporter une estimation de laboratoire; OpenOnco pourrait organiser des questions sourcées pour le médecin. Ces usages diffèrent et aucune comparaison directe ne démontre de meilleurs résultats cliniques pour l’un ou l’autre. Sources vérifiées le 10 novembre 2026. Ce texte ne remplace pas un avis médical.
  it:
    title: 'Ataraxis annuncia nove studi sul tumore al seno: i risultati sono ancora da valutare'
    summary: 'Sono previste nove presentazioni al SABCS. Le prove precedenti riguardano la prognosi retrospettiva; le nuove affermazioni sul beneficio terapeutico richiedono verifica.'
    body:
      - type: p
        text: >-
          Il 9 novembre 2026 Ataraxis AI ha annunciato nove studi Ataraxis Breast per il simposio SABCS di dicembre. Due presentazioni della prima sessione generale analizzano dati degli studi TAILORx e SWOG-8814. Le altre riguardano recidiva, beneficio della chemioterapia e risposta prima dell’intervento. Si tratta di un programma, non di nove nuovi risultati pubblicati. L’azienda parla di validazione; i nuovi risultati andranno valutati insieme ai metodi.
      - type: p
        text: >-
          Un precedente articolo sottoposto a revisione paritaria su Nature Communications comprendeva 8.161 donne, di cui 3.502 in coorti di valutazione esterna. Un modello basato su vetrini istologici e dati clinici distingueva retrospettivamente il rischio di recidiva (indice C aggregato 0,71). È evidenza prognostica, non la prova che usare il test cambi le cure o migliori la sopravvivenza. Secondo Ataraxis, il medico richiede l’analisi di tessuto già prelevato; il costo dipende dall’assicurazione. Le pagine citate non pubblicano il codice del modello né una licenza aperta.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) è una base di conoscenze oncologiche gratuita, con licenza MIT, regole consultabili e fonti per bozze verificabili. Non analizza vetrini, non predice il rischio individuale di recidiva e non ha validazione clinica. Ataraxis potrebbe fornire una stima di laboratorio; OpenOnco potrebbe organizzare domande documentate per il medico. Sono percorsi diversi e nessun confronto diretto dimostra risultati clinici migliori per uno dei due. Fonti verificate il 10 novembre 2026. Questo testo non sostituisce il parere medico.
  da:
    title: 'Ataraxis varsler ni brystkræftstudier; resultaterne mangler stadig vurdering'
    summary: 'Ni SABCS-præsentationer er planlagt. Tidligere evidens handler om retrospektiv prognose; nye påstande om behandlingsgevinst skal vurderes.'
    body:
      - type: p
        text: >-
          Den 9. november 2026 annoncerede Ataraxis AI ni Ataraxis Breast-studier til SABCS-symposiet i december. To præsentationer i den første hovedsession analyserer data fra TAILORx og SWOG-8814. De øvrige omhandler tilbagefald, gevinst ved kemoterapi og respons før operation. Det er et program, ikke ni nyligt offentliggjorte resultater. Virksomheden kalder arbejdet validering; nye resultater må vurderes ud fra præsentationer og metoder.
      - type: p
        text: >-
          En tidligere fagfællebedømt artikel i Nature Communications omfattede 8.161 kvinder, heraf 3.502 i eksterne evalueringskohorter. En model med vævsbilleder og kliniske data skelnede retrospektivt mellem risiko for tilbagefald (samlet C-indeks 0,71). Det er prognostisk evidens, ikke bevis for at testen ændrer behandling eller forbedrer overlevelse. Ifølge Ataraxis bestiller lægen analysen af allerede udtaget væv; egenbetaling afhænger af forsikring. De citerede sider offentliggør hverken modelkode eller åben licens.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) er en gratis onkologisk vidensbase med MIT-licens, læsbare regler og kilder til gennemgåelige diskussionsudkast. Den analyserer ikke vævssnit, forudsiger ikke individuel tilbagefaldsrisiko og er ikke klinisk valideret. Ataraxis kan muligvis give et laboratoriebaseret risikoestimat; OpenOnco kan ordne kildebelagte spørgsmål til lægen. Arbejdsgangene er forskellige, og ingen direkte sammenligning viser bedre kliniske resultater for nogen af dem. Kilder kontrolleret 10. november 2026. Artiklen erstatter ikke lægelig rådgivning.
  sv:
    title: 'Ataraxis aviserar nio bröstcancerstudier; resultaten behöver fortfarande granskas'
    summary: 'Nio SABCS-presentationer är planerade. Äldre evidens gäller retrospektiv prognos; nya påståenden om behandlingsnytta behöver bedömas.'
    body:
      - type: p
        text: >-
          Den 9 november 2026 aviserade Ataraxis AI nio Ataraxis Breast-studier till SABCS-symposiet i december. Två presentationer under första huvudsessionen analyserar data från TAILORx och SWOG-8814. Övriga rör återfall, nytta av cytostatika och svar före operation. Det är ett presentationsprogram, inte nio nya publicerade resultat. Företaget kallar arbetet validering; nya fynd måste bedömas utifrån presentationerna och metoderna.
      - type: p
        text: >-
          En tidigare sakkunniggranskad artikel i Nature Communications omfattade 8 161 kvinnor, varav 3 502 i externa utvärderingskohorter. En modell med vävnadsbilder och kliniska data skilde retrospektivt mellan återfallsrisker (sammanvägt C-index 0,71). Det är prognostisk evidens, inte bevis för att testet ändrar behandling eller förbättrar överlevnad. Enligt Ataraxis beställer läkaren analys av redan insamlad vävnad; egenkostnaden beror på försäkring. De citerade sidorna publicerar varken modellkod eller öppen licens.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) är en kostnadsfri onkologisk kunskapsbas med MIT-licens, läsbara regler och källor för granskningsbara diskussionsutkast. Den analyserar inte vävnadssnitt, förutsäger inte individuell återfallsrisk och saknar klinisk validering. Ataraxis skulle kunna bidra med en laboratoriebaserad riskuppskattning; OpenOnco kan ordna källbelagda frågor till läkaren. Arbetsflödena skiljer sig och ingen direkt jämförelse visar bättre kliniska utfall för något av dem. Källor kontrollerade 10 november 2026. Texten ersätter inte medicinsk rådgivning.
  nb:
    title: 'Ataraxis varsler ni brystkreftstudier; resultatene må fortsatt vurderes'
    summary: 'Ni SABCS-presentasjoner er planlagt. Tidligere dokumentasjon gjelder retrospektiv prognose; nye påstander om behandlingsgevinst må vurderes.'
    body:
      - type: p
        text: >-
          Den 9. november 2026 varslet Ataraxis AI ni Ataraxis Breast-studier til SABCS-symposiet i desember. To presentasjoner i første hovedsesjon analyserer data fra TAILORx og SWOG-8814. Andre gjelder tilbakefall, nytte av cellegift og respons før operasjon. Dette er et program, ikke ni nye publiserte resultater. Selskapet kaller arbeidet validering; nye funn må vurderes ut fra presentasjonene og metodene.
      - type: p
        text: >-
          En tidligere fagfellevurdert artikkel i Nature Communications omfattet 8 161 kvinner, derav 3 502 i eksterne evalueringskohorter. En modell med vevsbilder og kliniske data skilte retrospektivt mellom risiko for tilbakefall (samlet C-indeks 0,71). Det er prognostisk dokumentasjon, ikke bevis for at testen endrer behandling eller forbedrer overlevelse. Ifølge Ataraxis bestiller legen analyse av allerede innsamlet vev; egenbetaling avhenger av forsikring. De siterte sidene publiserer verken modellkode eller åpen lisens.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) er en gratis onkologisk kunnskapsbase med MIT-lisens, innsyn i reglene og kilder til gjennomgåelige diskusjonsutkast. Den analyserer ikke vevssnitt, forutsier ikke individuell tilbakefallsrisiko og er ikke klinisk validert. Ataraxis kan gi et laboratoriebasert risikoestimat; OpenOnco kan samle kildebelagte spørsmål til legen. Arbeidsflytene er ulike, og ingen direkte sammenligning viser bedre kliniske utfall for noen av dem. Kilder kontrollert 10. november 2026. Teksten erstatter ikke medisinske råd.
  fi:
    title: 'Ataraxis ilmoittaa yhdeksästä rintasyöpätutkimuksesta; tulokset odottavat arviointia'
    summary: 'SABCS-kokoukseen on ohjelmoitu yhdeksän esitystä. Aiempi näyttö koskee jälkikäteistä ennustamista; uudet väitteet hoidon hyödystä on vielä arvioitava.'
    body:
      - type: p
        text: >-
          Ataraxis AI ilmoitti 9. marraskuuta 2026 yhdeksästä Ataraxis Breast -tutkimuksesta, jotka esitellään joulukuun SABCS-kokouksessa. Kaksi ensimmäisen pääistunnon esitystä analysoi TAILORx- ja SWOG-8814-tutkimusten aineistoja. Muut käsittelevät uusiutumista, solunsalpaajahoidon hyötyä ja vastetta ennen leikkausta. Kyse on esitysohjelmasta, ei yhdeksästä uudesta julkaistusta tuloksesta. Yhtiö puhuu validoinnista; uusia tuloksia on arvioitava menetelmien ja varsinaisten esitysten perusteella.
      - type: p
        text: >-
          Aiempi vertaisarvioitu Nature Communications -artikkeli käsitti 8 161 naista, joista 3 502 kuului ulkoisiin arviointiaineistoihin. Kudoskuvia ja kliinisiä tietoja yhdistävä malli erotteli uusiutumisriskin jälkikäteen (yhdistetty C-indeksi 0,71). Tämä on ennusteeseen liittyvää näyttöä, ei todistus siitä, että testin käyttö muuttaa hoitoa tai pidentää elossaoloa. Ataraxisin mukaan lääkäri tilaa jo otetun kudoksen analyysin; potilaan maksuosuus riippuu vakuutuksesta. Viitatut sivut eivät julkaise mallin koodia tai avointa lisenssiä.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) on maksuton, MIT-lisensoitu onkologian tietopankki, jonka säännöt ja lähteet voi tarkistaa keskusteluluonnoksia varten. Se ei analysoi kudosleikkeitä, ennusta yksilöllistä uusiutumisriskiä eikä ole kliinisesti validoitu. Ataraxis voi antaa laboratoriossa tuotetun riskiarvion; OpenOnco voi jäsentää lähteisiin perustuvia kysymyksiä lääkärille. Työnkulut ovat erilaisia, eikä suoraa näyttöä toisen paremmista hoitotuloksista ole. Lähteet tarkistettu 10. marraskuuta 2026. Teksti ei korvaa lääkärin neuvoja.
