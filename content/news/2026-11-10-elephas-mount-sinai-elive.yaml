series_format: startup
author: OpenOnco
tags: [startup, bladder-cancer, immunotherapy, diagnostics, evidence]
title:
  en: 'Elephas brings live-tumour technology to Mount Sinai; a research placement, not a care result'
  uk: 'Elephas передає технологію для живої пухлинної тканини Mount Sinai: це дослідження, а не результат лікування'
summary:
  en: 'The elive Edge instrument will prepare bladder-tumour samples for research. A small earlier validation cohort cannot establish benefit for patients with bladder cancer.'
  uk: 'Прилад elive Edge готуватиме зразки пухлин сечового міхура для досліджень. Невелика попередня валідаційна група не доводить користі для пацієнтів.'
sources:
  - citation: 'Elephas. Mount Sinai elive Edge placement announcement, 10 November 2026; company account. Checked 15 November 2026.'
    id: https://www.prnewswire.com/news-releases/elephas-places-elive-technology-at-mount-sinai-to-support-bladder-cancer-research-302934981.html
  - citation: 'Elephas. Product development and observational trials; research-use limitation. Checked 15 November 2026.'
    id: https://elephas.com/resources/clinical-trials
  - citation: 'Braun et al. Prediction of immunotherapy response using live tumor fragments from routine clinical biopsies. Cell Reports Medicine, 15 October 2026. PMID 42880280.'
    id: https://pubmed.ncbi.nlm.nih.gov/42880280/
  - citation: 'U.S. National Cancer Institute. ELEPHAS-04 observational study description. Checked 15 November 2026.'
    id: https://www.cancer.gov/research/participate/clinical-trials-search/v?id=NCI-2024-02979
  - citation: 'OpenOnco. Product scope and limitations, master checked 15 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/25247beea9/README.md
  - citation: 'OpenOnco. MIT code licence, master checked 15 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/25247beea9/LICENSE
body:
  en:
    - type: p
      text: >-
        On 10 November 2026, Elephas said its elive Edge instrument had been placed with Mount Sinai researchers. It cuts live bladder-tumour tissue from biopsies and resection samples into uniform fragments for laboratory studies of immunotherapy response. The announcement reports a research placement, with no bladder-specific accuracy figures or patient outcomes.
    - type: p
      text: >-
        Elephas tests how living tumour fragments react outside the body. An October peer-reviewed observational paper included biopsies from 228 people with suspected cancers; its assay result agreed with clinical benefit in 26 of 28 people in the reported outcome subset. That small, mixed-cancer subset does not establish accuracy in bladder cancer or improved care. Elephas labels its clinical-trial platform research-use-only. The reviewed product pages give no public code licence or patient price.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) offers free, MIT-licensed rules and cited sources for drafts that a clinician can review. It uses entered case details and published evidence, not living tissue; it cannot measure a tumour's drug response and is not clinically validated. The tools address different questions, and there is no direct comparison showing better patient outcomes. Sources checked 15 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        10 листопада 2026 року Elephas повідомила, що передала дослідникам Mount Sinai прилад elive Edge. Він нарізає живу тканину пухлини сечового міхура з біопсій і резекцій на однакові фрагменти для лабораторного вивчення відповіді на імунотерапію. Повідомлення стосується дослідницького застосування; даних про точність саме при раку сечового міхура чи результати для пацієнтів у ньому немає.
    - type: p
      text: >-
        Elephas перевіряє реакцію живих фрагментів пухлини поза організмом. У рецензованому обсерваційному дослідженні за жовтень використали біопсії 228 людей із підозрою на різні види раку; результат аналізу збігся з клінічною користю у 26 із 28 людей у групі з відомим результатом. Така мала змішана група не доводить точності при раку сечового міхура чи поліпшення лікування. Elephas позначає платформу для досліджень як не призначену для діагностики. На перевірених сторінках немає відкритої ліцензії коду або ціни для пацієнта.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) пропонує безкоштовні правила під ліцензією MIT і джерела для чернеток, які має перевірити лікар. Він працює з введеними відомостями про випадок та опублікованими доказами, а не з живою тканиною; не вимірює відповідь пухлини на ліки й не має клінічної валідації. Інструменти відповідають на різні запитання, прямого порівняння щодо результатів пацієнтів немає. Джерела перевірено 15 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Elephas lleva tejido tumoral vivo a Mount Sinai: una colaboración de investigación, no un resultado clínico'
    summary: 'elive Edge preparará muestras de tumores de vejiga para investigación. Una pequeña cohorte previa no demuestra beneficio para estos pacientes.'
    body:
      - type: p
        text: >-
          El 10 de noviembre de 2026, Elephas comunicó la instalación de elive Edge para investigadores de Mount Sinai. El instrumento corta tejido vivo de tumores de vejiga procedente de biopsias y resecciones en fragmentos uniformes para estudiar en el laboratorio la respuesta a la inmunoterapia. El anuncio describe una colaboración de investigación; no aporta cifras de precisión específicas del cáncer de vejiga ni resultados de pacientes.
      - type: p
        text: >-
          Elephas estudia cómo reaccionan fragmentos tumorales vivos fuera del organismo. Un estudio observacional revisado por pares publicado en octubre incluyó biopsias de 228 personas con sospecha de distintos cánceres; el resultado del ensayo coincidió con el beneficio clínico en 26 de 28 personas del subgrupo con resultados comunicados. Ese subgrupo pequeño y heterogéneo no establece precisión en cáncer de vejiga ni mejoras asistenciales. Elephas indica que su plataforma de ensayos es solo para investigación. Las páginas consultadas no publican licencia del código ni precio para pacientes.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) ofrece reglas gratuitas con licencia MIT y fuentes citadas para borradores revisables por un médico. Usa datos introducidos del caso y evidencia publicada, no tejido vivo; no mide la respuesta tumoral a fármacos ni está validado clínicamente. Las herramientas responden a preguntas distintas y no existe una comparación directa que demuestre mejores resultados para pacientes. Fuentes comprobadas el 15 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Elephas leva tecnologia de tecido tumoral vivo ao Mount Sinai: investigação, não um resultado clínico'
    summary: 'O elive Edge preparará amostras de tumores da bexiga para investigação. Uma pequena coorte anterior não demonstra benefício para estes doentes.'
    body:
      - type: p
        text: >-
          Em 10 de novembro de 2026, a Elephas anunciou a instalação do elive Edge para investigadores do Mount Sinai. O aparelho corta tecido vivo de tumores da bexiga proveniente de biópsias e resseções em fragmentos uniformes para estudar em laboratório a resposta à imunoterapia. O anúncio descreve uma utilização em investigação; não apresenta números de precisão específicos para cancro da bexiga nem resultados dos doentes.
      - type: p
        text: >-
          A Elephas estuda a reação de fragmentos tumorais vivos fora do organismo. Um estudo observacional revisto por pares, publicado em outubro, incluiu biópsias de 228 pessoas com suspeita de vários cancros; o resultado do ensaio coincidiu com benefício clínico em 26 de 28 pessoas no subgrupo com resultados comunicados. Este subgrupo pequeno e misto não demonstra precisão no cancro da bexiga nem melhores cuidados. A Elephas classifica a plataforma dos ensaios como destinada apenas a investigação. As páginas consultadas não apresentam licença pública do código nem preço para doentes.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) oferece regras gratuitas com licença MIT e fontes citadas para rascunhos a rever por um médico. Usa dados introduzidos sobre o caso e evidência publicada, não tecido vivo; não mede a resposta tumoral a medicamentos nem está clinicamente validado. As ferramentas respondem a perguntas diferentes e não há comparação direta que demonstre melhores resultados para doentes. Fontes verificadas em 15 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Elephas bringt Technik für lebendes Tumorgewebe an den Mount Sinai: Forschung, kein Behandlungsergebnis'
    summary: 'elive Edge bereitet Blasentumorproben für die Forschung auf. Eine kleine frühere Prüfgruppe belegt keinen Nutzen für diese Patienten.'
    body:
      - type: p
        text: >-
          Am 10. November 2026 meldete Elephas, dass das Gerät elive Edge Forschenden am Mount Sinai zur Verfügung gestellt wurde. Es zerteilt lebendes Gewebe aus Blasentumorbiopsien und Resektaten in gleichmäßige Fragmente, um im Labor die Reaktion auf Immuntherapie zu untersuchen. Die Mitteilung beschreibt einen Forschungseinsatz; Zahlen zur Genauigkeit speziell bei Blasenkrebs oder zu Patientenergebnissen nennt sie nicht.
      - type: p
        text: >-
          Elephas untersucht, wie lebende Tumorfragmente außerhalb des Körpers reagieren. Eine im Oktober veröffentlichte begutachtete Beobachtungsstudie umfasste Biopsien von 228 Menschen mit Verdacht auf verschiedene Krebsarten; bei 26 von 28 Personen der berichteten Ergebnisgruppe stimmte das Testergebnis mit einem klinischen Nutzen überein. Diese kleine, gemischte Gruppe belegt weder Genauigkeit bei Blasenkrebs noch eine bessere Versorgung. Elephas kennzeichnet die Studienplattform als ausschließlich für die Forschung bestimmt. Die geprüften Produktseiten nennen weder eine öffentliche Codelizenz noch einen Patientenpreis.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) bietet kostenlose Regeln unter MIT-Lizenz und zitierte Quellen für ärztlich prüfbare Entwürfe. Es nutzt eingegebene Falldaten und veröffentlichte Evidenz, kein lebendes Gewebe; es misst keine Tumorreaktion auf Arzneimittel und ist nicht klinisch validiert. Die Werkzeuge beantworten unterschiedliche Fragen; ein direkter Vergleich mit besseren Patientenergebnissen fehlt. Quellen geprüft am 15. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Elephas apporte la technologie des tissus tumoraux vivants au Mount Sinai : une recherche, pas un résultat clinique'
    summary: 'elive Edge préparera des échantillons de tumeurs vésicales pour la recherche. Une petite cohorte antérieure ne prouve aucun bénéfice pour ces patients.'
    body:
      - type: p
        text: >-
          Le 10 novembre 2026, Elephas a annoncé la mise à disposition de son appareil elive Edge aux chercheurs du Mount Sinai. Il découpe des tissus vivants de tumeurs de la vessie issus de biopsies et de résections en fragments uniformes pour étudier au laboratoire la réponse à l’immunothérapie. L’annonce porte sur la recherche ; elle ne donne ni précision propre au cancer de la vessie ni résultats pour les patients.
      - type: p
        text: >-
          Elephas étudie la réaction de fragments tumoraux vivants hors du corps. Une étude observationnelle évaluée par les pairs, publiée en octobre, incluait des biopsies de 228 personnes présentant une suspicion de cancers divers ; le résultat du test concordait avec un bénéfice clinique chez 26 des 28 personnes du sous-groupe aux résultats rapportés. Ce sous-groupe restreint et hétérogène ne démontre ni précision dans le cancer de la vessie ni amélioration des soins. Elephas réserve la plateforme des essais à la recherche. Les pages examinées ne donnent ni licence publique du code ni prix pour les patients.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) propose gratuitement des règles sous licence MIT et des sources citées pour des brouillons à vérifier par un médecin. Il utilise les données saisies du cas et les preuves publiées, pas des tissus vivants ; il ne mesure pas la réponse d’une tumeur aux médicaments et n’est pas validé cliniquement. Ces outils répondent à des questions différentes et aucune comparaison directe ne démontre de meilleurs résultats pour les patients. Sources vérifiées le 15 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Elephas porta la tecnologia per tessuto tumorale vivo al Mount Sinai: ricerca, non un esito clinico'
    summary: 'elive Edge preparerà campioni di tumori della vescica per la ricerca. Una piccola coorte precedente non dimostra benefici per questi pazienti.'
    body:
      - type: p
        text: >-
          Il 10 novembre 2026 Elephas ha annunciato che lo strumento elive Edge è stato collocato presso i ricercatori del Mount Sinai. Taglia il tessuto vivo di tumori della vescica ottenuto da biopsie e resezioni in frammenti uniformi per studiare in laboratorio la risposta all’immunoterapia. L’annuncio riguarda la ricerca: non fornisce dati di accuratezza specifici per il tumore della vescica né esiti dei pazienti.
      - type: p
        text: >-
          Elephas studia come reagiscono frammenti tumorali vivi fuori dal corpo. Uno studio osservazionale sottoposto a revisione paritaria, pubblicato in ottobre, comprendeva biopsie di 228 persone con sospetto di diversi tumori; il risultato del test concordava con il beneficio clinico in 26 delle 28 persone del sottogruppo con esiti riportati. Questo sottogruppo piccolo ed eterogeneo non dimostra accuratezza nel tumore della vescica né migliori cure. Elephas indica la piattaforma sperimentale come destinata alla sola ricerca. Le pagine consultate non riportano una licenza pubblica del codice o un prezzo per i pazienti.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) offre gratuitamente regole con licenza MIT e fonti citate per bozze da verificare con un medico. Utilizza dati del caso inseriti dall’utente e prove pubblicate, non tessuto vivo; non misura la risposta del tumore ai farmaci e non è clinicamente validato. Gli strumenti rispondono a domande diverse e manca un confronto diretto che dimostri migliori esiti per i pazienti. Fonti verificate il 15 novembre 2026. Questo articolo non sostituisce il medico.
  da:
    title: 'Elephas bringer teknologi til levende tumorvæv til Mount Sinai: forskning, ikke et behandlingsresultat'
    summary: 'elive Edge skal forberede prøver fra blæretumorer til forskning. En lille tidligere gruppe dokumenterer ikke gavn for disse patienter.'
    body:
      - type: p
        text: >-
          Den 10. november 2026 meddelte Elephas, at instrumentet elive Edge var stillet til rådighed for forskere på Mount Sinai. Det skærer levende væv fra blæretumorbiopsier og resektioner i ensartede fragmenter til laboratorieundersøgelser af respons på immunterapi. Meddelelsen handler om forskning; den indeholder hverken tal for nøjagtighed specifikt ved blærekræft eller patientresultater.
      - type: p
        text: >-
          Elephas undersøger, hvordan levende tumorfragmenter reagerer uden for kroppen. Et fagfællebedømt observationsstudie fra oktober omfattede biopsier fra 228 personer med mistanke om forskellige kræftformer; testresultatet stemte overens med klinisk gavn hos 26 af 28 personer i den rapporterede resultatgruppe. Den lille, blandede gruppe dokumenterer hverken nøjagtighed ved blærekræft eller bedre behandling. Elephas angiver, at forsøgsplatformen kun er til forskning. De gennemgåede produktsider oplyser ingen offentlig kodelicens eller patientpris.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) tilbyder gratis regler under MIT-licens og kildehenvisninger til udkast, som en læge kan gennemgå. Det bruger indtastede sagsoplysninger og offentliggjort evidens, ikke levende væv; det måler ikke tumors respons på lægemidler og er ikke klinisk valideret. Værktøjerne besvarer forskellige spørgsmål, og der findes ingen direkte sammenligning, der viser bedre patientresultater. Kilder kontrolleret 15. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Elephas för teknik för levande tumörvävnad till Mount Sinai: forskning, inget vårdresultat'
    summary: 'elive Edge ska bereda prover från blåstumörer för forskning. En liten tidigare grupp visar inte nytta för dessa patienter.'
    body:
      - type: p
        text: >-
          Den 10 november 2026 meddelade Elephas att instrumentet elive Edge placerats hos forskare vid Mount Sinai. Det skär levande vävnad från biopsier och resektioner av blåstumörer i jämna fragment för laboratoriestudier av svar på immunterapi. Meddelandet gäller forskning; det innehåller varken siffror för träffsäkerhet specifikt vid blåscancer eller patientutfall.
      - type: p
        text: >-
          Elephas undersöker hur levande tumörfragment reagerar utanför kroppen. En sakkunniggranskad observationsstudie från oktober omfattade biopsier från 228 personer med misstanke om olika cancersjukdomar; testresultatet stämde med klinisk nytta hos 26 av 28 personer i den redovisade utfallsgruppen. Den lilla, blandade gruppen visar varken träffsäkerhet vid blåscancer eller bättre vård. Elephas anger att studieplattformen endast är avsedd för forskning. De granskade produktsidorna anger ingen offentlig kodlicens eller kostnad för patienter.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) erbjuder kostnadsfria regler med MIT-licens och källhänvisningar för utkast som en läkare kan granska. Det använder inmatade falluppgifter och publicerad evidens, inte levande vävnad; det mäter inte tumörens läkemedelssvar och är inte kliniskt validerat. Verktygen besvarar olika frågor och ingen direkt jämförelse visar bättre patientutfall. Källor kontrollerade den 15 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Elephas tar teknologi for levende svulstvev til Mount Sinai: forskning, ikke et behandlingsresultat'
    summary: 'elive Edge skal klargjøre prøver fra blæresvulster til forskning. En liten tidligere gruppe viser ikke nytte for disse pasientene.'
    body:
      - type: p
        text: >-
          Den 10. november 2026 opplyste Elephas at instrumentet elive Edge var plassert hos forskere ved Mount Sinai. Det skjærer levende vev fra biopsier og reseksjoner av blæresvulster i jevne fragmenter til laboratoriestudier av respons på immunterapi. Meldingen gjelder forskning; den oppgir verken tall for nøyaktighet spesielt ved blærekreft eller pasientutfall.
      - type: p
        text: >-
          Elephas undersøker hvordan levende svulstfragmenter reagerer utenfor kroppen. En fagfellevurdert observasjonsstudie fra oktober omfattet biopsier fra 228 personer med mistanke om ulike kreftformer; testresultatet samsvarte med klinisk nytte hos 26 av 28 personer i den rapporterte utfallsgruppen. Den lille, sammensatte gruppen viser verken nøyaktighet ved blærekreft eller bedre behandling. Elephas merker studieplattformen som kun til forskning. De gjennomgåtte produktsidene oppgir ingen offentlig kodelisens eller pris for pasienter.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) tilbyr gratis regler med MIT-lisens og kildehenvisninger til utkast som en lege kan gjennomgå. Det bruker innlagte saksopplysninger og publisert evidens, ikke levende vev; det måler ikke svulstens respons på legemidler og er ikke klinisk validert. Verktøyene svarer på ulike spørsmål, og ingen direkte sammenligning viser bedre pasientutfall. Kilder kontrollert 15. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Elephas tuo elävän kasvainkudoksen teknologiaa Mount Sinaihin: tutkimusta, ei hoitotulos'
    summary: 'elive Edge valmistelee virtsarakon kasvainnäytteitä tutkimukseen. Pieni aiempi ryhmä ei osoita hyötyä näille potilaille.'
    body:
      - type: p
        text: >-
          Elephas ilmoitti 10. marraskuuta 2026, että elive Edge -laite oli toimitettu Mount Sinain tutkijoille. Se leikkaa virtsarakon kasvaimen koepaloista ja poistoleikkausnäytteistä saatua elävää kudosta tasakokoisiksi paloiksi immunoterapiavasteen laboratoriotutkimusta varten. Tiedote koskee tutkimuskäyttöä; siinä ei esitetä virtsarakon syöpää koskevia tarkkuuslukuja eikä potilaiden hoitotuloksia.
      - type: p
        text: >-
          Elephas tutkii elävien kasvainpalojen reaktiota kehon ulkopuolella. Lokakuussa julkaistussa vertaisarvioidussa havainnointitutkimuksessa oli koepaloja 228 ihmiseltä, joilla epäiltiin eri syöpiä; testitulos vastasi kliinistä hyötyä 26:lla 28:sta raportoidun tulosryhmän henkilöstä. Pieni, eri syöpiä sisältävä ryhmä ei osoita tarkkuutta virtsarakon syövässä eikä parempaa hoitoa. Elephas ilmoittaa tutkimusalustan olevan vain tutkimuskäyttöön. Tarkastetuilla tuotesivuilla ei ole julkista koodilisenssiä eikä potilashintaa.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) tarjoaa maksuttomia MIT-lisensoituja sääntöjä ja lähdeviitteitä luonnoksiin, jotka lääkärin tulee tarkistaa. Se käyttää syötettyjä tapaustietoja ja julkaistua näyttöä, ei elävää kudosta; se ei mittaa kasvaimen lääkevastetta eikä ole kliinisesti validoitu. Työkalut vastaavat eri kysymyksiin, eikä suora vertailu osoita parempia potilastuloksia. Lähteet tarkistettu 15. marraskuuta 2026. Artikkeli ei korvaa lääkäriä.
