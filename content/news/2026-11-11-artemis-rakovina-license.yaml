slug: artemis-rakovina-license
date: 2026-11-10
published: 2026-11-11
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, drug-discovery, licensing, evidence]
title:
  en: 'Artemis and Rakovina sign an AI drug-discovery licence, not a cancer treatment result'
  uk: 'Artemis і Rakovina уклали ліцензійну угоду щодо пошуку ліків ШІ — це ще не результат лікування'
summary:
  en: 'A C$1 million share-based agreement gives Rakovina exclusive use of Artemis.AI for DNA-damage-response oncology discovery. It is a commercial milestone, not clinical validation.'
  uk: 'Угода на акції вартістю 1 млн канадських доларів дає Rakovina виключне право використовувати Artemis.AI для пошуку онкопрепаратів. Це комерційний крок, а не клінічна валідація.'
sources:
  - citation: 'Rakovina Therapeutics. Exclusive Artemis.AI licence announcement, 10 November 2026. Checked 11 November 2026.'
    id: https://www.globenewswire.com/news-release/2026/11/10/3399648/0/en/rakovina-therapeutics-secures-exclusive-worldwide-licence-to-artemis-ai-platform-for-dna-damage-response-oncology-drug-discovery.html
  - citation: 'Artemis Therapeutics. Licensing announcement, 10 November 2026. Checked 11 November 2026; gives a different agreement effective date from Rakovina.'
    id: https://www.artemistherapeutics.ai/2026/11/10/artemis-therapeutics-announces-1-million-ai-technology-licensing-agreement-with-rakovina-therapeutics/
  - citation: 'Artemis Therapeutics. Science and platform description. Checked 11 November 2026.'
    id: https://www.artemistherapeutics.ai/science-2/
  - citation: 'OpenOnco. Product description and limitations, master checked 11 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/c06496bdf3a25513062a0e7001efb6d1ef88361c/README.md
  - citation: 'OpenOnco. MIT code licence, master checked 11 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/c06496bdf3a25513062a0e7001efb6d1ef88361c/LICENSE
body:
  en:
    - type: p
      text: >-
        On 10 November 2026, private company Artemis Therapeutics and Rakovina Therapeutics announced a licence for Artemis.AI in DNA-damage-response cancer drug discovery. Rakovina describes an exclusive, worldwide, perpetual field licence in exchange for shares valued at C$1 million, subject to exchange acceptance. Artemis retains its proprietary platform; Rakovina owns compounds and data it generates. A possible co-development deal for any candidate would need a separate agreement. The two company releases disagree on the licence's effective date (9 November versus 15 October); we cannot resolve that from these sources.
    - type: p
      text: >-
        Artemis describes AI-assisted molecular modelling and virtual screening to propose small molecules for laboratory testing. The agreement is evidence of a business transaction, not evidence that a new drug works in people. Neither release reports a new candidate's clinical results, an approved treatment, or improved survival. Artemis does not publish the platform's model code or an open licence on its cited product pages. The C$1 million figure is contract consideration in shares, not a patient price; this is a research partnership, not a public clinical service.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) serves a later, different task: free MIT-licensed rules and source links help assemble a reviewable oncology discussion draft. Its rules are inspectable, but OpenOnco does not design molecules or have clinical validation. Artemis could help discover candidates years upstream of care; OpenOnco can organise existing evidence for discussion. No direct comparison shows that either improves patient outcomes more. Sources and product pages checked 11 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        10 листопада 2026 року приватна компанія Artemis Therapeutics і Rakovina Therapeutics повідомили про ліцензію на Artemis.AI для пошуку онкопрепаратів, що впливають на репарацію ДНК. За повідомленням Rakovina, це виключне, всесвітнє й безстрокове право в певній галузі в обмін на акції вартістю 1 млн канадських доларів; потрібне схвалення біржі. Artemis зберігає власність на платформу, Rakovina — на створені нею сполуки й дані. Спільну розробку конкретного кандидата доведеться оформлювати окремо. Компанії називають різні дати набрання угодою чинності — 9 листопада та 15 жовтня; ці джерела не дозволяють з’ясувати причину розбіжності.
    - type: p
      text: >-
        Artemis описує комп’ютерне моделювання молекул і віртуальний скринінг за допомогою ШІ, щоб запропонувати сполуки для лабораторної перевірки. Угода підтверджує бізнесову подію, а не ефективність нового препарату в людей. Жодне повідомлення не містить нових клінічних результатів кандидата, схваленого лікування чи даних про подовження життя. На наведених сторінках Artemis не публікує код моделі або відкриту ліцензію. 1 млн канадських доларів — вартість акцій за контрактом, а не ціна для пацієнта; це дослідницьке партнерство, а не загальнодоступний клінічний сервіс.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) виконує іншу, пізнішу в дослідницькому ланцюгу роботу: безкоштовні правила під ліцензією MIT і джерела допомагають скласти перевірювану чернетку онкологічного обговорення. Її правила відкриті, але вона не створює молекул і не має клінічної валідації. Artemis може допомагати шукати сполуки задовго до їхнього можливого застосування, а OpenOnco — впорядковувати наявні докази. Прямого порівняння впливу цих інструментів на результати пацієнтів немає. Джерела й сторінки продуктів перевірено 11 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Artemis y Rakovina licencian IA para descubrir fármacos; aún no es un resultado terapéutico'
    summary: 'Un acuerdo en acciones valorado en 1 millón de dólares canadienses concede a Rakovina uso exclusivo de Artemis.AI en un campo oncológico. Es un hito comercial, no validación clínica.'
    body:
      - type: p
        text: >-
          El 10 de noviembre de 2026, la empresa privada Artemis Therapeutics y Rakovina Therapeutics anunciaron una licencia de Artemis.AI para descubrir fármacos oncológicos dirigidos a la respuesta al daño del ADN. Según Rakovina, es exclusiva, mundial y perpetua en ese campo, a cambio de acciones valoradas en C$1 millón y sujeta a aprobación bursátil. Artemis conserva la plataforma; Rakovina, los compuestos y datos que genere. Cualquier codesarrollo requiere otro acuerdo. Los comunicados discrepan sobre la fecha de entrada en vigor: 9 de noviembre frente a 15 de octubre; estas fuentes no aclaran la diferencia.
      - type: p
        text: >-
          Artemis describe modelado molecular y cribado virtual asistidos por IA para proponer moléculas que luego se probarían en laboratorio. El contrato acredita una transacción, no que un nuevo fármaco funcione en personas. Ningún comunicado presenta resultados clínicos nuevos, un tratamiento aprobado o mayor supervivencia. Las páginas citadas no publican el código del modelo ni una licencia abierta. C$1 millón es el valor de acciones del contrato, no el precio para pacientes; se trata de investigación, no de un servicio clínico público.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) aborda otra tarea posterior: reglas gratuitas bajo licencia MIT y fuentes para borradores oncológicos revisables. Sus reglas son inspeccionables, pero no diseña moléculas ni tiene validación clínica. Artemis podría ayudar a descubrir candidatos mucho antes de su uso; OpenOnco organiza la evidencia existente para debatirla. No hay comparación directa que demuestre mejores resultados para pacientes con uno u otro. Fuentes y productos comprobados el 11 de noviembre de 2026. Este texto no sustituye a un médico.
  pt:
    title: 'Artemis e Rakovina licenciam IA para descobrir fármacos; ainda não é um resultado terapêutico'
    summary: 'Um acordo em ações avaliado em 1 milhão de dólares canadianos dá à Rakovina uso exclusivo de Artemis.AI numa área oncológica. É um marco comercial, não validação clínica.'
    body:
      - type: p
        text: >-
          Em 10 de novembro de 2026, a empresa privada Artemis Therapeutics e a Rakovina Therapeutics anunciaram uma licença da Artemis.AI para descobrir fármacos oncológicos ligados à resposta a danos no ADN. Segundo a Rakovina, é exclusiva, mundial e perpétua nesse campo, em troca de ações avaliadas em C$1 milhão e sujeita à aprovação da bolsa. A Artemis mantém a plataforma; a Rakovina fica com as moléculas e os dados que gerar. Qualquer codesenvolvimento exigirá outro acordo. Os comunicados indicam datas de entrada em vigor diferentes: 9 de novembro e 15 de outubro; estas fontes não esclarecem a divergência.
      - type: p
        text: >-
          A Artemis descreve modelação molecular e rastreio virtual assistidos por IA para propor moléculas a testar em laboratório. O contrato confirma uma transação, não que um novo fármaco funcione em pessoas. Nenhum comunicado apresenta novos resultados clínicos, tratamento aprovado ou aumento da sobrevivência. As páginas citadas não publicam o código do modelo nem uma licença aberta. C$1 milhão é o valor das ações do contrato, não um preço para doentes; trata-se de investigação, não de um serviço clínico público.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) tem outra tarefa, mais próxima da discussão clínica: regras gratuitas sob licença MIT e fontes para rascunhos oncológicos verificáveis. As regras são inspecionáveis, mas não cria moléculas nem tem validação clínica. A Artemis poderá ajudar a descobrir candidatos muito antes de eventual utilização; o OpenOnco organiza a evidência existente. Não há comparação direta que demonstre melhores resultados para os doentes com qualquer um dos dois. Fontes e produtos verificados em 11 de novembro de 2026. Este texto não substitui um médico.
  de:
    title: 'Artemis und Rakovina lizenzieren KI zur Wirkstoffsuche – noch kein Behandlungsergebnis'
    summary: 'Ein Aktiengeschäft im Wert von 1 Million kanadischen Dollar gewährt Rakovina exklusive Nutzung von Artemis.AI in einem Onkologiebereich. Das ist ein Geschäftsschritt, keine klinische Validierung.'
    body:
      - type: p
        text: >-
          Am 10. November 2026 meldeten das Privatunternehmen Artemis Therapeutics und Rakovina Therapeutics eine Lizenz für Artemis.AI zur Suche nach Krebswirkstoffen im Bereich der DNA-Schadensantwort. Laut Rakovina gilt sie exklusiv, weltweit und unbefristet in diesem Feld; als Gegenleistung dienen Aktien im Wert von C$1 Million, vorbehaltlich der Börsengenehmigung. Artemis behält die Plattform, Rakovina die erzeugten Verbindungen und Daten. Für eine gemeinsame Entwicklung wäre ein weiterer Vertrag nötig. Die Mitteilungen nennen unterschiedliche Wirksamkeitsdaten: 9. November beziehungsweise 15. Oktober. Aus diesen Quellen lässt sich der Unterschied nicht klären.
      - type: p
        text: >-
          Artemis beschreibt KI-gestützte Molekülmodellierung und virtuelle Suche nach Verbindungen für spätere Labortests. Der Vertrag belegt ein Geschäft, nicht die Wirksamkeit eines neuen Arzneimittels beim Menschen. Keine Mitteilung enthält neue klinische Ergebnisse, eine zugelassene Therapie oder einen Überlebensvorteil. Auf den zitierten Seiten stehen weder Modellcode noch eine offene Lizenz. C$1 Million ist der Aktienwert des Vertrags, kein Patientenpreis; es handelt sich um Forschung, nicht um einen öffentlichen klinischen Dienst.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) erfüllt eine andere, spätere Aufgabe: kostenlose Regeln unter MIT-Lizenz und Quellen für überprüfbare onkologische Diskussionsentwürfe. Die Regeln sind einsehbar, doch OpenOnco entwirft keine Moleküle und ist nicht klinisch validiert. Artemis könnte Wirkstoffkandidaten lange vor einer möglichen Anwendung finden; OpenOnco ordnet vorhandene Evidenz. Ein direkter Vergleich besserer Patientenergebnisse fehlt. Quellen und Produktseiten geprüft am 11. November 2026. Dieser Text ersetzt keinen Arzt.
  fr:
    title: 'Artemis et Rakovina signent une licence d’IA pour découvrir des médicaments, sans résultat clinique'
    summary: 'Un accord en actions évalué à 1 million de dollars canadiens donne à Rakovina un usage exclusif d’Artemis.AI dans un domaine oncologique. C’est une étape commerciale, pas une validation clinique.'
    body:
      - type: p
        text: >-
          Le 10 novembre 2026, la société privée Artemis Therapeutics et Rakovina Therapeutics ont annoncé une licence d’Artemis.AI pour rechercher des médicaments anticancéreux ciblant la réponse aux dommages de l’ADN. Selon Rakovina, elle est exclusive, mondiale et perpétuelle dans ce domaine, contre des actions évaluées à C$1 million et sous réserve d’une approbation boursière. Artemis conserve la plateforme; Rakovina possède les molécules et données qu’elle produira. Tout codéveloppement demanderait un autre accord. Les communiqués divergent sur la date d’effet, 9 novembre ou 15 octobre; ces sources ne résolvent pas l’écart.
      - type: p
        text: >-
          Artemis décrit une modélisation moléculaire et un criblage virtuel assistés par IA pour proposer des molécules à tester en laboratoire. Le contrat prouve une transaction, pas l’efficacité d’un nouveau médicament chez l’humain. Aucun communiqué ne présente de nouveaux résultats cliniques, un traitement approuvé ou une survie accrue. Les pages citées ne publient ni le code du modèle ni une licence ouverte. C$1 million est la valeur des actions contractuelles, non un tarif pour les patients; c’est un partenariat de recherche, pas un service clinique public.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) répond à une autre tâche, plus tardive: règles gratuites sous licence MIT et sources pour des brouillons oncologiques vérifiables. Ses règles sont consultables, mais il ne conçoit pas de molécules et n’a pas de validation clinique. Artemis pourrait découvrir des candidats bien avant leur éventuel usage; OpenOnco organise les preuves existantes. Aucune comparaison directe ne démontre de meilleurs résultats pour les patients avec l’un ou l’autre. Sources et produits vérifiés le 11 novembre 2026. Ce texte ne remplace pas un médecin.
  it:
    title: 'Artemis e Rakovina firmano una licenza IA per scoprire farmaci, non un risultato clinico'
    summary: 'Un accordo in azioni del valore di 1 milione di dollari canadesi concede a Rakovina l’uso esclusivo di Artemis.AI in un campo oncologico. È un passo commerciale, non una validazione clinica.'
    body:
      - type: p
        text: >-
          Il 10 novembre 2026 la società privata Artemis Therapeutics e Rakovina Therapeutics hanno annunciato una licenza di Artemis.AI per la ricerca di farmaci oncologici rivolti alla risposta al danno del DNA. Secondo Rakovina è esclusiva, mondiale e perpetua in questo ambito, in cambio di azioni valutate C$1 milione e soggetta ad approvazione della borsa. Artemis mantiene la piattaforma; Rakovina i composti e i dati prodotti. Un eventuale sviluppo congiunto richiederebbe un altro accordo. I comunicati indicano date di efficacia diverse, 9 novembre e 15 ottobre; queste fonti non chiariscono la discrepanza.
      - type: p
        text: >-
          Artemis descrive modellazione molecolare e screening virtuale assistiti dall’IA per proporre molecole da verificare in laboratorio. Il contratto documenta una transazione, non l’efficacia di un nuovo farmaco nelle persone. Nessun comunicato riporta nuovi risultati clinici, una terapia approvata o maggiore sopravvivenza. Le pagine citate non pubblicano il codice del modello né una licenza aperta. C$1 milione è il valore delle azioni contrattuali, non un prezzo per pazienti; è ricerca, non un servizio clinico pubblico.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) svolge un’altra attività, successiva: regole gratuite con licenza MIT e fonti per bozze oncologiche verificabili. Le regole sono ispezionabili, ma non progetta molecole e non ha validazione clinica. Artemis potrebbe scoprire candidati molto prima del possibile impiego; OpenOnco organizza le prove esistenti. Nessun confronto diretto dimostra risultati migliori per i pazienti con uno dei due. Fonti e prodotti verificati l’11 novembre 2026. Questo testo non sostituisce il medico.
  da:
    title: 'Artemis og Rakovina licenserer AI til lægemiddelopdagelse, ikke en kræftbehandling'
    summary: 'En aktieaftale til 1 million canadiske dollar giver Rakovina eksklusiv brug af Artemis.AI på et onkologisk felt. Det er en kommerciel milepæl, ikke klinisk validering.'
    body:
      - type: p
        text: >-
          Den 10. november 2026 annoncerede det private Artemis Therapeutics og Rakovina Therapeutics en licens til Artemis.AI til opdagelse af kræftlægemidler rettet mod DNA-skaderespons. Ifølge Rakovina er licensen eksklusiv, global og tidsubegrænset på dette felt mod aktier til en værdi af C$1 million, betinget af børsens godkendelse. Artemis beholder platformen, Rakovina de stoffer og data, selskabet skaber. Fælles udvikling kræver en særskilt aftale. Meddelelserne angiver forskellige ikrafttrædelsesdatoer, 9. november og 15. oktober; kilderne forklarer ikke forskellen.
      - type: p
        text: >-
          Artemis beskriver AI-støttet molekylmodellering og virtuel screening for at foreslå stoffer til laboratorietest. Aftalen dokumenterer en transaktion, ikke at et nyt lægemiddel virker hos mennesker. Ingen af meddelelserne viser nye kliniske resultater, godkendt behandling eller længere overlevelse. De citerede sider offentliggør hverken modelkode eller åben licens. C$1 million er aktieværdien i aftalen, ikke en patientpris; dette er forskning, ikke en offentlig klinisk tjeneste.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) løser en anden, senere opgave: gratis MIT-licenserede regler og kilder til gennemgåelige onkologiske diskussionsudkast. Reglerne kan inspiceres, men OpenOnco designer ikke molekyler og er ikke klinisk valideret. Artemis kan måske finde kandidater længe før mulig brug; OpenOnco ordner eksisterende evidens. Ingen direkte sammenligning viser bedre patientresultater for nogen af dem. Kilder og produktsider kontrolleret 11. november 2026. Teksten erstatter ikke en læge.
  sv:
    title: 'Artemis och Rakovina licensierar AI för läkemedelsupptäckt, inte ett behandlingsresultat'
    summary: 'Ett aktieavtal värt 1 miljon kanadensiska dollar ger Rakovina exklusiv användning av Artemis.AI inom ett onkologiskt fält. Det är en affärshändelse, inte klinisk validering.'
    body:
      - type: p
        text: >-
          Den 10 november 2026 meddelade privata Artemis Therapeutics och Rakovina Therapeutics ett licensavtal om Artemis.AI för upptäckt av cancerläkemedel inom DNA-skaderespons. Enligt Rakovina är licensen exklusiv, global och tidsobegränsad på detta område mot aktier värda C$1 miljon, förutsatt börsgodkännande. Artemis behåller plattformen; Rakovina äger föreningar och data som bolaget tar fram. Gemensam utveckling kräver ett separat avtal. Meddelandena anger olika ikraftträdandedatum, 9 november respektive 15 oktober; källorna förklarar inte skillnaden.
      - type: p
        text: >-
          Artemis beskriver AI-stödd molekylmodellering och virtuell screening för att föreslå föreningar för laboratorietestning. Avtalet belägger en affär, inte att ett nytt läkemedel fungerar hos människor. Inget av meddelandena redovisar nya kliniska resultat, godkänd behandling eller ökad överlevnad. De citerade sidorna publicerar varken modellkod eller öppen licens. C$1 miljon är aktievärdet i avtalet, inte ett patientpris; detta är forskning, inte en offentlig klinisk tjänst.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) fyller en annan, senare funktion: kostnadsfria MIT-licensierade regler och källor för granskningsbara onkologiska diskussionsutkast. Reglerna kan inspekteras, men OpenOnco designar inte molekyler och saknar klinisk validering. Artemis skulle kunna hitta kandidater långt före möjlig användning; OpenOnco ordnar befintliga belägg. Ingen direkt jämförelse visar bättre patientutfall för någon av dem. Källor och produktsidor kontrollerade 11 november 2026. Texten ersätter inte en läkare.
  nb:
    title: 'Artemis og Rakovina lisensierer KI for legemiddelutvikling, ikke et behandlingsresultat'
    summary: 'En aksjeavtale verdt 1 million kanadiske dollar gir Rakovina eksklusiv bruk av Artemis.AI på et onkologisk område. Det er en forretningshendelse, ikke klinisk validering.'
    body:
      - type: p
        text: >-
          Den 10. november 2026 kunngjorde private Artemis Therapeutics og Rakovina Therapeutics en lisens for Artemis.AI til oppdagelse av kreftlegemidler innen DNA-skaderespons. Ifølge Rakovina er lisensen eksklusiv, global og tidsubegrenset på dette området mot aksjer verdt C$1 million, forutsatt børsens godkjenning. Artemis beholder plattformen; Rakovina eier forbindelser og data det skaper. Felles utvikling krever egen avtale. Pressemeldingene oppgir ulike ikrafttredelsesdatoer, 9. november og 15. oktober; kildene forklarer ikke forskjellen.
      - type: p
        text: >-
          Artemis beskriver KI-støttet molekylmodellering og virtuell screening for å foreslå forbindelser til laboratorietesting. Avtalen dokumenterer en transaksjon, ikke at et nytt legemiddel virker hos mennesker. Ingen av meldingene gir nye kliniske resultater, godkjent behandling eller lengre overlevelse. De siterte sidene publiserer verken modellkode eller åpen lisens. C$1 million er aksjeverdien i avtalen, ikke en pasientpris; dette er forskning, ikke en offentlig klinisk tjeneste.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) har en annen, senere oppgave: gratis MIT-lisensierte regler og kilder til gjennomgåelige onkologiske diskusjonsutkast. Reglene kan inspiseres, men OpenOnco designer ikke molekyler og er ikke klinisk validert. Artemis kan finne kandidater lenge før mulig bruk; OpenOnco ordner eksisterende kunnskap. Ingen direkte sammenligning viser bedre pasientutfall for noen av dem. Kilder og produktsider kontrollert 11. november 2026. Teksten erstatter ikke en lege.
  fi:
    title: 'Artemis ja Rakovina lisensoivat tekoälyä lääkeainelöytöihin, eivät syöpähoidon tulosta'
    summary: 'Miljoonan Kanadan dollarin osakejärjestely antaa Rakovinalle yksinomaisen Artemis.AI-käyttöoikeuden onkologian alalla. Se on kaupallinen askel, ei kliininen validointi.'
    body:
      - type: p
        text: >-
          Yksityinen Artemis Therapeutics ja Rakovina Therapeutics ilmoittivat 10. marraskuuta 2026 Artemis.AI-lisenssistä syöpälääkkeiden löytämiseen DNA-vauriovasteen alalla. Rakovinan mukaan lisenssi on tällä alalla yksinomainen, maailmanlaajuinen ja määräajaton; vastikkeena on C$1 miljoonan arvoiset osakkeet, ja järjestely vaatii pörssin hyväksynnän. Artemis säilyttää alustan, Rakovina sen tuottamat yhdisteet ja tiedot. Yhteiskehitys edellyttäisi erillistä sopimusta. Tiedotteet ilmoittavat eri voimaantulopäivät, 9. marraskuuta ja 15. lokakuuta; lähteet eivät selitä eroa.
      - type: p
        text: >-
          Artemis kuvaa tekoälyavusteista molekyylimallinnusta ja virtuaaliseulontaa, joiden tarkoitus on ehdottaa yhdisteitä laboratoriokokeisiin. Sopimus osoittaa liiketoimen, ei uuden lääkkeen tehoa ihmisillä. Kumpikaan tiedote ei esitä uusia kliinisiä tuloksia, hyväksyttyä hoitoa tai pidempää elossaoloa. Viitatut sivut eivät julkaise mallin koodia tai avointa lisenssiä. C$1 miljoona on sopimusosakkeiden arvo, ei potilashinta; kyse on tutkimuksesta, ei julkisesta kliinisestä palvelusta.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) palvelee toista, myöhempää tehtävää: maksuttomat MIT-lisensoidut säännöt ja lähteet tukevat tarkistettavia onkologisia keskusteluluonnoksia. Säännöt voi tutkia, mutta OpenOnco ei suunnittele molekyylejä eikä ole kliinisesti validoitu. Artemis voi auttaa löytämään ehdokkaita kauan ennen mahdollista käyttöä; OpenOnco jäsentää olemassa olevaa näyttöä. Suoraa vertailua paremmista potilastuloksista ei ole. Lähteet ja tuotesivut tarkistettu 11. marraskuuta 2026. Teksti ei korvaa lääkäriä.
