slug: inspect-a-red-flag
date: 2026-11-11
published: 2026-11-11
kind: project
series: openonco-three-day
series_format: platform
author: OpenOnco
tags: [platform, onco-wiki, red-flags, sources]
title:
  en: 'What does an OpenOnco red flag actually say? Open the rule'
  uk: 'Що насправді означає позначка OpenOnco? Відкрийте саме правило'
summary:
  en: 'Onco Wiki shows the condition, purpose, sources and review status behind a red flag. A synthetic under-18 example shows a safety check that does not choose treatment.'
  uk: 'Онко Вікі показує умову, призначення, джерела й статус перевірки позначки. Вигаданий приклад для віку до 18 років ілюструє перевірку, що не обирає лікування.'
sources:
  - citation: 'OpenOnco. Onco Wiki red flags index and explanation. Checked 11 November 2026.'
    id: https://openonco.info/kb.html
  - citation: 'OpenOnco. Pediatric specialist review red-flag page, live checked 11 November 2026.'
    id: https://openonco.info/kb/redflags/rf-universal-pediatric-specialist-review.html
  - citation: 'OpenOnco. Underlying versioned YAML red-flag record, checked 11 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/32924de1e6/knowledge_base/hosted/content/redflags/rf_universal_pediatric_specialist_review.yaml
  - citation: 'US National Cancer Institute. Childhood cancers and pediatric oncology care. Checked 11 November 2026.'
    id: https://www.cancer.gov/types/childhood-cancers
  - citation: 'US National Cancer Institute. PDQ pediatric treatment summaries. Checked 11 November 2026.'
    id: https://www.cancer.gov/publications/pdq/information-summaries/pediatric-treatment
body:
  en:
    - type: p
      text: >-
        [Onco Wiki](/kb.html) has a **Red flags** filter. Open a record and you can inspect its ID, declared review status, disease scope, source links, trigger logic and any references from other records. This is more useful than a mysterious warning badge: readers can see what condition the rule tests and trace its stated basis. A source ID is a pointer for checking the original material, not a substitute for reading it.
    - type: p
      text: >-
        Take a fictional record with age 17. The [pediatric specialist review flag](/kb/redflags/rf-universal-pediatric-specialist-review.html) checks whether age is below 18 and raises a care-setting reminder. Its YAML explicitly says it does **not** select, withhold or change a treatment regimen. The public page links to National Cancer Institute childhood cancer and pediatric treatment resources. The page currently shows no reverse references for this record; it does not claim that the flag ran in a plan for this example.
    - type: p
      text: >-
        This illustrates what an inspectable rule can and cannot establish. A visible condition and sources help someone audit a draft, but a review date or a technical check is not clinical validation. Use invented or de-identified examples in public tools. A qualified pediatric oncology team must judge real care in context. Feature, code and live page checked 11 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        В [Онко Вікі](/ukr/kb.html) є фільтр **Тривожні ознаки**. Відкрийте запис, щоб побачити його ідентифікатор, заявлений статус перевірки, сферу застосування, джерела, умову спрацювання та посилання з інших записів, якщо вони є. Так зрозуміліше, ніж із загадковим попереджувальним значком: видно, що саме перевіряє правило і на які джерела воно спирається. Ідентифікатор джерела допомагає знайти оригінал, але не замінює його прочитання.
    - type: p
      text: >-
        Уявімо вигаданий запис із віком 17 років. [Позначка про консультацію дитячої онкологічної команди](/ukr/kb/redflags/rf-universal-pediatric-specialist-review.html) перевіряє, чи вік менший за 18, і нагадує про належне середовище допомоги. У YAML прямо написано, що правило **не** обирає, не скасовує і не змінює схему лікування. Публічна сторінка веде до матеріалів Національного інституту раку США про дитячу онкологію. Для цього запису наразі немає зворотних посилань; ми не стверджуємо, що правило виконувалося в плані для цього прикладу.
    - type: p
      text: >-
        Цей приклад показує межі правила, яке можна перевірити. Видима умова й джерела допомагають оцінити чернетку, але дата перегляду чи технічна перевірка не є клінічною валідацією. У відкритих інструментах використовуйте вигадані або знеособлені приклади. Реальну допомогу має оцінювати кваліфікована дитяча онкологічна команда з урахуванням обставин. Функцію, код і живу сторінку перевірено 11 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: '¿Qué dice realmente una alerta de OpenOnco? Abra la regla'
    summary: 'Onco Wiki muestra condición, finalidad, fuentes y estado de revisión. Un ejemplo ficticio de menor de 18 años ilustra una comprobación que no elige tratamiento.'
    body:
      - type: p
        text: >-
          [Onco Wiki](/es/kb.html) tiene un filtro de **alertas**. Cada ficha muestra identificador, estado de revisión declarado, ámbito de enfermedades, enlaces a fuentes, lógica de activación y referencias desde otras fichas, si existen. Así se puede comprobar qué condición evalúa la regla y de dónde procede. Un identificador de fuente ayuda a localizar el original; no sustituye su lectura.
      - type: p
        text: >-
          Imagine un registro ficticio con 17 años de edad. La [alerta de revisión por oncología pediátrica](/es/kb/redflags/rf-universal-pediatric-specialist-review.html) comprueba si la edad es inferior a 18 y recuerda el entorno asistencial apropiado. Su YAML dice expresamente que **no** selecciona, retira ni modifica un régimen terapéutico. La página enlaza recursos del Instituto Nacional del Cáncer de EE. UU. sobre cáncer infantil. Por ahora no muestra referencias inversas; no afirmamos que la alerta se haya ejecutado en un plan para este ejemplo.
      - type: p
        text: >-
          Una condición visible y sus fuentes ayudan a auditar un borrador, pero una fecha de revisión o prueba técnica no equivale a validación clínica. Utilice ejemplos ficticios o desidentificados en herramientas públicas. Un equipo cualificado de oncología pediátrica debe valorar la atención real en su contexto. Función, código y página pública comprobados el 11 de noviembre de 2026. Este texto no sustituye a un médico.
  pt:
    title: 'O que diz realmente um alerta do OpenOnco? Abra a regra'
    summary: 'A Onco Wiki mostra condição, finalidade, fontes e estado de revisão. Um exemplo fictício de idade inferior a 18 anos ilustra uma verificação que não escolhe tratamento.'
    body:
      - type: p
        text: >-
          A [Onco Wiki](/pt/kb.html) tem um filtro de **alertas**. Cada registo mostra identificador, estado de revisão declarado, doenças abrangidas, ligações às fontes, lógica de ativação e referências de outros registos, quando existam. Assim é possível ver qual a condição testada e a base indicada. Um identificador de fonte ajuda a encontrar o original; não dispensa a sua leitura.
      - type: p
        text: >-
          Imagine um registo fictício de 17 anos. O [alerta de avaliação por oncologia pediátrica](/pt/kb/redflags/rf-universal-pediatric-specialist-review.html) verifica se a idade é inferior a 18 e recorda o contexto assistencial adequado. O YAML afirma expressamente que **não** seleciona, suspende ou altera um regime terapêutico. A página liga a recursos do Instituto Nacional do Cancro dos EUA sobre cancro infantil. Atualmente não mostra referências inversas; não afirmamos que o alerta tenha sido executado num plano para este exemplo.
      - type: p
        text: >-
          Uma condição visível e as fontes ajudam a auditar um rascunho, mas a data de revisão ou um teste técnico não constituem validação clínica. Use exemplos fictícios ou sem identificação nas ferramentas públicas. Uma equipa qualificada de oncologia pediátrica deve avaliar os cuidados reais no seu contexto. Função, código e página pública verificados em 11 de novembro de 2026. Este texto não substitui um médico.
  de:
    title: 'Was sagt ein OpenOnco-Warnhinweis wirklich? Öffnen Sie die Regel'
    summary: 'Onco Wiki zeigt Bedingung, Zweck, Quellen und Prüfstatus. Ein erfundenes Beispiel unter 18 Jahren zeigt einen Sicherheitshinweis ohne Therapieauswahl.'
    body:
      - type: p
        text: >-
          [Onco Wiki](/de/kb.html) bietet einen Filter für **Warnhinweise**. Ein Eintrag zeigt Kennung, angegebenen Prüfstatus, Krankheitsbereich, Quellenlinks, Auslösebedingung und gegebenenfalls Verweise aus anderen Einträgen. So lässt sich prüfen, was die Regel testet und worauf sie sich stützt. Eine Quellenkennung führt zum Original; sie ersetzt dessen Lektüre nicht.
      - type: p
        text: >-
          Stellen Sie sich einen erfundenen Datensatz mit Alter 17 vor. Der [Hinweis zur pädiatrisch-onkologischen Prüfung](/de/kb/redflags/rf-universal-pediatric-specialist-review.html) prüft, ob das Alter unter 18 liegt, und erinnert an den passenden Versorgungskontext. Laut YAML wählt, verweigert oder ändert die Regel **kein** Behandlungsschema. Die Seite verlinkt Materialien des US-amerikanischen National Cancer Institute zu Kinderkrebs. Derzeit sind keine Rückverweise für diesen Eintrag verzeichnet; wir behaupten nicht, dass die Regel in einem Plan für dieses Beispiel ausgeführt wurde.
      - type: p
        text: >-
          Sichtbare Bedingungen und Quellen erleichtern die Prüfung eines Entwurfs, doch ein Prüfdatum oder technischer Test ist keine klinische Validierung. Nutzen Sie in öffentlichen Werkzeugen nur erfundene oder anonymisierte Beispiele. Über echte Versorgung muss ein qualifiziertes kinderonkologisches Team im Kontext entscheiden. Funktion, Code und öffentliche Seite geprüft am 11. November 2026. Dieser Text ersetzt keinen Arzt.
  fr:
    title: 'Que dit vraiment une alerte OpenOnco ? Ouvrez la règle'
    summary: 'Onco Wiki montre la condition, le rôle, les sources et le statut de révision. Un exemple fictif de moins de 18 ans illustre un contrôle qui ne choisit aucun traitement.'
    body:
      - type: p
        text: >-
          [Onco Wiki](/fr/kb.html) propose un filtre **alertes**. Chaque fiche affiche son identifiant, son statut de révision déclaré, son champ de maladies, ses sources, sa condition de déclenchement et, s’il y en a, les renvois depuis d’autres fiches. On peut ainsi vérifier ce que teste la règle et retrouver ses fondements. Un identifiant de source aide à trouver l’original; il ne remplace pas sa lecture.
      - type: p
        text: >-
          Imaginons un dossier fictif indiquant 17 ans. L’[alerte de consultation en oncologie pédiatrique](/fr/kb/redflags/rf-universal-pediatric-specialist-review.html) vérifie si l’âge est inférieur à 18 ans et rappelle le cadre de soins approprié. Son YAML précise qu’elle ne **choisit**, ne retire ni ne modifie aucun protocole thérapeutique. La page renvoie aux ressources du National Cancer Institute américain sur les cancers de l’enfant. Aucun renvoi inverse n’est actuellement affiché; nous ne prétendons pas que cette règle a été exécutée dans un plan pour cet exemple.
      - type: p
        text: >-
          Une condition visible et ses sources facilitent l’examen d’un brouillon, mais une date de révision ou un test technique ne constituent pas une validation clinique. Utilisez uniquement des exemples fictifs ou anonymisés dans les outils publics. Une équipe qualifiée d’oncologie pédiatrique doit apprécier les soins réels dans leur contexte. Fonction, code et page publique vérifiés le 11 novembre 2026. Ce texte ne remplace pas un médecin.
  it:
    title: 'Che cosa dice davvero un avviso OpenOnco? Apri la regola'
    summary: 'Onco Wiki mostra condizione, scopo, fonti e stato di revisione. Un esempio inventato sotto i 18 anni illustra un controllo che non sceglie la terapia.'
    body:
      - type: p
        text: >-
          [Onco Wiki](/it/kb.html) offre un filtro per gli **avvisi**. Ogni scheda mostra identificativo, stato di revisione dichiarato, ambito delle malattie, link alle fonti, logica di attivazione ed eventuali riferimenti da altre schede. Si può quindi vedere quale condizione verifica la regola e rintracciarne la base. Un identificativo della fonte aiuta a trovare l’originale; non sostituisce la lettura.
      - type: p
        text: >-
          Immaginiamo una scheda inventata con età 17 anni. L’[avviso di valutazione oncologica pediatrica](/it/kb/redflags/rf-universal-pediatric-specialist-review.html) verifica se l’età è inferiore a 18 e ricorda il contesto assistenziale appropriato. Il YAML afferma esplicitamente che **non** sceglie, sospende o modifica un regime terapeutico. La pagina collega risorse del National Cancer Institute statunitense sui tumori infantili. Al momento non mostra riferimenti inversi; non sosteniamo che la regola sia stata eseguita in un piano per questo esempio.
      - type: p
        text: >-
          Condizioni visibili e fonti aiutano a controllare una bozza, ma una data di revisione o un test tecnico non sono validazione clinica. Negli strumenti pubblici usa solo esempi inventati o privi di dati identificativi. Un’équipe qualificata di oncologia pediatrica deve valutare le cure reali nel loro contesto. Funzione, codice e pagina pubblica verificati l’11 novembre 2026. Questo testo non sostituisce il medico.
  da:
    title: 'Hvad siger et OpenOnco-advarselsflag? Åbn reglen'
    summary: 'Onco Wiki viser betingelse, formål, kilder og revisionsstatus. Et opdigtet eksempel under 18 år viser et sikkerhedstjek uden valg af behandling.'
    body:
      - type: p
        text: >-
          [Onco Wiki](/da/kb.html) har et filter for **advarselsflag**. Hver post viser id, angivet revisionsstatus, sygdomsområde, kildelinks, udløsende betingelse og eventuelle henvisninger fra andre poster. Dermed kan man se, hvad reglen undersøger, og finde dens angivne grundlag. Et kilde-id hjælper med at finde originalen; det erstatter ikke læsning af den.
      - type: p
        text: >-
          Forestil dig en opdigtet post med alder 17 år. [Flaget om pædiatrisk-onkologisk vurdering](/da/kb/redflags/rf-universal-pediatric-specialist-review.html) kontrollerer, om alderen er under 18, og minder om den rette behandlingsramme. YAML-filen siger udtrykkeligt, at reglen **ikke** vælger, udelukker eller ændrer et behandlingsregime. Siden linker til materiale fra det amerikanske National Cancer Institute om børnekræft. Der vises endnu ingen bagudgående henvisninger; vi hævder ikke, at reglen blev kørt i en plan for dette eksempel.
      - type: p
        text: >-
          En synlig betingelse og dens kilder gør et udkast lettere at efterprøve, men en revisionsdato eller teknisk test er ikke klinisk validering. Brug opdigtede eller anonymiserede eksempler i offentlige værktøjer. Et kvalificeret pædiatrisk-onkologisk team må vurdere reel behandling i sammenhæng. Funktion, kode og offentlig side kontrolleret 11. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Vad säger en OpenOnco-varningsflagga egentligen? Öppna regeln'
    summary: 'Onco Wiki visar villkor, syfte, källor och granskningsstatus. Ett påhittat exempel under 18 år visar en kontroll som inte väljer behandling.'
    body:
      - type: p
        text: >-
          [Onco Wiki](/sv/kb.html) har ett filter för **varningsflaggor**. Varje post visar id, angiven granskningsstatus, sjukdomsområde, källänkar, utlösande villkor och eventuella hänvisningar från andra poster. Därmed går det att se vad regeln testar och hitta dess angivna grund. Ett käll-id hjälper dig att hitta originalet; det ersätter inte att läsa det.
      - type: p
        text: >-
          Tänk dig en påhittad post med åldern 17 år. [Flaggan för bedömning av barnonkologiskt team](/sv/kb/redflags/rf-universal-pediatric-specialist-review.html) kontrollerar om åldern är under 18 och påminner om rätt vårdmiljö. YAML-filen säger uttryckligen att regeln **inte** väljer, undanhåller eller ändrar någon behandlingsregim. Sidan länkar till material från USA:s National Cancer Institute om barncancer. Den visar för närvarande inga bakåtreferenser; vi påstår inte att regeln kördes i en plan för detta exempel.
      - type: p
        text: >-
          Synliga villkor och källor hjälper till att granska ett utkast, men ett granskningsdatum eller tekniskt test är ingen klinisk validering. Använd påhittade eller avidentifierade exempel i offentliga verktyg. Ett kvalificerat barnonkologiskt team måste bedöma verklig vård i sitt sammanhang. Funktion, kod och offentlig sida kontrollerade 11 november 2026. Texten ersätter inte en läkare.
  nb:
    title: 'Hva sier et OpenOnco-varselflagg egentlig? Åpne regelen'
    summary: 'Onco Wiki viser vilkår, formål, kilder og gjennomgangsstatus. Et oppdiktet eksempel under 18 år viser en kontroll som ikke velger behandling.'
    body:
      - type: p
        text: >-
          [Onco Wiki](/nb/kb.html) har et filter for **varselflagg**. Hver oppføring viser ID, oppgitt gjennomgangsstatus, sykdomsområde, kildelenker, utløservilkår og eventuelle henvisninger fra andre oppføringer. Dermed kan man se hva regelen tester og finne det oppgitte grunnlaget. En kilde-ID hjelper deg å finne originalen; den erstatter ikke lesning av den.
      - type: p
        text: >-
          Tenk deg en oppdiktet oppføring med alder 17 år. [Flagget for vurdering av barneonkologisk team](/nb/kb/redflags/rf-universal-pediatric-specialist-review.html) kontrollerer om alderen er under 18 og minner om riktig behandlingsmiljø. YAML-filen sier uttrykkelig at regelen **ikke** velger, holder tilbake eller endrer et behandlingsregime. Siden lenker til materiale fra USAs National Cancer Institute om kreft hos barn. Den viser foreløpig ingen bakoverreferanser; vi hevder ikke at regelen ble kjørt i en plan for dette eksemplet.
      - type: p
        text: >-
          Synlige vilkår og kilder hjelper ved kontroll av et utkast, men en gjennomgangsdato eller teknisk test er ikke klinisk validering. Bruk oppdiktede eller avidentifiserte eksempler i offentlige verktøy. Et kvalifisert barneonkologisk team må vurdere reell behandling i sammenheng. Funksjon, kode og offentlig side kontrollert 11. november 2026. Teksten erstatter ikke lege.
  fi:
    title: 'Mitä OpenOncon varoitusmerkintä todella sanoo? Avaa sääntö'
    summary: 'Onco Wiki näyttää ehdon, tarkoituksen, lähteet ja tarkistustilan. Keksitty alle 18-vuotiaan esimerkki havainnollistaa tarkistusta, joka ei valitse hoitoa.'
    body:
      - type: p
        text: >-
          [Onco Wikissä](/fi/kb.html) on **varoitusmerkintöjen** suodatin. Kunkin tietueen sivulla näkyvät tunniste, ilmoitettu tarkistustila, sairausalue, lähdelinkit, laukeamisehto ja mahdolliset viittaukset muista tietueista. Näin voi nähdä, mitä sääntö testaa, ja jäljittää sen ilmoitetun perustan. Lähdetunnus auttaa löytämään alkuperäisen aineiston; se ei korvaa sen lukemista.
      - type: p
        text: >-
          Kuvitellaan keksitty tietue, jossa ikä on 17 vuotta. [Lasten onkologisen tiimin arviointimerkintä](/fi/kb/redflags/rf-universal-pediatric-specialist-review.html) tarkistaa, onko ikä alle 18, ja muistuttaa asianmukaisesta hoitoympäristöstä. YAML-tiedosto sanoo suoraan, ettei sääntö **valitse**, estä tai muuta hoito-ohjelmaa. Sivulla on linkit Yhdysvaltain National Cancer Instituten lasten syöpiä koskeviin aineistoihin. Tietueelle ei nyt näy käänteisiä viittauksia; emme väitä, että sääntö suoritettiin tämän esimerkin suunnitelmassa.
      - type: p
        text: >-
          Näkyvä ehto ja lähteet auttavat tarkistamaan luonnoksen, mutta tarkistuspäivä tai tekninen testi ei ole kliininen validointi. Käytä julkisissa työkaluissa vain keksittyjä tai tunnisteettomia esimerkkejä. Pätevän lasten onkologisen tiimin on arvioitava todellinen hoito asiayhteydessä. Toiminto, koodi ja julkinen sivu tarkistettu 11. marraskuuta 2026. Teksti ei korvaa lääkäriä.
