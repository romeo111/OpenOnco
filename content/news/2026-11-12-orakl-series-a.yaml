slug: orakl-series-a
date: 2026-11-12
published: 2026-11-12
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, drug-development, organoids, evidence]
title:
  en: 'Orakl raises $34 million for cancer drug research: what the platform actually does'
  uk: 'Orakl залучила $34 млн на дослідження онкопрепаратів: що насправді робить платформа'
summary:
  en: 'The Series A funds patient-derived tumour models for drug developers. An investment and a prediction claim are not proof of better outcomes for patients.'
  uk: 'Раунд Series A фінансує моделі пухлин для розробників ліків. Інвестиція та заяви про прогнозування не доводять кращих результатів для пацієнтів.'
sources:
  - citation: 'Norrsken VC. Investment announcement, 12 November 2026. Investor account; checked 12 November 2026.'
    id: https://www.norrsken.vc/news/orakl-oncology
  - citation: 'Orakl Oncology. Platform and biopharma product descriptions. Company account; checked 12 November 2026.'
    id: https://www.orakl-oncology.com/
  - citation: 'OpenOnco. Product description and limitations, master checked 12 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/5f88a11998943046d8a2277c32dddd655aac3b92/README.md
  - citation: 'OpenOnco. MIT code licence, master checked 12 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/5f88a11998943046d8a2277c32dddd655aac3b92/LICENSE
body:
  en:
    - type: p
      text: >-
        On 12 November 2026, investor Norrsken VC said it co-led Orakl Oncology's $34 million Series A with Singular, taking disclosed funding to $50 million. The money is intended to expand laboratory data generation fivefold, extend work from colorectal and pancreatic to lung and gastric cancers, and establish US and UK teams. These are plans reported by an investor, not completed clinical milestones.
    - type: p
      text: >-
        Orakl says it grows patient-derived tumour organoids, tests drugs on them, and links experimental responses to molecular measurements and clinical histories. Its O-Predict and O-Target products serve biopharmaceutical research decisions. The company and investor claim strong predictive performance; the cited pages do not establish that using this platform improves survival or validates a treatment for an individual patient. Its dataset is described as proprietary. No public code licence or patient price is stated on those pages; this is a business-to-business research service, not a free clinical tool.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) works at a different point: free, MIT-licensed rules and cited sources help draft a reviewable discussion of existing oncology evidence. Its rule files can be inspected, but it neither tests tumour samples nor predicts drug-trial success, and it lacks clinical validation. Orakl may inform drug development; OpenOnco helps organise published evidence. No direct study shows either produces better patient outcomes. Sources checked 12 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        12 листопада 2026 року інвестор Norrsken VC повідомив, що разом із Singular очолив раунд Series A компанії Orakl Oncology на $34 млн. Загальне заявлене фінансування сягнуло $50 млн. Кошти планують спрямувати на п’ятикратне збільшення обсягу лабораторних даних, розширення роботи з колоректального раку й раку підшлункової залози на рак легень і шлунка та створення команд у США й Великій Британії. Це плани зі слів інвестора, а не завершені клінічні результати.
    - type: p
      text: >-
        За описом Orakl, компанія вирощує органоїди пухлин із матеріалу пацієнтів, випробовує на них препарати й пов’язує результати з молекулярними даними та історіями хвороби. O-Predict і O-Target призначені для дослідницьких рішень фармацевтичних компаній. Компанія й інвестор заявляють про високу якість прогнозів, але наведені сторінки не доводять поліпшення виживаності чи придатність лікування для окремого пацієнта. Набір даних названо закритим. Відкритої ліцензії на код і ціни для пацієнта на цих сторінках немає; це дослідницький сервіс для бізнесу, а не безкоштовний клінічний інструмент.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) працює на іншому етапі: безкоштовні правила під ліцензією MIT і посилання на джерела допомагають скласти чернетку обговорення наявних онкологічних доказів. Правила можна перевірити, але сервіс не тестує зразки пухлин, не прогнозує успіх випробувань ліків і не має клінічної валідації. Orakl може допомагати розробці препаратів, OpenOnco — впорядковувати опубліковані дані. Прямого дослідження кращих результатів для пацієнтів для жодного з них немає. Джерела перевірено 12 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Orakl capta $34 millones para investigar fármacos oncológicos: qué hace su plataforma'
    summary: 'La Serie A financia modelos tumorales derivados de pacientes para desarrolladores de fármacos. La inversión no demuestra mejores resultados clínicos.'
    body:
      - type: p
        text: >-
          El 12 de noviembre de 2026, el inversor Norrsken VC anunció que colideró con Singular una Serie A de $34 millones para Orakl Oncology; la financiación comunicada suma $50 millones. El dinero se destinaría a multiplicar por cinco la generación de datos de laboratorio, ampliar el trabajo de cáncer colorrectal y pancreático al de pulmón y estómago, y formar equipos en EE. UU. y el Reino Unido. Son planes del inversor, no hitos clínicos ya alcanzados.
      - type: p
        text: >-
          Según Orakl, cultiva organoides tumorales de pacientes, prueba fármacos y vincula las respuestas con datos moleculares e historiales clínicos. O-Predict y O-Target apoyan decisiones de investigación biofarmacéutica. La empresa y el inversor afirman tener gran capacidad predictiva; las páginas citadas no demuestran mayor supervivencia ni validan un tratamiento individual. Los datos se describen como propietarios. Allí no figura una licencia abierta del código ni un precio para pacientes: es un servicio de investigación empresarial, no una herramienta clínica gratuita.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) cumple otra función: reglas gratuitas bajo licencia MIT y fuentes citadas ayudan a preparar borradores revisables sobre evidencia oncológica existente. Sus reglas son inspeccionables, pero no analiza tumores, no predice el éxito de ensayos y carece de validación clínica. Orakl puede apoyar el desarrollo de fármacos; OpenOnco organiza evidencia publicada. Ningún estudio directo demuestra mejores resultados para pacientes con uno u otro. Fuentes consultadas el 12 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Orakl angaria $34 milhões para investigar fármacos oncológicos: o que faz a plataforma'
    summary: 'A Série A financia modelos tumorais derivados de doentes para o desenvolvimento de fármacos. O investimento não prova melhores resultados clínicos.'
    body:
      - type: p
        text: >-
          Em 12 de novembro de 2026, o investidor Norrsken VC anunciou que coliderou com a Singular uma Série A de $34 milhões para a Orakl Oncology, elevando o financiamento divulgado a $50 milhões. O capital deverá quintuplicar a produção de dados laboratoriais, alargar o trabalho do cancro colorretal e pancreático ao do pulmão e estômago e criar equipas nos EUA e no Reino Unido. São planos do investidor, não resultados clínicos concluídos.
      - type: p
        text: >-
          Segundo a Orakl, a empresa cultiva organoides tumorais de doentes, testa fármacos e relaciona as respostas com dados moleculares e histórias clínicas. O-Predict e O-Target apoiam decisões de investigação biofarmacêutica. Empresa e investidor alegam forte capacidade preditiva; as páginas citadas não demonstram maior sobrevivência nem validam tratamento individual. Os dados são descritos como proprietários. Não há aí licença aberta para o código nem preço para doentes: é um serviço de investigação empresarial, não uma ferramenta clínica gratuita.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) tem outra função: regras gratuitas sob licença MIT e fontes citadas ajudam a preparar rascunhos verificáveis da evidência oncológica existente. As regras são inspecionáveis, mas não testa tumores, não prevê o sucesso de ensaios e não tem validação clínica. A Orakl pode apoiar o desenvolvimento de fármacos; o OpenOnco organiza evidência publicada. Nenhum estudo direto demonstra melhores resultados para doentes com qualquer deles. Fontes verificadas em 12 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Orakl erhält $34 Millionen für die Krebswirkstoffforschung: Was die Plattform leistet'
    summary: 'Die Series A finanziert patientenabgeleitete Tumormodelle für die Wirkstoffentwicklung. Die Finanzierung belegt keinen klinischen Nutzen.'
    body:
      - type: p
        text: >-
          Am 12. November 2026 teilte Investor Norrsken VC mit, gemeinsam mit Singular eine Series-A-Runde über $34 Millionen für Orakl Oncology angeführt zu haben. Die bekannt gegebene Gesamtfinanzierung beträgt $50 Millionen. Das Geld soll die Erzeugung von Labordaten verfünffachen, die Arbeit von Darm- und Bauchspeicheldrüsenkrebs auf Lungen- und Magenkrebs ausweiten und Teams in den USA und Großbritannien aufbauen. Das sind Pläne des Investors, keine abgeschlossenen klinischen Meilensteine.
      - type: p
        text: >-
          Laut Orakl züchtet das Unternehmen Tumororganoide aus Patientenproben, testet daran Wirkstoffe und verknüpft Ergebnisse mit molekularen Daten und Krankengeschichten. O-Predict und O-Target unterstützen Forschungsentscheidungen von Biopharmaunternehmen. Unternehmen und Investor behaupten eine hohe Vorhersageleistung; die zitierten Seiten belegen weder längeres Überleben noch eine individuell validierte Therapie. Der Datensatz wird als proprietär bezeichnet. Eine offene Codelizenz oder ein Patientenpreis wird dort nicht angegeben: Es handelt sich um einen Forschungsdienst für Unternehmen, nicht um ein kostenloses klinisches Werkzeug.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) erfüllt eine andere Aufgabe: Kostenlose Regeln unter MIT-Lizenz und Quellen helfen, überprüfbare Entwürfe zur vorhandenen onkologischen Evidenz zu erstellen. Die Regeln sind einsehbar, aber OpenOnco testet keine Tumorproben, prognostiziert keinen Studienerfolg und ist nicht klinisch validiert. Orakl kann die Wirkstoffentwicklung unterstützen; OpenOnco ordnet publizierte Evidenz. Eine direkte Studie mit besseren Patientenergebnissen für eines der Werkzeuge fehlt. Quellen geprüft am 12. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Orakl lève $34 millions pour la recherche anticancéreuse : ce que fait sa plateforme'
    summary: 'La série A finance des modèles tumoraux issus de patients pour les développeurs de médicaments. Une levée de fonds ne prouve aucun bénéfice clinique.'
    body:
      - type: p
        text: >-
          Le 12 novembre 2026, l’investisseur Norrsken VC a annoncé avoir codirigé avec Singular une série A de $34 millions pour Orakl Oncology, portant les financements déclarés à $50 millions. Les fonds doivent quintupler la production de données de laboratoire, étendre les travaux du cancer colorectal et pancréatique aux cancers du poumon et de l’estomac, et créer des équipes aux États-Unis et au Royaume-Uni. Ce sont des projets annoncés par l’investisseur, pas des résultats cliniques acquis.
      - type: p
        text: >-
          Selon Orakl, l’entreprise cultive des organoïdes tumoraux issus de patients, y teste des médicaments et relie les réponses aux données moléculaires et aux dossiers cliniques. O-Predict et O-Target servent aux décisions de recherche biopharmaceutique. L’entreprise et l’investisseur revendiquent de fortes performances prédictives ; les pages citées ne démontrent ni gain de survie ni validation d’un traitement individuel. Les données sont dites propriétaires. Aucune licence de code ouverte ni aucun prix pour les patients n’y figure : c’est un service de recherche entre entreprises, pas un outil clinique gratuit.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) remplit une autre fonction : des règles gratuites sous licence MIT et des sources citées aident à préparer des brouillons vérifiables sur les preuves oncologiques existantes. Ses règles sont consultables, mais il ne teste pas les tumeurs, ne prédit pas la réussite des essais et n’est pas validé cliniquement. Orakl peut aider à développer des médicaments ; OpenOnco organise les preuves publiées. Aucune étude directe ne démontre de meilleurs résultats pour les patients avec l’un ou l’autre. Sources vérifiées le 12 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Orakl raccoglie $34 milioni per la ricerca oncologica: cosa fa la piattaforma'
    summary: 'Il round Serie A finanzia modelli tumorali derivati da pazienti per sviluppatori di farmaci. L’investimento non prova benefici clinici.'
    body:
      - type: p
        text: >-
          Il 12 novembre 2026 l’investitore Norrsken VC ha annunciato di aver guidato con Singular un round Serie A da $34 milioni per Orakl Oncology; i finanziamenti dichiarati arrivano a $50 milioni. I fondi dovrebbero quintuplicare la produzione di dati di laboratorio, estendere la ricerca dai tumori colorettali e pancreatici a quelli polmonari e gastrici e creare team negli USA e nel Regno Unito. Sono piani riferiti dall’investitore, non traguardi clinici raggiunti.
      - type: p
        text: >-
          Secondo Orakl, l’azienda coltiva organoidi tumorali da campioni dei pazienti, vi testa farmaci e collega le risposte a dati molecolari e storie cliniche. O-Predict e O-Target servono alle decisioni di ricerca biofarmaceutica. Azienda e investitore rivendicano buone prestazioni predittive; le pagine citate non dimostrano maggiore sopravvivenza né convalidano una cura individuale. I dati sono definiti proprietari. Non vi sono indicati una licenza aperta del codice o un prezzo per i pazienti: è un servizio di ricerca per imprese, non uno strumento clinico gratuito.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) svolge un altro compito: regole gratuite con licenza MIT e fonti citate aiutano a preparare bozze verificabili sulle evidenze oncologiche esistenti. Le regole sono ispezionabili, ma non analizza tumori, non prevede l’esito degli studi e non ha validazione clinica. Orakl può sostenere lo sviluppo dei farmaci; OpenOnco organizza le evidenze pubblicate. Nessuno studio diretto dimostra migliori esiti per i pazienti con uno dei due. Fonti verificate il 12 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'Orakl rejser $34 millioner til kræftforskning: hvad platformen faktisk gør'
    summary: 'Serie A finansierer patientafledte tumormodeller til lægemiddeludviklere. Investeringen dokumenterer ikke bedre behandlingsresultater.'
    body:
      - type: p
        text: >-
          Den 12. november 2026 meddelte investor Norrsken VC, at selskabet sammen med Singular stod i spidsen for Orakl Oncologys Serie A-runde på $34 millioner. Den oplyste samlede finansiering er $50 millioner. Pengene skal femdoble produktionen af laboratoriedata, udvide arbejdet fra tyk- og endetarmskræft og bugspytkirtelkræft til lunge- og mavekræft samt oprette teams i USA og Storbritannien. Det er investorens planer, ikke opnåede kliniske resultater.
      - type: p
        text: >-
          Ifølge Orakl dyrker virksomheden tumororganoider fra patientprøver, afprøver lægemidler på dem og kobler resultaterne til molekylære data og sygehistorier. O-Predict og O-Target støtter biofarmaceutiske forskningsbeslutninger. Virksomheden og investoren hævder høj prognosepræcision; de citerede sider dokumenterer ikke længere overlevelse eller en valideret behandling til en enkelt patient. Datasættet beskrives som proprietært. Der oplyses ingen åben kodelicens eller patientpris: Dette er en forskningstjeneste for virksomheder, ikke et gratis klinisk værktøj.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) har en anden opgave: Gratis regler under MIT-licens og kildehenvisninger hjælper med gennemgåelige udkast om eksisterende onkologisk evidens. Reglerne kan inspiceres, men værktøjet tester ikke tumorer, forudsiger ikke forsøgsresultater og er ikke klinisk valideret. Orakl kan støtte lægemiddeludvikling; OpenOnco organiserer publiceret evidens. Ingen direkte undersøgelse viser bedre patientresultater med nogen af dem. Kilder kontrolleret 12. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Orakl tar in $34 miljoner för cancerforskning: vad plattformen gör'
    summary: 'Serie A finansierar patienthärledda tumörmodeller för läkemedelsutvecklare. Investeringen bevisar inte bättre vårdresultat.'
    body:
      - type: p
        text: >-
          Den 12 november 2026 meddelade investeraren Norrsken VC att bolaget tillsammans med Singular ledde Orakl Oncologys Serie A-runda på $34 miljoner. Den redovisade totala finansieringen är $50 miljoner. Pengarna ska femdubbla framställningen av laboratoriedata, utvidga arbetet från kolorektal cancer och bukspottkörtelcancer till lung- och magsäckscancer samt bygga team i USA och Storbritannien. Det är investerarens planer, inte uppnådda kliniska resultat.
      - type: p
        text: >-
          Enligt Orakl odlar företaget tumörorganoider från patientprover, testar läkemedel på dem och kopplar svaren till molekylära data och sjukdomshistorier. O-Predict och O-Target stöder biofarmaceutiska forskningsbeslut. Företaget och investeraren hävdar god prognosförmåga; de angivna sidorna visar varken längre överlevnad eller en validerad behandling för en enskild patient. Datamängden beskrivs som proprietär. Någon öppen kodlicens eller patientkostnad anges inte: det är en forskningstjänst för företag, inte ett gratis kliniskt verktyg.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) har ett annat syfte: Gratis regler med MIT-licens och källor hjälper till att skapa granskningsbara utkast om befintlig onkologisk evidens. Reglerna kan granskas, men verktyget testar inte tumörer, förutspår inte studieresultat och är inte kliniskt validerat. Orakl kan stödja läkemedelsutveckling; OpenOnco ordnar publicerad evidens. Ingen direkt studie visar bättre patientutfall med något av dem. Källor granskade 12 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Orakl henter $34 millioner til kreftforskning: hva plattformen gjør'
    summary: 'Serie A finansierer pasientavledede svulstmodeller for legemiddelutviklere. Investeringen dokumenterer ikke bedre behandlingsresultater.'
    body:
      - type: p
        text: >-
          Den 12. november 2026 opplyste investoren Norrsken VC at selskapet sammen med Singular ledet Orakl Oncologys Serie A-runde på $34 millioner. Den oppgitte samlede finansieringen er $50 millioner. Pengene skal femdoble produksjonen av laboratoriedata, utvide arbeidet fra kolorektal kreft og bukspyttkjertelkreft til lunge- og magekreft og etablere team i USA og Storbritannia. Dette er investorens planer, ikke oppnådde kliniske resultater.
      - type: p
        text: >-
          Ifølge Orakl dyrker selskapet svulstorganoider fra pasientprøver, tester legemidler på dem og knytter responsene til molekylære data og sykehistorier. O-Predict og O-Target støtter biofarmasøytiske forskningsbeslutninger. Selskapet og investoren hevder høy prediksjonsevne; de siterte sidene dokumenterer verken lengre overlevelse eller en validert behandling for enkeltpasienter. Datasettet beskrives som proprietært. Ingen åpen kodelisens eller pasientpris oppgis der: Dette er en forskningstjeneste for bedrifter, ikke et gratis klinisk verktøy.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) har en annen oppgave: Gratis regler under MIT-lisens og kildehenvisninger hjelper med etterprøvbare utkast om eksisterende onkologisk evidens. Reglene kan undersøkes, men verktøyet tester ikke svulster, forutsier ikke studieresultater og er ikke klinisk validert. Orakl kan støtte legemiddelutvikling; OpenOnco organiserer publisert evidens. Ingen direkte studie viser bedre pasientutfall med noen av dem. Kilder kontrollert 12. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Orakl keräsi $34 miljoonaa syöpälääketutkimukseen: mitä alusta tekee'
    summary: 'A-sarjan rahoitus tukee potilasnäytteistä tehtyjä kasvainmalleja lääkekehitykseen. Rahoitus ei osoita parempia hoitotuloksia.'
    body:
      - type: p
        text: >-
          Sijoittaja Norrsken VC kertoi 12. marraskuuta 2026 johtaneensa yhdessä Singularin kanssa Orakl Oncologyn $34 miljoonan A-sarjan rahoituskierrosta. Ilmoitettu kokonaisrahoitus on $50 miljoonaa. Rahoituksella aiotaan viisinkertaistaa laboratoriotiedon tuotanto, laajentaa tutkimusta paksu- ja peräsuolen sekä haiman syövistä keuhko- ja mahasyöpään ja perustaa tiimit Yhdysvaltoihin ja Britanniaan. Nämä ovat sijoittajan kuvaamia suunnitelmia, eivät toteutuneita kliinisiä tuloksia.
      - type: p
        text: >-
          Oraklin mukaan yritys kasvattaa potilasnäytteistä kasvainorganoideja, testaa niillä lääkkeitä ja yhdistää vasteet molekyylitietoihin ja sairaushistoriaan. O-Predict ja O-Target tukevat lääkeyritysten tutkimuspäätöksiä. Yritys ja sijoittaja väittävät ennusteiden olevan tarkkoja; viitatut sivut eivät osoita pidempää elinaikaa eivätkä vahvista hoitoa yksittäiselle potilaalle. Tietoaineisto kuvataan suljetuksi. Avointa ohjelmistolisenssiä tai potilashintaa ei ilmoiteta: kyse on yrityksille tarkoitetusta tutkimuspalvelusta, ei maksuttomasta kliinisestä työkalusta.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) tekee muuta: maksuttomat MIT-lisensoidut säännöt ja lähdeviitteet auttavat laatimaan tarkistettavia luonnoksia julkaistusta onkologisesta näytöstä. Sääntöjä voi tarkastella, mutta palvelu ei testaa kasvaimia, ennusta tutkimusten onnistumista eikä ole kliinisesti validoitu. Orakl voi tukea lääkekehitystä; OpenOnco jäsentää julkaistua näyttöä. Kummankaan parempia potilastuloksia ei ole osoitettu suorassa tutkimuksessa. Lähteet tarkistettu 12. marraskuuta 2026. Artikkeli ei korvaa lääkärin arviota.
