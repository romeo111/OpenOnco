tags: [startup, precision-oncology, colorectal-cancer, clinical-evidence]
title:
  en: 'Vivan plans a TuMatch study in colorectal cancer: the evidence is still to come'
  uk: 'Vivan планує дослідження TuMatch при колоректальному раку: доказів ще очікують'
summary:
  en: 'A prospective study in Abu Dhabi is set to include at least 10 people. Its start is a research milestone, not proof that treatment recommendations improve outcomes.'
  uk: 'Проспективне дослідження в Абу-Дабі має охопити щонайменше 10 людей. Його початок — крок у дослідженні, а не доказ користі від рекомендацій.'
sources:
  - citation: 'Vivan Therapeutics. Company announcement dated 12 November 2026. Checked 22 November 2026.'
    id: https://www.einpresswire.com/article/956232035/vivan-therapeutics-set-to-begin-tumatch-clinical-registration-study-at-burjeel-cancer-institute-abu-dhabi
  - citation: 'Vivan Therapeutics. TuMatch and Personal Discovery Process product descriptions. Checked 22 November 2026.'
    id: https://www.vivantx.com/
  - citation: 'Functional Exploration of African Colorectal Cancer Patients Using Personalised Drosophila Avatars. Cancer Gene Therapy, 2026; PMID 41959337. Checked 22 November 2026.'
    id: https://pubmed.ncbi.nlm.nih.gov/41959337/
  - citation: 'OpenOnco. Project scope and limitations at version 8fa65fa3. Checked 22 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/8fa65fa37b1b5ecb065f24f24473e584ae989705/README.md
  - citation: 'OpenOnco. MIT licence at version 8fa65fa3. Checked 22 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/8fa65fa37b1b5ecb065f24f24473e584ae989705/LICENSE
body:
  en:
    - type: p
      text: >-
        On 12 November 2026, Vivan Therapeutics and Hub71 said a prospective study of TuMatch was cleared to begin at Burjeel Cancer Institute in Abu Dhabi. The company says the colorectal-cancer study will enrol at least 10 people and collect clinical and health-economics data. These are planned measurements, not published outcomes. The announcement gives no trial registry identifier or protocol. Permission to conduct a study is not clearance for routine clinical use; Vivan says the future data will support its CE-mark and FDA submissions.
    - type: p
      text: >-
        [TuMatch](https://www.vivantx.com/) uses a tumour genomic profile, Vivan's proprietary drug-response dataset from fruit-fly models, and published evidence to rank options for an oncologist. The public site describes a focus on colorectal, lung, pancreatic and other gastrointestinal cancers; it does not publish a user price or a source-code licence. A 2026 paper on personalised fruit-fly models examined three colorectal-cancer model lines and found improved fly survival in two under experimental treatment. That is laboratory evidence, not proof of patient benefit or clinical validation of TuMatch. The announcement does not report treatment-response or survival results from the Abu Dhabi study.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) offers free, cited oncology knowledge, inspectable rules and MIT-licensed code. Its structured case tools prepare drafts for discussion; they do not run fly-model experiments or predict individual drug response from a tumour genome. Vivan's experimental matching workflow and OpenOnco's public evidence workflow address different tasks. No direct comparison of accuracy or patient outcomes is available. Sources checked 22 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        12 листопада 2026 року Vivan Therapeutics і Hub71 повідомили про дозвіл розпочати проспективне дослідження TuMatch в Інституті раку Burjeel в Абу-Дабі. За повідомленням компанії, дослідження при колоректальному раку охопить щонайменше 10 людей і збиратиме клінічні та економічні дані. Це заплановані вимірювання, а не опубліковані результати. У повідомленні немає реєстраційного номера чи протоколу дослідження. Дозвіл провести дослідження не є дозволом на рутинне клінічне використання; Vivan планує використати майбутні дані для заявок на маркування CE та до FDA.
    - type: p
      text: >-
        [TuMatch](https://www.vivantx.com/) зіставляє геномний профіль пухлини з власною базою Vivan про відповідь на препарати, отриманою на моделях плодових мушок, і з опублікованими даними, а потім ранжує варіанти для онколога. Сайт описує фокус на колоректальному раку, раку легень, підшлункової залози та інших пухлинах травного тракту; публічної ціни для користувача чи ліцензії вихідного коду там немає. Дослідження 2026 року на персоналізованих моделях плодових мушок вивчило три модельні лінії колоректального раку й виявило поліпшення виживаності мушок у двох за експериментального лікування. Це лабораторні дані, а не доказ користі для людей чи клінічної валідації TuMatch. Повідомлення не містить результатів відповіді на лікування або виживаності з дослідження в Абу-Дабі.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) безкоштовно надає онкологічні знання з джерелами, перевірювані правила та код за ліцензією MIT. Інструменти за структурованими даними випадку готують чернетки для обговорення; вони не проводять експериментів на моделях мушок і не прогнозують індивідуальну відповідь на ліки за геномом пухлини. Експериментальний підбір Vivan і відкритий довідник OpenOnco виконують різні завдання. Прямого порівняння точності або результатів для пацієнтів немає. Джерела перевірено 22 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Vivan prepara un estudio de TuMatch en cáncer colorrectal: aún faltan resultados'
    summary: 'El estudio prospectivo en Abu Dabi prevé al menos 10 personas. Su inicio no demuestra que las recomendaciones mejoren los resultados clínicos.'
    body:
      - type: p
        text: >-
          El 12 de noviembre de 2026, Vivan Therapeutics y Hub71 anunciaron la autorización para iniciar un estudio prospectivo de TuMatch en el Instituto Oncológico Burjeel de Abu Dabi. Según la empresa, incluirá al menos a 10 personas con cáncer colorrectal y recogerá datos clínicos y económicos. Son mediciones previstas, no resultados publicados. El comunicado no proporciona un número de registro ni un protocolo. El permiso para investigar no equivale a una autorización de uso clínico habitual; Vivan prevé usar los datos futuros en sus solicitudes de marcado CE y ante la FDA.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) combina el perfil genómico tumoral, datos propios de respuesta a fármacos obtenidos con modelos de mosca de la fruta y evidencia publicada para ordenar opciones destinadas al oncólogo. Su web se centra en cáncer colorrectal, de pulmón, de páncreas y otros tumores digestivos; no publica un precio por usuario ni una licencia del código fuente. Un artículo de 2026 examinó tres líneas de modelos de cáncer colorrectal en moscas y observó mejor supervivencia de las moscas en dos tras un tratamiento experimental. Es evidencia de laboratorio, no prueba de beneficio en pacientes ni validación clínica de TuMatch. El comunicado no ofrece resultados de respuesta o supervivencia del estudio de Abu Dabi.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) ofrece gratis conocimiento oncológico con fuentes, reglas examinables y código MIT. Sus herramientas elaboran borradores para debatir casos estructurados; no realizan experimentos con moscas ni predicen la respuesta individual a un fármaco a partir del genoma tumoral. Los dos flujos cubren tareas distintas. No hay comparación directa de precisión o resultados en pacientes. Fuentes consultadas el 22 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Vivan prepara estudo do TuMatch no cancro colorretal: os resultados ainda faltam'
    summary: 'O estudo prospetivo em Abu Dhabi prevê pelo menos 10 pessoas. O seu início não prova que as recomendações melhorem resultados clínicos.'
    body:
      - type: p
        text: >-
          Em 12 de novembro de 2026, a Vivan Therapeutics e a Hub71 anunciaram autorização para iniciar um estudo prospetivo do TuMatch no Burjeel Cancer Institute, em Abu Dhabi. Segundo a empresa, incluirá pelo menos 10 pessoas com cancro colorretal e recolherá dados clínicos e económicos. São medições planeadas, não resultados publicados. O comunicado não fornece número de registo nem protocolo. A autorização para realizar um estudo não equivale a aprovação para uso clínico de rotina; a Vivan prevê usar os dados futuros nos pedidos de marcação CE e à FDA.
      - type: p
        text: >-
          O [TuMatch](https://www.vivantx.com/) combina o perfil genómico do tumor, dados próprios de resposta a fármacos obtidos com modelos de mosca-da-fruta e evidência publicada para ordenar opções para o oncologista. O site destaca cancros colorretal, do pulmão, do pâncreas e outros do aparelho digestivo; não publica preço por utilizador nem licença de código-fonte. Um artigo de 2026 examinou três linhagens de modelos de cancro colorretal em moscas e observou melhor sobrevivência das moscas em duas após tratamento experimental. É evidência laboratorial, não prova de benefício em doentes nem validação clínica do TuMatch. O comunicado não apresenta resultados de resposta ou sobrevivência do estudo de Abu Dhabi.
      - type: p
        text: >-
          A [OpenOnco](/pt/capabilities.html) oferece gratuitamente conhecimento oncológico com fontes, regras verificáveis e código MIT. As suas ferramentas produzem rascunhos para discutir casos estruturados; não fazem experiências com moscas nem preveem respostas individuais a fármacos a partir do genoma tumoral. Os dois fluxos servem tarefas diferentes. Não existe comparação direta de precisão ou resultados em doentes. Fontes verificadas em 22 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Vivan plant TuMatch-Studie zu Darmkrebs: Ergebnisse stehen noch aus'
    summary: 'Die prospektive Studie in Abu Dhabi soll mindestens 10 Menschen einschließen. Ihr Beginn belegt keinen Nutzen der Empfehlungen für Behandlungsergebnisse.'
    body:
      - type: p
        text: >-
          Am 12. November 2026 meldeten Vivan Therapeutics und Hub71 eine Genehmigung zum Beginn einer prospektiven TuMatch-Studie am Burjeel Cancer Institute in Abu Dhabi. Laut Unternehmen sollen mindestens 10 Menschen mit Darmkrebs eingeschlossen und klinische sowie gesundheitsökonomische Daten erhoben werden. Das sind geplante Messungen, keine veröffentlichten Ergebnisse. Die Mitteilung nennt weder Registernummer noch Studienprotokoll. Eine Studiengenehmigung ist keine Zulassung für die klinische Routine; Vivan will künftige Daten für CE- und FDA-Anträge nutzen.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) kombiniert das Tumorgenom, Vivans eigene Daten zu Arzneimittelwirkungen aus Fruchtfliegenmodellen und veröffentlichte Evidenz, um Optionen für Onkologen zu ordnen. Die Website nennt Darm-, Lungen-, Pankreas- und weitere Magen-Darm-Tumoren als Schwerpunkt; einen öffentlichen Nutzerpreis oder eine Quellcodelizenz nennt sie nicht. Eine Studie von 2026 untersuchte drei Darmkrebs-Modelllinien in Fruchtfliegen und fand bei zwei unter experimenteller Behandlung ein längeres Überleben der Fliegen. Das sind Labordaten, kein Beleg für Patientennutzen oder eine klinische Validierung von TuMatch. Die Mitteilung enthält keine Ansprech- oder Überlebensdaten aus Abu Dhabi.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) stellt kostenlos onkologisches Wissen mit Quellen, prüfbare Regeln und MIT-lizenzierten Code bereit. Seine Werkzeuge entwerfen Diskussionsgrundlagen aus strukturierten Falldaten; sie führen keine Fliegenversuche durch und sagen keine individuelle Arzneimittelwirkung aus dem Tumorgenom voraus. Beide Abläufe dienen unterschiedlichen Aufgaben. Ein direkter Vergleich von Genauigkeit oder Patientenergebnissen liegt nicht vor. Quellen geprüft am 22. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Vivan prépare une étude de TuMatch sur le cancer colorectal : les résultats restent à venir'
    summary: 'L’étude prospective à Abou Dhabi prévoit au moins 10 personnes. Son lancement ne démontre aucun bénéfice des recommandations sur les résultats cliniques.'
    body:
      - type: p
        text: >-
          Le 12 novembre 2026, Vivan Therapeutics et Hub71 ont annoncé l’autorisation de commencer une étude prospective de TuMatch au Burjeel Cancer Institute, à Abou Dhabi. Selon l’entreprise, elle inclura au moins 10 personnes atteintes d’un cancer colorectal et recueillera des données cliniques et économiques. Il s’agit de mesures prévues, pas de résultats publiés. Le communiqué ne donne ni numéro d’enregistrement ni protocole. Une autorisation d’étude n’est pas une autorisation d’usage clinique courant ; Vivan prévoit d’utiliser les données futures pour ses demandes de marquage CE et auprès de la FDA.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) combine le profil génomique tumoral, les données propriétaires de réponse aux médicaments issues de modèles de drosophiles et les données publiées pour classer des options destinées à l’oncologue. Le site mentionne les cancers colorectal, pulmonaire, pancréatique et d’autres cancers digestifs ; il ne publie ni tarif par utilisateur ni licence du code source. Une étude de 2026 a examiné trois lignées de modèles de cancer colorectal chez la drosophile et observé une meilleure survie des mouches dans deux lignées sous traitement expérimental. C’est une donnée de laboratoire, pas une preuve de bénéfice pour les patients ni une validation clinique de TuMatch. Le communiqué ne rapporte aucun résultat de réponse ou de survie de l’étude d’Abou Dhabi.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) donne libre accès à des connaissances oncologiques sourcées, à des règles vérifiables et à un code sous licence MIT. Ses outils rédigent des brouillons de discussion à partir de cas structurés ; ils ne testent pas de modèles de drosophiles et ne prédisent pas la réponse individuelle aux médicaments à partir du génome tumoral. Les deux démarches répondent à des besoins distincts. Aucune comparaison directe de précision ou de résultats pour les patients n’existe. Sources vérifiées le 22 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Vivan prepara uno studio su TuMatch nel cancro colorettale: i risultati devono ancora arrivare'
    summary: 'Lo studio prospettico ad Abu Dhabi prevede almeno 10 persone. L’avvio non dimostra che le raccomandazioni migliorino gli esiti clinici.'
    body:
      - type: p
        text: >-
          Il 12 novembre 2026 Vivan Therapeutics e Hub71 hanno annunciato l’autorizzazione ad avviare uno studio prospettico di TuMatch al Burjeel Cancer Institute di Abu Dhabi. Secondo l’azienda, coinvolgerà almeno 10 persone con cancro colorettale e raccoglierà dati clinici ed economici. Sono misure previste, non risultati pubblicati. Il comunicato non indica un numero di registro né un protocollo. Il permesso di condurre lo studio non autorizza l’uso clinico di routine; Vivan intende usare i dati futuri per le richieste di marcatura CE e alla FDA.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) combina il profilo genomico del tumore, dati proprietari di risposta ai farmaci ottenuti da modelli di moscerino della frutta e prove pubblicate per ordinare le opzioni per l’oncologo. Il sito indica un interesse per tumori colorettali, polmonari, pancreatici e altri gastrointestinali; non pubblica un prezzo per utente né una licenza del codice sorgente. Uno studio del 2026 ha esaminato tre linee modello di cancro colorettale nei moscerini e osservato una migliore sopravvivenza dei moscerini in due dopo trattamento sperimentale. Sono dati di laboratorio, non prova di beneficio per i pazienti o validazione clinica di TuMatch. Il comunicato non riporta esiti di risposta o sopravvivenza dallo studio di Abu Dhabi.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) offre gratuitamente conoscenze oncologiche con fonti, regole verificabili e codice MIT. I suoi strumenti preparano bozze di discussione da casi strutturati; non eseguono esperimenti sui moscerini né predicono la risposta individuale ai farmaci dal genoma tumorale. I due percorsi svolgono compiti diversi. Non esiste un confronto diretto di accuratezza o esiti nei pazienti. Fonti verificate il 22 novembre 2026. Questo articolo non sostituisce il medico.
  da:
    title: 'Vivan planlægger TuMatch-studie i tarmkræft: resultaterne mangler endnu'
    summary: 'Det prospektive studie i Abu Dhabi skal omfatte mindst 10 personer. Starten viser ikke, at anbefalingerne forbedrer kliniske resultater.'
    body:
      - type: p
        text: >-
          Den 12. november 2026 meddelte Vivan Therapeutics og Hub71, at et prospektivt TuMatch-studie kan begynde på Burjeel Cancer Institute i Abu Dhabi. Ifølge virksomheden skal mindst 10 personer med tyk- eller endetarmskræft deltage, og der skal indsamles kliniske og sundhedsøkonomiske data. Det er planlagte målinger, ikke offentliggjorte resultater. Meddelelsen angiver hverken registreringsnummer eller protokol. Tilladelse til et studie er ikke godkendelse til rutinemæssig klinisk brug; Vivan vil anvende fremtidige data til CE- og FDA-ansøgninger.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) kombinerer tumorens genomprofil, Vivans egne data om lægemiddelrespons fra bananflue-modeller og offentliggjort evidens for at rangordne muligheder til onkologen. Hjemmesiden nævner kræft i tarm, lunger, bugspytkirtel og andre dele af mave-tarm-kanalen; den oplyser hverken en offentlig brugerpris eller en kildekodelicens. Et studie fra 2026 undersøgte tre tarmkræft-modellinjer i fluer og fandt forbedret overlevelse hos fluerne i to under eksperimentel behandling. Det er laboratoriedata, ikke dokumentation for patientnytte eller klinisk validering af TuMatch. Meddelelsen rummer ingen resultater om respons eller overlevelse fra Abu Dhabi.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) giver gratis adgang til kildebelagt onkologisk viden, efterprøvelige regler og MIT-licenseret kode. Værktøjerne laver udkast til drøftelse ud fra strukturerede sagsdata; de udfører ikke flueforsøg og forudsiger ikke individuel lægemiddelrespons ud fra et tumorgenom. Arbejdsgangene løser forskellige opgaver. Der findes ingen direkte sammenligning af nøjagtighed eller patientresultater. Kilder kontrolleret 22. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Vivan planerar TuMatch-studie vid tjock- och ändtarmscancer: resultaten återstår'
    summary: 'Den prospektiva studien i Abu Dhabi ska omfatta minst 10 personer. Starten visar inte att rekommendationerna förbättrar kliniska utfall.'
    body:
      - type: p
        text: >-
          Den 12 november 2026 meddelade Vivan Therapeutics och Hub71 att en prospektiv studie av TuMatch får starta vid Burjeel Cancer Institute i Abu Dhabi. Enligt företaget ska minst 10 personer med tjock- eller ändtarmscancer ingå och kliniska samt hälsoekonomiska data samlas in. Det är planerade mätningar, inte publicerade resultat. Meddelandet ger varken registreringsnummer eller protokoll. Tillstånd att genomföra en studie är inte godkännande för rutinmässig klinisk användning; Vivan vill använda framtida data för CE- och FDA-ansökningar.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) kombinerar tumörens genomprofil, Vivans egna data om läkemedelssvar från bananflugemodeller och publicerade belägg för att rangordna alternativ åt onkologen. Webbplatsen anger fokus på cancer i tjock- och ändtarm, lunga, bukspottkörtel och andra delar av mag-tarmkanalen; den anger inget offentligt pris per användare eller någon källkodslicens. En studie från 2026 undersökte tre modellinjer för tarmcancer i flugor och såg bättre överlevnad hos flugorna i två vid experimentell behandling. Det är laboratoriedata, inte bevis för nytta hos patienter eller klinisk validering av TuMatch. Meddelandet redovisar inga svars- eller överlevnadsresultat från Abu Dhabi.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) ger gratis tillgång till källbelagd onkologisk kunskap, granskningsbara regler och MIT-licensierad kod. Verktygen skapar diskussionsutkast från strukturerade falldata; de gör inga flugförsök och förutsäger inte individuellt läkemedelssvar från tumörgenom. Arbetsflödena löser olika uppgifter. Ingen direkt jämförelse av träffsäkerhet eller patientutfall finns. Källor kontrollerade den 22 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Vivan planlegger TuMatch-studie ved tarmkreft: resultatene gjenstår'
    summary: 'Den prospektive studien i Abu Dhabi skal omfatte minst 10 personer. Oppstarten viser ikke at anbefalingene forbedrer kliniske utfall.'
    body:
      - type: p
        text: >-
          Den 12. november 2026 meldte Vivan Therapeutics og Hub71 at en prospektiv TuMatch-studie kan starte ved Burjeel Cancer Institute i Abu Dhabi. Ifølge selskapet skal minst 10 personer med tykk- eller endetarmskreft delta, og kliniske samt helseøkonomiske data samles inn. Dette er planlagte målinger, ikke publiserte resultater. Meldingen oppgir verken registreringsnummer eller protokoll. Tillatelse til å gjennomføre en studie er ikke godkjenning for rutinemessig klinisk bruk; Vivan vil bruke fremtidige data til CE- og FDA-søknader.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) kombinerer svulstens genomprofil, Vivans egne data om legemiddelrespons fra bananfluemodeller og publisert evidens for å rangere alternativer for onkologen. Nettstedet fremhever kreft i tykk- og endetarm, lunge, bukspyttkjertel og andre deler av mage-tarmkanalen; det oppgir ikke offentlig pris per bruker eller kildekodelisens. En studie fra 2026 undersøkte tre modellinjer for tarmkreft hos fluer og fant bedre overlevelse hos fluene i to under eksperimentell behandling. Dette er laboratoriedata, ikke bevis for nytte hos pasienter eller klinisk validering av TuMatch. Meldingen gir ingen respons- eller overlevelsesresultater fra Abu Dhabi.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) gir gratis tilgang til kildebelagt onkologisk kunnskap, etterprøvbare regler og MIT-lisensiert kode. Verktøyene lager diskusjonsutkast fra strukturerte saksdata; de utfører ikke flueforsøk og forutsier ikke individuell legemiddelrespons fra et svulstgenom. Arbeidsflytene dekker ulike oppgaver. Ingen direkte sammenligning av nøyaktighet eller pasientutfall finnes. Kilder kontrollert 22. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Vivan suunnittelee TuMatch-tutkimusta suolistosyövässä: tuloksia vielä odotetaan'
    summary: 'Abu Dhabin prospektiiviseen tutkimukseen on tarkoitus ottaa vähintään 10 ihmistä. Alku ei todista, että suositukset parantaisivat hoitotuloksia.'
    body:
      - type: p
        text: >-
          Vivan Therapeutics ja Hub71 kertoivat 12. marraskuuta 2026 luvasta aloittaa TuMatchin prospektiivinen tutkimus Abu Dhabin Burjeel Cancer Institutessa. Yhtiön mukaan mukaan otetaan vähintään 10 paksu- tai peräsuolisyöpää sairastavaa ihmistä ja kerätään kliinisiä sekä terveydenhuollon taloudellisia tietoja. Nämä ovat suunniteltuja mittauksia, eivät julkaistuja tuloksia. Tiedotteessa ei anneta rekisteritunnusta eikä tutkimussuunnitelmaa. Tutkimuslupa ei ole lupa rutiininomaiseen kliiniseen käyttöön; Vivan aikoo käyttää tulevia tietoja CE- ja FDA-hakemuksissa.
      - type: p
        text: >-
          [TuMatch](https://www.vivantx.com/) yhdistää kasvaimen genomiprofiilin, Vivanin omat lääkevastetiedot banaanikärpäsmalleista ja julkaistun näytön järjestääkseen vaihtoehtoja onkologille. Sivusto keskittyy paksu- ja peräsuolen, keuhkojen, haiman sekä muiden ruoansulatuselinten syöpiin; se ei ilmoita julkista käyttäjähintaa eikä lähdekoodilisenssiä. Vuoden 2026 tutkimuksessa tarkasteltiin kolmea suolistosyövän kärpäsmallilinjaa ja havaittiin kärpästen eloonjäämisen paranevan kahdessa kokeellisessa hoidossa. Se on laboratorionäyttöä, ei näyttöä potilashyödystä tai TuMatchin kliinisestä validoinnista. Tiedote ei kerro Abu Dhabin tutkimuksen hoitovaste- tai eloonjäämistuloksia.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) tarjoaa maksutta lähteistettyä onkologista tietoa, tarkastettavat säännöt ja MIT-lisensoidun koodin. Sen työkalut tekevät keskusteluluonnoksia jäsennetyistä tapaustiedoista; ne eivät tee kärpäskokeita tai ennusta yksilöllistä lääkevastetta kasvaimen genomista. Työnkulut palvelevat eri tehtäviä. Tarkkuudesta tai potilastuloksista ei ole suoraa vertailua. Lähteet tarkistettu 22. marraskuuta 2026. Artikkeli ei korvaa lääkäriä.
