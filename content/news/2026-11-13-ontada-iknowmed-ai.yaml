slug: ontada-iknowmed-ai
date: 2026-11-13
published: 2026-11-16
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, oncology-workflow, electronic-health-record, clinical-ai, evidence]
title:
  en: 'Ontada adds AI tools to oncology records; a launch is not a patient outcome'
  uk: 'Ontada додає ШІ до онкологічних медкарт: запуск не доводить користі для пацієнтів'
summary:
  en: 'iKnowMed adds note drafts, chart summaries and coding suggestions inside the oncology record. The release gives no measured time savings or patient outcomes.'
  uk: 'У iKnowMed з’явилися чернетки нотаток, стислий виклад медкарти й підказки щодо кодування. Реліз не містить виміряної економії часу чи результатів для пацієнтів.'
sources:
  - citation: 'Ontada. iKnowMed AI capabilities launch, 13 November 2026; company announcement. Checked 16 November 2026.'
    id: https://www.businesswire.com/news/home/20261113125773/en/
  - citation: 'Commure. Partner account of the iKnowMed integration and clinician review, 13 November 2026. Checked 16 November 2026.'
    id: https://www.commure.com/blog/more-time-for-patients-ontada-and-commure-bring-advanced-ai-into-iknowmed
  - citation: 'Ontada. iKnowMed oncology EHR product and workflow description. Checked 16 November 2026.'
    id: https://info.ontada.com/iknowmed-the-oncology-ehr-built-by-oncologists-for-oncologists
  - citation: 'OpenOnco. Product scope and limitations, master checked 16 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/bb6655f664/README.md
  - citation: 'OpenOnco. MIT code licence, master checked 16 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/bb6655f664/LICENSE
body:
  en:
    - type: p
      text: >-
        On 13 November 2026, Ontada said new AI tools were available to iKnowMed oncology-record customers. Built with Commure, they draft visit notes, summarize charts and visits, suggest diagnosis codes, answer practice questions and take dictation inside the record. This is a product-availability announcement, not a study showing saved clinician time or better patient outcomes.
    - type: p
      text: >-
        Commure says clinicians review each note and code before it enters the chart. Its account describes use by early adopters, but gives no independently measured time savings or clinical outcome comparison. iKnowMed works with longitudinal patient records inside a commercial electronic health record. The reviewed product pages provide no public source-code licence or practice price. A draft still needs a human check, however smoothly it appears in the workflow.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) offers free MIT-licensed rules and cited evidence for reviewable oncology drafts from entered case details. Its rules can be inspected, but it does not maintain an electronic health record, transcribe visits or provide clinically validated decisions. The two tools serve different workflows; no head-to-head evidence shows either improves patient outcomes. Sources checked 16 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        13 листопада 2026 року Ontada повідомила, що нові інструменти ШІ стали доступними користувачам онкологічної електронної медкарти iKnowMed. Створені разом із Commure, вони готують чернетки нотаток про прийом, стислий виклад медкарти й візитів, пропонують діагностичні коди, відповідають на запитання щодо роботи практики та записують текст під диктування у медкарті. Це повідомлення про доступність продукту, а не дослідження економії часу лікарів чи поліпшення результатів пацієнтів.
    - type: p
      text: >-
        Commure зазначає, що лікар перевіряє кожну нотатку й код до внесення в медкарту. Компанія описує використання ранніми користувачами, але не наводить незалежно виміряної економії часу чи порівняння клінічних результатів. iKnowMed працює з історією пацієнта в комерційній електронній медкарті. На перевірених сторінках немає відкритої ліцензії коду або ціни для медичної практики. Навіть зручну чернетку має перевіряти людина.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) надає безкоштовні правила під ліцензією MIT та посилання на докази для перевірюваних онкологічних чернеток за введеними даними випадку. Його правила можна переглянути, але він не веде електронну медкарту, не розшифровує прийоми та не видає клінічно валідованих рішень. Інструменти виконують різну роботу; прямих доказів поліпшення результатів пацієнтів немає. Джерела перевірено 16 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Ontada incorpora IA a la historia clínica oncológica; el lanzamiento no demuestra beneficio para pacientes'
    summary: 'iKnowMed añade borradores de notas, resúmenes de historias y sugerencias de codificación. El comunicado no mide tiempo ahorrado ni resultados de pacientes.'
    body:
      - type: p
        text: >-
          El 13 de noviembre de 2026, Ontada anunció que nuevas herramientas de IA estaban disponibles para los clientes de iKnowMed, su historia clínica electrónica oncológica. Desarrolladas con Commure, redactan borradores de notas de consulta, resumen historias y visitas, sugieren códigos diagnósticos, responden preguntas sobre la actividad de la consulta y permiten dictar texto dentro del registro. Es un anuncio de disponibilidad, no un estudio que demuestre ahorro de tiempo clínico ni mejores resultados para pacientes.
      - type: p
        text: >-
          Commure afirma que los profesionales revisan cada nota y código antes de incorporarlos a la historia. Describe el uso entre los primeros usuarios, pero no aporta una medición independiente del tiempo ahorrado ni una comparación de resultados clínicos. iKnowMed utiliza la historia longitudinal del paciente dentro de un sistema comercial. Las páginas consultadas no publican licencia del código ni precio para las consultas. Todo borrador requiere revisión humana, por fluido que parezca el proceso.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) ofrece gratuitamente reglas con licencia MIT y evidencia citada para borradores oncológicos revisables a partir de datos introducidos del caso. Sus reglas pueden inspeccionarse, pero no mantiene historias electrónicas, no transcribe visitas ni ofrece decisiones validadas clínicamente. Las herramientas sirven a procesos distintos; no hay evidencia comparativa directa de mejores resultados para pacientes. Fuentes comprobadas el 16 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Ontada acrescenta IA ao registo clínico oncológico; o lançamento não demonstra benefício para doentes'
    summary: 'O iKnowMed acrescenta rascunhos de notas, resumos do processo e sugestões de codificação. O comunicado não mede tempo poupado nem resultados dos doentes.'
    body:
      - type: p
        text: >-
          Em 13 de novembro de 2026, a Ontada anunciou novas ferramentas de IA disponíveis para clientes do iKnowMed, o seu registo clínico eletrónico oncológico. Criadas com a Commure, produzem rascunhos de notas de consulta, resumem processos e visitas, sugerem códigos de diagnóstico, respondem a perguntas sobre a prática e permitem ditado dentro do registo. É um anúncio de disponibilidade, não um estudo que demonstre poupança de tempo clínico ou melhores resultados para doentes.
      - type: p
        text: >-
          A Commure afirma que os profissionais revêm cada nota e código antes da sua entrada no processo. Descreve a utilização por primeiros aderentes, mas não apresenta medição independente do tempo poupado nem comparação de resultados clínicos. O iKnowMed usa o historial longitudinal do doente num sistema comercial. As páginas consultadas não publicam licença do código nem preço para as práticas. Mesmo um rascunho integrado no fluxo de trabalho exige revisão humana.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) oferece gratuitamente regras com licença MIT e evidência citada para rascunhos oncológicos verificáveis a partir de dados introduzidos do caso. As regras podem ser inspecionadas, mas não mantém registos clínicos eletrónicos, não transcreve consultas nem fornece decisões clinicamente validadas. As ferramentas servem processos distintos; não há evidência comparativa direta de melhores resultados para doentes. Fontes verificadas em 16 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Ontada ergänzt die onkologische Patientenakte um KI; der Start belegt keinen Patientennutzen'
    summary: 'iKnowMed ergänzt Notizentwürfe, Aktenzusammenfassungen und Kodierungsvorschläge. Die Mitteilung misst weder Zeitersparnis noch Patientenergebnisse.'
    body:
      - type: p
        text: >-
          Am 13. November 2026 erklärte Ontada, neue KI-Werkzeuge stünden Kunden der onkologischen elektronischen Patientenakte iKnowMed zur Verfügung. Die mit Commure entwickelten Funktionen entwerfen Besuchsnotizen, fassen Akten und Termine zusammen, schlagen Diagnosecodes vor, beantworten Fragen zum Praxisablauf und ermöglichen Diktate innerhalb der Akte. Die Meldung betrifft die Verfügbarkeit eines Produkts; sie ist keine Studie über gesparte Arbeitszeit oder bessere Patientenergebnisse.
      - type: p
        text: >-
          Laut Commure prüfen Behandelnde jede Notiz und jeden Code, bevor er in die Akte gelangt. Das Unternehmen beschreibt die Nutzung durch frühe Anwender, nennt aber weder unabhängig gemessene Zeitersparnis noch einen Vergleich klinischer Ergebnisse. iKnowMed verarbeitet die längsschnittliche Krankengeschichte in einem kommerziellen System. Die geprüften Produktseiten nennen keine öffentliche Codelizenz und keinen Preis für Praxen. Auch ein nahtlos eingebundener Entwurf braucht menschliche Prüfung.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) bietet kostenlose Regeln unter MIT-Lizenz und zitierte Evidenz für überprüfbare onkologische Entwürfe aus eingegebenen Falldaten. Seine Regeln sind einsehbar, doch es führt keine elektronische Patientenakte, transkribiert keine Besuche und liefert keine klinisch validierten Entscheidungen. Die Werkzeuge bedienen unterschiedliche Abläufe; direkte Belege für bessere Patientenergebnisse fehlen. Quellen geprüft am 16. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Ontada ajoute l’IA au dossier oncologique ; un lancement ne prouve pas un bénéfice pour les patients'
    summary: 'iKnowMed ajoute des projets de notes, des résumés du dossier et des suggestions de codage. Le communiqué ne mesure ni gain de temps ni résultats cliniques.'
    body:
      - type: p
        text: >-
          Le 13 novembre 2026, Ontada a annoncé la disponibilité de nouveaux outils d’IA pour les clients d’iKnowMed, son dossier médical électronique oncologique. Conçus avec Commure, ils rédigent des projets de notes de consultation, résument le dossier et les visites, suggèrent des codes diagnostiques, répondent à des questions sur le fonctionnement du cabinet et permettent la dictée dans le dossier. C’est une annonce de disponibilité, pas une étude démontrant du temps gagné ou de meilleurs résultats pour les patients.
      - type: p
        text: >-
          Commure indique que les soignants vérifient chaque note et chaque code avant leur insertion dans le dossier. La société décrit l’usage par les premiers utilisateurs, sans mesure indépendante du temps gagné ni comparaison des résultats cliniques. iKnowMed utilise l’historique longitudinal du patient dans un système commercial. Les pages consultées ne publient ni licence du code ni tarif pour les cabinets. Même un projet intégré sans friction nécessite une vérification humaine.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) propose gratuitement des règles sous licence MIT et des preuves citées pour des projets oncologiques vérifiables à partir des données saisies du cas. Ses règles sont consultables, mais il ne gère pas de dossier électronique, ne transcrit pas les consultations et ne fournit pas de décisions validées cliniquement. Les outils répondent à des besoins différents ; aucune comparaison directe ne montre de meilleurs résultats pour les patients. Sources vérifiées le 16 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Ontada aggiunge l’IA alla cartella oncologica: il lancio non dimostra benefici per i pazienti'
    summary: 'iKnowMed aggiunge bozze di note, riepiloghi della cartella e suggerimenti di codifica. Il comunicato non misura risparmio di tempo né esiti dei pazienti.'
    body:
      - type: p
        text: >-
          Il 13 novembre 2026 Ontada ha annunciato la disponibilità di nuovi strumenti di IA per i clienti di iKnowMed, la sua cartella clinica elettronica oncologica. Sviluppati con Commure, preparano bozze delle note di visita, riassumono cartelle e visite, suggeriscono codici diagnostici, rispondono a domande sulle attività dello studio e consentono la dettatura nella cartella. È un annuncio di disponibilità, non uno studio che dimostri tempo risparmiato dai clinici o esiti migliori per i pazienti.
      - type: p
        text: >-
          Commure afferma che i professionisti rivedono ogni nota e codice prima dell’inserimento in cartella. Descrive l’uso tra i primi utenti, ma non offre una misura indipendente del tempo risparmiato né un confronto degli esiti clinici. iKnowMed utilizza la storia longitudinale del paziente in un sistema commerciale. Le pagine consultate non pubblicano una licenza del codice o un prezzo per gli studi. Anche una bozza ben integrata richiede una verifica umana.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) offre gratuitamente regole con licenza MIT e prove citate per bozze oncologiche verificabili basate sui dati inseriti del caso. Le regole sono ispezionabili, ma non gestisce cartelle cliniche elettroniche, non trascrive le visite e non fornisce decisioni clinicamente validate. Gli strumenti servono processi diversi; non esistono prove comparative dirette di esiti migliori per i pazienti. Fonti verificate il 16 novembre 2026. Questo articolo non sostituisce il medico.
  da:
    title: 'Ontada føjer AI til onkologiske patientjournaler; lancering dokumenterer ikke patientgevinst'
    summary: 'iKnowMed får udkast til journalnotater, opsummeringer og forslag til diagnosekoder. Meddelelsen måler hverken sparet tid eller patientresultater.'
    body:
      - type: p
        text: >-
          Den 13. november 2026 meddelte Ontada, at nye AI-værktøjer var tilgængelige for kunder med den onkologiske elektroniske patientjournal iKnowMed. Funktionerne, som er udviklet sammen med Commure, skriver udkast til konsultationsnotater, opsummerer journaler og besøg, foreslår diagnosekoder, besvarer spørgsmål om praksisdrift og muliggør diktat i journalen. Det er en produktlancering, ikke en undersøgelse, der viser sparet klinikertid eller bedre patientresultater.
      - type: p
        text: >-
          Commure oplyser, at klinikere gennemgår hver note og kode, før den føres ind i journalen. Virksomheden beskriver brug blandt tidlige brugere, men giver ingen uafhængig måling af sparet tid eller sammenligning af kliniske resultater. iKnowMed bruger patientens samlede sygdomshistorie i et kommercielt journalsystem. De gennemgåede produktsider angiver hverken en offentlig kodelicens eller pris for klinikker. Også et udkast, der passer godt ind i arbejdsgangen, kræver menneskelig kontrol.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) tilbyder gratis regler under MIT-licens og kildebelagt evidens til gennemgåelige onkologiske udkast fra indtastede sagsoplysninger. Reglerne kan inspiceres, men værktøjet fører ikke elektronisk patientjournal, transskriberer ikke besøg og leverer ikke klinisk validerede beslutninger. Værktøjerne understøtter forskellige arbejdsgange; ingen direkte sammenligning viser bedre patientresultater. Kilder kontrolleret 16. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Ontada lägger till AI i onkologiska journaler; lanseringen visar inte patientnytta'
    summary: 'iKnowMed får utkast till anteckningar, journalsammanfattningar och kodförslag. Meddelandet mäter varken tidsvinst eller patientutfall.'
    body:
      - type: p
        text: >-
          Den 13 november 2026 meddelade Ontada att nya AI-verktyg fanns tillgängliga för kunder som använder den onkologiska patientjournalen iKnowMed. Funktionerna, utvecklade med Commure, skriver utkast till besöksanteckningar, sammanfattar journaler och besök, föreslår diagnoskoder, besvarar frågor om mottagningens arbete och möjliggör diktering direkt i journalen. Detta är ett besked om produkttillgång, inte en studie som visar sparad klinikertid eller bättre patientutfall.
      - type: p
        text: >-
          Commure uppger att vårdpersonal granskar varje anteckning och kod innan den förs in i journalen. Företaget beskriver användning bland tidiga användare men redovisar ingen oberoende mätning av tidsvinst eller jämförelse av kliniska utfall. iKnowMed använder patientens vårdhistoria över tid i ett kommersiellt journalsystem. De granskade produktsidorna anger ingen offentlig kodlicens eller pris för mottagningar. Även ett smidigt integrerat utkast kräver mänsklig granskning.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) erbjuder kostnadsfria regler med MIT-licens och källbelagd evidens för granskningsbara onkologiska utkast utifrån inmatade falluppgifter. Reglerna kan inspekteras, men verktyget för inte elektronisk patientjournal, transkriberar inte besök och ger inte kliniskt validerade beslut. Verktygen tjänar olika arbetsflöden; ingen direkt jämförelse visar bättre patientutfall. Källor kontrollerade den 16 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Ontada legger AI til onkologiske pasientjournaler; lanseringen viser ikke pasientnytte'
    summary: 'iKnowMed får utkast til notater, journaloppsummeringer og kodeforslag. Meldingen måler verken spart tid eller pasientutfall.'
    body:
      - type: p
        text: >-
          Den 13. november 2026 opplyste Ontada at nye AI-verktøy var tilgjengelige for kunder med den onkologiske elektroniske pasientjournalen iKnowMed. Funksjonene, utviklet med Commure, lager utkast til konsultasjonsnotater, oppsummerer journaler og besøk, foreslår diagnosekoder, svarer på spørsmål om praksisdrift og tar imot diktat inne i journalen. Dette er en melding om produkttilgjengelighet, ikke en studie som viser spart klinikertid eller bedre pasientutfall.
      - type: p
        text: >-
          Commure sier at helsepersonell gjennomgår hvert notat og hver kode før det legges inn i journalen. Selskapet beskriver bruk blant tidlige brukere, men gir ingen uavhengig måling av spart tid eller sammenligning av kliniske resultater. iKnowMed bruker pasientens sykehistorie over tid i et kommersielt journalsystem. De gjennomgåtte produktsidene oppgir verken offentlig kodelisens eller pris for praksiser. Også et utkast som glir lett inn i arbeidsflyten, trenger menneskelig kontroll.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) tilbyr gratis regler med MIT-lisens og kildebelagt evidens for etterprøvbare onkologiske utkast fra innlagte saksopplysninger. Reglene kan inspiseres, men verktøyet fører ikke elektronisk pasientjournal, transkriberer ikke konsultasjoner og gir ikke klinisk validerte beslutninger. Verktøyene tjener ulike arbeidsflyter; ingen direkte sammenligning viser bedre pasientutfall. Kilder kontrollert 16. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Ontada tuo tekoälyä syöpähoidon potilastietoihin; julkaisu ei osoita potilashyötyä'
    summary: 'iKnowMed saa luonnokset vastaanottomuistiinpanoihin, potilastietojen yhteenvedot ja koodiehdotukset. Tiedote ei mittaa ajansäästöä eikä hoitotuloksia.'
    body:
      - type: p
        text: >-
          Ontada ilmoitti 13. marraskuuta 2026, että uudet tekoälytyökalut ovat sen onkologisen sähköisen potilastietojärjestelmän iKnowMed asiakkaiden käytettävissä. Commuren kanssa kehitetyt toiminnot laativat vastaanottomuistiinpanojen luonnoksia, tiivistävät potilastietoja ja käyntejä, ehdottavat diagnoosikoodeja, vastaavat vastaanoton työtä koskeviin kysymyksiin ja mahdollistavat sanelun järjestelmässä. Kyse on tuotteen saatavuudesta, ei tutkimuksesta, joka osoittaisi lääkärien ajansäästöä tai parempia potilastuloksia.
      - type: p
        text: >-
          Commuren mukaan ammattilaiset tarkistavat jokaisen muistiinpanon ja koodin ennen tallentamista potilastietoihin. Yhtiö kuvaa varhaisten käyttäjien käyttöä, mutta ei esitä riippumattomasti mitattua ajansäästöä eikä kliinisten tulosten vertailua. iKnowMed käyttää potilaan pitkittäistä hoitohistoriaa kaupallisessa järjestelmässä. Tarkastetuilla tuotesivuilla ei ilmoiteta julkista koodilisenssiä eikä hintaa vastaanotoille. Myös sujuvasti työnkulkuun sopiva luonnos vaatii ihmisen tarkistuksen.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) tarjoaa maksuttomia MIT-lisensoituja sääntöjä ja lähteistettyä näyttöä syötettyihin tapaustietoihin perustuviin tarkistettaviin onkologisiin luonnoksiin. Sääntöjä voi tutkia, mutta palvelu ei ylläpidä sähköistä potilaskertomusta, ei litteroi käyntejä eikä anna kliinisesti validoituja päätöksiä. Työkalut palvelevat eri työnkulkuja; suora vertailu ei osoita parempia potilastuloksia. Lähteet tarkistettu 16. marraskuuta 2026. Artikkeli ei korvaa lääkäriä.
