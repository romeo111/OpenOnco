slug: skribe-aurora-study
date: 2026-11-11
published: 2026-11-13
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, cardio-oncology, wearable, evidence]
title:
  en: 'Skribe tests a wearable heart monitor in cancer care; enrollment is not accuracy'
  uk: 'Skribe досліджує переносний монітор серця в онкології: набір учасників не доводить точності'
summary:
  en: 'The company reports over 800 people enrolled in a study comparing its patch with echocardiography. FDA program participation is not device authorization.'
  uk: 'Компанія повідомляє про понад 800 учасників дослідження, що порівнює її пластир з ехокардіографією. Участь у програмі FDA не є дозволом на продаж.'
sources:
  - citation: 'Skribe Medical. Clinical development update, 11 November 2026; company-reported enrollment. Checked 13 November 2026.'
    id: https://www.prnewswire.com/news-releases/skribe-medical-advances-wearable-heart-monitoring-for-cancer-patients-following-selection-for-fda-innovation-program-302936027.html
  - citation: 'U.S. FDA. READI-Home Innovation Challenge participant list and authorization disclaimer. Checked 13 November 2026.'
    id: https://www.fda.gov/medical-devices/home-health-care-hub/fda-readi-home-innovation-challenge-reducing-readmissions-through-device-innovation-home
  - citation: 'Skribe Medical. Aurora product and intended use. Checked 13 November 2026.'
    id: https://skribemedical.com/
  - citation: 'OpenOnco. Product scope and limitations, master checked 13 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/c98678dc822caa4cfdbdeab4be4c3e0923e22def/README.md
  - citation: 'OpenOnco. MIT code licence, master checked 13 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/c98678dc822caa4cfdbdeab4be4c3e0923e22def/LICENSE
body:
  en:
    - type: p
      text: >-
        In an 11 November 2026 update, Skribe Medical reported that more than 800 people had enrolled in its ongoing NOECHO study at 10 US sites and one Southeast Asian site. The study compares its Aurora wearable with echocardiography for estimating left ventricular ejection fraction, a measure of heart pumping function. The enrollment figure is the company's claim; the release gives no accuracy or patient-outcome results.
    - type: p
      text: >-
        Aurora is an adhesive sensor patch with AI-based analysis intended to support heart monitoring during cancer care. The FDA lists Skribe in its READI-Home development program and explicitly says participation is not marketing authorization. Home use remains a development aim. Skribe's checked pages state neither a public code licence nor a patient price. This is a physical monitoring workflow using heart signals, not a treatment-selection service.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) instead offers free MIT-licensed rules and cited sources for reviewable drafts about existing oncology evidence. Its inputs are case descriptions and published records, not heart-sensor signals. Its rules are inspectable, but it cannot measure cardiac function and is not clinically validated. These tools address different questions; no direct study shows either improves patient outcomes. Sources checked 13 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        У повідомленні від 11 листопада 2026 року Skribe Medical заявила, що до поточного дослідження NOECHO залучено понад 800 людей у 10 центрах США та одному центрі Південно-Східної Азії. У ньому пристрій Aurora порівнюють з ехокардіографією для оцінки фракції викиду лівого шлуночка — показника насосної функції серця. Число учасників повідомила сама компанія; даних про точність чи результати для пацієнтів у релізі немає.
    - type: p
      text: >-
        Aurora — сенсорний пластир з аналізом на основі ШІ для моніторингу серця під час лікування раку. FDA внесло Skribe до програми розробки READI-Home й прямо зазначає, що участь не є дозволом на продаж пристрою. Домашнє використання поки є метою розробки. На перевірених сторінках Skribe немає відкритої ліцензії на код чи ціни для пацієнта. Це робочий процес вимірювання серцевих сигналів, а не сервіс вибору лікування.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) натомість надає безкоштовні правила під ліцензією MIT і посилання на джерела для перевірюваних чернеток про наявні онкологічні докази. Його вхідні дані — опис випадку та опубліковані матеріали, а не сигнали датчика серця. Правила відкриті, але сервіс не вимірює функцію серця й не має клінічної валідації. Інструменти відповідають на різні запитання; прямого дослідження поліпшення результатів пацієнтів немає. Джерела перевірено 13 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Skribe prueba un monitor cardíaco portátil en oncología; reclutar participantes no demuestra precisión'
    summary: 'La empresa comunica más de 800 participantes en un estudio que compara su parche con la ecocardiografía. Participar en un programa de la FDA no equivale a autorización.'
    body:
      - type: p
        text: >-
          En una actualización del 11 de noviembre de 2026, Skribe Medical comunicó más de 800 personas inscritas en NOECHO, un estudio en 10 centros estadounidenses y uno del Sudeste Asiático. Compara su dispositivo Aurora con la ecocardiografía para estimar la fracción de eyección del ventrículo izquierdo, medida de la función de bombeo cardíaco. La cifra procede de la empresa; el comunicado no ofrece resultados de precisión ni de salud de pacientes.
      - type: p
        text: >-
          Aurora es un parche sensor con análisis mediante IA pensado para vigilar el corazón durante la atención oncológica. La FDA incluye a Skribe en READI-Home y aclara que participar no autoriza la comercialización. El uso doméstico sigue siendo una meta de desarrollo. Las páginas consultadas de Skribe no indican licencia pública del código ni precio para pacientes. Se trata de medir señales cardíacas, no de elegir tratamientos.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) ofrece reglas gratuitas bajo licencia MIT y fuentes citadas para borradores revisables sobre evidencia oncológica existente. Utiliza descripciones de casos y documentos publicados, no señales de sensores. Sus reglas son inspeccionables, pero no mide la función cardíaca ni está validado clínicamente. Son herramientas para preguntas distintas; ningún estudio directo demuestra mejores resultados para pacientes con alguna de ellas. Fuentes comprobadas el 13 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Skribe testa um monitor cardíaco vestível em oncologia; recrutamento não prova precisão'
    summary: 'A empresa refere mais de 800 participantes num estudo que compara o adesivo com a ecocardiografia. Participar num programa da FDA não é autorização de venda.'
    body:
      - type: p
        text: >-
          Numa atualização de 11 de novembro de 2026, a Skribe Medical referiu mais de 800 pessoas inscritas no estudo NOECHO, em 10 centros dos EUA e um do Sudeste Asiático. O estudo compara o dispositivo Aurora com a ecocardiografia para estimar a fração de ejeção do ventrículo esquerdo, uma medida da função de bombeamento do coração. O número vem da empresa; o comunicado não apresenta resultados de precisão nem de saúde dos doentes.
      - type: p
        text: >-
          Aurora é um adesivo com sensores e análise por IA, concebido para vigiar o coração durante os cuidados oncológicos. A FDA inclui a Skribe no programa READI-Home e esclarece que a participação não autoriza a comercialização. O uso em casa continua a ser um objetivo de desenvolvimento. As páginas consultadas não indicam licença pública do código nem preço para doentes. Trata-se de medir sinais cardíacos, não de escolher tratamentos.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) disponibiliza regras gratuitas sob licença MIT e fontes citadas para rascunhos verificáveis sobre evidência oncológica existente. Usa descrições de casos e documentos publicados, não sinais de sensores cardíacos. As regras podem ser inspecionadas, mas não mede a função cardíaca nem está clinicamente validado. São ferramentas para questões diferentes; nenhum estudo direto demonstra melhores resultados para doentes com qualquer delas. Fontes verificadas em 13 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Skribe prüft einen tragbaren Herzmonitor in der Krebsversorgung – Teilnehmerzahl belegt keine Genauigkeit'
    summary: 'Das Unternehmen meldet über 800 Teilnehmende in einer Studie gegen Echokardiografie. Die Teilnahme am FDA-Programm ist keine Marktzulassung.'
    body:
      - type: p
        text: >-
          In einer Mitteilung vom 11. November 2026 berichtete Skribe Medical über mehr als 800 Teilnehmende der laufenden NOECHO-Studie an 10 US-Standorten und einem Standort in Südostasien. Sie vergleicht das tragbare Aurora-Gerät mit der Echokardiografie zur Schätzung der linksventrikulären Ejektionsfraktion, eines Maßes der Pumpleistung des Herzens. Die Teilnehmerzahl stammt vom Unternehmen; die Mitteilung enthält weder Genauigkeits- noch Patientenergebnisse.
      - type: p
        text: >-
          Aurora ist ein Sensorpflaster mit KI-Analyse zur Herzüberwachung während der Krebsversorgung. Die FDA führt Skribe im Entwicklungsprogramm READI-Home und erklärt ausdrücklich, dass die Teilnahme keine Marktzulassung ist. Die Nutzung zu Hause bleibt ein Entwicklungsziel. Auf den geprüften Skribe-Seiten stehen weder eine öffentliche Codelizenz noch ein Patientenpreis. Hier werden Herzsignale gemessen, keine Therapien ausgewählt.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) bietet dagegen kostenlose Regeln unter MIT-Lizenz und Quellen für überprüfbare Entwürfe zu vorhandener onkologischer Evidenz. Es verarbeitet Fallbeschreibungen und Veröffentlichungen, keine Herzsensorsignale. Seine Regeln sind einsehbar, aber es misst keine Herzfunktion und ist nicht klinisch validiert. Beide Werkzeuge beantworten unterschiedliche Fragen; eine direkte Studie mit besseren Patientenergebnissen fehlt. Quellen geprüft am 13. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Skribe étudie un moniteur cardiaque portable en oncologie : le recrutement ne prouve pas sa précision'
    summary: 'La société annonce plus de 800 participants à une étude comparant son patch à l’échocardiographie. Le programme de la FDA ne vaut pas autorisation de vente.'
    body:
      - type: p
        text: >-
          Dans un communiqué du 11 novembre 2026, Skribe Medical annonce plus de 800 personnes inscrites à l’étude NOECHO, dans 10 centres américains et un centre d’Asie du Sud-Est. Elle compare le dispositif Aurora à l’échocardiographie pour estimer la fraction d’éjection du ventricule gauche, mesure de la fonction de pompe du cœur. Le nombre vient de la société ; le communiqué ne fournit aucun résultat de précision ni de santé des patients.
      - type: p
        text: >-
          Aurora est un patch à capteurs doté d’une analyse par IA, conçu pour surveiller le cœur pendant les soins oncologiques. La FDA inscrit Skribe au programme de développement READI-Home et précise que la participation n’autorise pas la commercialisation. L’utilisation à domicile reste un objectif. Les pages consultées ne donnent ni licence publique du code ni prix pour les patients. Il s’agit de mesurer des signaux cardiaques, pas de choisir un traitement.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) fournit plutôt des règles gratuites sous licence MIT et des sources pour des brouillons vérifiables sur les preuves oncologiques existantes. Il utilise des descriptions de cas et des documents publiés, pas des signaux de capteurs. Ses règles sont consultables, mais il ne mesure pas la fonction cardiaque et n’est pas validé cliniquement. Ces outils répondent à des questions différentes ; aucune étude directe ne démontre de meilleurs résultats pour les patients. Sources vérifiées le 13 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Skribe studia un monitor cardiaco indossabile in oncologia; arruolare persone non prova l’accuratezza'
    summary: 'L’azienda riferisce oltre 800 partecipanti a uno studio che confronta il cerotto con l’ecocardiografia. Il programma FDA non equivale ad autorizzazione.'
    body:
      - type: p
        text: >-
          In un aggiornamento dell’11 novembre 2026, Skribe Medical ha riferito oltre 800 iscritti allo studio NOECHO, in 10 centri statunitensi e uno nel Sud-Est asiatico. Lo studio confronta Aurora con l’ecocardiografia per stimare la frazione di eiezione del ventricolo sinistro, misura della capacità di pompaggio del cuore. Il numero proviene dall’azienda; il comunicato non riporta risultati di accuratezza né esiti per i pazienti.
      - type: p
        text: >-
          Aurora è un cerotto sensore con analisi basata sull’IA, pensato per monitorare il cuore durante le cure oncologiche. La FDA include Skribe nel programma di sviluppo READI-Home e chiarisce che partecipare non autorizza la vendita. L’uso domestico resta un obiettivo di sviluppo. Le pagine esaminate non indicano una licenza pubblica del codice né un prezzo per i pazienti. È un percorso di misura dei segnali cardiaci, non di scelta delle terapie.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) offre invece regole gratuite con licenza MIT e fonti per bozze verificabili sulle evidenze oncologiche esistenti. Usa descrizioni di casi e documenti pubblicati, non segnali cardiaci. Le sue regole sono ispezionabili, ma non misura la funzione cardiaca e non ha validazione clinica. I due strumenti rispondono a domande diverse; nessuno studio diretto dimostra migliori esiti per i pazienti. Fonti verificate il 13 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'Skribe undersøger en bærbar hjertemåler i kræftbehandling; deltagertal viser ikke nøjagtighed'
    summary: 'Virksomheden oplyser over 800 deltagere i et studie mod ekkokardiografi. Deltagelse i FDA-programmet er ikke en markedsføringstilladelse.'
    body:
      - type: p
        text: >-
          I en meddelelse fra 11. november 2026 oplyste Skribe Medical, at over 800 personer var tilmeldt det igangværende NOECHO-studie på 10 amerikanske centre og ét i Sydøstasien. Studiet sammenligner den bærbare Aurora-enhed med ekkokardiografi ved vurdering af venstre ventrikels uddrivningsfraktion, et mål for hjertets pumpefunktion. Tallet kommer fra virksomheden; meddelelsen indeholder ingen resultater om nøjagtighed eller patientudfald.
      - type: p
        text: >-
          Aurora er et sensorplaster med AI-analyse beregnet til hjerteovervågning under kræftbehandling. FDA nævner Skribe i udviklingsprogrammet READI-Home og understreger, at deltagelse ikke giver tilladelse til markedsføring. Hjemmebrug er stadig et udviklingsmål. De gennemgåede Skribe-sider oplyser hverken en offentlig kodelicens eller en patientpris. Her måles hjertesignaler; der vælges ikke behandling.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) tilbyder i stedet gratis regler under MIT-licens og kilder til efterprøvelige udkast om eksisterende onkologisk evidens. Det bruger sagsbeskrivelser og publicerede kilder, ikke hjertesensorsignaler. Reglerne kan undersøges, men værktøjet måler ikke hjertefunktion og er ikke klinisk valideret. Værktøjerne besvarer forskellige spørgsmål; ingen direkte undersøgelse viser bedre patientresultater. Kilder kontrolleret 13. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Skribe studerar en bärbar hjärtmonitor i cancervården; deltagarantal visar inte träffsäkerhet'
    summary: 'Bolaget uppger över 800 deltagare i en studie mot ekokardiografi. FDA-programmet innebär inget marknadsgodkännande.'
    body:
      - type: p
        text: >-
          I ett meddelande den 11 november 2026 uppgav Skribe Medical att över 800 personer rekryterats till den pågående NOECHO-studien vid 10 amerikanska centra och ett i Sydostasien. Studien jämför Aurora med ekokardiografi för att uppskatta vänsterkammarens ejektionsfraktion, ett mått på hjärtats pumpförmåga. Siffran kommer från bolaget; meddelandet innehåller inga resultat om träffsäkerhet eller patientutfall.
      - type: p
        text: >-
          Aurora är ett sensorplåster med AI-analys avsett för hjärtövervakning under cancervård. FDA listar Skribe i utvecklingsprogrammet READI-Home och betonar att deltagande inte är ett marknadsgodkännande. Hemmaanvändning är fortfarande ett utvecklingsmål. De granskade Skribe-sidorna anger varken en offentlig kodlicens eller ett patientpris. Här mäts hjärtsignaler; behandlingsval görs inte.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) erbjuder i stället fria regler med MIT-licens och källor för granskningsbara utkast om befintlig onkologisk evidens. Det använder fallbeskrivningar och publicerade dokument, inte hjärtsensorsignaler. Reglerna kan granskas, men verktyget mäter inte hjärtfunktion och är inte kliniskt validerat. Verktygen svarar på olika frågor; ingen direkt studie visar bättre patientutfall. Källor granskade 13 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Skribe undersøker en bærbar hjertemåler i kreftomsorgen; antall deltakere viser ikke nøyaktighet'
    summary: 'Selskapet oppgir over 800 deltakere i en studie mot ekkokardiografi. FDA-programmet er ingen markedsføringstillatelse.'
    body:
      - type: p
        text: >-
          I en melding 11. november 2026 oppga Skribe Medical at over 800 personer var tatt inn i den pågående NOECHO-studien ved 10 amerikanske sentre og ett i Sørøst-Asia. Studien sammenligner Aurora med ekkokardiografi for å anslå venstre ventrikkels ejeksjonsfraksjon, et mål på hjertets pumpefunksjon. Tallet kommer fra selskapet; meldingen gir ingen resultater om nøyaktighet eller pasientutfall.
      - type: p
        text: >-
          Aurora er et sensorplaster med KI-analyse beregnet på hjerteovervåking under kreftbehandling. FDA lister Skribe i utviklingsprogrammet READI-Home og understreker at deltakelse ikke er markedsføringstillatelse. Hjemmebruk er fortsatt et utviklingsmål. De gjennomgåtte Skribe-sidene oppgir verken offentlig kodelisens eller pasientpris. Dette er måling av hjertesignaler, ikke valg av behandling.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) tilbyr i stedet gratis regler under MIT-lisens og kilder for etterprøvbare utkast om eksisterende onkologisk evidens. Det bruker kasusbeskrivelser og publiserte dokumenter, ikke hjertesensorsignaler. Reglene kan inspiseres, men verktøyet måler ikke hjertefunksjon og er ikke klinisk validert. Verktøyene svarer på ulike spørsmål; ingen direkte studie viser bedre pasientutfall. Kilder kontrollert 13. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Skribe tutkii puettavaa sydänmittaria syöpähoidossa; osallistujamäärä ei todista tarkkuutta'
    summary: 'Yhtiö kertoo yli 800 osallistujasta tutkimuksessa, jossa laitetta verrataan sydämen ultraäänitutkimukseen. FDA-ohjelma ei ole myyntilupa.'
    body:
      - type: p
        text: >-
          Skribe Medical ilmoitti 11. marraskuuta 2026, että käynnissä olevaan NOECHO-tutkimukseen oli osallistunut yli 800 henkilöä 10 yhdysvaltalaisessa keskuksessa ja yhdessä Kaakkois-Aasian keskuksessa. Tutkimus vertaa Aurora-laitetta sydämen ultraäänitutkimukseen vasemman kammion ejektiofraktion arvioinnissa. Se kuvaa sydämen pumppaustoimintaa. Osallistujamäärä on yhtiön ilmoittama; tiedote ei sisällä tarkkuus- eikä potilastuloksia.
      - type: p
        text: >-
          Aurora on tekoälyanalyysia käyttävä anturilaastari sydämen seurantaan syöpähoidon aikana. FDA listaa Skriben READI-Home-kehitysohjelman osallistujaksi ja toteaa, ettei osallistuminen ole markkinointilupa. Kotikäyttö on edelleen kehitystavoite. Tarkistetuilla Skriben sivuilla ei ilmoiteta julkista ohjelmistolisenssiä eikä potilashintaa. Laite mittaa sydämen signaaleja eikä valitse hoitoa.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) puolestaan tarjoaa maksuttomia MIT-lisensoituja sääntöjä ja lähteitä tarkistettaviin luonnoksiin julkaistusta onkologisesta näytöstä. Se käyttää tapauskuvauksia ja julkaisuja, ei sydänanturin signaaleja. Sääntöjä voi tarkastella, mutta palvelu ei mittaa sydämen toimintaa eikä ole kliinisesti validoitu. Työkalut vastaavat eri kysymyksiin; suora tutkimus ei osoita kummankaan parantavan potilastuloksia. Lähteet tarkistettu 13. marraskuuta 2026. Artikkeli ei korvaa lääkärin arviota.
