slug: camoral-hnscc
date: 2026-11-12
published: 2026-11-14
kind: explainer
series: openonco-three-day
series_format: research
author: OpenOnco
tags: [research, head-and-neck-cancer, immunotherapy, evidence]
title:
  en: 'CAMORAL: fewer events at two years, with more severe adverse events'
  uk: 'CAMORAL: менше подій за два роки, але більше тяжких побічних явищ'
summary:
  en: 'In a 125-person phase 2 trial, two-year event-free survival was 77.8% versus 46.1%; severe adverse events occurred in 50/63 versus 35/62. Confirmation is needed.'
  uk: 'У дослідженні II фази за участю 125 людей дворічне виживання без подій становило 77,8% проти 46,1%; тяжкі побічні явища — 50/63 проти 35/62. Потрібне підтвердження.'
sources:
  - citation: 'Liu F et al. CAMORAL randomized phase 2 trial, JAMA Oncology, published 12 November 2026, DOI 10.1001/jamaoncol.2026.4642. Checked 14 November 2026.'
    id: https://jamanetwork.com/journals/jamaoncology/fullarticle/2856378
  - citation: 'OpenOnco. Current HNSCC indication example for recurrent/metastatic disease; a different setting from CAMORAL. Checked 14 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/3dbf0ab37d2da2550bd9c7ca22f5d742523cd6b3/knowledge_base/hosted/content/indications/ind_hnscc_rm_1l_pembro_chemo.yaml
  - citation: 'OpenOnco Tumor Board. Product page and limitations. Checked 14 November 2026.'
    id: https://openonco.info/ask.html
body:
  en:
    - type: p
      text: >-
        Published on 12 November 2026, CAMORAL was an open-label, randomized phase 2 trial at four hospitals in China. It enrolled 125 adults with untreated, resectable stage III–IVB head and neck squamous cell carcinoma: 63 received camrelizumab with chemotherapy before surgery and camrelizumab afterward alongside risk-adapted care; 62 had surgery first and standard postoperative care. Most participants, 103 of 125, had an oral-cavity primary. The treatments differed at several stages, so the trial cannot isolate the effect of any one component.
    - type: p
      text: >-
        At two years, estimated event-free survival was 77.8% in the experimental group versus 46.1% in the control group, a 31.7-percentage-point difference. This endpoint counts progression, recurrence or death; it is not the same as proven longer overall survival. Median follow-up was 24.6 months. Grade 3 or higher treatment-emergent adverse events occurred in 50/63 (79.4%) versus 35/62 (56.5%); one fatal treatment-emergent event was reported in the control group. The higher severe-toxicity burden matters alongside the efficacy signal.
    - type: p
      text: >-
        The small phase 2 study, open-label design, short follow-up and concentration of oral-cavity cases limit generalization. PD-L1 levels were imbalanced between groups, and there was no direct comparison with perioperative immunotherapy without chemotherapy. The authors call for a confirmatory phase 3 trial. These findings do not establish this regimen as standard care for an individual or prove a survival advantage.
    - type: p
      text: >-
        Tumor Board perspective, without a live run: for a wholly fictional 55-year-old with resectable stage III oral-cavity cancer, a discussion draft would check pathology, exact stage and operability, then separate the trial's event-free-survival signal from toxicity and its unresolved comparisons. Current OpenOnco HNSCC indication records checked here address recurrent/metastatic disease, not this perioperative trial; presenting a generated pathway would mislead. [OpenOnco Tumor Board](/ask.html) is a draft tool. Sources checked 14 November 2026. This article is not an individual treatment plan and does not replace a doctor.
  uk:
    - type: p
      text: >-
        Опубліковане 12 листопада 2026 року CAMORAL — відкрите рандомізоване дослідження II фази у чотирьох лікарнях Китаю. У ньому взяли участь 125 дорослих з раніше нелікованим операбельним плоскоклітинним раком голови та шиї III–IVB стадії. 63 людини отримували камрелізумаб із хімієтерапією до операції та камрелізумаб після неї разом із лікуванням з урахуванням ризику; 62 спершу оперували й проводили стандартне післяопераційне лікування. У 103 зі 125 первинна пухлина була в ротовій порожнині. Схеми відрізнялися на кількох етапах, тому внесок окремого компонента визначити не можна.
    - type: p
      text: >-
        Через два роки оцінене виживання без подій становило 77,8% у дослідній групі проти 46,1% у контрольній — різниця 31,7 відсоткового пункту. Показник охоплює прогресування, рецидив або смерть; це не доказ подовження загального виживання. Медіана спостереження — 24,6 місяця. Побічні явища щонайменше 3 ступеня виникли у 50/63 (79,4%) проти 35/62 (56,5%); одну смерть, пов’язану в часі з лікуванням, зафіксували в контрольній групі. Більшу частоту тяжкої токсичності слід оцінювати разом із сигналом ефективності.
    - type: p
      text: >-
        Узагальнення обмежують невелике дослідження II фази, відкритий дизайн, коротке спостереження та переважання пухлин ротової порожнини. Рівні PD-L1 між групами відрізнялися, а прямого порівняння з периопераційною імунотерапією без хімієтерапії не було. Автори закликають до підтвердження в дослідженні III фази. Ці результати не роблять схему стандартом для окремої людини й не доводять переваги за загальним виживанням.
    - type: p
      text: >-
        Погляд Tumor Board, без реального запуску: для цілком вигаданої 55-річної людини з операбельним раком ротової порожнини III стадії чернетка для обговорення перевірила б гістологію, точну стадію й можливість операції та відокремила сигнал виживання без подій від токсичності й невирішених порівнянь. Перевірені записи OpenOnco щодо раку голови та шиї стосуються рецидивного або метастатичного захворювання, а не цього дослідження навколо операції; видавати згенерований маршрут було б оманливо. [OpenOnco Tumor Board](/ukr/ask.html) створює чернетки. Джерела перевірено 14 листопада 2026 року. Це не індивідуальний план лікування й не заміна лікаря.
translations:
  es:
    title: 'CAMORAL: menos eventos a dos años, pero más efectos adversos graves'
    summary: 'En 125 personas, la supervivencia sin eventos a dos años fue del 77,8% frente al 46,1%; los efectos graves, 50/63 frente a 35/62. Falta confirmación.'
    body:
      - type: p
        text: >-
          Publicado el 12 de noviembre de 2026, CAMORAL fue un ensayo abierto, aleatorizado, de fase 2 en cuatro hospitales chinos. Incluyó a 125 adultos con carcinoma escamoso de cabeza y cuello operable, estadio III–IVB, no tratado: 63 recibieron camrelizumab con quimioterapia antes de la cirugía y camrelizumab después, además de cuidados adaptados al riesgo; 62 comenzaron con cirugía y cuidados posoperatorios estándar. En 103 de 125, el tumor primario estaba en la cavidad oral. Los tratamientos diferían en varias etapas: no se puede aislar el efecto de un componente.
      - type: p
        text: >-
          A dos años, la supervivencia sin eventos estimada fue del 77,8% frente al 46,1%, una diferencia de 31,7 puntos porcentuales. Incluye progresión, recaída o muerte; no demuestra mayor supervivencia global. La mediana de seguimiento fue de 24,6 meses. Hubo efectos adversos aparecidos durante el tratamiento de grado 3 o superior en 50/63 (79,4%) frente a 35/62 (56,5%); se notificó uno mortal en el grupo control. La mayor toxicidad grave importa tanto como la señal de eficacia.
      - type: p
        text: >-
          El tamaño reducido de fase 2, el diseño abierto, el seguimiento breve y el predominio de tumores orales limitan la generalización. Los niveles de PD-L1 estaban desequilibrados y no hubo comparación directa con inmunoterapia perioperatoria sin quimioterapia. Los autores piden confirmación en fase 3. Esto no establece una pauta estándar individual ni prueba una ventaja en supervivencia global.
      - type: p
        text: >-
          Perspectiva del Tumor Board, sin ejecución real: para una persona ficticia de 55 años con cáncer oral operable en estadio III, un borrador comprobaría la anatomía patológica, el estadio y la operabilidad y separaría la señal de supervivencia sin eventos de la toxicidad y las comparaciones pendientes. Los registros de OpenOnco examinados sobre cabeza y cuello tratan enfermedad recurrente o metastásica, no este contexto perioperatorio; simular una ruta generada sería engañoso. [OpenOnco Tumor Board](/es/ask.html) crea borradores. Fuentes verificadas el 14 de noviembre de 2026. Este texto no es un plan individual ni sustituye a un médico.
  pt:
    title: 'CAMORAL: menos eventos em dois anos, mas mais efeitos adversos graves'
    summary: 'Em 125 pessoas, a sobrevivência sem eventos aos dois anos foi 77,8% contra 46,1%; efeitos graves, 50/63 contra 35/62. Falta confirmação.'
    body:
      - type: p
        text: >-
          Publicado em 12 de novembro de 2026, o CAMORAL foi um ensaio aberto, aleatorizado, de fase 2 em quatro hospitais chineses. Incluiu 125 adultos com carcinoma espinocelular da cabeça e pescoço operável, estádio III–IVB, ainda não tratado: 63 receberam camrelizumab com quimioterapia antes da cirurgia e camrelizumab depois, além de cuidados adaptados ao risco; 62 começaram com cirurgia e cuidados pós-operatórios habituais. Em 103 de 125, o tumor primário era da cavidade oral. Os tratamentos diferiam em várias fases, pelo que não se pode isolar um componente.
      - type: p
        text: >-
          Aos dois anos, a sobrevivência sem eventos estimada foi 77,8% contra 46,1%, diferença de 31,7 pontos percentuais. Conta progressão, recidiva ou morte; não demonstra maior sobrevivência global. A mediana de seguimento foi 24,6 meses. Efeitos adversos emergentes do tratamento de grau 3 ou superior ocorreram em 50/63 (79,4%) contra 35/62 (56,5%); houve um evento mortal no grupo controlo. A maior toxicidade grave acompanha o sinal de eficácia.
      - type: p
        text: >-
          A pequena fase 2, o desenho aberto, o seguimento curto e o predomínio de tumores orais limitam a generalização. Os níveis de PD-L1 estavam desequilibrados e não houve comparação direta com imunoterapia perioperatória sem quimioterapia. Os autores pedem confirmação numa fase 3. Isto não estabelece um regime padrão individual nem prova vantagem na sobrevivência global.
      - type: p
        text: >-
          Perspetiva do Tumor Board, sem execução real: para uma pessoa fictícia de 55 anos com cancro oral operável em estádio III, um rascunho verificaria patologia, estádio e operabilidade e separaria a sobrevivência sem eventos da toxicidade e das comparações em falta. Os registos examinados do OpenOnco para cabeça e pescoço abordam doença recorrente ou metastática, não este contexto perioperatório; fingir um percurso gerado induziria em erro. O [OpenOnco Tumor Board](/pt/ask.html) produz rascunhos. Fontes verificadas em 14 de novembro de 2026. Este texto não é um plano individual nem substitui um médico.
  de:
    title: 'CAMORAL: weniger Ereignisse nach zwei Jahren, aber mehr schwere Nebenwirkungen'
    summary: 'Bei 125 Personen betrug das ereignisfreie Zweijahresüberleben 77,8% gegenüber 46,1%; schwere Nebenwirkungen 50/63 gegenüber 35/62. Bestätigung nötig.'
    body:
      - type: p
        text: >-
          CAMORAL wurde am 12. November 2026 veröffentlicht. Die offene, randomisierte Phase-2-Studie an vier chinesischen Kliniken schloss 125 Erwachsene mit unbehandeltem, operablem Plattenepithelkarzinom im Kopf-Hals-Bereich, Stadium III–IVB, ein. 63 erhielten Camrelizumab mit Chemotherapie vor der Operation und Camrelizumab danach zusätzlich zur risikoadaptierten Versorgung; 62 wurden zuerst operiert und erhielten übliche Nachbehandlung. Bei 103 von 125 lag der Primärtumor in der Mundhöhle. Die Behandlungen unterschieden sich in mehreren Phasen; der Beitrag einer einzelnen Komponente bleibt unklar.
      - type: p
        text: >-
          Nach zwei Jahren betrug das geschätzte ereignisfreie Überleben 77,8% gegenüber 46,1%, ein Unterschied von 31,7 Prozentpunkten. Dieser Endpunkt umfasst Fortschreiten, Rückfall oder Tod; ein längeres Gesamtüberleben ist damit nicht bewiesen. Die mediane Nachbeobachtung betrug 24,6 Monate. Unter der Behandlung aufgetretene Ereignisse ab Grad 3 traten bei 50/63 (79,4%) gegenüber 35/62 (56,5%) auf; ein tödliches Ereignis wurde in der Kontrollgruppe berichtet. Die häufigere schwere Toxizität gehört zur Bewertung des Wirksamkeitssignals.
      - type: p
        text: >-
          Die kleine Phase-2-Studie, das offene Design, die kurze Nachbeobachtung und die vielen Mundhöhlentumoren begrenzen die Übertragbarkeit. Die PD-L1-Werte waren zwischen den Gruppen ungleich verteilt; ein direkter Vergleich mit perioperativer Immuntherapie ohne Chemotherapie fehlte. Die Autoren fordern eine bestätigende Phase-3-Studie. Daraus folgt weder ein individueller Behandlungsstandard noch ein bewiesener Vorteil beim Gesamtüberleben.
      - type: p
        text: >-
          Tumor-Board-Perspektive, ohne tatsächlichen Lauf: Bei einer völlig erfundenen 55-jährigen Person mit operablem Mundhöhlenkrebs im Stadium III müsste ein Diskussionsentwurf Pathologie, genaues Stadium und Operabilität prüfen und das ereignisfreie Überleben von Toxizität und offenen Vergleichen trennen. Die geprüften OpenOnco-Einträge zum Kopf-Hals-Krebs betreffen rezidivierte oder metastasierte Erkrankung, nicht diese perioperative Situation; ein angeblich generierter Pfad wäre irreführend. [OpenOnco Tumor Board](/de/ask.html) erstellt Entwürfe. Quellen geprüft am 14. November 2026. Dies ist kein individueller Therapieplan und ersetzt keinen Arzt.
  fr:
    title: 'CAMORAL : moins d’événements à deux ans, mais plus d’effets indésirables graves'
    summary: 'Chez 125 personnes, la survie sans événement à deux ans était de 77,8% contre 46,1% ; les effets graves, 50/63 contre 35/62. Confirmation nécessaire.'
    body:
      - type: p
        text: >-
          Publié le 12 novembre 2026, CAMORAL est un essai ouvert, randomisé, de phase 2 mené dans quatre hôpitaux chinois. Il comptait 125 adultes atteints d’un carcinome épidermoïde de la tête et du cou opérable, de stade III–IVB, non traité : 63 ont reçu du camrélizumab et une chimiothérapie avant l’opération puis du camrélizumab après, en plus des soins adaptés au risque ; 62 ont eu d’abord la chirurgie puis les soins postopératoires habituels. Chez 103 sur 125, la tumeur primitive se trouvait dans la cavité buccale. Les traitements différaient à plusieurs étapes ; l’effet d’un seul élément ne peut être isolé.
      - type: p
        text: >-
          À deux ans, la survie sans événement estimée était de 77,8% contre 46,1%, soit 31,7 points de pourcentage d’écart. Elle inclut progression, récidive ou décès ; elle ne prouve pas une survie globale prolongée. Le suivi médian était de 24,6 mois. Les événements indésirables apparus sous traitement de grade 3 ou plus ont concerné 50/63 (79,4%) contre 35/62 (56,5%) ; un événement mortel a été rapporté dans le groupe témoin. La toxicité grave accrue compte autant que le signal d’efficacité.
      - type: p
        text: >-
          La petite taille de cette phase 2, l’absence d’aveugle, le suivi court et la prédominance des tumeurs buccales limitent la généralisation. Les taux de PD-L1 étaient déséquilibrés et il n’y avait pas de comparaison directe avec l’immunothérapie périopératoire sans chimiothérapie. Les auteurs demandent un essai confirmatoire de phase 3. Cela n’établit ni un traitement standard individuel ni un bénéfice prouvé sur la survie globale.
      - type: p
        text: >-
          Point de vue du Tumor Board, sans exécution réelle : pour une personne fictive de 55 ans avec un cancer buccal opérable de stade III, un brouillon vérifierait l’anatomopathologie, le stade exact et l’opérabilité, puis distinguerait le signal de survie sans événement de la toxicité et des comparaisons manquantes. Les fiches OpenOnco examinées pour la tête et le cou concernent la maladie récidivante ou métastatique, pas cette situation périopératoire ; prétendre générer un parcours serait trompeur. [OpenOnco Tumor Board](/fr/ask.html) produit des brouillons. Sources vérifiées le 14 novembre 2026. Ce texte n’est pas un plan individuel et ne remplace pas un médecin.
  it:
    title: 'CAMORAL: meno eventi a due anni, ma più effetti avversi gravi'
    summary: 'In 125 persone la sopravvivenza libera da eventi a due anni è stata del 77,8% contro il 46,1%; eventi gravi, 50/63 contro 35/62. Serve conferma.'
    body:
      - type: p
        text: >-
          Pubblicato il 12 novembre 2026, CAMORAL è uno studio aperto, randomizzato, di fase 2 condotto in quattro ospedali cinesi. Ha coinvolto 125 adulti con carcinoma squamocellulare della testa e del collo operabile, stadio III–IVB, non trattato: 63 hanno ricevuto camrelizumab con chemioterapia prima dell’intervento e camrelizumab dopo, insieme alle cure adattate al rischio; 62 sono stati operati subito e hanno ricevuto cure postoperatorie standard. In 103 su 125 la sede primaria era la cavità orale. Le cure differivano in più fasi, quindi non si isola l’effetto di un solo elemento.
      - type: p
        text: >-
          A due anni la sopravvivenza libera da eventi stimata era del 77,8% contro il 46,1%, differenza di 31,7 punti percentuali. Include progressione, recidiva o morte; non dimostra una maggiore sopravvivenza globale. Il follow-up mediano era di 24,6 mesi. Eventi avversi insorti durante il trattamento di grado 3 o superiore si sono verificati in 50/63 (79,4%) contro 35/62 (56,5%); un evento fatale è stato segnalato nel gruppo di controllo. La maggiore tossicità grave va valutata insieme al segnale di efficacia.
      - type: p
        text: >-
          La piccola fase 2, il disegno aperto, l’osservazione breve e la prevalenza di tumori orali limitano la generalizzabilità. I livelli di PD-L1 erano sbilanciati tra i gruppi e mancava un confronto diretto con immunoterapia perioperatoria senza chemioterapia. Gli autori chiedono una fase 3 di conferma. I dati non stabiliscono una cura standard individuale né provano un vantaggio di sopravvivenza globale.
      - type: p
        text: >-
          Prospettiva del Tumor Board, senza esecuzione reale: per una persona del tutto fittizia di 55 anni con tumore orale operabile in stadio III, una bozza verificherebbe istologia, stadio esatto e operabilità e distinguerebbe la sopravvivenza libera da eventi dalla tossicità e dai confronti mancanti. Le schede OpenOnco esaminate per testa e collo riguardano malattia recidivata o metastatica, non questo contesto perioperatorio; simulare un percorso generato sarebbe fuorviante. [OpenOnco Tumor Board](/it/ask.html) crea bozze. Fonti verificate il 14 novembre 2026. Questo non è un piano individuale e non sostituisce un medico.
  da:
    title: 'CAMORAL: færre hændelser efter to år, men flere alvorlige bivirkninger'
    summary: 'Blandt 125 personer var toårs hændelsesfri overlevelse 77,8% mod 46,1%; alvorlige bivirkninger 50/63 mod 35/62. Bekræftelse kræves.'
    body:
      - type: p
        text: >-
          CAMORAL blev offentliggjort 12. november 2026. Det var et åbent, randomiseret fase 2-forsøg på fire kinesiske hospitaler med 125 voksne med ubehandlet, operabelt planocellulært karcinom i hoved og hals, stadie III–IVB. 63 fik camrelizumab og kemoterapi før operation og camrelizumab bagefter sammen med risikotilpasset behandling; 62 blev opereret først og fik sædvanlig efterbehandling. Hos 103 af 125 var primærtumoren i mundhulen. Behandlingerne var forskellige i flere faser, så virkningen af en enkelt del kan ikke isoleres.
      - type: p
        text: >-
          Efter to år var den estimerede hændelsesfri overlevelse 77,8% mod 46,1%, en forskel på 31,7 procentpoint. Den omfatter progression, tilbagefald eller død; den beviser ikke længere samlet overlevelse. Medianopfølgningen var 24,6 måneder. Behandlingsopståede bivirkninger af grad 3 eller højere forekom hos 50/63 (79,4%) mod 35/62 (56,5%); én dødelig hændelse blev rapporteret i kontrolgruppen. Den hyppigere alvorlige toksicitet hører med til vurderingen af effekten.
      - type: p
        text: >-
          Det lille fase 2-forsøg, det åbne design, den korte opfølgning og overvægt af mundhulekræft begrænser generalisering. PD-L1-niveauerne var ulige fordelt, og der var ingen direkte sammenligning med perioperativ immunterapi uden kemoterapi. Forfatterne efterlyser et bekræftende fase 3-forsøg. Det fastslår ikke en individuel standardbehandling eller en bevist fordel i samlet overlevelse.
      - type: p
        text: >-
          Tumor Board-perspektiv, uden faktisk kørsel: For en helt opdigtet 55-årig med operabel mundhulekræft i stadie III ville et diskussionsudkast kontrollere patologi, præcist stadie og operabilitet og skelne hændelsesfri overlevelse fra toksicitet og ubesvarede sammenligninger. De gennemgåede OpenOnco-poster for hoved-hals-kræft omhandler tilbagevendende eller metastatisk sygdom, ikke dette perioperative forsøg; en påstået genereret vej ville vildlede. [OpenOnco Tumor Board](/da/ask.html) laver udkast. Kilder kontrolleret 14. november 2026. Dette er ikke en individuel plan og erstatter ikke en læge.
  sv:
    title: 'CAMORAL: färre händelser efter två år, men fler allvarliga biverkningar'
    summary: 'Hos 125 personer var tvåårig händelsefri överlevnad 77,8% mot 46,1%; allvarliga biverkningar 50/63 mot 35/62. Bekräftelse behövs.'
    body:
      - type: p
        text: >-
          CAMORAL publicerades den 12 november 2026. Den öppna randomiserade fas 2-studien vid fyra kinesiska sjukhus omfattade 125 vuxna med tidigare obehandlad, operabel skivepitelcancer i huvud och hals, stadium III–IVB. 63 fick camrelizumab och cytostatika före operationen samt camrelizumab efteråt tillsammans med riskanpassad vård; 62 opererades först och fick sedvanlig efterbehandling. Hos 103 av 125 fanns primärtumören i munhålan. Behandlingarna skilde sig i flera steg, så en enskild komponents effekt kan inte isoleras.
      - type: p
        text: >-
          Efter två år var uppskattad händelsefri överlevnad 77,8% mot 46,1%, en skillnad på 31,7 procentenheter. Måttet omfattar progression, återfall eller död; det bevisar inte längre totalöverlevnad. Medianuppföljningen var 24,6 månader. Behandlingsuppkomna biverkningar av grad 3 eller högre sågs hos 50/63 (79,4%) mot 35/62 (56,5%); en dödlig händelse rapporterades i kontrollgruppen. Den ökade allvarliga toxiciteten måste vägas mot effektsignalen.
      - type: p
        text: >-
          Den lilla fas 2-studien, öppna designen, korta uppföljningen och dominansen av munhålecancer begränsar generaliserbarheten. PD-L1-nivåerna var ojämnt fördelade och ingen direkt jämförelse gjordes med perioperativ immunterapi utan cytostatika. Författarna efterlyser en bekräftande fas 3-studie. Resultaten fastställer inte individuell standardbehandling eller en bevisad fördel i totalöverlevnad.
      - type: p
        text: >-
          Tumor Board-perspektiv, utan faktisk körning: För en helt påhittad 55-åring med operabel munhålecancer i stadium III skulle ett diskussionsutkast kontrollera patologi, exakt stadium och operabilitet och skilja den händelsefria överlevnaden från toxicitet och obesvarade jämförelser. De granskade OpenOnco-posterna om huvud-hals-cancer gäller återkommen eller metastatisk sjukdom, inte detta perioperativa sammanhang; en påstått genererad väg vore missvisande. [OpenOnco Tumor Board](/sv/ask.html) skapar utkast. Källor granskade 14 november 2026. Detta är ingen individuell plan och ersätter inte en läkare.
  nb:
    title: 'CAMORAL: færre hendelser etter to år, men flere alvorlige bivirkninger'
    summary: 'Hos 125 personer var toårig hendelsesfri overlevelse 77,8% mot 46,1%; alvorlige bivirkninger 50/63 mot 35/62. Bekreftelse trengs.'
    body:
      - type: p
        text: >-
          CAMORAL ble publisert 12. november 2026. Den åpne randomiserte fase 2-studien ved fire kinesiske sykehus omfattet 125 voksne med ubehandlet, operabelt plateepitelkarsinom i hode og hals, stadium III–IVB. 63 fikk camrelizumab og cellegift før operasjon og camrelizumab etterpå sammen med risikotilpasset behandling; 62 ble operert først og fikk vanlig etterbehandling. Hos 103 av 125 lå primærsvulsten i munnhulen. Behandlingen skilte seg i flere faser, så effekten av én enkelt del kan ikke isoleres.
      - type: p
        text: >-
          Etter to år var estimert hendelsesfri overlevelse 77,8% mot 46,1%, en forskjell på 31,7 prosentpoeng. Målet omfatter progresjon, tilbakefall eller død; det beviser ikke lengre totaloverlevelse. Median oppfølging var 24,6 måneder. Behandlingsoppståtte bivirkninger av grad 3 eller høyere rammet 50/63 (79,4%) mot 35/62 (56,5%); én dødelig hendelse ble rapportert i kontrollgruppen. Den høyere alvorlige toksisiteten må ses sammen med effektsignalet.
      - type: p
        text: >-
          Den lille fase 2-studien, åpne utformingen, korte oppfølgingen og mange munnhulesvulster begrenser overførbarheten. PD-L1-nivåene var skjevt fordelt, og det fantes ingen direkte sammenligning med perioperativ immunterapi uten cellegift. Forfatterne etterlyser en bekreftende fase 3-studie. Dette fastslår ikke individuell standardbehandling eller bevist fordel i totaloverlevelse.
      - type: p
        text: >-
          Tumor Board-perspektiv, uten faktisk kjøring: For en helt oppdiktet 55-åring med operabel munnhulekreft i stadium III ville et diskusjonsutkast kontrollere patologi, nøyaktig stadium og operabilitet og skille hendelsesfri overlevelse fra toksisitet og ubesvarte sammenligninger. De undersøkte OpenOnco-postene for hode-hals-kreft gjelder tilbakevendende eller metastatisk sykdom, ikke denne perioperative situasjonen; en påstått generert vei ville villede. [OpenOnco Tumor Board](/nb/ask.html) lager utkast. Kilder kontrollert 14. november 2026. Dette er ingen individuell plan og erstatter ikke en lege.
  fi:
    title: 'CAMORAL: vähemmän tapahtumia kahdessa vuodessa mutta enemmän vakavia haittoja'
    summary: '125 henkilön tutkimuksessa kahden vuoden tapahtumaton elossaolo oli 77,8% vastaan 46,1%; vakavia haittoja 50/63 vastaan 35/62. Vahvistus tarvitaan.'
    body:
      - type: p
        text: >-
          CAMORAL julkaistiin 12. marraskuuta 2026. Kiinan neljässä sairaalassa tehty avoin satunnaistettu vaiheen 2 tutkimus käsitti 125 aikuista, joilla oli aiemmin hoitamaton, leikattavissa oleva vaiheen III–IVB pään ja kaulan levyepiteelisyöpä. 63 sai kamrelitsumabia ja solunsalpaajia ennen leikkausta sekä kamrelitsumabia sen jälkeen riskin mukaan sovitetun hoidon lisäksi; 62 leikattiin ensin ja sai tavanomaisen jälkihoidon. Ensisijainen kasvain oli suuontelossa 103:lla 125:stä. Hoidot erosivat monessa vaiheessa, joten yhden osan vaikutusta ei voi erottaa.
      - type: p
        text: >-
          Kahden vuoden arvioitu tapahtumaton elossaolo oli 77,8% vastaan 46,1%, ero 31,7 prosenttiyksikköä. Mittari kattaa etenemisen, uusiutumisen tai kuoleman; se ei osoita pidempää kokonaiselossaoloa. Seurannan mediaani oli 24,6 kuukautta. Hoidon aikana ilmaantuneita vähintään asteen 3 haittoja oli 50/63:lla (79,4%) vastaan 35/62:lla (56,5%); yksi kuolemaan johtanut haittatapahtuma raportoitiin vertailuryhmässä. Vakavien haittojen suurempi määrä on huomioitava tehosignaalin rinnalla.
      - type: p
        text: >-
          Pieni vaiheen 2 tutkimus, avoin asetelma, lyhyt seuranta ja suuontelon syöpien suuri osuus rajoittavat yleistettävyyttä. PD-L1-tasot olivat epätasapainossa, eikä suoraa vertailua tehty leikkauksen ympärille ajoitettuun immunoterapiaan ilman solunsalpaajia. Tutkijat vaativat vahvistavaa vaiheen 3 tutkimusta. Tulokset eivät määritä yksilöllistä vakiohoitoa eivätkä todista kokonaiselossaolon etua.
      - type: p
        text: >-
          Tumor Board -näkökulma, ilman todellista ajoa: täysin kuvitteellisen 55-vuotiaan, jolla olisi leikattavissa oleva vaiheen III suuontelon syöpä, keskusteluluonnoksessa tarkistettaisiin patologia, tarkka vaihe ja leikattavuus sekä erotettaisiin tapahtumaton elossaolo haittojen ja puuttuvien vertailujen kysymyksistä. Tarkistetut OpenOncon pään ja kaulan syövän tietueet koskevat uusiutunutta tai etäpesäkkeistä tautia, eivät tätä leikkauksen aikaista tilannetta; väite luodusta hoitopolusta olisi harhaanjohtava. [OpenOnco Tumor Board](/fi/ask.html) laatii luonnoksia. Lähteet tarkistettu 14. marraskuuta 2026. Tämä ei ole yksilöllinen hoitosuunnitelma eikä korvaa lääkäriä.
