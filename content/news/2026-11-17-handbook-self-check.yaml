kind: project
series: openonco-three-day
series_format: platform
author: OpenOnco
tags: [platform, handbook, practice-questions, sources]
title:
  en: 'A question, an explanation, a source: try the Handbook self-check'
  uk: 'Запитання, пояснення, джерело: спробуйте самоперевірку в Довіднику'
summary:
  en: 'OpenOnco Handbook practice questions show feedback, reasoning and source IDs. A fictional learner can check a topic without sending answers to a server.'
  uk: 'Запитання в Довіднику OpenOnco показують відповідь, пояснення й ідентифікатори джерел. Вигаданий читач може перевірити тему без надсилання відповідей на сервер.'
sources:
  - citation: 'OpenOnco. Handbook index and practice questions. Live checked 17 November 2026.'
    id: https://openonco.info/handbook.html
  - citation: 'OpenOnco. Diffuse large B-cell lymphoma learning chapter and three practice questions. Live checked 17 November 2026.'
    id: https://openonco.info/handbook/hb-dlbcl-1l.html
  - citation: 'OpenOnco. Handbook page builder and browser-session quiz implementation, version checked 17 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/025e33f8b2/scripts/build_handbook.py
body:
  en:
    - type: p
      text: >-
        The [OpenOnco Handbook](/handbook.html) contains nine learning chapters and 27 practice questions. Each chapter connects a topic to source IDs, examples and a short self-check. In the [DLBCL chapter](/handbook/hb-dlbcl-1l.html), three questions ask the reader to inspect the chapter's reasoning. After an answer is submitted, the page shows whether it matches the stored key, an explanation and the cited source IDs. The score can be reset.
    - type: p
      text: >-
        Imagine a fictional learner reviewing the DLBCL chapter. They select an answer to a question about missing baseline information, submit it, read the explanation and note the listed source IDs. They can then try another question. This is a way to find what to read next, **not** a test of clinical competence or a recommendation for a real patient. The page keeps answers and score in the browser session; closing the tab clears them. It does not send quiz answers to a server.
    - type: p
      text: >-
        The Handbook is OpenOnco-authored educational material, not official ESMO content and not a CME activity. Clinical review remains pending. Translated chapter pages are drafts and need medical-language review; the English source remains available. Feature, source code and live pages checked 17 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        [Довідник OpenOnco](/ukr/handbook.html) містить дев’ять навчальних розділів і 27 запитань для самоперевірки. Кожен розділ поєднує тему з ідентифікаторами джерел, прикладами й короткою перевіркою знань. У [розділі про ДВКЛ](/ukr/handbook/hb-dlbcl-1l.html) три запитання пропонують перевірити логіку матеріалу. Після надсилання відповіді сторінка показує, чи збігається вона зі збереженим ключем, пояснення та ідентифікатори джерел. Результат можна скинути.
    - type: p
      text: >-
        Уявімо вигаданого читача, який вивчає розділ про ДВКЛ. Він обирає відповідь на запитання про відсутні вихідні дані, надсилає її, читає пояснення й занотовує наведені ідентифікатори джерел. Потім може спробувати інше запитання. Це спосіб зрозуміти, що читати далі, **а не** перевірка клінічної компетентності чи порада для реального пацієнта. Відповіді й результат зберігаються в сеансі браузера; закриття вкладки їх очищує. Відповіді не надсилаються на сервер.
    - type: p
      text: >-
        Довідник є навчальним матеріалом OpenOnco, а не офіційним матеріалом ESMO чи курсом із кредитами CME. Клінічне рецензування ще не завершене. Перекладені сторінки розділів є чернетками й потребують перевірки медичної мови; англійський оригінал доступний. Функцію, код і живі сторінки перевірено 17 листопада 2026 року. Ця стаття не замінює лікаря.
translations:
  es:
    title: 'Una pregunta, una explicación, una fuente: pruebe la autoevaluación del Manual'
    summary: 'Las preguntas del Manual de OpenOnco muestran comentarios, razonamiento e identificadores de fuentes. Un lector ficticio puede repasar un tema sin enviar respuestas al servidor.'
    body:
      - type: p
        text: >-
          El [Manual de OpenOnco](/es/handbook.html) contiene nueve capítulos formativos y 27 preguntas de práctica. Cada capítulo vincula un tema con identificadores de fuentes, ejemplos y una breve autoevaluación. En el [capítulo sobre LBDCG](/es/handbook/hb-dlbcl-1l.html), tres preguntas invitan a examinar el razonamiento del texto. Al enviar una respuesta, la página indica si coincide con la clave guardada, ofrece una explicación y muestra los identificadores de las fuentes citadas. La puntuación se puede reiniciar.
      - type: p
        text: >-
          Imagine a una persona ficticia que estudia el capítulo sobre LBDCG. Elige una respuesta a una pregunta sobre datos iniciales ausentes, la envía, lee la explicación y anota los identificadores de fuentes indicados. Después puede intentar otra pregunta. Sirve para descubrir qué leer a continuación, **no** para acreditar competencia clínica ni recomendar nada a un paciente real. Las respuestas y la puntuación permanecen en la sesión del navegador; se borran al cerrar la pestaña. No se envían al servidor.
      - type: p
        text: >-
          El Manual es material educativo elaborado por OpenOnco; no es contenido oficial de ESMO ni una actividad con créditos CME. La revisión clínica sigue pendiente. Las páginas traducidas son borradores que requieren revisión del lenguaje médico; el original inglés sigue disponible. Función, código y páginas públicas comprobados el 17 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Uma pergunta, uma explicação, uma fonte: experimente a autoavaliação do Manual'
    summary: 'As perguntas do Manual OpenOnco mostram comentários, raciocínio e identificadores das fontes. Um leitor fictício pode rever um tema sem enviar respostas ao servidor.'
    body:
      - type: p
        text: >-
          O [Manual OpenOnco](/pt/handbook.html) contém nove capítulos de aprendizagem e 27 perguntas de prática. Cada capítulo liga um tema a identificadores de fontes, exemplos e uma breve autoavaliação. No [capítulo sobre LDGCB](/pt/handbook/hb-dlbcl-1l.html), três perguntas convidam a examinar o raciocínio apresentado. Depois de enviar uma resposta, a página indica se coincide com a chave guardada, apresenta uma explicação e mostra os identificadores das fontes citadas. A pontuação pode ser reposta.
      - type: p
        text: >-
          Imagine um leitor fictício a estudar o capítulo sobre LDGCB. Escolhe uma resposta a uma pergunta sobre dados iniciais em falta, envia-a, lê a explicação e anota os identificadores das fontes indicados. Depois pode tentar outra pergunta. Isto ajuda a encontrar o que ler a seguir, **não** certifica competência clínica nem recomenda cuidados para uma pessoa real. As respostas e a pontuação ficam na sessão do navegador; desaparecem ao fechar o separador. Não são enviadas ao servidor.
      - type: p
        text: >-
          O Manual é material educativo da OpenOnco, não conteúdo oficial da ESMO nem uma atividade com créditos CME. A revisão clínica continua pendente. As páginas traduzidas são rascunhos que precisam de revisão da linguagem médica; o original inglês permanece disponível. Funcionalidade, código e páginas públicas verificados em 17 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Eine Frage, eine Erklärung, eine Quelle: Selbsttest im Handbuch'
    summary: 'Die Übungsfragen im OpenOnco-Handbuch zeigen Rückmeldung, Begründung und Quellenkennungen. Ein fiktiver Lernender kann ein Thema prüfen, ohne Antworten an einen Server zu senden.'
    body:
      - type: p
        text: >-
          Das [OpenOnco-Handbuch](/de/handbook.html) umfasst neun Lernkapitel und 27 Übungsfragen. Jedes Kapitel verbindet ein Thema mit Quellenkennungen, Beispielen und einem kurzen Selbsttest. Im [DLBCL-Kapitel](/de/handbook/hb-dlbcl-1l.html) regen drei Fragen dazu an, die Begründungen des Textes nachzuvollziehen. Nach dem Absenden zeigt die Seite, ob die Antwort mit dem gespeicherten Lösungsschlüssel übereinstimmt, dazu eine Erklärung und die Kennungen der zitierten Quellen. Der Punktestand lässt sich zurücksetzen.
      - type: p
        text: >-
          Stellen Sie sich eine erfundene Person vor, die das DLBCL-Kapitel liest. Sie beantwortet eine Frage zu fehlenden Ausgangsdaten, liest die Erklärung und notiert die angegebenen Quellenkennungen. Danach kann sie eine weitere Frage versuchen. Das hilft bei der Suche nach weiterführender Lektüre; es ist **kein** Nachweis klinischer Kompetenz und keine Empfehlung für einen realen Patienten. Antworten und Punktestand bleiben in der Browsersitzung und werden beim Schließen des Tabs gelöscht. Sie werden nicht an einen Server gesendet.
      - type: p
        text: >-
          Das Handbuch ist von OpenOnco erstelltes Lernmaterial, weder offizieller ESMO-Inhalt noch eine CME-Fortbildung. Die klinische Prüfung steht noch aus. Übersetzte Kapitelseiten sind Entwürfe und benötigen eine fachsprachliche Prüfung; das englische Original bleibt zugänglich. Funktion, Quellcode und öffentliche Seiten am 17. November 2026 geprüft. Dieser Artikel ersetzt keine ärztliche Beratung.
  fr:
    title: 'Une question, une explication, une source : essayez l’autoévaluation du Manuel'
    summary: 'Les questions du Manuel OpenOnco affichent un retour, un raisonnement et des identifiants de sources. Un lecteur fictif peut réviser un sujet sans envoyer ses réponses au serveur.'
    body:
      - type: p
        text: >-
          Le [Manuel OpenOnco](/fr/handbook.html) comprend neuf chapitres pédagogiques et 27 questions d’entraînement. Chaque chapitre relie un thème à des identifiants de sources, des exemples et une brève autoévaluation. Dans le [chapitre sur le LDGCB](/fr/handbook/hb-dlbcl-1l.html), trois questions invitent à examiner le raisonnement présenté. Après l’envoi d’une réponse, la page indique si elle correspond au corrigé enregistré, puis affiche une explication et les identifiants des sources citées. Le score peut être réinitialisé.
      - type: p
        text: >-
          Imaginez une personne fictive qui lit le chapitre sur le LDGCB. Elle répond à une question sur des données initiales manquantes, lit l’explication et note les identifiants des sources indiquées. Elle peut ensuite tenter une autre question. Cela aide à repérer ce qu’il faut lire ensuite; ce n’est **ni** une preuve de compétence clinique ni une recommandation pour un patient réel. Les réponses et le score restent dans la session du navigateur et disparaissent à la fermeture de l’onglet. Ils ne sont pas envoyés au serveur.
      - type: p
        text: >-
          Le Manuel est un support pédagogique rédigé par OpenOnco, ni un contenu officiel de l’ESMO ni une formation donnant des crédits CME. La révision clinique reste à faire. Les pages traduites sont des brouillons qui nécessitent une vérification de la terminologie médicale; l’original anglais reste disponible. Fonction, code et pages publiques vérifiés le 17 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Una domanda, una spiegazione, una fonte: prova l’autoverifica del Manuale'
    summary: 'Le domande del Manuale OpenOnco mostrano riscontro, ragionamento e identificativi delle fonti. Un lettore immaginario può ripassare un tema senza inviare risposte al server.'
    body:
      - type: p
        text: >-
          Il [Manuale OpenOnco](/it/handbook.html) contiene nove capitoli didattici e 27 domande di esercitazione. Ogni capitolo collega un argomento a identificativi delle fonti, esempi e una breve autoverifica. Nel [capitolo sul DLBCL](/it/handbook/hb-dlbcl-1l.html), tre domande invitano a esaminare il ragionamento del testo. Dopo l’invio di una risposta, la pagina mostra se coincide con la chiave memorizzata, una spiegazione e gli identificativi delle fonti citate. Il punteggio può essere azzerato.
      - type: p
        text: >-
          Immagina una persona fittizia che legge il capitolo sul DLBCL. Sceglie una risposta a una domanda sui dati iniziali mancanti, la invia, legge la spiegazione e annota gli identificativi delle fonti indicate. Poi può provare un’altra domanda. Serve a capire cosa leggere dopo, **non** a certificare competenza clinica o a raccomandare cure per un paziente reale. Risposte e punteggio restano nella sessione del browser e scompaiono quando si chiude la scheda. Non vengono inviati a un server.
      - type: p
        text: >-
          Il Manuale è materiale didattico redatto da OpenOnco, non contenuto ufficiale ESMO né un’attività che assegna crediti CME. La revisione clinica è ancora in sospeso. Le pagine tradotte sono bozze che richiedono una verifica del linguaggio medico; l’originale inglese resta disponibile. Funzione, codice e pagine pubbliche verificati il 17 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'Et spørgsmål, en forklaring, en kilde: prøv håndbogens selvtest'
    summary: 'Øvelsesspørgsmålene i OpenOnco-håndbogen viser feedback, begrundelse og kilde-id’er. En opdigtet læser kan gennemgå et emne uden at sende svar til en server.'
    body:
      - type: p
        text: >-
          [OpenOnco-håndbogen](/da/handbook.html) har ni læringskapitler og 27 øvelsesspørgsmål. Hvert kapitel knytter et emne til kilde-id’er, eksempler og en kort selvtest. I [DLBCL-kapitlet](/da/handbook/hb-dlbcl-1l.html) lægger tre spørgsmål op til at undersøge tekstens begrundelser. Når et svar indsendes, viser siden, om det svarer til den gemte facitliste, sammen med en forklaring og id’er for de citerede kilder. Scoren kan nulstilles.
      - type: p
        text: >-
          Forestil dig en opdigtet læser af DLBCL-kapitlet. Læseren vælger et svar på et spørgsmål om manglende udgangsoplysninger, indsender det, læser forklaringen og noterer de angivne kilde-id’er. Derefter kan læseren prøve et andet spørgsmål. Det hjælper med at finde ud af, hvad man kan læse videre om; det er **ikke** et bevis på klinisk kompetence eller et råd til en virkelig patient. Svar og score bliver i browsersessionen og slettes, når fanen lukkes. De sendes ikke til en server.
      - type: p
        text: >-
          Håndbogen er undervisningsmateriale skrevet af OpenOnco, ikke officielt ESMO-indhold eller en aktivitet med CME-point. Klinisk gennemgang afventer. Oversatte kapitler er udkast, som kræver kontrol af den medicinske terminologi; den engelske original er tilgængelig. Funktion, kildekode og offentlige sider kontrolleret 17. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'En fråga, en förklaring, en källa: prova handbokens självtest'
    summary: 'Övningsfrågorna i OpenOncos handbok visar återkoppling, resonemang och käll-id. En påhittad läsare kan gå igenom ett ämne utan att skicka svar till en server.'
    body:
      - type: p
        text: >-
          [OpenOncos handbok](/sv/handbook.html) innehåller nio utbildningskapitel och 27 övningsfrågor. Varje kapitel knyter ett ämne till käll-id, exempel och ett kort självtest. I [DLBCL-kapitlet](/sv/handbook/hb-dlbcl-1l.html) uppmanar tre frågor läsaren att granska textens resonemang. När ett svar skickas in visar sidan om det stämmer med den sparade facitnyckeln, en förklaring och id för de angivna källorna. Poängen kan nollställas.
      - type: p
        text: >-
          Föreställ dig en påhittad läsare som går igenom DLBCL-kapitlet. Läsaren väljer ett svar på en fråga om saknade utgångsuppgifter, skickar in det, läser förklaringen och antecknar de angivna käll-id-numren. Sedan går det att prova en annan fråga. Det hjälper läsaren att hitta vad som behöver läsas vidare; det är **inte** ett bevis på klinisk kompetens eller ett råd till en verklig patient. Svar och poäng stannar i webbläsarsessionen och rensas när fliken stängs. De skickas inte till en server.
      - type: p
        text: >-
          Handboken är utbildningsmaterial skrivet av OpenOnco, inte officiellt ESMO-material eller en aktivitet med CME-poäng. Klinisk granskning återstår. Översatta kapitel är utkast och behöver medicinsk språkgranskning; det engelska originalet finns kvar. Funktion, källkod och publika sidor kontrollerade den 17 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Et spørsmål, en forklaring, en kilde: prøv håndbokens selvtest'
    summary: 'Øvingsspørsmålene i OpenOnco-håndboken viser tilbakemelding, begrunnelse og kilde-ID-er. En oppdiktet leser kan gå gjennom et tema uten å sende svar til en server.'
    body:
      - type: p
        text: >-
          [OpenOnco-håndboken](/nb/handbook.html) har ni læringskapitler og 27 øvingsspørsmål. Hvert kapittel knytter et tema til kilde-ID-er, eksempler og en kort selvtest. I [DLBCL-kapitlet](/nb/handbook/hb-dlbcl-1l.html) ber tre spørsmål leseren undersøke begrunnelsene i teksten. Etter at et svar er sendt inn, viser siden om det stemmer med den lagrede fasiten, en forklaring og ID-ene til kildene som er oppgitt. Poengsummen kan nullstilles.
      - type: p
        text: >-
          Tenk deg en oppdiktet leser som studerer DLBCL-kapitlet. Leseren velger et svar på et spørsmål om manglende grunnlagsopplysninger, sender det inn, leser forklaringen og noterer de oppgitte kilde-ID-ene. Deretter kan leseren prøve et annet spørsmål. Dette hjelper med å finne hva man bør lese videre om; det er **ikke** dokumentasjon på klinisk kompetanse eller et råd til en virkelig pasient. Svar og poengsum blir i nettleserøkten og slettes når fanen lukkes. De sendes ikke til en server.
      - type: p
        text: >-
          Håndboken er undervisningsmateriell skrevet av OpenOnco, ikke offisielt ESMO-innhold eller en aktivitet med CME-poeng. Klinisk gjennomgang gjenstår. Oversatte kapittelsider er utkast som trenger kontroll av medisinsk språk; den engelske originalen er tilgjengelig. Funksjon, kildekode og offentlige sider kontrollert 17. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Kysymys, selitys, lähde: kokeile käsikirjan itsearviointia'
    summary: 'OpenOncon käsikirjan harjoituskysymykset näyttävät palautteen, perustelut ja lähdetunnukset. Kuvitteellinen lukija voi kerrata aihetta lähettämättä vastauksia palvelimelle.'
    body:
      - type: p
        text: >-
          [OpenOncon käsikirjassa](/fi/handbook.html) on yhdeksän oppimislukua ja 27 harjoituskysymystä. Kukin luku yhdistää aiheen lähdetunnuksiin, esimerkkeihin ja lyhyeen itsearviointiin. [DLBCL-luvussa](/fi/handbook/hb-dlbcl-1l.html) kolme kysymystä ohjaa tarkastelemaan tekstin perusteluja. Vastauksen lähettämisen jälkeen sivu kertoo, vastaako se tallennettua vastausavainta, ja näyttää selityksen sekä viitattujen lähteiden tunnukset. Pistemäärän voi nollata.
      - type: p
        text: >-
          Kuvitellaan lukija, joka käy läpi DLBCL-lukua. Hän valitsee vastauksen puuttuvia lähtötietoja koskevaan kysymykseen, lähettää sen, lukee selityksen ja merkitsee muistiin mainitut lähdetunnukset. Sen jälkeen hän voi kokeilla toista kysymystä. Tämä auttaa löytämään seuraavaa luettavaa; se **ei** todista kliinistä pätevyyttä eikä anna ohjetta oikean potilaan hoitoon. Vastaukset ja pistemäärä säilyvät selaimen istunnossa ja poistuvat, kun välilehti suljetaan. Niitä ei lähetetä palvelimelle.
      - type: p
        text: >-
          Käsikirja on OpenOncon laatimaa oppimateriaalia, ei virallista ESMO-sisältöä eikä CME-pisteitä tuottavaa koulutusta. Kliininen arviointi on kesken. Käännetyt lukusivut ovat luonnoksia ja tarvitsevat lääketieteellisen kielentarkistuksen; englanninkielinen alkuperäinen teksti on saatavilla. Toiminto, lähdekoodi ja julkiset sivut tarkistettu 17. marraskuuta 2026. Tämä artikkeli ei korvaa lääkäriä.
