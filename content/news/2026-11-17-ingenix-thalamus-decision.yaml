body:
  en:
    - type: p
      text: >-
        On 17 November 2026, Polish startup Ingenix announced benchmark results for **Thalamus Decision**, a model that reads bulk and single-cell RNA-seq data for research tasks such as cell typing and cell-line drug-response prediction. Ingenix reports 84–89% on two GDSC cell-line response tasks. For its 9B model, it reports handling 62.6% of benchmark decisions at a target error rate of 5%, while the observed error rate was 6.3%. These are company-reported benchmark figures, not independently established clinical performance or patient outcomes. A cell line is not a patient.
    - type: p
      text: >-
        Ingenix says it plans to release the 9B model as open source on **18 November**. As checked on the 17th, that is a future release, with no published licence or downloadable model identified in the announcement. Its broader Biological Reasoning Engine is offered through a limited partner program: the company operates it on partner data and returns research hypotheses with reasoning traces. Public pricing is not listed. Related component preprints on its evidence page do not independently verify these new Thalamus Decision figures.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) already publishes MIT-licensed code, inspectable rules and cited sources free to readers. It uses entered, structured case details to draft material for clinician review; it does **not** analyse RNA-seq matrices, prioritize drug candidates or claim clinically validated treatment decisions. Ingenix addresses drug-development research, while OpenOnco supports reviewable oncology knowledge workflows. There is no head-to-head outcome study. Sources checked 17 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        17 листопада 2026 року польський стартап Ingenix оголосив результати тестів **Thalamus Decision** — моделі, яка аналізує дані секвенування РНК масових зразків і окремих клітин для дослідницьких завдань, зокрема визначення типу клітин і прогнозування відповіді клітинних ліній на препарати. Ingenix повідомляє результат 84–89% у двох завданнях GDSC щодо клітинних ліній. Для моделі 9B компанія заявляє обробку 62,6% тестових рішень за цільової частоти помилок 5%; фактично спостережена частота становила 6,3%. Це повідомлені компанією результати тестів, а не незалежно встановлена клінічна ефективність чи результати пацієнтів. Клітинна лінія — не пацієнт.
    - type: p
      text: >-
        Ingenix планує відкрити код моделі 9B **18 листопада**. Станом на 17 листопада це майбутній реліз: в оголошенні немає опублікованої ліцензії чи посилання для завантаження моделі. Ширший продукт Biological Reasoning Engine доступний через обмежену партнерську програму: компанія запускає його на даних партнера й повертає дослідницькі гіпотези з поясненням логіки. Публічної ціни немає. Препринти про окремі компоненти на сторінці доказів не є незалежною перевіркою нових цифр Thalamus Decision.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) уже безкоштовно публікує код під ліцензією MIT, доступні для перевірки правила й посилання на джерела. Він використовує введені структуровані дані випадку для чернетки, яку має перевірити лікар; він **не** аналізує матриці RNA-seq, не визначає пріоритетність кандидатів на ліки й не заявляє про клінічно валідовані лікувальні рішення. Ingenix працює з дослідженнями розробки ліків, OpenOnco — з перевірюваними онкологічними знаннями. Прямого дослідження клінічних результатів цих інструментів немає. Джерела перевірено 17 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Ingenix comunica resultados con RNA-seq; la publicación abierta aún está pendiente'
    summary: 'Thalamus Decision aborda decisiones de investigación con datos de expresión génica. Las cifras proceden de la empresa y el modelo abierto previsto aún no es una herramienta clínica publicada.'
    body:
      - type: p
        text: >-
          El 17 de noviembre de 2026, la empresa polaca Ingenix anunció resultados de pruebas de **Thalamus Decision**, un modelo que lee datos de RNA-seq de muestras globales y de células individuales para tareas de investigación, como clasificar células y predecir la respuesta farmacológica de líneas celulares. Ingenix comunica un 84–89% en dos tareas de respuesta de líneas celulares GDSC. Para el modelo 9B afirma resolver el 62,6% de las decisiones de prueba con una tasa de error objetivo del 5%, pero la observada fue del 6,3%. Son cifras comunicadas por la empresa, no rendimiento clínico validado de forma independiente ni resultados en pacientes. Una línea celular no es un paciente.
      - type: p
        text: >-
          Ingenix prevé publicar el modelo 9B como código abierto el **18 de noviembre**. A fecha del 17, sigue siendo un lanzamiento futuro: el anuncio no identifica una licencia publicada ni un modelo descargable. Su Biological Reasoning Engine más amplio se ofrece mediante un programa limitado para socios: la empresa lo ejecuta con datos del socio y entrega hipótesis de investigación con trazas del razonamiento. No publica el precio. Los preprints sobre componentes vinculados en su página de evidencia no verifican independientemente estas nuevas cifras de Thalamus Decision.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) ya ofrece gratis código con licencia MIT, reglas examinables y fuentes citadas. Usa datos estructurados introducidos sobre un caso para preparar borradores que debe revisar un profesional; **no** analiza matrices RNA-seq, prioriza candidatos farmacológicos ni afirma producir decisiones terapéuticas validadas clínicamente. Ingenix se centra en investigación para desarrollar fármacos; OpenOnco, en flujos de conocimiento oncológico verificables. No hay un estudio comparativo directo de resultados. Fuentes comprobadas el 17 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Ingenix divulga resultados com RNA-seq; o lançamento aberto ainda está por vir'
    summary: 'O Thalamus Decision trata decisões de investigação a partir de expressão génica. Os números são da empresa, e o modelo aberto planeado ainda não é uma ferramenta clínica publicada.'
    body:
      - type: p
        text: >-
          Em 17 de novembro de 2026, a startup polaca Ingenix anunciou resultados de testes do **Thalamus Decision**, um modelo que lê dados de RNA-seq de amostras em massa e de células individuais para tarefas de investigação, como identificar tipos celulares e prever a resposta de linhas celulares a fármacos. A Ingenix comunica 84–89% em duas tarefas GDSC de resposta de linhas celulares. Para o modelo 9B, afirma resolver 62,6% das decisões do teste com uma taxa de erro alvo de 5%, mas a observada foi de 6,3%. São números comunicados pela empresa, não desempenho clínico verificado de forma independente nem resultados em doentes. Uma linha celular não é um doente.
      - type: p
        text: >-
          A Ingenix planeia lançar o modelo 9B como código aberto em **18 de novembro**. No dia 17, isso ainda é futuro: o anúncio não identifica uma licença publicada nem um modelo disponível para descarregar. O seu Biological Reasoning Engine mais amplo é oferecido por um programa limitado de parceria: a empresa executa-o nos dados do parceiro e devolve hipóteses de investigação com o percurso do raciocínio. Não há preço público. Os preprints de componentes associados na página de evidência não verificam independentemente estes novos números do Thalamus Decision.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) já disponibiliza gratuitamente código com licença MIT, regras inspecionáveis e fontes citadas. Usa dados estruturados introduzidos sobre um caso para criar rascunhos sujeitos a revisão clínica; **não** analisa matrizes RNA-seq, prioriza candidatos a fármacos nem reivindica decisões terapêuticas clinicamente validadas. A Ingenix trabalha em investigação para desenvolver medicamentos; o OpenOnco apoia fluxos verificáveis de conhecimento oncológico. Não existe estudo comparativo direto de resultados. Fontes verificadas em 17 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Ingenix meldet RNA-seq-Benchmarks; die offene Veröffentlichung steht noch aus'
    summary: 'Thalamus Decision zielt auf Forschungsentscheidungen anhand von Genexpressionsdaten. Die Zahlen stammen vom Unternehmen; das geplante offene Modell ist noch kein veröffentlichtes klinisches Werkzeug.'
    body:
      - type: p
        text: >-
          Am 17. November 2026 meldete das polnische Startup Ingenix Testergebnisse für **Thalamus Decision**. Das Modell verarbeitet Bulk- und Einzelzell-RNA-seq-Daten für Forschungsaufgaben wie Zelltypbestimmung und Vorhersage der Medikamentenreaktion von Zelllinien. Ingenix nennt 84–89 % für zwei GDSC-Aufgaben zur Zelllinienreaktion. Das 9B-Modell soll 62,6 % der Testentscheidungen bei einer angestrebten Fehlerrate von 5 % bearbeitet haben; beobachtet wurden jedoch 6,3 %. Das sind vom Unternehmen gemeldete Benchmarkwerte, keine unabhängig bestätigte klinische Leistung oder Patientenergebnisse. Eine Zelllinie ist kein Patient.
      - type: p
        text: >-
          Ingenix plant, das 9B-Modell am **18. November** als Open Source zu veröffentlichen. Am 17. ist dies noch eine Ankündigung: Eine veröffentlichte Lizenz oder ein herunterladbares Modell werden darin nicht genannt. Die umfassendere Biological Reasoning Engine bietet das Unternehmen in einem begrenzten Partnerprogramm an: Es betreibt sie mit Partnerdaten und liefert Forschungshypothesen samt nachvollziehbarer Begründung. Ein öffentlicher Preis fehlt. Die verlinkten Preprints zu Komponenten belegen diese neuen Thalamus-Decision-Zahlen nicht unabhängig.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) stellt bereits kostenlos MIT-lizenzierten Code, einsehbare Regeln und Quellenangaben bereit. Aus eingegebenen strukturierten Falldaten erstellt es Entwürfe zur ärztlichen Prüfung; es analysiert **keine** RNA-seq-Matrizen, priorisiert keine Wirkstoffkandidaten und beansprucht keine klinisch validierten Therapieentscheidungen. Ingenix richtet sich an die Wirkstoffforschung, OpenOnco an überprüfbare onkologische Wissensabläufe. Eine direkte Vergleichsstudie zu Ergebnissen gibt es nicht. Quellen geprüft am 17. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Ingenix annonce des résultats RNA-seq ; la publication ouverte reste à venir'
    summary: 'Thalamus Decision vise des décisions de recherche à partir de données d’expression génique. Les chiffres viennent de l’entreprise et le modèle ouvert annoncé n’est pas encore un outil clinique publié.'
    body:
      - type: p
        text: >-
          Le 17 novembre 2026, la jeune entreprise polonaise Ingenix a annoncé des résultats de tests pour **Thalamus Decision**, un modèle qui lit des données RNA-seq globales et unicellulaires pour des tâches de recherche, comme identifier des types cellulaires et prédire la réponse de lignées cellulaires aux médicaments. Ingenix rapporte 84–89 % sur deux tâches GDSC concernant ces lignées. Pour son modèle 9B, elle dit traiter 62,6 % des décisions du test avec un taux d’erreur cible de 5 %, alors que le taux observé était de 6,3 %. Ce sont des chiffres communiqués par l’entreprise, pas une performance clinique confirmée indépendamment ni des résultats chez les patients. Une lignée cellulaire n’est pas un patient.
      - type: p
        text: >-
          Ingenix prévoit de publier le modèle 9B en logiciel libre le **18 novembre**. Le 17, cette publication reste future : l’annonce ne donne ni licence publiée ni modèle téléchargeable. Son Biological Reasoning Engine plus large est proposé via un programme restreint de partenariat : l’entreprise l’exécute sur les données du partenaire et fournit des hypothèses de recherche avec la trace du raisonnement. Aucun tarif public n’est indiqué. Les prépublications sur des composants liées depuis sa page de preuves ne vérifient pas indépendamment ces nouveaux chiffres de Thalamus Decision.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) publie déjà gratuitement du code sous licence MIT, des règles inspectables et des sources citées. Il utilise des données structurées saisies pour préparer des brouillons à faire vérifier par un clinicien ; il **n’analyse pas** les matrices RNA-seq, ne classe pas des candidats médicaments et ne prétend pas produire des décisions thérapeutiques validées cliniquement. Ingenix vise la recherche de médicaments ; OpenOnco, des parcours de connaissances oncologiques vérifiables. Aucune étude comparative directe des résultats n’est disponible. Sources vérifiées le 17 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Ingenix comunica benchmark RNA-seq; il rilascio aperto deve ancora arrivare'
    summary: 'Thalamus Decision affronta decisioni di ricerca su dati di espressione genica. I risultati sono dichiarati dall’azienda e il modello aperto previsto non è ancora uno strumento clinico pubblicato.'
    body:
      - type: p
        text: >-
          Il 17 novembre 2026 la startup polacca Ingenix ha annunciato risultati di test per **Thalamus Decision**, un modello che legge dati RNA-seq bulk e a singola cellula per attività di ricerca, tra cui classificare cellule e prevedere la risposta ai farmaci di linee cellulari. Ingenix riporta l’84–89% in due compiti GDSC sulle linee cellulari. Per il modello 9B dichiara di gestire il 62,6% delle decisioni del test con un tasso di errore obiettivo del 5%, mentre quello osservato è stato del 6,3%. Sono risultati comunicati dall’azienda, non prestazioni cliniche verificate indipendentemente né esiti dei pazienti. Una linea cellulare non è un paziente.
      - type: p
        text: >-
          Ingenix prevede di pubblicare il modello 9B come open source il **18 novembre**. Al 17 si tratta ancora di un rilascio futuro: l’annuncio non indica una licenza pubblicata o un modello scaricabile. Il più ampio Biological Reasoning Engine è offerto tramite un programma limitato per partner: l’azienda lo esegue sui dati del partner e restituisce ipotesi di ricerca con tracce del ragionamento. Il prezzo non è pubblico. I preprint relativi a componenti, collegati nella pagina delle evidenze, non verificano indipendentemente questi nuovi numeri di Thalamus Decision.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) pubblica già gratuitamente codice con licenza MIT, regole ispezionabili e fonti citate. Usa dati strutturati inseriti per redigere bozze da sottoporre a un medico; **non** analizza matrici RNA-seq, ordina candidati farmaci o rivendica decisioni terapeutiche validate clinicamente. Ingenix si occupa di ricerca per lo sviluppo di farmaci, OpenOnco di flussi verificabili di conoscenza oncologica. Non esiste uno studio comparativo diretto sugli esiti. Fonti controllate il 17 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'Ingenix oplyser RNA-seq-resultater; den åbne udgivelse ligger endnu foran os'
    summary: 'Thalamus Decision retter sig mod forskningsbeslutninger ud fra genekspressionsdata. Tallene stammer fra virksomheden, og den planlagte åbne model er endnu ikke et udgivet klinisk værktøj.'
    body:
      - type: p
        text: >-
          Den 17. november 2026 offentliggjorde den polske startup Ingenix testresultater for **Thalamus Decision**, en model, der læser bulk- og enkeltcelle-RNA-seq-data til forskningsopgaver som celleklassifikation og forudsigelse af cellelinjers lægemiddelrespons. Ingenix angiver 84–89 % for to GDSC-opgaver om cellelinjer. For 9B-modellen hævder virksomheden at håndtere 62,6 % af testbeslutningerne ved en tilsigtet fejlrate på 5 %, mens den observerede fejlrate var 6,3 %. Tallene er rapporteret af virksomheden; de er ikke uafhængigt fastslået klinisk ydeevne eller patientresultater. En cellelinje er ikke en patient.
      - type: p
        text: >-
          Ingenix planlægger at udgive 9B-modellen som open source den **18. november**. Den 17. er det stadig en fremtidig udgivelse: Meddelelsen angiver hverken en offentliggjort licens eller en model til download. Den bredere Biological Reasoning Engine tilbydes gennem et begrænset partnerprogram: Virksomheden kører den på partnerens data og leverer forskningshypoteser med sporbare begrundelser. Der er ingen offentlig pris. Præpublikationer om tilknyttede komponenter på evidenssiden verificerer ikke disse nye Thalamus Decision-tal uafhængigt.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) stiller allerede MIT-licenseret kode, gennemskuelige regler og kildehenvisninger gratis til rådighed. Det bruger indtastede, strukturerede sagsoplysninger til udkast, som en kliniker skal gennemgå; det analyserer **ikke** RNA-seq-matricer, prioriterer ikke lægemiddelkandidater og hævder ikke at levere klinisk validerede behandlingsbeslutninger. Ingenix arbejder med lægemiddelforskning, OpenOnco med efterprøvelige arbejdsgange for onkologisk viden. Ingen direkte sammenlignende resultatundersøgelse foreligger. Kilder kontrolleret 17. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Ingenix redovisar RNA-seq-tester; en öppen lansering återstår'
    summary: 'Thalamus Decision riktar sig till forskningsbeslut utifrån genuttrycksdata. Siffrorna kommer från företaget och den planerade öppna modellen är ännu inget publicerat kliniskt verktyg.'
    body:
      - type: p
        text: >-
          Den 17 november 2026 presenterade det polska startupbolaget Ingenix testresultat för **Thalamus Decision**, en modell som läser bulk- och encells-RNA-seq-data för forskningsuppgifter som celltypning och prognoser för cellinjers läkemedelsrespons. Ingenix uppger 84–89 % i två GDSC-uppgifter om cellinjer. För 9B-modellen hävdar företaget att den hanterar 62,6 % av testbesluten vid en målfelfrekvens på 5 %, medan den uppmätta felfrekvensen var 6,3 %. Det är företagsrapporterade testvärden, inte oberoende fastställd klinisk prestanda eller patientresultat. En cellinje är inte en patient.
      - type: p
        text: >-
          Ingenix planerar att ge ut 9B-modellen som öppen källkod den **18 november**. Den 17 är det fortfarande en framtida lansering: meddelandet anger varken publicerad licens eller nedladdningsbar modell. Den bredare Biological Reasoning Engine erbjuds via ett begränsat partnerprogram: företaget kör den på partnerns data och levererar forskningshypoteser med spårbara resonemang. Inget offentligt pris anges. Preprint om relaterade komponenter på evidenssidan verifierar inte självständigt de nya siffrorna för Thalamus Decision.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) publicerar redan gratis MIT-licensierad kod, granskningsbara regler och källhänvisningar. Det använder inmatade, strukturerade falluppgifter till utkast för klinisk granskning; det analyserar **inte** RNA-seq-matriser, prioriterar inte läkemedelskandidater och gör inte anspråk på kliniskt validerade behandlingsbeslut. Ingenix riktar sig till läkemedelsforskning, OpenOnco till granskningsbara arbetsflöden för onkologisk kunskap. Ingen direkt jämförande utfallsstudie finns. Källor kontrollerade den 17 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Ingenix melder RNA-seq-resultater; en åpen utgivelse gjenstår'
    summary: 'Thalamus Decision retter seg mot forskningsbeslutninger basert på genuttrykksdata. Tallene kommer fra selskapet, og den planlagte åpne modellen er ennå ikke et publisert klinisk verktøy.'
    body:
      - type: p
        text: >-
          Den 17. november 2026 kunngjorde den polske oppstartsbedriften Ingenix testresultater for **Thalamus Decision**, en modell som leser bulk- og enkeltcelle-RNA-seq-data til forskningsoppgaver som celletypebestemmelse og prediksjon av cellelinjers legemiddelrespons. Ingenix oppgir 84–89 % på to GDSC-oppgaver om cellelinjer. For 9B-modellen hevder selskapet at den håndterer 62,6 % av testbeslutningene ved en målfeilrate på 5 %, mens den observerte feilraten var 6,3 %. Dette er tall rapportert av selskapet, ikke uavhengig fastslått klinisk ytelse eller pasientresultater. En cellelinje er ikke en pasient.
      - type: p
        text: >-
          Ingenix planlegger å gi ut 9B-modellen som åpen kildekode **18. november**. Den 17. er dette fortsatt en fremtidig utgivelse: kunngjøringen oppgir verken publisert lisens eller nedlastbar modell. Den bredere Biological Reasoning Engine tilbys via et begrenset partnerprogram: selskapet kjører den på partnerdata og leverer forskningshypoteser med sporbare begrunnelser. Offentlig pris er ikke oppgitt. Preprint om relaterte komponenter på evidenssiden verifiserer ikke uavhengig de nye Thalamus Decision-tallene.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) publiserer allerede MIT-lisensiert kode, inspiserbare regler og kildehenvisninger gratis. Det bruker innlagte, strukturerte saksopplysninger til utkast som en kliniker må gjennomgå; det analyserer **ikke** RNA-seq-matriser, prioriterer ikke legemiddelkandidater og hevder ikke å gi klinisk validerte behandlingsbeslutninger. Ingenix retter seg mot legemiddelforskning, OpenOnco mot etterprøvbare arbeidsflyter for onkologisk kunnskap. Det finnes ingen direkte sammenlignende utfallsstudie. Kilder kontrollert 17. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Ingenix kertoo RNA-seq-testituloksista; avoin julkaisu on vielä edessä'
    summary: 'Thalamus Decision tukee geeniekspressiodataan perustuvia tutkimuspäätöksiä. Luvut ovat yhtiön ilmoittamia, eikä suunniteltu avoin malli ole vielä julkaistu kliininen työkalu.'
    body:
      - type: p
        text: >-
          Puolalainen startup Ingenix julkisti 17. marraskuuta 2026 **Thalamus Decision** -mallin testituloksia. Malli käsittelee bulk- ja yksisoluisen RNA-seq:n dataa tutkimustehtävissä, kuten solutyyppien tunnistuksessa ja solulinjojen lääkevasteen ennustamisessa. Ingenix ilmoittaa 84–89 % kahdessa GDSC:n solulinjatehtävässä. Yhtiön mukaan 9B-malli käsittelee 62,6 % testipäätöksistä 5 %:n tavoitevirhetasolla, mutta havaittu virhetaso oli 6,3 %. Nämä ovat yhtiön raportoimia testilukuja, eivät riippumattomasti vahvistettua kliinistä suorituskykyä tai potilastuloksia. Solulinja ei ole potilas.
      - type: p
        text: >-
          Ingenix suunnittelee julkaisevansa 9B-mallin avoimena lähdekoodina **18. marraskuuta**. Päivänä 17. julkaisu oli vielä tulevaisuudessa: tiedote ei yksilöi julkaistua lisenssiä eikä ladattavaa mallia. Laajempi Biological Reasoning Engine on saatavilla rajatun kumppaniohjelman kautta: yhtiö käyttää sitä kumppanin datalla ja toimittaa tutkimushypoteeseja perusteluketjuineen. Julkista hintaa ei ilmoiteta. Näyttösivulla linkitetyt osia koskevat ennakkojulkaisut eivät varmista näitä uusia Thalamus Decision -lukuja riippumattomasti.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) julkaisee jo maksutta MIT-lisensoitua koodia, tarkastettavia sääntöjä ja lähdeviitteitä. Se käyttää syötettyjä rakenteisia tapaustietoja lääkärin tarkistettavien luonnosten laatimiseen; se **ei** analysoi RNA-seq-matriiseja, aseta lääkeaihioita etusijalle eikä väitä tuottavansa kliinisesti validoituja hoitopäätöksiä. Ingenix toimii lääkekehityksen tutkimuksessa, OpenOnco tarkastettavissa onkologian tietotyönkuluissa. Suoraa vertailevaa tulostutkimusta ei ole. Lähteet tarkistettu 17. marraskuuta 2026. Tämä artikkeli ei korvaa lääkäriä.
