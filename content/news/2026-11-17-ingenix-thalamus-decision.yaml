title:
  en: 'Ingenix reports RNA-seq benchmarks; an open release is still ahead'
  uk: 'Ingenix повідомляє результати тестів RNA-seq; відкритий реліз ще попереду'
summary:
  en: 'Thalamus Decision targets research decisions from gene-expression data. Its benchmark figures are company-reported, and the planned open model is not yet a released clinical tool.'
  uk: 'Thalamus Decision працює з експресією генів для дослідницьких рішень. Результати тестів повідомила компанія, а запланована відкрита модель ще не є випущеним клінічним інструментом.'
