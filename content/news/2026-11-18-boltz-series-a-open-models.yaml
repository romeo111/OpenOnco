slug: boltz-open-and-proprietary-models
date: 2026-11-18
published: 2026-11-19
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, drug-discovery, molecular-design, open-source, evidence]
title:
  en: 'Boltz raises $110 million: which models are actually open?'
  uk: 'Boltz залучає $110 млн: які моделі справді відкриті?'
summary:
  en: 'Boltz combines openly licensed biomolecular models with proprietary design tools. Its funding and usage are business milestones, not evidence of improved cancer outcomes.'
  uk: 'Boltz поєднує відкриті біомолекулярні моделі з закритими інструментами дизайну. Фінансування й використання продукту не доводять поліпшення результатів лікування раку.'
sources:
  - citation: 'Boltz. Series A announcement dated 18 November 2026; company-reported funding and usage. Checked 19 November 2026.'
    id: https://www.boltz.com/series-a
  - citation: 'Boltz. Current molecular-design platform and model access labels. Checked 19 November 2026.'
    id: https://www.boltz.com/
  - citation: 'Boltz biomolecular interaction models, public repository and MIT licence. Checked 19 November 2026.'
    id: https://github.com/jwohlwend/boltz
  - citation: 'OpenOnco. Current product scope and clinical limitations, checked 19 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/452fc930a9/README.md
  - citation: 'OpenOnco. MIT code licence, checked 19 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/452fc930a9/LICENSE
body:
  en:
    - type: p
      text: >-
        On 18 November 2026, Boltz announced a **$110 million Series A** to expand its molecular-design models and computing capacity. Boltz says its Lab and API help researchers design small molecules and protein binders; it also reports pharmaceutical partners and growing paid use. These are company-reported business and product milestones. Funding and usage do not show that a new cancer medicine is safe, effective or even ready for patients.
    - type: p
      text: >-
        “Open” needs a model name. Boltz publishes code and weights for **Boltz-1 and Boltz-2** in an MIT-licensed repository, and its product site labels **Boltz-2 and BoltzGen** open source. The same site labels the newer **BoltzMol-1 and BoltzProt-1** proprietary models on Boltz Lab. Thus a researcher can inspect and run some Boltz models, but should not assume the hosted design models have the same licence or reproducibility. Boltz describes paying customers; the checked announcement does not set out a price for each workflow.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) makes its rules, source links and code publicly inspectable under MIT and offers free access to its public pages. It uses structured oncology case details to produce drafts for qualified clinician review. It does **not** design molecules or predict binding, and its drafts are not clinically validated treatment decisions. Boltz addresses discovery research; OpenOnco addresses reviewable oncology knowledge. Neither company’s announcement supplies a head-to-head patient-outcome comparison. Sources checked 19 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        18 листопада 2026 року Boltz оголосила про залучення **$110 млн у раунді Series A** для розвитку моделей молекулярного дизайну й обчислювальних потужностей. За словами компанії, її Lab та API допомагають дослідникам створювати малі молекули й білкові зв’язувальні молекули; вона також повідомляє про фармацевтичних партнерів і зростання платного використання. Це заявлені компанією ділові й продуктові досягнення. Фінансування та кількість використань не доводять, що новий протипухлинний препарат безпечний, дієвий або готовий для пацієнтів.
    - type: p
      text: >-
        Говорячи про «відкритість», важливо назвати модель. Boltz публікує код і ваги **Boltz-1 та Boltz-2** у репозиторії під ліцензією MIT, а на сайті позначає **Boltz-2 і BoltzGen** як відкриті моделі. Водночас новіші **BoltzMol-1 і BoltzProt-1** на Boltz Lab позначені як закриті. Отже, частину моделей дослідник може переглянути й запустити самостійно, але не варто приписувати розміщеним на платформі моделям ту саму ліцензію чи відтворюваність. Boltz згадує платних користувачів; перевірене оголошення не визначає ціну кожного сценарію роботи.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) відкриває для перевірки правила, посилання на джерела й код під ліцензією MIT та надає безкоштовний доступ до публічних сторінок. Він використовує структуровані дані онкологічного випадку для чернеток, які має перевірити кваліфікований лікар. OpenOnco **не** розробляє молекули й не прогнозує зв’язування, а його чернетки не є клінічно валідованими лікувальними рішеннями. Boltz працює з пошуком нових речовин, OpenOnco — з перевірюваними онкологічними знаннями. Жодне з оголошень не містить прямого порівняння результатів у пацієнтів. Джерела перевірено 19 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Boltz recauda 110 millones de dólares: ¿qué modelos son realmente abiertos?'
    summary: 'Boltz combina modelos biomoleculares con licencia abierta y herramientas de diseño propietarias. La financiación y el uso son hitos empresariales, no pruebas de mejores resultados en cáncer.'
    body:
      - type: p
        text: >-
          El 18 de noviembre de 2026, Boltz anunció una **ronda Series A de 110 millones de dólares** para ampliar sus modelos de diseño molecular y su capacidad de cómputo. Según la empresa, Lab y su API ayudan a diseñar moléculas pequeñas y proteínas de unión; también comunica alianzas farmacéuticas y un mayor uso de pago. Son hitos comerciales y de producto declarados por Boltz. La financiación y el uso no demuestran que un nuevo medicamento contra el cáncer sea seguro, eficaz o esté listo para pacientes.
      - type: p
        text: >-
          Al hablar de «abierto» hay que precisar el modelo. Boltz publica código y pesos de **Boltz-1 y Boltz-2** en un repositorio con licencia MIT, y su sitio marca **Boltz-2 y BoltzGen** como modelos abiertos. En cambio, identifica los más recientes **BoltzMol-1 y BoltzProt-1** en Boltz Lab como propietarios. Por tanto, el investigador puede examinar y ejecutar algunos modelos, pero no debe atribuir la misma licencia ni reproducibilidad a los modelos alojados de diseño. Boltz menciona clientes de pago; el anuncio consultado no fija el precio de cada flujo de trabajo.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) permite examinar públicamente sus reglas, enlaces a fuentes y código bajo licencia MIT, y ofrece acceso gratuito a sus páginas públicas. Utiliza datos estructurados de casos oncológicos para crear borradores que debe revisar un profesional cualificado. **No** diseña moléculas ni predice uniones, y sus borradores no son decisiones terapéuticas validadas clínicamente. Boltz se dedica a la investigación de nuevos compuestos; OpenOnco, al conocimiento oncológico verificable. Ningún anuncio aporta una comparación directa de resultados en pacientes. Fuentes comprobadas el 19 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Boltz capta 110 milhões de dólares: que modelos são realmente abertos?'
    summary: 'A Boltz combina modelos biomoleculares com licença aberta e ferramentas de desenho proprietárias. O financiamento e a utilização são marcos comerciais, não prova de melhores resultados no cancro.'
    body:
      - type: p
        text: >-
          Em 18 de novembro de 2026, a Boltz anunciou uma **ronda Series A de 110 milhões de dólares** para expandir os modelos de desenho molecular e a capacidade computacional. Segundo a empresa, o Lab e a API ajudam investigadores a desenhar pequenas moléculas e proteínas de ligação; a Boltz também relata parcerias farmacêuticas e crescimento da utilização paga. Estes são marcos comerciais e de produto comunicados pela empresa. Financiamento e utilização não provam que um novo medicamento contra o cancro seja seguro, eficaz ou esteja pronto para doentes.
      - type: p
        text: >-
          Para falar de «aberto», é preciso indicar o modelo. A Boltz publica código e pesos de **Boltz-1 e Boltz-2** num repositório com licença MIT, e o seu site identifica **Boltz-2 e BoltzGen** como modelos abertos. Já os mais recentes **BoltzMol-1 e BoltzProt-1** do Boltz Lab são identificados como proprietários. Assim, investigadores podem inspecionar e executar alguns modelos, mas não devem presumir que os modelos de desenho alojados têm a mesma licença ou reprodutibilidade. A Boltz refere clientes pagantes; o anúncio consultado não estabelece o preço de cada fluxo de trabalho.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) permite inspecionar publicamente regras, ligações a fontes e código com licença MIT, e oferece acesso gratuito às páginas públicas. Usa dados estruturados de casos oncológicos para criar rascunhos que exigem revisão por um profissional qualificado. **Não** desenha moléculas nem prevê ligações, e os seus rascunhos não são decisões terapêuticas clinicamente validadas. A Boltz trabalha na descoberta de compostos; o OpenOnco, em conhecimento oncológico verificável. Nenhum anúncio apresenta uma comparação direta de resultados em doentes. Fontes verificadas em 19 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Boltz erhält 110 Millionen US-Dollar: Welche Modelle sind wirklich offen?'
    summary: 'Boltz verbindet offen lizenzierte biomolekulare Modelle mit proprietären Designwerkzeugen. Finanzierung und Nutzung sind Geschäftserfolge, keine Belege für bessere Ergebnisse bei Krebs.'
    body:
      - type: p
        text: >-
          Am 18. November 2026 kündigte Boltz eine **Series-A-Finanzierung über 110 Millionen US-Dollar** an, um Modelle für Moleküldesign und Rechenkapazität auszubauen. Laut Unternehmen helfen Lab und API Forschenden beim Entwurf kleiner Moleküle und bindender Proteine; Boltz berichtet auch über Pharmapartner und wachsende bezahlte Nutzung. Das sind vom Unternehmen gemeldete Geschäfts- und Produktmeilensteine. Finanzierung und Nutzung zeigen nicht, dass ein neues Krebsmedikament sicher, wirksam oder für Patienten bereit ist.
      - type: p
        text: >-
          Bei „offen“ kommt es auf den Modellnamen an. Boltz veröffentlicht Code und Gewichte für **Boltz-1 und Boltz-2** in einem MIT-lizenzierten Repository; die Produktseite kennzeichnet **Boltz-2 und BoltzGen** als Open Source. Die neueren **BoltzMol-1 und BoltzProt-1** auf Boltz Lab sind dort hingegen als proprietär markiert. Forschende können manche Modelle selbst prüfen und ausführen, sollten aber für die gehosteten Designmodelle nicht dieselbe Lizenz oder Reproduzierbarkeit annehmen. Boltz erwähnt zahlende Kunden; die geprüfte Meldung nennt keinen Preis für jeden Arbeitsablauf.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) macht Regeln, Quellenlinks und MIT-lizenzierten Code öffentlich einsehbar und bietet freien Zugang zu seinen öffentlichen Seiten. Aus strukturierten onkologischen Falldaten erstellt es Entwürfe, die qualifizierte Ärzte prüfen müssen. Es entwirft **keine** Moleküle und sagt keine Bindung voraus; seine Entwürfe sind keine klinisch validierten Therapieentscheidungen. Boltz dient der Wirkstoffforschung, OpenOnco der Prüfung onkologischen Wissens. Keines der Unternehmen liefert einen direkten Vergleich von Patientenergebnissen. Quellen geprüft am 19. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Boltz lève 110 millions de dollars : quels modèles sont réellement ouverts ?'
    summary: 'Boltz associe des modèles biomoléculaires sous licence ouverte et des outils de conception propriétaires. Financement et utilisation sont des jalons commerciaux, pas des preuves de meilleurs résultats contre le cancer.'
    body:
      - type: p
        text: >-
          Le 18 novembre 2026, Boltz a annoncé une **levée de 110 millions de dollars en série A** pour développer ses modèles de conception moléculaire et sa capacité de calcul. Selon l’entreprise, son Lab et son API aident les chercheurs à concevoir de petites molécules et des protéines de liaison ; elle rapporte aussi des partenariats pharmaceutiques et une hausse de l’utilisation payante. Il s’agit de jalons commerciaux et de produit déclarés par l’entreprise. Financement et utilisation ne prouvent pas qu’un nouveau médicament anticancéreux soit sûr, efficace ou prêt pour les patients.
      - type: p
        text: >-
          Pour parler d’« ouverture », il faut nommer le modèle. Boltz publie le code et les poids de **Boltz-1 et Boltz-2** dans un dépôt sous licence MIT, et son site classe **Boltz-2 et BoltzGen** parmi les modèles ouverts. Il présente en revanche les plus récents **BoltzMol-1 et BoltzProt-1** de Boltz Lab comme propriétaires. Des chercheurs peuvent donc examiner et exécuter certains modèles, sans supposer que les modèles de conception hébergés ont la même licence ou reproductibilité. Boltz mentionne des clients payants ; l’annonce examinée ne fixe pas le prix de chaque usage.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) rend ses règles, liens vers les sources et code sous licence MIT publiquement inspectables et donne libre accès à ses pages publiques. Il utilise des données de cas oncologiques structurées pour préparer des brouillons que des cliniciens qualifiés doivent vérifier. Il ne conçoit **pas** de molécules ni ne prédit des liaisons ; ses brouillons ne sont pas des décisions thérapeutiques validées cliniquement. Boltz se consacre à la découverte de molécules, OpenOnco à la vérification du savoir oncologique. Aucune des annonces ne donne de comparaison directe des résultats chez les patients. Sources vérifiées le 19 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Boltz raccoglie 110 milioni di dollari: quali modelli sono davvero aperti?'
    summary: 'Boltz affianca modelli biomolecolari con licenza aperta a strumenti di progettazione proprietari. Finanziamento e utilizzo sono traguardi commerciali, non prove di migliori esiti oncologici.'
    body:
      - type: p
        text: >-
          Il 18 novembre 2026 Boltz ha annunciato un **round Series A da 110 milioni di dollari** per ampliare i modelli di progettazione molecolare e la capacità di calcolo. Secondo l’azienda, Lab e API aiutano i ricercatori a progettare piccole molecole e proteine leganti; Boltz riferisce anche partnership farmaceutiche e una crescita dell’uso a pagamento. Sono traguardi commerciali e di prodotto dichiarati dall’azienda. Finanziamento e utilizzo non dimostrano che un nuovo farmaco antitumorale sia sicuro, efficace o pronto per i pazienti.
      - type: p
        text: >-
          Per definire qualcosa «aperto» bisogna indicare il modello. Boltz pubblica codice e pesi di **Boltz-1 e Boltz-2** in un repository con licenza MIT, e il sito classifica **Boltz-2 e BoltzGen** come open source. I più recenti **BoltzMol-1 e BoltzProt-1** su Boltz Lab sono invece indicati come proprietari. I ricercatori possono esaminare ed eseguire alcuni modelli, ma non devono presumere che quelli ospitati per la progettazione abbiano la stessa licenza o riproducibilità. Boltz cita clienti paganti; l’annuncio esaminato non indica il prezzo per ciascun flusso di lavoro.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) rende pubblicamente verificabili regole, fonti e codice con licenza MIT e offre accesso gratuito alle pagine pubbliche. Usa dati strutturati di casi oncologici per produrre bozze che richiedono la revisione di clinici qualificati. **Non** progetta molecole né predice legami, e le sue bozze non sono decisioni terapeutiche validate clinicamente. Boltz si occupa di scoperta di composti, OpenOnco di conoscenza oncologica verificabile. Nessun annuncio fornisce un confronto diretto degli esiti dei pazienti. Fonti controllate il 19 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'Boltz henter 110 millioner dollar: Hvilke modeller er faktisk åbne?'
    summary: 'Boltz kombinerer åbent licenserede biomolekylære modeller med proprietære designværktøjer. Finansiering og brug er forretningsmilepæle, ikke bevis for bedre kræftresultater.'
    body:
      - type: p
        text: >-
          Den 18. november 2026 annoncerede Boltz en **Series A-finansiering på 110 millioner dollar** til at udbygge sine modeller til molekylært design og sin computerkapacitet. Ifølge virksomheden hjælper Lab og API forskere med at designe små molekyler og bindende proteiner; den fortæller også om farmaceutiske partnere og stigende betalt brug. Det er virksomhedens egne forretnings- og produktmilepæle. Finansiering og brug viser ikke, at et nyt kræftlægemiddel er sikkert, effektivt eller klar til patienter.
      - type: p
        text: >-
          Når man siger »åben«, skal man nævne modellen. Boltz offentliggør kode og vægte for **Boltz-1 og Boltz-2** i et MIT-licenseret repository, og produktsiden betegner **Boltz-2 og BoltzGen** som open source. De nyere **BoltzMol-1 og BoltzProt-1** på Boltz Lab betegnes derimod som proprietære. Forskere kan derfor undersøge og køre nogle modeller selv, men bør ikke antage samme licens eller reproducerbarhed for de hostede designmodeller. Boltz omtaler betalende kunder; den gennemgåede meddelelse angiver ikke pris for hver arbejdsgang.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) gør regler, kildelinks og MIT-licenseret kode offentligt tilgængelige for gennemgang og giver gratis adgang til sine offentlige sider. Det bruger strukturerede oplysninger om onkologiske tilfælde til udkast, som kvalificerede klinikere skal gennemgå. Det designer **ikke** molekyler eller forudsiger binding, og udkastene er ikke klinisk validerede behandlingsbeslutninger. Boltz arbejder med lægemiddelforskning, OpenOnco med efterprøvelig onkologisk viden. Ingen af meddelelserne indeholder en direkte sammenligning af patientresultater. Kilder kontrolleret 19. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Boltz tar in 110 miljoner dollar: Vilka modeller är egentligen öppna?'
    summary: 'Boltz kombinerar öppet licensierade biomolekylära modeller med proprietära designverktyg. Finansiering och användning är affärssteg, inte bevis för bättre cancerresultat.'
    body:
      - type: p
        text: >-
          Den 18 november 2026 meddelade Boltz en **Series A-finansiering på 110 miljoner dollar** för att utöka modellerna för molekylär design och datorkapaciteten. Enligt företaget hjälper Lab och API forskare att utforma små molekyler och bindande proteiner; Boltz uppger också läkemedelspartner och ökande betald användning. Detta är företagsrapporterade affärs- och produktsteg. Finansiering och användning visar inte att ett nytt cancerläkemedel är säkert, effektivt eller redo för patienter.
      - type: p
        text: >-
          För att säga ”öppen” behöver man ange modell. Boltz publicerar kod och vikter för **Boltz-1 och Boltz-2** i ett MIT-licensierat arkiv, och produktwebbplatsen märker **Boltz-2 och BoltzGen** som öppna. De nyare **BoltzMol-1 och BoltzProt-1** på Boltz Lab märks däremot som proprietära. Forskare kan granska och köra vissa modeller, men bör inte anta samma licens eller reproducerbarhet för de värdbaserade designmodellerna. Boltz nämner betalande kunder; den granskade nyheten anger inte pris för varje arbetsflöde.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) gör regler, källänkar och MIT-licensierad kod öppna för granskning och erbjuder fri tillgång till sina offentliga sidor. Det använder strukturerade uppgifter om cancerfall för utkast som kvalificerade kliniker måste granska. Det utformar **inte** molekyler eller förutsäger bindning, och utkasten är inte kliniskt validerade behandlingsbeslut. Boltz arbetar med upptäckt av läkemedelskandidater, OpenOnco med granskningsbar onkologisk kunskap. Ingen av nyheterna ger en direkt jämförelse av patientutfall. Källor kontrollerade den 19 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Boltz henter 110 millioner dollar: Hvilke modeller er faktisk åpne?'
    summary: 'Boltz kombinerer åpent lisensierte biomolekylære modeller med proprietære designverktøy. Finansiering og bruk er forretningsmilepæler, ikke bevis for bedre kreftutfall.'
    body:
      - type: p
        text: >-
          Den 18. november 2026 kunngjorde Boltz en **Series A-finansiering på 110 millioner dollar** for å utvide modellene for molekylær design og regnekapasiteten. Ifølge selskapet hjelper Lab og API forskere med å utforme små molekyler og bindende proteiner; Boltz forteller også om farmasøytiske partnere og økende betalt bruk. Dette er selskapets egne forretnings- og produktmilepæler. Finansiering og bruk viser ikke at et nytt kreftlegemiddel er trygt, virksomt eller klart for pasienter.
      - type: p
        text: >-
          Når man sier «åpen», må man nevne modellen. Boltz publiserer kode og vekter for **Boltz-1 og Boltz-2** i et MIT-lisensiert lager, og produktsiden merker **Boltz-2 og BoltzGen** som åpen kildekode. De nyere **BoltzMol-1 og BoltzProt-1** på Boltz Lab merkes derimot som proprietære. Forskere kan dermed undersøke og kjøre noen modeller selv, men bør ikke anta samme lisens eller reproduserbarhet for de vertsbaserte designmodellene. Boltz nevner betalende kunder; den gjennomgåtte kunngjøringen angir ikke pris for hver arbeidsflyt.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) gjør regler, kildelenker og MIT-lisensiert kode offentlig tilgjengelig for kontroll og gir gratis tilgang til de offentlige sidene. Det bruker strukturerte opplysninger om krefttilfeller til utkast som kvalifiserte klinikere må gjennomgå. Det designer **ikke** molekyler eller forutsier binding, og utkastene er ikke klinisk validerte behandlingsbeslutninger. Boltz arbeider med legemiddelforskning, OpenOnco med etterprøvbar onkologisk kunnskap. Ingen av kunngjøringene gir en direkte sammenligning av pasientutfall. Kilder kontrollert 19. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Boltz kerää 110 miljoonaa dollaria: mitkä mallit ovat todella avoimia?'
    summary: 'Boltz yhdistää avoimesti lisensoituja biomolekyylimalleja suljettuihin suunnittelutyökaluihin. Rahoitus ja käyttö ovat liiketoiminnan etappeja, eivät näyttöä paremmista syöpätuloksista.'
    body:
      - type: p
        text: >-
          Boltz ilmoitti 18. marraskuuta 2026 **110 miljoonan dollarin Series A -rahoituksesta** molekyylisuunnittelumalliensa ja laskentakapasiteettinsa laajentamiseksi. Yhtiön mukaan Lab ja API auttavat tutkijoita suunnittelemaan pienmolekyylejä ja sitovia proteiineja; se kertoo myös lääkeyhtiökumppaneista ja kasvavasta maksullisesta käytöstä. Nämä ovat yhtiön raportoimia liiketoiminnan ja tuotteen virstanpylväitä. Rahoitus ja käyttö eivät osoita, että uusi syöpälääke olisi turvallinen, tehokas tai valmis potilaille.
      - type: p
        text: >-
          ”Avoimesta” puhuttaessa malli on nimettävä. Boltz julkaisee **Boltz-1:n ja Boltz-2:n** koodin ja painot MIT-lisensoidussa tietovarastossa, ja tuotesivusto merkitsee **Boltz-2:n ja BoltzGenin** avoimiksi. Uudemmat **BoltzMol-1 ja BoltzProt-1** ovat Boltz Labissa sen sijaan suljettuja malleja. Tutkija voi tarkastaa ja suorittaa osan malleista itse, mutta palvelussa ajettavilla suunnittelumalleilla ei pidä olettaa olevan samaa lisenssiä tai toistettavuutta. Boltz mainitsee maksavia asiakkaita; tarkistettu tiedote ei kerro kunkin työnkulun hintaa.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) tuo säännöt, lähdelinkit ja MIT-lisensoidun koodin julkisesti tarkastettaviksi sekä tarjoaa maksuttoman pääsyn julkisille sivuilleen. Se laatii rakenteisista syöpätapausten tiedoista luonnoksia, jotka pätevän lääkärin on arvioitava. Se **ei** suunnittele molekyylejä eikä ennusta sitoutumista, eivätkä sen luonnokset ole kliinisesti validoituja hoitopäätöksiä. Boltz toimii lääkeaihioiden tutkimuksessa, OpenOnco tarkastettavan onkologisen tiedon parissa. Kumpikaan tiedote ei anna suoraa vertailua potilastuloksista. Lähteet tarkistettu 19. marraskuuta 2026. Tämä artikkeli ei korvaa lääkäriä.
