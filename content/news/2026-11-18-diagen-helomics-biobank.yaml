title:
  en: 'DiaGen and Helomics plan tumour-sample tests; a partnership is not a therapy'
  uk: 'DiaGen і Helomics планують досліди на зразках пухлин; партнерство ще не є лікуванням'
summary:
  en: 'A new agreement pairs DiaGen’s peptide and molecule design with Helomics tumour samples. The related published evidence is in cell lines; patient benefit remains untested.'
  uk: 'Нова угода поєднує розробку пептидів і молекул DiaGen зі зразками пухлин Helomics. Опубліковані дані стосуються клітинних ліній; користь для пацієнтів не доведена.'
