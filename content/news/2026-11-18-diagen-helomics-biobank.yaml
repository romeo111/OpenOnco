body:
  en:
    - type: p
      text: >-
        On 18 November 2026, DataMEDS said its Helomics laboratory had agreed to work with Canadian startup DiaGen AI on cancer-target discovery. DiaGen would use its **CYPRESS** peptide and **BLACKCOMB** small-molecule platforms alongside Helomics tumour samples. The company says its biobank holds more than **70,000** biopsies and that the first work will investigate **15** peptide candidates in primary breast-tumour samples, with animal studies planned later. These are the companies’ descriptions of a new agreement and future experiments, not completed clinical results.
    - type: p
      text: >-
        There is a relevant peer-reviewed starting point: a 2025 Nature Communications paper by a team including DiaGen’s chief AI officer reported that **15 of 100** selected peptides showed activity against breast-cancer cells in laboratory dishes. The paper did not test treatment in people. DiaGen’s current product page describes proprietary models offered through partnerships; it does not publish a public code licence or price. Access to a large sample collection may improve testing, but its size alone cannot establish that a candidate is safe or works in patients.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) offers free MIT-licensed code, inspectable rules and source-linked oncology drafts from structured case details. It does not design peptides, run tissue experiments or claim clinically validated treatment decisions. DiaGen and Helomics work in preclinical discovery; OpenOnco supports review of oncology knowledge. No direct outcome comparison exists between these different workflows. Sources checked 18 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        18 листопада 2026 року DataMEDS повідомила, що її лабораторія Helomics домовилася співпрацювати з канадським стартапом DiaGen AI в пошуку мішеней для протипухлинних препаратів. DiaGen планує застосувати платформи **CYPRESS** для пептидів і **BLACKCOMB** для малих молекул разом зі зразками пухлин Helomics. Компанія стверджує, що її біобанк містить понад **70 000** біопсій, а перший етап охопить дослідження **15** кандидатних пептидів на первинних зразках пухлин молочної залози; досліди на тваринах заплановані пізніше. Це опис компаніями нової угоди й майбутніх дослідів, а не готові клінічні результати.
    - type: p
      text: >-
        Є відповідне рецензоване підґрунтя: у статті Nature Communications 2025 року група за участю керівника напряму ШІ DiaGen повідомила, що **15 зі 100** відібраних пептидів виявили активність проти клітин раку молочної залози в лабораторних умовах. Лікування людей у цій роботі не вивчали. На поточній сторінці DiaGen описано власні моделі, доступні через партнерства; відкритої ліцензії коду чи ціни немає. Велика колекція зразків може допомогти з перевіркою, але сам її розмір не доводить безпечності або користі кандидата для пацієнтів.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) безкоштовно надає код під ліцензією MIT, правила для перевірки й онкологічні чернетки з посиланнями на джерела на основі структурованих даних випадку. Він не створює пептиди, не проводить досліди на тканинах і не заявляє про клінічно валідовані лікувальні рішення. DiaGen і Helomics займаються доклінічним пошуком, а OpenOnco допомагає перевіряти онкологічні знання. Прямого порівняння результатів цих різних процесів немає. Джерела перевірено 18 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'DiaGen y Helomics planean ensayos con tumores; una alianza no es un tratamiento'
    summary: 'Un acuerdo une el diseño de péptidos y moléculas de DiaGen con muestras tumorales de Helomics. La evidencia publicada procede de líneas celulares; el beneficio para pacientes sigue sin probarse.'
    body:
      - type: p
        text: >-
          El 18 de noviembre de 2026, DataMEDS anunció que su laboratorio Helomics había acordado colaborar con la empresa canadiense DiaGen AI en la búsqueda de dianas contra el cáncer. DiaGen utilizaría sus plataformas **CYPRESS** para péptidos y **BLACKCOMB** para moléculas pequeñas junto con muestras tumorales de Helomics. Según la empresa, su biobanco contiene más de **70 000** biopsias y los primeros trabajos estudiarán **15** péptidos candidatos en muestras primarias de tumores de mama; los estudios en animales están previstos para más adelante. Son descripciones empresariales de un acuerdo y de experimentos futuros, no resultados clínicos ya obtenidos.
      - type: p
        text: >-
          Existe un punto de partida revisado por pares: un artículo de Nature Communications de 2025, firmado por un equipo que incluye al director de IA de DiaGen, comunicó que **15 de 100** péptidos seleccionados mostraron actividad frente a células de cáncer de mama en el laboratorio. No se estudió el tratamiento de personas. La página actual de DiaGen describe modelos propios accesibles mediante acuerdos de colaboración; no publica una licencia abierta del código ni un precio. Una gran colección de muestras puede ayudar a investigar, pero su tamaño por sí solo no demuestra seguridad ni beneficio para pacientes.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) ofrece gratuitamente código con licencia MIT, reglas examinables y borradores oncológicos con fuentes a partir de datos estructurados de casos. No diseña péptidos, realiza experimentos con tejidos ni afirma producir decisiones terapéuticas validadas clínicamente. DiaGen y Helomics trabajan en descubrimiento preclínico; OpenOnco ayuda a revisar conocimiento oncológico. No existe una comparación directa de resultados entre estos procesos distintos. Fuentes comprobadas el 18 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'DiaGen e Helomics planeiam testes em tumores; uma parceria não é um tratamento'
    summary: 'O acordo junta a conceção de péptidos e moléculas da DiaGen a amostras tumorais da Helomics. A evidência publicada vem de linhas celulares; o benefício para doentes não foi demonstrado.'
    body:
      - type: p
        text: >-
          Em 18 de novembro de 2026, a DataMEDS anunciou que o seu laboratório Helomics acordou trabalhar com a startup canadiana DiaGen AI na descoberta de alvos contra o cancro. A DiaGen deverá usar as plataformas **CYPRESS** para péptidos e **BLACKCOMB** para pequenas moléculas juntamente com amostras tumorais da Helomics. Segundo a empresa, o biobanco contém mais de **70 000** biópsias e a primeira fase estudará **15** péptidos candidatos em amostras primárias de tumores da mama; estudos em animais estão previstos para depois. São descrições das empresas sobre um acordo e experiências futuras, não resultados clínicos concluídos.
      - type: p
        text: >-
          Existe um ponto de partida revisto por pares: um artigo de 2025 na Nature Communications, de uma equipa que inclui o diretor de IA da DiaGen, relatou que **15 de 100** péptidos selecionados mostraram atividade contra células de cancro da mama em laboratório. O estudo não testou tratamento em pessoas. A página atual da DiaGen descreve modelos proprietários disponíveis através de parcerias; não publica licença aberta do código nem preço. Uma grande coleção de amostras pode ajudar nos testes, mas o seu tamanho, por si só, não prova segurança ou benefício para doentes.
      - type: p
        text: >-
          O [OpenOnco](/pt/capabilities.html) oferece gratuitamente código com licença MIT, regras inspecionáveis e rascunhos oncológicos ligados a fontes a partir de dados estruturados de casos. Não concebe péptidos, não faz experiências com tecidos nem reivindica decisões terapêuticas clinicamente validadas. A DiaGen e a Helomics trabalham em descoberta pré-clínica; o OpenOnco apoia a revisão do conhecimento oncológico. Não há comparação direta dos resultados destes processos distintos. Fontes verificadas em 18 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'DiaGen und Helomics planen Tumorproben-Tests; eine Partnerschaft ist keine Therapie'
    summary: 'Die Vereinbarung verbindet DiaGens Peptid- und Moleküldesign mit Tumorproben von Helomics. Die veröffentlichte Evidenz stammt aus Zelllinien; ein Nutzen für Patienten ist nicht belegt.'
    body:
      - type: p
        text: >-
          Am 18. November 2026 teilte DataMEDS mit, dass sein Labor Helomics mit dem kanadischen Startup DiaGen AI bei der Suche nach Krebszielstrukturen zusammenarbeiten will. DiaGen soll die Plattformen **CYPRESS** für Peptide und **BLACKCOMB** für kleine Moleküle zusammen mit Tumorproben von Helomics einsetzen. Nach Unternehmensangaben enthält die Biobank mehr als **70.000** Biopsien. Zunächst sollen **15** Peptidkandidaten an primären Brusttumorproben untersucht werden; Tierversuche sind für später geplant. Dies sind Angaben der Unternehmen zu einer Vereinbarung und künftigen Experimenten, keine abgeschlossenen klinischen Ergebnisse.
      - type: p
        text: >-
          Ein begutachteter Ausgangspunkt liegt vor: Eine 2025 in Nature Communications veröffentlichte Arbeit eines Teams mit DiaGens KI-Leiter berichtete, dass **15 von 100** ausgewählten Peptiden im Labor gegen Brustkrebszellen aktiv waren. Eine Behandlung von Menschen wurde nicht untersucht. DiaGens aktuelle Produktseite beschreibt proprietäre Modelle für Partner; eine öffentliche Codelizenz oder ein Preis werden nicht genannt. Eine große Probensammlung kann die Forschung unterstützen, doch ihre Größe allein belegt weder Sicherheit noch Nutzen für Patienten.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) bietet kostenlos MIT-lizenzierten Code, einsehbare Regeln und quellenverknüpfte onkologische Entwürfe aus strukturierten Falldaten. Es entwickelt keine Peptide, führt keine Gewebeexperimente durch und beansprucht keine klinisch validierten Therapieentscheidungen. DiaGen und Helomics arbeiten in der präklinischen Forschung; OpenOnco unterstützt die Prüfung onkologischen Wissens. Ein direkter Ergebnisvergleich dieser unterschiedlichen Abläufe liegt nicht vor. Quellen geprüft am 18. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'DiaGen et Helomics prévoient des essais sur des tumeurs ; un partenariat n’est pas un traitement'
    summary: 'L’accord associe la conception de peptides et de molécules par DiaGen aux échantillons tumoraux de Helomics. Les données publiées proviennent de lignées cellulaires ; le bénéfice pour les patients reste non démontré.'
    body:
      - type: p
        text: >-
          Le 18 novembre 2026, DataMEDS a annoncé que son laboratoire Helomics avait conclu un accord avec la jeune entreprise canadienne DiaGen AI pour rechercher des cibles anticancéreuses. DiaGen utiliserait ses plateformes **CYPRESS** pour les peptides et **BLACKCOMB** pour les petites molécules avec les échantillons tumoraux de Helomics. Selon l’entreprise, sa biobanque contient plus de **70 000** biopsies et les premiers travaux étudieront **15** peptides candidats sur des échantillons primaires de tumeurs mammaires ; les expériences animales sont prévues plus tard. Il s’agit de descriptions d’un accord et d’expériences futures par les entreprises, non de résultats cliniques achevés.
      - type: p
        text: >-
          Il existe un point de départ évalué par les pairs : un article de Nature Communications publié en 2025 par une équipe comprenant le directeur de l’IA de DiaGen rapporte que **15 des 100** peptides sélectionnés ont montré une activité contre des cellules de cancer du sein en laboratoire. Il n’a pas étudié de traitement chez l’humain. La page actuelle de DiaGen décrit des modèles propriétaires accessibles par partenariat ; elle ne publie ni licence ouverte du code ni tarif. Une grande collection d’échantillons peut aider à tester des candidats, mais sa taille ne démontre à elle seule ni leur innocuité ni un bénéfice pour les patients.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) met gratuitement à disposition du code sous licence MIT, des règles inspectables et des brouillons oncologiques reliés aux sources à partir de données de cas structurées. Il ne conçoit pas de peptides, ne mène pas d’expériences sur des tissus et ne revendique pas de décisions thérapeutiques validées cliniquement. DiaGen et Helomics travaillent en recherche préclinique ; OpenOnco aide à examiner les connaissances oncologiques. Aucune comparaison directe des résultats de ces démarches différentes n’existe. Sources vérifiées le 18 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'DiaGen e Helomics pianificano test su tumori; una partnership non è una terapia'
    summary: 'L’accordo unisce la progettazione di peptidi e molecole di DiaGen ai campioni tumorali di Helomics. Le evidenze pubblicate riguardano linee cellulari; il beneficio per i pazienti non è dimostrato.'
    body:
      - type: p
        text: >-
          Il 18 novembre 2026 DataMEDS ha annunciato che il suo laboratorio Helomics collaborerà con la startup canadese DiaGen AI nella ricerca di bersagli antitumorali. DiaGen dovrebbe usare le piattaforme **CYPRESS** per i peptidi e **BLACKCOMB** per le piccole molecole insieme ai campioni tumorali di Helomics. Secondo l’azienda, la biobanca contiene oltre **70.000** biopsie e i primi esperimenti studieranno **15** peptidi candidati su campioni primari di tumore mammario; gli studi sugli animali sono previsti in seguito. Sono dichiarazioni delle aziende su un accordo e su esperimenti futuri, non risultati clinici già ottenuti.
      - type: p
        text: >-
          Un punto di partenza sottoposto a revisione paritaria esiste: uno studio del 2025 su Nature Communications, di un gruppo che comprende il responsabile IA di DiaGen, ha riferito che **15 dei 100** peptidi selezionati erano attivi contro cellule di carcinoma mammario in laboratorio. Non ha studiato il trattamento di persone. La pagina attuale di DiaGen descrive modelli proprietari offerti tramite collaborazioni; non indica una licenza pubblica del codice né un prezzo. Una grande raccolta di campioni può aiutare la ricerca, ma la sua dimensione da sola non prova sicurezza o beneficio per i pazienti.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) offre gratuitamente codice con licenza MIT, regole ispezionabili e bozze oncologiche con fonti da dati strutturati di casi. Non progetta peptidi, non esegue esperimenti sui tessuti e non rivendica decisioni terapeutiche validate clinicamente. DiaGen e Helomics lavorano nella ricerca preclinica; OpenOnco sostiene la verifica delle conoscenze oncologiche. Non esiste un confronto diretto degli esiti tra questi processi diversi. Fonti controllate il 18 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'DiaGen og Helomics planlægger forsøg med tumorprøver; et samarbejde er ikke en behandling'
    summary: 'Aftalen kobler DiaGens design af peptider og molekyler med Helomics’ tumorprøver. De offentliggjorte data kommer fra cellelinjer; patientnytte er ikke påvist.'
    body:
      - type: p
        text: >-
          Den 18. november 2026 meddelte DataMEDS, at dets laboratorium Helomics vil samarbejde med den canadiske startup DiaGen AI om at finde mål for kræftlægemidler. DiaGen skal bruge platformene **CYPRESS** til peptider og **BLACKCOMB** til små molekyler sammen med tumorprøver fra Helomics. Virksomheden oplyser, at biobanken rummer over **70.000** biopsier, og at det første arbejde vil undersøge **15** peptidkandidater i primære brysttumorprøver; dyreforsøg er planlagt senere. Dette er virksomhedernes beskrivelse af en aftale og fremtidige forsøg, ikke afsluttede kliniske resultater.
      - type: p
        text: >-
          Der findes et fagfællebedømt udgangspunkt: En artikel fra 2025 i Nature Communications af et hold med DiaGens AI-chef rapporterede, at **15 ud af 100** udvalgte peptider viste aktivitet mod brystkræftceller i laboratoriet. Behandling af mennesker blev ikke undersøgt. DiaGens nuværende produktside beskriver proprietære modeller, som tilbydes gennem partnerskaber; den angiver hverken en offentlig kodelicens eller pris. En stor prøvesamling kan hjælpe med afprøvning, men størrelsen alene påviser ikke sikkerhed eller gavn for patienter.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) stiller gratis MIT-licenseret kode, gennemskuelige regler og kildebelagte onkologiske udkast ud fra strukturerede sagsoplysninger til rådighed. Det designer ikke peptider, udfører ikke vævsforsøg og hævder ikke at levere klinisk validerede behandlingsbeslutninger. DiaGen og Helomics arbejder med præklinisk forskning; OpenOnco støtter gennemgang af onkologisk viden. Der findes ingen direkte sammenligning af resultaterne fra disse forskellige arbejdsgange. Kilder kontrolleret 18. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'DiaGen och Helomics planerar tester på tumörprover; ett avtal är ingen behandling'
    summary: 'Avtalet kopplar DiaGens design av peptider och molekyler till Helomics tumörprover. Den publicerade evidensen gäller cellinjer; patientnytta är inte visad.'
    body:
      - type: p
        text: >-
          Den 18 november 2026 meddelade DataMEDS att dess laboratorium Helomics ska samarbeta med det kanadensiska startupbolaget DiaGen AI om att hitta mål för cancerläkemedel. DiaGen ska använda plattformarna **CYPRESS** för peptider och **BLACKCOMB** för små molekyler tillsammans med Helomics tumörprover. Enligt bolaget innehåller biobanken fler än **70 000** biopsier, och de första försöken ska undersöka **15** peptidkandidater i primära brösttumörprover; djurförsök planeras senare. Det är bolagens beskrivning av ett avtal och framtida experiment, inte färdiga kliniska resultat.
      - type: p
        text: >-
          Det finns en sakkunniggranskad utgångspunkt: en artikel från 2025 i Nature Communications av en grupp där DiaGens AI-chef ingick rapporterade att **15 av 100** utvalda peptider visade aktivitet mot bröstcancerceller i laboratoriet. Behandling av människor undersöktes inte. DiaGens aktuella produktsida beskriver proprietära modeller som erbjuds via partnerskap; någon offentlig kodlicens eller pris anges inte. En stor provsamling kan hjälpa forskningen, men storleken i sig visar varken säkerhet eller nytta för patienter.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) erbjuder gratis MIT-licensierad kod, granskningsbara regler och källförsedda onkologiska utkast utifrån strukturerade falluppgifter. Det utformar inte peptider, gör inte vävnadsförsök och gör inte anspråk på kliniskt validerade behandlingsbeslut. DiaGen och Helomics arbetar med preklinisk forskning; OpenOnco stödjer granskning av onkologisk kunskap. Ingen direkt jämförelse av resultaten från dessa olika arbetsflöden finns. Källor kontrollerade den 18 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'DiaGen og Helomics planlegger tester på svulstprøver; en avtale er ingen behandling'
    summary: 'Avtalen kobler DiaGens design av peptider og molekyler til Helomics’ svulstprøver. Den publiserte dokumentasjonen gjelder cellelinjer; nytte for pasienter er ikke vist.'
    body:
      - type: p
        text: >-
          Den 18. november 2026 opplyste DataMEDS at laboratoriet Helomics skal samarbeide med den canadiske oppstartsbedriften DiaGen AI om å finne mål for kreftlegemidler. DiaGen skal bruke plattformene **CYPRESS** for peptider og **BLACKCOMB** for små molekyler sammen med svulstprøver fra Helomics. Selskapet sier at biobanken inneholder over **70 000** biopsier, og at det første arbeidet skal undersøke **15** peptidkandidater i primære brystsvulstprøver; dyrestudier er planlagt senere. Dette er selskapenes beskrivelse av en avtale og fremtidige forsøk, ikke ferdige kliniske resultater.
      - type: p
        text: >-
          Det finnes et fagfellevurdert utgangspunkt: En artikkel fra 2025 i Nature Communications av en gruppe med DiaGens AI-sjef rapporterte at **15 av 100** utvalgte peptider viste aktivitet mot brystkreftceller i laboratoriet. Behandling av mennesker ble ikke undersøkt. DiaGens nåværende produktside beskriver proprietære modeller som tilbys gjennom partnerskap; den oppgir verken offentlig kodelisens eller pris. En stor prøvesamling kan hjelpe forskningen, men størrelsen alene viser ikke sikkerhet eller nytte for pasienter.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) tilbyr gratis MIT-lisensiert kode, inspiserbare regler og kildebelagte onkologiske utkast fra strukturerte saksopplysninger. Det designer ikke peptider, utfører ikke vevsforsøk og hevder ikke å gi klinisk validerte behandlingsbeslutninger. DiaGen og Helomics arbeider med preklinisk forskning; OpenOnco støtter vurdering av onkologisk kunnskap. Det finnes ingen direkte sammenligning av resultatene fra disse ulike arbeidsflytene. Kilder kontrollert 18. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'DiaGen ja Helomics suunnittelevat kasvainnäytteiden testejä; kumppanuus ei ole hoito'
    summary: 'Sopimus yhdistää DiaGenin peptidi- ja molekyylisuunnittelun Helomicsin kasvainnäytteisiin. Julkaistu näyttö koskee solulinjoja; potilashyötyä ei ole osoitettu.'
    body:
      - type: p
        text: >-
          DataMEDS ilmoitti 18. marraskuuta 2026, että sen Helomics-laboratorio aikoo tehdä yhteistyötä kanadalaisen DiaGen AI -startupin kanssa syöpälääkkeiden kohteiden löytämiseksi. DiaGenin on tarkoitus käyttää peptidien **CYPRESS**- ja pienmolekyylien **BLACKCOMB**-alustoja Helomicsin kasvainnäytteiden kanssa. Yhtiön mukaan biopankissa on yli **70 000** biopsiaa ja ensimmäisessä vaiheessa tutkitaan **15** peptidiehdokasta alkuperäisissä rintakasvainnäytteissä; eläinkokeita suunnitellaan myöhemmin. Kyse on yhtiöiden kuvauksista sopimuksesta ja tulevista kokeista, ei valmiista kliinisistä tuloksista.
      - type: p
        text: >-
          Vertaisarvioitu lähtökohta on olemassa: vuoden 2025 Nature Communications -artikkelissa tutkimusryhmä, johon kuului DiaGenin tekoälyjohtaja, raportoi **15:n sadasta** valitusta peptidistä osoittaneen aktiivisuutta rintasyöpäsoluja vastaan laboratoriossa. Ihmisten hoitoa ei tutkittu. DiaGenin nykyinen tuotesivu kuvaa kumppanuuksien kautta tarjottavia suljettuja malleja; julkista koodilisenssiä tai hintaa ei ilmoiteta. Suuri näytekokoelma voi auttaa tutkimuksessa, mutta koko yksin ei osoita turvallisuutta tai hyötyä potilaille.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) tarjoaa maksutta MIT-lisensoitua koodia, tarkastettavia sääntöjä ja lähteisiin sidottuja onkologian luonnoksia rakenteisista tapaustiedoista. Se ei suunnittele peptidejä, tee kudoskokeita eikä väitä tuottavansa kliinisesti validoituja hoitopäätöksiä. DiaGen ja Helomics tekevät prekliinistä tutkimusta; OpenOnco tukee onkologisen tiedon tarkistamista. Näiden erilaisten työnkulkujen tuloksista ei ole suoraa vertailua. Lähteet tarkistettu 18. marraskuuta 2026. Tämä artikkeli ei korvaa lääkäriä.
