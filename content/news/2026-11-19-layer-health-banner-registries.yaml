slug: layer-health-banner-oncology-registries
date: 2026-11-19
published: 2026-11-20
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, oncology-registry, clinical-data, evidence]
title:
  en: 'Banner backs Layer Health’s AI registry workflow, including oncology'
  uk: 'Banner підтримує AI-систему Layer Health для реєстрів, зокрема онкологічних'
summary:
  en: 'Banner’s investment and planned registry rollout are real business news; the announcement does not measure cancer outcomes. Here is how the work differs from OpenOnco.'
  uk: 'Інвестиція Banner і заплановане впровадження для реєстрів — новина про бізнес, а не виміряні результати лікування раку. Пояснюємо відмінність від OpenOnco.'
sources:
  - citation: 'Layer Health. Banner Health strategic investment and registry partnership announcement, dated 19 November 2026. Checked 20 November 2026.'
    id: https://www.prnewswire.com/news-releases/banner-health-makes-strategic-investment-in-layer-health-and-implements-its-clinical-registries-solution-across-the-enterprise-302945828.html
  - citation: 'Layer Health. Clinical Registry Automation product description, claims and demo access. Checked 20 November 2026.'
    id: https://www.layerhealth.com/products/clinical-registries
  - citation: 'OpenOnco. Current product scope and clinical limits, version 2aaa16d. Checked 20 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/2aaa16d238bb1890ae974d7b115bdb53dd3ff64f/README.md
  - citation: 'OpenOnco. MIT code licence, version 2aaa16d. Checked 20 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/2aaa16d238bb1890ae974d7b115bdb53dd3ff64f/LICENSE
body:
  en:
    - type: p
      text: >-
        On 19 November 2026, Layer Health said Banner Health had invested in its Series A and begun a multiyear agreement for more than a dozen clinical registries, including oncology. The investment amount was not disclosed. The announced workflow reads structured and free-text hospital records, then links proposed registry answers to evidence in the chart. This is a company announcement about a partnership and planned rollout, not a measured improvement in cancer care.
    - type: p
      text: >-
        Layer’s product page describes AI-suggested answers reviewed by registry staff and validation on each hospital’s data before use. It advertises speed and accuracy figures, but the Banner release gives no oncology-specific denominator, independent evaluation or patient-outcome result. The service is offered through a demo; a public per-user price or source-code licence is not stated on the checked product page. Its input is real longitudinal health records, so hospital governance and access matter.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) offers free public access, MIT-licensed code, inspectable rules and source-cited oncology knowledge. Its structured case tools draft discussion material; they do not abstract hospital charts into registry submissions, and clinical validation remains pending. Layer’s chart extraction and OpenOnco’s transparent draft workflow address different jobs and could complement each other. Neither source provides a head-to-head comparison of accuracy or patient outcomes. Sources checked 20 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        19 листопада 2026 року Layer Health повідомила, що Banner Health інвестувала в її раунд Series A та розпочала багаторічну співпрацю для понад десятка клінічних реєстрів, зокрема онкологічних. Суму інвестиції не розкрили. Оголошений процес читає структуровані дані й вільний текст лікарняних записів, а запропоновані відповіді для реєстру пов’язує з доказами в медичній карті. Це повідомлення компанії про партнерство та заплановане впровадження, а не виміряне поліпшення онкологічної допомоги.
    - type: p
      text: >-
        Сторінка продукту Layer описує відповіді, запропоновані AI й перевірені працівниками реєстру, та валідацію на даних кожної лікарні перед використанням. Вона рекламує показники швидкості й точності, але оголошення Banner не наводить чисельності вибірки для онкології, незалежної оцінки чи результатів для пацієнтів. Доступ пропонують через демонстрацію; публічної ціни за користувача або ліцензії вихідного коду на перевіреній сторінці немає. Вхідні дані — реальні медичні записи за тривалий період, тому важливі лікарняне врядування й контроль доступу.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) надає безкоштовний публічний доступ, код за ліцензією MIT, відкриті для перевірки правила та онкологічні знання з посиланнями на джерела. Його інструменти за структурованими даними випадку створюють чернетки для обговорення; вони не переносять лікарняні карти до реєстрів, а клінічна валідація ще не завершена. Витяг даних Layer і прозорі чернетки OpenOnco вирішують різні завдання та можуть доповнюватися. Жодне джерело не містить прямого порівняння точності чи результатів для пацієнтів. Джерела перевірено 20 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Banner respalda el trabajo de Layer Health con registros clínicos, incluidos los oncológicos'
    summary: 'La inversión y el despliegue previstos son noticias empresariales, no resultados medidos en pacientes con cáncer. Así se diferencia de OpenOnco.'
    body:
      - type: p
        text: >-
          El 19 de noviembre de 2026, Layer Health anunció que Banner Health había invertido en su ronda Series A e iniciado un acuerdo plurianual para más de una docena de registros clínicos, incluidos los oncológicos. No se reveló el importe. El proceso anunciado lee datos estructurados y texto libre de historiales hospitalarios y vincula las respuestas propuestas para el registro con pruebas de la historia clínica. Es un anuncio empresarial sobre una alianza y un despliegue previsto, no una mejora medida en la atención del cáncer.
      - type: p
        text: >-
          La página del producto describe respuestas sugeridas por IA y revisadas por el personal del registro, con validación sobre los datos de cada hospital antes de su uso. Publicita cifras de rapidez y precisión, pero el comunicado de Banner no aporta un denominador específico de oncología, una evaluación independiente ni resultados en pacientes. Se accede mediante una demostración; la página consultada no indica precio público por usuario ni licencia del código fuente. Utiliza historiales longitudinales reales, por lo que importan la gobernanza y el control de acceso del hospital.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) ofrece acceso público gratuito, código con licencia MIT, reglas inspeccionables y conocimiento oncológico con fuentes. Sus herramientas crean borradores de discusión a partir de datos estructurados de un caso; no convierten historias hospitalarias en envíos a registros y su validación clínica sigue pendiente. La extracción de Layer y los borradores transparentes de OpenOnco cumplen funciones distintas y pueden complementarse. Ninguna fuente ofrece una comparación directa de precisión o resultados en pacientes. Fuentes verificadas el 20 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Banner apoia o trabalho da Layer Health com registos clínicos, incluindo oncologia'
    summary: 'O investimento e a implementação prevista são notícias empresariais, não resultados medidos em doentes com cancro. Eis a diferença face à OpenOnco.'
    body:
      - type: p
        text: >-
          Em 19 de novembro de 2026, a Layer Health anunciou que a Banner Health investiu na sua ronda Series A e iniciou um acordo plurianual para mais de uma dúzia de registos clínicos, incluindo oncologia. O montante não foi divulgado. O processo anunciado lê dados estruturados e texto livre de registos hospitalares e liga as respostas propostas para o registo às provas no processo clínico. É um anúncio da empresa sobre parceria e implementação prevista, não uma melhoria medida nos cuidados oncológicos.
      - type: p
        text: >-
          A página do produto descreve respostas sugeridas por IA e revistas pela equipa do registo, com validação nos dados de cada hospital antes da utilização. Publicita números de rapidez e precisão, mas o comunicado da Banner não apresenta denominador específico de oncologia, avaliação independente nem resultados em doentes. O serviço é apresentado por demonstração; a página consultada não indica preço público por utilizador nem licença do código-fonte. Usa processos clínicos longitudinais reais, pelo que a governação hospitalar e o controlo de acesso importam.
      - type: p
        text: >-
          A [OpenOnco](/pt/capabilities.html) oferece acesso público gratuito, código sob licença MIT, regras verificáveis e conhecimento oncológico com fontes. As ferramentas criam rascunhos de discussão a partir de dados estruturados de um caso; não transformam processos hospitalares em submissões a registos, e a validação clínica continua pendente. A extração de dados da Layer e os rascunhos transparentes da OpenOnco tratam de tarefas diferentes e podem complementar-se. Nenhuma fonte apresenta comparação direta de precisão ou resultados em doentes. Fontes verificadas em 20 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Banner unterstützt Layer Healths Registerarbeit, auch in der Onkologie'
    summary: 'Investition und geplante Einführung sind Geschäftsnachrichten, keine gemessenen Verbesserungen für Krebspatienten. So unterscheidet sich OpenOnco.'
    body:
      - type: p
        text: >-
          Am 19. November 2026 teilte Layer Health mit, dass Banner Health in seine Series-A-Runde investiert und eine mehrjährige Vereinbarung für mehr als ein Dutzend klinische Register begonnen habe, darunter onkologische Register. Der Betrag wurde nicht genannt. Der angekündigte Ablauf liest strukturierte Daten und Freitext aus Krankenhausakten und verknüpft vorgeschlagene Registerantworten mit Belegen aus der Akte. Dies ist eine Unternehmensmeldung über Partnerschaft und geplante Einführung, kein gemessener Fortschritt in der Krebsversorgung.
      - type: p
        text: >-
          Die Produktseite beschreibt KI-Vorschläge, die Registermitarbeitende prüfen, sowie eine Validierung anhand der Daten jedes Krankenhauses vor der Nutzung. Sie bewirbt Geschwindigkeits- und Genauigkeitswerte; die Banner-Mitteilung nennt jedoch weder eine onkologiespezifische Fallzahl noch eine unabhängige Prüfung oder Patientenergebnisse. Der Zugang läuft über eine Demo; ein öffentlicher Preis pro Nutzer oder eine Quellcodelizenz steht auf der geprüften Seite nicht. Eingaben sind echte longitudinale Gesundheitsakten, weshalb Krankenhausaufsicht und Zugriffsrechte wichtig sind.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) bietet kostenlosen öffentlichen Zugang, MIT-lizenzierten Code, prüfbare Regeln und onkologisches Wissen mit Quellen. Seine Werkzeuge erstellen Diskussionsentwürfe aus strukturierten Falldaten; sie übertragen keine Krankenhausakten in Register, und die klinische Validierung steht noch aus. Layers Datenextraktion und OpenOncos transparente Entwürfe erfüllen verschiedene Aufgaben und könnten sich ergänzen. Keine der Quellen enthält einen direkten Vergleich von Genauigkeit oder Patientenergebnissen. Quellen geprüft am 20. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Banner soutient les registres de Layer Health, notamment en oncologie'
    summary: 'L’investissement et le déploiement prévu sont des nouvelles commerciales, pas des résultats mesurés chez les patients atteints de cancer. Comparaison avec OpenOnco.'
    body:
      - type: p
        text: >-
          Le 19 novembre 2026, Layer Health a annoncé que Banner Health avait investi dans son tour de série A et commencé un accord pluriannuel portant sur plus d’une douzaine de registres cliniques, dont des registres d’oncologie. Le montant n’a pas été communiqué. Le processus annoncé lit les données structurées et les notes libres des dossiers hospitaliers, puis relie les réponses proposées aux preuves dans le dossier. Il s’agit d’une annonce d’entreprise sur un partenariat et un déploiement prévu, pas d’une amélioration mesurée des soins en cancérologie.
      - type: p
        text: >-
          La page du produit décrit des réponses suggérées par l’IA et vérifiées par le personnel des registres, ainsi qu’une validation sur les données de chaque hôpital avant utilisation. Elle affiche des chiffres de rapidité et de précision, mais l’annonce de Banner ne fournit ni effectif propre à l’oncologie, ni évaluation indépendante, ni résultat pour les patients. L’accès passe par une démonstration ; la page consultée n’indique ni prix public par utilisateur ni licence du code source. Les données d’entrée sont de vrais dossiers longitudinaux, ce qui rend essentiels la gouvernance et les droits d’accès hospitaliers.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) donne un accès public gratuit, un code sous licence MIT, des règles inspectables et des connaissances en oncologie sourcées. Ses outils créent des ébauches de discussion à partir de données structurées d’un cas ; ils ne transforment pas les dossiers hospitaliers en soumissions aux registres, et la validation clinique reste à faire. L’extraction de Layer et les ébauches transparentes d’OpenOnco répondent à des tâches distinctes et peuvent se compléter. Aucune source ne fournit de comparaison directe de précision ou de résultats pour les patients. Sources vérifiées le 20 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Banner sostiene il lavoro di Layer Health sui registri, anche oncologici'
    summary: 'Investimento e introduzione prevista sono notizie aziendali, non esiti misurati nei pazienti oncologici. Ecco la differenza rispetto a OpenOnco.'
    body:
      - type: p
        text: >-
          Il 19 novembre 2026 Layer Health ha annunciato che Banner Health ha investito nel suo round Series A e avviato un accordo pluriennale per oltre una dozzina di registri clinici, compresi quelli oncologici. L’importo non è stato reso noto. Il flusso annunciato legge dati strutturati e testo libero delle cartelle ospedaliere e collega le risposte proposte per il registro alle prove nella cartella. È una comunicazione aziendale su un accordo e un’introduzione prevista, non un miglioramento misurato nell’assistenza oncologica.
      - type: p
        text: >-
          La pagina del prodotto descrive risposte suggerite dall’IA e verificate dagli addetti al registro, con validazione sui dati di ogni ospedale prima dell’uso. Pubblicizza dati di velocità e accuratezza, ma il comunicato su Banner non fornisce un denominatore specifico per l’oncologia, una valutazione indipendente o esiti dei pazienti. Il servizio si presenta tramite demo; la pagina esaminata non indica un prezzo pubblico per utente né una licenza del codice sorgente. Usa cartelle cliniche longitudinali reali, quindi governance e controllo degli accessi ospedalieri contano.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) offre accesso pubblico gratuito, codice con licenza MIT, regole ispezionabili e conoscenze oncologiche con fonti. I suoi strumenti producono bozze di discussione da dati strutturati di un caso; non trasformano cartelle ospedaliere in invii ai registri e la validazione clinica è ancora in sospeso. L’estrazione di Layer e le bozze trasparenti di OpenOnco svolgono compiti diversi e possono integrarsi. Nessuna fonte offre un confronto diretto di accuratezza o esiti dei pazienti. Fonti verificate il 20 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'Banner støtter Layer Healths registerarbejde, også inden for onkologi'
    summary: 'Investeringen og den planlagte udrulning er forretningsnyheder, ikke målte resultater for kræftpatienter. Her er forskellen til OpenOnco.'
    body:
      - type: p
        text: >-
          Den 19. november 2026 meddelte Layer Health, at Banner Health havde investeret i virksomhedens Series A-runde og indledt en flerårig aftale om mere end et dusin kliniske registre, herunder onkologiske. Beløbet blev ikke oplyst. Den annoncerede arbejdsgang læser strukturerede data og fritekst i hospitalsjournaler og knytter foreslåede registersvar til belæg i journalen. Det er en virksomhedsmeddelelse om et partnerskab og en planlagt udrulning, ikke en målt forbedring af kræftbehandling.
      - type: p
        text: >-
          Produktsiden beskriver AI-foreslåede svar, som registermedarbejdere gennemgår, og validering på hvert hospitals data før brug. Den reklamerer med tal for hastighed og nøjagtighed, men Banner-meddelelsen giver hverken et onkologispecifikt datagrundlag, uafhængig evaluering eller patientresultater. Adgang sker via en demo; den gennemgåede side angiver ikke offentlig pris pr. bruger eller kildekodelicens. Input er virkelige journaler over tid, så hospitalets styring og adgangskontrol er vigtige.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) giver gratis offentlig adgang, MIT-licenseret kode, gennemskuelige regler og kildebelagt onkologisk viden. Værktøjerne laver diskussionsudkast ud fra strukturerede sagsdata; de omsætter ikke hospitalsjournaler til registerindberetninger, og klinisk validering mangler endnu. Layers dataudtræk og OpenOncos gennemsigtige udkast løser forskellige opgaver og kan supplere hinanden. Ingen af kilderne giver en direkte sammenligning af nøjagtighed eller patientresultater. Kilder kontrolleret 20. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Banner stöder Layer Healths registerarbete, även inom onkologi'
    summary: 'Investeringen och den planerade utrullningen är affärsnyheter, inte uppmätta resultat för cancerpatienter. Så skiljer sig arbetet från OpenOnco.'
    body:
      - type: p
        text: >-
          Den 19 november 2026 meddelade Layer Health att Banner Health hade investerat i bolagets Series A-runda och inlett ett flerårigt avtal för mer än ett dussin kliniska register, inklusive onkologi. Beloppet offentliggjordes inte. Det beskrivna arbetsflödet läser strukturerade uppgifter och fritext i sjukhusjournaler och länkar föreslagna registersvar till belägg i journalen. Det är ett företagsbesked om ett samarbete och en planerad utrullning, inte en uppmätt förbättring av cancervården.
      - type: p
        text: >-
          Produktsidan beskriver AI-föreslagna svar som registerpersonal granskar samt validering mot varje sjukhus egna data före användning. Den marknadsför siffror för snabbhet och noggrannhet, men Banner-meddelandet ger varken onkologispecifikt underlag, oberoende utvärdering eller patientutfall. Tillgång erbjuds via demo; den granskade sidan anger inget offentligt pris per användare eller någon källkodslicens. Indata är verkliga patientjournaler över tid, så sjukhusens styrning och åtkomstkontroll är viktiga.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) erbjuder gratis offentlig tillgång, MIT-licensierad kod, granskningsbara regler och källbelagd onkologisk kunskap. Verktygen skapar diskussionsutkast från strukturerade falluppgifter; de omvandlar inte sjukhusjournaler till registerrapportering, och klinisk validering återstår. Layers datauttag och OpenOncos öppna utkast löser olika uppgifter och kan komplettera varandra. Ingen källa ger en direkt jämförelse av noggrannhet eller patientutfall. Källor kontrollerade den 20 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Banner støtter Layer Healths registerarbeid, også innen onkologi'
    summary: 'Investeringen og den planlagte utrullingen er forretningsnyheter, ikke målte resultater for kreftpasienter. Slik skiller arbeidet seg fra OpenOnco.'
    body:
      - type: p
        text: >-
          Den 19. november 2026 opplyste Layer Health at Banner Health hadde investert i selskapets Series A-runde og startet en flerårig avtale om mer enn et dusin kliniske registre, blant annet innen onkologi. Beløpet ble ikke oppgitt. Den annonserte arbeidsflyten leser strukturerte data og fritekst i sykehusjournaler og knytter foreslåtte registersvar til dokumentasjon i journalen. Dette er en selskapsmelding om partnerskap og planlagt utrulling, ikke en målt forbedring i kreftomsorgen.
      - type: p
        text: >-
          Produktsiden beskriver AI-foreslåtte svar som registeransatte gjennomgår, og validering på hvert sykehus egne data før bruk. Den markedsfører tall for hastighet og nøyaktighet, men Banner-meldingen gir verken et onkologispesifikt datagrunnlag, uavhengig evaluering eller pasientresultater. Tilgang tilbys via demo; den kontrollerte siden oppgir ingen offentlig pris per bruker eller kildekodelisens. Inndata er virkelige pasientjournaler over tid, så sykehusenes styring og tilgangskontroll er viktige.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) gir gratis offentlig tilgang, MIT-lisensiert kode, etterprøvbare regler og kildebelagt onkologisk kunnskap. Verktøyene lager diskusjonsutkast fra strukturerte saksdata; de gjør ikke sykehusjournaler om til registerinnsendinger, og klinisk validering gjenstår. Layers datauttrekk og OpenOncos åpne utkast løser ulike oppgaver og kan utfylle hverandre. Ingen kilde gir en direkte sammenligning av nøyaktighet eller pasientresultater. Kilder kontrollert 20. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Banner tukee Layer Healthin rekisterityötä myös onkologiassa'
    summary: 'Sijoitus ja suunniteltu käyttöönotto ovat liiketoimintauutisia, eivät mitattuja hyötyjä syöpäpotilaille. Näin työ eroaa OpenOncosta.'
    body:
      - type: p
        text: >-
          Layer Health ilmoitti 19. marraskuuta 2026, että Banner Health oli sijoittanut sen Series A -rahoituskierrokseen ja aloittanut monivuotisen sopimuksen yli tusinan kliinisen rekisterin, myös onkologisten, osalta. Summaa ei kerrottu. Kuvattu työnkulku lukee sairauskertomusten rakenteisia tietoja ja vapaata tekstiä ja liittää ehdotetut rekisterivastaukset potilasasiakirjojen näyttöön. Kyse on yrityksen tiedotteesta, kumppanuudesta ja suunnitellusta käyttöönotosta, ei mitatusta syövänhoidon paranemisesta.
      - type: p
        text: >-
          Tuotesivu kuvaa tekoälyn ehdottamia vastauksia, jotka rekisterihenkilöstö tarkistaa, sekä validointia kunkin sairaalan tiedoilla ennen käyttöä. Sivu mainostaa nopeus- ja tarkkuuslukuja, mutta Banner-tiedote ei anna onkologian otoskokoa, riippumatonta arviointia eikä potilastuloksia. Palveluun tutustutaan demon kautta; tarkistetulla sivulla ei ilmoiteta julkista käyttäjäkohtaista hintaa tai lähdekoodilisenssiä. Syötteenä on todellisia pitkittäisiä potilastietoja, joten sairaalan hallinta ja käyttöoikeudet ovat tärkeitä.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) tarjoaa maksuttoman julkisen käytön, MIT-lisensoidun koodin, tarkastettavat säännöt ja lähteistettyä onkologista tietoa. Sen työkalut laativat keskusteluluonnoksia rakenteisista tapaustiedoista; ne eivät muuta sairauskertomuksia rekisteri-ilmoituksiksi, eikä kliinistä validointia ole vielä tehty. Layerin tiedonpoiminta ja OpenOncon läpinäkyvät luonnokset palvelevat eri tehtäviä ja voivat täydentää toisiaan. Lähteissä ei ole suoraa vertailua tarkkuudesta tai potilastuloksista. Lähteet tarkistettu 20. marraskuuta 2026. Artikkeli ei korvaa lääkäriä.
