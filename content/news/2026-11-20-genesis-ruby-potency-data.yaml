slug: genesis-ruby-potency-data
date: 2026-11-20
published: 2026-11-23
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, drug-discovery, open-data, evidence]
title:
  en: 'Genesis opens potency data; Ruby has not shown a patient benefit'
  uk: 'Genesis відкриває дані про активність молекул; користь Ruby для пацієнтів ще не доведено'
summary:
  en: 'The public dataset lists 5,410,616 records with source provenance. Ruby benchmarks address laboratory prediction, not cancer treatment outcomes.'
  uk: 'Відкритий набір містить 5 410 616 записів із походженням джерел. Тести Ruby оцінюють лабораторні прогнози, а не результати лікування раку.'
sources:
  - citation: 'Genesis Molecular AI. Ruby and dataset announcement, dated 20 November 2026. Checked 23 November 2026.'
    id: https://www.genesis.ml/news/introducing-ruby-state-of-the-art-potency-prediction-across-discovery-regimes
  - citation: 'Genesis Molecular AI. GenesisPotency-2026 dataset README, row count, provenance, intended use and CC BY-SA 4.0 licence. Checked 23 November 2026.'
    id: https://github.com/Genesis-Molecular-AI/genesis-potency-dataset
  - citation: 'OpenOnco. Project scope and clinical limitations, version 8ff7b76b. Checked 23 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/8ff7b76bc50e771c42dddd823050620f55a61f3a/README.md
  - citation: 'OpenOnco. MIT code licence, version 8ff7b76b. Checked 23 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/8ff7b76bc50e771c42dddd823050620f55a61f3a/LICENSE
body:
  en:
    - type: p
      text: >-
        On 20 November 2026, Genesis Molecular AI announced Ruby, a model for predicting how strongly small molecules act on protein targets, and released part of its training data. The public [GenesisPotency-2026 dataset](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) is licensed CC BY-SA 4.0 and links measurements back to ChEMBL, BindingDB or PubChem records. Its README counts **5,410,616 rows**, whereas the launch blog says 5.6 million. The dataset is free to download; the repository does not provide Ruby model weights or a public price for Ruby.
    - type: p
      text: >-
        Genesis reports that Ruby reached an average Spearman correlation of **0.61 across eight assays from five Genesis–Incyte drug-discovery programs** without prior measurements from those assays. This is the company's own evaluation, alongside public benchmarks, not an independent clinical trial. Predicting molecular potency can help researchers choose compounds to test; it does not establish that a medicine treats cancer in people. The dataset README explicitly says it is not for clinical or diagnostic decisions.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) is free to read and publishes MIT-licensed code, inspectable rules and cited oncology knowledge for synthetic case drafts. It does not predict protein–ligand potency or develop new medicines. Genesis's public assay data and OpenOnco's source-linked clinical knowledge serve different stages of research and care; neither has a direct accuracy or patient-outcome comparison with the other. Sources checked 23 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        20 листопада 2026 року Genesis Molecular AI представила Ruby — модель для прогнозування активності малих молекул щодо білкових мішеней — і відкрила частину даних для її навчання. Публічний [набір GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) має ліцензію CC BY-SA 4.0 та пов’язує вимірювання із записами ChEMBL, BindingDB або PubChem. У README зазначено **5 410 616 записів**, тоді як у повідомленні про запуск — 5,6 млн. Набір можна завантажити безкоштовно; репозиторій не містить ваг моделі Ruby чи публічної ціни її використання.
    - type: p
      text: >-
        За даними Genesis, Ruby досягла середньої кореляції Спірмена **0,61 у восьми аналізах із п’яти програм розробки ліків Genesis та Incyte**, не маючи попередніх вимірювань із цих аналізів. Це оцінка самої компанії разом із публічними тестами, а не незалежне клінічне дослідження. Прогноз активності молекули може допомогти дослідникам вибрати сполуки для перевірки, але не доводить, що препарат лікує рак у людей. README прямо застерігає: набір не призначений для клінічних чи діагностичних рішень.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) доступний безкоштовно та публікує код за ліцензією MIT, перевірювані правила й онкологічні знання з джерелами для чернеток за вигаданими випадками. Він не прогнозує активності молекул щодо білків і не розробляє нових ліків. Відкриті дані аналізів Genesis і знання OpenOnco з посиланнями на джерела потрібні на різних етапах досліджень і допомоги; прямого порівняння точності чи результатів для пацієнтів немає. Джерела перевірено 23 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Genesis abre datos de potencia; Ruby aún no ha demostrado beneficio para pacientes'
    summary: 'El conjunto público enumera 5 410 616 registros con procedencia. Las pruebas de Ruby miden predicción de laboratorio, no resultados del tratamiento del cáncer.'
    body:
      - type: p
        text: >-
          El 20 de noviembre de 2026, Genesis Molecular AI anunció Ruby, un modelo que predice la potencia de moléculas pequeñas frente a proteínas diana, y publicó parte de sus datos de entrenamiento. El [conjunto GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) tiene licencia CC BY-SA 4.0 y enlaza las mediciones con registros de ChEMBL, BindingDB o PubChem. Su README cuenta **5 410 616 filas**, mientras que el anuncio dice 5,6 millones. El conjunto se descarga gratis; el repositorio no ofrece los pesos del modelo Ruby ni un precio público para usarlo.
      - type: p
        text: >-
          Genesis comunica que Ruby obtuvo una correlación media de Spearman de **0,61 en ocho ensayos de cinco programas de descubrimiento de fármacos de Genesis e Incyte**, sin mediciones previas de esos ensayos. Es una evaluación de la propia empresa, junto con pruebas públicas, no un ensayo clínico independiente. Predecir la potencia molecular puede ayudar a elegir compuestos para estudiar; no demuestra que un medicamento trate el cáncer en personas. El README señala expresamente que el conjunto no está destinado a decisiones clínicas o diagnósticas.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) se consulta gratis y publica código MIT, reglas examinables y conocimiento oncológico con fuentes para borradores de casos ficticios. No predice potencia entre proteínas y moléculas ni desarrolla medicamentos. Los datos de ensayos de Genesis y el conocimiento clínico con fuentes de OpenOnco sirven a etapas distintas; no existe comparación directa de precisión o resultados en pacientes. Fuentes comprobadas el 23 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Genesis abre dados de potência; Ruby ainda não demonstrou benefício para doentes'
    summary: 'O conjunto público lista 5 410 616 registos com proveniência. Os testes de Ruby medem previsões laboratoriais, não resultados do tratamento do cancro.'
    body:
      - type: p
        text: >-
          Em 20 de novembro de 2026, a Genesis Molecular AI anunciou Ruby, um modelo que prevê a potência de pequenas moléculas perante proteínas-alvo, e publicou parte dos seus dados de treino. O [conjunto GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) tem licença CC BY-SA 4.0 e liga medições a registos ChEMBL, BindingDB ou PubChem. O README conta **5 410 616 linhas**, enquanto o anúncio refere 5,6 milhões. O conjunto pode ser descarregado gratuitamente; o repositório não fornece os pesos do modelo Ruby nem um preço público para o usar.
      - type: p
        text: >-
          A Genesis relata uma correlação média de Spearman de **0,61 em oito ensaios de cinco programas de descoberta de fármacos Genesis–Incyte**, sem medições prévias desses ensaios. Trata-se de uma avaliação da empresa, juntamente com testes públicos, e não de um ensaio clínico independente. Prever a potência molecular pode ajudar a escolher compostos para testar; não prova que um medicamento trate cancro em pessoas. O README diz explicitamente que o conjunto não se destina a decisões clínicas ou diagnósticas.
      - type: p
        text: >-
          A [OpenOnco](/pt/capabilities.html) é gratuita para leitura e publica código MIT, regras verificáveis e conhecimento oncológico com fontes para rascunhos de casos fictícios. Não prevê potência proteína–ligando nem desenvolve medicamentos. Os dados de ensaios da Genesis e o conhecimento clínico com fontes da OpenOnco servem etapas diferentes; não há comparação direta de exatidão ou resultados em doentes. Fontes verificadas em 23 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Genesis öffnet Wirkstärkedaten; ein Patientennutzen von Ruby ist nicht gezeigt'
    summary: 'Der öffentliche Datensatz enthält 5.410.616 Einträge mit Herkunftsangaben. Ruby-Tests betreffen Laborprognosen, keine Behandlungsergebnisse bei Krebs.'
    body:
      - type: p
        text: >-
          Am 20. November 2026 stellte Genesis Molecular AI Ruby vor, ein Modell zur Vorhersage der Wirkstärke kleiner Moleküle an Protein-Zielstrukturen, und veröffentlichte einen Teil seiner Trainingsdaten. Der öffentliche [Datensatz GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) steht unter CC BY-SA 4.0 und verknüpft Messungen mit ChEMBL-, BindingDB- oder PubChem-Einträgen. Die README zählt **5.410.616 Zeilen**, während der Startbeitrag 5,6 Millionen nennt. Der Datensatz ist kostenlos herunterladbar; das Repository enthält weder Ruby-Modellgewichte noch einen öffentlichen Preis für dessen Nutzung.
      - type: p
        text: >-
          Laut Genesis erreichte Ruby eine mittlere Spearman-Korrelation von **0,61 in acht Assays aus fünf Genesis–Incyte-Programmen zur Wirkstoffsuche**, ohne vorherige Messungen aus diesen Assays. Das ist eine Bewertung des Unternehmens mit öffentlichen Benchmarks, keine unabhängige klinische Studie. Eine Prognose der Molekülwirkung kann Forschern helfen, Verbindungen für Tests auszuwählen; sie beweist nicht, dass ein Arzneimittel Krebs bei Menschen behandelt. Die README schließt klinische und diagnostische Entscheidungen ausdrücklich als Verwendungszweck aus.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) ist kostenlos lesbar und veröffentlicht MIT-lizenzierten Code, prüfbare Regeln und quellenbelegtes onkologisches Wissen für Entwürfe zu fiktiven Fällen. Es sagt keine Protein-Ligand-Wirkstärke voraus und entwickelt keine neuen Arzneimittel. Genesis' Assay-Daten und OpenOncos quellenbezogenes klinisches Wissen dienen unterschiedlichen Phasen; ein direkter Vergleich von Genauigkeit oder Patientenergebnissen liegt nicht vor. Quellen geprüft am 23. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Genesis ouvre ses données de puissance ; le bénéfice de Ruby pour les patients reste inconnu'
    summary: 'Le jeu public compte 5 410 616 lignes avec leur provenance. Les tests de Ruby évaluent des prédictions de laboratoire, pas les résultats des traitements anticancéreux.'
    body:
      - type: p
        text: >-
          Le 20 novembre 2026, Genesis Molecular AI a présenté Ruby, un modèle prédisant la puissance de petites molécules sur des protéines cibles, et publié une partie de ses données d’entraînement. Le [jeu GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) est sous licence CC BY-SA 4.0 et relie les mesures aux fiches ChEMBL, BindingDB ou PubChem. Son README compte **5 410 616 lignes**, tandis que l’annonce en indique 5,6 millions. Le jeu est téléchargeable gratuitement ; le dépôt ne fournit ni les poids du modèle Ruby ni un tarif public pour l’utiliser.
      - type: p
        text: >-
          Genesis annonce une corrélation moyenne de Spearman de **0,61 sur huit essais issus de cinq programmes de découverte de médicaments Genesis–Incyte**, sans mesures antérieures de ces essais. Il s’agit d’une évaluation de l’entreprise avec des tests publics, et non d’un essai clinique indépendant. Prédire la puissance moléculaire peut aider à sélectionner des composés à tester ; cela ne prouve pas qu’un médicament traite le cancer chez l’humain. Le README précise que le jeu n’est pas destiné aux décisions cliniques ou diagnostiques.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) se consulte gratuitement et publie un code sous licence MIT, des règles vérifiables et des connaissances oncologiques sourcées pour des brouillons de cas fictifs. Il ne prédit pas la puissance protéine–ligand et ne développe pas de médicaments. Les données d’essais de Genesis et les connaissances cliniques sourcées d’OpenOnco servent à des étapes distinctes ; aucune comparaison directe de précision ou de résultats pour les patients n’existe. Sources vérifiées le 23 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Genesis apre dati di potenza; Ruby non ha ancora dimostrato benefici per i pazienti'
    summary: 'Il dataset pubblico conta 5.410.616 record con provenienza. I test di Ruby valutano previsioni di laboratorio, non esiti delle cure oncologiche.'
    body:
      - type: p
        text: >-
          Il 20 novembre 2026 Genesis Molecular AI ha presentato Ruby, un modello che prevede la potenza di piccole molecole verso proteine bersaglio, e ha pubblicato parte dei dati usati per addestrarlo. Il [dataset GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) ha licenza CC BY-SA 4.0 e collega le misure ai record ChEMBL, BindingDB o PubChem. Il README conta **5.410.616 righe**, mentre l’annuncio ne indica 5,6 milioni. Il dataset si scarica gratis; il repository non offre i pesi del modello Ruby né un prezzo pubblico per usarlo.
      - type: p
        text: >-
          Genesis riferisce una correlazione media di Spearman di **0,61 in otto saggi di cinque programmi di scoperta di farmaci Genesis–Incyte**, senza misure precedenti di quei saggi. È una valutazione dell’azienda, insieme a benchmark pubblici, non uno studio clinico indipendente. Prevedere la potenza molecolare può aiutare a scegliere composti da testare; non dimostra che un farmaco curi il cancro nelle persone. Il README afferma esplicitamente che il dataset non è destinato a decisioni cliniche o diagnostiche.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) è consultabile gratis e pubblica codice MIT, regole verificabili e conoscenze oncologiche con fonti per bozze su casi inventati. Non prevede la potenza proteina–ligando né sviluppa nuovi farmaci. I dati sperimentali di Genesis e le conoscenze cliniche documentate di OpenOnco servono fasi diverse; non esiste un confronto diretto di accuratezza o esiti nei pazienti. Fonti verificate il 23 novembre 2026. Questo articolo non sostituisce il medico.
  da:
    title: 'Genesis åbner styrkedata; Ruby har ikke påvist patientnytte'
    summary: 'Det offentlige datasæt rummer 5.410.616 poster med kildeoplysninger. Ruby-testene handler om laboratorieforudsigelser, ikke kræftpatienters behandlingsresultater.'
    body:
      - type: p
        text: >-
          Den 20. november 2026 annoncerede Genesis Molecular AI Ruby, en model der forudsiger små molekylers styrke over for proteinmål, og offentliggjorde en del af træningsdataene. Det offentlige [GenesisPotency-2026-datasæt](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) har licensen CC BY-SA 4.0 og forbinder målinger med poster i ChEMBL, BindingDB eller PubChem. README-filen angiver **5.410.616 rækker**, mens lanceringsindlægget angiver 5,6 millioner. Datasættet kan hentes gratis; arkivet indeholder hverken Ruby-modellens vægte eller en offentlig pris for brugen.
      - type: p
        text: >-
          Genesis oplyser en gennemsnitlig Spearman-korrelation på **0,61 i otte assays fra fem Genesis–Incyte-programmer for lægemiddeludvikling**, uden tidligere målinger fra disse assays. Det er virksomhedens egen vurdering sammen med offentlige benchmarks, ikke et uafhængigt klinisk forsøg. Forudsigelse af molekylær styrke kan hjælpe forskere med at vælge forbindelser til test; den viser ikke, at et lægemiddel behandler kræft hos mennesker. README-filen siger udtrykkeligt, at datasættet ikke er beregnet til kliniske eller diagnostiske beslutninger.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) kan læses gratis og udgiver MIT-licenseret kode, efterprøvelige regler og kildebelagt onkologisk viden til udkast om fiktive tilfælde. Det forudsiger ikke protein–ligand-styrke og udvikler ikke nye lægemidler. Genesis' assaydata og OpenOncos kildebelagte kliniske viden bruges på forskellige trin; der findes ingen direkte sammenligning af nøjagtighed eller patientresultater. Kilder kontrolleret 23. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Genesis öppnar potensdata; Ruby har ännu inte visat patientnytta'
    summary: 'Den offentliga datamängden har 5 410 616 poster med källspårning. Ruby-testerna gäller laboratorieprognoser, inte resultat av cancerbehandling.'
    body:
      - type: p
        text: >-
          Den 20 november 2026 presenterade Genesis Molecular AI Ruby, en modell som förutsäger små molekylers potens mot proteinmål, och publicerade en del av träningsdata. Den offentliga [datamängden GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) har licensen CC BY-SA 4.0 och kopplar mätningar till poster i ChEMBL, BindingDB eller PubChem. README-filen anger **5 410 616 rader**, medan lanseringsinlägget anger 5,6 miljoner. Datamängden kan laddas ned gratis; förrådet innehåller varken Ruby-modellens vikter eller ett offentligt pris för användningen.
      - type: p
        text: >-
          Genesis uppger en genomsnittlig Spearman-korrelation på **0,61 i åtta analyser från fem Genesis–Incyte-program för läkemedelsupptäckt**, utan tidigare mätningar från dessa analyser. Det är företagets egen utvärdering tillsammans med offentliga jämförelsetest, inte en oberoende klinisk studie. En prognos av molekylär potens kan hjälpa forskare välja ämnen att testa; den visar inte att ett läkemedel behandlar cancer hos människor. README-filen säger uttryckligen att datamängden inte är avsedd för kliniska eller diagnostiska beslut.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) kan läsas gratis och publicerar MIT-licensierad kod, granskningsbara regler och källbelagd onkologisk kunskap för utkast om fiktiva fall. Det förutsäger inte protein–ligand-potens och utvecklar inte nya läkemedel. Genesis analysdata och OpenOncos källbelagda kliniska kunskap används i olika skeden; ingen direkt jämförelse av noggrannhet eller patientutfall finns. Källor kontrollerade den 23 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Genesis åpner potensdata; Ruby har ikke vist pasientnytte'
    summary: 'Det offentlige datasettet har 5 410 616 poster med kildeinformasjon. Ruby-testene gjelder laboratorieprognoser, ikke resultater av kreftbehandling.'
    body:
      - type: p
        text: >-
          Den 20. november 2026 presenterte Genesis Molecular AI Ruby, en modell som forutsier små molekylers potens mot proteinmål, og offentliggjorde en del av treningsdataene. Det offentlige [datasettet GenesisPotency-2026](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) har lisensen CC BY-SA 4.0 og knytter målinger til poster i ChEMBL, BindingDB eller PubChem. README-filen oppgir **5 410 616 rader**, mens lanseringsinnlegget oppgir 5,6 millioner. Datasettet kan lastes ned gratis; arkivet inneholder verken Ruby-modellens vekter eller en offentlig pris for bruken.
      - type: p
        text: >-
          Genesis oppgir en gjennomsnittlig Spearman-korrelasjon på **0,61 i åtte analyser fra fem Genesis–Incyte-programmer for legemiddeloppdagelse**, uten tidligere målinger fra disse analysene. Dette er selskapets egen evaluering sammen med offentlige referansetester, ikke en uavhengig klinisk studie. Å forutsi molekylær potens kan hjelpe forskere med å velge forbindelser til testing; det viser ikke at et legemiddel behandler kreft hos mennesker. README-filen sier uttrykkelig at datasettet ikke er ment for kliniske eller diagnostiske beslutninger.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) kan leses gratis og publiserer MIT-lisensiert kode, etterprøvbare regler og kildebelagt onkologisk kunnskap til utkast om fiktive tilfeller. Det forutsier ikke protein–ligand-potens og utvikler ikke nye legemidler. Genesis' analysedata og OpenOncos kildebelagte kliniske kunnskap brukes på ulike trinn; det finnes ingen direkte sammenligning av nøyaktighet eller pasientutfall. Kilder kontrollert 23. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Genesis avaa tehotietoja; Rubyn potilashyötyä ei ole osoitettu'
    summary: 'Julkisessa aineistossa on 5 410 616 lähteistettyä tietuetta. Rubyn testit koskevat laboratorioennusteita, eivät syöpähoidon tuloksia.'
    body:
      - type: p
        text: >-
          Genesis Molecular AI esitteli 20. marraskuuta 2026 Rubyn, mallin joka ennustaa pienten molekyylien vaikutusvoimakkuutta proteiinikohteisiin, ja julkaisi osan koulutusaineistostaan. Julkisen [GenesisPotency-2026-aineiston](https://github.com/Genesis-Molecular-AI/genesis-potency-dataset) lisenssi on CC BY-SA 4.0, ja mittaukset on linkitetty ChEMBL-, BindingDB- tai PubChem-tietueisiin. README ilmoittaa **5 410 616 riviä**, kun taas julkistusblogi ilmoittaa 5,6 miljoonaa. Aineiston voi ladata maksutta; repositoriossa ei ole Ruby-mallin painoja eikä sen julkista käyttöhintaa.
      - type: p
        text: >-
          Genesis raportoi keskimääräiseksi Spearmanin korrelaatioksi **0,61 kahdeksassa määrityksessä viidestä Genesis–Incyte-lääkekehitysohjelmasta**, ilman aiempia mittauksia näistä määrityksistä. Se on yhtiön oma arvio julkisten vertailutestien ohella, ei riippumaton kliininen tutkimus. Molekyylin vaikutusvoimakkuuden ennustaminen voi auttaa valitsemaan testattavia yhdisteitä; se ei osoita lääkkeen hoitavan syöpää ihmisillä. README sanoo suoraan, ettei aineistoa ole tarkoitettu kliinisiin tai diagnostisiin päätöksiin.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) on maksutta luettavissa, ja se julkaisee MIT-lisensoidun koodin, tarkastettavat säännöt sekä lähteistettyä onkologista tietoa kuvitteellisten tapausten luonnoksiin. Se ei ennusta proteiini–ligandi-vaikutusvoimakkuutta eikä kehitä uusia lääkkeitä. Genesisin analyysiaineistoa ja OpenOncon lähteistettyä kliinistä tietoa käytetään eri vaiheissa; suoraa tarkkuus- tai potilastulosvertailua ei ole. Lähteet tarkistettu 23. marraskuuta 2026. Artikkeli ei korvaa lääkäriä.
