slug: lind-advocate-cancer-trial-matching
date: 2026-11-20
published: 2026-11-21
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, clinical-trials, oncology, evidence]
title:
  en: 'Lind and Advocate expand cancer-trial matching: agreement is not enrollment'
  uk: 'Lind і Advocate розширюють пошук онкодосліджень: збіг критеріїв ще не означає участі'
summary:
  en: 'A retrospective study found 94.3% agreement on eligibility criteria. The new partnership expands screening work; effects on trial enrollment remain to be shown.'
  uk: 'Ретроспективне дослідження показало 94,3% збігу в оцінці критеріїв. Нове партнерство розширює перевірку; вплив на залучення до досліджень ще належить довести.'
sources:
  - citation: 'Advocate Health. Lind partnership expansion announcement dated 20 November 2026. Checked 21 November 2026.'
    id: https://www.advocatehealth.org/news/lind-deepens-partnership-with-advocate-health
  - citation: 'Lind. Current platform description and source-linked trial screening. Checked 21 November 2026.'
    id: https://www.lind.care/
  - citation: 'Patel JN et al. Expert Validation of an Artificial Intelligence–Enabled Trial Matching Solution Using Real-World Data From Patients With Cancer. JCO Oncology Practice, published 1 June 2026, DOI 10.1200/OP-26-00076. Checked 21 November 2026.'
    id: https://ascopubs.org/doi/10.1200/OP-26-00076
  - citation: 'Lind. Terms of Service, version 10 September 2026; authorized institutional access and matching limits. Checked 21 November 2026.'
    id: https://www.lind.care/terms-of-service/
  - citation: 'OpenOnco. Current scope and clinical limitations, version b6b2b562. Checked 21 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/b6b2b562dcbfc57b1ac0ca1113f33d7fa9450609/README.md
  - citation: 'OpenOnco. MIT code licence, version b6b2b562. Checked 21 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/b6b2b562dcbfc57b1ac0ca1113f33d7fa9450609/LICENSE
body:
  en:
    - type: p
      text: >-
        On 20 November 2026, Lind and Advocate Health announced an expanded partnership focused partly on cancer clinical trials. Lind says its institution-facing platform screens electronic health records against trial criteria, shows source-linked evidence, and leaves enrollment decisions to clinicians and research teams. The expansion covers study feasibility, patient identification, screening, enrollment coordination and portfolio analysis; it is a plan for wider work, not a reported rise in trial enrollment.
    - type: p
      text: >-
        A June 2026 JCO Oncology Practice study coauthored by Lind and health-system researchers reported **94.3% agreement** with expert reviewers at the eligibility-criterion level in a retrospective cancer-data evaluation. That measures matching against reviewed criteria, not whether more people entered trials or benefited from treatment. The study used one health system; incomplete records and complex multi-arm trials limited generalization. Lind’s terms require authorized institutional users and warn that a suggested match does not establish eligibility or an available place. The public site offers a demo, with no public per-user price or source-code licence stated.
    - type: p
      text: >-
        [OpenOnco](/capabilities.html) is free to read, with MIT-licensed code, inspectable rules and cited oncology knowledge. Its structured case tools make discussion drafts; they do not screen hospital records against live trial protocols or coordinate enrollment. Clinical review of OpenOnco content remains pending. Lind’s patient-to-trial workflow and OpenOnco’s public knowledge workflow could complement each other; there is no direct accuracy or patient-outcome comparison. Sources checked 21 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        20 листопада 2026 року Lind і Advocate Health оголосили про розширення партнерства, частково зосередженого на клінічних дослідженнях раку. За описом Lind, її платформа для медичних закладів звіряє електронні медичні записи з критеріями досліджень, показує докази з посиланням на джерело й залишає рішення про участь лікарям та дослідницьким командам. Розширення охоплює оцінку здійсненності досліджень, пошук людей, перевірку критеріїв, координацію залучення й аналіз портфеля. Це план ширшої роботи, а не повідомлення про зростання кількості учасників.
    - type: p
      text: >-
        Дослідження в JCO Oncology Practice від червня 2026 року, співавторами якого були працівники Lind і системи охорони здоров’я, повідомило про **94,3% збігу** з оцінкою експертів на рівні окремих критеріїв відповідності в ретроспективному аналізі онкологічних даних. Це не вимірює, чи більше людей потрапило до досліджень або отримало користь від лікування. Дані походили з однієї системи; неповні записи й складні багатогрупові дослідження обмежують узагальнення. Умови Lind вимагають авторизованого доступу закладу й застерігають, що можливий збіг не доводить відповідності критеріям чи наявності місця. Публічний сайт пропонує демонстрацію, але не вказує ціну за користувача або ліцензію вихідного коду.
    - type: p
      text: >-
        [OpenOnco](/ukr/capabilities.html) доступний безкоштовно, має код за ліцензією MIT, відкриті для перевірки правила й онкологічні знання з джерелами. Його інструменти за структурованими даними випадку готують чернетки для обговорення; вони не звіряють лікарняні записи з чинними протоколами досліджень і не координують набір. Клінічний перегляд матеріалів OpenOnco ще триває. Пошук досліджень Lind і публічний довідник OpenOnco можуть доповнюватися; прямого порівняння точності чи результатів для пацієнтів немає. Джерела перевірено 21 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Lind y Advocate amplían la búsqueda de ensayos oncológicos: coincidencia no es inscripción'
    summary: 'Un estudio retrospectivo encontró un 94,3% de concordancia por criterio de elegibilidad. La alianza amplía el cribado; aún falta demostrar su efecto en la inscripción.'
    body:
      - type: p
        text: >-
          El 20 de noviembre de 2026, Lind y Advocate Health anunciaron la ampliación de su alianza, centrada en parte en ensayos clínicos de cáncer. Según Lind, su plataforma para instituciones compara historias clínicas electrónicas con criterios de los ensayos, muestra pruebas enlazadas a la fuente y deja las decisiones de inscripción a médicos y equipos de investigación. La ampliación incluye viabilidad de estudios, identificación de pacientes, cribado, coordinación de inscripciones y análisis de la cartera. Es un plan de trabajo más amplio, no un aumento demostrado de participantes.
      - type: p
        text: >-
          Un estudio de junio de 2026 en JCO Oncology Practice, firmado por investigadores de Lind y del sistema sanitario, comunicó una **concordancia del 94,3%** con evaluadores expertos a nivel de cada criterio de elegibilidad en un análisis retrospectivo de datos oncológicos. No mide si más personas ingresaron en ensayos ni si obtuvieron beneficio terapéutico. Los datos procedían de un solo sistema; las historias incompletas y los ensayos complejos con varios brazos limitan la generalización. Los términos de Lind exigen usuarios institucionales autorizados y advierten que una posible coincidencia no confirma elegibilidad ni plazas disponibles. El sitio ofrece una demostración, sin precio público por usuario ni licencia del código fuente indicada.
      - type: p
        text: >-
          [OpenOnco](/es/capabilities.html) se consulta gratis y ofrece código con licencia MIT, reglas inspeccionables y conocimiento oncológico con fuentes. Sus herramientas crean borradores de discusión a partir de datos estructurados de un caso; no cotejan historias hospitalarias con protocolos activos ni coordinan inscripciones. La revisión clínica de su contenido sigue pendiente. El flujo de ensayos de Lind y el conocimiento público de OpenOnco pueden complementarse; no existe una comparación directa de precisión o resultados en pacientes. Fuentes verificadas el 21 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Lind e Advocate ampliam a seleção para ensaios oncológicos: correspondência não é inscrição'
    summary: 'Um estudo retrospetivo encontrou 94,3% de concordância por critério de elegibilidade. A parceria amplia a triagem; o efeito nas inscrições ainda não foi demonstrado.'
    body:
      - type: p
        text: >-
          Em 20 de novembro de 2026, a Lind e a Advocate Health anunciaram uma parceria alargada, em parte dedicada a ensaios clínicos de cancro. Segundo a Lind, a sua plataforma institucional compara processos clínicos eletrónicos com critérios dos ensaios, mostra provas ligadas à fonte e deixa as decisões de inscrição aos médicos e equipas de investigação. A expansão abrange viabilidade dos estudos, identificação de doentes, triagem, coordenação da inscrição e análise do portefólio. É um plano de trabalho mais amplo, não um aumento demonstrado de participantes.
      - type: p
        text: >-
          Um estudo de junho de 2026 na JCO Oncology Practice, com coautores da Lind e do sistema de saúde, relatou **94,3% de concordância** com avaliadores especialistas ao nível de cada critério de elegibilidade numa análise retrospetiva de dados oncológicos. Não mede se mais pessoas entraram em ensaios nem se beneficiaram de tratamento. Os dados vieram de um único sistema; registos incompletos e ensaios complexos com vários braços limitam a generalização. Os termos da Lind exigem utilizadores institucionais autorizados e alertam que uma correspondência possível não confirma elegibilidade nem vagas disponíveis. O site oferece demonstração, sem preço público por utilizador ou licença de código-fonte indicada.
      - type: p
        text: >-
          A [OpenOnco](/pt/capabilities.html) é gratuita para leitura e disponibiliza código MIT, regras verificáveis e conhecimento oncológico com fontes. As suas ferramentas criam rascunhos de discussão a partir de dados estruturados de um caso; não comparam processos hospitalares com protocolos ativos nem coordenam inscrições. A revisão clínica do conteúdo da OpenOnco ainda está pendente. O fluxo de ensaios da Lind e o conhecimento público da OpenOnco podem complementar-se; não há comparação direta de precisão ou resultados em doentes. Fontes verificadas em 21 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Lind und Advocate erweitern die Suche nach Krebsstudien: Treffer ist keine Aufnahme'
    summary: 'Eine retrospektive Studie fand 94,3 % Übereinstimmung je Eignungskriterium. Die Partnerschaft erweitert das Screening; ein Effekt auf die Aufnahme in Studien ist noch nicht gezeigt.'
    body:
      - type: p
        text: >-
          Am 20. November 2026 kündigten Lind und Advocate Health eine erweiterte Partnerschaft an, die sich teilweise auf klinische Krebsstudien konzentriert. Laut Lind gleicht seine Plattform für Einrichtungen elektronische Patientenakten mit Studienkriterien ab, zeigt verlinkte Belege und überlässt Entscheidungen über die Aufnahme Ärzten und Forschungsteams. Die Erweiterung umfasst Studienplanung, Patientensuche, Screening, Koordination der Aufnahme und Portfolioanalyse. Das ist ein Plan für breitere Arbeit, kein gemeldeter Anstieg der Studienteilnahme.
      - type: p
        text: >-
          Eine im Juni 2026 in JCO Oncology Practice veröffentlichte Studie mit Mitautoren von Lind und dem Gesundheitssystem berichtete in einer retrospektiven Auswertung von Krebsdaten über **94,3 % Übereinstimmung** mit Fachprüfern auf Ebene einzelner Eignungskriterien. Sie misst weder, ob mehr Menschen in Studien aufgenommen wurden, noch einen Behandlungsnutzen. Die Daten stammten aus einem Gesundheitssystem; unvollständige Akten und komplexe Studien mit mehreren Armen begrenzen die Übertragbarkeit. Linds Nutzungsbedingungen verlangen autorisierte institutionelle Nutzer und warnen, dass ein möglicher Treffer weder Eignung noch einen freien Studienplatz bestätigt. Die öffentliche Seite bietet eine Demo, nennt aber keinen Preis pro Nutzer und keine Quellcodelizenz.
      - type: p
        text: >-
          [OpenOnco](/de/capabilities.html) ist kostenlos lesbar und bietet MIT-lizenzierten Code, prüfbare Regeln und onkologisches Wissen mit Quellen. Seine Werkzeuge erstellen Diskussionsentwürfe aus strukturierten Falldaten; sie gleichen keine Krankenhausakten mit aktiven Studienprotokollen ab und koordinieren keine Aufnahme. Die klinische Prüfung seiner Inhalte steht noch aus. Linds Studienabgleich und OpenOncos öffentliches Wissen können sich ergänzen; ein direkter Vergleich von Genauigkeit oder Patientenergebnissen fehlt. Quellen geprüft am 21. November 2026. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Lind et Advocate élargissent la recherche d’essais : correspondance ne veut pas dire inclusion'
    summary: 'Une étude rétrospective a trouvé 94,3 % de concordance par critère d’éligibilité. Le partenariat élargit le repérage ; l’effet sur les inclusions reste à démontrer.'
    body:
      - type: p
        text: >-
          Le 20 novembre 2026, Lind et Advocate Health ont annoncé l’élargissement de leur partenariat, consacré en partie aux essais cliniques sur le cancer. Selon Lind, sa plateforme destinée aux établissements compare les dossiers médicaux électroniques aux critères des essais, montre les preuves liées aux sources et laisse les décisions d’inclusion aux médecins et aux équipes de recherche. L’extension couvre la faisabilité, l’identification des patients, la présélection, la coordination des inclusions et l’analyse du portefeuille. Il s’agit d’un projet de travail élargi, pas d’une hausse mesurée des inclusions.
      - type: p
        text: >-
          Une étude de juin 2026 dans JCO Oncology Practice, cosignée par Lind et des chercheurs du système de santé, a rapporté **94,3 % de concordance** avec des experts pour chaque critère d’éligibilité dans une analyse rétrospective de données oncologiques. Cela ne mesure ni le nombre de personnes finalement incluses ni un bénéfice thérapeutique. Les données provenaient d’un seul système ; dossiers incomplets et essais complexes à plusieurs bras limitent la généralisation. Les conditions de Lind exigent des utilisateurs institutionnels autorisés et rappellent qu’une correspondance possible ne confirme ni l’éligibilité ni une place disponible. Le site propose une démonstration sans afficher de prix par utilisateur ni de licence du code source.
      - type: p
        text: >-
          [OpenOnco](/fr/capabilities.html) se consulte gratuitement et offre un code sous licence MIT, des règles inspectables et des connaissances oncologiques sourcées. Ses outils créent des ébauches de discussion à partir de données structurées d’un cas ; ils ne comparent pas les dossiers hospitaliers aux protocoles actifs et ne coordonnent pas les inclusions. La révision clinique de son contenu reste à faire. Le repérage de Lind et les connaissances publiques d’OpenOnco peuvent se compléter ; aucune comparaison directe de précision ou de résultats chez les patients n’existe. Sources vérifiées le 21 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Lind e Advocate ampliano la ricerca di studi oncologici: una corrispondenza non è un arruolamento'
    summary: 'Uno studio retrospettivo ha trovato il 94,3% di concordanza per criterio di idoneità. La collaborazione amplia lo screening; l’effetto sugli arruolamenti resta da dimostrare.'
    body:
      - type: p
        text: >-
          Il 20 novembre 2026 Lind e Advocate Health hanno annunciato l’ampliamento della collaborazione, in parte dedicata agli studi clinici oncologici. Secondo Lind, la piattaforma per le strutture sanitarie confronta le cartelle elettroniche con i criteri degli studi, mostra prove collegate alle fonti e lascia le decisioni di arruolamento a medici e gruppi di ricerca. L’estensione comprende fattibilità degli studi, individuazione dei pazienti, screening, coordinamento dell’arruolamento e analisi del portafoglio. È un piano di lavoro più ampio, non un aumento documentato delle iscrizioni.
      - type: p
        text: >-
          Uno studio pubblicato nel giugno 2026 su JCO Oncology Practice, firmato anche da ricercatori di Lind e del sistema sanitario, ha riportato **il 94,3% di concordanza** con valutatori esperti a livello dei singoli criteri di idoneità in un’analisi retrospettiva di dati oncologici. Non misura se più persone siano entrate negli studi o abbiano beneficiato delle cure. I dati provenivano da un solo sistema; cartelle incomplete e studi complessi con più bracci limitano la generalizzabilità. I termini di Lind richiedono utenti istituzionali autorizzati e avvertono che una possibile corrispondenza non conferma idoneità o disponibilità di posti. Il sito offre una demo senza indicare prezzo per utente o licenza del codice sorgente.
      - type: p
        text: >-
          [OpenOnco](/it/capabilities.html) è consultabile gratuitamente e offre codice con licenza MIT, regole verificabili e conoscenze oncologiche con fonti. Gli strumenti creano bozze di discussione da dati strutturati di un caso; non confrontano cartelle ospedaliere con protocolli attivi né coordinano l’arruolamento. La revisione clinica dei contenuti è ancora in sospeso. Il confronto paziente-studio di Lind e la conoscenza pubblica di OpenOnco possono integrarsi; manca un confronto diretto di accuratezza o esiti dei pazienti. Fonti verificate il 21 novembre 2026. Questo articolo non sostituisce un medico.
  da:
    title: 'Lind og Advocate udvider søgning efter kræftforsøg: et match er ikke optagelse'
    summary: 'Et retrospektivt studie fandt 94,3 % enighed om enkelte egnethedskriterier. Partnerskabet udvider screeningen; effekten på optagelse er endnu ikke vist.'
    body:
      - type: p
        text: >-
          Den 20. november 2026 annoncerede Lind og Advocate Health et udvidet samarbejde, som delvis handler om kliniske kræftforsøg. Ifølge Lind sammenholder platformen for sundhedsinstitutioner elektroniske patientjournaler med forsøgskriterier, viser kildebelæg og lader læger og forskningsteams træffe beslutninger om optagelse. Udvidelsen omfatter forsøgsplanlægning, identifikation af patienter, screening, koordinering af optagelse og porteføljeanalyse. Det er en plan for mere arbejde, ikke en rapporteret stigning i deltagelse.
      - type: p
        text: >-
          Et studie fra juni 2026 i JCO Oncology Practice, med medforfattere fra Lind og sundhedssystemet, rapporterede **94,3 % enighed** med eksperter på niveauet for enkelte egnethedskriterier i en retrospektiv analyse af kræftdata. Det måler ikke, om flere kom ind i forsøg eller fik gavn af behandling. Data kom fra ét sundhedssystem; ufuldstændige journaler og komplekse forsøg med flere arme begrænser generaliseringen. Linds vilkår kræver autoriserede institutionsbrugere og advarer om, at et muligt match hverken beviser egnethed eller en ledig plads. Den offentlige side tilbyder demo uden angivet pris pr. bruger eller kildekodelicens.
      - type: p
        text: >-
          [OpenOnco](/da/capabilities.html) er gratis at læse og tilbyder MIT-licenseret kode, gennemskuelige regler og kildebelagt onkologisk viden. Værktøjerne laver diskussionsudkast fra strukturerede sagsdata; de sammenholder ikke hospitalsjournaler med aktive forsøgsprotokoller og koordinerer ikke optagelse. Klinisk gennemgang af indholdet mangler endnu. Linds patient-forsøg-match og OpenOncos offentlige viden kan supplere hinanden; der findes ingen direkte sammenligning af nøjagtighed eller patientresultater. Kilder kontrolleret 21. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Lind och Advocate utökar sökning efter cancerstudier: träff är inte inskrivning'
    summary: 'En retrospektiv studie fann 94,3 % överensstämmelse per behörighetskriterium. Samarbetet utökar sållningen; effekten på inskrivning återstår att visa.'
    body:
      - type: p
        text: >-
          Den 20 november 2026 meddelade Lind och Advocate Health att samarbetet utökas med delvis fokus på kliniska cancerstudier. Enligt Lind jämför plattformen för vårdgivare elektroniska journaler med studiekriterier, visar källkopplade belägg och lämnar beslut om inskrivning till läkare och forskningsteam. Utökningen gäller studiegenomförbarhet, identifiering av patienter, screening, samordning av inskrivning och portföljanalys. Det är en plan för större verksamhet, inte en rapporterad ökning av studiedeltagandet.
      - type: p
        text: >-
          En studie från juni 2026 i JCO Oncology Practice, med medförfattare från Lind och vårdsystemet, rapporterade **94,3 % överensstämmelse** med expertgranskare för enskilda behörighetskriterier i en retrospektiv analys av cancerdata. Den mäter inte om fler personer skrevs in eller fick behandlingsnytta. Uppgifterna kom från ett enda vårdsystem; ofullständiga journaler och komplexa studier med flera armar begränsar generaliserbarheten. Linds villkor kräver behöriga institutionsanvändare och varnar för att en möjlig träff inte bekräftar behörighet eller ledig plats. Den offentliga sidan erbjuder demo men anger inget användarpris eller någon källkodslicens.
      - type: p
        text: >-
          [OpenOnco](/sv/capabilities.html) är gratis att läsa och har MIT-licensierad kod, granskningsbara regler och källbelagd onkologisk kunskap. Verktygen skapar diskussionsutkast från strukturerade falluppgifter; de jämför inte sjukhusjournaler med aktiva studieprotokoll och samordnar inte inskrivning. Klinisk granskning av innehållet återstår. Linds patient-studiematchning och OpenOncos offentliga kunskap kan komplettera varandra; en direkt jämförelse av noggrannhet eller patientutfall saknas. Källor kontrollerade den 21 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Lind og Advocate utvider søk etter kreftstudier: treff er ikke opptak'
    summary: 'En retrospektiv studie fant 94,3 % samsvar per egnethetskriterium. Partnerskapet utvider screeningen; effekten på opptak er ennå ikke vist.'
    body:
      - type: p
        text: >-
          Den 20. november 2026 kunngjorde Lind og Advocate Health et utvidet samarbeid med delvis fokus på kliniske kreftstudier. Ifølge Lind sammenligner plattformen for helseinstitusjoner elektroniske pasientjournaler med studiekriterier, viser kildekoblet dokumentasjon og lar leger og forskningsteam avgjøre opptak. Utvidelsen omfatter studiegjennomførbarhet, identifisering av pasienter, screening, koordinering av opptak og porteføljeanalyse. Dette er en plan for bredere arbeid, ikke en rapportert økning i studiedeltakelse.
      - type: p
        text: >-
          En studie fra juni 2026 i JCO Oncology Practice, med medforfattere fra Lind og helsesystemet, rapporterte **94,3 % samsvar** med eksperter for hvert egnethetskriterium i en retrospektiv analyse av kreftdata. Det måler ikke om flere kom inn i studier eller fikk behandlingsnytte. Data kom fra ett helsesystem; ufullstendige journaler og komplekse studier med flere armer begrenser overførbarheten. Linds vilkår krever autoriserte institusjonsbrukere og advarer om at et mulig treff verken bekrefter egnethet eller ledig plass. Den offentlige siden tilbyr demo uten oppgitt pris per bruker eller kildekodelisens.
      - type: p
        text: >-
          [OpenOnco](/nb/capabilities.html) er gratis å lese og har MIT-lisensiert kode, etterprøvbare regler og kildebelagt onkologisk kunnskap. Verktøyene lager diskusjonsutkast fra strukturerte saksdata; de sammenligner ikke sykehusjournaler med aktive studieprotokoller og koordinerer ikke opptak. Klinisk gjennomgang av innholdet gjenstår. Linds pasient-studie-matching og OpenOncos offentlige kunnskap kan utfylle hverandre; direkte sammenligning av nøyaktighet eller pasientresultater finnes ikke. Kilder kontrollert 21. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Lind ja Advocate laajentavat syöpätutkimusten hakua: osuma ei ole pääsy tutkimukseen'
    summary: 'Retrospektiivisessä tutkimuksessa kriteerikohtainen yhdenmukaisuus oli 94,3 %. Yhteistyö laajentaa seulontaa; vaikutusta tutkimuksiin osallistumiseen ei ole vielä osoitettu.'
    body:
      - type: p
        text: >-
          Lind ja Advocate Health ilmoittivat 20. marraskuuta 2026 laajentavansa yhteistyötään, joka koskee osin syövän kliinisiä tutkimuksia. Lindin mukaan sen terveydenhuollon organisaatioille tarkoitettu alusta vertaa sähköisiä potilastietoja tutkimuskriteereihin, näyttää lähteisiin linkitetyn näytön ja jättää osallistumispäätökset lääkäreille ja tutkimusryhmille. Laajennus kattaa tutkimusten toteutettavuuden, potilaiden löytämisen, seulonnan, osallistumisen koordinoinnin ja tutkimussalkun analyysin. Kyse on laajemman työn suunnitelmasta, ei raportoidusta osallistujamäärän kasvusta.
      - type: p
        text: >-
          Kesäkuussa 2026 JCO Oncology Practice -lehdessä julkaistu tutkimus, jonka tekijöissä oli Lindin ja terveydenhuoltojärjestelmän edustajia, raportoi **94,3 %:n yhdenmukaisuuden** asiantuntija-arvioihin yksittäisten kelpoisuuskriteerien tasolla syöpäaineiston retrospektiivisessä analyysissä. Se ei mittaa, pääsikö useampi tutkimukseen tai hyötyikö hoidosta. Tiedot tulivat yhdestä järjestelmästä; puutteelliset tiedot ja monimutkaiset monihaaraiset tutkimukset rajoittavat yleistettävyyttä. Lindin ehdot edellyttävät valtuutettuja organisaatiokäyttäjiä ja varoittavat, ettei mahdollinen osuma vahvista kelpoisuutta tai vapaata paikkaa. Julkinen sivu tarjoaa esittelyn, mutta ei ilmoita käyttäjäkohtaista hintaa tai lähdekoodilisenssiä.
      - type: p
        text: >-
          [OpenOnco](/fi/capabilities.html) on maksutta luettavissa ja tarjoaa MIT-lisensoitua koodia, tarkastettavat säännöt ja lähteistettyä onkologista tietoa. Sen työkalut tekevät keskusteluluonnoksia rakenteisista tapaustiedoista; ne eivät vertaa sairauskertomuksia aktiivisiin tutkimussuunnitelmiin tai koordinoi osallistumista. Sisällön kliininen arviointi on kesken. Lindin potilas-tutkimus-vastaavuus ja OpenOncon julkinen tietopohja voivat täydentää toisiaan; suoraa vertailua tarkkuudesta tai potilastuloksista ei ole. Lähteet tarkistettu 21. marraskuuta 2026. Artikkeli ei korvaa lääkäriä.
