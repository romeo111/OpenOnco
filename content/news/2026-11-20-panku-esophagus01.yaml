title:
  en: 'PANKU-Esophagus01: longer survival, with more severe toxicity'
  uk: 'PANKU-Esophagus01: довше виживання, але більше тяжких побічних явищ'
summary:
  en: 'A 497-person randomized trial reported median overall survival of 9.79 versus 7.20 months; severe treatment-related events affected 85.1% versus 59.3%.'
  uk: 'У рандомізованому дослідженні за участю 497 людей медіана загального виживання становила 9,79 проти 7,20 місяця; тяжкі пов’язані з лікуванням явища — 85,1% проти 59,3%.'
