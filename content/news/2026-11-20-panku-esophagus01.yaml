body:
  en:
    - type: p
      text: >-
        Published on 12 November 2026, PANKU-Esophagus01 was an open-label, randomized phase 3 trial at 80 Chinese hospitals. It enrolled 497 people with recurrent or metastatic esophageal squamous cell carcinoma after progression on first-line PD-1/PD-L1 immunotherapy plus platinum chemotherapy. Of these, 249 were assigned izalontamab brengitecan and 248 physician-selected irinotecan, paclitaxel or docetaxel.
    - type: p
      text: >-
        At the interim analysis, median progression-free survival was 4.17 versus 1.97 months; median overall survival was 9.79 versus 7.20 months. These are medians, not predicted survival for an individual. Grade 3 or higher treatment-related adverse events occurred in 212/249 (85.1%) versus 147/248 (59.3%), mainly blood-related. The survival signal is real in this comparison, but so is the extra toxicity. Open-label design, interim follow-up and recruitment only in China limit generalization; 90.1% of participants were men.
    - type: p
      text: >-
        Tumor Board perspective, without a live run: for a wholly fictional person with this cancer after the specified first-line treatment, a discussion draft should separate trial eligibility, survival and toxicity. OpenOnco's current second-line esophageal algorithm has routes gated on no prior first-line immunotherapy, so it cannot be presented as having generated a matching izalontamab path. [OpenOnco Tumor Board](/ask.html) produces drafts, not medical decisions. Sources checked 20 November 2026. This article is not an individual treatment plan and does not replace a doctor.
  uk:
    - type: p
      text: >-
        Опубліковане 12 листопада 2026 року PANKU-Esophagus01 — відкрите рандомізоване дослідження III фази у 80 лікарнях Китаю. У ньому взяли участь 497 людей із рецидивним або метастатичним плоскоклітинним раком стравоходу після прогресування на першій лінії імунотерапії PD-1/PD-L1 із платиновою хімієтерапією. 249 учасникам призначили ізалонтумаб бренгітекан, 248 — обраний лікарем іринотекан, паклітаксел або доцетаксел.
    - type: p
      text: >-
        У проміжному аналізі медіана виживання без прогресування становила 4,17 проти 1,97 місяця, а загального виживання — 9,79 проти 7,20 місяця. Це медіани, а не прогноз для окремої людини. Пов’язані з лікуванням побічні явища 3-го ступеня або тяжчі виникли у 212/249 (85,1%) проти 147/248 (59,3%), переважно з боку крові. Поряд із перевагою у виживанні є й додаткова токсичність. Відкритий дизайн, проміжне спостереження та набір лише в Китаї обмежують узагальнення; 90,1% учасників були чоловіками.
    - type: p
      text: >-
        Погляд Tumor Board, без реального запуску: для цілком вигаданої людини після зазначеної першої лінії чернетка обговорення мала б розділити відповідність критеріям дослідження, виживання й токсичність. Чинний алгоритм OpenOnco для другої лінії раку стравоходу містить маршрути, що вимагають відсутності попередньої імунотерапії у першій лінії; видавати його за згенерований маршрут із ізалонтумабом було б неправдою. [OpenOnco Tumor Board](/ukr/ask.html) створює чернетки, а не медичні рішення. Джерела перевірено 20 листопада 2026 року. Це не індивідуальний план лікування й не заміна лікаря.
translations:
  es:
    title: 'PANKU-Esophagus01: más supervivencia, con más toxicidad grave'
    summary: 'En 497 personas, la mediana de supervivencia global fue de 9,79 frente a 7,20 meses; los eventos graves relacionados con el tratamiento afectaron al 85,1% frente al 59,3%.'
    body:
      - type: p
        text: >-
          Publicado el 12 de noviembre de 2026, PANKU-Esophagus01 fue un ensayo abierto, aleatorizado y de fase 3 en 80 hospitales chinos. Incluyó a 497 personas con carcinoma escamoso de esófago recurrente o metastásico tras progresión con inmunoterapia PD-1/PD-L1 y quimioterapia con platino en primera línea. Se asignó a 249 personas izalontamab brengitecan y a 248 irinotecán, paclitaxel o docetaxel elegidos por su médico.
      - type: p
        text: >-
          En el análisis intermedio, la mediana de supervivencia sin progresión fue de 4,17 frente a 1,97 meses y la de supervivencia global, de 9,79 frente a 7,20 meses. Son medianas, no pronósticos individuales. Los eventos adversos relacionados con el tratamiento de grado 3 o superior ocurrieron en 212/249 (85,1%) frente a 147/248 (59,3%), sobre todo hematológicos. La mayor supervivencia vino acompañada de más toxicidad. El diseño abierto, el seguimiento intermedio y el reclutamiento exclusivo en China limitan la generalización; el 90,1% eran hombres.
      - type: p
        text: >-
          Perspectiva del Tumor Board, sin ejecución real: para una persona totalmente ficticia tras la primera línea indicada, un borrador debería separar elegibilidad, supervivencia y toxicidad. El algoritmo actual de OpenOnco para segunda línea esofágica incluye rutas que requieren no haber recibido inmunoterapia en primera línea; no sería correcto fingir que generó una ruta con izalontamab. [OpenOnco Tumor Board](/es/ask.html) genera borradores, no decisiones médicas. Fuentes verificadas el 20 de noviembre de 2026. Este texto no es un plan individual ni sustituye a un médico.
  pt:
    title: 'PANKU-Esophagus01: maior sobrevivência, mas mais toxicidade grave'
    summary: 'Em 497 pessoas, a sobrevivência global mediana foi de 9,79 contra 7,20 meses; eventos graves relacionados com o tratamento ocorreram em 85,1% contra 59,3%.'
    body:
      - type: p
        text: >-
          Publicado em 12 de novembro de 2026, PANKU-Esophagus01 foi um ensaio aberto, aleatorizado, de fase 3 em 80 hospitais chineses. Incluiu 497 pessoas com carcinoma espinocelular do esófago recorrente ou metastático após progressão com imunoterapia PD-1/PD-L1 e quimioterapia com platina em primeira linha. Foram atribuídas 249 pessoas a izalontamab brengitecan e 248 a irinotecano, paclitaxel ou docetaxel à escolha do médico.
      - type: p
        text: >-
          Na análise interina, a sobrevivência livre de progressão mediana foi de 4,17 contra 1,97 meses e a sobrevivência global mediana de 9,79 contra 7,20 meses. São medianas, não previsões individuais. Eventos adversos relacionados com o tratamento de grau 3 ou superior ocorreram em 212/249 (85,1%) contra 147/248 (59,3%), sobretudo hematológicos. O ganho de sobrevivência veio com mais toxicidade. O desenho aberto, o seguimento interino e o recrutamento apenas na China limitam a generalização; 90,1% eram homens.
      - type: p
        text: >-
          Perspetiva do Tumor Board, sem execução real: para uma pessoa totalmente fictícia após a primeira linha descrita, um rascunho deveria distinguir elegibilidade, sobrevivência e toxicidade. O algoritmo atual da OpenOnco para a segunda linha esofágica contém percursos que exigem ausência de imunoterapia prévia na primeira linha; seria incorreto fingir que gerou um percurso com izalontamab. O [OpenOnco Tumor Board](/pt/ask.html) produz rascunhos, não decisões médicas. Fontes verificadas em 20 de novembro de 2026. Este texto não é um plano individual nem substitui um médico.
  de:
    title: 'PANKU-Esophagus01: längeres Überleben, aber mehr schwere Nebenwirkungen'
    summary: 'Bei 497 Personen betrug das mediane Gesamtüberleben 9,79 gegenüber 7,20 Monaten; schwere behandlungsbedingte Ereignisse traten bei 85,1 % gegenüber 59,3 % auf.'
    body:
      - type: p
        text: >-
          PANKU-Esophagus01 wurde am 12. November 2026 veröffentlicht und war eine offene, randomisierte Phase-3-Studie an 80 chinesischen Kliniken. Eingeschlossen wurden 497 Personen mit rezidiviertem oder metastasiertem Plattenepithelkarzinom der Speiseröhre nach Progress unter einer Erstlinientherapie mit PD-1/PD-L1-Immuntherapie und platinhaltiger Chemotherapie. 249 erhielten Izalontamab Brengitecan, 248 eine ärztlich ausgewählte Chemotherapie mit Irinotecan, Paclitaxel oder Docetaxel.
      - type: p
        text: >-
          In der Zwischenanalyse lag das mediane progressionsfreie Überleben bei 4,17 gegenüber 1,97 Monaten und das mediane Gesamtüberleben bei 9,79 gegenüber 7,20 Monaten. Mediane sind keine individuelle Prognose. Behandlungsbedingte Nebenwirkungen ab Grad 3 traten bei 212/249 (85,1 %) gegenüber 147/248 (59,3 %) auf, überwiegend im Blutbild. Dem Überlebensvorteil steht mehr Toxizität gegenüber. Offenes Design, Zwischenanalyse und ausschließliche Rekrutierung in China schränken die Übertragbarkeit ein; 90,1 % waren Männer.
      - type: p
        text: >-
          Tumor-Board-Perspektive, ohne tatsächlichen Lauf: Für eine völlig fiktive Person nach der genannten Erstlinientherapie müsste ein Diskussionsentwurf Eignung für die Studie, Überleben und Toxizität trennen. Der aktuelle OpenOnco-Algorithmus für die Zweitlinie beim Ösophaguskarzinom enthält Wege, die eine Erstlinie ohne Immuntherapie voraussetzen; einen erzeugten Izalontamab-Pfad zu behaupten wäre falsch. Das [OpenOnco Tumor Board](/de/ask.html) erstellt Entwürfe, keine medizinischen Entscheidungen. Quellen geprüft am 20. November 2026. Dies ist kein individueller Behandlungsplan und ersetzt keinen Arzt.
  fr:
    title: 'PANKU-Esophagus01 : survie prolongée, mais toxicité sévère accrue'
    summary: 'Chez 497 personnes, la survie globale médiane était de 9,79 contre 7,20 mois ; les effets graves liés au traitement concernaient 85,1 % contre 59,3 %.'
    body:
      - type: p
        text: >-
          Publié le 12 novembre 2026, PANKU-Esophagus01 était un essai ouvert, randomisé, de phase 3 mené dans 80 hôpitaux chinois. Il a inclus 497 personnes atteintes d'un carcinome épidermoïde de l'œsophage récidivant ou métastatique après progression sous immunothérapie anti-PD-1/PD-L1 et chimiothérapie à base de platine en première ligne. 249 ont reçu l'izalontamab brengitecan et 248 une chimiothérapie choisie par le médecin : irinotécan, paclitaxel ou docétaxel.
      - type: p
        text: >-
          À l'analyse intermédiaire, la survie sans progression médiane était de 4,17 contre 1,97 mois et la survie globale médiane de 9,79 contre 7,20 mois. Ces médianes ne prédisent pas le devenir individuel. Des effets indésirables liés au traitement de grade 3 ou plus sont survenus chez 212/249 (85,1 %) contre 147/248 (59,3 %), principalement hématologiques. Le bénéfice de survie s'accompagne d'une toxicité accrue. Le plan ouvert, l'analyse intermédiaire et le recrutement limité à la Chine restreignent la généralisation ; 90,1 % des participants étaient des hommes.
      - type: p
        text: >-
          Perspective du Tumor Board, sans exécution réelle : pour une personne entièrement fictive après la première ligne décrite, une ébauche devrait distinguer admissibilité, survie et toxicité. L'algorithme actuel d'OpenOnco pour la deuxième ligne œsophagienne comporte des parcours exigeant l'absence d'immunothérapie en première ligne ; prétendre qu'il a généré un parcours avec l'izalontamab serait inexact. [OpenOnco Tumor Board](/fr/ask.html) produit des ébauches, pas des décisions médicales. Sources vérifiées le 20 novembre 2026. Ce texte n'est pas un plan individuel et ne remplace pas un médecin.
  it:
    title: 'PANKU-Esophagus01: sopravvivenza più lunga, ma più tossicità grave'
    summary: 'In 497 persone, la sopravvivenza globale mediana è stata di 9,79 contro 7,20 mesi; gli eventi gravi correlati al trattamento hanno interessato l’85,1% contro il 59,3%.'
    body:
      - type: p
        text: >-
          Pubblicato il 12 novembre 2026, PANKU-Esophagus01 era uno studio di fase 3, randomizzato e in aperto, condotto in 80 ospedali cinesi. Ha arruolato 497 persone con carcinoma squamocellulare esofageo recidivato o metastatico dopo progressione con immunoterapia PD-1/PD-L1 e chemioterapia al platino in prima linea. A 249 è stato assegnato izalontamab brengitecan e a 248 irinotecan, paclitaxel o docetaxel scelti dal medico.
      - type: p
        text: >-
          Nell'analisi ad interim, la sopravvivenza libera da progressione mediana è stata di 4,17 contro 1,97 mesi e la sopravvivenza globale mediana di 9,79 contro 7,20 mesi. Le mediane non sono prognosi individuali. Eventi avversi correlati al trattamento di grado 3 o superiore si sono verificati in 212/249 (85,1%) contro 147/248 (59,3%), soprattutto ematologici. Al vantaggio di sopravvivenza si accompagna maggiore tossicità. Il disegno in aperto, l'analisi ad interim e il reclutamento solo in Cina limitano la generalizzabilità; il 90,1% erano uomini.
      - type: p
        text: >-
          Prospettiva del Tumor Board, senza esecuzione reale: per una persona del tutto immaginaria dopo la prima linea descritta, una bozza dovrebbe distinguere eleggibilità, sopravvivenza e tossicità. L'attuale algoritmo OpenOnco per la seconda linea esofagea contiene percorsi che richiedono assenza di immunoterapia in prima linea; sarebbe scorretto fingere che abbia generato un percorso con izalontamab. [OpenOnco Tumor Board](/it/ask.html) crea bozze, non decisioni mediche. Fonti verificate il 20 novembre 2026. Questo testo non è un piano individuale e non sostituisce il medico.
  da:
    title: 'PANKU-Esophagus01: længere overlevelse, men flere alvorlige bivirkninger'
    summary: 'Blandt 497 personer var median samlet overlevelse 9,79 mod 7,20 måneder; alvorlige behandlingsrelaterede hændelser ramte 85,1 % mod 59,3 %.'
    body:
      - type: p
        text: >-
          PANKU-Esophagus01 blev offentliggjort 12. november 2026 og var et åbent, randomiseret fase 3-forsøg på 80 kinesiske hospitaler. Det omfattede 497 personer med tilbagevendende eller metastatisk planocellulært kræft i spiserøret efter progression under første linje med PD-1/PD-L1-immunterapi og platinbaseret kemoterapi. 249 fik izalontamab brengitecan, mens 248 fik irinotecan, paclitaxel eller docetaxel efter lægens valg.
      - type: p
        text: >-
          Ved interimsanalysen var median progressionsfri overlevelse 4,17 mod 1,97 måneder og median samlet overlevelse 9,79 mod 7,20 måneder. Medianer er ikke individuelle prognoser. Behandlingsrelaterede bivirkninger af grad 3 eller højere forekom hos 212/249 (85,1 %) mod 147/248 (59,3 %), overvejende blodrelaterede. Overlevelsesfordelen fulgtes af mere toksicitet. Det åbne design, interimsopfølgningen og rekruttering kun i Kina begrænser generaliserbarheden; 90,1 % var mænd.
      - type: p
        text: >-
          Tumor Board-perspektiv, uden faktisk kørsel: For en helt opdigtet person efter den beskrevne første linje bør et diskussionsudkast skelne mellem forsøgsberettigelse, overlevelse og toksicitet. OpenOncos nuværende algoritme for anden linje ved spiserørskræft har forløb, der kræver ingen immunterapi i første linje; det ville være forkert at påstå, at den genererede et izalontamab-forløb. [OpenOnco Tumor Board](/da/ask.html) laver udkast, ikke medicinske beslutninger. Kilder kontrolleret 20. november 2026. Dette er ikke en individuel behandlingsplan og erstatter ikke en læge.
  sv:
    title: 'PANKU-Esophagus01: längre överlevnad, men fler allvarliga biverkningar'
    summary: 'Hos 497 personer var median totalöverlevnad 9,79 jämfört med 7,20 månader; allvarliga behandlingsrelaterade händelser sågs hos 85,1 % jämfört med 59,3 %.'
    body:
      - type: p
        text: >-
          PANKU-Esophagus01 publicerades den 12 november 2026 och var en öppen, randomiserad fas 3-studie vid 80 kinesiska sjukhus. Den omfattade 497 personer med återkommande eller metastaserad skivepitelcancer i matstrupen efter progression med PD-1/PD-L1-immunterapi och platinabaserad cytostatika i första linjen. 249 tilldelades izalontamab brengitecan och 248 läkarvalt irinotekan, paklitaxel eller docetaxel.
      - type: p
        text: >-
          Vid interimsanalysen var median progressionsfri överlevnad 4,17 jämfört med 1,97 månader och median totalöverlevnad 9,79 jämfört med 7,20 månader. Medianer är inte individuella prognoser. Behandlingsrelaterade biverkningar av grad 3 eller högre uppstod hos 212/249 (85,1 %) jämfört med 147/248 (59,3 %), främst blodrelaterade. Överlevnadsvinsten åtföljdes av mer toxicitet. Öppen design, interimuppföljning och rekrytering enbart i Kina begränsar överförbarheten; 90,1 % var män.
      - type: p
        text: >-
          Tumor Board-perspektiv, utan faktisk körning: För en helt påhittad person efter den beskrivna första linjen bör ett diskussionsutkast skilja på studiebehörighet, överlevnad och toxicitet. OpenOncos nuvarande algoritm för andra linjen vid matstrupscancer innehåller vägar som kräver att ingen immunterapi gavs i första linjen; det vore fel att påstå att den skapade en izalontamab-väg. [OpenOnco Tumor Board](/sv/ask.html) ger utkast, inte medicinska beslut. Källor kontrollerade den 20 november 2026. Detta är ingen individuell behandlingsplan och ersätter inte en läkare.
  nb:
    title: 'PANKU-Esophagus01: lengre overlevelse, men flere alvorlige bivirkninger'
    summary: 'Blant 497 personer var median totaloverlevelse 9,79 mot 7,20 måneder; alvorlige behandlingsrelaterte hendelser forekom hos 85,1 % mot 59,3 %.'
    body:
      - type: p
        text: >-
          PANKU-Esophagus01 ble publisert 12. november 2026 og var en åpen, randomisert fase 3-studie ved 80 kinesiske sykehus. Den inkluderte 497 personer med tilbakevendende eller metastatisk plateepitelkreft i spiserøret etter progresjon på førstelinjebehandling med PD-1/PD-L1-immunterapi og platinabasert cellegift. 249 fikk izalontamab brengitecan, mens 248 fikk irinotekan, paklitaksel eller docetaksel valgt av legen.
      - type: p
        text: >-
          Ved interimanalysen var median progresjonsfri overlevelse 4,17 mot 1,97 måneder og median totaloverlevelse 9,79 mot 7,20 måneder. Medianer er ikke individuelle prognoser. Behandlingsrelaterte bivirkninger av grad 3 eller høyere forekom hos 212/249 (85,1 %) mot 147/248 (59,3 %), hovedsakelig blodrelaterte. Overlevelsesgevinsten kom med mer toksisitet. Åpent design, interimoppfølging og rekruttering bare i Kina begrenser overførbarheten; 90,1 % var menn.
      - type: p
        text: >-
          Tumor Board-perspektiv, uten faktisk kjøring: For en helt oppdiktet person etter den beskrevne førstelinjen bør et diskusjonsutkast skille mellom studiedeltakelse, overlevelse og toksisitet. OpenOncos nåværende algoritme for andrelinje ved spiserørskreft har spor som forutsetter ingen immunterapi i første linje; det ville være feil å hevde at den laget et izalontamab-spor. [OpenOnco Tumor Board](/nb/ask.html) lager utkast, ikke medisinske beslutninger. Kilder kontrollert 20. november 2026. Dette er ikke en individuell behandlingsplan og erstatter ikke en lege.
  fi:
    title: 'PANKU-Esophagus01: pidempi elossaolo, mutta enemmän vakavia haittoja'
    summary: '497 osallistujan tutkimuksessa kokonaiselossaolon mediaani oli 9,79 vs. 7,20 kuukautta; vakavia hoitoon liittyviä haittoja esiintyi 85,1 %:lla vs. 59,3 %:lla.'
    body:
      - type: p
        text: >-
          PANKU-Esophagus01 julkaistiin 12. marraskuuta 2026. Se oli avoin, satunnaistettu vaiheen 3 tutkimus 80 kiinalaisessa sairaalassa. Mukana oli 497 ihmistä, joilla oli uusiutunut tai etäpesäkkeinen ruokatorven levyepiteelisyöpä ja tauti oli edennyt ensilinjan PD-1/PD-L1-immunoterapian ja platinapohjaisen solunsalpaajahoidon jälkeen. 249 sai izalontamab brengitecan -lääkettä ja 248 lääkärin valitsemaa irinotekaania, paklitakselia tai dosetakselia.
      - type: p
        text: >-
          Välianalyysissä etenemisvapaan elossaolon mediaani oli 4,17 vs. 1,97 kuukautta ja kokonaiselossaolon mediaani 9,79 vs. 7,20 kuukautta. Mediaanit eivät ennusta yksilön elinaikaa. Hoitoon liittyviä vähintään asteen 3 haittatapahtumia oli 212/249 (85,1 %) vs. 147/248 (59,3 %), pääosin veriarvoihin liittyviä. Elossaolohyödyn rinnalla oli enemmän toksisuutta. Avoin asetelma, välianalyysi ja rekrytointi vain Kiinassa rajoittavat yleistettävyyttä; 90,1 % oli miehiä.
      - type: p
        text: >-
          Tumor Board -näkökulma, ilman todellista ajoa: täysin kuvitteellisen, kuvatun ensilinjan saaneen henkilön keskusteluluonnoksessa olisi erotettava tutkimuskelpoisuus, elossaolo ja toksisuus. OpenOncon nykyisen ruokatorvisyövän toisen linjan algoritmin reitit edellyttävät osin, ettei ensilinjassa käytetty immunoterapiaa; olisi väärin väittää sen luoneen izalontamab-reitin. [OpenOnco Tumor Board](/fi/ask.html) tuottaa luonnoksia, ei lääketieteellisiä päätöksiä. Lähteet tarkistettu 20. marraskuuta 2026. Tämä ei ole yksilöllinen hoitosuunnitelma eikä korvaa lääkäriä.
