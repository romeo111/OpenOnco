  - citation: 'Lu Z et al. PANKU-Esophagus01 randomized phase 3 trial. JAMA, published 12 November 2026; abstract and primary results checked 20 November 2026. DOI 10.1001/jama.2026.20250.'
    id: https://jamanetwork.com/journals/jama/article-abstract/2856710
  - citation: 'ClinicalTrials.gov, PANKU-Esophagus01 registration NCT06304974. Checked 20 November 2026.'
    id: https://clinicaltrials.gov/study/NCT06304974
