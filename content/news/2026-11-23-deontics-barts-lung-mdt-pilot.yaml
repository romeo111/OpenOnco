title:
  en: 'Deontics lung cancer pilot: triage signal needs further testing'
  uk: 'Пілот Deontics при раку легень: сортування ще потребує перевірки'
summary:
  en: In a Barts Health pilot, 344 discussions for 97 patients yielded a possible standard care route for almost one in five
    discussions; patient outcomes remain unproven.
  uk: У пілоті Barts Health 344 обговорення для 97 пацієнтів дали можливий стандартний маршрут майже для кожного п’ятого обговорення;
    вплив на результати лікування не доведений.
