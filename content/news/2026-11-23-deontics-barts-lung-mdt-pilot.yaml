body:
  en:
  - type: p
    text: On 23 November 2026, Barts Health NHS Trust reported a lung cancer multidisciplinary team (MDT) pilot using Deontics
      software. It reviewed 344 discussions involving 97 patients. Almost one in five discussions was flagged as possibly
      suitable for standard care without a full MDT meeting. Where clinicians chose standard care, the software agreed in
      98% of cases; the announcement gives no denominator for that percentage. It flagged 33 people for possible clinical
      trials versus four in MDT records, but a flag does not establish eligibility.
  - type: p
    text: Deontics describes a proprietary platform combining scans, pathology reports, clinical notes and locally authored
      guidance, with electronic record integration or standalone use; no public price is given. An independent 2024 Health
      Technology Wales review found limited peer-reviewed Deontics evidence, uncertain cost effectiveness and no clear improvement
      in patient outcomes for decision-support systems. The new pilot did not report survival, treatment delays or a prospective
      safety comparison. Barts is extending evaluation to breast cancer.
  - type: p
    text: '[OpenOnco](/capabilities.html) is free to read, with MIT-licensed code, inspectable rules and cited knowledge for
      synthetic case drafts; it is not an integrated hospital MDT system and requires clinician review. There is no direct
      accuracy or outcome comparison. Sources checked 24 November 2026. This article does not replace a doctor.'
  uk:
  - type: p
    text: 23 листопада 2026 року Barts Health NHS Trust повідомив про пілот Deontics для мультидисциплінарних консиліумів
      (MDT) щодо раку легень. Проаналізовано 344 обговорення 97 пацієнтів. Майже кожне п’яте позначено як потенційно придатне
      для стандартного маршруту без повного консиліуму. Коли лікарі обрали стандартну допомогу, система погодилася у 98% випадків;
      знаменник цього показника не наведено. Вона позначила 33 людей як можливих кандидатів до клінічних досліджень проти
      чотирьох у документах MDT, але позначка не підтверджує відповідність критеріям.
  - type: p
    text: За описом Deontics, її закрита платформа поєднує знімки, патогістологічні висновки, клінічні записи й локальні настанови
      та працює з електронними картками або окремо; публічної ціни немає. Незалежний огляд Health Technology Wales 2024 року
      виявив обмежені рецензовані дані про Deontics, невизначену економічну доцільність і відсутність чіткого поліпшення результатів
      пацієнтів від систем підтримки рішень. Новий пілот не повідомив про виживаність, затримки лікування чи проспективне
      порівняння безпеки. Barts розширює оцінку на рак молочної залози.
  - type: p
    text: '[OpenOnco](/ukr/capabilities.html) безкоштовний, публікує MIT-код, перевірювані правила й знання з джерелами для
      чернеток за вигаданими випадками; він не інтегрований у лікарняний MDT і потребує перевірки лікаря. Прямого порівняння
      точності чи результатів немає. Джерела перевірено 24 листопада 2026 року. Матеріал не замінює лікаря.'
translations:
  es:
    title: 'Piloto de Deontics en cáncer de pulmón: el triaje aún necesita validación'
    summary: Barts Health revisó 344 debates de 97 pacientes; casi uno de cada cinco podría seguir atención estándar sin reunión
      completa. Faltan resultados clínicos.
    body:
    - type: p
      text: El 23 de noviembre de 2026, Barts Health NHS Trust informó de un piloto de Deontics en comités multidisciplinares
        (MDT) de cáncer de pulmón. Analizó 344 debates sobre 97 pacientes. Casi uno de cada cinco se señaló como posible vía
        de atención estándar sin reunión completa. Cuando los médicos eligieron atención estándar, el sistema coincidió en
        el 98% de los casos; el comunicado no da el denominador. Señaló a 33 personas para posibles ensayos frente a cuatro
        en los registros del MDT, pero señalar no confirma elegibilidad.
    - type: p
      text: Deontics describe una plataforma propietaria que combina imágenes, patología, notas y guías locales; puede integrarse
        con historias electrónicas o funcionar sola. No publica precio. Una revisión independiente de Health Technology Wales
        de 2024 halló poca evidencia Deontics revisada por pares, rentabilidad incierta y ninguna mejora clara en resultados
        de pacientes con sistemas de apoyo. El nuevo piloto no informó supervivencia, retrasos del tratamiento ni comparación
        prospectiva de seguridad. Barts amplía la evaluación al cáncer de mama.
    - type: p
      text: '[OpenOnco](/es/capabilities.html) es gratuito y publica código MIT, reglas examinables y conocimiento con fuentes
        para borradores de casos ficticios; no es un sistema MDT hospitalario integrado y requiere revisión médica. No existe
        comparación directa de precisión ni resultados. Fuentes comprobadas el 24 de noviembre de 2026. Este artículo no sustituye
        a un médico.'
  pt:
    title: 'Piloto da Deontics no cancro do pulmão: triagem ainda por validar'
    summary: A Barts Health analisou 344 discussões de 97 doentes; quase uma em cinco poderia seguir cuidados padrão sem reunião
      completa. Faltam resultados clínicos.
    body:
    - type: p
      text: Em 23 de novembro de 2026, a Barts Health NHS Trust divulgou um piloto da Deontics em reuniões multidisciplinares
        (MDT) sobre cancro do pulmão. Analisou 344 discussões relativas a 97 doentes. Quase uma em cinco foi assinalada como
        possível percurso de cuidados padrão sem reunião completa. Quando os médicos escolheram cuidados padrão, o sistema
        concordou em 98% dos casos; o comunicado não indica o denominador. Assinalou 33 pessoas para possíveis ensaios contra
        quatro nos registos MDT, mas isso não confirma elegibilidade.
    - type: p
      text: A Deontics descreve uma plataforma proprietária que combina imagens, patologia, notas e orientações locais; pode
        integrar-se com registos eletrónicos ou funcionar isoladamente. Não publica preço. Uma revisão independente de 2024
        da Health Technology Wales encontrou poucos dados da Deontics revistos por pares, custo-efetividade incerta e nenhuma
        melhoria clara nos resultados dos doentes com sistemas de apoio. O novo piloto não comunicou sobrevivência, atrasos
        terapêuticos nem comparação prospetiva de segurança. A Barts alarga a avaliação ao cancro da mama.
    - type: p
      text: A [OpenOnco](/pt/capabilities.html) é gratuita e publica código MIT, regras verificáveis e conhecimentos com fontes
        para rascunhos de casos fictícios; não é um sistema MDT hospitalar integrado e exige revisão médica. Não há comparação
        direta de exatidão ou resultados. Fontes verificadas em 24 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Deontics-Pilot bei Lungenkrebs: Triage bleibt ungeprüft'
    summary: Barts Health untersuchte 344 Besprechungen zu 97 Patienten; fast jede fünfte könnte einem Standardpfad ohne vollständige
      Konferenz folgen. Patientenergebnisse fehlen.
    body:
    - type: p
      text: Am 23. November 2026 berichtete Barts Health NHS Trust über einen Deontics-Piloten in multidisziplinären Lungenkrebs-Konferenzen
        (MDT). Untersucht wurden 344 Besprechungen zu 97 Patienten. Fast jede fünfte wurde als möglicher Standardpfad ohne
        vollständige Konferenz markiert. Wenn Ärzte Standardversorgung wählten, stimmte das System in 98% der Fälle überein;
        der Nenner fehlt im Bericht. Es markierte 33 Personen für mögliche Studien gegenüber vier in MDT-Akten, doch eine
        Markierung belegt keine Eignung.
    - type: p
      text: Deontics beschreibt eine proprietäre Plattform für Bildgebung, Pathologie, Notizen und lokale Leitlinien mit Anbindung
        an elektronische Akten oder eigenständigem Betrieb. Ein öffentlicher Preis fehlt. Eine unabhängige Prüfung von Health
        Technology Wales aus 2024 fand wenig begutachtete Deontics-Evidenz, unklare Kosteneffektivität und keine klare Verbesserung
        der Patientenergebnisse durch Entscheidungshilfen. Der neue Pilot berichtet weder Überleben noch Behandlungsverzögerung
        oder prospektiven Sicherheitsvergleich. Barts erweitert die Prüfung auf Brustkrebs.
    - type: p
      text: '[OpenOnco](/de/capabilities.html) ist kostenlos und veröffentlicht MIT-Code, prüfbare Regeln und belegtes Wissen
        für Entwürfe zu fiktiven Fällen; es ist kein integriertes Klinik-MDT-System und erfordert ärztliche Prüfung. Ein direkter
        Genauigkeits- oder Ergebnisvergleich fehlt. Quellen geprüft am 24. November 2026. Dieser Artikel ersetzt keine ärztliche
        Beratung.'
  fr:
    title: 'Pilote Deontics dans le cancer du poumon : le tri reste à valider'
    summary: Barts Health a étudié 344 discussions concernant 97 patients; près d’une sur cinq pourrait suivre un parcours
      standard sans réunion complète. Les résultats cliniques manquent.
    body:
    - type: p
      text: Le 23 novembre 2026, Barts Health NHS Trust a présenté un pilote Deontics dans les réunions pluridisciplinaires
        (MDT) sur le cancer du poumon. Il a analysé 344 discussions concernant 97 patients. Près d’une sur cinq a été signalée
        pour un éventuel parcours standard sans réunion complète. Lorsque les médecins choisissaient les soins standards,
        le système concordait dans 98% des cas; le communiqué ne donne pas le dénominateur. Il a signalé 33 personnes pour
        d’éventuels essais contre quatre dans les dossiers MDT, sans confirmer leur éligibilité.
    - type: p
      text: Deontics décrit une plateforme propriétaire combinant imagerie, anatomopathologie, notes et recommandations locales,
        reliée aux dossiers électroniques ou autonome. Aucun tarif public n’est donné. Une évaluation indépendante de Health
        Technology Wales en 2024 a relevé peu de données Deontics évaluées par les pairs, une rentabilité incertaine et aucune
        amélioration claire des résultats des patients avec ces systèmes d’aide. Le nouveau pilote ne rapporte ni survie,
        ni délais de traitement, ni comparaison prospective de sécurité. Barts étend l’évaluation au cancer du sein.
    - type: p
      text: '[OpenOnco](/fr/capabilities.html) est gratuit et publie du code MIT, des règles vérifiables et des connaissances
        sourcées pour des brouillons de cas fictifs; ce n’est pas un système MDT hospitalier intégré et un médecin doit vérifier
        le contenu. Il n’existe aucune comparaison directe de précision ou de résultats. Sources vérifiées le 24 novembre
        2026. Cet article ne remplace pas un médecin.'
  it:
    title: 'Pilota Deontics nel tumore polmonare: triage ancora da validare'
    summary: Barts Health ha esaminato 344 discussioni su 97 pazienti; quasi una su cinque potrebbe seguire il percorso standard
      senza riunione completa. Mancano esiti clinici.
    body:
    - type: p
      text: Il 23 novembre 2026 Barts Health NHS Trust ha presentato un pilota Deontics nelle riunioni multidisciplinari (MDT)
        sul tumore polmonare. Ha analizzato 344 discussioni relative a 97 pazienti. Quasi una su cinque è stata segnalata
        per un possibile percorso standard senza riunione completa. Quando i medici sceglievano l’assistenza standard, il
        sistema concordava nel 98% dei casi; il comunicato non indica il denominatore. Ha segnalato 33 persone per possibili
        studi contro quattro nei documenti MDT, senza confermare l’idoneità.
    - type: p
      text: Deontics descrive una piattaforma proprietaria che combina immagini, patologia, note e linee guida locali, integrabile
        con cartelle elettroniche o autonoma. Non pubblica un prezzo. Una valutazione indipendente di Health Technology Wales
        del 2024 ha trovato pochi dati Deontics sottoposti a revisione tra pari, costo-efficacia incerta e nessun chiaro miglioramento
        degli esiti con i sistemi di supporto. Il nuovo pilota non riporta sopravvivenza, ritardi terapeutici né confronto
        prospettico di sicurezza. Barts estende la valutazione al tumore mammario.
    - type: p
      text: '[OpenOnco](/it/capabilities.html) è gratuito e pubblica codice MIT, regole verificabili e conoscenze con fonti
        per bozze di casi fittizi; non è un sistema MDT ospedaliero integrato e richiede verifica medica. Non esiste confronto
        diretto di accuratezza o esiti. Fonti verificate il 24 novembre 2026. Questo articolo non sostituisce un medico.'
  da:
    title: 'Deontics-pilot om lungekræft: triage kræver stadig validering'
    summary: Barts Health gennemgik 344 drøftelser om 97 patienter; næsten hver femte kunne måske følge et standardforløb
      uden fuldt møde. Patientresultater mangler.
    body:
    - type: p
      text: Den 23. november 2026 omtalte Barts Health NHS Trust en Deontics-pilot på multidisciplinære møder (MDT) om lungekræft.
        Den omfattede 344 drøftelser om 97 patienter. Næsten hver femte blev markeret som mulig kandidat til standardforløb
        uden fuldt møde. Når lægerne valgte standardbehandling, var systemet enig i 98% af tilfældene; meddelelsen angiver
        ikke nævneren. Det markerede 33 personer til mulige forsøg mod fire i MDT-journalerne, men markering bekræfter ikke
        egnethed.
    - type: p
      text: Deontics beskriver en proprietær platform, som samler scanninger, patologisvar, noter og lokale retningslinjer
        og kan kobles til elektroniske journaler eller bruges alene. Ingen offentlig pris er angivet. En uafhængig vurdering
        fra Health Technology Wales i 2024 fandt begrænset fagfællebedømt Deontics-evidens, usikker omkostningseffektivitet
        og ingen klar forbedring af patientresultater med beslutningsstøtte. Den nye pilot rapporterer ikke overlevelse, behandlingsforsinkelse
        eller prospektiv sikkerhedssammenligning. Barts udvider vurderingen til brystkræft.
    - type: p
      text: '[OpenOnco](/da/capabilities.html) er gratis og offentliggør MIT-kode, kontrollerbare regler og kildebelagt viden
        til udkast om fiktive tilfælde; det er ikke et integreret hospitals-MDT-system og kræver lægelig gennemgang. Der findes
        ingen direkte sammenligning af præcision eller resultater. Kilder kontrolleret 24. november 2026. Artiklen erstatter
        ikke en læge.'
  sv:
    title: 'Deontics pilot vid lungcancer: triagering behöver valideras'
    summary: Barts Health granskade 344 diskussioner om 97 patienter; nästan var femte skulle kanske kunna följa standardvård
      utan fullständigt möte. Patientutfall saknas.
    body:
    - type: p
      text: Den 23 november 2026 beskrev Barts Health NHS Trust en Deontics-pilot vid multidisciplinära möten (MDT) om lungcancer.
        Den omfattade 344 diskussioner om 97 patienter. Nästan var femte markerades som möjlig för standardvård utan fullständigt
        möte. När läkarna valde standardvård överensstämde systemet i 98% av fallen; meddelandet anger inte nämnaren. Det
        markerade 33 personer för möjliga prövningar jämfört med fyra i MDT-dokumentationen, men en markering bekräftar inte
        behörighet.
    - type: p
      text: Deontics beskriver en proprietär plattform som sammanför bilder, patologisvar, anteckningar och lokala riktlinjer
        och kan anslutas till elektroniska journaler eller användas separat. Offentligt pris saknas. En oberoende granskning
        av Health Technology Wales 2024 fann begränsad sakkunniggranskad Deontics-evidens, osäker kostnadseffektivitet och
        ingen tydlig förbättring av patientutfall med beslutsstöd. Den nya piloten redovisar inte överlevnad, behandlingsfördröjning
        eller prospektiv säkerhetsjämförelse. Barts utvidgar utvärderingen till bröstcancer.
    - type: p
      text: '[OpenOnco](/sv/capabilities.html) är gratis och publicerar MIT-kod, granskningsbara regler och källbelagd kunskap
        för utkast från fiktiva fall; det är inte ett integrerat MDT-system på sjukhus och kräver läkargranskning. Direkt
        jämförelse av noggrannhet eller utfall saknas. Källor kontrollerade 24 november 2026. Artikeln ersätter inte en läkare.'
  nb:
    title: 'Deontics-pilot ved lungekreft: triagering må fortsatt valideres'
    summary: Barts Health undersøkte 344 diskusjoner om 97 pasienter; nesten hver femte kunne kanskje følge standardforløp
      uten fullt møte. Pasientutfall mangler.
    body:
    - type: p
      text: 23. november 2026 omtalte Barts Health NHS Trust en Deontics-pilot i tverrfaglige møter (MDT) om lungekreft. Den
        omfattet 344 diskusjoner om 97 pasienter. Nesten hver femte ble markert som mulig for standardforløp uten fullt møte.
        Når legene valgte standardbehandling, samsvarte systemet i 98% av tilfellene; meldingen oppgir ikke nevneren. Det
        markerte 33 personer for mulige studier mot fire i MDT-dokumentasjonen, men markering bekrefter ikke egnethet.
    - type: p
      text: Deontics beskriver en proprietær plattform som samler skanninger, patologisvar, notater og lokale retningslinjer;
        den kan kobles til elektroniske journaler eller brukes alene. Offentlig pris mangler. En uavhengig gjennomgang fra
        Health Technology Wales i 2024 fant begrenset fagfellevurdert Deontics-dokumentasjon, usikker kostnadseffektivitet
        og ingen klar forbedring av pasientutfall med beslutningsstøtte. Den nye piloten rapporterer ikke overlevelse, behandlingsforsinkelse
        eller prospektiv sikkerhetssammenligning. Barts utvider vurderingen til brystkreft.
    - type: p
      text: '[OpenOnco](/nb/capabilities.html) er gratis og publiserer MIT-kode, etterprøvbare regler og kildebelagt kunnskap
        til utkast fra fiktive tilfeller; det er ikke et integrert sykehus-MDT-system og krever legevurdering. Direkte sammenligning
        av nøyaktighet eller utfall mangler. Kilder kontrollert 24. november 2026. Artikkelen erstatter ikke en lege.'
  fi:
    title: 'Deonticsin keuhkosyöpäpilotti: ohjaus vaatii vielä vahvistusta'
    summary: Barts Health tarkasteli 344 käsittelyä 97 potilaasta; lähes joka viides voisi ehkä edetä tavanomaisella hoitopolulla
      ilman täyttä kokousta. Potilastulokset puuttuvat.
    body:
    - type: p
      text: 23. marraskuuta 2026 Barts Health NHS Trust kertoi Deontics-pilotista keuhkosyövän moniammatillisissa kokouksissa
        (MDT). Se käsitti 344 käsittelyä 97 potilaasta. Lähes joka viides merkittiin mahdolliseksi tavanomaiselle hoitopolulle
        ilman täyttä kokousta. Kun lääkärit valitsivat tavanomaisen hoidon, järjestelmä oli samaa mieltä 98%:ssa tapauksista;
        tiedote ei kerro nimittäjää. Se merkitsi 33 henkilöä mahdollisiin tutkimuksiin, kun MDT-asiakirjoissa heitä oli neljä,
        mutta merkintä ei vahvista tutkimuskelpoisuutta.
    - type: p
      text: Deontics kuvaa suljettua alustaa, joka yhdistää kuvantamisen, patologian lausunnot, merkinnät ja paikalliset ohjeet
        ja voidaan liittää potilastietojärjestelmään tai käyttää erillisenä. Julkista hintaa ei ole. Health Technology Walesin
        riippumaton arvio vuodelta 2024 löysi niukasti vertaisarvioitua Deontics-näyttöä, epävarman kustannusvaikuttavuuden
        eikä selvää parannusta potilastuloksiin päätöksentukijärjestelmillä. Uusi pilotti ei raportoi elossaoloa, hoidon viivettä
        eikä prospektiivista turvallisuusvertailua. Barts laajentaa arvioinnin rintasyöpään.
    - type: p
      text: '[OpenOnco](/fi/capabilities.html) on ilmainen ja julkaisee MIT-koodia, tarkastettavia sääntöjä sekä lähteistettyä
        tietoa kuvitteellisten tapausten luonnoksiin; se ei ole sairaalan integroitu MDT-järjestelmä ja edellyttää lääkärin
        tarkistusta. Suoraa tarkkuus- tai tulosvertailua ei ole. Lähteet tarkistettu 24. marraskuuta 2026. Artikkeli ei korvaa
        lääkäriä.'
