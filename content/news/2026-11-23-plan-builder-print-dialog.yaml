slug: plan-builder-printable-draft
date: 2026-11-23
published: 2026-11-23
kind: project
series: openonco-three-day
series_format: platform
author: OpenOnco
tags: [platform, plan-builder, printable-report, synthetic-examples]
title:
  en: 'A printable draft for a real conversation'
  uk: 'Чернетка для друку й розмови з лікарем'
summary:
  en: 'Plan Builder can open a generated draft in the browser print dialog. A fictional example shows what to check before saving a PDF.'
  uk: 'Конструктор плану відкриває згенеровану чернетку в діалозі друку браузера. Вигаданий приклад показує, що перевірити перед збереженням PDF.'
sources:
  - citation: 'OpenOnco. Plan Builder page and Share with your doctor button. Live checked 23 November 2026.'
    id: https://openonco.info/try.html
  - citation: 'OpenOnco. Ukrainian Plan Builder page. Live checked 23 November 2026.'
    id: https://openonco.info/ukr/try.html
  - citation: 'OpenOnco. Browser print-dialog implementation, version 70c78f55. Checked 23 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/70c78f552a9ced290666a50b7e8cbdf1594ee8f2/docs/try.html
body:
  en:
    - type: p
      text: >-
        The [Plan Builder](/try.html) has a **Share with your doctor · PDF** button beside the generated plan. It opens the browser's print dialog for the report; if the browser offers **Save as PDF**, you can choose it there. OpenOnco does not claim that clicking the button automatically saves a PDF. A print dialog is a convenient handoff format, not a sign that the draft has been clinically approved.
    - type: p
      text: >-
        Imagine selecting a built-in, fictional DLBCL example. Generate the full plan, open the report and read its source links, warnings and review status. Then use the PDF button and inspect the print preview before saving. If you change an input, generate the plan again so the printed draft reflects the current example. The page uses synthetic cases only; do not enter real patient information.
    - type: p
      text: >-
        The plan is a discussion draft and needs verification by a qualified oncologist. Printing it does not establish accuracy or clinical validation. The report is prepared in the browser; downloading the site's public assets still requires network requests, and a saved export remains on your device. Feature, code and live pages checked 23 November 2026. This article does not replace a doctor.
  uk:
    - type: p
      text: >-
        У [Конструкторі плану](/ukr/try.html) поруч зі згенерованим планом є кнопка **Для лікаря · PDF**. Вона відкриває діалог друку браузера для звіту; якщо браузер пропонує **Зберегти як PDF**, цей варіант можна вибрати там. Натискання кнопки саме по собі не означає, що PDF уже збережено. Зручний формат для передачі не свідчить про клінічне схвалення чернетки.
    - type: p
      text: >-
        Уявіть, що ви вибрали вбудований вигаданий приклад ДВКЛ. Згенеруйте повний план, відкрийте звіт і перегляньте посилання на джерела, застереження та статус рецензування. Потім натисніть кнопку PDF і перевірте попередній перегляд перед збереженням. Якщо зміните вхідні дані, згенеруйте план знову, щоб роздрукована чернетка відповідала поточному прикладу. Сторінка призначена лише для вигаданих випадків; не вводьте дані реального пацієнта.
    - type: p
      text: >-
        План є чернеткою для обговорення й потребує перевірки кваліфікованим онкологом. Друк не доводить точності чи клінічної валідації. Звіт готується в браузері; завантаження публічних ресурсів сайту все ж потребує мережі, а збережений експорт залишається на вашому пристрої. Функцію, код і сторінки наживо перевірено 23 листопада 2026 року. Матеріал не замінює лікаря.
translations:
  es:
    title: 'Un borrador imprimible para hablar con el médico'
    summary: 'Plan Builder abre un borrador generado en el diálogo de impresión del navegador. Un caso ficticio muestra qué revisar antes de guardar un PDF.'
    body:
      - type: p
        text: >-
          La herramienta [Plan Builder](/try.html), disponible en inglés, tiene un botón para compartir el plan generado como PDF. Abre el diálogo de impresión del navegador para el informe; si aparece **Guardar como PDF**, puede elegir esa opción. Pulsar el botón no significa que el PDF se haya guardado automáticamente. Un formato cómodo para compartir no equivale a una aprobación clínica del borrador.
      - type: p
        text: >-
          Imagine que selecciona un ejemplo integrado y ficticio de linfoma difuso de células B grandes. Genere el plan completo, abra el informe y examine enlaces a fuentes, advertencias y estado de revisión. Después use el botón PDF y compruebe la vista previa antes de guardar. Si cambia un dato de entrada, vuelva a generar el plan para que el borrador impreso corresponda al ejemplo actual. La página admite solo casos ficticios; no introduzca datos de pacientes reales.
      - type: p
        text: >-
          El plan es un borrador para debatir y requiere verificación por un oncólogo cualificado. Imprimirlo no demuestra exactitud ni validación clínica. El informe se prepara en el navegador; la descarga de los recursos públicos del sitio sigue usando la red y el archivo guardado permanece en su dispositivo. Función, código y páginas públicas comprobados el 23 de noviembre de 2026. Este artículo no sustituye a un médico.
  pt:
    title: 'Um rascunho imprimível para conversar com o médico'
    summary: 'O Plan Builder abre um rascunho gerado no diálogo de impressão do navegador. Um caso fictício mostra o que verificar antes de guardar um PDF.'
    body:
      - type: p
        text: >-
          A ferramenta [Plan Builder](/try.html), disponível em inglês, tem um botão para partilhar o plano gerado como PDF. Abre o diálogo de impressão do navegador para o relatório; se surgir **Guardar como PDF**, pode escolher essa opção. Clicar no botão não significa que o PDF seja guardado automaticamente. Um formato prático de partilha não equivale à aprovação clínica do rascunho.
      - type: p
        text: >-
          Imagine que escolhe um exemplo integrado e fictício de linfoma difuso de grandes células B. Gere o plano completo, abra o relatório e veja as ligações para fontes, os avisos e o estado de revisão. Depois use o botão PDF e confira a pré-visualização antes de guardar. Se alterar um dado, gere o plano de novo para que o rascunho impresso corresponda ao exemplo atual. A página destina-se apenas a casos fictícios; não introduza dados de doentes reais.
      - type: p
        text: >-
          O plano é um rascunho para discussão e exige verificação por um oncologista qualificado. A impressão não demonstra exatidão nem validação clínica. O relatório é preparado no navegador; a transferência dos recursos públicos do site ainda requer rede e o ficheiro guardado fica no seu dispositivo. Função, código e páginas públicas verificados em 23 de novembro de 2026. Este artigo não substitui um médico.
  de:
    title: 'Ein druckbarer Entwurf für das Arztgespräch'
    summary: 'Plan Builder öffnet einen erstellten Entwurf im Druckdialog des Browsers. Ein erfundenes Beispiel zeigt, was vor dem Speichern als PDF zu prüfen ist.'
    body:
      - type: p
        text: >-
          Der englischsprachige [Plan Builder](/try.html) zeigt neben dem erstellten Plan eine PDF-Schaltfläche zum Teilen. Sie öffnet für den Bericht den Druckdialog des Browsers; bietet der Browser **Als PDF speichern** an, kann dies dort gewählt werden. Der Klick speichert nicht automatisch eine PDF-Datei. Ein bequemes Übergabeformat ist keine klinische Freigabe des Entwurfs.
      - type: p
        text: >-
          Stellen Sie sich ein eingebautes, erfundenes Beispiel zum diffusen großzelligen B-Zell-Lymphom vor. Erstellen Sie den vollständigen Plan, öffnen Sie den Bericht und prüfen Sie Quellenlinks, Warnungen und Prüfstatus. Nutzen Sie dann die PDF-Schaltfläche und kontrollieren Sie die Druckvorschau vor dem Speichern. Ändern Sie eine Eingabe, erstellen Sie den Plan erneut, damit der Druckentwurf zum aktuellen Beispiel passt. Die Seite ist nur für fiktive Fälle gedacht; geben Sie keine echten Patientendaten ein.
      - type: p
        text: >-
          Der Plan ist ein Diskussionsentwurf und muss von einem qualifizierten Onkologen überprüft werden. Drucken belegt weder Genauigkeit noch klinische Validierung. Der Bericht wird im Browser vorbereitet; das Laden der öffentlichen Website-Dateien erfordert weiterhin Netzwerkzugriff, und die gespeicherte Datei bleibt auf Ihrem Gerät. Funktion, Code und öffentliche Seiten am 23. November 2026 geprüft. Dieser Artikel ersetzt keinen Arzt.
  fr:
    title: 'Un brouillon imprimable pour échanger avec le médecin'
    summary: 'Plan Builder ouvre un brouillon généré dans la boîte de dialogue d’impression du navigateur. Un exemple fictif montre quoi vérifier avant de sauvegarder un PDF.'
    body:
      - type: p
        text: >-
          Le [Plan Builder](/try.html), disponible en anglais, propose un bouton PDF à côté du plan généré. Il ouvre la boîte de dialogue d’impression du navigateur pour le rapport ; si **Enregistrer au format PDF** est proposé, vous pouvez le choisir. Le clic n’enregistre pas automatiquement un PDF. Un format pratique à transmettre n’est pas une approbation clinique du brouillon.
      - type: p
        text: >-
          Imaginez sélectionner un exemple intégré et fictif de lymphome diffus à grandes cellules B. Générez le plan complet, ouvrez le rapport et examinez les liens vers les sources, les avertissements et l’état de révision. Utilisez ensuite le bouton PDF et vérifiez l’aperçu avant de sauvegarder. Si vous modifiez une donnée, régénérez le plan pour que le brouillon imprimé corresponde à l’exemple actuel. La page est réservée aux cas fictifs ; ne saisissez pas de données de vrais patients.
      - type: p
        text: >-
          Le plan est un brouillon de discussion qui doit être vérifié par un oncologue qualifié. L’impression ne prouve ni l’exactitude ni une validation clinique. Le rapport est préparé dans le navigateur ; le chargement des ressources publiques du site utilise toujours le réseau et le fichier enregistré reste sur votre appareil. Fonction, code et pages publiques vérifiés le 23 novembre 2026. Cet article ne remplace pas un médecin.
  it:
    title: 'Una bozza stampabile per parlare con il medico'
    summary: 'Plan Builder apre una bozza generata nella finestra di stampa del browser. Un esempio inventato mostra cosa controllare prima di salvare un PDF.'
    body:
      - type: p
        text: >-
          Il [Plan Builder](/try.html), disponibile in inglese, mostra un pulsante PDF accanto al piano generato. Apre la finestra di stampa del browser per il rapporto; se compare **Salva come PDF**, si può scegliere questa opzione. Il clic non salva automaticamente un PDF. Un formato comodo da condividere non equivale all’approvazione clinica della bozza.
      - type: p
        text: >-
          Immagini di scegliere un esempio integrato e inventato di linfoma diffuso a grandi cellule B. Generi il piano completo, apra il rapporto e controlli collegamenti alle fonti, avvertenze e stato della revisione. Poi usi il pulsante PDF e verifichi l’anteprima di stampa prima di salvare. Se cambia un dato, generi di nuovo il piano affinché la bozza stampata corrisponda all’esempio attuale. La pagina è solo per casi inventati; non inserisca dati di pazienti reali.
      - type: p
        text: >-
          Il piano è una bozza per discutere e richiede la verifica di un oncologo qualificato. Stamparlo non dimostra accuratezza né validazione clinica. Il rapporto viene preparato nel browser; il caricamento delle risorse pubbliche del sito richiede comunque la rete e il file salvato resta sul dispositivo. Funzione, codice e pagine pubbliche verificati il 23 novembre 2026. Questo articolo non sostituisce il medico.
  da:
    title: 'Et udskriveligt udkast til samtalen med lægen'
    summary: 'Plan Builder åbner et genereret udkast i browserens udskriftsdialog. Et opdigtet eksempel viser, hvad der bør kontrolleres før en PDF gemmes.'
    body:
      - type: p
        text: >-
          Den engelsksprogede [Plan Builder](/try.html) har en PDF-knap ved siden af den genererede plan. Den åbner browserens udskriftsdialog for rapporten; hvis **Gem som PDF** vises, kan du vælge den. Et klik gemmer ikke automatisk en PDF. Et praktisk format til deling betyder ikke, at udkastet er klinisk godkendt.
      - type: p
        text: >-
          Forestil dig, at du vælger et indbygget, opdigtet eksempel med diffust storcellet B-cellelymfom. Generér hele planen, åbn rapporten, og læs kildelinks, advarsler og status for gennemgang. Brug så PDF-knappen, og kontroller forhåndsvisningen før du gemmer. Hvis du ændrer et input, skal du generere planen igen, så det udskrevne udkast svarer til det aktuelle eksempel. Siden er kun til fiktive tilfælde; indtast ikke rigtige patientoplysninger.
      - type: p
        text: >-
          Planen er et udkast til drøftelse og skal kontrolleres af en kvalificeret onkolog. Udskrivning dokumenterer hverken nøjagtighed eller klinisk validering. Rapporten forberedes i browseren; indlæsning af webstedets offentlige filer kræver stadig netværk, og den gemte fil bliver på din enhed. Funktion, kode og offentlige sider kontrolleret 23. november 2026. Artiklen erstatter ikke en læge.
  sv:
    title: 'Ett utskrivbart utkast för samtalet med läkaren'
    summary: 'Plan Builder öppnar ett skapat utkast i webbläsarens utskriftsdialog. Ett påhittat exempel visar vad som bör granskas innan en PDF sparas.'
    body:
      - type: p
        text: >-
          Den engelskspråkiga [Plan Builder](/try.html) har en PDF-knapp bredvid den skapade planen. Den öppnar webbläsarens utskriftsdialog för rapporten; om **Spara som PDF** finns kan du välja det där. Klicket sparar inte automatiskt en PDF. Ett smidigt format att dela innebär inte att utkastet är kliniskt godkänt.
      - type: p
        text: >-
          Tänk dig att välja ett inbyggt, påhittat exempel med diffust storcelligt B-cellslymfom. Skapa hela planen, öppna rapporten och granska källänkar, varningar och granskningsstatus. Använd sedan PDF-knappen och kontrollera förhandsvisningen innan du sparar. Om du ändrar en uppgift behöver du skapa planen på nytt så att utskriften stämmer med det aktuella exemplet. Sidan är endast avsedd för fiktiva fall; skriv inte in riktiga patientuppgifter.
      - type: p
        text: >-
          Planen är ett diskussionsutkast som måste kontrolleras av en kvalificerad onkolog. Utskrift visar varken noggrannhet eller klinisk validering. Rapporten förbereds i webbläsaren; inläsning av webbplatsens offentliga filer kräver fortfarande nätverk, och den sparade filen stannar på din enhet. Funktion, kod och offentliga sidor kontrollerade den 23 november 2026. Artikeln ersätter inte en läkare.
  nb:
    title: 'Et utskrivbart utkast til samtalen med legen'
    summary: 'Plan Builder åpner et generert utkast i nettleserens utskriftsdialog. Et oppdiktet eksempel viser hva som bør sjekkes før en PDF lagres.'
    body:
      - type: p
        text: >-
          Den engelskspråklige [Plan Builder](/try.html) har en PDF-knapp ved siden av den genererte planen. Den åpner nettleserens utskriftsdialog for rapporten; hvis **Lagre som PDF** vises, kan du velge det. Et klikk lagrer ikke automatisk en PDF. Et praktisk format for deling betyr ikke at utkastet er klinisk godkjent.
      - type: p
        text: >-
          Tenk deg at du velger et innebygd, oppdiktet eksempel med diffust storcellet B-cellelymfom. Generer hele planen, åpne rapporten og les kildelenker, advarsler og status for gjennomgang. Bruk deretter PDF-knappen og kontroller forhåndsvisningen før du lagrer. Hvis du endrer et input, må du generere planen på nytt slik at utskriften samsvarer med det aktuelle eksempelet. Siden er bare for fiktive tilfeller; ikke skriv inn ekte pasientopplysninger.
      - type: p
        text: >-
          Planen er et utkast til diskusjon og må kontrolleres av en kvalifisert onkolog. Utskrift dokumenterer verken nøyaktighet eller klinisk validering. Rapporten klargjøres i nettleseren; innlasting av nettstedets offentlige filer krever fortsatt nettverk, og den lagrede filen blir på enheten din. Funksjon, kode og offentlige sider kontrollert 23. november 2026. Artikkelen erstatter ikke en lege.
  fi:
    title: 'Tulostettava luonnos lääkärin kanssa käytävään keskusteluun'
    summary: 'Plan Builder avaa luodun luonnoksen selaimen tulostusikkunassa. Kuvitteellinen esimerkki näyttää, mitä tarkistaa ennen PDF-tallennusta.'
    body:
      - type: p
        text: >-
          Englanninkielisessä [Plan Builderissa](/try.html) on luodun suunnitelman vieressä PDF-painike. Se avaa raportin selaimen tulostusikkunaan; jos **Tallenna PDF-tiedostona** on tarjolla, sen voi valita siellä. Painikkeen napsautus ei tallenna PDF:ää automaattisesti. Kätevä jakomuoto ei tarkoita, että luonnos olisi kliinisesti hyväksytty.
      - type: p
        text: >-
          Kuvittele valitsevasi sisäänrakennetun, kuvitteellisen diffuusin suurisoluisen B-solulymfooman esimerkin. Luo koko suunnitelma, avaa raportti ja tarkista lähdelinkit, varoitukset ja arviointitila. Käytä sitten PDF-painiketta ja tarkista esikatselu ennen tallennusta. Jos muutat syötettä, luo suunnitelma uudelleen, jotta tuloste vastaa nykyistä esimerkkiä. Sivu on vain kuvitteellisille tapauksille; älä syötä oikean potilaan tietoja.
      - type: p
        text: >-
          Suunnitelma on keskusteluluonnos, jonka pätevän onkologin on tarkistettava. Tulostaminen ei osoita tarkkuutta eikä kliinistä validointia. Raportti valmistellaan selaimessa; sivuston julkisten tiedostojen lataus tarvitsee silti verkkoyhteyden, ja tallennettu tiedosto pysyy laitteellasi. Ominaisuus, koodi ja julkiset sivut tarkistettu 23. marraskuuta 2026. Artikkeli ei korvaa lääkäriä.
