slug: tagomics-liquipath-seed-extension
date: 2026-11-24
published: 2026-11-25
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, liquid-biopsy, drug-safety, lung-cancer, evidence]
title:
  en: "Tagomics funds blood-based drug safety platform; lung test is still in development"
  uk: "Tagomics залучає кошти для аналізу крові; тест на рак легень ще розробляють"
summary:
  en: "A $13 million (£10 million) seed extension will expand LiquiPath and a lung cancer detection programme. It is funding and early access, not proof of clinical benefit."
  uk: "Посівне фінансування на $13 млн (£10 млн) піде на LiquiPath і програму виявлення раку легень. Ранній доступ і інвестиції не доводять клінічної користі."
sources:
  - citation: 'Tagomics. Seed extension announcement, dated 24 November 2026. Checked 25 November 2026.'
    id: https://tagomics.com/news/tagomics-closes-13m-seed-extension-to-scale-organ-health-platform-following-oversubscribed-early-access-programme
  - citation: 'Tagomics. LiquiPath launch and product description, dated 17 August 2026. Checked 25 November 2026.'
    id: https://tagomics.com/news/tagomics-introduces-liquipath-a-first-in-class-cfdna-based-blood-test-for-multi-organ-drug-safety-monitoring
  - citation: 'Tagomics. Oncology platform and development scope. Checked 25 November 2026.'
    id: https://tagomics.com/oncology
  - citation: 'OpenOnco. Project scope and clinical limitations, version 1b7aef2a. Checked 25 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/1b7aef2a8cbe51cfc462b9d993c069c7ec37bea3/README.md
  - citation: 'OpenOnco. MIT licence, version 1b7aef2a. Checked 25 November 2026.'
    id: https://github.com/romeo111/OpenOnco/blob/1b7aef2a8cbe51cfc462b9d993c069c7ec37bea3/LICENSE
body:
  en:
    - type: p
      text: "On 24 November 2026, University of Birmingham spinout Tagomics announced a $13 million (£10 million) seed extension. The company says the money will scale its LiquiPath platform and move its lung cancer detection programme toward clinical use. LiquiPath launched in August 2026 for early-access partners; Tagomics says six large pharmaceutical companies have projects with it. These partner and demand figures are company-reported, not measures of diagnostic performance."
    - type: p
      text: "LiquiPath analyses cell-free DNA from blood and uses tissue-specific methylation maps to infer where a signal may have arisen. Its current workflow targets drug safety monitoring in research and clinical development, while Tagomics describes its lung cancer assay as still advancing toward clinical application. The company does not publish a user price or open its platform code. Its 24 November release gives no sensitivity, specificity, patient-outcome or regulatory-approval result for the lung test. The promised earlier detection of organ injury remains a product aim, not an established patient benefit."
    - type: p
      text: "[OpenOnco](/capabilities.html) is free to read, with MIT-licensed code, inspectable rules and cited oncology knowledge for synthetic case drafts. It does not analyse blood or diagnose lung cancer; its clinical content needs clinician review. Tagomics measures biological signals; OpenOnco organises evidence for discussion. There is no direct comparison of accuracy, safety or outcomes. Sources checked 25 November 2026. This article does not replace a doctor."
  uk:
    - type: p
      text: "24 листопада 2026 року компанія Tagomics, створена при Бірмінгемському університеті, оголосила про додаткове посівне фінансування на $13 млн (£10 млн). За словами компанії, гроші підуть на розширення платформи LiquiPath і наближення програми виявлення раку легень до клінічного застосування. LiquiPath запустили у серпні 2026 року для партнерів раннього доступу; Tagomics повідомляє про проєкти із шістьма великими фармацевтичними компаніями. Це дані компанії про партнерства й попит, а не показники діагностичної точності."
    - type: p
      text: "LiquiPath аналізує позаклітинну ДНК у крові й за картами метилювання різних тканин визначає можливе походження сигналу. Нинішній процес призначений для моніторингу безпеки ліків у дослідженнях і клінічній розробці, а тест на рак легень компанія ще просуває до клінічного застосування. Публічної ціни немає, код платформи закритий. Повідомлення від 24 листопада не наводить чутливості, специфічності, результатів для пацієнтів чи регуляторного схвалення тесту. Раніше виявлення ушкодження органів наразі є метою продукту, а не доведеною користю для пацієнтів."
    - type: p
      text: "[OpenOnco](/ukr/capabilities.html) доступний безкоштовно й публікує код за ліцензією MIT, перевірювані правила та онкологічні знання з джерелами для чернеток за вигаданими випадками. Він не аналізує кров і не діагностує рак легень; клінічний зміст має перевіряти лікар. Tagomics вимірює біологічні сигнали, OpenOnco впорядковує докази для обговорення. Прямого порівняння точності, безпеки чи результатів немає. Джерела перевірено 25 листопада 2026 року. Матеріал не замінює лікаря."
translations:
  es:
    title: "Tagomics financia su análisis sanguíneo; la prueba pulmonar sigue en desarrollo"
    summary: "Una ampliación de capital semilla de 13 millones de dólares (10 millones de libras) impulsará LiquiPath y un programa de detección de cáncer pulmonar. La inversión no demuestra beneficio clínico."
    body:
      - type: p
        text: "El 24 de noviembre de 2026, Tagomics, empresa derivada de la Universidad de Birmingham, anunció una ampliación de capital semilla de 13 millones de dólares (10 millones de libras). Según la empresa, financiará la expansión de LiquiPath y el avance hacia la clínica de su programa de detección del cáncer de pulmón. LiquiPath se lanzó en agosto de 2026 para socios de acceso temprano; Tagomics dice tener proyectos con seis grandes farmacéuticas. Son cifras de demanda comunicadas por la empresa, no medidas del rendimiento diagnóstico."
      - type: p
        text: "LiquiPath analiza ADN libre circulante en sangre y utiliza mapas de metilación específicos de tejidos para inferir el origen de una señal. Su flujo actual se centra en vigilar la seguridad de fármacos durante la investigación y el desarrollo clínico; la prueba pulmonar todavía avanza hacia una posible aplicación clínica. No hay precio público ni código abierto de la plataforma. El anuncio del 24 de noviembre no presenta sensibilidad, especificidad, resultados en pacientes ni autorización regulatoria para esa prueba. Detectar antes lesiones orgánicas es un objetivo del producto, no un beneficio demostrado para pacientes."
      - type: p
        text: "[OpenOnco](/es/capabilities.html) es gratuito y publica código MIT, reglas examinables y conocimiento oncológico con fuentes para borradores de casos ficticios. No analiza sangre ni diagnostica cáncer pulmonar; el contenido clínico requiere revisión médica. Tagomics mide señales biológicas y OpenOnco organiza evidencia para discutirla. No existe comparación directa de precisión, seguridad o resultados. Fuentes comprobadas el 25 de noviembre de 2026. Este artículo no sustituye a un médico."
  pt:
    title: "Tagomics financia análise de sangue; teste pulmonar continua em desenvolvimento"
    summary: "Uma extensão de financiamento inicial de 13 milhões de dólares (10 milhões de libras) apoiará LiquiPath e um programa de deteção do cancro do pulmão. Investimento não prova benefício clínico."
    body:
      - type: p
        text: "Em 24 de novembro de 2026, a Tagomics, empresa derivada da Universidade de Birmingham, anunciou uma extensão de financiamento inicial de 13 milhões de dólares (10 milhões de libras). Segundo a empresa, o dinheiro irá ampliar LiquiPath e aproximar da clínica o seu programa de deteção do cancro do pulmão. LiquiPath foi lançado em agosto de 2026 para parceiros de acesso antecipado; a Tagomics diz ter projetos com seis grandes farmacêuticas. São números de procura comunicados pela empresa, não medidas de desempenho diagnóstico."
      - type: p
        text: "LiquiPath analisa ADN livre circulante no sangue e usa mapas de metilação específicos dos tecidos para inferir a origem de um sinal. O fluxo atual centra-se na monitorização da segurança de medicamentos na investigação e no desenvolvimento clínico; o teste pulmonar ainda caminha para eventual aplicação clínica. Não há preço público nem código aberto da plataforma. O anúncio de 24 de novembro não apresenta sensibilidade, especificidade, resultados nos doentes nem autorização regulamentar para o teste. Detetar mais cedo lesões dos órgãos é um objetivo do produto, não um benefício comprovado para doentes."
      - type: p
        text: "A [OpenOnco](/pt/capabilities.html) é gratuita e publica código MIT, regras verificáveis e conhecimento oncológico com fontes para rascunhos de casos fictícios. Não analisa sangue nem diagnostica cancro do pulmão; o conteúdo clínico exige revisão médica. A Tagomics mede sinais biológicos e a OpenOnco organiza evidência para discussão. Não há comparação direta de exatidão, segurança ou resultados. Fontes verificadas em 25 de novembro de 2026. Este artigo não substitui um médico."
  de:
    title: "Tagomics finanziert Bluttest-Plattform; Lungentest bleibt in Entwicklung"
    summary: "Eine Seed-Erweiterung über 13 Millionen US-Dollar (10 Millionen Pfund) soll LiquiPath und ein Lungenkrebsprogramm voranbringen. Finanzierung belegt keinen klinischen Nutzen."
    body:
      - type: p
        text: "Am 24. November 2026 meldete Tagomics, eine Ausgründung der Universität Birmingham, eine Erweiterung der Seed-Finanzierung um 13 Millionen US-Dollar (10 Millionen Pfund). Das Geld soll laut Unternehmen LiquiPath ausbauen und ein Programm zur Lungenkrebs-Erkennung der klinischen Anwendung näherbringen. LiquiPath startete im August 2026 für Partner mit frühem Zugang; Tagomics berichtet von Projekten mit sechs großen Pharmakonzernen. Das sind Unternehmensangaben zu Nachfrage, keine Kennzahlen zur diagnostischen Leistung."
      - type: p
        text: "LiquiPath analysiert zellfreie DNA im Blut und nutzt gewebespezifische Methylierungskarten, um den möglichen Ursprung eines Signals abzuleiten. Der derzeitige Ablauf dient der Überwachung der Arzneimittelsicherheit in Forschung und klinischer Entwicklung; der Lungentest wird erst in Richtung klinischer Anwendung entwickelt. Ein öffentlicher Preis und offener Plattformcode fehlen. Die Meldung vom 24. November nennt für den Test weder Sensitivität noch Spezifität, Patientenergebnisse oder eine Zulassung. Eine frühere Erkennung von Organschäden ist ein Produktziel, kein belegter Patientennutzen."
      - type: p
        text: "[OpenOnco](/de/capabilities.html) ist kostenlos und veröffentlicht MIT-Code, prüfbare Regeln und quellenbelegtes Onkologiewissen für Entwürfe zu fiktiven Fällen. Es analysiert kein Blut und diagnostiziert keinen Lungenkrebs; klinische Inhalte benötigen ärztliche Prüfung. Tagomics misst biologische Signale, OpenOnco ordnet Evidenz für Diskussionen. Ein direkter Vergleich von Genauigkeit, Sicherheit oder Ergebnissen fehlt. Quellen geprüft am 25. November 2026. Dieser Artikel ersetzt keine ärztliche Beratung."
  fr:
    title: "Tagomics finance son analyse sanguine ; le test pulmonaire reste en développement"
    summary: "Une extension de financement d’amorçage de 13 millions de dollars (10 millions de livres) soutiendra LiquiPath et un programme de détection du cancer du poumon. L’investissement ne prouve aucun bénéfice clinique."
    body:
      - type: p
        text: "Le 24 novembre 2026, Tagomics, entreprise issue de l’Université de Birmingham, a annoncé une extension de financement d’amorçage de 13 millions de dollars (10 millions de livres). Selon l’entreprise, les fonds développeront LiquiPath et rapprocheront de la clinique son programme de détection du cancer du poumon. LiquiPath a été lancé en août 2026 pour des partenaires en accès anticipé; Tagomics dit mener des projets avec six grands laboratoires pharmaceutiques. Ce sont des chiffres de demande déclarés par l’entreprise, pas des mesures de performance diagnostique."
      - type: p
        text: "LiquiPath analyse l’ADN libre circulant dans le sang et utilise des cartes de méthylation propres aux tissus pour déduire l’origine possible d’un signal. Son utilisation actuelle vise la surveillance de la sécurité des médicaments en recherche et développement clinique; le test pulmonaire progresse encore vers une éventuelle application clinique. Aucun tarif public ni code ouvert de la plateforme n’est disponible. Le communiqué du 24 novembre ne donne ni sensibilité, ni spécificité, ni résultats chez les patients, ni autorisation réglementaire pour ce test. Détecter plus tôt des lésions d’organes est un objectif du produit, pas un bénéfice démontré."
      - type: p
        text: "[OpenOnco](/fr/capabilities.html) est gratuit et publie du code MIT, des règles vérifiables et des connaissances oncologiques sourcées pour des brouillons de cas fictifs. Il n’analyse pas le sang et ne diagnostique pas le cancer du poumon; un médecin doit vérifier le contenu clinique. Tagomics mesure des signaux biologiques, OpenOnco organise les preuves pour la discussion. Aucune comparaison directe de précision, sécurité ou résultats n’existe. Sources vérifiées le 25 novembre 2026. Cet article ne remplace pas un médecin."
  it:
    title: "Tagomics finanzia l’analisi del sangue; il test polmonare è ancora in sviluppo"
    summary: "Un’estensione del finanziamento iniziale di 13 milioni di dollari (10 milioni di sterline) sosterrà LiquiPath e un programma per il tumore polmonare. L’investimento non prova benefici clinici."
    body:
      - type: p
        text: "Il 24 novembre 2026 Tagomics, nata dall’Università di Birmingham, ha annunciato un’estensione del finanziamento iniziale di 13 milioni di dollari (10 milioni di sterline). Secondo l’azienda, i fondi amplieranno LiquiPath e avvicineranno alla clinica il programma di rilevamento del tumore polmonare. LiquiPath è stato lanciato nell’agosto 2026 per partner con accesso anticipato; Tagomics dichiara progetti con sei grandi aziende farmaceutiche. Sono dati sulla domanda comunicati dall’azienda, non misure di prestazione diagnostica."
      - type: p
        text: "LiquiPath analizza il DNA libero circolante nel sangue e usa mappe di metilazione specifiche dei tessuti per inferire la possibile origine di un segnale. L’attuale uso riguarda il monitoraggio della sicurezza dei farmaci nella ricerca e nello sviluppo clinico; il test polmonare è ancora in cammino verso una possibile applicazione clinica. Non sono pubblici né il prezzo né il codice della piattaforma. Il comunicato del 24 novembre non riporta sensibilità, specificità, esiti dei pazienti o autorizzazione regolatoria per il test. Rilevare prima le lesioni d’organo è un obiettivo del prodotto, non un beneficio dimostrato."
      - type: p
        text: "[OpenOnco](/it/capabilities.html) è gratuito e pubblica codice MIT, regole verificabili e conoscenze oncologiche con fonti per bozze di casi fittizi. Non analizza il sangue né diagnostica il tumore polmonare; i contenuti clinici richiedono verifica medica. Tagomics misura segnali biologici, OpenOnco organizza le prove per discuterle. Non esiste confronto diretto di accuratezza, sicurezza o esiti. Fonti verificate il 25 novembre 2026. Questo articolo non sostituisce un medico."
  da:
    title: "Tagomics får midler til blodanalyse; lungekræfttest er stadig under udvikling"
    summary: "En udvidelse af seedfinansieringen på 13 millioner dollar (10 millioner pund) skal støtte LiquiPath og et lungekræftprogram. Finansiering beviser ikke klinisk nytte."
    body:
      - type: p
        text: "Den 24. november 2026 annoncerede Tagomics, en spinout fra University of Birmingham, en udvidelse af seedfinansieringen på 13 millioner dollar (10 millioner pund). Ifølge virksomheden skal pengene skalere LiquiPath og bringe dens program til påvisning af lungekræft nærmere klinisk brug. LiquiPath blev lanceret i august 2026 for partnere med tidlig adgang; Tagomics oplyser om projekter med seks store medicinalvirksomheder. Det er virksomhedsoplysninger om efterspørgsel, ikke mål for diagnostisk ydeevne."
      - type: p
        text: "LiquiPath analyserer cellefrit DNA i blod og bruger vævsspecifikke methyleringskort til at udlede et signals mulige oprindelse. Den nuværende anvendelse er overvågning af lægemiddelsikkerhed i forskning og klinisk udvikling; lungekræfttesten er stadig på vej mod mulig klinisk anvendelse. Der er ingen offentlig pris eller åben platformskode. Meddelelsen af 24. november giver hverken sensitivitet, specificitet, patientresultater eller myndighedsgodkendelse for testen. Tidligere påvisning af organskade er et produktmål, ikke dokumenteret patientnytte."
      - type: p
        text: "[OpenOnco](/da/capabilities.html) er gratis og offentliggør MIT-kode, kontrollerbare regler og kildebelagt onkologisk viden til udkast om fiktive tilfælde. Det analyserer ikke blod og diagnosticerer ikke lungekræft; klinisk indhold kræver lægelig gennemgang. Tagomics måler biologiske signaler, OpenOnco organiserer evidens til drøftelse. Der er ingen direkte sammenligning af præcision, sikkerhed eller resultater. Kilder kontrolleret 25. november 2026. Artiklen erstatter ikke en læge."
  sv:
    title: "Tagomics finansierar blodanalys; lungcancertestet är ännu under utveckling"
    summary: "En utökad såddfinansiering på 13 miljoner dollar (10 miljoner pund) ska stödja LiquiPath och ett lungcancerprogram. Investering visar inte klinisk nytta."
    body:
      - type: p
        text: "Den 24 november 2026 meddelade Tagomics, en avknoppning från University of Birmingham, en utökad såddfinansiering på 13 miljoner dollar (10 miljoner pund). Enligt företaget ska pengarna bygga ut LiquiPath och föra dess program för lungcancerdetektion närmare klinisk användning. LiquiPath lanserades i augusti 2026 för partner med tidig tillgång; Tagomics uppger projekt med sex stora läkemedelsföretag. Det är företagets uppgifter om efterfrågan, inte mått på diagnostisk prestanda."
      - type: p
        text: "LiquiPath analyserar cellfritt DNA i blod och använder vävnadsspecifika metyleringskartor för att härleda ett signals möjliga ursprung. Det nuvarande arbetet gäller övervakning av läkemedelssäkerhet inom forskning och klinisk utveckling; lungtestet utvecklas fortfarande mot möjlig klinisk användning. Offentligt pris och öppen plattformskod saknas. Meddelandet den 24 november ger varken sensitivitet, specificitet, patientutfall eller regulatoriskt godkännande för testet. Tidigare upptäckt av organskada är ett produktmål, inte visad patientnytta."
      - type: p
        text: "[OpenOnco](/sv/capabilities.html) är gratis och publicerar MIT-kod, granskningsbara regler och källbelagd onkologisk kunskap för utkast från fiktiva fall. Det analyserar inte blod och diagnostiserar inte lungcancer; kliniskt innehåll kräver läkargranskning. Tagomics mäter biologiska signaler, OpenOnco organiserar evidens för diskussion. Det finns ingen direkt jämförelse av noggrannhet, säkerhet eller utfall. Källor kontrollerade 25 november 2026. Artikeln ersätter inte en läkare."
  nb:
    title: "Tagomics finansierer blodanalyse; lungekrefttesten er fortsatt under utvikling"
    summary: "En utvidelse av såkornfinansieringen på 13 millioner dollar (10 millioner pund) skal støtte LiquiPath og et lungekreftprogram. Investering beviser ikke klinisk nytte."
    body:
      - type: p
        text: "24. november 2026 kunngjorde Tagomics, en avlegger fra University of Birmingham, en utvidelse av såkornfinansieringen på 13 millioner dollar (10 millioner pund). Ifølge selskapet skal pengene utvide LiquiPath og bringe programmet for påvisning av lungekreft nærmere klinisk bruk. LiquiPath ble lansert i august 2026 for partnere med tidlig tilgang; Tagomics oppgir prosjekter med seks store legemiddelselskaper. Dette er selskapsopplysninger om etterspørsel, ikke mål for diagnostisk ytelse."
      - type: p
        text: "LiquiPath analyserer cellefritt DNA i blod og bruker vevsspesifikke metyleringskart til å utlede hvor et signal kan komme fra. Dagens bruk gjelder overvåking av legemiddelsikkerhet i forskning og klinisk utvikling; lungekrefttesten er fortsatt under utvikling mot mulig klinisk anvendelse. Offentlig pris og åpen plattformkode finnes ikke. Meldingen fra 24. november oppgir verken sensitivitet, spesifisitet, pasientutfall eller myndighetsgodkjenning for testen. Tidligere påvisning av organskade er et produktmål, ikke dokumentert pasientnytte."
      - type: p
        text: "[OpenOnco](/nb/capabilities.html) er gratis og publiserer MIT-kode, etterprøvbare regler og kildebelagt onkologisk kunnskap til utkast fra fiktive tilfeller. Det analyserer ikke blod og diagnostiserer ikke lungekreft; klinisk innhold krever legevurdering. Tagomics måler biologiske signaler, OpenOnco organiserer evidens til diskusjon. Det finnes ingen direkte sammenligning av nøyaktighet, sikkerhet eller utfall. Kilder kontrollert 25. november 2026. Artikkelen erstatter ikke en lege."
  fi:
    title: "Tagomics rahoittaa verianalyysiä; keuhkosyöpätesti on yhä kehitteillä"
    summary: "13 miljoonan dollarin (10 miljoonan punnan) siemenrahoituksen jatko tukee LiquiPathia ja keuhkosyöpäohjelmaa. Rahoitus ei osoita kliinistä hyötyä."
    body:
      - type: p
        text: "24. marraskuuta 2026 Birminghamin yliopistosta irtautunut Tagomics ilmoitti 13 miljoonan dollarin (10 miljoonan punnan) siemenrahoituksen jatkosta. Yhtiön mukaan varat laajentavat LiquiPathia ja vievät sen keuhkosyövän havaitsemisohjelmaa kohti kliinistä käyttöä. LiquiPath julkaistiin elokuussa 2026 varhaisen pääsyn kumppaneille; Tagomics kertoo hankkeista kuuden suuren lääkeyhtiön kanssa. Nämä ovat yhtiön ilmoittamia kysyntätietoja, eivät diagnostisen suorituskyvyn mittareita."
      - type: p
        text: "LiquiPath analysoi veren soluvapaata DNA:ta ja käyttää kudoskohtaisia metylaatiokarttoja signaalin mahdollisen alkuperän päättelemiseen. Nykyinen käyttö kohdistuu lääketurvallisuuden seurantaan tutkimuksessa ja kliinisessä kehityksessä; keuhkosyöpätestiä kehitetään vasta mahdollista kliinistä käyttöä varten. Julkista hintaa tai avointa alustakoodia ei ole. Tiedote 24. marraskuuta ei ilmoita testille herkkyyttä, spesifisyyttä, potilastuloksia eikä viranomaishyväksyntää. Elinvaurion varhaisempi havaitseminen on tuotteen tavoite, ei osoitettu potilashyöty."
      - type: p
        text: "[OpenOnco](/fi/capabilities.html) on ilmainen ja julkaisee MIT-koodia, tarkastettavia sääntöjä sekä lähteistettyä syöpätietoa kuvitteellisten tapausten luonnoksiin. Se ei analysoi verta eikä diagnosoi keuhkosyöpää; kliininen sisältö vaatii lääkärin tarkistuksen. Tagomics mittaa biologisia signaaleja, OpenOnco järjestää näyttöä keskustelua varten. Suoraa tarkkuus-, turvallisuus- tai tulosvertailua ei ole. Lähteet tarkistettu 25. marraskuuta 2026. Artikkeli ei korvaa lääkäriä."