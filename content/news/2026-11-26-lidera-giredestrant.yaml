tags: [research, breast-cancer, clinical-trial, fda, evidence]
title:
  en: "Giredestrant after surgery: fewer early breast cancer events, survival still unknown"
  uk: "Гіредестрант після операції: менше подій при ранньому раку грудей, вплив на виживання невідомий"
summary:
  en: "In 4,170 people, three-year invasive disease-free survival was 92.4% versus 89.6%; overall survival remains uncertain."
  uk: "Серед 4170 учасників трирічне виживання без інвазивної хвороби становило 92,4% проти 89,6%; вплив на загальне виживання ще неясний."
sources:
  - citation: "FDA, adjuvant giredestrant approval and efficacy/safety summary, 23 November 2026. Checked 26 November 2026."
    id: https://www.fda.gov/drugs/cancer-approvals/fda-approves-giredestrant-adjuvant-treatment-er-positive-her2-negative-stage-i-ii-and-iii-breast
  - citation: "Bardia A et al. Giredestrant in the Treatment of ER-Positive, HER2-Negative Early Breast Cancer. NEJM, published 25 November 2026. DOI 10.1056/NEJMoa2608669. Publication date checked 26 November 2026."
    id: https://doi.org/10.1056/NEJMoa2608669
  - citation: "ClinicalTrials.gov, lidERA trial NCT04961996; design and eligibility. Checked 26 November 2026."
    id: https://clinicaltrials.gov/study/NCT04961996
  - citation: "OpenOnco Tumor Board page and clinical limitations. Checked 26 November 2026."
    id: https://openonco.info/ask.html
body:
  en:
    - type: p
      text: "On 23 November 2026, the US FDA approved giredestrant after surgery for adults with ER-positive, HER2-negative stage I–III breast cancer at intermediate or high risk of recurrence. The phase 3, open-label lidERA trial randomized 4,170 people: 2,084 to giredestrant and 2,086 to standard endocrine therapy (tamoxifen or an aromatase inhibitor). The trial report appeared on 25 November. This result concerns this defined group, not every person with breast cancer."
    - type: p
      text: "At the interim analysis, invasive recurrence or death occurred in 140 versus 196 participants. Three-year invasive disease-free survival was 92.4% versus 89.6%: an absolute difference of 2.8 percentage points, or about 28 more people per 1,000 free of an invasive event at that time. The hazard ratio was 0.70. Overall-survival data were immature, so longer life has not been demonstrated. Common adverse effects include musculoskeletal pain, hot flashes and fatigue; the FDA also warns about slow heart rate and harm to a developing fetus. Open-label treatment and limited follow-up matter when interpreting a five-year course."
    - type: p
      text: "Tumor Board view, without an actual run: for a wholly fictional case after surgery, a discussion draft would first check stage, ER/HER2 status and recurrence risk, then separate the trial's absolute benefit from its safety limits and the unknown survival effect. It must not choose treatment for an individual. [OpenOnco Tumor Board](/ask.html) produces drafts for clinician review. Sources checked 26 November 2026. This article does not replace a doctor."
  uk:
    - type: p
      text: "23 листопада 2026 року FDA США схвалило гіредестрант після операції для дорослих з ER-позитивним, HER2-негативним раком грудей I–III стадії та середнім або високим ризиком рецидиву. У відкритому рандомізованому дослідженні III фази lidERA брали участь 4170 людей: 2084 отримували гіредестрант, 2086 — стандартну ендокринну терапію (тамоксифен або інгібітор ароматази). Статтю про дослідження опубліковано 25 листопада. Результат стосується саме цієї групи, а не всіх людей із раком грудей."
    - type: p
      text: "Під час проміжного аналізу інвазивний рецидив або смерть сталися у 140 проти 196 учасників. Трирічне виживання без інвазивної хвороби становило 92,4% проти 89,6%: абсолютна різниця 2,8 відсоткового пункта, тобто приблизно на 28 із 1000 людей більше не мали такої події на той час. Відношення ризиків становило 0,70. Дані щодо загального виживання ще незрілі, тому подовження життя не доведено. Серед поширених побічних явищ — біль у м’язах і суглобах, припливи та втома; FDA також попереджає про уповільнення серцебиття й шкоду для плода. Відкритий дизайн і обмежений період спостереження важливі для оцінки п’ятирічного курсу."
    - type: p
      text: "Погляд Tumor Board без реального запуску: для повністю вигаданого випадку після операції чернетка обговорення спершу мала б перевірити стадію, статус ER/HER2 та ризик рецидиву, а потім відокремити абсолютну користь у дослідженні від ризиків і невідомого впливу на виживання. Вона не може обирати лікування для конкретної людини. [OpenOnco Tumor Board](/ukr/ask.html) створює чернетки для перевірки лікарем. Джерела перевірено 26 листопада 2026 року. Цей матеріал не замінює лікаря."
translations:
  es:
    title: "Giredestrant tras la cirugía: menos eventos, supervivencia aún incierta"
    summary: "En 4170 personas, la supervivencia libre de enfermedad invasiva a tres años fue del 92,4 % frente al 89,6 %; la supervivencia global sigue siendo incierta."
    body:
      - type: p
        text: "El 23 de noviembre de 2026, la FDA estadounidense aprobó giredestrant tras la cirugía para adultos con cáncer de mama ER positivo y HER2 negativo en estadios I–III y riesgo intermedio o alto de recaída. El ensayo lidERA, aleatorizado, abierto y de fase 3, incluyó a 4170 personas: 2084 recibieron giredestrant y 2086 tratamiento endocrino estándar (tamoxifeno o un inhibidor de la aromatasa). El informe del ensayo se publicó el 25 de noviembre. El resultado se aplica a este grupo definido, no a todas las personas con cáncer de mama."
      - type: p
        text: "En el análisis intermedio hubo recurrencia invasiva o muerte en 140 frente a 196 participantes. La supervivencia libre de enfermedad invasiva a tres años fue del 92,4 % frente al 89,6 %: una diferencia absoluta de 2,8 puntos porcentuales, unas 28 personas más por cada 1000 sin un evento invasivo en ese momento. El cociente de riesgos fue 0,70. Los datos de supervivencia global aún eran inmaduros; no se ha demostrado una vida más larga. Los efectos frecuentes incluyen dolor musculoesquelético, sofocos y fatiga; la FDA también advierte de frecuencia cardíaca lenta y daño fetal. El diseño abierto y el seguimiento limitado importan al interpretar un tratamiento previsto para cinco años."
      - type: p
        text: "Perspectiva del Tumor Board, sin ejecución real: para un caso totalmente ficticio tras la cirugía, un borrador de discusión comprobaría primero el estadio, ER/HER2 y el riesgo de recaída; después separaría el beneficio absoluto observado de los riesgos y de la supervivencia aún desconocida. No puede elegir el tratamiento individual. [OpenOnco Tumor Board](/es/ask.html) genera borradores para revisión médica. Fuentes comprobadas el 26 de noviembre de 2026. Este artículo no sustituye al médico."
  pt:
    title: "Giredestrant após a cirurgia: menos eventos, sobrevivência ainda incerta"
    summary: "Em 4170 pessoas, a sobrevivência sem doença invasiva aos três anos foi 92,4% contra 89,6%; a sobrevivência global continua incerta."
    body:
      - type: p
        text: "Em 23 de novembro de 2026, a FDA dos EUA aprovou o giredestrant após cirurgia para adultos com cancro da mama ER positivo, HER2 negativo, estádio I–III e risco intermédio ou elevado de recidiva. O ensaio lidERA, aleatorizado, aberto e de fase 3, incluiu 4170 pessoas: 2084 receberam giredestrant e 2086 terapêutica endócrina padrão (tamoxifeno ou um inibidor da aromatase). O relatório do ensaio foi publicado em 25 de novembro. O resultado refere-se a este grupo definido, não a todas as pessoas com cancro da mama."
      - type: p
        text: "Na análise intercalar, ocorreu recidiva invasiva ou morte em 140 contra 196 participantes. A sobrevivência sem doença invasiva aos três anos foi 92,4% contra 89,6%: diferença absoluta de 2,8 pontos percentuais, ou cerca de mais 28 pessoas em cada 1000 sem evento invasivo nessa altura. A razão de riscos foi 0,70. Os dados de sobrevivência global eram ainda imaturos; não foi demonstrado prolongamento da vida. Efeitos frequentes incluem dor musculoesquelética, afrontamentos e fadiga; a FDA alerta também para frequência cardíaca lenta e danos no feto. O desenho aberto e o seguimento limitado importam na interpretação de uma terapêutica prevista para cinco anos."
      - type: p
        text: "Perspetiva do Tumor Board, sem execução real: num caso inteiramente fictício após cirurgia, um rascunho para discussão verificaria primeiro estádio, ER/HER2 e risco de recidiva, separando depois o benefício absoluto observado dos riscos e do efeito desconhecido na sobrevivência. Não pode escolher tratamento individual. O [OpenOnco Tumor Board](/pt/ask.html) produz rascunhos para revisão médica. Fontes verificadas em 26 de novembro de 2026. Este artigo não substitui um médico."
  de:
    title: "Giredestrant nach der Operation: weniger Ereignisse, Überleben noch unklar"
    summary: "Bei 4170 Personen lag das invasive krankheitsfreie Überleben nach drei Jahren bei 92,4 % gegenüber 89,6 %; der Einfluss auf das Gesamtüberleben ist unklar."
    body:
      - type: p
        text: "Am 23. November 2026 ließ die US-amerikanische FDA Giredestrant nach einer Operation für Erwachsene mit ER-positivem, HER2-negativem Brustkrebs im Stadium I–III und mittlerem bis hohem Rückfallrisiko zu. Die randomisierte, offene Phase-3-Studie lidERA umfasste 4170 Personen: 2084 erhielten Giredestrant, 2086 eine übliche endokrine Therapie (Tamoxifen oder einen Aromatasehemmer). Der Studienbericht erschien am 25. November. Das Ergebnis betrifft diese definierte Gruppe, nicht alle Menschen mit Brustkrebs."
      - type: p
        text: "In der Zwischenanalyse kam es bei 140 gegenüber 196 Teilnehmenden zu einem invasiven Rückfall oder Tod. Das invasive krankheitsfreie Überleben nach drei Jahren betrug 92,4 % gegenüber 89,6 %: eine absolute Differenz von 2,8 Prozentpunkten, also ungefähr 28 zusätzliche Personen je 1000 ohne invasives Ereignis zu diesem Zeitpunkt. Die Hazard Ratio betrug 0,70. Die Daten zum Gesamtüberleben waren noch unreif; eine Lebensverlängerung ist nicht belegt. Häufige Nebenwirkungen sind Muskel- und Gelenkschmerzen, Hitzewallungen und Müdigkeit; die FDA warnt außerdem vor verlangsamtem Herzschlag und Schädigung des ungeborenen Kindes. Offenes Design und begrenzte Nachbeobachtung sind bei einer auf fünf Jahre angelegten Therapie zu beachten."
      - type: p
        text: "Tumor-Board-Perspektive, ohne tatsächlichen Lauf: Für einen vollständig fiktiven Fall nach einer Operation müsste ein Diskussionsentwurf zuerst Stadium, ER/HER2-Status und Rückfallrisiko prüfen und dann den absoluten Studiennutzen von Risiken und unbekanntem Überlebenseffekt trennen. Er kann keine individuelle Therapie wählen. Das [OpenOnco Tumor Board](/de/ask.html) erstellt Entwürfe zur ärztlichen Prüfung. Quellen geprüft am 26. November 2026. Dieser Artikel ersetzt keinen Arzt."
  fr:
    title: "Girédéstrant après chirurgie : moins d’événements, survie encore incertaine"
    summary: "Chez 4170 personnes, la survie sans maladie invasive à trois ans était de 92,4 % contre 89,6 % ; l’effet sur la survie globale reste incertain."
    body:
      - type: p
        text: "Le 23 novembre 2026, la FDA américaine a approuvé le girédéstrant après chirurgie chez les adultes atteints d’un cancer du sein ER positif, HER2 négatif, de stade I–III, avec risque de récidive intermédiaire ou élevé. L’essai lidERA, randomisé, ouvert et de phase 3, a inclus 4170 personnes : 2084 sous girédéstrant et 2086 sous hormonothérapie standard (tamoxifène ou inhibiteur de l’aromatase). Le compte rendu de l’essai a paru le 25 novembre. Le résultat concerne cette population précise, pas toutes les personnes atteintes d’un cancer du sein."
      - type: p
        text: "À l’analyse intermédiaire, une récidive invasive ou un décès est survenu chez 140 contre 196 participants. La survie sans maladie invasive à trois ans était de 92,4 % contre 89,6 % : 2,8 points de pourcentage de différence absolue, soit environ 28 personnes de plus sur 1000 sans événement invasif à cette date. Le rapport de risques était de 0,70. Les données de survie globale étaient encore immatures : un allongement de la vie n’est pas démontré. Les effets fréquents comprennent douleurs musculosquelettiques, bouffées de chaleur et fatigue ; la FDA signale aussi un ralentissement cardiaque et un risque pour le fœtus. Le caractère ouvert de l’essai et le recul limité comptent pour interpréter un traitement prévu sur cinq ans."
      - type: p
        text: "Point de vue du Tumor Board, sans exécution réelle : pour un cas entièrement fictif après chirurgie, un brouillon de discussion vérifierait d’abord le stade, le statut ER/HER2 et le risque de récidive, puis distinguerait le bénéfice absolu observé des risques et de l’effet inconnu sur la survie. Il ne peut choisir un traitement individuel. [OpenOnco Tumor Board](/fr/ask.html) produit des brouillons à faire vérifier par un médecin. Sources vérifiées le 26 novembre 2026. Cet article ne remplace pas un médecin."
  it:
    title: "Giredestrant dopo l’intervento: meno eventi, sopravvivenza ancora incerta"
    summary: "Fra 4170 persone, la sopravvivenza libera da malattia invasiva a tre anni era del 92,4% contro l’89,6%; l’effetto sulla sopravvivenza globale resta incerto."
    body:
      - type: p
        text: "Il 23 novembre 2026 la FDA statunitense ha approvato giredestrant dopo l’intervento per adulti con carcinoma mammario ER positivo, HER2 negativo, stadio I–III e rischio di recidiva intermedio o alto. Lo studio lidERA, randomizzato, in aperto e di fase 3, ha incluso 4170 persone: 2084 hanno ricevuto giredestrant e 2086 una terapia endocrina standard (tamoxifene o un inibitore dell’aromatasi). Il rapporto dello studio è uscito il 25 novembre. Il risultato riguarda questo gruppo definito, non tutte le persone con tumore al seno."
      - type: p
        text: "All’analisi intermedia, recidiva invasiva o morte si sono verificate in 140 contro 196 partecipanti. La sopravvivenza libera da malattia invasiva a tre anni era del 92,4% contro l’89,6%: una differenza assoluta di 2,8 punti percentuali, circa 28 persone in più ogni 1000 senza evento invasivo in quel momento. L’hazard ratio era 0,70. I dati sulla sopravvivenza globale erano ancora immaturi: una vita più lunga non è dimostrata. Gli effetti comuni comprendono dolore muscoloscheletrico, vampate e stanchezza; la FDA avverte anche del rischio di rallentamento del battito cardiaco e di danni al feto. Disegno in aperto e follow-up limitato contano nell’interpretare una terapia prevista per cinque anni."
      - type: p
        text: "Prospettiva del Tumor Board, senza esecuzione reale: per un caso del tutto immaginario dopo l’intervento, una bozza di discussione verificherebbe prima stadio, ER/HER2 e rischio di recidiva, distinguendo poi il beneficio assoluto osservato dai rischi e dall’effetto ignoto sulla sopravvivenza. Non può scegliere una terapia individuale. [OpenOnco Tumor Board](/it/ask.html) produce bozze da verificare con un medico. Fonti controllate il 26 novembre 2026. Questo articolo non sostituisce il medico."
  da:
    title: "Giredestrant efter operation: færre hændelser, overlevelse endnu uafklaret"
    summary: "Blandt 4170 personer var treårig invasiv sygdomsfri overlevelse 92,4 % mod 89,6 %; virkningen på samlet overlevelse er fortsat uafklaret."
    body:
      - type: p
        text: "Den 23. november 2026 godkendte den amerikanske FDA giredestrant efter operation til voksne med ER-positiv, HER2-negativ brystkræft i stadium I–III og middel til høj risiko for tilbagefald. Det randomiserede, åbne fase 3-forsøg lidERA omfattede 4170 personer: 2084 fik giredestrant og 2086 standard endokrin behandling (tamoxifen eller en aromatasehæmmer). Forsøgsrapporten udkom den 25. november. Resultatet gælder denne afgrænsede gruppe, ikke alle med brystkræft."
      - type: p
        text: "Ved interimanalyserne fik 140 mod 196 deltagere invasivt tilbagefald eller døde. Treårig invasiv sygdomsfri overlevelse var 92,4 % mod 89,6 %: en absolut forskel på 2,8 procentpoint, cirka 28 flere pr. 1000 uden en invasiv hændelse på dette tidspunkt. Hazard ratio var 0,70. Data for samlet overlevelse var endnu umodne; længere levetid er ikke påvist. Almindelige bivirkninger omfatter muskel- og ledsmerter, hedeture og træthed; FDA advarer også om langsom puls og fosterskade. Åbent design og begrænset opfølgning er væsentlige ved vurdering af et planlagt femårigt forløb."
      - type: p
        text: "Tumor Board-perspektiv, uden faktisk kørsel: For et helt opdigtet tilfælde efter operation ville et diskussionsudkast først kontrollere stadium, ER/HER2-status og tilbagefaldsrisiko og dernæst skelne mellem den absolutte forsøgsgevinst, risici og den ukendte effekt på overlevelse. Det kan ikke vælge individuel behandling. [OpenOnco Tumor Board](/da/ask.html) laver udkast til lægelig gennemgang. Kilder kontrolleret 26. november 2026. Artiklen erstatter ikke en læge."
  sv:
    title: "Giredestrant efter operation: färre händelser, överlevnaden ännu oklar"
    summary: "Bland 4170 personer var treårig invasiv sjukdomsfri överlevnad 92,4 % mot 89,6 %; effekten på total överlevnad är ännu oklar."
    body:
      - type: p
        text: "Den 23 november 2026 godkände amerikanska FDA giredestrant efter operation för vuxna med ER-positiv, HER2-negativ bröstcancer i stadium I–III och medelhög eller hög återfallsrisk. Den randomiserade, öppna fas 3-studien lidERA omfattade 4170 personer: 2084 fick giredestrant och 2086 sedvanlig endokrin behandling (tamoxifen eller aromatashämmare). Studiens rapport publicerades den 25 november. Resultatet gäller denna avgränsade grupp, inte alla med bröstcancer."
      - type: p
        text: "Vid interimsanalysen fick 140 jämfört med 196 deltagare invasivt återfall eller avled. Treårig invasiv sjukdomsfri överlevnad var 92,4 % mot 89,6 %: en absolut skillnad på 2,8 procentenheter, ungefär 28 fler per 1000 utan en invasiv händelse då. Hazardkvoten var 0,70. Data om total överlevnad var ännu omogna; längre liv har inte visats. Vanliga biverkningar omfattar muskel- och ledvärk, värmevallningar och trötthet; FDA varnar också för långsam puls och fosterskada. Öppen studiedesign och begränsad uppföljning spelar roll när en planerad femårig behandling tolkas."
      - type: p
        text: "Tumor Board-perspektiv, utan faktisk körning: För ett helt påhittat fall efter operation skulle ett diskussionsutkast först kontrollera stadium, ER/HER2-status och återfallsrisk och sedan skilja den absoluta studienyttan från riskerna och den okända effekten på överlevnad. Det kan inte välja individuell behandling. [OpenOnco Tumor Board](/sv/ask.html) skapar utkast för läkargranskning. Källor kontrollerade den 26 november 2026. Artikeln ersätter inte en läkare."
  nb:
    title: "Giredestrant etter operasjon: færre hendelser, overlevelse fortsatt uavklart"
    summary: "Blant 4170 personer var treårig invasiv sykdomsfri overlevelse 92,4 % mot 89,6 %; effekten på totaloverlevelse er fortsatt uavklart."
    body:
      - type: p
        text: "Den 23. november 2026 godkjente amerikanske FDA giredestrant etter operasjon for voksne med ER-positiv, HER2-negativ brystkreft i stadium I–III og middels eller høy risiko for tilbakefall. Den randomiserte, åpne fase 3-studien lidERA omfattet 4170 personer: 2084 fikk giredestrant og 2086 standard endokrin behandling (tamoksifen eller aromatasehemmer). Studierapporten ble publisert 25. november. Resultatet gjelder denne avgrensede gruppen, ikke alle med brystkreft."
      - type: p
        text: "Ved interimsanalysen fikk 140 mot 196 deltakere invasivt tilbakefall eller døde. Treårig invasiv sykdomsfri overlevelse var 92,4 % mot 89,6 %: en absolutt forskjell på 2,8 prosentpoeng, omtrent 28 flere per 1000 uten en invasiv hendelse da. Hazardratio var 0,70. Data om totaloverlevelse var fortsatt umodne; lengre levetid er ikke vist. Vanlige bivirkninger omfatter muskel- og leddsmerter, hetetokter og tretthet; FDA advarer også om langsom puls og fosterskade. Åpent design og begrenset oppfølging er viktig ved tolkning av en planlagt femårig behandling."
      - type: p
        text: "Tumor Board-perspektiv, uten faktisk kjøring: For et helt oppdiktet tilfelle etter operasjon ville et diskusjonsutkast først kontrollere stadium, ER/HER2-status og tilbakefallsrisiko, og deretter skille absolutt studienytte fra risiko og ukjent effekt på overlevelse. Det kan ikke velge individuell behandling. [OpenOnco Tumor Board](/nb/ask.html) lager utkast for legegjennomgang. Kilder kontrollert 26. november 2026. Artikkelen erstatter ikke en lege."
  fi:
    title: "Giredestrantti leikkauksen jälkeen: vähemmän tapahtumia, elossaolovaikutus vielä epäselvä"
    summary: "4170 osallistujalla kolmen vuoden invasiivisesta taudista vapaa elossaolo oli 92,4 % vastaan 89,6 %; vaikutus kokonaiselossaoloon on epäselvä."
    body:
      - type: p
        text: "Yhdysvaltain FDA hyväksyi 23. marraskuuta 2026 giredestrantin leikkauksen jälkeiseen käyttöön aikuisille, joilla on ER-positiivinen, HER2-negatiivinen vaiheen I–III rintasyöpä ja keskisuuri tai suuri uusiutumisriski. Satunnaistettuun, avoimeen vaiheen 3 lidERA-tutkimukseen osallistui 4170 ihmistä: 2084 sai giredestranttia ja 2086 tavanomaista endokriinistä hoitoa (tamoksifeenia tai aromataasin estäjää). Tutkimusraportti julkaistiin 25. marraskuuta. Tulos koskee tätä rajattua ryhmää, ei kaikkia rintasyöpää sairastavia."
      - type: p
        text: "Välianalyysissä invasiivinen uusiutuminen tai kuolema todettiin 140:llä verrattuna 196 osallistujaan. Kolmen vuoden invasiivisesta taudista vapaa elossaolo oli 92,4 % vastaan 89,6 %: absoluuttinen ero 2,8 prosenttiyksikköä eli noin 28 ihmistä enemmän tuhatta kohti ilman invasiivista tapahtumaa tuolloin. Riskisuhde oli 0,70. Kokonaiselossaolon tiedot olivat vielä keskeneräiset, joten pidempää elinikää ei ole osoitettu. Tavallisia haittoja ovat lihas- ja nivelkivut, kuumat aallot ja väsymys; FDA varoittaa myös hitaasta sykkeestä ja sikiöhaitoista. Avoin tutkimusasetelma ja rajallinen seuranta on huomioitava arvioitaessa viideksi vuodeksi suunniteltua hoitoa."
      - type: p
        text: "Tumor Board -näkökulma, ilman todellista ajoa: täysin kuvitteellisessa leikkauksen jälkeisessä tapauksessa keskusteluluonnos tarkistaisi ensin vaiheen, ER/HER2-tilan ja uusiutumisriskin ja erottaisi sitten tutkimuksen absoluuttisen hyödyn riskeistä ja epäselvästä elossaolovaikutuksesta. Se ei voi valita yksilöllistä hoitoa. [OpenOnco Tumor Board](/fi/ask.html) tuottaa luonnoksia lääkärin tarkistettavaksi. Lähteet tarkistettu 26. marraskuuta 2026. Artikkeli ei korvaa lääkäriä."