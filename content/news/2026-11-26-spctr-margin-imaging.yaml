    id: https://openonco.info/capabilities.html
body:
  en:
    - type: p
      text: "On 26 November 2026, UtrechtInc reported that Dutch startup SPCTR had secured €2.8 million for SPCTRone. A local report published the same day corroborated the announcement. The money is intended for a follow-up study across hospitals, initial devices and steps toward European CE marking. These are development plans, not a clearance or proof that the device prevents repeat operations."
    - type: p
      text: "SPCTR describes SPCTRone as optical imaging plus AI to assess the edge of tissue removed during surgery, with breast-conserving operations the first focus. The intended workflow is to give surgeons information while they can still remove more tissue in the same procedure. Its registered SPCTR-I study is prospective and observational; the ClinicalTrials.gov record, updated 25 November, lists an estimated 250 participants but no posted results. UtrechtInc says an earlier study involved over 200 people, without publishing sensitivity, specificity or repeat-operation outcomes. The public pages reviewed do not give a user price or source-code licence."
    - type: p
      text: "OpenOnco addresses a different step: free, MIT-licensed code and source-linked rules use structured oncology information to draft material for clinician discussion. Its rules and citations can be inspected, but it has no formal clinical validation and cannot analyse a surgical specimen. SPCTR's imaging model and detailed validation are not publicly inspectable in the pages reviewed; its promise should not be scored against OpenOnco's rule engine as if they perform the same task. A future device could complement pathology and a discussion tool. Sources checked 26 November 2026. This article does not replace a doctor."
  uk:
    - type: p
      text: "26 листопада 2026 року інкубатор UtrechtInc повідомив, що нідерландський стартап SPCTR залучив €2,8 млн для SPCTRone. Місцеве видання підтвердило оголошення того самого дня. Кошти призначені для подальшого дослідження в кількох лікарнях, першої серії пристроїв і підготовки до європейського маркування CE. Це плани розробки, а не дозвіл на застосування чи доказ запобігання повторним операціям."
    - type: p
      text: "SPCTR описує SPCTRone як поєднання оптичної візуалізації та ШІ для оцінки краю видаленої під час операції тканини; перший напрям — органозберігальні операції на молочній залозі. Задуманий процес має дати хірургу інформацію, поки він ще може видалити додаткову тканину в межах тієї самої операції. Зареєстроване дослідження SPCTR-I є проспективним спостережним; запис ClinicalTrials.gov, оновлений 25 листопада, вказує запланованих 250 учасників, але результатів ще немає. UtrechtInc повідомляє про понад 200 людей у попередньому дослідженні, не публікуючи чутливості, специфічності чи частоти повторних операцій. На переглянутих відкритих сторінках немає ціни для користувача або ліцензії вихідного коду."
    - type: p
      text: "OpenOnco працює на іншому етапі: безкоштовний код під ліцензією MIT і правила з посиланнями на джерела використовують структуровані онкологічні дані для чернеток до обговорення з лікарем. Правила й цитування можна перевірити, але формальної клінічної валідації немає, а хірургічний зразок сервіс не аналізує. Модель візуалізації SPCTR і детальна перевірка її якості не доступні для незалежного огляду на переглянутих сторінках; порівнювати її обіцянки з механізмом правил OpenOnco як однакові задачі не можна. Майбутній пристрій може доповнювати патологію та інструмент для обговорення. Джерела перевірено 26 листопада 2026 року. Матеріал не замінює лікаря."
translations:
  es:
    title: "SPCTR financia una revisión de márgenes en quirófano; falta demostrar beneficio clínico"
    summary: "La startup neerlandesa obtuvo 2,8 millones de euros para SPCTRone y un estudio multicéntrico. La precisión y la reducción de nuevas operaciones siguen sin demostrarse."
    body:
      - type: p
        text: "El 26 de noviembre de 2026, la incubadora UtrechtInc informó que la startup neerlandesa SPCTR había obtenido 2,8 millones de euros para SPCTRone. Un medio local confirmó el anuncio ese mismo día. Los fondos se destinan a un estudio de seguimiento en varios hospitales, los primeros dispositivos y los pasos hacia el marcado CE europeo. Son planes de desarrollo, no una autorización ni prueba de que evite nuevas operaciones."
      - type: p
        text: "SPCTR describe SPCTRone como imagen óptica más IA para evaluar el borde del tejido extirpado durante la cirugía; su primer objetivo es la cirugía conservadora de mama. La idea es informar al cirujano mientras aún puede extirpar más tejido en la misma intervención. Su estudio SPCTR-I registrado es prospectivo y observacional; el registro de ClinicalTrials.gov, actualizado el 25 de noviembre, prevé 250 participantes, pero no publica resultados. UtrechtInc habla de más de 200 personas en un estudio anterior, sin publicar sensibilidad, especificidad ni tasas de reintervención. Las páginas públicas revisadas no indican precio para el usuario ni licencia del código fuente."
      - type: p
        text: "OpenOnco actúa en otra fase: su código gratuito con licencia MIT y sus reglas con fuentes usan información oncológica estructurada para elaborar borradores que revisa un médico. Las reglas y citas son inspeccionables, pero carece de validación clínica formal y no analiza muestras quirúrgicas. El modelo de imagen de SPCTR y su validación detallada no se pueden inspeccionar públicamente en las páginas revisadas; no corresponde comparar su promesa con el motor de reglas de OpenOnco como si hicieran la misma tarea. Un futuro dispositivo podría complementar la patología y una herramienta de discusión. Fuentes comprobadas el 26 de noviembre de 2026. Este artículo no sustituye al médico."
  pt:
    title: "SPCTR financia avaliação de margens no bloco operatório; benefício clínico por demonstrar"
    summary: "A startup neerlandesa angariou 2,8 milhões de euros para o SPCTRone e um estudo multicêntrico. Precisão e menos reoperações ainda não estão demonstradas."
    body:
      - type: p
        text: "Em 26 de novembro de 2026, a incubadora UtrechtInc informou que a startup neerlandesa SPCTR angariou 2,8 milhões de euros para o SPCTRone. Um órgão de comunicação local confirmou o anúncio no mesmo dia. O financiamento destina-se a um estudo de seguimento em vários hospitais, aos primeiros dispositivos e aos passos para obter a marcação CE europeia. São planos de desenvolvimento, não uma autorização nem prova de que evita novas operações."
      - type: p
        text: "A SPCTR descreve o SPCTRone como imagem ótica combinada com IA para avaliar a margem de tecido removido durante a cirurgia; o primeiro foco é a cirurgia conservadora da mama. Pretende informar o cirurgião enquanto ainda pode remover mais tecido na mesma intervenção. O estudo registado SPCTR-I é prospetivo e observacional; o registo ClinicalTrials.gov, atualizado em 25 de novembro, prevê 250 participantes, mas não apresenta resultados. A UtrechtInc refere mais de 200 pessoas num estudo anterior, sem publicar sensibilidade, especificidade ou taxas de reoperação. As páginas públicas consultadas não indicam preço para o utilizador nem licença do código-fonte."
      - type: p
        text: "O OpenOnco atua noutra etapa: código gratuito sob licença MIT e regras com fontes usam dados oncológicos estruturados para criar rascunhos de discussão com um médico. Regras e referências podem ser inspecionadas, mas não há validação clínica formal e a ferramenta não analisa uma amostra cirúrgica. O modelo de imagem da SPCTR e a sua validação detalhada não estão disponíveis para inspeção pública nas páginas revistas; não faz sentido comparar a promessa com o motor de regras do OpenOnco como tarefas idênticas. Um futuro dispositivo poderá complementar a patologia e uma ferramenta de discussão. Fontes verificadas em 26 de novembro de 2026. Este artigo não substitui um médico."
  de:
    title: "SPCTR finanziert Schnittrandprüfung im OP; klinischer Nutzen noch unbelegt"
    summary: "Das niederländische Start-up erhielt 2,8 Millionen Euro für SPCTRone und eine multizentrische Studie. Genauigkeit und weniger Folgeoperationen sind noch nicht belegt."
    body:
      - type: p
        text: "Am 26. November 2026 meldete der Inkubator UtrechtInc, dass das niederländische Start-up SPCTR 2,8 Millionen Euro für SPCTRone erhalten hat. Ein lokales Medium bestätigte die Meldung am selben Tag. Das Geld ist für eine Folgestudie an mehreren Kliniken, erste Geräte und Schritte zur europäischen CE-Kennzeichnung vorgesehen. Das sind Entwicklungspläne, keine Zulassung und kein Beleg für weniger erneute Operationen."
      - type: p
        text: "SPCTR beschreibt SPCTRone als optische Bildgebung mit KI zur Beurteilung des Randes von während der Operation entferntem Gewebe; zuerst geht es um brusterhaltende Eingriffe. Die beabsichtigte Anwendung soll Chirurgen informieren, solange sie im selben Eingriff noch zusätzliches Gewebe entfernen können. Die registrierte SPCTR-I-Studie ist prospektiv und beobachtend; der am 25. November aktualisierte ClinicalTrials.gov-Eintrag nennt 250 geplante Teilnehmende, aber keine veröffentlichten Ergebnisse. UtrechtInc berichtet von über 200 Personen in einer früheren Studie, ohne Sensitivität, Spezifität oder Nachoperationsraten zu veröffentlichen. Auf den geprüften öffentlichen Seiten stehen weder ein Nutzerpreis noch eine Quellcode-Lizenz."
      - type: p
        text: "OpenOnco greift an einem anderen Punkt ein: Kostenloser Code unter MIT-Lizenz und quellverknüpfte Regeln nutzen strukturierte onkologische Angaben für ärztlich zu prüfende Diskussionsentwürfe. Regeln und Quellen sind einsehbar, doch eine formale klinische Validierung fehlt und das System untersucht keine Operationspräparate. Das Bildmodell von SPCTR und seine detaillierte Validierung sind auf den geprüften Seiten nicht öffentlich einsehbar; seine Versprechen sollten nicht wie dieselbe Aufgabe mit der Regelmaschine von OpenOnco verglichen werden. Ein künftiges Gerät könnte Pathologie und Diskussionstool ergänzen. Quellen geprüft am 26. November 2026. Dieser Artikel ersetzt keinen Arzt."
  fr:
    title: "SPCTR finance l’analyse des marges au bloc ; bénéfice clinique encore à prouver"
    summary: "La jeune entreprise néerlandaise a levé 2,8 millions d’euros pour SPCTRone et une étude multicentrique. Précision et baisse des reprises chirurgicales restent à démontrer."
    body:
      - type: p
        text: "Le 26 novembre 2026, l’incubateur UtrechtInc a annoncé que la jeune entreprise néerlandaise SPCTR avait obtenu 2,8 millions d’euros pour SPCTRone. Un média local a confirmé l’annonce le même jour. Les fonds doivent financer une étude de suivi dans plusieurs hôpitaux, les premiers appareils et les étapes vers le marquage CE européen. Il s’agit de projets de développement, pas d’une autorisation ni d’une preuve de réduction des reprises chirurgicales."
      - type: p
        text: "SPCTR présente SPCTRone comme une imagerie optique associée à l’IA pour évaluer le bord du tissu retiré pendant l’opération, d’abord lors de chirurgies mammaires conservatrices. L’objectif est d’informer le chirurgien tant qu’il peut encore enlever du tissu au cours de la même intervention. L’étude enregistrée SPCTR-I est prospective et observationnelle ; sa fiche ClinicalTrials.gov, mise à jour le 25 novembre, prévoit 250 participants mais ne publie aucun résultat. UtrechtInc évoque plus de 200 personnes dans une étude antérieure, sans publier sensibilité, spécificité ou taux de réintervention. Les pages publiques consultées ne donnent ni prix utilisateur ni licence du code source."
      - type: p
        text: "OpenOnco intervient à une autre étape : son code gratuit sous licence MIT et ses règles reliées aux sources utilisent des données oncologiques structurées pour préparer des brouillons à discuter avec un médecin. Règles et références sont consultables, mais il n’existe pas de validation clinique formelle et l’outil n’analyse pas de prélèvement chirurgical. Le modèle d’imagerie de SPCTR et sa validation détaillée ne sont pas publiquement inspectables dans les pages examinées ; il serait trompeur de comparer sa promesse au moteur de règles d’OpenOnco comme s’ils remplissaient la même tâche. Un futur dispositif pourrait compléter l’anatomopathologie et un outil de discussion. Sources vérifiées le 26 novembre 2026. Cet article ne remplace pas un médecin."
  it:
    title: "SPCTR finanzia l’analisi dei margini in sala operatoria; beneficio clinico ancora da provare"
    summary: "La startup olandese ha raccolto 2,8 milioni di euro per SPCTRone e uno studio multicentrico. Accuratezza e meno reinterventi non sono ancora dimostrati."
    body:
      - type: p
        text: "Il 26 novembre 2026 l’incubatore UtrechtInc ha riferito che la startup olandese SPCTR ha ottenuto 2,8 milioni di euro per SPCTRone. Un giornale locale ha confermato l’annuncio lo stesso giorno. I fondi servono per uno studio successivo in più ospedali, i primi dispositivi e i passi verso la marcatura CE europea. Sono programmi di sviluppo, non un’autorizzazione né una prova di riduzione dei reinterventi."
      - type: p
        text: "SPCTR descrive SPCTRone come imaging ottico con IA per valutare il margine del tessuto asportato durante l’intervento, inizialmente nella chirurgia conservativa della mammella. Lo scopo è informare il chirurgo finché può rimuovere altro tessuto nella stessa operazione. Lo studio registrato SPCTR-I è prospettico e osservazionale; il record ClinicalTrials.gov, aggiornato il 25 novembre, prevede 250 partecipanti ma non pubblica risultati. UtrechtInc riferisce oltre 200 persone in uno studio precedente, senza pubblicare sensibilità, specificità o tassi di reintervento. Le pagine pubbliche consultate non indicano un prezzo per l’utente né una licenza del codice sorgente."
      - type: p
        text: "OpenOnco opera in un’altra fase: codice gratuito con licenza MIT e regole collegate alle fonti usano dati oncologici strutturati per bozze da discutere con un medico. Regole e riferimenti sono consultabili, ma manca una validazione clinica formale e il sistema non analizza campioni chirurgici. Il modello di imaging di SPCTR e la sua validazione dettagliata non sono pubblicamente ispezionabili nelle pagine esaminate; non si dovrebbero confrontare le sue promesse con il motore di regole di OpenOnco come se svolgessero lo stesso compito. Un futuro dispositivo potrebbe integrare anatomia patologica e strumenti di discussione. Fonti verificate il 26 novembre 2026. Questo articolo non sostituisce il medico."
  da:
    title: "SPCTR finansierer kontrol af operationsrande; klinisk nytte mangler bevis"
    summary: "Den hollandske startup har rejst 2,8 millioner euro til SPCTRone og et multicenterstudie. Nøjagtighed og færre genoperationer er endnu ikke dokumenteret."
    body:
      - type: p
        text: "Den 26. november 2026 meddelte inkubatoren UtrechtInc, at den hollandske startup SPCTR havde sikret 2,8 millioner euro til SPCTRone. Et lokalt medie bekræftede meddelelsen samme dag. Pengene skal gå til et opfølgende studie på flere hospitaler, de første apparater og skridt mod europæisk CE-mærkning. Det er udviklingsplaner, ikke en godkendelse eller dokumentation for færre genoperationer."
      - type: p
        text: "SPCTR beskriver SPCTRone som optisk billeddannelse kombineret med AI til at vurdere kanten af væv, der er fjernet under operation, først ved brystbevarende kirurgi. Den tilsigtede arbejdsgang skal give kirurgen information, mens mere væv stadig kan fjernes under samme indgreb. Det registrerede SPCTR-I-studie er prospektivt og observationelt; ClinicalTrials.gov-posten, opdateret 25. november, angiver 250 planlagte deltagere, men ingen offentliggjorte resultater. UtrechtInc omtaler over 200 personer i et tidligere studie uden at offentliggøre sensitivitet, specificitet eller antal genoperationer. De gennemgåede offentlige sider angiver hverken brugerpris eller kildekodelicens."
      - type: p
        text: "OpenOnco arbejder på et andet trin: Gratis MIT-licenseret kode og regler med kildehenvisninger bruger strukturerede onkologiske oplysninger til udkast for lægelig drøftelse. Regler og kilder kan undersøges, men formel klinisk validering mangler, og værktøjet analyserer ikke operationsvæv. SPCTR's billedmodel og detaljerede validering kan ikke undersøges offentligt på de gennemgåede sider; løftet bør ikke sammenlignes med OpenOncos regelmotor, som om de udførte samme opgave. Et fremtidigt apparat kan supplere patologi og et diskussionsværktøj. Kilder kontrolleret 26. november 2026. Artiklen erstatter ikke en læge."
  sv:
    title: "SPCTR finansierar kontroll av operationsmarginaler; klinisk nytta återstår att visa"
    summary: "Den nederländska startupen har fått 2,8 miljoner euro för SPCTRone och en multicenterstudie. Träffsäkerhet och färre omoperationer är ännu inte visade."
    body:
      - type: p
        text: "Den 26 november 2026 meddelade inkubatorn UtrechtInc att nederländska SPCTR hade fått 2,8 miljoner euro för SPCTRone. En lokal nyhetskälla bekräftade beskedet samma dag. Pengarna ska gå till en uppföljande studie vid flera sjukhus, de första apparaterna och steg mot europeisk CE-märkning. Det är utvecklingsplaner, inte ett godkännande eller bevis för färre omoperationer."
      - type: p
        text: "SPCTR beskriver SPCTRone som optisk avbildning kombinerad med AI för att bedöma kanten av vävnad som avlägsnats under kirurgi, först vid bröstbevarande operationer. Tanken är att ge kirurgen information medan ytterligare vävnad fortfarande kan tas bort under samma ingrepp. Den registrerade SPCTR-I-studien är prospektiv och observationell; ClinicalTrials.gov-posten, uppdaterad den 25 november, anger 250 planerade deltagare men inga publicerade resultat. UtrechtInc uppger över 200 personer i en tidigare studie utan att redovisa sensitivitet, specificitet eller omoperationsfrekvens. De granskade offentliga sidorna anger varken användarpris eller källkodslicens."
      - type: p
        text: "OpenOnco används i ett annat steg: gratis MIT-licensierad kod och regler med källhänvisningar använder strukturerad onkologisk information för diskussionsutkast som ska granskas av läkare. Regler och källor kan granskas, men formell klinisk validering saknas och verktyget analyserar inte operationsvävnad. SPCTR:s bildmodell och detaljerade validering går inte att granska offentligt på de genomgångna sidorna; löftet bör inte jämföras med OpenOncos regelmotor som om de utförde samma uppgift. En framtida apparat kan komplettera patologin och ett diskussionsverktyg. Källor kontrollerade den 26 november 2026. Artikeln ersätter inte en läkare."
  nb:
    title: "SPCTR finansierer kontroll av operasjonsmarginer; klinisk nytte er ennå ikke vist"
    summary: "Den nederlandske oppstartsbedriften fikk 2,8 millioner euro til SPCTRone og en multisenterstudie. Nøyaktighet og færre reoperasjoner er ikke dokumentert."
    body:
      - type: p
        text: "Den 26. november 2026 meldte inkubatoren UtrechtInc at nederlandske SPCTR hadde sikret 2,8 millioner euro til SPCTRone. En lokal nyhetskilde bekreftet meldingen samme dag. Pengene skal gå til en oppfølgingsstudie ved flere sykehus, de første apparatene og arbeid mot europeisk CE-merking. Dette er utviklingsplaner, ikke en godkjenning eller bevis for færre reoperasjoner."
      - type: p
        text: "SPCTR beskriver SPCTRone som optisk avbildning kombinert med KI for å vurdere kanten av vev fjernet under operasjonen, først ved brystbevarende kirurgi. Målet er å gi kirurgen informasjon mens mer vev fortsatt kan fjernes i samme inngrep. Den registrerte SPCTR-I-studien er prospektiv og observasjonell; ClinicalTrials.gov-oppføringen, oppdatert 25. november, anslår 250 deltakere, men har ingen publiserte resultater. UtrechtInc omtaler over 200 personer i en tidligere studie uten å publisere sensitivitet, spesifisitet eller reoperasjonsrater. De gjennomgåtte offentlige sidene oppgir verken brukerpris eller kildekodelisens."
      - type: p
        text: "OpenOnco virker på et annet trinn: gratis MIT-lisensiert kode og regler med kildehenvisninger bruker strukturerte onkologiske opplysninger til diskusjonsutkast som skal vurderes av lege. Regler og kilder kan undersøkes, men formell klinisk validering mangler, og verktøyet analyserer ikke operasjonsvev. SPCTRs bildemodell og detaljerte validering er ikke offentlig tilgjengelig for innsyn på sidene vi gjennomgikk; løftet bør ikke sammenlignes med OpenOncos regelmotor som om de utførte samme oppgave. Et fremtidig apparat kan utfylle patologi og et diskusjonsverktøy. Kilder kontrollert 26. november 2026. Artikkelen erstatter ikke en lege."
  fi:
    title: "SPCTR rahoittaa leikkausmarginaalin tarkistusta; kliininen hyöty on vielä osoittamatta"
    summary: "Alankomaalainen startup sai 2,8 miljoonaa euroa SPCTRoneen ja monikeskustutkimukseen. Tarkkuutta ja uusintaleikkausten vähenemistä ei ole vielä osoitettu."
    body:
      - type: p
        text: "UtrechtInc-yrityshautomo ilmoitti 26. marraskuuta 2026, että alankomaalainen SPCTR oli saanut 2,8 miljoonaa euroa SPCTRonea varten. Paikallismedia vahvisti uutisen samana päivänä. Rahat on tarkoitettu usean sairaalan jatkotutkimukseen, ensimmäisiin laitteisiin ja etenemiseen kohti eurooppalaista CE-merkintää. Nämä ovat kehityssuunnitelmia, eivät hyväksyntä tai näyttö uusintaleikkausten vähenemisestä."
      - type: p
        text: "SPCTR kuvaa SPCTRonea optisen kuvantamisen ja tekoälyn yhdistelmäksi, jolla arvioidaan leikkauksessa poistetun kudoksen reunaa; ensimmäinen kohde on rinnan säästävä leikkaus. Tarkoitus on antaa kirurgille tietoa, kun lisäkudosta voidaan vielä poistaa saman toimenpiteen aikana. Rekisteröity SPCTR-I-tutkimus on prospektiivinen havainnointitutkimus; 25. marraskuuta päivitetty ClinicalTrials.gov-tietue arvioi osallistujamääräksi 250, mutta tuloksia ei ole julkaistu. UtrechtInc kertoo yli 200 henkilöstä aiemmassa tutkimuksessa julkaisematta herkkyyttä, spesifisyyttä tai uusintaleikkausten määrää. Tarkastelluilla julkisilla sivuilla ei ilmoiteta käyttäjähintaa eikä lähdekoodin lisenssiä."
      - type: p
        text: "OpenOnco toimii eri vaiheessa: ilmainen MIT-lisensoitu koodi ja lähteisiin sidotut säännöt käyttävät jäsennettyjä onkologisia tietoja lääkärin kanssa käsiteltävien luonnosten tekemiseen. Säännöt ja lähteet ovat tarkastettavissa, mutta muodollista kliinistä validointia ei ole eikä työkalu analysoi leikkausnäytteitä. SPCTR:n kuvantamismalli ja sen yksityiskohtainen validointi eivät ole julkisesti tarkastettavissa käydyillä sivuilla; lupausta ei pidä verrata OpenOncon sääntömoottoriin kuin ne tekisivät samaa työtä. Tuleva laite voisi täydentää patologiaa ja keskustelutyökalua. Lähteet tarkistettu 26. marraskuuta 2026. Artikkeli ei korvaa lääkäriä."