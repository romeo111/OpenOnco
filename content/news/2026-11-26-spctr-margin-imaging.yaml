title:
  en: "SPCTR funds an operating-room margin check; proof of clinical benefit is still ahead"
  uk: "SPCTR фінансує перевірку країв пухлини під час операції; клінічну користь ще слід довести"
summary:
  en: "The Dutch startup raised €2.8 million for SPCTRone and a multicentre study. Surgical-margin accuracy and fewer repeat operations are still unproven."
  uk: "Нідерландський стартап залучив €2,8 млн для SPCTRone і багатоцентрового дослідження. Точність та зменшення повторних операцій ще не доведені."
sources:
  - citation: "UtrechtInc, SPCTR funding announcement and proposed multi-hospital follow-up. Checked 26 November 2026."
    id: https://utrechtinc.nl/artikel/spctr-secures-2-8-million-to-detect-positive-margins-during-surgery/
  - citation: "Groninger Internet Courant, dated report of SPCTR announcement and surgeon interview, 26 November 2026. Checked 26 November 2026."
    id: https://gic.nl/innovatie/gronings-apparaat-kan-binnen-minuten-laten-zien-of-tumor-volledig-weg-is
  - citation: "SPCTR official product site, intended optical imaging and AI workflow. Checked 26 November 2026."
    id: https://www.spctr.tech/
  - citation: "ClinicalTrials.gov, SPCTR-I NCT07459062, record updated 25 November 2026; estimated enrollment 250 and no posted results. Checked 26 November 2026."
    id: https://clinicaltrials.gov/study/NCT07459062
  - citation: "OpenOnco repository, MIT licence, source-linked rule engine and clinical limits. Checked 26 November 2026."
    id: https://github.com/romeo111/OpenOnco
