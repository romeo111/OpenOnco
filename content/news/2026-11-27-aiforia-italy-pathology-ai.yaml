slug: aiforia-italy-pathology-ai-contract
date: 2026-11-26
published: 2026-11-27
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, digital-pathology, cancer-diagnostics, clinical-workflow, evidence]
title:
  en: "Aiforia signs an Italian pathology AI deal; deployment and outcomes lie ahead"
  uk: "Aiforia уклала угоду з лікарнею в Італії; впровадження й результати попереду"
summary:
  en: "The two-year agreement covers six diagnostic areas, but deployment is expected in spring 2027. The announcement reports no local accuracy or patient-outcome data."
  uk: "Дворічна угода охоплює шість напрямів діагностики, але запуск очікують навесні 2027 року. Даних про точність у лікарні чи наслідки для пацієнтів немає."
sources:
  - citation: "Aiforia, dated Italian public hospital contract announcement, 26 November 2026. Checked 27 November 2026."
    id: https://www.aiforia.com/press-releases/aiforia-selected-for-ai-assisted-cancer-diagnostics-by-a-public-hospital-in-italy
  - citation: "Aiforia Clinical Solutions, product functions and model-specific regulatory status. Checked 27 November 2026."
    id: https://www.aiforia.com/aiforia-clinical-solutions
  - citation: "NICE, final scope for AI pathology breast biopsy assessment, May 2026. Checked 27 November 2026."
    id: https://www.nice.org.uk/guidance/gid-ta11959/documents/final-scope
  - citation: "OpenOnco repository, MIT licence, source-linked rules and clinical limits. Checked 27 November 2026."
    id: https://github.com/romeo111/OpenOnco
  - citation: "OpenOnco capabilities and evidence limits. Checked 27 November 2026."
    id: https://openonco.info/capabilities.html
body:
  en:
    - type: p
      text: "On 26 November 2026, Aiforia said it signed a two-year agreement with an unnamed Italian public university hospital. It covers AI suites for breast, prostate, lung and gastric cancer, plus colonoscopy and lymph-node metastasis. The company expects clinical deployment in spring 2027. The contract and timeline are company-reported facts; the announcement does not show that the tools are already working there or report a contract price."
    - type: p
      text: "Aiforia's current product pages describe analysis of digitised pathology slides: a worklist, viewer with visual overlays, quantitative models and case-level reports for pathologists. Regulatory status differs by model and region: only specified tools are CE-IVD marked for diagnostic use in the EU/EEA; elsewhere the company limits use to research or performance studies. A May 2026 NICE scope document independently lists the Breast Cancer Suite among tools under assessment and records some UK use. A scope is not an endorsement of clinical benefit. Neither that document nor this Italian contract gives site-specific accuracy, faster diagnosis or patient-outcome results."
    - type: p
      text: "OpenOnco works with structured oncology information rather than slide images. Its free MIT-licensed code and source-linked rules produce drafts for clinician discussion; they are inspectable but not formally clinically validated. Aiforia provides visual findings that a pathologist can review, while its model internals are not publicly inspectable in the reviewed material; its institutional pricing is not public. These workflows may complement each other, but no head-to-head comparison supports an accuracy or survival claim. Sources checked 27 November 2026. This article does not replace a doctor."
  uk:
    - type: p
      text: "26 листопада 2026 року Aiforia повідомила про дворічну угоду з неназваною державною університетською лікарнею Італії. Вона охоплює системи ШІ для раку молочної залози, простати, легень і шлунка, а також колоноскопії та метастазів у лімфовузлах. Компанія очікує клінічного впровадження навесні 2027 року. Угода й терміни відомі зі слів компанії; повідомлення не доводить, що інструменти вже працюють у цій лікарні, і не називає вартості контракту."
    - type: p
      text: "Чинні сторінки продукту Aiforia описують аналіз оцифрованих гістологічних препаратів: список завдань, переглядач із візуальними позначками, кількісні моделі та звіти для патологів. Регуляторний статус залежить від моделі й регіону: лише визначені інструменти мають маркування CE-IVD для діагностики в ЄС/ЄЕЗ; в інших країнах компанія обмежує використання дослідженнями або оцінкою характеристик. Документ NICE від травня 2026 року незалежно включає Breast Cancer Suite до переліку технологій для оцінки й фіксує певне використання у Великій Британії. Перелік для оцінки не є підтвердженням клінічної користі. Ані він, ані італійська угода не наводять місцевих даних про точність, швидкість діагностики чи наслідки для пацієнтів."
    - type: p
      text: "OpenOnco працює зі структурованими онкологічними даними, а не із зображеннями препаратів. Його безкоштовний код під ліцензією MIT і правила з посиланнями на джерела створюють чернетки для обговорення з лікарем; їх можна перевірити, але формальної клінічної валідації немає. Aiforia показує візуальні знахідки, які може перевірити патолог, проте внутрішня будова моделей не доступна для публічного огляду в переглянутих матеріалах; ціни для закладів не оприлюднені. Інструменти можуть доповнювати один одного, але прямих даних для заяв про вищу точність або виживаність немає. Джерела перевірено 27 листопада 2026 року. Матеріал не замінює лікаря."
translations:
  es:
    title: "Aiforia firma un acuerdo de IA patológica en Italia; faltan despliegue y resultados"
    summary: "El acuerdo de dos años abarca seis áreas diagnósticas, pero el despliegue se prevé para la primavera de 2027. No hay datos locales de precisión ni resultados clínicos."
    body:
      - type: p
        text: "El 26 de noviembre de 2026, Aiforia comunicó un acuerdo de dos años con un hospital universitario público italiano no identificado. Abarca sistemas de IA para cáncer de mama, próstata, pulmón y estómago, además de colonoscopia y metástasis ganglionares. La empresa prevé el uso clínico en la primavera de 2027. El contrato y el calendario proceden de la empresa; el anuncio no demuestra que las herramientas ya funcionen allí ni revela su precio."
      - type: p
        text: "Las páginas actuales del producto describen el análisis de preparaciones patológicas digitalizadas: lista de trabajo, visor con superposiciones visuales, modelos cuantitativos e informes por caso para patólogos. El estado regulatorio varía por modelo y región: solo determinadas herramientas tienen marcado CE-IVD para diagnóstico en la UE/EEE; fuera de allí, la empresa limita su uso a investigación o estudios de rendimiento. Un documento de alcance de NICE de mayo de 2026 incluye independientemente la Breast Cancer Suite entre las tecnologías en evaluación y registra cierto uso británico. Definir una evaluación no equivale a avalar un beneficio clínico. Ni ese documento ni el contrato italiano aportan precisión local, diagnósticos más rápidos o resultados en pacientes."
      - type: p
        text: "OpenOnco trabaja con información oncológica estructurada, no con imágenes de tejidos. Su código gratuito con licencia MIT y sus reglas vinculadas a fuentes generan borradores para revisión médica; pueden inspeccionarse, pero no cuentan con validación clínica formal. Aiforia muestra hallazgos visuales que puede revisar un patólogo, mientras que el interior de sus modelos no es públicamente inspeccionable en el material consultado; el precio institucional no es público. Ambos flujos pueden complementarse, pero no hay comparación directa que respalde afirmaciones de precisión o supervivencia. Fuentes comprobadas el 27 de noviembre de 2026. Este artículo no sustituye al médico."
  pt:
    title: "Aiforia assina acordo de IA em patologia em Itália; implementação e resultados por vir"
    summary: "O acordo de dois anos abrange seis áreas diagnósticas, mas a implementação está prevista para a primavera de 2027. Não há dados locais de precisão ou resultados clínicos."
    body:
      - type: p
        text: "Em 26 de novembro de 2026, a Aiforia anunciou um acordo de dois anos com um hospital universitário público italiano não identificado. Abrange sistemas de IA para cancro da mama, próstata, pulmão e estômago, além de colonoscopia e metástases ganglionares. A empresa prevê utilização clínica na primavera de 2027. O contrato e o calendário são informações da empresa; o anúncio não demonstra que as ferramentas já funcionam ali nem divulga o preço."
      - type: p
        text: "As páginas atuais do produto descrevem a análise de lâminas de patologia digitalizadas: lista de trabalho, visualizador com sobreposições, modelos quantitativos e relatórios por caso para patologistas. O estatuto regulatório varia conforme o modelo e a região: só ferramentas específicas têm marcação CE-IVD para diagnóstico na UE/EEE; nos outros mercados, a empresa limita a utilização à investigação ou a estudos de desempenho. Um documento de âmbito da NICE de maio de 2026 inclui, de forma independente, a Breast Cancer Suite entre as tecnologias em avaliação e regista alguma utilização no Reino Unido. Definir o âmbito da avaliação não comprova benefício clínico. Nem esse documento nem o contrato italiano apresentam precisão local, diagnóstico mais rápido ou resultados nos doentes."
      - type: p
        text: "O OpenOnco trabalha com dados oncológicos estruturados, não com imagens de tecido. O seu código gratuito sob licença MIT e as regras ligadas a fontes geram rascunhos para revisão médica; podem ser inspecionados, mas não têm validação clínica formal. A Aiforia apresenta achados visuais que um patologista pode rever, enquanto o funcionamento interno dos modelos não está acessível publicamente no material analisado; o preço institucional não é público. Os fluxos podem complementar-se, mas não existe comparação direta que sustente afirmações de precisão ou sobrevivência. Fontes verificadas em 27 de novembro de 2026. Este artigo não substitui um médico."
  de:
    title: "Aiforia schließt Pathologie-KI-Vertrag in Italien; Einsatz und Ergebnisse stehen aus"
    summary: "Der Zweijahresvertrag umfasst sechs Diagnostikbereiche, doch der Einsatz ist erst für Frühjahr 2027 geplant. Lokale Genauigkeits- oder Patientenergebnisse fehlen."
    body:
      - type: p
        text: "Am 26. November 2026 meldete Aiforia einen Zweijahresvertrag mit einem nicht genannten öffentlichen Universitätsklinikum in Italien. Er umfasst KI-Systeme für Brust-, Prostata-, Lungen- und Magenkrebs sowie Koloskopie und Lymphknotenmetastasen. Das Unternehmen erwartet den klinischen Einsatz im Frühjahr 2027. Vertrag und Zeitplan sind Angaben des Unternehmens; die Meldung belegt weder einen bereits laufenden Betrieb dort noch nennt sie einen Preis."
      - type: p
        text: "Die aktuellen Produktseiten beschreiben die Analyse digitalisierter Pathologiepräparate: Arbeitsliste, Betrachter mit visuellen Markierungen, quantitative Modelle und Fallberichte für Pathologen. Der Zulassungsstatus hängt von Modell und Region ab: Nur bestimmte Werkzeuge sind für die Diagnostik in EU/EWR CE-IVD-gekennzeichnet; anderswo beschränkt das Unternehmen die Nutzung auf Forschung oder Leistungsstudien. Ein NICE-Dokument vom Mai 2026 führt die Breast Cancer Suite unabhängig unter zu bewertenden Technologien und nennt eine gewisse Nutzung im Vereinigten Königreich. Der Prüfungsumfang ist kein Nachweis klinischen Nutzens. Weder dieses Dokument noch der italienische Vertrag liefern lokale Genauigkeit, schnellere Diagnosen oder Patientenergebnisse."
      - type: p
        text: "OpenOnco arbeitet mit strukturierten onkologischen Angaben statt Gewebebildern. Sein kostenloser MIT-lizenzierter Code und Regeln mit Quellenverweisen erzeugen Entwürfe zur ärztlichen Besprechung; sie sind einsehbar, aber nicht formal klinisch validiert. Aiforia zeigt visuelle Befunde, die Pathologen prüfen können, während das Innenleben der Modelle im geprüften Material nicht öffentlich einsehbar ist; institutionelle Preise sind nicht veröffentlicht. Die Abläufe können sich ergänzen, doch ein direkter Vergleich für Aussagen zu Genauigkeit oder Überleben fehlt. Quellen geprüft am 27. November 2026. Dieser Artikel ersetzt keinen Arzt."
  fr:
    title: "Aiforia signe un accord d’IA en anatomopathologie en Italie ; déploiement à venir"
    summary: "L’accord de deux ans couvre six domaines diagnostiques, mais le déploiement est prévu au printemps 2027. Aucune donnée locale de précision ou de résultats cliniques."
    body:
      - type: p
        text: "Le 26 novembre 2026, Aiforia a annoncé un accord de deux ans avec un hôpital universitaire public italien non nommé. Il couvre des systèmes d’IA pour les cancers du sein, de la prostate, du poumon et de l’estomac, ainsi que la coloscopie et les métastases ganglionnaires. L’entreprise prévoit un usage clinique au printemps 2027. Contrat et calendrier sont déclarés par l’entreprise ; l’annonce ne prouve pas que les outils y fonctionnent déjà et ne donne aucun prix."
      - type: p
        text: "Les pages actuelles du produit décrivent l’analyse de lames d’anatomopathologie numérisées : liste de travail, visualiseur avec superpositions, modèles quantitatifs et rapports par cas pour les pathologistes. Le statut réglementaire varie selon le modèle et la région : seuls certains outils portent le marquage CE-IVD pour le diagnostic dans l’UE/EEE ; ailleurs, l’entreprise limite l’usage à la recherche ou aux études de performance. Un document de cadrage du NICE de mai 2026 inclut indépendamment la Breast Cancer Suite parmi les technologies à évaluer et signale un certain usage britannique. Un cadrage n’est pas une preuve de bénéfice clinique. Ni ce document ni le contrat italien ne donnent de précision locale, de délai diagnostique réduit ou de résultats pour les patients."
      - type: p
        text: "OpenOnco utilise des données oncologiques structurées, pas des images de tissus. Son code gratuit sous licence MIT et ses règles reliées aux sources préparent des brouillons pour discussion médicale ; ils sont consultables, mais sans validation clinique formelle. Aiforia affiche des observations visuelles vérifiables par un pathologiste, tandis que l’intérieur de ses modèles n’est pas publiquement inspectable dans les documents examinés ; les tarifs institutionnels ne sont pas publics. Ces parcours peuvent se compléter, mais aucune comparaison directe ne justifie une affirmation de précision ou de survie. Sources vérifiées le 27 novembre 2026. Cet article ne remplace pas un médecin."
  it:
    title: "Aiforia firma un accordo di IA patologica in Italia; impiego e risultati ancora attesi"
    summary: "L’accordo biennale copre sei aree diagnostiche, ma l’impiego è previsto nella primavera 2027. Mancano dati locali di accuratezza e risultati clinici."
    body:
      - type: p
        text: "Il 26 novembre 2026 Aiforia ha annunciato un accordo biennale con un ospedale universitario pubblico italiano non nominato. Comprende sistemi di IA per tumori di mammella, prostata, polmone e stomaco, oltre a colonscopia e metastasi linfonodali. L’azienda prevede l’uso clinico nella primavera 2027. Contratto e tempistica sono informazioni dell’azienda; l’annuncio non prova che gli strumenti siano già attivi né indica il prezzo."
      - type: p
        text: "Le pagine aggiornate del prodotto descrivono l’analisi di vetrini patologici digitalizzati: lista di lavoro, visualizzatore con sovrapposizioni, modelli quantitativi e referti per caso destinati ai patologi. Lo stato regolatorio cambia secondo modello e regione: solo determinati strumenti hanno marcatura CE-IVD per la diagnostica in UE/SEE; altrove l’azienda limita l’uso a ricerca o studi delle prestazioni. Un documento NICE del maggio 2026 include autonomamente la Breast Cancer Suite tra le tecnologie da valutare e segnala un certo uso nel Regno Unito. Definire una valutazione non equivale a dimostrare beneficio clinico. Né quel documento né il contratto italiano presentano accuratezza locale, diagnosi più rapide o esiti per i pazienti."
      - type: p
        text: "OpenOnco usa informazioni oncologiche strutturate, non immagini di tessuto. Il codice gratuito con licenza MIT e le regole collegate alle fonti creano bozze per la discussione con il medico; sono ispezionabili ma non formalmente validate clinicamente. Aiforia mostra reperti visivi rivedibili da un patologo, mentre il funzionamento interno dei modelli non è pubblicamente ispezionabile nei materiali esaminati; i prezzi istituzionali non sono pubblici. I due flussi possono integrarsi, ma non esiste un confronto diretto che sostenga affermazioni su accuratezza o sopravvivenza. Fonti controllate il 27 novembre 2026. Questo articolo non sostituisce il medico."
  da:
    title: "Aiforia indgår aftale om patologi-AI i Italien; anvendelse og resultater afventes"
    summary: "Den toårige aftale dækker seks diagnostiske områder, men klinisk brug ventes først i foråret 2027. Lokale nøjagtigheds- og patientresultater mangler."
    body:
      - type: p
        text: "Den 26. november 2026 meddelte Aiforia, at virksomheden havde indgået en toårig aftale med et ikke navngivet offentligt universitetshospital i Italien. Den omfatter AI-systemer til bryst-, prostata-, lunge- og mavekræft samt koloskopi og lymfeknudemetastaser. Virksomheden forventer klinisk brug i foråret 2027. Aftale og tidsplan er virksomhedens oplysninger; meddelelsen viser ikke, at værktøjerne allerede bruges dér, og oplyser ingen pris."
      - type: p
        text: "De aktuelle produktsider beskriver analyse af digitaliserede patologisnit: arbejdsliste, fremviser med visuelle markeringer, kvantitative modeller og rapporter pr. sag til patologer. Regulatorisk status varierer efter model og region: Kun bestemte værktøjer er CE-IVD-mærket til diagnostik i EU/EØS; andre steder begrænser virksomheden brugen til forskning eller ydelsesstudier. Et NICE-afgrænsningsdokument fra maj 2026 nævner uafhængigt Breast Cancer Suite blandt teknologier til vurdering og registrerer en vis britisk brug. En vurderingsramme er ikke dokumentation for klinisk nytte. Hverken dokumentet eller den italienske aftale giver lokal nøjagtighed, hurtigere diagnose eller patientresultater."
      - type: p
        text: "OpenOnco bruger strukturerede onkologiske oplysninger, ikke vævsbilleder. Dets gratis MIT-licenserede kode og regler med kildehenvisninger skaber udkast til lægelig drøftelse; de kan gennemgås, men er ikke formelt klinisk valideret. Aiforia viser visuelle fund, som en patolog kan gennemgå, mens modellernes indre ikke er offentligt tilgængeligt i det gennemgåede materiale; institutionspriser er ikke offentlige. Arbejdsgangene kan supplere hinanden, men ingen direkte sammenligning understøtter påstande om nøjagtighed eller overlevelse. Kilder kontrolleret 27. november 2026. Artiklen erstatter ikke en læge."
  sv:
    title: "Aiforia tecknar avtal om patologi-AI i Italien; införande och resultat väntar"
    summary: "Tvåårsavtalet gäller sex diagnosområden, men klinisk användning väntas våren 2027. Lokala data om träffsäkerhet och patientutfall saknas."
    body:
      - type: p
        text: "Den 26 november 2026 meddelade Aiforia ett tvåårigt avtal med ett icke namngivet offentligt universitetssjukhus i Italien. Det gäller AI-system för bröst-, prostata-, lung- och magsäckscancer samt koloskopi och lymfkörtelmetastaser. Företaget väntar sig klinisk användning våren 2027. Avtalet och tidsplanen är företagets uppgifter; meddelandet visar inte att verktygen redan används där och anger inget pris."
      - type: p
        text: "De aktuella produktsidorna beskriver analys av digitaliserade patologiglas: arbetslista, bildvisare med visuella markeringar, kvantitativa modeller och fallrapporter för patologer. Regulatorisk status varierar mellan modeller och regioner: Endast vissa verktyg är CE-IVD-märkta för diagnostik i EU/EES; utanför dessa områden begränsar företaget användningen till forskning eller prestandastudier. Ett avgränsningsdokument från NICE i maj 2026 listar oberoende Breast Cancer Suite bland tekniker under utvärdering och noterar viss användning i Storbritannien. En utvärderingsram visar inte klinisk nytta. Varken dokumentet eller det italienska avtalet ger lokala noggrannhetsdata, snabbare diagnoser eller patientutfall."
      - type: p
        text: "OpenOnco arbetar med strukturerad onkologisk information, inte vävnadsbilder. Dess kostnadsfria MIT-licensierade kod och källänkade regler skapar utkast för läkargranskning; de kan granskas men saknar formell klinisk validering. Aiforia visar visuella fynd som en patolog kan kontrollera, medan modellernas inre inte är offentligt granskningsbart i det genomgångna materialet; institutionspriser är inte offentliga. Arbetsflödena kan komplettera varandra, men ingen direkt jämförelse stöder påståenden om noggrannhet eller överlevnad. Källor kontrollerade den 27 november 2026. Artikeln ersätter inte en läkare."
  nb:
    title: "Aiforia inngår avtale om patologi-KI i Italia; innføring og resultater gjenstår"
    summary: "Toårsavtalen dekker seks diagnoseområder, men klinisk bruk ventes våren 2027. Lokale data om nøyaktighet og pasientutfall mangler."
    body:
      - type: p
        text: "Den 26. november 2026 meldte Aiforia om en toårig avtale med et ikke navngitt offentlig universitetssykehus i Italia. Den omfatter KI-systemer for bryst-, prostata-, lunge- og magekreft samt koloskopi og lymfeknutemetastaser. Selskapet forventer klinisk bruk våren 2027. Avtalen og tidsplanen er opplysninger fra selskapet; meldingen viser ikke at verktøyene allerede brukes der, og oppgir ingen pris."
      - type: p
        text: "De nåværende produktsidene beskriver analyse av digitaliserte patologisnitt: arbeidsliste, bildevisning med visuelle markeringer, kvantitative modeller og rapporter per sak for patologer. Regulatorisk status varierer etter modell og region: Bare bestemte verktøy er CE-IVD-merket for diagnostikk i EU/EØS; ellers begrenser selskapet bruken til forskning eller ytelsesstudier. Et NICE-dokument fra mai 2026 lister uavhengig Breast Cancer Suite blant teknologier som skal vurderes, og registrerer noe britisk bruk. En vurderingsramme er ikke dokumentasjon for klinisk nytte. Verken dokumentet eller Italia-avtalen gir lokal nøyaktighet, raskere diagnostikk eller pasientutfall."
      - type: p
        text: "OpenOnco bruker strukturerte onkologiske opplysninger, ikke vevsbilder. Gratis MIT-lisensiert kode og regler med kildehenvisninger lager utkast for legegjennomgang; de kan inspiseres, men er ikke formelt klinisk validert. Aiforia viser visuelle funn som en patolog kan kontrollere, mens modellenes indre ikke kan inspiseres offentlig i materialet vi gjennomgikk; institusjonspriser er ikke offentliggjort. Arbeidsflytene kan utfylle hverandre, men ingen direkte sammenligning støtter påstander om nøyaktighet eller overlevelse. Kilder kontrollert 27. november 2026. Artikkelen erstatter ikke en lege."
  fi:
    title: "Aiforia solmi patologian tekoälysopimuksen Italiassa; käyttöönotto ja tulokset edessä"
    summary: "Kaksivuotinen sopimus kattaa kuusi diagnostiikan aluetta, mutta kliinistä käyttöä odotetaan keväällä 2027. Paikallisia tarkkuus- tai potilastuloksia ei raportoitu."
    body:
      - type: p
        text: "Aiforia ilmoitti 26. marraskuuta 2026 kaksivuotisesta sopimuksesta nimeämättömän italialaisen julkisen yliopistosairaalan kanssa. Sopimus kattaa tekoälyratkaisuja rinta-, eturauhas-, keuhko- ja mahasyövän sekä kolonoskopian ja imusolmuke-etäpesäkkeiden diagnostiikkaan. Yhtiö odottaa kliinistä käyttöönottoa keväällä 2027. Sopimus ja aikataulu ovat yhtiön ilmoittamia; tiedote ei osoita työkalujen olevan jo käytössä siellä eikä kerro hintaa."
      - type: p
        text: "Nykyiset tuotesivut kuvaavat digitoitujen patologisten näytteiden analyysiä: työlista, visuaalisia merkintöjä sisältävä katselin, määrälliset mallit ja tapauskohtaiset raportit patologeille. Sääntelyasema vaihtelee mallin ja alueen mukaan: vain tietyt työkalut ovat CE-IVD-merkittyjä diagnostiseen käyttöön EU:ssa ja ETA:ssa; muualla yhtiö rajaa käytön tutkimukseen tai suorituskykytutkimuksiin. NICE:n toukokuun 2026 arvioinnin rajausasiakirja listaa riippumattomasti Breast Cancer Suite -ratkaisun arvioitavien tekniikoiden joukkoon ja kirjaa jonkin verran käyttöä Britanniassa. Arvioinnin rajaus ei ole näyttö kliinisestä hyödystä. Asiakirja tai Italian sopimus ei anna paikallista tarkkuutta, nopeampaa diagnoosia tai potilastuloksia."
      - type: p
        text: "OpenOnco käyttää jäsennettyjä onkologisia tietoja eikä kudoskuvia. Sen ilmainen MIT-lisensoitu koodi ja lähteisiin sidotut säännöt tuottavat luonnoksia lääkärin kanssa keskusteluun; niitä voi tarkastella, mutta muodollista kliinistä validointia ei ole. Aiforia näyttää patologin tarkistettavissa olevia visuaalisia löydöksiä, mutta mallien sisäinen toiminta ei ole julkisesti tarkasteltavissa käydyssä aineistossa; laitoshinnoittelu ei ole julkista. Työnkulut voivat täydentää toisiaan, mutta suora vertailu ei tue väitteitä tarkkuudesta tai elossaolosta. Lähteet tarkistettu 27. marraskuuta 2026. Artikkeli ei korvaa lääkäriä."