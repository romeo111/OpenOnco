slug: signatur-breast-funding-validation
date: 2026-11-27
published: 2026-11-28
kind: explainer
series: openonco-startups-daily
series_format: startup
author: OpenOnco
tags: [startup, breast-cancer, genomic-testing, clinical-evidence, funding]
title:
  en: "Signatur funds a local breast cancer assay; equivalence remains unproven"
  uk: "Signatur залучила кошти на місцевий тест раку молочної залози; еквівалентність не доведена"
summary:
  en: "A $5 million package, including a €2.2 million grant, will move Signatur Breast toward manufacturing. Its independent patient-cohort verification is still planned."
  uk: "Фінансування на $5 млн, зокрема грант €2,2 млн, має наблизити Signatur Breast до виробництва. Незалежну перевірку на зразках пацієнтів ще планують."
sources:
  - citation: "Signatur Biosciences, funding and product announcement, 27 November 2026. Checked 28 November 2026."
    id: https://www.signatur.bio/news/signatur-biosciences-raises-5m
  - citation: "Signatur Biosciences, current technology and development status. Checked 28 November 2026."
    id: https://www.signatur.bio/technology
  - citation: "Sparano et al., TAILORx original 21-gene assay trial, NEJM 2018, DOI 10.1056/NEJMoa1804710. Checked 28 November 2026."
    id: https://pmc.ncbi.nlm.nih.gov/articles/PMC6172658/
  - citation: "OpenOnco repository, MIT licence, source-linked rules and clinical limits. Checked 28 November 2026."
    id: https://github.com/romeo111/OpenOnco
  - citation: "OpenOnco capabilities and evidence limits. Checked 28 November 2026."
    id: https://openonco.info/capabilities.html
body:
  en:
    - type: p
      text: "On 27 November 2026, Signatur Biosciences announced $5 million (about €4.5 million) of funding, including a €2.2 million Walloon grant. It says this will move Signatur Breast from a working prototype toward manufacturing and first laboratories. Its current site says the test is in development and not for sale; no price is published."
    - type: p
      text: "The kit aims to read a breast tumour’s 21-gene RNA signature on common hospital qPCR instruments. The claim of the same clinical utility as a reference-laboratory assay at lower cost is the company’s, not an independent result for this kit. Algorithm training and verification in an independent patient cohort are still planned. TAILORx studied a different, established 21-gene assay; that evidence cannot be transferred automatically."
    - type: p
      text: "OpenOnco uses structured oncology information, not tumour RNA, to draft source-linked material for clinician discussion. Its code and MIT licence are public, its rules inspectable and use free, but it has no formal clinical validation. The reviewed Signatur pages publish no kit source code, licence, price or independent performance data. The tools could complement each other; no direct accuracy or outcome comparison exists. Sources checked 28 November 2026. This article does not replace a doctor."
  uk:
    - type: p
      text: "27 листопада 2026 року Signatur Biosciences повідомила про фінансування на $5 млн (близько €4,5 млн), зокрема грант €2,2 млн від Валлонії. За словами компанії, кошти допоможуть перейти від робочого прототипу Signatur Breast до виробництва та перших лабораторій. Чинний сайт зазначає, що тест розробляють і ще не продають; ціни немає."
    - type: p
      text: "Набір має аналізувати РНК-сигнатуру 21 гена пухлини молочної залози на поширених лікарняних приладах qPCR. Обіцянка такої самої клінічної користі, як у тесту спеціалізованої лабораторії, за меншу ціну — твердження компанії, а не незалежний результат для цього набору. Навчання алгоритму та перевірка в незалежній когорті ще попереду. TAILORx вивчало інший, усталений тест на 21 ген; його докази не можна автоматично переносити."
    - type: p
      text: "OpenOnco використовує структуровані онкологічні дані, а не РНК пухлини, щоб створювати чернетки з джерелами для обговорення з лікарем. Його код і ліцензія MIT відкриті, правила перевірювані, користування безкоштовне, але формальної клінічної валідації немає. Переглянуті сторінки Signatur не публікують код, ліцензію, ціну чи незалежні дані про точність набору. Інструменти можуть доповнювати один одного; прямого порівняння точності чи наслідків немає. Джерела перевірено 28 листопада 2026 року. Матеріал не замінює лікаря."
translations:
  es:
    title: "Signatur financia un test local de cáncer de mama; su equivalencia no está demostrada"
    summary: "Los 5 millones de dólares, incluida una subvención de 2,2 millones de euros, acercarán Signatur Breast a la fabricación. La verificación independiente aún está prevista."
    body:
      - type: p
        text: "El 27 de noviembre de 2026, Signatur Biosciences anunció 5 millones de dólares (unos 4,5 millones de euros) de financiación, incluida una subvención de 2,2 millones de euros de Valonia. Según la empresa, llevará Signatur Breast del prototipo funcional a la fabricación y a los primeros laboratorios. Su sitio actual indica que el test está en desarrollo y no se vende; no publica un precio."
      - type: p
        text: "El kit busca analizar la firma de ARN de 21 genes de un tumor de mama en instrumentos qPCR habituales en hospitales. La promesa de la misma utilidad clínica que un ensayo de laboratorio de referencia a menor coste es empresarial, no un resultado independiente del kit. El entrenamiento del algoritmo y la verificación en una cohorte independiente siguen previstos. TAILORx estudió otro ensayo de 21 genes ya establecido; sus pruebas no se transfieren automáticamente."
      - type: p
        text: "OpenOnco usa datos oncológicos estructurados, no ARN tumoral, para elaborar borradores con fuentes que se discuten con un médico. Su código y licencia MIT son públicos, las reglas se pueden revisar y el uso es gratuito, pero no tiene validación clínica formal. Las páginas revisadas de Signatur no publican código, licencia, precio ni datos independientes de rendimiento del kit. Las herramientas podrían complementarse; no existe comparación directa de precisión o resultados. Fuentes comprobadas el 28 de noviembre de 2026. Este artículo no sustituye al médico."
  pt:
    title: "Signatur financia teste local do cancro da mama; equivalência ainda não demonstrada"
    summary: "Os 5 milhões de dólares, incluindo uma subvenção de 2,2 milhões de euros, aproximam o Signatur Breast da produção. A verificação independente ainda está planeada."
    body:
      - type: p
        text: "Em 27 de novembro de 2026, a Signatur Biosciences anunciou 5 milhões de dólares (cerca de 4,5 milhões de euros) em financiamento, incluindo uma subvenção de 2,2 milhões de euros da Valónia. Segundo a empresa, o dinheiro levará o Signatur Breast do protótipo funcional à produção e aos primeiros laboratórios. O site atual diz que o teste está em desenvolvimento e não está à venda; não indica preço."
      - type: p
        text: "O kit pretende analisar a assinatura de ARN de 21 genes de um tumor da mama em instrumentos qPCR comuns nos hospitais. A promessa de igual utilidade clínica à de um teste de laboratório de referência a menor custo é da empresa, não um resultado independente deste kit. O treino do algoritmo e a verificação numa coorte independente ainda estão planeados. O TAILORx estudou outro teste estabelecido de 21 genes; essa evidência não se transfere automaticamente."
      - type: p
        text: "O OpenOnco usa dados oncológicos estruturados, não ARN tumoral, para criar rascunhos com fontes para discussão com um médico. O código e a licença MIT são públicos, as regras podem ser revistas e o uso é gratuito, mas falta validação clínica formal. As páginas consultadas da Signatur não publicam código, licença, preço ou dados independentes de desempenho do kit. As ferramentas poderão complementar-se; não há comparação direta de precisão ou resultados. Fontes verificadas em 28 de novembro de 2026. Este artigo não substitui um médico."
  de:
    title: "Signatur finanziert lokalen Brustkrebstest; Gleichwertigkeit ist nicht belegt"
    summary: "Die 5 Millionen US-Dollar einschließlich eines Zuschusses von 2,2 Millionen Euro sollen Signatur Breast zur Fertigung bringen. Eine unabhängige Prüfung steht noch aus."
    body:
      - type: p
        text: "Am 27. November 2026 meldete Signatur Biosciences 5 Millionen US-Dollar (etwa 4,5 Millionen Euro) Finanzierung, darunter einen Zuschuss von 2,2 Millionen Euro aus Wallonien. Nach Angaben des Unternehmens soll Signatur Breast so vom funktionsfähigen Prototyp zur Fertigung und in erste Labore gelangen. Die aktuelle Website bezeichnet den Test als in Entwicklung und noch nicht verkäuflich; ein Preis fehlt."
      - type: p
        text: "Das Kit soll die RNA-Signatur von 21 Genen eines Brusttumors auf üblichen qPCR-Geräten in Krankenhäusern messen. Das Versprechen desselben klinischen Nutzens wie bei einem Referenzlabortest zu geringeren Kosten ist eine Unternehmensbehauptung, kein unabhängiges Ergebnis für dieses Kit. Algorithmustraining und Prüfung in einer unabhängigen Patientenkohorte sind noch geplant. TAILORx untersuchte einen anderen, etablierten 21-Gen-Test; dessen Evidenz ist nicht automatisch übertragbar."
      - type: p
        text: "OpenOnco nutzt strukturierte onkologische Angaben statt Tumor-RNA für quellenbelegte Entwürfe zur ärztlichen Besprechung. Code und MIT-Lizenz sind öffentlich, Regeln einsehbar und die Nutzung kostenlos, doch formale klinische Validierung fehlt. Die geprüften Signatur-Seiten veröffentlichen weder Kit-Quellcode und Lizenz noch Preis oder unabhängige Leistungsdaten. Beide Werkzeuge könnten sich ergänzen; ein direkter Vergleich von Genauigkeit oder Ergebnissen fehlt. Quellen geprüft am 28. November 2026. Dieser Artikel ersetzt keinen Arzt."
  fr:
    title: "Signatur finance un test local du cancer du sein ; son équivalence reste à prouver"
    summary: "Les 5 millions de dollars, dont une subvention de 2,2 millions d’euros, doivent rapprocher Signatur Breast de la fabrication. Une vérification indépendante reste prévue."
    body:
      - type: p
        text: "Le 27 novembre 2026, Signatur Biosciences a annoncé 5 millions de dollars (environ 4,5 millions d’euros) de financement, dont une subvention de 2,2 millions d’euros de la Wallonie. Selon l’entreprise, Signatur Breast passera ainsi du prototype fonctionnel à la fabrication et aux premiers laboratoires. Son site actuel indique que le test est en développement et non commercialisé ; aucun prix n’est publié."
      - type: p
        text: "Le kit vise à mesurer la signature ARN de 21 gènes d’une tumeur du sein sur des appareils qPCR courants à l’hôpital. La promesse d’une utilité clinique identique à celle d’un test de laboratoire de référence à moindre coût vient de l’entreprise, pas d’une évaluation indépendante du kit. L’entraînement de l’algorithme et sa vérification dans une cohorte indépendante restent prévus. TAILORx portait sur un autre test établi de 21 gènes ; ses preuves ne sont pas automatiquement transférables."
      - type: p
        text: "OpenOnco utilise des données oncologiques structurées, et non l’ARN tumoral, pour produire des brouillons sourcés à discuter avec un médecin. Code et licence MIT sont publics, règles vérifiables et usage gratuit, mais aucune validation clinique formelle n’a été réalisée. Les pages Signatur consultées ne publient ni code, ni licence, ni prix, ni données indépendantes sur le kit. Les outils pourraient se compléter ; aucune comparaison directe de précision ou de résultats n’existe. Sources vérifiées le 28 novembre 2026. Cet article ne remplace pas un médecin."
  it:
    title: "Signatur finanzia un test locale per il tumore al seno; equivalenza non dimostrata"
    summary: "I 5 milioni di dollari, compresa una sovvenzione di 2,2 milioni di euro, avvicinano Signatur Breast alla produzione. La verifica indipendente è ancora prevista."
    body:
      - type: p
        text: "Il 27 novembre 2026 Signatur Biosciences ha annunciato 5 milioni di dollari (circa 4,5 milioni di euro) di finanziamenti, inclusa una sovvenzione di 2,2 milioni di euro dalla Vallonia. Secondo l’azienda, serviranno a portare Signatur Breast dal prototipo funzionante alla produzione e ai primi laboratori. Il sito attuale precisa che il test è in sviluppo e non in vendita; non indica un prezzo."
      - type: p
        text: "Il kit mira a misurare la firma di RNA di 21 geni di un tumore mammario su comuni strumenti qPCR ospedalieri. La promessa della stessa utilità clinica di un test di laboratorio di riferimento a costo inferiore è aziendale, non un risultato indipendente per questo kit. L’addestramento dell’algoritmo e la verifica in una coorte indipendente sono ancora previsti. TAILORx ha studiato un altro test consolidato di 21 geni; le sue prove non si trasferiscono automaticamente."
      - type: p
        text: "OpenOnco usa dati oncologici strutturati, non RNA tumorale, per creare bozze con fonti da discutere con un medico. Codice e licenza MIT sono pubblici, le regole verificabili e l’uso gratuito, ma manca una validazione clinica formale. Le pagine di Signatur esaminate non pubblicano codice, licenza, prezzo o dati indipendenti sulle prestazioni del kit. Gli strumenti potrebbero integrarsi; non esiste un confronto diretto di accuratezza o esiti. Fonti verificate il 28 novembre 2026. Questo articolo non sostituisce il medico."
  da:
    title: "Signatur finansierer lokal brystkræfttest; klinisk ækvivalens er ikke påvist"
    summary: "De 5 millioner dollar, herunder et tilskud på 2,2 millioner euro, skal føre Signatur Breast mod produktion. Uafhængig afprøvning er stadig planlagt."
    body:
      - type: p
        text: "Den 27. november 2026 annoncerede Signatur Biosciences 5 millioner dollar (omkring 4,5 millioner euro) i finansiering, herunder et tilskud på 2,2 millioner euro fra Vallonien. Ifølge virksomheden skal pengene føre Signatur Breast fra en fungerende prototype til produktion og de første laboratorier. Det aktuelle websted siger, at testen udvikles og ikke er til salg; ingen pris er offentliggjort."
      - type: p
        text: "Sættet skal måle en brysttumors RNA-signatur på 21 gener med almindelige qPCR-apparater på hospitaler. Løftet om samme kliniske nytte som en test fra et referencelaboratorium til lavere pris er virksomhedens påstand, ikke et uafhængigt resultat for sættet. Træning af algoritmen og afprøvning i en uafhængig patientgruppe er endnu planlagt. TAILORx undersøgte en anden, etableret 21-gen-test; dens evidens kan ikke automatisk overføres."
      - type: p
        text: "OpenOnco bruger strukturerede onkologiske oplysninger, ikke tumor-RNA, til kildebelagte udkast til drøftelse med en læge. Kode og MIT-licens er offentlige, reglerne kan gennemgås, og brugen er gratis, men formel klinisk validering mangler. De gennemgåede Signatur-sider offentliggør hverken sættets kildekode, licens, pris eller uafhængige præstationsdata. Værktøjerne kan supplere hinanden; der findes ingen direkte sammenligning af nøjagtighed eller resultater. Kilder kontrolleret 28. november 2026. Artiklen erstatter ikke en læge."
  sv:
    title: "Signatur finansierar lokalt bröstcancertest; likvärdighet är inte visad"
    summary: "De 5 miljoner dollar, inklusive ett bidrag på 2,2 miljoner euro, ska föra Signatur Breast mot tillverkning. Oberoende prövning planeras fortfarande."
    body:
      - type: p
        text: "Den 27 november 2026 meddelade Signatur Biosciences 5 miljoner dollar (cirka 4,5 miljoner euro) i finansiering, däribland ett bidrag på 2,2 miljoner euro från Vallonien. Enligt bolaget ska pengarna föra Signatur Breast från fungerande prototyp till tillverkning och de första laboratorierna. Den aktuella webbplatsen säger att testet utvecklas och inte säljs; något pris anges inte."
      - type: p
        text: "Kitet ska mäta en brösttumörs RNA-signatur med 21 gener på vanliga qPCR-instrument på sjukhus. Löftet om samma kliniska nytta som ett referenslaboratorietest till lägre kostnad är bolagets påstående, inte ett oberoende resultat för kitet. Algoritmträning och prövning i en oberoende patientkohort är fortfarande planerade. TAILORx undersökte ett annat, etablerat 21-gentest; dess belägg kan inte automatiskt överföras."
      - type: p
        text: "OpenOnco använder strukturerad onkologisk information, inte tumör-RNA, för källbelagda utkast att diskutera med läkare. Kod och MIT-licens är offentliga, reglerna kan granskas och användningen är gratis, men formell klinisk validering saknas. De granskade Signatur-sidorna publicerar inte kitets källkod, licens, pris eller oberoende prestandadata. Verktygen kan komplettera varandra; någon direkt jämförelse av träffsäkerhet eller utfall finns inte. Källor kontrollerade 28 november 2026. Artikeln ersätter inte en läkare."
  nb:
    title: "Signatur finansierer lokal brystkrefttest; likeverdighet er ikke vist"
    summary: "De 5 millioner dollar, inkludert et tilskudd på 2,2 millioner euro, skal føre Signatur Breast mot produksjon. Uavhengig utprøving er fortsatt planlagt."
    body:
      - type: p
        text: "Den 27. november 2026 kunngjorde Signatur Biosciences 5 millioner dollar (omtrent 4,5 millioner euro) i finansiering, inkludert et tilskudd på 2,2 millioner euro fra Vallonia. Ifølge selskapet skal pengene føre Signatur Breast fra en fungerende prototype til produksjon og de første laboratoriene. Det nåværende nettstedet sier at testen utvikles og ikke er til salgs; ingen pris er oppgitt."
      - type: p
        text: "Settet skal måle en brystsvulsts RNA-signatur på 21 gener på vanlige qPCR-instrumenter i sykehus. Løftet om samme kliniske nytte som en referanselaboratorietest til lavere kostnad er selskapets påstand, ikke et uavhengig resultat for settet. Trening av algoritmen og utprøving i en uavhengig pasientgruppe er fortsatt planlagt. TAILORx undersøkte en annen, etablert 21-gentest; dokumentasjonen kan ikke automatisk overføres."
      - type: p
        text: "OpenOnco bruker strukturerte onkologiske opplysninger, ikke tumor-RNA, til kildebelagte utkast for drøfting med lege. Kode og MIT-lisens er offentlige, reglene kan inspiseres og bruken er gratis, men formell klinisk validering mangler. De gjennomgåtte Signatur-sidene publiserer verken settets kildekode, lisens, pris eller uavhengige ytelsesdata. Verktøyene kan utfylle hverandre; det finnes ingen direkte sammenligning av nøyaktighet eller utfall. Kilder kontrollert 28. november 2026. Artikkelen erstatter ikke en lege."
  fi:
    title: "Signatur rahoittaa paikallista rintasyöpätestiä; vastaavuutta ei ole osoitettu"
    summary: "Viiteen miljoonaan dollariin sisältyy 2,2 miljoonan euron avustus Signatur Breast -testin viemiseksi kohti tuotantoa. Riippumaton arviointi on vielä suunnitteilla."
    body:
      - type: p
        text: "Signatur Biosciences ilmoitti 27. marraskuuta 2026 viiden miljoonan dollarin (noin 4,5 miljoonan euron) rahoituksesta, johon sisältyy Vallonian 2,2 miljoonan euron avustus. Yhtiön mukaan raha vie Signatur Breast -testin toimivasta prototyypistä tuotantoon ja ensimmäisiin laboratorioihin. Nykyinen sivusto kertoo testin olevan kehitteillä eikä myynnissä; hintaa ei ole ilmoitettu."
      - type: p
        text: "Pakkauksen tavoitteena on mitata rintakasvaimen 21 geenin RNA-profiilia sairaaloiden tavallisilla qPCR-laitteilla. Lupaus samasta kliinisestä hyödystä kuin vertailulaboratorion testillä halvemmalla on yhtiön väite, ei tämän pakkauksen riippumaton tulos. Algoritmin koulutus ja arviointi riippumattomassa potilasaineistossa ovat vielä suunnitteilla. TAILORx tutki toista, vakiintunutta 21 geenin testiä; näyttöä ei voi siirtää suoraan."
      - type: p
        text: "OpenOnco käyttää jäsenneltyjä onkologisia tietoja, ei kasvain-RNA:ta, lähteistettyjen lääkärin kanssa käsiteltävien luonnosten laatimiseen. Koodi ja MIT-lisenssi ovat julkisia, säännöt tarkastettavissa ja käyttö maksutonta, mutta muodollinen kliininen validointi puuttuu. Tarkastellut Signatur-sivut eivät julkaise pakkauksen lähdekoodia, lisenssiä, hintaa tai riippumattomia suorituskykytietoja. Työkalut voivat täydentää toisiaan; suoraa tarkkuus- tai tulosvertailua ei ole. Lähteet tarkistettu 28. marraskuuta 2026. Tämä artikkeli ei korvaa lääkäriä."