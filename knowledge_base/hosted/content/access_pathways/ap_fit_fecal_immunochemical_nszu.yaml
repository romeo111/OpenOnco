notes: >
  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode.

  Fecal Immunochemical Test (FIT) — найбільш-cost-effective та
  широко-впроваджуваний модальність CRC-screening для average-risk
  cohort age 45/50-75. USPSTF-2021 пропонує FIT q1y АБО колоноскопію
  q10y як equivalent options.

  В Україні: FIT входить у НСЗУ-пакет 1001 (ПМД) як preventive-screening
  компонент. Implementation challenges:
  1. Pacient-уявомленість невисока; many пацієнтів очікують direct-
     колоноскопію (asymmetric awareness vs FIT).
  2. Positive-FIT colonoscopy follow-up — bottleneck у деяких регіонах
     з обмеженою endoscopic-capacity (>8-12 weeks lead-time).
  3. Quantitative FIT-cutoff — деякі первинні-laboratory використовують
     qualitative kit з вищою false-positive rate; quantitative kit
     (Hb-cutoff 10-20 µg/g) — preferred per EU-Quality-Assurance
     Guidelines.
  4. Adherence-rate низька — UA-cohort estimated ~15-25% age-eligible
     populace бере FIT q1y (vs ~50-65% у некоторих EU countries).

  Gap у схемі: TEST-FIT-FECAL-IMMUNOCHEMICAL — forward-compatible
  identifier; test stub потребує authoring у наступному chunk-batch.

  AccessPathway render-time-only.
