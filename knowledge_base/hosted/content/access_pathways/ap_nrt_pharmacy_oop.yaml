id: AP-NRT-PHARMACY-OOP
name: "Nicotine replacement therapy (patch / gum / lozenge) — over-the-counter pharmacy, out-of-pocket"
name_ua: "Нікотинозамісна терапія (пластир / жувальна гумка / льодяник) — OTC у приватній аптеці, оплата з кишені"

applies_to_drug_ids:
  - DRUG-NICOTINE-PATCH
  - DRUG-NICOTINE-GUM
  - DRUG-NICOTINE-LOZENGE
applies_to_regimen_ids:
  - REG-NICOTINE-REPLACEMENT-COMBO

pathway_type: self_pay

country_options: ["UA"]

cost_orientation:
  currency: UAH
  min: 800
  max: 3500
  per_unit: month
  notes: >
    Pacient out-of-pocket cost для standard NRT-режиму станом на 2026-05:
    - **Nicotine patch (21 mg/14 mg/7 mg titration)** — 800-2000
      UAH/місяць (28-pack):
      - Nicorette (Johnson & Johnson) Invisi-Patch 21 mg — ~1500-2000 UAH/28 шт.
      - Nicotinell (Novartis / GSK) — ~1200-1800 UAH/28 шт.
      - Generic patches (Polфarma, Sandoz) — 800-1200 UAH/28 шт.
    - **Nicotine gum (2 mg / 4 mg)** — 400-1200 UAH/100-pack:
      - Nicorette gum 4 mg, mint flavor — ~600-1200 UAH/100 шт.
      - Generic 2 mg gum — 400-700 UAH/100 шт.
    - **Nicotine lozenge (1 mg / 2 mg / 4 mg)** — 600-1500 UAH/100-pack:
      - Nicorette lozenge — ~900-1500 UAH/100 шт.
    - **Combination NRT (patch + gum/lozenge PRN)** — typical
      monthly cost ~2000-3500 UAH (повна titration-схема).
    - drlz.com.ua / apteka911 / tabletki.ua перевірено.
    - **НЕ входить у Affordable Medicines** НСЗУ; tobacco-cessation
      pharmacotherapy не покривається державною reimbursement.
    - OTC статус (без рецепту), що знижує барьер доступу але не
      cost-barrier.

typical_lead_time_weeks: [0, 1]

contact_pattern: >
  Сімейний лікар обговорює tobacco-cessation плани з pacient'ом;
  pacient купує NRT-products OTC у будь-якій приватній аптеці.

  Standard combination NRT режим per US PHS Guideline 2008 / Cochrane
  2018:
  - 21 mg patch (per 24-hour wear) для baseline plasma-nicotine
    rescue + 2 mg / 4 mg gum/lozenge PRN при cravings (max 24
    gum/lozenge per day).
  - Tapering: 21 mg x 4-6 weeks → 14 mg x 2 weeks → 7 mg x 2 weeks.
  - Total course duration 8-12 weeks; extension до 24 weeks для
    high-dependence smokers per Stead 2019.

  Combination NRT (long-acting + short-acting) — superior efficacy
  vs monotherapy (Cochrane 2018: OR 1.34 [1.18-1.51] vs single NRT).
  Combination NRT — comparable до varenicline у efficacy у деяких
  meta-analyses; cost-effectiveness depending on individual
  patient adherence.

eligibility_caveats:
  - "Adult smoker (≥10 cigarettes/day baseline переважно)"
  - "Recent MI (≤2 weeks) — relative contraindication через cardiac-stimulant effect; розглянути <14 days post-event delay"
  - "Pregnancy — NRT FDA категорія D; preferable до continued smoking; кращі gum/lozenge ніж patch (intermittent vs sustained exposure); ACOG 2017 уточнює individualized risk-benefit"
  - "Severe arrhythmia / unstable angina — caution"
  - "Pediatric / adolescent smokers (<18 років) — limited evidence; behavioral-only переважно; NRT only у severe-dependence з parent-guardian consent"
  - "Dental disease / TMJ disorders — gum may worsen; switch до patch/lozenge"

requires_documentation:
  - "Smoking-anamnesis: pack-years, current daily-cigarette-count"
  - "Cardiovascular history (recent MI, stroke, unstable angina)"
  - "Dental / oral health (для gum-suitability)"
  - "Pregnancy-status (для preference для intermittent NRT над patch)"
  - "Інформоване consent — OTC status дозволяє самостійну purchase, але клініцист-supervised dosing рекомендований для best outcomes"

verified_by: null
last_verified: "2026-05-18"

sources:
  - SRC-IARC-100A-TOBACCO-SMOKING

notes: >
  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode.

  NRT — first-line tobacco-cessation pharmacotherapy з ~50 років
  clinical experience; найбезпечніший pharmacotherapy-option у
  pregnancy, cardiovascular co-morbidity, та psychiatric co-morbidity.
  OTC у УА (без рецепта), що знижує барьер доступу — але cost-barrier
  залишається substantial для economically-vulnerable населення
  (800-3500 UAH/місяць повний course).

  Combination NRT (patch + short-acting gum/lozenge PRN) — superior
  efficacy vs monotherapy; preferable для high-dependence smokers
  (>20 cig/day; Fagerstrom score >5).

  Поліки-implications:
  - WHO FCTC Article 14 — рекомендує national reimbursement /
    subsidy для NRT як ключовий tobacco-cessation tool. УА
    станом на 2026-05 НЕ субсидує NRT через Affordable Medicines.
  - Charitable foundations (e.g., Tobacco Free Ukraine,
    Free Smoking) — обмежено надавали безкоштовні NRT-products
    у деяких регіональних pilot-programs; не systemic.
  - Telehealth-cessation programs (Quitline 0 800 33 4444 у УА) —
    надають behavioral counseling, але NRT-products самостійно
    купуються pacient'ом.

  AccessPathway render-time-only.
