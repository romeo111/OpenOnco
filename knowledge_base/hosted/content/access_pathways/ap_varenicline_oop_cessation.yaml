id: AP-VARENICLINE-OOP-CESSATION
name: "Varenicline 12-week tobacco-cessation course — out-of-pocket pharmacy purchase"
name_ua: "12-тижневий курс варенікліну (Chantix / Champix) для припинення куріння — оплата з кишені в аптеці"

applies_to_drug_ids:
  - DRUG-VARENICLINE
applies_to_regimen_ids:
  - REG-VARENICLINE-12W

pathway_type: self_pay

country_options: ["UA"]

cost_orientation:
  currency: UAH
  min: 2500
  max: 3500
  per_unit: course
  notes: >
    Pacient out-of-pocket cost за повний 12-тижневий курс варенікліну
    станом на 2026-05:
    - Brand Champix / Chantix (Pfizer) — 2700-3500 UAH/12-тижневий
      курс (titration-start-pack + maintenance 0.5 mg/1 mg tabs);
      історично Champix був disposable з ринку у деяких EU/US-
      країнах у 2021-2023 через ймовірний N-nitroso-varenicline
      impurity issue (Pfizer voluntary recall), але reintroduction
      ремплейсмент у 2024-2025.
    - Генерики varenicline (за межами PCS / Sun Pharma / Polфarma)
      — 2500-3200 UAH/12w-course станом на 2026-05.
    - drlz.com.ua / apteka911.com.ua / tabletki.ua перевірено.
    - **НЕ входить у Affordable Medicines** НСЗУ; tobacco-cessation
      pharmacotherapy не покривається державною reimbursement-
      програмою.
    - **Не вкладене у НСЗУ-пакет** ні з онкологічних ні з prevention
      indications.

typical_lead_time_weeks: [0, 1]

contact_pattern: >
  Сімейний лікар або pulmonologist / cardiologist обговорює tobacco-
  cessation pharmacotherapy options з pacient'ом. Varenicline —
  most-efficacious monotherapy per Cochrane-2023 meta-analysis
  (~2x success-rate vs placebo; OR 2.32 [2.15-2.51]; superior до
  bupropion та NRT-monotherapy у direct head-to-head). Призначається
  рецептом; pacient купує OOP у звичайній приватній аптеці.

  Standard dosing:
  - Days 1-3: 0.5 mg PO daily.
  - Days 4-7: 0.5 mg PO BID.
  - Day 8+ (12 тижнів): 1 mg PO BID.
  - Target quit date — встановити на day 8 АБО початок-3-х-тижні.
  - Extension до 24 тижнів — додатковий benefit для maintenance
    cessation per CHANTIX-Extended trial.

eligibility_caveats:
  - "Adult smoker (≥10 cigarettes/day baseline переважно)"
  - "Severe major depression / suicidal ideation history — caution; FDA black-box попередження для neuropsychiatric AE було removed у 2016 (EAGLES trial); але клініцист має monitor mood-changes"
  - "Renal impairment — GFR <30 мл/хв — dose reduction до 1 mg daily; GFR <15 — avoid"
  - "Pregnancy — категорія C; не використовувати у pregnant smoker; розглянути NRT (категорія D, але longstanding-use experience у pregnancy у деяких guidelines)"
  - "Cardiovascular disease — попередньо MAJOR ACT-trial concerns зменшено per EAGLES; modest absolute-risk-increase still у pacient'ів з recent ACS (≤2 weeks)"

requires_documentation:
  - "Smoking-anamnesis: pack-years, current daily-cigarette-count, Fagerstrom test of nicotine dependence (optional)"
  - "Mental-health screening (PHQ-9 рекомендовано перед start, особливо для пацієнтів з anxiety/depression)"
  - "GFR / creatinine baseline (для dose-adjustment)"
  - "Cardiovascular history (recent MI, stroke, unstable angina)"
  - "Інформоване consent щодо neuropsychiatric AE та nausea (~20-30% adverse-effect rate)"

verified_by: null
last_verified: "2026-05-18"

sources:
  - SRC-IARC-100A-TOBACCO-SMOKING

notes: >
  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode.

  Tobacco-cessation pharmacotherapy — найважливіша prevention-intervention
  для lung/head-neck/esophageal/bladder cancer + cardiovascular outcomes.
  Varenicline — most-efficacious monotherapy (Cochrane 2023:
  OR 2.32 vs placebo; OR 1.59 vs NRT-monotherapy).

  Україна — global tobacco-cessation gap: 2500-3500 UAH/12-week course
  — обмежує доступність для economically-vulnerable населення.
  Affordable Medicines НСЗУ-програма НЕ включає tobacco-cessation
  pharmacotherapy станом на 2026-05; advocacy для inclusion варенікліну
  + NRT-product у Affordable Medicines — pending public-health
  policy decision.

  WHO Framework Convention on Tobacco Control (FCTC) — Україна ратифікувала
  у 2006; Article 14 рекомендує national tobacco-cessation services
  безкоштовно або субсидовано. Implementation gap.

  Combination therapy (varenicline + NRT) — emerging evidence (CATCH
  trial 2024) для super-high-dependence smokers; ще не standard-of-care.

  AccessPathway render-time-only.
