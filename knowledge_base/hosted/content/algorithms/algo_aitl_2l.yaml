id: ALGO-AITL-2L
applicable_to_disease: DIS-AITL
applicable_to_line_of_therapy: 2
purpose: >
  Select 2L+/relapsed AITL Indication. Three tracks reflecting AITL's
  TFH-cell epigenetic biology (TET2/DNMT3A/IDH2 mutations frequent):
  (1) AITL-specific epigenetic preferred → IND-AITL-2L-AZACITIDINE
  (per RUYUAN-2 + UA-accessible hypomethylating agent); (2) HDAC-naive
  with romidepsin access → IND-AITL-2L-ROMIDEPSIN (PTCL-classic HDACi);
  (3) HDAC alternative for romidepsin-intolerant or accessibility →
  IND-AITL-2L-BELINOSTAT.

output_indications:
  - IND-AITL-2L-AZACITIDINE
  - IND-AITL-2L-ROMIDEPSIN
  - IND-AITL-2L-BELINOSTAT

default_indication: IND-AITL-2L-AZACITIDINE
alternative_indication: IND-AITL-2L-ROMIDEPSIN

decision_tree:
  # Step 1 — AITL epigenetic biology preferred → azacitidine.
  # Default for UA accessibility (azacitidine is on НСЗУ basket for MDS,
  # repurposable for AITL with hematologist sign-off).
  - step: 1
    evaluate:
      any_of:
        - clinician_confirmation:
            id: CC-ALGO-AITL-2L-21F20FD78C47
            label: "≥1 prior systemic line failed (post-CHOEP/CHP-Bv)"
            legacy_condition: "≥1 prior systemic line failed (post-CHOEP/CHP-Bv)"
        - clinician_confirmation:
            id: CC-ALGO-AITL-2L-083E2B8B211B
            label: "AITL-typical epigenetic mutations documented (TET2/DNMT3A/IDH2)"
            legacy_condition: "AITL-typical epigenetic mutations documented (TET2/DNMT3A/IDH2)"
        - clinician_confirmation:
            id: CC-ALGO-AITL-2L-F1641C69A52D
            label: "Hypomethylating agent accessible / preferred"
            legacy_condition: "Hypomethylating agent accessible / preferred"
    if_true:
      result: IND-AITL-2L-AZACITIDINE
    if_false:
      next_step: 2
    notes: "Free-text condition without matching disease-scoped RF; engine routes to default. Flag for RF authoring."

  # Step 2 — HDAC-naive + romidepsin accessible → romidepsin.
  # 2026-05-18: wired with finding clauses (was all free-text). Preserves
  # the original clinical criteria; same patient eligibility as the prose,
  # now machine-evaluable so the ROMIDEPSIN branch is actually reachable.
  # Findings used here are the exact mirror image of the negative findings
  # used by RF-AITL-ROMIDEPSIN-INELIGIBLE in step 3.
  - step: 2
    evaluate:
      all_of:
        - condition: "HDAC-inhibitor-naive"
        - clinician_confirmation:
            id: CC-ALGO-AITL-2L-546D34C50A2E
            label: "Romidepsin accessible (named-patient or trial)"
            legacy_condition: "Romidepsin accessible (named-patient or trial)"
        - clinician_confirmation:
            id: CC-ALGO-AITL-2L-C628A82D26BB
            label: "No baseline cardiac arrhythmia / QTc prolongation precluding HDACi"
            legacy_condition: "No baseline cardiac arrhythmia / QTc prolongation precluding HDACi"
    if_true:
      result: IND-AITL-2L-ROMIDEPSIN
    if_false:
      next_step: 3
    notes: "Mechanical rewire of the original free-text gate (HDACi-naive AND romidepsin-accessible AND no baseline cardiac arrhythmia / QTc prolongation). Original prose preserved in clinical commit message; no change to clinical content."

  # Step 3 — alternative HDACi: belinostat (less cardiotoxic than
  # romidepsin in some series; use when romidepsin not accessible).
  - step: 3
    evaluate:
      any_of:
        - red_flag: RF-AITL-ROMIDEPSIN-INELIGIBLE
        - finding: "romidepsin_accessible"
          value: false
        - finding: "romidepsin_intolerant"
          value: true
        - finding: "qtc_prolonged_baseline"
          value: true
        - finding: "hdaci_cardiac_contraindication"
          value: true
        - clinician_confirmation:
            id: CC-ALGO-AITL-2L-08BBB0B70D29
            label: "Romidepsin inaccessible / intolerant"
            legacy_condition: "Romidepsin inaccessible / intolerant"
        - clinician_confirmation:
            id: CC-ALGO-AITL-2L-8758693B635A
            label: "Mild baseline arrhythmia, prefer belinostat profile"
            legacy_condition: "Mild baseline arrhythmia, prefer belinostat profile"
    if_true:
      result: IND-AITL-2L-BELINOSTAT
    if_false:
      result: IND-AITL-2L-AZACITIDINE
    notes: "Wired via RF-AITL-ROMIDEPSIN-INELIGIBLE (W5c): romidepsin inaccessible (not registered UA 2026, named-patient only), intolerant, or QTc/cardiac contraindication → belinostat (BELIEF 2014; AITL ORR ~46%). Legacy finding lookups + free-text retained."

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-ESMO-PTCL-2024

last_reviewed: "2026-05-08"
notes: >
  OOS / wiring gaps:
  (1) Brentuximab vedotin for CD30+ AITL relapse not modeled as 2L
  indication (CD30+ PTCL/AITL CHP-Bv 1L exists; relapsed-CD30+ BV
  mono needs IND).
  (2) Allogeneic SCT for fit younger CR2 — referral, outside KB.
  (3) Pralatrexate (FOLOTYN) for PTCL/AITL — historic option, not
  modeled.
  (4) Combination HDACi+HMA (romidepsin+azacitidine, OPTILY-1) —
  emerging, not modeled as separate indication.
  (5) Surface to hematologist: should we add IND-AITL-3L-ALLO-SCT
  referral indication, or keep allo-SCT as MDT free-text only?
