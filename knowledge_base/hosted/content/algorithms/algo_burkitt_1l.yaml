id: ALGO-BURKITT-1L
applicable_to_disease: DIS-BURKITT
applicable_to_line_of_therapy: 1
purpose: Draft first-line Burkitt routing. The high-risk/no-proven-CNS CODOX/IVAC reference requires positive
  risk and CNS-status confirmation; failed selected-route applicability withholds treatment without automatic
  substitution.
output_indications:
- IND-BURKITT-1L-DAEPOCHR
- IND-BURKITT-1L-CODOXM-IVAC
default_indication: IND-BURKITT-1L-DAEPOCHR
alternative_indication: IND-BURKITT-1L-CODOXM-IVAC
decision_tree:
- step: 1
  evaluate:
    any_of:
    - red_flag: RF-BURKITT-HIGH-RISK
  if_true:
    result: IND-BURKITT-1L-CODOXM-IVAC
  if_false:
    next_step: 2
- step: 2
  evaluate:
    all_of:
    - clinician_confirmation:
        id: CC-ALGO-BURKITT-1L-F08C149D5A0C
        label: Standard / intermediate risk
        legacy_condition: Standard / intermediate risk
    - clinician_confirmation:
        id: CC-ALGO-BURKITT-1L-E20FD88CF985
        label: ECOG ≤ 3
        legacy_condition: ECOG ≤ 3
  if_true:
    result: IND-BURKITT-1L-DAEPOCHR
  if_false:
    result: IND-BURKITT-1L-DAEPOCHR
  notes: 'MDT-only after CSD-7A audit — mechanical rewire of the original free-text ECOG gate into finding:
    "ecog" (threshold 3, comparator <=), mirroring RF-BURKITT-FRAILTY-AGE / RF-FITNESS-ECOG-POOR. ''Standard
    / intermediate risk'' clause remains free-text — composite is biomarker/disease-specific (not fitness/eligibility/prior-therapy),
    so no pan-disease RF applies; wireable only via dedicated disease-specific RFs in a future round.
    Original clinical criteria unchanged.'
sources:
- SRC-NCCN-BCELL-2025
- SRC-ESMO-BURKITT-2024
last_reviewed: null
notes: The legacy high-risk flag does not establish applicability of the encoded eviQ high-risk/no-proven-CNS
  schedule. The indication requires burkitt_high_risk=true and cns_involvement=false; missing/conflicting
  or proven-CNS status prevents materialization. This does not validate risk classification, fitness,
  HIV-specific ranking or CNS-positive/low-risk protocol choices.
notes_ua: Застарілий прапорець високого ризику не підтверджує придатність закодованого довідкового розкладу
  eviQ без доведеного ураження ЦНС. Показання вимагає burkitt_high_risk=true та cns_involvement=false;
  відсутній/суперечливий чи ЦНС-позитивний стан блокує матеріалізацію. Це не перевіряє класифікацію ризику,
  придатність, вибір при ВІЛ чи протоколи для ЦНС-позитивного/низькоризикового захворювання.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_13
draft_revision: 2
review_status: pending_clinical_signoff
