id: ALGO-NMZL-1L
applicable_to_disease: DIS-NODAL-MZL
applicable_to_line_of_therapy: 1
purpose: >
  Select default + alternative for first-line nodal MZL. Mirrors FL
  algorithm: low-burden → W&W; high-burden → BR; transformation suspect
  → R-CHOP (via aggressive track shared with FL).

output_indications:
  - IND-NMZL-1L-WATCH
  - IND-NMZL-1L-BR
  - IND-NMZL-1L-HCV-POSITIVE
  - IND-FL-1L-RCHOP-AGGRESSIVE  # share aggressive with FL — same biology, same regimen

default_indication: IND-NMZL-1L-WATCH
alternative_indication: IND-NMZL-1L-BR

decision_tree:
  # Step 1 — transformation suspect overrides everything; aggressive track.
  - step: 1
    evaluate:
      any_of:
        - red_flag: RF-FL-TRANSFORMATION-SUSPECT
    if_true:
      result: IND-FL-1L-RCHOP-AGGRESSIVE
    if_false:
      next_step: 2

  # Step 2 — HCV-RNA positive AND compensated liver function AND indolent
  # presentation (no GELF criteria) → DAA antiviral-first. Mirrors SMZL HCV+
  # routing; smaller evidence base than HCV-MZL extranodal but same etiology.
  - step: 2
    evaluate:
      all_of:
        - red_flag: RF-NMZL-INFECTION-SCREENING  # HCV serology / RNA positive (and HBV/HIV gating)
        - clinician_confirmation:
            id: CC-ALGO-NMZL-1L-DB167E4F7C7A
            label: "HCV RNA positive (anti-HCV alone insufficient)"
            legacy_condition: "HCV RNA positive (anti-HCV alone insufficient)"
        - clinician_confirmation:
            id: CC-ALGO-NMZL-1L-25E06988F1ED
            label: "Compensated liver function (no decompensated cirrhosis)"
            legacy_condition: "Compensated liver function (no decompensated cirrhosis)"
        - clinician_confirmation:
            id: CC-ALGO-NMZL-1L-3D88729CE34A
            label: "Indolent / low-burden presentation (GELF-negative)"
            legacy_condition: "Indolent / low-burden presentation (GELF-negative)"
    if_true:
      result: IND-NMZL-1L-HCV-POSITIVE
    if_false:
      next_step: 3
    notes: "Mechanical rewire of 2 of 3 free-text gates. 'HCV RNA positive (anti-HCV alone insufficient)' now wired via finding: hcv_rna_positive=true — mirrors ALGO-SMZL-1L step 1's identical flat leaf for the same HCV-DAA-first routing decision; RF-SMZL-INFECTION-SCREENING's own trigger confirms hcv_rna_positive is a distinct field from anti_hcv, matching the 'anti-HCV alone insufficient' caveat. 'Indolent / low-burden presentation (GELF-negative)' now wired via red_flag: RF-GELF-LOW-BURDEN — mirrors this file's own step 3, which already cross-reuses RF-FL-HIGH-TUMOR-BURDEN-GELF from FL for the identical GELF framework; RF-GELF-LOW-BURDEN is its exact negated-polarity companion (already live in ALGO-FL-1L step 3, and matches examples/patient_nmzl_low_burden.json's finding shape). 'Compensated liver function (no decompensated cirrhosis)' remains free-text: a flat finding: decompensated_cirrhosis=false leaf is NOT confirmed equivalent to the only existing KB precedent for this field (ALGO-SMZL-1L step 1's none_of: [{finding: decompensated_cirrhosis, value: true}]) — the two forms diverge when the finding is unset (common today, since neither NMZL's stub questionnaire nor demographics collects it), so left as prose pending clarification. Original clinical criteria unchanged."

  # Step 3 — high tumor burden (GELF) → BR; otherwise watch-and-wait.
  - step: 3
    evaluate:
      any_of:
        - red_flag: RF-FL-HIGH-TUMOR-BURDEN-GELF
    if_true:
      result: IND-NMZL-1L-BR
    if_false:
      result: IND-NMZL-1L-WATCH

sources: [SRC-NCCN-BCELL-2025, SRC-ESMO-MZL-2024, SRC-ARCAINI-2014]
last_reviewed: "2026-04-27"
notes: >
  Reuses GELF + transformation-suspect RedFlags from FL. Aggressive track
  reuses IND-FL-1L-RCHOP-AGGRESSIVE — biology + treatment identical at
  the transformation point. HCV+ branch (step 2) added 2026-04-27 to mirror
  SMZL HCV+ etiology-driven routing; uses same REG-DAA-SOF-VEL as HCV-MZL
  extranodal. Decision intentionally conditional on HCV-RNA (not anti-HCV
  alone) and indolent/low-burden presentation — DAA-first evidence weaker
  for nodal localization than for extranodal HCV-MZL.
notes_ua: >
  Повторно використовує RedFlag-и GELF + підозра на трансформацію з FL. Агресивний
  трек повторно використовує IND-FL-1L-RCHOP-AGGRESSIVE — біологія та лікування
  ідентичні на точці трансформації. Гілка HCV+ (крок 2) додана 2026-04-27 для
  відображення маршрутизації, керованої етіологією HCV при SMZL; використовує ту
  саму REG-DAA-SOF-VEL, що й HCV-MZL-екстранодальний. Рішення навмисно
  обумовлюється HCV-РНК (не тільки антиHCV) та індолентним/низько-бластним
  перебігом — докази для підходу «спочатку DAA» є слабшими для нодальної
  локалізації, ніж для екстранодального HCV-MZL.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_13
