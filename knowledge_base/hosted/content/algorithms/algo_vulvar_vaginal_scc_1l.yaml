  сутності для широкої локальної ексцизії вульви + пахової SLNB;
  (2) немає нозологічно-специфічного рандомізованого дослідження
  хіміопроменевої терапії для вульви/піхви; (3) крок 5 (if_false) не
  має авторизованої платино-хіміотерапевтичної Indication —
  маршрутизується до null; (4) немає окремого джерела NCCN Vulvar
  Cancer / NCCN Vaginal Cancer в цій базі знань; (5) кроки 1, 3 та 4
  залишаються частково текстовими (prose) без структурованого
  еквівалента — відкрита технічна прогалина, узгоджена з ~128 іншими
  подібними кроками в базі знань.
