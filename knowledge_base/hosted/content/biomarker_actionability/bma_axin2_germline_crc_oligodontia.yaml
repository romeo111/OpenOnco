id: BMA-AXIN2-GERMLINE-CRC-OLIGODONTIA
biomarker_id: BIO-AXIN2-GERMLINE
variant_qualifier: AXIN2 germline pathogenic (oligodontia–colorectal cancer syndrome)
disease_id: DIS-CRC
escat_tier: IIA
evidence_summary: >
  AXIN2 germline pathogenic variants cause a Lynch-like attenuated polyposis +
  oligodontia syndrome (Lammi et al. 2004) — characterized by congenital
  absence of multiple permanent teeth (oligodontia, often >6 teeth), early-
  onset adenomas, attenuated polyposis (typically <100 adenomas), and
  elevated colorectal cancer risk. AXIN2 is a WNT-pathway tumor suppressor;
  loss stabilizes β-catenin. Confirmed-carrier surveillance protocol follows
  attenuated FAP / Lynch-like template: colonoscopy q1-2y starting age 25
  (or 10y before earliest family CRC), with polypectomy of all detected
  adenomas; if adenoma burden grows beyond endoscopic management, surgical
  consultation. Cascade testing to first-degree relatives. Oligodontia is
  a useful clinical flag — dental record review may identify undiagnosed
  carriers. ESCAT IIA.
evidence_summary_ua: >
  Герміногенні патогенні варіанти AXIN2 спричиняють Lynch-подібний синдром
  атенюйованого поліпозу з олігодонтією (Lammi та ін., 2004) — вроджена
  відсутність кількох постійних зубів (олігодонтія, часто >6 зубів), ранні
  аденоми, атенюйований поліпоз (зазвичай <100 аденом) та підвищений ризик
  колоректального раку (КРР). AXIN2 — супресор пухлинного росту у
  WNT-каскаді; його втрата стабілізує β-катенін. Протокол нагляду для
  підтверджених носіїв відповідає шаблону атенюйованого FAP / Lynch-подібного
  синдрому: колоноскопія кожні 1–2 роки з 25 років (або за 10 років до
  наймолодшого випадку КРР у сім'ї) з поліпектомією всіх виявлених аденом;
  якщо кількість поліпів перевищує можливості ендоскопічного контролю —
  хірургічна консультація. Каскадне тестування родичів першого ступеня
  спорідненості. Олігодонтія — корисна клінічна ознака: перегляд
  стоматологічної документації може виявити недіагностованих носіїв. ESCAT IIA.
