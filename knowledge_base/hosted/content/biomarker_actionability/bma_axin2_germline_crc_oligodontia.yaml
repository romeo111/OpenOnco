notes: >
  STUB — Wave A+B germline expansion. Linked Indication: IND-LYNCH-CARRIER-
  SURVEILLANCE used as closest-fit surveillance template (Lynch-like
  cadence, no AXIN2-specific Indication exists yet). Two-Clinical-Co-Lead
  signoff queued. AXIN2 syndrome is rare (~25 families reported) — penetrance
  + cancer spectrum estimates remain provisional; treat surveillance as
  attenuated-FAP / Lynch-overlap pragmatic protocol pending more data.
notes_ua: >
  STUB — Wave A+B розширення (герміногенні варіанти). Прив'язка до
  IND-LYNCH-CARRIER-SURVEILLANCE як найближчого шаблону нагляду
  (Lynch-подібний режим; AXIN2-специфічної Indication ще немає). Очікується
  підпис двох клінічних співкерівників (Two-Clinical-Co-Lead). Синдром
  AXIN2 рідкісний (~25 родин у літературі); оцінки пенетрантності та
  спектра онкоризику залишаються попередніми; нагляд слід розглядати як
  прагматичний протокол на перетині атенюйованого FAP та Lynch-синдрому до
  накопичення додаткових даних.
