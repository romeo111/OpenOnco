notes: >
  STUB — Wave A+B germline expansion. Linked Indication: IND-LYNCH-CARRIER-
  SURVEILLANCE used as closest-fit Lynch-like template (no MSH3-specific
  Indication exists yet). Two-Clinical-Co-Lead signoff queued. Critical:
  MSH3-deficient tumors exhibit EMAST not classical MSI-H — standard MSI
  assays may miss them; this matters both for predisposition diagnosis
  and for potential pembrolizumab eligibility in advanced disease. MSH3
  syndrome is rare; published cohorts small (<25 families); penetrance
  estimates provisional.
notes_ua: >
  STUB — розширення Wave A+B (герміногенні варіанти). Прив'язка до
  IND-LYNCH-CARRIER-SURVEILLANCE як найближчого за змістом лінч-подібного
  шаблону (специфічного Indication для MSH3 поки не існує). Очікується
  підпис двох клінічних співкерівників (Two-Clinical-Co-Lead signoff).
  Критично: MSH3-дефіцитні пухлини мають EMAST, а не класичний MSI-H —
  стандартні MSI-аналізи можуть їх не виявити; це важливо як для діагностики
  схильності, так і для потенційної прийнятності пембролізумабу при поширеному
  захворюванні. Синдром MSH3 рідкісний; опубліковані когорти невеликі
  (<25 родин); оцінки пенетрантності попередні.
