notes: "BLM germline biallelic — drives Bloom syndrome (autosomal recessive). RecQ helicase deficiency → genomic instability with elevated sister-chromatid exchanges (diagnostic). Broad cancer susceptibility: leukemias / lymphomas (childhood), CRC, breast, skin, head/neck, others. Non-cancer: short stature, photosensitive facial erythema, immunodeficiency, diabetes. Common in Ashkenazi-Jewish ancestry (founder variant blmAsh). Heterozygotes may have modestly elevated CRC risk. STUB pending two-Co-Lead signoff."
notes_ua: "BLM germline біалельний варіант — спричиняє синдром Блума (аутосомно-рецесивний). Дефіцит RecQ-геліказ призводить до геномної нестабільності з підвищеною частотою сестринських хроматидних обмінів (діагностична ознака). Широкий спектр онкологічної схильності: лейкемії/лімфоми (у дітей), КРР, рак молочної залози, шкіри, голови та шиї, інші локалізації. Позаонкологічні прояви: низькорослість, фотосенсибілізована еритема обличчя, імунодефіцит, цукровий діабет. Поширений серед осіб ашкеназького єврейського походження (засновницький варіант blmAsh). Гетерозиготні носії можуть мати помірно підвищений ризик КРР. Чернетка, очікує підписання двома клінічними співкерівниками."
ukrainian_review_status: pending_clinical_signoff
