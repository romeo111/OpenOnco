notes: >
  Third of three Ashkenazi Jewish founder mutations (combined carrier
  frequency ~2.5% in AJ; ~1.5% for this BRCA2 variant alone in some
  cohorts). Single-T deletion in exon 11 causing frameshift and premature
  termination in the DNA-binding domain region — abolishes RAD51-mediated
  homologous-recombination repair. Modern HGVS notation c.5946delT;
  legacy notation 6174delT (older mRNA-numbering convention). Lifetime
  cancer risks consistent with BRCA2 average: breast ~50-60%, ovarian
  ~15-20%, male breast ~6-8%, pancreas ~5-7%, prostate ~20-25%. Higher
  pancreas risk than BRCA1 — CAPS-Consortium pancreatic surveillance
  (annual MRI/MRCP or EUS from age 50 or 10 years before youngest PDAC
  in family) applies to BRCA2 carriers with PDAC family history. Same
  breast/ovarian surveillance and risk-reduction protocols as other
  BRCA2 pathogenic variants (annual MRI from 25-30, RRSO 40-45). NCCN
  2025 endorses population-wide AJ founder-panel testing. STUB pending
  two-Co-Lead signoff.
notes_ua: >
  Третя з трьох засновницьких мутацій ашкеназі (сумарна частота
  носійства ~2.5% серед ашкеназі; ~1.5% для цього варіанта BRCA2 окремо
  в деяких когортах). Делеція одного тиміну в екзоні 11 спричиняє зсув
  рамки зчитування та передчасний стоп-кодон у ділянці ДНК-зв'язуючого
  домену — усуває RAD51-опосередковану репарацію шляхом гомологічної
  рекомбінації. Сучасна HGVS-нотація — c.5946delT; застаріла нотація —
  6174delT (за старішою конвенцією нумерації мРНК). Довічні ризики раку
  відповідають середнім показникам для BRCA2: рак молочної залози
  ~50-60%, яєчника ~15-20%, рак молочної залози у чоловіків ~6-8%,
  підшлункової залози ~5-7%, передміхурової залози ~20-25%. Ризик раку
  підшлункової залози вищий, ніж при BRCA1 — нагляд CAPS Consortium
  (щорічна МРТ/MRCP або ЕУС з 50 років або за 10 років до наймолодшого
  випадку PDAC у родині) застосовується до носіїв BRCA2 з родинною
  історією PDAC. Той же протокол нагляду за молочною залозою/яєчниками
  та зниження ризику, що й для інших патогенних варіантів BRCA2
  (щорічна МРТ з 25-30 років, RRSO у 40-45 років). NCCN 2025 підтримує
  популяційне тестування панелі ашкеназійських засновницьких варіантів.
  Чернетка, очікує підписання двома клінічними співкерівниками.
