  loinc: "1992-7"
sources:
  - SRC-NCCN-THYROID-2025
  - SRC-ENDOCRINE-SOCIETY-MEN-2023
last_reviewed: "2026-05-18"
notes: >
  Parafollicular C-cell secretory product — highly specific biomarker for
  medullary thyroid carcinoma (MTC) and C-cell hyperplasia. ATA 2015 / NCCN
  2025 surveillance for MEN2A/MEN2B carriers who DEFER prophylactic
  thyroidectomy (rare, high-risk-codon discussion only): annual basal
  calcitonin + neck US starting at age 3-5 (MEN2B) or 5 (MEN2A high-risk
  codon) or 5-10 (MEN2A intermediate/low). Pentagastrin/calcium-stimulated
  calcitonin historically used; pentagastrin no longer manufactured in
  many regions. Basal calcitonin >10 pg/mL in MEN2 carrier → strong
  indication for prophylactic thyroidectomy. After thyroidectomy
  (prophylactic or therapeutic): post-operative calcitonin used to assess
  cure (<2 pg/mL = biochemical cure) and detect recurrence (q6-12 month
  surveillance). Calcitonin doubling time <6 months = aggressive
  recurrence (worst prognosis). Procalcitonin can replace if assay
  available. Falsely elevated in renal failure, pregnancy, autoimmune
  thyroiditis. STUB pending two-Co-Lead signoff.
notes_ua: >
  Секреторний продукт парафолікулярних C-клітин — високоспецифічний
  біомаркер медулярного раку щитоподібної залози (МРЩЗ) та C-клітинної
  гіперплазії. ATA 2015 / NCCN 2025: спостереження за носіями MEN2A/MEN2B,
  що відкладають профілактичну тиреоїдектомію (рідкісна ситуація,
  обговорюється лише для кодонів високого ризику) — щорічний базальний
  кальцитонін + УЗД шиї, починаючи з віку 3-5 років (MEN2B), 5 років
  (MEN2A, кодон високого ризику) або 5-10 років (MEN2A, проміжний/низький
  ризик). Пентагастрин-/кальцій-стимульований кальцитонін застосовувався
  раніше; пентагастрин більше не виробляється у багатьох регіонах.
  Базальний кальцитонін >10 пг/мл у носія MEN2 → сильне показання до
  профілактичної тиреоїдектомії. Після тиреоїдектомії (профілактичної чи
  лікувальної): післяопераційний кальцитонін використовується для оцінки
  вилікування (<2 пг/мл = біохімічне вилікування) та виявлення рецидиву
  (спостереження кожні 6-12 місяців). Час подвоєння кальцитоніну <6 місяців
  = агресивний рецидив (найгірший прогноз). Прокальцитонін може замінити
  аналіз за наявності. Хибно підвищений при нирковій недостатності,
  вагітності, автоімунному тиреоїдиті.
