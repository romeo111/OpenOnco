notes: >
  Cross-disease relevance:

  - **MCL** (defining ~95%): nuclear cyclin D1 over-expression from
    t(11;14)(q13;q32) IGH/CCND1 translocation. Cyclin D1-negative MCL
    (~5%) requires SOX11 + clinical context for diagnosis.
  - **MM** (~15-20%): t(11;14) IGH/CCND1 subset — venetoclax-sensitive
    population (BELLINI trial signal); emerging targeted therapy.
  - **HCL** subset: cyclin D1-positive. Distinguishes from CLL.
  - **Plasma cell myeloma cyclin D1+ subset**: t(11;14) defines this
    subgroup — favorable cytogenetic + venetoclax-responsive.

  Drive r/r venetoclax pathway across MCL + MM t(11;14) subsets — future
  scope.
notes_ua: >
  Клінічне значення за нозологіями:

  - **МКЛ** (визначальна ознака, ~95%): ядерна гіперекспресія cyclin D1
    унаслідок транслокації t(11;14)(q13;q32) IGH/CCND1. Cyclin D1-негативна
    МКЛ (~5%) потребує SOX11 та клінічного контексту для встановлення
    діагнозу.
  - **ММ** (~15-20%): підгрупа з t(11;14) IGH/CCND1 — популяція, чутлива
    до венетоклаксу (сигнал дослідження BELLINI); таргетна терапія, що
    розробляється.
  - **ВКЛ**, підгрупа: cyclin D1-позитивна. Відрізняє від ХЛЛ.
  - **Плазмоклітинна мієлома, підгрупа cyclin D1+**: t(11;14) визначає цю
    підгрупу — сприятливий цитогенетичний профіль + чутливість до
    венетоклаксу.

  Опрацювати напрям р/р-терапії венетоклаксом для підгруп МКЛ та ММ з
  t(11;14) — заплановано на майбутнє.
