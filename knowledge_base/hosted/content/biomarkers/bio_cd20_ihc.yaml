last_reviewed: "2026-04-25"
oncokb_skip_reason: ihc_no_variant
external_ids:
  hgnc_symbol: "CD20"
notes: >
  CD20+ status is required for any anti-CD20 monoclonal antibody therapy
  (rituximab, obinutuzumab). Most B-cell lymphomas are CD20+; rare
  exceptions (some HHV-8+ neoplasms, certain plasmablastic lymphomas)
  may be CD20- and require alternative regimens. Status can change
  post-rituximab — re-biopsy on relapse.
notes_ua: >
  Статус CD20+ є обов'язковою умовою для будь-якої терапії анти-CD20
  моноклональними антитілами (ритуксимаб, обінутузумаб). Більшість
  В-клітинних лімфом є CD20+; рідкісні винятки (деякі HHV-8+ неоплазії,
  окремі плазмобластні лімфоми) можуть бути CD20− і потребують
  альтернативних схем лікування. Статус може змінюватися після терапії
  ритуксимабом — на рецидиві показана повторна біопсія.
