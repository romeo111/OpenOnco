last_reviewed: "2026-04-27"
notes: >
  ~40-45% of EGFR-mutant NSCLC. First-line osimertinib (FLAURA, AURA3
  data). Slightly inferior PFS vs Exon 19 deletion. Acquired resistance
  patterns: T790M (>50%) — addressed by osimertinib up-front;
  C797S, MET amplification, histologic transformation.
notes_ua: >
  ~40-45% EGFR-мутантного НМРЛ. Перша лінія — осимертиніб (дані FLAURA, AURA3).
  Дещо поступається за виживаністю без прогресування порівняно з делецією
  19-го екзону. Патерни набутої резистентності: T790M (>50%) — долається
  осимертинібом при застосуванні з першої лінії; C797S, ампліфікація MET,
  гістологічна трансформація.
