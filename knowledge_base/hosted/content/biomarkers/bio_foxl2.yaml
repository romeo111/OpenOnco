last_reviewed: "2026-05-04"
notes: >
  FOXL2 (Forkhead Box L2) is a transcription factor essential for granulosa cell
  differentiation and maintenance of ovarian identity. The p.C134W (c.402C>G) hotspot
  mutation is present in ~97% of adult granulosa cell tumors (AGCTs) and is the only
  known pathognomonic point mutation in any solid tumor (100% specificity if hotspot
  confirmed). The mutation is a dominant-negative gain-of-function: C134W FOXL2 protein
  mislocalizes and aberrantly activates target genes (including CYP19A1/aromatase),
  driving estrogen excess. Clinically, the mutation is used:
  (1) Diagnostic: confirms AGCT vs other sex cord-stromal tumors (Sertoli-Leydig, fibroma).
  (2) Prognostic/monitoring: ctDNA detection of FOXL2 c.402C>G for early relapse detection
      (AGCTs recur late — 10–20 years post-diagnosis; ctDNA surveillance under investigation).
  (3) Therapeutic target: FOXL2 inhibition and CDK4/6 inhibitors (olaparib, palbociclib,
      ribociclib) are in clinical trials. Luteinizing hormone-RH agonists (leuprolide) and
      progestins are used for recurrent disease but no FDA approval in this specific context.
  ESCAT IIB: clinically useful diagnostic marker with emerging predictive utility;
  no FDA-approved targeted drug for FOXL2 p.C134W as of 2026.
notes_ua: >
  FOXL2 (Forkhead Box L2) — транскрипційний фактор, необхідний для диференціювання
  гранульозних клітин і підтримання оваріальної ідентичності. Мутація гарячої точки
  p.C134W (c.402C>G) наявна у ~97% дорослих гранульозоклітинних пухлин (ГКП) і є
  єдиною відомою патогномонічною точковою мутацією серед солідних пухлин (100%
  специфічність за підтвердженого варіанта). Мутація є домінантно-негативною
  активуючою (gain-of-function): білок FOXL2 C134W неправильно локалізується та
  аберантно активує гени-мішені (зокрема CYP19A1/ароматазу), що зумовлює надлишок
  естрогену. Клінічне застосування:
  (1) Діагностика: підтверджує ГКП на противагу іншим пухлинам строми статевого
      тяжа (Сертолі-Лейдіга, фіброма).
  (2) Прогноз/моніторинг: виявлення FOXL2 c.402C>G у ctDNA для раннього виявлення
      рецидиву (ГКП рецидивують пізно — через 10–20 років після діагностики;
      ctDNA-моніторинг перебуває на стадії дослідження).
  (3) Терапевтична мішень: інгібування FOXL2 та інгібітори CDK4/6 (олапариб,
      палбоцикліб, рибоцикліб) перебувають у клінічних дослідженнях. Агоністи
      ЛГ-РГ (лейпролід) та прогестини застосовуються при рецидивній хворобі, але
      не мають схвалення FDA у цьому конкретному застосуванні.
  ESCAT IIB: клінічно корисний діагностичний маркер із предиктивною цінністю, що
  формується; станом на 2026 р. немає схваленого FDA таргетного препарату для
  FOXL2 p.C134W.
