last_reviewed: "2026-05-04"
notes: >
  JAK3 is unique among JAK family kinases: it exclusively signals through the common gamma
  chain (γc, CD132, IL2RG), the shared receptor subunit for IL-2, IL-4, IL-7, IL-9, IL-15,
  IL-21 cytokines. JAK3 is therefore predominantly expressed in T, NK, and B lymphocytes.
  Activating JAK3 mutations drive constitutive STAT3/STAT5 signaling independent of cytokine.
  Clinical contexts:
  (1) T-cell acute lymphoblastic leukemia (T-ALL): JAK3 mutations in ~15–20% (co-occur with
      NOTCH1, CDKN2A loss).
  (2) Adult T-cell leukemia/lymphoma (ATLL): JAK3 mutations in ~35% of aggressive subtypes.
  (3) Mycosis fungoides / Sézary syndrome (CTCL): JAK3/STAT3 pathway activated in ~30%.
  (4) Anaplastic large cell lymphoma (ALCL): JAK1/STAT3 (related pathway; JAK3 less common).
  Therapeutic relevance: ruxolitinib (JAK1/2 inhibitor; not JAK3-selective) is FDA-approved
  for CTCL (mycosis fungoides) and GVHD and has activity in ATLL (off-label). Ritlecitinib
  (irreversible JAK3/TEC family inhibitor, FDA 2023 for alopecia areata) is being investigated
  in JAK3-mutant hematologic malignancies. JAK3-selective inhibitors are theoretically preferred
  over JAK1/2 inhibitors to avoid myelosuppression, but clinical data in malignancy is limited.
notes_ua: >
  JAK3 — унікальна серед JAK-кіназ: сигналізує виключно через загальний γ-ланцюг
  (γc, CD132, IL2RG) — спільну рецепторну субодиницю для цитокінів IL-2, IL-4, IL-7,
  IL-9, IL-15, IL-21. Тому JAK3 переважно експресується в Т-, NK- та В-лімфоцитах.
  Активуючі мутації JAK3 зумовлюють конститутивну сигналізацію STAT3/STAT5 незалежно
  від цитокіну.
  Клінічні контексти:
  (1) Т-клітинний гострий лімфобластний лейкоз (T-ALL): мутації JAK3 у ~15–20%
      (супутньо з NOTCH1, втратою CDKN2A).
  (2) Т-клітинний лейкоз/лімфома дорослих (ATLL): мутації JAK3 у ~35% агресивних
      підтипів.
  (3) Грибоподібний мікоз / синдром Сезарі (CTCL): шлях JAK3/STAT3 активований
      у ~30%.
  (4) Анапластична великоклітинна лімфома (ALCL): JAK1/STAT3 (споріднений шлях;
      JAK3 трапляється рідше).
  Терапевтичне значення: руксолітиніб (ruxolitinib; інгібітор JAK1/2, не
  JAK3-селективний) схвалений FDA для CTCL (грибоподібного мікозу) та РТПХ і
  має активність при ATLL (поза показаннями). Рітлецитиніб (ritlecitinib;
  незворотний інгібітор JAK3/TEC-родини, схвалений FDA 2023 р. для алопеції
  ареата) досліджується при JAK3-мутантних гематологічних злоякісних
  новоутвореннях. JAK3-селективні інгібітори теоретично мають перевагу над
  інгібіторами JAK1/2 щодо уникнення мієлосупресії, але клінічні дані при
  злоякісних новоутвореннях наразі обмежені.
