notes: >
  MAP2K1 (MEK1) is a dual-specificity kinase directly downstream of BRAF and upstream of
  ERK1/2. Activating mutations constitute an alternative mechanism of MAPK pathway activation
  in tumors that lack BRAF mutations. Key clinical contexts:
  (1) Hairy cell leukemia variant (HCL-V): MAP2K1 K57E present in ~40–50% of HCL-V cases
      (which are BRAF V600E-negative by definition). Cobimetinib (MEK inhibitor) shows
      activity in MAP2K1-mutant HCL-V in small series; no FDA approval but NCCN 2B evidence.
  (2) Low-grade glioma (LGG): MAP2K1 mutations are one of the MAPK pathway alterations
      (~5–10% of BRAF-fusion-negative LGGs). Trametinib (MEK inhibitor) shows activity in
      pediatric LGG with MAPK pathway alterations per FIREFLY-1 trial (binimetinib/trametinib).
  (3) Melanoma: MAP2K1 mutations occur in ~5–8% as secondary resistance to BRAF inhibitors;
      MEK inhibitors still active but combination needed.
  (4) Histiocytic disorders (ECD, LCH): MAP2K1 mutations as alternative to BRAF V600E.
  Do not confuse MEK inhibitors approved for BRAF V600E indications — those approvals are
  as adjuncts to BRAF inhibitors (vemurafenib + cobimetinib; dabrafenib + trametinib) and
  are not driven by MAP2K1 mutation status.
notes_ua: >
  MAP2K1 (MEK1) — кіназа подвійної специфічності, що діє одразу нижче BRAF і вище ERK1/2.
  Активуючі мутації є альтернативним механізмом активації шляху MAPK у пухлинах без мутацій
  BRAF. Ключові клінічні контексти:
  (1) Варіант волосисто-клітинного лейкозу (HCL-V): MAP2K1 K57E наявна у ~40–50% випадків
      HCL-V (які за визначенням BRAF V600E-негативні). Кобіметиніб (інгібітор MEK) демонструє
      активність при MAP2K1-мутантному HCL-V у невеликих серіях; схвалення FDA немає,
      доказовість NCCN 2B.
  (2) Гліома низького ступеня злоякісності (LGG): мутації MAP2K1 — одна з альтерацій шляху
      MAPK (~5–10% BRAF-fusion-негативних LGG). Траметиніб (інгібітор MEK) демонструє
      активність при педіатричній LGG з альтераціями шляху MAPK за даними дослідження
      FIREFLY-1 (бініметиніб/траметиніб).
  (3) Меланома: мутації MAP2K1 трапляються у ~5–8% як вторинна резистентність до
      інгібіторів BRAF; інгібітори MEK залишаються активними, але потрібна комбінація.
  (4) Гістіоцитарні захворювання (ECD, LCH): мутації MAP2K1 як альтернатива BRAF V600E.
  Не слід плутати з інгібіторами MEK, схваленими для показань з BRAF V600E, — ці схвалення
  стосуються застосування як доповнення до інгібіторів BRAF (вемурафеніб + кобіметиніб;
  дабрафеніб + траметиніб) і не залежать від статусу мутації MAP2K1.
