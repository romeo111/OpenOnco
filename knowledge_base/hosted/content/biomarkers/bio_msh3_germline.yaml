notes: "MSH3 germline biallelic — drives MSH3-associated polyposis (autosomal recessive). MutSbeta mismatch-repair component; biallelic loss → elevated-microsatellite-alterations-at-selected-tetranucleotide-repeats (EMAST) phenotype rather than classic MSI-H. Adenomatous polyposis + CRC (typically attenuated, later-onset than FAP), with reported duodenal adenomas, gastric, and astrocytomas. Distinct from Lynch syndrome (heterozygous MMR genes). Heterozygotes near population risk. Surveillance under NCCN polyposis schedule. STUB pending two-Co-Lead signoff."
notes_ua: "MSH3 (герміногенний біалельний варіант) — драйвер MSH3-асоційованого поліпозу (аутосомно-рецесивний тип успадкування). MutSbeta — компонент системи репарації неспарених нуклеотидів (MMR); біалельна втрата функції спричиняє EMAST-фенотип (підвищена мікросателітна нестабільність у вибраних тетрануклеотидних повторах) замість класичного MSI-H. Аденоматозний поліпоз + колоректальний рак (КРР), зазвичай атенуйований і з пізнішим дебютом, ніж при FAP; також описані дуоденальні аденоми, рак шлунка та астроцитоми. Відрізняється від синдрому Лінча (гетерозиготні варіанти генів MMR). У гетерозигот ризик близький до популяційного. Нагляд — за схемою NCCN для поліпозних синдромів. STUB pending two-Co-Lead signoff."
ukrainian_review_status: pending_clinical_signoff
