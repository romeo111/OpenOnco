id: BIO-PTEN-GERMLINE
names:
  preferred: "PTEN germline pathogenic variant"
  ukrainian: "PTEN germline патогенний варіант"
  english: "PTEN germline pathogenic variant"
biomarker_type: gene_mutation
mutation_details:
  gene: PTEN
  gene_hugo_id: HGNC:9588
  variant_type: missense_or_truncating
  functional_impact: loss_of_function
specimen_requirements: ["Whole blood or saliva DNA"]
clinical_context: [germline_susceptibility]
