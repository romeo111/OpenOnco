last_reviewed: "2026-05-18"
notes: "PTEN germline — drives PTEN Hamartoma Tumor Syndrome (PHTS), encompassing Cowden syndrome. Cancer spectrum: breast (lifetime ~85%), thyroid (follicular ~35%), endometrial ~28%, RCC ~30%, CRC, melanoma. Non-cancer: macrocephaly, mucocutaneous trichilemmomas, GI hamartomas, Lhermitte-Duclos. NCCN: annual breast MRI from 30, dermatologic + thyroid US + endometrial sampling. STUB pending two-Co-Lead signoff."
notes_ua: "PTEN germline — драйвер синдрому гамартомних пухлин PTEN (PHTS), що охоплює синдром Cowden. Спектр онкоризику: молочна залоза (довічний ризик ~85%), щитоподібна залоза (фолікулярний рак ~35%), ендометрій ~28%, нирковоклітинний рак ~30%, колоректальний рак, меланома. Неонкологічні прояви: макроцефалія, слизово-шкірні трихілемоми, шлунково-кишкові гамартоми, хвороба Лермітта-Дюкло. NCCN: щорічна МРТ молочних залоз від 30 років, дерматологічний огляд + УЗД щитоподібної залози + біопсія ендометрія."
ukrainian_review_status: pending_clinical_signoff
