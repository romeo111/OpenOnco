id: BIO-TP53-CHEK2-COMPOSITE
names:
  preferred: "TP53 + CHEK2 composite germline risk panel"
  ukrainian: "TP53 + CHEK2 — композитна панель ризику зародкової лінії"
  english: "TP53 + CHEK2 composite germline panel"
  synonyms: ["LFS-CHEK2 composite", "p53-pathway germline panel"]
