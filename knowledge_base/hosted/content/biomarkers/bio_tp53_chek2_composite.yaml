notes: >
  Composite-panel concept used for risk-stratification when a multi-gene
  germline panel returns pathogenic variants in BOTH TP53 (Li-Fraumeni
  syndrome) and CHEK2 (moderate-risk breast/CRC predisposition), or to
  reflect joint p53-pathway disruption risk modeling. TP53 dominates the
  composite — Li-Fraumeni penetrance is high (lifetime cancer risk
  ~70-90% by age 70, with sarcoma, breast, brain, adrenocortical, leukemia
  spectrum), so management follows TP53 protocol (Toronto / Chompret /
  modified-Chompret criteria; annual whole-body MRI + breast MRI from
  age 20-25; AVOID ionizing radiation as therapeutic adjuvant whenever
  oncologically feasible). CHEK2 (1100delC most common pathogenic
  variant; carrier frequency ~1% European populations) confers moderate
  breast cancer risk (~2-3x baseline, lifetime ~28-37%) and modest CRC
  risk. Co-occurrence is rare but described — surveillance follows the
  HIGHER-risk gene (TP53 dominates). Counseling note: many panels also
  return CHEK2 variants of uncertain significance; clinical action requires
  ACMG/AMP-classified pathogenic or likely-pathogenic call. Composite
  entry exists to support panel-result aggregation in algorithm logic
  (not a single-variant lookup). STUB pending two-Co-Lead signoff.
notes_ua: >
  Композитний концепт для стратифікації ризику, коли мультигенна панель
  зародкової лінії повертає патогенні варіанти і в TP53 (синдром
  Лі-Фраумені), і в CHEK2 (помірний ризик раку молочної залози/
  колоректального раку), або для відображення спільного ризик-моделювання
  порушення p53-шляху. TP53 домінує в композитній оцінці — пенетрантність
  синдрому Лі-Фраумені висока (довічний ризик раку ~70-90% до 70 років;
  спектр включає саркому, рак молочної залози, пухлини головного мозку,
  адренокортикальну карциному, лейкемію), тому нагляд слідує протоколу
  TP53 (критерії Toronto / Chompret / модифіковані Chompret; щорічна МРТ
  всього тіла + МРТ молочних залоз з 20-25 років; УНИКАТИ іонізуючого
  опромінення як терапевтичного ад'юванта, коли це онкологічно доцільно).
  CHEK2 (1100delC — найпоширеніший патогенний варіант; частота носійства
  ~1% серед європейського населення) надає помірний ризик раку молочної
  залози (~2-3x базового рівня, довічний ~28-37%) та помірний ризик
  колоректального раку. Спільне виявлення рідкісне, але описане — нагляд
  слідує гену з ВИЩИМ ризиком (домінує TP53). Примітка щодо консультування:
  багато панелей також повертають варіанти CHEK2 невизначеного значення;
  клінічна дія вимагає класифікованого за ACMG/AMP патогенного або
  ймовірно патогенного висновку. Композитний запис існує для підтримки
  агрегації результатів панелі в логіці алгоритму (а не пошуку за одним
  варіантом). Заготовка (stub), очікує підпису двох Clinical Co-Lead.
