id: DIS-ATRT
names:
  preferred: "Atypical teratoid/rhabdoid tumor (ATRT)"
  ukrainian: "Атиповий тератоїдний/рабдоїдний пухлина (ATRT)"
  english: "Atypical teratoid/rhabdoid tumor"
  synonyms:
    - "ATRT"
    - "AT/RT"
    - "CNS rhabdoid tumor"
    - "Embryonal CNS tumor with rhabdoid features"
codes:
  icd_o_3_morphology: "9508/3"
  icd_o_3_topography: ["C71"]
  icd_10: "C71.9"
  who_classification: "WHO CNS5 (2021): Atypical teratoid/rhabdoid tumor (ATRT) — molecularly defined by SMARCB1 (INI1) loss OR SMARCA4 (BRG1) loss; subgroups ATRT-TYR, ATRT-SHH, ATRT-MYC"
archetype: stage_driven
oncotree_code: ATRT
lineage: "embryonal_cns_tumor_rhabdoid"
etiological_factors:
  - "Sporadic (~75%) — somatic SMARCB1 biallelic inactivation (most common) or SMARCA4 inactivation"
  - "Rhabdoid tumor predisposition syndrome (RTPS) type 1 (SMARCB1 germline) — ~25-35% of ATRT in young children; familial RTPS confers near-100% RT/MRT/ATRT penetrance in early childhood"
  - "Rhabdoid tumor predisposition syndrome (RTPS) type 2 (SMARCA4 germline) — smaller subset; small-cell carcinoma of ovary hypercalcemic type (SCCOHT) also in this spectrum"
related_diseases:
  - "DIS-MEDULLOBLASTOMA (CNS embryonal tumor differential; was historically grouped pre-WHO CNS5)"
  - "DIS-GLIOMA-LOW-GRADE (CNS tumor; biology + prognosis very different)"
  - "DIS-WILMS (RTPS extracranial malignant rhabdoid tumor / MRT-kidney shares syndrome)"
key_biomarkers: []
epidemiology:
  context: "Rare aggressive pediatric CNS tumor (~1-2% childhood brain tumors). ~0.3 cases/million children/year. Peak age <3 y; ATRT in infants <12 mo carries the worst prognosis. Historical five-year OS ~30-40%; current ATRT-specific intensive regimens (ACNS0333, EU-RHAB) achieve five-year OS ~50-60% in patients age >1 y who tolerate intensive multimodal therapy. ATRT-TYR molecular subgroup has slightly better prognosis."
sources:
  - SRC-NCCN-CNS-2025
last_reviewed: "2026-05-19"
reviewers: []
notes: >
  Aggressive multimodal therapy is the standard: max-safe surgical
  resection + adjuvant intensified chemotherapy + (in patients >3 y
  who tolerate) craniospinal RT. Tazemetostat (EZH2 inhibitor) is
  FDA-approved for relapsed/refractory adult and pediatric INI1-
  negative epithelioid sarcoma + ATRT (limited pediatric data).
  Surveillance for RTPS carriers: brain MRI q3mo from infancy to age
  3-4, then q6mo to age 5; whole-body MRI q3-6mo to age 5 to detect
  extracranial MRT of kidney + soft tissue.
notes_ua: >
  Aggressive multimodal therapy — standard: max-safe surgical resection
  + adjuvant intensified chemotherapy + (у пацієнтів >3 років які
  tolerate) craniospinal RT. Tazemetostat (EZH2 inhibitor) — FDA-
  approved для relapsed/refractory INI1-negative. Surveillance для
  RTPS carriers: brain MRI q3mo з infancy до 3-4 років, q6mo до 5
  років; whole-body MRI q3-6 міс до 5 років.
draft: true
