etiological_factors:
  - "Germline DICER1 syndrome — a substantial fraction (~50-70%) of pediatric cystic nephroma cases carry pathogenic germline DICER1; cystic nephroma diagnosis in any child should trigger DICER1 germline testing"
  - "Beckwith-Wiedemann syndrome (11p15 imprinting) — distinct from DICER1 mechanism but anchor for the abdominal-tumour surveillance protocol shared with Wilms tumour predisposition; abdominal-US + AFP surveillance protocol covers both syndromes"
  - "Sporadic — minority of cases without identifiable germline predisposition"
