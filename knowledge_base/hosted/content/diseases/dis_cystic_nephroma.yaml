key_biomarkers: []
epidemiology:
  context: "Rare pediatric renal lesion — incidence ~1-2 per million children per year. Bimodal age distribution: pediatric peak around 2-3 years (DICER1-associated subset) and a separate adult peak (women 50-60 years, usually not DICER1-driven). Pediatric cystic nephroma is generally benign / borderline (Grade-low); rare cases progress to anaplastic sarcoma of the kidney (ASK), which is a higher-grade malignant entity carrying poorer prognosis. Five-year OS for completely resected pediatric cystic nephroma is essentially equivalent to disease-free population."
sources:
  - SRC-COG
