last_reviewed: "2026-05-20"
reviewers: []
notes: >
  Pediatric cystic nephroma is a strong DICER1-syndrome signal — diagnosis
  in any child should trigger DICER1 germline testing AND cascade-testing
  of parents + siblings. Beckwith-Wiedemann syndrome is a separate (non-
  DICER1) etiology that shares the Wilms-spectrum abdominal-tumour
  surveillance protocol (abdominal US q3-4 months from birth to age 7;
  AFP q2-3 months from birth to age 4 — focused on hepatoblastoma).
  Treatment: maximal safe surgical resection (nephron-sparing partial
  nephrectomy when anatomically feasible; total nephrectomy if not).
  Histopathology after resection is critical — distinguishes pure
  cystic nephroma (benign-borderline, surveillance only) from cystic
  partially differentiated nephroblastoma (Wilms-spectrum, requires
  adjuvant chemo per stage) and from progression to anaplastic sarcoma
  of the kidney (high-grade malignant, requires multimodal therapy).
  Lifelong DICER1-syndrome surveillance for germline-positive survivors:
  chest imaging (PPB risk), abdominal-pelvic US (ovarian, Sertoli-Leydig
  risk in girls), thyroid US, and CNS imaging (pineoblastoma,
  pituitary blastoma risk under age 5).
notes_ua: |
  Педіатрична кістозна нефрома — strong DICER1-синдром сигнал — діагноз
  у будь-якої дитини має ініціювати DICER1 germline-тестування ТА
  cascade-тестування батьків + сиблінгів. Beckwith-Wiedemann синдром —
  окрема (не-DICER1) етіологія, яка ділить Wilms-spectrum abdominal-
  tumour surveillance протокол (УЗД черевної порожнини q3-4 міс від
  народження до 7 років; AFP q2-3 міс від народження до 4 років —
  focused on hepatoblastoma). Лікування: максимально безпечна хірургічна
  резекція (нефрон-зберігаюча часткова нефректомія коли anatomically
  feasible; total nephrectomy якщо ні). Гістопатологія після резекції —
  critical — distinguishes pure cystic nephroma (benign-borderline,
  surveillance only) від cystic partially differentiated nephroblastoma
  (Wilms-spectrum, requires adjuvant chemo per stage) та від прогресії
  до anaplastic sarcoma of the kidney (high-grade malignant). Lifelong
  DICER1-syndrome спостереження для germline-positive survivors:
  chest imaging (PPB risk), abdominal-pelvic US (ovarian, Sertoli-Leydig),
  thyroid US та CNS imaging (pineoblastoma, pituitary blastoma до 5 років).
