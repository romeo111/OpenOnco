  ukrainian: "Кістозна нефрома"
  english: "Cystic nephroma"
  synonyms: ["Pediatric cystic nephroma", "Multilocular cystic nephroma", "DICER1-associated cystic nephroma", "Cystic partially differentiated nephroblastoma (when overlap with Wilms-spectrum considered)"]
