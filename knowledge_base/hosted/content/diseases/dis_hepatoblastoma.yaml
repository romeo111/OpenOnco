id: DIS-HEPATOBLASTOMA
names:
  preferred: "Hepatoblastoma"
  ukrainian: "Гепатобластома"
  english: "Hepatoblastoma"
  synonyms:
    - "Pediatric liver embryonal tumor"
    - "Childhood hepatoblastoma"
    - "Beckwith-Wiedemann-associated hepatoblastoma"
codes:
  icd_o_3_morphology: "8970/3"
  icd_o_3_topography: ["C22.0"]
  icd_10: "C22.2"
  who_classification: "WHO Digestive System Tumours 5th ed (2019): Hepatoblastoma"
archetype: stage_driven
oncotree_code: HB
lineage: "embryonal_tumor"
etiological_factors:
  - "Sporadic (~85%) — somatic CTNNB1 (β-catenin), APC mutations"
  - "Beckwith-Wiedemann syndrome (11p15 imprinting): ~1-2% lifetime hepatoblastoma in BWS carriers; AFP-based surveillance to age 3-4"
  - "Familial adenomatous polyposis (FAP / APC germline) — ~100-fold relative risk hepatoblastoma in childhood; rare absolute"
  - "Trisomy 18 (Edwards syndrome) — modest hepatoblastoma increase"
  - "Low birthweight / prematurity — population-level signal"
related_diseases:
  - "DIS-WILMS (Beckwith-Wiedemann surveillance overlap; abdominal US covers both)"
  - "DIS-HCC (adult primary liver cancer differential; biology distinct)"
key_biomarkers: []
epidemiology:
  context: "Most common primary pediatric liver malignancy (~80% childhood liver cancers). ~1.5 cases/million children/year. Peak age 6 mo-3 y. Five-year OS in PRETEXT I-II resectable disease ~90%; advanced/metastatic with cisplatin-doxorubicin-based regimens (SIOPEL, COG) ~50-70%. Transplant for unresectable centrally-located tumors."
sources:
  - SRC-AASLD-HCC-2023
last_reviewed: "2026-05-19"
reviewers: []
notes: >
  Treatment philosophy combines pre-operative cisplatin-based chemo
  (SIOPEL PLADO / PLATO regimens) + surgical resection or liver
  transplantation. AFP is a key tumor marker — used for diagnosis,
  monitoring response, and surveillance in Beckwith-Wiedemann carriers
  (q3mo AFP from birth to age 3-4). High-risk subset (PRETEXT IV, +V
  involvement, metastatic) receives intensified regimens. Five-year
  EFS approaches ~70-80% across all risk groups in current SIOPEL /
  COG-AHEP cooperatives.
notes_ua: >
  Філософія лікування комбінує pre-operative cisplatin-based ХТ +
  surgical resection або liver transplantation. AFP — ключовий tumor
  marker. У Beckwith-Wiedemann carriers: q3mo AFP з народження до 3-4
  років для surveillance. High-risk subset (PRETEXT IV, метастатичний)
  потребує інтенсифікованих regimens.
draft: true
ukrainian_review_status: pending_clinical_signoff
