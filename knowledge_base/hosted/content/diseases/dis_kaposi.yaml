metadata:
  proposal_status: full
  awaiting_proposal: "TREATMENT-intent pathway authored (v0.3 continuation, independently re-derived and citation-corrected 2026-07-11): ALGO-KAPOSI-1L (1L algorithm routing by disease extent then epidemiologic form) with IND-KAPOSI-1L-AIDS-ART (ART optimization, AIDS-KS, reuses REG-HIV-BIKTARVY), IND-KAPOSI-1L-IATROGENIC-MTOR-CONVERSION (mTOR-inhibitor/sirolimus conversion, iatrogenic KS, new REG-SIROLIMUS-KAPOSI-CONVERSION), IND-KAPOSI-1L-CLASSIC-LOCAL-OBSERVATION (local therapy or observation, classic/endemic KS, no recommended_regimen by design), IND-KAPOSI-1L-VISCERAL-PLD (liposomal doxorubicin, visceral/extensive KS any form, new REG-PLD-KAPOSI), and IND-KAPOSI-2L-VISCERAL-PACLITAXEL (2L paclitaxel after PLD, new REG-PACLITAXEL-KAPOSI, no dose specified — flagged gap). New RF-KAPOSI-VISCERAL-EXTENSIVE-DISEASE gates the extent branch. All new entities are STUB/draft pending two-Clinical-Co-Lead signoff (CHARTER §6.1, dev-mode-exempted). Pre-existing PREVENTION-intent pathway (IND-CHRONIC-HHV8-PREVENTION-*, IND-UNIVERSAL-IMMUNOCOMPROMISED-PREVENTION-*) untouched. Independent safety review (2026-07-11) found and corrected: (1) an invented ACTG/Krown T1 tumor-staging criterion in the RedFlag trigger not supported by the narrative or any cited source — removed; (2) SRC-NCCN-SKIN-2025 mis-cited as evidentiary 'supports' throughout — that source's own KB record documents only basal-cell/squamous-cell skin cancer, never Kaposi sarcoma — downgraded to 'context' or removed depending on load-bearing-ness per file. Remaining open gaps: paclitaxel KS-specific dose/schedule not verified against a primary source (flagged, not invented); no dedicated Kaposi-chemotherapy trial Source cited (none named in the authoring narrative, so none was fabricated); classic/endemic local-therapy modality not formalized as a Regimen/Surgery/RadiationCourse entity; MCD and PEL remain unauthored as separate Disease entities; 2L algorithm not authored."
