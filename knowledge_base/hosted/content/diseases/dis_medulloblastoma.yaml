id: DIS-MEDULLOBLASTOMA
names:
  preferred: "Medulloblastoma"
  ukrainian: "Медулобластома"
  english: "Medulloblastoma"
  synonyms:
    - "PNET of cerebellum (historical term)"
    - "WHO grade IV embryonal CNS tumor"
codes:
  icd_o_3_morphology: "9470/3"
  icd_o_3_topography: ["C71.6"]
  icd_10: "C71.6"
  who_classification: "WHO CNS5 (2021): Medulloblastoma molecularly defined (WNT-activated, SHH-activated TP53-wt / TP53-mutant, non-WNT/non-SHH including Group 3, Group 4); histologically defined (classic, desmoplastic/nodular, MBEN, large cell/anaplastic)"
archetype: stage_driven
oncotree_code: MBL
lineage: "embryonal_cns_tumor"
etiological_factors:
  - "Sporadic majority — somatic alterations in WNT pathway (CTNNB1), SHH pathway (PTCH1, SMO, SUFU, GLI), MYC/MYCN amplification"
  - "Gorlin syndrome (PTCH1 germline) — desmoplastic/nodular MB; childhood-onset; basal cell nevus syndrome"
  - "Turcot syndrome (APC germline + brain tumors) — MB or glioma; FAP variant"
  - "Li-Fraumeni syndrome (TP53 germline) — SHH-activated TP53-mutant MB subtype enriched"
  - "Constitutional mismatch repair deficiency (CMMRD / biallelic MMR) — MB + glioblastoma + lymphoma; pediatric peak age 5-15"
  - "Fanconi anemia (BRCA2, PALB2 biallelic) — MB rare"
related_diseases:
  - "DIS-GLIOMA-LOW-GRADE (CNS tumor differential; biology + age distribution distinct)"
key_biomarkers: []
epidemiology:
  context: "Most common malignant pediatric CNS tumor (~20% childhood brain tumors). ~5 cases/million children/year. Peak age 3-8 y. Five-year OS varies markedly by molecular subgroup: WNT-activated ~95%; SHH-activated TP53-wt ~75-85%; SHH-activated TP53-mutant ~40%; Group 3 (MYC-driven) ~50-60%; Group 4 ~75-80%. Risk-stratified treatment combining max-safe surgical resection + craniospinal RT (age-adjusted) + adjuvant cisplatin/cyclophosphamide/vincristine."
sources:
  - SRC-NCCN-CNS-2025
last_reviewed: "2026-05-19"
reviewers: []
notes: >
  Molecular subgrouping has revolutionized risk stratification. WNT-
  activated MB has the most favorable prognosis and is candidate for
  treatment de-escalation in current SJMB12 / PNET5 protocols. SHH-
  activated TP53-mutant MB is high-risk and may warrant Li-Fraumeni
  workup + radiation avoidance considerations. Group 3 (MYC-amplified)
  is high-risk and intensified regimens are studied. Craniospinal RT
  in young children (<3 y) is generally avoided due to neurocognitive
  late effects — high-dose chemo + autologous stem cell transplant
  used as bridge. Surveillance after treatment: brain + spine MRI
  q3-6 mo years 1-2, q6-12 mo years 3-5, annually thereafter.
notes_ua: >
  Molecular subgrouping революціонізував risk stratification. WNT-
  activated MB має найсприятливіший prognosis. SHH-activated TP53-
  mutant — high-risk + може потребувати LFS workup + radiation
  avoidance considerations. Group 3 (MYC-amplified) — high-risk +
  intensified regimens. У дітей <3 років краніоспинальну RT уникають
  через neurocognitive late effects.
