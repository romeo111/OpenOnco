id: DIS-NEUROBLASTOMA
names:
  preferred: "Neuroblastoma"
  ukrainian: "Нейробластома"
  english: "Neuroblastoma"
  synonyms:
    - "Pediatric peripheral neuroblastic tumor"
    - "Sympathetic-nervous-system embryonal tumor"
codes:
  icd_o_3_morphology: "9500/3"
  icd_o_3_topography: ["C74.9", "C47", "C48"]
  icd_10: "C74.9"
  who_classification: "WHO Endocrine Tumours 5th ed (2022): Neuroblastoma — peripheral neuroblastic tumor of sympathetic-nervous-system origin; INSS + INRG staging; MYCN amplification + ALK alterations are key prognostic + targetable"
archetype: stage_driven
oncotree_code: NBL
lineage: "embryonal_tumor_neural"
etiological_factors:
  - "Sporadic (>98%) — somatic MYCN amplification, ALK mutations, chromosome 1p/11q deletions"
  - "Hereditary neuroblastoma — ALK germline (rare); PHOX2B germline (often co-presenting with Hirschsprung + central hypoventilation)"
  - "Beckwith-Wiedemann syndrome — neuroblastoma small subset"
  - "Costello syndrome (HRAS) — neuroblastoma signal in literature"
  - "Li-Fraumeni syndrome (TP53 germline) — neuroblastoma rare"
related_diseases:
  - "DIS-WILMS (pediatric embryonal-tumor differential)"
  - "DIS-RHABDOMYOSARCOMA (pediatric solid tumor differential)"
key_biomarkers: []
epidemiology:
  context: "Most common extracranial solid tumor in children <5 years (~10% of pediatric cancers). Annual incidence ~10 cases/million children; median age ~17 months. Five-year OS strongly stratified by risk: low-risk (INSS 1, 2, 4S; MYCN non-amplified; favorable histology) ~95%; intermediate-risk ~85-95% with multimodal therapy; high-risk (MYCN-amplified, stage 4 ≥18 mo, unfavorable histology) ~50-65% with intensive induction → consolidation (HD chemo + autoSCT + RT) → maintenance (isotretinoin + anti-GD2 immunotherapy dinutuximab)."
sources:
  - SRC-NCCN-PEDIATRIC-SARCOMA
last_reviewed: "2026-05-20"
reviewers: []
notes: >
  COG + SIOPEN risk-stratified treatment frameworks. Anti-GD2 immuno-
  therapy (dinutuximab + cytokines) is high-risk standard since 2009;
  ch14.18/Naxitamab as alternative. Lorlatinib + crizotinib for ALK-
  mutant subset (cooperative-group trials). MIBG-iodine131 + lutathera
  therapy for MIBG-avid relapsed disease. Surveillance for syndromic
  predisposition carriers: abdominal US + urinary catecholamines q3-6mo
  to age 8 in Costello + Beckwith-Wiedemann.
notes_ua: >
  COG + SIOPEN risk-stratified treatment frameworks. Anti-GD2 immuno-
  therapy (dinutuximab + цитокіни) — high-risk standard з 2009. Lorlatinib
  + crizotinib для ALK-mutant subset. MIBG-iodine131 + lutathera для
  MIBG-avid relapsed disease. Surveillance для syndromic carriers:
  abdominal US + urinary catecholamines q3-6 міс до 8 років у Costello +
  Beckwith-Wiedemann.
