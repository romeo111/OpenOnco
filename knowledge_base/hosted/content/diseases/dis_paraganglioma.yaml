id: DIS-PARAGANGLIOMA
names:
  preferred: "Paraganglioma (PGL)"
  ukrainian: "Парагангліома (PGL)"
  english: "Paraganglioma"
  synonyms:
    - "PGL"
    - "Extra-adrenal paraganglioma"
    - "Head and neck paraganglioma (HNPGL)"
    - "Thoracoabdominal paraganglioma"
    - "Chemodectoma (historical)"
    - "Glomus tumor (historical, head/neck)"
codes:
  icd_o_3_morphology: "8693/1"
  icd_o_3_topography:
    - "C75.4"
    - "C75.5"
    - "C49"
  icd_10: "D44.7"
  who_classification: "WHO Endocrine Tumours 5th ed (2022): Paraganglioma — extra-adrenal counterpart of pheochromocytoma; subtypes by anatomic site (head/neck = parasympathetic, non-secreting; thoracoabdominal = sympathetic, often catecholamine-secreting)"
archetype: stage_driven
oncotree_code: PGNG
lineage: "neuroendocrine_tumor_extra_adrenal"
etiological_factors:
  - "~40% syndromic / germline-driven (highest hereditary fraction of any solid tumor)"
  - "Hereditary Paraganglioma-Pheochromocytoma syndromes: SDHB (PGL4, highest malignancy + abdominal predominant), SDHD (PGL1, paternal-only transmission via imprinting), SDHC (PGL3, head/neck predominant), SDHA (PGL5, lower penetrance), SDHAF2 (PGL2, very rare)"
  - "Von Hippel-Lindau (VHL germline) — adrenal + extra-adrenal pheo/PGL component"
  - "MEN2 (RET germline) — adrenal pheo predominantly; some extra-adrenal"
  - "Neurofibromatosis type 1 (NF1) — pheo/PGL minority of carriers"
  - "Carney triad (gastric GIST + pulmonary chondroma + extra-adrenal PGL; non-Mendelian)"
  - "MAX, TMEM127 (autosomal-dominant pheo/PGL predisposition)"
related_diseases:
  - "DIS-PHEOCHROMOCYTOMA (adrenal counterpart; biology + workup largely overlapping)"
  - "DIS-RCC (VHL spectrum overlap)"
  - "DIS-GIST (Carney triad overlap)"
key_biomarkers: []
epidemiology:
  context: "Rare neuroendocrine tumor (~0.8 cases/million/year). Up to ~40% syndromic — highest hereditary fraction of any solid tumor; multi-gene panel testing recommended for all newly-diagnosed PGL regardless of family history (per Endocrine Society + ENS@T 2020). SDHB-mutant PGL has highest metastatic rate (~30-50% lifetime); SDHD/SDHC/SDHA generally indolent. Surveillance for at-risk carriers per gene-specific schedules (annual MRI + biochemistry for SDHB; less intensive for SDHA/C/D)."
sources:
  - SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
last_reviewed: "2026-05-20"
reviewers: []
notes: >
  Distinct from pheochromocytoma (DIS-PHEOCHROMOCYTOMA) by anatomic site
  (PGL = extra-adrenal). Treatment philosophy: complete surgical
  resection where feasible; malignant/unresectable disease — somatostatin-
  analog (lutathera 177Lu-DOTATATE) per ESMO/ENS@T; tyrosine kinase
  inhibitors (cabozantinib, sunitinib) in clinical trials for SDHx-
  mutant unresectable PGL; 131I-MIBG for MIBG-avid disease (limited
  efficacy in SDHB-mutant). Hereditary testing recommended for ALL
  PGL diagnoses regardless of age or family history.
notes_ua: >
  Відрізняється від pheochromocytoma за анатомічним сайтом (PGL —
  extra-adrenal). Філософія лікування: complete surgical resection
  де feasible; malignant/unresectable — somatostatin-analog (lutathera);
  TKI у clinical trials; 131I-MIBG для MIBG-avid. Hereditary testing
  рекомендовано для ВСІХ PGL diagnoses regardless of age or family
  history.
