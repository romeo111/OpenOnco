lineage: "cns_embryonal"
etiological_factors:
  - "Sporadic — somatic DICER1 hotspot RNase IIIb-domain mutations + germline-confined DICER1 syndrome (DICER1-altered pineoblastoma is one of the most common DICER1-syndrome CNS manifestations)"
  - "Germline DICER1 syndrome — heterozygous truncating DICER1 + somatic second-hit RNase IIIb hotspot is the canonical DICER1 cancer mechanism in pineoblastoma"
  - "Retinoblastoma (RB1) bilateral / trilateral — bilateral retinoblastoma carriers have a small but well-documented risk of pineal-region pineoblastoma (trilateral retinoblastoma); historically grim prognosis though modern surveillance has improved outcomes"
  - "Sporadic non-syndromic — minority of cases without identifiable germline predisposition"
