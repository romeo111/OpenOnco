key_biomarkers: []
epidemiology:
  context: "Rare embryonal CNS tumor — incidence ~0.1 per million children per year; median age at diagnosis ~5-8 years with a broader range (infant to young adult). DICER1-altered subtype tends to present in older children / young adults (median ~12-15y); MYC/FOXR2-activated and RB1-altered subtypes affect younger children. Five-year OS historically 30-60% with multimodal therapy; improving with risk-stratified protocols and DICER1-genotype-aware management."
