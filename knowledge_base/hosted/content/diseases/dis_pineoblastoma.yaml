reviewers: []
notes: >
  Pineoblastoma is one of the canonical embryonal CNS manifestations
  of DICER1 syndrome — diagnosis in any child should trigger DICER1
  germline testing regardless of family history. Distinct from
  pineocytoma (Grade 1, benign) and pineal parenchymal tumour of
  intermediate differentiation (PPTID, Grade 2-3). Treatment philosophy
  parallels other embryonal CNS tumours: maximal safe surgical resection
  (gross total resection is prognostically dominant); craniospinal
  irradiation in age-appropriate patients (deferred under age 3 due to
  neurocognitive toll); adjuvant high-dose chemotherapy regimens (often
  COG/SIOP protocols with carboplatin, vincristine, cyclophosphamide,
  cisplatin, etoposide combinations + autologous stem-cell rescue in
  high-risk cases). Trilateral retinoblastoma (bilateral RB1-carrier
  with pineal pineoblastoma) historically had near-uniform mortality;
  modern MRI surveillance from RB1-carrier diagnosis has shifted some
  cases to earlier detection with improved outcomes.
notes_ua: |
  Пінеобластома — одна з канонічних embryonal CNS манифестацій
  DICER1-синдрому — діагноз у будь-якої дитини має ініціювати
  DICER1 germline-тестування незалежно від родинного анамнезу.
  Відмінна від пінеоцитоми (Grade 1, доброякісна) та pineal
  parenchymal tumour of intermediate differentiation (Grade 2-3).
  Філософія лікування паралельна іншим embryonal CNS пухлинам:
  максимально безпечна хірургічна резекція; краніо-спінальна
  іррадіація у age-appropriate пацієнтів (відкладається до 3 років);
  ад'ювантна high-dose ХТ (часто COG/SIOP протоколи з carboplatin,
  vincristine, cyclophosphamide, cisplatin, etoposide + autologous
  stem-cell rescue у high-risk випадках). Трилатеральна
  retinoblastoma (bilateral RB1-carrier з pineal pineoblastoma)
  історично мала near-uniform mortality; сучасне MRI спостереження
  з моменту RB1-carrier діагнозу зрушило деякі випадки до earlier
  detection з покращеними outcomes.
