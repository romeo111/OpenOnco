id: DIS-PITUITARY-BLASTOMA
names:
  preferred: "Pituitary blastoma"
  ukrainian: "Пітуітарна бластома"
  english: "Pituitary blastoma"
  synonyms: ["DICER1-associated pituitary blastoma", "Infantile pituitary embryonal tumor"]
codes:
  icd_o_3_morphology: "8273/3"
  icd_o_3_topography: ["C75.1"]
  icd_10: "C75.1"
  who_classification: "WHO Endocrine and Neuroendocrine Tumours 5th ed (2022): Pituitary blastoma — rare embryonal sellar / parasellar tumour of infancy, near-uniformly DICER1-driven"
archetype: stage_driven
oncotree_code: PIBL
lineage: "embryonal_tumor"
etiological_factors:
  - "Germline DICER1 syndrome — heterozygous truncating DICER1 + somatic second-hit RNase IIIb hotspot is the canonical mechanism in nearly all reported pituitary blastoma cases (>95%)"
  - "Sporadic DICER1-driven cases without identified germline predisposition are exceptional — pituitary blastoma is one of the strongest single-tumor signals for DICER1 syndrome"
related_diseases:
  - "DIS-PLEUROPULMONARY-BLASTOMA (DICER1 cross-syndrome surveillance — same kindred)"
  - "DIS-PINEOBLASTOMA (DICER1 cross-syndrome surveillance)"
  - "DIS-SERTOLI-LEYDIG-OVARIAN (DICER1 cross-syndrome surveillance)"
  - "DIS-CYSTIC-NEPHROMA (DICER1 cross-syndrome surveillance)"
  - "DIS-PITUITARY-ADENOMA (differential — adenomas are far more common; pituitary blastoma is a distinct embryonal entity of infancy)"
key_biomarkers: []
epidemiology:
  context: "Extremely rare — <50 cases reported in the world literature. Almost exclusively diagnosed under age 24 months (median age ~8-9 months). Cushing-syndrome presentation predominates (ACTH-secreting tumor with hypercortisolism, virilization, dramatic infant weight gain, ophthalmoplegia from optic-chiasm compression). Historically near-uniformly fatal; modern surgical + adjuvant chemotherapy approaches have improved outcomes, but the rarity of cases precludes formal trials — management is per-case with multidisciplinary input."
sources:
  - SRC-COG
  - SRC-NCCN-CNS-2025
last_reviewed: "2026-05-20"
reviewers: []
notes: >
  Pituitary blastoma is the strongest single-tumour DICER1-syndrome
  signal — diagnosis in any infant should immediately trigger DICER1
  germline testing AND cascade-testing of parents (>95% pituitary
  blastomas carry pathogenic germline DICER1). Distinct from far-more-
  common pituitary adenomas (which are not DICER1-driven and are
  typically adult-onset). Treatment: trans-sphenoidal or trans-cranial
  resection (technically challenging in infants — pituitary blastomas
  are bleeding-prone and locally invasive); adjuvant chemotherapy
  (carboplatin-VP16-cyclophosphamide-based regimens reported in case
  series); RT generally avoided under age 3 due to severe neurocognitive
  + endocrine toll. Hypercortisolism management (medical adrenal
  blockade, sometimes adrenalectomy) is an essential pre-operative
  bridge. Lifelong endocrine replacement (hydrocortisone, growth
  hormone, thyroid, gonadal axis) after curative-intent resection.
  Lifelong DICER1-syndrome surveillance for survivors.
notes_ua: |
  Пітуітарна бластома — найсильніший single-tumour DICER1-синдром
  сигнал — діагноз у будь-якого немовляти негайно ініціює DICER1
  germline-тестування ТА cascade-тестування батьків (>95% pituitary
  blastomas несуть pathogenic germline DICER1). Відмінна від набагато
  більш поширених пітуітарних аденом (не DICER1-driven, typically
  adult-onset). Лікування: trans-sphenoidal / trans-cranial резекція
  (технічно складна у немовлят — pituitary blastomas bleeding-prone та
  locally invasive); ад'ювантна ХТ (carboplatin-VP16-cyclophosphamide-
  base); RT generally уникається до 3 років через severe neurocognitive
  + endocrine toll. Hypercortisolism management (medical adrenal
  blockade, іноді adrenalectomy) — essential pre-operative bridge.
  Lifelong endocrine replacement після curative-intent resection.
  Lifelong DICER1-syndrome спостереження для survivors.
