notes: >
  Pleuropulmonary blastoma is the canonical DICER1-syndrome cancer —
  PPB diagnosis in any child should trigger DICER1 germline testing
  AND cascade-testing of parents + siblings. The Type I → Type II →
  Type III progression model is unique among pediatric cancers in
  offering a true surveillance-curable precursor lesion (Type I PPB
  is histologically benign-appearing cystic disease that, if completely
  resected, has excellent prognosis; if left in situ, may progress to
  the higher-mortality Type II/III). Treatment by type: Type I —
  complete surgical resection; close follow-up imaging for new cysts
  or solid transformation. Type II/III — surgical resection (often
  combined lobectomy / pneumonectomy with CNS prophylaxis
  consideration); IVADo (ifosfamide, vincristine, actinomycin-D,
  doxorubicin) or similar sarcoma-style regimens; CNS-directed
  therapy for Type III given high CNS-relapse risk. Distinguishing PPB
  Type I from congenital pulmonary airway malformation (CPAM) — the
  most common pediatric cystic lung lesion — is the major early-life
  diagnostic challenge: family history of DICER1-related malignancies
  + multi-locular or septated cysts argue for PPB over CPAM and should
  prompt referral to an experienced pediatric thoracic surgical center.
notes_ua: |
  Плевропульмональна бластома — канонічний DICER1-синдром рак — діагноз
  PPB у будь-якої дитини має ініціювати DICER1 germline-тестування ТА
  cascade-тестування батьків + сиблінгів. Модель прогресії Type I →
  Type II → Type III унікальна серед педіатричних раків тим, що пропонує
  true surveillance-curable precursor lesion (Type I PPB —
  histologically benign-appearing cystic disease, при повній резекції
  has excellent prognosis; if left in situ — може progress до higher-
  mortality Type II/III). Лікування за типом: Type I — complete surgical
  resection + close follow-up imaging. Type II/III — surgical resection
  (often lobectomy/pneumonectomy + CNS prophylaxis consideration);
  IVADo або similar sarcoma-style регимени; CNS-directed therapy для
  Type III через high CNS-relapse risk. Distinguishing PPB Type I від
  congenital pulmonary airway malformation (CPAM) — найпоширенішого
  pediatric cystic lung lesion — major early-life diagnostic challenge:
  family history DICER1 + multi-locular або septated cysts — argue для
  PPB над CPAM та має prompt referral до experienced pediatric thoracic
  surgical center.
