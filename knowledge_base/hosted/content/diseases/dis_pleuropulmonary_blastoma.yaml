epidemiology:
  context: "Rare — incidence ~0.1-0.2 per million children per year. Median age at diagnosis: Type I ~10 months; Type II ~3-4 years; Type III ~3-5 years (older presentation reflects progression timeline). Five-year OS by type: Type I ~85-90% (good prognosis with complete resection); Type II ~55-65%; Type III ~45-55%. Type II/III metastasize predominantly to CNS, contralateral lung, and bone. DICER1-syndrome surveillance with chest imaging from birth in known-carrier families enables Type I detection at the curable stage."
