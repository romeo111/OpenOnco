etiological_factors:
  - "Germline DICER1 syndrome — the canonical and historically-defining DICER1 cancer; ~70% of PPB cases carry a germline DICER1 pathogenic variant"
  - "Sporadic DICER1-driven (somatic biallelic DICER1) — minority of cases without germline predisposition"
  - "Recognized progression: untreated Type I (purely cystic; sometimes misdiagnosed as congenital pulmonary airway malformation / CPAM) can progress to Type II (mixed cystic-solid) → Type III (purely solid, metastasizing). Early Type I resection prevents Type II/III progression and is the strongest available risk-reduction intervention"
