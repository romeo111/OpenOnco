id: DIS-RHABDOMYOSARCOMA
names:
  preferred: "Rhabdomyosarcoma"
  ukrainian: "Рабдоміосаркома"
  english: "Rhabdomyosarcoma"
  synonyms:
    - "RMS"
    - "Embryonal rhabdomyosarcoma (ERMS)"
    - "Alveolar rhabdomyosarcoma (ARMS)"
    - "Sarcoma of skeletal muscle differentiation"
codes:
  icd_o_3_morphology: "8910/3"
  icd_o_3_topography: ["C49"]
  icd_10: "C49.9"
  who_classification: "WHO Soft Tissue + Bone Tumours 5th ed (2020): Embryonal RMS, alveolar RMS, spindle-cell/sclerosing RMS, pleomorphic RMS (adult)"
archetype: stage_driven
oncotree_code: RMS
lineage: "soft_tissue_sarcoma_pediatric"
etiological_factors:
  - "Sporadic (>90%) — embryonal RMS: heterogeneous somatic alterations (RAS pathway, p53, PI3K). Alveolar RMS: PAX3-FOXO1 or PAX7-FOXO1 fusion (~75%); fusion-negative ARMS biologically more like ERMS"
  - "Li-Fraumeni syndrome (TP53 germline) — embryonal RMS in young children"
  - "Costello syndrome (HRAS germline) — embryonal RMS in adolescents/young adults (~6-15% lifetime)"
  - "Neurofibromatosis type 1 (NF1) — rhabdomyosarcoma rare but reported"
  - "DICER1 syndrome — pleuropulmonary RMS (genitourinary variant)"
  - "Beckwith-Wiedemann syndrome — RMS rare but reported"
related_diseases:
  - "DIS-SOFT-TISSUE-SARCOMA (general STS bucket; RMS biologically distinct embryonal lineage)"
  - "DIS-OSTEOSARCOMA (LFS + Costello overlap; bone vs muscle)"
key_biomarkers: []
epidemiology:
  context: "Most common pediatric soft-tissue sarcoma (~4-5% childhood cancers). ~5 cases/million children/year. Peak age 1-5 y (ERMS) + 10-18 y (ARMS). Five-year OS varies by risk group: low-risk (ERMS, favorable site, stage I-II) ~90%; intermediate-risk (ERMS unfavorable site, ARMS localized) ~60-75%; high-risk (metastatic ARMS, especially with PAX3-FOXO1 fusion) ~30-50%. Treatment: VAC (vincristine-actinomycin-cyclophosphamide) backbone ± additional agents (ifosfamide, irinotecan, etoposide) per COG/EpSSG risk stratification; surgical resection or radiation per primary site + response."
sources:
  - SRC-ESMO-SARCOMA-2024
last_reviewed: "2026-05-19"
reviewers: []
notes: >
  PAX3-FOXO1 fusion status is the strongest single prognostic marker.
  EpSSG (European) and COG (North American) cooperatives study risk-
  adapted regimens. Fusion-positive ARMS now receives intensified
  treatment; fusion-negative ARMS behaves more like ERMS. Surveillance
  in Costello + LFS + DICER1 carriers: abdominal/pelvic US q3-6 mo to
  age 8-10; symptom-driven imaging for soft-tissue mass at any age.
notes_ua: >
  PAX3-FOXO1 fusion status — найсильніший single prognostic marker.
  EpSSG (Європа) і COG (Північна Америка) cooperatives study risk-
  adapted regimens. Surveillance у Costello + LFS + DICER1 carriers:
  abdominal/pelvic US q3-6 міс до 8-10 років; symptom-driven imaging
  для soft-tissue mass at any age.
