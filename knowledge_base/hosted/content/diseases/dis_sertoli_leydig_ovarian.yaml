id: DIS-SERTOLI-LEYDIG-OVARIAN
names:
  preferred: "Sertoli-Leydig cell tumor of the ovary"
  ukrainian: "Сертолі-Лейдиг клітинна пухлина яєчника"
  english: "Sertoli-Leydig cell tumor"
  synonyms: ["SLCT", "Androblastoma of the ovary", "DICER1-associated Sertoli-Leydig cell tumor", "Ovarian sex cord-stromal tumor — Sertoli-Leydig subtype"]
codes:
  icd_o_3_morphology: "8631/1"
  icd_o_3_topography: ["C56"]
  icd_10: "C56"
  who_classification: "WHO Female Genital Tumours 5th ed (2020): Sertoli-Leydig cell tumour of the ovary; grading by Sertoli cell differentiation (well-differentiated → intermediate → poorly differentiated → retiform) with associated prognosis"
archetype: stage_driven
oncotree_code: SLCT
lineage: "sex_cord_stromal"
etiological_factors:
  - "Germline DICER1 syndrome — substantial fraction (~30-60%, higher in younger / poorly-differentiated cases) of ovarian Sertoli-Leydig cell tumors carry pathogenic germline DICER1; SLCT diagnosis in any child / adolescent / young adult should trigger DICER1 germline testing"
  - "Sporadic somatic DICER1 — somatic DICER1 RNase IIIb hotspot mutations in tumor are common even without germline; reinforces DICER1-driven biology across the SLCT spectrum"
  - "Sporadic non-DICER1 — minority of cases, typically older patients with well-differentiated histology"
related_diseases:
  - "DIS-PLEUROPULMONARY-BLASTOMA (DICER1 cross-syndrome surveillance — same kindred)"
  - "DIS-PINEOBLASTOMA (DICER1 cross-syndrome surveillance)"
  - "DIS-CYSTIC-NEPHROMA (DICER1 cross-syndrome surveillance)"
  - "DIS-PITUITARY-BLASTOMA (DICER1 cross-syndrome surveillance)"
  - "DIS-OVARIAN (epithelial ovarian cancer differential; SLCT is sex cord-stromal, distinct biology)"
  - "DIS-GRANULOSA-CELL (sex cord-stromal differential — granulosa cell tumour is the other major sex cord-stromal subtype, but is FOXL2-driven not DICER1-driven)"
key_biomarkers: []
epidemiology:
  context: "Rare ovarian neoplasm — ~0.5% of all ovarian tumors; ~5% of ovarian sex cord-stromal tumors. Median age at diagnosis ~25 years (younger than epithelial ovarian cancer median of ~60); approximately 75% of SLCTs diagnosed before age 30. Frequently presents with virilization / hirsutism / amenorrhea / deepening voice (androgen excess from Leydig-component testosterone secretion) in adolescents and young adult women. Most cases are stage I (confined to ovary) at diagnosis given the prominent endocrine symptoms prompting workup. Five-year OS by stage and grade: well-differentiated stage I ~98%; intermediate-differentiation ~85-90%; poorly-differentiated or retiform variants with extra-ovarian extension drop to 50-70%."
sources:
  - SRC-COG
  - SRC-NCCN-PEDIATRIC-SARCOMA
last_reviewed: "2026-05-20"
reviewers: []
notes: >
  Ovarian Sertoli-Leydig cell tumor in any child / adolescent / young
  adult should trigger DICER1 germline testing — the proportion of
  DICER1-positive cases is high (~30-60%, higher in younger and
  poorly-differentiated cases). Diagnosis in a postmenopausal woman
  has a lower (though non-zero) DICER1-positive yield. Treatment:
  fertility-sparing unilateral salpingo-oophorectomy (USO) with
  staging for stage IA well-differentiated tumors in young women;
  total hysterectomy + bilateral salpingo-oophorectomy (TAH-BSO) for
  postmenopausal patients or high-grade / advanced-stage disease.
  Adjuvant chemotherapy (BEP — bleomycin, etoposide, cisplatin —
  similar to germ-cell tumour regimens) for stage IC and above, or
  poorly-differentiated / retiform variants. Androgen excess
  resolves dramatically post-surgery (virilization symptoms regress
  but voice deepening may be permanent). Lifelong DICER1-syndrome
  surveillance for germline-positive survivors: contralateral ovary
  US q6-12 months (synchronous and metachronous DICER1-driven SLCTs
  reported), chest imaging (PPB risk in survivors' offspring + own
  residual risk), thyroid US, and abdominal-pelvic US.
notes_ua: |
  Сертолі-Лейдиг клітинна пухлина яєчника у будь-якої дитини /
  підлітка / young adult має ініціювати DICER1 germline-тестування —
  частка DICER1-позитивних випадків висока (~30-60%, вища у молодших
  та poorly-differentiated випадках). Лікування: fertility-sparing
  однобічна salpingo-oophorectomy (USO) з staging для stage IA
  well-differentiated пухлин у young women; total hysterectomy +
  білатеральна salpingo-oophorectomy (TAH-BSO) для postmenopausal або
  high-grade / advanced-stage хвороби. Ад'ювантна ХТ (BEP — bleomycin,
  etoposide, cisplatin) для stage IC і вище або poorly-differentiated /
  retiform variants. Androgen excess регресує dramatically після
  хірургії (virilization symptoms regress, але voice deepening може
  бути permanent). Lifelong DICER1-syndrome спостереження для germline-
  positive survivors: contralateral ovary US q6-12 міс, chest imaging,
  thyroid US, abdominal-pelvic US.
