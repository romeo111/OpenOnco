id: DRUG-BLEOMYCIN
names:
  preferred: Bleomycin
  ukrainian: Блеоміцин
  english: Bleomycin
  brand_names:
  - Blenoxane
atc_code: L01DC01
rxnorm_id: '1366'
drug_class: Glycopeptide antitumor antibiotic
mechanism: Generates free radicals causing DNA strand breaks. G2 cell-cycle phase
  active. Lung tissue lacks bleomycin hydrolase → accumulates → pulmonary toxicity.
regulatory_status:
  fda:
    approved: true
  ema:
    approved: true
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: true
    reimbursement_indications:
    - Лімфома Ходжкіна (ABVD)
    - Гермінативно-клітинні пухлини (BEP)
    last_verified: '2026-04-27'
typical_dosing: 'ABVD: 10 USP units/m² IV days 1+15 of 28-day cycle. Cumulative lifetime
  limit ~400 USP units (pulmonary toxicity).'
formulations:
- IV/IM/SC powder 15 / 30 USP-unit vials
absolute_contraindications:
- Severe pre-existing pulmonary disease (DLCO <40%)
- Concomitant brentuximab vedotin (synergistic pulmonary toxicity — HARD CI)
- Hypersensitivity
black_box_warnings:
- Pulmonary fibrosis (cumulative-dose-dependent, often progressive after exposure)
- Anaphylactoid reactions (test dose advised first)
major_interactions:
- 'Brentuximab vedotin: HARD CI (additive lung toxicity)'
- 'G-CSF: a possible pulmonary-toxicity interaction has been reported, but the US
  label states randomized clinical studies have not demonstrated increased pulmonary
  complications. Assess growth-factor use by regimen and patient factors; monitor
  pulmonary symptoms.'
- 'Oxygen during anesthesia: prior bleomycin exposure requires individualized pulmonary-risk
  and oxygenation assessment. Avoid unnecessary hyperoxia while maintaining adequate
  oxygenation; this record does not impose a lifetime high-flow oxygen prohibition.'
common_adverse_events:
- Pulmonary toxicity (pneumonitis, fibrosis)
- Skin reactions (hyperpigmentation, alopecia)
- Mucositis
- Fever after first doses (test dose 1-2 USP units)
serious_adverse_events:
- Bleomycin-induced pulmonary toxicity (BPT — 5-10% on ABVD; mortality ~3%)
- Anaphylactoid reaction
pharmacology:
  half_life: ~3 hours; longer in renal impairment
sources:
- SRC-NCCN-BCELL-2025
last_reviewed: null
review_status: pending_clinical_signoff
notes: 'Replaced in modern Hodgkin 1L by brentuximab vedotin (A+AVD per ECHELON-1)
  due to pulmonary toxicity. NEVER combine with brentuximab (additive lung toxicity).
  G-CSF is not routinely required with ABVD, but may be considered for subsequent
  cycles after treatment delays due to sepsis or other clinical factors; monitor for
  pulmonary toxicity. Pre-treatment PFT (DLCO) baseline + serial monitoring. Communicate
  prior bleomycin exposure to anesthesia. Oxygen and fluid management require individualized
  assessment and adequate oxygenation; no blanket lifetime high-flow oxygen prohibition
  is established here.

  '
notes_ua: 'У сучасній 1-й лінії терапії лімфоми Ходжкіна блеоміцин (bleomycin) замінено
  брентуксимабом ведотином (схема A+AVD за ECHELON-1) через легеневу токсичність.
  НІКОЛИ не комбінувати з брентуксимабом ведотином (адитивна легенева токсичність
  — жорстке протипоказання). G-CSF не потрібний рутинно при ABVD, але його можуть
  розглянути після затримок лікування через сепсис або інші клінічні чинники; потрібен
  моніторинг легеневої токсичності. Передтерапійне обстеження функції легень (PFT
  з визначенням DLCO) як базова оцінка з подальшим серійним моніторингом. Повідомте
  анестезіологу про попередню експозицію до блеоміцину. Кисень і рідини потребують
  індивідуальної оцінки та достатньої оксигенації; цей запис не встановлює пожиттєвої
  заборони високопотокового кисню.

  '
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_14a
draft_revision: 2
clinical_claims:
- claim_id: bleomycin-usp-international-unit-convention
  text: For bleomycin, 1 USP unit equals 1000 International Units under the eviQ convention.
    US product vials are labelled 15 or 30 units of Bleomycin for Injection USP. Confirm
    the formulation and unit system; milligram activity must not be treated as a generic
    mg-by-weight conversion.
  source_ids:
  - SRC-BLEOMYCIN-US-LABEL
  - SRC-EVIQ-TESTICULAR-BEP-320
  - SRC-EVIQ-ABVD-56
  scope: Unit nomenclature and equivalence only; not individualized dosing, schedule
    selection, cumulative-risk elimination or whole-record clinical approval.
  source_locator: US label Description/How supplied; eviQ 320 treatment schedule bleomycin
    equivalence footnote.
- claim_id: abvd-growth-factor-not-routine-not-prohibited
  text: Growth-factor support is not routinely required with ABVD. It may be considered
    after treatment delays due to sepsis or other patient factors, with pulmonary
    monitoring. The US bleomycin label reports a possible interaction but states randomized
    clinical studies have not demonstrated increased pulmonary complications.
  source_ids:
  - SRC-EVIQ-ABVD-56
  - SRC-BLEOMYCIN-US-LABEL
  scope: ABVD growth-factor selection and uncertainty of the pulmonary interaction
    only; no universal requirement, contraindication or reassurance of zero risk.
  source_locator: eviQ 56 v7 growth-factor note and haematological toxicity guidance;
    US bleomycin label Pulmonary adverse reactions.
- claim_id: bleomycin-individualized-perioperative-oxygen
  text: Prior bleomycin exposure warrants communication with anesthesia and individualized
    pulmonary-risk, oxygen and fluid assessment. Label precautions favor lower oxygen
    concentrations, but observational evidence does not establish a universal ceiling
    or lifetime high-flow oxygen ban. Adequate oxygenation remains necessary.
  source_ids:
  - SRC-BLEOMYCIN-US-LABEL
  - SRC-AAKRE-BLEOMYCIN-PERIOPERATIVE-2014
  scope: Perioperative oxygen management only; observational findings do not prove
    absence of pulmonary risk or authorize unrestricted hyperoxia.
  source_locator: US label Pulmonary adverse reactions; Aakre 2014 Results/Discussion.
