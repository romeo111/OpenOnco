clinical_claims:
- claim_id: bleomycin-usp-international-unit-convention
  text: For bleomycin, 1 USP unit equals 1000 International Units under the eviQ convention.
    US product vials are labelled 15 or 30 units of Bleomycin for Injection USP. Confirm the
    formulation and unit system; milligram activity must not be treated as a generic mg-by-weight
    conversion.
  source_ids:
  - SRC-BLEOMYCIN-US-LABEL
  - SRC-EVIQ-TESTICULAR-BEP-320
  - SRC-EVIQ-ABVD-56
  scope: Unit nomenclature and equivalence only; not individualized dosing, schedule selection,
    cumulative-risk elimination or whole-record clinical approval.
  source_locator: US label Description/How supplied; eviQ 320 treatment schedule bleomycin
    equivalence footnote.
- claim_id: abvd-growth-factor-not-routine-not-prohibited
  text: Growth-factor support is not routinely required with ABVD. It may be considered after
    treatment delays due to sepsis or other patient factors, with pulmonary monitoring. The
    US bleomycin label reports a possible interaction but states randomized clinical studies
    have not demonstrated increased pulmonary complications.
  source_ids:
  - SRC-EVIQ-ABVD-56
  - SRC-BLEOMYCIN-US-LABEL
  scope: ABVD growth-factor selection and uncertainty of the pulmonary interaction only; no
    universal requirement, contraindication or reassurance of zero risk.
  source_locator: eviQ 56 v7 growth-factor note and haematological toxicity guidance; US bleomycin
    label Pulmonary adverse reactions.
- claim_id: bleomycin-individualized-perioperative-oxygen
  text: Prior bleomycin exposure warrants communication with anesthesia and individualized
    pulmonary-risk, oxygen and fluid assessment. Label precautions favor lower oxygen concentrations,
    but observational evidence does not establish a universal ceiling or lifetime high-flow
    oxygen ban. Adequate oxygenation remains necessary.
  source_ids:
  - SRC-BLEOMYCIN-US-LABEL
  - SRC-AAKRE-BLEOMYCIN-PERIOPERATIVE-2014
  scope: Perioperative oxygen management only; observational findings do not prove absence
    of pulmonary risk or authorize unrestricted hyperoxia.
  source_locator: US label Pulmonary adverse reactions; Aakre 2014 Results/Discussion.
- claim_id: chl-bleomycin-pulmonary-assessment-context
  text: For classical Hodgkin lymphoma, BSH recommends selective baseline PFTs including DLCO
    when a further decline could be clinically important, and no routine repeated PFTs. Pre-existing
    lung disease requires individual risk assessment rather than a universal DLCO <40% absolute
    contraindication. eviQ ABVD 56 instead recommends baseline assessment and monitoring as
    clinically appropriate; its stopping criterion is DLCO below 30-35% of the pretreatment
    value, not a 25% decline and not percent predicted. New cough or dyspnoea needs prompt
    clinical assessment and chest CT when toxicity is suspected, considering infection and
    pulmonary embolism. PFTs alone do not establish toxicity. These protocol differences must
    not be merged into a universal numeric rule or permission to continue treatment until
    a threshold is reached.
  source_ids:
  - SRC-BSH-CHL-BLEOMYCIN-2025
  - SRC-EVIQ-ABVD-56
  scope: Classical Hodgkin lymphoma pulmonary assessment only; not germ-cell regimen guidance,
    individualized treatment authorization, or whole-record approval.
  source_locator: BSH Table 1 recommendations 1.2, 2.5-2.6 and 4.2-4.5; eviQ 56 v7 Clinical
    information/Pulmonary toxicity and Dose modifications/Pulmonary toxicity.
