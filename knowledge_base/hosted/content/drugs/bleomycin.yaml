id: DRUG-BLEOMYCIN
names:
  preferred: Bleomycin
  ukrainian: Блеоміцин
  english: Bleomycin
  brand_names:
  - Blenoxane
atc_code: L01DC01
rxnorm_id: '1366'
drug_class: Glycopeptide antitumor antibiotic
mechanism: Generates free radicals causing DNA strand breaks. G2 cell-cycle phase active.
  Lung tissue lacks bleomycin hydrolase → accumulates → pulmonary toxicity.
regulatory_status:
  fda:
    approved: true
  ema:
    approved: true
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: true
    reimbursement_indications:
    - Лімфома Ходжкіна (ABVD)
    - Гермінативно-клітинні пухлини (BEP)
    last_verified: '2026-04-27'
typical_dosing: 'ABVD: 10 USP units/m² IV days 1+15 of 28-day cycle. Cumulative lifetime limit
  ~400 USP units (pulmonary toxicity).'
formulations:
- IV/IM/SC powder 15 / 30 USP-unit vials
absolute_contraindications:
- Concomitant brentuximab vedotin (synergistic pulmonary toxicity — HARD CI)
- Hypersensitivity
black_box_warnings:
- Pulmonary fibrosis (cumulative-dose-dependent, often progressive after exposure)
- Anaphylactoid reactions (test dose advised first)
major_interactions:
- 'Brentuximab vedotin: HARD CI (additive lung toxicity)'
- 'G-CSF: a possible pulmonary-toxicity interaction has been reported, but the US label states
  randomized clinical studies have not demonstrated increased pulmonary complications. Assess
  growth-factor use by regimen and patient factors; monitor pulmonary symptoms.'
- 'Oxygen during anesthesia: prior bleomycin exposure requires individualized pulmonary-risk
  and oxygenation assessment. Avoid unnecessary hyperoxia while maintaining adequate oxygenation;
  this record does not impose a lifetime high-flow oxygen prohibition.'
common_adverse_events:
- Pulmonary toxicity (pneumonitis, fibrosis)
- Skin reactions (hyperpigmentation, alopecia)
- Mucositis
- Fever after first doses (test dose 1-2 USP units)
serious_adverse_events:
- Bleomycin-induced pulmonary toxicity (BPT — 5-10% on ABVD; mortality ~3%)
- Anaphylactoid reaction
pharmacology:
  half_life: ~3 hours; longer in renal impairment
sources:
- SRC-NCCN-BCELL-2025
last_reviewed: null
review_status: pending_clinical_signoff
notes: 'Replaced in modern Hodgkin 1L by brentuximab vedotin (A+AVD per ECHELON-1) due to
  pulmonary toxicity. NEVER combine with brentuximab (additive lung toxicity). G-CSF is not
  routinely required with ABVD, but may be considered for subsequent cycles after treatment
  delays due to sepsis or other clinical factors; monitor for pulmonary toxicity. Compromised
  pulmonary function requires extreme caution and individualized assessment. For classical
  Hodgkin lymphoma, baseline PFT/DLCO selection and repeat testing depend on the applicable
  protocol; BSH does not recommend routine repeated PFTs. New respiratory symptoms require
  prompt clinical assessment. Communicate prior bleomycin exposure to anesthesia. Oxygen and
  fluid management require individualized assessment and adequate oxygenation; no blanket
  lifetime high-flow oxygen prohibition is established here.

  '
notes_ua: 'У сучасній 1-й лінії терапії лімфоми Ходжкіна блеоміцин (bleomycin) замінено брентуксимабом
  ведотином (схема A+AVD за ECHELON-1) через легеневу токсичність. НІКОЛИ не комбінувати з
  брентуксимабом ведотином (адитивна легенева токсичність — жорстке протипоказання). G-CSF
  не потрібний рутинно при ABVD, але його можуть розглянути після затримок лікування через
  сепсис або інші клінічні чинники; потрібен моніторинг легеневої токсичності. Порушена функція
  легень потребує особливої обережності та індивідуальної оцінки. При класичній лімфомі Ходжкіна
  базове PFT/DLCO та повторні обстеження залежать від застосовного протоколу; BSH не рекомендує
  рутинно повторювати PFT. Нові респіраторні симптоми потребують швидкої клінічної оцінки.
  Повідомте анестезіологу про попередню експозицію до блеоміцину. Кисень і рідини потребують
  індивідуальної оцінки та достатньої оксигенації; цей запис не встановлює пожиттєвої заборони
  високопотокового кисню.

  '
ukrainian_review_status: pending_clinical_signoff
