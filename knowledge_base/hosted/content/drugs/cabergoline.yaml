id: DRUG-CABERGOLINE
names:
  preferred: "Cabergoline"
  ukrainian: "Каберголін"
  english: "Cabergoline"
  brand_names: ["Dostinex"]
atc_code: G02CB03
rxnorm_id: null
drug_class: "Ergot-derived dopamine D2-receptor agonist"
mechanism: >
  Selective, high-affinity D2-dopamine receptor agonist with a long
  elimination half-life (~65 hours) permitting once- or twice-weekly oral
  dosing. Activates D2 receptors on pituitary lactotroph cells, suppressing
  prolactin synthesis/secretion and inducing lactotroph adenoma shrinkage in
  the majority of prolactinomas. First-line therapy for prolactinoma; superior
  prolactin-normalization rate, tumor-shrinkage rate, and tolerability compared
  with bromocriptine (older, less selective dopamine agonist).

regulatory_status:
  fda: {approved: true}
  ema: {approved: true}
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-07-11"
    notes: >
      Dostinex (каберголін) зареєстровано в Україні (Держреєстр ЛЗ). НСЗУ-
      реімбурсація для пролактиноми не включена до онкопакету 2025; доступ
      переважно out-of-pocket. Наявні генерики каберголіну знижують вартість
      порівняно з оригінальним препаратом.

typical_dosing: >
  Start 0.25 mg PO twice weekly (or 0.5 mg PO once weekly); titrate by
  0.25-0.5 mg/week increments no more often than every 4 weeks according to
  serum prolactin response, to a typical maintenance dose of 0.5-2 mg/week in
  divided doses twice weekly (occasionally higher, up to ~4.5 mg/week, in
  macroprolactinoma resistant to lower doses). Take with food to reduce
  nausea. Confirm exact titration schedule with treating endocrinology team.

key_toxicities:
  - Nausea (dose-related; mitigated by evening/with-food dosing and slow titration)
  - Orthostatic hypotension / dizziness
  - Headache
  - Fatigue / somnolence
  - Impulse-control disorders (compulsive gambling, hypersexuality — reported chiefly at the much higher cumulative doses used in Parkinson disease, but counsel patients at any dose)
  - Cardiac valvulopathy risk (established at high cumulative Parkinson-disease doses; low-dose prolactinoma regimens carry much lower but not proven-zero risk — echocardiographic monitoring per treating endocrinologist if high cumulative dose or long-term use)

