id: DRUG-CAMRELIZUMAB
names:
  preferred: "Camrelizumab"
  ukrainian: "Камрелізумаб"
  english: "Camrelizumab"
  synonyms: ["SHR-1210"]
  brand_names: ["AiRuiKa"]
drug_class: "Anti-PD-1 humanized IgG4 monoclonal antibody (immune checkpoint inhibitor)"
mechanism: >
  Humanized IgG4 monoclonal antibody binding PD-1 on activated T
  cells, blocking PD-1/PD-L1 and PD-1/PD-L2 interactions and
  restoring cytotoxic T-cell antitumor activity. Same general
  anti-PD-1 mechanistic class as pembrolizumab, nivolumab, and
  toripalimab. Studied specifically in recurrent/metastatic
  nasopharyngeal carcinoma (CAPTAIN-1st) combined with gemcitabine +
  cisplatin, as well as in multiple other Chinese-registered
  indications (hepatocellular carcinoma, NSCLC, esophageal SCC,
  classical Hodgkin lymphoma).

regulatory_status:
  fda:
    approved: false
    indications_brief: []
  ema:
    approved: false
  ukraine_registration:
    registered: false
    reimbursed_nszu: false
    reimbursement_indications: []
    notes: "Not registered in Ukraine, EU, or US as of authoring (2026-07) — NMPA (China)-approved only. Access, if needed, would be via clinical trial enrollment or named-patient/compassionate import; to be confirmed by Clinical Co-Lead / access-pathway review."

typical_dosing: >
  Per the CAPTAIN-1st trial protocol: camrelizumab 200 mg IV every 3
  weeks, combined with gemcitabine + cisplatin (GP) for up to 6
  cycles, followed by camrelizumab monotherapy (200 mg IV q3w) until
  disease progression, unacceptable toxicity, or up to 2 years total.
  STUB — dosing drafted from trial-protocol recall; pending Clinical
  Co-Lead confirmation against the primary source.

formulations:
  - "IV solution, single-dose vial (per NMPA-approved presentation)"

absolute_contraindications:
  - "Severe hypersensitivity to camrelizumab or excipients"

black_box_warnings: []

common_adverse_events:
  - "Reactive cutaneous capillary endothelial proliferation (RCCEP) — a camrelizumab-class-characteristic benign vascular skin/mucosal reaction, reported in a majority of patients in Chinese trials; usually self-limited"
  - "Fatigue"
  - "Hypothyroidism / thyroid dysfunction"
  - "Elevated liver transaminases"
  - "Rash / pruritus"
  - "Anemia (class effect, more attributable to concurrent GP backbone)"

serious_adverse_events:
  - "Immune-mediated pneumonitis"
  - "Immune-mediated colitis"
  - "Immune-mediated hepatitis"
  - "Immune-mediated endocrinopathies (thyroiditis, hypophysitis, adrenal insufficiency, type 1 diabetes)"
  - "Immune-mediated nephritis"
  - "Severe RCCEP / vascular proliferative lesions (rare)"
  - "Infusion-related reactions (severe, rare)"

major_interactions:
  - "Concurrent non-physiologic-dose systemic corticosteroids / immunosuppressants — may attenuate efficacy (avoid except for irAE management)"
  - "Live vaccines — avoid"

sources:
  - SRC-CAPTAIN-1ST-YANG-2021

last_reviewed: "2026-07-11"
reviewers: []
notes: >
  STUB — draft entity pending Clinical Co-Lead sign-off (CHARTER §6.1;
  currently dev-mode-exempted). Anti-PD-1 backbone alternative for NPC
  metastatic 1L combination per CAPTAIN-1st (Yang Y et al., Lancet
  Oncol 2021): camrelizumab + gemcitabine + cisplatin significantly
  improved PFS vs chemo alone in treatment-naive recurrent/metastatic
  NPC. NOT FDA-approved (China/NMPA-approved only) — distinguishes it
  from toripalimab (DRUG-TORIPALIMAB), the FDA-approved alternative for
  the identical clinical scenario. Reuse this entity rather than
  duplicate. RCCEP is a genuinely distinctive camrelizumab-class AE not
  shared with pembrolizumab/nivolumab/toripalimab — worth flagging for
  patient counseling.
notes_ua: >
  ЗАГОТОВКА — чернетковий запис, очікує підпису клінічного ко-лідера
  (CHARTER §6.1; наразі звільнено в dev-режимі). Альтернативна анти-PD-1
  основа для метастатичної 1L комбінації NPC за дослідженням CAPTAIN-1st
  (Yang Y та співавт., Lancet Oncol 2021): камрелізумаб + гемцитабін +
  цисплатин значуще покращили ВБП порівняно з хіміотерапією окремо.
  НЕ схвалений FDA (лише NMPA/Китай) — на відміну від торипалімабу
  (DRUG-TORIPALIMAB). RCCEP (реактивна проліферація ендотелію капілярів
  шкіри) — характерна для класу камрелізумабу побічна дія, відсутня у
  пембролізумабу/ніволумабу/торипалімабу.
ukrainian_review_status: pending_clinical_signoff
