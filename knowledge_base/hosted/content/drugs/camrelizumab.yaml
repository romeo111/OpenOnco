notes_patient: >
  Імунотерапія, що знімає "гальма" з власних Т-клітин, дозволяючи їм
  атакувати пухлину. Вводиться внутрішньовенно кожні 3 тижні разом із
  хіміотерапією. Може спричиняти незвичні, зазвичай доброякісні,
  судинні висипання на шкірі.
