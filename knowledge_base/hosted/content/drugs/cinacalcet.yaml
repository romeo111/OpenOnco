id: DRUG-CINACALCET
names:
  preferred: "Cinacalcet"
  ukrainian: "Цинакалцет"
  english: "Cinacalcet"
  brand_names: ["Sensipar", "Mimpara"]
atc_code: H05BX01
rxnorm_id: null
drug_class: "Calcimimetic (calcium-sensing receptor allosteric agonist)"
mechanism: >
  Allosterically increases the sensitivity of the parathyroid
  calcium-sensing receptor (CaSR) to extracellular calcium, suppressing
  PTH secretion and lowering serum calcium. Acts on the biochemical
  consequence of the disease (PTH-driven hypercalcemia) rather than the
  tumor itself — no direct antitumor / cytotoxic effect.

regulatory_status:
  fda:
    approved: true
    indications_brief:
      - "Hypercalcemia in patients with parathyroid carcinoma"
      - "Secondary hyperparathyroidism in adults with chronic kidney disease on dialysis"
      - "Severe hypercalcemia in adults with primary hyperparathyroidism who are unable to undergo parathyroidectomy"
  ema:
    approved: true
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-07-11"
    notes: >
      Ukraine registration/reimbursement status not independently
      verified for this draft — [VERIFY via Державний реєстр
      лікарських засобів]. Cinacalcet (originator Sensipar/Mimpara;
      generics exist internationally) is FDA/EMA-approved; access for
      the parathyroid-carcinoma indication specifically is likely
      limited/out-of-pocket or compassionate-use given the rarity of
      the disease.

typical_dosing: >
  Initiate 30 mg PO BID. Titrate no more frequently than every 2-4 weeks
  through sequential doses of 30 mg BID → 60 mg BID → 90 mg BID → 90 mg
  TID → 90 mg QID (maximum labeled dose) to normalize serum calcium.
  Take with food (improves bioavailability). Check serum calcium within
  1 week of initiation or any dose change. FDA-approved specifically
  for hypercalcemia of parathyroid carcinoma (also approved for
  secondary hyperparathyroidism in dialysis-dependent CKD and severe
  hypercalcemia in primary hyperparathyroidism when parathyroidectomy
  is not appropriate).

formulations:
  - "Oral tablet 30 mg / 60 mg / 90 mg"

absolute_contraindications:
  - "Hypocalcemia (serum calcium below the normal range) at baseline"
  - "Hypersensitivity to cinacalcet"

black_box_warnings: []

common_adverse_events:
  - "Nausea (~30%)"
  - "Vomiting (~27%)"
  - "Diarrhea"
  - "Myalgia"
  - "Dizziness"
  - "Headache"

serious_adverse_events:
  - "Hypocalcemia (dose-dependent; can be severe — requires calcium monitoring with dose titration or interruption)"
  - "Seizures (reported in the setting of severe hypocalcemia)"
  - "QT prolongation (secondary to hypocalcemia)"
  - "Adynamic bone disease if PTH is oversuppressed (described in the CKD-dialysis population)"
  - "Hypersensitivity reactions (rare)"

major_interactions:
  - "Strong CYP3A4 inhibitors (ketoconazole, itraconazole, clarithromycin, ritonavir) — increase cinacalcet exposure; dose reduction may be needed"
  - "CYP2D6 substrates with a narrow therapeutic index (e.g. flecainide, tricyclic antidepressants) — cinacalcet is a strong CYP2D6 inhibitor and may raise their levels"
  - "Other calcium-lowering agents (bisphosphonates, denosumab) — additive hypocalcemia risk; monitor serum calcium closely when combined"

pharmacology:
  half_life_hours: "30-40"
  metabolism: "Hepatic — primarily CYP3A4, CYP2D6, CYP1A2"

sources:
  - SRC-NCCN-THYROID-2025

last_reviewed: "2026-07-11"
reviewers: []
notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1 — dev-mode-
  exempted draft content, not published/verified clinical advice).
  Cinacalcet is the only FDA-approved medical therapy specifically
  labeled for hypercalcemia of parathyroid carcinoma. It has no
  cytostatic/cytotoxic effect on the tumor — it controls the
  biochemical consequence (PTH-driven hypercalcemia) in unresectable,
  recurrent, or metastatic disease. Distinct from bisphosphonates
  (DRUG-ZOLEDRONATE) / denosumab (DRUG-DENOSUMAB) — already in the KB —
  which act on osteoclast-mediated bone turnover to prevent
  skeletal-related events from bone metastases rather than suppressing
  PTH secretion; the two mechanisms are complementary and may be used
  concurrently in refractory hypercalcemia, per the parent Disease
  entity's narrative (DIS-PARATHYROID-CARCINOMA).
notes_ua: >
  СТАБ — очікує підпису клінічного співкерівника (CHARTER §6.1,
  dev-mode-exempted чернетка). Цинакалцет — єдиний FDA-схвалений
  медикаментозний засіб, спеціально показаний при гіперкальціємії
  внаслідок карциноми паращитоподібної залози; прямого протипухлинного
  ефекту не має.
