id: DRUG-DOXAZOSIN
names:
  preferred: "Doxazosin"
  ukrainian: "Доксазозин"
  english: "Doxazosin"
  brand_names: ["Cardura"]
  synonyms: ["selective alpha-1 blocker"]
atc_code: C02CA04
rxnorm_id: null
drug_class: "Selective, competitive alpha-1 adrenergic receptor antagonist"
mechanism: >
  Selectively and reversibly blocks post-synaptic alpha-1 adrenergic
  receptors, reducing catecholamine-mediated peripheral vasoconstriction
  with less reflex tachycardia than non-selective irreversible agents
  (phenoxybenzamine) because alpha-2 presynaptic auto-inhibition of
  norepinephrine release is preserved. Used as an alternative
  preoperative alpha-blocker in pheochromocytoma / paraganglioma (PPGL)
  where mandatory preoperative alpha-blockade is required before surgery
  to prevent intraoperative hypertensive crisis (Endocrine Society 2014
  PPGL guideline).
regulatory_status:
  fda: {approved: true}
  ema: {approved: true}
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-07-11"
    notes: >
      Doxazosin (Cardura and generics) is a widely available generic
      antihypertensive with broad registration across most national
      markets, including Ukraine; exact registry number not verified in
      this session. Far more widely stocked than phenoxybenzamine,
      making it the practical default alpha-blocker in many centers.
typical_dosing: >
  Starting dose typically 1-2 mg PO once daily, titrated upward every
  few days as tolerated toward blood-pressure normalization and symptom
  control ahead of PPGL surgery, per Endocrine Society 2014 PPGL
  guideline (SRC-ENDOCRINE-SOCIETY-PPGL-2014); usual ceiling in general
  antihypertensive use is 16 mg/day, though the dose actually required
  for adequate preoperative PPGL blockade is individualized by the
  treating team. Usual preoperative course runs roughly one to two weeks
  before surgery. Exact target BP/HR thresholds are NOT fixed numeric
  values in this stub -- see RF-PHEO-INADEQUATE-ALPHA-BLOCKADE for the
  hard sequencing gate this drug exists to satisfy.
formulations:
  - "1 mg, 2 mg, 4 mg, 8 mg oral tablet"
absolute_contraindications: []
black_box_warnings: []
major_interactions:
  - "Concurrent beta-blockade before adequate alpha-blockade is established -- unopposed alpha-stimulation can precipitate hypertensive crisis; beta-blockers should only be added AFTER alpha-blockade is underway"
  - "PDE5 inhibitors (sildenafil, tadalafil) -- additive hypotension"
  - "Other antihypertensives -- additive hypotensive/orthostatic effect"
common_adverse_events:
  - "Orthostatic hypotension, especially first-dose effect"
  - "Dizziness"
  - "Headache"
  - "Fatigue"
  - "Nasal congestion"
serious_adverse_events:
  - "First-dose syncope"
  - "Severe orthostatic hypotension"
sources:
  - SRC-ENDOCRINE-SOCIETY-PPGL-2014
  - SRC-NCCN-NET-2025
last_reviewed: "2026-07-11"
notes: >
  Selective alpha-1 blockade gives less reflex tachycardia and easier
  general availability than phenoxybenzamine (DRUG-PHENOXYBENZAMINE),
  making doxazosin a commonly used practical alternative for mandatory
  preoperative PPGL alpha-blockade; choice between the two is per local
  practice/availability, not modelled as a KB-level preference. STUB
  pending clinical co-lead signoff (CHARTER §6.1, dev-mode-exempted).
