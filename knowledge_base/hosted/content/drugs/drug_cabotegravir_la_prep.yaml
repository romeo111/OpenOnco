id: DRUG-CABOTEGRAVIR-LA-PREP
names:
  preferred: "Cabotegravir long-acting (HIV pre-exposure prophylaxis)"
  ukrainian: "Каботегравір тривалої дії (PrEP — преекспозиційна профілактика ВІЛ)"
  english: "Cabotegravir long-acting (HIV PrEP)"
  synonyms:
    - "CAB-LA"
    - "Apretude"
    - "Long-acting cabotegravir for PrEP"
  brand_names:
    - "Apretude"
atc_code: J05AJ04
rxnorm_id: "2589006"
drug_class: "HIV-1 integrase strand transfer inhibitor (INSTI) — long-acting injectable for PrEP"
mechanism: >
  Second-generation HIV-1 integrase strand-transfer inhibitor (INSTI)
  formulated as a long-acting injectable nanosuspension. Blocks
  integration of viral DNA into the host chromosome — same INSTI mechanism
  as dolutegravir and bictegravir, with similar high barrier to
  resistance. Sustained-release IM depot provides therapeutic plasma
  cabotegravir for ~2-3 months per dose. As HIV-1 PRE-EXPOSURE
  PROPHYLAXIS in HIV-negative adults at substantial risk, CAB-LA reduces
  sexual HIV acquisition by ~69% vs daily oral FTC/TDF in HPTN 083
  (cisgender MSM / transgender women) and by ~89% in HPTN 084 (cisgender
  women at risk in sub-Saharan Africa) — superior efficacy to oral PrEP,
  driven by improved adherence over daily pills. Cancer-prevention
  pathway: preventing incident HIV infection prevents downstream AIDS-
  defining malignancies (Kaposi sarcoma, NHL incl. PCNSL, invasive
  cervical cancer) and HPV-related / hepatitis-related cancers driven by
  HIV-induced immunosuppression.

regulatory_status:
  fda:
    approved: true
    year_first_approval: 2021  # PrEP indication (Apretude)
    indications_brief:
      - "HIV-1 pre-exposure prophylaxis in HIV-negative adults and adolescents weighing ≥35 kg at risk of sexually-acquired HIV infection"
      - "FDA 2023 label update: REMOVED oral lead-in requirement — direct IM injection acceptable (per HPTN data + real-world experience)"
      - "Cabotegravir + rilpivirine LA (Cabenuva) is a separate HIV-treatment-only product"
      - "Cancer-prevention pathway: preventing HIV infection prevents AIDS-defining and several non-AIDS-defining cancers"
  ema:
    approved: true
    year_first_approval: 2023
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-18"
    notes: "Apretude (каботегравір LA для PrEP) в Україні станом на 2026-05 — НЕ зареєстрований офіційно як PrEP-агент; обмежений доступ через міжнародні донорські програми (Global Fund pilots) у певних центрах СНІДу. Перевірено drlz.com.ua + дані ЦГЗ МОЗ України 2026-05-18. Двигун має направляти пацієнтів до спеціалізованих програм для ключових груп, а не очікувати аптечної доступності."
typical_dosing: >
  Adult / adolescent (≥35 kg) PrEP:
    Loading: 600 mg IM in gluteal muscle on month 0 and month 1
    (~4 weeks apart).
    Maintenance: 600 mg IM in gluteal muscle every 2 months (8 weeks).
  Optional oral lead-in (HISTORICAL — REMOVED from FDA label 2023):
    Cabotegravir 30 mg PO once daily × 4 weeks before first injection
    to confirm tolerability. Per FDA 2023 label update and HPTN data,
    this oral lead-in is NO LONGER REQUIRED — direct IM injection is
    now standard.
  Missed dose:
    ≤7 days late: next 2-monthly injection on schedule, no make-up.
    >7 days late, ≤2 months since last dose: give injection ASAP +
      resume schedule.
    >2 months since last dose: consider switching to oral PrEP bridge
      (FTC/TDF) or restart loading regimen per clinician judgment.
  REQUIRED BEFORE / DURING USE: confirmed HIV-negative status (4th-gen
  Ag/Ab + HIV-1 RNA recommended; CAB-LA can mask acute infection due to
  partial activity → HIV-1 RNA testing every 2 months is preferred);
  STI screen baseline + every 3-6 months; hepatitis serologies baseline.
  Renal / hepatic: no adjustment in mild-moderate; severe — limited data.
formulations:
  - "Pre-filled syringe 200 mg/mL × 3 mL (600 mg per dose) — IM gluteal injection"

absolute_contraindications:
  - "Documented HIV-positive status (PrEP dosing alone in HIV+ person rapidly selects INSTI resistance mutations)"
  - "Hypersensitivity to cabotegravir"
  - "Concurrent use with rifampin, rifapentine, carbamazepine, oxcarbazepine, phenytoin, phenobarbital (substantial cabotegravir exposure reduction → PrEP failure)"
black_box_warnings:
  - "Risk of HIV-1 resistance in HIV-positive individuals using PrEP dose — confirm HIV-negative status (with HIV-1 RNA test, not just Ag/Ab) at every injection"
major_interactions:
  - "Rifampin, rifapentine: CONTRAINDICATED — UGT1A1 induction substantially reduces cabotegravir exposure"
  - "Carbamazepine, phenytoin, phenobarbital, oxcarbazepine: contraindicated or avoid"
  - "Polyvalent cation supplements (Ca, Fe, Mg, Zn): no clinically relevant interaction with IM CAB-LA (chelation issue is oral cabotegravir only)"
  - "Hormonal contraceptives: no clinically relevant interaction"
common_adverse_events:
  - "Injection-site reactions — very common (~80% of injections); pain, swelling, nodule, erythema, induration; typically mild-moderate and self-limited ≤7 days"
  - "Pyrexia (≥38°C, transient) — ~7-9%"
  - "Headache — ~6%"
  - "Fatigue — ~5%"
  - "Diarrhea — ~5%"
  - "Nausea — ~3-5%"
  - "Sleep disorders — ~3-5%"
serious_adverse_events:
  - "Severe injection-site reaction (rare; granuloma, sterile abscess)"
  - "Hepatotoxicity (rare)"
  - "Hypersensitivity reactions / DRESS / SJS (very rare)"
  - "Depression and suicidal ideation (INSTI class signal; small absolute risk)"
  - "HIV resistance if unrecognized HIV+ at initiation (INSTI mutations)"
  - "Long pharmacological 'tail' (~12 months below therapeutic level) after discontinuation — must bridge with daily oral PrEP if continued risk after stopping injections"

pharmacology:
  half_life_hours: 1224  # ~51 days IM (depot release); ~40 h oral
  clearance: "Hepatic UGT1A1 glucuronidation (primary); UGT1A9 minor; ~27% renal excretion of unchanged drug; minimal CYP metabolism"
  protein_binding_pct: 99
  metabolism: "UGT1A1 / UGT1A9 glucuronidation; minimal CYP involvement; not a significant inducer/inhibitor of major CYP/UGT pathways"

sources:
  - SRC-NIH-AIDS-2024

last_reviewed: "2026-05-18"
reviewer_signoffs: []
notes: >
  STUB — v0.2 prevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. APRETUDE (CAB-LA
  for PrEP) is the first long-acting injectable HIV pre-exposure
  prophylaxis option (FDA 2021). Bimonthly gluteal IM injection; per
  FDA 2023 label update, no oral lead-in required. SUPERIOR to oral
  FTC/TDF PrEP in head-to-head trials (HPTN 083: ~69% lower HIV
  incidence among MSM/TGW; HPTN 084: ~89% lower among cisgender African
  women) — driven by adherence advantage. Cancer-prevention rationale:
  preventing HIV acquisition prevents downstream AIDS-defining cancers
  (Kaposi sarcoma, NHL incl. PCNSL and Burkitt, invasive cervical
  cancer) and several non-AIDS-defining cancers (HPV-driven anal,
  oropharyngeal, hepatocellular, Hodgkin lymphoma). KEY CLINICAL
  CAVEATS: (1) long pharmacological tail (~12 months below therapeutic
  level after last injection) — patients who discontinue continued
  risk must bridge with daily oral FTC/TDF or FTC/TAF PrEP to avoid
  exposure during waning levels; (2) HIV-1 RNA testing (not just
  4th-gen Ag/Ab) every 2 months to detect breakthrough infection
  before INSTI resistance develops; (3) NOT for HBV — patients with
  HBV should have separate HBV-suppression plan since CAB-LA has no
  HBV activity. Ukraine: not registered for PrEP as of 2026-05;
  available only via pilot international-donor programs.

notes_ua: >
  Apretude (каботегравір LA для PrEP) — перша довгодіюча ін'єкційна
  опція для преекспозиційної профілактики ВІЛ (FDA 2021). Ін'єкція в
  сідничний м'яз кожні 2 місяці (8 тижнів); після FDA-оновлення 2023
  оральний lead-in більше НЕ потрібен. У дослідженнях HPTN 083 (MSM/
  трансгендерні жінки) — на ~69% нижча захворюваність ВІЛ порівняно з
  щоденним пероральним FTC/TDF; HPTN 084 (цисгендерні жінки в Африці)
  — на ~89% нижча. Перевага зумовлена кращою прихильністю порівняно з
  щоденними таблетками. КЛЮЧОВІ ОБМЕЖЕННЯ: (1) довгий "хвіст"
  концентрації (~12 місяців субтерапевтичні рівні) після останньої
  ін'єкції — пацієнти при продовжуваному ризику повинні переходити на
  щоденний пероральний PrEP (FTC/TDF або FTC/TAF) щоб уникнути впливу
  під час знижених рівнів; (2) ТЕСТУВАННЯ HIV-1 RNA (не лише
  Ag/Ab 4-го покоління) кожні 2 місяці для виявлення проривної інфекції
  до розвитку INSTI-резистентності; (3) НЕ для HBV — пацієнти з HBV
  потребують окремого плану. В Україні станом на 2026-05: НЕ
  зареєстрований для PrEP; обмежений доступ через пілотні програми
  міжнародних донорів (Global Fund / PEPFAR) у центрах СНІДу.
