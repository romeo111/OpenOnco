id: DRUG-CERVARIX-HPV-BIVALENT
names:
  preferred: "Bivalent HPV vaccine (HPV 16/18)"
  ukrainian: "Бівалентна вакцина проти ВПЛ (типи 16/18)"
  english: "Human papillomavirus (HPV) bivalent vaccine, recombinant"
  synonyms:
    - "HPV2"
    - "Cervarix"
    - "Bivalent HPV vaccine"
    - "2vHPV"
  brand_names:
    - "Cervarix"
atc_code: J07BM02
rxnorm_id: null  # Vaccines tracked by NDC + CVX, not RxNorm
drug_class: "Recombinant subunit vaccine (virus-like particles, L1 protein) — prophylactic against HPV 16/18"
mechanism: >
  Recombinant non-infectious bivalent HPV vaccine. Each dose contains
  virus-like particles (VLPs) assembled from the L1 major capsid protein
  of two HPV types — 16 and 18 — produced in a baculovirus expression
  system in Trichoplusia ni insect cells (Hi-5) and adjuvanted with
  AS04 (3-O-desacyl-4'-monophosphoryl lipid A on aluminium hydroxide),
  a TLR4 agonist designed to enhance and prolong the antibody response.
  L1 VLPs contain no viral DNA — cannot cause HPV infection. Vaccination
  elicits high-titer neutralizing IgG against HPV 16 and 18; cross-
  neutralization against types 31, 33, 45, 58 is documented (modest
  efficacy, lower than direct protection). Cancer-prevention pathway:
  prevents persistent infection with HPV 16 and 18 — responsible for
  ~70% of cervical cancers, ~80% of anal cancers, ~85% of HPV-related
  oropharyngeal cancers globally. Does NOT cover HPV 6/11 (genital warts)
  or the additional five high-risk types (31, 33, 45, 52, 58) covered by
  Gardasil-9.

regulatory_status:
  fda:
    approved: true
    year_first_approval: 2009  # FDA approval; FDA withdrawn from US market 2016 due to commercial reasons
    indications_brief:
      - "Prevention of cervical, vulvar, vaginal, and anal precancers and cancers caused by HPV types 16 and 18 in females 9 through 25 years (historical FDA labeling)"
      - "Prevention of persistent infection, CIN 1+ caused by HPV 16/18"
      - "NOT FDA-licensed in US after 2016 (manufacturer withdrew; Gardasil-9 replaced it)"
      - "Still available in many ex-US markets where Gardasil-9 is not the dominant offering"
  ema:
    approved: true
    year_first_approval: 2007
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-18"
    notes: "Cervarix в Україні — обмежена реєстрація / маркетинговий статус станом на 2026-05; Gardasil-9 — основна доступна HPV-вакцина в Україні (приватні центри, з кишені пацієнта). НЕ покривається НСЗУ. У більшості сценаріїв двигун має пропонувати Gardasil-9; Cervarix — лише як альтернатива при недоступності 9-валентної вакцини. Перевірено drlz.com.ua + дані МОЗ 2026-05-18."
typical_dosing: >
  Standard 3-dose schedule (FDA / EMA historical labeling, age 9-25 F):
    0, 1, 6 months. Each dose 0.5 mL IM in deltoid (preferred).
  WHO position 2017+: 2-dose schedule (0 and 6-12 months) acceptable
    for girls <15 y who are immunocompetent (single-dose alternative
    schedule under continued study in WHO/IARC SAGE 2022+).
  Catch-up: complete the 3-dose series in those who started but did not
    complete; do not restart if interrupted. Hepatic / renal impairment:
    no dose adjustment. Pregnancy: avoid initiating series in pregnancy
    (insufficient data, not a known teratogen); complete after delivery.
    Lactation: compatible.
formulations:
  - "Pre-filled syringe 0.5 mL (single dose, AS04 adjuvant)"
  - "Single-dose vial 0.5 mL"

absolute_contraindications:
  - "Severe hypersensitivity (anaphylaxis) to any component of the vaccine"
  - "Severe acute illness with fever — defer until resolved (mild illness is NOT a contraindication)"
black_box_warnings: []
major_interactions:
  - "Immunosuppressive therapy (corticosteroids ≥20 mg prednisone-equivalent ≥14 days, chemotherapy, anti-CD20 monoclonals, calcineurin inhibitors, JAK inhibitors, biologic DMARDs): reduced immunogenicity — administer ≥2 weeks before scheduled immunosuppression where possible"
  - "Other inactivated vaccines: may be co-administered at separate anatomic sites (per ACIP / CDC schedule)"
  - "Live vaccines: no contraindication (Cervarix is non-live recombinant)"
  - "Anticoagulants / bleeding disorders: use 23-25 gauge needle, apply firm pressure — no contraindication"
common_adverse_events:
  - "Injection-site pain — very common (~90%)"
  - "Injection-site erythema / swelling — common (~25-50%; higher with AS04 adjuvant than aluminium-alone vaccines)"
  - "Fatigue — common (~50-60%)"
  - "Headache — common (~50%)"
  - "Myalgia — common (~45%)"
  - "Arthralgia — common (~20%)"
  - "GI symptoms (nausea, diarrhea) — common (~25%)"
  - "Pyrexia (≥38°C) — common (~10-15%, transient)"
  - "Syncope (especially adolescents — vasovagal at injection) — uncommon (~1%; observe 15 min post-dose)"
serious_adverse_events:
  - "Anaphylaxis — very rare (~1-3 per million doses)"
  - "Syncope with secondary injury (typically vasovagal in adolescent recipients) — uncommon; require 15-min post-dose observation"
  - "Severe injection-site reaction — rare"
  - "Guillain-Barré syndrome (causal association NOT established; passive-surveillance signal only)"
  - "Idiopathic thrombocytopenia (rare)"
  - "Postural orthostatic tachycardia syndrome (POTS) — investigated, no confirmed causal link"
  - "Complex regional pain syndrome (CRPS) — investigated, no confirmed causal link"

pharmacology: null  # vaccines characterized by immunogenicity, not PK; see immunogenicity block

immunogenicity:
  seroconversion_rate_pct: 99  # ≥99% seroconversion for HPV 16 and 18 after full series; cross-neutralization for 31/33/45/58 lower
  duration_of_protection: "≥10 years observational follow-up with no waning of anti-HPV 16/18 IgG; modeled lifetime protection; cross-protection durability less certain"
  correlate_of_protection: "Anti-HPV 16/18 neutralizing IgG (qualitative)"

sources:
  - SRC-NCCN-CERVICAL-2025
  - SRC-ESMO-CERVICAL-2024

last_reviewed: "2026-05-18"
reviewer_signoffs: []
notes: >
  STUB — v0.2 prevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. CERVARIX is the
  bivalent (HPV 16/18) HPV vaccine — first-licensed in 2007 (EMA) / 2009
  (FDA). LARGELY DISCONTINUED in many high-income markets after Gardasil-9
  introduction (2014/2015) — GSK withdrew Cervarix from the US market in
  2016 due to limited demand against Gardasil-9 which covers seven
  additional types. Still distributed in some ex-US markets including
  parts of Europe, Asia, Africa, and Latin America where Gardasil-9 is
  not yet dominant. AS04 adjuvant gives slightly higher / more durable
  anti-HPV-16/18 titers than aluminium-only adjuvants, plus some cross-
  protection against types 31, 33, 45, 58 (modest, lower than direct
  protection in Gardasil-9). Notably does NOT cover HPV 6/11 (genital
  warts) — Gardasil-9 has this additional indication. Engine should
  prefer DRUG-GARDASIL-9 in any population where it is available;
  Cervarix is listed as a class-completeness / market-fallback entity
  for jurisdictions where Gardasil-9 is unavailable. In Ukraine,
  Gardasil-9 is the marketed HPV vaccine — engine should NOT routinely
  surface Cervarix for UA-resident patients. Two-Co-Lead signoff queued
  for v0.2-A clinical review.

notes_ua: >
  Cervarix — бівалентна вакцина проти ВПЛ (типи 16/18), перша ліцензована
  HPV-вакцина (EMA 2007 / FDA 2009). У більшості розвинутих ринків
  ВИТІСНЕНА 9-валентною Gardasil-9 (2014/2015+); GSK вилучив Cervarix з
  ринку США у 2016. Залишається доступною у деяких країнах ex-US.
  АД'ЮВАНТ AS04 (TLR4-агоніст) забезпечує дещо вищі та триваліші титри
  антитіл проти ВПЛ-16/18 та обмежений крос-захист проти типів 31/33/45/58.
  НЕ покриває ВПЛ-6/11 (генітальні бородавки) — Gardasil-9 має це
  додаткове показання. В Україні станом на 2026-05 Cervarix НЕ є основною
  доступною HPV-вакциною — двигун повинен пропонувати Gardasil-9 для UA-
  резидентів. Cervarix — лише як резервний варіант при недоступності
  9-валентної вакцини.
