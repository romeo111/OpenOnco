id: DRUG-CLONIDINE-CESSATION
names:
  preferred: "Clonidine (off-label tobacco cessation / withdrawal context)"
  ukrainian: "Клонідин (off-label — припинення куріння / абстиненція)"
  english: "Clonidine (tobacco cessation / withdrawal)"
  synonyms: ["α2-agonist cessation — clonidine"]
  brand_names: ["Catapres", "Klofelin", "Catapressan"]
atc_code: C02AC01
rxnorm_id: "2599"
drug_class: "Centrally acting α2-adrenergic receptor agonist — off-label tobacco-cessation use"
mechanism: >
  Imidazoline derivative that selectively activates central α2-
  adrenergic receptors in the rostral ventrolateral medulla, decreasing
  sympathetic outflow (lowering blood pressure, heart rate, and CNS
  noradrenergic tone). Mechanism in tobacco cessation: nicotine
  withdrawal generates pronounced noradrenergic / sympathetic
  hyperactivity (anxiety, irritability, autonomic arousal); clonidine
  suppresses this withdrawal symptomatology, allowing better short-term
  abstinence rates. Cochrane meta-analyses (Gourlay 2004; superseded
  evidence base) reported approximate doubling of abstinence vs placebo
  (RR ~1.6-2.0), but with substantial discontinuation due to side effects
  (sedation, dry mouth, orthostatic hypotension) limiting practical
  utility. SECOND / THIRD-LINE option for cessation per USPSTF 2021 /
  AHCPR when first-line (varenicline, NRT, bupropion) have failed or
  contraindicated. Off-label use; not commonly chosen.

regulatory_status:
  fda:
    approved: true
    first_approval_year: 1974  # hypertension indication
    indications_brief:
      - "Hypertension"
      - "Attention-deficit hyperactivity disorder (extended-release)"
      - "Opioid withdrawal management (off-label widely accepted)"
      - "NOT FDA-labeled for tobacco cessation (off-label use historically supported by AHCPR / Cochrane)"
  ema:
    approved: true
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-18"
    notes: "Зареєстровано в Україні (Klofelin та генерики; дешевий і доступний). НЕ на НСЗУ для припинення куріння (це off-label показання). Здебільшого використовується для гіпертензії та опіоїдної абстиненції в наркологічних відділеннях."
typical_dosing: >
  Tobacco cessation (off-label, AHCPR / Cochrane historical):
    PO: Start 0.1 mg BID; titrate to effect, typical target 0.15-0.4 mg/day
    in divided doses. Begin 1-3 days before target quit date. Total course
    typically 3-10 weeks. Tapered withdrawal mandatory to avoid rebound
    hypertension.
    Transdermal patch: 0.1 mg/24 h patch applied weekly (max 0.3 mg/24 h);
    onset slower (~2-3 days for therapeutic levels). Often better tolerated
    due to steadier levels.
  Elderly: start 0.05 mg BID. Renal impairment: reduce dose proportionally.
formulations:
  - "Tablet 0.1 mg, 0.2 mg, 0.3 mg"
  - "Transdermal patch 0.1, 0.2, 0.3 mg/24 h (weekly)"
  - "Extended-release tablet 0.1 mg (Kapvay — ADHD indication)"

absolute_contraindications:
  - "Hypersensitivity to clonidine"
  - "Severe bradyarrhythmia / sick sinus syndrome / 2nd-3rd degree AV block (without pacemaker)"
  - "Severe hypotension"
  - "Pheochromocytoma (relative — α2 effect may unmask paradoxical responses)"
black_box_warnings: []
major_interactions:
  - "Beta-blockers — additive bradycardia / hypotension; concurrent use can also potentiate REBOUND HYPERTENSION on abrupt clonidine withdrawal; if discontinuing, taper clonidine FIRST while beta-blocker continued"
  - "Tricyclic antidepressants — may DECREASE clonidine antihypertensive effect (α1-blockade competition); also pharmacodynamic CNS-depression additive"
  - "Other antihypertensives — additive hypotension"
  - "CNS depressants (alcohol, benzodiazepines, opioids) — additive sedation"
  - "Verapamil, diltiazem — additive bradycardia / AV block"
  - "Digoxin — additive bradycardia"
common_adverse_events:
  - "Dry mouth (~40-50%)"
  - "Sedation / drowsiness (~30-40%)"
  - "Dizziness (~15-20%; orthostatic)"
  - "Constipation (~10-15%)"
  - "Headache (~5-10%)"
  - "Fatigue (~5-10%)"
  - "Bradycardia (~5-10%)"
  - "Skin reaction at patch site (~10-15% with transdermal)"
  - "Sexual dysfunction (~3-5%)"
serious_adverse_events:
  - "REBOUND HYPERTENSION on abrupt discontinuation (potentially severe; especially with concurrent beta-blocker) — taper mandatory"
  - "Severe bradycardia / AV block (rare)"
  - "Syncope from orthostatic hypotension"
  - "Symptomatic hypotension"
  - "Sinus arrest (rare)"
  - "Depression / mood changes"
  - "Confusion / delirium (elderly)"
  - "Raynaud-like phenomenon (rare)"

pharmacology: {half_life_hours: 12, clearance: "Hepatic metabolism (~50%) + renal excretion of parent (~50%); minimal CYP involvement (primarily non-CYP oxidation); transdermal achieves steady-state in ~2-3 days; oral peak ~3-5 h"}

sources:
  - SRC-NCCN-BCELL-2025

last_reviewed: "2026-05-18"
notes: >
  STUB — v0.2 prevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. OFF-LABEL tobacco-
  cessation agent — supported by historical Cochrane meta-analysis
  (Gourlay 2004) RR ~1.6-2.0 vs placebo for short-term abstinence, with
  significant discontinuation rates due to sedation, dry mouth, and
  orthostatic side effects. THIRD-LINE / SALVAGE position: USPSTF 2021 /
  AHCPR / Cochrane place varenicline (DRUG-VARENICLINE) first, then NRT
  + bupropion (DRUG-BUPROPION-SR), then nortriptyline (DRUG-
  NORTRIPTYLINE-CESSATION); clonidine is rarely used in current practice
  except in specific niches: (1) coexisting hypertension where the
  antihypertensive effect is desired, (2) patients with both tobacco use
  and opioid-use disorder where clonidine is also part of opioid-
  withdrawal management. KEY WARNINGS: mandatory taper on
  discontinuation to avoid rebound hypertension; avoid abrupt
  discontinuation especially if concurrent beta-blocker. Source cited
  (SRC-NCCN-BCELL-2025) is closest in-KB until USPSTF/AHCPR/Cochrane
  tobacco-cessation sources land in source-stub workstream.

notes_ua: >
  Клонідин — центральний α2-адренергічний агоніст; OFF-LABEL для
  припинення куріння. За даними історичних Cochrane meta-analysis
  (Gourlay 2004) — RR ~1.6-2.0 для короткострокової утриманності, але
  з ВИСОКОЮ часткою припинення через седацію, сухість у роті та
  ортостатичні ефекти. ПОЗИЦІЯ: 3-тя лінія / резерв — USPSTF 2021 /
  AHCPR / Cochrane: 1) варенікліні (DRUG-VARENICLINE), 2) NRT + бупропіон
  (DRUG-BUPROPION-SR), 3) нортриптилін (DRUG-NORTRIPTYLINE-CESSATION),
  4) клонідин — рідко вибирається у сучасній практиці окрім ніш:
  (1) коли є супутня гіпертензія і антигіпертензивний ефект бажаний,
  (2) пацієнти з тютюнобактиснимий + опіоїдним розладом, де клонідин
  також застосовується в опіоїдній абстиненції. КЛЮЧОВЕ ПОПЕРЕДЖЕННЯ:
  обов'язкова поступова відміна — інакше ризик rebound-гіпертензії
  (особливо при супутньому β-блокаторі).

