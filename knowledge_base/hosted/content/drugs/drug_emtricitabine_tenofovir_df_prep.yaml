id: DRUG-EMTRICITABINE-TENOFOVIR-DF-PREP
names:
  preferred: "Emtricitabine / Tenofovir disoproxil fumarate (HIV pre-exposure prophylaxis)"
  ukrainian: "Емтрицитабін / Тенофовіру дизопроксил фумарат (PrEP — преекспозиційна профілактика ВІЛ)"
  english: "Emtricitabine / Tenofovir DF (HIV PrEP)"
  synonyms:
    - "FTC/TDF"
    - "Truvada PrEP"
    - "F/TDF"
  brand_names:
    - "Truvada"
atc_code: J05AR03
rxnorm_id: "643551"
drug_class: "Fixed-dose two-NRTI combination — HIV-1 pre-exposure prophylaxis (PrEP)"
mechanism: >
  Fixed-dose combination of two nucleoside / nucleotide reverse-
  transcriptase inhibitors. Emtricitabine (200 mg) is a cytidine-analog
  NRTI; after intracellular phosphorylation it competitively inhibits
  HIV-1 reverse transcriptase and terminates chain elongation. Tenofovir
  disoproxil fumarate (300 mg) is a phosphonate prodrug of tenofovir
  delivering tenofovir-DP intracellularly, inhibiting HIV-1 RT and HBV
  polymerase. As ORAL DAILY PrEP in HIV-negative adults at substantial
  risk, FTC/TDF reduces HIV acquisition by ≥99% with consistent daily
  adherence (iPrEx 2010, Partners PrEP, TDF2; >90% relative risk
  reduction at intention-to-treat). Cancer-prevention pathway:
  preventing incident HIV infection prevents downstream AIDS-defining
  malignancies (Kaposi sarcoma, NHL incl. PCNSL, invasive cervical
  cancer) and several HPV-related and viral hepatitis-related cancers
  driven by HIV-induced immunosuppression.

regulatory_status:
  fda:
    approved: true
    year_first_approval: 2012  # PrEP indication (FTC/TDF originally HIV treatment since 2004)
    indications_brief:
      - "HIV-1 pre-exposure prophylaxis (PrEP) in HIV-negative adults and adolescents weighing ≥35 kg at risk of sexually-acquired HIV infection"
      - "HIV-1 treatment (in combination with other antiretrovirals) — original 2004 indication"
      - "Cancer-prevention pathway: preventing HIV infection prevents AIDS-defining and several non-AIDS-defining cancers"
  ema:
    approved: true
    year_first_approval: 2016  # EU PrEP approval
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications:
      - "ВІЛ-інфекція — як компонент антиретровірусної терапії (АРТ) в межах НСЗУ-програми лікування ВІЛ"
    last_verified: "2026-05-18"
    notes: "Truvada (FTC/TDF) зареєстровано в Україні. ВИКОРИСТАННЯ ДЛЯ ЛІКУВАННЯ ВІЛ — покривається НСЗУ через ДУ «Центр громадського здоров'я МОЗ України». ВИКОРИСТАННЯ ДЛЯ PrEP станом на 2026-05: пілотні програми PrEP у певних регіонах України через гранти Global Fund / PEPFAR / USAID; широка PrEP-реімбурсація НСЗУ ще НЕ запроваджена. Можна отримати у центрах СНІДу або через спеціалізовані ключові-групи-програми. Перевірено дані ЦГЗ МОЗ + drlz.com.ua 2026-05-18."
typical_dosing: >
  Adult / adolescent (≥35 kg) PrEP:
    1 tablet (200 mg FTC / 300 mg TDF) PO once daily, with or without
    food. Steady-state intracellular tenofovir-DP requires ~7 days of
    daily dosing (rectal tissue) and ~20 days (cervicovaginal tissue) —
    establish high adherence BEFORE potential exposure.
  Event-driven (2-1-1) PrEP — MSM only (IPERGAY 2015, WHO 2019):
    2 tablets 2-24 h before sex, 1 tablet 24 h after first dose, 1 tablet
    48 h after first dose. NOT recommended for cisgender women, vaginal
    sex (insufficient tissue levels in cervicovaginal compartment), or
    PEP indications.
  HIV-1 treatment (combination ART): 1 tablet PO daily + 3rd agent.
  Renal adjustment: CrCl 30-49 → q48h; CrCl <30 → AVOID PrEP (insufficient
    data). Hepatic: no adjustment.
  REQUIRED BEFORE / DURING USE: confirmed HIV-negative status (4th-gen
    Ag/Ab + RNA if recent exposure suspected) baseline + every 3 months;
    HBsAg + anti-HBs baseline; CrCl baseline + every 6 months; STI screen
    every 3-6 months; pregnancy counseling.
formulations:
  - "Tablet 200 mg emtricitabine / 300 mg tenofovir disoproxil fumarate"

absolute_contraindications:
  - "Documented HIV-positive status (treatment dose only — PrEP dosing alone in HIV+ person rapidly selects M184V resistance)"
  - "Hypersensitivity to emtricitabine or tenofovir disoproxil fumarate"
  - "CrCl <30 mL/min"
black_box_warnings:
  - "Severe acute exacerbation of hepatitis B in HBV-infected patients on discontinuation — monitor LFTs ≥several months after stopping"
  - "Risk of HIV-1 resistance in HIV-positive individuals using PrEP dose (must confirm HIV-negative status at baseline and every 3 months)"
major_interactions:
  - "Didanosine: increased exposure → pancreatitis, lactic acidosis — AVOID"
  - "Other nephrotoxic agents (aminoglycosides, NSAIDs, IV contrast, cidofovir, foscarnet, high-dose acyclovir): additive renal toxicity — monitor"
  - "Atazanavir, lopinavir-ritonavir: increase tenofovir exposure — relevant in HIV-treatment context, less so in PrEP"
  - "Adefovir: avoid (cross-toxicity)"
  - "Tenofovir alafenamide-containing regimens: avoid duplicate tenofovir"
  - "Other emtricitabine- / lamivudine-containing products: avoid duplicate"
common_adverse_events:
  - "Headache — ~7-10%"
  - "Nausea — ~5-10% (mostly first 4-8 weeks; 'start-up syndrome')"
  - "Diarrhea — ~5%"
  - "Abdominal pain — ~3-5%"
  - "Fatigue — ~3-5%"
  - "Weight loss (modest, ~0.5-1 kg over months)"
  - "Mild transient renal-function decline (~3-5%, usually reversible)"
serious_adverse_events:
  - "Nephrotoxicity: proximal renal tubulopathy (Fanconi syndrome — phosphate wasting, glycosuria, proteinuria, hypouricemia); acute kidney injury (uncommon but can be permanent)"
  - "Decreased bone mineral density / osteomalacia (long-term use; phosphate wasting contributes; reversible after stop)"
  - "Lactic acidosis / severe hepatomegaly with steatosis (boxed, rare)"
  - "HBV reactivation flare on discontinuation in HBV-coinfected patients"
  - "HIV resistance if unrecognized HIV+ at PrEP initiation (M184V mutation)"
  - "Severe hypersensitivity / DRESS / SJS (rare)"
pharmacology:
  half_life_hours: 10  # emtricitabine ~10 h; tenofovir ~17 h plasma; intracellular tenofovir-DP ~150 h
  clearance: "Both components renally cleared — emtricitabine ~86% unchanged in urine; tenofovir ~70-80% renal via glomerular filtration + OAT1/3 active tubular secretion"
  protein_binding_pct: 7  # tenofovir <1%; emtricitabine <4%
  metabolism: "Emtricitabine: minimal hepatic metabolism (renal excretion of parent). Tenofovir: prodrug hydrolyzed in plasma to tenofovir; no significant CYP; eliminated renally"
sources:
  - SRC-NIH-AIDS-2024
  - SRC-AASLD-HBV-2024
last_reviewed: "2026-05-18"
reviewer_signoffs: []
notes: >
  STUB — v0.2 prevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. TRUVADA-FOR-PREP is
  the original FDA-approved oral PrEP (2012). Two-NRTI fixed-dose
  combination — daily oral, with or without food. Cancer-prevention
  rationale: preventing HIV acquisition prevents downstream AIDS-defining
  cancers (Kaposi sarcoma, NHL incl. PCNSL and Burkitt, invasive cervical
  cancer) and several non-AIDS-defining cancers (HPV-driven anal,
  oropharyngeal, hepatocellular, Hodgkin lymphoma) at population level.
  Distinct entity from DRUG-BICTEGRAVIR-EMTRICITABINE-TENOFOVIR-AF
  (Biktarvy — HIV treatment only, NOT PrEP) and from DRUG-TENOFOVIR-DF /
  DRUG-TENOFOVIR-AF (single-agent HBV/HIV-treatment context). Cabotegravir
  LA (DRUG-CABOTEGRAVIR-LA-PREP, batch 3 sibling) is the long-acting
  injectable PrEP alternative. Truvada PrEP indications: MSM, transgender
  women, transgender men, cisgender heterosexual women and men at
  substantial risk, people who inject drugs. Renal monitoring is the
  critical safety pillar (baseline CrCl + every 6 months). HIV-status
  monitoring is the resistance-prevention pillar (every 3 months). HBsAg
  baseline screen is mandatory — if HBV+, FTC/TDF can treat HBV
  simultaneously but discontinuation requires careful taper (flare risk).
  Ukraine: PrEP rollout via pilot Global Fund / PEPFAR programs in key-
  populations centers; broad НСЗУ-coverage NOT yet established.

notes_ua: >
  Truvada PrEP (FTC/TDF) — перший FDA-схвалений пероральний препарат для
  преекспозиційної профілактики ВІЛ (2012). Щоденна 1 таблетка PO.
  Знижує ризик статевого набуття ВІЛ на ≥99% при суворій прихильності.
  Окрема сутність DRUG-BICTEGRAVIR-EMTRICITABINE-TENOFOVIR-AF (Biktarvy) —
  ЛІКУВАННЯ ВІЛ, НЕ PrEP. Для довгодіючої ін'єкційної альтернативи —
  DRUG-CABOTEGRAVIR-LA-PREP (Apretude). Перед початком PrEP та кожні
  3 місяці — ОБОВ'ЯЗКОВЕ підтвердження ВІЛ-негативного статусу (інакше
  ризик резистентності M184V); базово HBsAg + anti-HBs (у разі HBV+
  препарат паралельно лікує HBV, але припинення потребує контролю);
  CrCl базово + кожні 6 місяців; скринінг ІПСШ кожні 3-6 місяців.
  В Україні станом на 2026-05: PrEP — лише пілотні програми через Global
  Fund / PEPFAR у центрах СНІДу та програмах для ключових груп; широка
  НСЗУ-реімбурсація для PrEP-показання ще НЕ запроваджена. ВИКОРИСТАННЯ
  ДЛЯ ЛІКУВАННЯ ВІЛ — повністю покривається НСЗУ.
