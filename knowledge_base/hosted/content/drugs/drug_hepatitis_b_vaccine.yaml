id: DRUG-HEPATITIS-B-VACCINE
names:
  preferred: "Hepatitis B vaccine (recombinant)"
  ukrainian: "Вакцина проти гепатиту B (рекомбінантна)"
  english: "Hepatitis B vaccine, recombinant"
  synonyms:
    - "HepB vaccine"
    - "HBV vaccine"
    - "rDNA HBsAg vaccine"
  brand_names:
    - "Engerix-B"
    - "Recombivax HB"
    - "Heplisav-B"
    - "PreHevbrio"
atc_code: J07BC01
rxnorm_id: null  # Vaccines tracked by NDC + CVX, not RxNorm
drug_class: "Recombinant subunit vaccine (HBsAg) — prophylactic against hepatitis B virus"
mechanism: >
  Recombinant non-infectious vaccine containing hepatitis B surface
  antigen (HBsAg) produced in Saccharomyces cerevisiae (Engerix-B,
  Recombivax HB) or in mammalian cells (PreHevbrio — tri-antigen S/preS1/
  preS2). Adjuvanted with aluminium hydroxide (Engerix-B, Recombivax HB),
  CpG 1018 toll-like receptor 9 agonist (Heplisav-B, two-dose adult
  schedule), or aluminium hydroxide + emulsion (PreHevbrio). HBsAg
  contains no viral DNA — cannot cause HBV infection. Vaccination elicits
  high-titer anti-HBs neutralizing IgG that prevents incident HBV
  infection on exposure. CANCER-PREVENTION PATHWAY: chronic HBV infection
  is responsible for ~50% of hepatocellular carcinoma (HCC) globally and
  a subset of HBV-associated B-cell non-Hodgkin lymphomas; preventing
  chronic HBV via vaccination is the single most effective primary-
  prevention intervention for HCC (WHO + IARC).

regulatory_status:
  fda:
    approved: true
    year_first_approval: 1986  # Recombivax HB (first recombinant); Engerix-B 1989; Heplisav-B 2017; PreHevbrio 2021
    indications_brief:
      - "Active immunization against infection caused by all known subtypes of hepatitis B virus"
      - "Universal infant vaccination (birth-dose recommended)"
      - "Universal adult catch-up (ACIP 2022 — all adults 19-59 not previously vaccinated; adults ≥60 with risk factors or per shared-decision-making)"
      - "Indicated in chronic-hemodialysis, immunocompromised, HCWs, MSM, IDU, household / sexual contacts of HBsAg+, travelers, prison populations, persons with chronic liver disease"
      - "Cancer-prevention pathway: HCC primary prevention (the single most effective universal anti-cancer vaccine for HCC)"
  ema:
    approved: true
    year_first_approval: 1986
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: true
    reimbursement_indications:
      - "Універсальна імунізація новонароджених (доза при народженні згідно з Календарем профілактичних щеплень України)"
      - "Імунізація медичних працівників, пацієнтів на гемодіалізі, осіб з хронічними захворюваннями печінки, контактів HBsAg-позитивних"
      - "Профілактика передачі від матері до дитини в комбінації з HBIg для новонароджених від HBsAg-позитивних матерів"
    last_verified: "2026-05-18"
    notes: "Включена до національного Календаря профілактичних щеплень України (доза при народженні + наступні дози). Безкоштовно надається в державних закладах охорони здоров'я для дітей. Доросла катч-ап-вакцинація — частково за рахунок місцевих бюджетів / приватних аптек. Перевірено drlz.com.ua + дані МОЗ 2026-05-18."
typical_dosing: >
  Standard 3-dose adult schedule (Engerix-B / Recombivax HB / PreHevbrio):
    0, 1, 6 months. Each dose 1.0 mL IM in deltoid.
  Pediatric schedule (Engerix-B / Recombivax HB):
    Birth dose (within 24 h of birth), then 1-2 months, then 6-18 months.
    Each dose 0.5 mL IM (anterolateral thigh in infants).
  Two-dose adult schedule (Heplisav-B, CpG-adjuvanted, age ≥18):
    0 and 1 month. Each dose 0.5 mL IM in deltoid.
  Three-dose adult schedule (PreHevbrio, tri-antigen, age ≥18):
    0, 1, 6 months. Each dose 1.0 mL IM in deltoid.
  Hemodialysis / immunocompromised: double-dose (Engerix-B 40 mcg ×
    4 doses at 0, 1, 2, 6 months; Recombivax HB 40 mcg × 3 doses).
  Post-exposure prophylaxis: combine with HBIg (for known exposure to
    HBsAg+ source in unvaccinated person, or non-responder). Series
    interruption: resume from where left off — do not restart.
  Renal / hepatic impairment: no dose adjustment for vaccine itself
    (though immunogenicity reduced in dialysis — use double-dose schedule).
  Pregnancy: not contraindicated (recombinant non-infectious); can
    administer at any trimester for at-risk women.
  Lactation: compatible.
formulations:
  - "Pre-filled syringe 0.5 mL pediatric (5 mcg HBsAg — Recombivax HB / Engerix-B)"
  - "Pre-filled syringe 1.0 mL adult (10-20 mcg HBsAg — Engerix-B / Recombivax HB)"
  - "Pre-filled syringe 0.5 mL adult (20 mcg HBsAg + 3000 mcg CpG-1018 — Heplisav-B)"
  - "Pre-filled syringe 1.0 mL adult (10 mcg tri-antigen — PreHevbrio)"
  - "Single-dose vial — equivalent volumes"

absolute_contraindications:
  - "Severe hypersensitivity (anaphylaxis) to any component of the vaccine including yeast (Saccharomyces cerevisiae — Engerix-B / Recombivax HB / Heplisav-B) or hamster cell proteins (PreHevbrio)"
  - "Severe acute illness with fever — defer until resolved (mild illness without fever is NOT a contraindication)"
black_box_warnings: []
major_interactions:
  - "Immunosuppressive therapy (corticosteroids ≥20 mg prednisone-equivalent ≥14 days, chemotherapy, anti-CD20 monoclonals, calcineurin inhibitors, JAK inhibitors, biologic DMARDs): reduced immunogenicity — administer ≥2 weeks before scheduled immunosuppression where possible, or after immune reconstitution; consider double-dose schedule"
  - "Other inactivated vaccines: may be co-administered at separate anatomic sites without interaction (per ACIP / CDC schedule)"
  - "Live vaccines: no contraindication (HepB vaccine is itself non-live recombinant)"
  - "Anticoagulants / bleeding disorders: use 23-25 gauge needle, apply firm pressure ≥2 min — no contraindication"
  - "Blood products containing immunoglobulins (HBIg post-exposure): can be co-administered at separate site without interaction"
common_adverse_events:
  - "Injection-site pain — very common (~30-50%)"
  - "Injection-site erythema / swelling — common (~10-20%)"
  - "Fatigue — common (~10-15%)"
  - "Headache — common (~10-15%)"
  - "Pyrexia (≥38°C, transient 1-2 days) — common (~2-5%)"
  - "Myalgia — common (~5-10%)"
  - "Malaise — common (~5%)"
  - "Nausea — uncommon (~2-3%)"
  - "Dizziness — uncommon (~1-2%)"
  - "Mild transient transaminase elevation — uncommon (~1-2%; no clinical significance)"
serious_adverse_events:
  - "Anaphylaxis — very rare (~1 per million doses; yeast-allergy mechanism for Engerix-B / Recombivax HB)"
  - "Severe injection-site reaction / cellulitis — rare"
  - "Guillain-Barré syndrome (causal association NOT established; passive-surveillance signal at very low frequency)"
  - "Severe hypersensitivity (Stevens-Johnson, DRESS) — very rare"
  - "Reports of demyelinating disease post-vaccination (multiple sclerosis flares) — extensively studied, no confirmed causal link per WHO/IOM"

pharmacology: null  # vaccines characterized by immunogenicity, not PK; see immunogenicity block

immunogenicity:
  seroconversion_rate_pct: 95  # >95% anti-HBs ≥10 mIU/mL after standard 3-dose schedule in immunocompetent adults <40 y; declines with age, BMI, smoking, immunocompromise
  duration_of_protection: "≥30 years observational follow-up with no boosters needed in immunocompetent responders; protection durable even when anti-HBs titers wane below detection (immune memory)"
  correlate_of_protection: "Anti-HBs ≥10 mIU/mL post-series; non-responders defined as <10 mIU/mL after 6+ doses"

sources:
  - SRC-AASLD-HBV-2024
  - SRC-NCCN-BCELL-2025

last_reviewed: "2026-05-18"
reviewer_signoffs: []
notes: >
  STUB — v0.2 prevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. UNIVERSAL HepB
  vaccination is the single most effective primary-prevention
  intervention for hepatocellular carcinoma (HCC) globally — WHO target
  is universal birth-dose coverage. Taiwan's national infant program
  (1984+) drove HCC incidence in children ≥20 y down by ~70% (Chang
  NEJM 1997; long-term follow-up). Ukraine has included HepB birth-dose
  in the national vaccination schedule since 2000+. Recovery from
  acute infection in unvaccinated adults usually clears virus (~95% in
  immunocompetent), so vaccination provides the upstream protection;
  for those who develop chronic HBV, ongoing antiviral suppression
  (entecavir / tenofovir AF/DF) is the secondary-prevention pathway
  (separate entities: DRUG-ENTECAVIR-not-yet-authored, DRUG-TENOFOVIR-AF,
  DRUG-TENOFOVIR-DF, DRUG-LAMIVUDINE). Vaccine modality — no standard
  pharmacology block; immunogenicity data captured in separate field.
  NDC tracking varies by brand; vaccines are CVX-coded — rxnorm_id
  intentionally null. Heplisav-B (CpG-adjuvanted, two-dose) preferred in
  adults requiring rapid completion (e.g., pre-immunosuppression) and
  achieves ≥95% seroconversion vs ~90% with three-dose alum schedules.
  Two-Co-Lead signoff queued for v0.2-A clinical review.

notes_ua: >
  Вакцина проти гепатиту B (рекомбінантна) — найефективніша універсальна
  протиракова вакцина для профілактики гепатоцелюлярної карциноми (HCC)
  глобально. Тайвань 1984+ (універсальна вакцинація при народженні)
  досягнув ~70% зниження HCC у молоді протягом 20 років. Україна включила
  дозу при народженні до Календаря профілактичних щеплень з 2000-х років.
  Стандартний дорослий курс: 0, 1, 6 місяців (Engerix-B / Recombivax HB
  / PreHevbrio) або 0, 1 місяць (Heplisav-B з CpG-ад'ювантом, швидший).
  Серологічна відповідь (anti-HBs ≥10 мМО/мл) >95% у імунокомпетентних
  <40 років. Тривалість захисту ≥30 років без додаткових бустерів.
  Включено до НСЗУ-програми (безкоштовно для дітей у державних закладах);
  доросла катч-ап-вакцинація — частково за місцеві кошти або у приватних
  аптеках.
