id: DRUG-LIRAGLUTIDE-OBESITY
names:
  preferred: "Liraglutide (3.0 mg obesity dose)"
  ukrainian: "Ліраглутид (3.0 мг — обезіта-доза)"
  english: "Liraglutide (3.0 mg)"
  synonyms: ["Saxenda (obesity dose)", "Victoza (T2DM 1.8 mg)"]
  brand_names: ["Saxenda", "Victoza"]
atc_code: A10BJ02
rxnorm_id: "847908"
drug_class: "GLP-1 receptor agonist (intermediate-acting, once-daily)"
mechanism: >
  Human glucagon-like peptide-1 analog (97% homology) with fatty-acid
  sidechain conferring albumin binding and ~13-hour half-life — once-daily
  subcutaneous administration. Activates GLP-1 receptors in pancreas
  (glucose-dependent insulin secretion + glucagon suppression), GI tract
  (delayed gastric emptying), and CNS (hypothalamic satiety signaling,
  reward-circuit modulation). At obesity dose (3.0 mg/day, Saxenda),
  produces ~5-8% mean weight loss vs ~2-3% on placebo (SCALE trials) —
  lower than semaglutide 2.4 mg (~12-15%) and tirzepatide (~15-20%).
  Older once-daily GLP-1 RA; supplanted by once-weekly semaglutide
  (Wegovy) and tirzepatide (Zepbound) for most obesity indications.
  Obesity is associated with 13+ cancers (IARC/WCRF) — sustained
  weight loss is a recognized cancer-prevention intervention pathway.

regulatory_status:
  fda:
    approved: true
    first_approval_year: 2014  # Saxenda 3.0 mg obesity; Victoza 1.8 mg T2DM since 2010
    indications_brief:
      - "Chronic weight management (Saxenda) in adults with BMI ≥30 or BMI ≥27 + ≥1 weight-related comorbidity"
      - "Chronic weight management in pediatric patients ≥12 y with obesity (BMI ≥95th percentile)"
      - "Type 2 diabetes mellitus (Victoza 1.8 mg) — separate indication"
      - "Cardiovascular risk reduction in T2DM with established CVD (LEADER trial)"
      - "Cancer-prevention pathway via obesity-related cancer risk reduction (not a labeled indication)"
  ema:
    approved: true
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-18"
    notes: "Victoza (ліраглутид 1.8 мг) зареєстровано в Україні для лікування цукрового діабету 2 типу. Saxenda (3.0 мг — обезіта-доза) має обмежену доступність станом на 2026-05; НЕ на НСЗУ. Out-of-pocket у приватних аптеках."
typical_dosing: >
  Obesity (Saxenda) — SC dose escalation over 5 weeks:
    Week 1: 0.6 mg SC daily
    Week 2: 1.2 mg SC daily
    Week 3: 1.8 mg SC daily
    Week 4: 2.4 mg SC daily
    Week 5 onward: 3.0 mg SC daily (maintenance)
  Inject SC abdomen / thigh / upper arm at any consistent time of day;
  rotate sites. Discontinue if ≥4% weight loss not achieved at 16 weeks.
  T2DM (Victoza): 0.6 mg/day × 1 week, then 1.2 mg/day; up to 1.8 mg/day.
formulations:
  - "Pre-filled multi-dose pen 6 mg/mL × 3 mL (Saxenda — delivers 0.6 to 3.0 mg per injection)"
  - "Pre-filled multi-dose pen 6 mg/mL × 3 mL (Victoza — delivers 0.6, 1.2, 1.8 mg per injection)"

absolute_contraindications:
  - "Personal or family history of medullary thyroid carcinoma (MTC)"
  - "Multiple endocrine neoplasia type 2 (MEN2)"
  - "Hypersensitivity to liraglutide"
  - "Pregnancy (discontinue before planned conception)"
black_box_warnings:
  - "Risk of thyroid C-cell tumors — rodent carcinogenicity studies showed dose-dependent MTC and C-cell hyperplasia; human relevance unknown but precautionary contraindication for MTC/MEN2"
major_interactions:
  - "Delayed gastric emptying — may affect oral medication absorption (especially levothyroxine, narrow-therapeutic-index drugs); monitor and time apart"
  - "Other glucose-lowering agents (insulin, sulfonylureas) — hypoglycemia risk; reduce sulfonylurea/insulin doses when initiating"
  - "Oral contraceptives — modest AUC reduction (~10-15%); generally no contraceptive failure but counsel"
  - "Warfarin — monitor INR for transient changes"
common_adverse_events:
  - "Nausea (~40%; mostly mild-moderate, improves with titration)"
  - "Diarrhea (~21%)"
  - "Constipation (~19%)"
  - "Vomiting (~16%)"
  - "Headache (~14%)"
  - "Hypoglycemia in T2DM (~14%, mostly with sulfonylurea/insulin combo)"
  - "Abdominal pain (~7-10%)"
  - "Dyspepsia (~7%)"
  - "Fatigue (~7%)"
  - "Injection-site reactions (~5%)"
serious_adverse_events:
  - "Acute pancreatitis (rare; discontinue and evaluate)"
  - "Acute kidney injury (from dehydration / severe vomiting)"
  - "Gallbladder disease, cholelithiasis (~2-3%)"
  - "Severe hypoglycemia (with sulfonylurea/insulin)"
  - "Hypersensitivity, anaphylaxis"
  - "Suicidal ideation (label warning; rare)"
  - "Possible thyroid C-cell tumors (unproven in humans)"

pharmacology: {half_life_hours: 13, clearance: "Proteolytic degradation; not eliminated by kidney or liver as an organ; albumin-bound (~98%); SC absorption peak ~8-12 h"}

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-WCRF-AICR-CUP-2018

last_reviewed: "2026-05-18"
notes: >
  STUB — v0.2 prevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. CLASS-DETAIL entity
  for the GLP-1 receptor agonist class (alongside DRUG-SEMAGLUTIDE-2-4MG
  and DRUG-TIRZEPATIDE — note tirzepatide is technically dual GIP/GLP-1).
  Older once-daily GLP-1 RA (Saxenda obesity indication, Victoza T2DM
  indication); largely supplanted by once-weekly semaglutide (Wegovy /
  Ozempic) and tirzepatide (Zepbound / Mounjaro) for obesity and most T2DM
  indications due to greater efficacy and weekly-dosing convenience.
  Retains role in: pediatric obesity (FDA-approved ≥12 y with obesity),
  T2DM patients intolerant of weekly injections, situations where
  injection-discontinuation flexibility matters. Cancer-prevention
  rationale is class-wide (sustained 5-8% weight loss reduces obesity-
  driven carcinogenesis incidence per IARC/WCRF). Source cited
  (SRC-WCRF-AICR-CUP-2018) is the umbrella obesity-cancer evidence base
  until USPSTF/AACE obesity-pharmacotherapy sources land.

notes_ua: >
  Ліраглутид (Saxenda 3.0 мг для ожиріння; Victoza 1.8 мг для ЦД-2) —
  старший представник GLP-1 RA з добовою підшкірною ін'єкцією. У
  дослідженнях SCALE досягнуто ~5-8% стійкого зниження ваги (нижче, ніж
  ~12-15% для семаглутиду 2.4 мг та ~15-20% для тирзепатиду). Здебільшого
  витіснений тижневими препаратами (Wegovy, Zepbound, Ozempic, Mounjaro),
  але зберігає роль у: педіатричному ожирінні (FDA-схвалення ≥12 років),
  пацієнтів, які не переносять тижневих ін'єкцій. Ожиріння асоціюється з
  13+ типами раку (IARC/WCRF) — фармакотерапія є визнаним компонентом
  стратегії зниження ваги. Saxenda на НСЗУ НЕ покривається; Victoza —
  обмежено доступний у програмах цукрового діабету.

