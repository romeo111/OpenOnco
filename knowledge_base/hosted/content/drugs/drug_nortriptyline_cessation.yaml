id: DRUG-NORTRIPTYLINE-CESSATION
names:
  preferred: "Nortriptyline (off-label tobacco cessation context)"
  ukrainian: "Нортриптилін (off-label — припинення куріння)"
  english: "Nortriptyline (tobacco cessation)"
  synonyms: ["TCA cessation — nortriptyline"]
  brand_names: ["Pamelor", "Nortrilen"]
atc_code: N06AA10
rxnorm_id: "7531"
drug_class: "Tricyclic antidepressant (TCA) — secondary amine; off-label tobacco-cessation use"
mechanism: >
  Secondary-amine tricyclic antidepressant; primary action is inhibition
  of norepinephrine reuptake (modest serotonin reuptake inhibition),
  with antagonism at histamine H1, muscarinic, and α1-adrenergic
  receptors. Mechanism in tobacco cessation is not fully established —
  proposed contributions include noradrenergic modulation of nicotine
  withdrawal, anxiety/depressive-symptom mitigation during quit attempts,
  and direct effect on smoking-related dopaminergic circuits. Cochrane
  meta-analysis (Hughes 2014 update) — nortriptyline approximately
  doubles long-term cessation rates vs placebo (RR ~2.0), comparable to
  bupropion and NRT; LESS evidence and LOWER tolerability than
  varenicline (DRUG-VARENICLINE — first-line per USPSTF 2021).
  OFF-LABEL use; second / third-line option for cessation when
  varenicline / bupropion / NRT have failed or are contraindicated.

regulatory_status:
  fda:
    approved: true
    first_approval_year: 1964  # depression indication
    indications_brief:
      - "Major depressive disorder"
      - "Chronic neuropathic pain (off-label widely accepted)"
      - "NOT FDA-labeled for tobacco cessation (off-label use supported by Cochrane / NICE / AHCPR)"
  ema:
    approved: true
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-18"
    notes: "Зареєстровано в Україні (Nortrilen та генерики). НЕ на НСЗУ для припинення куріння — це off-label показання. За кишеню пацієнта."
typical_dosing: >
  Tobacco cessation (off-label, Cochrane / NICE):
    Start 25 mg PO at bedtime × 3 days; titrate upward over 1-2 weeks
    to target dose of 75-100 mg/day (single bedtime dose or divided BID).
    Begin ≥10-14 days before target quit date (steady-state + symptom-
    control window). Total course 8-12 weeks; extend to 6 months if
    successful.
    Therapeutic plasma level 50-150 ng/mL (TDM available; consider in
    CYP2D6 poor / ultra-rapid metabolizers or elderly).
  Elderly: start 10 mg, max 50-75 mg/day. Hepatic impairment: reduce dose.
  Renal: no significant adjustment.
formulations:
  - "Capsule 10 mg, 25 mg, 50 mg, 75 mg"
  - "Oral solution 10 mg / 5 mL"

absolute_contraindications:
  - "Recent myocardial infarction (within 4-6 weeks)"
  - "Significant cardiac arrhythmia / heart block / prolonged QTc"
  - "Concurrent MAOI (within 14 days)"
  - "Acute angle-closure glaucoma"
  - "Severe hepatic impairment"
  - "Hypersensitivity to nortriptyline or tricyclic antidepressants"
  - "Pregnancy (relative — category C; weigh risk-benefit, especially in first trimester)"
black_box_warnings:
  - "Suicidal thoughts and behaviors in pediatric and young adult patients with depression (class warning for antidepressants)"
major_interactions:
  - "MAOIs — contraindicated (serotonin syndrome, hypertensive crisis)"
  - "CYP2D6 inhibitors (fluoxetine, paroxetine, bupropion, quinidine) — increase nortriptyline exposure; reduce dose 50%"
  - "CYP2D6 inducers (rifampin, carbamazepine, phenytoin, phenobarbital) — decrease nortriptyline exposure"
  - "Other anticholinergics (antihistamines, antipsychotics, antimuscarinics) — additive anticholinergic burden"
  - "QT-prolonging drugs (ondansetron, methadone, certain antibiotics/antiarrhythmics) — additive QT prolongation"
  - "Sedatives, alcohol — additive CNS depression"
  - "Drugs lowering seizure threshold (tramadol, bupropion, antipsychotics) — additive risk"
  - "Tamoxifen — AVOID combination (nortriptyline-related CYP2D6 effects may reduce active metabolite endoxifen levels) — consider non-TCA cessation agent in patients on tamoxifen"
common_adverse_events:
  - "Dry mouth (~20-30%; anticholinergic)"
  - "Sedation / drowsiness (~20-30%)"
  - "Constipation (~10-15%)"
  - "Blurred vision (~5-10%)"
  - "Orthostatic hypotension (~5-10%)"
  - "Weight gain (~5-10% over months)"
  - "Tremor (~3-5%)"
  - "Urinary hesitancy (~3-5%, anticholinergic)"
  - "Headache (~3-5%)"
  - "Tachycardia (~3%)"
serious_adverse_events:
  - "Cardiac arrhythmia (prolonged QTc; torsades; conduction delay)"
  - "Suicidal ideation, behavioral changes (class warning)"
  - "Seizures (especially overdose or in seizure-prone patients)"
  - "Anticholinergic delirium (elderly, polypharmacy)"
  - "Hyponatremia / SIADH"
  - "Severe overdose toxicity — cardiotoxic; narrow therapeutic index; particular concern in patients with suicidal ideation"
  - "Hepatic dysfunction (rare)"
  - "Activation of mania in bipolar disorder"

pharmacology: {half_life_hours: 30, clearance: "Hepatic CYP2D6 (primary) + CYP3A4 (minor) demethylation; some CYP1A2; renal excretion of conjugated metabolites. Plasma protein binding ~93%. CYP2D6 poor metabolizers — substantially higher exposure"}

sources:
  - SRC-NCCN-BCELL-2025

last_reviewed: "2026-05-18"
notes: >
  STUB — v0.2 prevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. OFF-LABEL tobacco-
  cessation agent — supported by Cochrane meta-analysis (Hughes 2014)
  RR ~2.0 vs placebo, similar to bupropion and NRT. SECOND / THIRD-LINE
  position: USPSTF 2021 / AHCPR / Cochrane place varenicline first
  (DRUG-VARENICLINE), then NRT + bupropion (DRUG-BUPROPION-SR); TCAs are
  alternative when first-line have failed or are contraindicated.
  Particular candidates: depressive comorbidity without contraindication
  to TCA, neuropathic pain comorbidity (synergy), patients who cannot
  tolerate varenicline (nausea, vivid dreams) or bupropion (insomnia,
  seizure-threshold concerns). KEY EXCLUSIONS: cardiac disease (recent
  MI, conduction defect, prolonged QTc), elderly with high anticholinergic
  burden, patients on tamoxifen (CYP2D6 effects). Plasma-level monitoring
  recommended; narrow therapeutic index. Source cited (SRC-NCCN-BCELL-
  2025) is closest in-KB until USPSTF/AHCPR/Cochrane tobacco-cessation
  sources land in source-stub workstream.

notes_ua: >
  Нортриптилін — трициклічний антидепресант (вторинний амін),
  використовується OFF-LABEL для припинення куріння. За даними Cochrane
  meta-analysis (Hughes 2014) — приблизно подвоює довгострокові
  показники припинення (RR ~2.0), порівнянно з бупропіоном і
  нікотинзамісною терапією; ДОКАЗИ СЛАБКІШІ і ПЕРЕНОСИМІСТЬ НИЖЧА за
  варенікліні. ПОЗИЦІЯ: 2-га / 3-тя лінія — USPSTF 2021 / AHCPR /
  Cochrane ставлять варенікліні (DRUG-VARENICLINE) першою лінією, потім
  NRT + бупропіон (DRUG-BUPROPION-SR). Нортриптилін — резерв при
  невдачі або непереносимості. Доза: старт 25 мг ввечері, титрація до
  75-100 мг/день за 1-2 тижні до запланованої дати припинення; курс
  8-12 тижнів. ВИКЛЮЧЕННЯ: серцева патологія (нещодавній ІМ, порушення
  провідності, подовжений QTc), літні пацієнти з антихолінергічним
  навантаженням, прийом тамоксифену (CYP2D6-взаємодія).

