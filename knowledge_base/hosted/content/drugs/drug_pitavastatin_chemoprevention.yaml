id: DRUG-PITAVASTATIN-CHEMOPREVENTION
names:
  preferred: "Pitavastatin (cancer chemoprevention context; statin class proxy)"
  ukrainian: "Пітавастатин (хіміопрофілактика раку; представник статинів)"
  english: "Pitavastatin (cancer chemoprevention)"
  synonyms: ["Statin (pitavastatin proxy)"]
  brand_names: ["Livalo", "Livazo", "Pitava"]
atc_code: C10AA08
rxnorm_id: "861634"
drug_class: "HMG-CoA reductase inhibitor (statin) — lipophilic, third-generation, low-CYP profile"
mechanism: >
  Lipophilic third-generation statin with low-dose potency similar to
  atorvastatin. Active form (not a prodrug). Cancer-prevention rationale:
  shared statin pleiotropic effects (decreased isoprenoid prenylation of
  Ras/Rho, anti-inflammatory, antiproliferative, pro-apoptotic).
  Minimally metabolized by CYP enzymes (mostly UGT-mediated lactonization
  with enterohepatic recirculation), giving a cleaner DDI profile than
  simvastatin/atorvastatin. Cancer-prevention RCT-level evidence is
  ABSENT — pitavastatin trial portfolio is too small to detect cancer-
  incidence effects. Primary regulatory indication is cardiovascular risk
  reduction; in HIV-population CV-prevention (REPRIEVE 2023) — does not
  inhibit antiretrovirals.

regulatory_status:
  fda:
    approved: true
    first_approval_year: 2009
    indications_brief:
      - "Primary and secondary CV prevention"
      - "Hypercholesterolemia / mixed dyslipidemia"
      - "Adjunct in HIV patients on antiretrovirals (REPRIEVE 2023)"
      - "NOT FDA-labeled for cancer chemoprevention"
  ema:
    approved: true
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-18"
    notes: "Пітавастатин має обмежену присутність в Україні станом на 2026-05; основні доступні статини — аторвастатин, розувастатин і симвастатин. Перевірено drlz.com.ua 2026-05-18."
typical_dosing: >
  Cardiovascular-prevention dosing range: 1-4 mg PO once daily (with or
  without food, any time of day). Typical starting dose 2 mg/day; titrate
  per LDL target. No specific oncology-prevention dose. CrCl 15-59:
  start 1 mg, max 2 mg/day. End-stage renal disease on HD: max 2 mg/day.
  Hepatic monitoring (baseline LFTs); CK only if symptomatic.
formulations:
  - "Tablet 1 mg, 2 mg, 4 mg"

absolute_contraindications:
  - "Active liver disease or unexplained persistent transaminase elevation (>3× ULN)"
  - "Pregnancy / lactation / women of reproductive potential without contraception"
  - "Hypersensitivity to pitavastatin"
  - "Concurrent cyclosporine (contraindicated)"
black_box_warnings: []
major_interactions:
  - "Cyclosporine — contraindicated (markedly increased pitavastatin exposure via OATP1B1 inhibition)"
  - "Erythromycin — increased pitavastatin exposure ~3-fold; limit to 1 mg or use alternative macrolide"
  - "Rifampin — substantial pitavastatin exposure increase via OATP1B1 inhibition; limit to 2 mg/day"
  - "Gemfibrozil — increased rhabdomyolysis risk; avoid"
  - "Warfarin — generally minimal interaction; monitor INR"
common_adverse_events:
  - "Myalgia / muscle aches (~2-5%; lower than equivalent-potency lipophilic statins)"
  - "Back pain (~3-4%)"
  - "Constipation (~3-4%)"
  - "Diarrhea (~2-3%)"
  - "Headache (~2-3%)"
  - "Arthralgia (~2-3%)"
serious_adverse_events:
  - "Rhabdomyolysis with acute kidney injury (rare; low-frequency signal)"
  - "Hepatotoxicity (transaminase elevation; clinically significant hepatitis rare)"
  - "New-onset diabetes mellitus (modest increase; smaller signal than potent lipophilic statins)"
  - "Immune-mediated necrotizing myopathy (very rare)"
  - "Severe hypersensitivity (rare)"

pharmacology: {half_life_hours: 12, clearance: "Minimal CYP metabolism (~minor CYP2C9); primarily UGT1A3/2B7 lactonization with enterohepatic recirculation; hepatic uptake via OATP1B1; ~15% renal excretion; ~80% fecal"}

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-WCRF-AICR-CUP-2018

last_reviewed: "2026-05-18"
notes: >
  STUB — v0.2 chemoprevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. STATIN CLASS-DETAIL
  entity. Primary clinical use remains cardiovascular; niche application
  is HIV patients on antiretrovirals (REPRIEVE trial 2023 — pitavastatin
  reduces MACE in HIV+ adults with low-to-moderate CV risk; clean DDI
  profile with most ART regimens including INSTI + TAF). Cancer-incidence
  signals from observational meta-analyses are limited (insufficient
  exposure-time in pivotal trials). Engine should NOT recommend statin
  initiation for cancer prevention. Limited availability in Ukraine —
  engine should not surface this option for UA-resident patients without
  confirming pharmacy availability.

notes_ua: >
  Пітавастатин — ліпофільний статин 3-го покоління з низьким CYP-
  профілем; основне FDA-показання — серцево-судинна профілактика, а
  також у ВІЛ-позитивних пацієнтів на АРТ (дослідження REPRIEVE 2023).
  У контексті хіміопрофілактики раку: даних обмаль, РКД немає; USPSTF,
  NCCN, ESMO НЕ рекомендують статини для профілактики раку.
  Особливості: мінімальний CYP-метаболізм — переважно UGT-лактонізація;
  чистий профіль взаємодій з АРТ — нішевий вибір для ВІЛ-пацієнтів з
  серцево-судинним ризиком. ДОСТУПНІСТЬ В УКРАЇНІ ОБМЕЖЕНА —
  двигун не повинен пропонувати без підтвердження наявності.

