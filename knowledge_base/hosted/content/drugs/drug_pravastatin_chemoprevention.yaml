id: DRUG-PRAVASTATIN-CHEMOPREVENTION
names:
  preferred: "Pravastatin (cancer chemoprevention context; statin class proxy)"
  ukrainian: "Правастатин (хіміопрофілактика раку; представник статинів)"
  english: "Pravastatin (cancer chemoprevention)"
  synonyms: ["Statin (pravastatin proxy)"]
  brand_names: ["Pravachol", "Lipostat"]
atc_code: C10AA03
rxnorm_id: "42463"
drug_class: "HMG-CoA reductase inhibitor (statin) — hydrophilic, first-generation"
mechanism: >
  Hydrophilic active-form statin (administered as the open beta-hydroxy
  acid, not a prodrug); competitively inhibits HMG-CoA reductase. Cancer-
  prevention rationale: shared statin pleiotropic effects (decreased
  isoprenoid prenylation of Ras/Rho, anti-inflammatory, antiproliferative,
  pro-apoptotic). PROSPER trial substudy and other observational
  analyses have produced inconsistent cancer-incidence signals — some
  suggesting a small reduction in colorectal cancer, none reaching RCT-
  level certainty for any specific malignancy. Hydrophilic profile,
  minimal CYP metabolism, and well-tolerated muscle profile make it a
  preferred statin in patients on extensive polypharmacy.

regulatory_status:
  fda:
    approved: true
    first_approval_year: 1991
    indications_brief:
      - "Primary and secondary CV prevention"
      - "Hypercholesterolemia / mixed dyslipidemia / heterozygous familial hypercholesterolemia"
      - "Adolescent heterozygous familial hypercholesterolemia"
      - "NOT FDA-labeled for cancer chemoprevention"
  ema:
    approved: true
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-18"
    notes: "Правастатин має обмежену присутність в Україні станом на 2026-05; атовастатин, розувастатин і симвастатин — основні доступні статини. Перевірено drlz.com.ua 2026-05-18."
typical_dosing: >
  Cardiovascular-prevention dosing range: 10-80 mg PO once daily (any
  time of day — no peak-synthesis timing requirement). Typical starting
  dose 10-40 mg/day; titrate per LDL target. No specific oncology-
  prevention dose. Hepatic impairment: start at 10 mg. Renal impairment:
  start at 10 mg if CrCl <30. Hepatic monitoring (baseline LFTs);
  CK only if symptomatic.
formulations:
  - "Tablet 10 mg, 20 mg, 40 mg, 80 mg"

absolute_contraindications:
  - "Active liver disease or unexplained persistent transaminase elevation (>3× ULN)"
  - "Pregnancy / lactation / women of reproductive potential without contraception"
  - "Hypersensitivity to pravastatin"
black_box_warnings: []
major_interactions:
  - "Cyclosporine — increased pravastatin AUC ~5-fold (OATP1B1 inhibition); limit to 20 mg/day"
  - "Clarithromycin, erythromycin — increased exposure; reduce dose or use alternative macrolide"
  - "Gemfibrozil — increased rhabdomyolysis risk; use fenofibrate if combo needed"
  - "Cholestyramine, colestipol — bind pravastatin in GI; separate by 1 h before / 4 h after"
  - "Warfarin — modest INR increase; monitor"
common_adverse_events:
  - "Myalgia / muscle aches (~2-5%; lowest among statins in trial reports)"
  - "Headache (~5%)"
  - "Nausea / dyspepsia (~3-5%)"
  - "Diarrhea (~2-3%)"
  - "Fatigue (~2-3%)"
  - "Nasopharyngitis (~3-5%)"
serious_adverse_events:
  - "Rhabdomyolysis with acute kidney injury (very rare; lowest reported among statins)"
  - "Hepatotoxicity (transaminase elevation; clinically significant hepatitis rare)"
  - "New-onset diabetes mellitus (modest increase, less than potent lipophilic statins)"
  - "Immune-mediated necrotizing myopathy (very rare)"
  - "Severe hypersensitivity (rare)"

pharmacology: {half_life_hours: 2, clearance: "Minimal CYP metabolism; sulfation and active hepatic uptake via OATP1B1; ~20% renal excretion; ~70% fecal (biliary + unabsorbed); active form delivered directly (no prodrug step)"}

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-WCRF-AICR-CUP-2018

last_reviewed: "2026-05-18"
notes: >
  STUB — v0.2 chemoprevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. STATIN CLASS-DETAIL
  entity. Primary clinical use remains cardiovascular. Pravastatin's main
  niche: extensive polypharmacy or muscle-symptom intolerance to other
  statins (lowest myopathy and DDI burden among statins; hydrophilic, no
  CYP3A4 substrate). Cancer-incidence signals from observational meta-
  analyses are modest and have NOT translated to RCT-level cancer-
  prevention recommendations. Limited availability in Ukraine — engine
  should not surface this option for UA-resident patients without
  confirming pharmacy availability.

notes_ua: >
  Правастатин — гідрофільний статин 1-го покоління, активна форма (не
  пролік); основне FDA-показання — серцево-судинна профілактика. У
  контексті хіміопрофілактики раку: спостережні мета-аналізи свідчать
  про скромні зниження захворюваності, РКД-доказів немає; USPSTF,
  NCCN, ESMO НЕ рекомендують статини для профілактики раку. Особливості:
  мінімальний метаболізм CYP — переважно сульфатація + транспорт OATP1B1;
  найнижча частота міопатії серед статинів — варіант при непереносимості
  інших статинів. ДОСТУПНІСТЬ В УКРАЇНІ ОБМЕЖЕНА — двигун не повинен
  пропонувати без підтвердження наявності в аптеках.

