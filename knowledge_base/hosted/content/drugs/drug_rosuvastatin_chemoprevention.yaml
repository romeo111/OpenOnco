id: DRUG-ROSUVASTATIN-CHEMOPREVENTION
names:
  preferred: "Rosuvastatin (cancer chemoprevention context; statin class proxy)"
  ukrainian: "Розувастатин (хіміопрофілактика раку; представник статинів)"
  english: "Rosuvastatin (cancer chemoprevention)"
  synonyms: ["Statin (rosuvastatin proxy)"]
  brand_names: ["Crestor", "Roxera", "Mertenil"]
atc_code: C10AA07
rxnorm_id: "301542"
drug_class: "HMG-CoA reductase inhibitor (statin) — hydrophilic, high-potency"
mechanism: >
  Hydrophilic, third-generation statin that competitively inhibits HMG-CoA
  reductase, the rate-limiting enzyme in mevalonate / cholesterol
  biosynthesis. Higher LDL-lowering potency than atorvastatin at equivalent
  doses. Cancer-prevention rationale: shared statin pleiotropic effects
  (decreased isoprenoid prenylation of Ras/Rho, anti-inflammatory,
  antiproliferative, pro-apoptotic), with observational meta-analyses
  suggesting modest reductions in CRC, hepatocellular, esophageal, and
  prostate cancer incidence. Rosuvastatin is hydrophilic and minimally
  CYP3A4-metabolized — different interaction profile than lipophilic
  statins (atorvastatin, simvastatin). Primary regulatory indication is
  cardiovascular risk reduction; cancer-prevention RCT-level evidence is
  ABSENT.

regulatory_status:
  fda:
    approved: true
    first_approval_year: 2003
    indications_brief:
      - "Primary and secondary CV prevention (including JUPITER trial low-LDL high-CRP population)"
      - "Hypercholesterolemia / mixed dyslipidemia / familial hypercholesterolemia"
      - "NOT FDA-labeled for cancer chemoprevention"
  ema:
    approved: true
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: true
    reimbursement_indications:
      - "Серцево-судинна профілактика / гіперліпідемія (НЕ рак-профілактика)"
    last_verified: "2026-05-18"
    notes: "Реімбурсується для CV-показань (вторинна профілактика, високий ризик; гетерозиготна сімейна гіперхолестеринемія); для хіміопрофілактики раку — позамедичне використання."
typical_dosing: >
  Cardiovascular-prevention dosing range: 5-40 mg PO once daily (with or
  without food). Typical starting dose 10-20 mg/day; titrate per LDL
  target. No specific oncology-prevention dose. Asian ancestry / mild-
  moderate renal impairment: start at 5 mg. CrCl <30: max 10 mg/day.
  Hepatic monitoring (baseline LFTs); CK only if symptomatic.
formulations:
  - "Tablet 5 mg, 10 mg, 20 mg, 40 mg"

absolute_contraindications:
  - "Active liver disease or unexplained persistent transaminase elevation (>3× ULN)"
  - "Pregnancy / lactation / women of reproductive potential without contraception"
  - "Hypersensitivity to rosuvastatin"
  - "Concurrent cyclosporine (markedly increased rosuvastatin exposure)"
black_box_warnings: []
major_interactions:
  - "Cyclosporine — contraindicated (substantial rosuvastatin AUC increase via OATP1B1 inhibition)"
  - "Gemfibrozil — increased rosuvastatin exposure ~2-fold; use fenofibrate if combo needed"
  - "Atazanavir/ritonavir, lopinavir/ritonavir — increased rosuvastatin exposure; limit dose to 10 mg/day"
  - "Warfarin — modest INR increase; monitor"
  - "Antacids (Al/Mg) — reduce rosuvastatin AUC; separate by ≥2 h"
common_adverse_events:
  - "Headache (~5-8%)"
  - "Myalgia / muscle aches (~3-10%; lower than equivalent-potency simvastatin)"
  - "Nausea (~3-5%)"
  - "Asthenia (~3-5%)"
  - "Nasopharyngitis (~3-5%)"
serious_adverse_events:
  - "Rhabdomyolysis with acute kidney injury (rare; ~1-3 per 100,000 patient-years; dose-related, increased in Asian ancestry)"
  - "Hepatotoxicity (transaminase elevation; clinically significant hepatitis rare)"
  - "New-onset diabetes mellitus (modest increase)"
  - "Immune-mediated necrotizing myopathy (very rare)"
  - "Proteinuria (transient; tubular, generally not clinically significant)"
  - "Severe hypersensitivity (rare)"

pharmacology: {half_life_hours: 19, clearance: "Minimal hepatic metabolism (~10% via CYP2C9, none via CYP3A4); hepatic uptake by OATP1B1 transporter; ~90% excreted unchanged in feces; renal ~10%"}

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-WCRF-AICR-CUP-2018

last_reviewed: "2026-05-18"
notes: >
  STUB — v0.2 chemoprevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. STATIN CLASS-DETAIL
  entity (alongside DRUG-ATORVASTATIN-CHEMOPREVENTION) for cancer-
  chemoprevention discussions. Primary clinical use remains cardiovascular.
  Cancer-incidence signals from observational meta-analyses are modest
  (~5-15% relative reductions in select sites) and have NOT translated to
  RCT-level cancer-prevention recommendations from USPSTF, NCCN, or ESMO.
  Engine should NOT recommend statin initiation for cancer prevention;
  appropriate when CV indications justify use. Class-vs-molecule effect
  debated — rosuvastatin is hydrophilic (vs lipophilic atorvastatin/
  simvastatin), interaction profile minimally CYP-dependent (mostly
  OATP1B1).

notes_ua: >
  Розувастатин — гідрофільний статин високої потужності; основне FDA-
  показання — серцево-судинна профілактика (включно з JUPITER trial для
  пацієнтів з низьким LDL і високим CRP). У контексті хіміопрофілактики
  раку: спостережні мета-аналізи свідчать про скромні зниження
  захворюваності (~5-15% для окремих локалізацій), але РКД-доказів немає;
  USPSTF, NCCN, ESMO НЕ рекомендують статини для профілактики раку.
  Двигун НЕ повинен ініціювати статин лише для профілактики раку;
  доречно, коли є серцево-судинні показання. Особливості: гідрофільний,
  взаємодії переважно через транспортер OATP1B1 (циклоспорин —
  протипоказання), мінімально CYP3A4. У азіатській популяції — нижчі
  стартові дози.

