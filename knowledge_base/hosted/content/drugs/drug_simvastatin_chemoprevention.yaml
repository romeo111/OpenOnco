id: DRUG-SIMVASTATIN-CHEMOPREVENTION
names:
  preferred: "Simvastatin (cancer chemoprevention context; statin class proxy)"
  ukrainian: "Симвастатин (хіміопрофілактика раку; представник статинів)"
  english: "Simvastatin (cancer chemoprevention)"
  synonyms: ["Statin (simvastatin proxy)"]
  brand_names: ["Zocor", "Vasilip", "Simgal"]
atc_code: C10AA01
rxnorm_id: "36567"
drug_class: "HMG-CoA reductase inhibitor (statin) — lipophilic, first-generation"
mechanism: >
  Lipophilic prodrug statin; intracellularly hydrolyzed to the active
  beta-hydroxy acid form, which competitively inhibits HMG-CoA
  reductase. Cancer-prevention rationale: shared statin pleiotropic
  effects (decreased isoprenoid prenylation of Ras/Rho, anti-inflammatory,
  antiproliferative, pro-apoptotic) plus the original 4S-secondary-CV-
  prevention RCT observational signal (lower colorectal-cancer
  incidence). RCT-level cancer-prevention evidence remains ABSENT.
  Higher rhabdomyolysis risk than atorvastatin/rosuvastatin at high
  doses; FDA dose-limit 80 mg restricted in 2011 due to myopathy
  signal. Primary regulatory indication is cardiovascular risk
  reduction.

regulatory_status:
  fda:
    approved: true
    first_approval_year: 1991
    indications_brief:
      - "Primary and secondary CV prevention"
      - "Hypercholesterolemia / mixed dyslipidemia / heterozygous familial hypercholesterolemia"
      - "Adolescent heterozygous familial hypercholesterolemia"
      - "NOT FDA-labeled for cancer chemoprevention"
  ema:
    approved: true
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: true
    reimbursement_indications:
      - "Серцево-судинна профілактика / гіперліпідемія (НЕ рак-профілактика)"
    last_verified: "2026-05-18"
    notes: "Реімбурсується для CV-показань (вторинна профілактика, високий ризик); для хіміопрофілактики раку — позамедичне використання. Один з найдешевших статинів — генерики широко доступні."
typical_dosing: >
  Cardiovascular-prevention dosing range: 5-40 mg PO once daily (evening
  dosing recommended due to peak nocturnal cholesterol synthesis).
  Typical starting dose 10-20 mg/day; titrate per LDL target.
  80 mg restricted by FDA (2011) — limit to patients who have tolerated
  80 mg ≥12 months without myopathy. No specific oncology-prevention
  dose. Hepatic monitoring (baseline LFTs); CK only if symptomatic.
  CrCl <30: start at 5 mg.
formulations:
  - "Tablet 5 mg, 10 mg, 20 mg, 40 mg, 80 mg"

absolute_contraindications:
  - "Active liver disease or unexplained persistent transaminase elevation (>3× ULN)"
  - "Pregnancy / lactation / women of reproductive potential without contraception"
  - "Hypersensitivity to simvastatin"
  - "Concurrent strong CYP3A4 inhibitors (itraconazole, ketoconazole, posaconazole, voriconazole, erythromycin, clarithromycin, telithromycin, HIV protease inhibitors, cobicistat, nefazodone, gemfibrozil, cyclosporine, danazol)"
black_box_warnings: []
major_interactions:
  - "Strong CYP3A4 inhibitors — CONTRAINDICATED (substantial simvastatin AUC increase, severe myopathy/rhabdomyolysis risk)"
  - "Gemfibrozil, cyclosporine, danazol — contraindicated combinations"
  - "Amiodarone, amlodipine, ranolazine, dronedarone, verapamil, diltiazem — limit simvastatin to 10-20 mg/day"
  - "Grapefruit juice — avoid (CYP3A4 inhibition increases simvastatin levels substantially)"
  - "Warfarin — modest INR increase; monitor"
  - "Digoxin — increased digoxin levels (~3-5%); generally not clinically significant"
common_adverse_events:
  - "Myalgia / muscle aches (~5-10%; dose-dependent — higher at 80 mg)"
  - "Arthralgia (~5%)"
  - "Headache (~5%)"
  - "Nausea / abdominal pain (~3-5%)"
  - "Constipation (~2-3%)"
  - "Upper respiratory infection (~3-5%)"
serious_adverse_events:
  - "Rhabdomyolysis with acute kidney injury (rare overall; dose-related — substantially higher at 80 mg)"
  - "Hepatotoxicity (transaminase elevation; clinically significant hepatitis rare)"
  - "New-onset diabetes mellitus (modest increase)"
  - "Immune-mediated necrotizing myopathy (very rare)"
  - "Severe hypersensitivity (rare)"

pharmacology: {half_life_hours: 2, clearance: "Hepatic CYP3A4 metabolism; extensive first-pass effect (bioavailability <5%); biliary excretion; active beta-hydroxy acid t1/2 ~2 h but extended pharmacodynamic effect"}

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-WCRF-AICR-CUP-2018

last_reviewed: "2026-05-18"
notes: >
  STUB — v0.2 chemoprevention-workstream authoring (batch 3); pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. STATIN CLASS-DETAIL
  entity (alongside DRUG-ATORVASTATIN-CHEMOPREVENTION and DRUG-
  ROSUVASTATIN-CHEMOPREVENTION). Primary clinical use remains
  cardiovascular. Cancer-incidence signals from observational meta-
  analyses are modest (~5-15% relative reductions in select sites) and
  have NOT translated to RCT-level cancer-prevention recommendations
  from USPSTF, NCCN, or ESMO. Engine should NOT recommend statin
  initiation for cancer prevention; appropriate when CV indications
  justify use. Heavy CYP3A4-substrate profile — substantial
  contraindicated-combination list — makes simvastatin a riskier choice
  than atorvastatin/rosuvastatin in patients on polypharmacy.

notes_ua: >
  Симвастатин — ліпофільний статин 1-го покоління, історичний
  представник класу (4S-trial 1994). Основне FDA-показання — серцево-
  судинна профілактика. У контексті хіміопрофілактики раку: спостережні
  мета-аналізи свідчать про скромні зниження захворюваності
  (~5-15% для окремих локалізацій), але РКД-доказів немає; USPSTF,
  NCCN, ESMO НЕ рекомендують статини для профілактики раку.
  Двигун НЕ повинен ініціювати симвастатин лише для профілактики раку;
  доречно, коли є серцево-судинні показання. Особливості: метаболізм
  переважно CYP3A4 — велика кількість протипоказаних комбінацій (азолові
  протигрибкові, макроліди, протеазні інгібітори ВІЛ, верапаміл/
  ділтіазем, циклоспорин, грейпфрутовий сік) — у пацієнтів на
  поліпрагмазії перевага аторвастатину/розувастатину.

