id: DRUG-FULVESTRANT
names:
  preferred: "Fulvestrant"
  ukrainian: "Фулвестрант"
  english: "Fulvestrant"
  brand_names: ["Faslodex"]
atc_code: L02BA03
rxnorm_id: null
drug_class: "SERD (selective estrogen receptor degrader)"
mechanism: >
  Pure ER antagonist — binds ER and induces its degradation, with no agonist activity. Standard of care second-line endocrine therapy for HR+/HER2- metastatic, especially after AI failure.

typical_dosing: >
  500 mg IM as two 5 mL injections, one in each buttock, on days 1, 15, and
  29, then once monthly; use the product-specific label and combination-
  regimen instructions.

regulatory_status:
  fda: {approved: true}
  ema: {approved: true}
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: true
    reimbursement_indications:
      - "Метастатичний HR+/HER2- рак молочної залози (моно- або у комбінації з CDK4/6i / alpelisib)"
    last_verified: "2026-04-27"
    notes: "Reimbursed for HR+/HER2- metastatic."
key_toxicities:
  - Injection-site reactions (~14%)
  - Hot flashes
  - Bone pain
  - Fatigue
  - Hepatic transaminase elevations (mild)
  - Same general endocrine-deprivation effects as AIs

common_adverse_events:
  - "Injection-site pain"
  - "Nausea, fatigue, hot flashes, headache, and musculoskeletal pain"
  - "Increased hepatic enzymes"
serious_adverse_events:
  - "Clinically significant hepatic impairment requires clinician assessment"
major_interactions:
  - "The referenced U.S. label reports no known drug-drug interactions; verify the current product label when adding combination therapy."
absolute_contraindications:
  - "Known hypersensitivity to fulvestrant or formulation components"

sources: [SRC-NCCN-BREAST-2025, SRC-ESMO-BREAST-METASTATIC-2024, SRC-DAILYMED-FULVESTRANT-2025]
last_reviewed: "2026-08-02"
notes: >
  Workhorse 2L endocrine therapy. Combined with palbociclib (PALOMA-3), ribociclib (MONALEESA-3), abemaciclib (MONARCH-2) for CDK4/6i-naive disease, or after CDK4/6i progression as monotherapy or with alpelisib (PIK3CA-mutant).

notes_ua: >
  Фулвестрант (fulvestrant) — основний препарат 2-ї лінії ендокринної
  терапії при HR+/HER2-негативному метастатичному РМЗ. Комбінується з
  палбоциклібом (PALOMA-3), рибоциклібом (MONALEESA-3), абемациклібом
  (MONARCH-2) у CDK4/6i-наївних пацієнток, або застосовується як
  монотерапія / з алпелісибом (при PIK3CA-мутації) після прогресування
  на CDK4/6-інгібіторах.

ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_14a
draft_revision: 2

notes_patient: >
  Ін'єкція раз на місяць у м'язи: повністю руйнує естрогеновий рецептор у пухлинних клітинах (SERD). Використовується при раку грудей HR+, часто разом з CDK4/6-інгібіторами.
