id: DRUG-IMIQUIMOD
names:
  preferred: "Imiquimod"
  ukrainian: "Імiквімод"
  english: "Imiquimod"
  brand_names: ["Aldara", "Zyclara"]
atc_code: D06BB10
rxnorm_id: null
drug_class: "Topical immune response modifier (Toll-like receptor 7 [TLR7] agonist)"
mechanism: >
  Synthetic imidazoquinoline TLR7 agonist. Binds TLR7 on plasmacytoid
  dendritic cells and monocytes/macrophages, triggering NF-κB-mediated
  release of IFN-α, TNF-α, and other pro-inflammatory cytokines. Induces
  a local Th1-skewed innate + cell-mediated immune response against
  virally-infected or dysplastic epithelium; not directly cytotoxic or
  antiviral itself. Used topically for HPV-associated and field-
  cancerization lesions (external genital warts, actinic keratosis,
  superficial BCC) where local immune-mediated clearance is desired.

regulatory_status:
  fda:
    approved: true
    year_first_approval: 1997
    indications_brief:
      - "External genital and perianal warts (condyloma acuminata)"
      - "Actinic keratosis (face/scalp)"
      - "Superficial basal cell carcinoma"
      - "Off-label: penile/vulvar/perianal intraepithelial neoplasia (HSIL) field therapy"
  ema:
    approved: true
    year_first_approval: 1998
  ukraine_registration:
    registered: true
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-07-11"
    notes: >
      Aldara (imiquimod 5% cream) наявний на українському ринку для
      генітальних кондилом / актинічного кератозу; off-label застосування
      при Tis (carcinoma in situ) пенісу не покривається програмою
      медичних гарантій — доступ через самостійну оплату.

typical_dosing: >
  Genital warts (on-label): 5% cream applied 3x/week (e.g., Mon/Wed/Fri)
  at bedtime, washed off after 6-10 hours, for up to 16 weeks.
  Actinic keratosis: 5% cream 2x/week for 16 weeks (face/scalp) or 3.75%
  cream once daily for two 2-week cycles.
  Off-label penile intraepithelial neoplasia / Tis: dosing extrapolated
  from genital-wart / vulvar-HSIL protocols (typically 3x/week for
  6-16 weeks with response-guided duration) — individualize with
  dermatology/urology; not FDA-labeled for this indication.
formulations:
  - "Topical cream 5% (250 mg single-use sachets)"
  - "Topical cream 3.75% (pump, AK-labeled)"

absolute_contraindications:
  - "Known hypersensitivity to imiquimod or cream components"

black_box_warnings: []

common_adverse_events:
  - "Local application-site erythema, erosion, excoriation (expected pharmacologic effect — often required for efficacy)"
  - "Pruritus / burning at application site"
  - "Flu-like symptoms (fatigue, myalgia) with extensive application area"
  - "Regional lymphadenopathy (reactive, from local immune activation)"

serious_adverse_events:
  - "Severe local inflammatory reaction requiring treatment interruption"
  - "Rare systemic flu-like syndrome / fever with large application areas"
  - "Rare exacerbation of autoimmune conditions (case reports — psoriasis flare, vitiligo)"

major_interactions: []

pharmacology:
  half_life_hours: null
  half_life_notes: "Minimal systemic absorption with topical use (<0.9% of applied dose detected in plasma in PK studies)."
  clearance: null
  metabolism: "Primarily local/dermal; negligible systemic metabolism given minimal absorption"

sources:
  - SRC-EAU-PENILE-2024

