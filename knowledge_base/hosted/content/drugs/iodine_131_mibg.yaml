id: DRUG-IODINE-131-MIBG
names:
  preferred: "Iodine-131 metaiodobenzylguanidine (I-131 MIBG)"
  ukrainian: "Йод-131 метайодбензилгуанідин (I-131 MIBG)"
  english: "Iodine-131 MIBG (iobenguane I 131)"
  brand_names: []
  synonyms: ["131I-MIBG", "radioiodinated MIBG therapy", "iobenguane I-131"]
atc_code: null
rxnorm_id: null
drug_class: "Norepinephrine-analogue radiopharmaceutical (beta-emitter)"
mechanism: >
  Metaiodobenzylguanidine (MIBG) is a norepinephrine analogue taken up
  by the noradrenaline transporter (NET/SLC6A2) expressed on
  catecholamine-secreting neuroendocrine cells, concentrating
  selectively in pheochromocytoma / paraganglioma (PPGL) tissue when
  labeled with the beta-emitting radionuclide iodine-131. Tumor
  selection requires a positive diagnostic MIBG scan (I-123 or I-131
  scintigraphy) confirming MIBG avidity before therapeutic
  administration -- disease that is MIBG-non-avid does not benefit from
  this modality and is instead routed to systemic TKI therapy
  (sunitinib / cabozantinib) per ALGO-PHEO-1L.
regulatory_status:
  fda: {approved: true}
  ema: {approved: true}
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-07-11"
    notes: >
      Not verified as registered in Ukraine in this session. Requires
      specialized nuclear-medicine infrastructure (radiation-safety-
      licensed inpatient isolation for high-activity therapeutic I-131
      administration) that is likely concentrated in very few Ukrainian
      centers, if any -- mirrors the access-barrier pattern already
      documented for DRUG-RADIUM-223 and DRUG-LUTETIUM-177-PSMA in this
      KB. Cross-border referral to an EU nuclear-medicine center is the
      likely access pathway pending local verification.
typical_dosing: >
  Weight-based / patient-specific therapeutic activity administered
  intravenously in a specialized nuclear-medicine facility with
  radiation-safety isolation, following pre-therapy dosimetry and a
  confirmatory diagnostic MIBG scan; may be given as staged therapeutic
  administrations. Exact activity-per-kg, dose-fractionation schedule,
  and inter-dose interval are governed by patient-specific dosimetry and
  current product labeling and are deliberately NOT stated as fixed
  numbers in this stub -- the drafting agent is not confident enough in
  its recollection of the precise licensed dosing regimen to assert it
  as fact; a maintainer with access to the current product label should
  populate this field before non-draft use.
key_toxicities:
  - "Myelosuppression (dose-limiting; neutropenia, thrombocytopenia -- delayed onset, weeks after administration)"
  - "Nausea / vomiting (acute, radiopharmaceutical-related)"
  - "Hypothyroidism (thyroid uptake of free radioiodine -- thyroid blockade with potassium iodide/iodate mandatory before and after administration)"
  - "Sialoadenitis / dry mouth"
  - "Fatigue"
  - "Secondary malignancy risk (long-term, radiation-related)"
  - "Radiation safety precautions required for patient, caregivers, and staff during and after administration"
sources:
  - SRC-NCCN-NET-2025
last_reviewed: null
notes: >
  Radiopharmaceutical option for metastatic/unresectable, MIBG-avid
  pheochromocytoma or paraganglioma, mirroring how other beta/alpha-
  emitting radiopharmaceuticals (DRUG-RADIUM-223, DRUG-LUTETIUM-177-PSMA)
  are modelled in this KB. MIBG avidity on diagnostic scintigraphy is a
  prerequisite for this therapy; MIBG-non-avid disease is not a
  candidate and follows the systemic-therapy track instead (see
  ALGO-PHEO-1L). Requires thyroid blockade (potassium iodide/iodate)
  around administration to protect the thyroid from free radioiodine.
  An FDA-approved product (iobenguane I-131, brand Azedra) exists for
  this indication, but the drafting agent did not independently verify
  its precise licensed activity/kg dosing regimen this session --
  precise numbers are deliberately left unstated pending maintainer
  verification against current product labeling. STUB pending clinical
  co-lead signoff (CHARTER §6.1, dev-mode-exempted).
