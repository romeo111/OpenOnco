id: DRUG-LOMUSTINE
names:
  preferred: "Lomustine (CCNU)"
  ukrainian: "Ломустин"
  english: "Lomustine"
  synonyms:
    - "CCNU"
    - "CeeNU"

drug_class: "Alkylating agent (nitrosourea)"
mechanism: "DNA alkylation and cross-linking; crosses blood-brain barrier; myelosuppressive"
formulations:
  - "10 mg, 40 mg, 100 mg oral capsules"
route: PO
typical_dosing: >
  U.S. label: 130 mg/m² PO as a single dose every 6 weeks; the treating
  oncology team must determine regimen-specific dosing and any adjustment
  from prior blood-count nadirs.

common_adverse_events:
  - "Delayed myelosuppression (nadir 4-6 weeks; recovery 6-8 weeks)"
  - "Nausea/vomiting (onset 2-6 hours after dose)"
  - "Hepatotoxicity (transaminase elevation)"
  - "Pulmonary fibrosis (cumulative dose-related)"

black_box_warnings:
  - "Severe bone marrow suppression — do not administer more frequently than every 6 weeks"

absolute_contraindications: []

serious_adverse_events:
  - "Fatal delayed, cumulative myelosuppression with infection or bleeding"
  - "Fatal overdose when more than one intended dose is dispensed or taken"

regulatory_status:
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-05-09"
    notes: >
      Lomustine (CCNU) not currently registered or reimbursed in Ukraine.
      PCV chemotherapy is rarely administered in Ukraine; lomustine typically
      requires compassionate-use import if needed for REG-RT-PCV-LGG.
      Named-patient import or cross-border procurement required.

last_reviewed: "2026-05-08"
review_status: stub
drafted_by: claude_extraction
sources:
  - SRC-DAILYMED-LOMUSTINE-2026
notes: >
  STUB — minimal entry to satisfy FK reference from REG-RT-PCV-LGG.
  Requires clinical signoff before publication. U.S. labeling requires blood-
  count monitoring for at least six weeks after each dose and warns against
  dosing more often than every six weeks; local availability must be confirmed
  separately.
notes_patient: >
  Цей препарат приймають лише за точним графіком онкологічної команди.
  Не можна приймати додаткову дозу або повторювати її раніше призначеного
  дня; перед кожним наступним циклом лікар оцінює аналізи крові.
