typical_dosing: >
  Oral, 500 mg scored tablets. Initiated at 2-3 g/day PO in divided doses
  (higher starting doses of 4-6 g/day may be used when rapid disease
  control is urgent), taken with fatty meals to enhance absorption.
  Dose is increased progressively — typically at ~2-week intervals under
  standard conditions, or as often as weekly if expedited control is
  needed — guided by tolerability and mitotane blood level, toward a
  target therapeutic blood level of 14-20 mg/L (levels above 20 mg/L risk
  toxicity without additional antitumor benefit). Blood-level monitoring
  is required after each dose adjustment and at frequent intervals (e.g.
  every 2 weeks) during titration, then monthly at a stable maintenance
  dose, and roughly every 2 months after any treatment interruption.
  Mitotane's very long and variable elimination half-life (reported range
  18-159 days, median ~53 days, reflecting extensive storage in adipose
  tissue) means blood levels lag dose changes by weeks — do not
  up-titrate faster than the level-monitoring interval allows. Free
  cortisol and ACTH (rather than total cortisol, which is confounded by
  mitotane-induced elevation of cortisol-binding globulin) are used to
  guide glucocorticoid replacement dosing. Source: EU SmPC (Mitotane
  Esteve 500 mg tablets) — verify against institutional protocol before
  clinical use; this is a STUB pending clinical co-lead sign-off.

formulations:
  - "Oral tablet, 500 mg, scored (Lysodren / Mitotane Esteve)"

absolute_contraindications:
  - "Severe hypersensitivity to mitotane"
  - "Pregnancy (embryo-fetal toxicity in animal studies; adrenolytic mechanism is a plausible direct fetal risk)"
  - "Severe hepatic impairment (relative — reassess risk/benefit; hepatic metabolism affected)"

black_box_warnings:
  - "Adrenal insufficiency — mitotane is adrenolytic to both normal and malignant adrenocortical tissue; essentially all patients (100% with non-functional tumors, ~75% with functional tumors per EU SmPC) develop adrenal insufficiency and require glucocorticoid (+/- mineralocorticoid) replacement; unrecognized adrenal crisis during intercurrent illness, trauma, or surgery can be fatal."
  - "CNS toxicity at supratherapeutic blood levels (>20 mg/L) — lethargy, dizziness, vertigo, ataxia, confusion; use blood-level monitoring to stay within the 14-20 mg/L therapeutic window."
  - "Embryo-fetal toxicity — contraindicated in pregnancy; effective contraception required during and after treatment given the drug's very long half-life."

common_adverse_events:
  - "Gastrointestinal: nausea, vomiting, diarrhea, anorexia — very common, often dose-limiting early in titration"
  - "CNS: lethargy, dizziness, vertigo — common, dose/level-related"
  - "Hypercholesterolemia / dyslipidemia — common, mitotane raises total and LDL cholesterol via effects on lipid-carrier proteins"
  - "Skin rash"
  - "Gynecomastia (in men) — related to mitotane's effect on sex-hormone-binding globulin and free-hormone ratios"
  - "Fatigue"

serious_adverse_events:
  - "Adrenal insufficiency / adrenal crisis (near-universal — see black-box warning)"
  - "CNS toxicity at supratherapeutic levels — ataxia, confusion, progressing to stupor if levels are not corrected"
  - "Hepatotoxicity (transaminase elevation)"
  - "Prolonged bleeding time / coagulopathy (reported, mechanism not fully characterized)"
  - "Leukopenia (reported, uncommon)"

major_interactions:
  - "Warfarin and other CYP-metabolized anticoagulants — mitotane's potent CYP3A4 induction reduces anticoagulant effect; close INR monitoring and dose adjustment required"
  - "CYP3A4-substrate drugs broadly (including hydrocortisone/glucocorticoid replacement itself, oral contraceptives, many statins, other CYP3A4-metabolized cancer therapies) — mitotane induction reduces exposure; glucocorticoid replacement typically requires higher-than-standard doses"
  - "Spironolactone — may antagonize mitotane's adrenolytic/antitumor effect; generally avoided"
  - "Other CYP3A4-metabolized concurrent chemotherapy (relevant when combined with EDP per FIRM-ACT) — monitor for altered exposure"

pharmacology:
  half_life_notes: "Extremely long and variable elimination half-life, reported range ~18-159 days (median ~53 days), reflecting extensive storage in adipose tissue. Drives the need for gradual titration, delayed blood-level response to dose changes (weeks), and persistence of effect for weeks to months after discontinuation."
  metabolism: "Hepatic; mitotane is itself a potent, durable inducer of CYP3A4 (autoinduction and induction of co-administered drug metabolism)"

sources:
  - SRC-ESMO-ACC-2020
  - SRC-ENSAT-ACC-2018
  - SRC-FIRM-ACT-FASSNACHT-2012
  - SRC-ADIUVO-TERZOLO-2023
last_reviewed: "2026-07-11"
reviewers: []
notes: >
  STUB pending clinical co-lead sign-off (CHARTER §6.1). The only
  FDA/EMA-approved adrenal-cortex-specific cytotoxic agent; used as (1)
  adjuvant monotherapy after resection in high-recurrence-risk stage I-III
  ACC, and (2) continuously alongside EDP chemotherapy (etoposide +
  doxorubicin + cisplatin) in advanced/metastatic disease per the
  FIRM-ACT trial (Fassnacht 2012, NEJM). Dosing, titration cadence, target
  blood level (14-20 mg/L), and adrenal-insufficiency incidence figures
  are sourced from the EU SmPC for Mitotane Esteve 500 mg tablets
  (medicines.org.uk/emc/product/101074) — verify against institutional
  protocol and the primary ENSAT/ESMO guideline text before clinical use.
  The randomized ADIUVO trial (Terzolo 2023) found no significant benefit
  from adjuvant mitotane in a lower/intermediate-recurrence-risk resected
  population (stage I-III, R0, Ki-67 <=10%), so this KB restricts the
  adjuvant-mitotane Indication (IND-ACC-1L-RESECTION-MITOTANE) to a
  higher-recurrence-risk subgroup — see that Indication and
  RF-ACC-HIGH-RECURRENCE-RISK-BIOLOGY for detail.
