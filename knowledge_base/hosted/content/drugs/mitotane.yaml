id: DRUG-MITOTANE
names:
  preferred: "Mitotane"
  ukrainian: "Мітотан"
  english: "Mitotane"
  synonyms: ["o,p'-DDD", "o,p'-dichlorodiphenyldichloroethane"]
  brand_names: ["Lysodren", "Mitotane Esteve"]
atc_code: L01XX23
rxnorm_id: null
drug_class: "Adrenolytic cytotoxic agent (DDT/o,p'-DDD derivative) — the only ACC-specific approved cytotoxic drug"
mechanism: >
  Mitotane is a chlorinated hydrocarbon derivative of the insecticide DDT
  with selective adrenolytic activity. It accumulates in adrenocortical
  cells and is metabolized (partly CYP11B1-dependent) to a reactive acyl
  chloride metabolite that covalently binds mitochondrial and other
  cellular proteins, producing structural mitochondrial damage and direct
  cytotoxic necrosis of both normal and malignant adrenocortical tissue
  (zona fasciculata/reticularis predominantly). It also inhibits several
  steroidogenic enzymes (side-chain cleavage/CYP11A1, 3-beta-HSD, 11-beta-
  hydroxylase/CYP11B1) and is a potent, durable inducer of hepatic CYP3A4,
  which increases cortisol clearance and reduces exposure of many
  co-administered CYP3A4-metabolized drugs. The adrenolytic effect is not
  tumor-selective: essentially all patients develop drug-induced adrenal
  insufficiency and require glucocorticoid (+/- mineralocorticoid)
  replacement. Mitotane is used both as adjuvant monotherapy after
  resection in high-recurrence-risk disease and, continuously, alongside
  EDP (etoposide+doxorubicin+cisplatin) cytotoxic chemotherapy in advanced
  disease (FIRM-ACT regimen).

