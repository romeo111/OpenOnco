typical_dosing: >
  Cushing disease: pasireotide SC starting dose 0.6 mg subcutaneously twice
  daily, titrated per cortisol response and tolerability (product-label
  range approximately 0.3-0.9 mg SC BID); long-acting pasireotide LAR 10 mg
  IM every 4 weeks is an alternative for Cushing disease not amenable to
  surgery, titrated per response. Acromegaly: pasireotide LAR starting dose
  40 mg IM every 4 weeks, titrated up to 60 mg IM q4w per IGF-1 response,
  typically reserved for inadequate response to first-generation SSA
  (octreotide/lanreotide). Confirm exact titration schedule with treating
  endocrinology team.

key_toxicities:
  - Hyperglycemia / new-onset diabetes (more frequent and more pronounced than first-generation SSA, related to potent SSTR5-mediated insulin/incretin suppression — proactive glucose monitoring and antihyperglycemic therapy required from treatment start)
  - Diarrhea, nausea, abdominal pain
  - Cholelithiasis
  - Bradycardia, QT prolongation (baseline and periodic ECG; caution with other QT-prolonging drugs)
  - Adrenal insufficiency / hypocortisolism (Cushing disease use — from effective cortisol lowering; monitor for over-treatment)
  - Injection site reactions (LAR) / liver enzyme elevation

