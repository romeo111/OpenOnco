id: DRUG-PASIREOTIDE
names:
  preferred: "Pasireotide"
  ukrainian: "Пасиреотид"
  english: "Pasireotide"
  brand_names: ["Signifor", "Signifor LAR"]
atc_code: H01CB05
rxnorm_id: null
drug_class: "Somatostatin analogue (multi-receptor SSTR1/2/3/5, high SSTR5 affinity)"
mechanism: >
  Cyclohexapeptide somatostatin analogue binding SSTR1, SSTR2, SSTR3, and
  particularly SSTR5 — the receptor subtype most highly expressed on
  corticotroph adenomas — distinguishing pasireotide from the largely
  SSTR2-selective first-generation SSAs (octreotide, lanreotide). Suppresses
  ACTH secretion from corticotroph adenomas (Cushing disease) and, via
  SSTR2/SSTR5, GH/IGF-1 secretion from somatotroph adenomas (acromegaly),
  including tumors with an inadequate response to first-generation SSA.
  Two formulations: subcutaneous (short-acting, Cushing disease) and
  long-acting release (LAR, intramuscular monthly — acromegaly and
  surgery-ineligible/persistent Cushing disease).

