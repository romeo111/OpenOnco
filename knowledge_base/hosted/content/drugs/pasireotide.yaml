  Cushing disease and is also listed among acromegaly SSA options. Modeled
  here as a single Drug entity covering both SC (Cushing) and LAR
  (acromegaly + surgery-ineligible Cushing) formulations, consistent with
  how this KB models other multi-formulation drugs. Steroidogenesis
  inhibitors named alongside pasireotide in the Cushing narrative
  (ketoconazole, metyrapone, osilodrostat) are not separately authored as
  Drug entities in this pass — see DIS-PITUITARY-ADENOMA proposal notes.
