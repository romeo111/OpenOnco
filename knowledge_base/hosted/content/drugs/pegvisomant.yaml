    notes: >
      Реєстраційний статус Somavert (пегвісомант) в Україні не перевірено в
      рамках цього чорнового опрацювання — препарат є рідкісним/вузько-
      спеціалізованим і, ймовірно, доступний переважно через програми
      compassionate use або іменні поставки. Потребує підтвердження перед
      публікацією.

typical_dosing: >
  Loading dose 40 mg SC (under medical supervision), then 10 mg SC once
  daily; titrate in 5 mg increments every 4-6 weeks according to serum IGF-1,
  to a usual maintenance range of 10-30 mg/day (maximum 30 mg/day per
  product label). Confirm exact titration schedule with treating
  endocrinology team.

key_toxicities:
  - Hepatotoxicity (transaminase elevation — monitor LFTs at baseline, monthly for the first 6 months, then periodically; more frequent monitoring when combined with a somatostatin analogue)
  - Injection site reactions / lipohypertrophy (rotate injection sites)
  - Headache
  - Pituitary/adenoma size not directly reduced by this agent (GH itself is not suppressed) — continued periodic pituitary MRI surveillance needed
  - Improvement in glucose metabolism/insulin sensitivity (contrasts with somatostatin analogues, which can worsen glycemia)

