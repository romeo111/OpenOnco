id: DRUG-PEGVISOMANT
names:
  preferred: "Pegvisomant"
  ukrainian: "Пегвісомант"
  english: "Pegvisomant"
  brand_names: ["Somavert"]
atc_code: H01AX01
rxnorm_id: null
drug_class: "Growth hormone receptor antagonist (PEGylated GH analog)"
mechanism: >
  PEGylated recombinant human growth-hormone-receptor antagonist. Binds GH
  receptors and blocks GH-induced receptor dimerization and downstream
  signal transduction, lowering IGF-1 production without lowering circulating
  GH levels — it does not directly shrink the somatotroph adenoma. Used for
  biochemically persistent/residual acromegaly (elevated IGF-1) after
  transsphenoidal surgery and/or somatostatin-analogue therapy, either as an
  add-on to continuing SSA or as monotherapy when SSA is not tolerated or
  effective.

regulatory_status:
  fda: {approved: true}
  ema: {approved: true}
  ukraine_registration:
