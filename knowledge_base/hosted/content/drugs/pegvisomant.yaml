notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1 — dev-mode-exempted,
  safe to merge as draft content, not published/verified clinical advice).
  Pegvisomant is used for residual/persistent acromegaly per the Disease
  narrative, typically added to or substituted for somatostatin-analogue
  therapy after surgery. Does not lower GH/tumor size — IGF-1 is the
  biochemical target of titration.
