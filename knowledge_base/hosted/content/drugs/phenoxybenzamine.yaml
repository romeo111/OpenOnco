id: DRUG-PHENOXYBENZAMINE
names:
  preferred: "Phenoxybenzamine"
  ukrainian: "Феноксибензамін"
  english: "Phenoxybenzamine"
  brand_names: ["Dibenzyline"]
  synonyms: ["non-selective irreversible alpha blocker"]
atc_code: C04AX02
rxnorm_id: null
drug_class: "Non-selective, irreversible alpha-1/alpha-2 adrenergic receptor antagonist"
mechanism: >
  Covalently and irreversibly binds alpha-1 and alpha-2 adrenergic
  receptors, producing a long-acting, non-competitive blockade of
  catecholamine-mediated vasoconstriction. In pheochromocytoma /
  paraganglioma (PPGL), preoperative alpha-blockade with
  phenoxybenzamine (or a selective alpha-1 blocker such as doxazosin)
  is mandatory before surgery to prevent an intraoperative
  hypertensive crisis from catecholamine release during tumor
  manipulation (Endocrine Society 2014 PPGL guideline). Alpha-2
  blockade component can cause reflex tachycardia and orthostatic
  hypotension, which is more pronounced than with selective alpha-1
  agents.
regulatory_status:
  fda: {approved: true}
  ema: {approved: true}
  ukraine_registration:
    registered: false
    registration_number: null
    reimbursed_nszu: false
    reimbursement_indications: []
    last_verified: "2026-07-11"
    notes: >
      Registration status in Ukraine not verified in this session --
      phenoxybenzamine has limited global manufacturing/distribution and
      availability should be confirmed locally; doxazosin (widely
      available generic antihypertensive) is the practical default
      alpha-blocker in settings where phenoxybenzamine is not stocked.
typical_dosing: >
  Starting dose typically 10 mg PO BID, titrated upward in 10-20 mg/day
  increments every few days to achieve blood-pressure normalization and
  resolution of orthostatic/paroxysmal symptoms, per Endocrine Society
  2014 PPGL guideline (SRC-ENDOCRINE-SOCIETY-PPGL-2014); usual
  preoperative course runs roughly one to two weeks before surgery to
  allow adequate, sustained alpha-blockade and intravascular volume
  re-expansion. Exact target BP/HR thresholds and final maintenance dose
  are individualized by the treating team and are NOT fixed numeric
  values in this stub -- see RF-PHEO-INADEQUATE-ALPHA-BLOCKADE for the
  hard sequencing gate this drug exists to satisfy.
formulations:
  - "10 mg oral capsule"
absolute_contraindications: []
black_box_warnings: []
major_interactions:
  - "Concurrent beta-blockade before adequate alpha-blockade is established -- unopposed alpha-stimulation can precipitate hypertensive crisis; beta-blockers should only be added AFTER alpha-blockade is underway"
  - "Other antihypertensives -- additive hypotensive/orthostatic effect"
common_adverse_events:
  - "Orthostatic hypotension"
  - "Reflex tachycardia"
  - "Nasal congestion"
  - "Fatigue / drowsiness"
  - "Miosis"
  - "Inhibition of ejaculation (irreversible alpha-2 blockade)"
serious_adverse_events:
  - "Severe orthostatic hypotension / syncope"
  - "Reflex tachyarrhythmia"
sources:
  - SRC-ENDOCRINE-SOCIETY-PPGL-2014
  - SRC-NCCN-NET-2025
last_reviewed: "2026-07-11"
notes: >
  Historically the guideline-preferred agent for preoperative PPGL
  alpha-blockade because its irreversible, long-acting blockade is
  harder to overcome with catecholamine surge during tumor handling;
  doxazosin (selective, reversible alpha-1 blocker; see DRUG-DOXAZOSIN)
  is a widely used, more available and better-tolerated alternative with
  less reflex tachycardia -- choice between the two is per local
  practice/availability, not modelled as a KB-level preference. STUB
  pending clinical co-lead signoff (CHARTER §6.1, dev-mode-exempted).
