id: DRUG-TORIPALIMAB
names:
  preferred: "Toripalimab"
  ukrainian: "Торипалімаб"
  english: "Toripalimab"
  synonyms: ["toripalimab-tpzi", "JS001"]
  brand_names: ["Loqtorzi", "Tuoyi"]
drug_class: "Anti-PD-1 humanized IgG4 monoclonal antibody (immune checkpoint inhibitor)"
mechanism: >
  Humanized IgG4 monoclonal antibody binding the programmed cell death
  protein 1 (PD-1) receptor on activated T cells, blocking PD-1/PD-L1
  and PD-1/PD-L2 interactions and restoring cytotoxic T-cell antitumor
  activity. Same general anti-PD-1 mechanistic class as pembrolizumab
  (DRUG-PEMBROLIZUMAB) and nivolumab (DRUG-NIVOLUMAB). Studied
  specifically in EBV-associated nasopharyngeal carcinoma (NPC), a
  tumor type with a distinctly inflamed, EBV-antigen-driven immune
  microenvironment.

regulatory_status:
  fda:
    approved: true
    year_first_approval: 2023
    indications_brief:
      - "Recurrent unresectable or metastatic nasopharyngeal carcinoma (NPC), in combination with cisplatin and gemcitabine, as first-line treatment (JUPITER-02)"
      - "Recurrent unresectable or metastatic NPC, as monotherapy, with disease progression on or after platinum-containing chemotherapy"
  ema:
    approved: false
  ukraine_registration:
    registered: false
    reimbursed_nszu: false
    reimbursement_indications: []
    notes: "Not registered in Ukraine as of authoring (2026-07). Access, if needed, would be via clinical trial enrollment, named-patient/compassionate import, or cross-border referral only -- to be confirmed by Clinical Co-Lead / access-pathway review."

typical_dosing: >
  Per US FDA label (Loqtorzi) and the JUPITER-02 trial protocol:
  toripalimab 240 mg IV every 3 weeks, combined with gemcitabine +
  cisplatin (GP) for up to 6 cycles, followed by toripalimab
  monotherapy (240 mg IV q3w, or 480 mg IV q6w per label) until
  disease progression, unacceptable toxicity, or up to 2 years total.
  STUB — dosing drafted from trial-protocol/label recall; pending
  Clinical Co-Lead confirmation against the primary FDA label text.

formulations:
  - "IV solution, single-dose vial (240 mg/6 mL per US label)"

absolute_contraindications:
  - "Severe hypersensitivity to toripalimab or excipients"

black_box_warnings: []

common_adverse_events:
  - "Fatigue"
  - "Hypothyroidism / thyroid dysfunction"
  - "Rash / pruritus"
  - "Nausea (class effect, more attributable to concurrent GP backbone)"
  - "Elevated liver transaminases"
  - "Anemia (class effect, more attributable to concurrent GP backbone)"
  - "Infusion-related reactions (uncommon)"

serious_adverse_events:
  - "Immune-mediated pneumonitis"
  - "Immune-mediated colitis"
  - "Immune-mediated hepatitis"
  - "Immune-mediated endocrinopathies (thyroiditis, hypophysitis, adrenal insufficiency, type 1 diabetes)"
  - "Immune-mediated nephritis"
  - "Severe immune-mediated skin reactions (SJS/TEN — rare)"
  - "Infusion-related reactions (severe, rare)"

major_interactions:
  - "Concurrent non-physiologic-dose systemic corticosteroids / immunosuppressants — may attenuate efficacy (avoid except for irAE management)"
  - "Live vaccines — avoid"

sources:
  - SRC-JUPITER-02-MAI-2021

last_reviewed: "2026-07-11"
reviewers: []
notes: >
  STUB — draft entity pending Clinical Co-Lead sign-off (CHARTER §6.1;
  currently dev-mode-exempted). Anti-PD-1 backbone of NPC metastatic
  1L combination per JUPITER-02 (Mai HQ et al., Nat Med 2021):
  toripalimab + gemcitabine + cisplatin significantly improved PFS/ORR
  vs chemo alone in treatment-naive recurrent/metastatic NPC, leading
  to FDA approval (Loqtorzi) Oct 2023. Reuse this entity rather than
  duplicate. Distinct from camrelizumab (DRUG-CAMRELIZUMAB), a
  separate anti-PD-1 antibody studied in CAPTAIN-1st for the same
  indication — not interchangeable identities despite similar
  mechanism/regimen role.
notes_ua: >
  ЗАГОТОВКА — чернетковий запис, очікує підпису клінічного
  ко-лідера (CHARTER §6.1; наразі звільнено в dev-режимі). Анти-PD-1
  основа метастатичної 1L комбінації NPC за дослідженням JUPITER-02
  (Mai HQ та співавт., Nat Med 2021): торипалімаб + гемцитабін +
  цисплатин значуще покращили ВБП/ЗРВ порівняно з хіміотерапією
  окремо у нелікованих пацієнтів з рецидивуючою/метастатичною NPC,
  що призвело до схвалення FDA (Loqtorzi) у жовтні 2023. Не плутати з
  камрелізумабом (DRUG-CAMRELIZUMAB) — окремою анти-PD-1 антитілом,
  дослідженим у CAPTAIN-1st для того ж показання.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_v0_2_a_anchor
draft_revision: 1

notes_patient: >
  Імунотерапія, що знімає "гальма" з власних Т-клітин, дозволяючи їм
  атакувати пухлину. Вводиться внутрішньовенно кожні 3 тижні разом із
  хіміотерапією.
