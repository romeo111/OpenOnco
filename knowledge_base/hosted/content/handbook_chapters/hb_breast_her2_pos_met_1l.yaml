sections:
  - heading: "Diagnostic minimum"
    body: "HER2-positive metastatic breast cancer is defined by IHC 3+ or in-situ hybridization-positive HER2 amplification on the metastatic lesion or, when not feasible, on the primary tumor with a clear discussion of discordance risk. Before the first-line plan the chapter expects confirmed HER2 amplification, ER/PR co-status (because endocrine therapy joins the conversation after THP completion), baseline LVEF and ECG before any HER2-directed antibody, germline BRCA1/2 testing, and brain imaging when CNS symptoms are present even though the regimen does not change for asymptomatic CNS disease."
    source_ids:
      - SRC-NCCN-BREAST-2025
      - SRC-ESMO-BREAST-METASTATIC-2024
    linked_entity_ids:
      - DIS-BREAST
      - BIO-HER2-SOLID
      - BIO-ESTROGEN-RECEPTOR
      - BIO-BRCA-GERMLINE
      - TEST-HER2-IHC-FISH
      - TEST-LVEF-ECHO
      - TEST-GERMLINE-BRCA-PANEL
  - heading: "First-line decision logic"
    body: "OpenOnco models the first-line decision as docetaxel + trastuzumab + pertuzumab (THP) for HER2-amplified metastatic disease, with trastuzumab + pertuzumab maintenance continuing after taxane completion (CLEOPATRA). HR co-positive disease adds endocrine therapy to the maintenance phase rather than replacing the HER2-directed backbone. Frailty, organ dysfunction, or cardiac contraindications are evaluated against THP before any de-intensification choice, and active visceral crisis remains a separate emergency pathway."
    source_ids:
      - SRC-CLEOPATRA-SWAIN-2015
      - SRC-NCCN-BREAST-2025
    linked_entity_ids:
      - ALGO-BREAST-1L
      - IND-BREAST-HER2-POS-MET-1L-THP
      - REG-THP-METASTATIC
      - RF-BREAST-HER2-AMP-ACTIONABLE
  - heading: "Second-line and CNS-aware sequencing"
    body: "After progression on THP the canonical 2L option in the OpenOnco model is trastuzumab deruxtecan (DESTINY-Breast03). Patients with active CNS metastases — particularly progression after IO/HER2-directed therapy — pull tucatinib + trastuzumab + capecitabine into the conversation because the HER2CLIMB trial demonstrated CNS activity. Germline BRCA1/2 status brings PARP-inhibitor reasoning into the longer sequencing arc but does not displace the HER2-directed backbone at any line."
    source_ids:
      - SRC-DESTINY-BREAST03-CORTES-2022
      - SRC-HER2CLIMB-MURTHY-2019
      - SRC-OLYMPIAD-ROBSON-2017
    linked_entity_ids:
      - IND-BREAST-HER2-POS-MET-2L-TDXD
      - IND-BREAST-HER2-POS-3L-TUCATINIB
      - REG-TUCATINIB-TRASTUZUMAB-CAPECITABINE-BREAST
      - RF-CNS-METASTASES-ACTIVE
      - RF-BREAST-BRCA-GERMLINE-ACTIONABLE
  - heading: "Common traps"
    body: "Do not treat regimen selection as the whole task. LVEF surveillance is required throughout HER2-directed therapy, not only at baseline; pregnancy and contraception planning are required for premenopausal patients because anti-HER2 antibodies are teratogenic; CNS imaging on symptom rather than schedule remains the OpenOnco default unless a HER2CLIMB-driven question changes the cadence; and HER2 status should be re-biopsied at progression because discordance between primary and metastatic samples is well-described. None of these change the 1L THP call by themselves, but missing them changes the safety plan."
    source_ids:
      - SRC-NCCN-BREAST-2025
      - SRC-ESMO-BREAST-METASTATIC-2024
    linked_entity_ids:
      - RF-LEPTOMENINGEAL-DISEASE
      - RF-CNS-METASTASES-ACTIVE
      - BIO-HER2-SOLID
