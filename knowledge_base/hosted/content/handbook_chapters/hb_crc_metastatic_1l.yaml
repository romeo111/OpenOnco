sections:
  - heading: "Biomarker hierarchy"
    body: "The mCRC first-line chapter treats MSI/MMR, extended RAS, BRAF V600E, HER2, and sidedness as pre-treatment gates. MSI-H/dMMR disease is evaluated before routine cytotoxic doublet or triplet selection."
    source_ids:
      - SRC-NCCN-COLON-2025
      - SRC-ESMO-CRC-2024
      - SRC-KEYNOTE-177-ANDRE-2020
    linked_entity_ids:
      - ALGO-CRC-METASTATIC-1L
      - BIO-MSI-STATUS
      - RF-CRC-MSI-H-ACTIONABILITY
  - heading: "RAS and sidedness"
    body: "RAS wild-type status is necessary but not sufficient for EGFR-antibody reasoning. The OpenOnco algorithm also expects left-sided primary tumor context before routing to the RAS-WT left-sided track."
    source_ids:
      - SRC-NCCN-COLON-2025
      - SRC-ESMO-CRC-2024
    linked_entity_ids:
      - RF-CRC-RAS-WT
      - IND-CRC-METASTATIC-1L-RAS-WT-LEFT
      - REG-FOLFOX-CETUX
  - heading: "Common traps"
    body: "Do not start with chemotherapy backbone choice before confirming MSI/MMR and RAS/BRAF status. Do not ignore liver-limited oligometastatic disease, obstruction or perforation risk, and frailty because they change the intent or feasibility of the plan."
    source_ids:
      - SRC-NCCN-COLON-2025
      - SRC-ESMO-CRC-2024
    linked_entity_ids:
      - RF-CRC-OLIGOMET-LIVER-DEFINITION
      - RF-CRC-BRAF-V600E-POOR-PROGNOSIS
      - RF-CRC-FRAILTY-AGE
