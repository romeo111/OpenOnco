sections:
  - heading: "Diagnostic minimum"
    body: "The learning path starts after histology confirms DLBCL NOS. The chapter expects a CD20 result, baseline staging, LDH, ECOG/fitness, cardiac function, viral screening, pregnancy status when relevant, and FISH or equivalent testing to rule out high-grade double-hit biology."
    source_ids:
      - SRC-NCCN-BCELL-2025
      - SRC-ESMO-DLBCL-2024
    linked_entity_ids:
      - DIS-DLBCL-NOS
      - BIO-CD20-IHC
      - TEST-PET-CT
      - TEST-FISH-PANEL
  - heading: "First-line decision logic"
    body: "OpenOnco models the first-line decision as a standard R-CHOP track and an intensified Pola-R-CHP track. Frailty or organ dysfunction is evaluated before intensification. Higher IPI or high-risk biology can move the learner toward the intensified track if access and contraindications are addressed."
    source_ids:
      - SRC-NCCN-BCELL-2025
      - SRC-ESMO-DLBCL-2024
      - SRC-POLARIX-TILLY-2022
    linked_entity_ids:
      - ALGO-DLBCL-1L
      - IND-DLBCL-1L-RCHOP
      - IND-DLBCL-1L-POLA-R-CHP
      - RF-DLBCL-HIGH-IPI
      - RF-DLBCL-HIGH-RISK-BIOLOGY
  - heading: "Common traps"
    body: "Do not treat regimen selection as the whole task. HBV reactivation prevention, HIV drug interaction review, HCV coordination, CNS-risk assessment, baseline LVEF, and pregnancy screening are parallel obligations. Some of these do not change the selected indication but still change safety planning."
    source_ids:
      - SRC-NCCN-BCELL-2025
      - SRC-ESMO-DLBCL-2024
    linked_entity_ids:
      - RF-DLBCL-CNS-RISK
      - RF-DLBCL-ORGAN-DYSFUNCTION
      - BIO-HBV-STATUS
      - BIO-HIV-STATUS
