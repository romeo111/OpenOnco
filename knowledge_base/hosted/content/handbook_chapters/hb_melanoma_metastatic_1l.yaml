sections:
  - heading: "Diagnostic and biomarker minimum"
    body: "Before drafting the first-line plan in metastatic melanoma the chapter expects confirmed metastatic histology, BRAF V600E/K testing on the metastatic lesion or, when not feasible, on the primary tumor with discussion of discordance risk, baseline performance status and organ function, LDH and disease-burden inputs (CheckMate-067 prognostic signal), brain MRI when CNS symptoms are present, and an autoimmune-history review before any checkpoint inhibitor. The chapter is explicit that NRAS and KIT testing are useful for sequencing but not for routing the first-line IO-versus-targeted decision."
    source_ids:
      - SRC-NCCN-MELANOMA-2025
      - SRC-ESMO-MELANOMA-2024
    linked_entity_ids:
      - DIS-MELANOMA
      - BIO-BRAF-V600E
      - BIO-BRAF-V600K
      - BIO-PDL1-EXPRESSION
      - TEST-CT-CHEST-ABDOMEN-PELVIS
  - heading: "First-line IO decision logic"
    body: "OpenOnco keeps nivolumab + ipilimumab as the canonical first-line IO backbone for fit metastatic melanoma patients without absolute contraindications to dual checkpoint inhibition (CheckMate-067). Single-agent pembrolizumab is the canonical default when the patient cannot tolerate the higher autoimmune risk of dual IO (KEYNOTE-006). Relatlimab + nivolumab (anti-LAG-3 + anti-PD-1) is an additional dual-checkpoint option with a different toxicity profile (RELATIVITY-047). The chapter expects the learner to weigh autoimmune history, organ function, and disease tempo against these three IO options before reaching for targeted therapy."
    source_ids:
      - SRC-CHECKMATE-067-LARKIN-2019
      - SRC-KEYNOTE-006-ROBERT-2015
      - SRC-RELATIVITY-047-TAWBI-2022
    linked_entity_ids:
      - ALGO-MELANOMA-METASTATIC-1L
      - IND-MELANOMA-METASTATIC-1L-NIVO-IPI
      - IND-MELANOMA-METASTATIC-1L-PEMBRO-MONO
      - IND-MELANOMA-2L-RELATLIMAB-NIVOLUMAB
      - REG-NIVO-IPI-MELANOMA
      - REG-PEMBRO-MONO-MELANOMA
  - heading: "When BRAF-targeted therapy moves to first line"
    body: "BRAF V600E/K-mutant disease pulls dabrafenib + trametinib or encorafenib + binimetinib into the canonical first-line conversation. The OpenOnco model uses targeted therapy first when rapid response is needed (high tumor burden, symptomatic disease, organ-threatening progression) or when IO is contraindicated (active uncontrolled autoimmune disease, recent organ transplantation, severe baseline immune dysfunction). The default in BRAF-mutant disease without these features remains IO first because durable IO responses outperform the duration of targeted-therapy benefit in most prospective evidence."
    source_ids:
      - SRC-COMBI-D-LONG-2014
      - SRC-COMBI-V-ROBERT-2015
      - SRC-COLUMBUS-DUMMETT-2018
    linked_entity_ids:
      - IND-MELANOMA-BRAF-METASTATIC-1L-DABRA-TRAME
      - REG-ENCORAFENIB-BINIMETINIB-MELANOMA
      - RF-MELANOMA-BRAF-V600-ACTIONABLE
  - heading: "Common traps"
    body: "Do not treat regimen selection as the whole task. A history of moderate or severe autoimmune disease is a parallel obligation that may move dual IO down the list even in a fit BRAF-wild-type patient. Active brain metastases are a treatment-planning emergency that pulls upfront stereotactic radiosurgery and dexamethasone planning into the conversation; the systemic IO choice may not change but the safety plan does. Hepatitis B/C reactivation risk requires baseline screening before any checkpoint inhibitor. None of these alter the canonical first-line call by themselves but missing them changes the trajectory of care."
    source_ids:
      - SRC-NCCN-MELANOMA-2025
      - SRC-ESMO-MELANOMA-2024
    linked_entity_ids:
      - RF-MELANOMA-HIGH-RISK-BIOLOGY
      - RF-MELANOMA-IO-RESISTANT
