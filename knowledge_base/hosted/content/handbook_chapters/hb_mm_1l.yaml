sections:
  - heading: "Risk-stratified induction"
    body: "The MM first-line chapter separates induction choice from downstream transplant and maintenance decisions. High-risk cytogenetics and aggressive biology move the learner toward the D-VRd track in the OpenOnco model."
    source_ids:
      - SRC-NCCN-MM-2025
      - SRC-ESMO-MM-2023
      - SRC-PERSEUS-SONNEVELD-2024
    linked_entity_ids:
      - ALGO-MM-1L
      - RF-MM-HIGH-RISK-CYTOGENETICS
      - IND-MM-1L-DVRD
  - heading: "Standard-risk and access-aware reasoning"
    body: "VRd remains the standard track in OpenOnco when high-risk triggers are absent or when quadruplet access is not feasible. The handbook frames this as educational reasoning, not a patient-specific prescription."
    source_ids:
      - SRC-NCCN-MM-2025
      - SRC-ESMO-MM-2023
    linked_entity_ids:
      - IND-MM-1L-VRD
      - REG-VRD
  - heading: "Common traps"
    body: "Renal dysfunction, hypercalcemia, cord compression, infection screening, pregnancy prevention for lenalidomide, and severe neuropathy risk are parallel obligations. They may change dosing, sequencing, urgency, or supportive care."
    source_ids:
      - SRC-NCCN-MM-2025
      - SRC-ESMO-MM-2023
    linked_entity_ids:
      - RF-MM-RENAL-DYSFUNCTION
      - RF-MM-HYPERCALCEMIA
      - RF-MM-CORD-COMPRESSION
      - RF-MM-INFECTION-SCREENING
