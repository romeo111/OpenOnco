sections:
  - heading: "Driver-first cascade"
    body: "The metastatic NSCLC chapter emphasizes driver-first routing. EGFR, ALK, ROS1, MET exon 14, RET, BRAF V600E, and NTRK are evaluated before the driver-negative PD-L1 immunotherapy pathway."
    source_ids:
      - SRC-NCCN-NSCLC-2025
      - SRC-ESMO-NSCLC-METASTATIC-2024
    linked_entity_ids:
      - ALGO-NSCLC-METASTATIC-1L
      - RF-NSCLC-HIGH-RISK-BIOLOGY
      - TEST-NGS-COMPREHENSIVE
  - heading: "EGFR branch"
    body: "Classical sensitizing EGFR alterations route to the EGFR first-line branch in the OpenOnco model. PD-L1 expression should not be used to skip driver-directed reasoning."
    source_ids:
      - SRC-FLAURA-SORIA-2018
      - SRC-NCCN-NSCLC-2025
    linked_entity_ids:
      - BIO-EGFR-MUTATION
      - IND-NSCLC-EGFR-MUT-MET-1L
      - REG-OSIMERTINIB-NSCLC
  - heading: "Driver-negative pathway"
    body: "When no actionable driver is found, PD-L1 TPS helps separate pembrolizumab monotherapy from chemo-immunotherapy strategies. Frailty, organ dysfunction, and urgent thoracic complications remain safety gates."
    source_ids:
      - SRC-KEYNOTE-024-RECK-2016
      - SRC-KEYNOTE-189-GANDHI-2018
