sections:
  - heading: "Diagnostic and biomarker minimum"
    body: "Before any first-line plan in advanced ovarian cancer the chapter expects confirmed high-grade serous (or otherwise platinum-sensitive) histology, complete germline BRCA1/2 testing, tumor BRCA1/2 testing where the germline result is negative, an HRD assay result interpreted alongside the assay caveat (different vendors, different cut-offs), a documented debulking outcome (R0 vs R1 vs R2 / interval), and baseline organ function. The chapter is explicit that HRD status without BRCA context is incomplete because the routing of olaparib, niraparib, and bevacizumab depends on the combination."
    source_ids:
      - SRC-NCCN-OVARIAN-2025
      - SRC-ESMO-OVARIAN-2024
    linked_entity_ids:
      - DIS-OVARIAN
      - BIO-BRCA1-BRCA2-GERMLINE
      - BIO-HRD-STATUS
      - TEST-GERMLINE-BRCA-PANEL
      - RF-BREAST-OVARIAN-HRD-ASSAY-DISTINCTION
  - heading: "Induction and the platinum-response window"
    body: "Carboplatin + paclitaxel remains the universal cytotoxic backbone for first-line advanced ovarian cancer in the OpenOnco model. The maintenance decision is made when the patient completes induction and the platinum response is established. Patients who do not respond to platinum re-enter a different algorithm and do not benefit from PARP-inhibitor maintenance in the canonical first-line model. Bevacizumab can begin during induction and continue into maintenance — the chapter is explicit that bevacizumab and PARP inhibitors are not mutually exclusive, particularly for HRD-positive non-BRCA disease."
    source_ids:
      - SRC-NCCN-OVARIAN-2025
      - SRC-PRIMA-GONZALEZ-MARTIN-2019
    linked_entity_ids:
      - ALGO-OVARIAN-ADVANCED-1L
      - IND-OVARIAN-ADVANCED-1L-CARBO-PACLI-HRD-NEG
      - IND-OVARIAN-ADVANCED-1L-CARBO-PACLI-HRD-OLAP
      - REG-CARBO-PACLI-OVARIAN
      - REG-BEV-MAINTENANCE-OVARIAN
  - heading: "Maintenance routing by BRCA + HRD"
    body: "After response to platinum, OpenOnco routes maintenance choices by combined BRCA / HRD status. BRCA-mutant disease (germline or somatic) routes to olaparib maintenance as the canonical first option (SOLO-1). HRD-positive non-BRCA disease pulls niraparib (PRIMA) and olaparib combinations into the conversation, often with bevacizumab continued from induction. HRD-negative disease without BRCA mutation typically relies on bevacizumab maintenance or observation; the chapter is explicit that adding a PARP inhibitor to HRD-negative non-BRCA disease is not the canonical default."
    source_ids:
      - SRC-SOLO1-MOORE-2018
      - SRC-PRIMA-GONZALEZ-MARTIN-2019
    linked_entity_ids:
      - IND-OVARIAN-MAINT-PARPI-BRCAM-OLAPARIB
      - IND-OVARIAN-MAINT-PARPI-HRD-NIRAPARIB
      - IND-OVARIAN-MAINT-BEV
      - REG-OLAPARIB-MAINT-OVARIAN
      - REG-NIRAPARIB-MAINT-OVARIAN
      - RF-OVARIAN-BRCA-MUT-ACTIONABLE
      - RF-OVARIAN-HRD-POSITIVE-ACTIONABLE
  - heading: "Common traps"
    body: "Do not treat the maintenance decision as a single biomarker call. HRD-assay vendor differences and cut-off thresholds change which patients fall on each side of the line — the chapter expects the learner to record which assay was used and to read the report holistically. Suboptimal debulking changes the prognosis but does not by itself remove a PARP-inhibitor option. Prior PARP-inhibitor exposure (rare at first line, common at recurrence) reshapes the maintenance discussion completely. VTE risk and infection screening sit beside the regimen choice and must not be skipped."
    source_ids:
      - SRC-NCCN-OVARIAN-2025
      - SRC-ESMO-OVARIAN-2024
    linked_entity_ids:
      - RF-OVARIAN-SUBOPTIMAL-DEBULKING
      - RF-OVARIAN-HRD-ACTIONABILITY
      - RF-BREAST-OVARIAN-HRD-ASSAY-DISTINCTION
