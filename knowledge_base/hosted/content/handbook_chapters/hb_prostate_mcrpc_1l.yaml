sections:
  - heading: "Diagnostic and biomarker minimum"
    body: "Castration resistance is established by biochemical (PSA rise) or radiographic progression on adequate testosterone suppression. Before drafting any first-line mCRPC plan the chapter expects baseline PSA kinetics, conventional imaging plus PSMA-PET where access permits, baseline organ function, a documented prior-line history (ARPI exposure in mHSPC versus mCRPC matters), and germline + tumor HRR panel testing covering BRCA1, BRCA2, ATM, CHEK2, CDK12, and PALB2. The HRR panel is treatment-defining in this disease — not an optional add-on — because PARP-inhibitor routing depends on it."
    source_ids:
      - SRC-NCCN-PROSTATE-2025
      - SRC-ESMO-PROSTATE-2024
    linked_entity_ids:
      - DIS-PROSTATE
      - BIO-PSA
      - BIO-BRCA1-BRCA2-GERMLINE
      - BIO-HRR-PANEL
      - TEST-PSA-SERUM
      - TEST-PSMA-PET
      - TEST-GERMLINE-BRCA-PANEL
  - heading: "First-line decision logic at mCRPC"
    body: "OpenOnco splits the first-line mCRPC decision by prior ARPI exposure. ARPI-naive mCRPC routes to abiraterone or enzalutamide; ARPI-resistant disease pulls PARP-inhibitor reasoning into the canonical first option when a BRCA1/2 mutation (or, depending on the indication, a broader HRR alteration) is present. Patients without an actionable HRR alteration who have already received an ARPI move toward docetaxel chemotherapy at the next decision point. The transition from mHSPC to mCRPC is the moment when a fresh HRR result changes the algorithm — older germline-only tests should be repeated with tumor sequencing if the original result was negative."
    source_ids:
      - SRC-PROFOUND-DEBONO-2020
      - SRC-NCCN-PROSTATE-2025
    linked_entity_ids:
      - ALGO-PROSTATE-MCRPC-1L
      - IND-PROSTATE-MCRPC-1L-ARPI
      - IND-PROSTATE-MCRPC-1L-PARPI
      - RF-PAN-BRCA-SOMATIC-PARPI-CANDIDATE
  - heading: "Second-line sequencing — taxanes, Lu-177-PSMA, and beyond"
    body: "After progression on the first mCRPC line the chapter expects the learner to weigh cabazitaxel, Lu-177-PSMA, and radium-223 against each other. CARD established cabazitaxel after sequential ARPI + docetaxel exposure. Lu-177-PSMA requires PSMA-PET-positive disease and prior taxane / ARPI exposure per VISION. Radium-223 is reserved for symptomatic bone-predominant disease without visceral metastases (ALSYMPCA). The OpenOnco model surfaces all three as parallel options and uses red flags (visceral burden, transformation, marrow reserve) to narrow the choice."
    source_ids:
      - SRC-CARD-DE-BONO-2019
      - SRC-ALSYMPCA-PARKER-2013
      - SRC-NCCN-PROSTATE-2025
    linked_entity_ids:
      - ALGO-PROSTATE-MCRPC-2L
      - IND-PROSTATE-MCRPC-2L-CABAZITAXEL
      - IND-PROSTATE-MCRPC-2L-LU-PSMA
      - IND-PROSTATE-MCRPC-2L-DOCETAXEL
      - RF-PROSTATE-TRANSFORMATION-PROGRESSION
  - heading: "Common traps"
    body: "Do not treat regimen selection as the whole task. Cord compression is a neuro-oncologic emergency that interrupts sequencing decisions; AR-V7 detection in some assays suggests reduced ARPI sensitivity but does not replace the HRR-driven branch; transformation to neuroendocrine prostate cancer changes the chemotherapy backbone and prognosis; and germline BRCA mutations require cascade-testing counseling and contraception planning for younger partners. None of these change the immediate biomarker map but missing them changes the safety plan and the trajectory of care."
    source_ids:
      - SRC-NCCN-PROSTATE-2025
      - SRC-ESMO-PROSTATE-2024
    linked_entity_ids:
      - RF-PROSTATE-CORD-COMPRESSION
      - RF-PROSTATE-AR-V7-ARSI-RESISTANCE
