id: HQ-BREAST-HER2-POS-1L-001
chapter_id: HB-BREAST-HER2-POS-MET-1L
type: type_a
stem: "A fit patient has newly diagnosed HER2-amplified (IHC 3+) metastatic breast cancer with HR-negative co-status, normal LVEF, and no CNS symptoms. In the OpenOnco first-line learning model, which track is the standard default?"
options:
  - key: A
    text: "Trastuzumab + pertuzumab + docetaxel (THP)"
  - key: B
    text: "Trastuzumab deruxtecan as a 1L single agent"
  - key: C
    text: "Tucatinib + trastuzumab + capecitabine because CNS coverage is mandatory at 1L"
  - key: D
    text: "Lapatinib + capecitabine"
correct_answer: A
explanation: "CLEOPATRA established THP as the standard 1L backbone for HER2+ metastatic disease and OpenOnco keeps it as the first-line default. T-DXd is the canonical 2L option after THP progression (DESTINY-Breast03), tucatinib-based therapy enters at later lines or for active CNS disease (HER2CLIMB), and lapatinib + capecitabine is not a 1L pathway in the OpenOnco model."
