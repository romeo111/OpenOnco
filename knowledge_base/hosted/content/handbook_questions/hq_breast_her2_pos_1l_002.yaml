id: HQ-BREAST-HER2-POS-1L-002
chapter_id: HB-BREAST-HER2-POS-MET-1L
type: type_a
stem: "A patient with HER2+ metastatic breast cancer has progressed after 18 months on THP (with trastuzumab + pertuzumab maintenance). She has no CNS disease and good organ function. Which OpenOnco indication is the canonical 2L option?"
options:
  - key: A
    text: "Trastuzumab deruxtecan (T-DXd)"
  - key: B
    text: "Tucatinib + trastuzumab + capecitabine"
  - key: C
    text: "Trastuzumab + vinorelbine"
  - key: D
    text: "Continue THP unchanged because no resistance pattern is established"
correct_answer: A
explanation: "T-DXd is the canonical 2L option after THP progression in OpenOnco (DESTINY-Breast03). Tucatinib-based therapy is reserved for later lines or for active CNS disease (HER2CLIMB). Continuing the same regimen after progression is not consistent with the OpenOnco progression model."
