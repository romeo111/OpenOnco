id: HQ-BREAST-HER2-POS-1L-003
chapter_id: HB-BREAST-HER2-POS-MET-1L
type: type_k
stem: "Which statements are true for OpenOnco HER2+ metastatic breast cancer 1L reasoning?"
options:
  - key: A
    text: "Baseline LVEF and ECG are required before any HER2-directed antibody and are repeated during therapy."
  - key: B
    text: "HR co-positivity adds endocrine maintenance after THP completion but does not replace the HER2-directed backbone."
  - key: C
    text: "Asymptomatic CNS metastases mandate switching to tucatinib + trastuzumab + capecitabine at 1L."
  - key: D
    text: "Germline BRCA1/2 status is relevant to the longer sequencing arc but does not displace the HER2-directed backbone at any line."
correct_answer: "A,B,D"
explanation: "LVEF surveillance, endocrine maintenance for HR co-positive disease, and germline BRCA's role in sequencing without displacing HER2-directed therapy are all part of the OpenOnco model. Asymptomatic CNS disease does not force a 1L switch to tucatinib; HER2CLIMB-driven tucatinib reasoning enters the conversation for active or progressing CNS disease, typically at a later line."
