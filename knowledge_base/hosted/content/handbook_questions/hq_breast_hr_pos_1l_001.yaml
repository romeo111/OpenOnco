id: HQ-BREAST-HR-POS-1L-001
chapter_id: HB-BREAST-HR-POS-HER2-NEG-1L
type: type_a
stem: "A postmenopausal patient has newly diagnosed HR+/HER2- metastatic breast cancer with bone-predominant disease, ECOG 1, normal LVEF, and no visceral crisis. In the OpenOnco first-line learning model, which track is the standard default?"
options:
  - key: A
    text: "Single-agent capecitabine"
  - key: B
    text: "Aromatase inhibitor + CDK4/6 inhibitor"
  - key: C
    text: "T-DXd because most HR+/HER2- tumors are HER2-low"
  - key: D
    text: "Olaparib as biomarker-agnostic first-line therapy"
correct_answer: B
explanation: "The first-line HR+/HER2- algorithm keeps an aromatase inhibitor plus a CDK4/6 inhibitor as the standard default for endocrine-sensitive metastatic disease without visceral crisis. T-DXd is reserved for HER2-low at 2L, single-agent chemotherapy is for endocrine-resistant or visceral-crisis disease, and PARP inhibitors require germline BRCA selection."
