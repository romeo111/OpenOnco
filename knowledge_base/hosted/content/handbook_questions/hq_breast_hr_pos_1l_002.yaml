id: HQ-BREAST-HR-POS-1L-002
chapter_id: HB-BREAST-HR-POS-HER2-NEG-1L
type: type_a
stem: "A patient with HR+/HER2- metastatic breast cancer has progressed after 24 months on letrozole + palbociclib. Comprehensive NGS shows a PIK3CA H1047R mutation and no ESR1 or AKT1 alterations. Which OpenOnco indication is the canonical biomarker-defined 2L option?"
options:
  - key: A
    text: "Alpelisib + fulvestrant"
  - key: B
    text: "Capivasertib + fulvestrant"
  - key: C
    text: "Elacestrant monotherapy"
  - key: D
    text: "T-DM1 because HER2 status converts after CDK4/6i exposure"
correct_answer: A
explanation: "PIK3CA-mutant disease after CDK4/6i progression routes to alpelisib + fulvestrant in the OpenOnco model (SOLAR-1). Capivasertib is the canonical option for AKT1 E17K alterations, elacestrant is the ESR1-defined branch (EMERALD), and HER2 status is not driven by CDK4/6i exposure."
