id: HQ-BREAST-HR-POS-1L-003
chapter_id: HB-BREAST-HR-POS-HER2-NEG-1L
type: type_k
stem: "Which statements are true for OpenOnco first-line HR+/HER2- metastatic breast cancer reasoning?"
options:
  - key: A
    text: "HER2-low status (IHC 1+ or 2+ ISH-negative) is captured up-front because it routes future 2L decisions to T-DXd."
  - key: B
    text: "Germline BRCA1/2 testing is treated as a parallel obligation that does not delay first-line treatment but may bring talazoparib monotherapy into the conversation."
  - key: C
    text: "All HR+/HER2- metastatic patients should bypass CDK4/6 inhibitors and start with a PARP inhibitor."
  - key: D
    text: "Baseline LVEF and ECG are recommended before starting a CDK4/6 inhibitor in patients with unclear cardiac risk."
correct_answer: "A,B,D"
explanation: "HER2-low captured up-front, germline BRCA as a parallel safety/routing obligation, and baseline cardiac assessment before a CDK4/6 inhibitor are all part of the OpenOnco first-line model. PARP inhibitors are a germline-defined alternative, not a universal default."
