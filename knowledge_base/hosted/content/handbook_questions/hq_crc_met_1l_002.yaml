type: type_a
stem: "A metastatic CRC case is extended-RAS wild-type. What additional clinical feature is modeled as important before routing to the RAS-WT left-sided EGFR-antibody track?"
options:
  - key: A
    text: "Left-sided primary tumor context"
  - key: B
    text: "Any BRAF V600E mutation"
  - key: C
    text: "Untested MSI status"
  - key: D
    text: "Ignoring primary tumor location"
correct_answer: A
explanation: "The OpenOnco algorithm gates EGFR-antibody reasoning with RAS wild-type status and left-sided primary tumor context. RAS wild-type alone is not the whole decision."
