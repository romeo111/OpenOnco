id: HQ-DLBCL-1L-001
chapter_id: HB-DLBCL-1L
type: type_a
stem: "A fit patient has newly diagnosed CD20-positive DLBCL NOS with IPI 0-1 and no major organ dysfunction. In the OpenOnco first-line learning model, which track is the standard default?"
options:
  - key: A
    text: "R-CHOP standard track"
  - key: B
    text: "Pola-R-CHP intensified track"
  - key: C
    text: "DA-EPOCH-R for all DLBCL patients"
  - key: D
    text: "Observation until progression"
correct_answer: A
explanation: "The first-line DLBCL algorithm keeps R-CHOP as the standard default when low-risk features are present and no intensification red flag dominates. Pola-R-CHP is modeled as the intensified track for higher-risk disease where access and contraindications are addressed."
