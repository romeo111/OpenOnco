id: HQ-MELANOMA-MET-1L-001
chapter_id: HB-MELANOMA-METASTATIC-1L
type: type_a
stem: "A fit patient has BRAF wild-type metastatic melanoma with normal LDH, no autoimmune history, and no CNS symptoms. In the OpenOnco first-line learning model, which track is the canonical default?"
options:
  - key: A
    text: "Nivolumab + ipilimumab"
  - key: B
    text: "Encorafenib + binimetinib"
  - key: C
    text: "Cytotoxic dacarbazine"
  - key: D
    text: "Observation until progression"
correct_answer: A
explanation: "Dual checkpoint inhibition with nivolumab + ipilimumab is the canonical IO backbone for fit metastatic melanoma patients in the OpenOnco model (CheckMate-067). BRAF-targeted regimens are not used for BRAF wild-type disease, cytotoxic dacarbazine is not a canonical first-line default, and observation is not used in active metastatic disease."
