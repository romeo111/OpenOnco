id: HQ-MELANOMA-MET-1L-002
chapter_id: HB-MELANOMA-METASTATIC-1L
type: type_a
stem: "A patient has BRAF V600E-mutant metastatic melanoma with rapidly progressive symptomatic visceral disease, elevated LDH, and recent corticosteroid use for an unrelated autoimmune condition. Which OpenOnco first-line option is consistent with this profile?"
options:
  - key: A
    text: "Encorafenib + binimetinib (BRAF-targeted) as the canonical first-line option"
  - key: B
    text: "Nivolumab + ipilimumab as the canonical first-line option"
  - key: C
    text: "Pembrolizumab monotherapy"
  - key: D
    text: "Observation with serial imaging"
correct_answer: A
explanation: "BRAF V600 disease combined with rapid-response need and an IO contraindication (recent corticosteroid use for active autoimmune disease) is exactly the scenario OpenOnco routes to BRAF-targeted therapy at first line (COMBI / COLUMBUS context). Dual IO is contraindicated here; single-agent pembrolizumab is also IO and carries the same risk. Observation is not appropriate for symptomatic progression."
