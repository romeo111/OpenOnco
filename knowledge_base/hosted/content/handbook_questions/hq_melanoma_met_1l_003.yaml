id: HQ-MELANOMA-MET-1L-003
chapter_id: HB-MELANOMA-METASTATIC-1L
type: type_k
stem: "Which statements are true for OpenOnco first-line metastatic melanoma reasoning?"
options:
  - key: A
    text: "BRAF V600E/K testing is required before drafting the first-line plan because it routes patients between IO and targeted strategies."
  - key: B
    text: "Single-agent pembrolizumab is the canonical default when dual IO is contraindicated by autoimmune history or comorbidity (KEYNOTE-006 context)."
  - key: C
    text: "Relatlimab + nivolumab is presented as an additional dual-checkpoint option with a different toxicity profile (RELATIVITY-047)."
  - key: D
    text: "All BRAF V600-mutant patients should receive BRAF-targeted therapy first because IO is ineffective in BRAF-mutant disease."
correct_answer: "A,B,C"
explanation: "BRAF V600 testing as routing input, single-agent pembrolizumab when dual IO is contraindicated, and relatlimab + nivolumab as an additional dual-checkpoint option are all consistent with the OpenOnco model. IO is effective in BRAF-mutant melanoma and is typically chosen first when no rapid-response or contraindication signal pushes the learner toward BRAF-targeted therapy."
