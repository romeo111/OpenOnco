type: type_k
stem: "Which statements are true for the OpenOnco metastatic NSCLC first-line chapter?"
options:
  - key: A
    text: "PD-L1 TPS is most useful after actionable drivers are excluded or addressed."
  - key: B
    text: "EGFR and ALK branches are part of the driver-first cascade."
  - key: C
    text: "Brain metastases and frailty are parallel MDT/safety issues."
  - key: D
    text: "Comprehensive molecular testing is irrelevant in metastatic NSCLC."
correct_answer: "A,B,C"
explanation: "The chapter keeps molecular driver testing central, uses PD-L1 for the driver-negative pathway, and still surfaces safety and MDT issues such as brain metastases and frailty."
