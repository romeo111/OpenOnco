id: HQ-OVARIAN-MAINTENANCE-1L-001
chapter_id: HB-OVARIAN-MAINTENANCE-1L
type: type_a
stem: "A patient has newly diagnosed advanced high-grade serous ovarian cancer with a deleterious germline BRCA2 mutation. She completes carboplatin + paclitaxel induction with a complete response. In the OpenOnco first-line maintenance model, which is the canonical first option?"
options:
  - key: A
    text: "Olaparib maintenance"
  - key: B
    text: "Observation alone because germline BRCA2 carriers do not benefit from maintenance"
  - key: C
    text: "Mirvetuximab soravtansine"
  - key: D
    text: "Topotecan maintenance"
correct_answer: A
explanation: "BRCA-mutant advanced ovarian cancer after platinum response routes to olaparib maintenance as the canonical first option in the OpenOnco model (SOLO-1). Observation, mirvetuximab, and topotecan are not first-line maintenance choices in this scenario."
