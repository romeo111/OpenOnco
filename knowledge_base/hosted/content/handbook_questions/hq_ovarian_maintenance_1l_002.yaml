id: HQ-OVARIAN-MAINTENANCE-1L-002
chapter_id: HB-OVARIAN-MAINTENANCE-1L
type: type_a
stem: "A patient with advanced ovarian cancer has wild-type BRCA1/2 and an HRD-positive assay result. She completes platinum-based induction with a partial response and bevacizumab was started during induction. In the OpenOnco model, which canonical maintenance option matches this profile?"
options:
  - key: A
    text: "Niraparib maintenance (HRD-positive non-BRCA route)"
  - key: B
    text: "Stop all therapy because HRD-positive disease cannot be maintained"
  - key: C
    text: "Switch to cabazitaxel"
  - key: D
    text: "Repeat carboplatin + paclitaxel as maintenance until progression"
correct_answer: A
explanation: "HRD-positive non-BRCA disease routes to niraparib maintenance as the canonical option in the OpenOnco model (PRIMA). Bevacizumab continuation alongside niraparib is allowed where it was used in induction. Stopping therapy, switching to cabazitaxel, or repeating the cytotoxic backbone is not maintenance per the canonical algorithm."
