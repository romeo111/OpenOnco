id: HQ-OVARIAN-MAINTENANCE-1L-003
chapter_id: HB-OVARIAN-MAINTENANCE-1L
type: type_k
stem: "Which statements are true for OpenOnco first-line ovarian-cancer maintenance reasoning?"
options:
  - key: A
    text: "Germline plus tumor BRCA testing is captured before maintenance, and a negative germline BRCA does not exclude a somatic BRCA mutation."
  - key: B
    text: "HRD assay results must be read with the assay vendor and cut-off recorded; assay differences are a recognized red flag in OpenOnco."
  - key: C
    text: "Patients who do not respond to platinum-based induction still benefit from PARP-inhibitor maintenance in the canonical first-line model."
  - key: D
    text: "Suboptimal debulking changes prognosis but does not by itself remove a PARP-inhibitor option."
correct_answer: "A,B,D"
explanation: "Germline + tumor BRCA, HRD-assay caveats, and the role of debulking as prognosis-not-eligibility are all part of the OpenOnco model. Patients who do not respond to platinum induction do not enter the canonical PARP-maintenance pathway — they enter a different platinum-refractory algorithm."
