id: HQ-PROSTATE-MCRPC-1L-001
chapter_id: HB-PROSTATE-MCRPC-1L
type: type_a
stem: "A patient with newly castration-resistant prostate cancer never received an ARPI during the mHSPC phase. PSMA-PET shows bone-predominant disease without visceral or nodal burden. HRR panel is wild-type. In the OpenOnco mCRPC first-line model, which track is the canonical default?"
options:
  - key: A
    text: "Continue ADT and add abiraterone or enzalutamide"
  - key: B
    text: "Olaparib monotherapy because every mCRPC patient benefits from PARP inhibition"
  - key: C
    text: "Lu-177-PSMA as 1L therapy"
  - key: D
    text: "Cabazitaxel monotherapy"
correct_answer: A
explanation: "ARPI-naive mCRPC routes to abiraterone or enzalutamide added to ADT in the OpenOnco model. PARP-inhibitor monotherapy is reserved for HRR-altered disease (PROfound established BRCA-driven olaparib). Lu-177-PSMA requires prior taxane / ARPI exposure (VISION) and cabazitaxel is later-line."
