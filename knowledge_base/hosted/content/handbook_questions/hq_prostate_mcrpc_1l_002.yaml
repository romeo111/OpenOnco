id: HQ-PROSTATE-MCRPC-1L-002
chapter_id: HB-PROSTATE-MCRPC-1L
type: type_a
stem: "A patient with mCRPC has progressed on abiraterone given during the mHSPC phase. Tumor HRR panel shows a deleterious BRCA2 mutation; germline counseling confirms a pathogenic germline variant. He has no transformation features and good performance status. Which OpenOnco indication is the canonical first option at the current mCRPC line?"
options:
  - key: A
    text: "A PARP inhibitor based on the BRCA2 alteration"
  - key: B
    text: "Switch to enzalutamide as a class-effect ARPI swap"
  - key: C
    text: "Docetaxel-based chemotherapy without further biomarker work"
  - key: D
    text: "Lu-177-PSMA"
correct_answer: A
explanation: "BRCA1/2-altered mCRPC progressing on a prior ARPI routes to a PARP inhibitor in the OpenOnco model (PROfound established olaparib in this setting). Switching between ARPIs after class-wide progression is not the canonical default. Docetaxel and Lu-177-PSMA are reserved for later sequencing steps or non-HRR-driven decisions."
