id: HQ-PROSTATE-MCRPC-1L-003
chapter_id: HB-PROSTATE-MCRPC-1L
type: type_k
stem: "Which statements are true for OpenOnco mCRPC reasoning?"
options:
  - key: A
    text: "Germline + tumor HRR panel coverage of BRCA1, BRCA2, ATM, CHEK2, CDK12, and PALB2 is treated as treatment-defining, not optional."
  - key: B
    text: "Cord compression is an emergency that interrupts sequencing decisions and is captured as a parallel red flag, not as a routine progression event."
  - key: C
    text: "Radium-223 is appropriate for symptomatic bone-predominant disease without visceral metastases (ALSYMPCA context)."
  - key: D
    text: "AR-V7 detection by itself is sufficient to skip an HRR panel because resistance to ARPIs is then certain."
correct_answer: "A,B,C"
explanation: "HRR-panel coverage as treatment-defining, cord compression as a parallel emergency red flag, and radium-223 for bone-predominant disease are all part of the OpenOnco model. AR-V7 status does not replace the HRR panel — both can be relevant at the same decision point and AR-V7 by itself is not a stand-alone treatment-defining biomarker."
