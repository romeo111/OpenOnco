rationale: >
  FIRM-ACT (NCT00094497), the pivotal international phase 3 trial in
  advanced ACC, randomized 304 patients to etoposide+doxorubicin+
  cisplatin+mitotane (EDP-M) versus streptozocin+mitotane (Sz-M), with
  crossover to the other combination permitted at progression. EDP-M
  produced a significantly higher objective response rate (23.2% vs 9.2%,
  p<0.001) and longer median progression-free survival (5.0 vs 2.1
  months) than Sz-M; median overall survival was numerically longer with
  EDP-M (14.8 vs 12.0 months) but not statistically significant (p=0.07),
  attributable in part to substantial crossover. Based on the
  response/PFS advantage, EDP-M plus continuous mitotane is the preferred
  first-line systemic regimen for advanced (unresectable locally advanced
  or metastatic) ACC. Mitotane is continued throughout chemotherapy and
  beyond, titrated toward a target therapeutic blood level of 14-20 mg/L,
  with mandatory glucocorticoid (+/- mineralocorticoid) replacement given
  near-universal drug-induced adrenal insufficiency. Per the disease-level
  narrative ("mitotane +/- EDP chemotherapy"), mitotane monotherapy alone
  remains a reasonable alternative for patients unfit for full combination
  cytotoxic chemotherapy or with more indolent/lower-burden disease — not
  separately authored as a distinct Indication in this KB pass.

