desired_tests: []

rationale: >
  Radical (open) adrenalectomy with curative intent is the primary
  treatment for resectable ENSAT stage I-III adrenocortical carcinoma
  (ACC); an open surgical approach is historically preferred over
  laparoscopic resection given retrospective series associating the
  laparoscopic approach with higher positive-margin and peritoneal-
  seeding risk, particularly for larger or higher-stage tumors. For
  patients with high-recurrence-risk features after resection — ENSAT
  stage III, Ki-67 proliferation index >10%, or an incomplete/uncertain
  (R1/RX) resection margin — adjuvant mitotane (o,p'-DDD) is recommended
  based on retrospective cohort data (German ACC registry) suggesting a
  recurrence-free-survival benefit. The subsequent randomized ADIUVO
  trial (Terzolo 2023, Lancet Diabetes Endocrinol), which enrolled a
  lower/intermediate-risk population (stage I-III, R0 resection, Ki-67
  <=10%), did NOT demonstrate a significant recurrence-free-survival or
  overall-survival benefit from adjuvant mitotane in that population — so
  the strength of the adjuvant-mitotane recommendation here is
  specifically tied to the higher-recurrence-risk subgroup, where the
  (still largely retrospective) evidence base is most supportive. Mitotane
  causes near-universal drug-induced adrenal insufficiency (100% of
  non-functional-tumor and ~75% of functional-tumor patients per the EU
  SmPC) requiring concomitant glucocorticoid (+/- mineralocorticoid)
  replacement and regular mitotane blood-level monitoring (target 14-20
  mg/L). Germline TP53 testing (Li-Fraumeni syndrome) is recommended for
  all pediatric ACC and for adult ACC meeting Chompret criteria, given
  ACC's strong hereditary association.

