notes: >
  STUB pending clinical co-lead sign-off (CHARTER §6.1). Authored to close
  the DIS-ADRENOCORTICAL-CARCINOMA v0.1 content gap
  (metadata.awaiting_proposal). "High recurrence risk" is operationalized
  via RF-ACC-HIGH-RECURRENCE-RISK-BIOLOGY (stage III / Ki-67 >10% / R1-RX
  margin), itself a first-pass reading of ADIUVO's low/intermediate-risk
  enrollment criteria in reverse — pending clinical co-lead confirmation
  against the primary ENSAT/ESMO guideline text, which may specify
  additional risk factors (e.g. tumor rupture, vascular invasion) not yet
  encoded. Lower-risk resected patients (surveillance-alone candidates per
  ADIUVO) are intentionally NOT covered by this Indication — see
  ALGO-ACC-1L step 2 null-branch. Surgery is described in prose
  (rationale/stage_requirements) rather than via a Surgery-entity FK/
  phases: structure — no adrenalectomy Surgery entity exists in this KB
  and authoring one is out of scope for this task.

