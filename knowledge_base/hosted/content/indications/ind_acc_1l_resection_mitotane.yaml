id: IND-ACC-1L-RESECTION-MITOTANE
plan_track: standard

applicable_to:
  disease_id: DIS-ADRENOCORTICAL-CARCINOMA
  line_of_therapy: 1
  stage_stratum: STAGE_I_III_RESECTABLE
  stage_requirements:
  - "ENSAT stage I, II, or III adrenocortical carcinoma, surgically resectable — no distant metastasis and primary tumor (+/- locoregional extension) amenable to complete (R0) resection — confirmed by multidisciplinary endocrine surgery/oncology review"
  - "High recurrence-risk features present after resection: ENSAT stage III, Ki-67 proliferation index >10%, or incomplete/uncertain (R1/RX) resection margin (per ADIUVO trial risk stratification and ENSAT/ESMO consensus) — this Indication targets that higher-risk group; lower-risk patients (stage I-II, R0 resection, Ki-67 <=10%) did not show a significant recurrence-free-survival benefit from adjuvant mitotane in the ADIUVO trial and may be managed with surveillance alone (not separately authored as an Indication in this KB pass)"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

recommended_regimen: REG-MITOTANE-ADJUVANT-ACC
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional

expected_outcomes:
  disease_free_survival: "Retrospective cohort data (German ACC registry, Terzolo et al.) suggested improved recurrence-free survival with adjuvant mitotane after R0 resection; the subsequent randomized ADIUVO trial did not show a significant recurrence-free-survival benefit in a lower/intermediate-risk population (5-yr RFS 79% mitotane vs 75% surveillance, HR 0.74, 95% CI 0.30-1.85, not significant) — evidence for the higher-risk population targeted by this Indication remains retrospective/observational pending a dedicated high-risk RCT."

