rationale: >
  Alternative-track companion to IND-ACHALASIA-ESOPHAGEAL-PREVENTION-
  SURVEILLANCE. Appropriate for patients with confirmed achalasia who
  choose minimum-intensity surveillance for any of: cost / access
  constraints, recent (<5y) achalasia diagnosis where SCC latency makes
  routine surveillance lower-yield, severe procedural anxiety, advanced
  age with limited life expectancy where surveillance-detected early
  SCC would not change management, or explicit preference for symptom-
  driven follow-up after informed-consent discussion.

  **Cadence:** no scheduled EGD. Patient and clinician agree to a
  defined list of red-flag symptoms that trigger prompt diagnostic
  EGD:
    - New or worsening dysphagia beyond baseline achalasia dysphagia
    - Regurgitation of blood-tinged material or frank hematemesis
    - Unintentional weight loss >5-10%
    - New retrosternal pain unresponsive to standard achalasia
      management
    - Iron-deficiency anemia of unclear etiology

  **Not appropriate for:**
    - Patients with megaesophagus (>6 cm diameter on barium swallow)
    - Patients with documented food retention or candida esophagitis on
      prior EGD
    - Patients with smoking history or heavy alcohol use (additive SCC
      risk factors)
    - Patients with family history of esophageal cancer
    - Patients >10-15y from achalasia onset who meet standard
      surveillance-eligibility thresholds (these should default to the
      standard-track unless declining)

  Per CHARTER §11 patient-autonomy framing: surveillance benefit is
  meaningful but rests on cohort (not RCT) evidence, and the absolute
  SCC incidence remains low per individual-year (~0.3-1%/year after
  the latency window). An informed-consent choice of symptom-driven
  observation is defensible. Patient retains option to upgrade to
  scheduled surveillance at any future visit.

  **Alarm features** route immediately to diagnostic EGD with biopsies
  — and if SCC is confirmed, to the treatment-persona algorithm via
  DIS-ESOPHAGEAL.

rationale_ua: >
  Альтернативний трек — супутнє показання до
  IND-ACHALASIA-ESOPHAGEAL-PREVENTION-SURVEILLANCE. Застосовується для
  пацієнтів з підтвердженою ахалазією, які обирають спостереження
  мінімальної інтенсивності з причин: вартість / доступність,
  нещодавній (<5 років) діагноз ахалазії, за якого латентність
  розвитку SCC робить рутинне ендоскопічне спостереження
  малоефективним, тяжка процедурна тривога, похилий вік з обмеженою
  тривалістю життя, або явна перевага пацієнта щодо спостереження за
  симптомами після обговорення інформованої згоди.

  **Частота:** планової EGD немає. Пацієнт і лікар погоджують
  визначений перелік тривожних симптомів, які є підставою для
  невідкладної діагностичної EGD:
    - Нова або прогресуюча дисфагія понад вихідний рівень дисфагії при
      ахалазії
    - Регургітація матеріалу з домішкою крові або явне криваве
      блювання
    - Ненавмисне схуднення >5-10%
    - Новий загрудинний біль, що не реагує на стандартне лікування
      ахалазії
    - Залізодефіцитна анемія неясної етіології

  **Не застосовується для:**
    - Пацієнтів з мегаезофагом (>6 см за даними рентгенографії з
      барієм)
    - Пацієнтів з документованою затримкою їжі або кандидозним
      езофагітом за попередньою EGD
    - Пацієнтів з курінням в анамнезі або зловживанням алкоголем
    - Пацієнтів із сімейним анамнезом раку стравоходу
    - Пацієнтів через >10-15 років після початку ахалазії, які
      відповідають критеріям стандартного спостереження

  Відповідно до підходу автономії пацієнта за CHARTER §11: користь від
  спостереження значуща, але спирається на когортні (не рандомізовані)
  дані, а абсолютна захворюваність на SCC залишається низькою в
  перерахунку на пацієнта-рік (~0.3-1%/рік після завершення періоду
  латентності). Вибір спостереження за симптомами на основі
  інформованої згоди є обґрунтованим. Пацієнт зберігає можливість
  перейти на планове спостереження на будь-якому наступному візиті.

  **Тривожні ознаки** негайно скеровують до діагностичної EGD з
  біопсіями — а за підтвердження SCC — до алгоритму лікування через
  DIS-ESOPHAGEAL.

