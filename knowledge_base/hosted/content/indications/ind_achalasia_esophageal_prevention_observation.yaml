do_not_do:
  - "Не використовувати цей шлях у пацієнтів з мегаезофагом або задокументованою затримкою їжі — таким пацієнтам показане планове спостереження."
  - "Не подавати спостереження за симптомами як еквівалент планового ендоскопічного спостереження — ризик виявлення раку в міжоглядовому інтервалі вищий, з типово пізнішою стадією на момент діагностики."
  - "Не ігнорувати тривожні симптоми (нова дисфагія, кровотеча, схуднення) — показане негайне обстеження."
  - "Не використовувати цей шлях у пацієнтів, які активно курять або зловживають алкоголем — додатковий ризик SCC виправдовує планове спостереження."
  - "Не пропускати періодичне обговорення переходу на активніший режим — особливо у міру наближення до вікна латентності 10-15 років."

do_not_do_en:
  - "Do not use this pathway in patients with megaesophagus or documented food retention — they require scheduled surveillance."
  - "Do not present symptom-driven observation as equivalent to scheduled surveillance — interval-cancer risk is higher, with typical later-stage presentation."
  - "Do not ignore red-flag symptoms (new dysphagia, bleeding, weight loss) — immediate workup indicated."
  - "Do not use this pathway in patients with active smoking or heavy alcohol use — additive SCC risk warrants scheduled monitoring."
  - "Do not skip periodic re-discussion of upgrade — especially as the 10-15-year latency window approaches."

