rationale: US labeling includes previously untreated adult CD30-expressing AITL with CHP. This
  authorization is distinct from evidence of AITL-specific superiority. ECHELON-2 predominantly
  enrolled systemic ALCL; the limited AITL subgroup does not establish a universal preference.
  The comparator was CHOP, not CHOEP. The 2025 ESMO-EHA guideline recommends CHOP/CHOP-like
  treatment for PTCL-NOS/TFHL. Regional selection remains under review.
rationale_ua: Американська інструкція включає неліковану CD30-позитивну AITL у дорослих у комбінації
  з CHP. Цей дозвіл відрізняється від доказів переваги саме для AITL. У ECHELON-2 переважала
  системна ALCL; мала підгрупа AITL не встановлює універсальної переваги. Порівняння проводили
  з CHOP, а не CHOEP. Настанова ESMO-EHA 2025 рекомендує CHOP або подібне лікування для PTCL-NOS/TFHL.
  Регіональний вибір потребує окремої перевірки.
