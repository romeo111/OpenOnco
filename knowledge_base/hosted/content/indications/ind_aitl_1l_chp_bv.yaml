do_not_do:
- 'Не поєднуйте брентуксимаб із блеоміцином: це протипоказано через легеневу токсичність.'
- Підтвердьте CD30. Поріг ≥10% був критерієм включення ECHELON-2, а не універсальним порогом
  дозволу; не визначайте регіон за мовою інтерфейсу.
- НЕ пропускати baseline LVEF ≥50% (anthracycline).
- НЕ пропускати HBV скринінг + entecavir prophylaxis.
- НЕ пропускати EBER-ISH baseline — surveillance вторинної EBV-driven DLBCL.
- НЕ пропускати IgG + DAT baseline — AITL paraneoplastic phenomena.
- Оцініть сенсорні та моторні симптоми нейропатії до початку й перед кожним введенням. Не переносіть
  протипоказання бортезомібу на брентуксимаб; початковий 2-й ступінь потребує клінічного перегляду,
  а не універсальної абсолютної заборони.
- НЕ застосовувати CHP-Bv якщо НСЗУ-фінансування brentuximab недоступне і out-of-pocket нереально
  — fallback CHOEP.
do_not_do_en:
- 'Do not combine brentuximab with bleomycin: this is contraindicated because of pulmonary toxicity.'
- Confirm CD30. The ≥10% threshold was an ECHELON-2 enrollment criterion, not a universal label
  cutoff; do not infer region from interface language.
- Do not skip baseline LVEF ≥50% (anthracycline).
- Do not skip HBV screening + entecavir prophylaxis.
- Do not skip baseline EBER-ISH — surveillance for secondary EBV-driven DLBCL.
- Do not skip baseline IgG + DAT — AITL paraneoplastic phenomena.
- Assess sensory and motor neuropathy before treatment and each administration. Do not inherit
  bortezomib exclusions; baseline grade 2 needs clinical review, not a universal absolute prohibition.
- Do not use CHP-Bv if NSZU funding for brentuximab is unavailable and out-of-pocket is unrealistic
  — fallback CHOEP.
