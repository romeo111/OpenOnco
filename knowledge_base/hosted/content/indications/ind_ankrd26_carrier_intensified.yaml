rationale: >
  Alternative-track companion to IND-ANKRD26-CARRIER-SURVEILLANCE.
  Intensified cadence reflects carrier-preference for proactive
  monitoring in the THC2 phenotype despite the lower-than-RUNX1 /
  DDX41 lifetime malignancy incidence.

  **CBC + smear q3 months during pregnancy + perioperative windows:**
  Standard surveillance cadence is q6 months; intensified track adds
  q3-month windows around pregnancy (each trimester + postpartum) and
  major-surgery / dental-procedure windows (pre-procedure within 4
  weeks + post-procedure at 2 + 6 weeks). Pregnancy-aware monitoring
  accounts for the carrier's baseline thrombocytopenia compounding
  with pregnancy-physiologic changes.

  **Scheduled BMA every 3-5 years from carrier confirmation:**
  Provoked BMA (any unexplained change in non-platelet lineage)
  remains the primary trigger, but scheduled BMA at 3-5 year intervals
  is added in this track regardless of CBC stability. The myeloid
  NGS panel must include ANKRD26 (full coding + 5′UTR), ASXL1, BCOR,
  monosomy-7 / del(5q), TP53.

  **Preemptive HLA typing of candidate sibling-donor cohort +
  germline-testing of all candidates:** Performed BEFORE any MDS /
  AML diagnosis. ANKRD26-carrier siblings excluded from donor
  candidacy. Unrelated-donor search initiated if no eligible
  sibling. This step is identical to the other hereditary-myeloid
  carrier syndromes and applies regardless of the lower-than-
  RUNX1 / DDX41 lifetime malignancy incidence in ANKRD26 — the
  consequence of donor-derived disease is catastrophic regardless
  of base rate.

  **Structured bleeding-risk plan for major surgery / obstetric
  care:** Pre-procedure platelet-function-aware coagulation
  consultation; tranexamic acid + DDAVP considerations; platelet
  transfusion thresholds individualized; multidisciplinary
  obstetric-hematology plan for any pregnancy.

  Per CHARTER §11 patient-autonomy framing: intensified cadence
  carries higher procedural burden and a narrower marginal-benefit
  in ANKRD26 compared to higher-penetrance hereditary-myeloid
  carriers (CEBPA, DDX41, RUNX1); explicit shared-decision-making
  is essential.

rationale_ua: >
  Альтернативно-трекова Indication, sibling до IND-ANKRD26-CARRIER-
  SURVEILLANCE. Інтенсифікована cadence відображає carrier-preference
  для проактивного моніторингу у THC2 фенотипі попри нижчу-за-RUNX1 /
  DDX41 довічну malignancy incidence.

  **ЗАК + мазок q3 місяці під час вагітності + періопераційних вікон:**
  Стандартна surveillance cadence — q6 місяців; інтенсифікований трек
  додає q3-місячні вікна навколо вагітності (кожен триместр + post-
  partum) і major-surgery / dental-procedure вікон.

  **Запланована BMA кожні 3-5 років від підтвердження носійства:**
  Provoked BMA залишається primary тригером, але запланована BMA на
  3-5 річних інтервалах додана в цьому треку незалежно від CBC
  stability. Myeloid NGS panel має включати ANKRD26 (повний coding +
  5′UTR), ASXL1, BCOR, моносомію-7 / del(5q), TP53.

  **Pre-emptive HLA-типування кандидат-сиблінг-донор-cohort +
  germline-тестування всіх кандидатів:** Виконується ДО будь-якого
  діагнозу МДС / ГМЛ. ANKRD26-носії-сиблінги виключаються з donor-
  candidacy. Unrelated-donor search розпочатий, якщо немає eligible
  сиблінга.

  **Структурований bleeding-risk план для major surgery / obstetric
  care:** Pre-procedure platelet-function-aware coagulation
  консультація; tranexamic acid + DDAVP міркування; platelet
  transfusion thresholds індивідуалізовані; multidisciplinary
  obstetric-hematology план для будь-якої вагітності.

  Per CHARTER §11 framing автономії пацієнта.

