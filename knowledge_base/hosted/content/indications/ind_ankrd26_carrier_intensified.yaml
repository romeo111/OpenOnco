expected_outcomes:
  overall_response_rate: >-
    Intensified-track surveillance (scheduled BMA every 3-5 years
    regardless of CBC stability, q3-month CBC during pregnancy /
    perioperative windows, preemptive donor germline mapping) carries
    higher patient-burden and is appropriate where the carrier prefers
    the higher-intensity option after shared-decision-making. Lifetime
    cumulative myeloid malignancy risk (~5-10% per Noris 2011) is
    lower than RUNX1 or DDX41 carriers, making the marginal-benefit
    over standard track narrower.

