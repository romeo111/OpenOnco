do_not_do:
  - "Не рекомендувати інтенсифіковану-трек cadence без явного shared-decision-making — у ANKRD26 marginal-benefit над стандартним треком вужча ніж у вищо-penetrance hereditary-myeloid carriers (CEBPA, DDX41, RUNX1)."
  - "Не виконувати запланованої BMA без супутнього myeloid NGS panel — somatic-acquired clones at low VAF можуть бути пропущені без NGS."
  - "Не використовувати кандидат-сиблінг-донора, доки germline-screening не завершений — навіть нижчий-base-rate ANKRD26 не звільняє від цієї вимоги."
  - "Не пропускати pre-procedure hematology консультацію перед major surgery в інтенсифікованому-треку — bleeding-risk planning є невід'ємною частиною плану."

do_not_do_en:
  - "Do not recommend the intensified-track cadence without explicit shared-decision-making — in ANKRD26 the marginal benefit over the standard track is narrower than in higher-penetrance hereditary-myeloid carriers (CEBPA, DDX41, RUNX1)."
  - "Do not perform scheduled BMA without companion myeloid NGS panel — somatic-acquired clones at low VAF can be missed without NGS."
  - "Do not use a candidate sibling donor before germline-screening is completed — the lower-base-rate ANKRD26 does not exempt from this requirement."
  - "Do not skip pre-procedure hematology consultation before major surgery in the intensified track — bleeding-risk planning is integral to the plan."

