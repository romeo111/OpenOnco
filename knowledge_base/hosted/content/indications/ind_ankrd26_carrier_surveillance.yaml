rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with a documented germline ANKRD26 pathogenic variant (Thrombocytopenia
  2 / THC2).

  **CBC + peripheral smear q6 months, lifelong:** Baseline mild-to-
  moderate thrombocytopenia (40-120 x10⁹/L typically, isolated lineage)
  is the carrier phenotype; clinical-change thresholds are a decline
  in another lineage (WBC, Hb), persistent dysplastic morphology on
  smear, emerging blasts, or unexplained leukocytosis. Note that
  baseline isolated thrombocytopenia does NOT in itself trigger BMA
  in a known ANKRD26 carrier — surveillance focuses on changes from
  the carrier-baseline profile.

  **BMA + cytogenetics + myeloid NGS at any clinically-concerning
  change:** Trigger thresholds: new cytopenia in a non-platelet
  lineage, persistent dysplasia on smear, emerging blasts, or
  unexplained increase in WBC. Myeloid NGS panel must capture ASXL1,
  BCOR, monosomy-7 / del(5q), TP53, and ANKRD26 (full coding region
  + 5′UTR) — emerging somatic-second-hit or co-occurring myeloid
  drivers are the documented clonal-evolution events.

  **Annual review of bleeding history + medication review:** Bleeding
  burden ranges from asymptomatic to clinically-significant in the
  ANKRD26 carrier population. Annual structured review captures
  mucocutaneous bleeding patterns, surgical / dental bleeding
  history, and review of antiplatelet medication exposure (avoidance
  recommended when feasible).

  **Pre-procedure platelet-function-aware planning:** For any planned
  major surgery / dental procedure / obstetric care, pre-procedure
  hematology consultation with structured perioperative bleeding-risk
  plan documented (platelet-transfusion thresholds, tranexamic acid +
  DDAVP considerations, post-operative monitoring intensity).

  **Cascade germline testing for first-degree relatives:** Documented
  germline confirmation (ideally buccal / fibroblast / cultured-skin
  tissue) for relatives with thrombocytopenia or family-history-
  suspicion. Relatives without thrombocytopenia may still be carriers
  (incomplete-penetrance bleeding phenotype) and the carrier-status
  question is independent of platelet count.

  **Donor-screening protocol:** Any candidate sibling donor must be
  germline-tested for ANKRD26 before HSC mobilization in the
  scenario where transplant becomes necessary for the index carrier
  (donor-derived disease in inherited bone marrow failure / myeloid
  predisposition syndromes broadly documented; ANKRD26 specifically
  has fewer documented donor-derived cases due to lower-incidence
  scenario, but the screening requirement is standard).

  Per CHARTER §11 patient-autonomy framing: surveillance cadence and
  perioperative-planning intensity are shared-decision-making with
  the patient and the hematology team.

rationale_ua: >
  Стандартний-трек шлях спостереження підтверджених носіїв для осіб з
  задокументованим гермінативним патогенним варіантом ANKRD26
  (Thrombocytopenia 2 / THC2).

  **ЗАК + периферичний мазок q6 місяців, життєво:** Baseline м'яка-
  помірна тромбоцитопенія (40-120 x10⁹/л зазвичай, isolated lineage)
  — фенотип носія; порогові клінічно-зміни: декремент в іншій лінії
  (WBC, Hb), персистуюча displastic morphology на смазку, emerging
  бласти, або нез'ясований лейкоцитоз. Зауважте, що baseline ізольована
  тромбоцитопенія сама по собі НЕ тригерить BMA у відомого
  ANKRD26-носія — спостереження фокусується на змінах від carrier-
  baseline профілю.

  **BMA + цитогенетика + myeloid NGS при будь-якій клінічно-
  концерній зміні:** Порогові тригери: нова цитопенія в non-platelet
  лінії, персистуюча dysplasia на смазку, emerging бласти, або
  нез'ясоване збільшення WBC. Myeloid NGS panel має захоплювати
  ASXL1, BCOR, моносомію-7 / del(5q), TP53, і ANKRD26 (повний
  coding region + 5′UTR).

  **Щорічний огляд bleeding history + medication огляд:** Bleeding
  burden коливається від асимптомного до клінічно-значущого у
  популяції ANKRD26-носіїв. Щорічний структурований огляд захоплює
  мукокутані bleeding patterns, surgical / dental bleeding історію,
  і огляд antiplatelet medication exposure (avoidance recommended
  when feasible).

  **Pre-procedure platelet-function-aware планування:** Для будь-
  якої запланованої major surgery / dental procedure / obstetric
  care, pre-procedure hematology консультація зі структурованим
  періоперативним bleeding-risk планом задокументована.

  **Cascade germline тестування для родичів першого ступеня:**
  Задокументоване germline confirmation (ідеально buccal / fibroblast
  / cultured-skin tissue) для родичів з тромбоцитопенією або
  family-history-suspicion.

  **Donor-screening протокол:** Будь-який кандидат-сиблінг-донор має
  бути germline-тестований на ANKRD26 перед HSC mobilization у
  сценарії, де трансплантація стає необхідною для index carrier.

  Per CHARTER §11 framing автономії пацієнта.

