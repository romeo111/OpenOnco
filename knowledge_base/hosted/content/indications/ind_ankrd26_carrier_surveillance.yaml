sources:
  - source_id: SRC-NCCN-AML-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Inherited thrombocytopenia syndromes with myeloid malignancy
      predisposition (ANKRD26, ETV6, RUNX1) warrant lifelong CBC
      surveillance with provoked BMA + NGS, cascade germline testing,
      and donor germline screening before HSC transplant from any
      sibling candidate."
  - source_id: SRC-ESMO-MDS-2021
    position: supports
    relevant_quote_paraphrase: >-
      "Germline ANKRD26 carriers (THC2) have moderately elevated
      lifetime risk of MDS / AML; structured surveillance and
      perioperative bleeding-risk planning are recommended."
  - source_id: SRC-ELN-AML-2022
    position: context

do_not_do:
  - "Не виконувати BMA лише на основі baseline ізольованої тромбоцитопенії у відомого ANKRD26-носія — baseline thrombocytopenia — це carrier-baseline фенотип, BMA тригериться змінами від baseline."
  - "Не пропонувати antiplatelet терапію (aspirin, clopidogrel) ANKRD26-носію без явного шейред-decision-making про bleeding-ризик."
  - "Не пропускати pre-procedure hematology консультацію для major surgery / dental procedure / obstetric care — structured platelet-function-aware план потрібен."
  - "Не виключати carrier status у родича лише через нормальний плателет-count — incomplete-penetrance bleeding phenotype — це задокументована особливість ANKRD26 родин."

do_not_do_en:
  - "Do not perform BMA based on baseline isolated thrombocytopenia alone in a known ANKRD26 carrier — baseline thrombocytopenia is the carrier-baseline phenotype; BMA is triggered by changes from baseline."
  - "Do not prescribe antiplatelet therapy (aspirin, clopidogrel) to an ANKRD26 carrier without explicit shared-decision-making about bleeding risk."
  - "Do not skip pre-procedure hematology consultation for major surgery / dental procedure / obstetric care — a structured platelet-function-aware plan is required."
  - "Do not rule out carrier status in a relative based on normal platelet count alone — incomplete-penetrance bleeding phenotype is a documented feature of ANKRD26 families."

