expected_outcomes:
  overall_response_rate: >-
    Standard-track confirmed-carrier surveillance of germline ANKRD26
    (Thrombocytopenia 2) carriers — Noris 2011 cohort showed ~5-10%
    cumulative lifetime myeloid malignancy incidence in 78-family
    series. Surveillance enables earlier detection of incident MDS /
    AML and structured perioperative / obstetric bleeding-risk
    planning for the baseline platelet-function defect. Cascade
    germline testing + pre-emptive donor germline screening apply to
    the family scenario where transplant becomes necessary.

