evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Patient declines structured CBC surveillance schedule (q3-6mo for
    10 years post-ASCT) or accepts only lower-cadence (q12mo
    minimum) — receives symptom-prompted evaluation pathway primarily.
    Cytopenias / dysplastic changes may go undetected until overt
    t-MDS/t-AML presentation, at which point treatment options
    (especially allogeneic HSCT eligibility) may be more constrained.
    Outcomes worse than with surveillance-detected disease but better
    than no follow-up at all if minimal-cadence CBC is maintained.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-ASCT-SECONDARY-MDS-AML-
  PREVENTION-SURVEILLANCE. Used when:
  - Patient declines structured q3-6mo CBC surveillance schedule
    (clinic-burden, anxiety, surveillance-fatigue post-primary-
    cancer + ASCT treatment).
  - Access to onco-hematology follow-up clinic is impractical
    (rural, low-resource setting).
  - Patient is at the lower end of t-MDS/t-AML risk range (germ-cell
    salvage ASCT cohort with minimal pre-ASCT alkylator exposure;
    ~1-2% cumulative 10-year risk) and chooses lower-cadence
    follow-up after informed discussion.

  Components:
  - CBC with differential at minimum q12mo (rather than q3-6mo).
  - Symptom-vigilance education with explicit prompt-list: easy
    bruising, prolonged bleeding, persistent fatigue beyond expected
    ASCT recovery, recurrent infections, unexplained fever, drenching
    night sweats.
  - Low-threshold evaluation for any reported symptom — observation
    track does not foreclose marrow workup, only declines the
    routine periodic-CBC framework.
  - Iron-overload assessment continues at clinical discretion.
  - Avoid additional bone-marrow-toxic exposures (alkylator
    chemotherapy for subsequent cancer, benzene occupational
    exposure) — these counseling points apply regardless of
    surveillance schedule.
  - Re-engage structured-surveillance discussion at periodic
    intervals.

  Frame the decision as suboptimal vs. structured-surveillance
  comparator (which catches t-MDS at treatable cytopenic phase).
  Document the informed-decision discussion. Per CHARTER §11
  patient-autonomy framing.

rationale_ua: >
  Альтернативно-трекова Indication. Використовується коли:
  - Пацієнт відмовляється від structured q3-6mo CBC surveillance
    schedule (clinic-burden, anxiety, surveillance-fatigue post-
    primary-cancer + ASCT treatment).
  - Доступ до onco-hematology follow-up clinic непрактичний.
  - Пацієнт на нижньому кінці t-MDS/t-AML ризику (germ-cell salvage
    ASCT cohort з мінімальним pre-ASCT alkylator exposure; ~1-2%
    cumulative 10-year risk).

  Компоненти:
  - CBC з диференційною at minimum q12mo (rather than q3-6mo).
  - Symptom-vigilance education з explicit prompt-list.
  - Low-threshold evaluation для будь-якого reported symptom.
  - Iron-overload assessment continues at clinical discretion.
  - Avoid additional bone-marrow-toxic exposures.
  - Re-engage structured-surveillance discussion periodically.

  Frame decision як suboptimal vs. structured-surveillance comparator.
  Per CHARTER §11 framing автономії пацієнта.

