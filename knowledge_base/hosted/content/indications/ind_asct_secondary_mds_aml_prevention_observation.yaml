do_not_do:
  - "Не презентувати observation як equivalent surveillance — structured CBC q3-6mo має substantially higher yield для cytopenic-phase t-MDS detection."
  - "Не пропускати patient education про symptoms — symptom-prompted evaluation залежить від patient awareness."
  - "Не затримувати workup при early cytopenia навіть без structured surveillance schedule."
  - "Не нормалізувати surveillance refusal — counsel що CBC q3-6mo low-burden + high-yield, особливо у 3-7 year post-ASCT window."
  - "Не пропускати alkylator-avoidance counseling — subsequent cancer treatment може compound risk; counseling незалежна від surveillance schedule."
  - "Не пропускати iron-overload assessment — repeated transfusion-related iron overload — modifiable t-MDS risk factor."

do_not_do_en:
  - "Do not present observation as equivalent to surveillance — structured CBC q3-6mo has substantially higher yield for cytopenic-phase t-MDS detection."
  - "Do not skip patient education about symptoms — symptom-prompted evaluation depends on patient awareness."
  - "Do not delay workup for early cytopenia even without a structured surveillance schedule."
  - "Do not normalize surveillance refusal — counsel that CBC q3-6mo is low-burden and high-yield, especially in the 3-7 year post-ASCT window."
  - "Do not skip alkylator-avoidance counseling — subsequent cancer treatment can compound risk; counseling is independent of surveillance schedule."
  - "Do not skip iron-overload assessment — repeated transfusion-related iron overload is a modifiable t-MDS risk factor."

