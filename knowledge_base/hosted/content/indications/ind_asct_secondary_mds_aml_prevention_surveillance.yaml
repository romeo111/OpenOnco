rationale: >
  Standard-track surveillance for ASCT-survivor t-MDS/t-AML prevention
  per NCCN AML Survivorship 2025 + COG-LTFU v5 2018 (where applicable
  for pediatric / young-adult survivors) + Einhorn high-dose-
  chemotherapy ASCT late-effect literature.

  **(1) CBC with differential q3-6 months for the first 10 years
  post-ASCT:**
  - Then q12mo lifelong.
  - Median t-MDS/t-AML latency 3-7 years post-ASCT; risk plateaus by
    10 years but does not return to baseline.
  - Trend monitoring matters as much as absolute values — emerging
    cytopenia, rising MCV, or new dysplastic-smear features warrant
    closer follow-up even within "normal" reference ranges.

  **(2) Low-threshold marrow evaluation for any of:**
  - New unexplained cytopenia (anemia, neutropenia, thrombocytopenia)
    sustained for >4-8 weeks.
  - Persistent macrocytosis (MCV >100) on serial measurements.
  - Dysplastic changes on peripheral smear (hypogranular neutrophils,
    pseudo-Pelger-Huet anomaly, ring sideroblasts on iron stain,
    blasts).
  - Unexplained monocytosis (especially with raised LDH).
  - Persistent cytopenia attributable to pre-existing chemo /
    radiotherapy-related marrow injury that does not recover at the
    expected 1-2 year post-ASCT timeline.

  Bone-marrow aspirate + biopsy + cytogenetics (look for -5/5q-,
  -7/7q-, complex karyotype — therapy-related cytogenetic signatures)
  + flow cytometry + targeted-NGS panel (TP53, ASXL1, RUNX1, U2AF1,
  SRSF2 — high-risk t-MDS markers).

  **(3) Clonal hematopoiesis (CHIP) screening:**
  - When available and reimbursable, baseline targeted-NGS panel
    1-2 years post-ASCT identifies CHIP carriers at higher t-MDS
    progression risk.
  - TP53, U2AF1, SRSF2 mutations carry higher progression risk than
    DNMT3A or TET2 alone.
  - Positive CHIP triggers shorter-interval CBC surveillance (q3
    months) and earlier marrow evaluation threshold.

  **(4) Avoid additional bone-marrow-toxic exposures:**
  - Avoid additional alkylator-based therapy for any subsequent
    cancer when alternative non-leukemogenic regimens exist.
  - Counsel about benzene exposure (refer to RF-OCC-BENZENE if
    active occupational risk).
  - Avoid unnecessary diagnostic radiation; prefer MRI / US over CT
    when clinical question allows.
  - Pre-medication assessment before any cancer-related re-treatment
    flags ASCT history.

  **(5) Allogeneic HSCT eligibility pre-assessment:**
  - Within the first 2 years post-ASCT (when patient is recovered
    enough for evaluation), perform donor search + comorbidity
    assessment so that if t-MDS / t-AML emerges, the path to
    definitive treatment is open.
  - HLA typing of siblings + Be The Match unrelated-donor registry
    search.
  - Comorbidity scoring (HCT-CI) baseline so trajectory can be
    monitored.

  **(6) Patient education:**
  - Self-monitoring for symptoms: easy bruising, prolonged
    bleeding, persistent fatigue beyond expected ASCT recovery,
    recurrent infections, unexplained fever.
  - Report any of above to clinician immediately, especially in the
    3-7 year post-ASCT window when t-MDS/t-AML latency peaks.
  - Counsel that surveillance does not eliminate risk but materially
    shifts the survival distribution by enabling early intervention.

  **(7) Iron-overload management (when applicable):**
  - Repeated red-cell transfusion during ASCT recovery + prior chemo
    leaves many survivors iron-overloaded (ferritin >1000).
  - Iron overload contributes to bone-marrow stress and t-MDS risk.
  - Phlebotomy (preferred when hemoglobin permits) or chelation
    (deferasirox) per NCCN MDS / AAMC guidance.

  Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Стандартний-трек surveillance для ASCT-survivor t-MDS/t-AML
  prevention per NCCN AML Survivorship 2025 + COG-LTFU v5 2018.

  **(1) CBC з диференційною q3-6 місяців для перших 10 років post-
  ASCT** — Потім q12mo lifelong. Median t-MDS/t-AML latency 3-7
  років post-ASCT; risk plateaus до 10 років але не повертається до
  baseline.

  **(2) Low-threshold marrow evaluation** при:
  - New unexplained cytopenia (anemia, neutropenia, thrombocytopenia)
    sustained >4-8 тижнів.
  - Persistent macrocytosis (MCV >100) on serial measurements.
  - Dysplastic changes на peripheral smear (hypogranular neutrophils,
    pseudo-Pelger-Huet, ring sideroblasts, blasts).
  - Unexplained monocytosis.
  Bone marrow aspirate + biopsy + cytogenetics + flow + NGS panel.

  **(3) Clonal hematopoiesis (CHIP) screening** — коли available,
  baseline targeted-NGS panel 1-2 роки post-ASCT identifies CHIP
  carriers at higher progression risk.

  **(4) Уникати additional bone-marrow-toxic exposures** — additional
  alkylator-based therapy якщо alternative non-leukemogenic regimens
  exist; counsel про benzene exposure; avoid unnecessary diagnostic
  radiation.

  **(5) Allogeneic HSCT eligibility pre-assessment** — within first 2
  років post-ASCT — donor search + comorbidity assessment.

  **(6) Patient education** — self-monitoring для symptoms: easy
  bruising, prolonged bleeding, persistent fatigue, recurrent
  infections, unexplained fever.

  **(7) Iron-overload management** — phlebotomy (preferred) або
  chelation (deferasirox).

  Per CHARTER §11 framing автономії пацієнта.

