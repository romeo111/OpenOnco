expected_outcomes:
  overall_response_rate: >-
    CBC with differential q3-6 months for the first 10 years post-
    ASCT catches t-MDS at the cytopenic phase before overt t-AML
    transformation in a meaningful subset of cases. Surveillance-
    detected t-MDS / early t-AML is markedly more amenable to
    definitive therapy — allogeneic HSCT in fit candidates achieves
    durable remission in 30-50% of t-MDS / t-AML vs. <20% with
    delayed presentation in overt advanced t-AML. Routine CBC has
    low procedural burden and high yield per surveillance contact.

