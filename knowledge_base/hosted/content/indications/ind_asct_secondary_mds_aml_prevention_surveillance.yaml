sources:
  - source_id: SRC-NCCN-AML-2025
    position: supports
  - source_id: SRC-COG-LTFU-V5-2018
    position: supports
    relevant_quote_paraphrase: >-
      "Survivors of autologous stem-cell transplantation following
      hematologic / lymphoid malignancy carry a 1-5% cumulative
      10-year risk of therapy-related myelodysplastic syndrome or
      acute myeloid leukemia. CBC with differential q3-6 months for
      the first 10 years post-ASCT enables early detection at the
      cytopenic phase when allogeneic HSCT is more likely to be
      curative."
  - source_id: SRC-EINHORN-HDCT-ASCT-2007
    position: context

do_not_do:
  - "Не пропускати CBC surveillance — median t-MDS/t-AML latency 3-7 років post-ASCT, не years 1-2."
  - "Не виконувати routine prophylactic marrow biopsies у asymptomatic ASCT survivors з normal CBC — yield poor."
  - "Не очікувати t-MDS/t-AML обмежується першими 5 роками — cumulative incidence продовжує наростати до 10 років."
  - "Не використовувати alkylator-based regimens для curable subsequent cancers якщо alternative non-leukemogenic regimens exist."
  - "Не вважати t-MDS / t-AML always fatal — early-detected disease amenable до allogeneic HSCT з meaningful long-term survival."
  - "Не пропускати iron-overload assessment — repeated transfusion-related iron overload contributes до bone-marrow stress + t-MDS risk."
  - "Не нормалізувати persistent cytopenia ≥1-2 років post-ASCT як 'expected recovery' — variable but cytopenia що не recovery at 1-2 year mark merits marrow evaluation."

do_not_do_en:
  - "Do not skip CBC surveillance — median t-MDS/t-AML latency is 3-7 years post-ASCT, not years 1-2."
  - "Do not perform routine prophylactic marrow biopsies in asymptomatic ASCT survivors with normal CBC — yield is poor."
  - "Do not expect t-MDS/t-AML to be limited to the first 5 years — cumulative incidence continues to climb through 10 years."
  - "Do not use alkylator-based regimens for curable subsequent cancers when an alternative non-leukemogenic regimen exists."
  - "Do not consider t-MDS / t-AML always fatal — early-detected disease is amenable to allogeneic HSCT with meaningful long-term survival."
  - "Do not skip iron-overload assessment — repeated transfusion-related iron overload contributes to bone-marrow stress and t-MDS risk."
  - "Do not normalize persistent cytopenia ≥1-2 years post-ASCT as 'expected recovery' — cytopenia that does not recover at the 1-2 year mark merits marrow evaluation."

