expected_outcomes:
  overall_response_rate: "Empirical A-T-protocol surveillance without genetic confirmation captures lymphoma + leukemia at earlier stage in true biallelic carriers (~40-70% of suspicion cohort) and supports breast surveillance for heterozygous female relatives, but with lower diagnostic precision and without cascade-testing infrastructure."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests: [TEST-CBC]
desired_tests: []

rationale: >
  Alternative-track companion. Empirical surveillance for A-T-suspect
  pedigree without germline genetic confirmation:
  - Annual physical + lymph-node exam + CBC + LDH for hematologic
    malignancy surveillance
  - Whole-body MRI option for unexplained symptoms; avoid CT (presumed
    radiation hypersensitivity)
  - Annual breast MRI + mammogram from age 40 for adult female relatives
    (empirical ATM-heterozygous-equivalent surveillance)
  - Defer cascade testing pending genetic confirmation

rationale_ua: >
  Альтернативно-трекова Indication. Empirical surveillance для A-T-
  suspect pedigree без genetic confirmation:
  - Annual фізикальне обстеження + lymph-node exam + CBC + LDH
  - Whole-body MRI як опція (уникати CT)
  - Annual breast MRI + mammogram з 40 років для дорослих жіночих
    родичок (empirical ATM-heterozygous-equivalent)
  - Cascade testing відкладається до genetic confirmation

