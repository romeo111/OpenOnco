rationale: >
  Standard-track prevention pathway for Ataxia-Telangiectasia (biallelic
  ATM) suspicion.

  **(1) Genetic counseling + germline ATM panel testing.** Autosomal
  recessive inheritance. Multi-gene hereditary lymphoma / chromosomal-
  instability panel (ATM, NBN, MRE11, BLM, FANCA-Q, BRCA1/2) recommended
  given phenotypic overlap with other chromosome-instability syndromes
  (Nijmegen breakage, FA, Bloom).

  **(2) Confirmed biallelic ATM carrier surveillance** (A-T Children's
  Project + Cairney 2016 + NCCN B-cell lymphoma):
  - Annual physical + lymph-node exam from diagnosis; low threshold for
    biopsy of persistent lymphadenopathy (hematologic-malignancy risk
    domination)
  - Annual CBC + LDH + immunoglobulin panel (track T/B-cell function +
    surveil for evolving lymphoma / leukemia)
  - Whole-body MRI option for unexplained symptoms (avoid CT — radiation
    hypersensitivity)
  - Pulmonary function + chest imaging for bronchiectasis surveillance
  - Aggressive infection management; immunoglobulin replacement for IgG /
    IgA deficiency
  - Avoid therapeutic ionizing radiation; reduce diagnostic-CT use to
    medically essential indications only

  **(3) Heterozygous ATM-carrier (female relative) breast surveillance**
  (NCCN Genetic/Familial Breast-Ovarian 2025):
  - Annual breast MRI + mammogram alternating q6 months from age 40
  - Discuss risk-reducing options on individualized basis; ATM
    heterozygosity confers moderate breast-cancer risk (~2-4× general
    population)

  **(4) Cascade testing** of at-risk relatives — identifies both biallelic
  carriers (require A-T management) and heterozygotes (require breast
  surveillance + radiation-exposure counseling).

rationale_ua: >
  Стандартний-трек prevention для Ataxia-Telangiectasia (biallelic ATM).

  **(1) Genetic counseling + germline ATM panel.** Autosomal recessive
  inheritance. Multi-gene hereditary lymphoma / chromosomal-instability
  panel.

  **(2) Biallelic ATM carrier surveillance:**
  - Annual фізикальне обстеження + lymph-node exam; low threshold для
    biopsy persistent lymphadenopathy
  - Annual CBC + LDH + immunoglobulin panel
  - Whole-body MRI як опція (уникати CT — radiation hypersensitivity)
  - PFT + chest imaging для bronchiectasis
  - Aggressive infection management; IVIG для IgG / IgA deficiency
  - Уникати therapeutic ionizing radiation

  **(3) Heterozygous ATM-carrier female breast surveillance:**
  - Annual breast MRI + mammogram alternating q6 months з 40 років
  - Individualized risk-reducing options discussion

  **(4) Cascade testing** identifies biallelic + heterozygous родичів.

