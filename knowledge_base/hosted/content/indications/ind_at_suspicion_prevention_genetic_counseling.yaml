do_not_do:
  - "Не використовувати therapeutic ionizing radiation у biallelic ATM carriers — radiation hypersensitivity → severe acute + late toxicity."
  - "Не пропускати immunoglobulin replacement якщо є IgG / IgA deficiency — recurrent sinopulmonary infections скорочують life expectancy."
  - "Не ігнорувати heterozygous-carrier breast surveillance у жіночих родичок — ATM heterozygosity confers moderate breast risk."

do_not_do_en:
  - "Do not deliver therapeutic ionizing radiation to biallelic ATM carriers — radiation hypersensitivity → severe acute + late toxicity."
  - "Do not skip immunoglobulin replacement when IgG / IgA deficiency present — recurrent sinopulmonary infections shorten life expectancy."
  - "Do not ignore heterozygous-carrier breast surveillance in female relatives — ATM heterozygosity confers moderate breast risk."

