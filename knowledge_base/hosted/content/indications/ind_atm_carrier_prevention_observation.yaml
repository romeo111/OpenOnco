expected_outcomes:
  overall_response_rate: >-
    Mammography-only breast surveillance + symptom-driven other workup
    + general-population schedules for non-breast cancers. Acceptable
    when patient declines MRI screening (cost, anxiety, biopsy rate)
    or when MRI is inaccessible. Higher residual breast cancer risk
    than standard track for dense-breast-tissue subset.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (less intensive surveillance) alternative for ATM
  heterozygous carriers who decline annual MRI screening or where MRI
  is inaccessible. Mammographic surveillance retained from age 40;
  pancreatic surveillance retained only for FDR-of-PDAC carriers.

  Components:
    - **Breast surveillance:** annual mammography from age 40;
      symptom-driven evaluation; no routine MRI.
    - **Pancreatic surveillance:** retained for FDR-of-PDAC carriers
      per CAPS; deferred for non-FDR ATM carriers.
    - **Prostate awareness:** PSA + DRE from age 40 with shared
      decision-making.
    - **Cascade testing retained.**
    - **Re-offer MRI screening annually** — patient preference may
      change.

rationale_ua: >
  Aggressive-трек (less intensive surveillance) альтернатива для ATM
  heterozygous carriers які declining annual MRI screening або де MRI
  inaccessible. Mammographic surveillance retained з 40 років;
  pancreatic surveillance retained тільки для FDR-of-PDAC carriers.

  Компоненти:
    - **Breast surveillance:** annual mammography з 40 років; symptom-
      driven evaluation; без routine MRI.
    - **Pancreatic surveillance:** retained для FDR-of-PDAC carriers
      per CAPS.
    - **Prostate awareness:** PSA + DRE з 40 років з shared decision-
      making.
    - **Cascade testing retained.**
    - **Re-offer MRI screening щорічно.**

