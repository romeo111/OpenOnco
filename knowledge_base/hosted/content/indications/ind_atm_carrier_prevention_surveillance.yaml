do_not_do:
  - "Не призначати pancreatic surveillance ATM-carrier без PDAC сімейної історії — yield низький, harms imaging exposure не виправдані."
  - "Не екстраполювати biallelic A-T radiation-sensitivity на heterozygotes — therapeutic radiation safe у carriers."
  - "Не пропускати cascade testing FDRs — ~50% будуть носіями."

do_not_do_en:
  - "Do not order pancreatic surveillance in an ATM carrier without PDAC family history — yield is low and the imaging-exposure harms are not justified."
  - "Do not extrapolate biallelic A-T radiation-sensitivity to heterozygotes — therapeutic radiation is safe in carriers."
  - "Do not skip cascade testing of FDRs — ~50% will be carriers."

known_controversies:
  - topic: "Annual breast MRI vs mammography alone in ATM carriers"
    positions:
      - position: "Add MRI from age 40"
        rationale: "NCCN places ATM in moderate-elevated tier; MRI improves early-stage detection in dense breast tissue."
      - position: "Mammography alone may suffice"
        rationale: "Specificity of MRI lower in moderate-penetrance cohorts; biopsy burden + cost."
    our_default: "Offer MRI annually; share decision with patient about specificity + cost + biopsy rate."
    rationale: "Patient autonomy + risk-tolerance variability."

