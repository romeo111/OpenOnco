rationale: >
  Standard-track prevention pathway for ATM heterozygous carriers per
  NCCN Genetic/Familial High-Risk Assessment Breast/Ovarian + Pancreatic
  2025.

  Components:
    - **Breast surveillance:**
      - Annual mammography from age 40 (consider 35-40 for ATM
        c.7271T>G + truncating variants in NCCN moderate-elevated
        modifier risk).
      - Annual breast MRI consideration from age 40 (NCCN moderate-
        elevated tier — not mandated, shared decision with patient
        about specificity + cost trade-offs).
      - Clinical breast examination semi-annually from age 25-30.
      - Breast cancer awareness + symptom-triggered evaluation.
    - **Pancreatic surveillance (CAPS Consortium 2022 / NCCN 2025):**
      - Indicated for ATM carriers with FDR or SDR of PDAC (multi-
        generational PDAC family history).
      - Method: alternating EUS + abdominal MRI/MRCP every 12 months
        from age 50 OR 10 years before earliest PDAC in family
        (whichever earlier).
      - NOT indicated for ATM carriers without PDAC family history —
        general-population pancreatic screening lacks evidence.
      - Refer to high-volume pancreatic surveillance center.
    - **Prostate awareness (males):**
      - PSA + DRE from age 40 with shared decision-making.
      - Earlier evaluation of any urinary symptoms.
    - **Cascade testing:** FDRs offered testing for the family-specific
      ATM variant (genetic counseling required).
    - **Reproductive counseling:**
      - PGT-M (preimplantation genetic testing for monogenic disorders)
        available for couples planning children — both partners may
        carry recessive A-T phenotype risk if partner is also an ATM
        carrier (~1% population frequency).
    - **Radiation avoidance considerations:**
      - Therapeutic radiation tolerance is normal in heterozygotes
        (unlike biallelic A-T phenotype) — no radiation contra-
        indication for cancer treatment.
      - Diagnostic radiation exposure should follow general principles
        (justified + As Low As Reasonably Achievable).
    - **Lifestyle:** standard cancer-prevention (no tobacco, limit
      alcohol, maintain healthy BMI, physical activity).

  In Ukraine, multi-gene panel testing via Institute of Genetics + select
  private labs; ATM is included in standard hereditary cancer panels.
  Breast MRI screening available at major academic centers in Kyiv,
  Lviv, Odesa, Kharkiv. Pancreatic surveillance limited to academic
  hepatobiliary centers.

rationale_ua: >
  Стандартний-трек prevention шлях для ATM heterozygous carriers per
  NCCN Genetic/Familial High-Risk Assessment Breast/Ovarian + Pancreatic
  2025.

  Компоненти:
    - **Breast surveillance:**
      - Mammography щорічно з 40 років (consider 35-40 для ATM
        c.7271T>G + truncating variants у NCCN moderate-elevated
        modifier risk).
      - Annual breast MRI consideration з 40 років (NCCN moderate-
        elevated tier — не mandated, shared decision).
      - Clinical breast examination semi-annually з 25-30 років.
    - **Pancreatic surveillance (CAPS Consortium 2022 / NCCN 2025):**
      - Indicated для ATM carriers з FDR або SDR of PDAC.
      - Method: alternating EUS + abdominal MRI/MRCP кожні 12 міс з
        50 років АБО 10 років до earliest PDAC у family.
      - НЕ indicated для ATM carriers без PDAC family history.
    - **Prostate awareness (males):**
      - PSA + DRE з 40 років з shared decision-making.
    - **Cascade testing:** FDRs offered testing для family-specific
      ATM variant.
    - **Reproductive counseling:** PGT-M для couples planning children.
    - **Radiation avoidance:** therapeutic radiation tolerance normal у
      heterozygotes (unlike biallelic A-T).
    - **Lifestyle:** standard cancer-prevention.

  В Україні multi-gene panel testing via Institute of Genetics + select
  private labs; ATM включений у standard hereditary cancer panels.
  Breast MRI screening у Києві, Львові, Одесі, Харкові. Pancreatic
  surveillance обмежено academic hepatobiliary centers.

