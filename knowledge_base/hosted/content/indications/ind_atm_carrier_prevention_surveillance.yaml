expected_outcomes:
  overall_response_rate: >-
    Enhanced breast surveillance (mammography ± MRI, earlier starting
    age) shifts breast cancer stage at diagnosis from advanced to
    early — 5y OS >95% for early-stage vs ~70-85% advanced. Pancreatic
    surveillance in PALB2/ATM-FDR-of-PDAC cohorts has reported
    early-stage detection rates ~30-60% in CAPS Consortium cohorts
    (vs ~10-15% in unscreened controls). Modest absolute mortality
    benefit; appropriate-counseling about screening sensitivities + harms.

