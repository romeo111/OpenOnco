rationale: >
  Aggressive-track companion to IND-ATM-SUSPICION-PREVENTION-TESTING.
  Patient with pedigree suspicion of germline ATM carrier state who
  declines genetic counseling and/or panel testing — for any reason
  (cost, insurance / GINA concerns, psychological / cancer-anxiety
  considerations, family privacy, geographic access constraints,
  religious or cultural objections to genetic testing) — is offered
  empirical enhanced surveillance based on family history alone
  (best-available proxy in the absence of genetic confirmation):

  **Breast (women):**
  - Annual mammography starting at age (earliest first-degree
    family breast cancer age) minus 10 years, but no earlier than
    age 30 (Tyrer-Cuzick / IBIS quantitative risk modelling may
    refine starting age).
  - Annual breast MRI consideration if Tyrer-Cuzick lifetime risk
    ≥20% — many ATM-suspicion pedigrees meet this threshold based
    on family history alone, qualifying for insurance-covered MRI
    in some jurisdictions.
  - Clinical breast exam q6-12 months by clinician familiar with
    high-risk surveillance.
  - Patient-performed monthly breast self-exam encouraged (modest
    evidence base, no harm).

  **Pancreatic:** ATM-suspicion families with ≥2 first/second-
  degree relatives with PDAC qualify for CAPS Consortium 2022
  high-risk surveillance based on family history alone, regardless
  of genetic-testing status (alternating EUS + MRI/MRCP annually
  from age 50 or 10 years before earliest family PDAC). Single-PDAC
  families do NOT qualify empirically — yield is low without
  confirmed carrier status. Refer to high-volume pancreatic
  surveillance center.

  **Prostate awareness (males in pedigree):** PSA + DRE from age
  45-50 (lower than population threshold given pedigree ATM-
  suspicion — ATM-associated prostate cancer is often high-grade).

  **Risk-reducing surgery:** NOT offered empirically without
  genetic confirmation. Risk-reducing mastectomy is a major
  irreversible intervention that requires demonstrated carrier
  status to justify the harm/benefit ratio. Patients re-considering
  testing later in life is appropriate and supported — many
  decline-testing patients eventually accept testing after
  additional clinic visits, family events, or reduced anxiety.

  **Reproductive counseling:** PGT-M for monogenic disorders
  cannot be offered without an identified familial variant —
  patients planning children should be re-offered genetic testing
  in the reproductive-planning context, where the case for PGT-M
  may be compelling.

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. Patients who decline testing
  retain access to surveillance benefit, with the explicit caveat
  that empirical surveillance lacks the diagnostic precision of
  confirmed genetic status — and notably, that cascade testing of
  family members and PGT-M reproductive options are unavailable
  without a confirmed familial variant. Periodic re-discussion of
  testing is appropriate; this pathway does not preclude future
  genetic testing.

  Routing reconsiderations: if patient eventually accepts genetic
  testing, results route to (a) confirmed-ATM-carrier carrier-
  specific pathway, (b) general-population pathway, or (c)
  continued pedigree-suspicion if VUS.

  **Resource-intensity caveat:** Annual breast MRI is expensive
  (~3000-8000 UAH per scan in Ukrainian private centers; insurance-
  varying in US/EU). Pancreatic surveillance via EUS/MRI is
  available only at academic hepatobiliary centers (Kyiv, Lviv,
  Odesa, Kharkiv). Empirical lifetime imaging surveillance without
  genetic confirmation may not be a sustainable resource allocation;
  testing-first is the cost-effective default at population scale,
  and this Indication explicitly frames the empirical-surveillance
  pathway as patient-autonomy-respecting rather than cost-optimal.

rationale_ua: >
  Aggressive-track компаньйон до IND-ATM-SUSPICION-PREVENTION-
  TESTING. Пацієнт з родовідною підозрою на ATM carrier state,
  який відмовляється від генетичного консультування та/або
  панельного тестування — з будь-якої причини (вартість, страхові /
  GINA міркування, психологічні / cancer-anxiety міркування, сімейна
  приватність, географічні обмеження доступу, релігійні чи культурні
  заперечення проти генетичного тестування) — отримує empіричне
  посилене спостереження на основі сімейної історії (best-available
  proxy в відсутність генетичного підтвердження):

  **Молочна залоза (жінки):**
  - Mammography щорічно з віку (earliest first-degree family breast
    cancer age) мінус 10 років, але не раніше 30 (Tyrer-Cuzick /
    IBIS quantitative risk modelling може уточнити starting age).
  - Annual breast MRI consideration, якщо Tyrer-Cuzick lifetime
    ризик ≥20% — багато ATM-suspicion родоводів відповідають цьому
    порогу за сімейною історією.
  - Clinical breast exam q6-12 міс. клініцистом, знайомим з high-
    risk скринінгом.
  - Monthly breast self-exam заохочується.

  **Підшлункова:** ATM-suspicion родини з ≥2 first/second-degree
  родичами з PDAC кваліфікуються на CAPS Consortium 2022 high-risk
  surveillance за сімейною історією, незалежно від genetic-testing
  status (alternating EUS + MRI/MRCP щорічно з 50 років або 10
  років до earliest family PDAC). Single-PDAC родини НЕ
  кваліфікуються emпірично — yield низький без підтвердженого
  carrier status.

  **Prostate awareness (males у pedigree):** PSA + DRE з 45-50
  років (нижчий, ніж популяційний поріг враховуючи pedigree ATM-
  suspicion).

  **Risk-reducing хірургія:** НЕ пропонується emпірично без
  genetic confirmation.

  **Reproductive counseling:** PGT-M не може бути запропонована
  без ідентифікованого familial variant — пацієнти, що планують
  дітей, повинні бути повторно запрошені на genetic testing у
  reproductive-planning контексті.

  Per CHARTER §11 framing автономії пацієнта. Periodic re-
  discussion testing доречне; цей шлях не preclude future genetic
  testing.

