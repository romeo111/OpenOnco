do_not_do:
  - "Не презентувати enhanced surveillance як еквівалент genetic confirmation — diagnostic precision відсутня, і cascade testing FDRs неможливе без identified familial variant."
  - "Не рекомендувати risk-reducing хірургію (мастектомія) без genetic confirmation — підтверджене carrier status потрібне для виправдання незворотного втручання."
  - "Не пропускати periodic re-discussion про genetic testing — багато пацієнтів врешті приймають тестування після додаткових візитів, сімейних подій та зменшення тривоги; testing-first шлях клінічно та коштом більш ефективний."
  - "Не призначати pancreatic surveillance ATM-suspicion пацієнтам з single-PDAC сімейною історією — yield низький без carrier confirmation."
  - "Не пропускати male-line розгляд — ATM чоловіки у pedigree мають підвищений ризик high-grade простатичного раку і потребують відповідного скринінгу."

do_not_do_en:
  - "Do not present enhanced surveillance as equivalent to genetic confirmation — diagnostic precision is absent and cascade testing of FDRs is impossible without an identified familial variant."
  - "Do not recommend risk-reducing surgery (mastectomy) without genetic confirmation — confirmed carrier status is required to justify these irreversible interventions."
  - "Do not skip periodic re-discussion of genetic testing — most patients eventually accept testing after additional visits, family events, and reduced anxiety; the testing-first pathway is more clinically and cost-effective."
  - "Do not order pancreatic surveillance in ATM-suspicion patients with single-PDAC family history — yield is low without carrier confirmation."
  - "Do not skip male-line consideration — ATM men in the pedigree have elevated high-grade prostate cancer risk and need appropriate screening."

