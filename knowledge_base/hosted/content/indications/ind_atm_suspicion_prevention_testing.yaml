do_not_do:
  - "Не призначати germline тестування без pre-test консультування — інформована згода, психологічна підготовка та обговорення GINA-наслідків обов'язкові."
  - "Не трактувати VUS результат як патогенний — управляйте як родовідну підозру до подальших даних з segregation analysis або functional studies."
  - "Не екстраполювати biallelic A-T radiation-sensitivity на heterozygote carriers — therapeutic radiation безпечна у carriers після позитивного панельного результату."
  - "Не пропускати pancreatic surveillance у carrier-positive subset з PDAC сімейною історією — CAPS Consortium 2022 endorses EUS + MRI/MRCP щорічно з 50 років або 10 років до earliest PDAC у family для FDR/SDR-PDAC carriers."
  - "Не призначати pancreatic surveillance ATM-carrier без PDAC сімейної історії — yield низький, harms imaging exposure не виправдані."
  - "Не пропускати cascade тестування FDRs після positive carrier confirmation — ~50% будуть carriers і отримують відповідне surveillance."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling — informed consent, psychological preparation, and GINA-implication discussion are mandatory."
  - "Do not treat a VUS result as pathogenic — manage as pedigree suspicion pending further data from segregation analysis or functional studies."
  - "Do not extrapolate biallelic A-T radiation-sensitivity to heterozygote carriers — therapeutic radiation is safe in carriers after positive panel confirmation."
  - "Do not skip pancreatic surveillance in the carrier-positive subset with PDAC family history — CAPS Consortium 2022 endorses EUS + MRI/MRCP annually from age 50 or 10 years before earliest PDAC in family for FDR/SDR-PDAC carriers."
  - "Do not order pancreatic surveillance in an ATM carrier without PDAC family history — yield is low and the imaging-exposure harms are not justified."
  - "Do not skip cascade testing of FDRs after positive carrier confirmation — ~50% will be carriers and receive appropriate surveillance."

