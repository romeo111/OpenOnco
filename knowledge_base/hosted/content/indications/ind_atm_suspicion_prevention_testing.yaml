rationale: >
  Standard-track prevention pathway for individuals with pedigree-
  based suspicion of germline ATM carrier state. Two parallel
  referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant for the cancer-predisposing
  carrier state; autosomal recessive for the biallelic Ataxia-
  Telangiectasia phenotype — critical distinction), penetrance
  (moderate breast RR ~2.0-2.4, lifetime ~20-30%; pancreatic RR
  ~5-10 in FDR-of-PDAC subset, lifetime ~5-9%; prostate RR ~2-3
  with high-grade enrichment), implications for FDRs (cascade
  testing if positive — ~50% of FDRs are also carriers), GINA /
  insurance considerations (US protections + check Ukrainian / EU
  jurisdiction equivalents), reproductive implications (carrier-by-
  carrier couples have 25% biallelic A-T risk per pregnancy —
  preimplantation genetic testing for monogenic disorders / PGT-M
  available), psychological aspects (lower cancer-anxiety load
  than BRCA but pancreatic-cancer family history is highly
  distressing). Per ACMG / ASCO / NCCN, pre-test counseling by a
  certified genetic counselor or trained clinician is the standard
  of care before germline testing.

  **(2) Germline multi-gene HBOC/PDAC-inclusive panel testing.**
  Modern panels (e.g., Invitae Common Hereditary Cancers panel,
  Color hereditary cancer panel, GeneDx OncoGene Comprehensive,
  Myriad MyRisk, Ambry CancerNext) cover BRCA1, BRCA2, PALB2,
  CHEK2, ATM, RAD51C, RAD51D, BRIP1, plus contextual genes (TP53,
  PTEN, STK11, CDH1, NF1). For pancreatic-extended risk pedigrees,
  panels add CDKN2A (FAMMM), STK11 (Peutz-Jeghers), and MMR genes
  (Lynch). Variant classification per ACMG framework: pathogenic /
  likely pathogenic / VUS / likely benign / benign.

  **Sequel pathway (positive panel — confirmed ATM carrier):**
  Transition to ATM-carrier surveillance pathway
  (IND-ATM-CARRIER-PREVENTION-SURVEILLANCE — standard track for
  RF-ATM-CONFIRMED-CARRIER):
  - Annual mammography from age 40 (consider 35-40 for ATM
    c.7271T>G + truncating variants per NCCN moderate-elevated
    modifier risk).
  - Annual breast MRI consideration from age 40 (NCCN moderate-
    elevated tier — shared decision with patient about specificity
    + cost trade-offs).
  - Clinical breast exam q6-12mo from age 25-30.
  - Pancreatic surveillance — alternating EUS + MRI/MRCP annually
    from age 50 OR 10 years before earliest PDAC in family, for
    carriers with FDR or SDR of PDAC (CAPS Consortium 2022 / NCCN
    2025). NOT indicated for ATM carriers without PDAC family
    history — yield is low, harms from repeated imaging not
    justified.
  - Prostate awareness (males): PSA + DRE from age 40 with shared
    decision-making.
  - Cascade testing of FDRs for the family-specific ATM variant
    (~50% will be carriers).
  - Reproductive counseling: PGT-M available for couples planning
    children when both partners may carry ATM variants (1%
    population frequency).
  - Radiation avoidance: therapeutic radiation tolerance is normal
    in heterozygotes (unlike biallelic A-T) — no radiation contra-
    indication for cancer treatment.

  **Sequel pathway (positive panel — non-ATM variant identified):**
  route to gene-specific carrier pathway (BRCA1/2, PALB2, CHEK2,
  RAD51C/D, BRIP1, etc.). Multi-gene panels are designed precisely
  to avoid the "wrong gene tested" scenario.

  **Sequel pathway (negative panel for ATM and all panel genes):**
  empirical enhanced surveillance based on family history alone is
  offered as the aggressive-track alternative
  (IND-ATM-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE) —
  quantitative risk model (Tyrer-Cuzick for breast risk; family
  pancreatic history independently triggers CAPS-program eligibility
  per family pedigree even without identified gene) may indicate
  residual elevated risk warranting enhanced surveillance.

  **Sequel pathway (VUS):** managed as pedigree-suspicion (this
  pathway) until segregation analysis or functional studies
  reclassify. VUS does NOT drive clinical management decisions.

  In Ukraine, multi-gene panel testing is available via Institute
  of Genetics + select private labs at out-of-pocket cost
  (~8000-20000 UAH for comprehensive HBOC/PDAC-inclusive panel).
  Genetic counseling is available at major academic centers in
  Kyiv, Lviv, Odesa, Kharkiv; rural / regional access is limited
  and may rely on tele-counseling.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з родовідною підозрою
  на гермінативний heterozygous carrier ATM. Два паралельні
  направлення:

  **(1) Направлення на генетичне консультування.** Pre-test
  консультування охоплює: спадкування (autosomal dominant для
  cancer-predisposing carrier state; autosomal recessive для
  biallelic Ataxia-Telangiectasia фенотипу — критична відмінність),
  пенетрантність (moderate breast RR ~2.0-2.4, lifetime ~20-30%;
  pancreatic RR ~5-10 у FDR-of-PDAC subset, lifetime ~5-9%; prostate
  RR ~2-3 з high-grade enrichment), наслідки для FDRs (cascade
  тестування при позитиві — ~50% FDRs також carriers), GINA /
  страхові міркування, репродуктивні наслідки (carrier-by-carrier
  пари мають 25% biallelic A-T ризик на вагітність — PGT-M
  доступний), психологічні аспекти. За ACMG / ASCO / NCCN, pre-
  test консультування у сертифікованого генетичного консультанта
  або навченого клініциста — standard of care перед germline
  тестуванням.

  **(2) Germline мультигенне HBOC/PDAC-inclusive панельне
  тестування.** Сучасні панелі (напр., Invitae Common Hereditary
  Cancers panel, Color hereditary cancer panel, GeneDx OncoGene
  Comprehensive, Myriad MyRisk, Ambry CancerNext) покривають BRCA1,
  BRCA2, PALB2, CHEK2, ATM, RAD51C, RAD51D, BRIP1, плюс контекстуальні
  гени. Для pancreatic-extended ризику панелі додають CDKN2A
  (FAMMM), STK11 (Peutz-Jeghers), MMR гени (Lynch). Класифікація
  варіантів за рамкою ACMG.

  **Наступний шлях (позитивна панель — підтверджений ATM carrier):**
  перехід на ATM-carrier surveillance шлях
  (IND-ATM-CARRIER-PREVENTION-SURVEILLANCE — standard track для
  RF-ATM-CONFIRMED-CARRIER):
  - Mammography щорічно з 40 років (consider 35-40 для ATM
    c.7271T>G + truncating variants).
  - Annual breast MRI consideration з 40 років (NCCN moderate-
    elevated tier — shared decision).
  - Clinical breast exam q6-12 міс з 25-30 років.
  - Pancreatic surveillance — alternating EUS + MRI/MRCP щорічно з
    50 років АБО 10 років до earliest PDAC у family, для carriers
    з FDR або SDR of PDAC (CAPS Consortium 2022).
  - Prostate awareness (males): PSA + DRE з 40 років.
  - Cascade testing FDRs (~50% будуть carriers).
  - Reproductive counseling: PGT-M для couples planning children.
  - Radiation avoidance: therapeutic radiation tolerance normal у
    heterozygotes (unlike biallelic A-T).

  **Наступний шлях (позитивна панель — non-ATM variant):**
  маршрутизація на gene-specific carrier шлях.

  **Наступний шлях (негативна панель):** empіричне посилене
  спостереження на основі сімейної історії пропонується як
  aggressive-track альтернатива
  (IND-ATM-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE).

  **Наступний шлях (VUS):** ведеться як родовідна підозра до
  реклассифікації.

  В Україні multi-gene panel testing via Institute of Genetics +
  select private labs (~8000-20000 UAH); консультування у академічних
  центрах Києва, Львова, Одеси, Харкова.

