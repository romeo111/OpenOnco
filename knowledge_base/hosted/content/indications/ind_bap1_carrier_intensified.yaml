rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-BAP1-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-BAP1-CARRIER-
  SURVEILLANCE applies (annual whole-body skin exam, annual dilated
  fundoscopy, annual abdominal MRI, chest CT q1-3y, asbestos-avoidance
  counseling).

  **Intensification 1 — Intensified asbestos-avoidance counseling:**
  Active occupational-history review at each visit. Identify and
  intervene on:
    - Direct occupational exposure (construction, shipyard, military
      bases, asbestos abatement, brake repair, insulators, boilermakers)
    - Environmental exposure (proximity to asbestos mining, processing,
      contaminated soil)
    - Take-home exposure (family member bringing dust from worksite)
    - Recreational exposure (DIY home renovation, vehicle restoration,
      hobby ceramics with vermiculite)

  For documented exposure, refer for occupational-medicine consultation
  (baseline pulmonary function, chest imaging, exposure quantification,
  legal-rights counseling where applicable in Ukraine / EU framework).

  **Intensification 2 — Earlier mesothelioma surveillance — chest CT
  annually (vs q1-3y standard):** For carriers with any documented
  asbestos history (occupational, environmental, or take-home),
  advance chest CT cadence to annual. Low-dose CT acceptable for
  surveillance; standard CT for any new abnormality. Mesothelioma
  early-detection lead time is the rate-limiting factor in
  multimodality cure feasibility.

  **Other intensification considerations (not core to this track):**
    - Prophylactic pleurodesis is NOT routine — performed only for
      symptomatic recurrent effusion.
    - Empirical anti-asbestos chemoprevention does not exist; no
      pharmacotherapy reduces BAP1-mesothelioma risk.
    - Genetic counseling for reproductive planning (preimplantation
      genetic testing, donor sperm / egg considerations) is appropriate
      for carriers of childbearing age; presented as one autonomy-
      preserving option among many.

  **Cascade testing remains continuous:** every visit re-confirms
  family testing status; particularly important given childhood-onset
  atypical Spitz tumors that may herald family BAP1-TPDS.

  Per CHARTER §11: intensified surveillance and lifestyle counseling
  are shared-decision-making. Patient autonomy paramount.

rationale_ua: >
  Aggressive-трекове показання, що доповнює стандартний протокол
  IND-BAP1-CARRIER-SURVEILLANCE.

  **Основа:** застосовується весь стандартний нагляд з IND-BAP1-CARRIER-
  SURVEILLANCE (щорічний огляд шкіри всього тіла, щорічна офтальмоскопія
  з розширенням зіниці, щорічна МРТ органів черевної порожнини, КТ
  грудної клітки кожні 1-3 роки, консультування щодо уникнення контакту
  з азбестом).

  **Інтенсифікація 1 — посилене консультування щодо уникнення контакту
  з азбестом:** активний перегляд професійного анамнезу на кожному
  візиті. Виявлення та реагування на:
    - прямий професійний контакт (будівництво, суднобудування, військові
      об'єкти, демонтаж азбесту, ремонт гальм, ізолювальні роботи,
      робота з котлами);
    - екологічний контакт (проживання поблизу видобутку чи переробки
      азбесту, забрудненого ґрунту);
    - побутовий контакт (член сім'ї приносить пил з робочого місця на
      одязі);
    - рекреаційний контакт (самостійний ремонт житла, реставрація
      транспортних засобів, аматорська кераміка з вермикулітом).

  За наявності документованого контакту — направлення на консультацію
  фахівця з професійних захворювань (базова функція зовнішнього дихання,
  візуалізація грудної клітки, кількісна оцінка контакту, консультування
  щодо юридичних прав відповідно до законодавства України / ЄС, де
  застосовно).

  **Інтенсифікація 2 — раннє виявлення мезотеліоми — щорічна КТ грудної
  клітки (замість стандартних 1-3 років):** для носіїв із будь-яким
  документованим анамнезом контакту з азбестом (професійним, екологічним
  або побутовим) — перехід на щорічну КТ грудної клітки. Низькодозова КТ
  прийнятна для скринінгу; стандартна КТ — за будь-якої нової знахідки.

  **Інші аспекти інтенсифікації (не є основними для цього треку):**
    - профілактичний плевродез НЕ є рутинним;
    - емпіричної хіміопрофілактики проти азбест-асоційованих пухлин не
      існує;
    - генетичне консультування щодо репродуктивного планування
      (передімплантаційне генетичне тестування, донорські сперма /
      яйцеклітини) є доречним для носіїв репродуктивного віку.

  **Каскадне тестування залишається безперервним процесом;** атипові
  пухлини Спітц з дитячим дебютом можуть бути першою ознакою родинного
  BAP1-TPDS.

  Відповідно до CHARTER §11: сфера спільного ухвалення рішень.

