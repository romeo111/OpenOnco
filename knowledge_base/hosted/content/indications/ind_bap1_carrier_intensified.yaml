    position: context
  - source_id: SRC-ASCO-ACMG-LYNCH-2014
    position: context
    relevant_quote_paraphrase: >-
      "Intensified asbestos-avoidance counseling and more frequent
      chest CT surveillance are appropriate intensifications for
      confirmed BAP1 carriers with documented occupational or
      environmental asbestos history, following shared decision-making."

do_not_do:
  - "Не посилювати частоту КТ грудної клітки без документованого анамнезу контакту з азбестом — довічне променеве навантаження; щорічну частоту зберігати лише для підгрупи високого ризику."
  - "Не виконувати профілактичний плевродез у безсимптомного носія — резервувати для симптоматичного рецидивного випоту."
  - "Не пропускати консультацію фахівця з професійних захворювань за документованого контакту — має юридичні наслідки та наслідки для деконтамінації робочого місця, що виходять за межі суто медичних."
  - "Не подавати генетичне консультування щодо репродукції як обов'язкове — це опція, що зберігає автономію, серед багатьох інших, а не імператив."
  - "Не використовувати емпіричну хіміопрофілактику проти азбест-асоційованих пухлин — вона не існує; будь-яка добавка чи трав'яний засіб, що рекламується як така, є псевдонаукою."

do_not_do_en:
  - "Do not intensify chest CT cadence without documented asbestos exposure history — lifelong radiation burden; reserve annual cadence for the high-risk subset."
  - "Do not perform prophylactic pleurodesis in an asymptomatic carrier — reserve for symptomatic recurrent effusion."
  - "Do not skip occupational-medicine consultation for documented exposure — legal-rights and workplace-decontamination implications go beyond medical."
  - "Do not present genetic reproductive counseling as mandatory — autonomy-preserving option among many, not imperative."
  - "Do not use empirical anti-asbestos chemoprevention — does not exist; any supplement or herbal marketed as such is pseudoscience."

