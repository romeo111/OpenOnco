expected_outcomes:
  overall_response_rate: "Germline BAP1 panel testing in pedigree-suspicion cohort: positive rate ~30-60% in classic phenotype. Confirmed carriers have lifetime risks: uveal melanoma ~30%, cutaneous melanoma ~15-25%, mesothelioma ~25%, clear-cell RCC ~10-15%, basal cell carcinoma + atypical Spitz tumors elevated. Surveillance enables early detection."

