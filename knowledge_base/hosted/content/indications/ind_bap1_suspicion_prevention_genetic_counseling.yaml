rationale: >
  Standard-track prevention pathway for BAP1 tumor predisposition syndrome.

  **(1) Genetic counseling + germline BAP1 panel testing.** Autosomal dominant
  inheritance.

  **(2) Confirmed-carrier surveillance protocol** (per BAP1 Interest Group
  consensus):
  - Annual ophthalmologic exam (dilated fundoscopy) for uveal melanoma
  - Annual whole-body skin exam by dermatologist for cutaneous melanoma + atypical
    Spitz tumors
  - Annual abdominal MRI for clear-cell RCC surveillance
  - Awareness of mesothelioma — chest imaging individualized; avoid asbestos
    exposure as additive risk

  **(3) Cascade testing of first-degree relatives.**

rationale_ua: >
  Стандартний трек профілактики синдрому спадкової схильності до пухлин,
  пов'язаного з BAP1.

  **(1) Генетичне консультування + гермінативне панельне тестування
  BAP1.** Тип успадкування — аутосомно-домінантний.

  **(2) Протокол нагляду за підтвердженими носіями** (відповідно до
  консенсусу BAP1 Interest Group):
  - щорічний офтальмологічний огляд (офтальмоскопія з розширенням
    зіниці) для виявлення увеальної меланоми;
  - щорічний огляд шкіри всього тіла дерматологом для виявлення шкірної
    меланоми та атипових пухлин Спітц;
  - щорічна МРТ органів черевної порожнини для скринінгу
    світлоклітинного нирково-клітинного раку;
  - обізнаність щодо ризику мезотеліоми — візуалізація грудної клітки
    індивідуалізована; уникнення контакту з азбестом як додаткового
    фактора ризику.

  **(3) Каскадне тестування родичів першого ступеня.**

