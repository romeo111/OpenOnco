rationale: >
  Standard-track prevention pathway for BARD1 heterozygous carriers per
  NCCN Genetic/Familial High-Risk Assessment Breast/Ovarian 2025.

  Components:
    - **Breast surveillance:**
      - Annual mammography from age 40 (or 5-10y before earliest
        family-breast-cancer diagnosis if family history present).
      - Annual breast MRI consideration in dense breast tissue +
        family history of multiple breast cancers (NCCN moderate-
        elevated tier modifier risk).
      - Clinical breast examination semi-annually from age 25-30.
    - **Ovarian surveillance:**
      - No routine screening (CA-125 + TVUS not endorsed).
      - Symptom-driven workup; education on persistent bloating, early
        satiety, urinary frequency/urgency, pelvic pain.
      - RRSO discussion if additional ovarian risk factors (family
        cluster with BARD1 + ovarian cancer); generally deferred at
        BARD1-only carriers.
    - **Cascade testing:** FDRs offered testing.
    - **Reproductive counseling:** PGT-M available.
    - **Lifestyle:** standard cancer-prevention.

  In Ukraine, multi-gene panel testing via Institute of Genetics +
  select private labs; BARD1 included in standard hereditary cancer
  panels. Breast MRI at academic centers in Kyiv, Lviv, Odesa,
  Kharkiv.

