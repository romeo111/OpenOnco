expected_outcomes:
  overall_response_rate: >-
    Empirical enhanced surveillance based on family history alone
    (annual mammography from earliest-family-breast-cancer-age minus
    10 years but no earlier than 30; clinical breast exam q6 months;
    MRI consideration in TNBC-enriched family pedigrees) is expected
    to capture breast cancer at earliest detectable stage in the
    subset who are actual BARD1 carriers (~5-15% of pedigree-
    suspicion individuals). Does NOT carry the diagnostic certainty
    of germline testing; cascade testing of FDRs is impossible
    without an identified familial variant. Ovarian surveillance
    NOT recommended empirically — modest BARD1 signal does not
    justify even in confirmed carriers.

