rationale: >
  Standard-track prevention pathway for individuals with pedigree-
  based suspicion of germline BARD1 carrier state. Two parallel
  referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant), penetrance (moderate
  breast RR ~2.0-3.0 lifetime ~20-30%; triple-negative subset
  enriched signal supports MRI-inclusive surveillance in TNBC-
  family-history cohorts; modest ovarian RR ~1.5-2.0 — does not
  justify routine RRSO), implications for FDRs (cascade testing
  if positive — ~50% of FDRs are also carriers), GINA / insurance
  considerations. Per ACMG / ASCO / NCCN, pre-test counseling by
  a certified genetic counselor or trained clinician is the
  standard of care before germline testing.

  **(2) Germline multi-gene HBOC panel testing.** Modern panels
  (e.g., Invitae Common Hereditary Cancers panel, Color hereditary
  cancer panel, GeneDx OncoGene Comprehensive, Myriad MyRisk,
  Ambry CancerNext) cover BRCA1, BRCA2, PALB2, CHEK2, ATM, RAD51C,
  RAD51D, BRIP1, BARD1, plus contextual genes (TP53, PTEN, STK11,
  CDH1, NF1). BARD1 is included in most HBOC panels as of 2024-2025
  (added to NCCN moderate-elevated breast tier in 2023 guideline
  updates). Variant classification per ACMG framework.

  **Sequel pathway (positive panel — confirmed BARD1 carrier):**
  Transition to BARD1-carrier surveillance pathway
  (IND-BARD1-CARRIER-PREVENTION-SURVEILLANCE — standard track for
  RF-BARD1-CONFIRMED-CARRIER):
  - Annual mammography from age 40 (consider MRI from age 35 in
    TNBC-family-history-enriched subset per moderate-elevated
    NCCN tier).
  - Annual breast MRI consideration from age 40 — shared decision
    with patient about specificity + cost.
  - Clinical breast exam q6-12mo from age 25-30.
  - Ovarian surveillance — NOT routinely indicated; symptom-driven
    workup only (modest RR signal).
  - Cascade testing of FDRs for the family-specific BARD1 variant.

  **Sequel pathway (positive panel — non-BARD1 variant identified):**
  route to gene-specific carrier pathway (BRCA1/2, ATM, PALB2,
  CHEK2, etc.).

  **Sequel pathway (negative panel):** empirical enhanced
  surveillance based on family history alone is offered as the
  aggressive-track alternative
  (IND-BARD1-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE).

  **Sequel pathway (VUS):** managed as pedigree-suspicion until
  reclassification.

  In Ukraine, multi-gene panel testing including BARD1 is available
  via Institute of Genetics + select private labs (~8000-20000
  UAH); some older panels may not include BARD1 — verify panel
  contents before ordering.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з родовідною підозрою
  на гермінативний heterozygous carrier BARD1. Два паралельні
  направлення:

  **(1) Направлення на генетичне консультування.** Pre-test
  консультування охоплює: спадкування (autosomal dominant),
  пенетрантність (moderate breast RR ~2.0-3.0 lifetime ~20-30%;
  triple-negative subset enriched signal supports MRI-inclusive
  surveillance у TNBC-family-history cohorts; modest ovarian
  RR ~1.5-2.0 — не виправдовує routine RRSO), наслідки для FDRs.

  **(2) Germline мультигенне HBOC панельне тестування.** Сучасні
  панелі покривають BARD1 як moderate-penetrance гена. BARD1
  включений у більшість HBOC панелей як 2024-2025 (доданий у NCCN
  moderate-elevated breast tier у 2023). Перевірте склад панелі
  перед замовленням — деякі старіші панелі можуть не включати BARD1.

  **Наступний шлях (позитивна панель — підтверджений BARD1 carrier):**
  перехід на BARD1-carrier surveillance шлях
  (IND-BARD1-CARRIER-PREVENTION-SURVEILLANCE):
  - Annual mammography з 40 років (consider MRI з 35 років у TNBC-
    family-history-enriched subset).
  - Annual breast MRI consideration з 40 років.
  - Clinical breast exam q6-12 міс з 25-30 років.
  - Ovarian surveillance — НЕ routinely indicated.
  - Cascade testing FDRs.

  **Наступний шлях (позитивна панель — non-BARD1 variant):**
  маршрутизація на gene-specific carrier шлях.

  **Наступний шлях (негативна панель):** empіричне посилене
  спостереження як aggressive-track альтернатива
  (IND-BARD1-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE).

  В Україні multi-gene panel включаючи BARD1 via Institute of
  Genetics + select private labs (~8000-20000 UAH).

