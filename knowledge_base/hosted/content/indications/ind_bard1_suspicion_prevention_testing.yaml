do_not_do:
  - "Не призначати germline тестування без pre-test консультування."
  - "Не використовувати застарілу панель без BARD1 — підтвердіть склад панелі перед замовленням."
  - "Не призначати rotation RRSO у BARD1 carriers — modest ovarian RR ~1.5-2.0 не виправдовує routine surgery."
  - "Не пропускати MRI consideration у TNBC-family-history-enriched subset — early-onset TNBC signal має бути врахований."
  - "Не пропускати cascade testing FDRs після positive carrier confirmation."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling."
  - "Do not use an outdated panel that does not include BARD1 — confirm panel composition before ordering."
  - "Do not recommend routine RRSO in BARD1 carriers — modest ovarian RR ~1.5-2.0 does not justify routine surgery."
  - "Do not skip MRI consideration in the TNBC-family-history-enriched subset — early-onset TNBC signal should be factored in."
  - "Do not skip cascade testing of FDRs after positive carrier confirmation."

