rationale: >
  Aggressive-observation alternative track for confirmed BWS carriers,
  presented for HCP shared-decision-making alongside the standard
  Kalish/Brioude q3mo schedule. Some specialist centers — particularly
  for IC1 (H19/IGF2 loss-of-imprinting) subtype carriers — adopt a
  shortened-interval / extended-duration protocol:

  **(1) Abdominal ultrasound q6-8 weeks during infancy through age 4**
  (rather than q3mo) — tightens the detection window during the steepest
  part of the Wilms-tumor / hepatoblastoma incidence curve. Then q3mo
  through age 10 (rather than stopping at age 8) — covers the long tail
  of late-onset Wilms reports in BWS.

  **(2) Serum AFP biweekly through age 1, monthly through age 5, q3mo
  through age 6** — earlier and tighter than the consensus schedule.
  Especially relevant for IC2 hypomethylation and CDKN1C-variant
  subtypes where hepatoblastoma over-represents.

  **(3) Adjunctive whole-body MRI q12mo from age 2 through age 8 at
  centers experienced in pediatric WB-MRI** — non-invasive, non-radiating
  imaging that broadens the screening field to include sites that
  abdominal US misses (retroperitoneal lymphadenopathy, paraspinal
  neuroblastoma). Evidence base is modest (extrapolated from Li-Fraumeni
  / DICER1 cohorts); pediatric WB-MRI interpretation expertise is the
  rate-limiting factor.

  **Rationale for offering this alternative:** the standard schedule has
  documented mortality benefit (Choyke et al. 1999 pre-screening Wilms
  era vs post-screening cohorts), but tumor detection rate at the
  standard q3mo cadence still includes occasional advanced-stage
  presentations between intervals. The aggressive track trades increased
  burden (more visits, more parental anxiety, more incidental findings)
  for a marginal narrowing of the detection window. CHARTER §11 —
  aggressive intervention requires shared decision-making between
  pediatric oncologist, genetic counselor, and family.

  **Routing intent:** prevention-time HCP-mediated counseling alternative
  to the standard track, NOT a treatment recommendation.

rationale_ua: >
  Альтернативно-трекова Indication для підтверджених носіїв BWS,
  представлена для HCP shared-decision-making поряд зі стандартним
  Kalish/Brioude q3mo графіком. Деякі спеціалізовані центри —
  особливо для носіїв підтипу IC1 — застосовують протокол скорочених
  інтервалів / подовженої тривалості:

  **(1) Абдомінальне УЗД q6-8 тижнів у дитинстві до 4 років** (замість
  q3mo) — звужує вікно детекції у найкрутішій частині кривої
  захворюваності Wilms tumor / гепатобластоми. Потім q3mo до 10 років
  (замість зупинки в 8) — покриває довгий хвіст пізніх Wilms tumor у
  BWS.

  **(2) Сироватковий AFP кожні 2 тижні до 1 року, щомісяця до 5 років,
  q3mo до 6 років** — раніше і тісніше за консенсусний графік.

  **(3) Допоміжне whole-body MRI q12mo з 2 до 8 років** у центрах із
  досвідом педіатричного WB-MRI — неінвазивна модальність без радіації,
  яка розширює поле screening на місця, що УЗД пропускає
  (ретроперитонеум, паравертебральна нейробластома). Доказова база
  скромна (екстраполяція з Li-Fraumeni / DICER1 когорт).

  **Обґрунтування пропонування цієї альтернативи:** стандартний графік
  має задокументовану mortality benefit, але детекція все ще включає
  occasional advanced-stage presentations між інтервалами. Aggressive
  track обмінює збільшене навантаження (більше візитів, більше
  батьківської тривоги) на marginal narrowing of the detection window.
  CHARTER §11 — aggressive intervention потребує shared decision-making.

  **Маршрутизація:** prevention-time альтернатива стандартному треку,
  НЕ лікувальна рекомендація.

