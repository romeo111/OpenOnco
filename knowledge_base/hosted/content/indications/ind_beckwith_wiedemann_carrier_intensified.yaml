do_not_do:
  - "Не використовувати q6-8 тижневий cadence без access to specialty radiology + сім'я, що готова до високої частоти візитів — burden vs marginal-benefit trade-off."
  - "Не призначати pediatric WB-MRI у центрі без задокументованого досвіду інтерпретації — false-positives ведуть до інвазивних follow-ups у дитини."
  - "Не подовжувати спостереження за 10 років без задокументованого підтипу-специфічного рекомендування генетика — Wilms tumor у BWS після 10 років надзвичайно рідкісний."

do_not_do_en:
  - "Do not adopt the q6-8 week cadence without specialty-radiology access and a family prepared for high visit frequency — burden vs marginal-benefit trade-off must be explicit."
  - "Do not order pediatric WB-MRI at a center without documented interpretation experience — false-positives lead to invasive follow-ups in a child."
  - "Do not extend surveillance past age 10 without documented subtype-specific genetic-counselor input — Wilms tumor in BWS past age 10 is exceedingly rare."

