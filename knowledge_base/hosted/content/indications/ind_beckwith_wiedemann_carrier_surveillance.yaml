do_not_do:
  - "Не використовувати CT/MRI з контрастом як первинну screening-модальність у дитини з BWS — кумулятивна радіація / седація надмірні для рутинного q3mo cadence; УЗД є стандартом."
  - "Не пропускати q3mo cadence у періоди швидкого росту — embryonal-тумори можуть з'являтися та подвоюватися між інтервалами."
  - "Не інтерпретувати ізольоване підвищення AFP у немовляти ≤12 місяців як ознаку гепатобластоми без врахування фізіологічного нерезонансу — потрібен тренд."
  - "Не зупиняти спостереження раніше 8 років без підтвердженої консультації генетика щодо специфічного підтипу BWS."

do_not_do_en:
  - "Do not use contrast CT/MRI as primary screening modality in a child with BWS — cumulative radiation / sedation is excessive for routine q3mo cadence; ultrasound is standard."
  - "Do not skip the q3mo cadence during rapid-growth periods — embryonal tumors can appear and double between intervals."
  - "Do not interpret an isolated AFP elevation in an infant ≤12 months as hepatoblastoma without considering the physiologic decline curve — trend matters more than a single value."
  - "Do not stop surveillance earlier than age 8 without documented genetic-counselor input for the specific BWS subtype."

