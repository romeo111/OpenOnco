rationale: >
  Standard-track surveillance for confirmed Beckwith-Wiedemann syndrome
  carriers per the 2018 International BWS Consensus Statement (Brioude
  et al., AJMG) and the AACR Childhood Cancer Predisposition Workshop
  recommendations (Kalish et al. 2017, Cancer Epidemiol Biomarkers Prev).

  **(1) Abdominal ultrasound every 3 months from infancy through age 8**
  — covers the embryonal-tumor window. Targets Wilms tumor (kidney),
  hepatoblastoma (liver), and to a lesser extent neuroblastoma /
  pheochromocytoma. Imaging-only modality avoids cumulative ionizing
  radiation in a young child.

  **(2) Serum AFP monthly from birth through age 3-4, then every 3 months
  through age 4** — early hepatoblastoma marker. AFP physiologically
  declines from neonatal levels through ~6-12 months; trend matters more
  than absolute value in the first year, so the surveillance cadence is
  tight in infancy and tapers once baseline establishes.

  **(3) Subtype-aware risk stratification:** IC1 hypermethylation (H19/IGF2
  loss-of-imprinting subtype) is the highest-risk genotype for Wilms tumor
  (~25-30% subtype-specific risk vs ~5-7% across all BWS); IC2
  hypomethylation has a lower embryonal-tumor risk and predominantly drives
  hepatoblastoma. Paternal UPD11 and CDKN1C variants sit in between. Some
  centers stratify cadence and stopping age by subtype; this Indication
  encodes the conservative across-subtype schedule. HCP may de-escalate
  with documented genetic-counselor input.

  **(4) Stopping surveillance:** abdominal US is typically discontinued
  at age 8 (per Kalish 2017 consensus). AFP discontinuation at age 4 is
  standard. After surveillance ends, the patient transitions to general
  adult cancer-risk counseling; long-term follow-up is uneventful for the
  vast majority of BWS individuals.

  **Routing intent:** prevention-time HCP-mediated counseling for the
  family of an infant with confirmed BWS. Cancer-specific treatment
  Indications are deliberately NOT recommended at this stage — the
  intervention here is structured early detection, not therapy.

rationale_ua: >
  Стандартний-трек спостереження для підтверджених носіїв BWS per
  2018 Міжнародного консенсусу з BWS (Brioude et al.) та AACR Childhood
  Cancer Predisposition Workshop (Kalish et al. 2017).

  **(1) Абдомінальне УЗД кожні 3 місяці з моменту народження до 8 років**
  — покриває вікно ембріональних пухлин (Wilms tumor, гепатобластома).
  УЗД як неіонізуюча модальність уникає кумулятивної радіації у малої
  дитини.

  **(2) Сироватковий AFP щомісяця з народження до 3-4 років, потім
  кожні 3 місяці до 4 років** — ранній маркер гепатобластоми.
  Фізіологічне зниження AFP від неонатальних рівнів до ~6-12 місяців
  означає, що тренд важливіший за абсолютне значення у першому році.

  **(3) Стратифікація за підтипом:** IC1 hypermethylation (підтип H19/IGF2)
  — найвищий ризик пухлини Вілмса (~25-30% специфічно для підтипу проти
  ~5-7% серед усіх BWS); IC2 hypomethylation має нижчий ризик ембріональних
  пухлин і переважно гепатобластому. Paternal UPD11 та варіанти CDKN1C
  посередині. Деякі центри стратифікують частоту і вік завершення за
  підтипом; ця Indication кодує консервативний середній графік.

  **(4) Завершення спостереження:** абдомінальне УЗД зазвичай припиняють
  у 8 років (Kalish 2017). AFP — у 4 роки. Після — загальна доросла
  онкоконсультація; довготривалий прогноз сприятливий для більшості
  осіб з BWS.

  **Маршрутизація:** prevention-time консультація сім'ї немовляти з
  підтвердженим BWS. Лікувальні Indications на цьому етапі НЕ
  рекомендуються — втручання тут — структурована рання діагностика.

