expected_outcomes:
  overall_response_rate: >-
    Less-intensive surveillance + symptom-driven workup. Accepts higher
    risk of late-stage RCC detection. Acceptable when MRI access is
    constrained or patient declines structured pathway.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (less intensive surveillance) alternative for BHD
  carriers in resource-limited settings.

  Components:
    - Abdominal US q1-2y as MRI alternative (lower sensitivity for
      small lesions — flagged as limitation).
    - Symptom-driven renal imaging for any flank pain, hematuria,
      mass.
    - Baseline chest HRCT retained; symptom-driven thereafter.
    - Dermatology q2y rather than q1y.
    - Cascade testing retained.
    - Re-offer MRI surveillance annually.

rationale_ua: >
  Aggressive-трек (less intensive surveillance) альтернатива для BHD
  carriers у resource-limited settings.

  Компоненти:
