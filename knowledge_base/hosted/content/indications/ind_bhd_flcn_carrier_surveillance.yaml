rationale: >
  Standard-track prevention pathway for BHD/FLCN confirmed carriers.

  Components — RENAL:
    - **Abdominal MRI without/with contrast q2-3y from age 20** —
      MRI preferred over CT to minimize lifetime radiation given
      surveillance cumulates over decades. CT contrast acceptable in
      MRI-contraindicated patients.
    - **Active surveillance with growth-rate monitoring** — BHD-RCC
      lesions ≤3cm with slow growth may be observed; rapid-growth /
      chromophobe pattern → nephron-sparing partial nephrectomy.
    - **Avoid radical nephrectomy when nephron-sparing possible** —
      bilateral/multifocal disease pattern means renal function
      preservation is critical.

  Components — PULMONARY:
    - **Baseline chest HRCT at diagnosis** to characterize cystic
      burden + identify pneumothorax risk.
    - **Symptom-driven HRCT thereafter** — cyst stability typical;
      new pneumothorax → high-resolution imaging + thoracic-surgery
      consultation.
    - **Patient counseling on pneumothorax avoidance:** avoid SCUBA
      diving (depth + air-pressure changes); avoid high-altitude air
      ambulance / unpressurized cabin flights when possible.

  Components — DERMATOLOGIC:
    - **Dermatology q1y** for fibrofolliculoma monitoring; cosmetic
      treatment (laser, electrodessication) available if patient
      desires. Distinguishing skin lesions from squamous-cell-carcinoma-
      in-situ requires clinical experience.

  Components — CASCADE + REPRODUCTIVE:
    - **Cascade testing of FDRs** — 50% inheritance risk; testing
      facilitates early surveillance entry of affected family members.
    - **Reproductive counseling:** PGT-M available.

  In Ukraine, FLCN genetic testing via Institute of Genetics + select
  private labs. Multi-disciplinary BHD management at major urology +
  pulmonology centers in Kyiv, Lviv, Odesa.

rationale_ua: >
  Стандартний-трек prevention шлях для BHD/FLCN confirmed carriers.

  Компоненти — RENAL:
    - **Abdominal MRI без/з контрастом q2-3y з 20 років** — MRI
      preferred над CT для мінімізації radiation cumulative dose.
    - **Active surveillance з growth-rate monitoring** — BHD-RCC
      ≤3см slow-growth можна observe; rapid-growth / chromophobe →
      nephron-sparing partial nephrectomy.
    - **Уникати radical nephrectomy коли nephron-sparing можливе.**

  Компоненти — PULMONARY:
    - **Baseline chest HRCT при діагнозі.**
    - **Symptom-driven HRCT thereafter.**
    - **Counseling pneumothorax avoidance:** уникати SCUBA diving;
      уникати high-altitude unpressurized cabin flights.

  Компоненти — DERMATOLOGIC:
    - **Dermatology q1y** для fibrofolliculoma monitoring.

  Компоненти — CASCADE + REPRODUCTIVE:
    - **Cascade testing FDRs** — 50% inheritance.
    - **Reproductive counseling:** PGT-M available.

  В Україні FLCN genetic testing via Institute of Genetics. Multi-
  disciplinary BHD management у Києві, Львові, Одесі.

