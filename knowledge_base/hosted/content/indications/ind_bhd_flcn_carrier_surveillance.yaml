do_not_do:
  - "Не використовувати CT як рутинний surveillance метод — MRI має нижче cumulative radiation для довгострокового спостереження."
  - "Не виконувати radical nephrectomy у BHD якщо partial nephrectomy технічно можлива — multifocal/bilateral disease pattern."
  - "Не пропускати pneumothorax counseling — SCUBA diving + unpressurized altitude — модифіковані тригери."
  - "Не пропускати cascade testing FDRs — 50% inheritance."

do_not_do_en:
  - "Do not use CT as routine surveillance imaging — MRI has lower cumulative radiation for decades-long surveillance."
  - "Do not perform radical nephrectomy in BHD if partial nephrectomy is technically feasible — multifocal/bilateral disease pattern."
  - "Do not skip pneumothorax counseling — SCUBA diving + unpressurized altitude are modifiable triggers."
  - "Do not skip cascade testing of FDRs — 50% inheritance."

