expected_outcomes:
  overall_response_rate: >-
    Multi-organ surveillance shifts BHD-RCC stage at diagnosis from
    advanced to small renal mass (≤3cm) where nephron-sparing partial
    nephrectomy is feasible. BHD renal lesions are often slow-growing
    hybrid-oncocytic; rapid-growth pattern + chromophobe RCC histology
    are surgical triggers. Pneumothorax prevention via patient
    awareness + avoid SCUBA diving / certain altitude exposures.

