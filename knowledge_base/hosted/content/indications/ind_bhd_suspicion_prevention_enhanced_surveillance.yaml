evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: "Empirical BHD-protocol surveillance without genetic confirmation captures chromophobe / hybrid-oncocytic-chromophobe / oncocytoma RCC at earlier stage in true FLCN carriers (~60-90% of suspicion cohort with fibrofolliculomas + pulmonary cysts ± pneumothorax), but with lower diagnostic precision and without cascade-testing infrastructure for first-degree relatives."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests: [TEST-CBC]
desired_tests: []

rationale: >
  Alternative-track companion. Empirical surveillance for BHD-suspect
  pedigree (cutaneous fibrofolliculomas + pulmonary cysts ± spontaneous
  pneumothorax) without FLCN confirmation:
  - Triennial abdominal MRI from age 20-21 for RCC surveillance
  - Annual dermatologic exam
  - Baseline chest CT for cyst burden + structured pneumothorax-
    prevention counseling
  - Pleurodesis consideration after first spontaneous pneumothorax
  - Defer cascade testing pending genetic confirmation

rationale_ua: >
  Альтернативно-трекова Indication. Empirical surveillance для BHD-
  suspect pedigree без FLCN confirmation:
  - Triennial abdominal MRI з 20-21 років
  - Annual dermatologic exam
  - Baseline chest CT для cyst burden + pneumothorax-prevention
    counseling
  - Pleurodesis consideration після first spontaneous PTX
  - Cascade testing — після genetic confirmation

