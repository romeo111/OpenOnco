do_not_do:
  - "Не презентувати empirical surveillance як еквівалент FLCN confirmation — confirmation enables cascade testing first-degree родичів + differentiates BHD від HLRCC / HPRC / VHL / SDH-RCC з відмінною RCC histology + management."

do_not_do_en:
  - "Do not present empirical surveillance as equivalent to FLCN confirmation — confirmation enables cascade testing of first-degree relatives + differentiates BHD from HLRCC / HPRC / VHL / SDH-RCC with distinct RCC histology + management."

