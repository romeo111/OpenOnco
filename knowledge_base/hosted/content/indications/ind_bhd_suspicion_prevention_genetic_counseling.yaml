rationale: >
  Standard-track prevention pathway for Birt-Hogg-Dubé (BHD / FLCN)
  suspicion. Distinct from HLRCC (FH, papillary type-2 / FH-deficient
  RCC), HPRC (MET, papillary type-1), SDH-RCC, VHL.

  **(1) Genetic counseling + germline FLCN testing + comprehensive
  hereditary-RCC panel** (FLCN, VHL, FH, MET, SDHB/C/D, BAP1, TSC1/2,
  CDC73 — differential overlapping clinical phenotypes). Autosomal
  dominant inheritance.

  **(2) Confirmed FLCN-carrier surveillance protocol** (BHD Foundation
  consensus / Stamatakis 2013 / NCCN Kidney 2025):
  - **Abdominal MRI every 3 years from age 20-21** (or earlier if
    childhood-onset family history) for RCC surveillance — preferred
    over CT to avoid cumulative radiation across a multi-decade
    surveillance program. Annual or biennial if any indeterminate lesion
    detected, until stability documented.
  - When tumors detected, nephron-sparing surgery (partial nephrectomy)
    is the surgical standard given multifocal / bilateral / slow-growing
    biology of BHD-RCC — observe small (<3 cm) stable solid lesions on
    active surveillance, intervene at 3-cm-rule threshold or with
    growth.
  - Annual dermatologic exam — cutaneous fibrofolliculomas /
    trichodiscomas are benign but characteristic; no malignant
    transformation but contributes to diagnosis.
  - Lung surveillance: baseline chest CT at diagnosis to characterize
    cyst burden + distribution; subsequent imaging individualized
    (pulmonary cysts do NOT progress to RCC and are not premalignant —
    cysts are a structural risk factor for pneumothorax, not cancer).
  - Pneumothorax-prevention counseling: avoid SCUBA diving (pressure
    differential), high-altitude unpressurized flight; tobacco cessation
    (smoking accelerates cyst formation + pneumothorax risk); pleurodesis
    consideration after first spontaneous pneumothorax (recurrence
    rate ~75% without intervention in BHD versus ~25% in primary
    spontaneous PTX).

  **(3) Cascade testing** of at-risk first-degree relatives — autosomal
  dominant with variable expressivity; identification of carriers enables
  pre-symptomatic surveillance.

rationale_ua: >
  Стандартний-трек prevention для Birt-Hogg-Dubé (BHD / FLCN). Відмінний
  від HLRCC (FH), HPRC (MET), SDH-RCC, VHL.

  **(1) Genetic counseling + germline FLCN testing + hereditary-RCC
  panel.** Autosomal dominant.

  **(2) FLCN-carrier surveillance:**
  - **Abdominal MRI q3y з 20-21 років** для RCC surveillance (preferred
    над CT — cumulative radiation). Annual/biennial якщо indeterminate
    lesion.
  - Nephron-sparing surgery — surgical standard (multifocal / bilateral
    / slow-growing biology); 3-cm threshold для intervention.
  - Annual dermatologic exam (fibrofolliculomas — diagnostic).
  - Baseline chest CT для cyst burden; subsequent imaging
    individualized (cysts НЕ progress до RCC).
  - Pneumothorax-prevention counseling: уникати SCUBA + unpressurized
    flight; tobacco cessation; pleurodesis after first spontaneous PTX
    (recurrence ~75%).

  **(3) Cascade testing first-degree родичів.**

