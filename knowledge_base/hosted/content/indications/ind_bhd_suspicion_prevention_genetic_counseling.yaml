do_not_do:
  - "Не використовувати routine surveillance CT для багатодекадного RCC-surveillance програму — cumulative radiation; MRI preferred."
  - "Не виконувати radical nephrectomy для small / multifocal / bilateral BHD-RCC — nephron-sparing partial nephrectomy — standard given multifocal / metachronous biology + сприяє renal-function preservation across surveillance lifetime."
  - "Не плутати BHD pulmonary cysts з RCC-precursor — cysts є structural pneumothorax risk factor, НЕ malignant precursor."
  - "Не відкладати pleurodesis consideration після first spontaneous pneumothorax — recurrence rate ~75% у BHD значно вищий ніж ~25% у primary spontaneous PTX."

do_not_do_en:
  - "Do not use routine surveillance CT for the multi-decade RCC-surveillance program — cumulative radiation; MRI preferred."
  - "Do not perform radical nephrectomy for small / multifocal / bilateral BHD-RCC — nephron-sparing partial nephrectomy is the standard given multifocal / metachronous biology + preserves renal function across surveillance lifetime."
  - "Do not conflate BHD pulmonary cysts with RCC precursor — cysts are a structural pneumothorax risk factor, NOT a malignant precursor."
  - "Do not delay pleurodesis consideration after first spontaneous pneumothorax — recurrence rate ~75% in BHD is much higher than ~25% in primary spontaneous PTX."

