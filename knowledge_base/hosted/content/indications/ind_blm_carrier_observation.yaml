do_not_do:
  - "Не презентувати observation як equivalent intensified surveillance — q5р colonoscopy detects adenomas at removable stage."
  - "Не пропускати cascade-тестування + partner-carrier testing + reproductive counseling — це highest-impact interventions для BLM carriers."
  - "Не використовувати тільки FOBT (guaiac-based) — sensitivity inadequate; FIT (immunochemical) preferred як non-colonoscopy bridge."
  - "Не нормалізувати de-intensification у high-family-history BLM carrier — family-history-positive carriers carry upper-range CRC risk."

do_not_do_en:
  - "Do not present observation as equivalent to intensified surveillance — q5y colonoscopy detects adenomas at endoscopically-removable stage."
  - "Do not skip cascade testing, partner-carrier testing, and reproductive counseling — these are the highest-impact interventions for BLM carriers."
  - "Do not use guaiac-based FOBT alone — sensitivity is inadequate; FIT (immunochemical) is preferred as a non-colonoscopy bridge."
  - "Do not normalize de-intensification in a carrier with strong family history — family-history-positive carriers carry upper-range CRC risk."

