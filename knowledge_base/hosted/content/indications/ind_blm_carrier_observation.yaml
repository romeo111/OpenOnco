expected_outcomes:
  overall_response_rate: >-
    Population-cadence CRC screening only — colonoscopy q10y from age
    45 per USPSTF. Carries modestly higher risk of CRC vs. intensified
    q5y comparator because the BLM heterozygote signal (RR ~1.5-2.0;
    ~10-12% lifetime) elevates risk above population baseline. Outcomes
    typically still favorable given CRC's slow adenoma-to-carcinoma
    progression, but later-stage detection is possible.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion. Used when:
  - Patient declines intensified q5y colonoscopy cadence (procedure
    burden, anesthesia concerns, bowel-prep aversion).
  - Patient is at the lower end of BLM moderate-penetrance risk range
    (no family history of CRC despite carrier status — common given
    the modest penetrance) and chooses population-cadence screening
    after informed discussion.
  - Access to colonoscopy is limited; alternative options (annual FIT
    + flexible sigmoidoscopy q5y, or stool DNA q3y) may be reasonable
    bridges, though colonoscopy remains gold-standard.

  In all cases, frame the decision as suboptimal vs. the standard
  q5y-colonoscopy comparator (IND-BLM-CARRIER-SURVEILLANCE): the
  intensified protocol detects adenomas at endoscopically-removable
  stage, preventing progression to invasive CRC.

  Cascade testing of first-degree relatives + partner-carrier testing
  + reproductive counseling continue regardless of the patient's
  chosen surveillance cadence — these are the highest-impact
  interventions for BLM carriers (biallelic Bloom syndrome offspring
  prevention).

  Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Альтернативно-трекова Indication. Використовується коли:
  - Пацієнт відмовляється від intensified q5р colonoscopy cadence
    (procedure burden, anesthesia, bowel-prep aversion).
  - Пацієнт на нижньому кінці BLM moderate-penetrance ризику (no
    family history of CRC).
  - Доступ до colonoscopy обмежений; alternative options (annual FIT
    + flex sig q5р, або stool DNA q3р) — reasonable bridges.

  В усіх випадках — framing decision як suboptimal vs. q5р-colonoscopy
  comparator.

  Cascade тестування + partner-carrier testing + reproductive
  counseling continue незалежно — це highest-impact interventions для
  BLM carriers.

  Per CHARTER §11 framing автономії пацієнта.

