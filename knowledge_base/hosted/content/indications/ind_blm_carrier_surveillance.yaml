    position: supports
    relevant_quote_paraphrase: >-
      "BLM is recognized as a moderate-penetrance colorectal-cancer
      susceptibility gene appropriate for inclusion on expanded
      hereditary-CRC panels. Carriers should be offered colonoscopy
      surveillance at intensified cadence (q5y from age 40) but
      risk-reducing surgery is not standard. Cascade testing and
      reproductive counseling are essential given the Bloom-syndrome
      risk to biallelic offspring."
  - source_id: SRC-NCCN-COLON-2025
    position: context

do_not_do:
  - "Не пропонувати prophylactic колектомію для BLM-only heterozygote — lifetime risk (~10-12%) набагато нижче thresholds для prophylactic surgery."
  - "Не пропускати cascade-тестування та partner-carrier testing у Ашкеназі-ancestry carrier — founder allele frequency робить biallelic risk meaningful."
  - "Не пропускати reproductive counseling — Bloom syndrome у offspring — серйозний multi-cancer розлад з short life expectancy."
  - "Не intensifyувати breast MRI surveillance на BLM-only basis — докази inconsistent; reserve для cases з BRCA / NBN / PALB2 dual-carrier panels."
  - "Не використовувати тільки annual FIT — colonoscopy required для adenoma detection та removal у moderate-penetrance carriers."

do_not_do_en:
  - "Do not propose prophylactic colectomy for BLM-only heterozygotes — lifetime risk (~10-12%) is far below the threshold for prophylactic surgery."
  - "Do not skip cascade testing and partner-carrier testing in Ashkenazi-ancestry carriers — founder-allele frequency makes biallelic risk meaningful."
  - "Do not skip reproductive counseling — Bloom syndrome in offspring is a serious multi-cancer disorder with short life expectancy."
  - "Do not intensify breast MRI surveillance on a BLM-only basis — evidence is inconsistent; reserve for BRCA / NBN / PALB2 dual-carrier panels."
  - "Do not rely on annual FIT alone — colonoscopy is required for adenoma detection and removal in moderate-penetrance carriers."

