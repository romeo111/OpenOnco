rationale: >
  Standard-track confirmed-carrier surveillance for BLM heterozygotes
  per NCCN Genetic/Familial High-Risk CRC 2025 (moderate-penetrance
  CRC-gene surveillance extension).

  **Colorectal cancer surveillance (~10-12% lifetime, RR ~1.5-2.0):**
  - Colonoscopy q5y from age 40 (or 10 years before the earliest
    familial CRC diagnosis, whichever is earlier).
  - If any polyps detected, manage per standard polyp-surveillance
    guideline (q3y high-risk adenoma, q5y low-risk, etc.).
  - Continue lifelong, with cadence adjusted based on findings.
  - Population-cadence USPSTF colonoscopy (q10y from age 45) is the
    floor; BLM carriers receive q5y intensification.

  **Breast cancer awareness (possible RR ~1.5; evidence inconsistent):**
  - Population-cadence mammography at standard ages (q1-2y from age
    40-50 depending on local guideline).
  - No MRI intensification recommended on BLM-only basis (insufficient
    evidence).

  **Risk-reducing surgery counseling:**
  - Risk-reducing surgery is NOT recommended on BLM-only basis —
    lifetime CRC risk (~10-12%) does not approach the thresholds
    (>40% lifetime) where prophylactic colectomy is considered.
  - For breast: also not recommended.

  **Cascade testing:**
  - Offer BLM germline testing to all first-degree relatives.
  - Ashkenazi-Jewish ancestry: founder variant c.2207_2212delinsTAGATTC
    (BLM-Ash) is the dominant pathogenic allele with population
    carrier frequency ~1% — cascade testing yield is high in Ashkenazi
    family clusters.

  **Reproductive counseling:**
  - If the carrier's partner is also a BLM carrier (Ashkenazi-Ashkenazi
    pairings face meaningful biallelic risk given the ~1% population
    carrier frequency), offspring have 25% Bloom-syndrome risk per
    pregnancy. Pre-conception genetic counseling, partner-carrier
    testing, and preimplantation genetic testing (PGT-M) are
    appropriate options to present (not mandates).
  - This counseling is the highest-impact intervention for many BLM
    heterozygotes — Bloom syndrome carries early-onset multi-cancer
    morbidity and short life expectancy.

  Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Стандартний-трек confirmed-carrier surveillance для BLM гетерозигот
  per NCCN Genetic/Familial High-Risk CRC 2025.

  **Скринінг колоректального раку (~10-12% lifetime, RR ~1.5-2.0):**
  - Колоноскопія q5р з 40 років (або за 10 років до наймолодшого
    сімейного діагнозу CRC).
  - При polyps — management per standard polyp-surveillance.
  - Continue lifelong з cadence adjusted based on findings.

  **Breast cancer awareness (possible RR ~1.5; докази інконсистентні):**
  - Population-cadence мамографія на standard ages (q1-2р з 40-50).
  - No MRI intensification на BLM-only basis (insufficient evidence).

  **Risk-reducing surgery counseling:**
  - Не recommended на BLM-only basis — lifetime CRC risk (~10-12%) не
    наближається до thresholds (>40%) для prophylactic колектомії.

  **Cascade тестування:**
  - Offer BLM germline testing усім first-degree родичам.
  - Ашкеназі-єврейське походження: founder варіант BLM-Ash з population
    carrier frequency ~1% — cascade testing yield high у Ашкеназі
    family clusters.

  **Reproductive counseling:**
  - Якщо partner також carrier BLM (Ашкеназі-Ашкеназі pairings face
    meaningful biallelic risk), offspring мають 25% Bloom-syndrome risk
    на pregnancy. Pre-conception genetic counseling + PGT-M —
    appropriate options.
  - Це counseling — highest-impact intervention для багатьох BLM
    гетерозигот — Bloom syndrome carries early-onset multi-cancer
    morbidity та short life expectancy.

  Per CHARTER §11 framing автономії пацієнта.

