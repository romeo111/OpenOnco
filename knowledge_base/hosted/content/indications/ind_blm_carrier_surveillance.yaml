expected_outcomes:
  overall_response_rate: >-
    Colonoscopy q5y from age 40 in BLM heterozygotes targets the
    modest CRC signal (RR ~1.5-2.0; ~10-12% lifetime). Earlier-cadence
    colonoscopy detects pre-cancerous adenomas at endoscopically-
    removable stage, preventing progression to invasive CRC. Evidence
    base for BLM-specific surveillance is consensus-driven (NCCN
    Genetic/Familial CRC moderate-penetrance gene panel guidance);
    risk reduction is extrapolated from general colonoscopy-screening
    cohort data showing ~40-60% mortality reduction with regular
    colonoscopy.

