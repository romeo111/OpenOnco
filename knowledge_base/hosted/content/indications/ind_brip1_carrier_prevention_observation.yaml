desired_tests: []

rationale: >
  Aggressive-track (RRSO-declined) alternative for BRIP1 carriers.

  Components:
    - Symptom-driven workup retained.
    - General-population breast + cervical surveillance.
    - Cascade testing retained.
    - Re-offer RRSO at every visit.
    - Combined hormonal contraception consideration — modest ovarian-
      cancer risk reduction (~30-50% with ≥5y use).

