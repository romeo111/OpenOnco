  overall_response_rate: >-
    Surveillance-only (RRSO declined) pathway. Outcomes track BRCA-
    surveillance cohort — modest cancer-detection benefit + residual
    cancer risk. Acceptable when patient declines RRSO after shared
    decision-making.

