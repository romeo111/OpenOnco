rationale: >
  Standard-track prevention pathway for BRIP1 heterozygous carriers per
  NCCN Genetic/Familial High-Risk Assessment Breast/Ovarian 2025.

  Components:
    - **Ovarian surveillance + RRSO:**
      - No routine population screening (CA-125 + TVUS not endorsed).
      - Symptom-driven workup; education on persistent bloating,
        early satiety, urinary frequency/urgency, pelvic pain.
      - **RRSO recommended at completed childbearing or age 45-50**
        per NCCN Genetic/Familial 2025. Hormone replacement therapy
        considerations: combined OCP + transdermal estradiol short-
        term acceptable in BRIP1 (no breast-cancer-elevated risk
        attribution); revisit at age 50-55.
      - Cytoreductive timing decision-making: 45-50 default, individualised
        by family-history age-of-diagnosis + patient priorities.
    - **Breast surveillance:** general-population USPSTF unless
      independent family-history-elevated risk; no off-schedule
      breast imaging on BRIP1 alone.
    - **Cascade testing:** FDRs offered testing.
    - **Reproductive counseling:** PGT-M available; FA-J risk
      negligible unless both partners BRIP1 carriers.
    - **Lifestyle:** standard cancer-prevention.

  In Ukraine, multi-gene panel testing via Institute of Genetics;
  RRSO available at gynecologic-oncology centers in Kyiv, Lviv,
  Odesa, Kharkiv.

