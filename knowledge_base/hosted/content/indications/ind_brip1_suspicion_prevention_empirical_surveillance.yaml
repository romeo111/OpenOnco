do_not_do:
  - "Не презентувати TVUS + CA-125 surveillance як effective screening — UKCTOCS не показує переваги."
  - "Не виконувати empіричне RRSO без extensive shared-decision-making і повторного offering genetic testing — це незворотне втручання з lifetime HRT/bone-density наслідками."
  - "Не пропускати periodic re-discussion про genetic testing — багато пацієнтів врешті приймають тестування у reproductive-planning або pre-RRSO контексті."
  - "Не виконувати empіричне RRSO у пацієнтів з weak family history (single affected relative) — поза evidence base."
  - "Не презентувати empіричне surveillance як еквівалент genetic confirmation — cascade testing FDRs неможлива."

do_not_do_en:
  - "Do not present TVUS + CA-125 surveillance as effective screening — UKCTOCS does not show mortality benefit."
  - "Do not perform empirical RRSO without extensive shared-decision-making and re-offering genetic testing — this is an irreversible intervention with lifetime HRT/bone-density sequelae."
  - "Do not skip periodic re-discussion of genetic testing — many patients eventually accept testing in reproductive-planning or pre-RRSO contexts."
  - "Do not perform empirical RRSO in patients with weak family history (single affected relative) — outside the evidence base."
  - "Do not present empirical surveillance as equivalent to genetic confirmation — cascade testing of FDRs is impossible."

