expected_outcomes:
  overall_response_rate: >-
    Empirical management for BRIP1-suspicion patients declining
    testing centers on (1) symptom-driven workup for ovarian/
    abdominal symptoms (bloating, early satiety, urinary urgency,
    pelvic pain — low threshold for diagnostic imaging given
    family history); (2) optional TVUS + CA-125 q6 months explicitly
    framed as poor-sensitivity surveillance (UKCTOCS data — no
    mortality benefit even in BRCA carriers); (3) consideration
    of empirical RRSO based on family history alone — high-stakes
    decision requiring extensive shared-decision-making since the
    intervention is irreversible and ovarian penetrance is not
    confirmed in non-tested patient. In the BRIP1-carrier subset
    (~10-20% of pedigree-suspicion individuals), empirical RRSO
    timing matches genetic-confirmed timing (completed childbearing
    or 45-50). Outside the carrier subset, RRSO is over-treatment.

