      oophorectomy at completed childbearing or age 45-50; population
      ovarian cancer screening (TVUS + CA-125) is not recommended
      as a substitute for RRSO."
  - source_id: SRC-NCCN-OVARIAN-2025
    position: supports
    relevant_quote_paraphrase: >-
      "All women with high-grade serous ovarian carcinoma should be
      offered germline testing; BRIP1, RAD51C, RAD51D are
      included on standard multi-gene panels alongside BRCA1/2."

do_not_do:
  - "Не призначати germline тестування без pre-test консультування — інформована згода, психологічна підготовка, і обговорення RRSO finality обов'язкові."
  - "Не презентувати TVUS + CA-125 surveillance як ефективну альтернативу RRSO — UKCTOCS дані не показують переваги по смертності."
  - "Не пропускати RRSO discussion у confirmed BRIP1 carriers — NCCN endorsement при completed childbearing або 45-50 років."
  - "Не використовувати застарілу панель без BRIP1 — підтвердіть склад панелі перед замовленням."
  - "Не пропускати cascade testing female FDRs — це critical для своєчасного RRSO discussion у носіїв."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling — informed consent, psychological preparation, and RRSO-finality discussion are mandatory."
  - "Do not present TVUS + CA-125 surveillance as an effective alternative to RRSO — UKCTOCS data do not demonstrate mortality benefit."
  - "Do not skip RRSO discussion in confirmed BRIP1 carriers — NCCN endorsement at completed childbearing or age 45-50."
  - "Do not use an outdated panel without BRIP1 — confirm panel composition before ordering."
  - "Do not skip cascade testing of female FDRs — critical for timely RRSO discussion in carriers."

