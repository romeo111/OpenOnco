expected_outcomes:
  overall_response_rate: >-
    Diagnostic yield of multi-gene HBOC panel testing in BRIP1-
    suspicion populations: ~10-20% positive carrier identification
    overall (variable by criterion — known-familial-variant cascade
    ~50%, multiple-ovarian-cancer BRCA-negative pedigree ~10-25%,
    ovarian-predominant BRCA-negative HBOC pedigree ~5-15%).
    Confirmed BRIP1 carriers transition to RRSO discussion at
    completed childbearing or age 45-50 per NCCN. RRSO reduces
    ovarian cancer incidence by ~80-90% and offers documented
    all-cause mortality benefit in BRCA-confirmed cohorts;
    extrapolated benefit expected in BRIP1 carriers given
    comparable lifetime ovarian risk (~5-15% vs population ~1.5%).
    Pre-RRSO TVUS + CA-125 surveillance has POOR documented
    sensitivity — explicitly framed as inferior to RRSO.

