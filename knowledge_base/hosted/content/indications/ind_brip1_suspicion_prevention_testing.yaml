rationale: >
  Standard-track prevention pathway for individuals with pedigree-
  based suspicion of germline BRIP1 carrier state. Two parallel
  referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant for cancer-predisposing
  carrier state; autosomal recessive for biallelic Fanconi anemia
  complementation group J phenotype — distinct from heterozygous
  carrier state), penetrance (lifetime ovarian cancer ~5-15%; RR
  ~3.0 — sufficient for NCCN-endorsed RRSO; modest possible
  breast signal — controversial, not currently NCCN-endorsed),
  implications for FDRs (cascade testing if positive — ~50% of
  FDRs are also carriers; key consideration is identifying
  female FDRs eligible for RRSO discussion), GINA / insurance
  considerations, reproductive implications (RRSO timing
  considerations relative to childbearing planning are central),
  psychological aspects (RRSO is a major reproductive-finality
  decision — pre-test counseling sets the stage for post-test
  RRSO discussion). Per ACMG / ASCO / NCCN, pre-test counseling
  by a certified genetic counselor or trained clinician is the
  standard of care before germline testing.

  **(2) Germline multi-gene HBOC panel testing.** Modern panels
  (e.g., Invitae Common Hereditary Cancers panel, Color hereditary
  cancer panel, GeneDx OncoGene Comprehensive, Myriad MyRisk,
  Ambry CancerNext) cover BRCA1, BRCA2, PALB2, CHEK2, ATM, RAD51C,
  RAD51D, BRIP1, plus contextual genes. BRIP1 is on every modern
  HBOC panel. Variant classification per ACMG framework.

  **Sequel pathway (positive panel — confirmed BRIP1 carrier):**
  Transition to BRIP1-carrier surveillance pathway
  (IND-BRIP1-CARRIER-PREVENTION-SURVEILLANCE — standard track for
  RF-BRIP1-CONFIRMED-CARRIER):
  - RRSO discussion at completed childbearing OR age 45-50,
    whichever later (NCCN Genetic/Familial High-Risk endorsement).
  - Pre-RRSO TVUS + CA-125 q6 months optionally offered with
    explicit framing as suboptimal vs RRSO (UKCTOCS trial — no
    mortality benefit demonstrated even in BRCA carriers).
  - Breast surveillance: per general-population schedules unless
    family history independently elevates risk (BRIP1 not
    currently in NCCN moderate-elevated breast tier).
  - Cascade testing of FDRs for the family-specific BRIP1 variant.
  - Reproductive counseling: PGT-M available for couples planning
    children; RRSO timing relative to family planning is central.

  **Sequel pathway (positive panel — RAD51C/D variant identified):**
  similar ovarian-focused pathway with even stronger RRSO
  recommendation (RAD51C/D approach BRCA-level ovarian
  penetrance) — route to RAD51C/D-specific carrier pathway.

  **Sequel pathway (positive panel — BRCA1/2 variant identified):**
  route to BRCA-confirmed carrier pathway (more comprehensive
  surveillance with breast MRI from 25-30, RRSO 35-40 for BRCA1
  / 40-45 for BRCA2).

  **Sequel pathway (positive panel — other variant):** route to
  gene-specific carrier pathway.

  **Sequel pathway (negative panel):** empirical RRSO discussion
  is offered as the aggressive-track alternative based on family-
  history-alone risk estimation
  (IND-BRIP1-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE) — note
  that empirical RRSO without confirmed variant is a high-stakes
  intervention; shared-decision-making is paramount.

  **Sequel pathway (VUS):** managed as pedigree-suspicion until
  reclassification.

  In Ukraine, multi-gene panel testing including BRIP1 is available
  via Institute of Genetics + select private labs (~8000-20000
  UAH). RRSO is widely available; gynecologic oncology consult
  for RRSO planning recommended.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з родовідною підозрою
  на гермінативний heterozygous carrier BRIP1. Два паралельні
  направлення:

  **(1) Направлення на генетичне консультування.** Pre-test
  консультування охоплює: спадкування (autosomal dominant для
  cancer-predisposing carrier; autosomal recessive для biallelic
  Fanconi anemia complementation group J), пенетрантність
  (lifetime ovarian cancer ~5-15%; RR ~3.0 — sufficient для
  NCCN-endorsed RRSO; modest possible breast signal —
  controversial), наслідки для FDRs (cascade testing — ідентифікація
  female FDRs eligible для RRSO discussion), GINA / страхові
  міркування, репродуктивні наслідки (RRSO timing relative до
  childbearing planning є central).

  **(2) Germline мультигенне HBOC панельне тестування.** Сучасні
  панелі покривають BRIP1. BRIP1 — на every modern HBOC панелі.

  **Наступний шлях (позитивна панель — підтверджений BRIP1 carrier):**
  перехід на BRIP1-carrier surveillance шлях
  (IND-BRIP1-CARRIER-PREVENTION-SURVEILLANCE):
  - RRSO discussion при completed childbearing АБО 45-50 років,
    whichever later (NCCN endorsement).
  - Pre-RRSO TVUS + CA-125 q6 міс optionally — explicit framing
    як suboptimal vs RRSO (UKCTOCS — no mortality benefit навіть
    у BRCA carriers).
  - Breast surveillance: per general-population schedules.
  - Cascade testing FDRs.
  - Reproductive counseling: PGT-M доступний.

  **Наступний шлях (позитивна панель — RAD51C/D variant):** route
  на RAD51C/D-specific carrier pathway (RAD51C/D approach BRCA-
  level ovarian penetrance — навіть сильніша RRSO recommendation).

  **Наступний шлях (позитивна панель — BRCA1/2 variant):** route
  на BRCA-confirmed carrier pathway.

  **Наступний шлях (негативна панель):** empіричне RRSO
  обговорення як aggressive-track альтернатива
  (IND-BRIP1-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE) —
  empіричне RRSO без confirmed variant — high-stakes intervention.

  **Наступний шлях (VUS):** ведеться як родовідна підозра.

  В Україні multi-gene panel включаючи BRIP1 via Institute of
  Genetics + select private labs (~8000-20000 UAH).

