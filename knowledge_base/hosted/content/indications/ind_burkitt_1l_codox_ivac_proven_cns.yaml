rationale_ua: Явно обраний довідковий варіант eviQ для доведеного ураження ЦНС для перевірки спеціалістом.
  Підтверджує лише варіант протоколу та контекст ризику/ЦНС, а не повну клінічну придатність, дозу чи
  перевагу над іншими схемами. Саме ураження ЦНС не обирає протокол автоматично.
notes: No individualized or clinically approved treatment recommendation. Age/fitness, diagnosis/biomarkers,
