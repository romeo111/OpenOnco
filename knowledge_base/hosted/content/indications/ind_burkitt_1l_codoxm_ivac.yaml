- TEST-CMP
- TEST-LFT
- TEST-LDH
- TEST-URIC-ACID
- TEST-CD20-IHC
- TEST-FISH-PANEL
- TEST-PET-CT
- TEST-WHOLE-BODY-MRI
- TEST-BM-ASPIRATE
- TEST-BM-TREPHINE
- TEST-LN-EXCISIONAL-BIOPSY
- TEST-HBV-SEROLOGY
- TEST-HCV-ANTIBODY
- TEST-HIV-SEROLOGY
- TEST-ECHO
- TEST-PREGNANCY
desired_tests: []
rationale: The encoded eviQ 4489/4490 reference is restricted to explicitly confirmed high-risk Burkitt
  WITHOUT proven CNS disease. Missing, conflicting, low-risk or CNS-positive context must not expose this
  schedule or automatically choose a replacement. Proven CNS disease and low-risk disease use separate
  protocol variants. This applicability guard is not a complete eligibility or treatment-ranking audit.
rationale_ua: Закодований довідковий протокол eviQ 4489/4490 обмежено явно підтвердженою лімфомою Беркіта
  високого ризику БЕЗ доведеного ураження ЦНС. Відсутній, суперечливий, низькоризиковий або ЦНС-позитивний
  контекст не має відкривати цей розклад чи автоматично обирати заміну. Доведене ураження ЦНС і низький
  ризик потребують окремих варіантів протоколу. Ця перевірка не є повним аудитом придатності чи вибору
  лікування.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_06
draft_revision: 2
sources:
- source_id: SRC-NCCN-BCELL-2025
  position: supports
- source_id: SRC-ESMO-LYMPHOMA-2025
  position: supports
  relevant_quote_paraphrase: ESMO 2024 endorses DA-EPOCH-R for low-risk Burkitt; intensive CODOX-M/IVAC
    or hyper-CVAD for high-risk; CNS prophylaxis mandatory
- source_id: SRC-EVIQ-BURKITT-OVERVIEW-3727
  position: supports
  relevant_quote_paraphrase: Distinct low-risk, high-risk and high-risk with proven CNS pathways; the
    encoded high-risk regimen is not interchangeable across these groups.
known_controversies: []
do_not_do:
- Не застосовуйте цей розклад високого ризику без доведеного ураження ЦНС при низькому ризику, доведеному
  ураженні ЦНС чи непідтвердженому/суперечливому ризику та стані ЦНС.
- Не вважайте відсутнє обстеження чи попередньо вибрану відповідь підтвердженням відсутності ураження
  ЦНС.
- Не обирайте автоматично іншу схему, якщо ця перевірка контексту протоколу не пройшла.
- Перевірте функцію органів, рідину в третіх просторах, взаємодії та порятунок фолінатом за протоколом
  спеціаліста; ця перевірка не визначає дозу чи вікову заміну.
do_not_do_en:
- Do not apply this high-risk/no-proven-CNS schedule to low-risk, proven-CNS or unconfirmed/conflicting
  risk/CNS profiles.
- Do not infer absence of CNS involvement from a missing assessment or preselected questionnaire answer.
- Do not automatically promote another regimen when this protocol-scope check fails.
- Verify individualized organ-function, third-space fluid, medication interactions and folinate rescue
  with the specialist protocol; this guard does not determine a dose or age-only alternative.
time_critical: false
last_reviewed: null
reviewer_signoffs: 0
notes: Positive risk/CNS confirmation guard only. Demographic eligibility, biomarkers, efficacy estimates,
  current-line ranking and CNS-specific or low-risk protocol implementation remain unreviewed.
review_status: pending_clinical_signoff
