id: IND-BURKITT-1L-CODOXM-IVAC
plan_track: aggressive
applicable_to:
  disease_id: DIS-BURKITT
  line_of_therapy: 1
  stage_requirements: []
  biomarker_requirements_required:
  - biomarker_id: BIO-CD20-IHC
    required: true
    value_constraint: positive
  - biomarker_id: BIO-MYC-REARRANGEMENT
    required: true
    value_constraint: positive
  - biomarker_id: BIO-HIV-STATUS
    required: true
    value_constraint: any value valid (categorical etiology gate; substantial subset of adult Burkitt
      is HIV-associated; HIV+ → cART throughout, mandatory CNS prophylaxis regardless of risk score, integrase-inhibitor
      backbone preferred to avoid ritonavir-vincristine interaction)
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2
    age_max: 60
  confirmed_profile_values:
    findings.burkitt_high_risk:
    - true
    findings.cns_involvement:
    - false
recommended_regimen: REG-CODOX-M-IVAC
concurrent_therapy: []
followed_by: []
evidence_level: high
strength_of_recommendation: strong
nccn_category: '1'
expected_outcomes:
  overall_response_rate: ~92%
  complete_response: ~80-85%
  progression_free_survival: Median PFS ~5 years for fit younger high-risk
  overall_survival_5y: ~75-85%
hard_contraindications:
- CI-HBV-NO-PROPHYLAXIS
- CI-LVEF-LOW-FOR-ANTHRACYCLINE
red_flags_triggering_alternative: []
required_tests:
