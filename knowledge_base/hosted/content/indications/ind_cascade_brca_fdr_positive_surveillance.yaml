rationale: >
  Alternative-track companion to IND-CASCADE-BRCA-FDR-POSITIVE-TESTING.
  Applied when a first-degree relative of a confirmed BRCA1 / BRCA2
  carrier declines cascade germline testing — for any reason (cost,
  insurance, psychological / anxiety, family privacy, geographic
  access) — and is offered empirical enhanced surveillance applied
  as if BRCA were confirmed. The **50% prior probability** of carrier
  status is high enough to justify intensive surveillance without
  genetic confirmation, but patient autonomy (CHARTER §11) governs
  the choice.

  **Breast (women):** Annual breast MRI starting age 25, alternating
  every 6 months with annual mammogram from age 30 (q6mo combined
  cadence). Clinical breast exam q6-12mo from age 25. Breast
  awareness education. The MRI / mammogram alternating cadence
  detects DCIS and small invasive cancer with >90% sensitivity in
  high-risk populations.

  **Ovarian (women):** TVUS + CA-125 q6mo from age 30-35, framed
  honestly as suboptimal — sensitivity for early-stage high-grade
  serous carcinoma is poor (~50%). Risk-reducing BSO is NOT offered
  empirically — the surgical decision requires confirmed carrier
  status (premature surgical menopause has lifelong cardiovascular,
  bone-health, and cognitive sequelae).

  **Risk-reducing mastectomy (RRM):** NOT offered empirically.
  Surgical irreversibility, body-image implications, and the
  ~50% probability of being a non-carrier mean RRM requires
  confirmed carrier diagnosis before being on the table as a
  shared-decision option.

  **Prostate (men, especially with BRCA2 FDR-positive):** Annual
  PSA + DRE from age 40 — applied empirically given BRCA2's
  enriched high-grade / metastatic prostate cancer signal.

  **Pancreatic (PDAC):** Surveillance via EUS / MRI considered if
  the family additionally has ≥1 affected first / second-degree
  relative with PDAC — not warranted by BRCA FDR-positivity alone.

  **Periodic re-discussion of cascade testing** is appropriate at
  every surveillance visit. Most patients eventually accept testing
  after additional visits, particularly as life decisions (childbearing,
  surgical timing) crystallize.

  Routing reconsiderations: if patient eventually accepts cascade
  testing, results route to (a) confirmed-carrier pathway via
  RF-BRCA-CONFIRMED-CARRIER, or (b) general-population pathway.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до
  IND-CASCADE-BRCA-FDR-POSITIVE-TESTING. Застосовується коли родич
  першого ступеня підтвердженого BRCA1 / BRCA2 носія відмовляється
  від cascade germline тестування — з будь-якої причини — і отримує
  empіричне посилене спостереження, як якщо б BRCA був підтверджений.
  **50% апріорна ймовірність** носійства достатньо висока, щоб
  виправдати інтенсивне спостереження без генетичного підтвердження.

  **Груди (жінки):** Annual breast MRI з 25 років, alternating
  q6mo з annual mammogram з 30 років. CBE q6-12mo з 25 років.

  **Яєчники (жінки):** TVUS + CA-125 q6mo з 30-35 років (sensitivity
  для ранніх стадій high-grade serous — погана; framing має бути
  чесним). Risk-reducing BSO НЕ пропонується empіричнo.

  **Risk-reducing mastectomy (RRM):** НЕ пропонується empіричнo —
  surgical irreversibility вимагає підтвердженого carrier діагнозу.

  **Простата (чоловіки, особливо BRCA2 FDR-positive):** Annual PSA +
  DRE з 40 років.

  **Підшлункова:** Surveillance розглядається при ≥1 додатковому
  афектованому first / second-degree родичі з PDAC.

  **Periodic re-discussion** cascade тестування доречне на кожному
  surveillance візиті. Per CHARTER §11 framing автономії пацієнта.

