do_not_do:
  - "Не презентувати empirical surveillance як еквівалент genetic confirmation — 50% пацієнтів — non-carriers, які могли б безпечно decline mammography radiation exposure."
  - "Не пропонувати risk-reducing мастектомію (RRM) empіричнo — surgical irreversibility + body-image наслідки вимагають підтвердженого carrier діагнозу."
  - "Не пропонувати risk-reducing BSO empіричнo — premature surgical menopause має lifelong cardiovascular, bone-health, cognitive наслідки."
  - "Не презентувати CA-125 + TVUS як ефективний скринінг яєчників — sensitivity для ранніх стадій high-grade serous погана; framing має бути чесним."
  - "Не пропускати periodic re-discussion про cascade testing — більшість пацієнтів врешті приймають тестування."

do_not_do_en:
  - "Do not present empirical surveillance as equivalent to genetic confirmation — 50% of patients are non-carriers who could safely decline mammography radiation exposure."
  - "Do not offer risk-reducing mastectomy (RRM) empirically — surgical irreversibility and body-image implications require confirmed carrier diagnosis."
  - "Do not offer risk-reducing BSO empirically — premature surgical menopause has lifelong cardiovascular, bone-health, and cognitive sequelae."
  - "Do not present CA-125 + TVUS as effective ovarian screening — sensitivity for early-stage high-grade serous carcinoma is poor; framing must be honest."
  - "Do not skip periodic re-discussion of cascade testing — most patients eventually accept testing."

