expected_outcomes:
  overall_response_rate: >-
    Empirical enhanced surveillance applied to a first-degree relative
    of a confirmed BRCA1 / BRCA2 carrier — without genetic confirmation
    — captures early-stage breast cancer in the **50% of patients who
    are actual carriers** (autosomal-dominant prior probability), but
    subjects the **other 50%** (non-carriers) to intensive surveillance
    + radiation exposure (mammography) they could have safely declined
    had cascade testing been completed. Risk-reducing surgery (RRM,
    RRSO) is NOT offered empirically — that decision requires genetic
    confirmation.

