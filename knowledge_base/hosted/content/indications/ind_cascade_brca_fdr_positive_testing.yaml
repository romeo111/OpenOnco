expected_outcomes:
  overall_response_rate: >-
    **50% prior probability** of carrier status in first-degree
    relatives of confirmed BRCA1 / BRCA2 carriers — vastly higher than
    the ~5-10% positive yield of pedigree-only HBOC-suspicion testing.
    Site-specific (familial-variant) cascade testing has near-100%
    analytic sensitivity for the family variant and minimal VUS rate.
    Confirmed carrier status enables proven interventions: annual
    breast MRI from age 25 + mammogram from 30 detects early-stage
    breast cancer with >90% sensitivity; risk-reducing mastectomy
    (RRM) reduces breast cancer incidence by ~90-95%; risk-reducing
    BSO (RRSO) age 35-40 (BRCA1) / 40-45 (BRCA2) reduces ovarian
    cancer mortality by ~80% and breast cancer incidence by ~50% in
    premenopausal women.

