rationale: >
  Standard-track cascade-testing pathway for first-degree relatives of
  confirmed BRCA1 / BRCA2 carriers. Three parallel referrals:

  **(1) Pre-test genetic counseling.** Covers: autosomal-dominant
  inheritance, **50% prior probability** of carrying the same
  pathogenic variant as the FDR (one parent heterozygous → 1/2 chance
  per child), gene-specific penetrance (BRCA1 breast ~55-72%
  lifetime; BRCA2 breast ~45-69%; BRCA1 ovarian ~39-44%; BRCA2
  ovarian ~11-17%; BRCA2 male breast ~6.8% and prostate ~20-30%
  high-grade), implications for the patient's own children, insurance
  / GINA considerations, the **major life decisions cascaded by a
  positive result** (RRM timing, RRSO timing relative to childbearing,
  reproductive planning including PGD-IVF). Pre-test counseling is
  the standard of care per NCCN / ACMG / ASCO before cascade testing.

  **(2) Cascade germline testing.** Site-specific (familial-variant)
  testing is the first-line option — anchored on the specific BRCA1
  or BRCA2 pathogenic variant already identified in the first-degree
  relative. Site-specific testing offers (a) highest positive
  predictive value, (b) minimal VUS rate (the variant is already
  classified), (c) lowest cost (~$200-500 USD vs $1500-3000 for
  full HBOC panel), (d) fastest turnaround (~2 weeks vs 3-6 weeks).
  Multi-gene HBOC panel expansion (PALB2, CHEK2, ATM, RAD51C/D,
  BRIP1, TP53) is appropriate when (i) site-specific is negative
  and the family phenotype is broader than the relative's single
  variant explains, (ii) the family has multiple distinct hereditary
  cancer phenotypes suggesting a co-segregating second syndrome,
  or (iii) Ashkenazi Jewish ancestry (3 founder variants in BRCA1 /
  BRCA2 plus ATM, BLM, etc. — full panel often preferred).

  **(3) Cascade-positive sequel pathway:** Positive carrier → routes
  to RF-BRCA-CONFIRMED-CARRIER and IND-BRCA-CARRIER-SURVEILLANCE /
  IND-BRCA-CARRIER-INTENSIFIED. Negative result (familial variant
  not present) → general-population mammography from age 40-50
  (USPSTF) + any residual family-history adjustments. VUS result on
  site-specific testing is unusual when the family variant is already
  pathogenic; if observed, repeat testing + reclassification workup.

  **Cost / access:** in Ukraine, BRCA site-specific cascade testing
  for a known familial variant is available through private labs at
  ~3000-6000 UAH (vs 5000-15000 UAH for full HBOC panel).

rationale_ua: >
  Стандартний-трек cascade-testing шлях для родичів першого ступеня
  підтверджених носіїв BRCA1 / BRCA2. Три паралельні направлення:

  **(1) Pre-test генетичне консультування.** Охоплює:
  аутосомно-домінантне успадкування, **50% апріорна ймовірність**
  носійства того ж патогенного варіанту, що й FDR (один батьківський
  гетерозиготний → 1/2 шанс на дитину), пенетрантність за генами
  (BRCA1 груди ~55-72% lifetime; BRCA2 груди ~45-69%; BRCA1 яєчники
  ~39-44%; BRCA2 яєчники ~11-17%; BRCA2 male breast ~6.8% та простата
  ~20-30% high-grade), наслідки для власних дітей, страхові / GINA
  міркування, **великі життєві рішення**, які каскадує позитивний
  результат (RRM timing, RRSO timing щодо childbearing, reproductive
  planning включаючи PGD-IVF).

  **(2) Cascade germline тестування.** Site-specific (сімейний-варіант)
  тестування — first-line опція. Site-specific тестування забезпечує
  (а) найвищу positive predictive value, (б) мінімальну VUS-частоту,
  (в) найнижчу вартість (~$200-500 USD), (г) найшвидший turnaround.
  Multi-gene HBOC panel розширення (PALB2, CHEK2, ATM, RAD51C/D,
  BRIP1, TP53) доречне для broader family phenotype або Ashkenazi
  Jewish ancestry (3 founder variants).

  **(3) Sequel шлях при позитивному cascade:** Позитивний носій →
  routes до RF-BRCA-CONFIRMED-CARRIER та
  IND-BRCA-CARRIER-SURVEILLANCE / IND-BRCA-CARRIER-INTENSIFIED.
  Негативний результат → general-population mammography з 40-50
  років.

  **Вартість / доступ:** в Україні BRCA site-specific cascade
  тестування доступне через приватні лабораторії при ~3000-6000 UAH.

