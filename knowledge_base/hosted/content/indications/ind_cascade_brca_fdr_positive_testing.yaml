do_not_do:
  - "Не призначати cascade germline тестування без pre-test консультування — інформована згода обов'язкова, особливо враховуючи surgical наслідки (RRM/RRSO) позитивного результату."
  - "Не починати з full HBOC panel при відомому сімейному варіанті — site-specific тестування дешевше, швидше, нижчий VUS-ризик. Виключення: Ashkenazi Jewish ancestry (3 founder variants), broader family phenotype."
  - "Не презентувати negative site-specific результат як zero-risk — патогенний сімейний варіант відсутній, але загальнопопуляційний ризик зберігається; mammography за USPSTF."
  - "Не push surgical decisions (RRM/RRSO) ДО завершення cascade тестування — patient autonomy + recovery-oriented timing вимагають впевненості у carrier статусі."
  - "Не пропускати документацію статусу cascade-тестування у всієї сім'ї — каскад продовжується через покоління (FDR пацієнта → їх діти → онуки)."

do_not_do_en:
  - "Do not order cascade germline testing without pre-test counseling — informed consent is mandatory, particularly given the surgical implications (RRM/RRSO) of a positive result."
  - "Do not start with a full HBOC panel when the familial variant is known — site-specific testing is cheaper, faster, has lower VUS risk. Exception: Ashkenazi Jewish ancestry (3 founder variants), broader family phenotype."
  - "Do not present a negative site-specific result as zero-risk — the familial pathogenic variant is absent, but general-population risk persists; mammography per USPSTF."
  - "Do not push surgical decisions (RRM/RRSO) BEFORE cascade testing is complete — patient autonomy and recovery-oriented timing require certainty about carrier status."
  - "Do not skip family-wide cascade documentation — the cascade continues across generations (patient's FDR → their children → grandchildren)."

