expected_outcomes:
  overall_response_rate: >-
    Empirical sigmoidoscopy from age 10-12 applied to a first-degree
    relative of a confirmed APC carrier — without genetic confirmation
    — detects polyposis in the **50% of patients who are actual
    carriers** (autosomal-dominant prior probability), enabling
    timely colonoscopy escalation and prophylactic colectomy planning
    before the near-100% CRC risk of classic FAP manifests by age 40.
    But subjects the **other 50%** (non-carriers) to decades of
    childhood / adolescent sigmoidoscopy + upper-GI EGD they could
    have safely declined had cascade testing been completed —
    substantial preventable burden in the pediatric context.

