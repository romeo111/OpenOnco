do_not_do:
  - "Не презентувати empirical FAP surveillance як еквівалент genetic confirmation — 50% пацієнтів — non-carriers, які могли б бути звільнені від childhood / adolescent sigmoidoscopy + decades of upper-GI EGD."
  - "Не initiating prophylactic colectomy decision pathway empіричнo — surgical irreversibility (total proctocolectomy + IPAA) у non-carrier — нанесення irreversible harm."
  - "Не defer first sigmoidoscopy за межі 10-12 років empіричнo якщо ризик FAP — non-trivial — це surveillance window critical для prevent CRC до 40 років."
  - "Не пропускати MAP differential workup при ambiguous family pedigree — MUTYH панель distinguishes autosomal-recessive MAP від autosomal-dominant FAP, що змінює cascade-testing implications для siblings."
  - "Не пропускати periodic re-discussion про cascade testing — pediatric surveillance burden substantial; many families initially decline pediatric тестування але accept later."

do_not_do_en:
  - "Do not present empirical FAP surveillance as equivalent to genetic confirmation — 50% of patients are non-carriers who could be released from childhood / adolescent sigmoidoscopy plus decades of upper-GI EGD."
  - "Do not initiate the prophylactic colectomy decision pathway empirically — surgical irreversibility (total proctocolectomy + IPAA) in a non-carrier inflicts irreversible harm."
  - "Do not defer the first sigmoidoscopy beyond age 10-12 empirically if FAP risk is non-trivial — this surveillance window is critical for preventing CRC before age 40."
  - "Do not skip MAP differential workup with an ambiguous family pedigree — a MUTYH panel distinguishes autosomal-recessive MAP from autosomal-dominant FAP, which changes cascade-testing implications for siblings."
  - "Do not skip periodic re-discussion of cascade testing — pediatric surveillance burden is substantial; many families initially decline pediatric testing but accept later."

