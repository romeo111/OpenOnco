      "Cascade testing of first-degree relatives is recommended whenever
      a pathogenic / likely-pathogenic APC variant is identified.
      Pediatric testing from age 10-12 (classic FAP) is the consensus
      standard given the childhood-onset surveillance and surgical
      decision pathway."
  - source_id: SRC-ESMO-CRC-2024
    position: supports
  - source_id: SRC-NCCN-COLON-2025
    position: supports
  - source_id: SRC-ASCO-ACMG-LYNCH-2014
    position: supports
    relevant_quote_paraphrase: >-
      "ACMG / ASCO recommend cascade testing of first-degree relatives;
      pediatric testing is appropriate when surveillance / intervention
      begins in childhood (FAP is a canonical example, with annual
      sigmoidoscopy beginning at age 10-12)."

do_not_do:
  - "Не defer pediatric cascade тестування у класичному FAP до 18 років — annual sigmoidoscopy починається у 10-12 років, prophylactic colectomy у пізньому підлітковому віці; surveillance + surgical decisions fundamentally depend on early genotype knowledge."
  - "Не починати з full multi-gene panel при відомому сімейному APC варіанті БЕЗ ambiguous family history — site-specific тестування first-line. MUTYH panel доречно якщо MAP differential розглядається."
  - "Не пропускати інтенсивне pediatric counseling — parental decision-making + developmentally-appropriate assent + long-term planning для prophylactic colectomy — особливі етичні міркування."
  - "Не презентувати negative site-specific результат у дитини як зайвий — це звільняє від decades of sigmoidoscopy, prophylactic colectomy decision pathway, upper-GI EGD (значний patient-experience benefit)."
  - "Не делегувати FAP cascade follow-up non-specialist — InSiGHT FAP guidelines coordination + Spigelman staging interpretation + colorectal surgery planning потребує FAP-experienced center."

do_not_do_en:
  - "Do not defer pediatric cascade testing in classic FAP until age 18 — annual sigmoidoscopy begins at age 10-12, prophylactic colectomy in late teens; surveillance and surgical decisions fundamentally depend on early genotype knowledge."
  - "Do not start with a full multi-gene panel when the familial APC variant is known and family history is unambiguous — site-specific testing is first-line. MUTYH panel is appropriate if a MAP differential is being considered."
  - "Do not skip intensive pediatric counseling — parental decision-making, developmentally-appropriate assent, and long-term planning for prophylactic colectomy are special ethical considerations."
  - "Do not present a negative site-specific result in a child as trivial — it releases them from decades of sigmoidoscopy, the prophylactic colectomy decision pathway, and upper-GI EGD (significant patient-experience benefit)."
  - "Do not delegate FAP cascade follow-up to non-specialists — InSiGHT FAP guideline coordination, Spigelman staging interpretation, and colorectal surgery planning require a FAP-experienced center."

