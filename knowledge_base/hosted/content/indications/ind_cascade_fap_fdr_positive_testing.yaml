rationale: >
  Standard-track cascade-testing pathway for first-degree relatives of
  confirmed APC (FAP) carriers. The childhood-onset surveillance
  dependency makes this one of the few cascade scenarios where
  pediatric germline testing is the standard of care. Four parallel
  referrals:

  **(1) Pediatric-aware pre-test genetic counseling.** Covers:
  autosomal-dominant inheritance, **50% prior probability** of
  carrying the same pathogenic variant as the FDR (one parent
  heterozygous → 1/2 chance per child), the **near-100% lifetime CRC
  risk in classic FAP without colectomy by age 40**, surveillance
  schedule (annual sigmoidoscopy from age 10-12 in classic FAP;
  colonoscopy q1-2y from age 18-20 in attenuated FAP; upper EGD
  q1-3y from age 25-30 with Spigelman staging), the prophylactic
  colectomy decision typically in late teens / early 20s in classic
  FAP, extracolonic manifestations (desmoid tumors,
  CHRPE, osteomas, papillary thyroid cancer), and implications for
  the patient's own children. For **pediatric cascade testing**,
  counseling addresses parental decision-making, developmentally-
  appropriate assent (typically formal assent from age 7+),
  long-term planning for prophylactic colectomy, and the emotional
  impact of a positive result on a child / adolescent. FAP is one
  of the few syndromes where pediatric germline testing is the
  standard of care — surveillance and surgical decisions begin in
  childhood.

  **(2) Cascade germline testing from age 10-12 (classic FAP) or
  18-20 (attenuated FAP timing).** Site-specific (familial-variant)
  testing is the first-line option — anchored on the specific APC
  pathogenic variant already identified in the first-degree
  relative. Site-specific testing offers (a) highest positive
  predictive value, (b) minimal VUS rate (the variant is already
  classified), (c) lowest cost, (d) fastest turnaround. Modern
  multi-gene panels include MUTYH for the **MAP differential**
  (MUTYH-Associated Polyposis is autosomal-RECESSIVE; if the family
  history is ambiguous, MUTYH panel testing distinguishes the two
  syndromes). De novo APC variants occur in ~25% of FAP probands —
  multi-gene panel expansion is reasonable when site-specific is
  negative and clinical suspicion persists or family history is
  sparse.

  **(3) Cascade-positive sequel pathway:** Positive carrier → routes
  to RF-FAP-CONFIRMED-CARRIER and IND-FAP-CARRIER-SURVEILLANCE /
  IND-FAP-CARRIER-INTENSIFIED. Surveillance: classic FAP — annual
  sigmoidoscopy from age 10-12 → colonoscopy when polyps appear
  → prophylactic total proctocolectomy with IPAA (or total
  colectomy with IRA) typically in late teens / early 20s. Attenuated
  FAP — colonoscopy q1-2y from 18-20. Upper EGD q1-3y from 25-30
  with Spigelman staging in both. Annual thyroid ultrasound. Negative
  result (familial variant not present) → general-population CRC
  screening cadence (USPSTF colonoscopy q10y from age 45) — releasing
  the child from decades of sigmoidoscopy / colonoscopy / surgery
  pathway.

  **(4) Pediatric-specific routing.** A child of an APC-positive
  FDR who tests negative on cascade is released from the entire FAP
  surveillance schedule — sparing them childhood / adolescent
  sigmoidoscopy, the prophylactic colectomy decision pathway, and
  decades of upper-GI EGD. The benefit of a negative cascade result
  is substantial and unique to genetic confirmation.

  **Cost / access:** in Ukraine, APC site-specific cascade testing
  for a known familial variant is available through private labs at
  ~3000-6000 UAH (vs 5000-15000 UAH for full hereditary CRC panel).

rationale_ua: >
  Стандартний-трек cascade-testing шлях для родичів першого ступеня
  підтверджених носіїв APC (FAP). Childhood-onset surveillance
  dependency робить це одним з небагатьох cascade сценаріїв де
  педіатричне germline тестування є standard of care. Чотири
  паралельні направлення:

  **(1) Pediatric-aware pre-test генетичне консультування.** Охоплює:
  аутосомно-домінантне успадкування, **50% апріорна ймовірність**,
  **майже-100% lifetime CRC ризик у класичному FAP без колектомії до
  40 років**, surveillance schedule (annual sigmoidoscopy з 10-12
  років у класичному FAP; colonoscopy q1-2y з 18-20 у attenuated
  FAP), prophylactic colectomy у пізньому підлітковому віці /
  ранньому 20-річчі, extracolonic manifestations. Для **педіатричного
  cascade тестування**, консультування адресує parental
  decision-making, developmentally-appropriate assent (formal assent
  з 7+).

  **(2) Cascade germline тестування з 10-12 років.** Site-specific
  (сімейний-варіант) тестування — first-line опція. Modern multi-gene
  panels включають MUTYH для **MAP differential** (autosomal-RECESSIVE).
  De novo APC variants occur in ~25% — multi-gene panel розширення
  доречне при ambiguous family history.

  **(3) Sequel шлях при позитивному cascade:** Позитивний носій →
  routes до RF-FAP-CONFIRMED-CARRIER та IND-FAP-CARRIER-SURVEILLANCE
  / IND-FAP-CARRIER-INTENSIFIED.

  **(4) Pediatric-specific routing.** Дитина APC-positive FDR, що
  тестує negative, звільняється від всього FAP surveillance schedule.

  **Вартість / доступ:** в Україні APC site-specific cascade
  тестування доступне через приватні лабораторії при ~3000-6000 UAH.

