expected_outcomes:
  overall_response_rate: >-
    **50% prior probability** of carrier status in first-degree
    relatives of confirmed APC carriers (autosomal-dominant
    inheritance). Site-specific (familial-variant) testing has
    near-100% analytic sensitivity. **Cascade testing from age
    10-12** enables timely initiation of annual sigmoidoscopy in
    classic FAP carriers — without cascade-driven surveillance,
    classic FAP carries near-100% CRC risk by age 40 without
    colectomy. Confirmed cascade-negative status releases a child
    from decades of unnecessary sigmoidoscopy / colonoscopy /
    upper-GI EGD surveillance and the prophylactic colectomy
    decision-pathway entirely — a significant patient-experience
    benefit unique to genetic confirmation.

