rationale: >
  Alternative-track companion to IND-CASCADE-LFS-FDR-POSITIVE-TESTING.
  Applied when a first-degree relative of a confirmed TP53 carrier
  declines cascade germline testing — for any reason (cost,
  insurance, the substantial psychological burden of TP53 carrier
  status, family privacy, geographic access) — and is offered
  empirical Toronto-Protocol surveillance applied as if LFS were
  confirmed. The **50% prior probability** of carrier status
  combined with the extreme penetrance of confirmed TP53 makes the
  surveillance benefit substantial even without genetic confirmation,
  but patient autonomy (CHARTER §11) governs the choice.

  **Toronto Protocol (empirical):**
  - Annual whole-body MRI from any age — soft-tissue sarcoma,
    osteosarcoma, deep visceral tumors.
  - Annual brain MRI from any age — choroid plexus carcinoma in
    children, glioma / astrocytoma in adults.
  - Breast MRI annually from age 20-25 in women (NOT mammography —
    radiation avoidance even in pre-cascade phase, given the **50%
    prior** is high enough to warrant precaution).
  - Colonoscopy q2-5y from age 25.
  - Annual comprehensive dermatology + skin exam.
  - Annual blood cell counts (CBC) — leukemia surveillance.
  - Annual abdominal + pelvic ultrasound (children + adults) —
    adrenocortical carcinoma surveillance, particularly in
    pediatric carriers.
  - Pediatric carriers (children of TP53-positive FDR): brain MRI +
    abdominal ultrasound from infancy per Toronto Protocol pediatric
    arm.

  **Radiation avoidance even pre-cascade:** Given the 50% prior, the
  alternative track adopts radiation-avoidance principles
  empirically — MRI over CT, ultrasound over X-ray when feasible —
  to minimize harm in the case the patient is a non-carrier (where
  the harm is small) and prevent harm in the case the patient is a
  carrier (where radiation-induced secondary cancer risk is
  documented).

  **Risk-reducing mastectomy (RRM):** NOT offered empirically.
  Surgical irreversibility, body-image implications, and the ~50%
  probability of being a non-carrier require confirmed carrier
  diagnosis. Risk-reducing surgery discussion is reserved for the
  confirmed-carrier pathway.

  **Periodic re-discussion of cascade testing** is essential at every
  visit. LFS surveillance burden is substantial — many patients
  initially decline testing but accept it later when the
  surveillance fatigue motivates the desire for certainty.

  Routing reconsiderations: if patient eventually accepts cascade
  testing, results route to (a) confirmed-LFS pathway, or (b)
  general-population pathway if familial variant is absent.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до
  IND-CASCADE-LFS-FDR-POSITIVE-TESTING. Застосовується коли родич
  першого ступеня підтвердженого TP53-носія відмовляється від
  cascade germline тестування — з будь-якої причини (вартість,
  страхування, суттєвий психологічний тягар TP53 carrier статусу,
  сімейна приватність) — і отримує empіричне Toronto-Protocol
  спостереження, як якщо б LFS був підтверджений. **50% апріорна
  ймовірність** у поєднанні з екстремальною пенетрантністю TP53
  робить surveillance benefit substantial навіть без підтвердження.

  **Toronto Protocol (empirical):**
  - Annual whole-body MRI з будь-якого віку.
  - Annual brain MRI з будь-якого віку.
  - Breast MRI annually з 20-25 років у жінок (НЕ mammography —
    radiation avoidance навіть у pre-cascade phase).
  - Колоноскопія q2-5y з 25 років.
  - Annual dermatology + skin exam.
  - Annual CBC — leukemia surveillance.
  - Annual abdominal + pelvic ultrasound — adrenocortical carcinoma
    surveillance (особливо у педіатричних carriers).

  **Radiation avoidance pre-cascade:** З огляду на 50% prior,
  alternative track приймає radiation-avoidance empіричнo — MRI
  замість CT, ultrasound замість X-ray коли можливо.

  **Risk-reducing мастектомія (RRM):** НЕ пропонується empіричнo.

  **Periodic re-discussion** cascade тестування essential на кожному
  візиті. Per CHARTER §11 framing автономії пацієнта.

