do_not_do:
  - "Не презентувати empirical Toronto surveillance як еквівалент genetic confirmation — 50% пацієнтів — non-carriers, які могли б безпечно decline burden."
  - "Не використовувати mammography empіричнo у LFS-suspicion жінок — radiation-avoidance принцип застосовується pre-cascade за 50% prior; breast MRI preferred."
  - "Не пропонувати risk-reducing mastectomy empіричнo — surgical irreversibility вимагає підтвердженого carrier діагнозу."
  - "Не пропускати pediatric surveillance у дітей TP53-positive FDR — Toronto Protocol pediatric arm включає brain MRI + abdominal ultrasound з infancy через ризик choroid plexus carcinoma + adrenocortical carcinoma."
  - "Не пропускати periodic re-discussion про cascade testing — LFS surveillance burden substantial; багато пацієнтів врешті приймають тестування коли surveillance fatigue motivates desire for certainty."

do_not_do_en:
  - "Do not present empirical Toronto surveillance as equivalent to genetic confirmation — 50% of patients are non-carriers who could safely decline the burden."
  - "Do not use mammography empirically in LFS-suspicion women — radiation-avoidance principle applies pre-cascade given the 50% prior; breast MRI is preferred."
  - "Do not offer risk-reducing mastectomy empirically — surgical irreversibility requires confirmed carrier diagnosis."
  - "Do not skip pediatric surveillance in children of TP53-positive FDRs — Toronto Protocol pediatric arm includes brain MRI + abdominal ultrasound from infancy given the risk of choroid plexus carcinoma + adrenocortical carcinoma."
  - "Do not skip periodic re-discussion of cascade testing — LFS surveillance burden is substantial; many patients eventually accept testing when surveillance fatigue motivates desire for certainty."

