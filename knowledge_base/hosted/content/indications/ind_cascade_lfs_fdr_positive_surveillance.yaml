expected_outcomes:
  overall_response_rate: >-
    Empirical Toronto-Protocol-style surveillance applied to a
    first-degree relative of a confirmed TP53 carrier — without
    genetic confirmation — captures early-stage cancer in the **50% of
    patients who are actual carriers** (autosomal-dominant prior
    probability), but subjects the **other 50%** (non-carriers) to a
    resource-intensive, anxiety-provoking surveillance regimen they
    could have safely declined had cascade testing been completed.
    Toronto Protocol surveillance in confirmed carriers (Villani et
    al. 2016) showed 5-year survival 88.8% (surveillance arm) vs
    59.6% (non-surveillance arm); applied empirically, the absolute
    benefit halves but remains substantial in the high-risk
    population.

