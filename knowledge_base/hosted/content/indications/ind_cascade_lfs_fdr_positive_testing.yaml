      whenever a pathogenic / likely-pathogenic variant is identified;
      site-specific testing for the known familial variant is
      first-line."

do_not_do:
  - "Не призначати cascade germline тестування без intensive pre-test консультування — LFS має найбільший психологічний тягар серед хirediffrenary syndromes; informed consent + emotional support обов'язкові."
  - "Не починати з full multi-gene panel при відомому сімейному TP53 варіанті БЕЗ broader family phenotype — site-specific тестування first-line. Виключення: de novo TP53 mutations (~7-20%) або unclear family history."
  - "Не презентувати negative site-specific результат як zero-risk — патогенний сімейний варіант відсутній, але інші hereditary cancer ризики (БRCA, Lynch) можуть співіснувати у family."
  - "Не defer cascade тестування якщо пацієнт або family member розвиває рак — RADIATION AVOIDANCE caveat fundamentally змінює radiation therapy planning; expedite."
  - "Не auto-prescribe surveillance (WB-MRI, breast MRI) ДО завершення cascade тестування — empirical alternative pathway існує (див. IND-CASCADE-LFS-FDR-POSITIVE-SURVEILLANCE)."

do_not_do_en:
  - "Do not order cascade germline testing without intensive pre-test counseling — LFS carries the heaviest psychological burden among hereditary syndromes; informed consent + emotional support are mandatory."
  - "Do not start with a full multi-gene panel when the familial TP53 variant is known and family phenotype is consistent — site-specific testing is first-line. Exception: de novo TP53 mutations (~7-20%) or unclear family history."
  - "Do not present a negative site-specific result as zero-risk — the familial pathogenic variant is absent, but other hereditary cancer risks (BRCA, Lynch) may co-exist in the family."
  - "Do not defer cascade testing if the patient or another family member develops cancer — the RADIATION AVOIDANCE caveat fundamentally changes radiation therapy planning; expedite."
  - "Do not auto-prescribe surveillance (WB-MRI, breast MRI) BEFORE cascade testing is complete — an empirical alternative pathway exists (see IND-CASCADE-LFS-FDR-POSITIVE-SURVEILLANCE)."

