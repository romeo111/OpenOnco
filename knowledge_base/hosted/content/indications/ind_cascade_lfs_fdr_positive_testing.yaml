expected_outcomes:
  overall_response_rate: >-
    **50% prior probability** of carrier status in first-degree
    relatives of confirmed TP53 carriers — combined with the extreme
    penetrance of confirmed TP53 (lifetime cancer risk ≥90% in both
    sexes, ~70% by age 50 in men and ~90% by age 50 in women) — makes
    this the highest absolute-risk cascade scenario in clinical
    oncology prevention. Site-specific (familial-variant) testing has
    near-100% analytic sensitivity. Confirmed carrier status enables
    the Toronto Protocol surveillance regimen with documented
    early-cancer detection benefit (Villani et al. 2016 — surveillance
    arm 5-year survival 88.8% vs 59.6% in non-surveillance arm) and
    triggers the RADIATION AVOIDANCE caveat that fundamentally alters
    cancer-treatment decisions if an index cancer subsequently
    develops.

