rationale: >
  Standard-track cascade-testing pathway for first-degree relatives of
  confirmed TP53 (Li-Fraumeni Syndrome) carriers. Four parallel
  referrals:

  **(1) Intensive pre-test genetic counseling.** Covers:
  autosomal-dominant inheritance, **50% prior probability** of
  carrying the same pathogenic variant as the FDR (one parent
  heterozygous → 1/2 chance per child), the **extreme penetrance**
  of TP53 (lifetime cancer risk ≥90% in both sexes; mean breast
  cancer dx age in women ~33y; pediatric adrenocortical carcinoma /
  choroid plexus carcinoma / embryonal rhabdomyosarcoma essentially
  diagnostic in some populations), the **RADIATION AVOIDANCE caveat**
  for confirmed carriers (diagnostic CT / mammography / X-ray
  minimized in favor of MRI / ultrasound; therapeutic radiation for
  any future index cancer requires multidisciplinary review of
  alternatives), implications for the patient's own children, the
  Toronto Protocol surveillance burden, and the substantial
  **psychological burden** of LFS carrier status. Pre-test counseling
  for LFS is more intensive than for other hereditary syndromes
  because of these factors — connection to LFS-specific support
  resources (LFS Association, Living LFS) is part of the pathway.

  **(2) Cascade germline testing.** Site-specific (familial-variant)
  testing is the first-line option — anchored on the specific TP53
  pathogenic variant already identified in the first-degree relative.
  Site-specific testing offers (a) highest positive predictive value,
  (b) minimal VUS rate (the variant is already classified),
  (c) lowest cost, (d) fastest turnaround. Multi-gene panel expansion
  (BRCA1, BRCA2, PALB2, CHEK2 — HBOC overlap; APC, MLH1, MSH2 — when
  family phenotype suggests overlap syndromes) is appropriate when
  (i) site-specific is negative and the family phenotype is broader
  than the relative's single TP53 variant explains, or (ii) **de novo
  TP53 mutations occur in ~7-20% of LFS probands** — multi-gene panel
  expansion is also reasonable when family history is unclear.

  **(3) Cascade-positive sequel pathway:** Positive carrier → routes
  to a confirmed-LFS-carrier pathway (Toronto Protocol surveillance:
  annual whole-body MRI + annual brain MRI + breast MRI from age
  20-25 in women + colonoscopy q2-5y from age 25 + dermatology +
  RADIATION AVOIDANCE for diagnostics). Risk-reducing mastectomy
  discussion in confirmed carriers post-childbearing. Negative result
  (familial variant not present) → general-population screening
  cadence with re-stratification of any residual cancer family
  history risk.

  **(4) Index cancer implication for the patient and family:** If
  the patient (or another untested family member) develops cancer
  during the cascade-testing process, the RADIATION AVOIDANCE
  question becomes immediately relevant. Expedite cascade testing
  rather than defer it — the carrier-status answer changes radiation
  therapy planning fundamentally.

  **Cost / access:** in Ukraine, TP53 site-specific cascade testing
  for a known familial variant is available through private labs at
  ~3000-6000 UAH (vs 5000-15000 UAH for full hereditary cancer
  panel).

rationale_ua: >
  Стандартний-трек cascade-testing шлях для родичів першого ступеня
  підтверджених носіїв TP53 (синдром Li-Fraumeni). Чотири паралельні
  направлення:

  **(1) Інтенсивне pre-test генетичне консультування.** Охоплює:
  аутосомно-домінантне успадкування, **50% апріорна ймовірність**
  носійства того ж патогенного варіанту, що й FDR, **екстремальна
  пенетрантність** TP53 (lifetime cancer ризик ≥90% в обох статях;
  mean breast cancer dx age у жінок ~33y), **RADIATION AVOIDANCE
  caveat** для підтверджених носіїв (diagnostic CT / mammography /
  X-ray мінімізується на користь MRI / ultrasound; therapeutic
  radiation для будь-якого майбутнього index cancer вимагає
  multidisciplinary review), Toronto Protocol surveillance burden,
  суттєвий **психологічний тягар** статусу LFS-носія. Зв'язок з
  LFS-specific підтримкою (LFS Association, Living LFS) — частина
  шляху.

  **(2) Cascade germline тестування.** Site-specific
  (сімейний-варіант) тестування — first-line опція. **De novo TP53
  mutations occur in ~7-20% of LFS probands** — multi-gene panel
  розширення доречне якщо site-specific негативне а family phenotype
  broader.

  **(3) Sequel шлях при позитивному cascade:** Позитивний носій →
  Toronto Protocol surveillance (annual WB-MRI + brain MRI + breast
  MRI з 20-25 років у жінок + колоноскопія q2-5y з 25 років +
  дерматологія + RADIATION AVOIDANCE для diagnostics).

  **(4) Index cancer implication:** Якщо пацієнт (або інший
  непротестований член сім'ї) розвиває рак протягом cascade-testing,
  RADIATION AVOIDANCE стає негайно релевантним — expedite cascade
  тестування, не defer.

  **Вартість / доступ:** в Україні TP53 site-specific cascade
  тестування доступне через приватні лабораторії при ~3000-6000 UAH.

