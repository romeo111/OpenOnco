expected_outcomes:
  overall_response_rate: >-
    Empirical enhanced surveillance applied to a first-degree relative
    of a confirmed Lynch carrier — without genetic confirmation —
    captures cancer at earliest detectable stage in the **50% of
    patients who are actual carriers** (autosomal-dominant prior
    probability), but subjects the **other 50%** (non-carriers) to
    intensive surveillance they could have safely declined had cascade
    testing been completed. Diagnostic precision of confirmed carrier
    status is absent; this pathway accepts that loss in exchange for
    surveillance benefit when the patient declines testing.

