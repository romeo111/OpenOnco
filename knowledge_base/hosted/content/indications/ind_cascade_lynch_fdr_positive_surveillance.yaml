do_not_do:
  - "Не презентувати empirical surveillance як еквівалент genetic confirmation — diagnostic precision відсутня; 50% пацієнтів — non-carriers, які могли б безпечно decline surveillance."
  - "Не рекомендувати risk-reducing hysterectomy / BSO без genetic confirmation — surgical irreversibility + menopausal наслідки потребують підтвердженого carrier diagnosis."
  - "Не пропускати periodic re-discussion про cascade testing — більшість пацієнтів врешті приймають тестування після додаткових візитів."
  - "Не використовувати empirical pancreatic screening без ≥2 first/second-degree-affected — single FDR-positive не warrant EUS / MRI surveillance."
  - "Не auto-prescribe аспірин (CAPP2) empіричнo без підтвердженого carrier статусу — CAPP2 ефекти документовані у MLH1 / MSH2 carriers, не в FDR-positive cohort."

do_not_do_en:
  - "Do not present empirical surveillance as equivalent to genetic confirmation — diagnostic precision is absent; 50% of patients are non-carriers who could safely decline surveillance."
  - "Do not recommend risk-reducing hysterectomy / BSO without genetic confirmation — surgical irreversibility and menopausal sequelae require confirmed carrier diagnosis."
  - "Do not skip periodic re-discussion of cascade testing — most patients eventually accept testing after additional visits."
  - "Do not use empirical pancreatic screening without ≥2 first/second-degree-affected — single FDR-positive does not warrant EUS / MRI surveillance."
  - "Do not auto-prescribe aspirin (CAPP2) empirically without confirmed carrier status — CAPP2 effects are documented in MLH1 / MSH2 carriers, not in FDR-positive cohorts."

