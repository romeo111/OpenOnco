rationale: >
  Alternative-track companion to IND-CASCADE-LYNCH-FDR-POSITIVE-TESTING.
  Applied when a first-degree relative of a confirmed Lynch (MMR /
  EPCAM) carrier declines cascade germline testing — for any reason
  (cost, insurance concerns, psychological / anxiety considerations,
  family privacy, geographic access constraints) — and is offered
  empirical enhanced surveillance applied as if Lynch were confirmed.
  The **50% prior probability** of carrier status is high enough to
  justify intensive surveillance without genetic confirmation, but
  patient autonomy (CHARTER §11) governs the choice.

  **Colorectal:** Colonoscopy q1-2 years starting age 25 (or 10 years
  before youngest CRC dx in family, whichever earlier). Removal of all
  polyps; histologic review for adenomas / serrated lesions. Cadence
  shortens to annual after age 40 or with any adenoma history.

  **Endometrial / ovarian (women):** Annual endometrial sampling +
  transvaginal ultrasound starting age 30-35. Patient education on
  abnormal uterine bleeding — earliest presentation is the strongest
  factor in mortality reduction. Risk-reducing hysterectomy + BSO
  post-childbearing age 40+ is NOT offered empirically — that decision
  requires genetic confirmation (CHARTER §11 shared-decision-making,
  surgical irreversibility, menopausal-sequelae weight).

  **Urothelial:** Annual urinalysis ± urine cytology starting age 30-35.
  Low-threshold cystoscopy for hematuria.

  **Gastric:** Surveillance EGD q3-5y from age 30-35 if family history
  includes gastric cancer; H. pylori eradication regardless.

  **Pancreatic (PDAC):** No routine pancreatic screening unless ≥2
  first/second-degree affected family members — empirical
  surveillance via EUS / MRI is not warranted by single relative's
  carrier status alone.

  **Periodic re-discussion of cascade testing** is appropriate at every
  surveillance visit. Most patients eventually accept testing after
  additional visits and reduced anxiety; the alternative track does
  not preclude future genetic testing.

  Routing reconsiderations: if patient eventually accepts cascade
  testing, results route to (a) confirmed-carrier pathway via
  RF-LYNCH-CONFIRMED-CARRIER, or (b) general-population pathway if
  familial variant is absent.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до
  IND-CASCADE-LYNCH-FDR-POSITIVE-TESTING. Застосовується коли родич
  першого ступеня підтвердженого Lynch (MMR / EPCAM) носія
  відмовляється від cascade germline тестування — з будь-якої причини
  (вартість, страхові міркування, психологічні / тривожні міркування,
  сімейна приватність, географічні обмеження) — і отримує empіричне
  посилене спостереження, як якщо б Lynch був підтверджений. **50%
  апріорна ймовірність** носійства достатньо висока, щоб виправдати
  інтенсивне спостереження без генетичного підтвердження, але
  автономія пацієнта (CHARTER §11) керує вибором.

  **Колоректальне:** Колоноскопія q1-2 роки з 25-річного віку (або 10
  років до наймолодшого КРР діагнозу в сім'ї).

  **Ендометріальне / оваріальне (жінки):** Щорічна біопсія
  ендометрію + TVUS з 30-35 років. Risk-reducing гістеректомія + BSO
  НЕ пропонується empіричнo — це потребує генетичного підтвердження.

  **Уротеліальне:** Щорічний аналіз сечі з 30-35 років.

  **Шлункове:** EGD q3-5y з 30-35 років при сімейній історії раку
  шлунка.

  **Підшлункова (PDAC):** Без routine surveillance.

  **Periodic re-discussion** cascade тестування доречне на кожному
  surveillance візиті. Більшість пацієнтів врешті приймають
  тестування. Per CHARTER §11 framing автономії пацієнта.

