expected_outcomes:
  overall_response_rate: >-
    **50% prior probability** of carrier status in first-degree
    relatives of confirmed Lynch carriers — vastly higher than the
    ~15-25% positive yield of pedigree-suspicion testing populations.
    Diagnostic yield of cascade germline panel testing in this
    population: ~50% positive carrier identification when the relative's
    pathogenic variant is known. Site-specific (single-variant) testing
    has near-100% analytic sensitivity for the family variant and
    minimal VUS rate. Confirmed carrier status enables enhanced
    surveillance with documented mortality benefit: colonoscopy q1-2y
    reduces CRC mortality by ~70%; risk-reducing hysterectomy + BSO
    post-childbearing age 40 reduces endometrial and ovarian cancer
    incidence to near-zero in women.

