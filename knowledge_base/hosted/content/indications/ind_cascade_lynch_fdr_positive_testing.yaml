do_not_do:
  - "Не призначати cascade germline тестування без pre-test консультування — інформована згода та психологічна підготовка обов'язкові."
  - "Не починати з full multi-gene panel при відомому сімейному варіанті — site-specific тестування дешевше, швидше і має менший VUS-ризик."
  - "Не презентувати negative site-specific результат як zero-risk — патогенний сімейний варіант відсутній, але загальнопопуляційний ризик зберігається; CRC screening продовжується за USPSTF."
  - "Не відкладати pediatric cascade тестування у Lynch — на відміну від VHL / FAP, surveillance Lynch починається у дорослому віці (25), тому cascade тестування може зачекати до 18 років з акцентом на autonomy."
  - "Не пропускати документацію статусу cascade-тестування у всієї сім'ї — каскад продовжується через покоління (FDR пацієнта → їх діти → онуки)."

do_not_do_en:
  - "Do not order cascade germline testing without pre-test counseling — informed consent and psychological preparation are mandatory."
  - "Do not start with a full multi-gene panel when the familial variant is known — site-specific testing is cheaper, faster, and has lower VUS risk."
  - "Do not present a negative site-specific result as zero-risk — the familial pathogenic variant is absent, but general-population risk persists; CRC screening continues per USPSTF."
  - "Do not defer pediatric cascade testing in Lynch unnecessarily — unlike VHL / FAP, Lynch surveillance starts in adulthood (age 25), so cascade testing can wait until age 18 with autonomy emphasis."
  - "Do not skip family-wide cascade documentation — the cascade continues across generations (patient's FDR → their children → grandchildren)."

