rationale: >
  Standard-track cascade-testing pathway for first-degree relatives of
  confirmed Lynch (MMR / EPCAM) carriers. Three parallel referrals:

  **(1) Pre-test genetic counseling.** Covers: autosomal-dominant
  inheritance, **50% prior probability** of carrying the same
  pathogenic variant as the FDR (one parent heterozygous → 1/2 chance
  per child), gene-specific penetrance (MLH1 / MSH2 high — CRC
  ~70-80%, endometrial ~40-60%; MSH6 / PMS2 lower; EPCAM 3' deletions
  follow MSH2-like profile), implications for the patient's own
  children (cascade testing continues down generations), insurance /
  GINA considerations, psychological aspects. Per ACMG / ASCO
  cascade-testing guidance, pre-test counseling is the standard of
  care before germline testing — particularly important here because
  a positive result triggers intensive lifelong surveillance.

  **(2) Cascade germline testing.** Site-specific (familial-variant)
  testing is the first-line option — anchored on the specific MLH1 /
  MSH2 / MSH6 / PMS2 / EPCAM pathogenic variant already identified in
  the first-degree relative. Site-specific testing offers (a) highest
  positive predictive value for the family variant, (b) minimal VUS
  rate (the variant is already classified), (c) lowest cost
  (~$200-500 USD vs $1500-3000 for multi-gene panel), (d) fastest
  turnaround (~2 weeks vs 3-6 weeks). Multi-gene panel expansion is
  reserved for the rare case where (i) site-specific is negative and
  the patient has phenotypic features inconsistent with the family
  variant alone, (ii) the family variant is reclassified to VUS
  during the cascade workup, or (iii) the patient's family branch
  shows mixed-syndrome phenotype suggesting a co-segregating second
  variant.

  **(3) Cascade-positive sequel pathway:** Positive carrier → routes
  to RF-LYNCH-CONFIRMED-CARRIER and IND-LYNCH-CARRIER-SURVEILLANCE /
  IND-LYNCH-CARRIER-INTENSIFIED. Negative result (familial variant
  not present) → general-population CRC screening cadence (USPSTF
  colonoscopy q10y from age 45-50 or earlier per first-degree-cancer
  family history adjustment). VUS result on site-specific testing is
  unusual when the family variant is already pathogenic / likely-
  pathogenic; if observed, repeat testing in a second lab and
  reclassification workup.

  **Cost / access:** in Ukraine, site-specific cascade testing for a
  known familial variant is available through private labs at
  ~3000-6000 UAH (vs 5000-15000 UAH for full multi-gene panel) —
  cascade-testing pricing benefits from the prior variant
  classification work.

rationale_ua: >
  Стандартний-трек cascade-testing шлях для родичів першого ступеня
  підтверджених носіїв Lynch (MMR / EPCAM). Три паралельні
  направлення:

  **(1) Pre-test генетичне консультування.** Охоплює:
  аутосомно-домінантне успадкування, **50% апріорна ймовірність**
  носійства того ж патогенного варіанту, що й FDR (один батьківський
  гетерозиготний → шанс 1/2 на дитину), пенетрантність за генами
  (MLH1 / MSH2 високa — КРР ~70-80%, ендометрій ~40-60%;
  MSH6 / PMS2 нижча; EPCAM 3' делеції — MSH2-подібний профіль),
  наслідки для власних дітей пацієнта (cascade тестування
  продовжується через покоління), страхові / GINA міркування,
  психологічні аспекти. За ACMG / ASCO cascade-testing настановами
  pre-test консультування — standard of care перед germline
  тестуванням.

  **(2) Cascade germline тестування.** Site-specific
  (сімейний-варіант) тестування — first-line опція — закріплене на
  специфічному патогенному варіанті MLH1 / MSH2 / MSH6 / PMS2 / EPCAM,
  вже ідентифікованому у родича першого ступеня. Site-specific
  тестування забезпечує (а) найвищу positive predictive value для
  сімейного варіанту, (б) мінімальну VUS-частоту (варіант вже
  класифікований), (в) найнижчу вартість (~$200-500 USD проти
  $1500-3000 для multi-gene panel), (г) найшвидший turnaround
  (~2 тижні проти 3-6 тижнів). Multi-gene panel розширення —
  резерв для рідкісних випадків.

  **(3) Sequel шлях при позитивному cascade:** Позитивний носій →
  routes до RF-LYNCH-CONFIRMED-CARRIER та
  IND-LYNCH-CARRIER-SURVEILLANCE / IND-LYNCH-CARRIER-INTENSIFIED.
  Негативний результат (сімейний варіант відсутній) →
  general-population CRC screening cadence.

  **Вартість / доступ:** в Україні site-specific cascade тестування
  доступне через приватні лабораторії при ~3000-6000 UAH (проти
  5000-15000 UAH для full multi-gene panel).

