do_not_do:
  - "Не презентувати empirical VHL surveillance як еквівалент genetic confirmation — 50% пацієнтів — non-carriers, які могли б бути звільнені від decades of intensive multi-specialty surveillance."
  - "Не пропускати pediatric ophthalmology у дітей VHL-positive FDR — retinal hemangioblastomas можуть початися дуже рано; vision loss irreversible."
  - "Не використовувати whole-body radiation surveillance — VHL carriers (potential і confirmed) чутливі до radiation-induced secondary malignancies; MRI preferred."
  - "Не делегувати VHL surveillance non-specialist — multi-organ coordination потребує VHL-experienced center, навіть pre-cascade."
  - "Не пропускати periodic re-discussion про cascade testing — VHL surveillance burden substantial; many families initially decline pediatric testing але accept later."

do_not_do_en:
  - "Do not present empirical VHL surveillance as equivalent to genetic confirmation — 50% of patients are non-carriers who could be released from decades of intensive multi-specialty surveillance."
  - "Do not skip pediatric ophthalmology in children of VHL-positive FDRs — retinal hemangioblastomas can begin very early; vision loss is irreversible."
  - "Do not use whole-body radiation surveillance — VHL carriers (potential and confirmed) are sensitive to radiation-induced secondary malignancies; MRI is preferred."
  - "Do not delegate VHL surveillance to non-specialists — multi-organ coordination requires a VHL-experienced center, even pre-cascade."
  - "Do not skip periodic re-discussion of cascade testing — VHL surveillance burden is substantial; many families initially decline pediatric testing but accept later."

