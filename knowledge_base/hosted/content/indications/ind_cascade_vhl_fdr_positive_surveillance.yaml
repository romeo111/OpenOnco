rationale: >
  Alternative-track companion to IND-CASCADE-VHL-FDR-POSITIVE-TESTING.
  Applied when a first-degree relative of a confirmed VHL carrier
  declines cascade germline testing — for any reason (cost,
  insurance, parental decision against pediatric germline testing,
  family privacy, geographic access) — and is offered empirical
  multi-organ surveillance per the VHL Alliance Active Surveillance
  Guidelines applied as if VHL were confirmed. The **50% prior
  probability** of carrier status combined with the time-critical
  childhood-onset surveillance dependency makes the surveillance
  benefit substantial in actual carriers, but patient (and parental)
  autonomy (CHARTER §11) governs the choice.

  **Empirical VHL surveillance schedule:**

  **Ophthalmology q1y from age 1-5** — retinal hemangioblastomas;
  laser photocoagulation / cryotherapy preserves vision when caught
  early. Empirically applied given the 50% prior — retinal lesions
  can manifest in early childhood and vision loss is irreversible.

  **Catecholamines / metanephrines q1y from age 5-10** —
  pheochromocytoma screening. Applied empirically; if elevated →
  MRI adrenals + 24h urine + plasma free metanephrines + endocrinology
  referral.

  **MRI abdomen (kidneys + adrenals + pancreas) q1-2y from age 15** —
  RCC + pheochromocytoma + pancreatic NET / serous cystadenoma.
  Applied empirically; nephron-sparing surgery (partial nephrectomy)
  if any lesion ≥3cm.

  **MRI brain + spine q1y from age 15-16** — CNS hemangioblastoma;
  resection before symptomatic cord compression / hydrocephalus.
  Applied empirically; non-ionizing imaging is appropriate at any
  prior probability.

  **Audiology q2-3y** — endolymphatic sac tumor surveillance.

  **No whole-body radiation surveillance** — VHL surveillance is
  MRI-anchored; CT and ionizing studies are minimized. This holds
  empirically because (a) non-ionizing imaging is the standard
  regardless of carrier status, and (b) any potential carrier should
  not accumulate ionizing diagnostic exposure unnecessarily.

  **Periodic re-discussion of cascade testing** is essential at every
  visit. The VHL surveillance burden is substantial (multi-specialty
  coordination, frequent clinic visits, pediatric dilated eye exams,
  childhood blood draws). Many families initially decline pediatric
  cascade testing but accept it later as the surveillance burden
  motivates desire for certainty — or accept it for subsequent
  children if the older sibling's surveillance experience is
  burdensome.

  Routing reconsiderations: if patient eventually accepts cascade
  testing, results route to (a) confirmed-VHL pathway via
  RF-VHL-CONFIRMED-CARRIER, or (b) general-population pathway —
  immediately releasing a child from the surveillance schedule if
  the familial variant is absent.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до
  IND-CASCADE-VHL-FDR-POSITIVE-TESTING. Застосовується коли родич
  першого ступеня підтвердженого VHL-носія відмовляється від
  cascade germline тестування — з будь-якої причини (вартість,
  страхування, parental decision проти педіатричного germline
  тестування, сімейна приватність) — і отримує empіричне
  multi-organ surveillance per VHL Alliance Active Surveillance
  Guidelines, як якщо б VHL був підтверджений. **50% апріорна
  ймовірність** + childhood-onset surveillance dependency роблять
  surveillance benefit substantial у фактичних carriers.

  **Empirical VHL surveillance schedule:**

  **Ophthalmology q1y з 1-5 років** — retinal hemangioblastomas;
  laser photocoagulation / cryotherapy зберігає зір.

  **Catecholamines / metanephrines q1y з 5-10 років** —
  pheochromocytoma screening.

  **MRI abdomen q1-2y з 15 років** — RCC + pheochromocytoma +
  pancreatic NET / serous cystadenoma.

  **MRI brain + spine q1y з 15-16 років** — CNS hemangioblastoma;
  non-ionizing imaging доречне при будь-якому prior probability.

  **Audiology q2-3y** — endolymphatic sac tumor.

  **No whole-body radiation surveillance** — VHL surveillance
  MRI-anchored; CT мінімізується.

  **Periodic re-discussion** cascade тестування essential на кожному
  візиті. Many families initially decline pediatric тестування але
  приймають later. Per CHARTER §11 framing parental + patient
  автономії.

