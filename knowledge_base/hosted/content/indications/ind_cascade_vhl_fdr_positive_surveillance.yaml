expected_outcomes:
  overall_response_rate: >-
    Empirical multi-organ VHL surveillance applied to a first-degree
    relative of a confirmed VHL carrier — without genetic confirmation
    — captures early-stage tumor in the **50% of patients who are
    actual carriers** (autosomal-dominant prior probability), but
    subjects the **other 50%** (non-carriers) to decades of intensive
    surveillance they could have safely declined had cascade testing
    been completed. The cost-benefit is more equivocal than for
    cascade testing pathways without childhood-onset surveillance —
    empirical pediatric ophthalmology + catecholamine surveillance is
    burdensome (clinic visits, blood draws, dilated eye exams in
    toddlers) and the 50% probability of being a non-carrier
    represents substantial preventable burden.

