rationale: >
  Standard-track cascade-testing pathway for first-degree relatives of
  confirmed VHL carriers. The childhood-onset surveillance dependency
  makes this one of the few cascade scenarios where pediatric
  germline testing is the standard of care. Four parallel referrals:

  **(1) Pediatric-aware pre-test genetic counseling.** Covers:
  autosomal-dominant inheritance, **50% prior probability** of
  carrying the same pathogenic variant as the FDR (one parent
  heterozygous → 1/2 chance per child), childhood-onset surveillance
  dependency (ophthalmology age 1-5, catecholamines age 5-10, brain/
  spine + abdominal MRI from age 15-16), lifetime multi-organ tumor
  risk (CNS hemangioblastoma ~60-80%, RCC ~25-45%, pheochromocytoma
  ~10-20%, retinal hemangioblastoma ~25-60%, pancreatic NET / serous
  cystadenoma ~10-15%, endolymphatic sac tumor ~10%), implications
  for the patient's own children. For **pediatric cascade testing**,
  counseling addresses parental decision-making, developmentally-
  appropriate assent (typically formal assent from age 7+, informed
  consent from age 18), and the positive-result emotional support
  pathway. VHL is one of the few syndromes where pediatric germline
  testing in children too young for autonomous consent is the
  standard of care — because surveillance and intervention
  fundamentally depend on early genotype knowledge.

  **(2) Cascade germline testing from age 1.** Site-specific
  (familial-variant) testing is the first-line option — anchored on
  the specific VHL pathogenic variant already identified in the
  first-degree relative. Site-specific testing offers (a) highest
  positive predictive value, (b) minimal VUS rate (the variant is
  already classified), (c) lowest cost, (d) fastest turnaround.
  **Testing from age 1** is the consensus standard given the
  ophthalmology surveillance start at age 1-5. Multi-gene panel
  expansion is reasonable when (i) site-specific is negative and
  family phenotype is broader than the relative's single variant
  explains, or (ii) **de novo VHL variants occur in ~20% of
  probands** — multi-gene panel expansion is also reasonable when
  family history is sparse.

  **(3) Cascade-positive sequel pathway:** Positive carrier → routes
  to RF-VHL-CONFIRMED-CARRIER and IND-VHL-CARRIER-SURVEILLANCE.
  Surveillance schedule: ophthalmology q1y from age 1-5; catecholamines /
  metanephrines q1y from age 5-10; MRI abdomen (kidneys + adrenals +
  pancreas) q1-2y from age 15; MRI brain + spine q1y from age 15-16;
  audiology q2-3y; comprehensive multi-organ care via a VHL-
  experienced center. Negative result (familial variant not present)
  → general-population pathway with no VHL-specific surveillance
  burden.

  **(4) Pediatric-specific routing.** A child of a TP53-positive
  FDR who tests negative on cascade is released from the entire
  VHL surveillance schedule — eliminating decades of unnecessary
  imaging and clinic visits. This is a significant patient-
  experience benefit unique to genetic confirmation.

  **Cost / access:** in Ukraine, VHL site-specific cascade testing
  for a known familial variant is available through private labs at
  ~3000-6000 UAH.

rationale_ua: >
  Стандартний-трек cascade-testing шлях для родичів першого ступеня
  підтверджених носіїв VHL. Childhood-onset surveillance dependency
  робить це одним з небагатьох cascade сценаріїв де педіатричне
  germline тестування є standard of care. Чотири паралельні
  направлення:

  **(1) Pediatric-aware pre-test генетичне консультування.** Охоплює:
  аутосомно-домінантне успадкування, **50% апріорна ймовірність**,
  childhood-onset surveillance dependency (ophthalmology 1-5;
  catecholamines 5-10; brain/spine + abdominal MRI 15-16), lifetime
  multi-organ tumor risk (CNS hemangioblastoma ~60-80%, RCC ~25-45%,
  pheochromocytoma ~10-20%, retinal hemangioblastoma ~25-60%). Для
  **педіатричного cascade тестування**, консультування адресує
  parental decision-making, developmentally-appropriate assent
  (typically formal assent з age 7+, informed consent з age 18).
  VHL — один з небагатьох syndromes де педіатричне germline
  тестування в дітей занадто young для autonomous consent є
  standard of care.

  **(2) Cascade germline тестування з 1 року.** Site-specific
  (сімейний-варіант) тестування — first-line опція. **Тестування з
  1 року** — консенсус стандарт з огляду на ophthalmology
  surveillance start у 1-5 років. De novo VHL variants occur in
  ~20% — multi-gene panel розширення доречне при sparse family
  history.

  **(3) Sequel шлях при позитивному cascade:** Позитивний носій →
  routes до RF-VHL-CONFIRMED-CARRIER та IND-VHL-CARRIER-SURVEILLANCE.

  **(4) Pediatric-specific routing.** Дитина VHL-positive FDR, що
  тестує negative, звільняється від всього VHL surveillance schedule
  — eliminating decades of unnecessary imaging.

  **Вартість / доступ:** в Україні VHL site-specific cascade
  тестування доступне через приватні лабораторії при ~3000-6000 UAH.

