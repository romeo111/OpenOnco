    position: supports
    relevant_quote_paraphrase: >-
      "Cascade testing of first-degree relatives is recommended whenever
      a pathogenic / likely-pathogenic VHL variant is identified.
      Pediatric testing from age 1 is the consensus standard given the
      childhood-onset ophthalmology surveillance requirement."
  - source_id: SRC-ASCO-ACMG-LYNCH-2014
    position: supports
    relevant_quote_paraphrase: >-
      "ACMG / ASCO recommend cascade testing of first-degree relatives
      whenever a pathogenic / likely-pathogenic variant is identified;
      pediatric testing is appropriate when surveillance / intervention
      begins in childhood (VHL is the canonical example)."

do_not_do:
  - "Не defer pediatric cascade тестування у VHL до 18 років — childhood-onset surveillance (ophthalmology 1-5, catecholamines 5-10) fundamentally depends on early genotype knowledge."
  - "Не починати з full multi-gene panel при відомому сімейному VHL варіанті — site-specific тестування first-line. Виключення: de novo VHL variants (~20%) або sparse family history."
  - "Не пропускати інтенсивне pediatric counseling — parental decision-making + developmentally-appropriate assent (typically formal assent з 7+) — особливі етичні міркування."
  - "Не презентувати negative site-specific результат у дитини як зайвий — це звільняє від decades of unnecessary surveillance (significant patient-experience benefit)."
  - "Не делегувати VHL cascade follow-up non-specialist — multi-organ coordination potrebує VHL-experienced center; positive cascade результат вимагає coordination з pediatric oncology, ophthalmology, endocrinology."

do_not_do_en:
  - "Do not defer pediatric cascade testing in VHL until age 18 — childhood-onset surveillance (ophthalmology 1-5, catecholamines 5-10) fundamentally depends on early genotype knowledge."
  - "Do not start with a full multi-gene panel when the familial VHL variant is known — site-specific testing is first-line. Exception: de novo VHL variants (~20%) or sparse family history."
  - "Do not skip intensive pediatric counseling — parental decision-making and developmentally-appropriate assent (typically formal assent from age 7+) are special ethical considerations."
  - "Do not present a negative site-specific result in a child as trivial — it releases the child from decades of unnecessary surveillance (a significant patient-experience benefit)."
  - "Do not delegate VHL cascade follow-up to non-specialists — multi-organ coordination requires a VHL-experienced center; a positive cascade result requires coordination with pediatric oncology, ophthalmology, and endocrinology."

