expected_outcomes:
  overall_response_rate: >-
    **50% prior probability** of carrier status in first-degree
    relatives of confirmed VHL carriers (autosomal-dominant
    inheritance). Site-specific (familial-variant) testing has
    near-100% analytic sensitivity for the family variant.
    **Cascade testing from age 1** enables childhood-onset
    surveillance (ophthalmology age 1-5, catecholamines age 5-10) —
    early detection of retinal hemangioblastoma (preserving vision
    via laser photocoagulation / cryotherapy) and pheochromocytoma
    (preventing hypertensive crisis) are the highest-yield pediatric
    interventions. RCC mortality benefit from annual abdominal MRI
    starting age 15 in confirmed carriers is well-established (organ-
    sparing nephron-sparing surgery for lesions ≥3cm preserves renal
    function while removing tumor before metastasis).

