desired_tests: []

rationale: >
  Aggressive-track (CAPS-declined) alternative for CDKN2A carriers.

  Components:
    - Annual full-body skin examination retained.
    - Mapping photography retained.
    - Symptom-driven pancreatic workup only.
    - Smoking cessation counseling retained.
    - Cascade testing retained.
    - Re-offer CAPS pancreatic surveillance annually.

