expected_outcomes:
  overall_response_rate: >-
    Less-intensive (annual skin) without pancreatic CAPS pathway.
    Accepts higher residual PDAC risk. Acceptable when EUS/MRI access
    constrained or patient declines pancreatic surveillance.

hard_contraindications: []
