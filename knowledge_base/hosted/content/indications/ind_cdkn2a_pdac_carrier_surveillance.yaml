rationale: >
  Standard-track prevention pathway for CDKN2A-specific carriers
  (gene-specific RF distinct from broader FAMMM phenotype).

  Components — PANCREATIC:
    - **CAPS Consortium 2018/2020 surveillance:** alternating EUS +
      abdominal MRI/MRCP every 12 months from age 40 OR 10 years
      before earliest PDAC in family (whichever earlier).
    - **High-volume pancreatic surveillance center** preferred —
      lesion characterization + biopsy decisions require multi-
      disciplinary expertise (gastroenterology + pancreatic surgery
      + radiology + oncology).
    - **Suspicious lesion → multidisciplinary tumor board** — not all
      suspicious lesions warrant resection (BD-IPMN, low-grade PanIN
      may be observed); EUS-guided FNA biopsy for cytology when
      indicated.
    - **Smoking cessation** — synergistic with CDKN2A for PDAC risk.

  Components — MELANOMA:
    - **Annual full-body skin examination + dermoscopy from age 10-12.**
    - **Mapping photography** for multiple atypical moles (≥50 nevi,
      ≥3 atypical) — comparison detects new/changing lesions.
    - **Patient self-examination** monthly + photographic comparison.
    - **Sun protection** lifelong — UPF50+ clothing, broad-spectrum
      sunscreen, avoid peak UV hours, no tanning beds.
    - **Threshold for excisional biopsy:** any lesion meeting ABCDE
      criteria or showing dermoscopy changes vs prior photograph.

  Components — NEUROLOGIC (rare CDKN2A spectrum):
    - **Symptom-driven brain MRI** — pleomorphic glial brain tumor
      signal small but reported; routine brain imaging not indicated.

  Components — CASCADE + REPRODUCTIVE:
    - **Cascade testing of FDRs** — 50% inheritance; cascade
      especially impactful for younger relatives (PDAC peaks 50-70 in
      CDKN2A; early surveillance + cessation lifestyle changes).
    - **Reproductive counseling:** PGT-M available.

  In Ukraine, CDKN2A panel testing via Institute of Genetics; CAPS-
  pattern pancreatic surveillance at hepato-pancreato-biliary centers
  in Kyiv, Lviv, Kharkiv. Dermatology + dermoscopy widely accessible.

rationale_ua: >
  Стандартний-трек prevention шлях для CDKN2A-specific carriers
  (gene-specific RF).

  Компоненти — PANCREATIC:
    - **CAPS Consortium 2018/2020 surveillance:** alternating EUS +
      abdominal MRI/MRCP кожні 12 міс з 40 років АБО 10 років до
      earliest PDAC у family.
    - **High-volume pancreatic surveillance center** preferred.
    - **Suspicious lesion → multidisciplinary tumor board.**
    - **Smoking cessation** — synergistic з CDKN2A для PDAC ризику.

  Компоненти — MELANOMA:
    - **Annual full-body skin examination + dermoscopy з 10-12 років.**
    - **Mapping photography** для multiple atypical moles.
    - **Patient self-examination** monthly + photographic comparison.
    - **Sun protection** lifelong.
    - **Excisional biopsy threshold:** any lesion ABCDE criteria.

  Компоненти — NEUROLOGIC (rare):
    - **Symptom-driven brain MRI.**

  Компоненти — CASCADE + REPRODUCTIVE:
    - **Cascade testing FDRs.**
    - **Reproductive counseling:** PGT-M available.

