do_not_do:
  - "Не рекомендувати інтенсифіковану-трек cadence без явного shared-decision-making — пацієнт-burden (часті clinic visits, повторні sedation для BMA, anxiety) значущий і має бути зважений проти marginal-benefit над стандартним треком."
  - "Не виконувати запланованої BMA без супутнього myeloid NGS panel — somatic-second-hit at low VAF може бути пропущений без NGS, що руйнує сенс intensified-track surveillance."
  - "Не пропускати pre-emptive germline-screening кандидат-сиблінг-донорів — sibling-carrier донор не може використовуватись, але без pre-screening цей факт виявиться лише при mobilization."

do_not_do_en:
  - "Do not recommend the intensified-track cadence without explicit shared-decision-making — the patient burden (frequent clinic visits, repeat sedation for BMA, anxiety) is meaningful and must be weighed against the marginal benefit over the standard track."
  - "Do not perform scheduled BMA without companion myeloid NGS — somatic-second-hit at low VAF can be missed without NGS, which defeats the purpose of intensified-track surveillance."
  - "Do not skip pre-emptive germline-screening of candidate sibling donors — a sibling-carrier donor cannot be used, but without pre-screening this fact emerges only at mobilization, costing critical time."

