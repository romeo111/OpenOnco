id: IND-CEBPA-CARRIER-INTENSIFIED
plan_track: aggressive
intent: surveillance

applicable_to:
  disease_id: DIS-AML
  stage_requirements: []
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 3

triggered_by_redflags:
  - RF-CEBPA-CONFIRMED-CARRIER

recommended_regimen: null
concurrent_therapy: []
followed_by: []

evidence_level: moderate
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Intensified-track surveillance of a confirmed CEBPA carrier (q3
    month CBC + smear, scheduled BMA + NGS every 2-3 years from age
    20, preemptive HLA + donor germline mapping) is justified by the
    high lifetime penetrance (~80-100%) of incident AML in classic
    biallelic-pattern pedigrees and the documented mortality benefit
    of carrier-aware planned induction over emergency presentation.
    The aggressive cadence trades off against patient-burden (clinic
    visits, repeat sedation for BMA, anxiety) and is shared-decision-
    making with the carrier per CHARTER §11; the standard track
    (q6-month CBC + provoked-BMA) remains an evidence-based
    alternative.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests:
  - TEST-PERIPHERAL-SMEAR
  - TEST-BM-ASPIRATE
  - TEST-NGS-MYELOID-PANEL

rationale: >
  Alternative-track companion to IND-CEBPA-CARRIER-SURVEILLANCE.
  Intensified cadence reflects the near-complete lifetime penetrance
  of incident AML in CEBPA carriers and explicit pre-emptive transplant-
  team engagement.

  **CBC + peripheral smear q3 months from carrier confirmation,
  lifelong:** Double the standard-track cadence. Justified by the
  documented median age at AML in family-known carriers being in the
  mid-twenties and the desire to detect pre-AML clonal evolution
  (persistent dysplastic features, emerging cytopenia) before frank
  diagnosis.

  **Scheduled BMA + cytogenetics + myeloid NGS every 2-3 years from
  age 20+:** Provoked BMA (any unexplained CBC change) remains the
  primary trigger, but scheduled BMA at carrier-aware milestones
  (every 2-3 years from age 20) is added in this track. The myeloid
  NGS panel must include CEBPA C-terminal / bZIP coverage so that
  emerging somatic-second-hit clones are detected at low burden.

  **Preemptive HLA typing of the candidate sibling-donor cohort +
  germline-testing of all candidate donors:** Performed BEFORE any
  AML diagnosis so that donor identification is not delayed at
  diagnosis. Every candidate sibling donor must be germline-tested
  for CEBPA before being designated; CEBPA-carrier siblings are
  excluded from donor candidacy (donor-derived AML documented in
  CEBPA families).

  **Pre-emptive consultation with a hereditary-myeloid-program
  transplant team:** Establishes the care relationship so that at
  AML diagnosis, time-to-induction and time-to-alloHCT can be
  optimized. The hereditary-myeloid program at a tertiary academic
  center is the preferred care setting for confirmed-carrier patients
  with confirmed AML emergence.

  Per CHARTER §11 patient-autonomy framing: the intensified cadence
  carries higher procedural burden and is appropriate only where the
  carrier prefers the higher-intensity option after shared-decision-
  making. The standard track remains an evidence-based alternative.

rationale_ua: >
  Альтернативно-трекова Indication, sibling до IND-CEBPA-CARRIER-
  SURVEILLANCE. Інтенсифікована cadence відображає майже-повну довічну
  пенетрантність incident ГМЛ у CEBPA-носіїв і явне pre-emptive
  залучення transplant-team.

  **ЗАК + периферичний мазок q3 місяці від підтвердження носійства,
  життєво:** Подвійна стандартно-трекова cadence. Виправдана
  задокументованою медіаною віку ГМЛ у family-known носіїв у середині
  двадцяти і бажанням виявити pre-ГМЛ клональну еволюцію (персистуючі
  диспластичні риси, emerging цитопенія) до франкного діагнозу.

  **Запланована BMA + цитогенетика + myeloid NGS кожні 2-3 роки з 20+
  років:** Provoked BMA (будь-яка нез'ясована зміна ЗАК) залишається
  первинним тригером, але запланована BMA на carrier-aware milestones
  (кожні 2-3 роки з 20 років) додана в цьому треку. Myeloid NGS panel
  має включати CEBPA C-кінцеве / bZIP покриття, щоб emerging somatic-
  second-hit clones були виявлені при low burden.

  **Pre-emptive HLA-типування кандидат-сиблінг-донор-cohort +
  germline-тестування всіх кандидат-донорів:** Виконується ДО будь-
  якого діагнозу ГМЛ, щоб ідентифікація донора не була відкладена при
  діагностиці. Кожен кандидат-сиблінг-донор має бути germline-
  тестований на CEBPA перед призначенням; CEBPA-носії-сиблінги
  виключаються з donor-candidacy.

  **Pre-emptive консультація з hereditary-myeloid-program transplant-
  team:** Встановлює care-relationship так, що при діагностиці ГМЛ
  time-to-induction і time-to-alloHCT можуть бути оптимізовані.
  Hereditary-myeloid program у tertiary academic center —
  preferred care setting для підтверджених-носіїв з підтвердженою
  emergence ГМЛ.

  Per CHARTER §11 framing автономії пацієнта: інтенсифікована cadence
  несе вищий процедурний burden і доречна лише там, де носій надає
  перевагу higher-intensity опції після shared-decision-making.

