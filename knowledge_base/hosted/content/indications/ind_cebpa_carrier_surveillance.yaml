sources:
  - source_id: SRC-NCCN-AML-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Familial AML with germline CEBPA mutations confers high lifetime
      AML penetrance and warrants lifelong CBC + smear surveillance,
      cascade germline testing (with caveat of blood-contamination by
      somatic second-hit), and donor-germline-screening before
      transplant from any sibling candidate."
  - source_id: SRC-ELN-AML-2022
    position: supports
    relevant_quote_paraphrase: >-
      "Biallelic CEBPA in AML is favorable-risk; germline status must
      be ascertained on non-hematopoietic tissue. Carrier status
      influences donor selection and post-transplant monitoring."

do_not_do:
  - "Не використовувати лише blood-based germline тестування для підтвердження CEBPA carrier-статусу — somatic second-hit clone у крові контамінує assay; необхідне buccal / fibroblast / cultured-skin testing."
  - "Не пропускати donor-germline-screening перед HSC mobilization у CEBPA родини — donor-derived ГМЛ задокументоване; кандидат-сиблінг має бути germline-протестований першим."
  - "Не відкладати BMA при будь-якому unexplained цитопенії або persistent blast на смазку у підтвердженого CEBPA-носія — pre-test probability incident myeloid neoplasm значно вища ніж у general population."

do_not_do_en:
  - "Do not rely on blood-only germline testing to confirm CEBPA carrier status — somatic second-hit clones in blood can contaminate the assay; buccal / fibroblast / cultured-skin testing is required."
  - "Do not skip donor-germline-screening before HSC mobilization in a CEBPA family — donor-derived AML is documented; candidate sibling donors must be germline-tested first."
  - "Do not defer BMA on any unexplained cytopenia or persistent blast on smear in a confirmed CEBPA carrier — the pre-test probability of incident myeloid neoplasm is substantially higher than in the general population."

