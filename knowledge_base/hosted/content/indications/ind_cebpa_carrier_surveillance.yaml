expected_outcomes:
  overall_response_rate: >-
    Germline CEBPA carrier surveillance enables earlier detection of
    incident AML — the Tawana 2015 cohort (Blood) showed median age at
    AML in family-known carriers ~25 years, with cumulative incidence
    ~80% by age 50 in classic biallelic-pattern pedigrees. Pre-AML
    detection of cytopenia or persistent blast on smear shortens time-
    to-diagnosis and enables a planned induction in a carrier-aware
    transplant-team setting, rather than emergency presentation.
    Donor-screening protocols (cascade-tested + germline-confirmed
    sibling candidates) reduce the rare-but-documented risk of
    donor-derived AML in CEBPA / RUNX1 / DDX41 kindreds.

