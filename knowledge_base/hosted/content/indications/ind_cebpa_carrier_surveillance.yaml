rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with a documented germline CEBPA pathogenic variant. The protocol
  below assumes the genetic-test question is already settled (germline-
  testing on buccal / fibroblast / cultured-skin tissue, not blood-only).

  **CBC + peripheral smear q3-6 months, lifelong:** Cytopenia (any
  lineage), persistent immature myeloid forms, or unexplained
  leukocytosis are clinical-change thresholds that prompt BMA + myeloid
  NGS panel + cytogenetics. CEBPA-driven AML typically emerges in the
  twenties or thirties — surveillance must begin from carrier
  confirmation and continue lifelong, even if early years are
  uneventful.

  **BMA + cytogenetics + myeloid NGS at any suspicious change:**
  Lowered BMA threshold compared with sporadic-AML pre-diagnostic
  evaluation — the pre-test probability of incident myeloid neoplasm
  is high enough that BMA is justified by any unexplained CBC
  abnormality. Myeloid NGS panel must include CEBPA C-terminal /
  bZIP coverage so that the somatic-second-hit pattern (in-frame indel
  acquired in cis with the germline N-terminal allele) is captured if
  present in low-burden disease.

  **Cascade germline testing for first-degree relatives:** Documented
  buccal / fibroblast / cultured-skin germline confirmation required
  — NOT blood-only. The somatic CEBPA second hit can contaminate
  blood-based germline assay and obscure germline status; this is a
  well-recognized pitfall in CEBPA / RUNX1 / DDX41 family-screening
  programs and must be communicated to genetic-counseling teams.

  **Donor-screening protocol:** Any candidate sibling donor must be
  germline-tested before HSC mobilization. CEBPA-carrier siblings
  must not donate to affected sibling (donor-derived AML documented
  in CEBPA, RUNX1, DDX41 syndromes). HLA-typing of the candidate
  donor cohort early in the surveillance phase enables timely
  donor identification at AML diagnosis.

  **Treatment-time implications recorded but not actioned here:** When
  AML emerges in a CEBPA carrier, standard 7+3 induction applies;
  biallelic CEBPA in tumor (germline + somatic-second-hit) is a
  favorable-cytogenetic-equivalent prognostic category per ELN 2022;
  alloHCT in CR1 is individualized by co-occurring mutations + MRD
  trajectory + donor germline-status.

  Per CHARTER §11 patient-autonomy framing: surveillance cadence,
  threshold for BMA, and donor-screening sequencing are all shared-
  decision-making with the patient and the carrier-aware center.

rationale_ua: >
  Стандартний-трек шлях спостереження підтверджених носіїв для осіб з
  задокументованим гермінативним патогенним варіантом CEBPA. Протокол
  нижче передбачає, що питання генетичного тестування вже вирішене
  (germline-тестування на buccal / fibroblast / cultured-skin тканині,
  не лише на крові).

  **ЗАК + периферичний мазок q3-6 місяців, життєво:** Цитопенія (будь-
  яка лінія), персистуючі незрілі мієлоїдні форми, або нез'ясований
  лейкоцитоз — порогові клінічно-зміни, що ініціюють BMA + myeloid
  NGS panel + цитогенетику. CEBPA-driven ГМЛ типово виникає у 20-30
  роках — спостереження має починатися від підтвердження носійства і
  тривати життєво, навіть якщо ранні роки безсимптомні.

  **BMA + цитогенетика + myeloid NGS при будь-якій підозрілій зміні:**
  Знижений поріг BMA порівняно зі sporadic-ГМЛ pre-diagnostic оцінкою
  — pre-test probability incident myeloid neoplasm достатньо висока,
  щоб BMA був виправданий будь-якою нез'ясованою аномалією ЗАК.
  Myeloid NGS panel має включати CEBPA C-кінцеве / bZIP покриття,
  щоб somatic-second-hit pattern (in-frame indel набутий в cis з
  germline N-кінцевим алелем) був захоплений при low-burden
  захворюванні.

  **Cascade germline тестування для родичів першого ступеня:**
  Задокументоване buccal / fibroblast / cultured-skin germline
  підтвердження потрібне — НЕ лише на крові. Соматичний CEBPA second
  hit може контамінувати blood-based germline assay і затушовувати
  germline-статус; це well-recognized pitfall у CEBPA / RUNX1 / DDX41
  family-screening програмах.

  **Donor-screening протокол:** Будь-який кандидат-сиблінг-донор має
  бути germline-тестований перед HSC mobilization. CEBPA-носії
  сиблінги НЕ можуть донорити ураженому сиблінгу (donor-derived ГМЛ
  задокументоване у CEBPA, RUNX1, DDX41 синдромах). HLA-типування
  кандидат-донор-cohort рано в surveillance-фазі дозволяє вчасну
  ідентифікацію донора при діагностиці ГМЛ.

  **Treatment-time implications записані але не виконуються тут:**
  Коли ГМЛ виникає у CEBPA-носія, стандартна 7+3 індукція
  застосовується; біалельний CEBPA в пухлині — favorable-cytogenetic-
  equivalent prognostic category per ELN 2022; alloHCT у CR1 —
  індивідуалізований за co-occurring мутаціями + МЗХ-trajectory +
  germline-статусом донора.

  Per CHARTER §11 framing автономії пацієнта.

