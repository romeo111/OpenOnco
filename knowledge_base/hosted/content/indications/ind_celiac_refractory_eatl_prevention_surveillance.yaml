do_not_do:
  - "Не пропускати періодичний моніторинг клональності внутрішньоепітеліальних лімфоцитів (IEL) при RCD2 — клональна еволюція передує розвитку EATL."
  - "Не розпочинати імуносупресивну терапію без консультації фахівця з целіакії."
  - "Не застосовувати ритуксимаб (rituximab) для лікування RCD2 — це Т-клітинне, а не В-клітинне захворювання."

do_not_do_en:
  - "Do not skip periodic IEL clonality monitoring in RCD2 — clonal evolution precedes EATL."
  - "Do not start immunosuppression without celiac-specialist consultation."
  - "Do not use rituximab for RCD2 — this is a T-cell disorder, not B-cell."

