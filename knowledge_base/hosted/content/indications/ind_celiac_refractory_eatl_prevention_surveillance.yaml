rationale: >
  Standard-track prevention pathway for refractory celiac disease, especially RCD2.
  Three components:

  **(1) Strict gluten-free diet adherence** — even refractory celiac requires
  continued strict GFD; some patients with apparent refractory disease have
  inadvertent gluten exposure. Dietitian + gluten contamination assessment.

  **(2) Small-bowel surveillance imaging** — video capsule endoscopy (VCE) or MR
  enterography q1-2 years for early EATL detection. Lesion characteristics:
  enterography wall-thickening, intussusception, ulcerative jejunitis on VCE.

  **(3) Immunosuppression discussion in RCD2** — cladribine, anti-TNF, or autologous
  hematopoietic stem cell transplant for RCD2 may delay EATL transformation. These
  are highly specialized interventions — referral to celiac-specialty center.

  Per AGA / BSG guidelines.

rationale_ua: >
  Стандартний шлях профілактики для пацієнтів з рефрактерною целіакією, особливо за
  наявності RCD2. Включає три компоненти:

  **(1) Суворе дотримання безглютенової дієти (GFD)** — навіть за рефрактерної целіакії
  потрібне продовження суворої GFD; у деяких пацієнтів з ознаками рефрактерності
  насправді має місце ненавмисне вживання глютену. Консультація дієтолога + оцінка на
  приховане надходження глютену.

  **(2) Візуалізаційний нагляд за тонкою кишкою** — відеокапсульна ендоскопія (VCE) або
  МР-ентерографія кожні 1–2 роки для раннього виявлення EATL. Характерні ознаки ураження:
  потовщення стінки кишки за даними ентерографії, інвагінація, виразковий єюніт за
  даними VCE.

  **(3) Обговорення імуносупресивної терапії при RCD2** — кладрибін, анти-TNF-терапія або
  аутологічна трансплантація гемопоетичних стовбурових клітин можуть уповільнити
  трансформацію в EATL при RCD2. Це високоспеціалізовані втручання — показано
  направлення до спеціалізованого центру з лікування целіакії.

  Відповідно до настанов AGA / BSG.

