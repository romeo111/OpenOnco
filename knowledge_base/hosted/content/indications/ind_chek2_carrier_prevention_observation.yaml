rationale: >
  Aggressive-track (general-population surveillance) alternative for
  CHEK2 carriers — particularly missense-variant carriers (p.Ile157Thr)
  with milder risk profile.

  Components:
    - **Breast surveillance:** USPSTF 2024 biennial mammography from
      age 40-50 with shared-decision-making.
    - **CRC screening:** USPSTF 2021 from age 45 with q10y colonoscopy
      or annual FIT.
    - **Prostate awareness:** general-population PSA discussion.
    - **Cascade testing retained** for FDRs.
    - **Re-offer intensified surveillance annually.**

