do_not_do:
  - "Не екстраполювати BRCA-style management до CHEK2 — penetrance істотно нижча; uniform RRM не виправдана."
  - "Не призначати рутинну thyroid US у CHEK2 carriers — signal modest, symptom-driven."
  - "Не пропускати cascade testing FDRs — ~50% будуть носіями + c.1100delC поширений."

do_not_do_en:
  - "Do not extrapolate BRCA-style management to CHEK2 — penetrance substantially lower; uniform RRM is not justified."
  - "Do not order routine thyroid US in CHEK2 carriers — signal modest, symptom-driven."
  - "Do not skip cascade testing of FDRs — ~50% will be carriers + c.1100delC is common."

known_controversies:
  - topic: "Variant-specific risk stratification (c.1100delC vs p.Ile157Thr)"
    positions:
      - position: "Apply higher-risk schedule to all CHEK2 pathogenic variants"
        rationale: "Variants pooled in clinical reporting; simpler implementation."
      - position: "Risk-stratify by variant class"
        rationale: "p.Ile157Thr confers smaller risk (RR ~1.5) vs c.1100delC (RR ~3); different surveillance intensity reasonable."
    our_default: "Apply standard pathway with variant-aware modifier (lighter for missense)."
    rationale: "Patient-specific risk discussion; counseling reflects variant specifics."

