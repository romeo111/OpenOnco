rationale: >
  Standard-track prevention pathway for CHEK2 heterozygous carriers per
  NCCN Genetic/Familial High-Risk Assessment Breast/Ovarian + CRC 2025.
  CHEK2 is the most-common moderate-penetrance breast gene in European-
  ancestry multi-gene panels.

  Components:
    - **Breast surveillance:**
      - Annual mammography from age 40 (or 5-10y before earliest
        family-breast-cancer diagnosis if family history present).
      - Annual breast MRI for c.1100delC + family history of multiple
        breast cancers OR dense breast tissue (NCCN moderate-elevated
        tier modifier).
      - Clinical breast examination semi-annually from age 25-30.
    - **CRC screening:**
      - Colonoscopy q5y from age 40 (vs general-population q10y from
        45) per NCCN CRC 2025 for CHEK2 c.1100delC + family history
        of CRC.
      - Routine colonoscopy from age 40 with q5y interval even without
        family history is acceptable in shared-decision-making.
    - **Prostate awareness (males with c.1100delC):**
      - PSA + DRE from age 40 with shared decision-making.
      - Earlier evaluation of any urinary symptoms.
    - **Thyroid awareness:** symptom-driven physical exam + neck
      ultrasound for palpable nodule; no routine US screening.
    - **Cascade testing:** FDRs offered testing for the family-
      specific CHEK2 variant.
    - **Reproductive counseling:** PGT-M discussion if reproductive-
      age + both partners panel-tested (both partners with truncating
      CHEK2 → biallelic-CHEK2 child has uncertain phenotype, not
      A-T-like).
    - **Chemoprevention discussion:** tamoxifen or raloxifene
      consideration for highest-risk subset; modest absolute benefit.
    - **Lifestyle:** standard cancer-prevention.

  In Ukraine, c.1100delC is the dominant variant among Slavic +
  Northern European populations; multi-gene panels include CHEK2 as
  standard. Breast MRI at academic centers; colonoscopy widely
  available; PSA testing accessible.

