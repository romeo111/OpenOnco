expected_outcomes:
  overall_response_rate: >-
    Empirical enhanced surveillance based on family history alone
    (annual mammography from earliest-family-breast-cancer-age minus
    10 years but no earlier than 30; colonoscopy q5y from age 40
    if breast-CRC cluster present; prostate PSA + DRE from age 45
    in males if high-grade prostate family history) is expected to
    capture cancer at earliest detectable stage in the subset who
    are actual CHEK2 carriers (~5-20% of pedigree-suspicion
    individuals). Does NOT carry the diagnostic certainty of
    germline testing — variant-specific risk-tier stratification is
    impossible without testing (c.1100delC vs missense have
    substantially different surveillance implications).

