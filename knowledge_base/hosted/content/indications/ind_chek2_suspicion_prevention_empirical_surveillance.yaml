do_not_do:
  - "Не презентувати enhanced surveillance як еквівалент genetic confirmation — variant-specific risk stratification неможлива emпірично."
  - "Не рекомендувати risk-reducing хірургію (мастектомія) emпірично — CHEK2 moderate-penetrance не виправдовує навіть у підтверджених носіїв."
  - "Не пропускати periodic re-discussion про genetic testing."
  - "Не призначати Lynch-level CRC surveillance (q1-2y колоноскопія) для CHEK2-suspicion patients — moderate-penetrance і q5y адекватно."
  - "Не пропускати male-line prostate розгляд при high-grade family history."

do_not_do_en:
  - "Do not present enhanced surveillance as equivalent to genetic confirmation — variant-specific risk stratification is impossible empirically."
  - "Do not recommend risk-reducing surgery (mastectomy) empirically — CHEK2 moderate-penetrance does not justify risk-reducing surgery even in confirmed carriers."
  - "Do not skip periodic re-discussion of genetic testing."
  - "Do not order Lynch-level CRC surveillance (q1-2y colonoscopy) for CHEK2-suspicion patients — moderate-penetrance and q5y is adequate."
  - "Do not skip male-line prostate consideration with high-grade family history."

