rationale: >
  Aggressive-track companion to IND-CHEK2-SUSPICION-PREVENTION-
  TESTING. Patient with pedigree suspicion of germline CHEK2 carrier
  state who declines genetic counseling and/or panel testing — for
  any reason (cost, insurance / GINA concerns, psychological /
  cancer-anxiety considerations, family privacy, geographic access
  constraints, religious or cultural objections to genetic testing)
  — is offered empirical enhanced surveillance based on family
  history alone (best-available proxy in the absence of genetic
  confirmation):

  **Breast (women):**
  - Annual mammography starting at age (earliest first-degree
    family breast cancer age) minus 10 years, but no earlier than
    age 30.
  - Annual breast MRI consideration if Tyrer-Cuzick lifetime risk
    ≥20% — CHEK2-suspicion pedigrees vary widely, often falling
    below this threshold given moderate-penetrance signal.
  - Clinical breast exam q6-12 months.
  - Patient-performed monthly self-exam encouraged.

  **Colorectal:** Pedigrees with breast-CRC cluster pattern receive
  empirical colonoscopy from age 40 with q5y interval — derived
  from NCCN CHEK2-carrier moderate-elevated CRC tier applied
  empirically. Single-CRC family history may receive standard
  q10y colonoscopy from age 45 per USPSTF.

  **Prostate awareness (males in pedigree):** PSA + DRE from age
  45-50 if family history of high-grade or metastatic prostate
  cancer (lower than population threshold). CHEK2 c.1100delC-
  associated prostate cancer is often high-grade — modest
  empirical-surveillance benefit.

  **Risk-reducing surgery:** NOT offered empirically without
  genetic confirmation. CHEK2 moderate-penetrance does not
  routinely justify risk-reducing mastectomy even in confirmed
  carriers — empirical risk-reducing surgery is clearly outside
  evidence base.

  **Reproductive counseling:** PGT-M not applicable empirically;
  CHEK2 biallelic mutations are extremely rare and the recessive
  phenotype is not well-characterized.

  Per CHARTER §11 patient-autonomy framing: patients who decline
  testing retain access to surveillance benefit, with the explicit
  caveat that variant-specific risk stratification is impossible
  empirically — c.1100delC truncating variant vs p.Ile157Thr
  missense variant carry substantially different surveillance
  implications, and empirical surveillance averages to a moderate
  intensity that may be over-treatment for missense-VUS-equivalent
  patients and under-treatment for truncating-variant patients.

  **Resource-intensity caveat:** Annual breast MRI is expensive
  (~3000-8000 UAH per scan in Ukrainian private centers). Colonoscopy
  q5y from age 40 is more invasive than population-screening q10y
  from age 45; empirical application without variant confirmation
  may not be cost-effective at population scale.

rationale_ua: >
  Aggressive-track компаньйон до IND-CHEK2-SUSPICION-PREVENTION-
  TESTING. Пацієнт з родовідною підозрою на CHEK2 carrier state,
  який відмовляється від генетичного консультування та/або
  панельного тестування, отримує empіричне посилене спостереження
  на основі сімейної історії:

  **Молочна залоза (жінки):**
  - Mammography щорічно з віку (earliest first-degree family breast
    cancer age) мінус 10 років, не раніше 30.
  - Annual breast MRI consideration, якщо Tyrer-Cuzick lifetime
    ризик ≥20%.
  - Clinical breast exam q6-12 міс.

  **Колоректальний:** Родоводи з breast-CRC cluster patterns
  отримують empіричну колоноскопію з 40 років q5y. Single-CRC
  родини отримують standard q10y колоноскопію з 45 років per USPSTF.

  **Prostate awareness (males):** PSA + DRE з 45-50 років, якщо
  family history high-grade/metastatic prostate cancer.

  **Risk-reducing хірургія:** НЕ пропонується emпірично без
  genetic confirmation. CHEK2 moderate-penetrance не виправдовує
  risk-reducing мастектомію навіть у підтверджених носіїв.

  **Reproductive counseling:** PGT-M не застосовується emпірично.

  Per CHARTER §11 framing автономії пацієнта. Варіант-специфічна
  ризик-стратифікація неможлива emпірично — c.1100delC truncating
  vs p.Ile157Thr missense мають суттєво різні surveillance
  implications.

