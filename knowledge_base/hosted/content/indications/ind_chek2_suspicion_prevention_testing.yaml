rationale: >
  Standard-track prevention pathway for individuals with pedigree-
  based suspicion of germline CHEK2 carrier state. Two parallel
  referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant), penetrance (variant-
  specific — truncating > splice > missense; c.1100delC carriers
  have moderate-penetrance breast RR ~2.0-3.0 lifetime ~20-30%,
  modest CRC RR ~1.5-2.0 lifetime ~5-10% over baseline, prostate
  RR ~2-3 with high-grade enrichment, thyroid smaller signal),
  implications for FDRs (cascade testing if positive — ~50% of
  FDRs are also carriers), GINA / insurance considerations,
  ancestry-specific considerations (founder-mutation prevalence
  in Slavic/Baltic/Polish populations), psychological aspects.
  Per ACMG / ASCO / NCCN, pre-test counseling by a certified
  genetic counselor or trained clinician is the standard of care
  before germline testing.

  **(2) Germline multi-gene panel testing.** Modern panels
  (e.g., Invitae Common Hereditary Cancers panel, Color hereditary
  cancer panel, GeneDx OncoGene Comprehensive, Myriad MyRisk,
  Ambry CancerNext) cover BRCA1, BRCA2, PALB2, CHEK2, ATM, RAD51C,
  RAD51D, BRIP1, plus contextual genes. If CRC family history
  dominates, an expanded CRC-inclusive panel covering Lynch (MLH1,
  MSH2, MSH6, PMS2, EPCAM) + APC + MUTYH should be ordered.
  For Slavic/Baltic patients with strong pedigree, founder
  c.1100delC + del5395 single-mutation testing may be used as a
  cost-efficient first step. Variant classification per ACMG
  framework — risk tier varies substantially by variant.

  **Sequel pathway (positive panel — confirmed CHEK2 carrier,
  truncating variant such as c.1100delC):**
  Transition to CHEK2-carrier surveillance pathway
  (IND-CHEK2-CARRIER-PREVENTION-SURVEILLANCE — standard track for
  RF-CHEK2-CONFIRMED-CARRIER):
  - Annual mammography from age 40, MRI consideration in dense-
    breast / high-quantitative-risk subset.
  - Clinical breast exam q6-12mo from age 30-35.
  - Colonoscopy from age 40 with q5y interval per NCCN moderate-
    elevated CRC tier.
  - Prostate awareness in males with c.1100delC: PSA + DRE from
    age 40-45 with shared decision-making (high-grade enrichment).
  - Cascade testing of FDRs for the family-specific variant.

  **Sequel pathway (positive panel — missense / lower-risk
  variant):** general-population screening with risk-adjusted
  modifications (annual mammography from age 40 if family history
  supports; standard colonoscopy q10y from age 45 unless family
  CRC history elevates).

  **Sequel pathway (positive panel — non-CHEK2 variant identified):**
  route to gene-specific carrier pathway (BRCA1/2, ATM, PALB2,
  Lynch genes, etc.).

  **Sequel pathway (negative panel):** empirical enhanced
  surveillance based on family history alone is offered as the
  aggressive-track alternative
  (IND-CHEK2-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE).

  **Sequel pathway (VUS):** managed as pedigree-suspicion until
  reclassification.

  In Ukraine, multi-gene panel testing is available via Institute
  of Genetics + select private labs. Slavic founder-panel testing
  (CHEK2 c.1100delC + del5395) is available at ~1500-3000 UAH
  as a cost-efficient first step.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з родовідною підозрою
  на гермінативний heterozygous carrier CHEK2. Два паралельні
  направлення:

  **(1) Направлення на генетичне консультування.** Pre-test
  консультування охоплює: спадкування (autosomal dominant),
  пенетрантність (variant-specific — truncating > splice > missense;
  c.1100delC carriers мають moderate-penetrance breast RR ~2.0-3.0
  lifetime ~20-30%, modest CRC RR ~1.5-2.0, prostate RR ~2-3 з
  high-grade enrichment), наслідки для FDRs, GINA / страхові
  міркування, ancestry-specific міркування (founder-mutation
  prevalence у Slavic/Baltic/Polish populations).

  **(2) Germline мультигенне панельне тестування.** Сучасні панелі
  покривають BRCA1, BRCA2, PALB2, CHEK2, ATM, RAD51C, RAD51D, BRIP1.
  Якщо CRC сімейна історія домінує, варто замовити expanded CRC-
  inclusive панель з Lynch (MLH1, MSH2, MSH6, PMS2, EPCAM) + APC +
  MUTYH. Для Slavic/Baltic пацієнтів з сильним pedigree founder
  c.1100delC + del5395 single-mutation testing може бути cost-
  efficient first step.

  **Наступний шлях (позитивна панель — підтверджений CHEK2
  carrier, truncating variant — c.1100delC):**
  перехід на CHEK2-carrier surveillance шлях
  (IND-CHEK2-CARRIER-PREVENTION-SURVEILLANCE):
  - Annual mammography з 40 років, MRI consideration у dense-
    breast / high-risk subset.
  - Clinical breast exam q6-12 міс з 30-35 років.
  - Колоноскопія з 40 років q5y per NCCN moderate-elevated CRC.
  - Prostate awareness у males з c.1100delC: PSA + DRE з 40-45
    років.
  - Cascade testing FDRs.

  **Наступний шлях (позитивна панель — missense / lower-risk):**
  general-population screening з risk-adjusted modifications.

  **Наступний шлях (позитивна панель — non-CHEK2 variant):**
  маршрутизація на gene-specific carrier шлях.

  **Наступний шлях (негативна панель):** empіричне посилене
  спостереження як aggressive-track альтернатива
  (IND-CHEK2-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE).

  В Україні multi-gene panel testing via Institute of Genetics +
  select private labs. Slavic founder-panel (~1500-3000 UAH).

