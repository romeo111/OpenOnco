do_not_do:
  - "Не призначати germline тестування без pre-test консультування."
  - "Не трактувати CHEK2 missense variant як еквівалент truncating — risk tiers значно різняться."
  - "Не пропускати variant-specific consultation — c.1100delC carriers потребують ширшої панелі surveillance ніж missense carriers."
  - "Не призначати aggressive CRC surveillance (q1-2y колоноскопія) для CHEK2 carriers — Lynch-level surveillance не виправдана для moderate-penetrance CHEK2 (q5y адекватно)."
  - "Не пропускати prostate awareness у male carriers з c.1100delC — high-grade enrichment задокументовано."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling."
  - "Do not treat a CHEK2 missense variant as equivalent to truncating — risk tiers differ substantially."
  - "Do not skip variant-specific consultation — c.1100delC carriers warrant more comprehensive surveillance than missense carriers."
  - "Do not order aggressive CRC surveillance (q1-2y colonoscopy) for CHEK2 carriers — Lynch-level surveillance is not justified for moderate-penetrance CHEK2 (q5y is adequate)."
  - "Do not skip prostate awareness in male carriers with c.1100delC — high-grade enrichment is documented."

