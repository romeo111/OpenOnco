rationale: >
  Brentuximab vedotin maintenance × 16 cycles starting 30-45 days
  post-ASCT for high-risk cHL per AETHERA (Moskowitz 2015). High-risk
  features: primary refractory (no CR after 1L), relapse <12 months
  from 1L, extranodal disease at relapse. AETHERA: 5-y PFS 59% vs
  placebo 41% (HR 0.52). FDA-approved for post-ASCT cHL high-risk
  maintenance. Particularly relevant for primary-refractory cHL
  where standard salvage + ASCT alone has high relapse rates.
  Pre-existing peripheral neuropathy is dominant patient-selection
  criterion — Grade ≥2 = practically non-eligible (risk-benefit
  unfavorable).

rationale_ua: >
  Підтримуюча терапія брентуксимабом ведотином (brentuximab vedotin) × 16 циклів,
  розпочата через 30–45 днів після ASCT, для cHL високого ризику за
  дослідженням AETHERA (Moskowitz 2015). Ознаки підвищеного ризику: первинно-рефрактерна cHL
  (без CR після 1L), рецидив <12 міс. від 1L, екстранодальне ураження при рецидиві.
  AETHERA: 5-річна ВБП 59% проти плацебо 41% (HR 0.52). Схвалено FDA для підтримуючої
  терапії після ASCT при cHL високого ризику. Особливо актуально при
  первинно-рефрактерній cHL, де сама лише стандартна сальвадж-терапія (salvage) + ASCT
  дає високу частоту рецидивів. Наявна периферична нейропатія — основний критерій відбору
  пацієнтів: нейропатія Grade ≥2 практично виключає застосування (співвідношення
  користь/ризик несприятливе). Потрібне уточнення шляху фінансування.

