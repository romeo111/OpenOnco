known_controversies:
  - topic: "BV maintenance vs PD-1 inhibitor maintenance post-ASCT for high-risk cHL"
    positions:
      - position: "BV — established AETHERA data, FDA-approved indication"
        sources: [SRC-NCCN-BCELL-2025]
      - position: "PD-1 inhibitor maintenance (pembrolizumab) — emerging data, may be alternative or sequential"
        sources: [SRC-NCCN-BCELL-2025]
        evidence_note: "PD-1 maintenance not yet FDA-approved for cHL post-ASCT setting"
    our_default: "BV maintenance per AETHERA for high-risk; PD-1 maintenance for BV-intolerant or BV-failed pre-ASCT"
  - topic: "Skip BV maintenance if patient achieved CR pre-ASCT"
    positions:
      - position: "Always maintain — high-risk features predict relapse regardless of pre-ASCT CR status"
        sources: [SRC-NCCN-BCELL-2025]
      - position: "Skip if pre-ASCT CR + low-risk features at original relapse"
        sources: [SRC-NCCN-BCELL-2025]
    our_default: "Maintain if any of 3 high-risk criteria (primary refractory, relapse <12 mo, extranodal at relapse) regardless of pre-ASCT response"

do_not_do:
  - "НЕ комбінувати з блеоміцином (bleomycin) — адитивна летальна легенева токсичність (абсолютне протипоказання)."
  - "НЕ призначати при наявній периферичній нейропатії Grade ≥2 — співвідношення користь/ризик несприятливе; лише спостереження."
  - "НЕ розпочинати підтримуючу терапію раніше 30 днів після ASCT — ризик поганого приживлення трансплантата + цитопенії."
  - "НЕ розпочинати підтримуючу терапію пізніше 45 днів після ASCT — найкращий ефект досягається за раннього початку (критерій включення в AETHERA)."
  - "НЕ ігнорувати нову нейропатію — знизити дозу до 1.2 мг/кг при поновленні терапії; остаточна відмова від терапії — для Grade ≥3."
  - "НЕ продовжувати підтримуючу терапію понад 16 циклів — визначено протоколом; користь довшого застосування не встановлена."
  - "НЕ застосовувати при cHL низького ризику (CR до ASCT + рецидив >12 міс. + лише нодальне ураження при рецидиві) — співвідношення користь/ризик несприятливе."
  - "НЕ призначати без уточнення шляху фінансування — брентуксимаб ведотин НЕ відшкодовується НСЗУ для підтримуючої терапії cHL."
  - "НЕ забувати про профілактику PJP протягом підтримуючої терапії + ≥6 міс. після останньої дози."

do_not_do_en:
  - "Do NOT combine with bleomycin — additive lethal pulmonary toxicity (absolute)."
  - "Do NOT prescribe in pre-existing Grade ≥2 peripheral neuropathy — risk-benefit unfavorable; surveillance only."
  - "Do NOT start maintenance before 30 days post-ASCT — risk of poor engraftment + cytopenia."
  - "Do NOT start maintenance after 45 days post-ASCT — best benefit when started early (AETHERA inclusion criterion)."
  - "Do NOT ignore new neuropathy — reduce dose to 1.2 mg/kg on resume; permanent discontinuation for Grade ≥3."
  - "Do NOT continue maintenance beyond 16 cycles — protocol-defined; longer benefit not established."
  - "Do NOT use for low-risk cHL (CR pre-ASCT + relapse >12 mo + nodal-only at relapse) — risk-benefit unfavorable."
  - "Do NOT prescribe without funding pathway clarification — brentuximab is NOT NSZU-reimbursed for cHL maintenance."
  - "Do NOT forget PJP prophylaxis during maintenance + ≥6 mo after last dose."
