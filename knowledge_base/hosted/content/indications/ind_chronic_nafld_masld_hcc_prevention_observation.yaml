desired_tests: []

rationale: >
  Aggressive-track (less pharmacotherapy) alternative for MASLD patients
  who, after shared decision-making, prefer or are constrained to
  lifestyle-only management + glycemic control. Used widely in
  resource-limited settings where resmetirom + GLP-1 agonists are
  inaccessible.

  Components:
    - **HCC surveillance retained for cirrhotic MASLD** — non-negotiable
      given annual incidence ~1-2%.
    - **Weight loss target ≥7-10%** via dietary + physical activity
      programs.
    - **Mediterranean / DASH dietary pattern** — strongest evidence-
      base outside pharmacotherapy.
    - **Glycemic control if T2DM** — metformin first-line.
    - **Cardiovascular risk management** — statins, BP control,
      smoking cessation.
    - **Alcohol minimization.**
    - **Re-evaluate annually for transition to standard pathway**
      (initiation of GLP-1 agonist or resmetirom if response to
      lifestyle alone is inadequate after 6-12 months).

  Symptom-driven hepatology workup retained — any decompensation
  feature (jaundice, ascites, encephalopathy, variceal bleed) →
  urgent hepatology referral + accelerated HCC workup with cross-
  sectional imaging.

rationale_ua: >
  Aggressive-трек (less pharmacotherapy) альтернатива для MASLD
  пацієнтів які надають перевагу lifestyle-only management + glycemic
  control. Широко у resource-limited settings де resmetirom + GLP-1
  агоністи недоступні.

  Компоненти:
    - **HCC surveillance retained для cirrhotic MASLD** —
      non-negotiable за annual incidence ~1-2%.
    - **Weight loss target ≥7-10%.**
    - **Mediterranean / DASH dietary pattern.**
    - **Glycemic control при T2DM** — metformin first-line.
    - **Cardiovascular risk management.**
    - **Alcohol minimization.**
    - **Re-evaluate щорічно для transition до standard pathway.**

  Symptom-driven hepatology workup retained.

