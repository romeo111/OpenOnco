expected_outcomes:
  overall_response_rate: >-
    Metabolic-management focus without MASH-specific pharmacotherapy +
    HCC surveillance retained for cirrhotic MASLD. Outcomes track
    weight-loss + glycemic-control responder cohort; less aggressive
    than the standard track for non-responders. Acceptable when
    resmetirom/GLP-1 are inaccessible, contraindicated, or declined.

