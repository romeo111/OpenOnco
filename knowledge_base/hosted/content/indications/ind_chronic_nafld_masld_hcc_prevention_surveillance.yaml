rationale: >
  Standard-track prevention pathway for NAFLD/MASLD with advanced
  fibrosis (FibroScan ≥10 kPa, FIB-4 ≥2.67, or biopsy METAVIR F3-F4).
  Routes to active hepatic surveillance + intensive metabolic
  intervention.

  Components:
    - **HCC surveillance** (cirrhotic MASLD only — AASLD threshold):
      abdominal US ± AFP every 6 months. Suboptimal US visualization
      (obesity-related shadowing common in MASLD population) →
      cross-sectional MRI or multiphase CT every 6 months per LI-RADS.
    - **Non-cirrhotic advanced fibrosis (F3):** AASLD does not endorse
      routine HCC surveillance (annual incidence below 1.5% threshold)
      but recommends closer hepatology follow-up + low threshold for
      cross-sectional imaging if any suspicious feature.
    - **Metabolic intervention (cornerstone):**
      - **Weight loss target ≥7%:** reverses NASH histology in
        majority; ≥10% can regress fibrosis. Structured Mediterranean
        + DASH dietary patterns first-line.
      - **GLP-1 agonists** (semaglutide 2.4 mg s.c. weekly per
        STEP-NASH; tirzepatide 5-15 mg s.c. weekly per SURMOUNT;
        liraglutide 3.0 mg s.c. daily) for BMI ≥27 with comorbidity.
      - **Resmetirom (MASH-specific THR-β agonist; FDA approved 2024)**
        80-100 mg PO daily for MASH with F2-F3 fibrosis — first
        FDA-approved MASH-specific therapy.
      - **Pioglitazone** 30-45 mg PO daily — NASH-resolution data
        from PIVENS trial; weight-gain + bone-loss + bladder-cancer
        signal limit broad use.
      - **Bariatric surgery** for BMI ≥35 with comorbidity — durable
        NASH resolution; mortality reduction beyond cancer.
    - **Comorbid T2DM management** — metformin retained; SGLT-2
      inhibitors (empagliflozin, dapagliflozin) provide additional
      cardio-renal benefit.
    - **Cardiovascular risk management** — MASLD patients die more
      often from cardiovascular events than from HCC; statins, BP
      control, smoking cessation.
    - **Alcohol minimization** — synergistic with MASLD; even modest
      alcohol accelerates fibrosis progression.
    - **HBV + HCV screening** once — co-infection compounds HCC risk.
    - **Vaccination:** HAV + HBV, influenza, pneumococcal.
    - **Avoid hepatotoxic agents** — review medication list.

  In Ukraine, MASLD prevalence rising with obesity epidemic; FibroScan
  + transient elastography increasingly available; resmetirom + GLP-1
  agonists out-of-pocket but used in tertiary hepatology centres in
  Kyiv, Lviv.

rationale_ua: >
  Стандартний-трек prevention шлях для NAFLD/MASLD з advanced fibrosis
  (FibroScan ≥10 кПа, FIB-4 ≥2.67, biopsy METAVIR F3-F4). Routes to
  active hepatic surveillance + intensive metabolic intervention.

  Компоненти:
    - **HCC surveillance** (cirrhotic MASLD only — AASLD threshold):
      abdominal US ± AFP кожні 6 міс. Suboptimal US visualization →
      MRI або CT q6 міс.
    - **Non-cirrhotic advanced fibrosis (F3):** не routine HCC
      surveillance, але closer hepatology follow-up.
    - **Metabolic intervention (cornerstone):**
      - **Weight loss target ≥7%:** реверсує NASH histology; ≥10%
        регресує fibrosis.
      - **GLP-1 агоністи** (semaglutide, tirzepatide, liraglutide).
      - **Resmetirom (FDA 2024)** 80-100 мг PO daily.
      - **Pioglitazone** 30-45 мг.
      - **Bariatric surgery** при BMI ≥35.
    - **Comorbid T2DM management** — metformin; SGLT-2 inhibitors.
    - **Cardiovascular risk management** — statins, BP control,
      smoking cessation.
    - **Alcohol minimization.**
    - **HBV + HCV screening** once.
    - **Vaccination:** HAV + HBV, influenza, pneumococcal.

  В Україні MASLD prevalence зростає; FibroScan + transient
  elastography доступний; resmetirom + GLP-1 агоністи out-of-pocket
  у tertiary hepatology centres Києва, Львова.

