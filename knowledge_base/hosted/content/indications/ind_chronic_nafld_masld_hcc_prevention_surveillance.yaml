sources:
  - source_id: SRC-AASLD-HCC-2023
    position: supports
    relevant_quote_paraphrase: >-
      "Patients with NAFLD/MASLD cirrhosis are recommended for routine
      HCC surveillance with US ± AFP every 6 months. Non-cirrhotic
      NAFLD does not meet surveillance threshold but warrants closer
      follow-up."

do_not_do:
  - "Не пропускати HCC surveillance у cirrhotic MASLD — incidence ~1-2%/рік перевищує AASLD threshold."
  - "Не використовувати pioglitazone у пацієнтів з активною серцевою недостатністю або bladder-cancer history."
  - "Не призначати рутинний MR-pancreas screening у MASLD — pancreatic + biliary cancers ризик помірний, не виправдовує imaging."
  - "Не покладатися лише на pharmacotherapy — weight loss + lifestyle — primary."

do_not_do_en:
  - "Do not skip HCC surveillance in cirrhotic MASLD — incidence ~1-2%/year exceeds the AASLD threshold."
  - "Do not use pioglitazone in patients with active heart failure or bladder-cancer history."
  - "Do not order routine MR-pancreas screening in MASLD — pancreatic + biliary cancer risk is moderate and does not justify imaging."
  - "Do not rely on pharmacotherapy alone — weight loss + lifestyle remain primary."

known_controversies:
  - topic: "Resmetirom long-term outcomes data"
    positions:
      - position: "First-line MASH-specific therapy"
        rationale: "FDA-approved 2024; phase-3 MAESTRO-NASH histologic improvement vs placebo."
      - position: "Reserve for those who fail metabolic intervention"
        rationale: "Long-term clinical-outcome data (cirrhosis prevention, HCC reduction) still maturing; modest histologic effect size."
    our_default: "Use after / alongside weight loss + GLP-1; reserve as monotherapy when other modalities fail or are contraindicated."
    rationale: "Maximize cumulative effect."

