expected_outcomes:
  overall_response_rate: >-
    AASLD HCC surveillance in cirrhotic MASLD shifts HCC stage at
    diagnosis from advanced (BCLC C/D, OS 6-11 mo) to early-stage
    (BCLC 0/A, transplant/resection/ablation eligible, 5y OS 60-75%).
    Weight loss ≥10% reverses NASH histology in majority + can regress
    fibrosis (LANCET 2024 phase-3 resmetirom data). GLP-1 agonists +
    semaglutide STEP-NASH show 36-week NASH resolution rates 40-60%.

