rationale: >
  Aggressive-track (less intensive lifestyle intervention) alternative
  for T2DM patients who, after shared decision-making, prefer a
  pharmacologic-focused pathway without structured weight loss /
  physical activity programs.

  Components:
    - Glycemic control per ADA 2024 (HbA1c individualised target).
    - Metformin as first-line where tolerated.
    - General-population cancer screening (CRC, breast, cervical)
      per USPSTF schedules — no off-schedule imaging.
    - Smoking cessation if applicable.
    - Annual reassessment of patient willingness to engage with
      structured lifestyle intervention.
    - Symptom-driven workup for any concerning features (new-onset T2DM
      ≥50 with weight loss → still triggers pancreatic workup;
      post-menopausal bleeding → endometrial biopsy).

rationale_ua: >
  Aggressive-трек (less intensive lifestyle intervention) альтернатива
  для T2DM пацієнтів які після shared decision-making надають перевагу
  pharmacologic-focused pathway без structured weight loss / physical
  activity programs.

  Компоненти:
    - Glycemic control per ADA 2024.
    - Metformin як first-line.
    - General-population cancer screening per USPSTF schedules.
    - Smoking cessation якщо applicable.
    - Щорічна reassessment patient willingness to engage у structured
      lifestyle intervention.
    - Symptom-driven workup при concerning features.

