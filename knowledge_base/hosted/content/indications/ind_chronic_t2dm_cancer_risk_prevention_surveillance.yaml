expected_outcomes:
  overall_response_rate: >-
    Glycemic + weight + lifestyle optimization + adherence to general-
    population cancer screening + new-onset T2DM ≥50 with weight loss
    pancreatic workup (EUS or MRI per ACG 2022 if NOD-PaCa risk score
    elevated) shifts: pancreatic cancer stage at diagnosis from advanced
    (5y OS 3-12%) to resectable (5y OS 20-40%) in NOD-PaCa surveillance
    cohorts; CRC stage at diagnosis via adherent USPSTF screening;
    endometrial cancer via symptom-driven biopsy. Glycemic control +
    metformin modestly reduce cancer incidence (observational signal).

