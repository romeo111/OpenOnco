rationale: >
  Standard-track prevention pathway for established T2DM. Multi-organ
  modest risk amplifier — most effective interventions are glycemic
  control, weight management, and adherence to general-population
  cancer screening rather than off-schedule organ-specific imaging.
  Two situations warrant additional workup: (1) new-onset T2DM aged
  ≥50 with unexplained weight loss → pancreatic cancer workup; (2)
  comorbid NAFLD/MASLD with advanced fibrosis → separate hepatic
  surveillance pathway (see NAFLD-MASLD RF).

  Components:
    - **Glycemic control** to HbA1c <7% (individualised; <6.5% in
      younger patients without hypoglycemia risk; <8% in elderly/frail).
      Per ADA 2024 Standards of Care.
    - **Metformin** as first-line where not contraindicated — observational
      data show ~20-30% lower cancer incidence in metformin-treated
      T2DM cohorts (likely confounded but consistent across cancers);
      mechanism via mTOR/AMPK and reduced hyperinsulinemia.
    - **Weight loss target** 5-10% of body weight; 10-15% reverses
      NASH histology in many; pharmacotherapy (semaglutide,
      tirzepatide, liraglutide) for BMI ≥27 with comorbidity;
      bariatric surgery for BMI ≥35 with comorbidity.
    - **Physical activity** ≥150 min/week moderate or ≥75 min/week
      vigorous — independent cancer-risk reduction signal.
    - **Smoking cessation** — multiplicative with T2DM for pancreatic
      and bladder cancers.
    - **Cancer screening adherence:**
      - CRC: USPSTF 2021 — colonoscopy q10y, FIT q1y, or MT-sDNA q3y
        from age 45 (T2DM doesn't move the starting age but emphasizes
        adherence).
      - Breast: USPSTF 2024 — biennial mammography from age 40 (with
        T2DM-obesity comorbidity, consider supplemental MRI if dense
        breast tissue).
      - Endometrial: symptom-driven (any post-menopausal bleeding;
        any abnormal pre-menopausal bleeding pattern of ≥6 months in
        anovulatory T2DM-obesity women).
    - **New-onset T2DM ≥50 + unexplained weight loss:** consider
      pancreatic workup — abdominal MRI with pancreas protocol or EUS
      per ACG 2022 / NOD-PaCa Enriching New-onset Diabetes for
      Pancreatic Cancer (END-PAC) score. Reserve EUS for END-PAC ≥3
      or strong clinical suspicion.
    - **Comorbid NAFLD/MASLD:** transient elastography (FibroScan) +
      FIB-4 every 1-2 years; if advanced fibrosis → see NAFLD-MASLD RF
      surveillance pathway.

  In Ukraine, T2DM is widely managed by endocrinology + primary care;
  NSZU covers metformin + sulfonylureas + some DPP-4 + insulin; GLP-1
  agonists out-of-pocket but increasingly available. Lifestyle programs
  uneven across regions.

rationale_ua: >
  Стандартний-трек prevention шлях для established T2DM. Multi-organ
  скромний ризик-amplifier — найефективніші інтервенції — glycemic
  control, weight management, adherence до general-population cancer
  screening, а не off-schedule organ-specific imaging. Дві ситуації
  заслуговують додаткового workup: (1) new-onset T2DM віком ≥50 з
  unexplained weight loss → pancreatic cancer workup; (2) comorbid
  NAFLD/MASLD з advanced fibrosis → окремий hepatic surveillance
  pathway.

  Компоненти:
    - **Glycemic control** до HbA1c <7% (individualised). Per ADA 2024.
    - **Metformin** як first-line — observational data ~20-30% нижче
      cancer incidence у metformin-treated T2DM cohorts.
    - **Weight loss target** 5-10%; 10-15% реверсує NASH histology;
      pharmacotherapy (semaglutide, tirzepatide, liraglutide);
      bariatric surgery.
    - **Physical activity** ≥150 хв/тиж moderate.
    - **Smoking cessation** — multiplicative з T2DM для pancreatic +
      bladder cancers.
    - **Cancer screening adherence:**
      - CRC: USPSTF 2021 colonoscopy q10y, FIT q1y, MT-sDNA q3y з 45.
      - Breast: USPSTF 2024 mammography з 40.
      - Endometrial: symptom-driven.
    - **New-onset T2DM ≥50 + unexplained weight loss:** pancreatic
      workup — abdominal MRI або EUS per ACG 2022 / END-PAC score.
    - **Comorbid NAFLD/MASLD:** transient elastography + FIB-4 q1-2y.

  В Україні T2DM widely managed endocrinology + primary care; NSZU
  покриває metformin + sulfonylureas + DPP-4 + insulin; GLP-1 агоністи
  out-of-pocket але дедалі доступніші.

