do_not_do:
  - "Не пропускати pancreatic workup при new-onset T2DM ≥50 з unexplained weight loss — ~1% absolute 3-year ризик occult pancreatic cancer у такого cohort."
  - "Не виконувати рутинний pancreatic-protocol MRI у asymptomatic established T2DM — низький yield + radiation/contrast burden."
  - "Не покладатися лише на glycemic control — weight management + physical activity дають незалежні cancer-risk зниження."
  - "Не призначати estrogen-only HRT post-menopausal T2DM жінкам з intact uterus — additive endometrial risk без opposed progestin."

do_not_do_en:
  - "Do not skip pancreatic workup in new-onset T2DM ≥50 with unexplained weight loss — ~1% absolute 3-year risk of occult pancreatic cancer in this cohort."
  - "Do not perform routine pancreatic-protocol MRI in asymptomatic established T2DM — low yield + radiation/contrast burden."
  - "Do not rely on glycemic control alone — weight management + physical activity provide independent cancer-risk reduction."
  - "Do not prescribe estrogen-only HRT in post-menopausal T2DM women with intact uterus — additive endometrial risk without opposed progestin."

known_controversies:
  - topic: "Metformin's cancer-prevention efficacy as an independent indication"
    positions:
      - position: "Use for cancer prevention"
        rationale: "Consistent observational signal of ~20-30% reduced incidence across cancers; mTOR/AMPK mechanism plausible."
      - position: "Glycemic indication only"
        rationale: "Confounding by indication (more advanced T2DM → insulin → worse outcomes); RCT with cancer endpoint absent."
    our_default: "Use metformin for its diabetes indication; cancer-risk reduction is an acceptable adjunct, not a stand-alone indication."
    rationale: "Insufficient evidence to expand indication beyond glycemic; benefit accrues to those who already qualify."

