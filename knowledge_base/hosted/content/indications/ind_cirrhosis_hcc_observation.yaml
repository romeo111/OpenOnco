do_not_do:
  - "Не презентувати observation як equivalent surveillance у Child-Pugh A/B з transplant candidacy — surveillance-detected HCC має substantially better outcomes."
  - "Не пропускати etiology-specific treatment — HBV antivirals, HCV DAAs, alcohol abstinence — disease-modifying незалежно від surveillance choice."
  - "Не нормалізувати surveillance refusal у curative-eligible patient — counsel що surveillance-detected HCC opens transplant / resection / ablation paths недоступних при symptomatic presentation."
  - "Не пропускати periodic re-evaluation — Child-Pugh shifts, transplant candidacy changes; surveillance decision не permanent."

do_not_do_en:
  - "Do not present observation as equivalent to surveillance in a Child-Pugh A/B patient with transplant candidacy — surveillance-detected HCC has substantially better outcomes."
  - "Do not skip etiology-specific treatment — HBV antivirals, HCV DAAs, alcohol abstinence are disease-modifying regardless of surveillance choice."
  - "Do not normalize surveillance refusal in a curative-eligible patient — counsel that surveillance-detected HCC opens transplant / resection / ablation paths unavailable at symptomatic presentation."
  - "Do not skip periodic re-evaluation — Child-Pugh shifts and transplant candidacy changes; the surveillance decision is not permanent."

