sources:
  - source_id: SRC-AASLD-HCC-2023
    position: supports
    relevant_quote_paraphrase: >-
      "All cirrhotic patients regardless of etiology should be
      offered HCC surveillance with abdominal ultrasonography ±
      AFP every 6 months. Combined US + AFP outperforms US alone.
      Hepatobiliary MRI is appropriate when US is technically
      inadequate. Surveillance reduces HCC-specific mortality by
      enabling detection at curative-intent stages (BCLC 0-A,
      within-Milan)."
  - source_id: SRC-NCCN-HCC-2025
    position: supports

do_not_do:
  - "Не відмовлятися від HCC surveillance тільки тому що етіологія cirrhosis не класифікована — cirrhotic liver сам по собі — dominant HCC risk driver."
  - "Не використовувати CT q6 months замість US — cumulative radiation burden lifelong; reserve CT/MRI для problem-solving коли US technically inadequate."
  - "Не пропускати AFP — combined US + AFP sensitivity ~80% vs. ~63% US-only."
  - "Не продовжувати surveillance у Child-Pugh C патієнта non-transplant-candidate без обговорення — surveillance яка не може привести до curative treatment може бути inappropriate (palliative-framing discussion)."
  - "Не делегувати cirrhotic-liver imaging non-specialist center — reader experience rate-limiting; high false-negative rate в inexperienced hands."
  - "Не очікувати що SVR12 у HCV-cured F4 cirrhotic eliminates HCC risk — risk reduced ~70% але lifelong surveillance continues."

do_not_do_en:
  - "Do not opt out of HCC surveillance simply because the cirrhosis etiology is unclassified — the cirrhotic liver itself is the dominant HCC risk driver."
  - "Do not use CT q6 months in place of US — lifelong cumulative radiation burden; reserve CT/MRI for problem-solving when US is technically inadequate."
  - "Do not skip AFP — combined US + AFP sensitivity is ~80% vs. ~63% for US alone."
  - "Do not continue surveillance in a Child-Pugh C non-transplant-candidate without discussion — surveillance that cannot lead to curative treatment may be inappropriate (palliative-framing discussion)."
  - "Do not delegate cirrhotic-liver imaging to a non-specialist center — reader experience is rate-limiting; false-negative rates are high in inexperienced hands."
  - "Do not expect SVR12 in an HCV-cured F4 cirrhotic to eliminate HCC risk — risk is reduced ~70% but lifelong surveillance continues."

