expected_outcomes:
  overall_response_rate: >-
    Abdominal US + AFP q6 months in cirrhotic patients detects HCC at
    earlier stage (BCLC 0-A vs. BCLC B-C typical of symptomatic
    presentation) in a meaningful subset of surveillance-engaged
    patients. Pooled meta-analysis (Singal 2014 Aliment Pharmacol
    Ther; AASLD Guidance 2023 evidence summary) shows 32% relative
    reduction in HCC-specific mortality with semi-annual US
    surveillance vs. no surveillance, with surveillance-detected
    HCCs more often within Milan criteria (transplant-eligible) and
    BCLC 0-A (resection/ablation curative-intent eligible).
    Addition of AFP improves sensitivity ~17 percentage points
    (~63% US-only → ~80% combined).

