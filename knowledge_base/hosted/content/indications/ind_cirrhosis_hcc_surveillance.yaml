rationale: >
  Standard-track HCC surveillance for etiology-agnostic cirrhotic
  patients per AASLD HCC Guidance 2023 (Singal et al. Hepatology
  2023) + NCCN HCC 2025.

  **(1) Imaging surveillance — abdominal US every 6 months:**
  - Performed at a center experienced with cirrhotic-liver imaging.
  - Cirrhotic livers are nodular and challenging; reader experience
    is rate-limiting for surveillance yield.
  - When US is technically inadequate (severe obesity, prior
    bariatric anatomy, large ascites obscuring liver, prior partial
    hepatectomy distorting anatomy), use hepatobiliary contrast-
    enhanced MRI as alternative or supplement.

  **(2) Serum alpha-fetoprotein (AFP) every 6 months alongside US:**
  - AASLD Guidance 2023 endorses combined US + AFP (vs. US alone)
    for improved sensitivity (~80% vs. ~63%).
  - Trend matters as much as absolute value: rising AFP on serial
    measurements is an alarm signal even within the normal range.

  **(3) Etiology-specific treatment of underlying liver disease:**
  - Chronic HBV (when applicable): nucleos(t)ide analogue antivirals
    (tenofovir, entecavir) lifelong; HBV-DNA suppression reduces but
    does not eliminate HCC risk.
  - Chronic HCV (when applicable): direct-acting antiviral (DAA)
    cure; SVR12 reduces HCC risk by ~70% but does NOT eliminate it
    in F4 cirrhotics — surveillance continues lifelong post-cure.
  - NAFLD/MASH: weight loss (≥7-10% body weight), diabetes
    management, statin where indicated, abstinence from alcohol.
  - Alcoholic cirrhosis: alcohol abstinence; nutrition support.
  - Hemochromatosis: regular venesection to ferritin <50 ng/mL.
  - Wilson disease: chelation therapy + low-copper diet.
  - Alpha-1 antitrypsin deficiency: liver transplant evaluation is
    the only disease-modifying option for severe phenotypes.
  - Autoimmune hepatitis / PBC / PSC: immunosuppression /
    ursodeoxycholic acid per disease-specific guideline.

  **(4) Alcohol abstinence regardless of etiology:**
  - Alcohol is multiplicative with all other HCC risk factors;
    abstinence reduces HCC incidence in cirrhotic patients.

  **(5) Obesity management:**
  - Overlap with NAFLD/MASH-driven cirrhosis is common; weight loss
    reduces hepatic inflammation and slows fibrosis progression.

  **(6) Nutrition + sarcopenia management:**
  - Cirrhotic sarcopenia worsens prognosis; protein-adequate diet
    + branched-chain amino acid supplementation in decompensated
    patients per AASLD nutrition guidance.

  **(7) Pre-transplant evaluation when MELD ≥15 or HCC found within
  Milan criteria:**
  - Liver transplant is the most definitive HCC + cirrhosis
    treatment; pre-emptive evaluation when surveillance detects HCC
    enables timely listing.

  **(8) Curative-intent treatment of detected HCC:**
  - BCLC 0-A (single tumor ≤2cm or 1-3 tumors all ≤3cm): resection,
    ablation (RFA/MWA), or transplant per anatomy + Child-Pugh.
  - BCLC B: TACE (transarterial chemoembolization).
  - BCLC C: systemic therapy (atezolizumab + bevacizumab first-line
    per IMbrave150 — but this is outside the prevention scope and
    transitions to treatment-persona).

  Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Стандартний-трек HCC surveillance для etiology-agnostic cirrhotic
  пацієнтів per AASLD HCC Guidance 2023 + NCCN HCC 2025.

  **(1) Imaging surveillance — abdominal US кожні 6 місяців:**
  - При center experienced з cirrhotic-liver imaging.
  - Cirrhotic livers nodular та challenging; reader experience —
    rate-limiting для surveillance yield.
  - Коли US technically inadequate (severe obesity, prior bariatric,
    large ascites, prior partial hepatectomy) — hepatobiliary
    contrast-enhanced MRI як alternative або supplement.

  **(2) Serum AFP кожні 6 місяців разом з US:**
  - AASLD Guidance 2023 endorses combined US + AFP для improved
    sensitivity (~80% vs. ~63%).
  - Trend matters — rising AFP на serial measurements — alarm signal.

  **(3) Etiology-specific treatment of underlying liver disease:**
  - Chronic HBV: nucleos(t)ide analogue antivirals lifelong.
  - Chronic HCV: DAA cure; SVR12 reduces HCC risk на ~70% але не
    eliminates у F4 cirrhotics — surveillance continues lifelong.
  - NAFLD/MASH: weight loss (≥7-10% body weight), diabetes management.
  - Alcoholic cirrhosis: alcohol abstinence; nutrition support.
  - Hemochromatosis: regular venesection.
  - Wilson disease: chelation therapy + low-copper diet.
  - A1AT deficiency: liver transplant evaluation.
  - Autoimmune hepatitis / PBC / PSC: per disease-specific guideline.

  **(4) Alcohol abstinence незалежно від етіології** — alcohol
  multiplicative з усіма іншими HCC risk factors.

  **(5) Obesity management** — overlap з NAFLD/MASH-driven cirrhosis.

  **(6) Nutrition + sarcopenia management** — cirrhotic sarcopenia
  worsens prognosis.

  **(7) Pre-transplant evaluation при MELD ≥15 або HCC within Milan.**

  **(8) Curative-intent treatment of detected HCC:**
  - BCLC 0-A: resection, ablation (RFA/MWA), або transplant.
  - BCLC B: TACE.
  - BCLC C: systemic therapy (atezolizumab + bevacizumab per
    IMbrave150) — outside prevention scope.

  Per CHARTER §11 framing автономії пацієнта.

