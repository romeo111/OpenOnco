rationale: >
  Venetoclax + rituximab (VenR) for 24 months is the preferred 2L+
  fixed-duration regimen for r/r CLL after 1L BTKi or chemoimmuno
  progression. MURANO trial: substantial PFS + OS benefit over BR with
  durable MRD-negative responses (~62% MRD-negative at end of treatment).
  Distinct from VenO (1L CLL14, 12 mo + obinutuzumab anti-CD20) — VenR
  is 24 mo + rituximab, designed for r/r setting. Particularly valuable
  for patients who are BCL2-naive and need fixed-duration time-off-
  treatment. Choice of VenR vs continued BTKi at progression depends
  on prior 1L exposure: if 1L was BTKi → VenR is the rational switch;
  if 1L was chemoimmuno → either VenR or BTKi acceptable.

rationale_ua: >
  Венетоклакс + ритуксимаб (VenR) протягом 24 місяців є переважним фіксованої тривалості
  режимом 2L+ для рецидивного/рефрактерного (relapsed/refractory) ХЛЛ після 1L BTKi або
  прогресування хіміоімунотерапії. Дослідження MURANO: суттєва перевага ВБП та ЗВ
  порівняно з BR з тривалими MRD-негативними відповідями (~62% MRD-негативних після
  закінчення лікування). Відрізняється від VenO (1L CLL14, 12 міс. + обінутузумаб) —
  VenR призначений на 24 міс. + ритуксимаб для рецидивного налаштування.
  Особливо цінна для пацієнтів, ще не знайомих з BCL-2 інгібіторами, яким потрібна
  фіксована тривалість лікування з паузою. Вибір VenR проти продовженого BTKi при
  прогресуванні залежить від попередньої 1L-терапії: якщо 1L — BTKi, то VenR є
  раціональним переходом; якщо 1L — хіміоімунотерапія, то VenR або BTKi прийнятні.
  Барєр доступу в Україні: венетоклакс доступний; ритуксимаб — доступний.
