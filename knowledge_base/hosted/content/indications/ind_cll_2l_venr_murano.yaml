sources:
  - source_id: SRC-MURANO-SEYMOUR-2018
    position: supports
    relevant_quote_paraphrase: "Venetoclax-rituximab vs BR in r/r CLL: PFS HR 0.17 (95% CI 0.11–0.25; p<0.001); 2-yr PFS 84.9% vs 36.3%; OS HR 0.48; 62% undetectable MRD at end of treatment (MURANO)"
  - source_id: SRC-NCCN-BCELL-2025
    position: supports
    relevant_quote_paraphrase: "Venetoclax + rituximab (24-month MURANO schedule) is a Category 1 preferred regimen for r/r CLL after 1+ prior lines"
  - source_id: SRC-ESMO-CLL-2024
    position: supports
    relevant_quote_paraphrase: "VenR fixed-duration 24-month regimen is recommended for r/r CLL with substantial PFS + OS benefit over chemoimmunotherapy"
known_controversies:
  - topic: "Continued BTKi vs switch to VenR after 1L BTKi progression"
    positions:
      - position: "Switch to VenR (different MOA — BCL2 inhibition) for patients progressing on cBTKi (intolerance OR true progression)"
        sources: [SRC-NCCN-BCELL-2025]
      - position: "Switch to second-gen BTKi (zanu, acal) if 1L was ibrutinib intolerance (not progression) — same class but better tolerability"
        sources: [SRC-NCCN-BCELL-2025]
        evidence_note: "Distinguish intolerance from true progression — drives next-line choice"
    our_default: "VenR for true BTKi progression; BTKi-class-switch (e.g. ibrutinib intolerance → zanubrutinib) if intolerance only"
    rationale: "Mechanism-of-action switch indicated for true progression"

do_not_do:
  - "НЕ пропускати 5-тижневе нарощування дози венетоклаксу (ramp-up) — задокументовано летальний TLS."
  - "НЕ призначати одночасно з потужним інгібітором CYP3A4 під час нарощування дози — летальне підвищення концентрації препарату."
  - "НЕ починати лікування без скринінгу на HBV та профілактики ентекавіром за HBsAg+ або anti-HBc+ (реактивація на тлі анти-CD20-терапії)."
  - "НЕ пропускати профілактику TLS (алопуринол + гідратація) — особливо при ALC >25K або значному пухлинному навантаженні (bulky disease)."
  - "НЕ проводити нарощування дози амбулаторно за значного пухлинного навантаження — потрібна госпіталізація з контролем аналізів кожні 6–8 год."
  - "НЕ забувати про профілактику PJP на час тривалої терапії."
  - "НЕ застосовувати за попередньої резистентності до BCL2i — низька ефективність; розглянути піртобрутиніб або CAR-T."

do_not_do_en:
  - "Do NOT skip the venetoclax 5-week ramp-up — fatal TLS documented."
  - "Do NOT prescribe with concomitant strong CYP3A4 inhibitor during ramp-up — fatal concentration increase."
  - "Do NOT start without HBV screening + entecavir prophylaxis if HBsAg+ or anti-HBc+ (anti-CD20 reactivation)."
  - "Do NOT skip TLS prophylaxis (allopurinol + hydration) — especially with ALC >25K or bulky disease."
  - "Do NOT do ramp-up on an outpatient with high-burden disease — hospitalization with q6-8h labs required."
  - "Do NOT forget PJP prophylaxis on prolonged therapy."
  - "Do NOT use in prior BCL2i resistance — low efficacy; consider pirtobrutinib or CAR-T."
