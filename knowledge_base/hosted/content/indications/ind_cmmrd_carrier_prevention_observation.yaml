strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Reduced-intensity surveillance with retained sentinel-symptom
    education + critical hematology + neurologic monitoring. Higher
    risk of late detection. Acceptable only in resource-limited
    settings or when family declines full C4CMMRD schedule after
    documented shared decision-making.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (reduced-intensity surveillance) alternative for
  CMMRD families in resource-limited settings or after explicit shared
  decision-making.

  Components:
    - CBC + smear + LDH q6mo retained.
    - Brain MRI q12mo (instead of q6mo) — accept higher risk of
      late-stage detection.
    - Colonoscopy q12mo (instead of q6mo).
    - Upper GI + small-bowel surveillance frequency reduced to
      annual.
    - Abdominal US q12mo.
    - Skin examination annual.
    - Symptom-driven workup retained.
    - Cascade testing retained.
    - Treatment principles unchanged — avoid alkylating + topo-II
      chemotherapy + radiation; anti-PD-1 first-line for established
      cancers.
    - Re-offer full C4CMMRD schedule annually.

rationale_ua: >
  Aggressive-трек (reduced-intensity surveillance) альтернатива для
  CMMRD families у resource-limited settings або after explicit
  shared decision-making.

  Компоненти:
    - CBC + smear + LDH q6mo retained.
    - Brain MRI q12mo (instead of q6mo).
    - Colonoscopy q12mo (instead of q6mo).
    - Upper GI + small-bowel surveillance frequency annual.
    - Abdominal US q12mo.
    - Skin examination annual.
    - Symptom-driven workup retained.
    - Cascade testing retained.
    - Treatment principles unchanged.
    - Re-offer повний C4CMMRD schedule annually.

