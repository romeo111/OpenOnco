rationale: >
  Standard-track prevention pathway for confirmed biallelic-MMR /
  CMMRD per Care for CMMRD Consortium 2014 + Tabori 2017 update.
  Intensive multi-organ pediatric surveillance.

  Components — HEMATOLOGIC:
    - **CBC + smear + LDH q3-6mo** from diagnosis through age 25.
    - **Serum protein electrophoresis + immunoglobulins q6mo** —
      lymphoma surveillance.
    - **Sentinel-symptom education:** unexplained fever, pancytopenia,
      lymphadenopathy, organomegaly → urgent hematology.

  Components — CNS:
    - **Brain MRI every 6 months from age 2** lifelong — medulloblastoma,
      glioblastoma, supratentorial PNET, low-grade glioma.
    - **Neurologic + ophthalmologic examination annual.**

  Components — GASTROINTESTINAL:
    - **Colonoscopy every 6 months from age 6** — CMMRD CRC develops
      ages 6-20 with rapid adenoma-to-carcinoma sequence; resect any
      polyp.
    - **Upper GI endoscopy + small-bowel video capsule annual from
      age 8** — small bowel adenoma surveillance.
    - **Abdominal US (kidney, liver, pancreas, ovaries/testes) every
      6 months** — Wilms, hepatoblastoma, signal-detection.

  Components — DERMATOLOGIC:
    - **Full-body skin examination annual** — café-au-lait macule
      monitoring, melanoma, NF1-like signs.
    - **Photoprotection** lifelong.

  Components — GYNECOLOGIC (female from menarche):
    - **Pelvic exam annual.**
    - **Endometrial sampling for any abnormal bleeding** — endometrial
      cancer arises in CMMRD young adults.

  **Cascade testing:** parental MMR carrier confirmation (parents are
  Lynch monoallelic carriers, requiring their own Lynch surveillance);
  siblings tested for biallelic CMMRD risk (~25% per autosomal-
  recessive inheritance).

  **Reproductive counseling:** PGT-M available; both partners would
  need to be MMR carriers for risk; rare circumstance.

  **Cancer treatment considerations:**
    - **Avoid alkylating + topoisomerase-II chemotherapy** if possible
      — CMMRD has elevated risk of secondary malignancies and severe
      toxicity from these agents.
    - **Anti-PD-1 immunotherapy** (nivolumab, pembrolizumab) is
      effective for established CMMRD cancers — universal MSI-high
      tumor phenotype + high tumor mutation burden.
    - **Multidisciplinary CMMRD center care** preferred.

  In Ukraine, CMMRD is rare and requires multi-disciplinary pediatric
  oncology + clinical genetics coordination. MMR germline testing via
  Institute of Genetics + select private labs. Anti-PD-1 immunotherapy
  available for established cancers — coverage per case.

rationale_ua: >
  Стандартний-трек prevention шлях для confirmed biallelic-MMR /
  CMMRD per Care for CMMRD Consortium 2014 + Tabori 2017 update.
  Intensive multi-organ pediatric surveillance.

  Компоненти — HEMATOLOGIC:
    - **CBC + smear + LDH q3-6mo** з діагнозу до 25 років.
    - **Serum protein electrophoresis + immunoglobulins q6mo.**
    - **Sentinel-symptom education.**

  Компоненти — CNS:
    - **Brain MRI кожні 6 міс з 2 років** lifelong.
    - **Neurologic + ophthalmologic examination annual.**

  Компоненти — GI:
    - **Colonoscopy кожні 6 міс з 6 років** — resect any polyp.
    - **Upper GI endoscopy + small-bowel video capsule annual з
      8 років.**
    - **Abdominal US (нирки, печінка, підшлункова, яєчники/яєчка)
      кожні 6 міс.**

  Компоненти — DERMATOLOGIC:
    - **Full-body skin examination annual.**
    - **Photoprotection** lifelong.

  Компоненти — GYNECOLOGIC (female from menarche):
    - **Pelvic exam annual.**
    - **Endometrial sampling при abnormal bleeding.**

  **Cascade testing:** parental MMR carrier confirmation; siblings
  tested.
  **Reproductive counseling:** PGT-M available.
  **Cancer treatment considerations:** уникати alkylating +
  topoisomerase-II chemotherapy; anti-PD-1 immunotherapy ефективний
  для established CMMRD cancers (MSI-high + high TMB).

  В Україні CMMRD рідкий і потребує multi-disciplinary pediatric
  oncology + clinical genetics coordination. MMR germline testing via
  Institute of Genetics.

