sources:
  - source_id: SRC-NCCN-GENETIC-FAMILIAL-CRC-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Biallelic mismatch repair deficiency (CMMRD) is a severe pediatric
      cancer predisposition syndrome requiring intensive multi-organ
      surveillance per C4CMMRD Consortium recommendations; anti-PD-1
      immunotherapy is effective for established CMMRD-related cancers
      given universal MSI-high phenotype."
  - source_id: SRC-WIMMER-CMMRD-2014
    position: supports
    relevant_quote_paraphrase: >-
      "C4CMMRD Consortium 3-point clinical scoring system for diagnosis
      of biallelic mismatch repair deficiency syndrome; molecular workup
      includes germline MLH1/MSH2/MSH6/PMS2 sequencing + microsatellite
      instability assessment of constitutional tissue."
  - source_id: SRC-TABORI-CMMRD-2017
    position: supports
    relevant_quote_paraphrase: >-
      "C4CMMRD-aligned surveillance: brain MRI every 6 months from age 2,
      colonoscopy every 6 months from age 6, upper GI endoscopy +
      small-bowel video capsule annually from age 8, abdominal US every
      3-6 months, CBC + SPEP every 3-6 months. Anti-PD-1 immunotherapy
      effective for established CMMRD-associated cancers given universal
      MSI-high phenotype."
  - source_id: SRC-ASCO-ACMG-LYNCH-2014
    position: context

do_not_do:
  - "Не використовувати alkylating + topoisomerase-II chemotherapy якщо oncologically equivalent alternatives є — high secondary malignancy ризик у CMMRD."
  - "Не пропускати parental cascade testing — parents — Lynch monoallelic carriers, потребують Lynch surveillance."
  - "Не використовувати empiric radiation у CMMRD — secondary malignancy ризик."
  - "Не пропускати anti-PD-1 immunotherapy у established CMMRD-related cancers — universal MSI-high + high TMB phenotype."

do_not_do_en:
  - "Do not use alkylating + topoisomerase-II chemotherapy when oncologically equivalent alternatives exist — high secondary malignancy risk in CMMRD."
  - "Do not skip parental cascade testing — parents are Lynch monoallelic carriers requiring Lynch surveillance."
  - "Do not use empiric radiation in CMMRD — secondary malignancy risk."
  - "Do not skip anti-PD-1 immunotherapy in established CMMRD-related cancers — universal MSI-high + high TMB phenotype."

known_controversies:
  - topic: "Brain MRI screening frequency from age 2 to adulthood"
    positions:
      - position: "Every 6 months lifelong"
        rationale: "C4CMMRD 2014 + Tabori 2017 high-grade glioma risk lifelong."
      - position: "Frequency reduction post-age-25 if no event"
        rationale: "Cumulative scan burden + sedation in younger children; risk plateaus after adolescence in some cohorts."
    our_default: "q6mo through age 25, then individualised q12mo."
    rationale: "C4CMMRD-aligned pediatric phase; pragmatic adult phase."

