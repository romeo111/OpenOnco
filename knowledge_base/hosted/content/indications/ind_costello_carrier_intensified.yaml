rationale: >
  Aggressive-observation alternative track for confirmed Costello
  syndrome carriers, presented for HCP shared-decision-making alongside
  the standard Gripp / CSF-Network q3-6mo schedule. Specialist RASopathy
  centers occasionally adopt the following intensified protocol when
  family preference + access permit:

  **(1) Abdominal and pelvic ultrasound q2-3 months from infancy
  through age 8** — tightens the cadence in the peak embryonal-RMS
  window. Then q6mo through age 12 (rather than stopping at age 10) —
  covers occasional late-childhood embryonal-RMS reports.

  **(2) Adjunctive whole-body MRI q12mo from age 3 through age 10 at
  centers experienced in pediatric WB-MRI** — extrapolated from
  Li-Fraumeni Toronto Protocol logic. Broadens screening field to
  occult sites missed by abdominal US (paraspinal, retroperitoneal,
  proximal extremity). Evidence base specifically in CS is anecdotal;
  RASopathy-class extrapolation is plausible but not validated.

  **(3) Bladder-TCC surveillance starts age 8 (rather than 10) and
  adopts urine cytology q6mo + bladder US q12mo through adolescence,
  then q12mo cytology + q24mo bladder US lifelong** — earlier and
  tighter than standard, motivated by case reports of mid-teen TCC
  presentations in CS.

  **(4) Soft-tissue palpation + skin survey q6mo lifelong** — CS
  individuals develop multiple papillomas and rarely cutaneous SCC; the
  intensified track formalizes this into a dermatology touchpoint.

  **Rationale for offering this alternative:** the embryonal-tumor
  incidence in CS is sufficiently high (~6-15%) that some specialist
  centers and families prefer the higher-burden intensified track
  despite the modest incremental evidence for marginal early-detection
  benefit. The trade-off is parental anxiety, sedation exposure
  (pediatric WB-MRI), and incidental-finding management. CHARTER §11 —
  aggressive intervention requires shared decision-making between
  pediatric oncologist, pediatric cardiologist, genetic counselor, and
  family.

  **Routing intent:** prevention-time HCP-mediated counseling
  alternative to the standard track, NOT a treatment recommendation.

rationale_ua: >
  Альтернативно-трекова Indication для підтверджених носіїв синдрому
  Костелло, представлена для HCP shared-decision-making поряд зі
  стандартним Gripp / CSF-Network q3-6mo графіком. Спеціалізовані
  RASopathy центри інколи приймають такий інтенсифікований протокол:

  **(1) Абдомінальне та тазове УЗД q2-3 місяців з раннього дитинства
  до 8 років** — звужує cadence у пікове вікно embryonal RMS. Потім
  q6mo до 12 років (замість зупинки в 10) — покриває occasional
  late-childhood embryonal-RMS reports.

  **(2) Допоміжне whole-body MRI q12mo з 3 до 10 років** у центрах із
  досвідом педіатричного WB-MRI — екстраполяція з Li-Fraumeni Toronto
  Protocol. Розширює поле screening на occult sites, які пропускає
  абдомінальне УЗД.

  **(3) Bladder-TCC surveillance починається з 8 років** (замість 10)
  з q6mo цитологія сечі + q12mo УЗД сечового міхура у підлітковому
  віці, потім q12mo цитологія + q24mo УЗД довічно.

  **(4) Soft-tissue palpation + dermatology огляд q6mo довічно** —
  носії CS розвивають численні папіломи та рідко cutaneous SCC.

  **Обґрунтування:** ризик embryonal-tumor у CS достатньо високий
  (~6-15%), щоб деякі центри / сім'ї надавали перевагу
  higher-burden intensified track. Trade-off — батьківська тривога,
  sedation exposure, incidental findings. CHARTER §11 — aggressive
  intervention потребує shared decision-making.

  **Маршрутизація:** prevention-time альтернатива стандартному треку,
  НЕ лікувальна рекомендація.

