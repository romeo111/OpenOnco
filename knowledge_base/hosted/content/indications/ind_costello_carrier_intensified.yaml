do_not_do:
  - "Не приймати q2-3 тижневий cadence без access to pediatric-experienced radiology та сім'ї, готової до високої частоти візитів."
  - "Не призначати pediatric WB-MRI у центрі без задокументованого досвіду — false-positives у RASopathy ведуть до інвазивних follow-ups."
  - "Не починати bladder-TCC surveillance до 8 років навіть в aggressive track — доказова база для presentations <8 років надзвичайно тонка."
  - "Не пропускати координацію з педіатричною кардіологією при cs-related sedation чи anesthesia events — кардіальна комплекс CS вимагає переадаптації."

do_not_do_en:
  - "Do not adopt the q2-3 week cadence without pediatric-experienced radiology access and a family prepared for high visit frequency."
  - "Do not order pediatric WB-MRI at a center without documented experience — false positives in a RASopathy carrier lead to invasive follow-ups."
  - "Do not initiate bladder-TCC surveillance before age 8 even in the aggressive track — the evidence base for presentations below age 8 is exceedingly thin."
  - "Do not skip coordination with pediatric cardiology for any CS-related sedation or anesthesia event — the CS cardiac substrate requires preprocedural adaptation."

