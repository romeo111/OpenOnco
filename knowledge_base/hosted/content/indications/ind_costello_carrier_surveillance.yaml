do_not_do:
  - "Не пропускати q3mo cadence у дитинстві ≤8 років — пік захворюваності embryonal RMS у Costello, інтервал детекції критичний."
  - "Не починати bladder TCC surveillance до 10 років — низька діагностична ефективність, висока anxiety-cost."
  - "Не використовувати рутинне CT як screening-модальність — кумулятивна радіація у RASopathy-карієра не виправдана; УЗД / МРТ переважні."
  - "Не плутати cancer-prevention з cardiac-comorbidity pathway — вони ведуться окремими спеціалістами і не повинні зливатися у єдиний chart entry."

do_not_do_en:
  - "Do not skip the q3mo cadence during childhood ≤8 — peak embryonal RMS incidence in Costello means the detection interval is critical."
  - "Do not initiate bladder TCC surveillance before age 10 — yield is low and anxiety cost is high."
  - "Do not use routine CT as a screening modality — cumulative radiation in a RASopathy carrier is unjustified; prefer ultrasound / MRI."
  - "Do not conflate cancer-prevention with the cardiac-comorbidity pathway — they are managed by separate specialists and should not collapse into a single chart entry."

