rationale: >
  Standard-track surveillance for confirmed HRAS / Costello syndrome
  carriers per the 2008 / 2018 Costello Syndrome Family Network and
  Gripp-Lin clinical management consensus (Gripp et al., AJMG)
  combined with AACR Childhood Cancer Predisposition Workshop guidance
  for the RASopathy bucket (Villani et al. 2017 / Schultz et al. 2017).

  **(1) Abdominal and pelvic ultrasound every 3-6 months from infancy
  through age 8-10** — primary target is embryonal rhabdomyosarcoma
  (genitourinary / pelvic / abdominal sites predominate in CS),
  neuroblastoma, and Wilms tumor (lower probability than embryonal RMS
  in CS but still elevated above baseline). The q3-6mo cadence
  represents a compromise between detection yield and burden in a child
  with the underlying CS comorbidity load. q3mo preferred in early
  childhood (peak embryonal-RMS incidence), tapering to q6mo as the
  child approaches age 8-10.

  **(2) Urine cytology and bladder ultrasound annually from age 10
  lifelong** — bladder transitional cell carcinoma (TCC) emerges in
  adolescence and adult life in CS. TCC presentation in CS is often
  earlier than in the general population (some cases reported in mid-
  teens). Urine cytology is the inexpensive entry-level screen; bladder
  US confirms / characterizes any sediment finding.

  **(3) Cardiac surveillance is parallel, not part of this Indication:**
  hypertrophic cardiomyopathy and atrial arrhythmias are CS comorbidities
  and the leading cause of non-cancer mortality, but they are managed
  by pediatric cardiology under a separate care pathway. This Indication
  scope is the cancer-prevention component only.

  **(4) Avoid unnecessary ionizing radiation:** CS individuals have a
  general RASopathy-class concern about radiation sensitivity (not as
  documented as in LFS, but parsimony principle applies). Prefer
  ultrasound / MRI when feasible; reserve CT for diagnostic indication
  rather than screening.

  **Routing intent:** prevention-time HCP-mediated counseling for the
  family of a child with confirmed Costello syndrome. Cancer-specific
  treatment Indications are not recommended at this stage — the
  intervention here is structured early detection plus cardiac
  comorbidity referral.

rationale_ua: >
  Стандартний-трек спостереження для підтверджених носіїв HRAS /
  синдрому Костелло per Gripp et al. (Costello Syndrome Family Network
  consensus) та AACR Childhood Cancer Predisposition Workshop (Villani
  et al. 2017 / Schultz et al. 2017) для RASopathy.

  **(1) Абдомінальне та тазове УЗД кожні 3-6 місяців з раннього
  дитинства до 8-10 років** — основна ціль: ембріональна
  рабдоміосаркома (генітоуринарні / тазові / абдомінальні локалізації
  переважають у CS), нейробластома, пухлина Вілмса. q3mo переважно у
  ранньому дитинстві (пік захворюваності embryonal RMS), переходячи на
  q6mo до 8-10 років.

  **(2) Цитологія сечі та УЗД сечового міхура щорічно з 10 років
  довічно** — перехідноклітинна карцинома сечового міхура (TCC)
  з'являється у підлітковому та дорослому віці у CS. Презентація TCC у
  CS часто раніше, ніж у загальній популяції (деякі випадки в
  середньому підлітковому віці).

  **(3) Кардіальне спостереження — паралельний шлях:** гіпертрофічна
  кардіоміопатія та передсердні аритмії — провідна причина
  не-онкологічної смертності, але керуються педіатричною кардіологією
  під окремим планом. Ця Indication охоплює лише cancer-prevention
  компоненту.

  **(4) Уникати непотрібного іонізуючого опромінення:** клас RASopathy
  має загальну стурбованість radiation sensitivity. Перевагу — УЗД /
  МРТ.

  **Маршрутизація:** prevention-time консультація сім'ї дитини з
  підтвердженим синдромом Костелло. Лікувальні Indications на цьому
  етапі не рекомендуються.

