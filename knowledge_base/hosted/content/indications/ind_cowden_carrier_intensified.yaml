rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-COWDEN-CARRIER-SURVEILLANCE standard protocol with two
  intensification options.

  **Foundation:** All standard surveillance from IND-COWDEN-CARRIER-
  SURVEILLANCE applies (breast MRI + mammography annually from 30,
  annual thyroid US, endometrial sampling / TVUS from 35-40, colonoscopy
  from 35, annual dermatology, renal US / MRI from 40).

  **Intensification 1 — Risk-reducing bilateral mastectomy (women,
  post-childbearing):** Bilateral mastectomy with or without immediate
  reconstruction reduces breast cancer incidence in PTEN carriers to
  near-zero (NCCN Category 2A). Shared-decision-making must cover:
    - Surgical risk (anesthesia, infection, reconstruction-specific
      complications)
    - Psychological impact (body-image, sensation loss, sexual function)
    - Reconstructive options (implant vs autologous; immediate vs
      delayed; nipple-sparing eligibility)
    - Alternative: continued annual breast MRI + mammography surveillance
      with explicit framing of cumulative interval-cancer risk vs
      surgical morbidity
    - Fertility / breastfeeding planning (must precede surgery)

  **Intensification 2 — Risk-reducing hysterectomy + BSO
  (post-childbearing):** Reduces endometrial cancer incidence to
  near-zero. Cowden ovarian cancer risk is modest (not BRCA-level), so
  BSO addresses a smaller absolute risk than in BRCA carriers — but
  combined hysterectomy + BSO is the standard surgical package when
  hysterectomy is undertaken. Shared-decision-making must cover:
    - Surgical risk
    - Surgical menopause sequelae (vasomotor symptoms, bone density,
      cardiovascular) — managed with HRT when not contraindicated;
      HRT in Cowden post-BSO is generally appropriate (PTEN-driven
      breast cancer risk is not exclusively hormone-driven in the way
      BRCA-related breast cancer is)
    - Fertility planning (must precede surgery)
    - Alternative: continued endometrial sampling + TVUS surveillance

  **Other intensification considerations (not core to this track):**
    - mTOR-pathway chemoprevention (rapalogs) is investigational — do
      NOT prescribe outside trial.
    - Pediatric prophylactic thyroidectomy is NOT standard (Cowden
      thyroid cancer is most often slow-growing follicular-variant
      papillary; surveillance suffices in most kindreds).

  **Cascade testing remains continuous:** every visit re-confirms
  family testing status.

  Per CHARTER §11: prophylactic surgery and chemoprevention are
  shared-decision-making domains. Patient autonomy is paramount;
  neither intervention is mandated, and continued surveillance from
  IND-COWDEN-CARRIER-SURVEILLANCE remains the floor.

rationale_ua: >
  Агресивний трек для підтверджених носіїв мутації, що надбудовується
  над стандартним протоколом IND-COWDEN-CARRIER-SURVEILLANCE і додає
  два варіанти інтенсифікації.

  **Основа:** Застосовується усе стандартне спостереження з
  IND-COWDEN-CARRIER-SURVEILLANCE (МРТ молочних залоз + мамографія
  щорічно з 30 років, щорічне УЗД щитоподібної залози, ендометріальна
  біопсія / трансвагінальне УЗД з 35-40 років, колоноскопія з 35 років,
  щорічний огляд дерматолога, УЗД / МРТ нирок з 40 років).

  **Інтенсифікація 1 — профілактична двобічна мастектомія (жінки,
  після завершення дітонародження):** Двобічна мастектомія з негайною
  реконструкцією або без неї знижує захворюваність на рак молочної
  залози у носіїв мутації PTEN практично до нуля (категорія 2A NCCN).
  Спільне ухвалення рішення має охоплювати:
    - хірургічний ризик (анестезія, інфекція, ускладнення, специфічні
      для реконструкції);
    - психологічний вплив (образ тіла, втрата чутливості, сексуальна
      функція);
    - варіанти реконструкції (імплант проти автологічної тканини;
      негайна проти відстроченої; можливість збереження соска);
    - альтернативу: продовження щорічного спостереження (МРТ молочних
      залоз + мамографія) з чітким роз'ясненням кумулятивного ризику
      інтервального раку порівняно з хірургічною захворюваністю;
    - планування фертильності / грудного вигодовування (має передувати
      операції).

  **Інтенсифікація 2 — профілактична гістеректомія + двобічна
  сальпінго-оофоректомія (після завершення дітонародження):** Знижує
  захворюваність на рак ендометрія практично до нуля. Ризик раку
  яєчників при синдромі Коудена помірний (не на рівні BRCA), тому
  оофоректомія усуває менший абсолютний ризик, ніж у носіїв BRCA —
  але поєднання гістеректомії з оофоректомією є стандартним хірургічним
  обсягом, коли гістеректомія виконується. Спільне ухвалення рішення
  має охоплювати:
    - хірургічний ризик;
    - наслідки хірургічної менопаузи (вазомоторні симптоми, щільність
      кісткової тканини, серцево-судинні наслідки) — коригуються
      замісною гормональною терапією (ЗГТ) за відсутності протипоказань;
      ЗГТ після оофоректомії при синдромі Коудена загалом є доцільною
      (ризик раку молочної залози, зумовлений PTEN, не є виключно
      гормонозалежним на відміну від BRCA-асоційованого раку молочної
      залози);
    - планування фертильності (має передувати операції);
    - альтернативу: продовження ендометріальної біопсії + трансвагінального
      УЗД.

  **Інші аспекти інтенсифікації (не є основними для цього треку):**
    - хіміопрофілактика за mTOR-шляхом (рапалоги) — на стадії
      дослідження; НЕ призначати поза межами клінічного дослідження;
    - профілактична тиреоїдектомія у дітей НЕ є стандартом (рак
      щитоподібної залози при синдромі Коудена зазвичай повільно
      прогресуючий фолікулярний варіант папілярного раку;
      спостереження є достатнім у більшості родин).

  **Каскадне тестування залишається безперервним:** статус тестування
  родини повторно підтверджується на кожному візиті.

  За CHARTER §11: профілактична хірургія та хіміопрофілактика належать
  до сфери спільного ухвалення рішень. Пріоритетна автономія пацієнта;
  жодне з втручань не є обов'язковим, а продовження спостереження за
  IND-COWDEN-CARRIER-SURVEILLANCE залишається мінімальним стандартом.

