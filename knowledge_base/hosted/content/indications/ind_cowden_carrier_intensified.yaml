do_not_do:
  - "Не презентувати профілактичну хірургію як обов'язкову — рішення ухвалюється спільно з пацієнтом, з повним обговоренням альтернативи продовження спостереження."
  - "Не пропонувати профілактичну хірургію без обговорення планування фертильності / грудного вигодовування та ведення наслідків менопаузи — ЗГТ після профілактичної оофоректомії при синдромі Коудена, як правило, доцільна."
  - "Не застосовувати хіміопрофілактику за mTOR-шляхом (рапалоги) поза клінічним дослідженням — наразі це експериментальний підхід."
  - "Не виконувати профілактичну тиреоїдектомію у дітей — рак щитоподібної залози при синдромі Коудена переважно повільно прогресуючий фолікулярний варіант; спостереження є достатнім."
  - "Не пропускати повторне обговорення варіантів інтенсифікації з пацієнтами, чия початкова відмова була мотивована тривогою."

do_not_do_en:
  - "Do not present risk-reducing surgery as mandatory — shared-decision-making with full discussion of continued surveillance alternative."
  - "Do not offer risk-reducing surgery without fertility / breastfeeding planning and menopausal-sequelae management discussion — HRT post-RRSO in Cowden is generally appropriate."
  - "Do not use mTOR-pathway chemoprevention (rapalogs) outside a clinical trial — currently investigational."
  - "Do not perform pediatric prophylactic thyroidectomy — Cowden thyroid cancer is predominantly slow-growing follicular-variant; surveillance suffices."
  - "Do not skip re-discussion of intensification options with patients whose initial decline was motivated by anxiety."

