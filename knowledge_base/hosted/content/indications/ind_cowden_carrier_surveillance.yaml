do_not_do:
  - "Не використовувати лише мамографію у носія PTEN — поєднання МРТ і мамографії має вищу чутливість для агресивних підтипів з раннім початком."
  - "Не пропускати УЗД щитоподібної залози в дітей — багатовузловий зоб при синдромі Cowden трапляється майже завжди; фолікулярний варіант папілярного раку щитоподібної залози може виявлятися в дитячому віці в окремих родинах."
  - "Не використовувати КТ як основний метод спостереження за нирками — кумулятивне променеве навантаження протягом життя; перевага надається МРТ."
  - "Не виконувати емпіричну профілактичну мастектомію без спільного прийняття рішення з обговоренням альтернатив (продовження спостереження, планування дітонародження, реконструкція після мастектомії)."
  - "Не пропускати каскадне тестування родичів першого ступеня спорідненості — кожен візит має документувати статус тестування в сім'ї."

do_not_do_en:
  - "Do not use mammography alone in a PTEN carrier — combined MRI + mammography has superior sensitivity for early-onset aggressive subtypes."
  - "Do not skip pediatric thyroid US — Cowden multinodular goiter is near-universal and follicular-variant papillary thyroid cancer presents in childhood in some kindreds."
  - "Do not use CT as the primary renal surveillance modality — lifelong cumulative radiation burden; MRI preferred."
  - "Do not perform empirical risk-reducing mastectomy without shared-decision-making covering options (continued surveillance, fertility planning, post-mastectomy reconstruction)."
  - "Do not skip cascade testing of first-degree relatives — every surveillance visit should document family testing status."

