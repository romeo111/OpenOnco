rationale: >
  Standard-track confirmed-carrier surveillance pathway for PTEN-positive
  carriers per NCCN Genetic / Familial High-Risk: Breast, Ovarian,
  Pancreatic.

  **Breast (women, ~85% lifetime risk):** Annual mammography + breast
  MRI starting age 30 (or 5-10 years before earliest family case).
  Clinical breast exam q6mo. Self-exam education. Risk-reducing
  mastectomy discussion is the INTENSIFIED-track option, not surfaced
  as standard-protocol routine.

  **Endometrial (women, ~28% lifetime):** Annual endometrial sampling
  + TVUS starting age 35-40 (NCCN protocol; evidence base modest but
  recommended). Patient education on abnormal uterine bleeding — early
  presentation is the strongest factor in mortality reduction.

  **Thyroid (~35% lifetime, follicular > papillary > Hürthle):** Annual
  thyroid US from time of diagnosis (childhood-onset surveillance is
  appropriate given near-universal multinodular goiter and the
  follicular-variant predominance). Calcitonin testing NOT routine —
  Cowden is not associated with medullary thyroid carcinoma.

  **Renal (~34% lifetime, papillary / chromophobe predominant):** Annual
  renal US or MRI starting age 40; cross-sectional imaging (MRI)
  preferred over CT for cumulative-radiation reasons. Functional renal
  testing (eGFR, urinalysis) annually.

  **Colorectal (~9% lifetime):** Colonoscopy starting age 35 (or 5-10
  years before earliest family case); interval q2-5y depending on
  polyp burden — ganglioneuromatous and hyperplastic polyps are
  near-universal but the adenoma fraction is modest, so surveillance
  interval can be less intense than Lynch / FAP carriers.

  **Skin (Cowden-typical mucocutaneous papules, trichilemmomas, acral
  keratoses; melanoma ~6% lifetime):** Annual dermatology examination.

  **Cascade testing:** Mandates offer to all first-degree relatives;
  pediatric testing for at-risk children appropriate given the
  childhood-onset thyroid surveillance window.

  Per CHARTER §11 patient-autonomy framing: surveillance intervals are
  shared-decision-making.

rationale_ua: >
  Стандартний-трек шлях спостереження для підтверджених носіїв PTEN
  за настановою NCCN Genetic/Familial High-Risk: Breast, Ovarian,
  Pancreatic.

  **Молочна залоза (жінки, довічний ризик ~85%):** Щорічна мамографія
  + МРТ грудей з 30 років (або за 5-10 років до наймолодшого випадку
  в сім'ї). Клінічний огляд грудей кожні 6 місяців. Навчання
  самообстеженню. Обговорення профілактичної мастектомії належить до
  ІНТЕНСИФІКОВАНОГО треку і не є рутинною частиною стандартного
  протоколу.

  **Ендометрій (жінки, довічний ризик ~28%):** Щорічна біопсія
  ендометрію + трансвагінальне УЗД з 35-40 років (протокол NCCN;
  доказова база помірна, але рекомендація зберігається). Навчання
  пацієнтки щодо аномальної маткової кровотечі — раннє звернення є
  найвагомішим фактором зниження смертності.

  **Щитоподібна залоза (довічний ризик ~35%, переважає фолікулярний
  варіант > папілярний > Гюртле-клітинний):** Щорічне УЗД щитоподібної
  залози від моменту встановлення діагнозу (спостереження з дитячого
  віку є доцільним з огляду на майже універсальний багатовузловий зоб
  і переважання фолікулярного варіанту). Визначення кальцитоніну не є
  рутинним — синдром Cowden не асоційований з медулярним раком
  щитоподібної залози.

  **Нирки (довічний ризик ~34%, переважає папілярний / хромофобний
  тип):** Щорічне УЗД або МРТ нирок з 40 років; перевага надається
  томографічним методам (МРТ) над КТ через кумулятивне променеве
  навантаження. Щорічна оцінка функції нирок (ШКФ, аналіз сечі).

  **Колоректальний рак (довічний ризик ~9%):** Колоноскопія з 35 років
  (або за 5-10 років до наймолодшого випадку в сім'ї); інтервал 2-5
  років залежно від кількості поліпів — гангліоневроматозні та
  гіперпластичні поліпи трапляються майже завжди, тоді як частка
  аденом помірна, тому інтервал спостереження може бути менш
  інтенсивним, ніж у носіїв синдромів Лінча / FAP.

  **Шкіра (типові для Cowden слизово-шкірні папули, трихілемоми,
  акральний кератоз; довічний ризик меланоми ~6%):** Щорічний огляд
  дерматолога.

  **Каскадне тестування:** обов'язкове пропонування всім родичам
  першого ступеня спорідненості; тестування дітей з групи ризику є
  доцільним з огляду на вікно спостереження за щитоподібною залозою,
  що починається з дитинства.

  Відповідно до рамки автономії пацієнта за CHARTER §11: інтервали
  спостереження визначаються у процесі спільного прийняття рішень.

