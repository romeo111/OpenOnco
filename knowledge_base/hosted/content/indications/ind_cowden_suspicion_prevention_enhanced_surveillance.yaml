do_not_do:
  - "Не подавати посилене спостереження як еквівалент генетичного підтвердження — це не забезпечує діагностичної точності; втрачається користь каскадного тестування для родичів."
  - "Не рекомендувати профілактичну мастектомію або гістеректомію в межах емпіричного спостереження без підтвердження PTEN — ці втручання вимагають підтвердженого носійства."
  - "Не пропускати періодичне повторне обговорення генетичного тестування — більшість пацієнтів згодом погоджуються на тестування; високий ризик раку грудей при синдромі Cowden особливо мотивує до цього."
  - "Не починати щорічне МРТ грудей до 30 років у межах емпіричного спостереження без вираженого сімейного анамнезу дуже раннього раку грудей — кумулятивна вартість і частота хибнопозитивних результатів переважують користь у молодшій віковій групі."
  - "Не пропускати базове УЗД щитоподібної залози при родинній підозрі — це найдешевший і найінформативніший крок емпіричного скринінгу; патологія щитоподібної залози при синдромі Cowden часто виявляється рано і легко діагностується."
  - "Не виконувати емпіричну біопсію ендометрію за відсутності симптомів або відхилень на УЗД — це інвазивна процедура з ризиками; обмежити показання симптомами або даними УЗД у межах емпіричного спостереження."

do_not_do_en:
  - "Do not present enhanced surveillance as equivalent to genetic confirmation — diagnostic precision is absent; cascade-testing benefit for relatives is lost."
  - "Do not recommend risk-reducing mastectomy or hysterectomy in empirical surveillance without PTEN confirmation — these interventions require a confirmed carrier diagnosis."
  - "Do not skip periodic re-discussion of genetic testing — most patients eventually accept testing; the high lifetime breast-cancer risk in Cowden specifically motivates testing acceptance."
  - "Do not start annual breast MRI before age 30 in empirical surveillance without a strong family history of very-early-onset breast cancer — cumulative cost and false-positive rate outweigh benefit in the younger age bracket."
  - "Do not skip baseline thyroid US in pedigree-suspicion cases — this is the cheapest, highest-yield empirical screening step; thyroid pathology in Cowden is often early and easily detected."
  - "Do not perform empirical endometrial biopsy without symptoms or US abnormalities — this is an invasive procedure with risks; limit to symptom-driven or US-driven indications in empirical surveillance."

