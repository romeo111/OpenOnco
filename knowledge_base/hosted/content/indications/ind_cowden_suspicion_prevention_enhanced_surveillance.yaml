rationale: >
  Alternative-track companion to IND-COWDEN-SUSPICION-PREVENTION-
  GENETIC-COUNSELING. Patient with pedigree suspicion of Cowden /
  PHTS who declines genetic counseling and/or germline PTEN testing
  — for any reason (cost, insurance concerns, psychological / anxiety
  considerations, family privacy, geographic access constraints) — is
  offered empirical multi-organ surveillance applied as if Cowden
  were confirmed:

  **Breast (women):** Annual mammography starting age 30 + annual
  breast MRI (alternating Q6 months); clinical breast exam q6-12
  months. Match-confirmed-carrier protocol because breast-cancer
  surveillance has the strongest mortality-benefit evidence base in
  high-risk populations and empirical screening is well-tolerated.

  **Endometrial / uterine (women):** Annual transvaginal ultrasound
  from age 35; endometrial sampling at lower threshold than general-
  population symptoms-driven workup (e.g., any post-menopausal
  bleeding, irregular intermenstrual bleeding, abnormal US findings).
  Lower-intensity than confirmed-carrier protocol (endometrial
  sampling q1-2 years) because evidence base for empirical sampling
  is modest.

  **Thyroid:** Baseline thyroid ultrasound at pedigree-suspicion
  diagnosis (any age); annual thyroid US lifelong. Inexpensive,
  high-yield, low-burden — appropriate for empirical surveillance.

  **Colorectal:** Colonoscopy q5 years starting age 40 (lower-
  intensity than confirmed-carrier protocol starting age 35 because
  pre-test probability is lower and Cowden-CRC absolute risk is
  modest compared to Lynch / FAP).

  **Renal:** Baseline renal ultrasound at pedigree-suspicion
  diagnosis; repeat renal imaging q3-5 years thereafter. Lower-
  intensity than confirmed-carrier MRI protocol because of
  cumulative cost / burden considerations.

  **Dermatologic:** Annual dermatologic evaluation — appropriate
  for empirical surveillance because skin findings are diagnostic
  signals (presence of trichilemmomas, oral papillomas, acral
  keratoses elevates Cowden-criteria-met probability and can re-
  prompt genetic testing discussion). Plus melanoma surveillance.

  **CNS:** No routine CNS imaging unless symptoms of cerebellar
  Lhermitte-Duclos disease emerge.

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. Patients who decline testing retain
  access to surveillance benefit, with the caveat that empirical
  surveillance lacks the diagnostic precision of confirmed genetic
  status — and risk-reducing surgical decisions (mastectomy /
  hysterectomy) require genetic confirmation. Periodic re-discussion
  of testing is appropriate; the high lifetime breast-cancer risk
  (~85% in confirmed PTEN carriers) makes the testing discussion
  particularly weighty in Cowden-suspicion patients.

  Routing reconsiderations: if patient eventually accepts germline
  testing, results reroute to (a) confirmed-carrier pathway, (b)
  general-population pathway, or (c) continued pedigree-suspicion if
  VUS.

rationale_ua: >
  Альтернативний трек — супутня індикація до IND-COWDEN-SUSPICION-
  PREVENTION-GENETIC-COUNSELING. Пацієнту з родинною підозрою на
  синдром Cowden / PHTS, який відмовляється від генетичного
  консультування та/або герміногенного тестування PTEN — з будь-якої
  причини (вартість, страхові питання, психологічні аспекти /
  тривожність, конфіденційність щодо родини, географічна доступність)
  — пропонується емпіричне мультиорганне спостереження, яке
  проводиться так, ніби синдром Cowden підтверджено:

  **Молочна залоза (жінки):** Щорічна мамографія з 30 років +
  щорічне МРТ грудей (почергово, з інтервалом 6 місяців); клінічний
  огляд грудей кожні 6-12 місяців. Відповідає протоколу для
  підтверджених носіїв, оскільки спостереження за раком грудей має
  найсильнішу доказову базу щодо зниження смертності у групах
  високого ризику, а емпіричний скринінг добре переноситься.

  **Ендометрій / матка (жінки):** Щорічне трансвагінальне УЗД з 35
  років; біопсія ендометрію при нижчому порозі показань, ніж
  симптом-орієнтований підхід у загальній популяції (будь-яка
  постменопаузальна кровотеча, нерегулярна міжменструальна кровотеча,
  патологічні знахідки на УЗД). Менш інтенсивно, ніж протокол для
  підтверджених носіїв (біопсія ендометрію кожні 1-2 роки), оскільки
  доказова база для емпіричного скринінгу помірна.

  **Щитоподібна залоза:** Базове УЗД щитоподібної залози на момент
  встановлення родинної підозри (у будь-якому віці); щорічне УЗД
  щитоподібної залози довічно. Недороге, високоінформативне,
  малообтяжливе дослідження — доцільне для емпіричного спостереження.

  **Колоректальний рак:** Колоноскопія кожні 5 років з 40 років (менш
  інтенсивно, ніж протокол для підтверджених носіїв, що починається
  з 35 років, оскільки апріорна ймовірність нижча, а абсолютний ризик
  колоректального раку при синдромі Cowden помірний порівняно з
  синдромом Лінча / FAP).

  **Нирки:** Базове УЗД нирок на момент встановлення родинної
  підозри; повторна візуалізація нирок кожні 3-5 років надалі. Менш
  інтенсивно, ніж МРТ-протокол для підтверджених носіїв, з огляду на
  кумулятивну вартість і навантаження.

  **Шкіра:** Щорічний огляд дерматолога — доцільний для емпіричного
  спостереження, оскільки шкірні знахідки є діагностичними ознаками
  (наявність трихілемом, оральних папілом, акрального кератозу
  підвищує ймовірність відповідності критеріям Cowden і може стати
  приводом повернутися до обговорення генетичного тестування).
  Додатково — спостереження щодо меланоми.

  **ЦНС:** Рутинна візуалізація ЦНС не проводиться, якщо не
  з'являються симптоми мозочкової хвороби Лермітта-Дюкло.

  Відповідно до рамки автономії пацієнта за CHARTER §11: генетичне
  тестування належить до сфери спільного прийняття рішень. Пацієнти,
  які відмовляються від тестування, зберігають доступ до переваг
  спостереження, із застереженням, що емпіричне спостереження не має
  діагностичної точності підтвердженого генетичного статусу, а
  рішення про профілактичні операції (мастектомія / гістеректомія)
  вимагають генетичного підтвердження. Періодичне повторне
  обговорення тестування є доцільним; високий довічний ризик раку
  грудей (~85% у підтверджених носіїв PTEN) робить це обговорення
  особливо вагомим у пацієнтів з підозрою на Cowden.

  Маршрутизація надалі: якщо пацієнт згодом погоджується на
  герміногенне тестування, результати спрямовують до (а) шляху для
  підтверджених носіїв, (б) шляху для загальної популяції, або (в)
  продовження ведення як родинної підозри — у разі VUS.

