    relevant_quote_paraphrase: >-
      "High-risk breast cancer screening with annual mammography +
      MRI is recommended for women with PTEN pathogenic variants,
      starting at age 30."

do_not_do:
  - "Не призначати герміногенне тестування без консультування перед тестуванням — обов'язкові інформована згода та обговорення мультиорганного спостереження і можливих профілактичних операцій."
  - "Не трактувати результат VUS PTEN як патогенний — вести як родинну підозру; не розпочинати інтенсивний протокол мультиорганного спостереження на підставі VUS."
  - "Не пропускати аналіз великих делецій методом MLPA — ~10-15% патогенних варіантів PTEN є великими делеціями, які пропускаються лише секвенуванням."
  - "Не подавати негативний результат панелі як нульовий ризик — фенокопії синдрому Cowden (метилювання KLLN, SDH-асоційовані синдроми) можуть пояснювати виражений сімейний анамнез; варто розглянути окрему панель для цих станів."
  - "Не рекомендувати профілактичну мастектомію або гістеректомію без підтвердженого носійства PTEN — ці втручання вимагають підтвердженого діагнозу носія і спільного прийняття рішення щодо репродуктивних / менопаузальних наслідків."
  - "Не пропускати базове УЗД щитоподібної залози в дитячих носіїв PTEN — патологія щитоподібної залози при синдромі Cowden може виявлятися рано; важлива рання базова оцінка."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling — informed consent and discussion of multi-organ surveillance + potential risk-reducing surgeries are mandatory."
  - "Do not treat a VUS PTEN result as pathogenic — manage as pedigree suspicion; do not initiate intensive multi-organ surveillance based on a VUS."
  - "Do not skip MLPA / large-deletion analysis — ~10-15% of pathogenic PTEN variants are large deletions missed by sequencing-only testing."
  - "Do not present a negative-panel result as zero-risk — Cowden phenocopies (KLLN methylation, SDH-related syndromes) may underlie a strong family history; consider a dedicated panel."
  - "Do not recommend risk-reducing mastectomy or hysterectomy without confirmed PTEN carriage — these interventions require a confirmed carrier diagnosis and shared decision-making about reproductive / menopausal sequelae."
  - "Do not skip baseline thyroid US in pediatric PTEN carriers — thyroid pathology in Cowden can present early; early baseline assessment is important."

