rationale: >
  Standard-track prevention pathway for individuals with pedigree
  suspicion of Cowden syndrome / PTEN hamartoma tumor syndrome (PHTS).
  Three parallel referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant, variable penetrance
  particularly for the cancers — breast and thyroid penetrance high,
  endometrial and renal moderate), implications for family members
  (cascade testing if positive — siblings at 50% risk; children at
  50% risk; preimplantation genetic diagnosis available; pediatric-
  phenotype Bannayan-Riley-Ruvalcaba [BRR] variant is the childhood
  manifestation of PHTS and warrants developmental / surveillance
  considerations for affected children), insurance / GINA
  considerations, psychological aspects of multi-organ surveillance
  burden including potential risk-reducing mastectomy / hysterectomy
  discussions in confirmed carriers. Per ACMG / NCCN / ASCO guidelines,
  pre-test counseling is the standard of care before germline testing.

  **(2) Germline PTEN gene panel testing.** Modern hereditary cancer
  panels (e.g., Invitae multi-cancer panel, Color hereditary cancer
  panel, GeneDx OncoGene comprehensive) cover PTEN (full sequencing
  + large-deletion / MLPA analysis; deletions / duplications account
  for ~10-15% of PTEN pathogenic variants), plus differential genes
  for Cowden-phenocopies (KLLN — Killin promoter hypermethylation
  is associated with a Cowden-like phenotype; SDHB / SDHC / SDHD —
  hereditary paraganglioma can overlap clinically; AKT1 / PIK3CA —
  somatic-only mosaic Cowden-like presentations). Variant
  classification per ACMG framework.

  **(3) Carrier-confirmation surveillance plan (sequel pathway).**
    Positive PTEN carrier → structured multi-organ surveillance per
    NCCN Genetic/Familial High-Risk Breast Ovarian Pancreatic:
    - **Breast (women):** Annual mammography + annual breast MRI
      (offset by 6 months for alternating Q6-month imaging) starting
      age 30 (or 5-10 years before earliest breast cancer in family,
      whichever is earlier). Clinical breast exam q6-12 months.
      Discussion of risk-reducing mastectomy in shared decision-
      making (decision driven by individual risk tolerance + family
      history + reproductive plans).
    - **Endometrial / uterine:** Endometrial sampling q1-2 years
      from age 35-40, OR transvaginal ultrasound; discussion of
      risk-reducing hysterectomy post-childbearing. Evidence base
      for endometrial surveillance modest — shared decision-making.
    - **Thyroid:** Baseline thyroid ultrasound at PTEN diagnosis
      (any age including pediatric carriers); annual thyroid US
      lifelong. Predominantly follicular variant papillary thyroid
      carcinoma; multinodular goiter near-universal but mostly
      benign.
    - **Colorectal:** Colonoscopy q5 years starting age 35 (more
      frequent if polyposis demonstrated). Cowden CRC risk is
      lower than Lynch / FAP but elevated above general population.
    - **Renal:** Baseline renal MRI / US at diagnosis; surveillance
      imaging q2 years thereafter (or earlier if family history
      includes renal cancer). Predominantly papillary or
      chromophobe RCC.
    - **Dermatologic:** Annual dermatologic evaluation for
      characteristic skin lesions (trichilemmomas, acral keratoses,
      papillomatous papules) plus melanoma surveillance.
    - **CNS:** Brain MRI if symptoms suggest Lhermitte-Duclos
      (cerebellar ataxia, headache, dizziness); no routine CNS
      screening required.

  Negative result (no pathogenic / likely-pathogenic variant on a
  high-quality panel including large-deletion analysis) → re-stratify
  residual family-history risk; consider KLLN promoter methylation
  testing and SDH-related differential. VUS result → managed as
  pedigree suspicion (this Indication) until segregation analysis or
  functional studies clarify.

  Genetic counseling and germline PTEN testing are typically covered
  by insurance in the US/EU when pedigree criteria are met; in
  Ukraine, germline testing is available through private labs at
  out-of-pocket cost (~5000-15000 UAH for multi-gene panel).

rationale_ua: >
  Стандартний-трек шлях профілактики для осіб з родинною підозрою на
  синдром Cowden / PTEN hamartoma tumor syndrome (PHTS). Три
  паралельні напрямки скерування:

  **(1) Скерування на генетичне консультування.** Консультування
  перед тестуванням охоплює: тип успадкування (аутосомно-домінантний,
  варіабельна пенетрантність — особливо щодо онкологічних ризиків:
  пенетрантність висока для раку грудей і щитоподібної залози,
  помірна для ендометрія і нирок), наслідки для членів родини
  (каскадне тестування у разі позитивного результату — сибси з
  ризиком 50%, діти з ризиком 50%; доступна передімплантаційна
  генетична діагностика; педіатричний фенотип Bannayan-Riley-Ruvalcaba
  [BRR] є дитячим проявом PHTS і потребує врахування питань розвитку
  та спостереження для уражених дітей), страхові аспекти / GINA,
  психологічні аспекти тягаря мультиорганного спостереження, включно
  з можливими майбутніми обговореннями профілактичної мастектомії /
  гістеректомії у підтверджених носіїв. Відповідно до настанов ACMG /
  NCCN / ASCO, консультування перед тестуванням є стандартом надання
  допомоги перед герміногенним тестуванням.

  **(2) Герміногенне панельне тестування PTEN.** Сучасні панелі для
  спадкових онкологічних синдромів (наприклад, Invitae multi-cancer
  panel, Color hereditary cancer panel, GeneDx OncoGene comprehensive)
  охоплюють ген PTEN (повне секвенування + виявлення великих делецій
  методом MLPA; великі делеції/дуплікації становлять ~10-15%
  патогенних варіантів PTEN), а також гени для диференціації
  Cowden-подібних фенокопій (KLLN — гіперметилювання промотора Killin
  асоційоване з Cowden-подібним фенотипом; SDHB / SDHC / SDHD —
  спадкова параганглиома може клінічно перетинатися; AKT1 / PIK3CA —
  виключно соматичні мозаїчні Cowden-подібні прояви). Класифікація
  варіантів — за критеріями ACMG.

  **(3) План спостереження за підтвердженими носіями (наступний
  етап).** Позитивний результат тестування на носійство PTEN →
  структуроване мультиорганне спостереження за настановою NCCN
  Genetic/Familial High-Risk Breast Ovarian Pancreatic:
    - **Молочна залоза (жінки):** Щорічна мамографія + щорічне МРТ
      грудей (зі зсувом на 6 місяців для почергового обстеження кожні
      6 місяців) з 30 років (або за 5-10 років до наймолодшого
      випадку раку грудей у сім'ї, залежно від того, що настає
      раніше). Клінічний огляд грудей кожні 6-12 місяців. Обговорення
      профілактичної мастектомії в межах спільного прийняття рішення
      (з урахуванням індивідуальної толерантності до ризику,
      сімейного анамнезу та репродуктивних планів).
    - **Ендометрій / матка:** Біопсія ендометрію кожні 1-2 роки з
      35-40 років, АБО трансвагінальне УЗД; обговорення профілактичної
      гістеректомії після завершення дітонародження. Доказова база
      для спостереження за ендометрієм помірна — рішення приймається
      спільно.
    - **Щитоподібна залоза:** Базове УЗД щитоподібної залози на
      момент встановлення діагнозу PTEN (у будь-якому віці, включно
      з педіатричними носіями); щорічне УЗД щитоподібної залози
      довічно. Переважає фолікулярний варіант папілярного раку
      щитоподібної залози; багатовузловий зоб трапляється майже
      завжди, але здебільшого доброякісний.
    - **Колоректальний рак:** Колоноскопія кожні 5 років з 35 років
      (частіше за наявності поліпозу). Ризик колоректального раку при
      синдромі Cowden нижчий, ніж при синдромі Лінча / FAP, але вищий,
      ніж у загальній популяції.
    - **Нирки:** Базове МРТ/УЗД нирок на момент встановлення діагнозу;
      повторна візуалізація кожні 2 роки надалі (або раніше за
      наявності випадків раку нирки в родині). Переважає папілярний
      або хромофобний рак нирки.
    - **Шкіра:** Щорічний огляд дерматолога для виявлення характерних
      шкірних уражень (трихілемоми, акральний кератоз, папіломатозні
      папули), а також спостереження щодо меланоми.
    - **ЦНС:** МРТ головного мозку за наявності симптомів, що вказують
      на хворобу Лермітта-Дюкло (мозочкова атаксія, головний біль,
      запаморочення); рутинний скринінг ЦНС не показаний.

  Негативний результат (відсутність патогенного / ймовірно
  патогенного варіанту за якісною панеллю, що включає аналіз великих
  делецій) → повторна стратифікація залишкового сімейного ризику;
  рекомендовано розглянути тестування метилювання промотора KLLN та
  диференціальну діагностику SDH-асоційованих синдромів. Результат
  VUS → ведення як родинної підозри (ця індикація) до отримання
  результатів сегрегаційного аналізу або функціональних досліджень.

  Генетичне консультування та герміногенне PTEN-тестування зазвичай
  покриваються страхуванням у США/ЄС за відповідності родинним
  критеріям; в Україні герміногенне тестування доступне через
  приватні лабораторії за власний кошт (~5000-15000 грн за
  мультигенну панель).

