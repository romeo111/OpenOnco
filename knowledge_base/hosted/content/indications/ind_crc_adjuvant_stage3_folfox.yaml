rationale: >
  MOSAIC trial established FOLFOX over 5-FU/LV for stage III adjuvant.
  IDEA pooled analysis: 3 mo non-inferior to 6 mo for low-risk (T1-3 N1)
  with much less neuropathy — duration is a clinical decision based on
  T/N substage and patient preference.

rationale_ua: >
  Дослідження MOSAIC встановило перевагу FOLFOX над 5-FU/LV для ад'ювантної терапії стадії
  III. Об'єднаний аналіз IDEA: 3 місяці не поступаються 6 місяцям для T1-3 N1 (низький
  ризик), із суттєво нижчою нейропатією — тривалість є клінічним рішенням, що ґрунтується
  на T/N-підстадії та уподобаннях пацієнта. Тривалість: T1-3 N1 (низький ризик) = 3
  місяці; T4/N2 = 6 місяців. 8 циклів FOLFOX кожні 2 тижні (16 тижнів = 4 місяці) для
  T1-3 N1; 12 циклів (24 тижні) для T4 або N2 (високий ризик). Дозолімітуюча токсичність:
  периферична сенсорна нейропатія (специфічна для класу оксаліплатину (oxaliplatin),
  кумулятивна) — припинити введення оксаліплатину при стійкій нейропатії ступеня ≥2; за
  можливості продовжити 5-фторурацил + лейковорин для максимального ад'ювантного ефекту.
  MSI-H у стадії III: ад'ювантна хіміотерапія покращує загальну виживаність (дослідження
  MOSAIC) — продовжувати FOLFOX незалежно від MSI-статусу у стадії III.
