do_not_do:
  - "Не відкладати ад'ювантну терапію більш ніж на 8 тижнів після операції, якщо цього можна уникнути — надалі ефективність знижується."
  - "Не продовжувати введення оксаліплатину (oxaliplatin) після появи функціональної нейропатії ступеня 2 — перейти на монотерапію 5-FU/LV."
  - "Не додавати бевацизумаб (bevacizumab) в ад'ювантному режимі — дослідження NSABP C-08 дало негативний результат, це НЕ є стандартом."

do_not_do_en:
  - "Do NOT delay adjuvant beyond 8 weeks post-surgery if avoidable — diminishing benefit thereafter"
  - "Do NOT continue oxaliplatin past Grade 2 functional neuropathy — switch to 5-FU/LV alone"
  - "Do NOT add bevacizumab in adjuvant — NSABP C-08 negative, NOT a standard"
last_reviewed: "2026-04-26"
notes: "Standard stage III adjuvant. Decision on duration (3 vs 6 mo) per IDEA risk grouping."
