id: IND-CRC-METASTATIC-2L-MSI-H-PEMBRO
plan_track: aggressive

applicable_to:
  disease_id: DIS-CRC
  line_of_therapy: 2
  stage_requirements:
    - "Stage IV metastatic mCRC"
    - "Disease progression on 1L chemo (FOLFOX / FOLFIRI ± biologic) where MSI-H was missed at baseline OR pembrolizumab was unavailable in 1L"
  biomarker_requirements_required:
    - biomarker_id: BIO-MSI-STATUS
      required: true
      value_constraint: "MSI-H or dMMR (treatment-defining; supersedes other 2L choices)"
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

recommended_regimen: REG-PEMBROLIZUMAB-MSI-MONO
concurrent_therapy: []
followed_by: []

evidence_level: high
strength_of_recommendation: strong
nccn_category: "1"

expected_outcomes:
  overall_response_rate: "~33% (KEYNOTE-164 cohort A, 2L+ MSI-H mCRC)"
  complete_response: "~6%"
  progression_free_survival: "Median PFS 4.1 mo cohort A; 24-mo PFS rate ~33% (sustained plateau)"
  overall_survival_5y: "Median OS 31.4 mo cohort A; 5-yr OS estimate ~30% (KEYNOTE-164 pooled)"

hard_contraindications:
  - CI-PEMBROLIZUMAB-AUTOIMMUNE
red_flags_triggering_alternative: [RF-ACTIVE-AUTOIMMUNE-DISEASE-ICI-RISK]

required_tests:
  - TEST-MSI-PCR-OR-NGS
  - TEST-DMMR-IHC
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-CEA
  - TEST-CT-CHEST-ABDOMEN-PELVIS
desired_tests: []

rationale: >
  Pembrolizumab monotherapy for MSI-H/dMMR mCRC in 2L+ when MSI-H was
  missed at baseline OR pembrolizumab was unavailable in 1L. KEYNOTE-164
  established durable activity in chemo-refractory MSI-H mCRC (ORR ~33%,
  durable plateau ~30% PFS at 2 years). KEYNOTE-177 cemented 1L position;
  KEYNOTE-164 supports 2L+. Treatment-defining biomarker — supersedes
  RAS/BRAF/HER2 algorithm. NCCN Cat 1, ESCAT IA. UA access barrier:
  pembrolizumab not NSZU-reimbursed for CRC; charitable / clinical-trial
  pathways apply.

rationale_ua: >
  Пембролізумаб (pembrolizumab) у монотерапії для MSI-H/dMMR мКРТ у 2L+, коли MSI-H
  пропущено при базовому тестуванні або пембролізумаб недоступний у 1L.
  KEYNOTE-164 встановив тривалу активність при хіміо-рефрактерному MSI-H мКРТ
  (ЧЗВ ~33%, стійке плато ~30% ВБП через 2 роки). KEYNOTE-177 закріпив позицію 1L;
  KEYNOTE-164 підтримує 2L+. Це біомаркер, що визначає тактику лікування, — він має
  пріоритет над алгоритмом RAS/BRAF/HER2. NCCN Категорія 1, ESCAT IA. Бар'єр доступу
  в Україні: пембролізумаб не НСЗУ-рефундований для КРТ; благодійні / клінічні-дослідницькі шляхи.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_06
draft_revision: 3

sources:
  - source_id: SRC-NCCN-COLON-2025
    position: supports
    relevant_quote_paraphrase: "Pembrolizumab is preferred 2L+ for MSI-H/dMMR mCRC in patients who did not receive prior PD-1 inhibitor (KEYNOTE-164); Cat 1"
  - source_id: SRC-ESMO-COLON-2024
    position: supports
    relevant_quote_paraphrase: "Anti-PD-1 monotherapy is the standard of care for MSI-H/dMMR mCRC across lines; KEYNOTE-177 (1L) and KEYNOTE-164 (2L+) provide level I evidence"

  - source_id: SRC-KEYNOTE-177-ANDRE-2020
    position: supports
    relevant_quote_paraphrase: KEYNOTE-177 trial — see referenced publication for primary outcome data.
  - source_id: SRC-KEYNOTE-164-LE-2020
    position: supports
    relevant_quote_paraphrase: KEYNOTE-164 trial — see referenced publication for primary outcome data.
known_controversies:
  - topic: "Pembrolizumab vs nivolumab+ipilimumab for 2L+ MSI-H mCRC"
    positions:
      - position: "Pembrolizumab monotherapy: better tolerability; KEYNOTE-164 / KEYNOTE-177 mature data"
        sources: [SRC-NCCN-COLON-2025]
      - position: "Nivolumab + ipilimumab (CheckMate-142): higher ORR (~58%) but higher irAE burden"
        sources: [SRC-NCCN-COLON-2025]
        evidence_note: "CheckMate-142 supports doublet ICI but at cost of immune-related toxicity; CheckMate-8HW (1L doublet) emerging"
    our_default: "Pembrolizumab monotherapy as default; doublet ICI reserved for fit patients with high disease burden after MDT discussion"
    rationale: "Tolerability + access drives default; doublet ICI option not currently NSZU-pathway-supported"

do_not_do:
  - "НЕ призначати без верифікованого статусу MSI-H/dMMR — хибнопозитивний результат MSI може спричинити гіперпрогресування."
  - "НЕ продовжувати пембролізумаб при irAE Grade 3+ без консультації спеціаліста + поступового зниження дози стероїдів."
  - "НЕ комбінувати з хронічними високодозовими кортикостероїдами — фармакодинамічне послаблення ефекту ICI."
  - "НЕ призначати при активному аутоімунному захворюванні без МДК за участю ревматолога / ендокринолога."
  - "НЕ припиняти терапію при псевдопрогресії пухлини (раннє загострення на візуалізації) без біопсії / оцінки за критеріями iRECIST."
  - "НЕ підтверджувати план без шляху фінансування — пембролізумаб не реімбурсується НСЗУ для КРР."

do_not_do_en:
  - "Do NOT prescribe without verified MSI-H/dMMR status — false-positive MSI may cause hyperprogression."
  - "Do NOT continue pembrolizumab through Grade 3+ irAE without specialist consultation + steroid taper."
  - "Do NOT combine with chronic high-dose corticosteroids — pharmacodynamic blunting of ICI."
  - "Do NOT prescribe in active autoimmune disease without rheumatology / endocrinology MDT."
  - "Do NOT discontinue therapy at tumor pseudoprogression (early flare-up imaging) without biopsy / iRECIST evaluation."
  - "Do NOT confirm the plan without funding pathway — pembrolizumab not NSZU-reimbursed for CRC."
time_critical: false
