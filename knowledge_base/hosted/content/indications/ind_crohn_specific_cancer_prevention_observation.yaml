do_not_do:
  - "Не презентувати observation як equivalent vigilance — chronic inflammation — cancer-driving mechanism; treat-to-target — highest-impact modifiable factor."
  - "Не пропускати symptom-prompt-list education — низько-intensity vigilance кращий ніж нуль."
  - "Не foreclose CRC chromoendoscopy у extensive Crohn-colitis — RF-IBD-CRC-PREVENTION pathway continues незалежно від цього observation track."
  - "Не пропускати iatrogenic-therapy RF integration при anti-TNF + thiopurine — окремі surveillance pathways carry independent recommendations."
  - "Не пропускати periodic re-engagement treat-to-target discussion — patient readiness evolves."

do_not_do_en:
  - "Do not present observation as equivalent to vigilance — chronic inflammation is the cancer-driving mechanism; treat-to-target is the highest-impact modifiable factor."
  - "Do not skip symptom-prompt-list education — low-intensity vigilance is better than none."
  - "Do not foreclose CRC chromoendoscopy in extensive Crohn-colitis — the RF-IBD-CRC-PREVENTION pathway continues independent of this observation track."
  - "Do not skip iatrogenic-therapy RF integration on anti-TNF + thiopurine — separate surveillance pathways carry independent recommendations."
  - "Do not skip periodic re-engagement of the treat-to-target discussion — patient readiness evolves over time."

