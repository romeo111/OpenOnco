evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Symptom-driven evaluation only without structured treat-to-target
    framework or systematic cancer-vigilance education. Crohn's
    patients in this track retain elevated cancer signals (small-
    bowel adenocarcinoma RR ~20-40; lymphoma RR ~1.5-2) but receive
    no structured inflammation-modifying or vigilance-mediated risk
    reduction. Outcomes worse than vigilance-comparator on long-term
    cancer-incidence basis, particularly when symptom-onset is
    insidious and chronic-Crohn-symptom overlap delays diagnostic
    workup.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-CROHN-SPECIFIC-CANCER-
  PREVENTION-VIGILANCE. Used when:
  - Patient declines structured treat-to-target framework + cancer-
    vigilance education after informed discussion (modern-biologic
    cost / access barriers, surveillance-fatigue, preference for
    symptom-based management).
  - Access to gastroenterology-experienced Crohn's center is
    impractical (rural, low-resource setting).
  - Patient is on stable symptomatic-remission monotherapy with
    refusal to escalate to treat-to-target framework.

  Components:
  - Crohn's-disease management continues at the patient's chosen
    intensity; basic symptom-improvement goals rather than treat-to-
    target.
  - Symptom-vigilance education delivered at lower intensity —
    explicit prompt-list for "red flag" symptoms (sustained
    obstructive symptoms, unexplained weight loss, new lymphade-
    nopathy, B-symptoms, perianal mass/ulcer changes) but no
    structured periodic re-evaluation framework.
  - CRC surveillance via RF-IBD-CRC-PREVENTION pathway continues
    when applicable (this Crohn-specific RF observation does NOT
    foreclose chromoendoscopy in extensive Crohn-colitis).
  - Iatrogenic-therapy RF integration continues — when patient is
    on anti-TNF + thiopurine, RF-IATROGENIC-ANTI-TNF-LYMPHOMA-
    PREVENTION + RF-IATROGENIC-AZATHIOPRINE-LONGTERM-PREVENTION
    carry their own surveillance pathways independent of this
    observation track.
  - Re-engage treat-to-target discussion at each clinical contact —
    patient readiness evolves over time.

  Frame the decision as suboptimal vs. the vigilance comparator and
  document the informed-decision discussion. Per CHARTER §11
  patient-autonomy framing.

rationale_ua: >
  Альтернативно-трекова Indication. Використовується коли:
  - Пацієнт відмовляється від structured treat-to-target framework +
    cancer-vigilance education після informed discussion (modern-
    biologic cost / access barriers, surveillance-fatigue, preference
    для symptom-based management).
  - Доступ до gastroenterology-experienced Crohn's center
    непрактичний.
  - Пацієнт на stable symptomatic-remission monotherapy з відмовою
    від escalation до treat-to-target framework.

  Компоненти:
  - Crohn's-disease management continues at patient's chosen
    intensity; basic symptom-improvement goals.
  - Symptom-vigilance education delivered at lower intensity —
    explicit prompt-list для "red flag" симптомів.
  - CRC surveillance via RF-IBD-CRC-PREVENTION pathway continues.
  - Iatrogenic-therapy RF integration continues.
  - Re-engage treat-to-target discussion при кожному clinical
    contact.

  Frame decision як suboptimal vs. vigilance comparator + document
  informed-decision discussion. Per CHARTER §11.

