expected_outcomes:
  overall_response_rate: >-
    Treat-to-target Crohn's-disease management with sustained mucosal
    healing reduces chronic-inflammation-to-cancer pathway in small-
    bowel adenocarcinoma + colitis-associated CRC. Symptom-vigilance
    + low-threshold workup captures small-bowel adenocarcinoma at
    earlier stage (asymptomatic-to-mild-symptomatic) than typical
    obstruction-driven presentation, when surgical resection offers
    better outcomes. Lymphoma vigilance with B-symptom + lymph-node
    workup similarly enables earlier diagnosis. Evidence base is
    consensus-driven (ECCO + AGA) given the relative rarity of these
    cancers in absolute terms — surveillance trials cannot be
    powered.

