rationale: >
  Standard-track Crohn's-specific cancer-prevention vigilance per
  ECCO Crohn-cancer-risk consensus 2024 + AGA IBD-cancer surveillance
  + ESMO CRC 2024 (IBD-associated CRC section).

  **(1) Treat-to-target Crohn's-disease management:**
  - Goal: sustained mucosal healing (endoscopic + histologic
    remission), not symptom-only remission.
  - Choice of induction + maintenance therapy per disease severity,
    location, comorbidity, and prior-therapy history. Modern
    agents: biologics (anti-TNF, anti-α4β7 integrin, anti-IL-12/23,
    JAK inhibitors) per ECCO/AGA treat-to-target framework.
  - Chronic inflammation is the cancer-driving mechanism — sustained
    mucosal healing interrupts the inflammation-to-cancer pathway
    for both small-bowel adenocarcinoma and colitis-associated CRC.
  - Document each therapy decision in the dual-context of disease
    activity AND cancer-risk modification.

  **(2) Small-bowel adenocarcinoma vigilance:**
  - No validated surveillance imaging protocol (capsule endoscopy
    and MR enterography studied in case series but no evidence-based
    recommendation).
  - Clinical vigilance — symptom education for obstructive symptoms
    (intermittent crampy abdominal pain after meals, vomiting,
    weight loss, hematochezia or melena, anemia of chronic disease
    progressing to iron-deficiency anemia despite Crohn's
    optimization).
  - Low-threshold workup with MR enterography or capsule endoscopy
    when symptom pattern is suggestive — small-bowel adenocarcinoma
    is rare but progressive and surgically curable at early stage.
  - If Crohn's disease requires surgical resection for stricturing
    disease, perform thorough histopathologic examination including
    margins (adenocarcinoma can be incidentally detected at
    resection).

  **(3) Lymphoma vigilance:**
  - Periodic clinical examination for lymphadenopathy.
  - B-symptom education (unexplained fever, drenching night sweats,
    >10% body-weight loss in 6 months) with low-threshold imaging +
    biopsy on suggestive symptoms.
  - When patient is on anti-TNF + thiopurine combination (or
    monotherapy with either), integrate with dedicated iatrogenic
    RFs (RF-IATROGENIC-ANTI-TNF-LYMPHOMA-PREVENTION, RF-IATROGENIC-
    AZATHIOPRINE-LONGTERM-PREVENTION) which carry specific
    surveillance protocols including EBV serology + hepatosplenic
    T-cell lymphoma awareness.

  **(4) Colorectal cancer surveillance integration:**
  - Patients with extensive Crohn-colitis fire BOTH this RF and
    RF-IBD-CRC-PREVENTION. Follow the IBD-CRC-PREVENTION
    chromoendoscopy protocol — this Crohn-specific RF does NOT add
    a separate CRC-surveillance pathway.

  **(5) Anal-region vigilance in perianal-fistulizing Crohn's:**
  - Annual perianal examination with low-threshold biopsy of any
    new ulcer, mass, or stricture.
  - Anal carcinoma in chronic perianal-fistulizing Crohn's RR ~5-10
    — low absolute but worth specific clinical attention.

  **(6) Patient education:**
  - Frame the cancer-risk discussion in absolute-and-relative terms:
    small-bowel adenocarcinoma RR ~20-40 but absolute lifetime ~0.5-
    2%; CRC absolute lifetime in extensive Crohn-colitis ~10-18% at
    30y; lymphoma RR ~1.5-2 (or higher on combination
    immunosuppression).
  - Counsel that sustained Crohn's-disease remission is the
    highest-impact modifiable factor across all these signals.

  Per CHARTER §11 patient-autonomy framing.

