sources:
  - source_id: SRC-AGA-IBD-CRC-2024
    position: supports
  - source_id: SRC-ESMO-CRC-2024
    position: supports
    relevant_quote_paraphrase: >-
      "Crohn's disease with small-bowel involvement carries
      substantially elevated relative risk of small-bowel
      adenocarcinoma; no validated screening protocol exists but
      treat-to-target sustained mucosal healing reduces chronic-
      inflammation-driven cancer development. Lymphoma risk in
      immunosuppressant-naive Crohn's is modest (RR ~1.5-2); the
      iatrogenic component on anti-TNF + thiopurine combinations
      is captured by separate surveillance pathways."
  - source_id: SRC-BEAUGERIE-CESAME-2013
    position: supports
    relevant_quote_paraphrase: >-
      "CESAME French national prospective inflammatory-bowel-disease
      cohort (~19,000 patient-years) establishes that thiopurine and
      anti-TNF exposure modestly elevate the risk of new and
      recurrent cancers, including lymphoma (predominantly non-
      Hodgkin B-cell) and colitis-associated colorectal cancer. The
      cohort provides the population-level base rates that NCCN /
      ECCO / AGA reference for IBD cancer-risk counseling and
      iatrogenic-exposure surveillance cadence."

do_not_do:
  - "Не пропускати treat-to-target framework у Crohn's-disease management — chronic inflammation — cancer-driving mechanism; sustained mucosal healing — highest-impact modifiable factor."
  - "Не використовувати тільки symptom-based Crohn's management — endoscopic + histologic remission goals reduce both disease morbidity AND cancer risk."
  - "Не виконувати routine capsule endoscopy / MR enterography surveillance у asymptomatic Crohn's без validated protocol — yield uncertain; reserve для symptom-prompted workup."
  - "Не нормалізувати new-onset obstructive symptoms у chronic Crohn's як 'just a flare' — small-bowel adenocarcinoma може mimic stricturing Crohn's; threshold для cross-sectional imaging низький."
  - "Не пропускати B-symptom workup у chronic Crohn's — lymphoma signal modest але not negligible; lymphadenopathy / unexplained fever / night sweats / weight loss потребують біопсії."
  - "Не презентувати Crohn-specific RF як заміну RF-IBD-CRC-PREVENTION у extensive Crohn-colitis — обидва RFs fire complementarily; CRC chromoendoscopy protocol лежить у RF-IBD-CRC-PREVENTION pathway."

do_not_do_en:
  - "Do not skip the treat-to-target framework in Crohn's-disease management — chronic inflammation is the cancer-driving mechanism; sustained mucosal healing is the highest-impact modifiable factor."
  - "Do not rely on symptom-based Crohn's management alone — endoscopic and histologic remission goals reduce both disease morbidity and cancer risk."
  - "Do not perform routine capsule endoscopy or MR enterography surveillance in asymptomatic Crohn's without a validated protocol — yield is uncertain; reserve for symptom-prompted workup."
  - "Do not normalize new-onset obstructive symptoms in chronic Crohn's as 'just a flare' — small-bowel adenocarcinoma can mimic stricturing Crohn's; the threshold for cross-sectional imaging is low."
  - "Do not skip B-symptom workup in chronic Crohn's — the lymphoma signal is modest but not negligible; lymphadenopathy, unexplained fever, night sweats, and weight loss require biopsy."
  - "Do not present the Crohn-specific RF as a replacement for RF-IBD-CRC-PREVENTION in extensive Crohn-colitis — both RFs fire complementarily; the CRC chromoendoscopy protocol lives in the RF-IBD-CRC-PREVENTION pathway."

