id: IND-CRONKHITE-CANADA-OBSERVATION
plan_track: aggressive
intent: prevention

applicable_to:
  disease_id: DIS-CRC
  stage_requirements: []
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 3

triggered_by_redflags:
  - RF-CRONKHITE-CANADA-CONFIRMED

recommended_regimen: null
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Supportive-only without disease-modifying immunosuppression. Higher
    mortality (~50% 5y untreated). Acceptable only when patient
    contraindicates steroids/azathioprine OR access is constrained;
    re-offer immunosuppression at every visit.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (no immunosuppression) alternative — used when
  patient contraindicates prednisone + azathioprine + biologic
  alternatives, OR resource-limited setting.

  Components:
    - Nutritional support retained — IV albumin, electrolyte
      correction, vitamin replacement.
    - Colonoscopy q12mo retained (less frequent than standard q1-2y).
    - Upper endoscopy q12mo retained.
    - Small-bowel capsule q2y retained.
    - Skin/nail/hair examination at every visit.
    - Re-offer immunosuppression at every visit.

rationale_ua: >
  Aggressive-трек (no immunosuppression) альтернатива.

  Компоненти:
    - Nutritional support retained.
    - Colonoscopy q12mo retained.
    - Upper endoscopy q12mo retained.
    - Small-bowel capsule q2y retained.
    - Skin/nail/hair examination retained.
    - Re-offer immunosuppression annually.

