rationale: >
  Standard-track prevention pathway for confirmed Cronkhite-Canada
  syndrome. Combination of disease-modifying treatment + cancer
  surveillance + nutritional support.

  Components — DISEASE-MODIFYING:
    - **Prednisone induction** 0.5-1 mg/kg/day for 4-8 weeks, then
      taper based on clinical response (resolution of ectodermal
      changes + protein-losing enteropathy).
    - **Azathioprine maintenance** 1-2.5 mg/kg/day; alternative
      ciclosporin, infliximab in steroid-refractory disease.
    - **PPI co-prescription** for gastric polypoid disease + proton-
      pump inhibition during steroid therapy.

  Components — NUTRITIONAL:
    - **Protein replacement** — IV albumin during active phase if
      severe hypoalbuminemia; parenteral nutrition for severe
      malabsorption.
    - **Electrolyte correction** — chronic hypokalemia + hypomagnesemia
      common; supplementation + monitoring.
    - **Vitamin replacement** — fat-soluble (A, D, E, K) + B12.

  Components — CANCER SURVEILLANCE:
    - **Colonoscopy q1-2y from diagnosis** — polyposis distribution
      throughout colon; polypectomy at every encounter.
    - **Upper endoscopy q1-2y** — gastric + duodenal polyposis;
      polypectomy + cytology.
    - **Small-bowel video capsule q2y** — full-bowel polyposis
      mapping.
    - **Annual abdominal US or CT** — symptom-triggered for
      hepatobiliary signal.
    - **Threshold for surgical resection:** any cancer-confirmed lesion
      or any high-grade dysplastic polyp not amenable to endoscopic
      removal.

  Components — MONITORING + LIFESTYLE:
    - **Skin + nail + hair examination** at every visit — signs of
      disease activity flare.
    - **Smoking cessation** + alcohol minimization — synergistic with
      multiple cancers.
    - **Standard CRC screening recommendations apply** for non-affected
      relatives — no autosomal-dominant inheritance pattern.

  **Cascade testing:** non-Mendelian etiology — no germline testing
  indicated; counsel FDRs about general-population CRC screening.

  In Ukraine, Cronkhite-Canada syndrome is rare + may be under-
  recognized. Management at major gastroenterology + IBD centers in
  Kyiv, Lviv, Kharkiv with multidisciplinary nutrition + dermatology
  + dermatology support.

rationale_ua: >
  Стандартний-трек prevention шлях для confirmed Cronkhite-Canada
  syndrome. Combination disease-modifying treatment + cancer
  surveillance + nutritional support.

  Компоненти — DISEASE-MODIFYING:
    - **Prednisone induction** 0.5-1 мг/кг/день для 4-8 тиж, потім
      taper based on clinical response.
    - **Azathioprine maintenance** 1-2.5 мг/кг/день; alternative
      ciclosporin, infliximab у steroid-refractory disease.
    - **PPI co-prescription** для gastric polypoid disease.

  Компоненти — NUTRITIONAL:
    - **Protein replacement** — IV albumin під час active phase.
    - **Electrolyte correction** — chronic hypokalemia + hypomagnesemia.
    - **Vitamin replacement** — fat-soluble (A, D, E, K) + B12.

  Компоненти — CANCER SURVEILLANCE:
    - **Colonoscopy q1-2y з діагнозу.**
    - **Upper endoscopy q1-2y.**
    - **Small-bowel video capsule q2y.**
    - **Annual abdominal US або CT.**
    - **Surgical resection threshold:** any cancer-confirmed lesion.

  Компоненти — MONITORING + LIFESTYLE:
    - **Skin + nail + hair examination** при кожному visit.
    - **Smoking cessation** + alcohol minimization.

  **Cascade testing:** non-Mendelian — no germline testing indicated.

  В Україні Cronkhite-Canada рідкий + може бути under-recognized.
  Management у Києві, Львові, Харкові з multi-disciplinary nutrition.

