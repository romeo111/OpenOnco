do_not_do:
  - "Не лікувати без immunosuppression — untreated mortality висока (~50% 5y)."
  - "Не пропускати nutritional support — protein-losing enteropathy + electrolyte derangement є primary mortality drivers."
  - "Не покладатися на колоноскопію q5-10y — Cronkhite потребує q1-2y."
  - "Не виконувати germline testing FDRs — non-Mendelian етіологія."

do_not_do_en:
  - "Do not manage without immunosuppression — untreated mortality is high (~50% 5y)."
  - "Do not skip nutritional support — protein-losing enteropathy + electrolyte derangement are primary mortality drivers."
  - "Do not rely on colonoscopy q5-10y — Cronkhite requires q1-2y."
  - "Do not perform germline testing of FDRs — non-Mendelian etiology."

known_controversies:
  - topic: "Immunosuppression first-line agent selection"
    positions:
      - position: "Prednisone + azathioprine combination"
        rationale: "Classical IBD-style induction + maintenance; widest case-series experience."
      - position: "Infliximab / biologic"
        rationale: "Emerging case reports show response in steroid-refractory disease; cost + access constraints."
    our_default: "Prednisone induction + azathioprine maintenance; switch to biologic on steroid-refractory."
    rationale: "Pragmatic stepwise approach + cost-effectiveness."

