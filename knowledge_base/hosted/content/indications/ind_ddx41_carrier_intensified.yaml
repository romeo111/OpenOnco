expected_outcomes:
  overall_response_rate: >-
    Intensified-track surveillance (q3-4 month CBC + smear from age
    50, scheduled BMA + NGS every 2-3 years, preemptive HLA + donor
    germline mapping) is justified by the ~50-70% cumulative lifetime
    MDS / AML risk in DDX41 pedigrees and the actionable treatment-
    response pattern (hypomethylating-agent favorable response —
    Sebert 2024). Patient-burden tradeoff (more frequent visits and
    BMA) is shared-decision-making with the carrier per CHARTER §11.

hard_contraindications: []
red_flags_triggering_alternative: []

