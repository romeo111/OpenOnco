do_not_do:
  - "Не рекомендувати інтенсифіковану-трек cadence без явного shared-decision-making — q3-4 month візити + scheduled BMA + repeated sedation несуть значущий patient-burden."
  - "Не відкладати unrelated-donor search якщо сиблінг-cohort вичерпаний — DDX41 виникає в старшій дорослості, час до alloHCT може бути біологічно tighter."
  - "Не виконувати запланованої BMA без супутнього myeloid NGS panel що включає DDX41 R525H hotspot — emerging somatic-second-hit clone у low VAF — головна діагностична зміна, що передує клінічному МДС."
  - "Не використовувати кандидат-сиблінг-донора, доки germline-screening не завершений — без pre-screening DDX41-сиблінг може бути обраний помилково."

do_not_do_en:
  - "Do not recommend the intensified-track cadence without explicit shared-decision-making — q3-4 month visits + scheduled BMA + repeated sedation carry meaningful patient burden."
  - "Do not defer the unrelated-donor search once the sibling cohort is exhausted — DDX41 emerges in older adulthood and time-to-alloHCT may be biologically tighter than in younger-onset syndromes."
  - "Do not perform scheduled BMA without companion myeloid NGS that includes the DDX41 R525H hotspot — the emerging somatic-second-hit clone at low VAF is the key diagnostic change that precedes clinical MDS."
  - "Do not use a candidate sibling donor before germline-screening is completed — without pre-screening, a DDX41-sibling could be selected by mistake."

