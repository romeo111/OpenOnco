  - TEST-CBC
desired_tests:
  - TEST-PERIPHERAL-SMEAR
  - TEST-BM-ASPIRATE
  - TEST-NGS-MYELOID-PANEL

rationale: >
  Alternative-track companion to IND-DDX41-CARRIER-SURVEILLANCE.
  Intensified cadence reflects the substantial lifetime MDS / AML
  risk in DDX41 pedigrees and explicit pre-emptive transplant-team
  engagement.

  **CBC + peripheral smear q3-4 months from age 50 (or from carrier
  confirmation if later):** Tripled the standard-track cadence.
  Detection of pre-MDS clonal evolution (emerging macrocytosis,
  persistent isolated cytopenia, dysplastic morphology) before
  frank malignancy.

  **Scheduled BMA + cytogenetics + myeloid NGS every 2-3 years from
  age 50:** Provoked BMA (any unexplained CBC change or persistent
  macrocytosis) remains the primary trigger, but scheduled BMA at
  this cadence is added in this track regardless of CBC stability.
  The myeloid NGS panel must include the DDX41 R525H hotspot + the
  broader DDX41 coding region (other recurrent somatic alleles in
  carriers documented), plus standard MDS-relevant genes (ASXL1,
  SF3B1, TP53, TET2, DNMT3A).

  **Preemptive HLA typing of candidate sibling-donor cohort +
  germline-testing of all candidates:** Performed BEFORE any MDS /
  AML diagnosis so that donor identification is not delayed. Every
  candidate sibling donor must be germline-tested for DDX41 before
  designation; DDX41-carrier siblings are excluded from donor
  candidacy. Unrelated-donor search initiated early if no eligible
  sibling donor identified — particularly important in DDX41
  because the disease emerges in older adulthood and time-to-
  transplant may be biologically tighter than in younger-onset
  hereditary-myeloid syndromes.

  **Pre-emptive consultation with hereditary-myeloid-program
  transplant team:** Establishes care relationship so that at MDS /
  AML diagnosis, time-to-azacitidine and time-to-alloHCT can be
  optimized. The hereditary-myeloid program at a tertiary academic
  center is the preferred care setting.

  Per CHARTER §11 patient-autonomy framing: intensified cadence
  carries higher procedural burden and is appropriate only where the
  carrier prefers higher-intensity option after shared-decision-
  making.

rationale_ua: >
  Альтернативно-трекова Indication, sibling до IND-DDX41-CARRIER-
  SURVEILLANCE. Інтенсифікована cadence відображає substantial
  довічний МДС / ГМЛ ризик у DDX41 родоводах і явне pre-emptive
  transplant-team engagement.

  **ЗАК + периферичний мазок q3-4 місяці з 50 років (або з підтвердження
  носійства, якщо пізніше):** Потрійна стандартно-трекова cadence.
  Детекція pre-МДС клональної еволюції до франкного malignancy.

  **Запланована BMA + цитогенетика + myeloid NGS кожні 2-3 роки з 50
  років:** Provoked BMA (будь-яка нез'ясована зміна ЗАК або персистуюча
  macrocytosis) залишається primary тригером, але запланована BMA на
  цій cadence додана в цьому треку незалежно від CBC stability.
  Myeloid NGS panel має включати DDX41 R525H hotspot + ширшу DDX41
  coding region (інші рекурентні somatic алелі у носіїв задокументовані),
  плюс стандартні MDS-релевантні гени (ASXL1, SF3B1, TP53, TET2,
  DNMT3A).

  **Pre-emptive HLA-типування кандидат-сиблінг-донор-cohort +
  germline-тестування всіх кандидатів:** Виконується ДО будь-якого
  діагнозу МДС / ГМЛ. Кожен кандидат-сиблінг-донор має бути germline-
  тестований на DDX41 перед призначенням; DDX41-носії-сиблінги
  виключаються з donor-candidacy. Unrelated-donor search розпочатий
  рано — особливо важливо у DDX41, бо disease виникає в старшій
  дорослості і time-to-transplant може бути біологічно tighter ніж
  у younger-onset hereditary-myeloid синдромах.

  **Pre-emptive консультація з hereditary-myeloid-program transplant-
  team:** Встановлює care-relationship так, що при діагностиці МДС /
  ГМЛ time-to-azacitidine і time-to-alloHCT можуть бути оптимізовані.

  Per CHARTER §11 framing автономії пацієнта.

