rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with a documented germline DDX41 pathogenic variant.

  **CBC q6 months from age 50, lifelong:** DDX41 carriers typically
  present in the sixth-to-eighth decade — surveillance starting age
  is calibrated to the documented natural-history onset window. If
  carrier confirmation occurs after age 50, surveillance begins at
  confirmation. Earlier-onset cases have been reported and surveillance
  before age 50 is reasonable if the family-history pattern includes
  affected relatives diagnosed before that age.

  **BMA + cytogenetics + myeloid NGS at any clinically-relevant
  change:** Trigger thresholds: any unexplained cytopenia, persistent
  macrocytosis (MCV elevation a common pre-MDS feature in DDX41), or
  emerging dysplastic morphology on smear. The myeloid NGS panel must
  capture the recurrent DDX41 R525H somatic-second-hit hotspot —
  detection of R525H in the tumor confirms germline-driven disease and
  is mechanistically diagnostic when the patient is a known germline
  DDX41 carrier.

  **Cascade germline testing for first-degree relatives:** Documented
  buccal / fibroblast / cultured-skin germline confirmation required
  — NOT blood-only. Somatic DDX41 second-hit clones in carriers can
  contaminate blood-based germline assay; this is the same caveat
  that applies to CEBPA and RUNX1 family-screening and must be
  communicated to genetic-counseling teams.

  **Donor-screening protocol:** Any candidate sibling donor must be
  germline-tested before HSC mobilization. DDX41-carrier siblings
  must NOT donate to an affected sibling — donor-derived disease in
  DDX41 syndrome has been reported and the screening requirement is
  standard in modern hereditary-myeloid-program guidelines.
  Unrelated-donor search initiated if no eligible sibling donor.

  **Treatment-time implication recorded:** When MDS / AML emerges in
  a DDX41 carrier, hypomethylating-agent therapy (azacitidine,
  decitabine) and venetoclax-based combinations are particularly
  effective per Sebert 2024 cohort data — DDX41-driven MDS / AML
  shows better azacitidine-response than the average IPSS-M-matched
  sporadic disease. Allogeneic transplant remains the only curative
  modality, timing based on IPSS-M + blast burden + co-occurring
  mutations + donor germline-status.

  Per CHARTER §11 patient-autonomy framing: surveillance cadence and
  starting age are shared-decision-making with the patient and the
  hereditary-myeloid-program team.

rationale_ua: >
  Стандартний-трек шлях спостереження підтверджених носіїв для осіб з
  задокументованим гермінативним патогенним варіантом DDX41.

  **ЗАК q6 місяців з 50 років, життєво:** DDX41-носії типово
  представляють у 6-8 декаді — surveillance starting age калібрований
  до задокументованого natural-history onset window. Якщо carrier
  confirmation відбувається після 50, surveillance починається при
  confirmation. Earlier-onset cases повідомлені, і surveillance до
  50 років обґрунтований, якщо family-history pattern включає
  уражених родичів, діагностованих до цього віку.

  **BMA + цитогенетика + myeloid NGS при будь-якій клінічно-релевантній
  зміні:** Порогові тригери: будь-яка нез'ясована цитопенія,
  персистуюча macrocytosis (MCV elevation — common pre-MDS feature
  у DDX41), або emerging dysplastic morphology на смазку. Myeloid
  NGS panel має захоплювати рекурентний DDX41 R525H somatic-second-hit
  hotspot — detection R525H у пухлині підтверджує germline-driven
  disease і є механістично діагностичною коли пацієнт — відомий
  germline DDX41 carrier.

  **Cascade germline тестування для родичів першого ступеня:**
  Задокументоване buccal / fibroblast / cultured-skin germline
  підтвердження потрібне — НЕ лише на крові.

  **Donor-screening протокол:** Будь-який кандидат-сиблінг-донор має
  бути germline-тестований перед HSC mobilization. DDX41-носії-
  сиблінги НЕ можуть донорити ураженому сиблінгу. Unrelated-donor
  search розпочатий, якщо немає eligible сиблінга.

  **Treatment-time implication записана:** Коли МДС / ГМЛ виникає у
  DDX41-носія, hypomethylating-agent терапія (азацитидин, децитабін)
  і venetoclax-основані комбінації особливо ефективні per Sebert
  2024 cohort data — DDX41-driven МДС / ГМЛ показує кращу azacitidine-
  response ніж average IPSS-M-matched sporadic disease.

  Per CHARTER §11 framing автономії пацієнта.

