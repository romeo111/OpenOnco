do_not_do:
  - "Не використовувати лише blood-based germline тестування для cascade screening DDX41 — somatic R525H second-hit clones у крові контамінують assay; buccal / fibroblast / cultured-skin tissue потрібне."
  - "Не пропускати donor-germline-screening перед HSC mobilization — DDX41-сиблінг-донор не може використовуватись; pre-screening є стандартом у modern hereditary-myeloid-program guidelines."
  - "Не відкладати BMA при нез'ясованій макроцитозі або emerging диспластичних рисах на смазку у підтвердженого DDX41-носія старше 50 — pre-test probability incident МДС / ГМЛ значно вища ніж у age-matched general population."
  - "Не починати hypomethylating agents або venetoclax-based терапію без попереднього підтвердження germline DDX41 + somatic second-hit на myeloid NGS — лікарська-вибір логіка залежить від цього germline / tumor-pattern контексту."

do_not_do_en:
  - "Do not rely on blood-only germline testing for DDX41 cascade screening — somatic R525H second-hit clones in blood can contaminate the assay; buccal / fibroblast / cultured-skin tissue is required."
  - "Do not skip donor-germline-screening before HSC mobilization — a DDX41-carrier sibling cannot be used as donor; pre-screening is standard in modern hereditary-myeloid-program guidelines."
  - "Do not defer BMA on unexplained macrocytosis or emerging dysplastic features on smear in a confirmed DDX41 carrier over age 50 — the pre-test probability of incident MDS / AML is substantially elevated over age-matched general population."
  - "Do not initiate hypomethylating agents or venetoclax-based therapy without first confirming germline DDX41 + somatic second-hit on myeloid NGS — the treatment-selection logic depends on this germline / tumor-pattern context."

