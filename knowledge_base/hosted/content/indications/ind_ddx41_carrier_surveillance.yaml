expected_outcomes:
  overall_response_rate: >-
    Standard-track confirmed-carrier surveillance of germline DDX41
    carriers (Quesada 2019: median age at MDS / AML diagnosis ~66
    years, cumulative incidence ~50-70% by age 80) enables earlier
    detection of incident MDS / AML. The recognizable somatic R525H
    second-hit pattern emerging in tumor confirms germline-driven
    disease and influences treatment selection. Sebert et al. Blood
    2024 (n=153) showed favorable response to hypomethylating-agent
    therapy in DDX41-driven MDS / AML, making early diagnosis
    clinically actionable beyond surveillance for transplant timing.

