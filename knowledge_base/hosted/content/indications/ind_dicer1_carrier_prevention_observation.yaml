evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Reduced-frequency surveillance with retained symptom-driven workup.
    Higher risk of late-stage PPB detection; acceptable in low-resource
    settings or where families decline chest CT schedule.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (reduced surveillance) alternative for DICER1
  carriers.

  Components:
    - Chest imaging only at symptom or annual rather than q4-6 mo.
    - Abdominal US q12mo to age 8 (not q3-6mo).
    - Thyroid US q5y retained.
    - Pelvic US in female carriers annually from menarche.
    - Symptom-driven workup retained.
    - Cascade testing retained.
    - Re-offer full IPPBR schedule annually.

rationale_ua: >
  Aggressive-трек (reduced surveillance) альтернатива для DICER1
  carriers.

  Компоненти:
    - Chest imaging тільки при symptom або annual.
    - Abdominal US q12mo до 8 років (не q3-6mo).
    - Thyroid US q5y retained.
    - Pelvic US у female carriers annually з menarche.
    - Symptom-driven workup retained.
    - Cascade testing retained.
    - Re-offer повний IPPBR schedule annually.

