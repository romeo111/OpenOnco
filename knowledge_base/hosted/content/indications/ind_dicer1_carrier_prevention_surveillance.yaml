do_not_do:
  - "Не пропускати chest CT surveillance у DICER1 children <8 — PPB-I curative if resected early, PPB-III aggressive."
  - "Не виконувати empiric prophylactic oophorectomy для Sertoli-Leydig prevention — non-endorsed."
  - "Не використовувати empiric radiation якщо surgical/systemic alternatives є — modest secondary cancer signal."
  - "Не пропускати cascade testing FDRs — clinical clustering common."

do_not_do_en:
  - "Do not skip chest CT surveillance in DICER1 children <8 — PPB-I is curative if resected early, PPB-III is aggressive."
  - "Do not perform empiric prophylactic oophorectomy for Sertoli-Leydig prevention — non-endorsed."
  - "Do not use empiric radiation when surgical / systemic alternatives exist — modest secondary cancer signal."
  - "Do not skip cascade testing of FDRs — clinical clustering is common."

known_controversies:
  - topic: "Chest CT surveillance dose vs benefit"
    positions:
      - position: "Routine q4-6mo chest CT 0-3 y"
        rationale: "IPPBR data show PPB-I detection rate + curative resection rate justify surveillance."
      - position: "Symptom-driven chest imaging"
        rationale: "Cumulative pediatric radiation dose concerns; low-dose CT mitigates but not eliminates."
    our_default: "Low-dose chest CT or chest MRI (where available) q4-6mo to age 3, q6-12mo to age 8."
    rationale: "Balance early-detection benefit + cumulative radiation."

