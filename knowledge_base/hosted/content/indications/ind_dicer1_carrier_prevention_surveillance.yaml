rationale: >
  Standard-track prevention pathway for DICER1 syndrome confirmed
  carriers. Per International Pleuropulmonary Blastoma Registry +
  International DICER1 Syndrome Database (IDSDB) consensus
  recommendations.

  Components — PEDIATRIC:
    - **Chest CT or low-dose chest CT q4-6 months from birth to age 3,
      q6-12 months to age 8** — PPB highest risk window age 0-6;
      Type I (cystic only) is curable with resection at >95% rate.
    - **Abdominal US q3-6 months from birth to age 8** — cystic
      nephroma + cervical/embryonal RMS screening.
    - **Avoid radiation exposure where possible** — DICER1 carriers
      have potential modest radiation-induced second cancer risk.

  Components — ADOLESCENT/YOUNG ADULT:
    - **Thyroid ultrasound baseline by age 8 + every 3-5 years
      lifelong** — multinodular goiter highly prevalent; ultrasound-
      detected nodules → FNA per ATA risk stratification.
    - **Pelvic US in female carriers from menarche, every 6-12 months
      to age 25-30** — Sertoli-Leydig peak age 10-25.
    - **Symptom-driven evaluation:** unilateral testicular mass (rare
      male testicular tumor reported), nasal mass, persistent vision
      changes (pituitary blastoma).

  Components — ADULT:
    - **Symptom-driven workup** — DICER1 cancer risk plateaus in
      adulthood; routine imaging surveillance not endorsed.
    - **Thyroid US every 3-5 years lifelong** retained.

  **Cascade testing:** FDRs offered testing. Childhood-onset PPB +
  cystic nephroma + multinodular goiter clustering in a family is a
  classical DICER1 presentation; index-case diagnosis should prompt
  family-wide cascade.

  **Reproductive counseling:** PGT-M available.

  **Treatment considerations:**
    - **Radiation avoidance** preferred for cancer treatment where
      possible (relative, not absolute — therapeutic radiation safe
      in heterozygotes).
    - **PPB Type I**: surgical resection alone curative; no adjuvant
      needed for fully-resected Type I.
    - **PPB Type II/III**: surgery + intensive chemotherapy (IRS-style
      regimens); ifosfamide-containing regimens favored.

  In Ukraine, DICER1 syndrome is rare; recognition + multi-gene panel
  testing via Institute of Genetics. Pediatric multidisciplinary
  surveillance + treatment at OHMATDYT + regional centers. Low-dose
  chest CT availability variable.

