expected_outcomes:
  overall_response_rate: >-
    International PPB Registry + IDSDB-coordinated surveillance shifts
    pleuropulmonary blastoma stage at diagnosis from advanced (Type
    III, 5y OS ~50%) to early (Type I, 5y OS ~95% with resection).
    Sertoli-Leydig tumors typically present early due to virilization
    symptoms; surveillance pelvic US adjunct. Multinodular goiter
    detection facilitates timely thyroid management.

