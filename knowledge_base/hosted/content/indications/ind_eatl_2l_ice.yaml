id: IND-EATL-2L-ICE
plan_track: standard

applicable_to:
  disease_id: DIS-EATL
  line_of_therapy: 2
  stage_requirements:
    - "Relapsed/refractory after CHOEP-based induction"
    - "Pre-autoSCT salvage if not yet transplanted in CR1, OR post-autoSCT relapse"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2
    age_max: 70

recommended_regimen: REG-ICE
concurrent_therapy: []
followed_by:
  - "Allo-SCT consolidation in fit responders (autoSCT-naive can also bridge to autoSCT)"

evidence_level: low  # rare disease, retrospective series only
strength_of_recommendation: conditional
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: "~50% (small series; EATL very chemo-refractory)"
  complete_response: "~25-30%"
  progression_free_survival: "Median PFS ~6-9 months without consolidative SCT"
  overall_survival_5y: "<20% without alloSCT; ~25-30% if bridge to alloSCT in CR2"

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-HBV-SEROLOGY
  - TEST-HCV-ANTIBODY
  - TEST-HIV-SEROLOGY
  - TEST-FLOW-CYTOMETRY
  - TEST-PET-CT
  - TEST-CECT-CAP
  - TEST-ECHO
  - TEST-PREGNANCY
desired_tests:
  - TEST-NGS-LYMPHOID-PANEL

rationale: >
  EATL relapse — dismal prognosis. ICE (ifosfamide + carboplatin +
  etoposide) is platinum-based salvage from the DLBCL/PTCL R/R
  paradigm; it bridges to alloSCT consolidation. Gemcitabine-based
  alternatives (GDP, GemOx) acceptable when ifosfamide contraindicated
  (CrCl <50, encephalopathy history). Continued strict gluten-free
  diet remains mandatory peri-treatment to limit refractory celiac
  inflammation. Bowel perforation risk persists at multifocal
  enteropathy sites — surgical backup readiness in induction.

rationale_ua: >
  Рецидив EATL - прогностично несприятлива ситуація. ICE (іфосфамід (ifosfamide)
  + карбоплатин + етопозид) - платиновий сальвадж з парадигми ДВКЛ/PTCL р/р;
  використовується як місток до алоТГСК консолідації. Гемцитабін (gemcitabine)-
  основані альтернативи (GDP, GemOx) прийнятні при протипоказанні до
  іфосфаміду (CrCl <50, анамнез енцефалопатії). Сувора безглютенова дієта
  (gluten-free diet) залишається обов'язковою в пері-лікувальний період
  для обмеження рефрактерного запалення при целіакії. Ризик перфорації
  кишківника зберігається у мультифокальних ділянках ентеропатії -
  хірургічний резерв у режимі готовності під час індукції. NCCN Категорія 2A.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_oncowiki_review
draft_revision: 3

sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: supports
    relevant_quote_paraphrase: "Platinum-based salvage (ICE / DHAP / GDP) followed by alloSCT consolidation is preferred 2L for relapsed EATL"
  - source_id: SRC-ESMO-LYMPHOMA-2025
    position: supports
    relevant_quote_paraphrase: "Salvage chemotherapy bridging to alloSCT is the only potentially curative path for relapsed EATL; outcomes remain poor"

known_controversies:
  - topic: "ICE vs DHAP vs GemOx for EATL salvage"
    positions:
      - position: "ICE — most data extrapolated from PTCL/DLBCL salvage"
        sources: [SRC-NCCN-BCELL-2025]
      - position: "GemOx / GDP preferred when ifosfamide contraindicated or for older patients"
        sources: [SRC-ESMO-LYMPHOMA-2025]
    our_default: "ICE for fit ≤65; GemOx/GDP for older or renal-impaired"

do_not_do:
  - "НЕ пропускати месну при застосуванні іфосфаміду — ризик геморагічного циститу."
  - "НЕ давати повну дозу іфосфаміду, якщо CrCl <50 — ризик енцефалопатії."
  - "НЕ нехтувати пошуком донора — алоТГСК є єдиним потенційно курабельним варіантом для рецидивного/рефрактерного EATL."
  - "НЕ ігнорувати продовження безглютенової дієти в період сальваж-терапії."
  - "НЕ забувати про профілактику PJP в період після сальваж-терапії."
  - "НЕ вводити вінкристин (якщо він входить до наступної схеми лікування) інтратекально — фатально."

do_not_do_en:
  - "Do not skip mesna with ifosfamide — hemorrhagic cystitis."
  - "Do not give full-dose ifosfamide if CrCl <50 — encephalopathy risk."
  - "Do not neglect donor search — alloSCT — the only curative option for R/R EATL."
  - "Do not ignore continuation of gluten-free diet peri-salvage."
  - "Do not forget PJP prophylaxis in the post-salvage period."
  - "Do not administer vincristine (if in subsequent regimen) intrathecally — fatal."
time_critical: false
last_reviewed: "2026-04-27"
reviewer_signoffs: 0
notes: >
  STUB. Brentuximab-vedotin monotherapy may be considered if CD30+
  EATL (variable expression — rebiopsy if available). Outcomes overall
  poor; prioritize donor identification and clinical trial enrollment.
