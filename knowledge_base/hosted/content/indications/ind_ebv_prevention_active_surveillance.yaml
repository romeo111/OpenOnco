do_not_do:
  - "Не пропускати кількісний моніторинг EBV-ДНК у пацієнтів після трансплантації — це основа стратегії випереджувального лікування."
  - "Не призначати ритуксимаб без координації з трансплантологом / гематологом."
  - "Не знижувати імуносупресію в пацієнта з ризиком відторгнення трансплантата — необхідна окрема клінічна консультація."

do_not_do_en:
  - "Do not skip quantitative EBV-DNA monitoring in post-transplant patients — this is the foundation of the preemptive strategy."
  - "Do not initiate rituximab without coordination with the transplant team / hematology."
  - "Do not reduce immunosuppression in a patient at risk of graft rejection — a separate clinical consult is required."

