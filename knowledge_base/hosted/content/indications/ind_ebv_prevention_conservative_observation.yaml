do_not_do:
  - "Не використовувати цей шлях у пацієнтів високого ризику після ТГСК або в ранньому періоді після трансплантації солідного органа — потрібне активне спостереження."
  - "Не ігнорувати нову лімфаденопатію / B-симптоми — негайна ескалація до EBV-ДНК + візуалізації."

do_not_do_en:
  - "Do not use this pathway in high-risk post-HSCT or early post-solid-organ-transplant patients — active surveillance is required."
  - "Do not ignore new lymphadenopathy / B-symptoms — immediate EBV-DNA + imaging escalation."

