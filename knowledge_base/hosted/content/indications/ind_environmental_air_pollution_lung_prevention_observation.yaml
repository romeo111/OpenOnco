rationale: >
  Alternative-track companion to IND-ENVIRONMENTAL-AIR-POLLUTION-
  LUNG-PREVENTION-MITIGATION. Patient declines structured individual-
  level mitigation (cost of air purifiers, mask wear non-acceptable
  socially, residence relocation infeasible, perception of low
  individual benefit) — receives USPSTF-cadence lung-cancer screening
  eligibility check + brief exposure-awareness counseling with each
  clinical contact + symptom-triggered evaluation pathway. Per CHARTER
  §11 patient-autonomy framing — exposure-management choice is
  legitimate but framed as suboptimal vs. structured-mitigation
  comparator. Smoking-cessation counseling continues regardless.
  Periodic re-discussion of mitigation track at follow-up visits is
  appropriate, especially with changes in local air-quality patterns
  (industrial accidents, wartime events).

rationale_ua: >
  Альтернативний трек-супутник до показання
  IND-ENVIRONMENTAL-AIR-POLLUTION-LUNG-PREVENTION-MITIGATION. Пацієнт
  відмовляється від структурованих індивідуальних заходів зниження
  впливу (вартість очищувачів повітря, соціальна неприйнятність носіння
  масок, неможливість зміни місця проживання, сприйняття низької
  індивідуальної користі) — отримує перевірку права на скринінг раку
  легені за критеріями USPSTF, коротке консультування щодо обізнаності
  про вплив забруднення при кожному клінічному контакті та обстеження
  за появи симптомів. Відповідно до рамки автономії пацієнта за CHARTER
  §11 — вибір щодо управління впливом є легітимним, але розглядається як
  субоптимальний порівняно зі структурованими заходами зниження впливу.
  Консультування щодо відмови від куріння продовжується незалежно від
  обраного треку. Періодичне повторне обговорення треку зниження впливу
  на повторних візитах є доречним, особливо за зміни локальної картини
  якості повітря.

