do_not_do:
  - "Не представляти спостереження як еквівалент структурованих заходів зниження впливу — зниження захворюваності на рак легені та серцево-судинні захворювання при цьому не досягається."
  - "Не пропускати консультування щодо відмови від куріння — мультиплікативна взаємодія з PM2.5; ця рекомендація актуальна незалежно від обраного треку."
  - "Не ігнорувати тривожні ознаки (стійкий кашель, кровохаркання, задишка, втрата ваги) — негайне діагностичне візуалізаційне обстеження та мультидисциплінарний розгляд."
  - "Не представляти рішення пацієнта як остаточне — періодичне повторне обговорення треку зниження впливу на повторних візитах є доречним."

do_not_do_en:
  - "Do not present observation as equivalent to mitigation — lung-cancer + cardiovascular incidence reduction is not achieved."
  - "Do not skip smoking-cessation counseling — multiplicative interaction with PM2.5; recommendation is relevant regardless of mitigation-track choice."
  - "Do not ignore alarm features (persistent cough, hemoptysis, dyspnea, weight loss) — immediate diagnostic imaging + multidisciplinary review."
  - "Do not present the decision as final — periodic re-discussion of the mitigation track is appropriate at follow-up visits."

