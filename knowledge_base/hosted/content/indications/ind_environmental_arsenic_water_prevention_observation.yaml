rationale: >
  Alternative-track companion to IND-ENVIRONMENTAL-ARSENIC-WATER-
  PREVENTION-EXPOSURE-ELIMINATION. Patient declines structured water-
  source change or point-of-use filtration (cost, infrastructure
  constraint, doubt about exposure relevance, distrust of testing) —
  receives brief water-safety counseling with each clinical contact +
  symptom-triggered evaluation pathway + tobacco-cessation counseling
  + skin-surveillance recommendation (which does not require water-
  source change). Per CHARTER §11 patient-autonomy framing —
  exposure-management choice is legitimate but framed as suboptimal
  vs. source-change comparator. Periodic re-discussion of exposure-
  elimination track at follow-up visits is appropriate, especially
  if exposure-related findings (hyperpigmentation, hyperkeratosis,
  peripheral neuropathy) emerge.

rationale_ua: >
  Альтернативний трек-супутник до показання
  IND-ENVIRONMENTAL-ARSENIC-WATER-PREVENTION-EXPOSURE-ELIMINATION.
  Пацієнт відмовляється від структурованої заміни джерела води або
  фільтрації на місці споживання (вартість, інфраструктурні обмеження,
  сумніви щодо значущості впливу, недовіра до тестування) — отримує
  коротке консультування щодо безпеки води при кожному клінічному
  контакті, обстеження за появи симптомів, консультування щодо відмови
  від куріння та рекомендацію щодо шкірного спостереження (яка не
  потребує заміни джерела води). Відповідно до рамки автономії пацієнта
  за CHARTER §11 — вибір щодо управління впливом є легітимним, але
  розглядається як субоптимальний порівняно із заміною джерела води.
  Періодичне повторне обговорення треку усунення впливу на повторних
  візитах є доречним, особливо за появи пов'язаних із впливом миш'яку
  ознак (гіперпігментація, гіперкератоз, периферична нейропатія).

