do_not_do:
  - "Не представляти спостереження як еквівалент усунення впливу — ризик раку сечового міхура, легені, шкіри та мультиорганної токсичності при цьому не знижується."
  - "Не пропускати консультування щодо відмови від куріння — мультиплікативна взаємодія з миш'яком; рекомендація актуальна незалежно від обраного треку."
  - "Не ігнорувати характерні шкірні ознаки впливу миш'яку (гіперпігментація, гіперкератоз долонь/підошов) — це передракові маркери та ознака тривалого впливу."
  - "Не пропускати обстеження за появи гематурії/дизурії/стійкого кашлю/кровохаркання — низький поріг для діагностичного обстеження."
  - "Не представляти рішення пацієнта як остаточне — періодичне повторне обговорення треку усунення впливу на повторних візитах є доречним."

do_not_do_en:
  - "Do not present observation as equivalent to exposure elimination — bladder + lung + skin cancer + multi-organ toxicity risk is not reduced."
  - "Do not skip tobacco-cessation counseling — multiplicative interaction with arsenic; recommendation is relevant regardless of exposure-management choice."
  - "Do not ignore arsenic-skin-signature findings (hyperpigmentation, hyperkeratosis on palms / soles) — pre-malignant + indicator of prolonged exposure."
  - "Do not skip symptom-triggered evaluation of hematuria / dysuria / persistent cough / hemoptysis — low threshold for diagnostic workup."
  - "Do not present the decision as final — periodic re-discussion of the exposure-elimination track is appropriate."

