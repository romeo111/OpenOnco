rationale: >
  Standard-track prevention pathway for individuals (most commonly
  East Asian non-smoking women) with sustained domestic exposure to
  high-temperature cooking emissions and inadequate kitchen ventilation,
  without a current lung-cancer diagnosis. Three parallel interventions:

  **(1) Ventilation-upgrade counseling.** Highest-impact modifiable
  lever. Practical recommendations: (a) install a range-hood with
  proper outdoor venting (not recirculating) at sufficient airflow
  capacity (≥150-300 m³/h for residential kitchens), (b) use the
  range-hood during ALL cooking activities and continue running
  for 5-10 minutes after cooking ends, (c) open windows during and
  after cooking to enhance air exchange, (d) avoid cooking with
  doors to other living areas open. Where installation is not
  feasible (rented housing, financial constraint), use portable
  fans + window opening as best-available mitigation.

  **(2) Cooking-method counseling.** Where culturally acceptable:
  shift cooking-style mix toward lower-temperature methods (steaming,
  boiling, braising, stewing) and reduce stir-frying / deep-frying
  frequency or duration. Use cooking oils with higher smoke points
  (refined oils with smoke points >230°C; avoid heating to smoking
  visible). Lid kitchenware during cooking to reduce aerosol release.
  Frame as a culturally-respectful modification, NOT abandonment of
  traditional cuisine.

  **(3) Lung-cancer surveillance.** Cooking-emissions exposure in
  isolation does NOT meet USPSTF 2021 LDCT-screening criteria (which
  require ≥20 pack-year tobacco exposure). Risk-adjusted LDCT
  consideration is reserved for clustering with other risk factors:
  any pack-year tobacco exposure (active or former smoker),
  documented secondhand-smoke cohabitation history, first-degree
  family history of lung cancer. When clustering present and patient
  is 50-80 years old: consider annual LDCT chest per NCCN risk-
  stratified extension (category 2B). Symptom-triggered chest CT
  / referral at first presentation of persistent (>3 weeks) cough,
  hemoptysis, dyspnea, chest pain, or unexplained weight loss is
  the primary detection lever for those NOT meeting LDCT criteria.

  Resource access in Ukraine: range-hood installation widely
  available (~2000-15000 UAH equipment + installation); LDCT chest
  at large centers (~1500-3500 UAH); diagnostic chest CT widely
  available (~1500-3500 UAH).

rationale_ua: >
  Стандартний-трек prevention шлях для осіб (найчастіше East Asian
  non-smoking жінок) з sustained domestic експозицією high-temperature
  cooking emissions та inadequate kitchen ventilation, без поточного
  діагнозу lung cancer. Три паралельні втручання:

  **(1) Ventilation-upgrade counseling.** Найвпливовіший модифікуючий
  важіль. Практичні рекомендації: (a) встановити range-hood з proper
  outdoor venting (не recirculating) при sufficient airflow capacity
  (≥150-300 м³/год для residential kitchens), (b) використовувати
  range-hood під час ВСІХ cooking activities та продовжувати running
  5-10 хв після, (c) відкривати вікна під час та після cooking,
  (d) уникати cooking з відкритими дверми до інших living areas.
  Де installation не feasible — portable fans + window opening як
  best-available mitigation.

  **(2) Cooking-method counseling.** Де culturally acceptable: shift
  cooking-style mix toward lower-temperature methods (steaming,
  boiling, braising, stewing) та зменшення stir-frying / deep-frying
  frequency або duration. Cooking oils з higher smoke points
  (refined oils >230°C; уникати нагрівання до visible smoking).
  Lid kitchenware під час cooking для зменшення aerosol release.
  Формулювати як culturally-respectful модифікацію, НЕ abandonment
  традиційної кухні.

  **(3) Lung-cancer surveillance.** Cooking-emissions експозиція в
  ізоляції НЕ задовольняє USPSTF 2021 LDCT-screening критеріям
  (потребують ≥20 pack-year tobacco). Risk-adjusted LDCT consideration —
  при clustering з іншими ризик-факторами: будь-який pack-year tobacco,
  documented secondhand-smoke cohabitation history, first-degree
  family history of lung cancer. При clustering + 50-80 років:
  consider annual LDCT chest per NCCN risk-stratified extension
  (category 2B). Symptom-triggered chest CT / referral при першій
  presentation persistent (>3 тижні) cough, hemoptysis, dyspnea,
  chest pain, або unexplained weight loss — primary detection
  lever для тих, хто не задовольняє LDCT критеріям.

  Доступ до ресурсів в Україні: range-hood installation (~2000-15000
  грн equipment + installation); LDCT chest (~1500-3500 грн);
  diagnostic chest CT (~1500-3500 грн).

