      counseling referrals under multidisciplinary review."

do_not_do:
  - "Не призначати рутинний LDCT screening для cooking-emissions експозиції в ізоляції — USPSTF критерії потребують ≥20 pack-year tobacco; cooking emissions в ізоляції НЕ задовольняють."
  - "Не приписувати abandonment традиційних cooking methods — culturally-respectful модифікація (ventilation upgrade + cooking-method mix) — preferred framing."
  - "Не презентувати ventilation-upgrade як high-certainty lung-cancer prevention інтервенцію — IARC Group 2A probable evidence не еквівалентна Group 1."
  - "Не пропускати tobacco / secondhand-smoke history elicitation — clustering з cooking emissions різко змінює risk-stratification та LDCT-screening eligibility."

do_not_do_en:
  - "Do not order routine LDCT screening for cooking-emissions exposure in isolation — USPSTF criteria require ≥20 pack-years of tobacco; cooking emissions alone do not meet criteria."
  - "Do not prescribe abandonment of traditional cooking methods — culturally-respectful modification (ventilation upgrade + cooking-method mix) is the preferred framing."
  - "Do not present ventilation upgrade as a high-certainty lung-cancer prevention intervention — IARC Group 2A probable evidence is not equivalent to Group 1."
  - "Do not skip tobacco / secondhand-smoke history elicitation — clustering with cooking emissions sharply changes risk stratification and LDCT-screening eligibility."

