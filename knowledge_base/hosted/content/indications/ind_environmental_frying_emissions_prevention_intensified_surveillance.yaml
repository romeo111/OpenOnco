expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: ventilation-upgrade + cooking-method counseling
    targets reduction in cumulative aerosol exposure (range-hood
    installation with proper outdoor venting, daily use during cooking,
    switch from stir-frying to lower-temperature methods where
    culturally acceptable, use of lid covers, opening of windows
    during and after cooking). Effect size for cumulative-exposure
    reduction is hypothesized to translate to ~30-50% relative
    lung-cancer risk reduction in the East-Asian non-smoking-women
    cohort over decades, but RCT-grade evidence is absent. Risk-
    adjusted LDCT screening is considered only when clustering with
    other lung-cancer risk factors (active or former smoking,
    secondhand-smoke exposure, family history of lung cancer);
    cooking-emissions exposure in isolation does NOT meet USPSTF
    LDCT criteria. Symptom-triggered chest imaging at first
    presentation of persistent cough, hemoptysis, dyspnea, or
    unexplained weight loss is the primary detection lever.

