rationale: >
  Alternative-track companion to IND-ENVIRONMENTAL-FRYING-EMISSIONS-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Individual with sustained domestic
  exposure to high-temperature cooking emissions who declines structured
  ventilation-upgrade or cooking-method counseling — for any reason
  (rented housing precluding range-hood installation, financial
  constraint, deeply held culinary practice, skepticism toward IARC
  2A probable-evidence framing, preference for less-interventional
  pathway) — is offered routine general-population care only:

  **Lung-cancer screening:** Apply USPSTF 2021 criteria unmodified
  (age 50-80, ≥20 pack-years, current smoker or quit within 15
  years). If patient meets criteria they receive annual LDCT at the
  routine cadence; if not (most never-smokers in this cohort do
  NOT meet criteria), no imaging screening is offered. Patient is
  explicitly informed that the IARC Group 2A probable-evidence excess
  lung-cancer risk associated with their cooking environment is not
  specifically addressed by this routine track.

  **Ventilation-upgrade counseling:** Brief informational disclosure
  of IARC 2A classification and ventilation-upgrade considerations
  only; no structured counseling visit is scheduled. Patient is
  offered re-discussion at any future visit.

  **Cooking-method counseling:** None at structured visit; patient
  may seek public-health resources or dietitian referral on their
  own initiative.

  **Symptom-triggered evaluation:** Low threshold for chest imaging
  + diagnostic referral on persistent (>3 weeks) cough, hemoptysis,
  dyspnea, chest pain, or unexplained weight loss.

  Routing reconsiderations: patient may revisit intensified pathway
  at any subsequent visit. Per CHARTER §11 patient-autonomy framing:
  domestic-cooking and ventilation decisions are shared-decision-making
  domains particularly when the underlying evidence is IARC Group 2A
  (probable) and home-modification options may be constrained.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-ENVIRONMENTAL-
  FRYING-EMISSIONS-PREVENTION-INTENSIFIED-SURVEILLANCE. Особа з
  sustained domestic експозицією high-temperature cooking emissions,
  яка відмовляється від структурованого ventilation-upgrade або
  cooking-method counseling (rented housing precluding range-hood
  installation, фінансові обмеження, deeply held culinary practice,
  скептицизм щодо IARC 2A probable-evidence framing), отримує тільки
  рутинний general-population care:

  **Lung-cancer скринінг:** USPSTF 2021 без модифікації (50-80 років,
  ≥20 pack-years, current smoker або quit within 15 years). Якщо
  пацієнт задовольняє критеріям — annual LDCT routine cadence; якщо
  ні (більшість never-smokers у цій когорті НЕ задовольняє) — imaging
  screening НЕ пропонується. Пацієнт явно інформований, що IARC Group
  2A probable-evidence надлишковий ризик lung cancer не адресується
  специфічно цим рутинним треком.

  **Ventilation-upgrade counseling:** Brief informational disclosure
  IARC 2A класифікації та ventilation-upgrade considerations;
  структурований counseling-візит НЕ запланований. Re-discussion на
  будь-якому майбутньому візиті.

  **Cooking-method counseling:** Жодного structured візиту; пацієнт
  може шукати public-health resources або dietitian referral за
  власною ініціативою.

  **Symptom-triggered оцінка:** Низький поріг для chest imaging +
  діагностичного referral при persistent (>3 тижні) cough, hemoptysis,
  dyspnea, chest pain, або unexplained weight loss.

  Reroute: пацієнт може повернутися до інтенсифікованого шляху на
  будь-якому подальшому візиті. Per CHARTER §11 — shared-decision-making
  domain особливо при IARC Group 2A (probable) evidence та constrained
  home-modification options.

