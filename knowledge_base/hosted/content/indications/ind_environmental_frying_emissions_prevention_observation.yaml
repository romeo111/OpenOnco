sources:
  - source_id: SRC-NCCN-NSCLC-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining intensified surveillance or home-environment
      modifications continue to receive symptom-triggered evaluation
      and standard-of-care USPSTF lung-cancer screening when criteria
      are met by tobacco history."
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Symptom-triggered evaluation remains foundational across
      environmental carcinogen-exposure cohorts regardless of
      counseling-track choice."

do_not_do:
  - "Не презентувати observation як еквівалент ventilation-upgrade + cooking-method counseling — modifiable home-environment exposure залишається preferred intervention де feasible."
  - "Не ігнорувати alarm features (persistent cough, hemoptysis, dyspnea, weight loss) — immediate chest imaging + diagnostic referral."
  - "Не використовувати цей шлях як стандарт першої лінії — intensified-track залишається preferred для cooking-emissions cohort."
  - "Не пропускати tobacco / secondhand-smoke history elicitation — clustering різко змінює risk-stratification та LDCT-screening eligibility, незалежно від surveillance-track вибору."

do_not_do_en:
  - "Do not present observation as equivalent to ventilation-upgrade + cooking-method counseling — modifiable home-environment exposure remains the preferred intervention where feasible."
  - "Do not ignore alarm features (persistent cough, hemoptysis, dyspnea, weight loss) — immediate chest imaging + diagnostic referral."
  - "Do not use this pathway as a first-line standard — the intensified track remains preferred for the cooking-emissions cohort."
  - "Do not skip tobacco / secondhand-smoke history elicitation — clustering sharply changes risk stratification and LDCT-screening eligibility regardless of surveillance-track choice."

