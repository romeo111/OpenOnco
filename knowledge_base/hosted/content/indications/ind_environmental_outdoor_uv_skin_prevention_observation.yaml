do_not_do:
  - "Не представляти спостереження як еквівалент фотозахисту — зниження захворюваності на БКР, ПКР та меланому при цьому не досягається."
  - "Не пропускати щорічний клінічний огляд шкіри — раннє виявлення актинічного кератозу та немеланомного раку шкіри на курабельній стадії."
  - "Не пропускати коротке консультування щодо фотозахисту на кожному візиті — повторний вплив має кумулятивний поведінковий ефект, особливо за наявності видимих ознак фотопошкодження шкіри."
  - "Не ігнорувати нові стійкі шкірні утворення — обстеження за появи симптомів залишається пріоритетом."
  - "Не представляти рішення пацієнта як остаточне — періодичне повторне обговорення треку фотозахисту на повторних візитах є доречним."

do_not_do_en:
  - "Do not present observation as equivalent to photoprotection — BCC + SCC + melanoma incidence reduction is not achieved."
  - "Do not skip annual clinical skin exam — early detection of AKs / NMSC at curable stage."
  - "Do not skip brief photoprotection counseling at every visit — repeated exposure has cumulative behavioral effect, especially with visible photo-damage."
  - "Do not ignore new persistent skin lesions — symptom-triggered evaluation remains a priority."
  - "Do not present the decision as final — periodic re-discussion of the photoprotection track is appropriate."

