desired_tests: []

rationale: >
  Alternative-track companion to IND-ENVIRONMENTAL-OUTDOOR-UV-SKIN-
  PREVENTION-PHOTOPROTECTION. Patient declines structured personal
  photoprotection (occupational practicality — eg, agricultural work
  in summer heat with PPE intolerance, cost, preference, cosmetic /
  social factors) — receives annual clinical full-body skin exam +
  patient skin self-exam education + brief photoprotection counseling
  with each clinical contact + actinic-keratosis treatment as
  detected. Per CHARTER §11 patient-autonomy framing — exposure-
  management constraints are legitimate but framed as suboptimal vs.
  full-photoprotection comparator. Periodic re-discussion of
  photoprotection track at follow-up visits is appropriate.

rationale_ua: >
  Альтернативний трек-супутник до показання
  IND-ENVIRONMENTAL-OUTDOOR-UV-SKIN-PREVENTION-PHOTOPROTECTION.
  Пацієнт відмовляється від структурованого особистого фотозахисту
  (практичні обмеження на робочому місці — напр., сільськогосподарська
  робота в літню спеку з непереносимістю засобів індивідуального
  захисту, вартість, особисті вподобання, косметичні/соціальні фактори)
  — отримує щорічний клінічний огляд всієї поверхні шкіри, навчання
  пацієнта самообстеженню шкіри, коротке консультування щодо
  фотозахисту при кожному клінічному контакті та лікування актинічного
  кератозу за виявлення. Відповідно до рамки автономії пацієнта за
  CHARTER §11 — обмеження щодо управління впливом є легітимними, але
  розглядаються як субоптимальні порівняно з повним фотозахистом.
  Періодичне повторне обговорення треку фотозахисту на повторних
  візитах є доречним.

