do_not_do:
  - "Не представляти спостереження як еквівалент усунення впливу — ризик раку легені та серцево-судинний ризик, пов'язаний з ETS, продовжує накопичуватися."
  - "Не пропускати скерування на відмову від куріння члена сім'ї — це основний важіль, і пропозицію слід повторювати на кожному візиті."
  - "Не ігнорувати тривожні ознаки (стійкий кашель, кровохаркання, задишка, втрата ваги) — негайна діагностична візуалізація та мультидисциплінарний розгляд."
  - "Не представляти рішення як остаточне — періодичне повторне обговорення треку усунення впливу є доцільним, особливо за зміни сімейних обставин."

do_not_do_en:
  - "Do not present observation as equivalent to elimination — ETS-attributable lung-cancer + cardiovascular risk continues to accumulate."
  - "Do not skip cohabitant cessation referral — it is the core lever, and the offer should be renewed at every visit."
  - "Do not ignore alarm features (persistent cough, hemoptysis, dyspnea, weight loss) — immediate diagnostic imaging + multidisciplinary review."
  - "Do not present the decision as final — periodic re-discussion of the elimination track is appropriate, especially with changes in domestic circumstances."

