do_not_do:
  - "НЕ застосовувати при аденокарциномі — у CheckMate-648 включали лише ESCC"
  - "НЕ застосовувати у пацієнтів з попереднім досвідом терапії інгібітором контрольних точок імунітету"
  - "НЕ застосовувати за активного аутоімунного захворювання, що потребує системної імуносупресії (високий ризик irAE при комбінованій ICI-терапії)"
  - "НЕ застосовувати у пацієнтів з трансплантацією солідного органа в анамнезі (ризик відторгнення)"
  - "НЕ продовжувати іпілімумаб понад еквівалент 4 циклів за наростання irAE — перейти на монотерапію ніволумабом"
  - "НЕ пропускати вихідне обстеження ендокринної та серцевої функції (частота irAE при комбінованій ICI-терапії становить ~30%+)"
  - "НЕ застосовувати за ECOG ≥2 (у дослідження включали лише 0-1; безпека за гіршого функціонального статусу не встановлена)"

do_not_do_en:
  - "Do NOT use in adenocarcinoma — CheckMate-648 enrolled ESCC only"
  - "Do NOT use in patients with prior ICI exposure"
  - "Do NOT use in active autoimmune disease requiring systemic immunosuppression (high irAE risk on combination ICI)"
  - "Do NOT use in patients with prior solid organ transplant (rejection risk)"
  - "Do NOT continue ipilimumab beyond cycle 4 equivalent if irAEs are escalating — switch to nivo monotherapy"
  - "Do NOT skip baseline endocrine + cardiac panels (combination ICI has ~30%+ irAE rate)"
  - "Do NOT use if ECOG ≥2 (trial enrolled 0-1; safety in poor PS unestablished)"

