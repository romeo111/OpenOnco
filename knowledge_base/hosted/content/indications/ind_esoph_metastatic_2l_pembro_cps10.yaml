rationale: >
  Pembrolizumab monotherapy is NCCN cat 1 for 2L metastatic esophageal
  carcinoma (squamous OR adenocarcinoma) with PD-L1 CPS ≥10 after 1L
  fluoropyrimidine + platinum (without prior ICI). KEYNOTE-181
  established OS benefit in CPS ≥10 subgroup. Distinct from
  ATTRACTION-3 nivolumab (squamous only, biomarker-agnostic). Both
  histologies eligible if CPS ≥10. Patients with adenocarcinoma + CPS
  <10 → ramucirumab+paclitaxel gastric-style (not separately modeled
  here). Squamous + CPS<10 → nivolumab (biomarker-agnostic ESCC).

rationale_ua: >
  Пембролізумаб у монотерапії є варіантом категорії 1 NCCN для 2-ї лінії
  лікування метастатичного раку стравоходу (плоскоклітинного або
  аденокарциноми) з PD-L1 CPS≥10 після прогресування на тлі 1-ї лінії
  фторпіримідину + платини (без попередньої ICI-терапії). KEYNOTE-181
  встановив перевагу загальної виживаності у підгрупі CPS≥10. Відрізняється
  від схеми з ніволумабом (ATTRACTION-3), яка застосовується лише при
  плоскоклітинному раку незалежно від біомаркера. Обидві гістології придатні
  за CPS≥10. Пацієнти з аденокарциномою та CPS<10 маршрутизуються до
  рамуцирумабу + паклітакселу (шлунковий стиль). Пацієнти з плоскоклітинним
  раком та CPS<10 маршрутизуються до ніволумабу (незалежно від біомаркера
  при ESCC). Тестування PD-L1 CPS є обов'язковим для цього показання.
  Категорія 1 NCCN.
