do_not_do:
  - "НЕ призначати без тестування PD-L1 CPS — ефективність обмежена підгрупою CPS≥10."
  - "НЕ призначати за активного аутоімунного захворювання — irAE прогресуватиме."
  - "НЕ продовжувати лікування при irAE ступеня ≥3 без розгляду питання про остаточне припинення терапії."
  - "НЕ застосовувати за ECOG ≥3 — користь ICI в ослабленої популяції пацієнтів не встановлена."
  - "НЕ застосовувати після попередньої ICI-терапії у 1-й лінії (KEYNOTE-590) — даних щодо повторного застосування немає."
  - "НЕ затверджувати план лікування без підтвердженого шляху фінансування — НСЗУ 2026 НЕ покриває пембролізумаб для стравоходу."

do_not_do_en:
  - "Do not prescribe without PD-L1 CPS testing — efficacy limited to CPS ≥10 subgroup."
  - "Do not prescribe in active autoimmune disease — irAE will progress."
  - "Do not continue through Grade ≥3 irAE without permanent discontinuation consideration."
  - "Do not use at ECOG ≥3 — benefit of ICI in frail population not established."
  - "Do not use after 1L ICI-exposure (KEYNOTE-590) — no data on reuse."
  - "Do not confirm the plan without verified funding pathway — NSZU 2026 does NOT cover pembrolizumab for esophagus."
