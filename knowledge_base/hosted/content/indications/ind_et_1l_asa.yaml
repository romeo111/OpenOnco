rationale: >
  Standard 1L for low-risk ET (age ≤60 AND no prior thrombosis AND
  IPSET-thrombosis low/intermediate): low-dose aspirin 81-100 mg daily
  (avoid in extreme thrombocytosis with acquired vWD). NO cytoreduction
  needed. Cytoreduction (HU 1L) added for high-risk per
  RF-PV-ET-HIGH-THROMBOSIS-RISK; anagrelide is 2L per PT-1 trial.

rationale_ua: >
  Стандарт першої лінії (1L) для ЕТ низького ризику (вік ≤60 і відсутність
  попереднього тромбозу і низький/проміжний ризик за IPSET-thrombosis):
  низькодозовий аспірин 81-100 mg щоденно (уникати за екстремального
  тромбоцитозу з набутою хворобою фон Віллебранда, vWD). Циторедукція не
  потрібна. Циторедукція (HU в першій лінії) додається за захворювання
  високого ризику згідно з RF-PV-ET-HIGH-THROMBOSIS-RISK; анагрелід
  (anagrelide) призначається в другій лінії за дослідженням PT-1.
  Категорія NCCN 1.
ukrainian_review_status: pending_clinical_signoff
