    position: supports
    relevant_quote_paraphrase: "ASA alone is foundation of low-risk ET; HU added for high-risk"
  - source_id: SRC-ESMO-MPN-2015
    position: supports
    relevant_quote_paraphrase: "Low-risk ET → ASA; high-risk → HU + ASA"

do_not_do:
  - "Не пропускати тестування JAK2 / CALR / MPL — статус драйверної мутації визначає підтип захворювання та ризик за IPSET-thrombosis."
  - "Не призначати аспірин (ASA) за екстремального тромбоцитозу (тромбоцити >1500×10⁹/л) без виключення набутої хвороби фон Віллебранда — перевірити активність ристоцетин-кофактора."
  - "Не пропускати диференціальну діагностику з префібротичним первинним мієлофіброзом за трепанобіопсією — клінічна картина подібна, прогноз гірший."
  - "Не призначати анагрелід у першій лінії — дослідження PT-1 показало гірший серцево-судинний профіль; HU залишається більш прийнятним варіантом."
  - "Не використовувати повну дозу аспірину (ASA) — стандартом є низька доза."

do_not_do_en:
  - "Do not skip JAK2 / CALR / MPL testing — driver-mutation status determines subtype + IPSET-thrombosis risk."
  - "Do not prescribe ASA in extreme thrombocytosis (plt >1500K) without ruling out acquired vWD — check ristocetin cofactor activity."
  - "Do not skip prefibrotic-PMF differential on trephine — same presentation, worse prognosis."
  - "Do not prescribe anagrelide 1L — PT-1 trial showed lower cardiovascular profile + HU more preferable."
  - "Do not use full-dose ASA — low-dose is standard."
known_controversies:
  - topic: "Twice-daily ASA dosing in JAK2+ ET (вплив на arterial thrombosis prevention)"
    positions:
      - position: "JAK2+ ET may benefit from BID ASA dosing (small studies suggest residual platelet aggregability after evening hours)"
        sources:
          - SRC-NCCN-MPN-2025
      - position: "Once-daily ASA standard; BID experimental"
        sources:
          - SRC-ESMO-MPN-2015
    our_default: "Once-daily ASA standard; BID dosing reserved for confirmed thrombosis on standard regimen"
    rationale: "BID lacks robust phase-3 evidence"

