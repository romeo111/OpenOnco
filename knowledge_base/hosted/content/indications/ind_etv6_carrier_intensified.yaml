expected_outcomes:
  overall_response_rate: >-
    Intensified-track surveillance (q3-month CBC + smear from infancy
    through age 20, scheduled BMA every 2-3 years from age 5 during
    peak pediatric B-ALL window, preemptive HLA + donor germline
    mapping) is justified by the dominant pediatric B-ALL phenotype
    (~25-30% cumulative incidence with first two decades onset) and
    explicit structured pediatric-oncology + adult-hematology co-
    management plan. Patient-burden tradeoff (frequent pediatric
    visits, repeat sedation for BMA in a child) is shared-decision-
    making with family + pediatric oncology team per CHARTER §11.

