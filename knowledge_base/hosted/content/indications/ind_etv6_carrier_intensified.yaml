do_not_do:
  - "Не рекомендувати інтенсифіковану-трек cadence без явного shared-decision-making — q3-month візити в дитинстві + scheduled BMA з sedation несуть значущий patient + family burden."
  - "Не виконувати запланованої pediatric BMA без супутнього flow cytometry — pediatric B-ALL — головна загроза і immunophenotyping визначає лінію; myeloid NGS sam недостатній."
  - "Не пропускати pediatric-to-adult transition planning — care-relationships мають бути встановлені заздалегідь, без gap у surveillance при переході до adult hematology."
  - "Не використовувати кандидат-сиблінг-донора, доки germline-screening не завершений — sibling-carrier донор не може використовуватись регардлес інтенсифікованого треку."

do_not_do_en:
  - "Do not recommend the intensified-track cadence without explicit shared-decision-making — q3-month visits in childhood + scheduled BMA with sedation carry meaningful patient + family burden."
  - "Do not perform scheduled pediatric BMA without companion flow cytometry — pediatric B-ALL is the dominant threat and immunophenotyping identifies the lineage; myeloid NGS alone is insufficient."
  - "Do not skip pediatric-to-adult transition planning — care relationships should be established in advance, with no gap in surveillance at the handoff to adult hematology."
  - "Do not use a candidate sibling donor before germline-screening is completed — a sibling-carrier donor cannot be used regardless of intensified-track designation."

