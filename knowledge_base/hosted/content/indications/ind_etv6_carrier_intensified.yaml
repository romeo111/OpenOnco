rationale: >
  Alternative-track companion to IND-ETV6-CARRIER-SURVEILLANCE.
  Intensified cadence reflects the dominant pediatric B-ALL phenotype
  in ETV6 carriers and explicit pre-emptive transplant-team
  engagement.

  **CBC + peripheral smear q3 months from infancy through age 20:**
  Half the standard-track cadence during the peak pediatric B-ALL
  window. After age 20, cadence relaxes to q6 months (adult MDS / AML
  risk is meaningful but onset window is much wider, making frequent
  surveillance lower-yield).

  **Scheduled BMA + flow cytometry + cytogenetics + myeloid NGS
  every 2-3 years from age 5 during peak risk window:** Provoked
  BMA (any unexplained CBC change, lymphadenopathy, unexplained
  fatigue / weight loss) remains the primary trigger, but scheduled
  BMA + flow at 2-3 year intervals from age 5 through age 18 is
  added in this track regardless of CBC stability — the pediatric
  B-ALL onset window is the primary driver. BMA in a child requires
  general anesthesia / deep sedation in most centers; patient-burden
  is meaningful and the indication must be discussed with family +
  pediatric oncology.

  **Preemptive HLA typing of candidate sibling-donor cohort +
  germline-testing of all candidates:** Performed BEFORE any B-ALL /
  MDS / AML diagnosis. ETV6-carrier siblings excluded from donor
  candidacy. Unrelated-donor search initiated if no eligible sibling.

  **Structured pediatric-oncology + adult-hematology co-management
  plan from initial confirmation:** Care relationships established
  before any malignancy event so that transitions at puberty / young
  adulthood are seamless. Pediatric oncology leads through age 18-21
  (institution-dependent); adult hematology takes over for ongoing
  adult-onset MDS / AML surveillance.

  Per CHARTER §11 patient-autonomy framing: intensified cadence
  carries higher procedural burden, especially in a child where BMA
  requires sedation. Family + patient (when age-appropriate) +
  pediatric oncology team co-decide on cadence intensity.

rationale_ua: >
  Альтернативно-трекова Indication, sibling до IND-ETV6-CARRIER-
  SURVEILLANCE. Інтенсифікована cadence відображає домінантний
  pediatric B-ALL фенотип у ETV6-носіїв і явне pre-emptive
  transplant-team engagement.

  **ЗАК + периферичний мазок q3 місяці від немовлячого віку до 20
  років:** Половина стандартно-трекової cadence під час peak
  pediatric B-ALL вікна. Після 20 років, cadence релаксує до q6
  місяців (adult MDS / AML ризик — meaningful, але onset window
  набагато ширше).

  **Запланована BMA + flow cytometry + цитогенетика + myeloid NGS
  кожні 2-3 роки з 5 років під час peak risk вікна:** Provoked BMA
  залишається primary тригером, але запланована BMA + flow на 2-3
  річних інтервалах з 5 до 18 років додана в цьому треку незалежно
  від CBC stability — pediatric B-ALL onset window — primary driver.
  BMA у дитини потребує загальної анестезії / deep sedation у
  більшості центрів; patient-burden — meaningful і indication має
  бути обговорена з родиною + pediatric oncology.

  **Pre-emptive HLA-типування кандидат-сиблінг-донор-cohort +
  germline-тестування всіх кандидатів:** Виконується ДО будь-якого
  діагнозу B-ALL / МДС / ГМЛ. ETV6-носії-сиблінги виключаються з
  donor-candidacy. Unrelated-donor search розпочатий, якщо немає
  eligible сиблінга.

  **Структурований pediatric-oncology + adult-hematology co-management
  план від початкового підтвердження:** Care-relationships встановлені
  перед будь-якою malignancy подією. Pediatric oncology веде через
  18-21 рік (institution-dependent); adult hematology переймає для
  ongoing adult-onset MDS / AML surveillance.

  Per CHARTER §11 framing автономії пацієнта.

