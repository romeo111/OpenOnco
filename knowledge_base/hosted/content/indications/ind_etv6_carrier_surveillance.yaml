expected_outcomes:
  overall_response_rate: >-
    Standard-track confirmed-carrier surveillance of germline ETV6
    (Thrombocytopenia 5 / THC5) carriers — Noetzli 2015 + Zhang 2015
    + Topka 2015 cohort descriptions show ~25-30% cumulative pediatric
    B-ALL incidence and additional ~10-15% adult MDS / AML. Pediatric
    surveillance starting in infancy and persisting through adulthood
    enables earlier detection of incident hematologic malignancy.
    Pediatric oncology + adult hematology co-management is the
    standard care pattern given the carrier's age-spanning risk
    profile.

