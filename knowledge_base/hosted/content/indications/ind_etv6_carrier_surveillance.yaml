    position: context

do_not_do:
  - "Не пропускати pediatric oncology консультацію при підтвердженні носійства у дитини — B-ALL — домінантний педіатричний фенотип; pediatric-aware surveillance планування відрізняється від adult myeloid surveillance."
  - "Не використовувати лише blood-based germline тестування для cascade screening — somatic-clone contamination може затушувати germline status; buccal / fibroblast / cultured-skin tissue потрібне."
  - "Не пропускати BMA + flow cytometry при unexplained лімфаденопатії або лімфоцитозі у ETV6-носія — B-ALL pediatric презентує таким чином і pre-test probability значно вища ніж у age-matched general population."
  - "Не пропонувати antiplatelet терапію ETV6-носію без явного shared-decision-making про bleeding-ризик."
  - "Не використовувати кандидат-сиблінг-донора, доки germline-screening не завершений — sibling-carrier донор не може використовуватись."

do_not_do_en:
  - "Do not skip pediatric oncology consultation on carrier confirmation in a child — B-ALL is the dominant pediatric phenotype; pediatric-aware surveillance planning differs from adult myeloid surveillance."
  - "Do not rely on blood-only germline testing for cascade screening — somatic-clone contamination can obscure germline status; buccal / fibroblast / cultured-skin tissue is required."
  - "Do not defer BMA + flow cytometry on unexplained lymphadenopathy or lymphocytosis in an ETV6 carrier — pediatric B-ALL presents this way and the pre-test probability is substantially higher than in the age-matched general population."
  - "Do not prescribe antiplatelet therapy to an ETV6 carrier without explicit shared-decision-making about bleeding risk."
  - "Do not use a candidate sibling donor before germline-screening is completed — a sibling-carrier cannot be used as donor."

