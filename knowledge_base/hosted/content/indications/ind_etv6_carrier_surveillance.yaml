    position: supports
    relevant_quote_paraphrase: >-
      "Germline ETV6 (Thrombocytopenia 5) confers substantial
      lifetime risk of pediatric B-ALL and adult MDS / AML; lifelong
      CBC + smear surveillance with provoked BMA + flow + NGS, cascade
      germline testing, and pre-transplant donor germline screening
      are recommended."
  - source_id: SRC-ESMO-MDS-2021
    position: context
