rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with a documented germline ETV6 pathogenic variant (Thrombocytopenia
  5 / THC5).

  **CBC + peripheral smear q3-6 months from infancy / carrier
  confirmation, lifelong:** Baseline mild-to-moderate isolated
  thrombocytopenia (50-130 x10⁹/L typically) with red-cell macrocytosis
  is the carrier phenotype; clinical-change thresholds are a decline
  in another lineage (WBC, Hb beyond baseline macrocytosis pattern),
  persistent dysplastic morphology on smear, emerging blasts /
  lymphoblasts, unexplained lymphocytosis, or new lymphadenopathy
  (the latter prompting pediatric oncology evaluation for B-ALL).

  **BMA + flow cytometry + cytogenetics + myeloid NGS at any
  clinically-concerning change:** Trigger thresholds include any
  unexplained cytopenia in a non-platelet lineage, persistent
  dysplasia, emerging blasts, new lymphadenopathy, or unexplained
  fatigue / weight-loss in a pediatric carrier. Flow cytometry is
  essential because B-ALL is the dominant pediatric phenotype and
  immunophenotyping discriminates lymphoid lineage; the myeloid NGS
  panel must capture ETV6 (full coding including PNT + ETS domains),
  IKZF1, PAX5, CRLF2, and standard MDS-relevant genes (ASXL1, BCOR,
  monosomy-7).

  **Pediatric oncology consultation on initial carrier confirmation
  in a child:** Required step. B-ALL is the dominant childhood
  phenotype and early-detection planning differs from adult myeloid
  surveillance. The pediatric oncology team establishes the surveillance
  cadence + threshold for diagnostic workup + family communication
  plan + cascade-testing referral.

  **Annual review of bleeding history:** Bleeding burden ranges from
  asymptomatic to clinically-significant in the ETV6 carrier
  population; annual structured review captures patterns and triggers
  medication review (antiplatelet avoidance recommended when feasible).

  **Cascade germline testing for first-degree relatives:** Documented
  buccal / fibroblast / cultured-skin germline confirmation required.
  Children of confirmed carriers should be tested in early childhood
  given the pediatric onset window for B-ALL — the carrier-status
  knowledge informs surveillance from infancy.

  **Donor-screening protocol:** Any candidate sibling donor must be
  germline-tested for ETV6 before HSC mobilization. ETV6-carrier
  siblings must NOT donate — donor-derived disease in inherited
  predisposition syndromes is established; ETV6-specific scenarios
  follow the same pattern.

  **Treatment-time implication recorded:** When B-ALL emerges in a
  pediatric ETV6 carrier, standard pediatric B-ALL chemotherapy
  protocols apply (no documented requirement for protocol modification
  based on carrier status per current guidelines); carrier status
  influences relapse-monitoring intensity and donor selection if
  HSC transplant becomes necessary.

  Per CHARTER §11 patient-autonomy framing: surveillance cadence,
  pediatric-onset starting age, and BMA threshold are shared-decision-
  making with family + pediatric oncology + hematology team.

rationale_ua: >
  Стандартний-трек шлях спостереження підтверджених носіїв для осіб з
  задокументованим гермінативним патогенним варіантом ETV6
  (Thrombocytopenia 5 / THC5).

  **ЗАК + периферичний мазок q3-6 місяців від немовлячого віку /
  підтвердження носійства, життєво:** Baseline м'яка-помірна ізольована
  тромбоцитопенія (50-130 x10⁹/л зазвичай) з macrocytosis red-cell —
  фенотип носія; порогові клінічно-зміни: декремент в іншій лінії
  (WBC, Hb поза baseline macrocytosis pattern), персистуюча displastic
  morphology на смазку, emerging бласти / лімфобласти, нез'ясований
  лімфоцитоз, або нова лімфаденопатія (остання prompts pediatric
  oncology evaluation для B-ALL).

  **BMA + flow cytometry + цитогенетика + myeloid NGS при будь-якій
  клінічно-концерній зміні:** Порогові тригери: будь-яка нез'ясована
  цитопенія в non-platelet лінії, персистуюча dysplasia, emerging
  бласти, нова лімфаденопатія, або нез'ясована fatigue / weight-loss
  у педіатричного носія. Flow cytometry — essential, бо B-ALL —
  домінантний педіатричний фенотип і immunophenotyping дискримінує
  лімфоїдну лінію.

  **Pediatric oncology консультація на початковому підтвердженні
  носійства у дитини:** Required крок. B-ALL — домінантний дитячий
  фенотип і early-detection planning відрізняється від adult
  myeloid surveillance.

  **Щорічний огляд bleeding history:** Bleeding burden коливається
  від асимптомного до клінічно-значущого у популяції ETV6-носіїв.

  **Cascade germline тестування для родичів першого ступеня:**
  Задокументоване buccal / fibroblast / cultured-skin germline
  підтвердження потрібне. Діти підтверджених-носіїв мають бути
  протестовані в ранньому дитинстві з огляду на pediatric onset
  window для B-ALL.

  **Donor-screening протокол:** Будь-який кандидат-сиблінг-донор має
  бути germline-тестований на ETV6 перед HSC mobilization. ETV6-
  носії-сиблінги НЕ можуть донорити.

  **Treatment-time implication записана:** Коли B-ALL виникає у
  pediatric ETV6-носія, стандартні pediatric B-ALL chemotherapy
  protocols застосовуються; carrier status впливає на relapse-
  monitoring intensity і donor selection якщо HSC transplant стає
  необхідним.

  Per CHARTER §11 framing автономії пацієнта.

