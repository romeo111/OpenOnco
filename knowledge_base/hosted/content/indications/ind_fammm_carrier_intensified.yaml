rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-FAMMM-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-FAMMM-CARRIER-
  SURVEILLANCE applies (annual whole-body dermatology, total body
  photography + dermoscopy, pancreatic EUS / MRI q1-2y from 40,
  sun-protection counseling).

  **Intensification 1 — Earlier pancreatic surveillance initiation:**
  In CDKN2A carriers with active smoking history or family pancreatic
  cancer onset < age 50, advance pancreatic surveillance start from
  age 40 to age 30-35. Trade-off: more lifetime EUS / MRI studies +
  earlier exposure to false-positive findings (small cystic lesions
  near-universal in young adults — IPMN differential complex).
  Center must be experienced in CAPS-style pancreatic surveillance to
  avoid harm from unnecessary biopsies / resections.

  **Intensification 2 — Intensified sun-avoidance program:**
    - Structured occupational counseling (outdoor work modification —
      indoor reassignment, shade structures, sun-protective uniform)
    - UV-protective clothing prescription (UPF 50+) for daily wear,
      not just recreational
    - Window film for vehicle and home (UV-A exposure through glass)
    - Photoprotection adjuncts: nicotinamide (vitamin B3, 500 mg BID
      — modest reduction in non-melanoma skin cancer per ONTRAC trial,
      no melanoma-specific evidence; conservative discussion as
      shared-decision-making rather than mandate)
    - Vitamin D monitoring + supplementation if avoidance regimen
      lowers endogenous synthesis

  **Other intensification considerations (not core to this track):**
    - Empirical pre-emptive nevus excision is NOT recommended — even
      in dense atypical nevus phenotype, excision-only-on-change is
      the standard of care; pre-emptive excision of clinically benign
      nevi creates excessive scarring without melanoma-specific benefit.
    - mTOR-pathway / CDK4/6 inhibitor chemoprevention — investigational
      despite mechanistic rationale (CDKN2A regulates CDK4/6); do NOT
      prescribe outside trial setting.

  **Cascade testing remains continuous:** every visit re-confirms
  family testing status.

  Per CHARTER §11: intensified surveillance and lifestyle counseling
  are shared-decision-making.

rationale_ua: >
  Шлях агресивного треку для підтверджених носіїв, що накладається поверх
  стандартного протоколу IND-FAMMM-CARRIER-SURVEILLANCE.

  **Основа:** Застосовується весь стандартний нагляд з
  IND-FAMMM-CARRIER-SURVEILLANCE (щорічна дерматологія всього тіла,
  тотальна фотографія тіла + дерматоскопія, панкреатичний нагляд EUS /
  МРТ раз на 1-2 роки з 40 років, консультування щодо сонцезахисту).

  **Інтенсифікація 1 — Більш раннє початок панкреатичного нагляду:** У
  носіїв CDKN2A з активним анамнезом куріння або сімейним раком
  підшлункової залози з початком до 50 років початок панкреатичного
  нагляду переноситься з 40 років на 30-35 років. Компроміс: більше
  досліджень EUS / МРТ протягом життя + раніша експозиція до
  хибнопозитивних знахідок (дрібні кістозні утворення майже повсюдні у
  молодих дорослих — диференціальна діагностика з IPMN складна). Центр
  повинен мати досвід панкреатичного нагляду за протоколом CAPS, щоб
  уникнути шкоди від непотрібних біопсій / резекцій.

  **Інтенсифікація 2 — Посилена програма уникнення сонця:**
    - Структуроване консультування щодо професійної діяльності
      (модифікація роботи на відкритому повітрі — переведення на роботу
      в приміщенні, тіньові конструкції, сонцезахисна уніформа)
    - Призначення UV-захисного одягу (UPF 50+) для щоденного носіння, а
      не лише для відпочинку
    - Захисна плівка на вікна для автомобіля та будинку (UV-A
      випромінювання проникає крізь скло)
    - Додаткові засоби фотозахисту: нікотинамід (вітамін B3, 500 mg BID
      — помірне зниження ризику немеланомного раку шкіри за даними
      дослідження ONTRAC, специфічних доказів щодо меланоми немає;
      обговорюється консервативно в рамках спільного прийняття рішень,
      а не як обов'язкова вимога)
    - Моніторинг вітаміну D + за потреби добавки, якщо режим уникнення
      сонця знижує ендогенний синтез

  **Інші міркування щодо інтенсифікації (не є основними для цього
  треку):**
    - Емпірична превентивна ексцизія невусів НЕ рекомендована — навіть
      за щільного атипового невусного фенотипу стандартом лікування
      залишається ексцизія лише за зміни невуса; превентивне видалення
      клінічно доброякісних невусів спричиняє надмірне рубцювання без
      специфічної користі щодо меланоми.
    - Хіміопрофілактика інгібіторами mTOR / CDK4/6 — досліджується,
      попри механістичне обґрунтування (CDKN2A регулює CDK4/6); НЕ
      призначати поза межами клінічного дослідження.

  **Каскадне тестування залишається безперервним:** на кожному візиті
  повторно підтверджується статус сімейного тестування.

  Відповідно до CHARTER §11: інтенсифікований нагляд та консультування
  щодо способу життя здійснюються за принципом спільного прийняття
  рішень.

