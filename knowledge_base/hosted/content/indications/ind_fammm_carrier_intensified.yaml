do_not_do:
  - "Не переносити початок панкреатичного нагляду на вік раніше 30-35 років за відсутності анамнезу куріння або сімейного раку з раннім початком — тягар хибнопозитивних результатів та раннє променеве навантаження не виправдані."
  - "Не виконувати емпіричну превентивну ексцизію невусів за щільного атипового фенотипу — стандартом залишається ексцизія лише за зміни невуса."
  - "Не використовувати хіміопрофілактику інгібіторами mTOR / CDK4/6 поза межами клінічного дослідження — цей підхід залишається досліджуваним, попри механістичне обґрунтування зв'язку CDKN2A-CDK4/6."
  - "Не подавати нікотинамід як засіб хіміопрофілактики меланоми — доказова база стосується лише немеланомного раку шкіри (дослідження ONTRAC), специфічних доказів щодо меланоми немає."
  - "Не пропускати моніторинг вітаміну D за посиленого уникнення сонця — за суворого режиму уникнення може розвинутись дефіцит."

do_not_do_en:
  - "Do not advance pancreatic surveillance earlier than age 30-35 without smoking history or family early-onset cancer — false-positive burden and early imaging exposure are not justified otherwise."
  - "Do not perform empirical pre-emptive nevus excision in dense atypical phenotype — excision-only-on-change is the standard of care."
  - "Do not use mTOR / CDK4/6 inhibitor chemoprevention outside a clinical trial — investigational despite the CDKN2A-CDK4/6 mechanistic rationale."
  - "Do not present nicotinamide as melanoma chemoprevention — evidence base is only for non-melanoma skin cancer (ONTRAC), not melanoma-specific."
  - "Do not skip vitamin D monitoring with intensified sun-avoidance — deficiency can emerge with a strict avoidance regimen."

