rationale: >
  Standard-track confirmed-carrier surveillance pathway for CDKN2A-
  positive carriers per NCCN Genetic / Familial High-Risk: Breast,
  Ovarian, Pancreatic (covers FAMMM pancreatic surveillance), Goldstein
  et al. recommendations, and CAPS Consortium consensus.

  **Cutaneous melanoma (~60-80% lifetime; often multiple primaries):**
  Annual whole-body skin examination by dermatologist with total body
  photography (digital baseline + annual comparison) and dermoscopy
  for atypical nevi. Self-examination education with mirror / partner
  technique for hard-to-see sites. Lower threshold for excisional
  biopsy of any changing / atypical lesion. Earlier start: at-risk
  pediatric carriers from age 10 with parental-supervised skin exam.

  **Pancreatic adenocarcinoma (~15-25% lifetime — CDKN2A is CAPS
  Consortium-eligible):** EUS or MRI / MRCP q1-2y starting age 40
  (earlier if family pancreatic cancer < age 50 — see INTENSIFIED
  track for that scenario). HbA1c q1y as adjunctive early-diabetes
  signal. Smoking cessation is essential — smoking is the dominant
  modifiable cofactor (multiplicatively raises CDKN2A pancreatic risk).

  **Sun-protection counseling:** Broad-spectrum SPF 30+ daily;
  protective clothing (long sleeves, hats with brims, sun-protective
  fabric); avoidance of peak-UV hours; tanning bed prohibition.
  Particularly important in pediatric / adolescent carriers (childhood
  UV exposure is the strongest modifiable melanoma risk factor).

  **Cascade testing:** Mandates offer to all first-degree relatives.
  Pediatric testing appropriate given the childhood-onset skin exam
  window.

  **Uveal melanoma (modest elevation):** No dedicated ophthalmology
  surveillance required for CDKN2A carriers (unlike BAP1-TPDS — see
  RF-BAP1-CONFIRMED-CARRIER for ocular surveillance). Routine eye
  exams sufficient.

  Per CHARTER §11 patient-autonomy framing; pediatric surveillance
  requires family counseling.

rationale_ua: >
  Стандартний трек нагляду за підтвердженими носіями для CDKN2A-позитивних
  пацієнтів згідно з настановами NCCN Genetic / Familial High-Risk: Breast,
  Ovarian, Pancreatic (охоплює панкреатичний нагляд FAMMM), рекомендаціями
  Goldstein et al. та консенсусом CAPS Consortium.

  **Меланома шкіри (~60-80% довічний ризик; часто множинні первинні
  пухлини):** Щорічний огляд шкіри всього тіла дерматологом з тотальною
  фотографією тіла (цифровий базовий знімок + щорічне порівняння) та
  дерматоскопією атипових невусів. Навчання самообстеженню з
  використанням дзеркала / допомоги партнера для важкодоступних ділянок.
  Знижений поріг для ексцизійної біопсії будь-якого невуса, що
  змінюється, або атипового невуса. Більш ранній початок: у педіатричних
  носіїв групи ризику — з 10 років, огляд шкіри під наглядом батьків.

  **Аденокарцинома підшлункової залози (~15-25% довічний ризик — CDKN2A
  відповідає критеріям CAPS Consortium):** EUS або МРТ / MRCP раз на 1-2
  роки, починаючи з 40 років (раніше — за наявності сімейного раку
  підшлункової залози з початком до 50 років, див. АГРЕСИВНИЙ трек для
  цього сценарію). HbA1c раз на рік як додатковий ранній маркер діабету.
  Припинення куріння є обов'язковим — куріння є домінантним модифікованим
  кофактором (мультиплікативно підвищує панкреатичний ризик при CDKN2A).

  **Консультування щодо сонцезахисту:** Широкоспектральний SPF 30+
  щоденно; захисний одяг (довгі рукави, капелюхи з полями, сонцезахисна
  тканина); уникнення годин пікового UV-опромінення; заборона соляріїв.
  Особливо важливо для педіатричних / підліткових носіїв (опромінення UV
  у дитинстві — найсильніший модифікований фактор ризику меланоми).

  **Каскадне тестування:** Обов'язкова пропозиція для всіх родичів
  першого ступеня спорідненості. Педіатричне тестування доцільне з
  огляду на можливість розпочати огляд шкіри з дитячого віку.

  **Увеальна меланома (помірне підвищення ризику):** Спеціалізований
  офтальмологічний нагляд для носіїв CDKN2A не потрібен (на відміну від
  BAP1-TPDS — див. RF-BAP1-CONFIRMED-CARRIER щодо очного нагляду).
  Достатньо рутинних оглядів очей.

  Відповідно до CHARTER §11 — підхід на основі автономії пацієнта;
  педіатричний нагляд потребує консультування родини.

