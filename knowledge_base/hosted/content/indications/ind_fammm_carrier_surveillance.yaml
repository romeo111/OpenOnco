do_not_do:
  - "Не обмежуватися лише самообстеженням — для мультипримарного фенотипу CDKN2A потрібен щорічний огляд шкіри всього тіла дерматологом з тотальною фотографією тіла та дерматоскопією."
  - "Не пропускати панкреатичний нагляд — CDKN2A є одним з небагатьох спадкових синдромів з достатнім абсолютним ризиком згідно з консенсусом CAPS Consortium."
  - "Не пропускати обговорення припинення куріння — це найважливіший модифікований кофактор панкреатичного ризику при CDKN2A; мультиплікативно підвищує базовий ризик."
  - "Не використовувати солярії — UV-опромінення є домінантним модифікованим фактором ризику меланоми; використання соляріїв будь-ким із CDKN2A категорично протипоказане."
  - "Не пропускати огляд шкіри в дітей — опромінення UV у дитинстві є найсильнішим модифікованим фактором ризику меланоми."

do_not_do_en:
  - "Do not use visual self-exam alone — annual whole-body dermatology with total body photography and dermoscopy is required for the multi-primary CDKN2A phenotype."
  - "Do not skip pancreatic surveillance — CDKN2A is one of the few hereditary syndromes with sufficient absolute risk per CAPS Consortium consensus."
  - "Do not skip smoking-cessation discussion — single most important modifiable cofactor for CDKN2A pancreatic risk; multiplicatively raises baseline."
  - "Do not use tanning beds — UV exposure is the dominant modifiable melanoma risk; tanning bed use in anyone with CDKN2A is categorically contraindicated."
  - "Do not skip pediatric skin exam — childhood UV exposure is the strongest modifiable melanoma risk factor."

