recommended_regimen: null
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: "Empirical FA-protocol surveillance without genetic confirmation captures AML / MDS and head-and-neck SCC at earlier stage in true biallelic FA patients (~50-80% of suspicion cohort), but with lower diagnostic precision and without cascade-testing infrastructure for heterozygous (BRCA2 / PALB2 / BRIP1 / RAD51C) relatives."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests: [TEST-CBC]
desired_tests: []

rationale: >
  Alternative-track companion. Empirical surveillance for FA-suspect
  pedigree (positive chromosome-fragility testing or classic phenotype)
  without confirmed FA-gene panel result:
  - CBC every 3-6 months for cytopenia / clonal evolution
  - Annual bone marrow aspirate + biopsy + cytogenetics from age 8-10
  - Head-and-neck mucosa exam every 6 months from age 10
  - Gynecologic surveillance + accelerated HPV vaccination
  - Avoid alkylators + therapeutic radiation empirically
  - Defer cascade testing pending genetic confirmation

rationale_ua: >
  Альтернативно-трекова Indication. Empirical FA-protocol surveillance
  без genetic confirmation:
  - CBC кожні 3-6 місяців
  - Annual BM з 8-10 років
  - Head-and-neck mucosa exam кожні 6 місяців з 10 років
  - Gynecologic surveillance + accelerated HPV vaccination
  - Уникати alkylators + therapeutic radiation empirically
  - Cascade testing — після genetic confirmation

ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_v03_rare_hereditary
