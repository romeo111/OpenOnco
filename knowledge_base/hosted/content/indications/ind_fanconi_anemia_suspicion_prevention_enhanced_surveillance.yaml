    position: context

do_not_do:
  - "Не презентувати empirical surveillance як еквівалент genetic confirmation — FA subtype визначає cancer-spectrum, conditioning regimen + cascade-testing strategy."
  - "Не використовувати standard-dose alkylators або therapeutic radiation empirically у FA-suspect cohort до виключення FA — radiation / alkylator hypersensitivity може бути lethal."

do_not_do_en:
  - "Do not present empirical surveillance as equivalent to genetic confirmation — FA subtype determines cancer spectrum, conditioning regimen + cascade-testing strategy."
  - "Do not use standard-dose alkylators or therapeutic radiation empirically in FA-suspect cohort until FA is ruled out — radiation / alkylator hypersensitivity may be lethal."

