id: IND-FANCONI-ANEMIA-SUSPICION-PREVENTION-ENHANCED-SURVEILLANCE
plan_track: surveillance
intent: prevention

applicable_to:
  disease_id: DIS-AML
  stage_requirements: []
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints: {ecog_max: 3}

