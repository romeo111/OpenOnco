rationale: >
  Standard-track prevention pathway for Fanconi Anemia suspicion.

  **(1) Genetic counseling + chromosome-fragility testing (diepoxybutane
  / mitomycin-C breakage assay) + germline FA-gene panel** (FANCA, B, C,
  D1/BRCA2, D2, E, F, G, I, J/BRIP1, L, M, N/PALB2, O/RAD51C, P/SLX4,
  Q/ERCC4, others). Autosomal recessive (most subtypes), X-linked
  recessive (FANCB).

  **(2) Confirmed-FA surveillance protocol** (Fanconi Anemia Research
  Fund consensus + NCCN AML / HNSCC):
  - CBC every 3-6 months from diagnosis for cytopenia / clonal evolution
    surveillance
  - Annual bone marrow aspirate + biopsy + cytogenetics + FISH from age
    8-10 (or earlier if cytopenia) — surveillance for MDS / AML
    clonal-evolution (chromosome 1q, 3q, 7 monosomy, 11q markers)
  - Head-and-neck mucosa exam every 6 months from age 10 (SCC
    surveillance — high lifetime risk + younger-onset than sporadic)
  - Gynecologic exam + Pap from menarche; HPV vaccination as accelerated
    priority
  - Annual liver ultrasound + AFP if androgen therapy used (hepatic
    adenoma risk)
  - Plan timely allogeneic HSCT for impending marrow failure / early MDS
    (reduced-intensity conditioning — alkylator + radiation
    hypersensitivity preclude standard busulfan / cyclophosphamide /
    TBI doses)

  **(3) Cascade testing** of at-risk relatives — identifies both biallelic
  (FA-affected siblings) and heterozygous carriers (FANCD1/BRCA2,
  FANCJ/BRIP1, FANCN/PALB2 heterozygotes carry breast / ovarian /
  pancreatic cancer risk — manage per NCCN Genetic/Familial Breast-
  Ovarian).

rationale_ua: >
  Стандартний-трек prevention для Fanconi Anemia.

  **(1) Genetic counseling + chromosome-fragility testing (DEB / MMC) +
  germline FA-gene panel.** Autosomal recessive (most subtypes), X-linked
  recessive (FANCB).

  **(2) FA surveillance протокол:**
  - CBC кожні 3-6 місяців
  - Annual BM aspirate + biopsy + cytogenetics + FISH з 8-10 років
  - Head-and-neck mucosa exam кожні 6 місяців з 10 років (SCC)
  - Gynecologic exam + Pap з менархе; HPV vaccination як accelerated
    priority
  - Annual liver US + AFP якщо androgen therapy
  - Timely HSCT з reduced-intensity conditioning

  **(3) Cascade testing** — biallelic FA-affected родичі + heterozygous
  carriers (BRCA2 / PALB2 / BRIP1 — breast / ovarian / pancreatic
  risk per NCCN Genetic/Familial Breast-Ovarian).

