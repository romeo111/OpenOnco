do_not_do:
  - "Не використовувати standard-dose alkylators (busulfan / cyclophosphamide / melphalan) у biallelic FA — alkylator hypersensitivity → severe / lethal toxicity. Reduced-intensity conditioning required для HSCT."
  - "Не використовувати therapeutic ionizing radiation у biallelic FA — radiation hypersensitivity. Avoid TBI в HSCT conditioning."
  - "Не пропускати semi-annual head-and-neck mucosa exam — SCC risk дуже високий + younger-onset ніж sporadic."
  - "Не керувати heterozygous FANCD1/BRCA2, FANCJ/BRIP1, FANCN/PALB2 carriers як phenotypic FA — вони мають breast / ovarian / pancreatic risk per BRCA-family guidelines, не FA-surveillance protocol."

do_not_do_en:
  - "Do not use standard-dose alkylators (busulfan / cyclophosphamide / melphalan) in biallelic FA — alkylator hypersensitivity → severe / lethal toxicity. Reduced-intensity conditioning required for HSCT."
  - "Do not use therapeutic ionizing radiation in biallelic FA — radiation hypersensitivity. Avoid TBI in HSCT conditioning."
  - "Do not skip semi-annual head-and-neck mucosa exam — SCC risk very high + younger-onset than sporadic."
  - "Do not manage heterozygous FANCD1/BRCA2, FANCJ/BRIP1, FANCN/PALB2 carriers as phenotypic FA — they carry breast / ovarian / pancreatic risk per BRCA-family guidelines, not FA-surveillance protocol."

