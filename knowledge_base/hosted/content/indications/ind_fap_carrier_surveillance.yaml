do_not_do:
  - "Не відкладати профілактичну колектомію за класичної FAP після появи щільного поліпозу — ризик КРР сягає ~100% до 40 років."
  - "Не пропускати нагляд верхньою ЕГДС після колектомії — рак дванадцятипалої кишки є провідною причиною смертності."
  - "Не обмежуватися лише колоноскопією за атенуйованої FAP — також потрібен нагляд за верхніми відділами ШКТ."

do_not_do_en:
  - "Do not delay prophylactic colectomy in classic FAP after dense polyposis appears — CRC risk approaches 100% by age 40."
  - "Do not skip upper EGD surveillance post-colectomy — duodenal cancer is the leading cause of mortality."
  - "Do not use colonoscopy alone in attenuated FAP — upper-GI surveillance also required."

