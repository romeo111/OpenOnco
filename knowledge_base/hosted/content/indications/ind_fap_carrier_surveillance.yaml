rationale: >
  Standard-track confirmed-carrier surveillance per NCCN Genetic/Familial
  High-Risk: Colorectal + InSiGHT FAP guidelines:

  **Classic FAP (typical APC variant, dense polyposis phenotype):**
  - Annual sigmoidoscopy from age 10-12.
  - Colonoscopy when polyps appear (typically 12-15).
  - Prophylactic colectomy (typically late teens to early 20s) — total proctocolectomy
    with IPAA or total colectomy with IRA. Specific timing is patient-individualized
    based on polyp burden + dysplasia + symptoms.
  - Upper EGD q1-3 years starting age 25-30 with Spigelman staging of duodenal
    polyposis; prophylactic duodenectomy considered at Spigelman IV.
  - Annual thyroid US — cribriform-morular variant papillary thyroid cancer.
  - Desmoid tumor awareness (especially post-colectomy).

  **Attenuated FAP (3' / 5' APC variants, attenuated polyposis phenotype):**
  - Colonoscopy q1-2y starting age 18-20 (later onset than classic).
  - Polypectomy as polyps emerge; colectomy timing more flexible — may avoid
    if polyposis remains manageable endoscopically.
  - Upper EGD q1-3y starting 25-30.

  **MAP differential (MUTYH biallelic):** similar phenotype, recessive
  inheritance; surveillance similar to attenuated FAP. Already covered by the
  germline panel testing.

rationale_ua: >
  Стандартний трек нагляду за підтвердженими носіями згідно з настановами
  NCCN Genetic/Familial High-Risk: Colorectal та InSiGHT для FAP:

  **Класична FAP (типовий варіант APC, фенотип щільного поліпозу):**
  - Щорічна сигмоїдоскопія з 10-12 років.
  - Колоноскопія при появі поліпів (зазвичай у 12-15 років).
  - Профілактична колектомія (зазвичай у пізньому підлітковому — на
    початку третього десятиліття життя) — тотальна проктоколектомія з
    ілеоанальним резервуарним анастомозом (IPAA) або тотальна колектомія
    з ілеоректальним анастомозом (IRA). Конкретні строки визначаються
    індивідуально залежно від обтяженості поліпами, дисплазії та
    симптомів.
  - Верхня ЕГДС раз на 1-3 роки, починаючи з 25-30 років, зі
    стадіюванням дуоденального поліпозу за Spigelman; профілактична
    дуоденектомія розглядається за стадії Spigelman IV.
  - Щорічне УЗД щитоподібної залози — кріброзно-морулярний варіант
    папілярного раку щитоподібної залози.
  - Настороженість щодо десмоїдних пухлин (особливо після колектомії).

  **Атенуйована FAP (варіанти APC у 3' / 5' ділянках, фенотип
  атенуйованого поліпозу):**
  - Колоноскопія раз на 1-2 роки, починаючи з 18-20 років (пізніший
    початок, ніж за класичної форми).
  - Поліпектомія у міру появи поліпів; строки колектомії гнучкіші —
    можна уникнути операції, якщо поліпоз залишається керованим
    ендоскопічно.
  - Верхня ЕГДС раз на 1-3 роки, починаючи з 25-30 років.

  **Диференціація з MAP (біалельний MUTYH):** подібний фенотип,
  аутосомно-рецесивне успадкування; нагляд подібний до атенуйованої FAP.
  Уже охоплюється германальним панельним тестуванням.

