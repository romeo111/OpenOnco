do_not_do:
  - "Не подавати посилений нагляд як еквівалент генетичного підтвердження — діагностична точність відсутня; перевага каскадного тестування для родичів втрачається."
  - "Не виконувати профілактичну колектомію в межах емпіричного нагляду за відсутності підтвердженого поліпозу (≥20 аденом) або дисплазії високого ступеня / інвазивної карциноми — операцію обґрунтовує підтверджене носійство APC або обтяженість поліпами, а не сама лише сімейна історія."
  - "Не пропускати періодичне повторне обговорення генетичного тестування — більшість пацієнтів врешті погоджуються на тестування після додаткових візитів і зменшення тривожності."
  - "Не пропускати скринінг гепатобластоми (AFP + УЗД) у дітей із родини з вираженою FAP, навіть без генетичного підтвердження — інтервал раз на 3-6 місяців від народження до 5 років є обов'язковим."
  - "Не розпочинати щорічну верхню ЕГДС у межах емпіричного нагляду в підлітків — дуоденальний поліпоз рідко виникає до 25-30 років, тож інтенсивний скринінг без підтвердження APC є надлишковим."

do_not_do_en:
  - "Do not present enhanced surveillance as equivalent to genetic confirmation — diagnostic precision is absent; cascade-testing benefit for relatives is lost."
  - "Do not perform prophylactic colectomy in empirical surveillance without demonstrable polyposis (≥20 adenomas) or high-grade dysplasia / invasive carcinoma — confirmed APC carrier status or polyp burden justifies surgery, family history alone does not."
  - "Do not skip periodic re-discussion of genetic testing — most patients eventually accept testing after additional visits and reduced anxiety."
  - "Do not skip hepatoblastoma screening (AFP + ultrasound) in children of a strong FAP family even without genetic confirmation — q3-6 month interval birth to age 5 is mandatory."
  - "Do not start annual upper-GI EGD in empirical surveillance of adolescents — duodenal polyposis rarely emerges before age 25-30, and intensive screening without APC confirmation is excessive."

