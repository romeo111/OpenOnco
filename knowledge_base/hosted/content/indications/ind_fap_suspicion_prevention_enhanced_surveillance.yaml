rationale: >
  Alternative-track companion to IND-FAP-SUSPICION-PREVENTION-GENETIC-
  COUNSELING. Patient with pedigree suspicion of FAP / AFAP / Gardner-
  variant who declines genetic counseling and/or germline APC testing
  — for any reason (cost, insurance concerns, psychological / anxiety
  considerations, family privacy, geographic access constraints) — is
  offered empirical enhanced surveillance applied as if FAP were
  confirmed:

  **Colorectal:** Annual flexible sigmoidoscopy starting age 10-12
  (matches classic-FAP carrier-confirmation protocol because FAP polyps
  characteristically emerge in the rectum and sigmoid first). When
  >5-10 adenomas accumulate, escalate to full colonoscopy q1-2 years.
  **Low threshold for prophylactic colectomy** if polyp burden reaches
  the carrier-confirmation surgical threshold (>20-30 adenomas, dense
  carpeting that is endoscopically unmanageable, or any high-grade
  dysplasia / invasive carcinoma).

  **Upper-GI:** EGD q3-5 years starting age 25-30 — empirical
  surveillance for duodenal polyposis. Spigelman staging on detected
  polyps. Lower-intensity than confirmed-carrier protocol (q1-3 years)
  because pre-test probability is lower without APC confirmation.

  **Desmoid tumor awareness:** counsel patient about desmoid risk
  post-surgery (relevant if colectomy is later performed). Low
  threshold for abdominal imaging if palpable mass develops.

  **Thyroid:** Annual physical thyroid exam; ultrasound only if
  nodular changes detected.

  **Hepatoblastoma screening in children:** AFP + abdominal US q3-6
  months birth to age 5 should be discussed with the pediatrician
  even without genetic confirmation if the family history strongly
  suggests FAP (this is the highest-stakes empirical recommendation —
  hepatoblastoma is aggressive and 5-year survival drops sharply if
  detection is delayed).

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. Patients who decline testing retain
  access to surveillance benefit, with the caveat that empirical
  surveillance lacks the diagnostic precision of confirmed genetic
  status — and the cascade-testing benefit for relatives is lost.
  Periodic re-discussion of testing is appropriate; this pathway does
  not preclude future genetic testing.

  Routing reconsiderations: if patient eventually accepts germline
  testing, results reroute to (a) confirmed-carrier pathway, (b)
  general-population pathway, or (c) continued pedigree-suspicion if
  VUS.

rationale_ua: >
  Супровідний варіант альтернативного треку до
  IND-FAP-SUSPICION-PREVENTION-GENETIC-COUNSELING. Пацієнту з
  родовідною підозрою на FAP / AFAP / варіант Gardner, який
  відмовляється від генетичного консультування та/або германального
  тестування APC — з будь-якої причини (вартість, страхові міркування,
  психологічні аспекти / тривожність, приватність родини, географічні
  обмеження доступу) — пропонується емпіричний посилений нагляд, що
  застосовується так, ніби FAP підтверджено:

  **Колоректальний нагляд:** Щорічна гнучка сигмоїдоскопія з 10-12
  років (відповідає протоколу для класичної FAP за підтвердженого
  носійства, оскільки поліпи FAP характерно з'являються спочатку в
  прямій і сигмоподібній кишці). За накопичення понад 5-10 аденом —
  ескалація до повної колоноскопії раз на 1-2 роки. **Низький поріг
  для профілактичної колектомії**, якщо обтяженість поліпами досягає
  хірургічного порогу, встановленого для підтвердженого носійства
  (>20-30 аденом, щільний "килим" поліпів, що не піддається
  ендоскопічному контролю, або будь-яка дисплазія високого ступеня /
  інвазивна карцинома).

  **Верхні відділи ШКТ:** ЕГДС раз на 3-5 років, починаючи з 25-30
  років — емпіричний нагляд за дуоденальним поліпозом. Стадіювання
  виявлених поліпів за Spigelman. Менш інтенсивний режим, ніж за
  протоколу підтвердженого носійства (раз на 1-3 роки), оскільки
  апріорна ймовірність нижча за відсутності підтвердження APC.

  **Настороженість щодо десмоїдних пухлин:** консультування пацієнта
  щодо ризику десмоїду після хірургічного втручання (актуально, якщо
  згодом виконується колектомія). Низький поріг для призначення
  візуалізації органів черевної порожнини за появи пальпованого
  утворення.

  **Щитоподібна залоза:** Щорічний фізикальний огляд щитоподібної
  залози; УЗД — лише за виявлення вузлових змін.

  **Скринінг гепатобластоми у дітей:** AFP + УЗД органів черевної
  порожнини раз на 3-6 місяців від народження до 5 років варто
  обговорити з педіатром навіть без генетичного підтвердження, якщо
  сімейний анамнез переконливо свідчить про FAP (це рекомендація з
  найвищими ставками серед емпіричних — гепатобластома є агресивною
  пухлиною, і 5-річна виживаність різко знижується за затримки
  виявлення).

  Відповідно до CHARTER §11 — підхід на основі автономії пацієнта:
  генетичне тестування є сферою спільного прийняття рішень. Пацієнти,
  які відмовляються від тестування, зберігають доступ до переваг
  нагляду, із застереженням, що емпіричний нагляд не має діагностичної
  точності підтвердженого генетичного статусу — а перевага каскадного
  тестування для родичів втрачається. Періодичне повторне обговорення
  тестування є доречним; цей шлях не виключає майбутнього генетичного
  тестування.

  Маршрутизація за зміни рішення: якщо пацієнт згодом погоджується на
  германальне тестування, результати перенаправляють до (а) шляху
  підтвердженого носійства, (б) шляху загальної популяції, або (в)
  продовженої родовідної підозри — за виявлення варіанта невизначеного
  значення (VUS).

