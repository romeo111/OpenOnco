do_not_do:
  - "Не презентувати observation як equivalent surveillance — PDAC mortality дисспропорційно benefits від early detection."
  - "Не пропускати smoking cessation counseling — modifiable factor найбільшого ефекту незалежно від surveillance schedule."
  - "Не пропускати cascade-тестування FDRs — їхня власна risk-evaluation independent від proband's surveillance choice."
  - "Не використовувати CA 19-9 alone для symptom-monitoring — не replacement для imaging при symptom presentation."
  - "Не нормалізувати surveillance refusal у FPC kindred — counsel що FPC risk substantially elevated vs. population baseline."

do_not_do_en:
  - "Do not present observation as equivalent to surveillance — PDAC mortality disproportionately benefits from early detection."
  - "Do not skip smoking cessation counseling — the modifiable factor of greatest effect, independent of surveillance schedule."
  - "Do not skip cascade testing of first-degree relatives — their own risk evaluation is independent of the proband's surveillance choice."
  - "Do not use CA 19-9 alone for symptom-monitoring — not a replacement for imaging on symptom presentation."
  - "Do not normalize surveillance refusal in an FPC kindred — counsel that FPC risk is substantially elevated vs. population baseline."

