recommended_regimen: null
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Symptom-driven evaluation only: PDAC typically presents at advanced
    stage (T3-T4 or metastatic) in non-surveilled patients with 5-year
    OS <5%. Compared with the structured-surveillance comparator (60-
    70% resectability, 3-year OS ~85% in surveillance-detected cases),
    observation-only carries materially worse outcomes. Reserved for
    cases where access to PDAC-experienced surveillance is impractical
    or patient declines surveillance after informed discussion.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-FPC-PANCREATIC-SURVEILLANCE.
  Used when:
  - Access to PDAC-experienced surveillance center is impractical
    (rural geography, low-resource setting, no MRI/EUS-capable PDAC
    specialist).
  - Patient declines structured annual MRI/MRCP + EUS schedule
    (surveillance burden, procedure anxiety, EUS-procedure
    aversion).
  - Patient has decompensated comorbidities making surveillance-
    detected PDAC unactionable (e.g., severe cardiopulmonary disease
    precluding any future PDAC-directed therapy) — though this
    scenario should prompt re-evaluation of whether surveillance
    serves the patient at all.

  Components:
  - Smoking cessation counseling continues at every clinical contact
    (highest-impact modifiable factor).
  - Alcohol moderation counseling.
  - Symptom-vigilance education with explicit prompt-list (new
    jaundice, persistent epigastric pain radiating to back, new-
    onset diabetes with weight loss, persistent steatorrhea, dark
    urine, pale stools) and explicit instruction to seek immediate
    cross-sectional imaging on any of these.
  - Cascade testing of first-degree relatives continues — even if
    the patient declines their own surveillance, FDRs may benefit.

  Frame the decision as suboptimal vs. structured surveillance and
  document the informed-decision discussion. Per CHARTER §11
  patient-autonomy framing.

rationale_ua: >
  Альтернативно-трекова Indication. Використовується коли:
  - Доступ до PDAC-experienced surveillance center непрактичний.
  - Пацієнт відмовляється від structured annual MRI/MRCP + EUS
    schedule (surveillance burden, anxiety).
  - Decompensated comorbidities роблять surveillance-detected PDAC
    unactionable.

  Компоненти:
  - Smoking cessation counseling continues при кожному clinical contact.
  - Alcohol moderation counseling.
  - Symptom-vigilance education з explicit prompt-list (new jaundice,
    persistent epigastric pain radiating to back, new-onset діабет з
    weight loss, persistent steatorrhea, dark urine, pale stools).
  - Cascade тестування first-degree родичів continues — навіть якщо
    пацієнт відмовляється від surveillance.

  Frame decision як suboptimal vs. structured surveillance + document
  informed-decision discussion. Per CHARTER §11.

