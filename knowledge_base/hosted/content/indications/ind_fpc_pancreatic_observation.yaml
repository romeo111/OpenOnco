id: IND-FPC-PANCREATIC-OBSERVATION
plan_track: surveillance
intent: prevention

applicable_to:
  disease_id: DIS-PDAC
  stage_requirements: []
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 3

