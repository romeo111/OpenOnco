rationale: >
  Standard-track surveillance for Familial Pancreatic Cancer (FPC)
  kindreds per CAPS Consortium 2020 (Goggins et al. Gut 2020) +
  NCCN Pancreatic 2025 (Familial Risk section).

  **(1) Imaging surveillance — annual MRI/MRCP + EUS:**
  - Onset age: 50 years, OR 10 years before the earliest familial
    PDAC diagnosis, whichever is younger.
  - Cadence: annual; for FPC kindreds with ≥3 affected FDRs or
    early-onset family history (<55y at diagnosis), q6-month
    alternating MRI / EUS is preferred.
  - Modality choice: combined MRI/MRCP + EUS provides best lesion-
    detection coverage. MRI/MRCP is non-invasive and detects cystic
    lesions (IPMN — intraductal papillary mucinous neoplasm — is the
    most common precursor lesion identifiable on surveillance). EUS
    detects small parenchymal solid lesions that MRI may miss.
  - Refer to PDAC-experienced surveillance center; non-specialist
    centers underperform on small-lesion detection and IPMN
    management decisions.

  **(2) Smoking cessation:**
  - Smoking is the single largest modifiable PDAC risk factor (RR
    ~2.5-3.0 in active smokers) and multiplicative with FPC genetic
    background. Active counseling at each surveillance visit.

  **(3) Alcohol moderation + chronic-pancreatitis risk-factor
  management:**
  - Heavy alcohol use exacerbates PDAC risk via chronic-pancreatitis
    pathway. Counsel <14 drinks/week for men, <7 drinks/week for
    women (consistent with WCRF/AICR).

  **(4) Diabetes management:**
  - Long-standing diabetes is itself a PDAC risk factor; new-onset
    diabetes after age 50 (especially with weight loss) may
    represent paraneoplastic PDAC presentation and prompts
    intensified imaging review.

  **(5) Cascade testing of first-degree relatives:**
  - Offer expanded hereditary-cancer panel + familial-history-based
    counseling. Subsequent generations may show different penetrance
    patterns; surveillance offered to FDRs of FPC probands who meet
    the ≥2-FDR criterion themselves.

  **(6) Symptom-driven workup at lower threshold:**
  - New jaundice, persistent epigastric pain radiating to back,
    new-onset diabetes with weight loss, persistent steatorrhea —
    all trigger immediate cross-sectional imaging regardless of last
    surveillance interval.

  **(7) IPMN management when detected:**
  - Small (<3 cm) low-risk IPMN — continue surveillance with
    interval imaging (q3-6 month for several cycles, then re-
    intervalize).
  - High-risk-stigmata IPMN (mural nodule, main-duct dilation
    >10 mm, jaundice) — refer to surgical pancreatic-experienced
    multidisciplinary team for resection consideration.

  Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Стандартний-трек surveillance для FPC kindreds per CAPS Consortium
  2020 + NCCN Pancreatic 2025.

  **(1) Imaging surveillance — annual MRI/MRCP + EUS:**
  - Onset age: 50, АБО за 10 років до earliest familial PDAC діагнозу.
  - Cadence: annual; для FPC kindreds з ≥3 affected FDRs або early-
    onset family history — q6-month alternating preferred.
  - Refer до PDAC-experienced surveillance center.

  **(2) Smoking cessation** — single largest modifiable PDAC risk
  factor (RR ~2.5-3.0); multiplicative з FPC genetic background.

  **(3) Alcohol moderation** + chronic-pancreatitis risk-factor
  management.

  **(4) Diabetes management** — new-onset діабет після 50 (особливо
  з weight loss) може бути paraneoplastic PDAC.

  **(5) Cascade тестування** — offer expanded hereditary-cancer panel
  + familial-history-based counseling першим-ступеня родичам.

  **(6) Symptom-driven workup at lower threshold** — new jaundice,
  persistent epigastric pain radiating to back, new-onset diabetes з
  weight loss, persistent steatorrhea — trigger immediate imaging.

  **(7) IPMN management** — small (<3 см) low-risk IPMN: surveillance
  з interval imaging; high-risk-stigmata IPMN (mural nodule, main-duct
  dilation >10 мм, jaundice): refer для resection consideration.

  Per CHARTER §11 framing автономії пацієнта.

