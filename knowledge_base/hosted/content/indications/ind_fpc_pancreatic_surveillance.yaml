sources:
  - source_id: SRC-CAPS-CONSORTIUM-PANCREATIC-2020
    position: supports
    relevant_quote_paraphrase: >-
      "Individuals with ≥2 first-degree relatives with PDAC (FPC
      criterion) and negative germline susceptibility-gene testing
      should be offered annual surveillance with MRI/MRCP and/or EUS,
      starting at age 50 or 10 years before the youngest familial
      diagnosis, at a PDAC-experienced surveillance center. Modality
      combination (MRI + EUS) outperforms either modality alone for
      small-lesion detection."
  - source_id: SRC-NCCN-PANCREATIC-2025
    position: supports

do_not_do:
  - "Не використовувати CA 19-9 як standalone screening tool — sensitivity ~70%, specificity ~80%; many false positives + false negatives; not a substitute for imaging."
  - "Не делегувати pancreatic surveillance non-specialist center — потребує MRI / EUS expertise для small-lesion detection та IPMN management."
  - "Не пропускати smoking cessation counseling — найбільший single modifiable PDAC risk factor; multiplicative з FPC."
  - "Не ігнорувати new-onset діабет з weight loss — paraneoplastic PDAC presentation; trigger immediate cross-sectional imaging."
  - "Не intensifyувати surveillance до сімейних членів за межами FDR без re-evaluation — second-degree relatives мають substantially lower risk; FPC criterion specifically requires ≥2 FDR."

do_not_do_en:
  - "Do not use CA 19-9 as a standalone screening tool — sensitivity ~70%, specificity ~80%; many false positives and false negatives; not a substitute for imaging."
  - "Do not delegate pancreatic surveillance to a non-specialist center — requires MRI / EUS expertise for small-lesion detection and IPMN management."
  - "Do not skip smoking cessation counseling — the largest single modifiable PDAC risk factor and multiplicative with FPC."
  - "Do not ignore new-onset diabetes with weight loss — paraneoplastic PDAC presentation; trigger immediate cross-sectional imaging."
  - "Do not extend surveillance to family members beyond first-degree without re-evaluation — second-degree relatives carry substantially lower risk; the FPC criterion specifically requires ≥2 FDR."

