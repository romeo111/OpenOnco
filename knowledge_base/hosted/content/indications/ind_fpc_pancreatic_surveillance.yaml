expected_outcomes:
  overall_response_rate: >-
    Annual MRI/MRCP + EUS in FPC kindreds detects PDAC at earlier
    stage (resectable T1-T2 vs. typical-presentation T3-T4 / metastatic)
    in a meaningful subset of surveillance-engaged patients. CAPS5
    prospective surveillance results (Klatte 2022, Canto 2018) show
    ~60-70% of surveillance-detected PDACs are resectable vs. ~20%
    of symptomatic-presentation PDACs; 3-year OS for surveillance-
    detected disease ~85% vs. ~25% for symptomatic-presentation
    comparator. Surveillance does NOT eliminate PDAC mortality —
    biology of small surveillance-window lesions remains aggressive
    — but materially shifts the survival distribution upward.

