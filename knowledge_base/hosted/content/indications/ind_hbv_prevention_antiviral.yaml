    position: supports
    relevant_quote_paraphrase: >-
      "Long-term nucleos(t)ide analog therapy in chronic HBV reduces
      HCC incidence; surveillance ultrasound + AFP q6mo recommended for
      all chronic HBV patients."
  - source_id: SRC-EASL-HBV-2025
    position: supports
  - source_id: SRC-AASLD-HCC-2023
    position: supports

do_not_do:
  - "Не призначати монотерапію ентекавіром за коінфекції ВІЛ — використовувати повну АРТ."
  - "Не пропускати нагляд за ГЦК (УЗД + AFP) кожні 6 місяців — це основний предиктор раннього виявлення."
  - "Не припиняти антивірусну терапію без консультації гепатолога — ризик тяжкої реактивації HBV."

do_not_do_en:
  - "Do not prescribe entecavir monotherapy in HIV coinfection — use full ART."
  - "Do not skip q6mo HCC surveillance ultrasound + AFP — this is the strongest predictor of early-stage detection."
  - "Do not discontinue antiviral therapy without a hepatology consult — risk of severe HBV reactivation."

