expected_outcomes:
  overall_response_rate: >-
    EGD surveillance retained (acknowledged inferior to PTG) +
    mammography-only breast surveillance. PTG deferred or declined.
    Acceptable when patient declines PTG after shared decision-making
    with documented understanding of residual cancer risk.

