desired_tests: []

rationale: >
  Aggressive-track (PTG-declined) alternative for CDH1 carriers who
  prefer endoscopic surveillance over prophylactic gastrectomy.
  Documented shared-decision-making required.

  Components — GASTRIC:
    - EGD with Cambridge protocol every 6-12 months retained.
    - Chromoendoscopy + narrow-band imaging adjuncts.
    - Annual H. pylori test + eradicate.
    - Any signet-ring biopsy → urgent PTG.
    - Re-offer PTG at every visit.

  Components — BREAST (female carriers):
    - Annual mammography from age 30; no routine MRI.
    - Symptom-driven workup.
    - Re-offer breast MRI annually.

  Components — OTHER:
    - Cascade testing retained.
    - Colon surveillance per USPSTF.

  Documented annual review of patient preference for PTG.

rationale_ua: >
  Aggressive-трек (PTG-declined) альтернатива для CDH1 carriers які
  prefer endoscopic surveillance over prophylactic gastrectomy.
  Documented shared-decision-making required.

  Компоненти — GASTRIC:
    - EGD з Cambridge protocol кожні 6-12 міс retained.
    - Chromoendoscopy + narrow-band imaging adjuncts.
    - Annual H. pylori test + eradicate.
    - Any signet-ring biopsy → urgent PTG.
    - Re-offer PTG при кожному visit.

  Компоненти — BREAST (female carriers):
    - Annual mammography з 30 років; без routine MRI.
    - Symptom-driven workup.
    - Re-offer breast MRI щорічно.

  Компоненти — INSHE:
    - Cascade testing retained.
    - Colon surveillance per USPSTF.

  Documented annual review patient preference для PTG.

