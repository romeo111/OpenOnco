rationale: >
  Standard-track prevention pathway for confirmed CDH1 germline
  pathogenic variant per International Gastric Cancer Linkage Consortium
  (IGCLC) 2020.

  Components — GASTRIC:
    - **Prophylactic total gastrectomy (PTG) ages 20-30** (range
      18-40; individualised based on patient priorities, family-
      member age-of-diagnosis, comorbidities). Multidisciplinary
      consultation (surgical oncology, gastroenterology, nutritionist,
      psychosocial, genetic counselor).
    - **Endoscopic surveillance for PTG-declining or PTG-deferred
      carriers** — acknowledged inferior to PTG (signet-ring foci
      poorly visible on EGD; chromoendoscopy + Cambridge protocol
      multi-quadrant biopsy increases yield modestly).
      - EGD every 6-12 months with Cambridge protocol — 30+ random
        biopsies spanning anatomic regions.
      - Chromoendoscopy + magnification + narrow-band imaging
        adjuncts.
      - Any biopsy showing signet-ring cell carcinoma triggers PTG.
    - **Annual H. pylori test + eradicate if positive** — synergistic
      with CDH1 deficiency.

  Components — BREAST (female carriers):
    - **Annual mammography from age 30** (BRCA-style).
    - **Annual breast MRI from age 30-65** alongside mammography
      (alternating q6mo acceptable).
    - **Clinical breast examination semi-annually from age 25.**
    - **Risk-reducing mastectomy discussion** — IGCLC + NCCN provide
      shared-decision-making framework given lobular-predominant
      histology + 37-55% lifetime risk.

  Components — OTHER:
    - **Colon cancer surveillance:** routine USPSTF average-risk
      schedule unless family-cluster suggests otherwise (signet-ring
      colon rare in HDGC).
    - **Cascade testing:** FDRs + SDRs offered testing.
    - **Reproductive counseling:** PGT-M available.

  **Post-PTG dietary management:**
    - Lifelong vitamin B12 injection (loss of intrinsic factor).
    - Calcium + vitamin D supplementation; bone density monitoring
      (osteoporosis risk).
    - Small frequent meals; iron-rich diet + supplementation;
      dumping-syndrome education.
    - Multidisciplinary dietitian follow-up annually.

  In Ukraine, CDH1 genetic testing via Institute of Genetics + select
  private labs; HDGC management at major surgical-oncology centers
  in Kyiv, Lviv, Kharkiv. PTG is a major operation; multidisciplinary
  experienced centers preferred.

