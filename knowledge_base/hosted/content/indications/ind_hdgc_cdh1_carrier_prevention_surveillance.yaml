do_not_do:
  - "Не покладатися на EGD surveillance замість PTG як рутинну довгострокову стратегію — false-negative rate ~95% за signet-ring foci poorly visible."
  - "Не пропускати breast MRI у female CDH1 carriers — lobular dominant histology; mammography insufficient sensitivity у dense breast."
  - "Не призначати estrogen-only HRT female CDH1 carriers — additive lobular breast risk."
  - "Не пропускати lifelong B12 + Ca + Fe монитор після PTG — deficiency-related morbidity preventable."

do_not_do_en:
  - "Do not rely on EGD surveillance instead of PTG as a routine long-term strategy — false-negative rate ~95% because signet-ring foci are poorly visible."
  - "Do not skip breast MRI in female CDH1 carriers — lobular-dominant histology; mammography has insufficient sensitivity in dense breast."
  - "Do not prescribe estrogen-only HRT in female CDH1 carriers — additive lobular breast risk."
  - "Do not skip lifelong B12 + Ca + Fe monitoring after PTG — deficiency-related morbidity is preventable."

known_controversies:
  - topic: "Optimal age for PTG in CDH1 carriers"
    positions:
      - position: "PTG ages 20-30 as default"
        rationale: "Reach peak cancer risk while maintaining favorable surgical morbidity profile; near-100% microscopic signet-ring foci at PTG specimens."
      - position: "Individualised timing — defer for non-childbearing-completed women"
        rationale: "PTG morbidity substantial; family-completion priorities + family-history age-of-diagnosis variability."
    our_default: "Offer PTG ages 20-30; individualise by patient priorities + family history; require multidisciplinary discussion."
    rationale: "Patient autonomy + clinical-stakes balance."

