expected_outcomes:
  overall_response_rate: >-
    Prophylactic total gastrectomy (PTG) reduces gastric cancer mortality
    to near-zero (cancer impossible without stomach); ~95-100% of PTG
    specimens harbor microscopic signet-ring cell carcinoma at age
    20-30 even with normal pre-op endoscopy. PTG morbidity: lifelong
    dietary adjustment + B12 + iron deficiency + bile reflux + ~10%
    long-term complications. BRCA-style breast surveillance shifts
    breast cancer stage at diagnosis to early; 5y OS >95% early-stage.

