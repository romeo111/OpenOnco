do_not_do:
  - "Не використовувати цей шлях у пацієнтів з HH і цирозом — їм потрібні УЗД/AFP за AASLD кожні 6 міс."
  - "Не подавати спостереження як еквівалент планового скринінгу у пацієнтів з HH і цирозом — ризик інтервального HCC може вивести пухлину за межі критеріїв Milan."
  - "Не ігнорувати нову декомпенсацію або випадково виявлене утворення в печінці — потрібна негайна візуалізація."
  - "Не використовувати цей шлях у HH із супутньою інфекцією HBV/HCV."
  - "Не пропускати періодичну еластографію — прогресування фіброзу при HH потребує переходу на стандартний трек."

do_not_do_en:
  - "Do not use this pathway in cirrhotic HH — they require AASLD US/AFP every 6 months."
  - "Do not present observation as equivalent to scheduled surveillance in cirrhotic HH — interval HCC risk may push detection beyond Milan."
  - "Do not ignore new decompensation or incidental hepatic mass — immediate imaging."
  - "Do not use this pathway in HH with coexisting HBV/HCV."
  - "Do not skip periodic elastography — fibrosis progression in HH warrants transition to the standard track."

