rationale: >
  Per HLRCC Family Alliance + NCCN Genetic/Familial High-Risk: Kidney:

  **(1) Annual abdominal MRI** from age 8-10 in confirmed FH carriers — yes,
  childhood; HLRCC-RCC has been reported in children. MRI preferred over CT
  to minimize cumulative radiation exposure across decades.

  **(2) Low-threshold surgical resection** for any solid renal mass — HLRCC-RCC
  is aggressive collecting-duct / papillary type 2 histology that can
  metastasize from small primary tumors. Do NOT use the sporadic RCC paradigm
  of active surveillance for ≤4cm masses; instead, partial nephrectomy or
  radical nephrectomy as anatomically appropriate.

  **(3) Cutaneous leiomyoma surveillance** — annual dermatology exam; treat
  symptomatic lesions (excision / laser) but cosmetic-only treatment is
  individualized.

  **(4) Gynecologic counseling for women** — uterine leiomyomas (fibroids)
  occur in nearly all HLRCC women; aggressive symptom management +
  reproductive planning + consideration of post-childbearing hysterectomy
  given accelerated fibroid burden and rare uterine leiomyosarcoma risk.

  **(5) Cascade testing** of first-degree relatives — autosomal dominant
  inheritance; ~50% offspring carrier risk.

rationale_ua: >
  За настановами HLRCC Family Alliance + NCCN Genetic/Familial
  High-Risk: Kidney:

  **(1) Щорічна абдомінальна МРТ** з 8-10 років у підтверджених носіїв
  FH — так, з дитинства; HLRCC-RCC описаний у дітей. МРТ є
  пріоритетним методом порівняно з КТ для мінімізації кумулятивного
  променевого навантаження протягом десятиліть.

  **(2) Низький поріг для хірургічної резекції** будь-якого солідного
  утворення нирки — HLRCC-RCC має агресивну гістологію (collecting-duct
  або папілярний тип 2), яка може метастазувати навіть із невеликих
  первинних пухлин. НЕ застосовувати парадигму активного спостереження,
  прийняту для спорадичного RCC при утвореннях ≤4 см; натомість —
  часткова або радикальна нефректомія залежно від анатомічної ситуації.

  **(3) Спостереження за шкірними лейоміомами** — щорічний огляд
  дерматолога; симптомні вузли лікуються (висічення / лазер), але суто
  косметичне лікування вирішується індивідуально.

  **(4) Гінекологічне консультування жінок** — маткові лейоміоми
  (фіброміоми) трапляються майже в усіх жінок з HLRCC; активне
  ведення симптомів + репродуктивне планування + розгляд гістеректомії
  після завершення дітонародження з огляду на прискорене зростання
  фіброміом і рідкісний ризик лейоміосаркоми матки.

  **(5) Каскадне тестування** родичів першого ступеня спорідненості —
  аутосомно-домінантне успадкування; ризик носійства в нащадків ~50%.

