do_not_do:
  - "Не подавати посилене спостереження як еквівалент генетичного підтвердження — діагностична точність відсутня; переваги каскадного тестування та тестування партнера для родичів втрачаються; цей компроміс особливо вагомий при HLRCC через спостереження з дитячого віку та репродуктивний ризик дефіциту фумарази."
  - "Не застосовувати «правило 3 см» з VHL до емпіричного спостереження за HLRCC — біологія HLRCC-RCC агресивна, і будь-яке солідне утворення нирки потребує радикальної нефректомії, а не органозберігаючого підходу; зміна порогу зводить нанівець мету спостереження."
  - "Не пропускати періодичне повторне обговорення генетичного тестування — більшість пацієнтів урешті погоджуються на тестування після додаткових візитів, особливо якщо наголосити на перевагах тестування партнера для дітей."
  - "Не розпочинати МРТ у дітей до 8 років без підтвердженої лейоміоми в пробанда або переконливого накопичення випадків у сімейному анамнезі — ризик седації в дітей при щорічному МРТ вимагає чіткого обґрунтування користі."
  - "Не пропускати обговорення збереження фертильності перед процедурою в молодих жінок з емпіричною підозрою на HLRCC, яким показана міомектомія / гістеректомія — навіть без генетичного підтвердження репродуктивні наслідки операції з приводу фіброміом значні."

do_not_do_en:
  - "Do not present enhanced surveillance as equivalent to genetic confirmation — diagnostic precision is absent; cascade-testing and partner-FH-testing benefits for relatives are lost; this trade-off is particularly weighty in HLRCC given the child-onset surveillance and fumarase-deficiency reproductive risk."
  - "Do not apply the VHL '3-cm rule' to empirical HLRCC surveillance — HLRCC-RCC biology is aggressive, and any solid renal mass requires radical nephrectomy rather than a tumor-sparing approach; changing the threshold defeats the purpose of surveillance."
  - "Do not skip periodic re-discussion of genetic testing — most patients eventually accept testing after additional visits, especially when partner-FH-testing benefits for children are emphasized."
  - "Do not start childhood MRIs before age 8 without demonstrable proband-leiomyoma or strong family-history clustering — pediatric sedation risk at annual MRI cadence requires a clear-benefit pathway."
  - "Do not skip pre-procedure fertility-preservation discussion in young women with empirical HLRCC suspicion who face myomectomy / hysterectomy — even without genetic confirmation, the reproductive consequences of fibroid surgery are significant."

