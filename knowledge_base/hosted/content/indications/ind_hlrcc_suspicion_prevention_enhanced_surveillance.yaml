rationale: >
  Alternative-track companion to IND-HLRCC-SUSPICION-PREVENTION-
  GENETIC-COUNSELING. Patient with pedigree suspicion of HLRCC who
  declines genetic counseling and/or germline FH testing — for any
  reason (cost, insurance concerns, psychological / anxiety
  considerations, family privacy, geographic access constraints,
  reluctance to commit children to lifelong-MRI surveillance without
  diagnostic confirmation) — is offered empirical annual abdominal
  MRI surveillance applied as if HLRCC were confirmed:

  **Renal:** Annual contrast-enhanced abdominal MRI starting age
  8-10 (matches confirmed-carrier protocol because HLRCC-RCC
  aggressive biology means metastasis can occur from small tumors
  and the standard "wait until adulthood" approach used in most
  hereditary cancer syndromes is not safe). **Radical nephrectomy
  threshold** on any detected solid renal mass — the empirical
  surveillance must include the aggressive treatment threshold,
  otherwise the surveillance loses its purpose; an indeterminate
  enhancing lesion in the kidney of an at-HLRCC-suspicion patient
  is managed as if HLRCC-RCC. CT alternative if MRI contraindicated.

  **Dermatology:** Annual skin exam for cutaneous leiomyomas;
  biopsy of any new firm painful nodule. If pathognomonic cutaneous
  leiomyomas are confirmed histologically, the empirical-surveillance
  rationale is strengthened — and re-discussion of genetic testing
  becomes particularly important (proband biopsy with FH IHC can
  complement panel testing).

  **Gynecologic (women):** Symptom-driven gynecologic follow-up for
  uterine fibroids — pelvic exam q1-2 years; pelvic imaging
  (transvaginal ultrasound or MRI) if symptomatic (menorrhagia,
  dysmenorrhea, pelvic mass, infertility). Reproductive planning
  discussion regarding fertility-preservation options (oocyte
  cryopreservation before any myomectomy / hysterectomy) is
  appropriate even without genetic confirmation if the family
  history is strong.

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. HLRCC is a particularly compelling
  syndrome for genetic confirmation because (1) the renal surveillance
  is childhood-initiating and high-burden; (2) the aggressive
  nephrectomy threshold means the cost of empirical false-positive
  is high (unnecessary surgery in non-carriers); (3) the partner-FH-
  testing implication for reproductive counseling is unique among
  hereditary cancer syndromes — biallelic FH causes fumarase
  deficiency, a severe neonatal neurometabolic syndrome distinct from
  HLRCC. Empirical surveillance preserves the early-detection benefit
  for the index patient but loses the partner-testing and cascade-
  testing benefits; this trade-off should be explicit in counseling.

  Routing reconsiderations: if patient eventually accepts germline
  testing, results reroute to (a) confirmed-carrier pathway, (b)
  general-population pathway, or (c) continued pedigree-suspicion if
  VUS.

rationale_ua: >
  Альтернативний трек — компаньйон до
  IND-HLRCC-SUSPICION-PREVENTION-GENETIC-COUNSELING. Пацієнт з
  родовідною підозрою на HLRCC, який відмовляється від генетичного
  консультування та/або germline-тестування FH — з будь-якої причини
  (вартість, страхові міркування, психологічні аспекти / тривожність,
  приватність сімейної інформації, географічні обмеження доступу,
  небажання прирікати дітей на довічне МРТ-спостереження без
  діагностичного підтвердження) — отримує емпіричне щорічне
  абдомінальне МРТ-спостереження, яке проводиться так, ніби HLRCC вже
  підтверджено:

  **Нирки:** Щорічна контрастна абдомінальна МРТ з 8-10 років
  (відповідає протоколу для підтверджених носіїв, оскільки агресивна
  біологія HLRCC-RCC означає, що метастазування можливе навіть із
  малих пухлин, і стандартний підхід «чекати до дорослого віку»,
  прийнятий для більшості спадкових онкологічних синдромів, тут
  небезпечний). **Поріг для радикальної нефректомії** — за будь-якого
  виявленого солідного утворення нирки; емпіричне спостереження
  повинне включати той самий агресивний поріг лікування, інакше воно
  втрачає сенс; невизначене контрастне утворення в нирці пацієнта з
  підозрою на HLRCC ведеться так, ніби це HLRCC-RCC. КТ — альтернатива
  за протипоказань до МРТ.

  **Дерматологія:** Щорічний огляд шкіри на шкірні лейоміоми; біопсія
  будь-якого нового щільного болючого вузлика. Якщо патогномонічні
  шкірні лейоміоми підтверджені гістологічно, обґрунтування
  емпіричного спостереження посилюється — і повторне обговорення
  генетичного тестування стає особливо важливим (біопсія пробанда з
  ІГХ на FH може доповнити панельне тестування).

  **Гінекологія (жінки):** Симптом-керовані гінекологічні візити з
  приводу маткових фіброміом — гінекологічний огляд кожні 1-2 роки;
  візуалізація органів малого таза (трансвагінальне УЗД або МРТ) за
  наявності симптомів (менорагія, дисменорея, утворення в малому
  тазі, безпліддя). Обговорення репродуктивного планування щодо
  варіантів збереження фертильності (кріоконсервація ооцитів перед
  міомектомією / гістеректомією) є доречним навіть без генетичного
  підтвердження, якщо сімейний анамнез переконливий.

  Згідно з рамкою автономії пацієнта за CHARTER §11: генетичне
  тестування належить до сфери спільного прийняття рішень. HLRCC —
  особливо переконливий синдром для генетичного підтвердження, тому
  що (1) спостереження за нирками починається з дитинства і є
  високо обтяжливим; (2) агресивний поріг для нефректомії означає,
  що ціна хибнопозитивного емпіричного рішення висока (непотрібна
  операція в носіїв, що не мають мутації); (3) наслідок тестування
  партнера на FH для репродуктивного консультування є унікальним
  серед спадкових онкологічних синдромів — біалельний варіант FH
  спричиняє дефіцит фумарази, тяжкий неонатальний нейрометаболічний
  синдром, відмінний від HLRCC. Емпіричне спостереження зберігає
  перевагу раннього виявлення для пацієнта-індекса, але втрачає
  переваги тестування партнера та каскадного тестування родичів; цей
  компроміс має бути явно обговорений під час консультування.

  Подальша маршрутизація: якщо пацієнт згодом погоджується на
  germline-тестування, результати скеровуються (а) на шлях
  підтвердженого носія, (б) на шлях загальної популяції або (в) на
  продовження спостереження за родовідною підозрою — якщо виявлено
  VUS.

