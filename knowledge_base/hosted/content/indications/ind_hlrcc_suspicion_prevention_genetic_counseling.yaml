rationale: >
  Standard-track prevention pathway for individuals with pedigree
  suspicion of Hereditary Leiomyomatosis and Renal Cell Cancer
  (HLRCC). Three parallel referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant for HLRCC-RCC and leiomyoma
  phenotypes; biallelic FH variants cause autosomal-recessive fumarase
  deficiency — a distinct severe pediatric neurometabolic syndrome
  with different counseling implications, including avoidance of
  consanguineous reproductive partnerships in confirmed carrier
  families), penetrance (RCC ~15-30% lifetime; uterine leiomyomas
  ~70-100% in females; cutaneous leiomyomas ~75%), implications for
  family members (cascade testing if positive — siblings 50%,
  children 50%; preimplantation genetic diagnosis available;
  importantly, fumarase-deficiency risk if partner is also an FH
  carrier — adds a layer to reproductive counseling unique among
  hereditary cancer syndromes), insurance / GINA considerations,
  psychological aspects of childhood-initiating renal surveillance
  and aggressive nephrectomy threshold. Per ACMG / ASCO guidelines,
  pre-test counseling is the standard of care before germline testing.

  **(2) Germline FH gene panel testing.** Modern hereditary renal-
  cancer panels (e.g., Invitae renal-cancer panel, Color renal-cancer
  panel) cover FH (full sequencing + deletion / duplication analysis),
  plus the hereditary-RCC differential genes (VHL, FLCN for Birt-
  Hogg-Dubé, MET for hereditary papillary RCC, BAP1, SDHB/C/D for
  paraganglioma-pheochromocytoma syndromes). Variant classification
  per ACMG framework. Tumor IHC for FH protein loss and 2-succino-
  cysteine (2SC) staining can complement germline testing — FH-
  deficient tumors show loss of FH protein and accumulation of
  fumarate-derived 2SC adducts; this is treatment-persona territory
  when tumor tissue is available.

  **(3) Carrier-confirmation surveillance plan (sequel pathway).**
    Positive FH carrier → aggressive surveillance per HLRCC Family
    Alliance / NCCN Kidney Genetic/Familial High-Risk:
    - **Renal:** Annual contrast-enhanced abdominal MRI starting age
      8-10 (yes, early childhood — HLRCC-RCC has been reported in
      young adults and rarely in adolescents; the aggressive biology
      justifies the early start). **Radical nephrectomy** on detection
      of any solid renal mass regardless of size — the "3-cm rule"
      applied in VHL is NOT appropriate because HLRCC-RCC can
      metastasize from tumors as small as 1 cm. CT alternative if MRI
      contraindicated.
    - **Gynecologic (women):** Detailed gynecologic counseling
      regarding uterine fibroid management. Most female FH carriers
      develop early, large, multiple, symptomatic uterine leiomyomas
      —fertility-preserving myomectomy is feasible at younger ages;
      hysterectomy frequently performed in 30s-40s after childbearing
      is complete. Hysterectomy specimens require pathology review
      for any leiomyosarcoma transformation. Reproductive planning
      should be addressed early (fertility-preservation options
      including oocyte cryopreservation pre-myomectomy /
      hysterectomy; preimplantation genetic diagnosis; partner FH-
      testing to assess fumarase-deficiency risk in offspring).
    - **Dermatology:** Annual skin exam for cutaneous leiomyomas;
      biopsy of any new firm painful nodule. Cutaneous leiomyomas
      themselves are benign but pathognomonic and inform RCC-
      surveillance intensification.
    - **Adrenal / pheochromocytoma:** Not a routine HLRCC feature
      (distinguishes from VHL); plasma metanephrine screening NOT
      indicated unless symptomatic.

  Negative result (no pathogenic / likely-pathogenic variant on a
  high-quality panel) → re-stratify residual family-history risk;
  if cutaneous-leiomyoma phenotype is strong in family with no FH
  variant, consider phenocopy / VUS interpretation review with a
  multidisciplinary tumor board. VUS result → managed as pedigree
  suspicion (this Indication) until segregation analysis or
  functional studies clarify.

  Genetic counseling and germline FH testing are typically covered
  by insurance in the US/EU when pedigree criteria are met; in
  Ukraine, germline testing is available through private labs at
  out-of-pocket cost (~5000-15000 UAH for multi-gene panel).

rationale_ua: >
  Стандартний профілактичний шлях для осіб з родовідною підозрою на
  синдром Hereditary Leiomyomatosis and Renal Cell Cancer (HLRCC).
  Три паралельні направлення:

  **(1) Направлення на генетичне консультування.** Консультування
  перед тестуванням охоплює: тип успадкування (аутосомно-домінантний
  для HLRCC-RCC і лейоміоматозного фенотипу; біалельні варіанти FH
  спричиняють аутосомно-рецесивний дефіцит фумарази — окремий
  тяжкий педіатричний нейрометаболічний синдром з іншими
  консультативними наслідками, включно з уникненням кровноспоріднених
  репродуктивних партнерств у сім'ях підтверджених носіїв),
  пенетрантність (RCC ~15-30% упродовж життя; маткові лейоміоми
  ~70-100% у жінок; шкірні лейоміоми ~75%), наслідки для членів сім'ї
  (каскадне тестування за позитивного результату — сібси 50%, діти
  50%; доступна преімплантаційна генетична діагностика; важливо:
  ризик дефіциту фумарази, якщо партнер також є носієм FH, — додає
  окремий вимір до репродуктивного консультування, унікальний серед
  спадкових онкологічних синдромів), страхові міркування / положення
  GINA, психологічні аспекти ниркового спостереження з дитячого віку
  та агресивного порогу для нефректомії. За настановами ACMG / ASCO,
  консультування перед тестуванням є стандартом медичної допомоги
  перед germline-тестуванням.

  **(2) Панельне germline-тестування FH.** Сучасні панелі для
  спадкового RCC (напр., Invitae renal-cancer panel, Color
  renal-cancer panel) охоплюють FH (повне секвенування + аналіз
  делецій/дуплікацій), а також гени диференційної діагностики
  спадкового RCC (VHL, FLCN для синдрому Бірта-Хогга-Дюбе, MET для
  спадкового папілярного RCC, BAP1, SDHB/C/D для синдромів
  параганглioми-феохромоцитоми). Класифікація варіантів за системою
  ACMG. ІГХ пухлини на втрату білка FH та забарвлення на
  2-сукцинілцистеїн (2SC) може доповнити germline-тестування —
  FH-дефіцитні пухлини демонструють втрату білка FH і накопичення
  аддуктів 2SC, похідних фумарату; це вже сфера treatment-persona,
  якщо доступна пухлинна тканина.

  **(3) План спостереження за підтвердженим носійством (наступний
  крок).** Позитивний носій FH → агресивне спостереження за
  настановами HLRCC Family Alliance / NCCN Kidney Genetic/Familial
  High-Risk:
    - **Нирки:** Щорічна контрастна абдомінальна МРТ з 8-10 років
      (так, з раннього дитинства — HLRCC-RCC описаний у молодих
      дорослих і зрідка в підлітків; агресивна біологія обґрунтовує
      ранній початок). **Радикальна нефректомія** за виявлення
      будь-якого солідного утворення нирки незалежно від розміру —
      «правило 3 см», прийняте при VHL, тут не застосовується,
      оскільки HLRCC-RCC може метастазувати з пухлин розміром від
      1 см. КТ — альтернатива за протипоказань до МРТ.
    - **Гінекологія (жінки):** Детальне гінекологічне консультування
      щодо ведення маткових фіброміом. У більшості жінок-носіїв FH
      розвиваються ранні, великі, множинні, симптоматичні маткові
      лейоміоми — фертильність-зберігаюча міомектомія можлива в
      молодшому віці; гістеректомію часто виконують у 30-40 років
      після завершення дітонародження. Препарати після гістеректомії
      потребують патоморфологічного перегляду на предмет
      трансформації в лейоміосаркому. Репродуктивне планування слід
      обговорити заздалегідь (варіанти збереження фертильності,
      включно з кріоконсервацією ооцитів перед міомектомією /
      гістеректомією; преімплантаційна генетична діагностика;
      тестування партнера на FH для оцінки ризику дефіциту фумарази
      в потомства).
    - **Дерматологія:** Щорічний огляд шкіри на шкірні лейоміоми;
      біопсія будь-якого нового щільного болючого вузлика. Шкірні
      лейоміоми самі по собі доброякісні, але патогномонічні та
      впливають на інтенсивність RCC-спостереження.
    - **Надниркові залози / феохромоцитома:** Не є типовим проявом
      HLRCC (відрізняє його від VHL); скринінг метанефринів плазми
      НЕ показаний за відсутності симптомів.

  Негативний результат (без патогенного / ймовірно патогенного
  варіанту за якісною панеллю) → повторна стратифікація залишкового
  ризику за сімейним анамнезом; якщо фенотип шкірних лейоміом у сім'ї
  виражений, а варіант FH не виявлено, варто розглянути перегляд на
  фенокопію / інтерпретацію VUS на мультидисциплінарному консиліумі.
  Результат VUS → ведеться як родовідна підозра (це Показання) до
  отримання даних сегрегаційного аналізу або функціональних
  досліджень.

  Генетичне консультування та germline-тестування FH зазвичай
  покриваються страхуванням у США/ЄС за відповідності родинних
  критеріїв; в Україні germline-тестування доступне в приватних
  лабораторіях за власний кошт (~5000-15000 грн за мультигенну
  панель).

