sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Earlier surveillance initiation and lower surgical threshold
      are appropriate intensifications for HPRC carriers with very-
      early-onset family RCC or atypical / rapidly growing index
      lesions, following shared decision-making."

do_not_do:
  - "Не переносити початкову візуалізацію на вік раніше 20-25 років за відсутності дуже раннього початку нирково-клітинного раку в родині — тягар хибнопозитивних результатів і рання додаткова експозиція невиправдані."
  - "Не знижувати хірургічний поріг за типового вогнища HPRC (повільний ріст, периферичне розташування, без атипії) — валідований поріг Linehan становить 3 см."
  - "Не застосовувати хіміопрофілактику інгібіторами MET поза межами клінічного дослідження — це дослідницький підхід."
  - "Не виконувати двобічну тотальну нефректомію у безсимптомного носія — це зберігає можливість нефрон-зберігаючого підходу."
  - "Не переносити цю логіку порогів на носіїв мутацій VHL / HLRCC — більш агресивна біологія цих синдромів вимагає інших хірургічних алгоритмів."

do_not_do_en:
  - "Do not advance baseline imaging earlier than age 20-25 without very-early-onset family RCC — false-positive burden and early imaging exposure are not justified otherwise."
  - "Do not lower the surgical threshold in a typical HPRC lesion (slow growth, peripheral, no atypia) — the 3-cm Linehan threshold is validated."
  - "Do not use MET-inhibitor chemoprevention outside a clinical trial — investigational."
  - "Do not perform bilateral total nephrectomy in an asymptomatic carrier — preserves the option-value of nephron-sparing."
  - "Do not transfer threshold logic to VHL / HLRCC carriers — more aggressive biology requires different surgical algorithms."

