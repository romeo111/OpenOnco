rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-HPRC-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-HPRC-CARRIER-
  SURVEILLANCE applies (annual abdominal MRI from age 30, 3-cm
  surgical threshold, nephron-sparing primacy, active surveillance
  permissible for sub-3-cm lesions).

  **Intensification 1 — Earlier surveillance initiation:** In families
  with very-early-onset RCC (proband or first-degree relative diagnosed
  before age 30) — advance baseline MRI from age 30 to age 20-25.
  Trade-off: more lifetime imaging studies + earlier exposure to
  false-positive findings.

  **Intensification 2 — Lower surgical threshold (2-cm vs 3-cm):** For
  HPRC lesions with atypical features (rapid growth > 5 mm/year, new
  cystic component, central necrosis, or central / hilum-adjacent
  location where waiting will compromise surgical technique), advance
  surgical intervention from 3-cm to 2-cm threshold. Trade-off:
  potential over-treatment of biologically indolent disease + earlier
  cumulative nephron loss across lifetime.

  **Other intensification considerations (not core to this track):**
    - Empirical MET-inhibitor chemoprevention (tivantinib, crizotinib,
      savolitinib, cabozantinib) is NOT indicated — investigational
      at best despite the MET-driven mechanism; trials in metastatic
      / advanced disease ongoing.
    - Bilateral total nephrectomy + dialysis-dependent state in
      asymptomatic carrier is NOT routine — preserves option-value of
      nephron-sparing across lifetime.
    - Transplant after bilateral nephrectomy — discussed only after
      surveillance failure (multiple bilateral recurrences exhausting
      nephron-sparing options).

  **Cascade testing remains continuous:** every visit re-confirms
  family testing status.

  Per CHARTER §11: intensified surveillance and lower surgical
  threshold are shared-decision-making. Patient autonomy is paramount;
  standard-track 3-cm Linehan / NCI protocol remains the floor.

rationale_ua: >
  Агресивний трек: показання, що накладається поверх стандартного
  протоколу IND-HPRC-CARRIER-SURVEILLANCE.

  **Основа:** застосовується весь стандартний нагляд з IND-HPRC-CARRIER-
  SURVEILLANCE (щорічна МРТ черевної порожнини з 30 років, хірургічний
  поріг 3 см, пріоритет нефрон-зберігаючих втручань, допустимість
  активного спостереження для вогнищ менше 3 см).

  **Інтенсифікація 1 — Раніший початок нагляду:** у родинах з дуже
  раннім початком нирково-клітинного раку (пробанд або родич першого
  ступеня спорідненості з діагнозом до 30 років) — початок базової МРТ
  переносять з 30 на 20-25 років. Компроміс: більше візуалізаційних
  досліджень протягом життя і раніше зіткнення з хибнопозитивними
  знахідками.

  **Інтенсифікація 2 — Нижчий хірургічний поріг (2 см замість 3 см):**
  для вогнищ HPRC з атиповими ознаками (швидкий ріст > 5 мм/рік, нова
  кістозна складова, центральний некроз або центральне/прикорінцеве
  розташування, за якого очікування ускладнить хірургічну техніку) —
  хірургічне втручання переносять з порогу 3 см на поріг 2 см.
  Компроміс: можливе надлишкове лікування біологічно індолентного
  захворювання і раніша кумулятивна втрата нефронів протягом життя.

  **Інші міркування щодо інтенсифікації (не є основою цього треку):**
    - Емпірична хіміопрофілактика інгібіторами MET (тивантиніб,
      кризотиніб, саволітиніб, кабозантиніб) НЕ показана — залишається
      дослідницьким підходом, попри MET-залежний механізм; дослідження
      при метастатичному/поширеному захворюванні тривають.
    - Двобічна тотальна нефректомія з переходом на діаліз у
      безсимптомного носія НЕ є рутинною практикою — це зберігає
      можливість нефрон-зберігаючого підходу протягом життя.
    - Трансплантацію після двобічної нефректомії обговорюють лише після
      невдачі нагляду (кількаразові двобічні рецидиви, що вичерпують
      можливості нефрон-зберігаючих втручань).

  **Каскадне тестування залишається постійним:** статус тестування
  родини перевіряють на кожному візиті.

  Згідно з CHARTER §11: інтенсифікований нагляд і нижчий хірургічний
  поріг належать до сфери спільного прийняття рішень. Автономія
  пацієнта є пріоритетною; стандартний поріг 3 см за протоколом
  Linehan / NCI залишається мінімальною межею.

