rationale: >
  Standard-track confirmed-carrier surveillance pathway for MET-positive
  HPRC carriers per Linehan / NCI Urologic Oncology Branch experience
  and Schmidt et al. clinical-genetics framework.

  **Annual abdominal MRI:** Starting age 30 (or 10 years before
  youngest family RCC). MRI preferred over contrast-enhanced CT for
  cumulative-radiation reasons given lifelong surveillance interval.
  T1-weighted + T2-weighted + DWI + multi-phase gadolinium-enhanced
  protocol. Comparison with prior studies at every interval.

  **Surgical threshold (3-cm rule):** Lesions ≥3 cm — nephron-sparing
  partial nephrectomy (or enucleation when anatomically feasible given
  lesion biology). Sub-3-cm lesions — active surveillance acceptable
  in shared decision-making with the patient. Threshold is Linehan /
  NCI-derived and reflects HPRC-specific indolent biology; not
  appropriate to transfer to other hereditary RCC syndromes (VHL,
  HLRCC use different thresholds).

  **Surgical philosophy:** Nephron-sparing is paramount in HPRC carriers
  because bilateral multifocal tumors will recur — preserving renal
  parenchyma across multiple lifetime surgeries is the long-term goal.
  Enucleation (rather than wedge resection) often feasible for
  HPRC tumors given pseudo-capsule. Total nephrectomy reserved for
  large, central, or radical-margin-required tumors.

  **Active surveillance protocol (for sub-3-cm lesions):** Confirmed
  HPRC carrier with sub-3-cm enhancing renal mass on annual MRI —
  shorten interval to q6mo for the first 1-2 years to establish growth
  kinetics; resume annual if growth slow / absent. Cross to surgical
  resection if (a) lesion crosses 3-cm threshold, (b) growth rate
  exceeds 5 mm/year, (c) morphologic change (e.g., new cystic
  component, central necrosis suggesting higher-grade biology).

  **Cascade testing:** Mandates offer to all first-degree relatives.

  **Smoking cessation:** General-population RCC risk modifier — relevant
  but not HPRC-specific.

  Per CHARTER §11 patient-autonomy framing; active surveillance vs
  intervention is the classic shared-decision-making domain.

rationale_ua: >
  Стандартний трек нагляду для підтверджених носіїв мутацій за
  протоколом Linehan / NCI та схемою Schmidt et al.

  **Щорічна МРТ черевної порожнини:** з 30 років (або за 10 років до
  віку наймолодшого випадку нирково-клітинного раку в родині). МРТ має
  перевагу над КТ з контрастуванням через кумулятивне променеве
  навантаження за довічного нагляду. Протокол: T1 + T2 + DWI +
  багатофазне гадоліній-контрастне дослідження. Порівняння з
  попередніми дослідженнями на кожному візиті.

  **Хірургічний поріг (правило 3 см):** вогнища ≥3 см — нефрон-
  зберігаюча часткова нефректомія (або енуклеація, коли анатомічно
  можлива). Вогнища менше 3 см — допустиме активне спостереження за
  умови спільного прийняття рішень із пацієнтом. Поріг визначено на
  основі даних Linehan / NCI і не підлягає перенесенню на інші спадкові
  синдроми нирково-клітинного раку (VHL, HLRCC мають інші порогові
  значення).

  **Хірургічна філософія:** нефрон-зберігаючий підхід є пріоритетним у
  носіїв HPRC через неминучий двобічний мультифокальний рецидив —
  збереження ниркової паренхіми для повторних операцій протягом життя
  є довгостроковою метою. Енуклеація (замість клиноподібної резекції)
  часто можлива завдяки псевдокапсулі пухлин HPRC. Тотальну
  нефректомію залишають для великих, центрально розташованих пухлин
  або пухлин, що вимагають радикальних країв резекції.

  **Протокол активного спостереження (для вогнищ менше 3 см):**
  інтервал скорочують до 1 разу на 6 місяців протягом перших 1-2 років
  для встановлення кінетики росту; за повільного або відсутнього росту
  повертаються до щорічного інтервалу. Перехід до хірургічної резекції
  показаний, якщо (a) вогнище досягає порогу 3 см, (b) швидкість росту
  перевищує 5 мм/рік, (c) з'являються морфологічні зміни (наприклад,
  нова кістозна складова, центральний некроз, що свідчить про вищий
  ступінь злоякісності).

  **Каскадне тестування:** обов'язково пропонують усім родичам першого
  ступеня спорідненості.

  **Відмова від куріння:** загальнопопуляційний модифікатор ризику
  нирково-клітинного раку — актуальний, але не специфічний для HPRC.

  Згідно з CHARTER §11 — з урахуванням автономії пацієнта; вибір між
  активним спостереженням і втручанням є класичною сферою спільного
  прийняття рішень.

