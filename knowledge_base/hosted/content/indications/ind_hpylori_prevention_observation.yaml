do_not_do:
  - "Не подавати спостереження як еквівалент ерадикації — зниження захворюваності при цьому відсутнє."
  - "Не ігнорувати тривожні ознаки (схуднення, дисфагія, шлунково-кишкова кровотеча) — потрібна негайна верхня ендоскопія."
  - "Не використовувати цей шлях як стандарт першої лінії — трек ерадикації залишається пріоритетною рекомендацією."
  - "Не продовжувати спостереження за наявності кишкової метаплазії / дисплазії за даними біопсії — це передраковий стан, що потребує ерадикації та посиленого ендоскопічного нагляду."

do_not_do_en:
  - "Do not present observation as equivalent to eradication — incidence-reduction is absent."
  - "Do not ignore alarm features (weight loss, dysphagia, GI bleeding) — immediate upper endoscopy."
  - "Do not use this pathway as a first-line standard — the eradication track remains the preferred recommendation."
  - "Do not continue observation in the presence of intestinal metaplasia / dysplasia on biopsy — this is pre-cancerous, requires eradication + enhanced surveillance endoscopy."

