red_flags_triggering_alternative: []
required_tests: []
desired_tests: []

rationale: >
  Alternative-track companion to IND-IATROGENIC-ALKYLATOR-TAML-
  PREVENTION-SURVEILLANCE. Patient declines structured q3-6mo CBC
  surveillance (clinic-burden, anxiety, surveillance-fatigue post-
  primary-cancer treatment) — receives symptom-vigilance education
  + low-threshold evaluation for any reported symptom (easy bruising,
  prolonged bleeding, persistent fatigue, recurrent infections, fever).
  Per CHARTER §11 patient-autonomy framing — surveillance refusal is a
  legitimate choice but framed as suboptimal vs. scheduled-surveillance
  comparator (which catches t-MDS at treatable cytopenic phase).

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до
  IND-IATROGENIC-ALKYLATOR-TAML-PREVENTION-SURVEILLANCE. Пацієнт
  відмовляється від структурованого спостереження з CBC кожні 3-6
  місяців (навантаження відвідуваннями, тривожність, втома від
  спостереження після лікування первинного онкологічного захворювання)
  — натомість отримує навчання щодо пильності до симптомів і швидку
  оцінку за наявності будь-якого симптому (легке утворення синців,
  тривала кровоточивість, стійка втомлюваність, повторні інфекції,
  гарячка). Відповідно до §11 CHARTER.

