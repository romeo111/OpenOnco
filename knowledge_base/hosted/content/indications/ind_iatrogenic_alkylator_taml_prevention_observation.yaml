do_not_do:
  - "Не подавати спостереження за симптомами (observation) як еквівалент активному спостереженню (surveillance) — t-MDS, виявлена завдяки активному спостереженню, має суттєво кращий прогноз."
  - "Не пропускати навчання пацієнта щодо симптомів — оцінка за появи симптомів залежить від обізнаності пацієнта."
  - "Не затримувати обстеження при ранній цитопенії, навіть без структурованого графіка спостереження."
  - "Не сприймати відмову від спостереження як норму — пояснювати пацієнту, що CBC кожні 3-6 місяців є малообтяжливим і високоінформативним."

do_not_do_en:
  - "Do not present observation as equivalent to surveillance — surveillance-detected t-MDS has substantially better outcomes."
  - "Do not skip patient education about symptoms — symptom-prompted evaluation depends on patient awareness."
  - "Do not delay workup for early cytopenia even without a structured surveillance schedule."
  - "Do not normalize surveillance refusal — counsel that CBC q3-6mo is low-burden and high-yield."

