do_not_do:
  - "Не пропускати CBC-спостереження — медіана латентного періоду t-AML становить 5-7 років, а не 1-2 роки."
  - "Не виконувати рутинні профілактичні біопсії кісткового мозку в безсимптомних пацієнтів із нормальним CBC — діагностична цінність низька."
  - "Не вважати, що ризик t-AML обмежується першими 5 роками — кумулятивна частота продовжує зростати до 10 років."
  - "Не застосовувати режими на основі алкілуючих препаратів для виліковних станів, якщо існує альтернативний нелейкозогенний режим без погіршення результатів лікування."
  - "Не вважати t-AML завжди фатальною — t-MDS, виявлена на ранній стадії, піддається алогенній трансплантації ГСК зі значущою довготривалою виживаністю."

do_not_do_en:
  - "Do not skip CBC surveillance — median t-AML latency is 5-7y, not years 1-2."
  - "Do not perform routine prophylactic marrow biopsies in asymptomatic patients with normal CBC — yield is poor."
  - "Do not expect t-AML to be limited to the first 5y — cumulative incidence continues to climb through 10y."
  - "Do not use alkylator-based regimens for curable conditions when an alternative non-leukemogenic regimen exists without compromising outcome."
  - "Do not consider t-AML always fatal — early-detected t-MDS is amenable to allogeneic HSCT with meaningful long-term survival."

