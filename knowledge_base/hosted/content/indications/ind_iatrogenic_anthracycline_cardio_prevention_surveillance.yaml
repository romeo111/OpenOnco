expected_outcomes:
  overall_response_rate: "ASCO + COG-LTFU + ESC + Childhood Cancer Survivor Study (CCSS) cardio-surveillance pathways detect asymptomatic LV dysfunction at GLS / LVEF decline phase, enabling early ACE inhibitor / beta-blocker / SGLT2-i initiation that can stabilize or reverse early cardiotoxicity. Outcomes substantially better with surveillance-detected early-stage cardiotoxicity vs. late presentation with symptomatic HF. Pediatric cancer survivors with anthracycline exposure have 5-15x risk of HF vs. siblings — lifelong surveillance warranted."

