do_not_do:
  - "Не покладатися лише на ФВЛШ (LVEF) без GLS — GLS виявляє субклінічну дисфункцію раніше."
  - "Не пропускати вихідну ехокардіографію — без вихідних даних зниження неможливо кількісно оцінити."
  - "Не використовувати дорослий графік спостереження для дітей, які пережили рак, — довічний ризик СН (ACS) у педіатричних пацієнтів суттєво вищий; COG-LTFU вимагає частішого спостереження."
  - "Не дозволяти вагітність без прегестаційної кардіологічної оцінки у жінок з анамнезом лікування антрациклінами."
  - "Не пропускати спостереження щодо t-AML — антрацикліни є інгібіторами топоізомерази II; необхідні обидва напрямки спостереження."
  - "Не залишати безсимптомну дисфункцію ЛШ без втручання за принципом 'зачекати і спостерігати' — раннє призначення інгібітора АПФ і бета-блокатора може стабілізувати або призвести до регресу дисфункції."

do_not_do_en:
  - "Do not rely on LVEF alone without GLS — GLS catches subclinical dysfunction earlier."
  - "Do not skip the baseline echo — without baseline, decline cannot be quantified."
  - "Do not use the adult surveillance cadence for pediatric cancer survivors — pediatric ACS lifetime HF risk is substantially higher; COG-LTFU mandates more frequent surveillance."
  - "Do not approve pregnancy without pre-conception cardio assessment in women with anthracycline history."
  - "Do not skip t-AML surveillance — anthracyclines are topo2 inhibitors; both surveillance dimensions are required."
  - "Do not treat asymptomatic LV dysfunction as 'wait + watch' — early ACE inhibitor + beta-blocker can stabilize or reverse it."

