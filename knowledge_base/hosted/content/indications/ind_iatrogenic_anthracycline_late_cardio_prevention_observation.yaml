do_not_do:
  - "Не подавати спостереження за симптомами (observation) як еквівалент структурованому спостереженню COG-LTFU — результати лікування СН, виявленої на пізній стадії, гірші."
  - "Не пропускати кардіопротекторне консультування щодо способу життя — навіть якщо пацієнт відмовився від активного спостереження, керовані серцево-судинні фактори ризику залишаються важливими."
  - "Не розцінювати легку задишку при навантаженні як 'детренованість' — у виживачів після лікування антрациклінами це показання для термінової ехокардіографії."
  - "Не пропускати навчання щодо пильності до симптомів t-AML — вплив антрациклінів також запускає RF-IATROGENIC-TOPO2-TAML-PREVENTION."

do_not_do_en:
  - "Do not present observation as equivalent to structured COG-LTFU surveillance — late-presentation HF outcomes are worse."
  - "Do not skip cardioprotective lifestyle counseling — even if surveillance is declined, modifiable CV risk factors are important."
  - "Do not normalize mild dyspnea on exertion as 'deconditioning' — in anthracycline-exposed survivors this warrants a stat echo."
  - "Do not skip t-AML symptom-vigilance education — anthracycline exposure also triggers RF-IATROGENIC-TOPO2-TAML-PREVENTION."

