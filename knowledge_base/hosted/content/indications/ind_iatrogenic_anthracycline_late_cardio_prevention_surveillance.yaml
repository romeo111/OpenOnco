do_not_do:
  - "Не застосовувати загальний графік ехокардіографії після завершення лікування для виживачів через ≥5 років — графік пізніх ефектів COG-LTFU суттєво відрізняється і залежить від страти ризику (доза + променева терапія на грудну клітку + вік на момент впливу)."
  - "Не покладатися лише на ФВЛШ без GLS у цій когорті — GLS виявляє субклінічну дисфункцію на роки раніше."
  - "Не розцінювати легку задишку при навантаженні як 'детренованість' у виживачів після лікування антрациклінами — це показання для термінової ехокардіографії."
  - "Не пропускати консультування щодо планування вагітності — гемодинамічне навантаження вагітності може виявити субклінічну кардіотоксичність."
  - "Не залишати безсимптомну дисфункцію ЛШ без втручання за принципом 'зачекати і спостерігати' — раннє призначення інгібітора АПФ і бета-блокатора може стабілізувати або зумовити регрес дисфункції."

do_not_do_en:
  - "Do not use the general post-completion echo schedule for survivors ≥5y post-treatment — COG-LTFU late-effects cadence differs substantially and is risk-stratum-driven (dose + chest RT + age at exposure)."
  - "Do not rely on LVEF alone without GLS in this cohort — GLS catches subclinical dysfunction years earlier."
  - "Do not normalize mild dyspnea on exertion as 'deconditioning' in anthracycline-exposed survivors — warrants stat echo."
  - "Do not skip pregnancy planning counseling — pregnancy hemodynamic load can unmask subclinical cardiotoxicity."
  - "Do not treat asymptomatic LV dysfunction as 'wait + watch' — early ACE inhibitor + beta-blocker can stabilize or reverse it."

