do_not_do:
  - "Не подавати цей альтернативний шлях як еквівалент структурованому перегляду поступового зниження комбінованої терапії — значуща різниця стосується саме осі комбінованої терапії."
  - "Не пропускати чітке навчання щодо B-симптомів і лімфаденопатії — HSTCL має характерну клінічну картину."
  - "Не позбавляти пацієнта доступу до гематолога — навіть якщо він відмовився від планового спостереження."
  - "Не розцінювати гепатоспленомегалію без загострення ЗЗК у молодого пацієнта на комбінованій терапії як норму — показане обстеження на HSTCL."
  - "Не застосовувати живі вакцини під час активної біологічної терапії."
  - "Не перебільшувати сигнал ризику раку при монотерапії анти-TNF — він відповідає популяційному фону."

do_not_do_en:
  - "Do not present observation as equivalent to structured combination-step-down review — the meaningful difference is in the combination-therapy axis."
  - "Do not skip explicit B-symptom + lymphadenopathy education — HSTCL has a distinctive presentation."
  - "Do not deny the patient hematology access — even if routine surveillance is declined."
  - "Do not normalize hepatosplenomegaly without IBD flare in a young patient on combination — HSTCL workup."
  - "Do not use live vaccines during active biologic therapy."
  - "Do not overstate anti-TNF monotherapy cancer signal — at population background."

