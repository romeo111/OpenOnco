do_not_do:
  - "Не призначати комбінацію анти-TNF + тіопурин EBV-серонегативному молодому чоловікові без обговорення альтернатив — ризик HSTCL."
  - "Не пропускати скринінг на туберкульоз (IGRA / TST) перед початком терапії анти-TNF — ризик реактивації латентного туберкульозу."
  - "Не пропускати скринінг на HBV перед початком терапії анти-TNF — ризик реактивації в HBsAg+ або anti-HBc+ пацієнтів."
  - "Не перебільшувати сигнал ризику раку при монотерапії анти-TNF — він відповідає популяційному фону; значуща вісь ризику — комбінована терапія."
  - "Не розцінювати незрозумілу гепатоспленомегалію без загострення ЗЗК у молодого пацієнта на комбінованій терапії як норму — показане обстеження на HSTCL."
  - "Не застосовувати живі вакцини під час активної біологічної терапії."

do_not_do_en:
  - "Do not initiate anti-TNF + thiopurine combination in an EBV-seronegative young man without discussing alternatives — HSTCL risk."
  - "Do not skip TB screening (IGRA / TST) before anti-TNF initiation — latent TB reactivation risk."
  - "Do not skip HBV screening before anti-TNF — reactivation in HBsAg+ or anti-HBc+ cohort."
  - "Do not overstate anti-TNF monotherapy cancer signal — at population background; combination therapy is the meaningful axis."
  - "Do not normalize unexplained hepatosplenomegaly without IBD flare in a young patient on combination — HSTCL workup."
  - "Do not use live vaccines during active biologic therapy."

