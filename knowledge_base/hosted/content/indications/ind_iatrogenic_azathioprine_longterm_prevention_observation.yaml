do_not_do:
  - "Не подавати цей альтернативний шлях як еквівалент дерматологічному спостереженню та перегляду показань — кумулятивний ризик від тіопурину посилюється з часом."
  - "Не пропускати чітке навчання щодо сонцезахисту та B-симптомів — це дає найбільшу користь від самостійного догляду."
  - "Не позбавляти пацієнта доступу до дерматолога / гематолога за появи симптомів — навіть якщо він відмовився від планового спостереження."
  - "Не розцінювати нове шкірне утворення / рану, що не гоїться / лімфаденопатію / B-симптоми як норму — це тривожні ознаки."
  - "Не продовжувати застосування тіопурину необмежено без структурованого обговорення спільного рішення на 5-му році."
  - "Не покладатися лише на самообстеження — ранні ураження можуть бути малопомітними."

do_not_do_en:
  - "Do not present observation as equivalent to dermatologic surveillance + indication review — thiopurine cumulative risk compounds."
  - "Do not skip explicit sun-protection + B-symptom education — highest self-care yield."
  - "Do not deny the patient symptom-prompted dermatology / hematology access — even if routine surveillance is declined."
  - "Do not normalize a new skin lesion / non-healing sore / lymphadenopathy / B-symptoms — alarm signs."
  - "Do not continue thiopurine indefinitely without structured shared-decision discussion at year 5."
  - "Do not rely on self-examination alone — early lesions can be subtle."

