do_not_do:
  - "Не призначати азатіоприн EBV-серонегативному молодому чоловікові — ризик фатальної постмононуклеозної лімфоми згідно з ECCO 2019."
  - "Не пропускати щорічний огляд шкіри всього тіла — це дає основну користь для профілактики раку."
  - "Не пропускати скринінг на HBV перед початком терапії — ризик реактивації; профілактична противірусна терапія в HBsAg+ або anti-HBc+ пацієнтів."
  - "Не розцінювати незрозумілу лімфаденопатію / B-симптоми в пацієнта, який отримує тіопурин, як норму — ризик DLBCL."
  - "Не продовжувати застосування тіопурину без перегляду показань на 5-му році — альтернативи вже існують і покращились."
  - "Не пропускати надолуження вакцинації проти ВПЛ — імуносупресія не є протипоказанням до інактивованих вакцин."

do_not_do_en:
  - "Do not initiate azathioprine in an EBV-seronegative young man — fatal post-mononucleosis lymphoma risk per ECCO 2019."
  - "Do not skip annual whole-body skin exam — primary cancer-prevention yield."
  - "Do not skip HBV screening pre-initiation — reactivation risk; prophylactic antiviral in HBsAg+ or anti-HBc+ cohort."
  - "Do not normalize unexplained lymphadenopathy / B-symptoms in a thiopurine-exposed patient — DLBCL risk."
  - "Do not continue thiopurine without year-5 shared-decision indication review — alternatives have improved."
  - "Do not skip HPV vaccination catch-up — immunosuppression is not a contraindication to inactivated vaccines."

