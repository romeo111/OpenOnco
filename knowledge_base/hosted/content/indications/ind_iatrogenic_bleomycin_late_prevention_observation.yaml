do_not_do:
  - "Не подавати цей альтернативний шлях як еквівалент структурованому спостереженню PFT та скринінгу LDCT — результати лікування фіброзу та раку легені, виявлених на пізній стадії, суттєво гірші."
  - "Не пропускати консультування щодо відмови від куріння — навіть у цьому альтернативному шляху це втручання з найбільшою користю."
  - "Не розцінювати стійкий кашель як 'післявірусний' у виживача після лікування блеоміцином — це показання для термінового обстеження."
  - "Не пропускати консультування щодо медичного браслета / картки з попередженням про довічну обережність щодо високого FiO2 — це актуально навіть якщо пацієнт відмовився від планового спостереження PFT."

do_not_do_en:
  - "Do not present observation as equivalent to structured PFT surveillance + LDCT screening — late-presentation fibrosis + lung cancer have substantially worse outcomes."
  - "Do not skip smoking cessation counseling — even on the observation track this is the highest-yield intervention."
  - "Do not normalize persistent cough as 'post-viral' in a bleomycin survivor — warrants urgent evaluation."
  - "Do not skip medical-alert / wallet card counseling re: lifelong high-FiO2 caution — relevant even if routine PFT surveillance is declined."

