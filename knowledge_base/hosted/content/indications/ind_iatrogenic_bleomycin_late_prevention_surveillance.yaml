do_not_do:
  - "Не пропускати DLCO в панелі ФЗД — це найчутливіший маркер блеоміцин-індукованого фіброзу; сама лише ФЖЄЛ може залишатися нормальною на ранніх стадіях."
  - "Не пропускати консультування щодо відмови від куріння — це найефективніша інтервенція серед пізніх ефектів; блеоміцин і тютюн діють синергічно."
  - "Не виключати право на скринінг раку легені методом НДКТ лише на основі віку — виживачі з експозицією блеоміцину та анамнезом куріння мають право на скринінг навіть нижче загального порогу USPSTF."
  - "Не призначати кисень з високим FiO2 без повідомлення анестезіологу про історію застосування блеоміцину — токсичність кисню може спровокувати загострення фіброзу довічно."
  - "Не розцінювати стійкий кашель як 'поствірусний' у виживача з експозицією блеоміцину — це показання до ФЗД і КТ високої роздільної здатності органів грудної клітки."

do_not_do_en:
  - "Do not skip DLCO in the PFT panel — it is the most sensitive marker for bleomycin-induced fibrosis; FVC alone may remain normal in early stages."
  - "Do not skip smoking cessation counseling — it is the highest-yield late-effect intervention; bleomycin + tobacco are synergistic."
  - "Do not exclude LDCT lung-cancer screening eligibility based on age alone — bleomycin survivors with a smoking history qualify even below the general USPSTF threshold."
  - "Do not order high-FiO2 oxygen without disclosing the bleomycin history to anesthesia — oxygen toxicity can precipitate a fibrosis exacerbation lifelong."
  - "Do not normalize persistent cough as 'post-viral' in a bleomycin survivor — warrants PFT + HRCT chest."

