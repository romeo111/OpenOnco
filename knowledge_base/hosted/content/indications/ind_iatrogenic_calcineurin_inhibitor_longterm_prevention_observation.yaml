do_not_do:
  - "Не подавати цей альтернативний трек як еквівалент дерматологічного спостереження — SCC, спричинений інгібіторами кальциневрину, має гірший прогноз для кожної стадії."
  - "Не пропускати чітке інформування про тривожні симптоми та фотозахист — це дає найбільшу користь із погляду самодогляду."
  - "Не позбавляти пацієнта доступу до дерматолога за появи симптомів — навіть якщо він відмовився від планового спостереження."
  - "Не розцінювати нове шкірне ураження / незагойну виразку / пурпурну пляму як норму — будь-яка тривожна ознака потребує оцінки."
  - "Не покладатися лише на самообстеження — ранні ураження часто малопомітні або їх плутають з актинічним пошкодженням шкіри."

do_not_do_en:
  - "Do not present observation as equivalent to dermatologic surveillance — calcineurin-driven SCC has worse stage-for-stage prognosis."
  - "Do not skip explicit symptom-vigilance + sun-protection education — the highest self-care yield."
  - "Do not deny the patient symptom-prompted dermatology access — even if routine surveillance is declined."
  - "Do not normalize a new skin lesion / non-healing sore / purple macule — any alarm sign requires evaluation."
  - "Do not rely on self-examination alone — early lesions are often subtle / mistaken for actinic damage."

