rationale: >
  Alternative-track companion to IND-IATROGENIC-CALCINEURIN-
  INHIBITOR-LONGTERM-PREVENTION-SURVEILLANCE. Patient declines
  structured annual / q6mo dermatologic surveillance (geographic
  access, surveillance fatigue, preference — particularly common
  in long-term-stable transplant survivors who have not yet had
  a skin cancer) — receives explicit sun-protection counseling
  (broad-spectrum SPF 30+ daily, peak UV avoidance, photo-
  protective clothing) + symptom-vigilance education (new or
  changing skin lesion regardless of how minor it appears,
  non-healing sore, purple / red / brown macule or nodule on
  extremities or oral mucosa, lower-lip persistent dryness /
  ulceration → immediate dermatology referral) + skin-self-
  examination instruction (monthly with mirror; partner-
  assisted for hard-to-see areas). Per CHARTER §11 patient-
  autonomy framing — declining the structured pathway is
  legitimate but framed as suboptimal vs. active-dermatology
  comparator. Particular emphasis: skin self-examination cannot
  substitute for dermatologic exam in this high-risk cohort;
  early SCC and KS lesions often subtle / mistaken for actinic
  damage by the patient.

rationale_ua: >
  Альтернативний трек, супутній до IND-IATROGENIC-CALCINEURIN-
  INHIBITOR-LONGTERM-PREVENTION-SURVEILLANCE. Пацієнт відмовляється
  від структурованого щорічного / раз на 6 місяців дерматологічного
  спостереження (географічна доступність, втома від спостереження,
  особисті переваги — особливо часто у довготривало стабільних
  реципієнтів трансплантата, які ще не мали раку шкіри) — натомість
  отримує чітке консультування щодо фотозахисту (широкоспектральний
  SPF 30+ щодня, уникнення пікового УФ-випромінювання, фотозахисний
  одяг) + інформування про тривожні симптоми (нове або таке, що
  змінюється, шкірне ураження — незалежно від того, наскільки
  незначним воно здається, незагойна виразка, пурпурна / червона /
  коричнева пляма чи вузлик на кінцівках або слизовій оболонці рота,
  стійка сухість / виразкування нижньої губи → негайне направлення
  до дерматолога) + інструктаж із самообстеження шкіри (щомісяця з
  дзеркалом; за участі партнера для важкодоступних ділянок). Згідно
  з рамкою пацієнтської автономії CHARTER §11 — відмова від
  структурованого шляху є правомірним рішенням, але розглядається
  як менш оптимальна порівняно з активним дерматологічним
  спостереженням. Особливо підкреслюється: самообстеження шкіри не
  може замінити дерматологічний огляд у цій групі високого ризику;
  ранні ураження SCC і саркоми Капоші (KS) часто малопомітні або
  пацієнт помилково приймає їх за актинічне пошкодження шкіри.

