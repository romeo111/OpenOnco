do_not_do:
  - "Не пропускати щорічний / раз на 6 місяців огляд усієї поверхні шкіри — це дає найбільшу користь з погляду профілактики раку."
  - "Не переходити з циклоспорину / такролімусу на mTOR-інгібітор в односторонньому порядку — потрібна координація з трансплантаційною командою."
  - "Не пропускати консультування щодо фотозахисту — дає найбільшу користь із погляду самодогляду."
  - "Не ігнорувати ураження нижньої губи / незагойні виразки губи — вони непропорційно часто трапляються в цій когорті."
  - "Не розцінювати нові шкірні вузлики / пурпурно-червоні плями як норму — KS може проявлятися приховано чи атипово."
  - "Не лікувати окремі актинічні кератози поодинці — терапія поля ураження (5-ФУ / імікімод) є ефективнішою."

do_not_do_en:
  - "Do not skip annual / q6mo whole-body skin exam — the highest cancer-prevention yield."
  - "Do not switch cyclosporine / tacrolimus → mTOR inhibitor unilaterally — transplant-team coordination required."
  - "Do not omit sun-protection counseling — highest self-care yield."
  - "Do not ignore lower-lip lesions / non-healing lip ulcers — over-represented in this cohort."
  - "Do not normalize new cutaneous nodules / purple-red macules — KS can present subtly / atypically."
  - "Do not treat field actinic keratoses individually — field therapy (5-FU / imiquimod) is more effective."

