do_not_do:
  - "Не подавати цей трек як еквівалент структурованого скринінгу зі спільним ухваленням рішення — виявлення на ранній стадії дає достовірно кращі результати."
  - "Не пропускати чітке інформування про тривожні симптоми — розпізнавання патерну є критично важливим для обстеження, ініційованого симптомами."
  - "Не позбавляти пацієнтку доступу до обстеження ендометрія / грудної залози за появи симптомів — навіть якщо вона відмовилася від планового скринінгу."
  - "Не розцінювати неочікувану або постменопаузальну кровотечу як норму — будь-який тривожний симптом потребує оцінки."
  - "Не продовжувати ЗГТ за замовчуванням без періодичного перегляду співвідношення користі та ризику — серцево-судинний ризик змінюється з віком."

do_not_do_en:
  - "Do not present observation as equivalent to structured screening + shared-decision review — earlier-stage detection produces reliably better outcomes."
  - "Do not skip explicit symptom-vigilance education — pattern recognition is critical for symptom-prompted evaluation."
  - "Do not deny the patient symptom-prompted endometrial / breast workup access — even if routine screening is declined."
  - "Do not normalize unexpected or postmenopausal bleeding — any alarm symptom requires evaluation."
  - "Do not continue HRT by default without periodic risk-benefit reassessment — CV risk evolves with age."

