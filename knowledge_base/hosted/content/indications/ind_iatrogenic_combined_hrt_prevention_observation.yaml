rationale: >
  Alternative-track companion to IND-IATROGENIC-COMBINED-HRT-
  PREVENTION-SURVEILLANCE. Patient declines structured shared-
  decision HRT review + age-appropriate mammographic screening
  + annual GYN exam (screening fatigue, geographic access,
  preference, comfort with current symptom control) — receives
  explicit symptom-vigilance education (breast lump, skin
  retraction / dimpling, nipple discharge, ANY unexpected
  bleeding outside the expected sequential-withdrawal pattern,
  postmenopausal bleeding → immediate breast / gynecology
  referral, regardless of how minor it appears) + cardiovascular
  / VTE self-awareness counseling (new leg swelling, chest pain,
  neurologic symptom → emergency evaluation; not HRT-stop in
  isolation but acute event workup). Per CHARTER §11 patient-
  autonomy framing — declining the structured pathway is
  legitimate but framed as suboptimal vs. annual-review +
  screening comparator. Particular emphasis: endometrial cancers
  in HRT-exposed women present with bleeding ~95% of the time —
  symptom-prompted pathway has high sensitivity.

rationale_ua: >
  Альтернативний трек, супутній до IND-IATROGENIC-COMBINED-HRT-
  PREVENTION-SURVEILLANCE. Пацієнтка відмовляється від
  структурованого спільного перегляду ЗГТ (гормональної замісної
  терапії) + вікового мамографічного скринінгу + щорічного
  гінекологічного огляду (втома від скринінгу, географічна
  доступність, особисті переваги, задоволеність поточним контролем
  симптомів) — натомість отримує чітке інформування про тривожні
  симптоми (ущільнення в грудній залозі, втягнення / зміна шкіри,
  виділення з соска, БУДЬ-ЯКА неочікувана кровотеча поза очікуваним
  циклічним патерном відміни, постменопаузальна кровотеча →
  негайне направлення до мамолога / гінеколога, незалежно від того,
  наскільки незначним це здається) + консультування щодо
  самоусвідомлення серцево-судинних ризиків / ризику ВТЕ (новий
  набряк ноги, біль у грудях, неврологічний симптом → невідкладна
  оцінка; це не привід самостійно припиняти ЗГТ, а показання до
  обстеження гострої події). Згідно з рамкою пацієнтської автономії
  CHARTER §11 — відмова від структурованого шляху є правомірним
  рішенням, але розглядається як менш оптимальна порівняно зі
  щорічним переглядом + скринінгом. Особливо підкреслюється: рак
  ендометрія у жінок з експозицією ЗГТ проявляється кровотечею
  приблизно у 95% випадків — шлях, орієнтований на симптоми, має
  високу чутливість.

