do_not_do:
  - "Не призначати монотерапію естрогеном жінці зі збереженою маткою — виражений ризик раку ендометрія; завжди в комбінації з прогестагеном."
  - "Не продовжувати ЗГТ за замовчуванням без спільного перегляду на 5-му році і щорічно надалі."
  - "Не призначати рутинний безсимптомний скринінг трансвагінальним УЗД — висока частота хибнопозитивних результатів; доведеної переваги для виживаності немає; ACOG / NCCN не рекомендують."
  - "Не припиняти ЗГТ різко у симптоматичної пацієнтки без обговорення поступового зниження дози — можливий рецидив вазомоторних симптомів."
  - "Не розцінювати неочікувану або постменопаузальну кровотечу як норму — трансвагінальне УЗД + біопсія є обов'язковими."
  - "Не застосовувати системну ЗГТ лише за наявності урогенітальних симптомів — вагінальний естроген є безпечнішою формою."

do_not_do_en:
  - "Do not prescribe estrogen-alone HRT in a woman with intact uterus — marked endometrial-cancer risk; always pair with progestin."
  - "Do not continue HRT by default without shared-decision review at year 5 and annually."
  - "Do not order routine asymptomatic TVUS screening — false-positive rate, no proven survival benefit; ACOG/NCCN advise against."
  - "Do not stop HRT abruptly in a symptomatic woman without discussing step-down — vasomotor rebound."
  - "Do not normalize unexpected or postmenopausal bleeding — TVUS + biopsy non-negotiable."
  - "Do not use systemic HRT for GU-symptom-only indication — vaginal estrogen is a safer modality."

