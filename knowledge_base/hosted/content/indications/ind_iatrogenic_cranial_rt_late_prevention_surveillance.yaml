do_not_do:
  - "Не пропускати щорічну ендокринну панель у виживших після краніального опромінення — дисфункція гіпоталамо-гіпофізарної осі може роками залишатися прихованою за поступового розвитку."
  - "Не виконувати рутинну безсимптомну МРТ головного мозку щороку в усіх пацієнтів — результативність обмежена; візуалізація, ініційована симптомами, є основним методом скринінгу."
  - "Не розцінювати епілептичний напад, що вперше виник, як 'ідіопатичну епілепсію' у виживших після краніального опромінення — це показання до термінової МРТ головного мозку для виключення вторинної пухлини ЦНС."
  - "Не пропускати нейрокогнітивне спостереження в дорослих виживачів — когнітивне зниження як пізній ефект є поширеним і часто недодіагностованим."
  - "Не делегувати спостереження за педіатричними виживачами клініці без відповідного досвіду — настанови COG-LTFU складні і потребують спеціалізованої експертизи."

do_not_do_en:
  - "Do not skip the annual endocrine panel in cranial-RT survivors — HP-axis dysfunction can be silent for years if onset is gradual."
  - "Do not perform routine asymptomatic brain MRI q1y in everyone — yield is limited; symptom-driven imaging is the primary screening modality."
  - "Do not normalize new-onset seizure as 'idiopathic epilepsy' in a cranial-RT survivor — warrants urgent brain MRI to evaluate for a secondary CNS tumor."
  - "Do not skip neurocognitive surveillance in adult survivors — late-effects cognitive decline is common and underdiagnosed."
  - "Do not delegate pediatric-survivor surveillance to non-experienced clinics — COG-LTFU guidelines are complex and require expertise."

