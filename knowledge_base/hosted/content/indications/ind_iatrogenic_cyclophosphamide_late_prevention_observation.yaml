do_not_do:
  - "Не подавати цей трек як еквівалент структурованого спостереження — пізно виявлені рак сечового міхура і вторинний ГМЛ (гостра мієлоїдна лейкемія) мають суттєво гірші результати."
  - "Не розцінювати будь-яку гематурію у виживого після циклофосфаміду як норму — потрібна термінова цистоскопія навіть на цьому альтернативному треку."
  - "Не пропускати консультування щодо відмови від куріння — це незалежний фактор ризику раку сечового міхура, що додається до ризику, спричиненого циклофосфамідом."
  - "Не вважати стійку втому 'нормальним станом після раку' — вона може бути прихованою ознакою вторинного МДС; загальний аналіз крові щонайменше раз на рік потрібен навіть на цьому альтернативному треку."

do_not_do_en:
  - "Do not present observation as equivalent to structured surveillance — late-presentation bladder cancer + t-AML have substantially worse outcomes."
  - "Do not normalize any hematuria in a cyclophosphamide survivor — warrants urgent cystoscopy even on the observation track."
  - "Do not skip smoking cessation counseling — independent bladder cancer risk factor; additive to cyclophosphamide-induced risk."
  - "Do not treat persistent fatigue as 'normal post-cancer' — may be silent t-MDS; CBC q1y is the minimum even on the observation track."

