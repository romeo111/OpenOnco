do_not_do:
  - "Не пропускати цитологію сечі в щорічному скринінгу — сам лише загальний аналіз сечі має нижчу чутливість для карциноми уротелію in situ, особливо в когорті з експозицією циклофосфаміду."
  - "Не розцінювати мікроскопічну гематурію як 'ІСШ' без цистоскопічного обстеження у виживачів після циклофосфаміду — діагностична затримка трапляється часто."
  - "Не виконувати рутинні профілактичні біопсії кісткового мозку в безсимптомних пацієнтів із нормальним загальним аналізом крові — результативність низька."
  - "Не призначати додаткову терапію алкілувальними агентами за доброякісних показань, якщо існують альтернативи — ритуксимаб + мікофенолату мофетил для автоімунних захворювань."
  - "Не вважати вторинний МДС / ГМЛ завжди фатальним — рано виявлений вторинний МДС піддається алогенній трансплантації гемопоетичних стовбурових клітин зі значущою довгостроковою виживаністю."

do_not_do_en:
  - "Do not skip urine cytology in annual screening — urinalysis alone has lower sensitivity for urothelial carcinoma in situ, especially in a cyclophosphamide-exposed cohort."
  - "Do not normalize microscopic hematuria as 'UTI' without cystoscopic evaluation in cyclophosphamide survivors — diagnostic delay is frequent."
  - "Do not perform routine prophylactic marrow biopsies in asymptomatic patients with a normal CBC — yield is poor."
  - "Do not prescribe additional alkylator-based therapy for benign indications when alternatives exist — rituximab + mycophenolate for autoimmune disease."
  - "Do not consider t-MDS / t-AML always fatal — early-detected t-MDS is amenable to allogeneic HSCT with meaningful long-term survival."

