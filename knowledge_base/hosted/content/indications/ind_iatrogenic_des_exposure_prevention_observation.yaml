do_not_do:
  - "Не подавати цей трек як еквівалент щорічного DES-специфічного огляду — виявлення CCA критично залежить від клінічного огляду."
  - "Не пропускати чітке інформування про тривожні симптоми — розпізнавання патерну є критично важливим для доньок жінок, які приймали DES."
  - "Не позбавляти пацієнтку доступу до обстеження за появи симптомів — навіть якщо вона відмовилася від планового огляду, гінеколог має бути доступний."
  - "Не розцінювати вагінальну кровотечу / виділення / диспареунію в доньки жінки, яка приймала DES, як норму — будь-який тривожний симптом потребує оцінки."
  - "Не рекомендувати самообстеження як заміну клінічному огляду органів малого таза — CCA може проявлятися пальпованим утворенням без кровотечі."

do_not_do_en:
  - "Do not present observation as equivalent to annual DES-specific exam — CCA detection critically depends on clinical exam."
  - "Do not skip explicit symptom-vigilance education — pattern recognition is critical in DES daughters."
  - "Do not deny the patient symptom-prompted workup access — even if routine exam is declined, GYN must be available."
  - "Do not normalize vaginal bleeding / discharge / dyspareunia in a DES daughter — any alarm symptom requires evaluation."
  - "Do not recommend self-examination as a substitute for clinical pelvic exam — CCA can be a palpable mass without bleeding."

