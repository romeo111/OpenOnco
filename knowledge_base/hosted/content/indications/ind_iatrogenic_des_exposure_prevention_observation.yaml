desired_tests: []

rationale: >
  Alternative-track companion to IND-IATROGENIC-DES-EXPOSURE-
  PREVENTION-SURVEILLANCE. Patient declines annual DES-specific
  gynecologic examination (provider access — DES-experienced
  gynecologists increasingly rare as cohort ages; surveillance
  fatigue, anxiety, preference) — receives explicit symptom-
  vigilance education (abnormal vaginal bleeding regardless of
  pattern, persistent vaginal discharge, dyspareunia, pelvic
  pain, palpable mass → immediate gynecology referral, even if
  minor / intermittent). Per CHARTER §11 patient-autonomy framing
  — declining the structured annual exam is legitimate but framed
  as suboptimal vs. annual-DES-exam comparator. Particularly
  emphasized: clear-cell adenocarcinoma may present as a palpable
  vaginal-wall mass without bleeding — self-examination cannot
  substitute for clinical pelvic exam.

rationale_ua: >
  Альтернативний трек, супутній до IND-IATROGENIC-DES-EXPOSURE-
  PREVENTION-SURVEILLANCE. Пацієнтка відмовляється від щорічного
  гінекологічного огляду за DES-специфічною методикою (доступність
  фахівця — гінекологи з досвідом ведення DES-когорти стають
  дедалі рідкіснішими в міру старіння когорти; втома від
  спостереження, тривожність) — натомість отримує чітке
  інформування про тривожні симптоми (аномальна вагінальна
  кровотеча незалежно від характеру, стійкі вагінальні виділення,
  диспареунія, тазовий біль, пальповане утворення → негайне
  направлення до гінеколога, навіть якщо симптом здається
  незначним чи непостійним). Згідно з рамкою пацієнтської
  автономії CHARTER §11. Особливо підкреслюється: світлоклітинна
  аденокарцинома (CCA) може проявлятися пальпованим утворенням
  стінки піхви без кровотечі — самообстеження не може замінити
  клінічний огляд органів малого таза.

