do_not_do:
  - "Не покладатися лише на цервікальний Пап-тест у доньки жінки, яка приймала DES — CCA виникає у вагінальному аденозі, який часто не виявляється цервікальним Пап-тестом."
  - "Не пропускати повну візуалізацію дзеркалом з обертанням — адекватна інспекція стінки піхви є критично важливою."
  - "Не розцінювати аномальну вагінальну кровотечу / виділення / диспареунію в доньки жінки, яка приймала DES, як норму — потрібне негайне обстеження."
  - "Не припиняти спостереження за довільним віковим порогом — бімодальний ризик поширюється і на вік понад 40 років."
  - "Не інтенсифікувати мамографічний скринінг лише на підставі експозиції DES — величина ризику помірна."
  - "Не пропускати консультування щодо репродуктивного здоров'я у жінок репродуктивного віку — аномалії мюллерових проток впливають на планування вагітності."

do_not_do_en:
  - "Do not rely only on cervical Pap in a DES daughter — CCA arises in vaginal adenosis, often missed by cervical Pap."
  - "Do not skip full speculum visualization with rotating speculum — adequate vaginal-wall inspection is critical."
  - "Do not normalize abnormal vaginal bleeding / discharge / dyspareunia in a DES daughter — immediate workup."
  - "Do not stop surveillance at an arbitrary age cutoff — bimodal risk extends past 40 years."
  - "Do not intensify mammographic screening based on DES exposure alone — magnitude modest."
  - "Do not skip reproductive counseling in women of reproductive age — Müllerian-tract anomalies affect pregnancy planning."

