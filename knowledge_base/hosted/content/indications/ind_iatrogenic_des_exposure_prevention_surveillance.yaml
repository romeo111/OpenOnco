expected_outcomes:
  overall_response_rate: "Annual gynecologic examination with DES-specific technique (full speculum visualization + palpation of vaginal walls + colposcopy / cervical staining) detects clear-cell adenocarcinoma (CCA) and cervical CIS at curable stage in the DES-exposed cohort. Historical CCA cohort studies show 5-year survival ≥80% for stage I disease at diagnosis, falling sharply with advanced stage; surveillance is the primary tool for keeping this rare cancer in stage I."

