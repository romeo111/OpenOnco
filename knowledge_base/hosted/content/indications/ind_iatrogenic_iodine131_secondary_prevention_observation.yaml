rationale: >
  Aggressive-track (no structured surveillance) alternative for I-131-
  exposed patients.

  Components:
    - Symptom-driven workup retained — sentinel symptoms (B-symptoms,
      organomegaly, mass, hematuria, persistent oral lesion).
    - General-population cancer screening per USPSTF.
    - Endocrinology follow-up of original thyroid disease retained.
    - Reduce CBC to per-symptom rather than annual.
    - Re-offer structured surveillance annually.

