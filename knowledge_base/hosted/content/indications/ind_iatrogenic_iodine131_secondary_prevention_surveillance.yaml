rationale: >
  Standard-track prevention pathway for I-131 cumulative-dose secondary-
  cancer risk.

  Components:
    - **CBC every 12 months** for ~10 years post-I-131 — sensitivity
      modest for leukemia detection but cost-effective.
    - **Breast surveillance per USPSTF 2024** in females (biennial
      mammography from age 40) — I-131 alone does not move screening
      age; intensify only if additional risk factors (family history,
      density).
    - **Salivary + oral symptom awareness** — xerostomia common;
      persistent salivary mass + persistent oral lesion → ENT referral.
    - **Bladder symptom awareness** — persistent hematuria → urology +
      cystoscopy.
    - **General-population colorectal screening** retained.
    - **Thyroid follow-up** for original DTC continues independently
      per endocrinology — TSH suppression target, thyroglobulin
      monitoring, neck US per ATA risk stratification.
    - **For future I-131 administrations:** hydration + lemon-juice
      sialagogue + bladder voiding regimen reduces non-target organ
      dose; bowel-cleansing for high-dose treatment regimens.

  In Ukraine, I-131 administered at endocrinology + nuclear medicine
  centers in Kyiv, Lviv, Kharkiv, Odesa; coverage variable.
  Endocrinology follow-up of treated DTC widely available.

rationale_ua: >
  Стандартний-трек prevention шлях для I-131 cumulative-dose secondary-
  cancer ризику.

  Компоненти:
    - **CBC кожні 12 міс** ~10 років post-I-131.
    - **Breast surveillance per USPSTF 2024** у жінок.
    - **Salivary + oral symptom awareness** — xerostomia common.
    - **Bladder symptom awareness** — persistent hematuria → urology.
    - **General-population colorectal screening retained.**
    - **Thyroid follow-up** для original DTC per endocrinology — TSH
      suppression target, thyroglobulin monitoring, neck US.
    - **For future I-131 administrations:** hydration + lemon-juice
      sialagogue + bladder voiding regimen reduces non-target dose.

  В Україні I-131 administered у endocrinology + nuclear medicine
  centers Києва, Львова, Харкова, Одеси; coverage variable.

