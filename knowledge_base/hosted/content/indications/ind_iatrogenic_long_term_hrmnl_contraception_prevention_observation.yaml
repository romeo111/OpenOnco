do_not_do:
  - "Не подавати цей трек як еквівалент вікового скринінгу — виявлення на ранній стадії дає достовірно кращі результати."
  - "Не пропускати чітке інформування про тривожні симптоми — розпізнавання патерну є критично важливим."
  - "Не позбавляти пацієнтку доступу до обстеження за появи симптомів — навіть якщо вона відмовилася від планового скринінгу, мамолог / гінеколог мають бути доступні за будь-якого симптому."
  - "Не розцінювати аномальну кровотечу або зміну грудної залози як 'незначну' — будь-який тривожний симптом потребує оцінки."
  - "Не рекомендувати припинення приймання оральних контрацептивів як заміну скринінгу — величина зумовленого ними ризику невелика."

do_not_do_en:
  - "Do not present observation as equivalent to age-appropriate screening — earlier-stage detection produces reliably better outcomes."
  - "Do not skip explicit symptom-vigilance education — pattern recognition is critical."
  - "Do not deny the patient symptom-prompted workup access — even if routine screening is declined, breast / GYN must be available for any symptom."
  - "Do not normalize abnormal bleeding or breast change as 'minor' — any alarm symptom requires evaluation."
  - "Do not recommend stopping OCP as a substitute for screening — the attributable-risk magnitude is small."

