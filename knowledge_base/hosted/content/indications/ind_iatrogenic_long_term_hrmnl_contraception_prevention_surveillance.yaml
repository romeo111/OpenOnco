rationale: >
  Standard-track surveillance for cumulative hormonal-contraception
  exposure ≥10y. Components per NCCN Breast / Cervical + USPSTF
  + ASCCP:

  **(1) Mammographic screening per USPSTF** — women 40-74,
  biennial. NOT mandating supplemental screening (MRI/US) based
  on OCP exposure alone — absolute risk increment too modest to
  justify intensification per USPSTF. Density-based intensification
  is a separate axis (dense breasts on mammogram → consider US
  per state-level supplemental-screening regulations).

  **(2) Cervical co-test cadence per ASCCP** — primary HPV
  testing q5y ages 25-65 (preferred), or co-test (cytology + HPV)
  q5y ages 30-65. ≥10y prior OCP use is NOT a guideline-modifying
  factor in itself, but co-existing high-risk HPV positivity at
  screening shifts management per ASCCP (immediate colposcopy
  for HPV-16/18 positive; risk-based for other high-risk types).

  **(3) Clinical breast exam + breast self-awareness counseling.**
  Breast lump, skin change, nipple discharge, persistent breast
  pain → diagnostic mammogram + targeted US workup, not screening
  pathway.

  **(4) Abnormal-bleeding evaluation** — post-coital bleeding,
  intermenstrual bleeding outside expected pattern, postmenopausal
  bleeding → speculum exam + cervical cytology + colposcopy +
  endometrial sampling per ACOG.

  **(5) Risk-factor co-screening** — Lynch / BRCA family history,
  prior thoracic radiation (Hodgkin survivor), tobacco use,
  obesity / sedentary lifestyle — all separately addressable
  axes; address per separate pathways. Cumulative OCP exposure
  alone is not a referral trigger for high-risk-genetics
  evaluation.

  **(6) Patient counseling** — magnitude of OCP-attributable
  risk is small in absolute terms, attenuating after stopping;
  ovarian + endometrial protection (covered by RF-REPRODUCTIVE-
  OCP-LONG-TERM) is the offsetting axis. NOT a recommendation to
  stop OCP for risk reduction in average-risk women.

  Goal: keep cadence at population guideline; ensure HPV co-test
  is happening; mainstream breast screening 40+; respond promptly
  to symptoms.

rationale_ua: >
  Стандартний трек спостереження для кумулятивної гормональної
  контрацепції тривалістю ≥10 років. Компоненти згідно з NCCN з
  раку грудної залози / раку шийки матки + USPSTF + ASCCP:

  **(1) Мамографічний скринінг згідно з USPSTF** — жінки віком
  40-74 років, раз на 2 роки. НЕ передбачається обов'язковий
  додатковий скринінг (МРТ/УЗД) лише на підставі експозиції
  оральних контрацептивів (ОК) — абсолютний приріст ризику надто
  малий, щоб виправдовувати інтенсифікацію згідно з USPSTF.
  Інтенсифікація на підставі щільності тканини грудної залози —
  окреме питання.

  **(2) Графік цервікального ко-тестування згідно з ASCCP** —
  первинне ВПЛ-тестування кожні 5 років у віці 25-65 років
  (пріоритетний варіант) або ко-тестування (цитологія + ВПЛ)
  кожні 5 років у віці 30-65 років. Застосування ОК протягом
  ≥10 років у минулому саме по собі НЕ змінює настанову, але
  супутня ВПЛ-позитивність високоонкогенних типів під час
  скринінгу змінює тактику ведення згідно з ASCCP (негайна
  кольпоскопія за позитивності на ВПЛ 16/18-го типів).

  **(3) Клінічний огляд грудної залози + консультування щодо
  самоусвідомлення стану грудної залози.** Ущільнення, зміна
  шкіри, виділення, стійкий біль → діагностична мамографія +
  прицільне УЗД.

  **(4) Обстеження за аномальної кровотечі** — кровотеча після
  статевого акту, міжменструальна кровотеча поза очікуваним
  патерном, постменопаузальна кровотеча → огляд у дзеркалах +
  цитологія шийки матки + кольпоскопія + забір ендометрія на
  дослідження згідно з ACOG.

  **(5) Супутній скринінг факторів ризику** — синдром Лінча /
  спадковий рак грудної залози та яєчників (BRCA) в сімейному
  анамнезі, попередня променева терапія органів грудної клітки,
  тютюнопаління, ожиріння — окремі виміри.

  **(6) Консультування** — величина ризику, зумовленого
  прийманням ОК, невелика в абсолютному вираженні; захисний
  ефект щодо раку яєчників і ендометрія — компенсуючий вимір. Це
  НЕ рекомендація припиняти приймання ОК заради зниження ризику.

