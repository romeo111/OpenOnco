do_not_do:
  - "Не призначати додатковий скринінг МРТ / УЗД лише на підставі експозиції оральних контрацептивів — абсолютний приріст ризику надто малий згідно з USPSTF."
  - "Не рекомендувати припинення приймання ОК у жінок середнього ризику заради зниження ризику — величина зумовленого ризику невелика, а захист щодо яєчників / ендометрія є компенсуючим фактором."
  - "Не пропускати ВПЛ-ко-тестування в когорті з експозицією ОК ≥10 років — супутня позитивність за високоонкогенними типами ВПЛ є значущим виміром."
  - "Не розцінювати постменопаузальну або аномальну кровотечу як норму — будь-який тривожний симптом потребує обстеження."
  - "Не нехтувати консультуванням щодо самоусвідомлення стану грудної залози — розпізнавання патерну критично важливе для раннього виявлення."

do_not_do_en:
  - "Do not order supplemental MRI / US screening based on OCP exposure alone — absolute risk increment too modest per USPSTF."
  - "Do not stop OCP in average-risk women for risk reduction — attributable-risk magnitude small + offsetting ovarian/endometrial protection."
  - "Do not skip HPV co-testing in the ≥10y OCP cohort — co-positivity with high-risk HPV is the meaningful axis."
  - "Do not normalize postmenopausal or abnormal bleeding — any alarm symptom requires workup."
  - "Do not omit breast self-awareness counseling — pattern recognition is critical for early detection."

