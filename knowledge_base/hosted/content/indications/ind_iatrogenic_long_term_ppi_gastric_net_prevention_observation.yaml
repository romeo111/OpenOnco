do_not_do:
  - "Не подавати цей трек як еквівалент структурованого перегляду показань — відмова від зайвого приймання препарату знижує ятрогенну експозицію."
  - "Не пропускати чітке інформування про тривожні симптоми — розпізнавання патерну критично важливе для обстеження, ініційованого симптомами."
  - "Не позбавляти пацієнта доступу до ендоскопії за появи симптомів — навіть якщо він відмовився від планового спостереження, гастроентеролог має бути доступний."
  - "Не розцінювати дисфагію / втрату ваги / мелену як 'незначні' — будь-який тривожний симптом потребує негайної оцінки."
  - "Не нехтувати моніторингом побічних ефектів ІПП (кальцій, B12, магній) — це питання окреме від обговорення ризику раку."

do_not_do_en:
  - "Do not present observation as equivalent to structured indication review — de-prescription reduces iatrogenic exposure."
  - "Do not skip explicit symptom-vigilance education — pattern recognition is critical for symptom-prompted evaluation."
  - "Do not deny the patient symptom-prompted endoscopy access — even if routine surveillance is declined, GI must be available."
  - "Do not normalize dysphagia / weight loss / melena as 'minor' — any alarm symptom requires immediate evaluation."
  - "Do not ignore PPI side-effect monitoring (Ca, B12, Mg) — independent from cancer-risk discussion."

