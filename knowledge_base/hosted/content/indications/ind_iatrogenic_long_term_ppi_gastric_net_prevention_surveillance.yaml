rationale: >
  Standard-track surveillance for chronic PPI exposure ≥10y. Components
  per NCCN Gastric / NET guidelines + ACG de-prescription consensus:

  **(1) Indication review and de-prescription where appropriate** —
  THE primary intervention. PPI continuation justified for: Barrett
  oesophagus, severe erosive GERD (LA grade C/D), Zollinger-Ellison
  syndrome, dual antiplatelet therapy with prior GI bleeding,
  ongoing chronic NSAID with high GI-bleed risk. NOT justified
  for: vague dyspepsia without erosive disease, NSAID-prophylaxis
  after NSAID stopped, post-hospital "carry-over," eosinophilic
  oesophagitis without symptoms. Step-down trial (alternate-day
  dosing → H2 blocker → as-needed) for the de-prescribable cohort.

  **(2) Fasting gastrin + chromogranin A** in those with ongoing
  strong PPI indication. Hold PPI 14 days before draw (clinically
  difficult — prior abstinence often impractical); interpret elevated
  values in context of acid-suppression continuation. Markedly
  elevated gastrin or rising chromogranin A → endoscopic evaluation.

  **(3) EGD with body / fundus biopsies** when (a) elevated
  gastrin/CgA, (b) new dyspepsia / anemia / weight loss / GI
  bleeding, (c) prior atrophic gastritis on biopsy, or (d) ≥15y
  continuous PPI without prior EGD. Look for ECL hyperplasia,
  atrophic gastritis, Type-1 gastric NET, intestinal metaplasia.

  **(4) Surveillance interval** for documented atrophic gastritis /
  ECL hyperplasia on biopsy: EGD q3-5y per ACG / European
  guidelines; q1-2y if intestinal metaplasia + extensive corpus
  involvement (OLGIM 3-4). Type-1 gastric NET <1 cm with
  hypergastrinemia: endoscopic resection or surveillance q6-12mo;
  >1 cm or symptomatic: endoscopic resection.

  **(5) H. pylori testing** at first EGD if not previously
  documented — eradication reduces atrophic-gastritis progression
  and reduces gastric-cancer risk in seropositive cohort.

  **(6) Calcium / vitamin B12 / magnesium screening** —
  long-term PPI associated with reduced absorption; check at
  10y mark and supplement deficiencies.

  Goal: most patients return to no-PPI or as-needed PPI at year
  10 review (de-prescription). For the minority with sustained
  strong indication, structured monitoring catches ECL hyperplasia
  and Type-1 gastric NET while still endoscopically curable.

rationale_ua: >
  Стандартний трек спостереження для пацієнтів із хронічним прийомом
  ІПП ≥10 років. Компоненти згідно з настановами NCCN Gastric / NET
  та консенсусом ACG щодо відміни терапії (de-prescription):

  **(1) Перегляд показань і поступова відміна терапії** — ПЕРВИННЕ
  втручання, що дає найбільший ефект. Продовження ІПП виправдане при:
  стравоході Барретта, тяжкій ерозивній ГЕРХ (LA grade C/D), синдромі
  Золлінгера-Еллісона, подвійній антиагрегантній терапії з попередньою
  ШКТ-кровотечею, тривалому прийомі НПЗП з високим ризиком ШКТ-
  кровотечі. НЕ виправдане при: неспецифічній диспепсії без ерозивного
  ураження, "профілактичному" прийомі НПЗП після відміни самого НПЗП,
  "перенесенні" призначення після виписки зі стаціонару без перегляду.
  Для когорти, придатної до відміни, — пробне поетапне зниження дози
  (через день → блокатор H2-рецепторів → за потреби).

  **(2) Гастрин натще + хромогранін A** у пацієнтів зі стійким
  переконливим показанням до продовження ІПП. Скасувати ІПП за 14 днів
  до забору (клінічно складно здійснити; на практиці часто
  неможливо); інтерпретувати значення з урахуванням продовження
  кислотопригнічення. Виражено підвищений гастрин або зростаючий
  хромогранін A → ендоскопічна оцінка.

  **(3) ЕГДС із біопсією тіла й дна шлунка** при (а) підвищенні
  гастрину/хромограніну A, (б) новій диспепсії / анемії / втраті
  ваги / ШКТ-кровотечі, (в) попередньому атрофічному гастриті за
  біопсією, або (г) ≥15 років безперервного прийому ІПП без
  попередньої ЕГДС. Шукати гіперплазію ECL-клітин, атрофічний
  гастрит, нейроендокринну пухлину шлунка (NET) 1 типу, кишкову
  метаплазію.

  **(4) Інтервал спостереження** для документованого атрофічного
  гастриту / гіперплазії ECL-клітин: ЕГДС кожні 3-5 років згідно з
  ACG / європейськими настановами; кожні 1-2 роки при кишковій
  метаплазії з поширеним ураженням тіла шлунка (OLGIM 3-4).
  Нейроендокринна пухлина шлунка 1 типу <1 см з гіпергастринемією:
  ендоскопічна резекція або спостереження кожні 6-12 місяців.

  **(5) Тестування на H. pylori** при першій ЕГДС, якщо раніше не
  проводилося — ерадикація знижує прогресію атрофічного гастриту та
  ризик раку шлунка в серопозитивній когорті.

  **(6) Скринінг кальцію / вітаміну B12 / магнію** — тривалий прийом
  ІПП пов'язаний зі зниженим всмоктуванням; перевірити на 10-му році
  та компенсувати дефіцити.

  Мета: більшість пацієнтів на 10-му році перегляду повертаються до
  відсутності ІПП або прийому за потреби (відміна терапії). Для
  меншості зі стійким переконливим показанням структуроване
  спостереження виявляє гіперплазію ECL-клітин і нейроендокринну
  пухлину шлунка 1 типу на стадії, коли вони ще ендоскопічно виліковні.

