do_not_do:
  - "Не продовжувати ІПП без активного перегляду показань — найбільший ефект дає відміна терапії, а не спостереження."
  - "Не призначати рутинний скринінг гастрину/хромограніну A усім, хто приймає ІПП, — лише пацієнтам зі стійким переконливим показанням для тривалого прийому."
  - "Не інтерпретувати помірно підвищений гастрин на тлі прийому ІПП як патологічний — частково очікуваний ефект кислотопригнічення."
  - "Не пропускати тестування на H. pylori при першій ЕГДС — це ко-фактор прогресії атрофічного гастриту."
  - "Не продовжувати прийом ІПП невизначено довго після гострої події (стрес-виразка, після НПЗП) — переоцінювати показання при кожному візиті спостереження."

do_not_do_en:
  - "Do not continue PPI without active indication review — de-prescription is the highest-yield intervention, not surveillance."
  - "Do not order routine gastrin/CgA screening in all PPI users — only in those with ongoing strong indication."
  - "Do not interpret moderately elevated gastrin during PPI as pathologic — partially expected from acid suppression."
  - "Do not skip H. pylori testing at first EGD — co-factor for atrophic gastritis progression."
  - "Do not continue PPI indefinitely after an acute event (stress ulcer, post-NSAID) — re-evaluate at every follow-up."

