desired_tests: []

rationale: >
  Aggressive-track (reduced surveillance) alternative for MTX-treated
  patients where dose tapering isn't feasible and routine monitoring
  is limited.

  Components:
    - CBC annually retained.
    - Symptom-driven lymphoma workup retained (high-yield in MTX
      cohort).
    - Annual skin examination retained.
    - Re-offer DMARD review at every visit.
    - MTX-withdrawal observation principle retained for MTX-LPD.

rationale_ua: >
  Aggressive-трек (reduced surveillance) альтернатива для MTX-treated
  пацієнтів де dose tapering неможливе та routine monitoring обмежено.

  Компоненти:
    - CBC annually retained.
    - Symptom-driven lymphoma workup retained.
    - Annual skin examination retained.
    - Re-offer DMARD review при кожному visit.
    - MTX-withdrawal observation principle retained для MTX-LPD.

