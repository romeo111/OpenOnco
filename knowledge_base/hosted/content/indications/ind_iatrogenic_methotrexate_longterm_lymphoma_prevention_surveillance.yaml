sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Methotrexate-associated lymphoproliferative disorders (MTX-LPD)
      have a distinct natural history with a 30-60% regression rate on
      MTX withdrawal alone. Standard chemotherapy (R-CHOP) is reserved
      for persistent or histologically aggressive disease after a
      drug-holiday observation period."

do_not_do:
  - "Не призначати empiric chemotherapy для MTX-LPD до 8-12 тиж MTX withdrawal observation — ~30-60% спонтанна регресія."
  - "Не призначати live-attenuated vaccines пацієнтам на MTX — immunosuppression-related risk."
  - "Не пропускати annual disease-activity re-assessment — MTX continuation has cumulative risk."

do_not_do_en:
  - "Do not start empiric chemotherapy for MTX-LPD before 8-12 weeks of MTX-withdrawal observation — ~30-60% spontaneous regression."
  - "Do not prescribe live-attenuated vaccines in patients on MTX — immunosuppression-related risk."
  - "Do not skip annual disease-activity re-assessment — MTX continuation has cumulative risk."

known_controversies:
  - topic: "Length of MTX-withdrawal observation window before chemotherapy"
    positions:
      - position: "8-12 weeks default"
        rationale: "Hoshida + Tokuhira series show regression typically within 12 weeks; longer waits delay treatment of true progressive disease."
      - position: "Shorter window in aggressive histology"
        rationale: "Double-hit / Burkitt-like MTX-LPD don't regress; early R-CHOP improves outcome."
    our_default: "8-12 weeks for typical histology; <4 weeks observation for aggressive histology + early systemic therapy."
    rationale: "Histology-stratified."

