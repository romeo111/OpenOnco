rationale: >
  Standard-track prevention pathway for long-term low-dose methotrexate
  exposure for autoimmune disease.

  Components:
    - **Annual review of MTX necessity** — disease activity score in
      RA (DAS28, CDAI); PASI in psoriasis; HBI in IBD. If remission
      stable on alternative DMARD (e.g., adalimumab, ustekinumab) +
      MTX tapering possible, prefer non-MTX path.
    - **CBC every 6-12 months** — baseline + monitor for cytopenia
      (drug toxicity) + early lymphoma signal.
    - **Patient education** — sentinel symptoms requiring prompt
      evaluation:
      - Unexplained persistent lymphadenopathy.
      - Persistent B-symptoms (fever, night sweats, ≥10% weight loss).
      - Organomegaly (hepatomegaly, splenomegaly).
      - New mass on examination or imaging.
      - Persistent skin lesion that doesn't heal (skin MTX-LPD or
        skin SCC).
    - **MTX-LPD evaluation workflow:**
      - Suspected MTX-LPD (clinical + imaging) → biopsy.
      - **Hold MTX + observe 8-12 weeks first** before initiating
        chemotherapy unless histologically aggressive (DLBCL
        non-GC, double-hit, Burkitt-like) — ~30-60% spontaneous
        regression.
      - Document EBV co-positivity (~30-50% of MTX-LPD cases) — has
        prognostic implications.
      - Persistent disease at 8-12 weeks → DLBCL R-CHOP-style
        treatment.
    - **Skin examination annually** — modest skin cancer signal
      (SCC, melanoma) in long-term MTX cohort.
    - **Sun protection counseling.**
    - **Vaccination:** routine adult schedule + influenza + COVID +
      pneumococcal (immunocompromised dosing); avoid live-attenuated
      vaccines while on MTX.

  In Ukraine, MTX is the cornerstone DMARD for RA + psoriasis;
  rheumatology + dermatology follow-up widely available. Lymphoma
  workup + R-CHOP at major oncology centers; access NSZU-covered.

