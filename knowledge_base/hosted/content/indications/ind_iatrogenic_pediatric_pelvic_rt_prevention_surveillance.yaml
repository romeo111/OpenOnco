do_not_do:
  - "Не застосовувати загальнопопуляційний поріг скринінгу колоректального раку USPSTF (45-50 років) у виживших після тазового опромінення в дитинстві — починати з 45 років АБО через 10 років після опромінення (залежно від того, що настане раніше)."
  - "Не пропускати цитологічне дослідження сечі при щорічному скринінгу — сам лише загальний аналіз сечі має нижчу чутливість щодо уротеліальної карциноми in situ."
  - "Не нормалізувати мікроскопічну гематурію як 'випадкову знахідку' у виживших після тазового опромінення в дитинстві — вона потребує цистоскопії та КТ-урографії."
  - "Не пропускати щорічний гінекологічний огляд — вторинні пухлини матки, яєчників і шийки матки можуть проявлятися аномальною кровотечею або утвором у ділянці таза."
  - "Не передавати спостереження за такими пацієнтами недосвідченій клініці — паспорт COG-LTFU документує поле й дозу попереднього опромінення, які визначають план спостереження."

do_not_do_en:
  - "Do not use the general-population USPSTF CRC-screening threshold (45-50) in pediatric pelvic-RT survivors — initiate at 45 OR 10y post-RT (whichever is earlier)."
  - "Do not skip urine cytology in annual screening — urinalysis alone has lower sensitivity for urothelial carcinoma in situ."
  - "Do not normalize microscopic hematuria as 'incidental' in pediatric pelvic-RT survivors — warrants cystoscopy + CT urography."
  - "Do not skip the annual pelvic exam — uterine + ovarian + cervical secondaries may present with abnormal bleeding or pelvic mass."
  - "Do not delegate pediatric-survivor surveillance to non-experienced clinics — the COG-LTFU passport documents prior RT field + dose, which drive the surveillance plan."

