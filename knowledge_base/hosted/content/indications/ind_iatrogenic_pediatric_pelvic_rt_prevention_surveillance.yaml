rationale: >
  Standard-track late-effects surveillance for survivors ≥5y post-
  completion of pediatric pelvic radiotherapy. Components per Children's
  Oncology Group Long-Term Follow-Up Guidelines (COG-LTFU) + Childhood
  Cancer Survivor Study (CCSS) + ACS guideline-augmentation + NCCN
  Bladder Cancer + NCCN Colon/Rectal Cancer:

  **(1) Annual urinalysis + urine cytology** —
  - Both modalities together (each has limited individual sensitivity
    for urothelial carcinoma; complementary detection)
  - Annual cadence lifelong (vs. q1-3y in adult-exposure cohorts)
  - Any unexplained microscopic or gross hematuria → cystoscopy +
    imaging (CT urography preferred)

  **(2) Earlier-onset colorectal cancer screening** —
  - Initiate at age 45 OR 10 years post-RT (whichever is earlier)
  - Colonoscopy as primary screening modality (preferred over FIT in
    this cohort due to elevated lifetime risk)
  - q5y if normal initial, q3-5y if polyps detected
  - Lower threshold for symptomatic evaluation (changed bowel habit,
    rectal bleeding, persistent abdominal pain → colonoscopy)

  **(3) Pelvic-field secondary cancer awareness** —
  - Uterine: annual pelvic exam ± endometrial biopsy if abnormal
    bleeding; consideration of TVUS for those with menstrual changes
  - Ovarian (if ovaries in field — often gonadal-sparing technique used
    but verify): pelvic exam + symptom vigilance
  - Cervical: annual Pap if cervix in field
  - Bone sarcoma in irradiated pelvic bone: persistent pelvic pain or
    palpable mass → urgent imaging (no scheduled bone imaging — symptom-
    driven only)

  **(4) Non-cancer late effects** (co-managed, not primary cancer
  surveillance scope) — renal vascular hypertension, hypogonadism if
  gonads in field, bowel dysfunction (radiation enteritis sequelae),
  bladder fibrosis / capacity reduction, infertility (counsel re:
  reproductive options).

  **(5) Survivorship clinic integration** — pediatric-cancer-survivor
  follow-up clinics provide best-coordinated care; community PCP
  often requires COG-LTFU passport for accurate surveillance schedule.

rationale_ua: >
  Стандартний трек спостереження за віддаленими наслідками для
  виживачів через ≥5 років після завершення тазової променевої
  терапії в дитячому віці. Компоненти згідно з настановами Children's
  Oncology Group Long-Term Follow-Up Guidelines (COG-LTFU),
  дослідженням Childhood Cancer Survivor Study (CCSS), доповненнями
  до настанов ACS та настановами NCCN Bladder Cancer і NCCN
  Colon/Rectal Cancer:

  **(1) Щорічний загальний аналіз сечі + цитологічне дослідження
  сечі** —
  - Обидва методи разом (кожен окремо має обмежену чутливість щодо
    уротеліальної карциноми; методи взаємодоповнюють один одного)
  - Щорічна періодичність довічно (проти кожні 1-3 роки в когортах з
    опроміненням у дорослому віці)
  - Будь-яка незрозуміла мікроскопічна або макроскопічна гематурія →
    цистоскопія + візуалізація (переважно КТ-урографія)

  **(2) Раніший початок скринінгу колоректального раку** —
  - Почати у 45 років АБО через 10 років після опромінення (залежно
    від того, що настане раніше)
  - Колоноскопія як основний метод скринінгу (переважніша за тест на
    приховану кров у калі (FIT) у цій когорті через підвищений
    довічний ризик)
  - Кожні 5 років при нормальному первинному результаті, кожні 3-5
    років при виявлених поліпах
  - Нижчий поріг для обстеження за симптомами (зміна характеру
    випорожнень, ректальна кровотеча, стійкий біль у животі →
    колоноскопія)

  **(3) Настороженість щодо вторинних пухлин у ділянці таза** —
  - Матка: щорічний гінекологічний огляд ± біопсія ендометрія при
    аномальній кровотечі; розгляд ТВУЗД у пацієнток зі змінами
    менструального циклу
  - Яєчники (якщо яєчники входили до поля опромінення — часто
    застосовується техніка зі збереженням гонад, але це слід
    перевірити): гінекологічний огляд + пильність щодо симптомів
  - Шийка матки: щорічний Пап-тест, якщо шийка матки входила до поля
    опромінення
  - Кісткова саркома в опроміненій кістці таза: стійкий тазовий біль
    або пальпований утвір → термінова візуалізація (планової
    візуалізації кісток немає — лише за симптомами)

  **(4) Непухлинні віддалені наслідки** (курується спільно з іншими
  фахівцями, не входить до основного обсягу онкологічного
  спостереження) — ниркова судинна гіпертензія, гіпогонадизм якщо
  гонади входили до поля опромінення, дисфункція кишечника (наслідки
  променевого ентериту), фіброз сечового міхура / зменшення його
  ємності, безпліддя (консультування щодо репродуктивних
  можливостей).

  **(5) Інтеграція з клінікою супроводу виживших** — клініки
  подальшого спостереження за дітьми, які пережили рак, забезпечують
  найкраще скоординовану допомогу; сімейному лікарю первинної ланки
  часто потрібен паспорт COG-LTFU для точного графіка спостереження.

