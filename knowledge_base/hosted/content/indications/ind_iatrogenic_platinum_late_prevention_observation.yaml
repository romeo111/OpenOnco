do_not_do:
  - "Не подавати спостереження лише за симптомами як еквівалент структурованого спостереження — пізно виявлені MACE, ХХН і t-AML мають суттєво гірші наслідки."
  - "Не пропускати консультування щодо корекції серцево-судинних факторів ризику — навіть на цьому треку це найефективніше втручання серед віддалених наслідків."
  - "Не нормалізувати прогресуючу втомлюваність як 'звичайне старіння' у виживших після платиновмісної терапії — це може бути прихована ХХН або t-MDS."
  - "Не вважати замісну терапію магнієм 'необов'язковою' у симптомних виживших з документованою втратою магнію на тлі цисплатину — замісна терапія часто потрібна довічно."

do_not_do_en:
  - "Do not present observation as equivalent to structured surveillance — late-presentation MACE + CKD + t-AML have substantially worse outcomes."
  - "Do not skip CV risk modification counseling — even on the observation track this is the highest-yield late-effect intervention."
  - "Do not normalize progressive fatigue as 'normal aging' in platinum survivors — may be silent CKD or t-MDS."
  - "Do not treat magnesium replacement as 'optional' in symptomatic survivors with documented cisplatin Mg wasting — supplementation is often required lifelong."

