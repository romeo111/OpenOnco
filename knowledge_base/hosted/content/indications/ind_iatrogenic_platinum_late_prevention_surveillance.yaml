do_not_do:
  - "Не застосовувати загальнопопуляційні порогові значення АТ / ліпідів / ризику ASCVD у виживших після платиновмісної терапії — у цій когорті доцільні нижчі порогові значення з огляду на підвищений серцево-судинний ризик."
  - "Не пропускати вимірювання магнію в щорічній розширеній біохімії (CMP) — індукована цисплатином ниркова втрата магнію зберігається довічно і може бути безсимптомною."
  - "Не нормалізувати прогресуюче зниження ШКФ як 'вікову норму' у виживших після платиновмісної терапії — направляти до нефролога при зниженні >5 мл/хв/1,73м² на рік."
  - "Не пропускати консультування щодо корекції серцево-судинних факторів ризику — це найефективніше втручання серед віддалених наслідків: відмова від куріння, статини, контроль АТ."
  - "Не вважати ототоксичність / нейропатію / синдром Рейно 'просто побічними ефектами' — вони суттєво впливають на якість життя і потребують постійного ведення."

do_not_do_en:
  - "Do not use general-population BP / lipid / ASCVD-risk thresholds in platinum survivors — lower thresholds are appropriate given the elevated CV risk."
  - "Do not skip magnesium measurement in the annual CMP — cisplatin-induced renal Mg wasting persists lifelong and can be silent."
  - "Do not normalize progressive GFR decline as 'aging' in platinum survivors — nephrology referral when decline is >5 mL/min/1.73m² per year."
  - "Do not skip CV risk modification counseling — it is the highest-yield late-effect intervention; smoking cessation, statins, BP control."
  - "Do not treat ototoxicity / neuropathy / Raynaud as 'just side effects' — they significantly impact quality of life and warrant ongoing management."

