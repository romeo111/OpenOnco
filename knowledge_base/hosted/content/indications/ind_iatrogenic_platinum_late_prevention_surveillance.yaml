rationale: >
  Standard-track late-effects surveillance for cancer survivors with
  prior cumulative platinum exposure ≥400 mg/m² (cisplatin or AUC-
  equivalent carboplatin). Components per NCCN Testicular Cancer
  Survivorship + NCCN AML Survivorship + ASCO Cardio-Oncology
  Survivorship + ESC 2022 Cardio-Oncology + COG-LTFU:

  **(1) Annual BP measurement** —
  - Lower treatment threshold (consider initiating antihypertensive
    at 130/80 vs. 140/90 in this cohort given elevated CV risk)
  - Out-of-office BP monitoring (home cuff) for confirmation

  **(2) Annual lipid panel** —
  - Total cholesterol, LDL, HDL, triglycerides
  - Lower statin initiation threshold appropriate (ASCVD 10y risk
    ≥7.5% rather than ≥10% in this cohort)
  - Aggressive LDL target <100 mg/dL (vs. <130 general population)

  **(3) Annual creatinine + CMP** —
  - Track GFR trend (eGFR decline >5 mL/min/1.73m² per year warrants
    nephrology referral)
  - Magnesium specifically — cisplatin-induced renal Mg wasting
    persists lifelong; supplementation often required
  - ACE-inhibitor / ARB if proteinuria + elevated risk factors
    (renoprotective + cardioprotective)

  **(4) Annual CBC with differential** —
  - Surveillance for t-MDS / t-AML — peak risk 5-10y post-exposure
  - Any new unexplained cytopenia → marrow evaluation per
    RF-IATROGENIC-ALKYLATOR-TAML-PREVENTION pathway

  **(5) Cardiovascular risk modification counseling** —
  - HIGHEST-yield late-effect intervention in this cohort
  - Smoking cessation (compounds CV + renal + lung-cancer risk)
  - Physical activity per HHS guidelines (cardioprotective + cancer-
    survivor benefit)
  - DM screening + management (lower thresholds appropriate)
  - Mediterranean / DASH dietary pattern counseling
  - Alcohol moderation

  **(6) Raynaud syndrome surveillance** —
  - Often persistent late effect (cisplatin / BEP); patient education
    on cold-protection + smoking-cessation impact

  **(7) Ototoxicity + peripheral neuropathy surveillance** (co-managed
  outside cancer surveillance scope) — audiometry q3-5y if symptoms;
  neurology referral if progressive neuropathy.

  **(8) Co-fired surveillance dimensions** — platinum often co-
  administered with etoposide (BEP) or alkylators; RF-IATROGENIC-
  TOPO2-TAML-PREVENTION + RF-IATROGENIC-ALKYLATOR-TAML-PREVENTION may
  fire in parallel. Engine builds combined PreventionPlan.

rationale_ua: >
  Стандартний трек спостереження за віддаленими наслідками для
  виживших після раку з попередньою кумулятивною дозою
  платиновмісних препаратів ≥400 мг/м² (цисплатин або еквівалент за
  AUC для карбоплатину). Компоненти згідно з настановами NCCN
  Testicular Cancer Survivorship, NCCN AML Survivorship, ASCO
  Cardio-Oncology Survivorship, ESC 2022 Cardio-Oncology та
  COG-LTFU:

  **(1) Щорічне вимірювання АТ** — нижчий поріг початку лікування
  (розглянути початок антигіпертензивної терапії вже при 130/80, а
  не при 140/90, з огляду на підвищений серцево-судинний ризик у цій
  когорті); позаофісний контроль АТ домашнім тонометром для
  підтвердження.

  **(2) Щорічний ліпідний профіль** — обґрунтований нижчий поріг
  початку статинотерапії (10-річний ризик ASCVD ≥7,5%, а не ≥10%, у
  цій когорті); агресивна ціль ЛПНЩ <100 мг/дл (проти <130 мг/дл у
  загальній популяції).

  **(3) Щорічний креатинін + розширена біохімія (CMP)** —
  - Відстежувати динаміку ШКФ; зниження розрахункової ШКФ >5
    мл/хв/1,73м² на рік → направлення до нефролога
  - Окремо магній — індукована цисплатином ниркова втрата магнію
    зберігається довічно; часто потрібна замісна терапія
  - Інгібітор АПФ / БРА при протеїнурії

  **(4) Щорічний ЗАК з лейкоцитарною формулою** — спостереження щодо
  t-MDS / t-AML; будь-яка нова незрозуміла цитопенія → обстеження
  кісткового мозку.

  **(5) Консультування щодо корекції серцево-судинних факторів
  ризику** — НАЙЕФЕКТИВНІШЕ втручання серед віддалених наслідків у
  цій когорті: відмова від куріння, фізична активність, скринінг на
  цукровий діабет, середземноморська/DASH дієта, помірність у
  вживанні алкоголю.

  **(6) Спостереження щодо синдрому Рейно** — навчання пацієнта щодо
  захисту від холоду та впливу відмови від куріння.

  **(7) Спостереження щодо ототоксичності та периферичної
  нейропатії** (курується спільно, поза основним обсягом
  онкологічного спостереження) — аудіометрія кожні 3-5 років за
  наявності симптомів; направлення до невролога за прогресуючої
  нейропатії.

  **(8) Паралельні напрями спостереження** — платиновмісні препарати
  часто застосовуються разом з етопозидом (BEP) або алкілюючими
  агентами; RF-IATROGENIC-TOPO2-TAML-PREVENTION та RF-IATROGENIC-
  ALKYLATOR-TAML-PREVENTION можуть спрацьовувати одночасно. Рушій
  формує об'єднаний PreventionPlan.

