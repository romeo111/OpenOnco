rationale: >
  Standard-track surveillance for prior therapeutic radiation. Components per
  COG-LTFU (Children's Oncology Group Long-Term Follow-Up) guidelines:

  **Mantle / chest RT in adolescence/young adulthood (women):**
  - Annual breast MRI from age 25 OR 8y post-RT (whichever later)
  - Alternating with mammography from age 30
  - Clinical breast exam q6mo

  **Pediatric Hodgkin / Wilms / sarcoma RT survivors:**
  - Lung cancer screening with LDCT — eligibility per modified USPSTF criteria
  - Thyroid US q3-5y if cervical/mantle field
  - Skin exam q1y if extensive field

  **Pelvic RT survivors:**
  - Colorectal cancer screening at younger age (typically 10y earlier than
    general-population USPSTF threshold)
  - Bladder cancer surveillance (urinalysis + cytology q1-3y)

  **All RT survivors:**
  - CBC q1y (secondary leukemia surveillance)
  - Awareness of radiation-induced sarcoma — any soft-tissue mass or bone
    pain in irradiated field warrants immediate imaging.

  Cardiovascular surveillance (echo + ECG) and endocrine surveillance (thyroid
  function) are separate concerns but routinely co-managed in this cohort.

rationale_ua: >
  Стандартний трек спостереження після попередньої лікувальної
  променевої терапії. Компоненти згідно з настановами COG-LTFU
  (Children's Oncology Group Long-Term Follow-Up):

  **Опромінення мантієподібного поля / грудної клітки в
  підлітковому або молодому дорослому віці (жінки):**
  - Щорічна МРТ молочних залоз з 25 років АБО через 8 років після
    опромінення (залежно від того, що настане пізніше)
  - Чергування з мамографією з 30 років
  - Клінічний огляд молочних залоз кожні 6 місяців

  **Виживші після опромінення з приводу лімфоми Ходжкіна / пухлини
  Вілмса / саркоми в дитячому віці:**
  - Скринінг раку легені низькодозовою КТ — відбір за
    модифікованими критеріями USPSTF
  - УЗД щитоподібної залози кожні 3-5 років, якщо в полі
    опромінення була шия / мантієподібна ділянка
  - Огляд шкіри щороку при великому полі опромінення

  **Виживші після тазового опромінення:**
  - Скринінг колоректального раку в молодшому віці (зазвичай на 10
    років раніше загальнопопуляційного порогу USPSTF)
  - Спостереження щодо раку сечового міхура (загальний аналіз сечі
    + цитологія кожні 1-3 роки)

  **Усі виживші після променевої терапії:**
  - ЗАК щороку (спостереження щодо вторинної лейкемії)
  - Настороженість щодо променево-індукованої саркоми — будь-який
    утвір м'яких тканин або біль у кістці в опроміненій ділянці
    потребує негайної візуалізації.

  Серцево-судинне спостереження (ехокардіографія + ЕКГ) та
  ендокринне спостереження (функція щитоподібної залози) є окремими
  питаннями, але зазвичай курируються спільно в цій когорті.

