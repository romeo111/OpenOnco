do_not_do:
  - "Не пропускати МРТ молочних залоз у жінок після мантієподібного опромінення — ризик порівнянний з носійками BRCA1."
  - "Не передавати спостереження за такими пацієнтами недосвідченій клініці — настанови COG-LTFU складні."
  - "Не використовувати мамографію як основний метод скринінгу молочної залози у жінок після мантієподібного опромінення віком до 30 років — тканина молочної залози чутлива до опромінення."

do_not_do_en:
  - "Do not skip breast MRI in post-mantle-RT women — risk comparable to BRCA1 carriers."
  - "Do not delegate pediatric-cancer-survivor surveillance to non-experienced clinics — COG-LTFU guidelines are complex."
  - "Do not use mammography as primary breast screening in post-mantle-RT women <30 — breast tissue is radiation-sensitive."

