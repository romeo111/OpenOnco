rationale: >
  Alternative-track companion to IND-IATROGENIC-TAMOXIFEN-ENDOMETRIAL-
  PREVENTION-SURVEILLANCE. Patient declines structured annual
  gynecology follow-up (surveillance fatigue, geographic access,
  preference) — receives explicit symptom-vigilance education
  (postmenopausal bleeding, abnormal pre-menopausal bleeding, vaginal
  discharge, pelvic pain → immediate gynecology consultation, regardless
  of how minor the symptom appears) + medication review (HRT
  contraindicated). Per CHARTER §11 patient-autonomy framing — declining
  routine GYN visits is legitimate but framed as suboptimal vs. annual-
  exam comparator.

rationale_ua: >
  Альтернативний трек до IND-IATROGENIC-TAMOXIFEN-ENDOMETRIAL-
  PREVENTION-SURVEILLANCE. Пацієнтка відмовляється від структурованого
  щорічного гінекологічного спостереження — натомість отримує чітке
  навчання щодо тривожних симптомів (постменопаузальна кровотеча,
  аномальна кровотеча в пременопаузі, вагінальні виділення, тазовий
  біль → негайна консультація гінеколога, незалежно від того, наскільки
  незначним видається симптом) та перегляд медикаментозної терапії
  (ЗГТ протипоказана). Відповідно до CHARTER §11 (принцип автономії
  пацієнтки) — відмова від планових гінекологічних оглядів є законним
  вибором, але подається як менш оптимальний варіант порівняно зі
  щорічним оглядом.

