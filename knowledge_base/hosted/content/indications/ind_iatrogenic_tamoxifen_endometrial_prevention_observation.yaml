do_not_do:
  - "Не подавати спостереження лише за симптомами як еквівалент структурованого щорічного гінекологічного спостереження — виявлення на ранній стадії достовірно дає кращі наслідки."
  - "Не пропускати чітке навчання щодо тривожних симптомів — навчання пацієнтки критично важливе для своєчасного звернення за симптомами."
  - "Не призначати ЗГТ — протипоказана жінкам, які приймають тамоксифен; використовувати негормональне ведення вазомоторних симптомів."
  - "Не позбавляти пацієнтку доступу до обстеження за симптомами — навіть якщо планове спостереження відхилено, гінекологічна консультація має бути доступна за будь-якого симптому."
  - "Не нормалізувати постменопаузальну кровотечу як 'незначну' — будь-яка кровотеча потребує обстеження."

do_not_do_en:
  - "Do not present observation as equivalent to structured annual GYN follow-up — earlier-stage detection produces reliably better outcomes."
  - "Do not skip explicit symptom-vigilance education — patient education is critical for symptom-prompted evaluation."
  - "Do not prescribe HRT — contraindicated in tamoxifen-exposed women; use non-hormonal vasomotor management."
  - "Do not deny the patient symptom-prompted workup access — even if routine surveillance is declined, gynecology must be available for any symptom."
  - "Do not normalize postmenopausal bleeding as 'minor' — any bleeding requires evaluation."

