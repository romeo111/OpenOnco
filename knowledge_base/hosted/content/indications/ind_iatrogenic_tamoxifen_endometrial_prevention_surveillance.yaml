rationale: >
  Standard-track surveillance for tamoxifen exposure ≥5y in women with
  intact uterus. Components per ACOG Committee Opinion + NCCN Breast
  Survivorship + NCCN Uterine:

  **(1) Patient counseling about symptoms requiring evaluation** —
  ANY of the following → immediate gynecology referral:
  - Postmenopausal bleeding (most-sensitive symptom; ~90% endometrial
    cancers in tamoxifen-exposed cohort present with bleeding)
  - Abnormal pre-menopausal bleeding (menorrhagia, intermenstrual
    bleeding, post-coital bleeding)
  - Vaginal discharge / spotting
  - Pelvic pain or pressure

  **(2) Prompt diagnostic workup of any reported symptom** —
  Transvaginal ultrasound (TVUS) + endometrial biopsy (pipelle or
  hysteroscopy with directed biopsy). Do NOT defer biopsy based on
  TVUS endometrial thickness alone in tamoxifen-exposed women —
  tamoxifen-related changes (subepithelial cysts, thickening) can mask
  or mimic pathology; tissue diagnosis required.

  **(3) Annual gynecologic exam** with pelvic exam + symptom inquiry.
  Routine asymptomatic TVUS screening NOT recommended (ACOG, NCCN,
  ASCO) — high false-positive rate, unnecessary biopsies, no proven
  survival benefit. Annual exam suffices.

  **(4) Tamoxifen duration optimization** — Standard adjuvant
  endocrine therapy is 5y; extended to 10y in selected high-risk
  ER+ breast cancer per ATLAS/aTTom trials. Risk-benefit re-assessment
  at year 5 vs. continued endometrial risk + thromboembolic risk.
  Aromatase inhibitor (post-menopausal) is alternative without
  endometrial risk if switch appropriate.

  **(5) Concurrent risk-factor screening** — Obesity, hypertension,
  diabetes, Lynch syndrome (independent endometrial cancer risks)
  compound tamoxifen-related risk; address per separate pathways.

  **(6) Hormone replacement therapy contraindicated** in this
  population — defer non-hormonal vasomotor + GU-symptom management.

  Outcome: women on tamoxifen who report bleeding promptly + receive
  prompt workup have endometrial cancer detected at curable stage in
  vast majority of cases. Goal of surveillance pathway is NOT screening
  asymptomatic women — it is rapid response to any bleeding/symptom.

rationale_ua: >
  Стандартний трек спостереження для жінок зі збереженою маткою, які
  приймають тамоксифен ≥5 років. Компоненти згідно з ACOG Committee
  Opinion, NCCN Breast Survivorship та NCCN Uterine:

  **(1) Консультування пацієнтки щодо симптомів, які потребують
  обстеження** — БУДЬ-ЯКИЙ з наведених нижче симптомів → негайне
  направлення до гінеколога:
  - Постменопаузальна кровотеча (найчутливіший симптом; ~90%
    ендометріальних карцином у когорті, яка приймає тамоксифен,
    проявляються кровотечею)
  - Аномальна кровотеча в пременопаузі (менорагія, міжменструальна
    кровотеча, посткоїтальна кровотеча)
  - Вагінальні виділення / кров'янисті виділення поза менструацією
  - Тазовий біль або відчуття тиску

  **(2) Негайне діагностичне обстеження будь-якого заявленого
  симптому** — трансвагінальне УЗД (ТВУЗД) + біопсія ендометрія
  (пайпель-біопсія або гістероскопія з прицільною біопсією). НЕ
  відкладати біопсію лише на підставі товщини ендометрія за даними
  ТВУЗД у жінок, які приймають тамоксифен, — пов'язані з
  тамоксифеном зміни (субепітеліальні кісти, потовщення) можуть
  маскувати або імітувати патологію; необхідний гістологічний
  діагноз.

  **(3) Щорічний гінекологічний огляд** з оглядом органів малого
  таза та опитуванням щодо симптомів. Рутинний скринінг безсимптомних
  жінок за допомогою ТВУЗД НЕ рекомендований (ACOG, NCCN, ASCO) —
  високий рівень хибнопозитивних результатів, зайві біопсії,
  відсутність доведеної користі для виживаності. Щорічного огляду
  достатньо.

  **(4) Оптимізація тривалості прийому тамоксифену** — стандартна
  ад'ювантна ендокринна терапія триває 5 років; подовжується до 10
  років у окремих випадках ER-позитивного раку молочної залози
  високого ризику згідно з дослідженнями ATLAS/aTTom. На 5-му році
  проводиться повторна оцінка співвідношення користі й ризику з
  урахуванням триваючого ендометріального та тромбоемболічного
  ризику. Інгібітор ароматази (у постменопаузі) є альтернативою без
  ендометріального ризику, якщо перехід на нього доцільний.

  **(5) Супутній скринінг факторів ризику** — ожиріння, артеріальна
  гіпертензія, цукровий діабет, синдром Лінча (незалежні фактори
  ризику ендометріального раку) підсилюють ризик, пов'язаний з
  тамоксифеном; вести за окремими алгоритмами.

  **(6) Замісна гормональна терапія протипоказана** у цій популяції
  — натомість застосовувати негормональне ведення вазомоторних
  симптомів і симптомів з боку сечостатевої системи.

  Результат: у жінок, які приймають тамоксифен, своєчасно
  повідомляють про кровотечу та отримують негайне обстеження,
  ендометріальний рак виявляється на виліковній стадії у переважній
  більшості випадків. Мета цього шляху спостереження — НЕ скринінг
  безсимптомних жінок, а швидка реакція на будь-яку кровотечу чи
  симптом.

