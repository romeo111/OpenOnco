do_not_do:
  - "Не призначати рутинний скринінг безсимптомних жінок за допомогою ТВУЗД — рівень хибнопозитивних результатів підвищений через пов'язані з тамоксифеном субепітеліальні зміни; ACOG/NCCN проти."
  - "Не відкладати біопсію ендометрія у симптомної жінки через 'тонкий' ендометрій за даними ТВУЗД — пов'язані з тамоксифеном зміни можуть маскувати патологію; біопсія обов'язкова."
  - "Не призначати замісну гормональну терапію жінкам, які приймають тамоксифен, — протипоказана. Використовувати негормональне ведення вазомоторних симптомів."
  - "Не нормалізувати постменопаузальну кровотечу — навіть мінімальні кров'янисті виділення потребують обстеження."
  - "Не знижувати пріоритетність обстеження на синдром Лінча у тих, у кого ендометріальний рак розвивається на тлі прийому тамоксифену, — супутній герміногенний ризик змінює тактику ведення."

do_not_do_en:
  - "Do not order routine asymptomatic TVUS screening — false-positive rate is elevated by tamoxifen-related subepithelial changes; ACOG/NCCN advise against."
  - "Do not defer endometrial biopsy in a symptomatic woman based on a 'thin' TVUS endometrium — tamoxifen-related changes can mask pathology; biopsy is required."
  - "Do not prescribe hormone replacement therapy in tamoxifen-exposed women — contraindicated. Use non-hormonal vasomotor management."
  - "Do not normalize postmenopausal bleeding — even minimal spotting requires evaluation."
  - "Do not deprioritize Lynch syndrome assessment in those who develop endometrial cancer on tamoxifen — concurrent germline risk alters management."

