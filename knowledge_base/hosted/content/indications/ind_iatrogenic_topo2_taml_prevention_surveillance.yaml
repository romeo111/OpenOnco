do_not_do:
  - "Не застосовувати графік спостереження, розроблений для алкілятор-асоційованого t-AML (медіана латентного періоду 5-7 років), у пацієнтів після інгібіторів топоізомерази II — пік ризику припадає на 2-5-й роки, а не на 5-7-й."
  - "Не пропускати настороженість щодо невідкладного стану APL — t-APL проявляється ДВЗ-синдромом і кровотечею; затримка лікування смертельно небезпечна."
  - "Не виконувати рутинні профілактичні біопсії кісткового мозку безсимптомним пацієнтам з нормальним ЗАК."
  - "Не очікувати передуючої фази MDS — t-AML, пов'язаний з інгібіторами топоізомерази II, часто виникає раптово, без цитопенічного продрому."
  - "Не вважати всі t-AML однаковими — t-AML, пов'язаний з інгібіторами топоізомерази II, зі сприятливою цитогенетикою (t(15;17), t(8;21), inv(16)) має кращі наслідки, ніж t-AML зі складним каріотипом, пов'язаний з алкілюючими агентами."

do_not_do_en:
  - "Do not use the alkylator-t-AML surveillance schedule (5-7y median latency) for topo2 patients — peak risk is 2-5y, not 5-7y."
  - "Do not skip APL emergency awareness — t-APL presents with DIC + bleeding; treatment delay is deadly."
  - "Do not perform routine prophylactic marrow biopsies in asymptomatic patients with normal CBC."
  - "Do not expect a preceding MDS phase — topo2-inhibitor t-AML is often abrupt without cytopenic prodrome."
  - "Do not consider all t-AMLs the same — topo2-inhibitor t-AML with favorable cytogenetics (t(15;17), t(8;21), inv(16)) has better outcomes than alkylator-related complex-karyotype t-AML."

