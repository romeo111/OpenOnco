do_not_do:
  - "Не подавати спостереження лише за симптомами як еквівалент структурованого онкологічного спостереження — SCC після трансплантації має гірший прогноз на кожній стадії порівняно зі спонтанним."
  - "Не пропускати чітке навчання щодо тривожних симптомів — розпізнавання патернів критично важливе в цій когорті високого ризику."
  - "Не нормалізувати новий шкірний утвір / незагойну виразку — висока ймовірність SCC у пацієнтів після трансплантації."
  - "Не пропускати консультування щодо захисту від сонця — найефективніший захід самодогляду."
  - "Не знижувати імуносупресію в односторонньому порядку — ризик відторгнення трансплантата; завжди координувати з трансплантологічною командою."

do_not_do_en:
  - "Do not present observation as equivalent to structured cancer surveillance — post-transplant SCC has worse stage-for-stage prognosis than spontaneous."
  - "Do not skip explicit symptom-vigilance education — pattern recognition is critical in this high-risk cohort."
  - "Do not normalize a new skin lesion / non-healing sore — high probability of SCC in the post-transplant cohort."
  - "Do not omit sun-protection counseling — the highest self-care yield."
  - "Do not reduce immunosuppression unilaterally — graft rejection risk; always coordinate with transplant team."

