rationale: >
  Alternative-track companion to IND-IATROGENIC-TRANSPLANT-
  IMMUNOSUPPRESSION-LONGTERM-PREVENTION-SURVEILLANCE. Patient
  declines structured annual skin exam + GYN co-test + symptom-
  surveillance pathway (transplant survivorship fatigue,
  geographic access, preference) — receives explicit symptom-
  vigilance education (new or changing skin lesion, non-healing
  sore, persistent lymphadenopathy, unexplained fevers / night
  sweats / weight loss, hematochezia, abnormal vaginal bleeding,
  oral leukoplakia / non-healing oral lesion → immediate referral)
  + sun-protection counseling (broad-spectrum SPF 30+, avoidance
  during peak UV, photoprotective clothing — sun protection is
  the single highest-yield self-care intervention for this
  cohort). Coordination with transplant team for any immuno-
  suppression review remains essential — NEVER unilateral changes.
  Per CHARTER §11 patient-autonomy framing — declining the
  structured pathway is legitimate but framed as suboptimal vs.
  active-surveillance comparator, particularly given the
  aggressive post-transplant SCC subset.

rationale_ua: >
  Альтернативний трек до IND-IATROGENIC-TRANSPLANT-IMMUNOSUPPRESSION-
  LONGTERM-PREVENTION-SURVEILLANCE. Пацієнт відмовляється від
  структурованого шляху спостереження (щорічний огляд шкіри +
  гінекологічний ко-тест + спостереження за симптомами) — натомість
  отримує чітке навчання щодо тривожних симптомів (новий або
  змінюваний шкірний утвір, незагойна виразка, стійка
  лімфаденопатія, незрозумілі гарячки / нічна пітливість / втрата
  ваги, гематохезія, аномальна вагінальна кровотеча, лейкоплакія
  порожнини рота / незагойне ураження слизової рота → негайне
  направлення) та консультування щодо захисту від сонця
  (широкоспектральний SPF 30+, уникнення пікових годин
  УФ-випромінювання, фотозахисний одяг — захист від сонця є
  найефективнішим заходом самодогляду в цій когорті).
  Координація з трансплантологічною командою щодо перегляду
  імуносупресії є обов'язковою — НІКОЛИ односторонні зміни.
  Відповідно до CHARTER §11 (принцип автономії пацієнта) — відмова
  від структурованого шляху є законним вибором, але подається як
  менш оптимальний варіант порівняно з активним спостереженням,
  особливо з огляду на агресивний підтип плоскоклітинного раку шкіри
  після трансплантації.

