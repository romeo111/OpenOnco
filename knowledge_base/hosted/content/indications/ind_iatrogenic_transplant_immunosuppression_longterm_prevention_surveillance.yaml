do_not_do:
  - "Не пропускати щорічний огляд усього тіла шкіри — найбільший ефект профілактики раку в когорті після трансплантації."
  - "Не знижувати імуносупресію в односторонньому порядку без координації з трансплантологічною командою — ризик відторгнення трансплантата."
  - "Не проводити рутинний моніторинг ДНК ВЕБ у хронічній когорті (>3 роки) — інформативність знижена; переходити на обстеження за симптомами."
  - "Не пропускати надолуження вакцинації проти ВПЛ у невакцинованих пацієнтів після трансплантації — охоплення вакцинацією повільне; імуносупресія не є протипоказанням."
  - "Не застосовувати живі вакцини на тлі імуносупресії після трансплантації — протипоказані."
  - "Не нормалізувати незрозумілу лімфаденопатію / B-симптоми — пізній PTLD може проявлятися екстранодально."

do_not_do_en:
  - "Do not skip annual whole-body skin exam — the highest cancer-prevention yield in the post-transplant cohort."
  - "Do not reduce immunosuppression unilaterally without transplant-team coordination — graft rejection risk."
  - "Do not routinely monitor EBV-DNA in the chronic >3y cohort — yield drops; pivot to symptom-driven workup."
  - "Do not skip HPV vaccination catch-up in the unvaccinated post-transplant cohort — uptake is slow; immunosuppression is not a contraindication."
  - "Do not use live vaccines in post-transplant immunosuppression — contraindicated."
  - "Do not normalize unexplained lymphadenopathy / B-symptoms — late-onset PTLD often presents extranodally."

