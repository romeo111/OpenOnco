rationale: >
  Standard-track surveillance for chronic ≥3y post-transplant
  immunosuppression. Components per NCCN B-Cell Lymphoma /
  Cervical / Anal / Skin + ASTS / KDIGO transplant-survivorship
  guidance:

  **(1) Annual whole-body skin examination by dermatologist** —
  THE highest-yield component. Post-transplant SCC has ~65-100x
  background incidence; aggressive subset (high recurrence,
  perineural invasion, metastasis) requires early Mohs excision.
  q6mo cadence for patients with any prior skin cancer history.
  Sun-protection counseling (broad-spectrum SPF 30+, avoidance
  during peak UV hours, photoprotective clothing) at every visit.

  **(2) Cervical co-test q1-3y** in post-transplant women per
  ASCCP modified-cadence guidance (transplant recipients are
  immunocompromised cohort; co-test cadence shorter than the
  q5y average-risk interval). HPV vaccination catch-up if not
  previously vaccinated (Gardasil-9 through age 45 per ACIP
  shared-decision recommendation; transplant cohort included).

  **(3) Anal cytology q1-3y** in MSM, HIV-positive transplant
  recipients, and women with anogenital HPV history. Routine
  anal cytology in average-risk female transplant recipients
  is variable per institutional guideline — discussion at GI /
  GYN visits.

  **(4) Annual oral / oropharyngeal exam** by dentist or
  primary care — look for leukoplakia, erythroplakia,
  non-healing ulcer, mass. HPV-associated oropharyngeal cancer
  cohort overlaps with cervical-cancer cohort.

  **(5) Annual lymphadenopathy + B-symptom review** —
  unexplained lymphadenopathy, fevers, night sweats, weight
  loss, fatigue → workup with imaging + biopsy. Late-onset PTLD
  often presents with extranodal disease (GI tract, CNS, allograft
  itself) — keep imaging modality choice broad. Routine EBV-DNA
  monitoring in the chronic cohort is lower-yield than in the
  acute window — pivot to symptom-driven workup.

  **(6) Kaposi-sarcoma surveillance** in HHV-8-positive cohort
  (e.g. transplant from HHV-8-endemic donor region, prior HHV-8
  seropositivity) — inspect skin, oral mucosa, GI symptoms (KS
  GI involvement is common); refer for endoscopy if symptomatic.

  **(7) HCC surveillance q6mo** with US + AFP in transplant
  recipients with HBV / HCV history (active or past), cirrhosis,
  or post-liver-transplant cohort with native-liver HCC history.

  **(8) Renal-cell carcinoma surveillance** in kidney-transplant
  recipients ≥10y post-transplant — annual US of native kidneys
  (acquired-cystic-disease pathway is the dominant RCC risk;
  abdominal imaging usually obtained for transplant kidney can
  also visualize natives).

  **(9) Coordinated immunosuppression-minimization discussion
  with the transplant team** — over the chronic cohort, the
  minimum effective immunosuppression that preserves the graft
  is the goal. NEVER unilateral patient-driven or oncology-
  driven changes; coordinate via transplant nephrologist /
  hepatologist / cardiologist as relevant.

  **(10) Vaccination** — annual influenza, pneumococcal series,
  shingrix (zoster), hepatitis B status check + boosters,
  COVID-19 per cohort. Live vaccines remain contraindicated.

  Goal: chronic-cohort surveillance cadence captures the
  cumulative cancer risk profile distinct from acute-window
  EBV-DNA monitoring.

rationale_ua: >
  Стандартний трек спостереження для хронічної (≥3 років)
  імуносупресії після трансплантації. Компоненти згідно з NCCN
  B-Cell Lymphoma / Cervical / Anal / Skin та рекомендаціями ASTS /
  KDIGO щодо супроводу реципієнтів трансплантатів:

  **(1) Щорічний огляд усього тіла дерматологом** —
  НАЙЕФЕКТИВНІШИЙ компонент. SCC після трансплантації трапляється у
  ~65-100 разів частіше, ніж у популяції в цілому; агресивний підтип
  (висока частота рецидивів, периневральна інвазія, метастазування)
  потребує ранньої мікрографічної хірургії за методом Моса (Mohs
  surgery). Періодичність кожні 6 місяців для пацієнтів з будь-яким
  анамнезом раку шкіри. Консультування щодо захисту від сонця
  (широкоспектральний SPF 30+, уникнення пікових годин
  УФ-випромінювання, фотозахисний одяг) при кожному візиті.

  **(2) Гінекологічний ко-тест кожні 1-3 роки** у жінок після
  трансплантації згідно з модифікованою періодичністю ASCCP
  (реципієнти трансплантатів є імунокомпрометованою когортою;
  інтервал ко-тесту коротший за середньопопуляційний інтервал кожні
  5 років). Надолуження вакцинації проти ВПЛ, якщо раніше не
  проводилася (вакцина Gardasil-9 до 45 років згідно зі спільним
  рішенням за рекомендацією ACIP; це стосується й когорти після
  трансплантації).

  **(3) Цитологія анального каналу кожні 1-3 роки** у ЧСЧ,
  ВІЛ-позитивних реципієнтів трансплантатів та жінок з анамнезом
  аногенітального ВПЛ. Рутинна цитологія анального каналу в жінок-
  реципієнтів трансплантатів із середнім ризиком варіюється залежно
  від інституційної настанови — питання обговорюється на візитах до
  гастроентеролога / гінеколога.

  **(4) Щорічний огляд порожнини рота / ротоглотки** стоматологом
  або лікарем первинної ланки — лейкоплакія, еритроплакія, незагойна
  виразка, утвір. Когорта ВПЛ-асоційованого раку ротоглотки частково
  перетинається з когортою раку шийки матки.

  **(5) Щорічний огляд щодо лімфаденопатії та B-симптомів** —
  незрозуміла лімфаденопатія, гарячки, нічна пітливість, втрата ваги
  → обстеження з візуалізацією + біопсією. Пізній PTLD часто
  проявляється екстранодальним ураженням (шлунково-кишковий тракт,
  ЦНС, сам трансплантат) — вибір методу візуалізації має залишатися
  широким. Рутинний моніторинг ДНК ВЕБ у хронічній когорті менш
  інформативний, ніж у гострому вікні спостереження — перехід на
  обстеження за симптомами.

  **(6) Спостереження щодо саркоми Капоші** у ВГЛ-8-позитивної
  когорти (наприклад, трансплантат від донора з ендемічного щодо
  ВГЛ-8 регіону, попередня серопозитивність до ВГЛ-8) — огляд шкіри,
  слизової рота, оцінка шлунково-кишкових симптомів (ураження ШКТ
  при саркомі Капоші трапляється часто); за наявності симптомів —
  направлення на ендоскопію.

  **(7) Спостереження щодо ГЦК кожні 6 місяців** з УЗД + АФП при
  анамнезі ВГВ / ВГС, цирозі, після трансплантації печінки з
  анамнезом ГЦК у власній печінці.

  **(8) Спостереження щодо нирково-клітинного раку (RCC)** у
  реципієнтів ниркового трансплантата через ≥10 років після
  трансплантації — щорічне УЗД власних нирок (набута кістозна хвороба
  нирок є основним шляхом розвитку RCC у цій когорті; абдомінальна
  візуалізація, яку зазвичай виконують для оцінки трансплантованої
  нирки, дає змогу візуалізувати й власні нирки).

  **(9) Скоординоване обговорення мінімізації імуносупресії з
  трансплантологічною командою** — у хронічній когорті метою є
  мінімальна ефективна імуносупресія, що зберігає трансплантат.
  НІКОЛИ односторонні зміни з боку пацієнта чи онколога; координувати
  через трансплантаційного нефролога / гепатолога / кардіолога
  залежно від ситуації.

  **(10) Вакцинація** — щорічно грип, пневмококова серія, шингрікс,
  статус ВГВ + ревакцинація, COVID-19. Живі вакцини протипоказані.

  Мета: періодичність спостереження в хронічній когорті охоплює
  кумулятивний профіль онкологічного ризику, відмінний від
  моніторингу ДНК ВЕБ у гострому вікні після трансплантації.

