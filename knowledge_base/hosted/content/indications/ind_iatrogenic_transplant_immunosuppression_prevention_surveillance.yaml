do_not_do:
  - "Не пропускати визначення EBV-DNA кожні 1-3 місяці в перші 2 роки після трансплантації — це період найвищого ризику PTLD."
  - "Не обмежуватися лише щорічним оглядом шкіри — післятрансплантаційні SCC агресивні, тому інтервал кожні 3-6 місяців є переважним."
  - "Не знижувати імуносупресію при зростанні титру EBV-DNA (підозра на PTLD) без узгодження з трансплантаційною командою — ризик відторгнення трансплантата."

do_not_do_en:
  - "Do not skip q1-3 month EBV-DNA in the first 2 years post-transplant — peak PTLD risk."
  - "Do not use annual skin exam alone — post-transplant SCCs are aggressive; q3-6mo preferred."
  - "Do not reduce immunosuppression on PTLD-rising without transplant team coordination — graft rejection risk."

