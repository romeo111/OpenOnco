rationale: >
  Standard-track surveillance for transplant-immunosuppression cohort.

  **(1) Annual whole-body skin exam by dermatologist** — SCC + BCC most common
  post-transplant malignancy; aggressive SCC subset specific to immunosuppressed.

  **(2) Quantitative EBV-DNA q1-3 months** in post-solid-organ-transplant +
  post-HSCT for PTLD surveillance. Rising titers → reduce immunosuppression
  (RIS) + preemptive rituximab.

  **(3) Cervical Pap + HPV co-test annually** in post-transplant women.

  **(4) Anal cytology q1-3y** in MSM + women with anogenital HPV history.

  **(5) Oral cancer awareness** at routine dental visits.

  **(6) HCC surveillance** (US + AFP q6mo) in post-transplant with HBV/HCV
  history.

rationale_ua: >
  Стандартний напрям спостереження для когорти з трансплантаційно-
  опосередкованою імуносупресією.

  **(1) Щорічний огляд усього шкірного покриву лікарем-дерматологом** —
  SCC та BCC є найчастішими злоякісними новоутвореннями після
  трансплантації; агресивний підтип SCC характерний саме для
  імуносупресованих пацієнтів.

  **(2) Кількісне визначення EBV-DNA кожні 1-3 місяці** у пацієнтів
  після трансплантації солідних органів та після ТГСК для спостереження
  щодо PTLD. Зростання титру → зниження імуносупресії (RIS) +
  превентивне призначення ритуксимабу.

  **(3) Щорічний Пап-тест шийки матки + ко-тест на HPV** у жінок після
  трансплантації.

  **(4) Анальна цитологія кожні 1-3 роки** у чоловіків, які мають секс
  із чоловіками (MSM), та у жінок з анамнезом аногенітального HPV.

  **(5) Настороженість щодо раку ротової порожнини** під час планових
  стоматологічних оглядів.

  **(6) Спостереження щодо HCC** (УЗД + AFP кожні 6 місяців) у пацієнтів
  після трансплантації з анамнезом HBV/HCV.

