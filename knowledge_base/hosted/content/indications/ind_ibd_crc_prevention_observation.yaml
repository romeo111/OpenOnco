  STUB — alternative-track companion for IBD-CRC prevention pilot.
  Required for §15.2 C4 ≥2-tracks invariant on PreventionPlan shape
  (KSS §20.2). Clinically below standard-of-care for long-standing IBD
  (q1-2y chromoendoscopy is AGA/ECCO/NCCN standard); included for
  patient-autonomy framing per CHARTER §11.
