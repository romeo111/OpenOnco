rationale: >
  Aggressive-track confirmed-carrier pathway: layered on top of the
  IND-JPS-CARRIER-SURVEILLANCE standard protocol with two
  intensification options that escalate beyond surveillance alone.

  **Foundation:** All standard surveillance from IND-JPS-CARRIER-
  SURVEILLANCE applies (colonoscopy q1-3y from 12-15, EGD q1-3y from 15,
  SMAD4-HHT screening at diagnosis).

  **Intensification 1 — Earlier prophylactic colectomy discussion:**
  In carriers with juvenile polyp burden exceeding endoscopic-clearance
  capacity (>50-100 polyps, persistent anemia despite polypectomy,
  recurrent obstruction or protein-losing enteropathy from high-burden
  disease, OR worrisome histology features — adenomatous focus,
  high-grade dysplasia, focal carcinoma in a polyp), advancing to
  prophylactic total colectomy with ileorectal anastomosis (TC-IRA) or
  proctocolectomy with ileal pouch anal anastomosis (IPAA) is a
  shared-decision option in adolescents / young adults rather than a
  reactive intervention. Trade-off: surgical morbidity (anastomotic
  leak, IPAA pouchitis, fertility / sexual-function concerns,
  permanent ileostomy in IPAA failure). Rectal stump in TC-IRA still
  requires lifelong surveillance.

  **Intensification 2 — Intensified SMAD4-HHT AVM management:**
  Active management of identified pulmonary AVMs even when
  asymptomatic: feeder-artery embolization for AVMs with feeder
  diameter > 3 mm (standard HHT consensus threshold). Periodic chest
  CT re-imaging of unembolized small AVMs (q3-5y) given growth
  potential. Low-threshold neurosurgical / interventional-radiology
  consultation for any cerebral AVM (size + location + symptoms
  drive embolization vs radiosurgery vs observation). Genetic
  counseling at family-planning visits given SMAD4 autosomal-dominant
  inheritance + de-novo HHT complication risk in offspring.

  **Cascade testing remains continuous:** every visit re-confirms
  family's testing status. Pediatric testing (age 10-12) is
  appropriate given the childhood-onset surveillance window.

  Per CHARTER §11: intensified surveillance and prophylactic surgery
  are shared-decision-making domains. Patient autonomy is paramount;
  none of these intensifications are mandated, and the standard-track
  protocol remains the floor.

rationale_ua: >
  Aggressive-трекова Indication: накладена поверх IND-JPS-CARRIER-
  SURVEILLANCE з двома опціями інтенсифікації.

  **Foundation:** Усе стандартне з IND-JPS-CARRIER-SURVEILLANCE.

  **Інтенсифікація 1 — Рання prophylactic колектомія discussion:**
  При polyp burden > endoscopic-clearance capacity (>50-100 поліпів,
  persistent anemia, recurrent obstruction / protein-losing
  enteropathy, OR worrisome histology — adenomatous focus, high-grade
  dysplasia, focal carcinoma) — advancing до TC-IRA або proctocolectomy
  + IPAA — shared-decision option у adolescents / young adults замість
  reactive втручання. Trade-off: surgical morbidity (anastomotic leak,
  IPAA pouchitis, fertility / sexual-function, permanent ileostomy).
  Rectal stump (TC-IRA) — lifelong surveillance.

  **Інтенсифікація 2 — Інтенсифікований SMAD4-HHT AVM management:**
  Active management identified pulmonary AVMs навіть asymptomatic:
  feeder-artery embolization для AVM з feeder diameter >3 мм
  (standard HHT consensus threshold). Periodic chest CT re-imaging
  unembolized small AVMs (q3-5y). Low-threshold neurosurgical /
  IR consultation для cerebral AVMs. Genetic counseling при family-
  planning через SMAD4 autosomal-dominant + de-novo HHT complication
  risk у offspring.

  **Cascade тестування continuous:** кожен візит re-confirms family
  testing status. Pediatric тестування (10-12 років) appropriate.

  Per CHARTER §11: shared-decision-making домен; автономія пацієнта
  primary.

