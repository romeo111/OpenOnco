expected_outcomes:
  overall_response_rate: >-
    Intensified track layers two options on top of the standard JPS
    surveillance protocol: (1) earlier prophylactic colectomy /
    proctocolectomy + IPAA discussion in carriers with high polyp
    burden (juvenile polyps rapidly exceeding endoscopic-clearance
    capacity, recurrent obstruction, protein-losing enteropathy from
    high-burden disease, or persistent anemia despite endoscopic
    therapy) rather than waiting for clear endoscopic failure;
    (2) intensified SMAD4-HHT AVM management (active embolization of
    asymptomatic but feeder-pulmonary-AVM > 3 mm, periodic re-imaging
    of unembolized AVMs, low-threshold neurosurgical consultation for
    cerebral AVMs). Trade-off: surgical morbidity, IPAA pouchitis,
    AVM embolization complications, false-positive surveillance findings
    in young patients — all shared-decision discussion points.

