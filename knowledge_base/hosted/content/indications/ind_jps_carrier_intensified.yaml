    position: context

do_not_do:
  - "Не презентувати prophylactic колектомію як обов'язкову для усіх carriers — це shared-decision-making; polyp-burden + симптоми + histology драйвери, НЕ календарний вік."
  - "Не виконувати proctocolectomy без обговорення IPAA pouchitis ризику + fertility / sexual-function impacts — особливо у young adults."
  - "Не emboliseувати asymptomatic pulmonary AVMs з feeder < 3 мм — за-низькій threshold веде до procedure complications без proportional benefit."
  - "Не пропускати periodic re-imaging unembolized small pulmonary AVMs (q3-5y) — AVMs можуть grow та перетинати threshold."
  - "Не intensifyувати у BMPR1A-носіїв як SMAD4 — BMPR1A НЕ має HHT-overlap; AVM-screening для BMPR1A не actionable."

do_not_do_en:
  - "Do not present prophylactic colectomy as mandatory for all carriers — shared-decision-making; drivers are polyp-burden + symptoms + histology, not calendar age."
  - "Do not perform proctocolectomy without discussing IPAA pouchitis risk + fertility / sexual-function impacts — especially in young adults."
  - "Do not embolize asymptomatic pulmonary AVMs with feeder < 3 mm — below-threshold approach causes procedural complications without proportional benefit."
  - "Do not skip periodic re-imaging of unembolized small pulmonary AVMs (q3-5y) — AVMs can grow and cross the embolization threshold."
  - "Do not intensify in BMPR1A carriers as you would in SMAD4 — BMPR1A does not have HHT overlap; AVM screening in BMPR1A is not actionable."

