      disease, earlier prophylactic colectomy or proctocolectomy with
      IPAA is appropriate following shared decision-making. SMAD4
      carriers with documented pulmonary AVMs warrant embolization of
      feeder-diameter > 3 mm lesions per HHT consensus."
