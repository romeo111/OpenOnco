sources:
  - source_id: SRC-NCCN-GENETIC-FAMILIAL-CRC-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Confirmed SMAD4 / BMPR1A (juvenile polyposis) carriers should
      enter structured GI surveillance with colonoscopy q1-3y from age
      12-15 and upper endoscopy q1-3y from age 15, tightening intervals
      once polyps appear. SMAD4 carriers additionally require Hereditary
      Hemorrhagic Telangiectasia screening (pulmonary, hepatic,
      cerebral AVMs) at diagnosis."
  - source_id: SRC-NCCN-COLON-2025
    position: supports
  - source_id: SRC-ESMO-CRC-2024
    position: context

do_not_do:
  - "Не пропускати SMAD4-specific HHT screening при діагнозі — pre-procedure air-embolism stroke з недіагностованим pulmonary AVM — описаний catastrophic JPS outcome."
  - "Не вважати BMPR1A-носіїв equivalent для HHT-screening — HHT overlap унікальний для SMAD4 (~22%), BMPR1A — НЕ overlap."
  - "Не виконувати empirical prophylactic колектомію у low-burden carriers — endoscopic clearance adequate; surgery — для high-burden / refractory / dysplasia."
  - "Не пропускати pediatric initiation (12-15 років для CRC, 15 років для EGD) — JPS може presentувати childhood anemia / obstruction / intussusception до 18."
  - "Не пропускати cascade-тестування first-degree родичів — кожен візит має документувати family testing status."

do_not_do_en:
  - "Do not skip SMAD4-specific HHT screening at diagnosis — pre-procedure air-embolism stroke in an undiagnosed pulmonary AVM is a recurring catastrophic JPS outcome."
  - "Do not treat BMPR1A carriers as equivalent for HHT screening — HHT overlap is unique to SMAD4 (~22%); BMPR1A carriers do not have HHT overlap."
  - "Do not perform empirical prophylactic colectomy in low-burden carriers — endoscopic clearance is adequate; surgery is reserved for high-burden, refractory, or dysplasia-driven cases."
  - "Do not skip pediatric initiation (age 12-15 for CRC, age 15 for EGD) — JPS can present with childhood anemia, obstruction, or intussusception before 18."
  - "Do not skip cascade testing of first-degree relatives — every surveillance visit should document family testing status."

known_controversies:
  - topic: "Prophylactic colectomy timing in JPS"
    positions:
      - position: "Polyp-burden-driven (no calendar threshold)"
        sources: [SRC-NCCN-GENETIC-FAMILIAL-CRC-2025]
        evidence_note: "NCCN-aligned. Surgery when endoscopic clearance no longer adequate or symptoms (anemia, obstruction, protein-losing enteropathy) persist."
      - position: "Calendar threshold (age 18-25 prophylactic in all carriers)"
        sources: []
        evidence_note: "Historical pediatric-GI position; no longer mainstream — endoscopic clearance often adequate in lower-burden phenotypes."
    our_default: "Polyp-burden-driven"
    rationale: >
      JPS polyps vary widely from sparse to diffuse-carpeting; treating
      all carriers identically over-treats low-burden phenotypes and
      under-attends high-burden patients. Shared-decision-making per
      CHARTER §11.

