rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with a documented germline SMAD4 / BMPR1A pathogenic variant or
  clinically diagnosed JPS (≥5 juvenile polyps, juvenile polyps
  throughout the GI tract, or any number with family history).

  **Colorectal (~40% lifetime; dominant cancer risk):** Colonoscopy
  q1-3y starting age 12-15 (or earlier if symptoms — anemia, rectal
  bleeding, intussusception). Polypectomy of all juvenile polyps
  > 5 mm; biopsy of dysplastic / mixed-pattern polyps. When polyp
  burden exceeds endoscopic-clearance capacity (>50-100 polyps,
  recurrent obstruction, ongoing protein-losing enteropathy from
  high-burden disease, persistent anemia) → prophylactic
  colectomy / proctocolectomy with ileal pouch anal anastomosis (IPAA)
  becomes a shared-decision option. Surveillance interval tightens to
  q6mo once polyps appear.

  **Upper GI (~21% gastric lifetime, SMAD4 enriched):** EGD q1-3y
  starting age 15 (intensified to q1y once polyps appear; q6mo for
  high-burden gastric polyposis). Polypectomy of larger polyps;
  ablation / partial gastrectomy considered for diffuse high-burden
  gastric polyposis with dysplasia. Small-bowel imaging (MR
  enterography or video capsule endoscopy) optional, lower threshold
  for symptomatic patients.

  **Pancreatic (~5%, modest):** No routine pancreatic surveillance
  imaging at this absolute risk level (insufficient absolute risk for
  CAPS-consortium eligibility unlike PJS or FAMMM). Familial pancreatic
  cancer pedigree may warrant individualized discussion.

  **SMAD4-HHT overlap screening (~22% of SMAD4 carriers — BMPR1A
  unaffected):** One-time baseline at JPS diagnosis:
    - Pulse oximetry (room air) + supine + erect — pulmonary AVM
      screening; oxygen desaturation > 4% on standing is a flag.
    - Contrast (bubble) transthoracic echocardiography — definitive
      pulmonary AVM screening; positive shunt → chest CT to characterize.
    - Brain MRI without contrast — cerebral AVM screening; positive
      → neurosurgical / interventional radiology consultation.
    - Liver imaging (US or CT/MRI if symptoms) — hepatic AVM screening.
    - Recurrent epistaxis history + nasal endoscopy if positive.
  Pre-procedure (any invasive, especially dental) air-embolism
  precautions: prophylactic antibiotics + IV-line air filters in
  patients with documented pulmonary AVM.

  **Cascade testing:** Confirmed carrier status mandates cascade
  testing offer to all first-degree relatives. Counseling responsibility
  surfaced at every surveillance visit. Pediatric testing (age 10-12)
  is appropriate given the childhood-onset surveillance window.

  Per CHARTER §11 patient-autonomy framing: pediatric surveillance
  initiation requires age-appropriate counseling. Prophylactic
  colectomy timing is shared-decision-making — the threshold is polyp-
  burden + symptoms, not a calendar age.

rationale_ua: >
  Стандартний-трекова Indication для confirmed-carrier JPS surveillance
  per NCCN Genetic Familial High-Risk: Colorectal v2.2025.

  **Колоректальний (~40% lifetime; домінантний ризик):** Колоноскопія
  q1-3y з 12-15 років (раніше при симптомах — анемія, ректальна
  кровотеча, інвагінація). Поліпектомія усіх juvenile polyps >5 мм;
  біопсія dysplastic / mixed-pattern. Polyp burden > endoscopic-
  clearance capacity (>50-100 поліпів, recurrent obstruction, ongoing
  protein-losing enteropathy, persistent anemia) → prophylactic
  колектомія / proctocolectomy з IPAA — shared-decision. Інтервал
  q6mo після появи поліпів.

  **Upper GI (~21% gastric, SMAD4 enriched):** EGD q1-3y з 15 років
  (q1y після поліпів; q6mo для high-burden). Поліпектомія більших
  поліпів; ablation / часткова гастректомія для diffuse high-burden
  з dysplasia. MR enterography або VCE — optional, lower threshold для
  симптоматичних.

  **Підшлункова (~5%, modest):** No routine surveillance — недостатній
  absolute risk для CAPS-consortium eligibility. Familial pancreatic
  cancer pedigree — individualized discussion.

  **SMAD4-HHT overlap (~22% SMAD4-носіїв; BMPR1A — НЕ):** One-time
  baseline на діагнозі JPS:
    - Пульсоксиметрія (room air) + supine + erect — pulmonary AVM screening.
    - Bubble echocardiography — definitive pulmonary AVM screening;
      positive shunt → chest CT.
    - МРТ мозку без контрасту — cerebral AVM screening.
    - Imaging печінки (US або CT/MRI при симптомах).
    - Recurrent epistaxis + nasal endoscopy при позитивній історії.
  Pre-procedure (any invasive, especially dental) air-embolism
  precautions при documented pulmonary AVM: prophylactic antibiotics +
  IV-line air filters.

  **Cascade тестування:** mandates пропонування first-degree родичам.
  Pediatric тестування (10-12 років) appropriate.

  Per CHARTER §11 framing автономії пацієнта. Prophylactic колектомія
  timing = polyp-burden + симптоми, НЕ календарний вік.

