expected_outcomes:
  overall_response_rate: >-
    Structured colorectal + upper-GI surveillance per NCCN Genetic
    Familial High-Risk: Colorectal v2.2025 detects juvenile polyps at
    pre-malignant stages (retention-polyp → mixed → adenomatous →
    carcinoma sequence) and enables endoscopic clearance before
    malignant transformation. Colonoscopy q1-3y from age 12-15
    (intensified to q6mo once polyps appear) keeps CRC risk controlled
    in low-burden patients and triggers the prophylactic-colectomy
    discussion in high-burden patients. SMAD4-specific HHT screening at
    JPS diagnosis (one-time baseline pulse oximetry + contrast
    echocardiography for pulmonary AVMs, plus brain MRI for cerebral
    AVMs) prevents the catastrophic pre-procedural air-embolism stroke
    that has historically defined the JPS-HHT clinical narrative.

