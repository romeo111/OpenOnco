id: IND-KAPOSI-1L-AIDS-ART
plan_track: standard
intent: treatment

applicable_to:
  disease_id: DIS-KAPOSI
  line_of_therapy: 1
  stage_requirements:
    - "AIDS-associated (HIV+) Kaposi sarcoma, histologically confirmed"
    - "Limited/non-visceral disease (no visceral organ involvement; no extensive/rapidly progressive mucocutaneous disease) -- RF-KAPOSI-VISCERAL-EXTENSIVE-DISEASE not triggered"
    - "Extensive or visceral disease -> see IND-KAPOSI-1L-VISCERAL-PLD (systemic chemotherapy added to, not substituted for, ART)"
  biomarker_requirements_required:
    - biomarker_id: BIO-HIV-STATUS
      required: true
      value_constraint: "positive"
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 3

recommended_regimen: REG-HIV-BIKTARVY
concurrent_therapy: []
followed_by:
  - IND-KAPOSI-1L-VISCERAL-PLD

evidence_level: moderate
strength_of_recommendation: strong
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: >-
    Sustained antiretroviral therapy with virologic suppression and CD4
    reconstitution induces Kaposi sarcoma regression in a substantial
    fraction of limited AIDS-KS, and ART initiation reduces Kaposi
    sarcoma incidence 70-90% (cohort data). Extensive or visceral
    disease typically requires added systemic chemotherapy -- see
    IND-KAPOSI-1L-VISCERAL-PLD.

hard_contraindications: []
red_flags_triggering_alternative:
  - RF-KAPOSI-VISCERAL-EXTENSIVE-DISEASE

required_tests:
  - TEST-EXCISIONAL-SKIN-BIOPSY
  - TEST-HIV-SEROLOGY
  - TEST-CBC
  - TEST-LFT
desired_tests:
  - TEST-CT-CHEST-ABDOMEN-PELVIS

rationale: >
  AIDS-associated Kaposi sarcoma is driven by HIV-related
  immunocompromise permitting HHV-8-driven tumorigenesis. Immune
  restoration via antiretroviral therapy (ART) is the foundation of
  therapy and should be initiated (or optimized if already on ART with
  detectable viremia) regardless of CD4 count, per DHHS / WHO / IDSA
  universal-ART guidance. ART alone can induce regression of limited,
  non-visceral cutaneous Kaposi sarcoma as immune surveillance is
  restored; no chemotherapy is required as first-line therapy for
  limited disease. Regimen selection follows current DHHS / NIH
  AIDSinfo first-line ART guidance -- a single-tablet integrase-
  inhibitor-based regimen (e.g. bictegravir/emtricitabine/tenofovir-
  alafenamide) is preferred; drug-drug interaction screening is
  mandatory before any chemotherapy is added. Extensive, rapidly
  progressive, or visceral (pulmonary, GI, or other organ) disease is
  not expected to be adequately controlled by ART alone and requires
  added systemic chemotherapy -- see IND-KAPOSI-1L-VISCERAL-PLD -- with
  ART continued, never interrupted, concurrently.

rationale_ua: >
  ВІЛ-асоційована саркома Капоші зумовлена ВІЛ-пов'язаною
  імуносупресією, що дозволяє HHV-8-керований онкогенез. Відновлення
  імунітету через антиретровірусну терапію (АРТ) -- основа лікування;
  АРТ слід почати (або оптимізувати) незалежно від рівня CD4, згідно
  з рекомендаціями DHHS / WHO / IDSA. Сама АРТ може індукувати
  регресію обмеженого, невісцерального шкірного ураження -- хіміо-
  терапія не потрібна першою лінією при обмеженому захворюванні.
  Поширене або вісцеральне захворювання потребує додаткової системної
  хіміотерапії (IND-KAPOSI-1L-VISCERAL-PLD) за умови продовження АРТ.

ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_v0_3_kaposi_treatment
draft_revision: 1

sources:
  - source_id: SRC-NIH-AIDS-2024
    position: supports
  - source_id: SRC-NCCN-SKIN-2025
    position: context
  - source_id: SRC-IARC-MONO-100B-2012
    position: context

known_controversies: []

do_not_do:
  - "Не використовувати ART як єдину терапію при вісцеральному або поширеному ураженні -- потрібна додаткова системна хіміотерапія."
  - "Не переривати АРТ під час подальшого протипухлинного лікування без консультації ВІЛ-спеціаліста."
  - "Не пропускати скринінг лікарських взаємодій перед додаванням будь-якого протипухлинного лікування."

do_not_do_en:
  - "Do not use ART as sole therapy for visceral or extensive disease -- added systemic chemotherapy is required."
  - "Do not interrupt ART during any subsequent cancer treatment without an HIV-specialist consult."
  - "Do not skip drug-drug interaction screening before adding any cancer treatment."

time_critical: false
last_reviewed: "2026-07-11"
reviewers: []
reviewer_signoffs: []
notes: >
  STUB -- new TREATMENT-intent Indication for DIS-KAPOSI (v0.3
  continuation). Distinct from the pre-existing PREVENTION-intent
  IND-CHRONIC-HHV8-PREVENTION-IMMUNE-RESTORATION (targets HHV-8-
  seropositive-but-Kaposi-sarcoma-FREE patients) -- this Indication
  applies to patients with a CONFIRMED Kaposi sarcoma diagnosis. Reuses
  the existing REG-HIV-BIKTARVY Regimen (already authored for
  IND-CHRONIC-HIV-PREVENTION-ART) rather than duplicating an ART
  regimen entity.

  INDEPENDENT REVIEW CORRECTION (2026-07-11): an earlier draft cited
  SRC-NCCN-SKIN-2025 with position "supports". Direct inspection of
  that source's own KB record shows it documents only basal-cell/
  squamous-cell skin cancer, not Kaposi sarcoma or HIV/ART management
  -- downgraded to "context" (general disease-level background, matching
  how dis_kaposi.yaml itself already cites it) rather than removed
  outright, since it is not load-bearing for this indication's actual
  clinical claim (ART is supported by SRC-NIH-AIDS-2024, which is
  genuinely an ARV guideline). Pending two-Clinical-Co-Lead signoff
  (CHARTER §6.1 -- dev-mode-exempted; safe to merge as draft content,
  NOT as published/verified clinical advice).
