id: IND-KAPOSI-1L-IATROGENIC-MTOR-CONVERSION
plan_track: standard
intent: treatment

applicable_to:
  disease_id: DIS-KAPOSI
  line_of_therapy: 1
  stage_requirements:
    - "Iatrogenic (post-transplant) Kaposi sarcoma, histologically confirmed, in a solid-organ transplant recipient on chronic immunosuppression"
    - "Limited/non-visceral disease -- RF-KAPOSI-VISCERAL-EXTENSIVE-DISEASE not triggered"
    - "Extensive or visceral disease -> see IND-KAPOSI-1L-VISCERAL-PLD (systemic chemotherapy added to, not substituted for, immunosuppression rebalance)"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 3

recommended_regimen: REG-SIROLIMUS-KAPOSI-CONVERSION
concurrent_therapy: []
followed_by:
  - IND-KAPOSI-1L-VISCERAL-PLD

evidence_level: moderate
strength_of_recommendation: strong
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: >-
    Conversion from a calcineurin-inhibitor-based to an mTOR-inhibitor
    (sirolimus)-based immunosuppression regimen has documented direct
    anti-Kaposi activity (anti-angiogenic effect plus restored immune
    surveillance) and triggers tumor regression in a meaningful
    fraction of post-transplant Kaposi sarcoma. Extensive or visceral
    disease typically requires added systemic chemotherapy -- see
    IND-KAPOSI-1L-VISCERAL-PLD.

hard_contraindications: []
red_flags_triggering_alternative:
  - RF-KAPOSI-VISCERAL-EXTENSIVE-DISEASE

required_tests:
  - TEST-EXCISIONAL-SKIN-BIOPSY
  - TEST-CBC
  - TEST-LFT
  - TEST-CMP
desired_tests:
  - TEST-CT-CHEST-ABDOMEN-PELVIS

rationale: >
  Iatrogenic Kaposi sarcoma arises from pharmacologic immunosuppression
  permitting HHV-8-driven tumorigenesis in a transplant recipient. The
  first-line intervention is a transplant-team-directed review and
  rebalancing of the immunosuppression regimen -- specifically,
  conversion from a calcineurin-inhibitor-based regimen to an
  mTOR-inhibitor (sirolimus)-based regimen, which has documented direct
  anti-Kaposi activity distinct from simple immunosuppression
  reduction. This MUST be coordinated with the transplant team --
  unilateral oncology-only changes to immunosuppression carry a real
  risk of allograft rejection. Reduction of net immunosuppression to
  the minimum necessary for graft preservation is pursued in parallel
  where graft-safe. Extensive, rapidly progressive, or visceral
  disease is not expected to be adequately controlled by
  immunosuppression rebalancing alone and requires added systemic
  chemotherapy -- see IND-KAPOSI-1L-VISCERAL-PLD.

rationale_ua: >
  Ятрогенна саркома Капоші виникає внаслідок фармакологічної
  імуносупресії у реципієнта трансплантата. Терапія першої лінії --
  перегляд і ребаланс режиму імуносупресії під керівництвом
  транспланталогічної команди, зокрема конверсія з інгібітора
  кальциневрину на режим на основі mTOR-інгібітора (сіролімус). Це
  ОБОВ'ЯЗКОВО координується з транспланталогічною командою --
  самостійні онкологічні зміни несуть реальний ризик відторгнення
  трансплантата. Поширене або вісцеральне захворювання потребує
  додаткової системної хіміотерапії (IND-KAPOSI-1L-VISCERAL-PLD).

