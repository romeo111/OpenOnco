    position: context
  - source_id: SRC-IARC-MONO-100B-2012
    position: context

known_controversies: []

do_not_do:
  - "Не змінювати режим імуносупресії трансплант-реципієнта самостійно, без консиліуму трансплантологічної команди."
  - "Не використовувати конверсію на mTOR-інгібітор як єдину терапію при вісцеральному або поширеному ураженні."
  - "Не припиняти імуносупресію повністю -- мета це ребаланс, а не відміна."

do_not_do_en:
  - "Do not change a transplant recipient's immunosuppression regimen unilaterally, without transplant-team consult."
  - "Do not use mTOR-inhibitor conversion as sole therapy for visceral or extensive disease."
  - "Do not discontinue immunosuppression entirely -- the goal is rebalancing, not withdrawal."

