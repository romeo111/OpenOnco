notes: >
  STUB -- new TREATMENT-intent Indication for DIS-KAPOSI (v0.3
  continuation). Distinct from the pre-existing PREVENTION-intent
  IND-CHRONIC-HHV8-PREVENTION-IMMUNE-RESTORATION -- this Indication
  applies to patients with a CONFIRMED Kaposi sarcoma diagnosis.
  Introduces new Regimen REG-SIROLIMUS-KAPOSI-CONVERSION (reuses the
  existing DRUG-SIROLIMUS entity; see that Regimen's notes for the
  CHARTER §8.3 dosing-gap disclosure).

  INDEPENDENT REVIEW CORRECTION (2026-07-11): an earlier draft cited
  SRC-NCCN-SKIN-2025 with position "supports". That source documents
  only basal-cell/squamous-cell skin cancer (confirmed by direct
  inspection of its own KB record) -- it has no bearing on transplant
  immunosuppression management or mTOR-inhibitor conversion.
  Downgraded to "context" (loose disease-level background only,
  matching how dis_kaposi.yaml itself cites it) rather than removed
  outright, since the core clinical claim (mTOR conversion for
  iatrogenic KS) traces directly to the authoring narrative, not to
  this citation. No source in this KB currently documents the
  transplant-immunosuppression-conversion literature specifically --
  a real, disclosed evidentiary gap. Pending two-Clinical-Co-Lead
  signoff (CHARTER §6.1 -- dev-mode-exempted; safe to merge as draft
  content, NOT as published/verified clinical advice).
