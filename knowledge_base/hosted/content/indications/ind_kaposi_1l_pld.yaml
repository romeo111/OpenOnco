    position: context
  - source_id: SRC-NIH-AIDS-2024
    position: context

known_controversies: []

do_not_do:
  - "Не переривати АРТ під час хіміотерапії PLD при ВІЛ-асоційованій формі."
  - "Не змінювати імуносупресію трансплант-реципієнта без консиліуму трансплантологічної команди навіть під час хіміотерапії."
  - "Не пропускати базову і серійну оцінку ФВЛШ -- кумулятивна кардіотоксичність антрациклінів."
  - "Не розводити PLD у фізіологічному розчині -- руйнує ліпосоми; лише 5% розчин глюкози."

do_not_do_en:
  - "Do not interrupt ART during PLD chemotherapy for the AIDS-associated form."
  - "Do not change a transplant recipient's immunosuppression without transplant-team consult, even during chemotherapy."
  - "Do not skip baseline and serial LVEF assessment -- cumulative anthracycline cardiotoxicity risk."
  - "Do not dilute PLD in normal saline -- disrupts the liposomes; D5W only."

