id: IND-KAPOSI-1L-VISCERAL-PLD
plan_track: standard
intent: treatment

applicable_to:
  disease_id: DIS-KAPOSI
  line_of_therapy: 1
  stage_requirements:
    - "Visceral (pulmonary, GI, or other organ) involvement OR extensive/rapidly progressive mucocutaneous disease (widespread skin lesions, tumor-associated lymphedema, or ulceration) -- RF-KAPOSI-VISCERAL-EXTENSIVE-DISEASE triggered -- of any epidemiologic form (AIDS-associated, iatrogenic, classic, or endemic)"
    - "Continue/optimize form-specific immune restoration concurrently -- ART for AIDS-KS (never interrupt ART for chemotherapy); transplant-team-directed mTOR-inhibitor conversion for iatrogenic KS where graft-safe"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

recommended_regimen: REG-PLD-KAPOSI
concurrent_therapy: []
followed_by:
  - IND-KAPOSI-2L-VISCERAL-PACLITAXEL

evidence_level: moderate
strength_of_recommendation: strong
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: >-
    Pegylated liposomal doxorubicin is FDA-approved for AIDS-related
    Kaposi sarcoma and is the standard first-line systemic chemotherapy
    for extensive/visceral disease of any epidemiologic form. Response
    assessment and duration of therapy are individualized; progression
    or intolerance moves to second-line paclitaxel -- see
    IND-KAPOSI-2L-VISCERAL-PACLITAXEL.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-EXCISIONAL-SKIN-BIOPSY
  - TEST-CT-CHEST-ABDOMEN-PELVIS
  - TEST-CBC
  - TEST-LFT
  - TEST-ECHO
  - TEST-HIV-SEROLOGY
desired_tests:
  - TEST-BRONCHOSCOPY-WITH-EBUS

rationale: >
  Visceral (pulmonary, gastrointestinal, or other organ) involvement,
  or extensive/rapidly progressive mucocutaneous disease, is not
  expected to be adequately controlled by immune restoration or local
  therapy alone in any epidemiologic form of Kaposi sarcoma, and
  requires systemic chemotherapy. Pegylated liposomal doxorubicin (PLD)
  is FDA-approved for AIDS-related Kaposi sarcoma and is the standard
  first-line systemic agent, at 20 mg/m² IV every 2-3 weeks (see
  REG-PLD-KAPOSI). Form-specific immune restoration is continued
  concurrently, not replaced, by chemotherapy: ART must never be
  interrupted for AIDS-KS during chemotherapy; transplant-team-directed
  mTOR-inhibitor conversion continues where graft-safe for iatrogenic
  KS. Baseline and serial LVEF assessment is mandatory before and
  during PLD given anthracycline cardiotoxicity risk. Progression or
  intolerance on PLD moves to second-line paclitaxel -- see
  IND-KAPOSI-2L-VISCERAL-PACLITAXEL.

rationale_ua: >
  Вісцеральне ураження або поширене/швидко прогресуюче мукокутанне
  захворювання не контролюється лише відновленням імунітету чи
  локальною терапією і потребує системної хіміотерапії. Пегільований
  ліпосомальний доксорубіцин (PLD) схвалений FDA для ВІЛ-асоційованої
  саркоми Капоші та є стандартним препаратом першої лінії, у дозі 20
  мг/м² в/в кожні 2-3 тижні (REG-PLD-KAPOSI). Форма-специфічне
  відновлення імунітету триває паралельно з хіміотерапією: АРТ ніколи
  не переривається; конверсія на mTOR-інгібітор триває, де це
  безпечно для трансплантата. Базова і серійна оцінка ФВЛШ
  обов'язкова. Прогресування чи непереносимість PLD -- перехід на
  паклітаксел другої лінії (IND-KAPOSI-2L-VISCERAL-PACLITAXEL).

ukrainian_review_status: pending_clinical_signoff
