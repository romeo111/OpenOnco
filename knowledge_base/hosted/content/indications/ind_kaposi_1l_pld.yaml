notes: >
  STUB -- new TREATMENT-intent Indication for DIS-KAPOSI (v0.3
  continuation), covering visceral/extensive disease of ANY
  epidemiologic form. Introduces new Regimen REG-PLD-KAPOSI (reuses
  the existing DRUG-PEGYLATED-LIPOSOMAL-DOXORUBICIN entity; dosing
  transcribed from that entity's pre-existing typical_dosing field,
  not newly invented -- verified by direct read during independent
  review). `concurrent_therapy` is deliberately left empty rather than
  hard-coding REG-HIV-BIKTARVY or REG-SIROLIMUS-KAPOSI-CONVERSION,
  because this Indication spans ALL epidemiologic forms and only a
  subset needs concurrent form-specific immune-restoration therapy --
  see `rationale` for the form-specific guidance instead.

  INDEPENDENT REVIEW CORRECTION (2026-07-11): an earlier draft cited
  SRC-NCCN-SKIN-2025 with position "supports". That source documents
  only basal-cell/squamous-cell skin cancer (confirmed by direct
  inspection of its own KB record), not Kaposi sarcoma chemotherapy --
  downgraded to "context". SRC-NIH-AIDS-2024 kept as "context" (not
  "supports") because it substantiates the concurrent-ART-continuation
  guidance but not the PLD dosing/chemotherapy content itself, which
  is drawn from the DRUG entity as noted above. Pending two-Clinical-
  Co-Lead signoff (CHARTER §6.1 -- dev-mode-exempted; safe to merge as
  draft content, NOT as published/verified clinical advice).
