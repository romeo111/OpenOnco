id: IND-LARYNGEAL-EARLY-GLOTTIC-1L-RT
plan_track: local_therapy

applicable_to:
  disease_id: DIS-LARYNGEAL
  line_of_therapy: 1
  stage_requirements:
    - "T1-T2N0M0 glottic carcinoma (or highly selected early supraglottic) amenable to either definitive RT or transoral laser microsurgery"
    - "MDT (head & neck surgery + radiation oncology) discussion of both organ-preservation options completed"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

phases:
  - phase: definitive
    type: radiation
    radiation_id: RC-LARYNGEAL-EARLY-GLOTTIC-DEFINITIVE
    duration_weeks: 7

recommended_regimen:
concurrent_therapy: []
followed_by: []

evidence_level: moderate
strength_of_recommendation: strong
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: "~90% local control (comparable to TLM)"

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CT-NECK-THORAX-ABDOMEN-PELVIS
desired_tests: []

rationale: >
  Definitive radiotherapy achieves approximately 90% local control in
  T1-T2N0 glottic squamous cell carcinoma, comparable to transoral
  laser microsurgery (TLM), with voice preservation as the key
  endpoint. RT avoids a surgical procedure and is broadly available
  even where TLM microlaryngoscopy expertise is not, making it the
  more universally accessible organ-preservation option. Choice
  between RT and TLM is driven by tumor accessibility/extent, local
  surgical expertise, and patient preference rather than a proven
  oncologic superiority of either modality.

sources:
  - source_id: SRC-NCCN-HNSCC-2025
    weight: primary

do_not_do:
  - "Do not omit MDT discussion of the TLM alternative before defaulting to RT — the choice is preference/expertise-driven, not oncologically forced."
  - "Do not skip baseline voice/laryngeal function assessment before treatment."

do_not_do_en:
  - "Do not omit MDT discussion of the TLM alternative before defaulting to RT — the choice is preference/expertise-driven, not oncologically forced."
  - "Do not skip baseline voice/laryngeal function assessment before treatment."

