rationale: >
  Transoral laser microsurgery achieves approximately 90% local
  control with voice preservation in T1-T2N0 glottic SCC, a
  single-modality surgical alternative to definitive RT that avoids a
  6-7 week course of radiotherapy. Requires adequate transoral
  exposure and center expertise. Salvage RT remains available for
  local recurrence, preserving radiotherapy as a future treatment
  option — a sequencing advantage over starting with RT.

sources:
  - source_id: SRC-NCCN-HNSCC-2025
    weight: primary

do_not_do:
  - "Do not perform TLM without adequate transoral exposure and visualization of tumor margins — poor exposure increases positive-margin risk."
  - "Do not omit MDT discussion of definitive RT as an equally effective alternative."

