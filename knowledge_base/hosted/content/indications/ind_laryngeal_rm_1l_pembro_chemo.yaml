id: IND-LARYNGEAL-RM-1L-PEMBRO-CHEMO
plan_track: standard

applicable_to:
  disease_id: DIS-LARYNGEAL
  line_of_therapy: 1
  stage_requirements:
    - "Recurrent / metastatic laryngeal SCC, not amenable to curative-intent local therapy"
  biomarker_requirements_required:
    - biomarker_id: BIO-PDL1-CPS
      value_constraint: "CPS ≥1"
      required: true
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 1

recommended_regimen: REG-PEMBRO-CHEMO-HNSCC-1L
concurrent_therapy: []
followed_by: []

evidence_level: high
strength_of_recommendation: strong
nccn_category: "1"

expected_outcomes:
  overall_response_rate: "~36% (KEYNOTE-048 chemo-IO arm)"
  progression_free_survival: "Median ~5 months"
  overall_survival_5y: "Median OS 13.6 mo (vs 10.4 mo EXTREME); 24-mo OS ~29%"

hard_contraindications: []
red_flags_triggering_alternative:
  - RF-HNSCC-INFECTION-SCREENING
  - RF-HNSCC-ORGAN-DYSFUNCTION
required_tests:
  - TEST-PDL1-IHC
desired_tests: []

rationale: >
  Pembrolizumab + 5-FU + platinum is the preferred 1L for recurrent /
  metastatic laryngeal SCC (a HNSCC subsite) with PD-L1 CPS ≥1 per
  KEYNOTE-048 — superior OS vs EXTREME with similar tolerability.
  Cisplatin is preferred over carboplatin when feasible; carboplatin
  is the practical default for elderly / renal-impaired / neuropathy /
  hearing-loss patients. CPS ≥20 patients have the option of
  pembrolizumab monotherapy (alternative indication). Mirrors
  IND-HNSCC-RM-1L-PEMBRO-CHEMO — laryngeal R/M shares the identical
  systemic-therapy evidence base as broader HNSCC.

sources:
  - source_id: SRC-NCCN-HNSCC-2025
    weight: primary
  - source_id: SRC-KEYNOTE-048-BURTNESS-2019
    position: supports

do_not_do:
  - "Do NOT initiate immunotherapy without confirmed PD-L1 CPS testing on representative tumor tissue (biopsy preferred)."
  - "Do NOT use cisplatin in patients with GFR <60, gr ≥2 hearing loss, gr ≥2 neuropathy, or significant CHF — switch to carboplatin AUC 5."
  - "Do NOT continue pembrolizumab through gr ≥3 immune-related AE without high-dose corticosteroid initiation + multidisciplinary irAE management."

do_not_do_en:
  - "Do NOT initiate immunotherapy without confirmed PD-L1 CPS testing on representative tumor tissue (biopsy preferred)."
  - "Do NOT use cisplatin in patients with GFR <60, gr ≥2 hearing loss, gr ≥2 neuropathy, or significant CHF — switch to carboplatin AUC 5."
  - "Do NOT continue pembrolizumab through gr ≥3 immune-related AE without high-dose corticosteroid initiation + multidisciplinary irAE management."

time_critical: false
last_reviewed: "2026-07-11"
reviewers: []
