id: IND-LARYNGEAL-RM-1L-PEMBRO-MONO-CPS-HIGH
plan_track: aggressive

applicable_to:
  disease_id: DIS-LARYNGEAL
  line_of_therapy: 1
  stage_requirements:
    - "Recurrent / metastatic laryngeal SCC, not amenable to curative-intent local therapy"
  biomarker_requirements_required:
    - biomarker_id: BIO-PDL1-CPS
      value_constraint: "CPS ≥20"
      required: true
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

recommended_regimen: REG-PEMBRO-MONO-HNSCC-1L
concurrent_therapy: []
followed_by: []

evidence_level: high
strength_of_recommendation: strong
nccn_category: "1"

expected_outcomes:
  overall_response_rate: "~23% (KEYNOTE-048 mono CPS ≥20)"
  progression_free_survival: "Median ~3.4 mo (selection bias toward responders has long tail)"
  overall_survival_5y: "Median OS 14.9 mo (vs 10.7 mo EXTREME); 24-mo OS ~35%"

hard_contraindications: []
red_flags_triggering_alternative:
  - RF-HNSCC-INFECTION-SCREENING
  - RF-HNSCC-ORGAN-DYSFUNCTION
required_tests:
  - TEST-PDL1-IHC
desired_tests: []

rationale: >
  Pembrolizumab monotherapy in PD-L1 CPS ≥20 recurrent/metastatic
  laryngeal SCC achieves equivalent OS to chemo-IO with substantially
  less toxicity — KEYNOTE-048 — and is preferred for elderly,
  comorbid, or fitness-limited patients with high-CPS tumors. Patients
  with rapid progression / visceral crisis at 1L assessment should
  receive chemo-IO instead. Mirrors IND-HNSCC-RM-1L-PEMBRO-MONO-CPS-
  HIGH — laryngeal R/M shares the identical systemic-therapy evidence
  base as broader HNSCC.

sources:
  - source_id: SRC-NCCN-HNSCC-2025
    weight: primary
  - source_id: SRC-KEYNOTE-048-BURTNESS-2019
    position: supports

do_not_do:
  - "Do NOT use pembrolizumab monotherapy in CPS <20 — chemo-IO or EXTREME is preferred."
  - "Do NOT use pembrolizumab monotherapy as 1L in rapidly progressive / visceral-crisis disease — early progression risk before IO kinetics establish."
  - "Do NOT continue pembrolizumab through gr ≥3 immune-related AE without high-dose corticosteroid initiation + multidisciplinary irAE management."

do_not_do_en:
  - "Do NOT use pembrolizumab monotherapy in CPS <20 — chemo-IO or EXTREME is preferred."
  - "Do NOT use pembrolizumab monotherapy as 1L in rapidly progressive / visceral-crisis disease — early progression risk before IO kinetics establish."
  - "Do NOT continue pembrolizumab through gr ≥3 immune-related AE without high-dose corticosteroid initiation + multidisciplinary irAE management."

time_critical: false
last_reviewed: "2026-07-11"
reviewers: []
reviewer_signoffs: []
notes: >
  STUB pending Clinical Co-Lead sign-off (CHARTER §6.1). Mirrors
  IND-HNSCC-RM-1L-PEMBRO-MONO-CPS-HIGH field-for-field. Reuses
  REG-PEMBRO-MONO-HNSCC-1L and DRUG-PEMBROLIZUMAB unchanged — no new
  Regimen or Drug authored.
