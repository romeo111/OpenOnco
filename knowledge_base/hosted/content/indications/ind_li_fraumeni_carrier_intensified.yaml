do_not_do:
  - "Не рекомендувати RRM без консультації психолога та фахівця з питань фертильності."
  - "Не використовувати WB-MRI кожні 6 місяців без доступу до радіолога з досвідом інтерпретації LFS-асоційованих змін — інтерпретація потребує спеціалізованої експертизи."

do_not_do_en:
  - "Do not recommend RRM without psychological + fertility consultation."
  - "Do not use q6mo WB-MRI without access to LFS-experienced radiology — interpretation requires expertise."

