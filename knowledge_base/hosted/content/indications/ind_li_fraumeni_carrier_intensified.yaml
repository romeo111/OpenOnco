evidence_level: moderate
strength_of_recommendation: conditional
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: "Intensified surveillance with q6mo WB-MRI + discussion of risk-reducing mastectomy (RRM) in TP53 carriers entering reproductive age: RRM eliminates ~95% of breast cancer incidence. Trade-off vs. body-image / fertility / pregnancy considerations."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-LI-FRAUMENI-CARRIER-SURVEILLANCE. Intensified
  surveillance with q6 month WB-MRI + risk-reducing mastectomy (RRM) discussion
  for women at reproductive milestone. Per CHARTER §11 — aggressive intervention
  requires shared decision-making.

rationale_ua: >
  Альтернативний шлях, супутній до IND-LI-FRAUMENI-CARRIER-SURVEILLANCE.
  Інтенсифіковане спостереження з МРТ усього тіла (WB-MRI) кожні
  6 місяців + обговорення профілактичної мастектомії (RRM) для жінок,
  які досягли репродуктивного віку. Відповідно до CHARTER §11 —
  агресивне втручання потребує спільного прийняття рішення.

