do_not_do:
  - "Не використовувати мамографію як основний метод скринінгу молочної залози у жінок-носіїв TP53 — ризик радіаційно-індукованого раку; переважний метод — МРТ."
  - "Не призначати лікувальну променеву терапію носіям TP53 без консультації профільного спеціаліста — ризик радіаційно-індукованого вторинного злоякісного новоутворення надзвичайно високий."
  - "Не пропускати педіатричне спостереження — адренокортикальна карцинома та карцинома судинного сплетення виникають у ранньому дитинстві."

do_not_do_en:
  - "Do not use mammography as primary breast screening in TP53 women — radiation-induced risk; MRI preferred."
  - "Do not prescribe therapeutic radiation in TP53 carriers without specialist consultation — radiation-induced secondary malignancy risk is extremely high."
  - "Do not skip pediatric surveillance — adrenocortical carcinoma + choroid plexus carcinoma occur in early childhood."

