nccn_category: "1"

expected_outcomes:
  overall_response_rate: "Alcohol cessation in heavy drinkers reduces HCC incidence by ~50% over 10 years post-cessation in those without established cirrhosis. Head + neck + esophageal SCC incidence reduction follows cessation with similar lag. Breast cancer risk in women does not return to baseline but cessation prevents incremental dose-dependent risk increase."

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
  - TEST-LFT
desired_tests:
  - TEST-LDH

rationale: >
  Standard-track prevention pathway for heavy alcohol use. Components:

  **(1) Structured cessation / moderation counseling** — brief intervention by
  primary clinician + referral to addiction-medicine specialist if dependence.
  AUDIT-C screening + motivational interviewing.

  **(2) Pharmacotherapy for alcohol use disorder** (per AAP / SAMHSA):
  - Naltrexone (oral or extended-release IM) — first-line
  - Acamprosate — alternative; renal-adjusted dosing
  - Disulfiram — only with reliable adherence support
  - Off-label: gabapentin, topiramate, ondansetron

  **(3) Liver disease evaluation** — FIB-4 + transient elastography for staging
  alcohol-related liver disease. If cirrhosis confirmed → HCC surveillance
  (US + AFP q6mo per AASLD) — routes to broader HCC-surveillance pathway.

  **(4) Targeted cancer screening** — endoscopy for heavy-drinking + tobacco-
  using cohort to evaluate esophageal SCC risk. Breast cancer screening per
  USPSTF cadence for women.

  Combined cessation + targeted screening produces meaningful cancer-
  incidence reduction in heavy-drinking cohorts.

rationale_ua: >
  Стандартний шлях профілактики для осіб із важким вживанням алкоголю.

  **(1) Структуроване припинення вживання алкоголю або зменшення його
  кількості** — коротке мотиваційне втручання лікарем первинної ланки +
  направлення до фахівця з адиктології при формуванні залежності.
  Скринінг за AUDIT-C + мотиваційне інтерв'ю.

  **(2) Фармакотерапія розладу вживання алкоголю** — налтрексон
  (перорально або у вигляді пролонгованої ін'єкційної форми) є
  препаратом першої лінії; акампрозат (acamprosate) — альтернатива з
  корекцією дози при нирковій недостатності; дисульфірам (disulfiram)
  — лише за умови надійної підтримки прихильності до лікування.
  Поза зареєстрованими показаннями (off-label): габапентин, топірамат,
  ондансетрон.

  **(3) Оцінка захворювання печінки** — FIB-4 + транзієнтна
  еластографія для стадіювання алкогольної хвороби печінки. При
  підтвердженому цирозі → спостереження щодо HCC (УЗД + AFP кожні
  6 місяців згідно з AASLD).

  **(4) Цілеспрямований онкологічний скринінг** — ендоскопія для
  когорти з важким вживанням алкоголю та тютюну (оцінка ризику
  плоскоклітинного раку стравоходу). Скринінг раку молочної залози за
  графіком USPSTF для жінок.

  Поєднання припинення вживання алкоголю з цілеспрямованим скринінгом
  забезпечує суттєве зниження захворюваності на рак у когортах із
  важким вживанням алкоголю.

