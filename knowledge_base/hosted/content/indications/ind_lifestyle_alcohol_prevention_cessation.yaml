do_not_do:
  - "Не пропускати оцінку FIB-4 / фіброзу в осіб з важким вживанням алкоголю — безсимптомний цироз є поширеним явищем."
  - "Не використовувати дисульфірам (disulfiram) у пацієнтів з ішемічною хворобою серця — кардіотоксична взаємодія з алкоголем."
  - "Не очікувати повернення ризику раку молочної залози до вихідного рівня — припинення вживання алкоголю лише запобігає подальшому дозозалежному зростанню ризику."
  - "Не ігнорувати синергію алкоголю і тютюну — одночасне припинення обох звичок ефективніше, ніж припинення кожної окремо."

do_not_do_en:
  - "Do not skip FIB-4 / fibrosis assessment in heavy drinkers — silent cirrhosis is common."
  - "Do not use disulfiram in patients with coronary artery disease (cardiotoxic interaction with alcohol)."
  - "Do not expect breast cancer risk reduction to baseline — cessation prevents incremental risk."
  - "Do not ignore alcohol-tobacco synergy — combined cessation more impactful than either alone."

