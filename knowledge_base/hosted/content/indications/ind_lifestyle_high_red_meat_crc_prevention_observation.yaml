do_not_do:
  - "Не подавати спостереження як еквівалент дієтичного втручання — зниження захворюваності на CRC при цьому не досягається."
  - "Не пропускати скринінг CRC — базовий графік USPSTF залишається показаним незалежно від дієтичного статусу пацієнта."
  - "Не виключати коротке дієтичне консультування на кожному візиті — повторний вплив має кумулятивний поведінковий ефект."

do_not_do_en:
  - "Do not present observation as equivalent to dietary intervention — CRC incidence reduction is not achieved."
  - "Do not skip CRC screening — base-rate USPSTF cadence remains indicated regardless of dietary status."
  - "Do not skip brief dietary counseling at every visit — repeated exposure has cumulative behavioral effect."

