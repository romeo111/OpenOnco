evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: "Continued high red/processed meat consumption: baseline CRC incidence elevated proportional to intake. Age-appropriate screening alone captures earlier-stage disease but does not reduce incidence."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests: []
desired_tests: []

rationale: >
  Alternative-track companion to IND-LIFESTYLE-HIGH-RED-MEAT-CRC-
  PREVENTION-SUBSTITUTION. Patient declines structured dietary
  modification (cultural, preference, food-environment constraints) —
  receives USPSTF-cadence CRC screening + brief dietary counseling
  with each clinical contact. Per CHARTER §11 patient-autonomy framing
  — dietary choice is legitimate but framed as suboptimal vs. reduced-
  intake comparator. Periodic re-discussion of substitution track at
  follow-up visits is appropriate.

rationale_ua: >
  Альтернативний шлях, супутній до
  IND-LIFESTYLE-HIGH-RED-MEAT-CRC-PREVENTION-SUBSTITUTION. Пацієнт
  відмовляється від структурованої дієтичної модифікації (культурні
  причини, особисті переваги, обмеження харчового середовища) —
  отримує скринінг CRC за графіком USPSTF та коротке дієтичне
  консультування на кожному клінічному контакті. Відповідно до
  CHARTER §11 (принцип автономії пацієнта) — дієтичний вибір є
  правомірним, але розглядається як менш оптимальний порівняно зі
  зниженням споживання. Періодичне повторне обговорення шляху заміни
  продуктів є доречним на повторних візитах.

