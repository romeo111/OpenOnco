do_not_do:
  - "Не подавати чай/каву як такі канцерогенними — значення має лише температура; типові для західних країн температури вживання з цим не пов'язані."
  - "Не використовувати соломинку для дуже гарячих напоїв — це концентрує термічне ушкодження."
  - "Не призначати рутинну ендоскопію всім, хто споживає гарячі напої, у популяціях з низькою захворюваністю — діагностична цінність низька."
  - "Не відкладати ендоскопічне обстеження при ранній дисфагії у пацієнтів, які споживають гарячі напої та вживають алкоголь/тютюн."

do_not_do_en:
  - "Do not present tea/coffee per se as carcinogenic — only the temperature matters; typical Western temperatures are not associated."
  - "Do not use straws for very hot drinks — they concentrate thermal injury at posterior pharynx/upper esophagus."
  - "Do not order routine endoscopy for all hot-beverage consumers in low-incidence populations — yield is poor."
  - "Do not delay endoscopic workup for early dysphagia in hot-beverage + alcohol/tobacco-exposed patients."

