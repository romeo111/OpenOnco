do_not_do:
  - "Не подавати спостереження як еквівалент втручання щодо охолодження напоїв — зниження захворюваності на ESCC при цьому не досягається."
  - "Не пропускати скринінг щодо вживання алкоголю та тютюну — важливо враховувати їхній синергічний вплив на ризик."
  - "Не відкладати ендоскопічне обстеження при ранній дисфагії."
  - "Не нормалізувати споживання гарячих напоїв як культурно незмінну практику — пояснювати пацієнту, що значення має саме температура напою, а не його тип."

do_not_do_en:
  - "Do not present observation as equivalent to cooling intervention — ESCC incidence reduction is not achieved."
  - "Do not skip alcohol + tobacco screening — synergistic compound risk is important to address."
  - "Do not delay endoscopic workup for early dysphagia."
  - "Do not normalize hot-beverage consumption as culturally fixed — counsel that temperature, not beverage type, is what matters."

