rationale: >
  Alternative-track companion to IND-LIFESTYLE-HOT-BEVERAGES-PREVENTION-
  COOLING. Patient declines temperature modification (cultural ritual,
  preference) — receives co-modifiable risk factor screening (alcohol,
  tobacco) + symptom-vigilance education (dysphagia, odynophagia,
  unexplained weight loss → immediate workup) + brief intervention with
  each clinical contact. Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Альтернативний трек-супутник до IND-LIFESTYLE-HOT-BEVERAGES-PREVENTION-
  COOLING. Пацієнт відмовляється від зміни температури напоїв (культурний
  ритуал, особисті вподобання) — отримує скринінг супутніх факторів
  ризику (алкоголь, тютюн) та навчання щодо настороженості до симптомів
  (дисфагія, одинофагія, незрозуміла втрата ваги → негайне обстеження),
  а також коротке втручання при кожному клінічному контакті. Відповідно
  до принципу автономії пацієнта за CHARTER §11.

