rationale: >
  Standard-track prevention pathway for individuals with regular maté
  consumption at ≥65°C who do not have a current esophageal-cancer
  diagnosis. Two parallel interventions:

  **(1) Beverage-temperature counseling.** Highest-impact modifiable
  lever. Target: sustained consumption at <60°C. Practical
  recommendations: (a) allow several minutes of cooling after pouring,
  (b) use a thermometer or test by touch / sip-test before drinking,
  (c) prepare with cooler water (~70-80°C steeping then allow further
  cooling before sipping), (d) avoid drinking directly from the bombilla
  immediately after refilling. Frame as a culturally-respectful
  modification — maté itself is NOT discouraged; the carcinogenic
  exposure is the thermal injury. Pair with co-exposure counseling:
  tobacco cessation and alcohol-moderation counseling, because the
  maté-ESCC association is strongest in tobacco / alcohol co-exposed
  individuals (multiplicative interactions documented in southern
  South American case-control studies).

  **(2) Targeted ESCC surveillance — symptom-triggered evaluation.**
  No imaging modality has RCT-grade evidence for routine ESCC
  screening in this cohort (NCCN ESCC guidelines do NOT recommend
  general-population endoscopy for very-hot-beverage consumers).
  Instead: low threshold for upper endoscopy (EGD) at first
  presentation of dysphagia, odynophagia, retrosternal discomfort,
  unintended weight loss, or iron-deficiency anemia. For individuals
  with clustering risk factors (very-hot maté + heavy tobacco + heavy
  alcohol + age >50 + first-degree family history), case-by-case
  consideration of baseline EGD at age 50-60 is reasonable per NCCN
  category 2B — not a routine recommendation.

  Resource access in Ukraine: maté-drinking is uncommon outside
  diaspora communities; counseling can be brief and informational.
  Upper endoscopy widely available at gastroenterology centers
  (~2000-4500 UAH). Tobacco-cessation pharmacotherapy (varenicline,
  bupropion, NRT) pharmacy-accessible without НСЗУ reimbursement.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з регулярним споживанням
  матэ при ≥65°C, які не мають поточного діагнозу esophageal cancer.
  Два паралельні втручання:

  **(1) Beverage-temperature counseling.** Найвпливовіший модифікуючий
  важіль. Ціль: sustained consumption при <60°C. Практичні рекомендації:
  (a) дати декілька хвилин охолодження після наливання, (b) використати
  термометр або touch / sip-test перед drinking, (c) готувати з
  cooler water (~70-80°C steeping, потім охолодження перед sipping),
  (d) уникати drinking безпосередньо з bombilla після refilling.
  Формулювати як culturally-respectful модифікацію — матэ САМ ПО СОБІ
  НЕ обмежується; канцерогенна експозиція — thermal injury. Пара з
  co-exposure counseling: припинення куріння та alcohol-moderation
  counseling, оскільки матэ-ESCC асоціація — найсильніша в tobacco /
  alcohol co-exposed (multiplicative interactions в case-control
  studies південної Південної Америки).

  **(2) Targeted ESCC surveillance — symptom-triggered evaluation.**
  Жодна imaging modality НЕ має RCT-grade evidence для рутинного
  ESCC скринінгу в цій когорті (NCCN ESCC guidelines НЕ рекомендують
  general-population endoscopy для very-hot-beverage consumers).
  Натомість: низький поріг для upper endoscopy (EGD) при першій
  presentation дисфагії, одинофагії, retrosternal discomfort,
  unintended weight loss, або iron-deficiency anemia. Для осіб з
  clustering ризик-факторів (very-hot маті + heavy tobacco + heavy
  alcohol + age >50 + first-degree family history) — case-by-case
  consideration baseline EGD при 50-60 років per NCCN category 2B.

  Доступ до ресурсів в Україні: матэ-споживання — рідкісне поза
  діаспорою; counseling може бути brief informational. Upper endoscopy
  (~2000-4500 грн). Tobacco-cessation pharmacotherapy аптечно-доступна
  без НСЗУ.

