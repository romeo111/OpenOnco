expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: beverage-temperature counseling targets sustained
    consumption at <60°C (allow several minutes of cooling, use cooler
    water in traditional preparation, avoid drinking immediately after
    pouring). IARC 2016 monograph notes that population-level shifts
    away from drinking-at-scalding-temperatures correlate with reduced
    ESCC incidence in cohort and ecological studies. Effect size in
    a single individual is modest in absolute terms — relative ESCC
    risk reduction ~30-50% if temperature dropped from ≥65°C to <60°C,
    against a low absolute baseline incidence outside high-ESCC-
    incidence regions. For diaspora individuals from southern South
    America the absolute baseline is higher and the projected absolute
    risk reduction is more meaningful. Symptom-triggered evaluation
    (dysphagia, odynophagia, weight loss) supplements temperature
    counseling.

