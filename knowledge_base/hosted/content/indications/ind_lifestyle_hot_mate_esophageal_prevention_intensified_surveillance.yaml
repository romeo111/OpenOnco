      referrals under multidisciplinary review at academic centers."

do_not_do:
  - "Не приписувати cessation матэ-споживання — канцероген є thermal injury, не маті per se; counseling має targetувати temperature."
  - "Не презентувати beverage-temperature counseling як high-certainty ESCC-prevention інтервенцію — IARC Group 2A probable evidence не еквівалентна Group 1."
  - "Не пропускати tobacco/alcohol co-exposure counseling — матэ-ESCC асоціація — найсильніша в co-exposed cohort з multiplicative interactions."
  - "Не призначати рутинний baseline EGD для very-hot маті споживачів без clustering інших ризик-факторів — NCCN ESCC guidelines не підтримують general-population screening."

do_not_do_en:
  - "Do not prescribe cessation of maté drinking — the carcinogen is thermal injury, not maté per se; counseling must target temperature."
  - "Do not present beverage-temperature counseling as a high-certainty ESCC-prevention intervention — IARC Group 2A probable evidence is not equivalent to Group 1."
  - "Do not skip tobacco / alcohol co-exposure counseling — the maté-ESCC association is strongest in the co-exposed cohort with multiplicative interactions."
  - "Do not order routine baseline EGD for very-hot-maté drinkers without clustering of other risk factors — NCCN ESCC guidelines do not support general-population screening."

