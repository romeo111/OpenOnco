rationale: >
  Alternative-track companion to IND-LIFESTYLE-HOT-MATE-ESOPHAGEAL-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Patient with regular maté
  consumption at ≥65°C who declines structured beverage-temperature
  counseling — for any reason (deeply held cultural / culinary
  practice, skepticism toward the IARC 2A probable-evidence framing,
  preference for less-interventional pathway) — is offered routine
  general-population pathway only:

  **ESCC screening:** None — no general-population screening modality
  is recommended by NCCN or USPSTF for the very-hot-beverage cohort
  outside high-baseline-incidence regions. Symptom-triggered upper
  endoscopy remains the standard.

  **Beverage-temperature counseling:** Brief informational disclosure
  of IARC 2A classification only; no structured counseling visit is
  scheduled. Patient is offered re-discussion at any future visit.

  **Co-exposure counseling:** Tobacco-cessation + alcohol-moderation
  counseling is still offered regardless of beverage-temperature track
  choice — these are independent risk factors for ESCC and the
  multiplicative interaction means tobacco/alcohol cessation provides
  large benefit even if maté-temperature is unchanged.

  **Symptom-triggered evaluation:** Low threshold for upper endoscopy
  at first presentation of dysphagia, odynophagia, retrosternal
  discomfort, unintended weight loss, or iron-deficiency anemia.

  Routing reconsiderations: patient may revisit intensified pathway
  at any subsequent visit; this Indication does not preclude future
  escalation. Per CHARTER §11 patient-autonomy framing: cultural
  beverage practices are a shared-decision-making domain particularly
  when the underlying evidence is IARC Group 2A (probable).

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-LIFESTYLE-HOT-
  MATE-ESOPHAGEAL-PREVENTION-INTENSIFIED-SURVEILLANCE. Пацієнт з
  регулярним матэ-споживанням при ≥65°C, який відмовляється від
  структурованого beverage-temperature counseling (deeply held
  cultural / culinary practice, скептицизм щодо IARC 2A probable-
  evidence framing), отримує тільки рутинний загальнопопуляційний
  шлях:

  **ESCC скринінг:** Немає — жодна general-population modality НЕ
  рекомендується NCCN/USPSTF для very-hot-beverage cohort поза
  high-baseline-incidence регіонами. Symptom-triggered upper endoscopy
  залишається стандартом.

  **Beverage-temperature counseling:** Brief informational disclosure
  IARC 2A класифікації; структурований counseling-візит НЕ запланований.
  Re-discussion на будь-якому майбутньому візиті.

  **Co-exposure counseling:** Tobacco-cessation + alcohol-moderation
  counseling — все ще пропонується незалежно від beverage-temperature
  track вибору; multiplicative interaction означає, що cessation
  tobacco / alcohol дає large benefit навіть якщо matе-temperature
  не змінено.

  **Symptom-triggered оцінка:** Низький поріг для upper endoscopy
  при першій presentation дисфагії, одинофагії, retrosternal discomfort,
  weight loss, або iron-deficiency anemia.

  Reroute: пацієнт може повернутися до інтенсифікованого шляху на
  будь-якому подальшому візиті. Per CHARTER §11 — shared-decision-making
  domain особливо при IARC Group 2A (probable) evidence та культурних
  beverage practices.

