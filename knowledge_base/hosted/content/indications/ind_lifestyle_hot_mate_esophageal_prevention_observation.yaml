do_not_do:
  - "Не презентувати observation як еквівалент beverage-temperature counseling — culturally-respectful temperature інтервенція залишається preferred."
  - "Не ігнорувати alarm features (дисфагія, одинофагія, weight loss, iron-deficiency anemia) — immediate upper endoscopy + multidisciplinary review."
  - "Не призначати general-population endoscopy для very-hot маті споживачів без alarm features чи clustering інших ризик-факторів."
  - "Не пропускати tobacco/alcohol co-exposure counseling — multiplicative interaction зі thermal injury робить ці інтервенції high-impact незалежно від маті-track."

do_not_do_en:
  - "Do not present observation as equivalent to beverage-temperature counseling — culturally-respectful temperature intervention remains the preferred recommendation."
  - "Do not ignore alarm features (dysphagia, odynophagia, weight loss, iron-deficiency anemia) — immediate upper endoscopy + multidisciplinary review."
  - "Do not order general-population endoscopy for very-hot-maté drinkers without alarm features or clustering of other risk factors."
  - "Do not skip tobacco / alcohol co-exposure counseling — multiplicative interaction with thermal injury makes these interventions high-impact regardless of maté-track choice."

