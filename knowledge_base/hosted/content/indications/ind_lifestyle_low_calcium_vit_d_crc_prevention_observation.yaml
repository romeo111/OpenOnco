rationale: >
  Alternative-track companion to IND-LIFESTYLE-LOW-CALCIUM-VIT-D-CRC-
  PREVENTION-REPLETION. Patient declines structured repletion (cost,
  preference, lactose intolerance with dairy avoidance + supplement
  declination, supplement intolerance) — receives USPSTF-cadence CRC
  screening + brief dietary counseling with each clinical contact +
  reaffirmation of skeletal-health implications. Per CHARTER §11
  patient-autonomy framing — dietary / supplementation choice is
  legitimate but framed as suboptimal vs. RDA-target comparator.
  Periodic re-discussion of repletion track at follow-up visits is
  appropriate, especially with age-related fracture-risk progression.

rationale_ua: >
  Альтернативний трек-супутник до IND-LIFESTYLE-LOW-CALCIUM-VIT-D-CRC-
  PREVENTION-REPLETION. Пацієнт відмовляється від структурованого
  поповнення дефіциту (вартість, особисті вподобання, непереносимість
  лактози з уникненням молочних продуктів та відмовою від добавок,
  непереносимість добавок) — отримує скринінг колоректального раку за
  схемою USPSTF, коротке дієтичне консультування при кожному клінічному
  контакті та повторне роз'яснення наслідків для стану кісткової
  тканини. Відповідно до принципу автономії пацієнта за CHARTER §11.
  Періодичне повторне обговорення треку поповнення дефіциту на
  контрольних візитах є доцільним, особливо з огляду на вікове
  наростання ризику переломів.

