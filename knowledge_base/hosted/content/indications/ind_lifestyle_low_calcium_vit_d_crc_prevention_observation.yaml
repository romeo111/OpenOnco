do_not_do:
  - "Не подавати спостереження як еквівалент поповнення дефіциту — переваги щодо зниження захворюваності на колоректальний рак і стану кісткової тканини при цьому не досягаються."
  - "Не пропускати скринінг колоректального раку — базова періодичність за схемою USPSTF залишається показаною незалежно від статусу поповнення дефіциту."
  - "Не виключати коротке дієтичне консультування при кожному візиті — повторний вплив має кумулятивний поведінковий ефект."
  - "Не ігнорувати моніторинг ризику переломів (DEXA, FRAX) — дефіцит вітаміну D/кальцію має додаткові наслідки для стану кісткової тканини."

do_not_do_en:
  - "Do not present observation as equivalent to repletion — CRC incidence + skeletal benefits are not achieved."
  - "Do not skip CRC screening — base-rate USPSTF cadence remains indicated regardless of status."
  - "Do not skip brief dietary counseling at every visit — repeated exposure has cumulative behavioral effect."
  - "Do not ignore fracture-risk monitoring (DEXA, FRAX) — vitamin D / calcium deficiency has additional skeletal implications."

