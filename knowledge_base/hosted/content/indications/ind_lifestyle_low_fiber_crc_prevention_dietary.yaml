do_not_do:
  - "Не подавати дієтичне консультування як заміну колоноскопічному скринінгу — обидва втручання є взаємодоповнюючими."
  - "Не призначати агресивне нарощування клітковини — поступове збільшення мінімізує шлунково-кишкову непереносимість і покращує прихильність до лікування."
  - "Не покладатися лише на добавки клітковини (наприклад, псиліум) замість клітковини з цільних продуктів — ефекти на мікробіом і матричні ефекти їжі недосяжні за допомогою ізольованих добавок."
  - "Не ігнорувати культурні чи економічні обмеження — багаті на клітковину цільні продукти можуть бути недоступними; консультування має бути реалістичним."

do_not_do_en:
  - "Do not present dietary counseling as a substitute for colonoscopy screening — both interventions are complementary."
  - "Do not prescribe aggressive fibre escalation — gradual progression minimizes GI intolerance and improves adherence."
  - "Do not rely on fibre supplements (psyllium alone) as a substitute for whole-food fibre — microbiome + matrix effects are not reproduced by isolated supplements."
  - "Do not ignore cultural / economic constraints — fibre-rich whole foods may be inaccessible; counseling must be feasible."

