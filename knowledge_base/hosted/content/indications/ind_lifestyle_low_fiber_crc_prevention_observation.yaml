nccn_category: "2B"

expected_outcomes:
  overall_response_rate: "Continued low dietary fibre intake: baseline CRC incidence elevated proportional to intake gap. Age-appropriate screening alone captures earlier-stage disease but does not reduce incidence. Cardiovascular and metabolic co-morbidity risk also unaddressed."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests: []
desired_tests: []

rationale: >
  Alternative-track companion to IND-LIFESTYLE-LOW-FIBER-CRC-PREVENTION-
  DIETARY. Patient declines structured dietary modification (cultural,
  preference, economic, food-environment constraints) — receives
  USPSTF-cadence CRC screening + brief dietary counseling with each
  clinical contact. Per CHARTER §11 patient-autonomy framing — dietary
  choice is legitimate but framed as suboptimal vs. fibre-target
  comparator. Periodic re-discussion of dietary track at follow-up
  visits is appropriate.

rationale_ua: >
  Альтернативний трек-супутник до IND-LIFESTYLE-LOW-FIBER-CRC-
  PREVENTION-DIETARY. Пацієнт відмовляється від структурованої зміни
  харчування (культурні, особисті, економічні причини, обмеження
  харчового середовища) — отримує скринінг колоректального раку за
  схемою USPSTF та коротке дієтичне консультування при кожному
  клінічному контакті. Відповідно до принципу автономії пацієнта за
  CHARTER §11. Періодичне повторне обговорення дієтичного треку на
  контрольних візитах є доцільним.

