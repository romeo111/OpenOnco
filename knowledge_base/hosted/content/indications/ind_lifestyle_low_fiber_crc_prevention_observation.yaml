do_not_do:
  - "Не подавати спостереження як еквівалент дієтичного втручання — зниження захворюваності на колоректальний рак при цьому не досягається."
  - "Не пропускати скринінг колоректального раку — базова періодичність за схемою USPSTF залишається показаною незалежно від харчового статусу."
  - "Не виключати коротке дієтичне консультування при кожному візиті — повторний вплив має кумулятивний поведінковий ефект."

do_not_do_en:
  - "Do not present observation as equivalent to dietary intervention — CRC incidence reduction is not achieved."
  - "Do not skip CRC screening — base-rate USPSTF cadence remains indicated regardless of dietary status."
  - "Do not skip brief dietary counseling at every visit — repeated exposure has cumulative behavioral effect."

