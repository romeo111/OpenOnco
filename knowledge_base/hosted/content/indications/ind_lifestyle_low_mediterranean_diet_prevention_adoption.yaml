rationale: >
  Standard-track prevention pathway for low Mediterranean-diet
  adherence. Components per PREDIMED + EPIC + NHS evidence base + ACS
  2020 Diet + Physical Activity Guideline + NCCN Colon Cancer screening:

  **(1) Mediterranean dietary-pattern counseling** — Target adherence
  to all 9 MDS components or MEDAS ≥10/14. Key behaviors:
  - Olive oil as primary culinary fat — ≥4 tablespoons/day extra-virgin
    where economically feasible
  - Vegetables — ≥3 servings/day (variety: leafy, cruciferous, allium,
    tomato-based)
  - Fruits — ≥3 servings/day with seasonal variety
  - Legumes — ≥3 servings/week (lentils, chickpeas, beans)
  - Whole grains — replace refined where feasible (whole-wheat bread,
    bulgur, brown rice, oats)
  - Nuts — ≥30 g/day (PREDIMED protocol: 15 g walnuts + 7.5 g almonds
    + 7.5 g hazelnuts) where affordable
  - Fish — ≥3 servings/week, emphasize fatty fish (mackerel, sardines,
    salmon) for ω-3
  - Reduce red/processed meat to <1 serving/day
  - Reduce sweets + sugar-sweetened beverages
  - Wine — IF consumed, moderate (1 glass/day women, 1-2 glasses/day
    men) with meals; do NOT initiate alcohol consumption for cancer-
    prevention purposes (conflicts with RF-LIFESTYLE-ALCOHOL-CANCER-
    PREVENTION; alcohol is a Group-1 carcinogen and dietary-pattern
    counseling should not encourage initiation)

  **(2) Cultural adaptation** — Mediterranean dietary principles
  (whole foods, vegetables/fruits/legumes/whole grains base, olive oil
  primary fat, moderate fish, limited red meat) are adaptable to
  Ukrainian / Eastern European cuisine. Examples: borscht (vegetable-
  forward), kasha (whole grain), salo replaced with olive oil, fish
  emphasis from Black Sea / fresh-water sources, beans + grains
  combinations. Counseling should be culturally fluent rather than
  prescriptive Mediterranean-replica.

  **(3) Gradual behavior change** — Adopt 1-2 new behaviors per visit
  rather than wholesale pattern change. Use motivational interviewing
  + readiness-stage assessment. Refer to registered dietitian for
  sustained support.

  **(4) USPSTF-cadence cancer screening** — CRC screening (colonoscopy
  q10y from age 45, or stool-based) per anchor. Mediterranean-diet
  adherence does not change screening cadence per current guidelines.

  Pattern-level dietary intervention + age-appropriate screening
  additive for cancer-incidence reduction across multiple tumor types.
  Cardiovascular + metabolic co-benefits independent of cancer.

rationale_ua: >
  Стандартний трек профілактики для низької прихильності до
  середземноморської дієти. Компоненти згідно з доказовою базою
  PREDIMED + EPIC + NHS + ACS 2020 Diet and Physical Activity Guideline
  + скринінговою частиною NCCN Colon:

  **(1) Консультування щодо середземноморського харчового патерну** —
  Ціль: дотримання всіх 9 компонентів MDS або показник MEDAS ≥10/14.
  Ключові звички:
  - Оливкова олія як основний кулінарний жир — ≥4 ст. ложки/день
    extra-virgin за економічної доступності
  - Овочі — ≥3 порції/день (різноманіття: листові, хрестоцвіті,
    цибулеві, на основі томатів)
  - Фрукти — ≥3 порції/день із сезонним різноманіттям
  - Бобові — ≥3 порції/тиждень (сочевиця, нут, квасоля)
  - Цільнозернові продукти — заміна рафінованих за можливості
    (цільнозерновий хліб, булгур, бурий рис, овес)
  - Горіхи — ≥30 г/день (протокол дослідження PREDIMED: 15 г волоських
    горіхів + 7.5 г мигдалю + 7.5 г фундука) за фінансової доступності
  - Риба — ≥3 порції/тиждень, з акцентом на жирну рибу (скумбрія,
    сардини, лосось) як джерело омега-3
  - Зменшити споживання червоного/переробленого м'яса до <1 порції/день
  - Зменшити споживання солодощів та підсолоджених напоїв
  - Вино — ЯКЩО вживається, помірно (1 склянка/день для жінок, 1-2 для
    чоловіків) під час їжі; НЕ розпочинати вживання алкоголю з метою
    профілактики раку (суперечить RF-LIFESTYLE-ALCOHOL-CANCER-
    PREVENTION; алкоголь — канцероген групи 1, і дієтичне
    консультування не повинно заохочувати його вживання)

  **(2) Культурна адаптація** — Принципи середземноморської дієти
  адаптовані до української / східноєвропейської кухні: борщ (овочева
  основа), каша (цільне зерно), сало заміняється оливковою олією, риба
  з Чорного моря / прісноводних джерел, поєднання бобових і круп.
  Консультування має бути культурно природним, а не нав'язувати точну
  копію середземноморського раціону.

  **(3) Поступова поведінкова зміна** — Впроваджувати 1-2 нові звички
  за візит, а не змінювати весь патерн одразу. Використовувати
  мотиваційне інтерв'ювання та оцінку готовності до змін. Направляти
  до дієтолога для стійкої підтримки.

  **(4) Скринінг раку за схемою USPSTF** — Скринінг колоректального
  раку (колоноскопія кожні 10 років з 45 років, або калові тести) як
  базовий орієнтир. Прихильність до середземноморської дієти не
  змінює періодичність скринінгу згідно з чинними настановами.

  Втручання на рівні харчового патерну та відповідний віку скринінг
  мають адитивний ефект щодо зниження захворюваності на кілька
  локалізацій раку. Переваги для серцево-судинної та метаболічної
  систем є незалежними від профілактики раку.

