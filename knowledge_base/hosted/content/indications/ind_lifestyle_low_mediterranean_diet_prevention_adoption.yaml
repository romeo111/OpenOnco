expected_outcomes:
  overall_response_rate: "Adoption of Mediterranean dietary pattern is associated with ~12-15% reduction in overall cancer incidence + mortality (EPIC, NHS, PREDIMED meta-analyses); strongest signals for CRC, breast, gastric, hepatocellular cancers. Cardiovascular co-benefits well-established (PREDIMED 2013 primary endpoint: ~30% reduction in major cardiovascular events with extra-virgin olive oil + mixed nuts supplementation vs. low-fat control). Pattern-level intervention has higher fidelity than single-nutrient targeting."

