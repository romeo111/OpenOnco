    position: context

do_not_do:
  - "Не подавати спостереження як еквівалент впровадження харчового патерну — переваги щодо кількох локалізацій раку та серцево-судинної системи при цьому не досягаються."
  - "Не пропускати скринінг колоректального раку — базова періодичність за схемою USPSTF залишається показаною незалежно від харчового статусу."
  - "Не виключати коротке дієтичне консультування при кожному візиті — повторний вплив має кумулятивний поведінковий ефект."
  - "Не подавати рішення пацієнта як остаточне — періодичне повторне обговорення треку впровадження дієти на повторних візитах є доцільним."

do_not_do_en:
  - "Do not present observation as equivalent to pattern adoption — multi-cancer + cardiovascular benefit is not achieved."
  - "Do not skip CRC screening — base-rate USPSTF cadence remains indicated regardless of dietary status."
  - "Do not skip brief dietary counseling at every visit — repeated exposure has cumulative behavioral effect."
  - "Do not present the decision as final — periodic re-discussion of the adoption track is appropriate at follow-up visits."

