do_not_do:
  - "Не розпочинати фармакотерапію без супутнього структурованого поведінкового супроводу — комбінований підхід дає найкращі результати."
  - "Не пропускати скринінг психічного здоров'я — ожиріння часто поєднується з депресією/розладами харчової поведінки."
  - "Не використовувати семаглутид/агоністи рецепторів GLP-1 у пацієнтів з анамнезом медулярної карциноми щитоподібної залози / синдрому МЕН2."
  - "Не очікувати повного повернення ризику раку до рівня осіб без ожиріння — досягається лише поступове зниження ризику."

do_not_do_en:
  - "Do not start pharmacotherapy without a structured behavioral context — combined approach has best outcomes."
  - "Do not skip mental-health screening — obesity often co-occurs with depression / disordered eating."
  - "Do not use semaglutide / GLP-1 RAs in patients with history of medullary thyroid carcinoma / MEN2."
  - "Do not expect full cancer-risk-restoration to non-obese comparator — only incremental risk reduction."

