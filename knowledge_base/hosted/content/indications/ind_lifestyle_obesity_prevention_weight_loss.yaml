rationale: >
  Standard-track prevention pathway for obesity (BMI ≥30). Tiered intervention:

  **(1) Behavioral / lifestyle modification** (first-line per USPSTF):
  - Intensive structured weight-loss program (≥14 contacts/year per USPSTF
    Grade B); typically 6-12 month duration
  - Mediterranean / DASH / portion-controlled dietary patterns
  - ≥150 min/week moderate-intensity aerobic + resistance training

  **(2) Pharmacotherapy** for BMI ≥30 (or ≥27 with weight-related comorbidity):
  - GLP-1 receptor agonists (semaglutide 2.4mg, tirzepatide 15mg) — current
    first-line for sustained ≥15% weight loss
  - Bupropion-naltrexone (Contrave) — alternative
  - Phentermine-topiramate (Qsymia) — alternative
  - Orlistat — older option

  **(3) Bariatric surgery referral** for BMI ≥40 (or ≥35 with comorbidity):
  - Roux-en-Y gastric bypass / sleeve gastrectomy / one-anastomosis bypass
  - Produces durable 25-35% weight loss + meaningful cancer-incidence
    reduction in long-term cohort follow-up

  **(4) Cancer screening per BMI-elevated risk profile:**
  - Post-menopausal women: ensure adherence to USPSTF mammography
  - Endometrial cancer awareness (post-menopausal bleeding evaluation)
  - HCC surveillance in cirrhotic (MASH) subset
  - Routine CRC screening per USPSTF (q10y colonoscopy from 45 or 50)

rationale_ua: >
  Стандартний трек профілактики для ожиріння (ІМТ ≥30).

  **(1) Поведінкова модифікація способу життя** (першої лінії за USPSTF)
  — інтенсивна структурована програма зниження ваги (≥14 контактів/рік
  за USPSTF Grade B), тривалістю зазвичай 6-12 місяців; середземноморський
  / DASH раціон або раціон з контролем порцій; ≥150 хв/тиждень аеробної
  активності помірної інтенсивності та силові тренування.

  **(2) Фармакотерапія** при ІМТ ≥30 (або ≥27 із супутньою патологією,
  пов'язаною з вагою):
  - Агоністи рецепторів GLP-1 (семаглутид 2.4мг, тирзепатид 15мг) — на
    сьогодні перша лінія для стійкого зниження ваги ≥15%
  - Бупропіон-налтрексон (Contrave) — альтернатива
  - Фентермін-топірамат (Qsymia) — альтернатива
  - Орлістат — старіший варіант

  **(3) Направлення на баріатричну хірургію** при ІМТ ≥40 (або ≥35 із
  супутньою патологією):
  - Шлунковий байпас за Ру / рукавна гастректомія / байпас з одним
    анастомозом
  - Забезпечує стійке зниження ваги на 25-35% та клінічно значуще
    зниження захворюваності на рак при тривалому спостереженні за
    когортами

  **(4) Скринінг раку відповідно до підвищеного через ІМТ ризику:**
  - Жінки в постменопаузі: забезпечити дотримання мамографічного
    скринінгу за USPSTF
  - Настороженість щодо раку ендометрія (обстеження при
    постменопаузальній кровотечі)
  - Спостереження щодо гепатоцелюлярної карциноми у підгрупи з цирозом
    (MASH)
  - Рутинний скринінг колоректального раку за USPSTF (колоноскопія
    кожні 10 років з 45 або 50 років)

