rationale: >
  Standard-track prevention pathway for high processed-meat consumption.
  Components per WCRF/AICR Continuous Update Project + ACS 2020 Diet +
  Physical Activity Guideline + NCCN Colon Cancer screening:

  **(1) Dietary substitution counseling** — Reduce processed meat to
  <50 g/day (ideally minimal/none). Reduce red meat to <500 g/week
  (~3 portions). Substitute with:
  - Poultry, fish, eggs, dairy
  - Legumes (beans, lentils, chickpeas)
  - Whole grains, nuts, seeds
  - Plant-based protein sources

  **(2) Mediterranean-style or plant-forward eating pattern** — Whole
  foods, vegetables, fruits, whole grains, olive oil, moderate fish/
  poultry, minimal processed/red meat. Strongest dietary-pattern
  evidence for CRC + cardiovascular + all-cause mortality reduction.

  **(3) USPSTF-cadence CRC screening** — Colonoscopy q10y from age 45
  (or stool-based screening: FIT q1y, FIT-DNA q3y as alternatives).
  Processed-meat consumption does not change screening cadence per
  current guidelines but compounds baseline risk.

  **(4) Referral to registered dietitian** for sustained behavioral
  change, especially if cultural/religious dietary patterns make
  reduction challenging.

  Dietary intervention + age-appropriate screening additive for CRC
  incidence reduction. Plant-forward patterns also reduce cardiovascular
  + metabolic morbidity.

rationale_ua: >
  Стандартний трек профілактики для високого споживання переробленого
  м'яса. Компоненти згідно з WCRF/AICR Continuous Update Project +
  ACS 2020 Diet and Physical Activity Guideline:

  **(1) Консультування щодо заміни продуктів** — Зменшити споживання
  переробленого м'яса до <50 г/день (в ідеалі — мінімально або
  відмовитися повністю). Зменшити споживання червоного м'яса до
  <500 г/тиждень (~3 порції). Замінити на:
  - Птицю, рибу, яйця, молочні продукти
  - Бобові
  - Цільнозернові продукти, горіхи, насіння
  - Рослинні джерела білка

  **(2) Середземноморський або рослино-орієнтований харчовий патерн** —
  Натуральні продукти, овочі, фрукти, цільнозернові, оливкова олія,
  помірне споживання риби/птиці. Найбільш переконлива доказова база
  серед харчових патернів щодо зниження ризику колоректального раку,
  серцево-судинних захворювань та загальної смертності.

  **(3) Скринінг колоректального раку за схемою USPSTF** — Колоноскопія
  кожні 10 років з 45 років (або калові тести: FIT щорічно, FIT-DNA
  кожні 3 роки). Споживання переробленого м'яса не змінює
  періодичність скринінгу згідно з чинними настановами, але посилює
  базовий ризик.

  **(4) Направлення до дієтолога** для стійкої поведінкової зміни,
  особливо якщо культурні чи релігійні харчові традиції ускладнюють
  зменшення споживання.

  Дієтичне втручання та відповідний віку скринінг мають адитивний
  ефект щодо зниження захворюваності на колоректальний рак.
  Рослино-орієнтовані харчові патерни також знижують серцево-судинну
  та метаболічну захворюваність.

