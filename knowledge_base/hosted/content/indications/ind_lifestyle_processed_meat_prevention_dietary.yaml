do_not_do:
  - "Не подавати дієтичне консультування як заміну колоноскопічному скринінгу — обидва втручання є взаємодоповнюючими."
  - "Не демонізувати окремі продукти — харчовий патерн має більше значення, ніж виключення окремих продуктів."
  - "Не призначати надмірні харчові обмеження без супроводу дієтолога — ризик недоїдання або неадекватної заміни продуктів."
  - "Не ігнорувати культурні чи релігійні харчові традиції — консультування має бути культурно чутливим і реалістичним для конкретного пацієнта."

do_not_do_en:
  - "Do not present dietary counseling as a substitute for colonoscopy screening — both interventions are complementary."
  - "Do not demonize individual foods — dietary pattern matters more than single-food elimination."
  - "Do not prescribe extreme dietary restriction without registered-dietitian support — risk of malnutrition / inappropriate substitution."
  - "Do not ignore cultural / religious dietary patterns — counseling must be culturally sensitive and feasible for the individual."

