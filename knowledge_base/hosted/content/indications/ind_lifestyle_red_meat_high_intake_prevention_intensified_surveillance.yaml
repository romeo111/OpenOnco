do_not_do:
  - "Не презентувати reduced red-meat intake як high-certainty CRC-prevention інтервенцію — IARC Group 2A probable evidence не еквівалентна Group 1."
  - "Не приписувати повну elimination unprocessed red meat — nutritional value (heme iron, B12, цинк) значуща особливо в low-income / anemic пацієнтів."
  - "Не пропускати cooking-method counseling — high-temperature charring / grilling генерують HCAs + PAHs, які є додатковими ризик-чинниками."
  - "Не презентувати q5y колоноскопію як evidentно-rівноцінну стандарту q10y — extension опирається на risk-stratified framework, не RCT."

do_not_do_en:
  - "Do not present reduced red-meat intake as a high-certainty CRC-prevention intervention — IARC Group 2A probable evidence is not equivalent to Group 1."
  - "Do not prescribe complete elimination of unprocessed red meat — nutritional value (heme iron, B12, zinc) is meaningful particularly for low-income / anemic patients."
  - "Do not skip cooking-method counseling — high-temperature charring / grilling generates HCAs + PAHs, which are additional risk modifiers."
  - "Do not present q5y colonoscopy as evidentiarily equivalent to the q10y standard — the extension rests on a risk-stratified framework, not RCT data."

