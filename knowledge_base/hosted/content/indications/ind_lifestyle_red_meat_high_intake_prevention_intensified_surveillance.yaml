rationale: >
  Standard-track prevention pathway for individuals with habitual
  unprocessed red-meat intake ≥500 g/week (≥3 servings/day) who do not
  have a current colorectal-cancer diagnosis. Two parallel interventions:

  **(1) Dietary counseling toward WCRF/AICR cancer-prevention pattern.**
  Highest-impact modifiable lever. Target: reduce unprocessed red-meat
  intake to <350-500 g/week cooked weight; substitute with poultry,
  fish, legumes, eggs, plant-protein sources. Frame as a population-
  health intervention with probable-evidence (IARC 2A) — not as a
  high-certainty causal claim. Avoid prescriptive elimination —
  unprocessed red meat carries nutritional value (heme iron, B12,
  zinc) that low-income or anemic patients may need; counseling
  emphasizes reduction toward target rather than abstinence. Pair
  with cooking-method counseling: avoid high-temperature charring /
  grilling that generates HCAs + PAHs.

  **(2) Targeted CRC-screening adjustment.** USPSTF 2021 baseline:
  colonoscopy q10y starting age 45 (general population). For this
  cohort, NCCN CRC-screening framework supports consideration of
  earlier baseline (age 40-45) AND shortened re-screening interval
  (q5y instead of q10y) when persistent dietary risk-factor clustering
  is present alongside any other CRC risk factor (family history,
  obesity, sedentary behavior). FIT q1y or fecal-DNA q3y are
  acceptable alternatives for patients who decline colonoscopy.
  This is NCCN Category 2B — based on extrapolation from
  risk-stratified frameworks, not on a dedicated RCT in the
  high-red-meat cohort.

  Resource access in Ukraine: registered-dietitian counseling
  available at private clinics (~500-1500 UAH/visit); colonoscopy
  widely available at gastroenterology centers (~3000-8000 UAH);
  FIT testing pharmacy-accessible (~300-800 UAH/test).

rationale_ua: >
  Стандартний-трек prevention шлях для осіб зі звичним споживанням
  unprocessed red meat ≥500 г/тиждень (≥3 порції/день), які не мають
  поточного діагнозу CRC. Два паралельні втручання:

  **(1) Dietary counseling toward WCRF/AICR cancer-prevention pattern.**
  Найвпливовіший модифікуючий важіль. Ціль: зниження споживання
  unprocessed red meat до <350-500 г/тиждень cooked weight;
  заміна на птицю, рибу, бобові, яйця, plant-protein. Формулювати
  як population-health intervention з probable-evidence (IARC 2A) —
  не як high-certainty causal claim. Уникати prescriptive elimination —
  unprocessed red meat має nutritional value (heme iron, B12, цинк);
  counseling — на зниження до target, не abstinence. Пара з
  cooking-method counseling: уникати high-temperature charring /
  grilling, що генерують HCAs + PAHs.

  **(2) Targeted CRC-screening adjustment.** USPSTF 2021 baseline:
  колоноскопія q10y з 45 років. Для цієї когорти NCCN CRC-screening
  framework підтримує consideration earlier baseline (40-45 років)
  ТА shortened re-screening interval (q5y замість q10y) при persistent
  dietary risk-factor clustering. FIT q1y або fecal-DNA q3y —
  alternative при відмові від колоноскопії. NCCN Category 2B —
  extrapolation з risk-stratified frameworks, не dedicated RCT.

  Доступ до ресурсів в Україні: registered-dietitian counseling
  (~500-1500 грн/візит); колоноскопія (~3000-8000 грн);
  FIT testing (~300-800 грн/тест).

