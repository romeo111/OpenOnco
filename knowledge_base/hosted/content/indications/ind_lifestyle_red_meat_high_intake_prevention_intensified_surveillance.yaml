expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: dietary counseling targets ≥50% reduction in
    unprocessed red-meat intake toward WCRF/AICR target (<350-500 g/week
    cooked weight) plus shift toward poultry, fish, legumes, plant
    protein. Pooled meta-analyses suggest each 100 g/day reduction
    in unprocessed red meat lowers CRC RR by ~17% (RR ~0.83), though
    the IARC Group 2A evidence quality means the projected absolute
    risk reduction is modest in lifetime terms (~1-2 absolute CRC
    incidence percentage points in lifetime risk for high consumers).
    Targeted CRC screening intensification — earlier baseline
    colonoscopy at age 45 (USPSTF 2021 baseline) plus shortened
    re-screening interval (q5y instead of q10y) is supported by
    risk-stratified NCCN CRC screening framework for individuals with
    persistent dietary risk-factor clustering. No imaging modality
    has RCT-grade evidence specifically for the high-red-meat cohort.

