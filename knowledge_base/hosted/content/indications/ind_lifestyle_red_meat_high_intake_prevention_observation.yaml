expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: avoidance of intensified dietary counseling
    and modified CRC-screening cadence when patient declines.
    Cancer-incidence outcome: no projected reduction in red-meat-
    attributable CRC incidence beyond what routine general-
    population screening provides. USPSTF 2021 colonoscopy q10y
    starting at age 45 captures most preventable cases regardless
    of dietary pattern; this track makes no change to screening.

