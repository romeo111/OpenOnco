rationale: >
  Alternative-track companion to IND-LIFESTYLE-RED-MEAT-HIGH-INTAKE-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Patient with habitual unprocessed
  red-meat intake ≥500 g/week who declines targeted dietary counseling
  and/or modified screening cadence — for any reason (cultural / culinary
  preference, economic constraint where red meat is a primary protein
  source, preference for less-interventional pathway, skepticism toward
  IARC Group 2A evidence quality) — is offered routine general-population
  screening only:

  **CRC screening:** Apply USPSTF 2021 criteria unmodified — colonoscopy
  q10y starting at age 45 (or alternative-modality FIT q1y / fecal-DNA q3y
  per patient preference). Patient is explicitly informed that the IARC
  Group 2A probable-evidence excess CRC risk associated with their dietary
  pattern is not specifically addressed by this routine track.

  **Dietary counseling:** Brief informational disclosure of IARC 2A
  classification + WCRF/AICR recommendation only; no structured
  counseling visit is scheduled. Patient is offered re-discussion at
  any future visit.

  **Symptom-triggered evaluation:** Low threshold for diagnostic workup
  on new / persistent GI symptoms (rectal bleeding, change in bowel
  habits, abdominal pain, unintentional weight loss, anemia).

  Routing reconsiderations: patient may revisit intensified pathway at
  any subsequent visit; this Indication does not preclude future
  escalation. Per CHARTER §11 patient-autonomy framing: lifestyle
  modification is a shared-decision-making domain particularly when
  the underlying evidence is IARC Group 2A (probable) rather than
  Group 1 (sufficient).

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-LIFESTYLE-RED-MEAT-
  HIGH-INTAKE-PREVENTION-INTENSIFIED-SURVEILLANCE. Пацієнт зі звичним
  unprocessed red-meat intake ≥500 г/тиждень, який відмовляється від
  targeted dietary counseling та/або модифікованої screening cadence
  (cultural / culinary preference, економічні обмеження, перевага менш-
  інтервенційного шляху, скептицизм щодо IARC Group 2A evidence quality),
  отримує тільки рутинний загальнопопуляційний скринінг:

  **CRC скринінг:** USPSTF 2021 без модифікації — колоноскопія q10y
  з 45 років (або FIT q1y / fecal-DNA q3y). Пацієнт явно інформований,
  що IARC Group 2A probable-evidence надлишковий ризик CRC, асоційований
  з його дієтичним патерном, не адресується специфічно цим рутинним
  треком.

  **Dietary counseling:** Brief informational disclosure IARC 2A
  класифікації + WCRF/AICR рекомендації; структурований counseling-візит
  НЕ запланований. Пацієнту пропонується re-discussion на будь-якому
  майбутньому візиті.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного workup
  при нових / persistent GI симптомах (rectal bleeding, change in
  bowel habits, abdominal pain, weight loss, anemia).

  Reroute: пацієнт може повернутися до інтенсифікованого шляху на
  будь-якому подальшому візиті. Per CHARTER §11 — shared-decision-making
  domain особливо при IARC Group 2A (probable) evidence.

