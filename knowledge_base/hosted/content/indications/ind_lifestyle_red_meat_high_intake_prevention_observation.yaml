sources:
  - source_id: SRC-NCCN-COLON-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining intensified dietary or screening modifications
      for lifestyle-driven CRC risk factors continue to receive
      symptom-triggered evaluation and standard-of-care
      general-population screening."
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Smoking-cessation, dietary, and lifestyle counseling remain
      foundational across all oncology-prevention cohorts regardless
      of imaging-track choice."

do_not_do:
  - "Не презентувати observation як еквівалент targeted dietary counseling — incidence-detection benefit неістотний, але cancer-attributable excess ризик не адресується."
  - "Не ігнорувати alarm features (rectal bleeding, change in bowel habits, weight loss, anemia) — immediate діагностичний workup + multidisciplinary review."
  - "Не використовувати цей шлях як стандарт першої лінії — intensified-track залишається preferred для high-red-meat cohort, особливо при clustering інших CRC ризик-чинників."
  - "Не пропускати dietary disclosure повністю — пацієнт повинен бути інформований про IARC 2A класифікацію, навіть якщо counseling не запланований."

do_not_do_en:
  - "Do not present observation as equivalent to targeted dietary counseling — the cancer-attributable excess risk is unaddressed even if the absolute risk increment is small."
  - "Do not ignore alarm features (rectal bleeding, change in bowel habits, weight loss, anemia) — immediate diagnostic workup + multidisciplinary review."
  - "Do not use this pathway as a first-line standard — the intensified track remains preferred for the high-red-meat cohort, particularly when clustered with other CRC risk factors."
  - "Do not skip dietary disclosure entirely — the patient should be informed of the IARC 2A classification even if structured counseling is declined."

