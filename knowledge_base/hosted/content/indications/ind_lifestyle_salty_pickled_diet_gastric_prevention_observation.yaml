nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Brief dietary counseling + H. pylori test-and-treat retained;
    aggressive dietary intervention deferred. Outcomes track unchanged
    dietary cohort + H. pylori-eradicated cohort. Acceptable when
    structured dietary intervention is declined or inaccessible.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (less intensive dietary intervention) alternative
  for patients with traditional high-salt/pickled-food diet who decline
  structured dietary counseling or for whom resources are limited.
  H. pylori test + treat retained as the highest-impact intervention.

  Components:
    - **H. pylori test + treat retained** — single most cost-effective
      gastric-cancer prevention.
    - Brief dietary counseling — name salt + pickle as modifiable
      risk, encourage gradual reduction.
    - Smoking cessation if applicable.
    - Symptom-driven EGD per standard pathway.
    - Re-offer structured nutritional counseling at subsequent visits.

rationale_ua: >
  Aggressive-трек (less intensive dietary intervention) альтернатива
  для пацієнтів з traditional high-salt/pickled-food diet які declining
  structured dietary counseling або для яких resources limited.
  H. pylori test + treat retained як highest-impact intervention.

  Компоненти:
    - **H. pylori test + treat retained** — single most cost-effective
      gastric-cancer prevention.
    - Brief dietary counseling — name salt + pickle as modifiable risk.
    - Smoking cessation якщо applicable.
    - Symptom-driven EGD per standard pathway.
    - Re-offer structured nutritional counseling при subsequent visits.

