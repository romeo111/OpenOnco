  - "Не виконувати рутинну screening EGD у asymptomatic average-risk дорослих — окрім high-prevalence countries з program-level screening."
  - "Не використовувати empiric eradication без тестування — підвищує антибіотикорезистентність."

do_not_do_en:
  - "Do not skip H. pylori testing in a high-salt-diet cohort — multiplicative risk."
  - "Do not perform routine screening EGD in asymptomatic average-risk adults — outside high-prevalence countries with program-level screening."
  - "Do not use empiric eradication without testing — raises antibiotic resistance."

known_controversies:
