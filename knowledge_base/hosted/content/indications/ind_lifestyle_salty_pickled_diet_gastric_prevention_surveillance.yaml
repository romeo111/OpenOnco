        rationale: "Western/Eastern European baseline incidence does not meet cost-effectiveness threshold for population screening."
    our_default: "Symptom-driven + high-risk-cohort EGD; population screening only where regional incidence justifies."
    rationale: "Resource allocation + harm-benefit balance."

