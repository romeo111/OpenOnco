rationale: >
  Standard-track prevention pathway for salt-preserved-food / high-
  pickle-intake diet. Routes to combined dietary + H. pylori
  intervention.

  Components:
    - **Dietary salt reduction** to WHO target <5 g/day:
      - Replace salt-cured + pickled foods with fresh + frozen.
      - Mediterranean / DASH pattern adoption — provides cardiovascular
        + cancer benefit synergistically.
      - Increase fruit + vegetable intake (≥5 servings/day) — vitamin
        C + carotenoid + phenolic protective signal.
    - **H. pylori testing + eradication if positive:**
      - Test of choice in dietary-risk-elevated cohort: urea breath
        test or stool antigen (preferred over serology); first-line
        eradication per Maastricht VI / ESGE 2022 — quadruple therapy
        (bismuth + PPI + 2 antibiotics) where clarithromycin
        resistance >15%, or PPI + amoxicillin + clarithromycin where
        resistance <15%.
      - Confirm eradication 4-8 weeks post-treatment.
    - **Smoking cessation** — synergistic with salt + H. pylori.
    - **Alcohol minimization** — additive risk.
    - **Symptom-driven gastric workup:**
      - Persistent dyspepsia, early satiety, weight loss, dysphagia,
        iron-deficiency anemia, melena, hematemesis → upper endoscopy
        (EGD).
      - Family history of gastric cancer + dietary risk + H. pylori
        positive → consider screening EGD per regional protocol
        (Korean/Japanese age-based; Eastern European increasingly
        symptom-driven + high-risk-cohort).
    - **Atrophic gastritis or intestinal metaplasia on biopsy:**
      transition to chronic atrophic gastritis surveillance pathway
      (3-yearly EGD with biopsies per OLGA/OLGIM stage).

  In Ukraine, gastric cancer incidence remains elevated (Globocan 2022);
  H. pylori prevalence ~70% historically; salt + pickled-food
  consumption traditional. NSZU covers EGD when symptom-indicated;
  H. pylori testing + treatment widely available. Population dietary
  intervention requires public-health-scale action.

