do_not_do:
  - "Не подавати спостереження як еквівалент втручання з фізичної активності — зниження захворюваності на рак не досягається."
  - "Не пропускати відповідний віку скринінг на рак — базовий скринінг залишається показаним незалежно від рівня активності."
  - "Не виключати коротке консультування щодо фізичної активності на кожному візиті — накопичені дані показують, що навіть мінімальне підвищення активності має кумулятивну користь."
  - "Не використовувати обмеження рухливості як абсолютне протипоказання до руху — направлення до фізичного терапевта може визначити прийнятний рівень активності."

do_not_do_en:
  - "Do not present observation as equivalent to activity intervention — cancer incidence reduction is not achieved."
  - "Do not skip age-appropriate cancer screening — base-rate screening remains indicated regardless of activity status."
  - "Do not skip brief activity counseling at every visit — even minimal activity uplift has cumulative benefit."
  - "Do not treat mobility limitation as an absolute contraindication to activity — physical-therapist referral can identify feasible options."

