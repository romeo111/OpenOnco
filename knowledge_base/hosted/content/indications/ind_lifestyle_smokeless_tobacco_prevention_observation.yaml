strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Counseling-only pathway without pharmacotherapy + standard oral
    examinations at routine visits. Accepts higher residual risk;
    outcomes track non-pharmacotherapy cessation programs (lower
    sustained-abstinence rates). Acceptable when patient declines
    pharmacotherapy or in low-resource settings.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (less intensive cessation support) alternative for
  smokeless tobacco users who decline pharmacotherapy or have limited
  access. Counseling + oral surveillance retained.

  Components:
    - Counseling at every encounter — brief intervention (5As, 5Rs)
      or referral to community programs.
    - Oral examination retained at every encounter.
    - Biopsy any persistent leukoplakia/erythroplakia.
    - Re-offer pharmacotherapy at every subsequent encounter (patient
      preferences change over time).
    - Address concurrent alcohol use.

rationale_ua: >
  Aggressive-трек (less intensive cessation support) альтернатива для
  smokeless tobacco users які declining pharmacotherapy або мають
  limited access. Counseling + oral surveillance retained.

  Компоненти:
    - Counseling при кожному encounter — brief intervention (5As, 5Rs)
      або referral до community programs.
    - Oral examination retained при кожному encounter.
    - Biopsy будь-якої persistent leukoplakia/erythroplakia.
    - Re-offer pharmacotherapy при кожному subsequent encounter.
    - Address concurrent alcohol use.

