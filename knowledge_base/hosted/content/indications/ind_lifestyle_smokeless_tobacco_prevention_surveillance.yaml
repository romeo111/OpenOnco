rationale: >
  Standard-track prevention pathway for current or recent smokeless
  tobacco users. Cessation is the highest-impact intervention plus
  structured oral surveillance.

  Components:
    - **Cessation pharmacotherapy + counseling:**
      - Varenicline 0.5-1.0 mg BID (titrated) is first-line where
        available and not contraindicated.
      - Nicotine replacement therapy (patch + lozenge/gum combination
        per 2022 Cochrane review) — preferred for snus users
        already nicotine-dependent.
      - Bupropion SR 150-300 mg/day alternative.
      - Behavioral counseling — intensive (≥4 sessions) improves
        outcomes; quit lines + group programs proven.
    - **Oral examination at every encounter** (any visit, not just
      annual): inspect tongue, gingiva, buccal mucosa (especially
      placement site), floor of mouth, hard + soft palate, oropharynx.
    - **Biopsy any persistent (>2 weeks) leukoplakia, erythroplakia,
      mixed lesion** — these are precancerous mucosal lesions.
    - **Toluidine blue or autofluorescence visualization** adjuncts
      in high-prevalence settings (South Asian gutka/pan masala
      users; community screening programs).
    - **HPV co-counseling** — smokeless-tobacco-driven oral cancer is
      distinct from HPV-driven oropharyngeal cancer; HPV vaccination
      remains beneficial in eligible adults.
    - **Avoid alcohol synergy** — counsel to minimize concurrent
      alcohol use; combined exposure compounds risk multiplicatively.
    - **Refer to head + neck specialty** if any high-suspicion
      finding; specialty-level dysplasia management.
    - **Esophageal + pancreatic awareness:** symptom-driven workup —
      dysphagia, persistent epigastric pain, weight loss → upper GI
      evaluation.

  In Ukraine, smokeless tobacco use is uncommon (smoking dominant);
  South Asian diaspora communities may include gutka/pan masala users.
  Cessation pharmacotherapy (NRT, bupropion, varenicline) NSZU-covered
  when prescribed.

rationale_ua: >
  Стандартний-трек prevention шлях для current або recent smokeless
  tobacco users. Cessation — highest-impact intervention плюс
  structured oral surveillance.

  Компоненти:
    - **Cessation pharmacotherapy + counseling:**
      - Varenicline 0.5-1.0 мг BID first-line.
      - NRT (patch + lozenge/gum) для snus users.
      - Bupropion SR 150-300 мг/день alternative.
      - Intensive behavioral counseling.
    - **Oral examination при кожному encounter:** язик, ясна,
      buccal mucosa, дно рота, hard + soft palate, oropharynx.
    - **Biopsy будь-якої persistent (>2 тиж) leukoplakia, erythroplakia.**
    - **Toluidine blue або autofluorescence** у high-prevalence settings.
    - **HPV co-counseling** — HPV vaccination eligible adults.
    - **Avoid alcohol synergy.**
    - **Refer to head + neck specialty** при high-suspicion finding.
    - **Esophageal + pancreatic awareness:** symptom-driven workup.

  В Україні smokeless tobacco не поширене (smoking dominant); South
  Asian diaspora communities можуть включати gutka/pan masala users.
  Cessation pharmacotherapy NSZU-covered.

