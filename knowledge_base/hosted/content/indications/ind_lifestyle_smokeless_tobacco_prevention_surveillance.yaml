      "Smokeless tobacco use is causally associated with oral cavity
      cancer, esophageal cancer, and pancreatic cancer. Cessation
      reduces risk progressively but not to baseline non-user levels."

do_not_do:
  - "Не пропускати oral examination при кожному encounter — early-stage oral cancer easily missed without focused inspection."
  - "Не використовувати dipping tobacco + alcohol concurrent — multiplicatively elevates oral + esophageal risk."
  - "Не покладатися лише на counseling — pharmacotherapy ~2-3x збільшує sustained abstinence."

do_not_do_en:
  - "Do not skip oral examination at every encounter — early-stage oral cancer is easily missed without focused inspection."
  - "Do not use dipping tobacco + alcohol concurrently — multiplicatively elevates oral + esophageal risk."
  - "Do not rely on counseling alone — pharmacotherapy increases sustained abstinence ~2-3x."

