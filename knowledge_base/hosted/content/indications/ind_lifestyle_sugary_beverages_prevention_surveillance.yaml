  - "Do not prescribe low-calorie sweeteners as a permanent replacement without discussing uncertainty."
  - "Do not ignore the young-adult early-onset CRC signal — family history + diet warrant a tailored screening discussion."

known_controversies:
  - topic: "Low-calorie sweetener safety"
    positions:
      - position: "Net beneficial substitute"
        rationale: "Replacing SSB calories with non-nutritive sweeteners reduces caloric intake and weight; WHO 2023 conditional recommendation for short-term use only."
      - position: "Concerning signals"
        rationale: "Recent observational + mechanistic data on microbiome, insulin response, cardiometabolic outcomes raise uncertainty; WHO 2023 conditional against for general-population weight control."
    our_default: "Use sparingly during transition; emphasize water + unsweetened beverages as long-term goal."
    rationale: "Net direction of evidence favors substitution but not as permanent replacement."

