rationale: >
  Standard-track prevention pathway for habitual high sugar-sweetened
  beverage consumption. Routes to dietary substitution counseling +
  reinforcement of general-population cancer screening adherence.
  No off-schedule imaging triggered.

  Components:
    - **Dietary substitution counseling:**
      - Replace SSBs with water, sparkling water, unsweetened tea or
        coffee.
      - Gradual reduction if abrupt cessation difficult; assess
        sweetened-coffee/tea contribution.
      - Low-calorie sweeteners — net benefit uncertain (some studies
        suggest microbiome disruption / metabolic effects); use
        sparingly during transition.
    - **Weight management** — SSB elimination often produces clinically
      meaningful weight loss within 3-6 months.
    - **Physical activity** ≥150 min/week moderate.
    - **Cancer screening adherence:**
      - CRC: USPSTF 2021 colonoscopy q10y, FIT q1y, or MT-sDNA q3y
        from age 45. In high-SSB young adults with family history of
        early-onset CRC, consider colonoscopy at 40 or earlier per
        family history.
      - Breast: USPSTF 2024 biennial mammography from age 40.
      - Endometrial: symptom-driven biopsy for any abnormal bleeding.
    - **Glycemic + metabolic monitoring** if comorbid obesity or
      insulin resistance — HbA1c, fasting glucose, lipid panel.
    - **Public health context:** SSB taxes + portion-size policies
      effective at population scale; individual counseling alone
      modest effect.

  In Ukraine, SSB consumption is increasing among urban + young
  populations. NSZU/PHC-level dietary counseling resources variable.

