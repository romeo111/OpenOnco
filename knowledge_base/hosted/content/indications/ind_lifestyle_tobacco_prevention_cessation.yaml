rationale: >
  Standard-track prevention pathway for active tobacco use. Three components:

  **(1) Structured cessation counseling** — 5A framework (Ask / Advise / Assess /
  Assist / Arrange follow-up). Behavioral support: tobacco quitlines, individual
  or group counseling, smartphone apps (Smokefree.gov, NHS Quit Smoking).

  **(2) Pharmacotherapy** (≥7 first-line options per USPSTF + AHCPR):
  - Nicotine replacement therapy (patch + lozenge/gum combination preferred)
  - Varenicline (Champix/Chantix) — most effective monotherapy; 12-week course
  - Bupropion SR — alternative; avoid in seizure disorders
  - Cytisine — emerging option; non-USA availability

  **(3) USPSTF lung cancer screening eligibility check** — annual LDCT for ages
  50-80 + ≥20 pack-years + currently smoke OR quit ≤15y. Engine surfaces this
  via routing patient profile back through DIS-NSCLC screening pathway.

  Combined intervention (counseling + pharmacotherapy) doubles quit rates vs.
  unassisted cessation. Tobacco cessation is the single most cost-effective
  cancer-prevention intervention; NNT ~25 to prevent one premature death.

rationale_ua: >
  Стандартний профілактичний шлях для активного куріння. Три компоненти:

  **(1) Структуроване консультування з припинення куріння** — модель 5A
  (Ask / Advise / Assess / Assist / Arrange follow-up — запитати / порадити /
  оцінити / допомогти / організувати подальше спостереження). Поведінкова
  підтримка: телефонні лінії допомоги курцям, індивідуальне або групове
  консультування, мобільні застосунки (Smokefree.gov, NHS Quit Smoking).

  **(2) Фармакотерапія** (≥7 препаратів першої лінії за USPSTF + AHCPR):
  - Нікотинозамісна терапія (перевага надається комбінації пластир +
    льодяник/жувальна гумка)
  - Вареніклін (varenicline; Champix/Chantix) — найефективніша монотерапія;
    курс 12 тижнів
  - Бупропіон SR (bupropion) — альтернатива; уникати при судомних розладах
  - Цитизин (cytisine) — новий варіант; доступність поза межами США

  **(3) Перевірка відповідності критеріям скринінгу раку легень USPSTF** —
  щорічна LDCT для віку 50-80 років + ≥20 пачко-років + поточне куріння АБО
  відмова ≤15 років тому. Механізм застосунку скеровує це через маршрут
  профілю пацієнта назад до шляху скринінгу DIS-NSCLC.

  Комбіноване втручання (консультування + фармакотерапія) подвоює частоту
  відмови від куріння порівняно з відмовою без підтримки. Припинення
  куріння — найбільш економічно ефективне онкопрофілактичне втручання;
  NNT ~25 для запобігання одній передчасній смерті.

