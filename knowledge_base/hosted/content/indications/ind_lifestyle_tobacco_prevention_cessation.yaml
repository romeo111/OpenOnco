do_not_do:
  - "Не пропускати структуроване консультування — сама лише фармакотерапія має нижчу частоту відмови від куріння."
  - "Не використовувати вареніклін у пацієнтів з нещодавньою суїцидальністю / депресією — попередження в рамці (black-box warning)."
  - "Не розглядати електронні сигарети / вейпінг як засіб для відмови від куріння — IARC не рекомендує це; наведені вище засоби мають доведений профіль безпеки."
  - "Не пропускати перевірку відповідності критеріям скринінгу раку легень — навіть колишні курці мають залишковий ризик."

do_not_do_en:
  - "Do not skip structured counseling — pharmacotherapy alone has lower quit rates."
  - "Do not use varenicline in patients with recent suicidality / depression — black-box warning."
  - "Do not consider e-cigarettes / vaping a cessation tool — IARC recommends against; the cessation tools above have established safety profile."
  - "Do not skip lung cancer screening eligibility check — even ex-smokers have residual risk."

