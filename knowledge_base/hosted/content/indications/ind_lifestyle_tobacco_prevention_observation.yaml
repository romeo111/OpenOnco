do_not_do:
  - "Не подавати спостереження як еквівалент відмови від куріння — зниження захворюваності на рак не досягається."
  - "Не пропускати коротке консультування на кожному візиті — навіть якщо пацієнт відмовляється, повторне консультування має кумулятивний ефект."
  - "Не виключати пацієнта зі скринінгу раку легень через відмову від припинення куріння — скринінг залишається показаним незалежно."

do_not_do_en:
  - "Do not present observation as equivalent to cessation — cancer incidence reduction is not achieved."
  - "Do not skip brief intervention at every visit — even if the patient declines, repeated counseling has cumulative effect."
  - "Do not exclude a patient from lung cancer screening because of cessation refusal — screening remains indicated regardless."

