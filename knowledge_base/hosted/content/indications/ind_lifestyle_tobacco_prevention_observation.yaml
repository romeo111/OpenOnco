id: IND-LIFESTYLE-TOBACCO-PREVENTION-OBSERVATION
plan_track: surveillance
intent: prevention

applicable_to:
  disease_id: DIS-NSCLC
  stage_requirements: []
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 3

triggered_by_redflags:
  - RF-LIFESTYLE-TOBACCO-CANCER-PREVENTION

recommended_regimen: null
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: "Continued active tobacco use: cumulative cancer incidence + cardiovascular + pulmonary morbidity continues to climb with each year of exposure. Lung cancer screening alone (without cessation) captures earlier-stage disease but does not reduce incidence."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-LIFESTYLE-TOBACCO-PREVENTION-CESSATION.
  Patient declines structured cessation program — receives USPSTF lung cancer
  screening eligibility check (LDCT if eligible) + repeated brief intervention
  with each clinical contact (5A framework's "Ask + Advise + Arrange follow-up"
  with low-intensity). Per CHARTER §11 patient-autonomy framing — continued
  smoking is a legitimate patient choice but framed as suboptimal vs.
  cessation comparator.

rationale_ua: >
  Альтернативний трек-компаньйон до IND-LIFESTYLE-TOBACCO-PREVENTION-
  CESSATION. Пацієнт відмовляється від структурованої програми відмови від
  куріння — отримує перевірку відповідності критеріям скринінгу раку
  легень USPSTF (LDCT за показаннями) + повторне коротке консультування
  низької інтенсивності при кожному клінічному контакті (елементи моделі
  5A — "запитати + порадити + організувати подальше спостереження").
  Відповідно до CHARTER §11 — продовження куріння є законним вибором
  пацієнта, але подається як менш оптимальне порівняно з варіантом
  відмови від куріння.

