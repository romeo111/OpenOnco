do_not_do:
  - "Не подавати спостереження як еквівалент захисту від УФ-опромінення — зниження захворюваності на меланому та немеланомний рак шкіри не досягається."
  - "Не виключати пацієнта з огляду шкіри через відмову від захисту від УФ-опромінення — спостереження залишається показаним незалежно."
  - "Не пропускати консультування за критеріями ABCDE — самообстеження шкіри без чітких критеріїв має низьку діагностичну цінність для раннього виявлення меланоми."
  - "Не нормалізувати використання солярію, навіть якщо пацієнт відмовляється відмовитися від нього — чітко інформувати про подальший ризик."

do_not_do_en:
  - "Do not present observation as equivalent to UV protection — melanoma + NMSC incidence reduction is not achieved."
  - "Do not exclude a patient from skin exam because of UV-protection refusal — surveillance remains indicated regardless."
  - "Do not skip ABCDE counseling — SSE without criteria has poor yield for early melanoma detection."
  - "Do not normalize tanning-bed use even if the patient declines to stop — clearly counsel continued risk."

