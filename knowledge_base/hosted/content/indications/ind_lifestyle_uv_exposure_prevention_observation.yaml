rationale: >
  Alternative-track companion to IND-LIFESTYLE-UV-EXPOSURE-PREVENTION-
  PROTECTION. Patient declines structured UV-protection program
  (occupation, recreational preference, body-image concerns) — receives
  age- and risk-appropriate clinical skin exam + skin self-exam
  education + brief intervention with each clinical contact. Per
  CHARTER §11 patient-autonomy framing — UV exposure is a legitimate
  patient choice but framed as suboptimal vs. protected comparator.

rationale_ua: >
  Альтернативний трек-компаньйон до IND-LIFESTYLE-UV-EXPOSURE-PREVENTION-
  PROTECTION. Пацієнт відмовляється від структурованої програми захисту
  від УФ-опромінення (професійні обставини, уподобання щодо відпочинку,
  стурбованість зовнішнім виглядом) — отримує відповідний віку та ризику
  клінічний огляд шкіри + навчання самообстеженню шкіри + коротке
  консультування при кожному клінічному контакті. Відповідно до CHARTER
  §11 — вплив УФ-опромінення є законним вибором пацієнта, але подається
  як менш оптимальний порівняно з варіантом захисту.

