do_not_do:
  - "Не виправдовувати перебування під УФ-опроміненням необхідністю вітаміну D — прийом добавок безпечніший і ефективніший."
  - "Не використовувати спрей-сонцезахисний засіб без оцінки достатності нанесення — часто наноситься в недостатній кількості."
  - "Не подавати солярій як безпечнішу альтернативу природному сонцю — обидва є канцерогенами групи 1 за класифікацією IARC."
  - "Не делегувати огляд шкіри лікарю, що не є дерматологом, у пацієнтів високого ризику (численні атипові невуси, сімейний анамнез) — навченість дерматоскопії має значення."
  - "Не пропускати консультування за критеріями ABCDE — самообстеження шкіри без чітких критеріїв має низьку діагностичну цінність."

do_not_do_en:
  - "Do not justify UV exposure for vitamin D — supplementation is safer and more effective."
  - "Do not use spray sunscreen without adequate coverage assessment — frequently under-applied."
  - "Do not present tanning beds as a safer alternative to natural sun — both are IARC Group 1 carcinogens."
  - "Do not delegate skin exam to a non-dermatologist for high-risk patients (multiple atypical nevi, family history) — dermoscopy training matters."
  - "Do not skip ABCDE counseling — SSE without criteria has poor yield."

