rationale: >
  Standard-track prevention pathway for high UV exposure. Components per
  USPSTF Behavioral Counseling for Skin Cancer Prevention (2018, Grade B
  for 6mo-24y; Grade C ages 25+ with risk factors) + AAD + NCCN Melanoma
  + NCCN Skin Cancer:

  **(1) UV-protection counseling (5 components)** —
  - Shade-seeking 10am-4pm
  - Broad-spectrum SPF ≥30 sunscreen, reapplied q2h + after water/sweat
  - Protective clothing (long sleeves, wide-brim hat, UPF-rated fabric)
  - UV-blocking sunglasses
  - Avoid intentional tanning (sun OR indoor tanning beds — both Group 1
    carcinogens)

  **(2) Tanning-bed cessation** — Absolute recommendation; no safe-tanning
  exposure level. Counsel patients about ~75% melanoma risk increment with
  under-35 tanning-bed use.

  **(3) Skin self-examination (SSE)** — Monthly, full-body, with ABCDE
  criteria for moles (Asymmetry, Border, Color, Diameter, Evolution).
  Partner-assisted exam for hard-to-see areas.

  **(4) Clinical full-body skin examination** — Cadence per risk:
  - Average risk + UV exposure: every 1-3 years from age 40
  - High risk (multiple risk factors, family hx, prior actinic damage):
    every 6-12 months by dermatologist
  - Personal history of NMSC or melanoma: per NCCN Melanoma /
    NCCN Skin survivorship cadence

  **(5) Dermoscopy / total-body photography** for patients with multiple
  atypical nevi or strong family history.

  Combined UV-protection + skin-surveillance significantly reduces invasive
  melanoma + NMSC incidence + mortality. Sunscreen does NOT reduce vitamin
  D status meaningfully in real-world use — counsel against vitamin D
  pretext for foregoing sun protection.

rationale_ua: >
  Стандартний профілактичний шлях за високого рівня УФ-опромінення.
  Компоненти за настановами USPSTF щодо поведінкового консультування
  (2018) + AAD + NCCN Melanoma + NCCN Skin Cancer:

  **(1) Консультування щодо захисту від УФ-опромінення (5 складових)** —
  - Перебування в тіні з 10:00 до 16:00
  - Сонцезахисний засіб широкого спектра дії SPF ≥30, повторне нанесення
    кожні 2 години та після контакту з водою/потовиділення
  - Захисний одяг (довгі рукави, капелюх з широкими крисами, тканина з
    UPF-захистом)
  - Сонцезахисні окуляри з УФ-фільтром
  - Уникнення навмисного засмагання (як на сонці, так і в солярії —
    обидва є канцерогенами групи 1)

  **(2) Відмова від солярію** — абсолютна рекомендація; безпечного рівня
  опромінення не існує. Інформувати про підвищення ризику меланоми
  приблизно на 75% при використанні солярію до 35 років.

  **(3) Самообстеження шкіри** — щомісяця, повне обстеження тіла, за
  критеріями ABCDE. Обстеження за участю партнера для важкодоступних
  ділянок.

  **(4) Клінічний огляд шкіри всього тіла** — періодичність за рівнем
  ризику:
  - Середній ризик + УФ-опромінення: кожні 1-3 роки з 40-річного віку
  - Високий ризик: кожні 6-12 місяців у дерматолога
  - Особистий анамнез немеланомного раку шкіри або меланоми: за
    протоколом спостереження NCCN

  **(5) Дерматоскопія / фотографування всього тіла** для пацієнтів з
  численними атиповими невусами або обтяженим сімейним анамнезом.

  Поєднання захисту від УФ-опромінення та спостереження за шкірою
  суттєво знижує захворюваність і смертність від інвазивної меланоми та
  немеланомного раку шкіри. Використання сонцезахисного засобу суттєво
  не знижує рівень вітаміну D у реальних умовах — не рекомендувати
  уникати захисту від сонця під приводом вітаміну D.

