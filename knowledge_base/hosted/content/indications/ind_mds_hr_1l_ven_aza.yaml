id: IND-MDS-HR-1L-VEN-AZA
plan_track: aggressive

applicable_to:
  disease_id: DIS-MDS-HR
  # line_of_therapy intentionally unset: ALGO-MDS-HR-1L (bridging pre-alloHCT) and
  # ALGO-MDS-HR-2L (post-HMA failure) both route here. No separate 2L-named ven+aza indication.
  stage_requirements: []
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    fit_for_intensive_chemo: true

recommended_regimen: REG-VEN-AZA-AML
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: "~50-70% composite CR + CRi (extrapolated from VIALE-A AML; small phase-2 HR-MDS series; no phase-3 yet)"
  complete_response: "Higher CR rates than aza alone in series; durability + OS benefit not yet phase-3 confirmed"
  progression_free_survival: "Median PFS ~12-15 months in early studies"
  overall_survival_5y: "Insufficient data for HR-MDS-specific 5-y; alloHCT bridging is the path to long-term survival"

hard_contraindications: []
red_flags_triggering_alternative:
  - RF-MDS-FRAILTY-AGE
  - RF-MDS-ORGAN-DYSFUNCTION

required_tests:
  - TEST-CBC
  - TEST-PERIPHERAL-SMEAR
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-COAG-PANEL
  - TEST-URIC-ACID
  - TEST-HBV-SEROLOGY
  - TEST-HCV-ANTIBODY
  - TEST-HIV-SEROLOGY
  - TEST-BM-ASPIRATE
  - TEST-BM-TREPHINE
  - TEST-FLOW-CYTOMETRY
  - TEST-KARYOTYPE
  - TEST-FISH-PANEL
  - TEST-NGS-MYELOID-PANEL
desired_tests:
  - TEST-ECHO

rationale: >
  Aggressive 1L for MDS-HR with high blast burden (MDS-IB2, blasts
  10-19%) where intensified disease control is desired pre-alloHCT
  bridging. Off-label use of ven+aza schedule (extrapolated from
  VIALE-A AML). NOT yet phase-3 confirmed for HR-MDS specifically;
  active trials (VERONA) ongoing. Toxicity (cumulative cytopenias) is
  substantial; selection biased toward fit patients who could tolerate
  alloHCT downstream. TLS prophylaxis MANDATORY for first ramp cycle.

rationale_ua: >
  Агресивний варіант першої лінії для MDS-HR з високим бластним
  навантаженням (MDS-IB2, бласти 10-19%), коли потрібен посилений
  контроль хвороби перед мостом до alloHCT. Застосування схеми
  венетоклакс+азацитидин є використанням поза зареєстрованими
  показаннями (off-label; екстрапольовано з дослідження VIALE-A при
  AML). Ще НЕ підтверджено дослідженням фази 3 саме для MDS-HR; тривають
  активні дослідження (VERONA). Токсичність (кумулятивні цитопенії) є
  значною; відбір пацієнтів зміщений у бік придатних, здатних надалі
  перенести alloHCT. Профілактика синдрому лізису пухлини обов'язкова
  протягом першого циклу нарощування дози.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_oncowiki_review
draft_revision: 1
sources:
  - source_id: SRC-NCCN-AML-2025
    position: supports
    relevant_quote_paraphrase: "Ven+aza considered for blast-rich MDS-HR (off-label; informed consent)"
  - source_id: SRC-VIALE-A-DINARDO-2020
    position: context
    relevant_quote_paraphrase: "VIALE-A established ven+aza in unfit AML; extrapolation to HR-MDS-IB2 is the basis for off-label use"

do_not_do:
  - "Не пропускати 3-денне нарощування дози венетоклаксу + профілактику синдрому лізису пухлини."
  - "Не використовувати ven+aza у пацієнтів, непридатних до alloHCT (стандартна альтернатива — монотерапія азацитидином із кращим профілем токсичності)."
  - "Не очікувати підтвердження дослідженням фази 3 — VERONA та інші дослідження ще тривають; поточне застосування є off-label."
  - "Не пропускати інформовану згоду щодо off-label використання та невизначеності щодо користі для загальної виживаності."

do_not_do_en:
  - "Do not skip venetoclax 3-day ramp + TLS prophylaxis."
  - "Do not use ven+aza in patients non-fit for alloHCT (standard aza alone is an alternative with a better toxicity profile)."
  - "Do not expect phase-3 validation — VERONA and other trials in progress; current use is off-label."
  - "Do not skip informed consent regarding off-label use and uncertainty about OS benefit."
known_controversies:
  - topic: "Ven+aza vs aza alone as 1L for HR-MDS"
    positions:
      - position: "No phase-3 HR-MDS-specific evidence; aza alone remains standard"
        sources:
          - SRC-ESMO-MDS-2021
      - position: "Ven+aza achieves higher CR rates that may better bridge to alloHCT in young fit"
        sources:
          - SRC-NCCN-AML-2025
    our_default: "Aza alone 1L; ven+aza only as informed off-label for blast-rich pre-alloHCT bridge"
    rationale: "Wait for VERONA; off-label use only with patient understanding"

time_critical: false
last_reviewed: "2026-04-25"
reviewers: []
reviewer_signoffs: 0
notes: >
  Aggressive track for MDS-HR. NCCN 2A given off-label status pending
  phase-3. STUB — requires clinical co-lead signoff. Open clinical
  question for clinical reviewer: should this indication be removed
  pending phase-3, or kept as scaffolded option?
