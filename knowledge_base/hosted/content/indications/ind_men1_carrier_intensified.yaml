do_not_do:
  - "Не подавати профілактичну паратиреоїдектомію як обов'язкову — це рішення приймається спільно з пацієнтом, з повним обговоренням хірургічного ризику проти ризику біохімічно безсимптомного гіперпаратиреозу."
  - "Не виконувати тотальну паратиреоїдектомію без автотрансплантації — стійкий гіпопаратиреоз є неприйнятним компромісом для молодого дорослого."
  - "Не інтенсифікувати спостереження за гастриномою у всіх носіїв — це варто резервувати для родин високого ризику (ранній початок, метастатичний індексний випадок)."
  - "Не використовувати ризик перетину з MEN2 / RET як підставу для емпіричної профілактичної тиреоїдектомії — це питання вирішується кальцитоніном та УЗД, а не хірургією."

do_not_do_en:
  - "Do not present prophylactic parathyroidectomy as mandatory — shared-decision-making with full discussion of surgical risk vs biochemically asymptomatic disease risk."
  - "Do not perform total parathyroidectomy without autotransplant — permanent hypoparathyroidism is an unacceptable trade-off in a young adult."
  - "Do not intensify gastrinoma surveillance in all carriers — reserve for high-risk pedigrees (early-onset, metastatic index)."
  - "Do not use MEN2 / RET overlap concern as justification for empirical prophylactic thyroidectomy — calcitonin / US settle the question, not surgery."

