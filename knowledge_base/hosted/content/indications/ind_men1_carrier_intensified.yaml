rationale: >
  Aggressive-track confirmed-carrier pathway: layered on top of the
  IND-MEN1-CARRIER-SURVEILLANCE standard protocol with three
  intensification options that escalate beyond surveillance alone.

  **Foundation:** All standard surveillance from IND-MEN1-CARRIER-
  SURVEILLANCE applies (annual biochemistry from age 5, pituitary MRI
  q3y from age 5, abdominal MRI + chromogranin-A q1y from age 10,
  optional chest CT q1-3y from age 20).

  **Intensification 1 — Earlier prophylactic parathyroid surgery
  discussion:** Once biochemically established hyperparathyroidism is
  documented (elevated PTH + hypercalcemia, even if asymptomatic),
  subtotal (3.5-gland) parathyroidectomy or total parathyroidectomy
  with cervical-thymectomy + heterotopic autotransplant becomes a
  shared-decision option in adolescents / young adults rather than a
  reactive intervention at symptomatic presentation. Trade-off: surgical
  morbidity (recurrent laryngeal nerve injury ~1-2%, permanent
  hypoparathyroidism if no functional autograft).

  **Intensification 2 — Gastrinoma / Zollinger-Ellison intensified
  surveillance:** In families with early-onset gastrinoma pedigree (or
  index proband with metastatic gastrinoma), fasting gastrin q6mo + PPI-
  wash-out secretin stimulation in equivocal cases. Endoscopic
  surveillance (EGD with antral / duodenal biopsies) at lower threshold
  for symptomatic dyspepsia or recurrent peptic ulceration. Most
  gastrinomas in MEN1 are multifocal duodenal microgastrinomas — surgical
  cure is uncommon; goal is functional control + metastasis prevention.

  **Intensification 3 — Early calcitonin baseline + thyroid US:**
  Although MEN1 is not associated with medullary thyroid carcinoma
  (that is MEN2 / RET), some kindreds present with overlap features
  prompting RET differential. Baseline calcitonin + thyroid US at MEN1
  diagnosis settles that question without prolonged ambiguity.

  **Cascade testing remains continuous:** every visit re-confirms
  family's testing status.

  Per CHARTER §11: intensified surveillance and prophylactic surgery
  are classic shared-decision-making domains. Patient autonomy is
  paramount; none of these intensifications are mandated, and the
  standard-track protocol remains the floor.

rationale_ua: >
  Трек агресивного лікування для підтверджених носіїв: накладається
  поверх стандартного протоколу IND-MEN1-CARRIER-SURVEILLANCE і додає
  три опції інтенсифікації, які виходять за межі самого спостереження.

  **Основа:** Застосовується все стандартне спостереження з
  IND-MEN1-CARRIER-SURVEILLANCE (щорічна біохімія з 5 років, МРТ
  гіпофіза q3y з 5 років, МРТ черевної порожнини + хромогранін-А
  щорічно з 10 років, за бажанням КТ грудної клітки q1-3y з 20 років).

  **Інтенсифікація 1 — Раннє обговорення профілактичної
  паратиреоїдектомії:** Після біохімічного підтвердження
  гіперпаратиреозу (підвищений ПТГ + гіперкальціємія, навіть за
  відсутності симптомів) субтотальна (3,5 залози) паратиреоїдектомія
  або тотальна паратиреоїдектомія з шийною тимектомією та
  гетеротопічною автотрансплантацією стає варіантом спільного рішення
  для підлітків / молодих дорослих, а не реактивним втручанням при
  появі симптомів. Компроміс: хірургічна захворюваність (пошкодження
  зворотного гортанного нерва ~1-2%, стійкий гіпопаратиреоз за
  відсутності функціонального автотрансплантата).

  **Інтенсифікація 2 — Інтенсифіковане спостереження за гастриномою /
  синдромом Золлінгера-Еллісона:** У родинах із раннім початком
  гастриноми в анамнезі (або з індексним випадком метастатичної
  гастриноми) — гастрин натще кожні 6 місяців + стимуляційний тест із
  секретином після відміни ІПП у сумнівних випадках. Ендоскопічне
  спостереження (ЕГДС з біопсією антрального відділу та
  дванадцятипалої кишки) за нижчого порогу для симптомної диспепсії
  або рецидивуючої виразкової хвороби. Більшість гастрином при MEN1 —
  це багатовогнищеві дуоденальні мікрогастриноми; хірургічне
  вилікування трапляється рідко, мета — функціональний контроль і
  профілактика метастазування.

  **Інтенсифікація 3 — Ранній базовий кальцитонін і УЗД щитоподібної
  залози:** Хоча MEN1 не асоціюється з медулярним раком щитоподібної
  залози (це ознака MEN2 / RET), деякі родини мають перехресні риси,
  що спонукають до диференціальної діагностики з RET. Базовий
  кальцитонін і УЗД щитоподібної залози на момент встановлення
  діагнозу MEN1 знімають це питання без тривалої невизначеності.

  **Каскадне тестування залишається постійним:** кожен візит
  підтверджує статус тестування родини.

  Відповідно до CHARTER §11: інтенсифіковане спостереження та
  профілактична хірургія — класичні сфери спільного прийняття рішень.
  Автономія пацієнта є пріоритетною; жодна з цих інтенсифікацій не є
  обов'язковою, а стандартний протокол залишається базовим мінімумом.

