do_not_do:
  - "Не виконувати паратиреоїдектомію поодинокої аденоми при MEN1 — багатозалозиста гіперплазія вимагає субтотальної або тотальної паратиреоїдектомії з автотрансплантацією."
  - "Не використовувати КТ як основний метод спостереження за ГЕП-НЕП — довічне кумулятивне променеве навантаження; перевага надається МРТ."
  - "Не пропускати педіатричну біохімію (ПТГ/кальцій, пролактин з 5 років) — первинний гіперпаратиреоз часто проявляється у підлітковому віці."
  - "Не інтерпретувати хромогранін-А ізольовано — прийом ІПП, атрофічний гастрит і ниркова недостатність підвищують частоту хибнопозитивних результатів."
  - "Не пропускати каскадне тестування родичів першого ступеня спорідненості — кожен візит має документувати статус тестування родини."

do_not_do_en:
  - "Do not perform single-adenoma parathyroidectomy in MEN1 — multi-glandular hyperplasia requires subtotal or total + autotransplant."
  - "Do not use CT as the primary GEP-NET surveillance modality — lifelong cumulative radiation burden; MRI preferred."
  - "Do not skip pediatric biochemistry (PTH/Ca, prolactin from age 5) — primary hyperparathyroidism often presents in teen years."
  - "Do not interpret chromogranin-A in isolation — PPI use, atrophic gastritis, and renal impairment raise false-positive rate."
  - "Do not skip cascade testing of first-degree relatives — every surveillance visit should document family testing status."

