do_not_do:
  - "Не подавати розширене спостереження як еквівалент генетичного підтвердження — воно не має діагностичної точності; для родичів втрачається користь каскадного тестування."
  - "Не розпочинати педіатричний протокол МРТ (гіпофіз / черевна порожнина) в межах емпіричного спостереження без підтвердженого носійства або сильного біохімічного сигналу — кумулятивне навантаження МРТ і ризик седації в дитини мають бути зважені."
  - "Не пропускати періодичне повторне обговорення генетичного тестування — більшість пацієнтів зрештою погоджуються на тестування після додаткових візитів і зменшення тривоги."
  - "Не використовувати ПЕТ з 68Ga-DOTATATE / КТ рутинно в межах емпіричного спостереження — це інструмент стадіювання виявленої пухлини, а не скринінговий інструмент у безсимптомних осіб із родинною підозрою."
  - "Не пропускати щорічне визначення кальцію + ПТГ у дітей з 5 років — це єдиний недорогий, безпечний і високоінформативний крок емпіричного скринінгу; відмова від нього лише через те, що родина не погодилась на генетичне тестування, невиправдана."

do_not_do_en:
  - "Do not present enhanced surveillance as equivalent to genetic confirmation — diagnostic precision is absent; cascade-testing benefit for relatives is lost."
  - "Do not initiate the pediatric MRI protocol (pituitary / abdominal) in empirical surveillance without confirmed carriage or a strong biochemical signal — cumulative MRI burden + sedation risk in a child must be balanced."
  - "Do not skip periodic re-discussion of genetic testing — most patients eventually accept testing after additional visits and reduced anxiety."
  - "Do not use 68Ga-DOTATATE PET / CT routinely in empirical surveillance — this is a staging tool for a detected tumor, not a screening tool in asymptomatic pedigree-suspicion."
  - "Do not skip annual calcium + PTH in children from age 5 — this is the single cheap, safe, high-yield empirical screening step; declining it solely because the family declined genetic testing is not warranted."

