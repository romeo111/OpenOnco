do_not_do:
  - "Не відкладати профілактичну тиреоїдектомію в HST-класі (M918T) на пізніше першого року життя — MTC може бути інвазивним уже в грудному віці."
  - "Не виконувати паратиреоїдектомію поодинокої аденоми при гіперпаратиреозі MEN2A — багатозалозиста гіперплазія вимагає субтотальної або тотальної паратиреоїдектомії з автотрансплантацією."
  - "Не виконувати адреналектомію з приводу феохромоцитоми без передопераційної альфа-блокади (обов'язково ≥7-14 днів, феноксибензамін або доксазозин) — ризик життєзагрозливого інтраопераційного кризу."
  - "Не пропускати педіатричне спостереження за метанефринами в HST / групах високого ризику — феохромоцитома може проявитися вже в дитячому віці."

do_not_do_en:
  - "Do not defer prophylactic thyroidectomy in HST class (M918T) beyond the first year of life — MTC can be invasive in infancy."
  - "Do not use single-adenoma parathyroidectomy in MEN2A hyperparathyroidism — multi-glandular hyperplasia requires subtotal or total + autotransplant."
  - "Do not perform pheochromocytoma adrenalectomy without preoperative alpha-blockade (mandatory ≥7-14 days, phenoxybenzamine or doxazosin) — intraoperative crisis risk is life-threatening."
  - "Do not skip pediatric metanephrine surveillance in HST / high-risk classes — pheochromocytoma can present in childhood."

