rationale: >
  Standard-track confirmed-carrier surveillance pathway for RET-positive
  carriers per ATA 2015 Revised Guidelines for the Management of MTC.

  **Prophylactic thyroidectomy (the central MEN2 decision):** Timing is
  RET-class-driven (ATA 2015 risk stratification):
    - **HST (highest-risk):** RET M918T (MEN2B). Total thyroidectomy in
      first year of life (before age 1, ideally first 6 months); central
      lymph node dissection if calcitonin elevated or thyroid nodule
      present. MTC may already be invasive by infancy.
    - **High-risk:** RET codon 634 mutations (C634R, C634Y, C634W, etc.;
      classic MEN2A). Total thyroidectomy by age 5; central lymph node
      dissection at surgeon discretion based on calcitonin and US.
    - **Moderate-risk:** Other RET mutations (e.g., V804M, K666E, L790F,
      etc.). Total thyroidectomy by age 5-10, or deferred to adulthood
      with q1y calcitonin + neck US surveillance — shared decision with
      family, weighted toward earlier surgery if calcitonin rising.

  **Calcitonin q6mo:** Sensitive marker for residual / recurrent MTC
  post-thyroidectomy and for emerging disease in carriers who have
  deferred surgery (moderate-risk class). Pentagastrin / calcium-
  stimulation tests historical (not widely available).

  **Pheochromocytoma surveillance (MEN2A and MEN2B):** Plasma fractionated
  metanephrines OR 24-hour urinary metanephrines + catecholamines q1y,
  starting age 8 (MEN2B / high-risk MEN2A) or age 16 (moderate-risk).
  Cross-sectional imaging (abdominal MRI or CT) at symptomatic / lab
  signal — not routine baseline imaging.

  **Primary hyperparathyroidism (MEN2A only — absent in MEN2B):** Serum
  PTH + ionized calcium q1y starting age 8-11; surgical strategy
  multi-glandular subtotal parathyroidectomy or total + autotransplant
  (NOT single-adenoma excision).

  **Hirschsprung concern:** RET codon 620 / 618 carriers have ~7%
  Hirschsprung disease incidence — symptomatic-driven workup in
  childhood (constipation, megacolon).

  **MEN2B stigmata:** Mucosal neuromas (lips, tongue), corneal nerve
  thickening, marfanoid habitus — visible in infancy if known to look
  for; clinical recognition can prompt RET testing in absence of family
  history.

  **Cascade testing:** Mandates offer to all first-degree relatives;
  particularly time-sensitive given pediatric thyroidectomy timing.

  Per CHARTER §11 patient-autonomy framing; pediatric surgical timing
  requires extensive family counseling.

rationale_ua: >
  Стандартний протокол спостереження для підтверджених RET-позитивних
  носіїв за переглянутими настановами ATA 2015 з ведення MTC.

  **Профілактична тиреоїдектомія (центральне рішення при MEN2):**
  Терміни визначаються RET-класом (стратифікація ризику за ATA 2015):
    - **HST (найвищий ризик):** RET M918T (MEN2B). Тотальна
      тиреоїдектомія в перший рік життя (до 1 року, в ідеалі — перші
      6 місяців); центральна лімфодисекція за підвищеного кальцитоніну
      або наявності вузла щитоподібної залози. MTC може бути
      інвазивним уже в грудному віці.
    - **Високий ризик:** мутації RET у кодоні 634 (C634R, C634Y,
      C634W тощо; класична MEN2A). Тотальна тиреоїдектомія до 5 років;
      центральна лімфодисекція — на розсуд хірурга залежно від
      кальцитоніну та УЗД.
    - **Помірний ризик:** інші мутації RET (напр., V804M, K666E,
      L790F тощо). Тотальна тиреоїдектомія до 5-10 років або
      відтермінована до дорослого віку зі спостереженням (кальцитонін
      + УЗД шиї щорічно) — спільне рішення з родиною, зі схильністю до
      більш раннього хірургічного втручання за зростання кальцитоніну.

  **Кальцитонін кожні 6 місяців:** чутливий маркер залишкового /
  рецидивного MTC після тиреоїдектомії та прояву захворювання у
  носіїв, які відтермінували операцію (група помірного ризику). Проби
  з пентагастрином / стимуляцією кальцієм — історичні (широко
  недоступні).

  **Спостереження за феохромоцитомою (MEN2A і MEN2B):** плазмові
  фракціоновані метанефрини АБО добові сечові метанефрини +
  катехоламіни щорічно, починаючи з 8 років (MEN2B / MEN2A високого
  ризику) або з 16 років (помірний ризик). Поперечна візуалізація
  (МРТ або КТ черевної порожнини) — при симптомах або зміні
  лабораторних показників, не як рутинне базове дослідження.

  **Первинний гіперпаратиреоз (лише MEN2A — відсутній при MEN2B):**
  сироватковий ПТГ + іонізований кальцій щорічно, починаючи з 8-11
  років; хірургічна тактика — багатозалозиста субтотальна
  паратиреоїдектомія або тотальна з автотрансплантацією (НЕ видалення
  поодинокої аденоми).

  **Хвороба Гіршпрунга:** носії з мутаціями в RET-кодоні 620 / 618
  мають ~7% частоту хвороби Гіршпрунга — обстеження за симптомами в
  дитячому віці (запор, мегаколон).

  **Стигмати MEN2B:** слизові невроми (губи, язик), потовщення
  рогівкових нервів, марфаноподібна статура — помітні вже в грудному
  віці за цілеспрямованого огляду; клінічне розпізнавання може стати
  приводом для тестування RET за відсутності обтяженого сімейного
  анамнезу.

  **Каскадне тестування:** обов'язково пропонується всім родичам
  першого ступеня спорідненості; особливо важливо з огляду на терміни
  педіатричної тиреоїдектомії.

  Відповідно до принципу автономії пацієнта за CHARTER §11; терміни
  педіатричної хірургії потребують ретельного консультування родини.

