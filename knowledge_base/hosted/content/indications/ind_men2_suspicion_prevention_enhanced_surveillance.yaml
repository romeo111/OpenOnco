do_not_do:
  - "Не подавати емпіричне спостереження як еквівалент генетичного підтвердження — саме при MEN2 діагностична точність є обов'язковою умовою для центральної інтервенції (профілактичної тиреоїдектомії)."
  - "Не виконувати емпіричну профілактичну тиреоїдектомію без підтвердження RET — хірургічне рішення при MEN2 спирається на стратифікацію за ATA-класом, яка вимагає генетичного тестування."
  - "Не пропускати передопераційну альфа-блокаду, якщо феохромоцитому виявлено під час емпіричного спостереження — навіть без підтвердженого RET виявлену феохромоцитому слід вести як резекцію високого ризику."
  - "Не використовувати проби з пентагастрином / стимуляцією кальцієм — це історична методика, витіснена базовим кальцитоніном + УЗД; не показана в сучасному емпіричному спостереженні."
  - "Не пропускати періодичне повторне обговорення генетичного тестування — саме при MEN2 співвідношення користі й вартості значно на користь тестування; більшість пацієнтів зрештою погоджуються на тестування."

do_not_do_en:
  - "Do not present empirical surveillance as equivalent to genetic confirmation — in MEN2 specifically, diagnostic precision is a prerequisite for the central intervention (prophylactic thyroidectomy)."
  - "Do not perform empirical prophylactic thyroidectomy without RET confirmation — surgical decision-making in MEN2 rests on ATA-class stratification that requires genetic testing."
  - "Do not skip alpha-blockade pre-operatively if a pheochromocytoma is found during empirical surveillance — even without confirmed RET, a detected pheo must be treated as a high-risk resection."
  - "Do not use pentagastrin / calcium stimulation testing — this is a historic procedure replaced by basal calcitonin + ultrasound; not indicated in modern empirical surveillance."
  - "Do not skip periodic re-discussion of genetic testing — in MEN2 specifically, the cost-benefit balance strongly favors testing; most patients eventually accept testing."

