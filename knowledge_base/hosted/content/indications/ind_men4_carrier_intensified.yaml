expected_outcomes:
  overall_response_rate: >-
    Intensified track layers two options on top of the standard MEN4
    surveillance protocol: (1) MEN1-equivalent surveillance intervals
    (annual biochemistry from age 5, pituitary MRI q3y, abdominal MRI
    q1y) for high-risk pedigrees (early-onset proband, multi-organ
    proband disease, family cluster) or carrier preference — moves
    from MEN4-specific longer intervals to classical MEN1 protocol;
    (2) intensified gastrinoma / Zollinger-Ellison surveillance for
    carriers with any biochemical gastrin elevation or symptoms of
    peptic ulcer disease — including fasting gastrin q6mo and PPI-
    washout secretin stimulation. Trade-off: more surveillance visits
    + imaging studies, anxiety burden, false-positive workups —
    weighed against potentially earlier detection of evolving
    endocrine tumors.

