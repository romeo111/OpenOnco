rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-MEN4-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-MEN4-CARRIER-
  SURVEILLANCE applies (annual biochemistry from 10-15, pituitary MRI
  q3-5y from 15, abdominal MRI q1-2y from 20, optional chest CT q3-5y
  from 25 in males).

  **Intensification 1 — MEN1-equivalent surveillance intervals:** In
  high-risk pedigrees (proband with early-onset MEN-spectrum disease
  before age 30, proband with multi-organ involvement, family cluster
  of multiple affected relatives) OR carrier preference for tighter
  surveillance, advance to classical MEN1 protocol intervals:
    - Annual biochemistry from age 5 (rather than 10-15).
    - Pituitary MRI q3y from age 5 (rather than q3-5y from 15).
    - Abdominal MRI q1y from age 10 (rather than q1-2y from 20).
  Rationale: MEN4 registry data are still evolving; selection bias
  toward symptomatic probands may underestimate true penetrance.
  Carriers / families who prefer caution can opt for MEN1-equivalent
  protocols pending more data.

  **Intensification 2 — Intensified gastrinoma / Zollinger-Ellison
  surveillance:** For MEN4 carriers with any biochemical gastrin
  elevation OR symptoms of peptic ulcer disease (recurrent ulcer,
  refractory dyspepsia, diarrhea) — though gastrinoma is less common
  in MEN4 than MEN1, when it occurs the clinical implications mirror
  MEN1's multi-focal duodenal gastrinoma pattern:
    - Fasting gastrin q6mo plus PPI-washout secretin stimulation in
      equivocal cases.
    - EGD with antral / duodenal biopsies + EUS for sub-cm lesion
      characterization.
    - 68Ga-DOTATATE PET for staging confirmed gastrinoma.
    - Surgical considerations limited (most MEN-gastrinomas are
      multi-focal duodenal microgastrinomas — surgical cure uncommon;
      goal is functional control via PPI + somatostatin analog).

  **Intensification 3 — Earlier-threshold parathyroidectomy
  discussion:** In MEN4 carriers with biochemically established
  hyperparathyroidism, the parathyroidectomy decision is informed by:
    - MEN4 single-gland adenoma pattern often allows targeted
      parathyroidectomy with intraoperative PTH monitoring (vs the
      subtotal / total-autotransplant approach mandated in MEN1).
    - Asymptomatic biochemical-only disease — shared-decision
      monitoring vs surgery; trade-off of bone-density loss / kidney-
      stone risk vs surgical morbidity.
    - Symptomatic disease or unequivocal biochemistry (Ca > 11 mg/dL,
      renal stones, osteoporosis) — proceed with targeted
      parathyroidectomy after careful pre-operative localization
      (sestamibi + ultrasound + 4D-CT as needed).

  **Other intensification considerations (not core to this track):**
    - Empirical prophylactic parathyroidectomy is NOT appropriate in
      MEN4 — biochemistry-driven; surgical indication clear.
    - mTOR-pathway chemoprevention (rapalogs) is investigational in
      MEN4 — do NOT prescribe outside trial setting.
    - Generalized intensified chest CT (annual) is NOT appropriate
      — thymic NET in MEN4 is rare; q3-5y in males is adequate.

  **Cascade testing remains continuous:** every visit re-confirms
  family testing status. Autosomal-dominant inheritance — 50% offspring
  risk.

  Per CHARTER §11: intensified surveillance and earlier parathyroid
  surgery are shared-decision-making domains. Patient autonomy is
  paramount; standard-track protocol remains the floor for
  non-high-risk carriers.

rationale_ua: >
  Aggressive-трекова Indication: накладена поверх IND-MEN4-CARRIER-
  SURVEILLANCE з двома (плюс одна third) опціями інтенсифікації.

  **Foundation:** Усе стандартне з IND-MEN4-CARRIER-SURVEILLANCE.

  **Інтенсифікація 1 — MEN1-equivalent surveillance intervals:** У
  high-risk pedigrees (proband early-onset < 30, multi-organ proband
  disease, family cluster) АБО carrier preference — advance до
  classical MEN1 protocol:
    - Annual biochemistry з 5 років.
    - Pituitary MRI q3y з 5 років.
    - Abdominal MRI q1y з 10 років.
  MEN4 registry data evolving; selection bias може underestimate
  penetrance. Carriers / families which prefer caution — MEN1-
  equivalent pending more data.

  **Інтенсифікація 2 — Інтенсифікована gastrinoma / Zollinger-
  Ellison surveillance:** При biochemical gastrin elevation АБО
  peptic ulcer symptoms:
    - Fasting gastrin q6mo + PPI-washout secretin stimulation
      equivocal cases.
    - EGD з antral / duodenal biopsies + EUS для sub-cm lesion.
    - 68Ga-DOTATATE PET для staging confirmed gastrinoma.
    - Surgical considerations limited — multi-focal duodenal
      microgastrinomas; goal — functional control PPI + SSA.

  **Інтенсифікація 3 — Earlier-threshold parathyroidectomy discussion:**
    - MEN4 single-gland pattern — targeted parathyroidectomy з
      intraoperative PTH monitoring (vs MEN1 subtotal / total +
      autograft).
    - Asymptomatic biochemical-only disease — shared-decision
      monitoring vs surgery.
    - Symptomatic / unequivocal biochemistry (Ca > 11, renal stones,
      osteoporosis) → targeted parathyroidectomy after pre-operative
      localization (sestamibi + US + 4D-CT).

  **Інші міркування:**
    - Empirical prophylactic parathyroidectomy — NOT appropriate у
      MEN4.
    - mTOR-pathway chemoprevention — investigational; NOT outside
      trial.
    - Generalized annual chest CT — NOT appropriate; q3-5y males.

  **Cascade тестування continuous.**

  Per CHARTER §11: shared-decision-making домен.

