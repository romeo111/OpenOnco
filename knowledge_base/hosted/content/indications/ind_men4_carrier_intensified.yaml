do_not_do:
  - "Не intensifyувати у всіх MEN4-carriers — high-risk pedigree (early-onset proband, multi-organ proband, family cluster) або carrier preference — драйвери, не default."
  - "Не виконувати empirical prophylactic parathyroidectomy — biochemistry-driven; clear surgical indication ОБОВ'ЯЗКОВО."
  - "Не використовувати MEN1-style subtotal / total parathyroidectomy у MEN4-carrier без single-gland confirmation — single-gland adenoma typical, targeted approach often appropriate."
  - "Не starting somatostatin analog therapy для gastrinoma без EGD + EUS + multifocal-disease characterization — surgical decision-making vs medical control benefits from full staging."
  - "Не пропускати pre-operative parathyroid localization (sestamibi + US + 4D-CT) — single-gland targeted parathyroidectomy potential робить localization critical для surgical success."

do_not_do_en:
  - "Do not intensify in all MEN4 carriers — high-risk pedigree (early-onset proband, multi-organ proband, family cluster) or carrier preference are the drivers, not the default."
  - "Do not perform empirical prophylactic parathyroidectomy — biochemistry-driven; a clear surgical indication is mandatory."
  - "Do not use MEN1-style subtotal / total parathyroidectomy in a MEN4 carrier without single-gland confirmation — single-gland adenoma is typical and a targeted approach is often appropriate."
  - "Do not start somatostatin analog therapy for gastrinoma without EGD + EUS + multifocal-disease characterization — surgical decision-making vs medical control benefits from full staging."
  - "Do not skip pre-operative parathyroid localization (sestamibi + US + 4D-CT) — the potential for single-gland targeted parathyroidectomy makes localization critical for surgical success."

