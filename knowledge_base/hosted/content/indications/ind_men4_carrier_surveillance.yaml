rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with germline CDKN1B pathogenic variant — MEN4. Protocol is adapted
  from MEN1 (Thakker JCEM 2012, ESE 2024) with MEN4-specific
  adjustments: later age-of-onset surveillance start, somewhat longer
  intervals to reflect lower penetrance in published series.

  **Parathyroid (~80% lifetime in series — most common manifestation):**
  Annual serum PTH + ionized calcium (or albumin-corrected) starting
  age 10-15 (later than MEN1 age 5). MEN4 parathyroid disease is often
  single-gland adenoma (in contrast to MEN1 multi-glandular hyperplasia)
  — surgical approach may be more conservative: targeted
  parathyroidectomy with intraoperative PTH monitoring is reasonable
  in MEN4 single-gland disease, vs the subtotal / total-with-autotransplant
  approach mandated in MEN1. Registry data still evolving — case-by-
  case decisions, ideally in MEN-experienced endocrine surgery
  centers.

  **Pituitary (~30-40%):** Annual prolactin + IGF-1 from age 15.
  Pituitary MRI q3-5y starting age 15 (longer interval than MEN1's
  q3y, reflecting lower MEN4 pituitary penetrance). Functioning
  pituitary tumors in MEN4 lean toward ACTH-secreting (Cushing) +
  somatotroph (acromegaly) — different from MEN1's prolactinoma
  predominance. Therapy follows tumor-type-specific guidelines
  (transsphenoidal resection for Cushing; pasireotide / cabergoline
  / surgery for somatotrophs; dopamine agonist + surgery for
  prolactinomas).

  **GEP-NET (variable; pancreatic + duodenal + gastric):**
  Chromogranin-A + fasting gastrin q1y from age 20 (later than MEN1).
  Abdominal MRI q1-2y starting age 20 (longer interval than MEN1's
  q1y). EUS adjunct for sub-cm pancreatic lesion characterization
  in selected cases. 68Ga-DOTATATE PET for staging confirmed lesions
  (not routine surveillance). Gastrinoma is less common in MEN4 than
  MEN1 — gastrin elevation in CDKN1B-confirmed carriers should still
  prompt prompt secretin-stimulation workup but the pre-test
  probability of multi-focal duodenal gastrinoma is lower.

  **Adrenocortical (modest, ~10-20%):** Captured incidentally on
  abdominal MRI surveillance — no dedicated biochemistry unless
  functional features (Cushing, virilization, aldosteronism) emerge
  clinically.

  **Bronchial / thymic NET (rare):** Chest CT q3-5y from age 25 in
  male carriers (less aggressive than MEN1 thymic NET surveillance
  given lower MEN4 thymic-NET penetrance, but male-carrier bias still
  evident in registry data).

  **Reproductive-tract NET (cervical, testicular):** Standardized
  surveillance not established. Standard well-woman / well-man exams
  with attention to any pelvic mass or testicular abnormality;
  individualize given registry data evolution.

  **Cascade testing:** Autosomal-dominant — first-degree relatives
  have 50% inheritance risk. Cascade testing offer + counseling at
  every surveillance visit. Pediatric testing (age 10-12) may be
  appropriate given late-childhood biochemistry initiation, but
  earlier than MEN1 because penetrance + onset differ; family-cluster
  age-of-onset should modify timing.

  Per CHARTER §11 patient-autonomy framing: surveillance intervals are
  shared-decision-making with the patient. Counseling should
  acknowledge the evolving evidence base for MEN4 — protocol
  intervals may revise as registry data accumulate; care plans should
  remain flexible.

rationale_ua: >
  Стандартний-трекова Indication для confirmed-carrier MEN4 surveillance.
  Протокол адаптований з MEN1 (Thakker JCEM 2012, ESE 2024) з MEN4-
  specific adjustments: later age-of-onset surveillance start, somewhat
  longer intervals reflecting lower penetrance у published series.

  **Паращитоподібні (~80% lifetime — найчастіший прояв):** Annual
  PTH + іонізований кальцій з 10-15 років (later than MEN1 age 5).
  MEN4 parathyroid disease often single-gland adenoma (vs MEN1
  multi-glandular hyperplasia) — surgical approach может бути більш
  conservative: targeted парватиреоїдектомія з intraoperative PTH
  monitoring reasonable у MEN4 single-gland disease, vs subtotal /
  total-with-autotransplant mandated у MEN1.

  **Гіпофіз (~30-40%):** Annual prolactin + IGF-1 з 15 років.
  Pituitary MRI q3-5y starting 15 (longer than MEN1 q3y). Functioning
  tumors у MEN4 lean toward ACTH-secreting (Cushing) + somatotroph
  (acromegaly) — different from MEN1 prolactinoma predominance.

  **GEP-NET (variable; pancreatic + duodenal + gastric):**
  Хромогранін-А + fasting gastrin q1y з 20 років (later than MEN1).
  Абдомінальна MRI q1-2y starting 20 (longer than MEN1 q1y). EUS
  adjunct для sub-cm pancreatic lesion. 68Ga-DOTATATE PET для
  confirmed lesions. Gastrinoma less common у MEN4 ніж MEN1.

  **Adrenocortical (modest):** Incidentally на abdominal MRI.

  **Bronchial / thymic NET (rare):** Chest CT q3-5y з 25 років у
  male carriers.

  **Reproductive-tract NET (cervical, testicular):** Standardized
  surveillance not established; well-exam attention.

  **Cascade тестування:** Autosomal-dominant — 50% inheritance. Cascade
  тестування offer + counseling. Pediatric тестування (10-12 років)
  appropriate given late-childhood biochemistry initiation.

  Per CHARTER §11 framing автономії пацієнта. Evolving evidence base
  для MEN4 — інтервали можуть revise як registry data accumulate;
  flexible care plans.

