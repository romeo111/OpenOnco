sources:
  - source_id: SRC-NCCN-NET-2025
    position: supports
    relevant_quote_paraphrase: >-
      "MEN4 (CDKN1B) carriers should enter MEN1-like multi-organ
      endocrine surveillance, with intervals adjusted for the lower
      penetrance and later age-of-onset characteristic of MEN4 series
      data: annual biochemistry from age 10-15, pituitary MRI q3-5y
      from age 15, abdominal MRI q1-2y from age 20."

do_not_do:
  - "Не вважати MEN4 surveillance identical to MEN1 — MEN4 has later age-of-onset + generally lower penetrance + different pituitary tumor distribution; protocol intervals reflect this."
  - "Не використовувати subtotal / total parathyroidectomy без shared-decision discussion у MEN4 — single-gland adenoma typical (vs MEN1 multi-glandular hyperplasia); targeted parathyroidectomy може бути більш appropriate."
  - "Не overstate certainty про MEN4 natural history — registry data evolving; counseling should acknowledge uncertainty rather than promise reassurance або worry."
  - "Не пропускати pediatric testing offer — pediatric testing (10-12 років) may be appropriate, але modify timing based на family-cluster age-of-onset."
  - "Не пропускати cascade-тестування first-degree родичів — кожен візит має документувати family testing status."

do_not_do_en:
  - "Do not treat MEN4 surveillance as identical to MEN1 — MEN4 has later age-of-onset, generally lower penetrance, and a different pituitary tumor distribution; protocol intervals reflect this."
  - "Do not use subtotal / total parathyroidectomy without shared-decision discussion in MEN4 — single-gland adenoma is typical (vs MEN1 multi-glandular hyperplasia); targeted parathyroidectomy may be more appropriate."
  - "Do not overstate certainty about MEN4 natural history — registry data are still evolving; counseling should acknowledge uncertainty rather than promise reassurance or worry."
  - "Do not skip pediatric testing offer — pediatric testing (age 10-12) may be appropriate, but modify timing based on family-cluster age-of-onset."
  - "Do not skip cascade testing of first-degree relatives — every surveillance visit should document family testing status."

known_controversies:
  - topic: "Surveillance intervals — MEN4 same as MEN1 or longer?"
    positions:
      - position: "Longer intervals (MEN4-specific adjustment)"
        sources: [SRC-NCCN-NET-2025]
        evidence_note: "Reflects lower penetrance + later onset in published MEN4 series; minimizes surveillance burden."
      - position: "MEN1-equivalent intervals"
        sources: []
        evidence_note: "Registry data may underestimate MEN4 penetrance (selection bias toward symptomatic probands); some MEN-clinic groups advocate MEN1-equivalent intervals pending more data."
    our_default: "Longer intervals (MEN4-specific)"
    rationale: >
      Reflects current published-series penetrance; will revise as
      registry data mature. Intensified track is available for
      high-risk pedigrees or carrier preference. Shared-decision-making
      per CHARTER §11.

