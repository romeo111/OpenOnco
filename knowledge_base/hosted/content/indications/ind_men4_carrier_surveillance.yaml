expected_outcomes:
  overall_response_rate: >-
    Structured multi-organ endocrine surveillance adapted from the
    MEN1 Thakker / ESE protocol but adjusted for MEN4's later age-of-
    onset and generally less aggressive natural history. Annual
    biochemistry (PTH + ionized Ca + prolactin + IGF-1 + chromogranin-A)
    from late childhood / adolescence detects parathyroid +
    pituitary disease at biochemical-only stage; pituitary MRI at
    longer intervals (q3-5y) than MEN1 (q3y) reflects lower MEN4
    pituitary penetrance; abdominal MRI q1-2y from age 20 detects
    GEP-NETs at smaller, enucleation-amenable sizes. Surveillance
    burden is similar to MEN1 but with longer intervals — registry
    data evolving and may revise intervals in future iterations.

