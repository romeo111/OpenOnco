rationale: >
  Teclistamab (BCMA × CD3 bispecific) for triple-class refractory
  multiple myeloma after ≥3 prior lines including PI, IMiD, and
  anti-CD38 antibody. MajesTEC-1 trial: ORR 63%, CR 39%, mPFS ~11 mo,
  mOS ~22 mo — substantially better than historical triple-class-
  refractory outcomes (mOS ~6 mo with conventional therapy).
  Off-the-shelf (vs CAR-T's manufacturing window) — major operational
  advantage in rapidly progressive disease. Step-up dosing with
  inpatient observation REQUIRED (CRS Grade 1-2 in ~70% during step-up).
  Universal hypogammaglobulinemia → IVIG support throughout.
  Key safety dimension: severe infection burden — bispecifics produce
  more prolonged + severe immunosuppression than CAR-T. Ukraine access:
  not registered; international referral required.

rationale_ua: >
  Тецлістамаб (teclistamab) (біспецифічне антитіло BCMA × CD3) для
  тройно-рефрактерної множинної мієломи після ≥3 попередніх ліній
  терапії, включно з інгібітором протеасоми (ІП), імуномодулюючим
  препаратом (IMiD) та анти-CD38 антитілом. Дослідження MajesTEC-1:
  загальна частота відповіді 63%, повна відповідь 39%, медіана
  виживаності без прогресування ~11 міс, медіана загальної
  виживаності ~22 міс — суттєво краще за історичні результати при
  тройно-рефрактерному захворюванні (медіана загальної виживаності
  ~6 міс на традиційній терапії). Готовий до застосування препарат
  (на відміну від виробничого вікна CAR-T-терапії) — важлива
  операційна перевага при швидкопрогресуючому захворюванні.
  Ступінчасте підвищення дози зі стаціонарним спостереженням є
  ОБОВ'ЯЗКОВИМ (синдром вивільнення цитокінів ступеня 1-2 у ~70%
  пацієнтів під час ступінчастого підвищення). Універсальна
  гіпогаммаглобулінемія потребує підтримки внутрішньовенним
  імуноглобуліном протягом усього лікування. Ключовий аспект
  безпеки: тяжкий інфекційний тягар — біспецифічні антитіла
  спричиняють більш тривалу та тяжку імуносупресію, ніж CAR-T-терапія.
  Доступ в Україні: препарат не зареєстрований; необхідне міжнародне
  направлення.
