sources:
  - source_id: SRC-NCCN-MM-2025
    position: supports
    relevant_quote_paraphrase: "Teclistamab is recommended for triple-class refractory MM after ≥3 prior lines (Cat 2A), based on MajesTEC-1 trial efficacy"
  - source_id: SRC-ESMO-MM-2023
    position: supports
    relevant_quote_paraphrase: "BCMA-targeting bispecifics (teclistamab, elranatamab) are emerging standard for triple-class refractory MM where CAR-T not available"

  - source_id: SRC-MAJESTEC-1-MOREAU-2022
    position: supports
    relevant_quote_paraphrase: MAJESTEC-1 trial — see referenced publication for primary outcome data.
known_controversies:
  - topic: "Teclistamab vs BCMA CAR-T (cilta-cel, ide-cel) for triple-class refractory MM"
    positions:
      - position: "Bispecific: off-the-shelf, no manufacturing window, repeated dosing — useful for fast-progressing disease"
        sources: [SRC-NCCN-MM-2025]
      - position: "CAR-T: deeper + more durable responses (cilta-cel CARTITUDE-1: ORR 98%, mPFS ~35 mo) — preferred when manufacturing tolerable"
        sources: [SRC-NCCN-MM-2025]
        evidence_note: "Cross-trial comparison only; both products active; toxicity profile differs"
    our_default: "Bispecific (teclistamab) when CAR-T manufacturing not feasible OR fast progression precludes 4-week wait; CAR-T (cilta-cel) preferred for durable remission goal"
    rationale: "Both modalities require international referral in Ukraine — choice driven by partner-center availability + disease tempo"

do_not_do:
  - "НЕ розпочинати лікування в амбулаторних умовах — дози зі ступінчастим підвищенням потребують стаціонарного спостереження ≥48 год для контролю синдрому вивільнення цитокінів."
  - "НЕ пропускати введення внутрішньовенного імуноглобуліну при IgG <400 — універсальна гіпогаммаглобулінемія та інфекційний тягар є провідною причиною смертності."
  - "НЕ пропускати профілактику PJP та HSV/VZV — ризик опортуністичної інфекції дуже високий."
  - "НЕ продовжувати лікування за наявності активної неконтрольованої інфекції — обов'язкова пауза до її купірування."
  - "НЕ розпочинати лікування без тоцилізумабу (tocilizumab) напоготові (≥2 дози) для екстреного купірування синдрому вивільнення цитокінів."
  - "НЕ призначати за вихідного ECOG ≥3 — такі пацієнти були виключені з клінічного дослідження; смертність на тлі лікування у ослаблених пацієнтів дуже висока."
  - "НЕ забувати про живі вакцини — протипоказані під час лікування та протягом ≥6 місяців після нього."
  - "НЕ підтверджувати план без узгодженого шляху міжнародного направлення та фінансування — препарат недоступний в Україні."

do_not_do_en:
  - "Do not start outside inpatient settings — step-up doses require ≥48h hospital observation for CRS surveillance."
  - "Do not skip IVIG for IgG <400 — universal hypogammaglobulinemia + infectious burden is a leading cause of mortality."
  - "Do not skip PJP + HSV/VZV prophylaxis — opportunistic infection risk is very high."
  - "Do not continue with active uncontrolled infection — pause until resolution is mandatory."
  - "Do not start without on-site tocilizumab (≥2 doses) for emergency CRS rescue."
  - "Do not prescribe with baseline ECOG ≥3 — clinical trial excluded; on-treatment mortality very high in frail patients."
  - "Do not forget about live vaccines — contraindicated during and ≥6 months after treatment."
  - "Do not confirm plan without international referral pathway + funding — drug not available in Ukraine."
time_critical: false
last_reviewed: "2026-04-25"
reviewers: []
reviewer_signoffs: 0
notes: >
  STUB — pending Clinical Co-Lead sign-off. Aggressive-track 4L+ option
  for triple-class refractory MM. Talquetamab (GPRC5D × CD3),
  elranatamab (BCMA × CD3), cilta-cel + ide-cel CAR-T are alternative
  modalities — separate future Indications. International referral
  pathway is dominant access barrier.
