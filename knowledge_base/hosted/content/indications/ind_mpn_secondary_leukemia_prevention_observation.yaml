do_not_do:
  - "Не використовувати цей шлях у пацієнтів зі стійким відхиленням показників крові — таким пацієнтам показане активне спостереження."
  - "Не подавати спостереження як еквівалент структурованого активного спостереження — прогресування між візитами виявляється на пізнішій стадії."
  - "Не ігнорувати появу нової цитопенії, бластів або спленомегалії — показане негайне дослідження кісткового мозку."
  - "Не використовувати цей шлях у пацієнтів із тромбозом в анамнезі — високий ризик рецидиву потребує активного ведення."
  - "Не пропускати періодичне обговорення можливості переходу на активніше спостереження — з часом у драйвер-позитивних пацієнтів часто розвивається маніфестний МПН, що потребує переходу на стандартний трек."

do_not_do_en:
  - "Do not use this pathway in patients with sustained blood-count abnormality — they require active surveillance."
  - "Do not present observation as equivalent to structured surveillance — interval progression is detected at later stage."
  - "Do not ignore new cytopenia, blasts, or splenomegaly — immediate bone marrow evaluation indicated."
  - "Do not use this pathway in patients with prior thrombosis — high recurrence risk requires active management."
  - "Do not skip periodic re-discussion of upgrade — driver-positive patients often develop manifest MPN over time and warrant transition to the standard track."

