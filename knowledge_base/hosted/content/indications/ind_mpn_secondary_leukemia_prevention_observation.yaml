rationale: >
  Alternative-track companion to IND-MPN-SECONDARY-LEUKEMIA-
  PREVENTION-SURVEILLANCE. Appropriate for driver-mutation-positive
  patients without sustained blood-count abnormality, without
  splenomegaly, and without symptom burden, who choose minimum-
  intensity surveillance for any of: stable disease over many years,
  cost / access constraints (no nearby hematology center capable of
  molecular monitoring), advanced age with limited life expectancy,
  or explicit preference after informed-consent discussion.

  **Cadence:**
    - Hematology follow-up per usual cadence (q6-12mo) with examination,
      CBC, basic metabolic panel
    - Peripheral smear review on any abnormal CBC
    - Bone marrow evaluation only when triggered by:
      - New persistent cytopenia of any lineage
      - Circulating blasts >1% on smear
      - New or progressive splenomegaly
      - New constitutional symptoms (fatigue out of proportion, weight
        loss >5-10%, night sweats, bone pain)
      - WHO-criteria-suspicious blood-count pattern (sustained
        thrombocytosis, polycythemia, leukocytosis)
    - Molecular monitoring (JAK2 allele burden, NGS panel) only on
      request or trigger

  **Not appropriate for:**
    - Patients with sustained blood-count abnormality consistent with
      pre-WHO-criteria MPN (these warrant active surveillance)
    - Patients with palpable splenomegaly or symptomatic disease
    - Patients with prior thrombosis (high recurrence risk; antiplatelet
      management and active monitoring indicated)
    - Patients with adverse molecular features on prior NGS panel
      (TP53, ASXL1, EZH2 mutations)
    - JAK2-positive patients without cardiovascular risk-management
      plan (aspirin + risk-factor modification recommended)

  Per CHARTER §11 patient-autonomy framing: driver-mutation positivity
  without sustained blood-count abnormality or progression features
  carries modest absolute leukemic-transformation risk in any given
  year (~0.5%/year average across MPN phenotypes). Informed-consent
  observation is defensible for this asymptomatic subset. Patient
  retains option to upgrade to active surveillance at any visit;
  emerging cytopenia, blasts, or splenomegaly mandates transition.

  **Alarm features** route immediately to peripheral smear review +
  bone marrow evaluation + molecular workup — and if WHO-criteria-
  meeting MPN, sAML, or post-MPN MF is confirmed, to the relevant
  treatment-persona algorithm (DIS-PV / DIS-ET / DIS-PMF treatment, or
  DIS-AML for sAML).

rationale_ua: >
  Альтернативно-трекова індикація — доповнення до
  IND-MPN-SECONDARY-LEUKEMIA-PREVENTION-SURVEILLANCE. Доречна для
  пацієнтів із позитивністю за драйверною мутацією без стійкого
  відхилення показників крові, без спленомегалії та без тягаря
  симптомів, які обирають спостереження мінімальної інтенсивності з
  будь-якої з причин: стабільне захворювання протягом багатьох років,
  обмеження вартості/доступу (відсутність поблизу гематологічного
  центру, здатного на молекулярний моніторинг), похилий вік з
  обмеженою тривалістю життя, або чітко висловлена перевага після
  обговорення в рамках інформованої згоди.

  **Частота спостереження:**
    - Гематологічне спостереження зі звичайною періодичністю (кожні
      6-12 міс) з оглядом, загальним аналізом крові, базовою
      метаболічною панеллю
    - Перегляд периферичного мазка за будь-якого відхилення загального
      аналізу крові
    - Дослідження кісткового мозку лише за наявності тригера:
      - Нова стійка цитопенія будь-якого ростка кровотворення
      - Циркулюючі бласти >1% у мазку
      - Нова або прогресуюча спленомегалія
      - Нові конституційні симптоми (непропорційна втома, втрата ваги
        >5-10%, нічна пітливість, біль у кістках)
      - Підозріла за критеріями ВООЗ картина показників крові (стійкий
        тромбоцитоз, поліцитемія, лейкоцитоз)
    - Молекулярний моніторинг лише за запитом або тригером

  **Не доречна для:**
    - Пацієнтів зі стійким відхиленням показників крові, що відповідає
      до-ВООЗ-критеріальному МПН (потребують активного спостереження)
    - Пацієнтів із пальпованою спленомегалією або симптомним
      захворюванням
    - Пацієнтів із тромбозом в анамнезі (високий ризик рецидиву;
      показані антитромбоцитарна терапія та активний моніторинг)
    - Пацієнтів із несприятливими молекулярними ознаками за
      попередньою NGS-панеллю (мутації TP53, ASXL1, EZH2)
    - JAK2-позитивних пацієнтів без плану управління серцево-судинним
      ризиком (рекомендовані аспірин та корекція факторів ризику)

  Відповідно до формулювання щодо автономії пацієнта в CHARTER §11:
  позитивність за драйверною мутацією без стійкого відхилення
  показників крові чи ознак прогресування пов'язана з помірним
  абсолютним ризиком лейкемічної трансформації в будь-який окремий рік
  (у середньому ~0.5% на рік для різних фенотипів МПН). Спостереження
  за принципом інформованої згоди є обґрунтованим для цієї
  безсимптомної підгрупи. Пацієнт зберігає можливість переходу на
  активне спостереження на будь-якому візиті; поява цитопенії, бластів
  або спленомегалії вимагає такого переходу.

  **Тривожні ознаки** одразу спрямовують до перегляду периферичного
  мазка + дослідження кісткового мозку + молекулярного обстеження — і
  за підтвердження МПН за критеріями ВООЗ, sAML або мієлофіброзу після
  МПН — до відповідного лікувального алгоритму (лікування DIS-PV /
  DIS-ET / DIS-PMF, або DIS-AML для sAML).

