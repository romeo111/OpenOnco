notes: >
  STUB — alternative-track companion for MPN / secondary AML
  prevention. Required for §15.2 C4 ≥2-tracks invariant. Two-Co-Lead
  signoff queued. As with the standard track, patients with confirmed
  DIS-PV / DIS-ET / DIS-PMF Disease entity route through the
  treatment-persona MPN algorithm; this Indication targets pre-MPN-
  criteria driver-mutation-positive patients only.
