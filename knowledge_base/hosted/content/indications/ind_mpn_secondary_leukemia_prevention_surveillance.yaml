followed_by: []

evidence_level: moderate
strength_of_recommendation: strong
nccn_category: "2A"

expected_outcomes:
  overall_response_rate: >-
    Structured hematologic surveillance (CBC + peripheral smear q3-6mo
    + bone marrow on cytopenia/blast emergence + JAK2/CALR/MPL allele-
    burden q12mo) in driver-mutation-positive patients without
    confirmed MPN Disease enables earliest detection of WHO-criteria-
    meeting MPN (transition to treatment-persona management) and of
    clonal evolution to MF or sAML. Surveillance does not reduce
    baseline incidence of leukemic transformation but improves
    transplant-eligibility window by catching transformation early.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Standard-track prevention pathway for patients with MPN-driver-
  mutation positivity (JAK2 V617F, CALR exon 9, MPL W515) without yet-
  confirmed MPN Disease entity, or with pre-WHO-criteria MPN phenotype
  still under workup. Multi-component standard:

  **Peripheral blood + clinical surveillance:**
    - CBC + peripheral smear q3-6mo
    - Watch for: rising platelet count >450 ×10⁹/L (suggests ET),
      rising Hb/Hct >16.5/49.5 (men) or >16/48.5 (women) (suggests
      PV), unexplained leukocytosis with shift, circulating blasts,
      nucleated RBCs, teardrop cells (suggests MF)
    - Splenomegaly assessment by examination ± abdominal US q6-12mo
    - Symptom burden via MPN-SAF-TSS or equivalent score q6-12mo
      (fatigue, pruritus, splenic discomfort, night sweats, bone pain)

  **Bone marrow evaluation triggers (NOT routine scheduled):**
    - New cytopenia of any lineage not explained by another cause
    - Circulating blasts >1% on peripheral smear
    - Rapidly progressive splenomegaly
    - New constitutional symptoms (B-symptoms, weight loss >10%)
    - Allele burden rising >25% over baseline on serial JAK2 V617F
      measurements
    - Patient meets WHO MPN criteria on blood-and-clinical findings —
      bone marrow confirms and assigns disease entity (PV, ET, PMF)
      which then transitions patient to treatment-persona management

  **Molecular surveillance:**
    - JAK2 V617F allele burden q12mo for JAK2-positive patients
    - CALR / MPL — qualitative status established at baseline; quantitative
      monitoring less standardized
    - Next-generation panel for additional myeloid-driver mutations
      (TP53, ASXL1, EZH2, IDH1/2, SRSF2) at diagnosis to refine prognosis
      and identify high-risk-progression molecular signatures

  **Thrombosis-risk assessment + antiplatelet:**
    - Stratify thrombosis risk (age >60, prior thrombosis history,
      cardiovascular risk factors) at every visit
    - Low-dose aspirin (75-100 mg/day) for asymptomatic JAK2-positive
      adults without contraindication — per NCCN-MPN 2025 reduces
      thrombotic events even in pre-WHO-criteria phase

  **Transition triggers:**
    - WHO-criteria-meeting PV / ET / PMF → transition to treatment-
      persona MPN algorithm (cytoreduction with hydroxyurea or
      ruxolitinib, phlebotomy for PV, aspirin continuation,
      hematology-MDT follow-up)
    - sAML (≥20% blasts in marrow or peripheral blood) → transition to
      DIS-AML treatment algorithm; allo-HCT evaluation if fit
    - Post-MPN MF (transformation from PV/ET) → ruxolitinib for symptom
      control; allo-HCT evaluation for fit younger patients with
      adverse prognostic features

  In Ukraine, JAK2/CALR/MPL molecular testing available at major
  hematology centers (Institute of Hematology in Kyiv, regional
  cancer centers); allele-burden monitoring less universally available
  outside reference labs. Bone marrow biopsy widely available; expert
  hematopathology review at tertiary centers. Allo-HCT performed at
  Ohmatdyt (pediatric), Shalimov (adult) — limited capacity, requires
  early referral.

rationale_ua: >
  Стандартний-трек профілактичний шлях для пацієнтів з позитивністю за
  драйверними мутаціями МПН (JAK2 V617F, CALR екзон 9, MPL W515) без
  ще підтвердженої нозологічної одиниці МПН, або з фенотипом МПН, що
  ще не відповідає критеріям ВООЗ і перебуває під диференційною
  діагностикою. Багатокомпонентний стандарт:

  **Периферична кров + клінічне спостереження:**
    - Загальний аналіз крові + перегляд периферичного мазка кожні
      3-6 міс
    - Слідкувати за: зростанням кількості тромбоцитів >450 ×10⁹/л
      (свідчить про PV), зростанням Hb/Hct >16.5/49.5 (чоловіки) або
      >16/48.5 (жінки) (свідчить про PV), незрозумілим лейкоцитозом зі
      зсувом формули, циркулюючими бластами, ядровмісними
      еритроцитами, краплеподібними еритроцитами (свідчить про MF)
    - Оцінка спленомегалії за оглядом ± УЗД органів черевної порожнини
      кожні 6-12 міс
    - Оцінка тягаря симптомів за шкалою MPN-SAF-TSS або еквівалентною
      кожні 6-12 міс (втома, свербіж, дискомфорт у ділянці селезінки,
      нічна пітливість, біль у кістках)

  **Тригери для дослідження кісткового мозку (НЕ за плановим
  графіком):**
    - Нова цитопенія будь-якого ростка кровотворення, не пояснена
      іншою причиною
    - Циркулюючі бласти >1% у периферичному мазку
    - Швидко прогресуюча спленомегалія
    - Нові конституційні симптоми (В-симптоми, втрата ваги >10%)
    - Зростання алельного навантаження >25% від вихідного рівня за
      серійними вимірюваннями JAK2 V617F
    - Пацієнт відповідає критеріям ВООЗ для МПН за даними крові та
      клінічної картини — дослідження кісткового мозку підтверджує та
      встановлює нозологічну одиницю (PV, ET, PMF), після чого
      пацієнт переходить до лікувального алгоритму

  **Молекулярний моніторинг:**
    - Алельне навантаження JAK2 V617F кожні 12 міс для JAK2-позитивних
      пацієнтів
    - CALR / MPL — якісний статус встановлюється на вихідному етапі;
      кількісний моніторинг менш стандартизований
    - NGS-панель для додаткових мієлоїдних драйверних мутацій (TP53,
      ASXL1, EZH2, IDH1/2, SRSF2) на момент діагностики для уточнення
      прогнозу та виявлення молекулярних підгруп високого ризику
      прогресування

  **Оцінка ризику тромбозу + антитромбоцитарна терапія:**
    - Стратифікація ризику тромбозу (вік >60 років, тромбоз в
      анамнезі, серцево-судинні фактори ризику) на кожному візиті
    - Аспірин у низькій дозі (75-100 мг/добу) для безсимптомних
      JAK2-позитивних дорослих без протипоказань — за NCCN-MPN 2025
      знижує частоту тромботичних подій навіть на до-ВООЗ-
      критеріальній стадії

  **Тригери переходу:**
    - МПН, що відповідає критеріям ВООЗ (PV / ET / PMF) → перехід до
      лікувального алгоритму МПН (циторедукція гідроксисечовиною або
      руксолітинібом, флеботомія при PV, продовження аспірину,
      спостереження мультидисциплінарною командою гематологів)
    - sAML (≥20% бластів у кістковому мозку або периферичній крові) →
      перехід до алгоритму лікування DIS-AML; оцінка можливості
      алоТГСК за придатності
    - Пост-МПН MF (трансформація з PV/ET) → руксолітиніб для контролю
      симптомів; оцінка можливості алоТГСК для придатних молодших
      пацієнтів із несприятливими прогностичними ознаками

  В Україні молекулярне тестування JAK2/CALR/MPL доступне у провідних
  гематологічних центрах (Інститут гематології у Києві, обласні
  онкологічні центри); моніторинг алельного навантаження менш
  повсюдно доступний поза референс-лабораторіями. Біопсія кісткового
  мозку широко доступна; експертний перегляд гематопатологом — у
  центрах третинного рівня. АлоТГСК виконується в Охматдиті
  (педіатрична) та Інституті ім. Шалімова (доросла) — обмежена
  потужність, потребує раннього направлення.

