do_not_do:
  - "Не презентувати observation як equivalent intensified surveillance — surveillance-detected breast cancer має substantially кращі outcomes."
  - "Не пропускати cascade-тестування + partner-carrier testing — ці кроки не залежать від surveillance schedule."
  - "Не пропускати dense-breast imaging considerations — supplemental ultrasound може бути middle-ground option, якщо MRI declined."
  - "Не нормалізувати de-intensification у high-family-history carrier — counsel що family-history-positive carrier має upper-range risk."

do_not_do_en:
  - "Do not present observation as equivalent to intensified surveillance — surveillance-detected breast cancer has substantially better outcomes."
  - "Do not skip cascade testing and partner-carrier testing — these steps are independent of surveillance schedule choice."
  - "Do not skip dense-breast imaging considerations — supplemental ultrasound can be a middle-ground option if MRI is declined."
  - "Do not normalize de-intensification in a carrier with strong family history — counsel that family-history-positive carriers carry upper-range risk."

