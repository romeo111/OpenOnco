nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Population-cadence breast screening only — biennial mammography
    from age 40-50, depending on local screening program. Carries the
    risk of later-stage breast-cancer diagnosis vs. intensified MRI +
    mammography surveillance because the moderate-penetrance signal
    (~20-25% lifetime, RR ~2.0-3.0) elevates risk meaningfully above
    population baseline. Outcomes worse than with surveillance-detected
    disease, particularly in dense-breast subgroups.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion. Used when:
  - Patient declines intensified MRI + mammography schedule (surveillance
    burden, anxiety, MRI claustrophobia / gadolinium concerns).
  - Access to high-quality breast MRI is impractical (rural, low-
    resource setting, no breast-MRI-experienced radiologist).
  - Patient is at the lower end of NBN moderate-penetrance risk range
    (no family history of breast cancer despite carrier status — a
    valid scenario given moderate penetrance) and chooses
    population-cadence screening after informed discussion.

  In all cases, frame the decision as suboptimal vs. the standard
  intensified-surveillance comparator (IND-NBN-CARRIER-SURVEILLANCE):
  the intensified protocol detects breast cancers at smaller, node-
  negative stage with better outcomes.

  Cascade testing of first-degree relatives + partner-carrier testing
  + reproductive counseling continue regardless of the patient's
  chosen surveillance cadence.

  Per CHARTER §11 patient-autonomy framing — surveillance refusal /
  de-intensification is a legitimate choice but framed transparently.

rationale_ua: >
  Альтернативно-трекова Indication. Використовується коли:
  - Пацієнтка відмовляється від intensified MRI + мамографія schedule
    (surveillance burden, тривога, MRI claustrophobia / gadolinium).
  - Доступ до high-quality breast MRI непрактичний (rural, low-resource,
    no breast-MRI-experienced radiologist).
  - Пацієнтка на нижньому кінці NBN moderate-penetrance ризику (no family
    history) і обирає population-cadence screening після informed
    discussion.

  В усіх випадках — framing decision як suboptimal vs. intensified-
  surveillance comparator.

  Cascade тестування + partner-carrier testing + reproductive counseling
  continue незалежно від cadence обраного пацієнткою.

  Per CHARTER §11 framing автономії пацієнта.

