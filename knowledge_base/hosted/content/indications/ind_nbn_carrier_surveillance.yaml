rationale: >
  Standard-track confirmed-carrier surveillance for NBN heterozygotes
  per NCCN Genetic/Familial High-Risk Breast/Ovarian 2025 + NCCN Breast
  Cancer Screening + Diagnosis 2025 (moderate-penetrance gene
  surveillance extension).

  **Breast cancer surveillance (~20-25% lifetime, RR ~2.0-3.0):**
  - Annual breast MRI with contrast from age 30 (or 10 years before the
    earliest familial breast-cancer diagnosis, whichever is earlier).
  - Annual mammography from age 30-35; alternated with MRI at q6-month
    intervals so the patient receives breast imaging every 6 months
    (one MRI + one mammogram per year, offset by 6 months).
  - Clinical breast exam q6-12 months from age 25.
  - No upper-age cutoff per protocol; continue while life-expectancy
    and patient preference support active screening.

  **Risk-reducing surgery counseling:**
  - Risk-reducing bilateral mastectomy is NOT a routine recommendation
    for NBN heterozygotes — lifetime risk (~20-25%) sits below the
    threshold (typically >40-50% lifetime) where NCCN endorses
    prophylactic surgery as a standard option, unlike BRCA1/2 carriers.
    Discussion permissible in shared-decision-making but not the
    default.

  **Cascade testing:**
  - Offer NBN germline testing to all first-degree relatives. Slavic-
    founder-variant c.657del5 prior probability is meaningful in Polish,
    Ukrainian, Czech, Slovak populations — cascade testing yield is
    high in these populations.

  **Reproductive counseling:**
  - If the carrier's partner is also an NBN carrier (population
    frequency in Eastern Europe makes this non-negligible), offspring
    have 25% biallelic-NBS risk per pregnancy. Pre-conception genetic
    counseling, partner-carrier testing, and preimplantation genetic
    testing (PGT-M) are appropriate options to present (not mandates).

  **Lymphoma + prostate vigilance (modest signals):**
  - No dedicated surveillance protocol — clinical-vigilance basis.
  - Counsel about B-symptom awareness (unexplained weight loss, fevers,
    night sweats, persistent lymphadenopathy) and prostate symptom
    awareness in men.

  Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Стандартний-трек confirmed-carrier surveillance для NBN гетерозигот
  per NCCN Genetic/Familial High-Risk Breast/Ovarian 2025.

  **Скринінг раку молочної залози (~20-25% lifetime, RR ~2.0-3.0):**
  - Annual breast MRI з контрастом з 30 років (або за 10 років до
    наймолодшого сімейного діагнозу раку молочної залози).
  - Annual мамографія з 30-35 років; alternated з MRI q6-міс — пацієнт
    отримує imaging кожні 6 міс (один MRI + одна мамограма на рік,
    offset на 6 міс).
  - Clinical breast exam q6-12 міс з 25 років.

  **Risk-reducing surgery counseling:**
  - Risk-reducing білатеральна мастектомія NOT рутинна рекомендація для
    NBN гетерозигот — lifetime risk (~20-25%) нижче threshold (>40-50%),
    при якому NCCN endorses prophylactic surgery як standard option,
    на відміну від BRCA1/2.

  **Cascade тестування:**
  - Offer NBN germline testing усім first-degree родичам. Слов'янський-
    founder варіант c.657del5 — meaningful prior probability у польській,
    українській, чеській, словацькій популяціях.

  **Reproductive counseling:**
  - Якщо partner також carrier NBN (population frequency в Eastern
    Europe), offspring мають 25% biallelic-NBS risk на pregnancy. Pre-
    conception genetic counseling + PGT-M — appropriate options.

  **Lymphoma + prostate vigilance (modest signals):**
  - Немає dedicated surveillance — clinical-vigilance basis.
  - Counsel про B-symptom awareness та prostate symptom awareness у
    men.

  Per CHARTER §11 framing автономії пацієнта.

