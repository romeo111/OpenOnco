expected_outcomes:
  overall_response_rate: >-
    Annual breast MRI + mammography (alternating q6mo) in NBN
    heterozygotes targets the moderate-penetrance breast-cancer signal
    (RR ~2.0-3.0; ~20-25% lifetime). MRI-detected breast cancers in
    moderate-penetrance carriers are typically smaller and node-negative
    at diagnosis vs. mammography-only screening, enabling
    breast-conserving therapy and avoiding the morbidity of large
    operations / extensive adjuvant chemoradiation. Evidence base is
    extrapolated from BRCA1/2 high-risk MRI surveillance data with NCCN
    Genetic/Familial guideline-endorsed extension to moderate-penetrance
    genes when carrier status is confirmed.

