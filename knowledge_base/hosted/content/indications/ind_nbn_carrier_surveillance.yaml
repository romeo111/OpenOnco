do_not_do:
  - "Не пропонувати prophylactic bilateral mastectomy як default для NBN-only heterozygote — lifetime risk (~20-25%) нижче BRCA1/2 thresholds; reserve як option для shared-decision-making у high-family-history carriers."
  - "Не пропускати cascade-тестування first-degree родичів — Slavic founder c.657del5 high yield у Ukrainian / Eastern-European population."
  - "Не використовувати тільки annual mammography — moderate-penetrance carriers benefit з MRI complementarity (especially in dense breast tissue, common у age <50)."
  - "Не пропускати partner-carrier testing якщо patient — childbearing-age — biallelic NBS у нащадків є серйозним розладом."
  - "Не очікувати dedicated lymphoma / prostate surveillance протоколу — signals modest, evidence-base inadequate для structured screening поза clinical vigilance."

do_not_do_en:
  - "Do not offer prophylactic bilateral mastectomy as a default for NBN-only heterozygotes — lifetime risk (~20-25%) is below BRCA1/2 thresholds; reserve as a shared-decision-making option in carriers with strong family history."
  - "Do not skip cascade testing of first-degree relatives — Slavic founder c.657del5 has high yield in Ukrainian and Eastern-European populations."
  - "Do not rely on annual mammography alone — moderate-penetrance carriers benefit from MRI complementarity (especially in dense breast tissue, common before age 50)."
  - "Do not skip partner-carrier testing in childbearing-age patients — biallelic NBS in offspring is a serious recessive disorder."
  - "Do not expect a dedicated lymphoma or prostate surveillance protocol — signals are modest and evidence is inadequate for structured screening beyond clinical vigilance."

