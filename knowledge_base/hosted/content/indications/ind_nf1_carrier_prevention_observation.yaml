expected_outcomes:
  overall_response_rate: >-
    Symptom-driven workup + standard pediatric ophthalmology in early
    childhood + adult mammography only (no MRI) in NF1 women. Accepts
    higher risk of late presentation. Acceptable when MRI access is
    unavailable or family declines structured surveillance.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (less intensive surveillance) alternative for NF1
  carriers in low-resource settings or where family declines structured
  whole-body MRI / breast MRI surveillance.

  Components:
    - Ophthalmology q12mo (not q6mo) from infancy to age 8.
    - Dermatology + neurology annual examination retained.
    - Symptom-driven MPNST workup retained — any growth/pain/
      neurologic change.
    - Adult NF1 women: annual mammography from age 30; no routine MRI.
    - Symptom-driven pheochromocytoma + GIST + JMML workup retained.
    - Cascade testing retained.
    - Radiation avoidance principle retained.
    - Re-offer structured surveillance + MRI annually.

rationale_ua: >
  Aggressive-трек (less intensive surveillance) альтернатива для NF1
  carriers у low-resource settings або де family declining structured
  whole-body MRI / breast MRI surveillance.

  Компоненти:
    - Ophthalmology q12mo (не q6mo) з infancy до 8 років.
    - Dermatology + neurology annual examination retained.
    - Symptom-driven MPNST workup retained.
    - Adult NF1 women: annual mammography з 30 років; без routine MRI.
    - Symptom-driven pheochromocytoma + GIST + JMML workup retained.
    - Cascade testing retained.
    - Radiation avoidance principle retained.
    - Re-offer structured surveillance + MRI annually.

