rationale: >
  Standard-track prevention pathway for NF1 confirmed-carrier / clinical-
  diagnostic-criteria-met cohort. Comprehensive multi-organ surveillance
  per Children's Tumor Foundation + American Academy of Pediatrics +
  NCCN Genetic/Familial 2025 (NF1 women breast surveillance).

  Components — PEDIATRIC:
    - **Ophthalmology q6-12mo from infancy to age 8** — visual acuity,
      cycloplegic refraction, fundoscopy, retinal photo, RAPD; OCT for
      retinal nerve fiber layer if optic glioma suspicion.
    - **Dermatology + neurology examination annually from infancy** —
      café-au-lait count, freckling pattern, neurofibroma growth, Lisch
      nodule slit-lamp, blood pressure (renal artery + pheo).
    - **Annual development/cognitive assessment** — learning disorders +
      ADHD common (~50%), early intervention preserves educational
      outcomes.
    - **Whole-body MRI from age 8-10 q3-5y** for MPNST risk assessment
      (especially in plexiform neurofibroma carriers — Children's
      Tumor Foundation recommendation).
    - **Symptom-driven MPNST workup:** rapid growth, new pain,
      neurologic symptoms in pre-existing plexiform neurofibroma →
      PET/MRI or biopsy.
    - **JMML monitoring infants** — splenomegaly, monocytosis, CBC.

  Components — ADULT NF1 WOMEN (breast):
    - **Annual mammography from age 30** per NCCN Genetic/Familial 2025
      (BRCA-style modifier).
    - **Annual breast MRI from age 30 to 50** alongside mammography
      (alternating q6mo acceptable).
    - **Clinical breast examination semi-annually from age 25.**
    - **Discontinue MRI screening at age 50** unless additional risk
      factors — NF1 breast cancer risk attenuates after age 50.

  Components — ADULT NF1 ALL:
    - **MPNST awareness lifelong:** any new pain or rapid growth in a
      neurofibroma → workup (PET-CT for FDG-avid lesion + biopsy).
    - **Pheochromocytoma screening** if hypertension or paroxysmal
      symptoms: plasma metanephrines + abdominal MRI.
    - **GIST awareness** symptom-driven — abdominal symptoms, anemia,
      melena → upper + lower GI workup.

  **Cascade testing:** FDRs offered NF1 testing (50% recurrence per
  autosomal-dominant inheritance; ~50% NF1 cases sporadic from de novo
  mutations).

  **Reproductive counseling:** PGT-M available; high de novo rate
  (~50%) means even FDR-negative parents may have an affected child.

  **Cancer treatment considerations:**
    - **Radiation avoidance** — NF1 patients have markedly elevated
      secondary malignancy risk after radiation (MPNST in radiation
      field, secondary glioma). Prioritise surgery + systemic therapy
      over radiation when oncologically equivalent.
    - **MEK inhibitor (selumetinib, mirdametinib)** is NF1-specific
      treatment for inoperable plexiform neurofibroma + low-grade
      optic glioma.

  In Ukraine, NF1 commonly diagnosed clinically; genetic confirmation
  via Institute of Genetics + select private labs. Pediatric multi-
  disciplinary management at OHMATDYT + regional pediatric centers.
  Adult NF1 surveillance more fragmented — primary-care + dermatology
  + ophthalmology + neurology coordination needed.

