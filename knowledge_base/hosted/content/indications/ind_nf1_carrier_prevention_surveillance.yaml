expected_outcomes:
  overall_response_rate: >-
    Pediatric ophthalmology + dermatology surveillance + symptom-driven
    MPNST workup + adult breast surveillance shifts outcomes from
    advanced-stage presentation to early-detection. Optic pathway
    glioma detected on routine ophthalmology q6-12mo (visual-acuity +
    fundoscopy + RAPD): early detection enables visual-preservation
    treatment when indicated (MEK inhibitor selumetinib, NF1-specific).
    MPNST early surgical resection 5y OS ~50-65% vs ~20-30% advanced.
    Breast cancer NF1 women: BRCA-style surveillance shifts to early-
    stage with 5y OS >95% (vs ~65-75% delayed presentation).

