do_not_do:
  - "Не використовувати радіотерапію якщо хірургія/системна терапія є oncologically equivalent — secondary radiation-induced malignancies markedly elevated у NF1."
  - "Не пропускати ophthalmology q6-12mo у дітей <8 років — optic pathway glioma може бути visually-asymptomatic у ранніх стадіях."
  - "Не виконувати empiric MPNST resection всіх plexiform neurofibromas — багато benign + symptom-stable; resect symptomatic/growing/FDG-PET-avid."
  - "Не пропускати annual breast MRI у NF1 жінок 30-50 років — penetrance BRCA-style до age 50."
  - "Не пропускати cascade testing — ~50% NF1 cases sporadic, але family transmission ~50% за autosomal-dominant inheritance."

do_not_do_en:
  - "Do not use radiotherapy when surgery / systemic therapy is oncologically equivalent — secondary radiation-induced malignancies are markedly elevated in NF1."
  - "Do not skip ophthalmology q6-12mo in children <8 — optic pathway glioma can be visually asymptomatic in early stages."
  - "Do not perform empiric MPNST resection of all plexiform neurofibromas — many are benign + symptom-stable; resect symptomatic / growing / FDG-PET-avid."
  - "Do not skip annual breast MRI in NF1 women aged 30-50 — penetrance is BRCA-style up to age 50."
  - "Do not skip cascade testing — ~50% of NF1 cases are sporadic, but family transmission is ~50% per autosomal-dominant inheritance."

known_controversies:
  - topic: "Whole-body MRI MPNST surveillance frequency + age of initiation"
    positions:
      - position: "Routine whole-body MRI q3y from age 8-10"
        rationale: "Children's Tumor Foundation 2019 — early detection of internal plexiform neurofibroma growth that may progress to MPNST."
      - position: "Symptom-driven only"
        rationale: "Modest yield in unselected NF1 cohort + scanner availability + sedation in young children + lifetime cumulative MRI burden."
    our_default: "Whole-body MRI baseline + 3-5-yearly in plexiform-bearing carriers; symptom-driven for others."
    rationale: "Pragmatic + risk-stratified."

