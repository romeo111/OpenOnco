expected_outcomes:
  overall_response_rate: >-
    Empirical management for NF1-suspicion patients declining
    germline testing centers on (1) annual clinical evaluation by
    a physician familiar with NF1 — many features develop in
    childhood / adolescence and emerge with age, making continued
    clinical surveillance high-yield; (2) pediatric ophthalmology
    evaluation in at-risk children for optic pathway glioma
    detection; (3) symptom-driven workup for suspicious findings
    (focal neurologic symptoms, palpable peripheral nerve masses,
    pediatric vision changes); (4) radiation avoidance even without
    confirmed status — the suspicion alone justifies preferring
    MRI / ultrasound over CT. In the NF1-carrier subset (~50% of
    FDRs, ~10-30% of family-history-only suspicion cohorts),
    clinical diagnosis often becomes evident in childhood without
    germline testing — NIH-criteria-met clinical diagnosis triggers
    the same management as germline-positive status. Outside the
    carrier subset, the empirical surveillance pathway is benign
    (annual exam + radiation-avoidance counseling) without
    over-treatment.

