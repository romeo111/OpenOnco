rationale: >
  Aggressive-track companion to IND-NF1-SUSPICION-PREVENTION-
  TESTING. Patient with pedigree suspicion of germline NF1 carrier
  state who declines germline sequencing — for any reason (cost,
  insurance / GINA concerns, psychological / life-planning
  considerations, family privacy, geographic access constraints,
  religious or cultural objections to genetic testing, or for
  at-risk children whose parents prefer to defer testing) — is
  offered empirical clinical surveillance:

  **Annual clinical evaluation (high-yield, low-cost primary
  intervention):**
  - Annual physical examination by a physician familiar with NF1
    (often a pediatrician for children, generalist for adults).
  - Cutaneous documentation: café-au-lait macules (count and
    measure), axillary / inguinal freckling, dermal neurofibromas.
    Photographic documentation supports longitudinal monitoring.
  - Neurologic exam: developmental milestones (children), focal
    deficits, peripheral nerve masses, growth tracking.
  - Vision testing: visual acuity, visual fields, ophthalmologic
    evaluation. For at-risk children, pediatric ophthalmology
    q12-24 months to age 8 for optic pathway glioma surveillance —
    this is high-yield because pre-symptomatic detection markedly
    improves visual outcomes.
  - Skeletal evaluation: scoliosis screening (adolescents).
  - School performance (children): NF1-associated learning
    disabilities may emerge with age and warrant evaluation.

  **Triggered diagnostic workup:**
  - New focal neurologic symptoms → MRI brain + spine.
  - Palpable peripheral nerve mass → MRI / ultrasound; pain or
    rapid growth → biopsy for MPNST evaluation.
  - Pediatric vision changes → urgent pediatric ophthalmology
    + MRI brain.
  - Pediatric growth failure / hypertension → endocrine + adrenal
    workup (pheochromocytoma).

  **Radiation avoidance counseling (applies even without
  confirmed status):**
  - Prefer MRI / ultrasound over CT for diagnostic imaging.
  - Minimize unnecessary radiation exposure (chest X-ray, dental
    X-ray justified + As Low As Reasonably Achievable).

  **Adult women in NF1-suspicion pedigree:**
  - Annual mammography from age 30 may be considered empirically
    if clinical NF1 features are emerging (café-au-lait pattern)
    or if family history supports BRCA2-equivalent breast cancer
    risk; otherwise general-population screening per USPSTF.

  **Risk-reducing surgery:** NOT applicable to NF1 (cancer risk
  is spread across multiple organs; no targeted prophylactic
  intervention exists for the optic glioma / MPNST risks that
  dominate NF1 cancer burden).

  **Reproductive counseling:** PGT-M for monogenic disorders
  cannot be offered without an identified familial variant —
  patients planning children should be re-offered genetic testing
  in the reproductive-planning context, where the case for PGT-M
  may be compelling given the 50% offspring transmission risk
  and serious NF1 phenotype.

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. NF1 is unique among the
  syndromes in this set in that clinical diagnosis (NIH criteria
  ≥2) often becomes evident with age without genetic testing —
  many patients reach a clinical NF1 diagnosis in childhood or
  early adolescence. The empirical surveillance pathway is high-
  yield because it captures these emerging-phenotype patients
  and routes them to the same confirmed-carrier management as
  germline-tested patients. Periodic re-discussion of testing is
  appropriate — particularly at reproductive-planning age and
  before any planned therapeutic-radiation exposure.

  **Resource-intensity caveat:** Annual clinical examination is
  inexpensive (~200-500 UAH for a specialist visit in Ukrainian
  private clinics). Pediatric ophthalmology q12-24 months is
  modest-cost. The high-cost component (annual whole-body MRI
  for MPNST surveillance — ~3000-8000 UAH per scan in Ukrainian
  private centers) is deferred until clinical or genetic
  confirmation; empirical whole-body MRI without confirmed
  carrier status is not cost-effective.

rationale_ua: >
  Aggressive-track компаньйон до IND-NF1-SUSPICION-PREVENTION-
  TESTING. Пацієнт з родовідною підозрою на гермінативний carrier
  NF1, який відмовляється від germline sequencing, отримує
  empіричне клінічне спостереження:

  **Annual clinical evaluation (high-yield, low-cost primary
  intervention):**
  - Annual фізикальний огляд лікарем знайомим з NF1.
  - Cutaneous documentation: café-au-lait, freckling, neurofibromas.
  - Neurologic exam: focal deficits, peripheral nerve masses,
    growth tracking.
  - Vision testing: для at-risk дітей pediatric ophthalmology
    q12-24 міс до 8 років.
  - Skeletal evaluation: scoliosis screening.
  - School performance (діти): NF1 learning disabilities.

  **Triggered diagnostic workup:**
  - New focal neurologic symptoms → MRI brain + spine.
  - Palpable peripheral nerve mass → MRI / ultrasound; pain або
    rapid growth → biopsy для MPNST.
  - Pediatric vision changes → urgent pediatric ophthalmology
    + MRI brain.
  - Pediatric growth failure / hypertension → endocrine workup.

  **Radiation avoidance counseling (applies навіть без confirmed
  status):**
  - Prefer MRI / ultrasound над CT.
  - Minimize unnecessary radiation exposure.

  **Adult women у NF1-suspicion pedigree:**
  - Annual mammography з 30 років може розглядатися emпірично,
    якщо clinical NF1 features emerge.

  **Risk-reducing хірургія:** НЕ застосовується до NF1.

  **Reproductive counseling:** PGT-M не доступна без identified
  familial variant.

  Per CHARTER §11 framing автономії пацієнта. NF1 унікальний —
  clinical діагноз (NIH criteria ≥2) часто стає evident з віком
  без genetic тестування; empіричний surveillance шлях high-
  yield бо він захоплює emerging-phenotype patients.

