expected_outcomes:
  overall_response_rate: >-
    Diagnostic yield: ~50% of first-degree relatives of NF1 carriers
    are themselves NF1 carriers (autosomal-dominant inheritance);
    family-history-only suspicion (e.g., childhood optic pathway
    glioma or MPNST in relatives) yields ~10-30% positive
    identification on a combined clinical + germline approach.
    Confirmed carriers transition to RF-NF1-CONFIRMED-CARRIER
    pathway: multi-organ surveillance (pediatric ophthalmology
    q6-12mo to age 8 for optic glioma screening — pre-symptomatic
    detection markedly improves visual outcomes; annual whole-body
    MRI for MPNST surveillance from late adolescence to detect
    plexiform neurofibroma transformation; women: annual
    mammography from age 30 + MRI from 30-50 for the BRCA2-
    equivalent breast cancer risk). Identifying carriers in
    childhood enables radiation-avoidance counseling (NF1 carriers
    have elevated risk of radiation-induced secondary cancers).

