rationale: >
  Standard-track prevention pathway for individuals with pedigree-
  based suspicion of germline NF1 carrier state who have NOT yet
  had germline sequencing AND do NOT independently meet ≥2 NIH/
  Bethesda clinical diagnostic criteria. Coordinated multi-step
  approach:

  **(1) Clinical evaluation (essential first step).** For at-risk
  children, annual evaluation by a pediatrician familiar with NF1:
  - Cutaneous evaluation: count and measure café-au-lait macules
    (≥6 measuring >5 mm pre-pubertal or >15 mm post-pubertal),
    look for axillary / inguinal freckling and dermal neurofibromas.
  - Neurologic exam: developmental milestones, growth (NF1
    associated with short stature, macrocephaly), school
    performance (NF1 associated with learning disabilities).
  - Vision testing: visual acuity, visual fields, ophthalmologic
    evaluation for Lisch nodules and optic pathway glioma.
  - Skeletal evaluation: scoliosis, tibial pseudoarthrosis,
    sphenoid dysplasia.
  Many NF1 features develop in childhood (café-au-lait usually
  evident from infancy, neurofibromas emerge in adolescence);
  clinical NF1 diagnosis may become evident by age 5-10 in
  asymptomatic at-risk children, deferring formal germline
  testing.

  **(2) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant; ~50% de novo mutation
  rate at the population level — but for an at-risk individual
  with FDR NF1, the inherited probability is 50%), penetrance
  (essentially 100% by age 8 for cutaneous criteria; cancer
  penetrance variable — optic pathway glioma ~15-20% in children,
  MPNST ~10-15% lifetime — major life-limiting complication;
  breast cancer ~18% by age 50, ~50% by age 70 in women —
  BRCA2-equivalent; juvenile myelomonocytic leukemia, rhabdo-
  myosarcoma, pheochromocytoma in subsets), implications for
  FDRs (cascade testing if positive — ~50% will be carriers),
  GINA / insurance considerations, psychological aspects (NF1
  carries substantial disability-spectrum considerations beyond
  cancer risk — learning disabilities, plexiform-neurofibroma
  disfigurement, scoliosis), radiation-avoidance counseling
  (confirmed carriers should minimize diagnostic CT exposure,
  prefer MRI / ultrasound). Per ACMG / ASCO / NCCN, pre-test
  counseling by a certified genetic counselor or trained
  clinician (often a pediatric geneticist for children) is the
  standard of care.

  **(3) Germline NF1 sequencing.** Two-step testing recommended:
  (a) full sequencing of the NF1 gene (RNA-based preferred to
  detect splice-affecting variants — ~30% of variants are
  splice-affecting); (b) MLPA (multiplex ligation-dependent
  probe amplification) or large-deletion analysis for whole-gene
  or whole-exon deletions (~5-10% of variants). Variant
  classification per ACMG framework. For at-risk children of
  known NF1 carriers (familial variant known), targeted-variant
  sequencing is cost-efficient.

  **(4) Referral to specialty NF1 clinic** where available
  (multidisciplinary — pediatric ophthalmology, genetics,
  neurology, dermatology, sometimes oncology). Few specialty
  clinics in Ukraine; consider tele-consultation with EU centers
  or NF1 registry-based follow-up.

  **Sequel pathway (positive germline test OR NIH-criteria
  clinically met):** Transition to NF1-carrier surveillance pathway
  (IND-NF1-CARRIER-PREVENTION-SURVEILLANCE — standard track for
  RF-NF1-CONFIRMED-CARRIER):
  - Pediatric ophthalmology q6-12mo to age 8 (optic pathway
    glioma surveillance).
  - Annual whole-body MRI from late adolescence (MPNST
    surveillance + plexiform-neurofibroma monitoring).
  - Symptom-driven biopsy of growing / painful / neurologically-
    symptomatic plexiform neurofibromas.
  - Women: annual mammography from age 30, MRI from 30-50
    (BRCA2-equivalent breast cancer risk).
  - Pediatric monitoring for JMML (children under 5), rhabdo-
    myosarcoma, pheochromocytoma (catecholamines at adult
    transition).
  - Radiation avoidance: prefer MRI / ultrasound; minimize
    diagnostic CT.
  - Cascade testing of FDRs.
  - Educational support for learning disabilities.

  **Sequel pathway (negative germline test AND NIH criteria not
  met):** general-population surveillance with continued
  awareness — if clinical picture evolves (new café-au-lait,
  Lisch nodules, neurofibromas), re-test or repeat clinical
  evaluation.

  **Sequel pathway (VUS):** managed as pedigree-suspicion until
  reclassification.

  In Ukraine, NF1 sequencing is available through Institute of
  Genetics + a few private labs (~5000-15000 UAH). Specialty
  NF1 clinics are scarce; pediatric ophthalmology + medical
  genetics consultation is the closest equivalent.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з родовідною підозрою
  на гермінативний carrier NF1, які ще НЕ пройшли germline
  секвенування І НЕ незалежно відповідають ≥2 NIH/Bethesda
  clinical diagnostic criteria. Скоординований multi-step
  підхід:

  **(1) Клінічна оцінка (essential first step).** Для at-risk
  дітей щорічна оцінка педіатром знайомим з NF1:
  - Cutaneous evaluation: count + measure café-au-lait macules
    (≥6 >5 мм pre-pubertal або >15 мм post-pubertal), пошук
    axillary / inguinal freckling та dermal neurofibromas.
  - Neurologic exam: developmental milestones, growth,
    школа performance.
  - Vision testing: visual acuity, fields, ophthalmologic
    evaluation для Lisch nodules і optic pathway glioma.
  - Skeletal evaluation: scoliosis, tibial pseudoarthrosis.
  Багато NF1 features розвиваються у дитинстві; clinical NF1
  діагноз може стати evident до 5-10 років.

  **(2) Направлення на генетичне консультування.** Pre-test
  консультування охоплює: спадкування (autosomal dominant;
  ~50% de novo mutation rate; для at-risk особи з FDR NF1
  inherited probability — 50%), пенетрантність (essentially 100%
  by age 8 для cutaneous criteria; optic pathway glioma ~15-20%
  у дітей; MPNST ~10-15% lifetime; breast cancer ~18% by age 50,
  ~50% by age 70 — BRCA2-equivalent), наслідки для FDRs,
  GINA / страхові міркування, psychological aspects, radiation-
  avoidance counseling.

  **(3) Germline NF1 секвенування.** Two-step testing: full
  sequencing (RNA-based preferred) + MLPA / large-deletion
  analysis. Для at-risk children of known NF1 carriers targeted-
  variant sequencing — cost-efficient.

  **(4) Direction на спеціалізовану NF1 клініку** (multi-
  disciplinary). Кілька спеціалізованих клінік в Україні;
  consider tele-consultation з EU centers.

  **Наступний шлях (positive germline test АБО NIH-criteria
  clinically met):** перехід на NF1-carrier surveillance шлях
  (IND-NF1-CARRIER-PREVENTION-SURVEILLANCE):
  - Pediatric ophthalmology q6-12 міс до 8 років.
  - Annual whole-body MRI з late adolescence (MPNST).
  - Жінки: annual mammography з 30 років, MRI з 30-50 років.
  - Pediatric monitoring для JMML, rhabdomyosarcoma,
    pheochromocytoma.
  - Radiation avoidance.
  - Cascade testing FDRs.

  **Наступний шлях (negative germline test):** general-population
  surveillance з continued awareness.

  **Наступний шлях (VUS):** ведеться як родовідна підозра.

  В Україні NF1 sequencing via Institute of Genetics + private
  labs (~5000-15000 UAH).

