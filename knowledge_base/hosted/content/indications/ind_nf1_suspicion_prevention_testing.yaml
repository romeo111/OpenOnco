do_not_do:
  - "Не призначати genetic тестування у asymptomatic at-risk дитини без pre-test counseling — pediatric NF1 testing має складні psychological + life-planning наслідки."
  - "Не пропускати pediatric ophthalmology evaluation у at-risk дітей — optic pathway glioma surveillance pre-symptomatic покращує visual outcomes."
  - "Не виконувати diagnostic CT неупередженно у NF1-suspicion patient — prefer MRI / ultrasound; suspicion alone виправдовує radiation-minimization."
  - "Не пропускати MLPA / large-deletion analysis у NF1 testing — ~5-10% варіантів — whole-gene або whole-exon deletions."
  - "Не пропускати annual whole-body MRI у confirmed adolescent / adult carrier — MPNST detection life-saving."

do_not_do_en:
  - "Do not order genetic testing in an asymptomatic at-risk child without pre-test counseling — pediatric NF1 testing has complex psychological + life-planning implications."
  - "Do not skip pediatric ophthalmology evaluation in at-risk children — pre-symptomatic optic pathway glioma surveillance improves visual outcomes."
  - "Do not order diagnostic CT casually in an NF1-suspicion patient — prefer MRI / ultrasound; suspicion alone justifies radiation-minimization."
  - "Do not skip MLPA / large-deletion analysis in NF1 testing — ~5-10% of variants are whole-gene or whole-exon deletions."
  - "Do not skip annual whole-body MRI in a confirmed adolescent / adult carrier — MPNST detection is life-saving."

