expected_outcomes:
  overall_response_rate: >-
    Aggressive-track NF2-related schwannomatosis surveillance layers
    several intensifications on top of the standard pathway: (1) earlier
    brain MRI baseline (age 5-8 in pediatric-onset kindreds); (2)
    increased imaging frequency (annual brain MRI throughout adolescence;
    high-resolution IAC sequences q1y rather than q1-2y); (3) earlier
    initiation of bevacizumab for growing / symptomatic vestibular
    schwannoma without watch-and-wait; (4) prophylactic hearing-
    preservation surgical consideration for small unilateral vestibular
    schwannoma before contralateral involvement; (5) multidisciplinary
    NF2-expert-center referral with annual virtual or in-person review.
    Trade-off: increased imaging burden, sedation burden in pediatric
    carriers, anxiety burden, bevacizumab cumulative toxicity (proteinuria,
    hypertension, thrombotic events). Goal: maximise hearing-preservation
    window + early treatment of growing tumors + reduce decade-long
    cumulative tumor burden + improve median life expectancy toward
    near-normal in expert-center management.

