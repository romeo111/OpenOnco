sources:
  - source_id: SRC-NCCN-CNS-2025
    position: context
    relevant_quote_paraphrase: >-
      "Earlier brain MRI baseline (age 5-8) and annual high-resolution
      IAC sequences are appropriate intensifications for confirmed NF2
      carriers in severe-phenotype kindreds. Earlier bevacizumab
      initiation for growing / symptomatic vestibular schwannoma rather
      than after exhausted watch-and-wait maximises hearing-preservation
      window. Stereotactic radiosurgery is avoided preferentially in
      intensified-track NF2 given debated secondary-tumor /
      malignant-transformation reports in radiated NF2-tumors."
  - source_id: SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
    position: context
    relevant_quote_paraphrase: >-
      "Cascade testing of first-degree relatives is mandatory; mosaicism
      in approximately 50% of de-novo NF2 cases creates special
      counselling considerations for offspring risk — tumor-tissue
      genotyping may reveal proband mosaicism not detectable in blood-
      based germline testing."

do_not_do:
  - "Не advanceувати brain MRI baseline до age 5-8 без family-specific pediatric-onset proband — sedation / anesthesia burden + lifelong cumulative surveillance не виправдані."
  - "Не initiateувати empirical bevacizumab у asymptomatic vestibular schwannoma — реверв для growing / symptomatic lesion з documented hearing decline; cumulative toxicity (proteinuria, hypertension, thrombotic) обмежує."
  - "Не виконувати prophylactic hearing-preservation surgery для unilateral vestibular schwannoma без detailed shared-decision-making — facial-nerve weakness + postsurgical hearing loss + vestibular symptoms ризики; reverve для well-counseled patients у NF2-expert-center."
  - "Не використовувати stereotactic radiosurgery first-line у intensified NF2 track — debated secondary-tumor / malignant-transformation reports; microsurgery + bevacizumab preferred sequencing."
  - "Не пропускати DIS-GLIOMA-LOW-GRADE v0.4-cleanup flag — disease anchor — v0.3 approximation; vestibular schwannoma / meningioma / ependymoma потребують dedicated DIS-* entities."

do_not_do_en:
  - "Do not advance brain MRI baseline to age 5-8 without a family-specific pediatric-onset proband — sedation / anesthesia burden and lifelong cumulative surveillance are not justified otherwise."
  - "Do not initiate empirical bevacizumab in asymptomatic vestibular schwannoma — reserve for growing / symptomatic lesion with documented hearing decline; cumulative toxicity (proteinuria, hypertension, thrombotic) limits use."
  - "Do not perform prophylactic hearing-preservation surgery for unilateral vestibular schwannoma without detailed shared-decision-making — facial-nerve weakness, postsurgical hearing loss, and vestibular symptoms are risks; reserve for well-counselled patients at an NF2-expert-center."
  - "Do not use stereotactic radiosurgery first-line in the intensified NF2 track — debated secondary-tumor / malignant-transformation reports; microsurgery + bevacizumab preferred sequencing."
  - "Do not skip the DIS-GLIOMA-LOW-GRADE v0.4-cleanup flag — the disease anchor is a v0.3 approximation; vestibular schwannoma / meningioma / ependymoma require dedicated DIS-* entities."

