rationale: >
  Aggressive-track NF2-related schwannomatosis confirmed-carrier pathway
  layered on top of IND-NF2-CARRIER-SURVEILLANCE.

  **Foundation:** All standard surveillance from IND-NF2-CARRIER-
  SURVEILLANCE applies — brain MRI with thin-cut IAC sequences q1-2y
  from age 10, whole-spine MRI q3-5y, audiology + speech-discrimination
  annually, ophthalmology q1-2y, dermatology q1-2y, cascade testing,
  multidisciplinary expert-center referral.

  **Intensification 1 — Earlier brain MRI baseline (age 5-8):** When
  the family-specific proband has documented NF2 manifestations before
  age 10 (severe-phenotype kindred with early-onset vestibular
  schwannoma or pediatric meningioma), advance brain MRI baseline from
  age 10 to age 5-8 (or earlier if proband even younger). Trade-off:
  age-appropriate sedation / general anaesthesia for compliant pediatric
  MRI; high family counselling burden; cumulative MRI considerations
  across decades; no IV gadolinium contrast in younger children unless
  specifically indicated.

  **Intensification 2 — Annual high-resolution IAC sequences:** Brain
  MRI q1y (vs q1-2y) with consistent high-resolution thin-cut IAC
  protocol; ensures detection of sub-centimeter / sub-cochlear vestibular
  schwannoma in the hearing-preservation window before bilateral
  involvement. Spine MRI q3y (vs q3-5y) in highest-risk subset (prior
  symptomatic spinal lesion, severe-phenotype family).

  **Intensification 3 — Earlier bevacizumab initiation:** For growing
  / symptomatic vestibular schwannoma with documented hearing decline,
  bevacizumab (anti-VEGF) initiated earlier in the trajectory rather
  than after exhausted watch-and-wait. Patient counselled re: cumulative
  bevacizumab toxicity (proteinuria, hypertension, thrombotic events;
  GI perforation risk; impaired wound healing) and duration of treatment
  (typically maintenance dosing while hearing benefit sustained).
  Bevacizumab also evaluated for unresectable progressive meningioma
  and spinal ependymoma in NF2 — off-label, expert-center.

  **Intensification 4 — Prophylactic hearing-preservation surgical
  consideration:** For unilateral vestibular schwannoma <2cm with
  preserved useful hearing (Gardner-Robertson Class I-II,
  AAO-HNS Class A-B), shared-decision-making for hearing-preservation
  microsurgery BEFORE contralateral involvement. The rationale: when
  contralateral vestibular schwannoma emerges (typical for NF2),
  preserved hearing in the prophylactically-treated side becomes the
  patient's better ear — reversing the typical NF2 trajectory of
  bilateral hearing loss. CAVEAT: this is shared-decision-making
  territory, not routine — risks include facial-nerve weakness,
  postsurgical hearing loss despite surgical intent, vestibular
  symptoms. Patient counselled re: alternative bevacizumab path.

  **Intensification 5 — Multidisciplinary NF2-expert-center annual
  review:** Annual virtual or in-person review with NF2-expert-centre
  team (neuro-otology, neurosurgery, medical neuro-oncology, genetic
  counselling, ophthalmology, audiology, occupational therapy). Trial
  enrolment evaluation continuous — NF2 is a high-need rare disease
  with active drug-development pipelines (mTOR inhibitors, MEK inhibitors,
  combination targeted therapy).

  **Treatment considerations (intensified):**
    - Same range of treatments as standard track but EARLIER initiation
      thresholds — growing vestibular schwannoma initiates bevacizumab
      promptly rather than watch-and-wait.
    - Stereotactic radiosurgery: AVOIDED preferentially in intensified
      track given debated secondary-tumor / malignant-transformation
      reports in radiated NF2-tumors; microsurgery + bevacizumab
      preferred sequencing.
    - mTOR-pathway inhibitors (everolimus): considered in clinical-
      trial setting; off-label use evaluated for progressive disease
      not responsive to bevacizumab.
    - Sign-language acquisition + cochlear-implant pre-emptive planning
      EMPHASISED from earlier age, given likely bilateral hearing
      loss trajectory.
    - Pre-conception genetic counselling (PGT, prenatal-diagnosis
      options) appropriate for carriers of childbearing age — NF2
      autosomal-dominant transmission affects 50% of offspring; mosaic
      probands require special counselling.

  **Cascade testing remains continuous:** every visit re-confirms
  family testing status; mosaicism in de-novo cases creates unique
  counselling considerations for offspring risk (testing of tumor
  tissue may reveal proband mosaicism not detectable in blood).

  Per CHARTER §11: intensified pediatric brain MRI + earlier bevacizumab
  + prophylactic surgical consideration are shared-decision-making
  domains. Family-specific intensification triggers (pediatric-onset
  proband, severe-phenotype family, prior tumor history) are evidence-
  based clinical thresholds rather than universal NF2 application.

rationale_ua: >
  Aggressive-track NF2-related schwannomatosis carrier pathway:
  накладений поверх IND-NF2-CARRIER-SURVEILLANCE.

  **Foundation:** усе standard з IND-NF2-CARRIER-SURVEILLANCE.

  **Інтенсифікація 1 — Earlier brain MRI baseline (5-8 років):** Коли
  family-specific proband має documented NF2 manifestations до 10
  років (severe-phenotype kindred — early-onset vestibular schwannoma
  / pediatric meningioma) — advance brain MRI baseline з 10 до 5-8
  років. Trade-off: sedation / general anesthesia; family counseling
  burden; cumulative MRI considerations; без IV gadolinium у younger.

  **Інтенсифікація 2 — Annual high-resolution IAC sequences:** Brain
  MRI q1y (vs q1-2y) з consistent high-resolution thin-cut IAC
  protocol; ensures detection sub-centimeter / sub-cochlear vestibular
  schwannoma у hearing-preservation window. Spine MRI q3y (vs q3-5y)
  у highest-risk subset.

  **Інтенсифікація 3 — Earlier bevacizumab initiation:** Для growing /
  symptomatic vestibular schwannoma з documented hearing decline,
  bevacizumab (anti-VEGF) initiated раніше у trajectory, не після
  exhausted watch-and-wait. Patient counseled re: cumulative bevacizumab
  toxicity (proteinuria, hypertension, thrombotic; GI perforation;
  impaired wound healing) + duration (typically maintenance dosing
  while hearing benefit sustained). Bevacizumab також evaluated для
  unresectable progressive meningioma + spinal ependymoma у NF2.

  **Інтенсифікація 4 — Prophylactic hearing-preservation surgical
  consideration:** Для unilateral vestibular schwannoma <2cm з
  preserved useful hearing (Gardner-Robertson I-II, AAO-HNS A-B),
  shared-decision-making для hearing-preservation microsurgery ДО
  contralateral involvement. Rationale: коли contralateral vestibular
  schwannoma emerges (typical NF2), preserved hearing у prophylactically-
  treated side стає patient's better ear. CAVEAT: shared-decision-
  making, не routine — facial-nerve weakness, postsurgical hearing
  loss, vestibular symptoms ризики.

  **Інтенсифікація 5 — Multidisciplinary NF2-expert-center annual
  review:** annual virtual / in-person review з NF2-expert-centre
  team. Trial enrolment evaluation continuous.

  **Treatment considerations (intensified):**
    - Same range як standard, але EARLIER initiation thresholds.
    - Stereotactic radiosurgery: AVOIDED preferentially в intensified
      track через debated secondary-tumor / malignant-transformation
      reports; microsurgery + bevacizumab preferred.
    - mTOR-pathway inhibitors (everolimus): clinical-trial setting.
    - Sign-language acquisition + cochlear-implant pre-emptive planning
      EMPHASISED earlier.
    - Pre-conception genetic counseling (PGT, prenatal-diagnosis) для
      carriers childbearing age — NF2 autosomal-dominant 50% offspring;
      mosaic probands — special counseling.

  **Cascade тестування continuous;** mosaicism у de-novo cases —
  unique counseling considerations для offspring risk.

  Per CHARTER §11: shared-decision-making домени; family-specific
  intensification triggers — evidence-based, не universal NF2.

