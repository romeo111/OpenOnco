expected_outcomes:
  overall_response_rate: >-
    Structured NF2-related schwannomatosis surveillance per the Children's
    Tumor Foundation NF2 consensus + Manchester / Baser revised
    diagnostic criteria + Plotkin et al. Genet Med 2022 international
    schwannomatosis-nomenclature consensus detects vestibular schwannomas,
    meningiomas, and spinal ependymomas at smaller, hearing- and
    function-preserving stages — amenable to hearing-preservation
    microsurgery, stereotactic radiosurgery, or bevacizumab targeted
    therapy for growing / symptomatic lesions. Early-stage detection of
    vestibular schwannoma (sub-centimeter, sub-cochlear) is the dominant
    determinant of post-treatment hearing preservation; small meningiomas
    can be observed or resected without major brain morbidity; small
    intramedullary ependymomas detected before neurological deficit
    have better post-resection outcomes. Despite the multi-tumor
    cumulative burden across decades, modern surveillance + targeted
    therapy has shifted median survival from historical 36-69y toward
    near-normal life expectancy in expert-center management cohorts.

