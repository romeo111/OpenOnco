rationale: >
  Standard-track confirmed-carrier surveillance pathway for NF2-related
  schwannomatosis and SMARCB1-schwannomatosis (excluding the N-terminal
  truncating SMARCB1 RTPS variant class which routes to rhabdoid-tumor
  surveillance pathways separately).

  **Imaging cadence — multi-region:**
    - Brain MRI with thin-cut internal-auditory-canal (IAC) sequences
      q1-2y starting age 10 (or at diagnosis if older). Thin-cut IAC
      sequences (high-resolution T2 / 3D-FIESTA / CISS) are CRITICAL
      for sub-centimeter vestibular schwannoma detection in the
      hearing-preservation window. Contrast-enhanced T1 sequences add
      sensitivity for meningioma + cranial schwannoma + ependymoma.
    - Whole-spine MRI q3-5y for intramedullary ependymoma + extramedullary
      schwannoma; more frequent if symptoms emerge.
    - Brain + spine MRI baselines obtained earlier (age 5-8) if family-
      specific proband had pediatric-onset NF2 — uncommon but does
      occur in severe-phenotype kindreds.

  **Audiology — annual:**
    - Pure-tone audiometry + speech-discrimination scores annually
      starting age 10. Speech discrimination is the single best
      functional outcome to monitor for vestibular schwannoma —
      worsening discrimination at preserved pure-tone thresholds is
      an early indicator of cochlear-nerve compromise.
    - Auditory brainstem response (ABR) testing where available —
      latency changes precede pure-tone shifts in some cases.
    - Sign-language and cochlear-implant pre-emptive counselling for
      patients with progressive bilateral hearing loss — pre-emptive
      learning preserves functional communication if eventual
      complete hearing loss occurs.

  **Ophthalmology — q1-2y:**
    - Slit-lamp examination for juvenile posterior subcapsular
      lenticular cataract (~60% of NF2 patients — often the earliest
      detectable feature, sometimes diagnosed in childhood pre-
      neuroimaging).
    - Dilated fundoscopy for retinal hamartoma and epiretinal membrane
      (additional NF2 ophthalmologic stigmata).

  **Dermatology — q1-2y:**
    - Skin examination for cutaneous schwannomas (~70% of NF2 patients;
      small subcutaneous nodules — usually asymptomatic but cosmetic /
      patient-reassurance value of documentation).

  **Cascade testing — mandatory:** Genetic counselling offered to all
  first-degree relatives. NF2 is autosomal-dominant; mosaicism in
  ~50% of de-novo NF2 cases creates a special counselling situation —
  in mosaic probands, germline testing may be negative in blood but
  positive in tumor tissue, so cascade-testing of offspring requires
  careful counselling re: residual risk despite negative blood-based
  germline testing in the proband. SMARCB1-schwannomatosis carriers
  separately counselled re: variant-class-specific risk (carboxy-
  terminal / non-truncating — schwannomatosis spectrum; N-terminal
  truncating — RTPS spectrum, distinct surveillance pathway).

  **Treatment considerations (referenced — narrated at surveillance
  visits):**
    - Growing / symptomatic vestibular schwannoma:
      - Hearing-preservation microsurgery by experienced skull-base
        team — preferred for resectable lesions where useful hearing
        is preserved at baseline.
      - Stereotactic radiosurgery (gamma-knife / cyber-knife) —
        acceptable alternative for tumor control; CAUTION in NF2 given
        debated reports of secondary-tumor / malignant-transformation
        risk in radiated NF2-tumors (the literature is mixed — some
        series show acceptable safety, others raise concern; expert-
        center shared-decision-making domain).
      - BEVACIZUMAB (anti-VEGF) — first-line systemic targeted therapy
        for growing / symptomatic vestibular schwannoma; can preserve
        / improve hearing in ~40-50% of treated patients; given off-
        label / expert-center indication; ongoing risk of cumulative
        bevacizumab toxicity (proteinuria, hypertension, thrombotic
        events) drives shared-decision-making around treatment duration.
    - Growing / symptomatic meningioma: microsurgical resection by
      experienced neurosurgical team; SRS for small / recurrent
      lesions; bevacizumab evaluated in some series for unresectable
      meningioma.
    - Growing / symptomatic spinal ependymoma: microsurgical resection
      preferred for symptomatic lesions; observation acceptable for
      small asymptomatic lesions.
    - mTOR-pathway inhibitors (everolimus) — evaluated but not
      consistently effective in NF2; reserved for clinical trial
      enrolment.

  **Multidisciplinary NF2-expert-center referral:** strongly recommended
  given complexity of multi-tumor management + experimental targeted
  therapy availability + hearing-preservation surgical expertise
  concentration in specialised centres.

  Per CHARTER §11: NF2 surveillance is lifelong + multi-region +
  multi-specialty; patient-shared-decision-making is central given
  cumulative tumor burden, hearing-loss trajectory, and balance
  between observation, surgery, radiosurgery, and bevacizumab.

rationale_ua: >
  Стандартний-трек confirmed-carrier surveillance для NF2-related
  schwannomatosis та SMARCB1-schwannomatosis (виключаючи N-terminal
  truncating SMARCB1 RTPS variant class, який routes до rhabdoid-
  tumor surveillance окремо).

  **Imaging cadence — multi-region:**
    - Brain MRI з thin-cut internal-auditory-canal (IAC) sequences
      q1-2y з 10 років (або при diagnosis якщо older). Thin-cut IAC
      (high-resolution T2 / 3D-FIESTA / CISS) CRITICAL для sub-
      centimeter vestibular schwannoma detection у hearing-preservation
      window. Contrast-enhanced T1 для meningioma + cranial schwannoma
      + ependymoma.
    - Whole-spine MRI q3-5y для intramedullary ependymoma +
      extramedullary schwannoma.
    - Brain + spine MRI baselines earlier (5-8 років) якщо family-
      specific proband had pediatric-onset NF2.

  **Audiology — annual:**
    - Pure-tone audiometry + speech-discrimination scores annually з
      10 років. Speech discrimination — best functional outcome для
      vestibular schwannoma monitoring.
    - ABR testing де available.
    - Sign-language + cochlear-implant pre-emptive counseling для
      progressive bilateral hearing loss.

  **Ophthalmology — q1-2y:**
    - Slit-lamp для juvenile posterior subcapsular lenticular cataract
      (~60% NF2 — earliest detectable feature, sometimes у childhood).
    - Dilated fundoscopy для retinal hamartoma + epiretinal membrane.

  **Dermatology — q1-2y:**
    - Skin examination для cutaneous schwannomas (~70% NF2).

  **Cascade тестування — mandatory:** first-degree родичам. NF2
  autosomal-dominant; mosaicism у ~50% de-novo NF2 — у mosaic
  probands germline тестування може бути negative у крові але positive
  у tumor tissue. SMARCB1-schwannomatosis carriers окремо counseled re:
  variant-class-specific (carboxy-terminal / non-truncating —
  schwannomatosis; N-terminal truncating — RTPS).

  **Treatment considerations:**
    - Growing / symptomatic vestibular schwannoma:
      - Hearing-preservation microsurgery experienced skull-base командою.
      - Stereotactic radiosurgery (gamma-knife / cyber-knife) —
        acceptable alternative; CAUTION debated secondary-tumor /
        malignant-transformation reports у radiated NF2-tumors.
      - BEVACIZUMAB (anti-VEGF) — first-line systemic targeted therapy
        для growing / symptomatic vestibular schwannoma; preserves /
        improves hearing у ~40-50% treated; off-label / expert-center;
        cumulative toxicity (proteinuria, hypertension, thrombotic).
    - Growing / symptomatic meningioma: microsurgical resection;
      SRS для small / recurrent; bevacizumab evaluated unresectable.
    - Growing / symptomatic spinal ependymoma: microsurgical resection
      symptomatic; observation small asymptomatic.
    - mTOR-pathway inhibitors (everolimus) — evaluated, не consistently
      effective NF2; clinical trial enrolment.

  **Multidisciplinary NF2-expert-center referral** strongly recommended.

  Per CHARTER §11: NF2 surveillance lifelong + multi-region + multi-
  specialty; patient-shared-decision-making central.

