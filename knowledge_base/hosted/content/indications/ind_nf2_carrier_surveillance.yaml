    relevant_quote_paraphrase: >-
      "Confirmed NF2-related schwannomatosis carriers undergo brain MRI
      with thin-cut internal-auditory-canal sequences q1-2y from age 10,
      whole-spine MRI q3-5y, audiology and speech-discrimination annually,
      and ophthalmology q1-2y. Bevacizumab (anti-VEGF) is established
      first-line systemic targeted therapy for growing / symptomatic
      vestibular schwannoma, preserving or improving hearing in
      approximately 40-50% of treated patients."
  - source_id: SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
    position: context
    relevant_quote_paraphrase: >-
      "Cascade genetic counselling for first-degree relatives is
      mandatory for confirmed germline NF2 / SMARCB1 schwannomatosis-
      spectrum variant carriers. Mosaicism in approximately 50% of
      de-novo NF2 cases creates a special counselling situation."

do_not_do:
  - "Не використовувати DIS-GLIOMA-LOW-GRADE як permanent disease anchor для NF2 vestibular schwannoma routing — flagged для v0.4 cleanup коли DIS-VESTIBULAR-SCHWANNOMA / DIS-MENINGIOMA / DIS-EPENDYMOMA entities land."
  - "Не пропускати thin-cut IAC sequences у NF2 brain MRI — standard brain MRI без high-resolution IAC sequences miss малих vestibular schwannoma у hearing-preservation window."
  - "Не використовувати stereotactic radiosurgery як first-line vestibular schwannoma treatment у NF2 carrier без detailed shared-decision-making — secondary-tumor / malignant-transformation reports у radiated NF2-tumors debated; expert-center input необхідний."
  - "Не пропускати ophthalmology surveillance — juvenile posterior subcapsular lenticular cataract — earliest detectable NF2 feature у багатьох patients (sometimes у childhood pre-neuroimaging)."
  - "Не використовувати empirical bevacizumab у asymptomatic vestibular schwannoma — реверв для growing / symptomatic lesion з hearing decline; cumulative bevacizumab toxicity (proteinuria, hypertension, thrombotic) обмежує treatment duration."

do_not_do_en:
  - "Do not use DIS-GLIOMA-LOW-GRADE as a permanent disease anchor for NF2 vestibular schwannoma routing — flagged for v0.4 cleanup when DIS-VESTIBULAR-SCHWANNOMA / DIS-MENINGIOMA / DIS-EPENDYMOMA entities land."
  - "Do not skip thin-cut IAC sequences in NF2 brain MRI — standard brain MRI without high-resolution IAC sequences misses small vestibular schwannomas in the hearing-preservation window."
  - "Do not use stereotactic radiosurgery as first-line vestibular schwannoma treatment in an NF2 carrier without detailed shared-decision-making — secondary-tumor / malignant-transformation reports in radiated NF2-tumors are debated; expert-center input is necessary."
  - "Do not skip ophthalmology surveillance — juvenile posterior subcapsular lenticular cataract is the earliest detectable NF2 feature in many patients (sometimes diagnosed in childhood pre-neuroimaging)."
  - "Do not use empirical bevacizumab in asymptomatic vestibular schwannoma — reserve for growing / symptomatic lesion with hearing decline; cumulative bevacizumab toxicity (proteinuria, hypertension, thrombotic) limits treatment duration."

