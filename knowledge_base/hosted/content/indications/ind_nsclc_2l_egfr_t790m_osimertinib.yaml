notes: >
  DRAFT pending Clinical Co-Lead sign-off (CHARTER §6.1). Standard-track 2L
  for osimertinib-naive EGFR T790M-positive NSCLC after progression on a
  1st/2nd-generation EGFR-TKI. Reuses REG-OSIMERTINIB-NSCLC; no dosing is
  restated here — the regimen entity is the single source for it.

  Ratifies a position already asserted in four KB locations
  (BMA-EGFR-T790M-NSCLC escat_tier IA, RF-NSCLC-EGFR-T790M-ACTIONABLE, and
  twice in ALGO-NSCLC-METASTATIC-2L deferred-work notes) rather than
  introducing a new clinical claim.

  Reviewer notes:
  - REG-OSIMERTINIB-NSCLC is titled "1L metastatic OR adjuvant" and its
    total_cycles text names FLAURA/ADAURA only. Reusing it for a 2L T790M
    indication is a scope mismatch in the regimen's own naming. Options:
    reuse as-is, widen the regimen name, or author a separate AURA3 2L
    regimen. Not decided here — the regimen is itself clinical content.
  - `followed_by: IND-NSCLC-2L-EGFR-POST-OSI-AMI-LAZ` points a 2L
    Indication at another 2L Indication. Clinically this is the correct
    successor (progression on osimertinib → MARIPOSA-2 pathway) but the
    line_of_therapy metadata does not express the 3L position. Confirm.
  - ORR is deliberately unstated. AURA3 response-rate figures are not
    attested anywhere in this knowledge base, and CLAUDE.md forbids
    authoring efficacy numbers from memory. Add with citation if wanted.
  - No `rationale_ua` / `do_not_do` (Ukrainian) yet — Ukrainian drafting
    for this entity is deliberately deferred until the English clinical
    content is signed off, so translation review is not spent on text that
    may change.
