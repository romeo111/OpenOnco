desired_tests:
  - TEST-LFT

rationale: >
  Standard-track surveillance for occupational aromatic-amine exposure (Group 1
  IARC carcinogen for urothelial bladder cancer). Three components:

  **(1) Annual urinalysis + urine cytology** — primary surveillance modality.
  Microscopic hematuria + atypical/positive cytology trigger cystoscopy.

  **(2) Low-threshold cystoscopy for hematuria** — any visible hematuria, or
  persistent microscopic hematuria in an aromatic-amines-exposed individual,
  warrants cystoscopy regardless of age. Standard for general population is
  age-stratified evaluation, but exposure history lowers the threshold.

  **(3) Smoking cessation counseling** — tobacco is an independent IARC Group 1
  bladder carcinogen; combined exposure is multiplicative. Tobacco cessation
  is the single most modifiable risk factor.

rationale_ua: >
  Стандартний трек нагляду для осіб із професійним впливом ароматичних амінів
  (канцероген групи 1 за класифікацією IARC для уротеліального раку сечового
  міхура). Три компоненти:

  **(1) Щорічний загальний аналіз сечі + цитологія сечі** — основний метод
  нагляду. Мікроскопічна гематурія та атипова/позитивна цитологія є показанням
  до цистоскопії.

  **(2) Низький поріг для цистоскопії при гематурії** — будь-яка видима
  гематурія або персистуюча мікроскопічна гематурія в особи з впливом
  ароматичних амінів в анамнезі є показанням до цистоскопії незалежно від
  віку. Для загальної популяції стандартом є вікова стратифікація оцінки, але
  наявність професійного впливу знижує поріг для обстеження.

  **(3) Консультування щодо відмови від куріння** — тютюн є незалежним
  канцерогеном групи 1 за IARC для сечового міхура; поєднаний вплив має
  мультиплікативний ефект. Відмова від куріння є найбільш модифікованим
  фактором ризику.

