do_not_do:
  - "Не пропускати щорічний аналіз сечі в осіб із впливом ароматичних амінів в анамнезі, навіть за відсутності симптомів."
  - "Не застосовувати вікову стратифікацію порогу для цистоскопії в осіб із професійним впливом — наявність впливу знижує поріг обстеження."
  - "Не нехтувати відмовою від куріння — поєднання з впливом ароматичних амінів має мультиплікативний ефект."

do_not_do_en:
  - "Do not skip annual urinalysis in aromatic-amines-exposed cohorts even if asymptomatic."
  - "Do not use age-stratified threshold for cystoscopy in exposed individuals — exposure lowers the threshold."
  - "Do not ignore tobacco cessation — multiplicative effect with aromatic amines."

