expected_outcomes:
  overall_response_rate: "Annual urinalysis + urine cytology in high-risk occupational cohorts: sensitivity for low-grade urothelial carcinoma ~30-40%; sensitivity for high-grade urothelial carcinoma ~80-90%. Low-threshold cystoscopy for hematuria detects early-stage tumors before muscle invasion."

