sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Occupational carcinogen-exposure cohorts require risk-adjusted
      surveillance recommendations distinct from general-population
      screening; multidisciplinary review (oncology + thoracic
      radiology + occupational-medicine) at large academic centers
      is the operational reference standard for cohorts with
      overlapping non-malignant occupational lung disease."
  - source_id: SRC-NCCN-NSCLC-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Annual low-dose CT lung-cancer screening is recommended for
      individuals at elevated lung-cancer risk by age, smoking
      history, and (per Clinical Practice Guidelines extension)
      occupational carcinogen exposure including beryllium and
      beryllium compounds; nodule classification in this cohort
      requires expertise to discriminate malignancy from CBD-related
      granulomatous findings."

do_not_do:
  - "Не презентувати beryllium-modified LDCT як eвідентно-rівноцінне USPSTF-стандарту — extension опирається на cohort + mechanistic-rationale, не на RCT-дані."
  - "Не інтерпретувати CBD-related гранулематозні знахідки на HRCT як malignancy без multidisciplinary review — radiographic mimic of sarcoidosis + malignancy can lead to invasive overdiagnosis."
  - "Не пропускати координацію з occupational-medicine — CBD-спостереження (BeLPT, HRCT, PFTs) — паралельний non-oncologic шлях, який ця Indication НЕ замінює."
  - "Не пропускати counseling щодо припинення куріння — beryllium × тютюн взаємодія залишається клінічно суттєвою; cessation також протективна проти CBD progression."

do_not_do_en:
  - "Do not present beryllium-modified LDCT as evidentiarily equivalent to the USPSTF standard — the extension rests on cohort + mechanistic rationale, not RCT data."
  - "Do not interpret CBD-related granulomatous findings on HRCT as malignancy without multidisciplinary review — radiographic mimic of sarcoidosis + malignancy can lead to invasive overdiagnosis."
  - "Do not skip coordination with occupational-medicine — CBD surveillance (BeLPT, HRCT, PFTs) is a parallel non-oncologic pathway that this Indication does NOT replace."
  - "Do not skip smoking-cessation counseling — the beryllium × tobacco interaction remains clinically substantive; cessation is also protective against CBD progression."

