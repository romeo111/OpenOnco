expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: detection of incident beryllium-attributable
    lung-cancer at earliest treatable stage. NLST + NELSON data show
    annual LDCT in high-risk smokers reduces lung-cancer mortality
    ~20-26%; beryllium-exposed cohorts are not formally enrolled but
    mechanistic + cohort inference (Schubauer-Berigan 2011; Sanderson
    2001) supports extension. CBD-related findings on HRCT
    (granulomatous lymphadenopathy, mid-lung-zone parenchymal
    nodules, ground-glass) can confound LDCT lung-nodule
    classification — multidisciplinary review with thoracic
    radiology + occupational-medicine is the operational standard.
    Smoking-cessation has largest single-intervention impact.

