rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational beryllium exposure who do not have a current
  beryllium-associated malignancy diagnosis. Three parallel
  interventions:

  **(1) Risk-adjusted annual LDCT chest screening.** USPSTF 2021
  criteria (age 50-80, ≥20 pack-years, current smoker or quit within
  15 years) form the baseline. For beryllium-exposed workers, NCCN
  and ACR extend consideration based on cumulative exposure:
    - First LDCT at ≥10-15 years from first beryllium exposure for
      current / ex-smokers (smoker × beryllium synergy supports
      earlier start), ≥15-20 years for never-smokers with
      ≥10 years cumulative beryllium exposure in high-burden
      occupations (aerospace machining, nuclear-component manufacture,
      electronics-heat-sink production).
    - Annual cadence; Lung-RADS reporting for nodule classification.
    - CRITICAL: LDCT findings in beryllium-exposed individuals
      require multidisciplinary review with occupational-medicine
      input — CBD-related granulomatous findings can mimic
      malignancy. Coordinate with occupational-medicine specialist
      for image interpretation in patients with established or
      suspected CBD.

  **(2) Coordination with occupational-medicine for CBD surveillance.**
  Chronic Beryllium Disease (CBD) is a parallel non-oncologic
  occupational lung disease — granulomatous + non-malignant — but
  arises from the same exposure cohort and frequently co-occurs.
  CBD evaluation includes BeLPT (beryllium lymphocyte-proliferation
  test) screening, HRCT chest, pulmonary-function testing, and
  rarely bronchoscopy with transbronchial biopsy. This Indication
  recommends REFERRAL to occupational-medicine for parallel CBD
  surveillance — it does NOT replace or substitute that pathway.
  CBD itself modestly elevates lung-cancer risk beyond beryllium-
  alone effect.

  **(3) Smoking-cessation counseling.** Highest-impact single
  intervention for residual lung-cancer risk reduction. Beryllium ×
  tobacco interaction is additive-to-multiplicative across cohort
  studies. Smoking-cessation is also protective against CBD
  progression. Behavioral counseling + pharmacotherapy (varenicline,
  bupropion, NRT) per USPSTF / ATS / AAFP.

  Resource access in Ukraine: LDCT chest (~1500-3500 UAH);
  occupational-medicine specialists concentrated in industrial
  regions (Dnipropetrovska Oblast, Donetska Oblast, Zaporizhia);
  BeLPT testing not widely available locally — historically
  performed at NIOSH-affiliated labs in US / specialty reference
  labs in EU. Smoking-cessation pharmacotherapy pharmacy-accessible
  without НСЗУ reimbursement.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим
  попереднім професійним впливом берилію без поточного діагнозу
  beryllium-асоційованої малігнізації. Три паралельні втручання:

  **(1) Risk-adjusted щорічна LDCT грудної клітки.** USPSTF 2021
  критерії — baseline. Для beryllium-експонованих NCCN / ACR
  розширюють розгляд: перша LDCT при ≥10-15 років від першого
  beryllium-впливу для поточних / ex-курців, ≥15-20 років для
  некурців з ≥10 років кумулятивного beryllium-впливу у high-burden
  професіях (aerospace machining, виробництво ядерних компонентів,
  виробництво електронних тепловідводів). Щорічна частота; Lung-RADS
  звітність. КРИТИЧНО: LDCT-знахідки у beryllium-експонованих осіб
  потребують multidisciplinary review з occupational-medicine
  input — CBD-related гранулематозні знахідки можуть mimic
  malignancy.

  **(2) Координація з occupational-medicine для CBD-спостереження.**
  Chronic Beryllium Disease (CBD) — паралельне non-oncologic
  occupational lung disease — гранулематозне + non-malignant —
  але виникає з тієї ж exposure-cohort та часто ко-існує.
  CBD-оцінка включає BeLPT, HRCT грудної клітки, pulmonary-function
  testing та рідше бронхоскопію з трансбронхіальною біопсією.
  Ця Indication рекомендує НАПРАВЛЕННЯ до occupational-medicine
  для паралельного CBD-спостереження — НЕ замінює та НЕ заміщає
  цей шлях.

  **(3) Counseling щодо припинення куріння.** Найвпливовіше одиничне
  втручання для зниження залишкового ризику раку легень. Beryllium ×
  тютюн взаємодія — адитивно-мультиплікативна.

  Доступ до ресурсів в Україні: LDCT грудної клітки (~1500-3500 грн);
  occupational-medicine спеціалісти зосереджені у промислових
  регіонах (Дніпропетровська, Донецька, Запорізька області);
  BeLPT-тестування не широкодоступне локально — історично у
  NIOSH-affiliated laboratoriях США / специфічних reference labs у
  ЄС. Pharmacotherapy припинення куріння аптечно-доступна без НСЗУ.

