notes: >
  STUB — v0.3 occupational batch-3 pilot (beryllium). Two-Clinical-
  Co-Lead signoff queued per CHARTER §6.1 dev-mode exemption. No
  drug regimen — intervention is counseling + LDCT surveillance +
  occupational-medicine referral. CBD context is foundational —
  beryllium exposure cohort overlaps oncologic + non-oncologic
  occupational lung disease and multidisciplinary review is the
  operational standard. IARC Monograph 100C (2012) is canonical
  evidence anchor; v0.3 source-authoring backlog as new SRC entity.
