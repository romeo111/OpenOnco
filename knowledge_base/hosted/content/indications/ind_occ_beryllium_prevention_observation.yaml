expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: avoidance of intensified imaging surveillance
    when patient declines the beryllium-modified LDCT pathway.
    Cancer-incidence outcome: no reduction in beryllium-attributable
    lung-cancer incidence beyond what routine general-population
    screening provides. LDCT applied at unmodified USPSTF criteria
    misses beryllium-exposed non-smokers and beryllium-exposed light
    smokers with <20 pack-years. CBD-surveillance referral to
    occupational-medicine remains offered separately and is not
    cancelled by this surveillance-track choice. Smoking-cessation
    counseling remains appropriate regardless of surveillance-track
    choice.

