rationale: >
  Alternative-track companion to IND-OCC-BERYLLIUM-PREVENTION-
  INTENSIFIED-SURVEILLANCE. Patient with documented prior
  occupational beryllium exposure who declines beryllium-modified
  imaging surveillance — for any reason (cost, radiation-dose
  concerns, anxiety from serial-imaging false-positive cascade
  (particularly given CBD-LDCT confounding), preference for less-
  interventional pathway, geographic access constraints, life
  expectancy / competing illness) — is offered routine general-
  population screening only:

  **Lung-cancer screening:** Apply USPSTF 2021 criteria unmodified
  (age 50-80, ≥20 pack-years, current smoker or quit within 15 years).
  If patient meets criteria they receive annual LDCT at the routine
  cadence; if not, no imaging screening is offered. Patient is
  explicitly informed that beryllium-attributable excess risk is
  unaddressed.

  **CBD surveillance:** Referral to occupational-medicine specialist
  for CBD evaluation (BeLPT, HRCT, PFTs) remains offered SEPARATELY
  through occupational-medicine and is NOT cancelled by this
  surveillance-track choice. Patient is informed that CBD evaluation
  is a parallel non-oncologic pathway with independent clinical
  rationale (symptomatic CBD is treatable, even if non-malignant).

  **Smoking cessation:** Still offered — beryllium × tobacco
  interaction remains clinically substantive and cessation is the
  largest single mortality lever regardless of surveillance-track
  choice; cessation is also protective against CBD progression.

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on new / persistent chest symptoms (dyspnea, hemoptysis,
  weight loss, chronic cough). Such workup will include both
  oncologic AND CBD differential consideration.

  Routing reconsiderations: patient may revisit intensified-
  surveillance pathway at any subsequent visit. Per CHARTER §11
  patient-autonomy framing: imaging surveillance is a shared-
  decision-making domain.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-
  BERYLLIUM-PREVENTION-INTENSIFIED-SURVEILLANCE. Пацієнт з
  документованим попереднім професійним впливом берилію, який
  відмовляється від beryllium-модифікованого imaging-спостереження
  (вартість, радіація, тривога від false-positive каскаду
  (особливо з урахуванням CBD-LDCT confounding), перевага
  менш-інтервенційного шляху, географічні обмеження), отримує
  тільки рутинний загальнопопуляційний скринінг:

  **Скринінг раку легень:** Застосовувати USPSTF 2021 без
  модифікації. Пацієнт явно інформований, що beryllium-attributable
  excess ризик не адресується.

  **CBD-спостереження:** Направлення до occupational-medicine
  спеціаліста для CBD-оцінки (BeLPT, HRCT, PFTs) залишається
  ОКРЕМО і НЕ скасовується цим surveillance-track вибором.
  Пацієнт інформований, що CBD-оцінка — паралельний non-oncologic
  шлях з незалежним клінічним обґрунтуванням.

  **Припинення куріння:** Все ще пропонується — beryllium × тютюн
  взаємодія залишається клінічно суттєвою; cessation також
  протективна проти CBD progression.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при нових / persistent симптомах з боку грудної клітки.
  Такий workup включатиме oncologic AND CBD differential розгляд.

  Reroute: пацієнт може повернутися до інтенсифікованого
  спостереження на будь-якому подальшому візиті. Per CHARTER §11
  — shared-decision-making domain.

