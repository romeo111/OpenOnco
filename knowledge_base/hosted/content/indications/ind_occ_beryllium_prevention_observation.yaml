sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining intensified surveillance for occupational
      carcinogen cohorts continue to receive symptom-triggered
      evaluation and standard-of-care general-population screening."
  - source_id: SRC-NCCN-NSCLC-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients who decline lung-cancer screening at the intensified
      cadence require ongoing surveillance via symptom-triggered
      evaluation; smoking-cessation counseling remains foundational."

do_not_do:
  - "Не презентувати observation як еквівалент imaging surveillance — incidence-detection benefit відсутній; beryllium-attributable excess ризик не адресується."
  - "Не скасовувати CBD-evaluation referral до occupational-medicine — CBD — окрема non-oncologic occupational lung disease з незалежним клінічним обґрунтуванням."
  - "Не ігнорувати alarm features (диспное, кровохаркання, втрата ваги) — immediate діагностичне imaging + multidisciplinary review (oncologic + CBD differential)."
  - "Не пропускати counseling щодо припинення куріння — рекомендація актуальна незалежно від surveillance-track вибору."

do_not_do_en:
  - "Do not present observation as equivalent to imaging surveillance — incidence-detection benefit is absent; beryllium-attributable excess risk is unaddressed."
  - "Do not cancel CBD-evaluation referral to occupational-medicine — CBD is a separate non-oncologic occupational lung disease with independent clinical rationale."
  - "Do not ignore alarm features (dyspnea, hemoptysis, weight loss) — immediate diagnostic imaging + multidisciplinary review (oncologic + CBD differential)."
  - "Do not skip smoking-cessation counseling — the recommendation is relevant regardless of surveillance-track choice."

