sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Occupational carcinogen-exposure cohorts require risk-adjusted
      surveillance recommendations distinct from general-population
      screening; multidisciplinary review at large academic centers
      is the operational reference standard."
  - source_id: SRC-NCCN-NSCLC-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Annual low-dose CT lung-cancer screening is recommended for
      individuals at elevated lung-cancer risk by age, smoking history,
      and (per Clinical Practice Guidelines extension) occupational
      carcinogen exposure including cadmium and cadmium compounds."
  - source_id: SRC-NCCN-PROSTATE-2025
    position: context
    relevant_quote_paraphrase: >-
      "PSA-based prostate-cancer early detection is offered as shared-
      decision-making within age-stratified windows; occupational
      cohorts with suggestive but limited carcinogenicity evidence
      receive contextualized risk-benefit discussion rather than
      modified screening cadence."

do_not_do:
  - "Не презентувати cadmium-modified LDCT як eвідентно-rівноцінне USPSTF-стандарту — extension опирається на cohort + mechanistic-rationale, не на RCT-дані."
  - "Не презентувати PSA-скринінг як cadmium-modified validated indication — IARC-evidence обмежено-суггестивна; PSA — shared-decision-making."
  - "Не пропускати counseling щодо припинення куріння — cadmium × тютюн взаємодія залишається клінічно суттєвою; тютюн сам по собі — джерело cadmium."
  - "Не призначати додаткові урологічні процедури (TRUS, рутинна біопсія) поза елevated-PSA workup — нема clinical evidence для occupational-modified prostate-cancer screening."

do_not_do_en:
  - "Do not present cadmium-modified LDCT as evidentiarily equivalent to the USPSTF standard — the extension rests on cohort + mechanistic rationale, not RCT data."
  - "Do not present PSA screening as a cadmium-modified validated indication — IARC evidence is limited-but-suggestive; PSA remains shared-decision-making."
  - "Do not skip smoking-cessation counseling — the cadmium × tobacco interaction remains clinically substantive; tobacco itself is an independent cadmium source."
  - "Do not order additional urologic procedures (TRUS, routine biopsy) outside of elevated-PSA workup — no clinical evidence supports occupational-modified prostate-cancer screening cadence."

