expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: detection of incident cadmium-attributable
    malignancy (lung; prostate as suggestive) at earliest treatable
    stage via risk-adjusted lung surveillance and shared-decision-
    making PSA discussion. NLST + NELSON data show annual LDCT in
    high-risk smokers reduces lung-cancer mortality ~20-26%;
    cadmium-exposed cohorts are not formally enrolled but mechanistic
    + cohort inference (Sorahan 1997; Stayner 1992) supports
    extension. PSA-based prostate-cancer screening has heterogeneous
    population-level evidence; for cadmium-exposed cohorts the
    evidence base is suggestive (Verougstraete 2003) not definitive
    — PSA is offered as shared-decision-making within NCCN early-
    detection age windows. Smoking-cessation has largest single-
    intervention impact on lung component.

