rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational cadmium exposure who do not have a current
  cadmium-associated malignancy diagnosis. Three parallel
  interventions:

  **(1) Risk-adjusted annual LDCT chest screening.** USPSTF 2021
  criteria (age 50-80, ≥20 pack-years, current smoker or quit within
  15 years) form the baseline. For cadmium-exposed workers, NCCN and
  ACR extend consideration based on cumulative exposure:
    - First LDCT at ≥10-15 years from first cadmium exposure for
      current / ex-smokers (smoker × cadmium synergy supports earlier
      start; tobacco itself is a cadmium source),
      ≥15-20 years for never-smokers with ≥10 years cumulative
      cadmium exposure in high-burden occupations (smelting, NiCd
      batteries, pigment production).
    - Annual cadence; Lung-RADS reporting.

  **(2) Shared-decision-making PSA discussion at NCCN age windows.**
  Prostate-cancer evidence for cadmium is limited-but-suggestive
  (IARC 100C; Verougstraete 2003) — NOT a separate validated
  screening indication. NCCN early-detection guidance applies at
  age 45-75 (high-risk windows extended for occupational chemical
  exposure). PSA discussion frames cadmium-exposure context, baseline
  PSA / DRE, and shared-decision-making about prostate-cancer
  screening burden vs. potential benefit. This is not RCT-supported
  occupational screening modification; it is patient-autonomy framing
  applied to a cohort with elevated background risk.

  **(3) Smoking-cessation counseling.** Highest-impact single
  intervention for residual lung-cancer risk reduction. Cadmium ×
  tobacco interaction is additive-to-multiplicative across cohort
  studies; smoking also contributes independent cadmium dose.
  Behavioral counseling + pharmacotherapy (varenicline, bupropion,
  NRT) per USPSTF / ATS / AAFP.

  Resource access in Ukraine: LDCT chest (~1500-3500 UAH); PSA
  (~150-400 UAH); DRE in primary-care setting widely available;
  urology consultation at regional centers. Smoking-cessation
  pharmacotherapy pharmacy-accessible without НСЗУ reimbursement.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим
  попереднім професійним впливом кадмію без поточного діагнозу
  кадмій-асоційованої малігнізації. Три паралельні втручання:

  **(1) Risk-adjusted щорічна LDCT грудної клітки.** USPSTF 2021
  критерії — baseline. Для cadmium-експонованих NCCN / ACR
  розширюють розгляд: перша LDCT при ≥10-15 років від першого
  cadmium-впливу для поточних / ex-курців (smoker × cadmium синергія
  підтримує ранішій старт; тютюн сам по собі — джерело cadmium),
  ≥15-20 років для некурців з ≥10 років кумулятивного cadmium-впливу
  у high-burden професіях (виплавка, NiCd-батареї, виробництво
  пігментів). Щорічна частота; Lung-RADS звітність.

  **(2) Shared-decision-making PSA-обговорення у NCCN age windows.**
  Дані щодо раку передміхурової залози для cadmium —
  limited-but-suggestive (IARC 100C; Verougstraete 2003) — НЕ
  окрема валідована screening-індикація. NCCN early-detection
  guidance застосовується у віці 45-75 (high-risk windows
  розширюються для occupational chemical exposure). PSA-обговорення
  включає контекст cadmium-впливу, baseline PSA / DRE, та
  shared-decision-making про screening-burden vs. potential benefit.

  **(3) Counseling щодо припинення куріння.** Найвпливовіше одиничне
  втручання для зниження залишкового ризику раку легень. Cadmium ×
  тютюн взаємодія — адитивно-мультиплікативна; куріння також
  contributes незалежну cadmium-дозу.

  Доступ до ресурсів в Україні: LDCT грудної клітки (~1500-3500 грн);
  PSA (~150-400 грн); DRE у первинній медичній допомозі —
  широкодоступно; урологічна консультація у регіональних центрах.
  Pharmacotherapy припинення куріння аптечно-доступна без НСЗУ.

