expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: avoidance of intensified imaging surveillance
    and / or PSA-based prostate-cancer discussion when patient
    declines the cadmium-modified pathway. Cancer-incidence outcome:
    no reduction in cadmium-attributable lung incidence beyond what
    routine general-population screening provides; prostate-cancer
    surveillance remains general-population shared-decision-making.
    LDCT applied at unmodified USPSTF criteria misses cadmium-
    exposed non-smokers and cadmium-exposed light smokers with
    <20 pack-years. Smoking-cessation counseling remains appropriate
    regardless of surveillance-track choice.

