rationale: >
  Alternative-track companion to IND-OCC-CADMIUM-PREVENTION-
  INTENSIFIED-SURVEILLANCE. Patient with documented prior
  occupational cadmium exposure who declines cadmium-modified
  imaging surveillance and / or shared-decision-making PSA
  discussion — for any reason (cost, radiation-dose concerns,
  anxiety from serial-imaging or PSA false-positive cascade,
  preference for less-interventional pathway, geographic access
  constraints, life expectancy / competing illness) — is offered
  routine general-population screening only:

  **Lung-cancer screening:** Apply USPSTF 2021 criteria unmodified
  (age 50-80, ≥20 pack-years, current smoker or quit within 15 years).
  If patient meets criteria they receive annual LDCT at the routine
  cadence; if not, no imaging screening is offered. Patient is
  explicitly informed that cadmium-attributable excess risk is
  unaddressed.

  **Prostate-cancer screening:** Apply general-population shared-
  decision-making at NCCN age windows without cadmium-contextualization.
  IARC limited-but-suggestive evidence is not strong enough to
  override patient preference for declining PSA discussion.

  **Smoking cessation:** Still offered — cadmium × tobacco interaction
  remains clinically substantive and cessation is the largest single
  mortality lever regardless of surveillance-track choice.

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on new / persistent chest symptoms (dyspnea, hemoptysis,
  weight loss, chronic cough) or urinary symptoms (obstructive
  voiding, hematuria, bone pain in older patient).

  Routing reconsiderations: patient may revisit intensified-
  surveillance pathway at any subsequent visit, in whole or in part.
  Per CHARTER §11 patient-autonomy framing: surveillance is a
  shared-decision-making domain.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-CADMIUM-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Пацієнт з документованим
  попереднім професійним впливом кадмію, який відмовляється від
  cadmium-модифікованого imaging-спостереження та / або shared-
  decision-making PSA-обговорення (вартість, радіація, тривога від
  false-positive каскадів, перевага менш-інтервенційного шляху,
  географічні обмеження), отримує тільки рутинний загальнопопуляційний
  скринінг:

  **Скринінг раку легень:** Застосовувати USPSTF 2021 без модифікації.
  Пацієнт явно інформований, що cadmium-attributable excess ризик
  не адресується.

  **Скринінг раку передміхурової залози:** Застосовувати
  загальнопопуляційне shared-decision-making у NCCN age windows
  без cadmium-contextualization. IARC limited-but-suggestive
  evidence недостатньо сильна щоб перевершувати patient preference
  для відмови від PSA-обговорення.

  **Припинення куріння:** Все ще пропонується — cadmium × тютюн
  взаємодія залишається клінічно суттєвою.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при нових / persistent симптомах з боку грудної клітки
  або сечостатевої системи.

  Reroute: пацієнт може повернутися до інтенсифікованого спостереження
  на будь-якому подальшому візиті, в цілому або частково. Per CHARTER
  §11 — shared-decision-making domain.

