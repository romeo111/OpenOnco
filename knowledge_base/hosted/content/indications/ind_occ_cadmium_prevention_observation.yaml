sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining intensified surveillance for occupational
      carcinogen cohorts continue to receive symptom-triggered
      evaluation and standard-of-care general-population screening."
  - source_id: SRC-NCCN-NSCLC-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients who decline lung-cancer screening at the intensified
      cadence require ongoing surveillance via symptom-triggered
      evaluation; smoking-cessation counseling remains foundational."
  - source_id: SRC-NCCN-PROSTATE-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining PSA-based shared-decision-making discussion
      receive symptom-triggered urologic evaluation; general-population
      screening cadence is unmodified absent strong-evidence cohort
      modifiers."

do_not_do:
  - "Не презентувати observation як еквівалент imaging surveillance — incidence-detection benefit відсутній; cadmium-attributable excess ризик не адресується."
  - "Не ігнорувати alarm features (диспное, кровохаркання, обструктивні сечові симптоми, кістковий біль) — immediate діагностичне imaging + multidisciplinary review."
  - "Не використовувати цей шлях як стандарт першої лінії — intensified-surveillance трек залишається preferred для cadmium-exposed cohort."
  - "Не пропускати counseling щодо припинення куріння — рекомендація актуальна незалежно від surveillance-track вибору."

do_not_do_en:
  - "Do not present observation as equivalent to imaging surveillance — incidence-detection benefit is absent; cadmium-attributable excess risk is unaddressed."
  - "Do not ignore alarm features (dyspnea, hemoptysis, obstructive urinary symptoms, bone pain) — immediate diagnostic imaging + multidisciplinary review."
  - "Do not use this pathway as a first-line standard — the intensified-surveillance track remains the preferred recommendation for the cadmium-exposed cohort."
  - "Do not skip smoking-cessation counseling — the recommendation is relevant regardless of surveillance-track choice."

