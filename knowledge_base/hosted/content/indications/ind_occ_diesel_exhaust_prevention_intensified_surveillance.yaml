id: IND-OCC-DIESEL-EXHAUST-PREVENTION-INTENSIFIED-SURVEILLANCE
plan_track: standard
intent: prevention

applicable_to:
  # Primary anchor: lung cancer (numerically dominant DEE-attributable
  # malignancy with validated screening modality). Bladder surveillance
  # via urinalysis is discussed in rationale.
  disease_id: DIS-NSCLC
