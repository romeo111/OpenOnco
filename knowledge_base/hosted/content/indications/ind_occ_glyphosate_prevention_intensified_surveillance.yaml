expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: NHL-symptom-awareness education + annual CBC +
    targeted history-and-physical surveillance aims at earlier-stage
    detection of incident DLBCL (or other aggressive NHL) when /
    if it occurs. There is NO RCT-grade evidence for screening
    imaging or biomarker testing for NHL in the glyphosate-exposed
    cohort — annual CBC is the minimum standard-of-care and is
    cheap, non-invasive, and may detect cytopenias / lymphocytosis
    suggesting underlying lymphoproliferative disorder. Symptom-
    triggered LDH + lymph-node ultrasound / CT chest-abdomen-pelvis
    workup at first presentation of B symptoms (fever, weight loss,
    night sweats) or lymphadenopathy is the primary detection lever.
    Expected absolute risk reduction is modest because NHL absolute
    incidence is low (~30/100,000 per year general population, possibly
    ~40-45/100,000 in high-exposure agricultural cohorts) and the
    Group 2A evidence quality is contested.

