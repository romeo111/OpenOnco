do_not_do:
  - "Не презентувати IARC 2A класифікацію як settled science — disclosure cross-regulatory disagreement (EFSA / EPA / Health Canada / JMPR) — частина informed-consent counseling."
  - "Не призначати рутинний imaging screening (CT chest-abdomen-pelvis, PET-CT) для asymptomatic glyphosate-exposed individuals — harm:benefit ratio unfavorable per NCCN."
  - "Не пропускати PPE counseling для активно експонованих працівників — exposure-reduction залишається impactful де модифікувано."
  - "Не призначати empiric anti-cancer chemoprophylaxis — жодна evidence-based intervention існує для NHL prevention у glyphosate-exposed cohort."

do_not_do_en:
  - "Do not present the IARC 2A classification as settled science — disclosure of cross-regulatory disagreement (EFSA / EPA / Health Canada / JMPR) is part of informed-consent counseling."
  - "Do not order routine imaging screening (CT chest-abdomen-pelvis, PET-CT) for asymptomatic glyphosate-exposed individuals — harm:benefit ratio is unfavorable per NCCN."
  - "Do not skip PPE counseling for actively exposed workers — exposure-reduction remains impactful where modifiable."
  - "Do not prescribe empiric anti-cancer chemoprophylaxis — no evidence-based intervention exists for NHL prevention in the glyphosate-exposed cohort."

