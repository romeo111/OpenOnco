rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational glyphosate exposure who do not have a current
  NHL diagnosis. Three parallel interventions:

  **(1) Exposure-reduction counseling.** For workers still actively
  exposed: counsel on personal-protective-equipment (PPE) adherence
  — chemical-resistant gloves, long-sleeved coveralls, eye protection,
  respirators when label-directed, mixing-loading enclosure when
  available, indoor changing and showering before family contact.
  Retired workers cannot be helped by exposure-reduction counseling
  but informational disclosure of the IARC 2A classification and the
  cross-regulatory controversy is offered.

  **(2) NHL-symptom-awareness education.** Educate patient on
  B-symptoms (fever ≥38°C without infection, drenching night sweats,
  ≥10% unintentional weight loss over 6 months) and on lymphadenopathy
  patterns (palpable cervical / axillary / supraclavicular / inguinal
  nodes >1 cm persistent >2 weeks without clear infectious cause).
  Low threshold for primary-care evaluation if symptoms develop.

  **(3) Annual CBC + targeted history-and-physical.** Annual CBC is
  cheap, non-invasive, and screens for cytopenias / lymphocytosis
  that may signal underlying lymphoproliferative disorder. Targeted
  history-and-physical at annual visit: ask explicitly about B-symptoms
  and palpate lymph-node chains. Symptom-triggered workup: LDH, beta-2
  microglobulin, peripheral-blood flow cytometry if lymphocytosis,
  lymph-node ultrasound → core biopsy for persistent / progressive
  lymphadenopathy.

  NCCN B-Cell Lymphoma Guidelines do NOT support routine imaging
  screening for at-risk asymptomatic individuals in the glyphosate
  cohort — that approach has unfavorable harm:benefit ratio for an
  IARC 2A probable carcinogen with contested evidence.

  Resource access in Ukraine: CBC widely available (~150-400 UAH);
  LDH + beta-2 microglobulin (~300-800 UAH); lymph-node ultrasound
  (~500-1500 UAH); core biopsy and flow cytometry available at
  regional oncology centers (typically НСЗУ-covered).

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим попереднім
  професійним впливом glyphosate, які не мають поточного діагнозу NHL.
  Три паралельні втручання:

  **(1) Exposure-reduction counseling.** Для працівників, які все ще
  активно експоновані: counsel щодо personal-protective-equipment
  (PPE) — chemical-resistant gloves, long-sleeved coveralls, eye
  protection, respirators при label-directed, mixing-loading
  enclosure де доступно, indoor changing і showering перед family
  contact. Retired workers — інформаційне disclosure IARC 2A
  класифікації та cross-regulatory controversy.

  **(2) NHL-symptom-awareness education.** Освіта пацієнта про
  B-symptoms (fever ≥38°C без інфекції, drenching night sweats,
  ≥10% unintentional weight loss за 6 місяців) та lymphadenopathy
  patterns (palpable cervical / axillary / supraclavicular / inguinal
  nodes >1 см persistent >2 тижні без clear infectious cause).
  Низький поріг для primary-care evaluation при розвитку симптомів.

  **(3) Annual CBC + targeted history-and-physical.** Annual CBC —
  cheap, non-invasive, screens for cytopenias / lymphocytosis.
  Targeted history-and-physical на annual visit: explicitly запитати
  про B-symptoms та palpate lymph-node chains. Symptom-triggered
  workup: LDH, β2-microglobulin, peripheral-blood flow cytometry при
  lymphocytosis, lymph-node ultrasound → core biopsy при persistent /
  progressive lymphadenopathy.

  NCCN B-Cell Lymphoma Guidelines НЕ підтримують рутинне imaging
  screening для at-risk asymptomatic осіб в glyphosate cohort —
  такий підхід має unfavorable harm:benefit ratio для IARC 2A
  probable carcinogen з contested evidence.

  Доступ до ресурсів в Україні: CBC (~150-400 грн); LDH + β2-
  microglobulin (~300-800 грн); lymph-node ultrasound (~500-1500
  грн); core biopsy + flow cytometry — на регіональних онко-центрах
  (typically НСЗУ-covered).

