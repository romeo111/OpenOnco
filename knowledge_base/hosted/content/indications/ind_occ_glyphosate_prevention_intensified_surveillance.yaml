notes: >
  STUB — v0.3 IARC 2A probable-carcinogen batch (glyphosate). IARC
  Group 2A probable — limited human evidence; clinical recommendation
  more conservative than Group 1. IARC Monograph 112 (2015) is the
  canonical evidence anchor; cited in notes only (not yet a separate
  SRC entity in KB). Cross-regulatory disagreement (EFSA / EPA / Health
  Canada / JMPR concluded "unlikely to pose carcinogenic risk")
  documented explicitly in patient counseling. Two-Clinical-Co-Lead
