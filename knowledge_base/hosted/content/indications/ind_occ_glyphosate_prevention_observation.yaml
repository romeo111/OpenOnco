notes: >
  STUB — alternative-track companion for glyphosate occupational
  prevention pilot. §15.2 C4 ≥2-tracks invariant compliance. IARC
  Group 2A probable — limited human evidence; clinical recommendation
  more conservative than Group 1. IARC Monograph 112 (2015) cited in
  notes only; cross-regulatory disagreement (EFSA / EPA / Health Canada
  / JMPR) explicitly acknowledged in counseling. Two-Clinical-Co-Lead
  signoff queued per CHARTER §6.1 dev-mode exemption.
