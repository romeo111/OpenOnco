do_not_do:
  - "Не презентувати observation як еквівалент structured surveillance — incremental benefit of intensified track був скромний, але alarm-feature awareness залишається critical."
  - "Не ігнорувати B-symptoms (fever, night sweats, weight loss) або persistent lymphadenopathy — immediate діагностичний workup з LDH + lymph-node ultrasound + core biopsy за показаннями."
  - "Не використовувати цей шлях як стандарт першої лінії — intensified-track залишається preferred для glyphosate-exposed cohort з still-active expoзицією."
  - "Не пропускати PPE counseling для активно експонованих працівників — exposure-reduction залишається impactful незалежно від surveillance-track вибору."

do_not_do_en:
  - "Do not present observation as equivalent to structured surveillance — the incremental benefit of intensified track was modest, but alarm-feature awareness remains critical."
  - "Do not ignore B-symptoms (fever, night sweats, weight loss) or persistent lymphadenopathy — immediate diagnostic workup with LDH + lymph-node ultrasound + core biopsy as indicated."
  - "Do not use this pathway as a first-line standard — the intensified track remains preferred for the glyphosate-exposed cohort with still-active exposure."
  - "Do not skip PPE counseling for actively exposed workers — exposure-reduction remains impactful regardless of surveillance-track choice."

