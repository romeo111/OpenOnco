rationale: >
  Alternative-track companion to IND-OCC-GLYPHOSATE-PREVENTION-
  INTENSIFIED-SURVEILLANCE. Individual with documented prior
  occupational glyphosate exposure who declines structured symptom-
  awareness education and/or annual CBC surveillance — for any reason
  (skepticism toward IARC 2A classification given EFSA / EPA / Health
  Canada / JMPR disagreement, anxiety from repeated testing, life
  expectancy / competing illness, preference for less-interventional
  pathway) — is offered routine general-population care only:

  **NHL screening:** None — there is no general-population screening
  modality for NHL. Symptom-triggered evaluation remains the standard.

  **Exposure-reduction counseling:** For still-active workers, PPE
  counseling is offered briefly during routine occupational-health
  visits without scheduling a structured visit. Retired workers
  receive brief informational disclosure of IARC 2A and the
  cross-regulatory controversy.

  **Annual CBC:** Patient may opt out — or may agree to CBC at
  whatever cadence is routine for their other primary-care needs
  (often biennial after age 50 if no other risk factors).

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on B-symptoms (fever, night sweats, weight loss) or
  persistent lymphadenopathy (>2 weeks, >1 cm). Patient is
  explicitly informed which symptoms warrant urgent return-to-clinic.

  Routing reconsiderations: patient may revisit intensified pathway
  at any subsequent visit. Per CHARTER §11 patient-autonomy framing:
  occupational-exposure surveillance is a shared-decision-making
  domain particularly when the evidence is IARC Group 2A (probable)
  with explicit cross-regulatory disagreement.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-GLYPHOSATE-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Особа з документованим попереднім
  професійним впливом glyphosate, яка відмовляється від структурованої
  symptom-awareness education та/або annual CBC surveillance (скептицизм
  щодо IARC 2A класифікації при EFSA / EPA / Health Canada / JMPR
  disagreement, anxiety від repeated testing, life expectancy /
  competing illness), отримує тільки рутинний general-population
  care:

  **NHL скринінг:** Немає — жодної general-population screening
  modality для NHL. Symptom-triggered evaluation залишається стандартом.

  **Exposure-reduction counseling:** Для still-active workers PPE
  counseling — brief під час routine occupational-health visits без
  scheduling структурованого візиту. Retired workers — brief
  informational disclosure IARC 2A та cross-regulatory controversy.

  **Annual CBC:** Пацієнт може opt out — або погодитися на CBC при
  whatever cadence routine для його other primary-care needs (часто
  biennial після 50 років без інших ризик-факторів).

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при B-symptoms (fever, night sweats, weight loss) або
  persistent lymphadenopathy (>2 тижні, >1 см). Пацієнт явно
  інформований, які симптоми вимагають urgent return-to-clinic.

  Reroute: пацієнт може повернутися до інтенсифікованого шляху на
  будь-якому подальшому візиті. Per CHARTER §11 — shared-decision-making
  domain особливо при IARC Group 2A (probable) evidence з cross-
  regulatory disagreement.

