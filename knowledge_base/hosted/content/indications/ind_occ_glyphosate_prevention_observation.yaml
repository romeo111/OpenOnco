    Cancer-incidence outcome: no projected reduction in NHL incidence
    or stage-at-detection beyond routine general-population care.
    Given the IARC Group 2A probable-evidence quality with cross-
    regulatory contestation, the incremental benefit of intensified
    surveillance was already modest; the observation track is
