rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational hexavalent-chromium (Cr(VI)) exposure who do
  not have a current Cr(VI)-associated malignancy diagnosis. Three
  parallel interventions:

  **(1) Risk-adjusted annual LDCT chest screening.** USPSTF 2021
  criteria (age 50-80, ≥20 pack-years, current smoker or quit within
  15 years) form the baseline. For Cr(VI)-exposed workers, NCCN and
  ACR extend consideration based on cumulative exposure:
    - First LDCT at ≥10-15 years from first Cr(VI) exposure for
      current / ex-smokers (smoker × Cr(VI) synergy supports earlier
      start), ≥15-20 years for never-smokers with ≥10 years
      cumulative Cr(VI) exposure in high-burden occupations
      (electroplating, chromate pigment manufacturing, stainless-
      steel welding in enclosed environments).
    - Annual cadence; Lung-RADS reporting for nodule classification.
    - Continue annually as long as the patient remains a candidate
      for curative-intent treatment.

  **(2) Annual ENT consultation with symptom-review.** Sinonasal
  adenocarcinoma + SCC are rare at general-population baseline but
  show SMR ~20-50x in heavily-exposed chromate-pigment cohorts
  (Langård 1990). Annual ENT visit focuses on alarm symptoms:
  unilateral nasal obstruction, recurrent epistaxis, anosmia,
  facial pain, persistent rhinorrhea, palpable neck mass. Develop
  any of these → nasal endoscopy + CT sinus with contrast as
  diagnostic workup (not screening).

  **(3) Smoking-cessation counseling.** Highest-impact single
  intervention for residual lung-cancer risk reduction. Cr(VI) ×
  tobacco interaction is additive-to-multiplicative across cohort
  studies. Behavioral counseling + pharmacotherapy (varenicline,
  bupropion, NRT) per USPSTF / ATS / AAFP.

  Resource access in Ukraine: LDCT chest available at large regional /
  private centers (~1500-3500 UAH per scan); ENT consultation at
  regional centers (~400-1000 UAH); nasal endoscopy
  (~600-1500 UAH); CT sinus (~1500-3000 UAH). Smoking-cessation
  pharmacotherapy (varenicline, bupropion) is pharmacy-accessible
  without НСЗУ reimbursement.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим
  попереднім професійним впливом шестивалентного хрому (Cr(VI)) без
  поточного діагнозу Cr(VI)-асоційованої малігнізації. Три паралельні
  втручання:

  **(1) Risk-adjusted щорічна LDCT грудної клітки.** USPSTF 2021
  критерії — baseline. Для Cr(VI)-експонованих NCCN / ACR розширюють
  розгляд: перша LDCT при ≥10-15 років від першого Cr(VI)-впливу для
  поточних / ex-курців (smoker × Cr(VI) синергія підтримує ранішій
  старт), ≥15-20 років для некурців з ≥10 років кумулятивного
  Cr(VI)-впливу у high-burden професіях (електроплакування,
  виробництво хроматних пігментів, зварювання нержавіючої сталі у
  закритих приміщеннях). Щорічна частота; Lung-RADS звітність.

  **(2) Щорічна ENT-консультація з symptom-review.** Синоназальна
  аденокарцинома + SCC — рідкісні у популяції, але SMR ~20-50x у
  важко-експонованих chromate-pigment когортах (Langård 1990).
  Щорічний ENT-візит фокусується на alarm symptoms: одностороння
  назальна обструкція, рецидивуюча носова кровотеча, аносмія,
  лицьовий біль, persistent rhinorrhea, пальпована шийна маса.
  Розвиток будь-якого → назальна ендоскопія + CT синусів з
  контрастом як діагностичний workup (не скринінг).

  **(3) Counseling щодо припинення куріння.** Найвпливовіше одиничне
  втручання для зниження залишкового ризику раку легень. Cr(VI) ×
  тютюн взаємодія — адитивно-мультиплікативна.

  Доступ до ресурсів в Україні: LDCT грудної клітки (~1500-3500 грн);
  ENT-консультація у регіональних центрах (~400-1000 грн); назальна
  ендоскопія (~600-1500 грн); CT синусів (~1500-3000 грн).
  Pharmacotherapy припинення куріння аптечно-доступна без НСЗУ.

