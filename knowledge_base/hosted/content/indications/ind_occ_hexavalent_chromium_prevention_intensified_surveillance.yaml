sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Occupational carcinogen-exposure cohorts require risk-adjusted
      surveillance recommendations distinct from general-population
      screening; multidisciplinary review at large academic centers
      is the operational reference standard."
  - source_id: SRC-NCCN-NSCLC-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Annual low-dose CT lung-cancer screening is recommended for
      individuals at elevated lung-cancer risk by age, smoking history,
      and (per Clinical Practice Guidelines extension) occupational
      carcinogen exposure including hexavalent chromium."
  - source_id: SRC-NCCN-HNSCC-2025
    position: context
    relevant_quote_paraphrase: >-
      "Symptom-triggered ENT evaluation with low threshold for nasal
      endoscopy and CT sinus imaging is the operational standard for
      high-risk occupational cohorts at elevated sinonasal-cancer
      risk; no validated imaging screening modality exists for
      sinonasal cancer in asymptomatic individuals."

do_not_do:
  - "Не презентувати Cr(VI)-modified LDCT як eвідентно-rівноцінне USPSTF-стандарту — extension опирається на cohort + mechanistic-rationale, не на RCT-дані."
  - "Не пропускати ENT-консультацію — синоназальний рак рідкісний у популяції, але SMR ~20-50x у heavy-Cr(VI) когортах робить професійну атрибуцію особливо чистою."
  - "Не призначати рутинну CT синусів або назальну ендоскопію як скринінг у безсимптомних пацієнтів — symptom-triggered тільки."
  - "Не пропускати counseling щодо припинення куріння — Cr(VI) × тютюн взаємодія залишається клінічно суттєвою."

do_not_do_en:
  - "Do not present Cr(VI)-modified LDCT as evidentiarily equivalent to the USPSTF standard — the extension rests on cohort + mechanistic rationale, not RCT data."
  - "Do not skip ENT consultation — sinonasal cancer is rare at population baseline but SMR ~20-50x in heavy-Cr(VI) cohorts makes occupational attribution particularly clean."
  - "Do not order routine CT sinus or nasal endoscopy as screening in asymptomatic patients — symptom-triggered only."
  - "Do not skip smoking-cessation counseling — the Cr(VI) × tobacco interaction remains clinically substantive."

