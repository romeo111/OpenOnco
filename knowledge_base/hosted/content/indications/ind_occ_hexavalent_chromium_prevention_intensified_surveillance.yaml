expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: detection of incident Cr(VI)-attributable
    malignancy (lung, sinonasal) at earliest treatable stage via
    risk-adjusted multi-modality surveillance. NLST + NELSON data show
    annual LDCT in high-risk smokers reduces lung-cancer mortality
    ~20-26%; Cr(VI)-exposed cohorts are not formally enrolled but
    mechanistic + cohort inference (Gibb 2000; Birk 2006) supports
    extension. Sinonasal-cancer surveillance via annual ENT
    consultation + low-threshold nasal endoscopy / CT sinus has no
    RCT evidence but is operationally standard for high-SMR
    occupational cohorts (Langård 1990 chromate pigment workers
    SMR ~20-50x baseline). Smoking-cessation has largest single-
    intervention impact on lung component.

