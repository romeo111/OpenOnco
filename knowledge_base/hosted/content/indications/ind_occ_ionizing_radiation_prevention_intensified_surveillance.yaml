rationale: >
  Standard-track prevention pathway for individuals with documented
  ≥10 years occupational ionizing-radiation exposure who do not have
  a current radiation-attributable malignancy diagnosis. Five
  parallel interventions:

  **(1) Annual CBC for hematologic surveillance.** Ionizing radiation
  is the foundational occupational AML carcinogen. Cytopenia patterns
  (unexplained anemia, leukopenia, thrombocytopenia, or progressive
  monocytosis) on annual CBC prompt referral to hematology for
  peripheral-smear review and consideration of bone-marrow biopsy.
  Frequency q1y for active workers and within 15 years of cessation;
  may extend to q2y for asymptomatic patients with prior normal
  trends 15+ years post-cessation.

  **(2) Thyroid ultrasound q3-5y.** Papillary-thyroid-cancer dose-
  response is strongest for young-age exposure but supports
  surveillance ultrasound across the cohort. Frequency q3-5y;
  suspicious nodules per TI-RADS prompt FNA per ATA / NCCN.
  Higher-frequency surveillance (q2-3y) considered for workers with
  documented high cumulative thyroid-equivalent dose (>100 mSv).

  **(3) Lifetime dose-equivalent tracking.** Review of dosimetry
  records (whole-body, thyroid, breast — by ring-badge / TLD / OSL
  badge) provides individualized risk-stratification. Cumulative
  whole-body dose >50-100 mSv supports higher-intensity surveillance;
  doses approaching 1 Sv historic context (early radiologists, atomic-
  bomb survivors) require multidisciplinary review.

  **(4) Breast-cancer screening (female workers).** Apply NCCN
  average-risk screening guidelines (mammography from age 40-50 per
  patient-shared-decision) with consideration of earlier initiation
  per high-cumulative-dose cohort guidance. Patient with documented
  young-age (≤30) high-dose breast exposure (>0.5 Gy) merits
  multidisciplinary referral for individualized surveillance plan
  potentially including MRI breast.

  **(5) ALARA / PPE counseling for active workers.** Lead apron +
  thyroid shield + leaded eyewear for fluoroscopic / interventional
  procedures; time-distance-shielding principles; rotation of staff
  through high-dose tasks; verification that dosimetry badges are
  worn consistently and read on schedule.

  Resource access in Ukraine: CBC (~150-300 UAH); thyroid ultrasound
  (~400-1000 UAH); dosimetry records typically held by employer;
  mammography availability varies by region.

rationale_ua: >
  Стандартний профілактичний шлях для осіб із документованим ≥10
  роками професійного впливу іонізуючого випромінювання без поточного
  діагнозу малігнізації, асоційованої з опроміненням. Пʼять
  паралельних втручань:

  **(1) Щорічний загальний аналіз крові для гематологічного
  спостереження.** Іонізуюче випромінювання — фундаментальний
  професійний канцероген для ГМЛ. Цитопенії (незʼясована анемія,
  лейкопенія, тромбоцитопенія, прогресуючий моноцитоз) за результатами
  щорічного аналізу крові спонукають направлення до гематолога для
  перегляду периферійного мазка та розгляду біопсії кісткового мозку.
  Частота — раз на рік для активних робітників та протягом 15 років
  після припинення роботи; може бути продовжена до разу на 2 роки для
  безсимптомних пацієнтів через 15+ років після припинення.

  **(2) УЗД щитоподібної залози раз на 3-5 років.** Дозозалежність
  папілярного раку щитоподібної залози найсильніша для впливу в
  молодому віці, але підтримує ультразвукове спостереження в усій
  когорті. Частота — раз на 3-5 років; підозрілі вузли за TI-RADS
  спонукають тонкоголкову аспіраційну біопсію за ATA / NCCN.
  Спостереження з підвищеною частотою (раз на 2-3 роки) розглядається
  для робітників із документованою високою кумулятивною дозою на
  щитоподібну залозу (>100 мЗв).

  **(3) Довічне відстеження еквівалентної дози опромінення.** Перегляд
  дозиметричних записів (все тіло, щитоподібна залоза, молочна
  залоза — за даними індивідуального дозиметра / термолюмінесцентного
  чи оптико-люмінесцентного дозиметра) забезпечує індивідуалізовану
  стратифікацію ризику. Кумулятивна доза опромінення всього тіла
  >50-100 мЗв підтримує спостереження підвищеної інтенсивності.

  **(4) Скринінг раку молочної залози (жінки-робітниці).**
  Застосовувати настанови NCCN для групи середнього ризику
  (мамографія з 40-50 років за спільним рішенням із пацієнткою) з
  розглядом більш раннього початку відповідно до настанов для когорти
  з високою кумулятивною дозою. Пацієнтка з документованим впливом на
  молочну залозу високої дози (>0.5 Гр) у молодому віці (≤30 років)
  заслуговує на направлення на мультидисциплінарний розгляд.

  **(5) Консультування щодо ALARA / PPE для активних робітників.**
  Свинцевий фартух, захист щитоподібної залози, окуляри зі свинцевим
  склом для флюороскопічних / інтервенційних процедур; принципи
  захисту часом, відстанню та екрануванням; ротація персоналу між
  задачами з високою дозою; перевірка того, що дозиметричні бейджі
  носяться послідовно та зчитуються за графіком.

  Доступ до ресурсів в Україні: загальний аналіз крові (~150-300 грн);
  УЗД щитоподібної залози (~400-1000 грн); дозиметричні записи
  зазвичай зберігаються роботодавцем.

