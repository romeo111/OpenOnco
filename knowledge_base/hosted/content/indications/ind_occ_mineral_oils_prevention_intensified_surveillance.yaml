sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Occupational carcinogen-exposure cohorts at elevated cutaneous-
      cancer risk receive structured annual dermatology surveillance
      with focused exam of oil-contact / chemical-contact body sites;
      this surveillance is operational standard rather than
      RCT-validated screening."
  - source_id: SRC-NCCN-SKIN-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Annual professional skin examination is recommended for
      individuals at elevated cutaneous-cancer risk by prior NMSC,
      heavy sun exposure, immunosuppression, or (per Clinical
      Practice Guidelines extension) occupational chemical exposure
      including untreated / mildly-treated mineral oils; self-skin-
      checks between visits are recommended."

do_not_do:
  - "Не пропускати огляд occluded oil-contact ділянок (мошонка, posterior thighs) — історичний scrotal-SCC mechanism — prolonged oil-saturation робочих штанів — залишається конкретним warning sign для long-tenure machinists."
  - "Не презентувати дерматологічний огляд як RCT-validated скринінг — рекомендація — operational standard для high-risk occupational cohort, evidence base — cohort + mechanistic, не RCT."
  - "Не ігнорувати UV × mineral-oil синергію — chemical photosensitization мультиплікує UV-driven photocarcinogenesis у oil-contact ділянках; sun-protection потрібна."
  - "Не призначати рутинну Mohs micrographic surgery або сторожеву лімфаденектомію поза підтвердженою малігнізацією — індикація біопсією, не surveillance."

do_not_do_en:
  - "Do not skip examination of occluded oil-contact sites (scrotum, posterior thighs) — the historic scrotal-SCC mechanism (prolonged oil-saturation of work trousers) remains a concrete warning sign for long-tenure machinists."
  - "Do not present dermatology consultation as RCT-validated screening — the recommendation is operational standard for the high-risk occupational cohort; evidence base is cohort + mechanistic, not RCT."
  - "Do not ignore UV × mineral-oil synergy — chemical photosensitization multiplies UV-driven photocarcinogenesis at oil-contact sites; sun-protection is required."
  - "Do not order routine Mohs micrographic surgery or sentinel lymphadenectomy outside of biopsy-confirmed malignancy — these are treatment indications, not surveillance."

