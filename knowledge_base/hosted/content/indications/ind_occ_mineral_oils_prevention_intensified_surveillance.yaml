expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: detection of incident cutaneous SCC (and BCC,
    melanoma incidentally) at earliest treatable stage via annual
    professional dermatology cadence. Historic mule-spinners scrotal-
    SCC cohort (Cruickshank & Squire 1950) is foundational post-Pott
    occupational-carcinogenesis evidence; modern metal-working-cohort
    skin-cancer SIR ~1.3-1.7x baseline (Hogstedt 2017 Swedish
    cohort). Self-skin-check between visits has documented detection
    benefit; sun-protection at oil-contact sites addresses multiplicative
    UV × mineral-oil photocarcinogenesis.

