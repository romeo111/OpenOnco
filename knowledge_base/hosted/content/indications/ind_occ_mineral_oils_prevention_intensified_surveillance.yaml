rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational untreated / mildly-treated mineral-oil exposure
  who do not have a current mineral-oil-associated cutaneous-cancer
  diagnosis. Three parallel interventions:

  **(1) Annual dermatology consultation with full-skin exam.**
  Focused attention on oil-contact areas: face, neck, hands,
  forearms, scrotum, posterior thighs (occupational lap-oil contact).
  Suspicious lesions (chronic hyperkeratotic plaques, non-healing
  ulcers, induration, asymmetric pigmentation) prompt biopsy.
  Cadence is annual; high-risk patients with prior actinic keratoses,
  prior NMSC, or known field-cancerization may move to q6 months.

  **(2) Patient education: self-skin-checks + sun-protection.**
  Patient counseled to perform monthly self-skin-checks at oil-
  contact areas (mirror-aided exam of scrotum, posterior arms,
  back; partner-assisted exam of back). Report any new lesion or
  changing lesion promptly. Sun-protection at oil-contact sites
  addresses multiplicative UV × mineral-oil photocarcinogenesis
  (chemical photosensitization) — broad-spectrum SPF 30+ on hands
  / forearms / face when outdoor occupational + recreational
  exposure overlap.

  **(3) PPE + exposure-modification counseling if active exposure
  persists.** Oil-resistant gloves + protective sleeves; avoidance
  of oil-soaked clothing (historic scrotal-SCC mechanism was
  prolonged oil-saturation of work trousers); rigorous skin hygiene
  at shift end including degreasing handwash + change-of-clothing.
  Modern metal-working-fluid replacement with severely-hydrotreated
  base oils + synthetic alternatives substantially reduces residual
  risk for ongoing exposure cohorts.

  Resource access in Ukraine: dermatology consultation accessible at
  regional centers (~400-1000 UAH); biopsy + histopathology
  (~1000-3000 UAH). PPE pharmacy-accessible without НСЗУ.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим
  попереднім професійним впливом необроблених / слабко-оброблених
  мінеральних масел без поточного діагнозу mineral-oil-асоційованого
  раку шкіри. Три паралельні втручання:

  **(1) Щорічна дерматологічна консультація з повним оглядом
  шкіри.** Фокусована увага на oil-contact ділянках: обличчя, шия,
  руки, передпліччя, мошонка, posterior thighs (occupational
  lap-oil contact). Підозрілі ураження (хронічні hyperkeratotic
  plaques, неcicатризуючі виразки, ущільнення, asymmetric
  pigmentation) потребують біопсії. Частота — щорічна;
  high-risk пацієнти з prior actinic keratoses, prior NMSC або
  field-cancerization можуть переходити на q6 місяців.

  **(2) Patient education: self-skin-checks + sun-protection.**
  Пацієнт інструктований виконувати щомісячні self-skin-checks на
  oil-contact ділянках (mirror-aided огляд мошонки, posterior arms,
  спини; partner-assisted огляд спини). Повідомляти про будь-яке
  нове / змінювальне ураження негайно. Sun-protection на
  oil-contact ділянках адресує мультиплікативну UV × mineral-oil
  photocarcinogenesis (хімічну фотосенсибілізацію) — broad-spectrum
  SPF 30+ на руках / передпліччях / обличчі при overlap outdoor
  occupational + recreational впливу.

  **(3) PPE + exposure-modification counseling при активному
  впливі.** Oil-resistant gloves + protective sleeves; уникнення
  oil-soaked одягу (історичний scrotal-SCC mechanism — prolonged
  oil-saturation робочих штанів); рігорозна гігієна шкіри в кінці
  зміни (degreasing handwash + change-of-clothing). Сучасна заміна
  metal-working-fluid на severely-hydrotreated base oils + synthetic
  alternatives суттєво знижує residual ризик для ongoing exposure
  cohorts.

  Доступ до ресурсів в Україні: дерматологічна консультація
  доступна у регіональних центрах (~400-1000 грн); біопсія +
  гістопатологія (~1000-3000 грн). PPE аптечно-доступне без НСЗУ.

