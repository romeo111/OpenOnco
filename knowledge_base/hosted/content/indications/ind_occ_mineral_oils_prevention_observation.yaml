rationale: >
  Alternative-track companion to IND-OCC-MINERAL-OILS-PREVENTION-
  INTENSIFIED-SURVEILLANCE. Patient with documented prior
  occupational mineral-oil exposure who declines annual professional
  dermatology cadence — for any reason (cost, geographic access
  constraints to dermatology centers, preference for less-
  interventional pathway, low perceived risk for short-tenure or
  modern-MWF-only exposure) — is offered patient-driven self-care
  only:

  **Skin-cancer screening:** No proactive annual professional
  dermatology cadence. Patient is counseled to perform monthly
  self-skin-checks at oil-contact areas (mirror-aided exam of
  scrotum, posterior arms, back; partner-assisted exam of back) and
  to report any new / changing lesion (chronic hyperkeratotic
  plaques, non-healing ulcers, induration, asymmetric pigmentation)
  to primary-care or urgent dermatology evaluation promptly. Patient
  is explicitly informed that mineral-oil-attributable excess risk
  is unaddressed by proactive surveillance.

  **Sun protection:** Still offered — chemical UV-photosensitization
  by retained mineral-oil residue at contact sites mathematically
  multiplies UV-driven photocarcinogenesis. Broad-spectrum SPF 30+
  at oil-contact sites during outdoor activity.

  **PPE counseling if active exposure persists:** Same as standard
  track — oil-resistant gloves, protective sleeves, avoidance of
  oil-soaked clothing, shift-end degreasing handwash.

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on new / persistent skin lesions at any oil-contact site;
  unhealing wound or hyperkeratotic plaque ≥4 weeks duration
  warrants dermatology consultation.

  Routing reconsiderations: patient may revisit intensified-
  surveillance pathway at any subsequent visit. Per CHARTER §11
  patient-autonomy framing: dermatologic surveillance is a shared-
  decision-making domain.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-MINERAL-
  OILS-PREVENTION-INTENSIFIED-SURVEILLANCE. Пацієнт з документованим
  попереднім професійним впливом мінеральних масел, який
  відмовляється від щорічної професійної дерматологічної частоти
  (вартість, географічні обмеження до дерматологічних центрів,
  перевага менш-інтервенційного шляху, низький perceived ризик для
  short-tenure або modern-MWF-only впливу), отримує тільки
  patient-driven self-care:

  **Скринінг раку шкіри:** Без проактивної щорічної професійної
  дерматологічної частоти. Пацієнт інструктований виконувати
  щомісячні self-skin-checks на oil-contact ділянках (mirror-aided
  огляд мошонки, posterior arms, спини; partner-assisted огляд
  спини) та повідомляти про будь-яке нове / змінювальне ураження
  негайно. Пацієнт явно інформований, що mineral-oil-attributable
  excess ризик не адресується.

  **Sun protection:** Все ще пропонується — UV × mineral-oil
  синергія мультиплікує photocarcinogenesis. Broad-spectrum SPF 30+
  на oil-contact ділянках під час outdoor діяльності.

  **PPE-counseling при активному впливі:** Те ж, що у стандартному
  треку — oil-resistant gloves, protective sleeves, уникнення
  oil-soaked одягу, shift-end degreasing handwash.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при нових / persistent ураженнях шкіри на oil-contact
  ділянках; unhealing wound або hyperkeratotic plaque ≥4 тижнів —
  потребує дерматологічної консультації.

  Reroute: пацієнт може повернутися до інтенсифікованого
  спостереження на будь-якому подальшому візиті. Per CHARTER §11
  — shared-decision-making domain.

