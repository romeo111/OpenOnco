sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining proactive surveillance for occupational
      carcinogen cohorts continue to receive symptom-triggered
      evaluation and standard-of-care general-population care."
  - source_id: SRC-NCCN-SKIN-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients who decline annual professional skin examination
      receive ongoing patient-driven self-skin-checks; symptom-
      triggered dermatology evaluation remains the operational
      standard for new / changing lesions."

do_not_do:
  - "Не презентувати observation як еквівалент annual professional dermatology surveillance — incidence-detection benefit відсутній; mineral-oil-attributable excess ризик не адресується."
  - "Не ігнорувати alarm features (non-healing ulcer, hyperkeratotic plaque, induration, asymmetric pigmentation на oil-contact ділянці) — immediate дерматологічна оцінка."
  - "Не використовувати цей шлях як стандарт першої лінії — annual professional dermatology cadence залишається preferred для long-tenure / pre-1980 exposure cohort."
  - "Не пропускати sun-protection counseling — UV × mineral-oil синергія залишається клінічно суттєвою незалежно від surveillance-track вибору."

do_not_do_en:
  - "Do not present observation as equivalent to annual professional dermatology surveillance — incidence-detection benefit is absent; mineral-oil-attributable excess risk is unaddressed."
  - "Do not ignore alarm features (non-healing ulcer, hyperkeratotic plaque, induration, asymmetric pigmentation at oil-contact site) — immediate dermatology evaluation."
  - "Do not use this pathway as a first-line standard — annual professional dermatology cadence remains the preferred recommendation for long-tenure / pre-1980 exposure cohorts."
  - "Do not skip sun-protection counseling — the UV × mineral-oil synergy remains clinically substantive regardless of surveillance-track choice."

