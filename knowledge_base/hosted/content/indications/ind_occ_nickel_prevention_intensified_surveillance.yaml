rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational nickel-compound exposure who do not have a
  current nickel-associated malignancy diagnosis. Three parallel
  interventions:

  **(1) Risk-adjusted annual LDCT chest screening.** USPSTF 2021
  criteria (age 50-80, ≥20 pack-years, current smoker or quit within
  15 years) form the baseline. For nickel-exposed workers, NCCN and
  ACR extend consideration based on cumulative exposure:
    - First LDCT at ≥10-15 years from first nickel exposure for
      current / ex-smokers, ≥15-20 years for never-smokers with
      ≥10 years cumulative nickel exposure in high-burden
      occupations (nickel refining, NiCd battery manufacture,
      electroplating).
    - Annual cadence; Lung-RADS reporting for nodule classification.

  **(2) Annual ENT consultation with symptom-review.** Sinonasal
  cancer is rare at general-population baseline but shows SMR
  ~100-200x in pre-modernization refinery cohorts (ICNCM 1990).
  Modern refineries have substantially lower excess but residual
  elevation persists for long-tenure workers. Annual ENT visit
  focuses on alarm symptoms: unilateral nasal obstruction,
  recurrent epistaxis, anosmia, facial pain, persistent rhinorrhea,
  palpable neck mass. Develop any of these → nasal endoscopy +
  CT sinus with contrast as diagnostic workup.

  **(3) Smoking-cessation counseling.** Highest-impact single
  intervention for residual lung-cancer risk reduction. Nickel ×
  tobacco interaction is additive-to-multiplicative across cohort
  studies. Behavioral counseling + pharmacotherapy (varenicline,
  bupropion, NRT) per USPSTF / ATS / AAFP.

  Resource access in Ukraine: LDCT chest (~1500-3500 UAH);
  ENT consultation (~400-1000 UAH); nasal endoscopy
  (~600-1500 UAH); CT sinus (~1500-3000 UAH). Smoking-cessation
  pharmacotherapy pharmacy-accessible without НСЗУ reimbursement.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим
  попереднім професійним впливом сполук нікелю без поточного
  діагнозу нікель-асоційованої малігнізації. Три паралельні
  втручання:

  **(1) Risk-adjusted щорічна LDCT грудної клітки.** USPSTF 2021
  критерії — baseline. Для nickel-експонованих NCCN / ACR
  розширюють розгляд: перша LDCT при ≥10-15 років від першого
  впливу для поточних / ex-курців, ≥15-20 років для некурців з
  ≥10 років кумулятивного впливу у high-burden професіях
  (нікелеве рафінування, виробництво NiCd-батарей,
  електроплакування). Щорічна частота; Lung-RADS звітність.

  **(2) Щорічна ENT-консультація з symptom-review.** Синоназальний
  рак рідкісний у популяції, але SMR ~100-200x у pre-modernization
  refinery когортах (ICNCM 1990). Сучасні рафінерії мають суттєво
  меншe надлишком, але residual elevated risk зберігається для
  long-tenure працівників. Щорічний ENT-візит фокусується на alarm
  symptoms: одностороння назальна обструкція, рецидивуюча носова
  кровотеча, аносмія, лицьовий біль, persistent rhinorrhea,
  пальпована шийна маса. Розвиток будь-якого → назальна ендоскопія +
  CT синусів з контрастом як діагностичний workup.

  **(3) Counseling щодо припинення куріння.** Найвпливовіше одиничне
  втручання для зниження залишкового ризику раку легень. Nickel ×
  тютюн взаємодія — адитивно-мультиплікативна.

  Доступ до ресурсів в Україні: LDCT грудної клітки (~1500-3500 грн);
  ENT-консультація (~400-1000 грн); назальна ендоскопія
  (~600-1500 грн); CT синусів (~1500-3000 грн). Pharmacotherapy
  припинення куріння аптечно-доступна без НСЗУ.

