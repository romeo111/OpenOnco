expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: detection of incident nickel-attributable
    malignancy (lung, sinonasal) at earliest treatable stage via
    risk-adjusted multi-modality surveillance. NLST + NELSON data
    show annual LDCT in high-risk smokers reduces lung-cancer
    mortality ~20-26%; nickel-exposed cohorts are not formally
    enrolled but mechanistic + cohort inference (ICNCM 1990;
    pre-modernization refinery SMR ~1.5-2.5x lung, ~100-200x
    sinonasal) supports extension. Sinonasal-cancer surveillance via
    annual ENT consultation + low-threshold nasal endoscopy / CT
    sinus has no RCT evidence but is operationally standard for
    high-SMR occupational cohorts. Smoking-cessation has largest
    single-intervention impact on lung component.

