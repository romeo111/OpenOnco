rationale: >
  Alternative-track companion to IND-OCC-NICKEL-PREVENTION-
  INTENSIFIED-SURVEILLANCE. Patient with documented prior occupational
  nickel-compound exposure who declines nickel-modified imaging +
  ENT surveillance — for any reason (cost across multiple
  surveillance modalities, anxiety from layered surveillance burden,
  preference for less-interventional pathway, geographic access
  constraints, life expectancy / competing illness) — is offered
  routine general-population screening only:

  **Lung-cancer screening:** Apply USPSTF 2021 criteria unmodified.
  If patient meets criteria they receive annual LDCT at the routine
  cadence; if not, no imaging screening is offered. Patient is
  explicitly informed that nickel-attributable excess risk is
  unaddressed.

  **Sinonasal-cancer screening:** None — explicit absence of
  validated general-population screening modality; this track makes
  no change. Patient is counseled to report unilateral nasal
  obstruction, recurrent epistaxis, anosmia, or persistent facial
  pain promptly.

  **Smoking cessation:** Still offered — nickel × tobacco interaction
  remains clinically substantive and cessation is the largest single
  mortality lever regardless of surveillance-track choice.

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on new / persistent chest symptoms (dyspnea, hemoptysis,
  weight loss, chronic cough) or sinonasal symptoms (unilateral
  nasal obstruction, recurrent epistaxis, anosmia, facial pain).

  Routing reconsiderations: patient may revisit intensified-
  surveillance pathway at any subsequent visit, in whole or in part
  (e.g., agree to annual ENT alone). Per CHARTER §11 patient-autonomy
  framing: multi-modality surveillance is a shared-decision-making
  domain.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-NICKEL-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Пацієнт з документованим
  попереднім професійним впливом сполук нікелю, який відмовляється
  від nickel-модифікованого imaging + ENT-спостереження (вартість,
  радіація, тривога від layered surveillance burden, перевага
  менш-інтервенційного шляху, географічні обмеження), отримує тільки
  рутинний загальнопопуляційний скринінг:

  **Скринінг раку легень:** Застосовувати USPSTF 2021 без модифікації.
  Пацієнт явно інформований, що nickel-attributable excess ризик не
  адресується.

  **Скринінг синоназального раку:** Немає — валідована
  загальнопопуляційна модальність відсутня. Пацієнту радять негайно
  повідомляти про одностороннє назальне обстеження, рецидивуючу
  носову кровотечу, аносмію або persistent лицьовий біль.

  **Припинення куріння:** Все ще пропонується — nickel × тютюн
  взаємодія залишається клінічно суттєвою.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при нових / persistent симптомах з боку грудної клітки або
  синоназальній ділянці.

  Reroute: пацієнт може повернутися до інтенсифікованого спостереження
  на будь-якому подальшому візиті, в цілому або частково. Per CHARTER
  §11 — shared-decision-making domain.

