expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: avoidance of intensified multi-modality
    surveillance (LDCT + annual ENT) when patient declines the
    nickel-modified pathway. Cancer-incidence outcome: no reduction
    in nickel-attributable lung / sinonasal cancer incidence beyond
    what routine general-population screening provides. LDCT applied
    at unmodified USPSTF criteria misses nickel-exposed non-smokers
    and nickel-exposed light smokers with <20 pack-years. Sinonasal
    cancer is unaddressed except through symptom-triggered
    evaluation. Smoking-cessation counseling remains appropriate
    regardless of surveillance-track choice.

