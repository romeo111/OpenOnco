sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining multi-modality surveillance for occupational
      mixed-exposure cohorts continue to receive symptom-triggered
      evaluation and standard-of-care general-population follow-up."
  - source_id: SRC-NCCN-NSCLC-2025
    position: context
    relevant_quote_paraphrase: >-
      "Multi-modality surveillance pathways for moderate-RR occupational
      cohorts are subject to patient-autonomy and shared-decision-
      making considerations."

do_not_do:
  - "Не презентувати спостереження без додаткових модальностей як еквівалент багатомодального спостереження — надлишковий ризик, повʼязаний із малярською професією, не адресується."
  - "Не ігнорувати тривожні ознаки (симптоми з боку грудної клітки, гематурія, цитопенія) — негайне обстеження."
  - "Не використовувати цей шлях як стандарт першої лінії — шлях інтенсифікованого спостереження залишається пріоритетним."
  - "Не пропускати консультування щодо припинення куріння — рекомендація актуальна незалежно від вибору шляху спостереження."

do_not_do_en:
  - "Do not present observation as equivalent to multi-modality surveillance — paint-occupation-attributable excess risk is unaddressed."
  - "Do not ignore alarm features (chest symptoms, hematuria, cytopenia) — immediate evaluation."
  - "Do not use this pathway as a first-line standard — the intensified-surveillance track remains the preferred recommendation."
  - "Do not skip smoking-cessation counseling — the recommendation is relevant regardless of surveillance-track choice."

