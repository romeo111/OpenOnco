do_not_do:
  - "Не презентувати IARC 2A→1 reclassification без context — clinical recommendations залишаються similar на individual-patient level; cohort-level evidence weight зростає, не RCT-driven intervention efficacy."
  - "Не призначати рутинний imaging screening (CT chest-abdomen-pelvis, PET-CT) для asymptomatic PCB-exposed individuals — harm:benefit ratio unfavorable per NCCN."
  - "Не пропускати dermatologic exam — melanoma — найсильніший cancer endpoint в IARC 107 evidence summary."
  - "Не призначати empiric anti-cancer chemoprophylaxis — жодна evidence-based intervention існує для NHL або melanoma prevention у PCB-exposed cohort."

do_not_do_en:
  - "Do not present the IARC 2A→1 reclassification without context — clinical recommendations remain similar at the individual-patient level; the change shifts cohort-level evidence weight, not RCT-driven intervention efficacy."
  - "Do not order routine imaging screening (CT chest-abdomen-pelvis, PET-CT) for asymptomatic PCB-exposed individuals — harm:benefit ratio is unfavorable per NCCN."
  - "Do not skip dermatologic exam — melanoma is the strongest cancer endpoint in the IARC 107 evidence summary."
  - "Do not prescribe empiric anti-cancer chemoprophylaxis — no evidence-based intervention exists for NHL or melanoma prevention in the PCB-exposed cohort."

