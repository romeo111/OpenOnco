rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational PCB exposure who do not have a current PCB-
  attributable malignancy diagnosis. Four parallel interventions:

  **(1) NHL-symptom-awareness education.** Educate patient on
  B-symptoms (fever ≥38°C without infection, drenching night sweats,
  ≥10% unintentional weight loss over 6 months) and on lymphadenopathy
  patterns (palpable cervical / axillary / supraclavicular / inguinal
  nodes >1 cm persistent >2 weeks without clear infectious cause).
  Low threshold for primary-care evaluation if symptoms develop.

  **(2) Annual CBC + LDH + targeted history-and-physical.** Annual
  CBC + LDH is cheap, non-invasive, and screens for cytopenias /
  lymphocytosis / elevated LDH that may signal underlying
  lymphoproliferative disorder. Targeted history-and-physical at
  annual visit: ask explicitly about B-symptoms and palpate lymph-
  node chains. Symptom-triggered workup: LDH (if not already done),
  beta-2 microglobulin, peripheral-blood flow cytometry if
  lymphocytosis, lymph-node ultrasound → core biopsy for persistent
  / progressive lymphadenopathy.

  **(3) Annual dermatologic full-body skin exam.** PCB exposure
  is more strongly associated with malignant melanoma than with
  NHL in the IARC 107 evidence summary. Annual dermatologist visit
  for full-body skin survey is supported by NCCN risk-stratified
  framework for occupational chemical-exposure cohorts.
  Patient-performed monthly self-exam supplements.

  **(4) Breast-cancer screening (women).** PCB has suggestive
  but not definitive association with breast cancer. Guideline-
  baseline mammography adherence (USPSTF biennial starting age 40
  per 2024 guideline; NCCN supports consideration of earlier and
  more frequent in PCB cohort with clustering risk factors).

  Resource access in Ukraine: CBC + LDH widely available (~200-600
  UAH); dermatologist exam at private clinics (~300-1000 UAH);
  mammography (~800-2000 UAH); lymph-node ultrasound (~500-1500
  UAH); core biopsy and flow cytometry at regional oncology
  centers (typically НСЗУ-covered).

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим попереднім
  професійним впливом PCB, які не мають поточного діагнозу PCB-
  attributable malignancy. Чотири паралельні втручання:

  **(1) NHL-symptom-awareness education.** Освіта пацієнта про
  B-symptoms (fever ≥38°C без інфекції, drenching night sweats,
  ≥10% unintentional weight loss за 6 місяців) та lymphadenopathy
  patterns (palpable cervical / axillary / supraclavicular / inguinal
  nodes >1 см persistent >2 тижні без clear infectious cause).
  Низький поріг для primary-care evaluation при розвитку симптомів.

  **(2) Annual CBC + LDH + targeted history-and-physical.** Annual
  CBC + LDH — cheap, non-invasive, screens for cytopenias /
  lymphocytosis / elevated LDH. Targeted history-and-physical на
  annual visit: explicitly запитати про B-symptoms та palpate
  lymph-node chains. Symptom-triggered workup: LDH (якщо ще не
  зроблено), β2-microglobulin, peripheral-blood flow cytometry
  при lymphocytosis, lymph-node ultrasound → core biopsy при
  persistent / progressive lymphadenopathy.

  **(3) Annual dermatologic full-body skin exam.** PCB експозиція
  — сильніше асоційована з malignant melanoma ніж з NHL в IARC
  107 evidence summary. Annual dermatologist візит для full-body
  skin survey — підтримано NCCN risk-stratified framework для
  occupational chemical-exposure cohorts. Patient-performed monthly
  self-exam supplements.

  **(4) Breast-cancer screening (жінки).** PCB має suggestive,
  але не definitive асоціацію з breast cancer. Guideline-baseline
  mammography adherence (USPSTF biennial starting age 40 per 2024
  guideline; NCCN supports consideration of earlier and more
  frequent в PCB cohort з clustering risk factors).

  Доступ до ресурсів в Україні: CBC + LDH (~200-600 грн); dermatologist
  exam (~300-1000 грн); mammography (~800-2000 грн); lymph-node
  ultrasound (~500-1500 грн); core biopsy + flow cytometry — на
  регіональних онко-центрах (typically НСЗУ-covered).

