expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: NHL-symptom-awareness + annual CBC + LDH +
    annual dermatologic exam aims at earlier-stage detection of
    incident NHL (DLBCL or other aggressive subtype) and melanoma
    when / if they occur. There is NO RCT-grade evidence for
    imaging screening or biomarker testing for NHL in the PCB-
    exposed cohort; annual CBC + LDH is cheap, non-invasive, and
    may detect cytopenias / lymphocytosis / elevated LDH that
    suggests underlying lymphoproliferative disorder. Annual
    dermatologic exam for full-body skin survey can detect early-
    stage melanoma (the strongest IARC 107 endpoint) at curable
    stage. Symptom-triggered LDH + lymph-node ultrasound / CT
    workup at first presentation of B symptoms (fever, weight
    loss, night sweats) or lymphadenopathy is the primary
    detection lever for NHL.

