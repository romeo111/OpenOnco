sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining intensified surveillance for occupational
      carcinogen cohorts continue to receive symptom-triggered
      evaluation; melanoma self-exam and standard mammography
      remain offered."

do_not_do:
  - "Не презентувати observation як еквівалент structured surveillance — earlier-detection benefit forgone особливо для melanoma; alarm-feature awareness залишається critical."
  - "Не ігнорувати B-symptoms (fever, night sweats, weight loss), persistent lymphadenopathy, або new / changing pigmented skin lesions — immediate діагностичний workup за показаннями."
  - "Не використовувати цей шлях як стандарт першої лінії — intensified-track залишається preferred для PCB-exposed cohort, особливо з огляду на IARC 2A→1 reclassification."
  - "Не пропускати breast-cancer screening discussion (жінки) — USPSTF baseline залишається applicable незалежно від surveillance-track вибору."

do_not_do_en:
  - "Do not present observation as equivalent to structured surveillance — earlier-detection benefit is forgone, especially for melanoma; alarm-feature awareness remains critical."
  - "Do not ignore B-symptoms (fever, night sweats, weight loss), persistent lymphadenopathy, or new / changing pigmented skin lesions — immediate diagnostic workup as indicated."
  - "Do not use this pathway as a first-line standard — the intensified track remains preferred for the PCB-exposed cohort, particularly given the IARC 2A→1 reclassification."
  - "Do not skip breast-cancer screening discussion (women) — the USPSTF baseline remains applicable regardless of surveillance-track choice."

