expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: avoidance of structured symptom-awareness
    education, annual CBC + LDH, annual dermatologic exam, and
    breast-screening intensification when patient declines.
    Cancer-incidence outcome: no projected reduction in PCB-
    attributable NHL or melanoma incidence beyond routine general-
    population care. Earlier-detection benefit from accelerated
    surveillance is forgone; given the IARC 2A→1 reclassification
    and the cohort-level evidence weight, this track is a more
    explicit shared-decision-making choice than for less-established
    carcinogens.

