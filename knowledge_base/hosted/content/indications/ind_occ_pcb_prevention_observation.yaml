rationale: >
  Alternative-track companion to IND-OCC-PCB-PREVENTION-INTENSIFIED-
  SURVEILLANCE. Individual with documented prior occupational PCB
  exposure who declines structured surveillance (NHL-symptom-awareness,
  annual CBC + LDH, annual dermatologic exam) — for any reason (life
  expectancy / competing illness, anxiety from repeated testing /
  imaging false-positive cascade, preference for less-interventional
  pathway, financial constraint, geographic-access limitation) — is
  offered routine general-population care only:

  **NHL screening:** None — no general-population modality. Symptom-
  triggered evaluation remains the standard.

  **Melanoma screening:** Routine self-exam recommended; patient
  may decline annual dermatologist visit. Brief informational
  disclosure of the PCB-melanoma association is offered.

  **Breast-cancer screening (women):** Apply USPSTF 2024 criteria
  unmodified — biennial mammography starting age 40 to 74. Patient
  is explicitly informed that the IARC 107 (Group 1) excess breast-
  cancer risk associated with their occupational history is
  suggestive (not definitive) and is not specifically addressed
  by this routine track.

  **Annual CBC / LDH:** Patient may opt out — or may agree at
  whatever cadence is routine for their other primary-care needs.

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on B-symptoms (fever, night sweats, weight loss), persistent
  lymphadenopathy (>2 weeks, >1 cm), or new / changing pigmented
  skin lesions (ABCDE criteria: Asymmetry, Border irregularity,
  Color variegation, Diameter >6 mm, Evolution over time).

  Routing reconsiderations: patient may revisit intensified pathway
  at any subsequent visit. Per CHARTER §11 patient-autonomy framing:
  occupational-exposure surveillance is a shared-decision-making
  domain. The IARC 2A→1 reclassification gives this conversation
  more evidentiary weight than for purely-2A pilots, but the
  practical recommendations at the individual-patient level are
  similar in magnitude.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-PCB-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Особа з документованим
  попереднім професійним впливом PCB, яка відмовляється від
  структурованого surveillance (NHL-symptom-awareness, annual CBC +
  LDH, annual dermatologic exam) — для будь-якої причини (life
  expectancy / competing illness, anxiety від repeated testing /
  imaging false-positive cascade, перевага менш-інтервенційного
  шляху, фінансові обмеження, geographic-access limitation) —
  отримує тільки рутинний general-population care:

  **NHL скринінг:** Немає — жодної general-population modality.
  Symptom-triggered evaluation залишається стандартом.

  **Melanoma скринінг:** Routine self-exam рекомендовано; пацієнт
  може відмовитися від annual dermatologist візиту. Brief
  informational disclosure PCB-melanoma асоціації.

  **Breast-cancer скринінг (жінки):** USPSTF 2024 без модифікації —
  biennial mammography з 40 до 74 років. Пацієнтка явно інформована,
  що IARC 107 (Group 1) excess breast-cancer risk — suggestive
  (не definitive) та не адресується специфічно цим рутинним треком.

  **Annual CBC / LDH:** Пацієнт може opt out — або погодитися на
  будь-яку cadence routine для його other primary-care needs.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при B-symptoms (fever, night sweats, weight loss), persistent
  lymphadenopathy (>2 тижні, >1 см), або new / changing pigmented
  skin lesions (ABCDE criteria: Asymmetry, Border irregularity,
  Color variegation, Diameter >6 мм, Evolution over time).

  Reroute: пацієнт може повернутися до інтенсифікованого шляху на
  будь-якому подальшому візиті. Per CHARTER §11 — shared-decision-making
  domain. IARC 2A→1 reclassification надає цій conversation більше
  evidentiary weight ніж для purely-2A пілотів, але practical
  recommendations на individual-patient level — similar в magnitude.

