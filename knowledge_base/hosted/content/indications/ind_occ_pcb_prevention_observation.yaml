notes: >
  STUB — alternative-track companion for PCB occupational prevention
  pilot. §15.2 C4 ≥2-tracks invariant compliance. IARC Group 2A
  probable — limited human evidence; clinical recommendation more
  conservative than Group 1; reclassified Group 1 in 2013 IARC
  Monograph 107 (published 2015) — authored at 2A-conservative
  severity per batch scope. Two-Clinical-Co-Lead signoff queued per
  CHARTER §6.1 dev-mode exemption.
