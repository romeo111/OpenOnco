expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: sleep-hygiene + workplace-scheduling counseling
    targets cumulative-exposure mitigation (limit consecutive night
    shifts ≤3-4 in a row, ≥48 hr recovery before next set, avoid
    permanent night-shift assignment >15-20 years, prefer forward-
    rotating shift patterns over backward-rotating). IARC 124 evidence
    base does not support a specific cumulative threshold below which
    risk is null — counseling targets reduction in cumulative exposure,
    not a dichotomous safe / unsafe boundary. Breast-cancer screening
    intensification: NCCN risk-stratified framework supports
    consideration of earlier baseline mammography at age 40 (instead
    of USPSTF default age 50) and annual cadence (instead of biennial)
    in shift-work cohort, particularly when clustering with first-degree
    family history, obesity, alcohol consumption, or hormone-replacement
    therapy use. Expected absolute risk reduction is modest (~0.5-1.5
    percentage points lifetime breast-cancer incidence) — earlier
    detection benefit dominates over primary-prevention.

