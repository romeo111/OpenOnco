do_not_do:
  - "Не презентувати breast-cancer screening intensification як high-certainty інтервенцію для shift-work cohort — IARC Group 2A probable evidence не еквівалентна Group 1."
  - "Не призначати рутинний breast MRI для shift-work cohort в ізоляції — NCCN підтримує MRI тільки при додаткових genetic / family-history / Tyrer-Cuzick критеріях."
  - "Не пропускати workplace-scheduling counseling — modifiable career-stage decisions (transition to day-shift у later years) є high-impact де feasible."
  - "Не рекомендувати melatonin supplementation як cancer-prevention інтервенцію — evidence-база insufficient для рутинної рекомендації per NCCN."

do_not_do_en:
  - "Do not present breast-cancer screening intensification as a high-certainty intervention for the shift-work cohort — IARC Group 2A probable evidence is not equivalent to Group 1."
  - "Do not order routine breast MRI for the shift-work cohort in isolation — NCCN supports MRI only when additional genetic / family-history / Tyrer-Cuzick criteria are met."
  - "Do not skip workplace-scheduling counseling — modifiable career-stage decisions (transition to day-shift in later years) are high-impact where feasible."
  - "Do not recommend melatonin supplementation as a cancer-prevention intervention — the evidence base is insufficient for routine recommendation per NCCN."

