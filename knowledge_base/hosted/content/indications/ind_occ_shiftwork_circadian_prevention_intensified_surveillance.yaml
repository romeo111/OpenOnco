rationale: >
  Standard-track prevention pathway for women with documented ≥10 years
  of night-shift / circadian-disrupting rotating shift work and no
  current breast-cancer diagnosis. Three parallel interventions:

  **(1) Workplace-scheduling counseling.** Highest-impact mitigation
  lever where modifiable. Practical recommendations from European
  occupational-health consensus: (a) limit consecutive night shifts
  to ≤3-4, (b) ensure ≥48 hr recovery before next set, (c) prefer
  forward-rotating shift patterns (morning → afternoon → night) over
  backward-rotating (night → afternoon → morning), (d) avoid permanent
  night-shift assignment exceeding 15-20 cumulative years, (e) where
  feasible, transition to day-shift in the later career years. These
  are conditional recommendations — IARC 124 evidence does not
  identify a specific threshold below which risk is null.

  **(2) Sleep-hygiene counseling.** Strategies to preserve circadian
  rhythm to the extent feasible: blackout curtains for daytime sleep,
  consistent sleep schedule on days off (avoid "drifting" weekly
  rhythm), pre-sleep light minimization, daytime exposure to bright
  light, cognitive-behavioral therapy for insomnia (CBT-I) referral
  when sleep disturbance is severe. Melatonin supplementation
  evidence-base for cancer-prevention is insufficient for routine
  recommendation per NCCN — counseling can mention as
  patient-preference-driven.

  **(3) Breast-cancer screening intensification.** NCCN risk-stratified
  mammography framework supports consideration of earlier baseline
  (age 40 instead of USPSTF default 50) and annual cadence (instead
  of biennial) when shift-work clusters with other breast-cancer risk
  factors. Adjunct breast MRI is NOT routinely recommended for the
  shift-work cohort in isolation per NCCN — reserved for patients
  who additionally meet criteria from genetic / family-history /
  Tyrer-Cuzick risk-score criteria. Patient self-breast-examination
  is offered as supplemental.

  Resource access in Ukraine: occupational-medicine consultation
  available at large enterprise health units and private clinics
  (~500-1500 UAH); mammography widely available at imaging centers
  (~800-2000 UAH/study); breast MRI at large regional centers
  (~3000-7000 UAH); CBT-I limited — pharmacotherapy (melatonin,
  trazodone, doxepin low-dose) pharmacy-accessible.

rationale_ua: >
  Стандартний-трек prevention шлях для жінок з документованими ≥10
  роками night-shift / circadian-disrupting rotating shift work без
  поточного діагнозу breast cancer. Три паралельні втручання:

  **(1) Workplace-scheduling counseling.** Найвпливовіший mitigation
  важіль де модифікувано. Практичні рекомендації з European occupational-
  health consensus: (a) обмеження consecutive night shifts ≤3-4, (b)
  ≥48 год recovery перед next set, (c) прихильність forward-rotating
  shift patterns (ранкова → денна → нічна) над backward-rotating, (d)
  уникання permanent night-shift assignment >15-20 кумулятивних років,
  (e) де можливо, перехід на day-shift в later career years.
  Conditional recommendations — IARC 124 evidence не ідентифікує
  specific threshold.

  **(2) Sleep-hygiene counseling.** Стратегії збереження circadian
  rhythm: blackout curtains для daytime sleep, consistent sleep schedule
  on days off, pre-sleep light minimization, daytime exposure to bright
  light, CBT-I referral при severe sleep disturbance. Melatonin
  supplementation evidence-база для cancer-prevention — insufficient
  для рутинної рекомендації per NCCN — counseling може згадати як
  patient-preference-driven.

  **(3) Breast-cancer screening intensification.** NCCN risk-stratified
  mammography framework підтримує consideration earlier baseline (40
  років замість USPSTF 50) та annual cadence (замість biennial) при
  shift-work clusters з іншими breast-cancer ризик-факторами. Adjunct
  breast MRI НЕ рекомендується рутинно для shift-work cohort в
  ізоляції per NCCN — резервується при genetic / family-history /
  Tyrer-Cuzick критеріях.

  Доступ до ресурсів в Україні: occupational-medicine consultation
  (~500-1500 грн); mammography (~800-2000 грн/дослідження); breast
  MRI (~3000-7000 грн); CBT-I — обмежено — pharmacotherapy (мелатонін,
  тразодон, низько-дозовий doxepin) аптечно-доступна.

