expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: avoidance of structured workplace-scheduling
    counseling and modified mammography cadence when patient declines.
    Cancer-incidence outcome: no projected reduction in shift-work-
    attributable breast cancer incidence beyond routine USPSTF
    biennial mammography starting age 50. Earlier-detection benefit
    from accelerated screening is forgone; the IARC Group 2A
    probable-evidence framing means absolute risk reduction was
    modest in the intensified track.

