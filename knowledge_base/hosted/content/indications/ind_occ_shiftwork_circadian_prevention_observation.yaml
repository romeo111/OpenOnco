rationale: >
  Alternative-track companion to IND-OCC-SHIFTWORK-CIRCADIAN-PREVENTION-
  INTENSIFIED-SURVEILLANCE. Woman with documented ≥10 years night-shift
  / circadian-disrupting shift work who declines structured workplace-
  scheduling counseling and/or modified mammography cadence — for any
  reason (career constraints with no day-shift alternative, household
  income dependence on night-shift differential, skepticism toward
  IARC 2A probable-evidence framing, preference for less-interventional
  pathway, anxiety from accelerated mammography false-positive cascade)
  — is offered routine general-population pathway only:

  **Breast-cancer screening:** Apply USPSTF 2024 criteria unmodified
  — biennial mammography from age 40 to 74 (general population).
  Patient is explicitly informed that the IARC Group 2A probable-
  evidence excess breast-cancer risk associated with their occupational
  history is not specifically addressed by this routine track.

  **Workplace-scheduling counseling:** Brief informational disclosure
  of IARC 2A classification + workplace-scheduling literature only;
  no structured counseling visit is scheduled. Patient is offered
  re-discussion at any future visit.

  **Sleep-hygiene counseling:** Still offered — sleep quality matters
  for general health independent of cancer-prevention framing; CBT-I
  referral available on patient request.

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on new breast lump, nipple discharge, breast skin changes,
  unexplained axillary lymphadenopathy.

  Routing reconsiderations: patient may revisit intensified pathway
  at any subsequent visit. Per CHARTER §11 patient-autonomy framing:
  occupational-scheduling and screening-cadence decisions are
  shared-decision-making domains particularly when the underlying
  evidence is IARC Group 2A (probable).

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-SHIFTWORK-
  CIRCADIAN-PREVENTION-INTENSIFIED-SURVEILLANCE. Жінка з документованими
  ≥10 роками night-shift / circadian-disrupting shift work, яка
  відмовляється від структурованого workplace-scheduling counseling
  та/або модифікованої mammography cadence (career constraints,
  household income dependence, скептицизм щодо IARC 2A probable-
  evidence framing), отримує тільки рутинний загальнопопуляційний
  шлях:

  **Breast-cancer скринінг:** USPSTF 2024 без модифікації — biennial
  mammography з 40 до 74 років (general population). Пацієнтка явно
  інформована, що IARC Group 2A probable-evidence надлишковий ризик
  breast cancer, асоційований з її occupational історією, не
  адресується специфічно цим рутинним треком.

  **Workplace-scheduling counseling:** Brief informational disclosure
  IARC 2A класифікації + workplace-scheduling літератури; структурований
  counseling-візит НЕ запланований. Re-discussion на будь-якому
  майбутньому візиті.

  **Sleep-hygiene counseling:** Все ще пропонується — sleep quality
  matters для general health незалежно від cancer-prevention framing;
  CBT-I referral на запит пацієнтки.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при новій breast lump, nipple discharge, breast skin
  changes, unexplained axillary lymphadenopathy.

  Reroute: пацієнтка може повернутися до інтенсифікованого шляху на
  будь-якому подальшому візиті. Per CHARTER §11 — shared-decision-making
  domain особливо при IARC Group 2A (probable) evidence.

