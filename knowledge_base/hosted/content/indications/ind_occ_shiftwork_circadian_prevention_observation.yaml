      "Patients declining intensified surveillance for occupational
      carcinogen cohorts continue to receive symptom-triggered
      evaluation and general-population screening."

do_not_do:
  - "Не презентувати observation як еквівалент modified mammography cadence — earlier-detection benefit forgone, але absolute risk reduction скромний у intensified track."
  - "Не ігнорувати alarm features (breast lump, nipple discharge, skin changes, axillary lymphadenopathy) — immediate діагностичний workup + multidisciplinary review."
  - "Не використовувати цей шлях як стандарт першої лінії — intensified-track залишається preferred для shift-work cohort з clustering ризик-факторів."
  - "Не пропускати sleep-hygiene counseling — sleep quality matters для general health незалежно від cancer-prevention framing."

do_not_do_en:
  - "Do not present observation as equivalent to modified mammography cadence — earlier-detection benefit is forgone, although absolute risk reduction was modest even in the intensified track."
  - "Do not ignore alarm features (breast lump, nipple discharge, skin changes, axillary lymphadenopathy) — immediate diagnostic workup + multidisciplinary review."
  - "Do not use this pathway as a first-line standard — the intensified track remains preferred for the shift-work cohort with clustered risk factors."
  - "Do not skip sleep-hygiene counseling — sleep quality matters for general health regardless of cancer-prevention framing."

