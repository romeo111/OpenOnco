id: IND-OCC-SOOT-PREVENTION-INTENSIFIED-SURVEILLANCE
plan_track: standard
intent: prevention

applicable_to:
  # Primary anchor: cutaneous cancer — DIS-BCC is the closest in-KB
  # cutaneous-cancer proxy for cutaneous SCC at soot-contact sites
  # (Pott's historic scrotal-SCC cohort; DIS-CUTANEOUS-SCC not a
  # separate KB entity). Lung surveillance is addressed in rationale.
  disease_id: DIS-BCC
