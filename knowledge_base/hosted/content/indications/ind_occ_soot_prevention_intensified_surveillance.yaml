rationale: >
  Standard-track prevention pathway for individuals with documented
  prior occupational soot exposure who do not have a current
  soot-associated malignancy diagnosis. Four parallel interventions:

  **(1) Annual dermatology consultation with full-skin exam.**
  Focused attention on soot-contact areas: face, neck, hands,
  forearms, scrotum (the foundational Pott cohort site), posterior
  thighs / buttocks (climbing-boys' historic chronic-soot-contact
  pattern from chimney-flue work). Suspicious lesions (chronic
  hyperkeratotic plaques, non-healing ulcers — "soot warts" in
  historic terminology — induration, asymmetric pigmentation)
  prompt biopsy. Cadence is annual; high-risk patients move to
  q6 months.

  **(2) Risk-adjusted annual LDCT chest screening.** USPSTF 2021
  criteria are the baseline. Soot-exposed cohorts extend
  consideration:
    - First LDCT at ≥10-15 years from first soot exposure for
      current / ex-smokers (smoker × soot synergy supports earlier
      start), ≥15-20 years for never-smokers with ≥10 years
      cumulative soot exposure in high-burden occupations
      (chimney-sweeping, roofing, asphalt-paving).
    - Annual cadence; Lung-RADS reporting.

  **(3) Smoking-cessation counseling.** Highest-impact single
  intervention for residual lung-cancer risk reduction. Soot ×
  tobacco interaction is additive-to-multiplicative across cohort
  studies. Behavioral counseling + pharmacotherapy (varenicline,
  bupropion, NRT) per USPSTF / ATS / AAFP.

  **(4) Patient education: self-skin-checks + sun-protection + PPE.**
  Patient counseled to perform monthly self-skin-checks at
  soot-contact areas (mirror-aided exam of scrotum, posterior arms,
  back; partner-assisted exam of back). Report any new / changing
  lesion. Sun-protection at soot-contact sites addresses
  multiplicative UV × PAH-fraction-of-soot photocarcinogenesis.
  PPE + soot-saturated-clothing-avoidance counseling if active
  exposure persists; shift-end degreasing handwash + change-of-
  clothing (historic Pott observation: London-climbing-boys lived
  + slept in soot-saturated clothes — exposure burden a function
  of contact-time, not just acute dose).

  Resource access in Ukraine: LDCT chest (~1500-3500 UAH);
  dermatology consultation (~400-1000 UAH); biopsy + histopathology
  (~1000-3000 UAH). Smoking-cessation pharmacotherapy pharmacy-
  accessible without НСЗУ.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з документованим
  попереднім професійним впливом сажі без поточного діагнозу
  soot-асоційованої малігнізації. Чотири паралельні втручання:

  **(1) Щорічна дерматологічна консультація з повним оглядом
  шкіри.** Фокусована увага на soot-contact ділянках: обличчя,
  шия, руки, передпліччя, мошонка (foundational Pott cohort site),
  posterior thighs / buttocks (climbing-boys' історичний
  chronic-soot-contact pattern). Підозрілі ураження (хронічні
  hyperkeratotic plaques, неcicатризуючі виразки — "soot warts"
  в історичній термінології — ущільнення, asymmetric pigmentation)
  потребують біопсії. Частота — щорічна.

  **(2) Risk-adjusted щорічна LDCT грудної клітки.** USPSTF 2021
  критерії — baseline. Для soot-експонованих перша LDCT при
  ≥10-15 років від першого soot-впливу для поточних / ex-курців,
  ≥15-20 років для некурців з ≥10 років кумулятивного soot-впливу
  у high-burden професіях (сажотрусництво, roofing, asphalt-paving).
  Щорічна частота; Lung-RADS звітність.

  **(3) Counseling щодо припинення куріння.** Найвпливовіше одиничне
  втручання для зниження залишкового ризику раку легень. Soot ×
  тютюн взаємодія — адитивно-мультиплікативна.

  **(4) Patient education: self-skin-checks + sun-protection + PPE.**
  Пацієнт інструктований виконувати щомісячні self-skin-checks на
  soot-contact ділянках (mirror-aided огляд мошонки, posterior arms,
  спини; partner-assisted огляд спини). Sun-protection адресує
  UV × PAH-fraction-of-soot photocarcinogenesis. PPE + уникнення
  soot-saturated одягу при активному впливі; shift-end degreasing
  handwash + change-of-clothing (історичне спостереження Pott —
  London-climbing-boys жили + спали у soot-saturated одязі —
  exposure burden залежить від contact-time, а не лише acute dose).

  Доступ до ресурсів в Україні: LDCT грудної клітки
  (~1500-3500 грн); дерматологічна консультація (~400-1000 грн);
  біопсія + гістопатологія (~1000-3000 грн). Pharmacotherapy
  припинення куріння аптечно-доступна без НСЗУ.

