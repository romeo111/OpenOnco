sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Occupational soot-exposure cohorts at elevated multi-organ
      cancer risk warrant structured multi-modality surveillance
      (annual dermatology + LDCT) per NCCN occupational-exposure
      extension; the Pott 1775 scrotal-cancer observation in
      chimney-sweeps is the foundational occupational-carcinogenesis
      precedent in medicine."
  - source_id: SRC-NCCN-SKIN-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Annual professional skin examination is recommended for
      individuals at elevated cutaneous-cancer risk by prior NMSC,
      heavy sun exposure, immunosuppression, or (per Clinical
      Practice Guidelines extension) occupational soot or polycyclic
      aromatic hydrocarbon exposure; self-skin-checks between
      visits are recommended with focused attention to scrotum and
      occluded body sites historically associated with chimney-sweep
      scrotal-cancer cohort."

do_not_do:
  - "Не пропускати огляд occluded soot-contact ділянок (мошонка, posterior thighs) — Pott 1775 scrotal-cancer cohort залишається foundational anchor — chronic-soot-contact pattern, не acute, drives carcinogenesis."
  - "Не презентувати soot-modified LDCT як RCT-validated screening — extension опирається на cohort + mechanistic-rationale (Hansen 1989; Partanen 1994), не на RCT-дані."
  - "Не ігнорувати UV × soot синергію — PAH-fraction-of-soot photocarcinogenesis мультиплікує UV-driven cutaneous SCC у sun-exposed soot-contact ділянках."
  - "Не пропускати counseling щодо припинення куріння — soot × тютюн взаємодія залишається клінічно суттєвою."

do_not_do_en:
  - "Do not skip examination of occluded soot-contact sites (scrotum, posterior thighs) — Pott's 1775 scrotal-cancer cohort remains the foundational anchor; chronic-soot-contact pattern, not acute, drives carcinogenesis."
  - "Do not present soot-modified LDCT as RCT-validated screening — the extension rests on cohort + mechanistic rationale (Hansen 1989; Partanen 1994), not RCT data."
  - "Do not ignore UV × soot synergy — PAH-fraction-of-soot photocarcinogenesis multiplies UV-driven cutaneous SCC at sun-exposed soot-contact sites."
  - "Do not skip smoking-cessation counseling — the soot × tobacco interaction remains clinically substantive."

