nccn_category: "2A"

expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: detection of incident soot-attributable
    malignancy (cutaneous SCC, lung) at earliest treatable stage via
    multi-modality surveillance. Cutaneous SCC: Pott 1775 chimney-
    sweep scrotal-SCC cohort is the foundational evidence base;
    modern roofing / asphalt cohorts retain elevated SIR. Lung
    cancer: Hansen 1989 Danish chimney-sweep cohort SMR ~1.9x;
    Partanen 1994 asphalt-worker meta-analysis RR ~1.2-1.5x. NLST
    + NELSON LDCT data extend to soot-exposed cohorts via mechanistic
    + cohort inference. Smoking-cessation has largest single-
    intervention impact on lung component.

