expected_outcomes:
  overall_response_rate: >-
    Primary endpoint: avoidance of multi-modality intensified
    surveillance (annual dermatology + LDCT) when patient declines
    structured pathway. No reduction in soot-attributable cutaneous /
    lung-cancer incidence beyond what routine general-population
    care provides. Self-skin-check counseling, sun-protection, and
    smoking-cessation counseling remain appropriate regardless of
    surveillance-track choice.

