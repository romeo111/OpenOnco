sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients declining proactive surveillance for occupational
      carcinogen cohorts continue to receive symptom-triggered
      evaluation and standard-of-care general-population care."
  - source_id: SRC-NCCN-SKIN-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patients who decline annual professional skin examination
      receive ongoing patient-driven self-skin-checks; symptom-
      triggered dermatology evaluation remains the operational
      standard for new / changing lesions on occupational chemical-
      contact body sites."

do_not_do:
  - "Не презентувати observation як еквівалент multi-modality surveillance — soot-attributable excess ризик не адресується."
  - "Не ігнорувати alarm features (диспное, кровохаркання, non-healing ulcer, hyperkeratotic plaque на scrotum / posterior thighs / hands) — immediate evaluation; Pott-cohort scrotal-SCC залишається конкретним warning sign."
  - "Не використовувати цей шлях як стандарт першої лінії — intensified-surveillance трек залишається preferred для soot-exposed cohort."
  - "Не пропускати counseling щодо припинення куріння та sun-protection — рекомендації актуальні незалежно від surveillance-track вибору."

do_not_do_en:
  - "Do not present observation as equivalent to multi-modality surveillance — soot-attributable excess risk is unaddressed."
  - "Do not ignore alarm features (dyspnea, hemoptysis, non-healing ulcer, hyperkeratotic plaque on scrotum / posterior thighs / hands) — immediate evaluation; the Pott-cohort scrotal-SCC remains a concrete warning sign."
  - "Do not use this pathway as a first-line standard — the intensified-surveillance track remains the preferred recommendation for the soot-exposed cohort."
  - "Do not skip smoking-cessation counseling and sun-protection — these recommendations are relevant regardless of surveillance-track choice."

