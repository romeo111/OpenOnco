rationale: >
  Alternative-track companion to IND-OCC-SOOT-PREVENTION-INTENSIFIED-
  SURVEILLANCE. Patient with documented prior occupational soot
  exposure who declines multi-modality intensified surveillance —
  for any reason (cost across multiple surveillance modalities,
  anxiety from layered surveillance burden, preference for less-
  interventional pathway, geographic access constraints to
  dermatology + LDCT centers, life expectancy / competing illness)
  — is offered routine general-population screening only:

  **Lung-cancer screening:** Apply USPSTF 2021 criteria unmodified.
  If patient meets criteria they receive annual LDCT at the routine
  cadence; if not, no imaging screening is offered. Patient is
  explicitly informed that soot-attributable excess risk is
  unaddressed.

  **Skin-cancer screening:** No proactive annual professional
  dermatology cadence. Patient is counseled to perform monthly
  self-skin-checks at soot-contact areas (mirror-aided exam of
  scrotum, posterior arms, back; partner-assisted exam of back) and
  to report any new / changing lesion promptly. Patient is
  explicitly informed that Pott-cohort-foundational scrotal-cancer
  risk is unaddressed by proactive surveillance.

  **Smoking cessation:** Still offered — soot × tobacco interaction
  remains clinically substantive and cessation is the largest
  single mortality lever regardless of surveillance-track choice.

  **Sun protection + PPE counseling:** Same as standard track —
  UV × PAH-fraction-of-soot synergy is independent of professional
  surveillance choice; PPE + shift-end hygiene if active exposure
  persists.

  **Symptom-triggered evaluation:** Low threshold for diagnostic
  workup on new / persistent chest symptoms (dyspnea, hemoptysis,
  weight loss, chronic cough) or new / changing skin lesions
  (especially at scrotum, posterior thighs, hands, face).
  Unhealing wound or hyperkeratotic plaque ≥4 weeks duration on
  soot-contact site warrants dermatology consultation.

  Routing reconsiderations: patient may revisit intensified-
  surveillance pathway at any subsequent visit, in whole or in part
  (e.g., agree to dermatology alone). Per CHARTER §11 patient-
  autonomy framing: multi-modality surveillance is a shared-
  decision-making domain.

rationale_ua: >
  Альтернативно-трекова Indication — компаньйон до IND-OCC-SOOT-
  PREVENTION-INTENSIFIED-SURVEILLANCE. Пацієнт з документованим
  попереднім професійним впливом сажі, який відмовляється від
  multi-modality intensified surveillance (вартість через декілька
  surveillance modalities, тривога від layered surveillance burden,
  перевага менш-інтервенційного шляху, географічні обмеження),
  отримує тільки рутинний загальнопопуляційний скринінг:

  **Скринінг раку легень:** Застосовувати USPSTF 2021 без
  модифікації. Пацієнт явно інформований, що soot-attributable
  excess ризик не адресується.

  **Скринінг раку шкіри:** Без проактивної щорічної професійної
  дерматологічної частоти. Пацієнт інструктований виконувати
  щомісячні self-skin-checks та повідомляти про нові / змінювальні
  ураження негайно. Пацієнт явно інформований, що
  Pott-cohort-foundational scrotal-cancer ризик не адресується
  проактивним спостереженням.

  **Припинення куріння:** Все ще пропонується — soot × тютюн
  взаємодія залишається клінічно суттєвою.

  **Sun-protection + PPE-counseling:** Те ж, що у стандартному
  треку — UV × PAH-fraction-of-soot синергія незалежна від
  surveillance-track вибору.

  **Symptom-triggered оцінка:** Низький поріг для діагностичного
  workup при нових / persistent симптомах з боку грудної клітки
  або нових / змінювальних ураженнях шкіри (особливо мошонка,
  posterior thighs, руки, обличчя). Unhealing wound або
  hyperkeratotic plaque ≥4 тижнів на soot-contact ділянці —
  потребує дерматологічної консультації.

  Reroute: пацієнт може повернутися до інтенсифікованого
  спостереження на будь-якому подальшому візиті, в цілому або
  частково. Per CHARTER §11 — shared-decision-making domain.

