sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context
    relevant_quote_paraphrase: >-
      "Occupational dust-exposure cohorts at elevated rare-histology
      cancer risk warrant structured symptom-review surveillance and
      low-threshold imaging on persistent unilateral findings."
  - source_id: SRC-NCCN-HNSCC-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Patients with documented occupational hardwood / leather-dust
      exposure carry markedly elevated sinonasal adenocarcinoma risk;
      symptom-triggered ENT evaluation with low-threshold imaging is
      the operational surveillance standard."

do_not_do:
  - "Не призначати CT синусів рутинно безсимптомним пацієнтам — резервується для стійких однобічних симптомів."
  - "Не ігнорувати однобічні симптоми як 'просто синусит' — однобічність є тривожною ознакою синоназальної патології."
  - "Не пропускати консультування щодо припинення впливу / ЗІЗ — багато експонованих осіб залишаються чинними працівниками."
  - "Не відкладати направлення до ЛОР-онколога при виявленні утворення / кісткової ерозії на CT — необхідна термінова біопсія."

do_not_do_en:
  - "Do not order CT sinus routinely in asymptomatic patients — reserve for persistent unilateral symptoms."
  - "Do not dismiss unilateral symptoms as 'just sinusitis' — unilaterality is an alarm feature for sinonasal pathology."
  - "Do not skip exposure-cessation / PPE counseling — many exposed individuals remain active workers."
  - "Do not delay ENT-oncology referral for findings of mass / bony erosion on CT — prompt biopsy is required."

