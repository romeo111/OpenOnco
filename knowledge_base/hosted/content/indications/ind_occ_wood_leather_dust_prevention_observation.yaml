    position: context
    relevant_quote_paraphrase: >-
      "Patients declining structured surveillance for occupational
      rare-histology cancer risk continue to receive symptom-triggered
      evaluation and standard-of-care general-population follow-up."
  - source_id: SRC-NCCN-HNSCC-2025
    position: context
    relevant_quote_paraphrase: >-
      "Patient autonomy is integral to occupational-exposure surveillance
      enrollment; declining annual ENT consultation does not preclude
      symptom-triggered evaluation."

do_not_do:
  - "Не подавати цей трек спостереження як еквівалент структурованого нагляду — ризик синоназальної аденокарциноми, пов'язаний із впливом пилу, залишається неохопленим."
  - "Не ігнорувати тривожні ознаки (однобічна обструкція, епістаксис, аносмія, стійкий лицевий біль) — потрібне негайне направлення до ЛОР-лікаря."
  - "Не використовувати цей шлях як стандарт першої лінії — трек інтенсифікованого спостереження залишається пріоритетним."
  - "Не пропускати консультування щодо припинення впливу / ЗІЗ, якщо активний вплив зберігається."

do_not_do_en:
  - "Do not present observation as equivalent to structured surveillance — dust-attributable sinonasal-adenocarcinoma risk is unaddressed."
  - "Do not ignore alarm features (unilateral obstruction, epistaxis, anosmia, persistent facial pain) — immediate ENT referral."
  - "Do not use this pathway as a first-line standard — the intensified-surveillance track remains the preferred recommendation."
  - "Do not skip exposure-cessation / PPE counseling if active exposure persists."

