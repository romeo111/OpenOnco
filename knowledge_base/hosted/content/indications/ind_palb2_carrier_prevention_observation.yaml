nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Mammography-only annual surveillance from age 30 + symptom-driven
    workup. Higher residual risk than the MRI-included standard
    pathway; acceptable when MRI is inaccessible or declined.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (less intensive surveillance) alternative for PALB2
  carriers who decline MRI or where MRI is inaccessible.

  Components:
    - **Breast surveillance:** annual mammography from age 30; no
      routine MRI.
    - **Pancreatic surveillance:** retained for FDR-of-PDAC carriers.
    - **Ovarian surveillance:** symptom-driven; combined hormonal
      contraception discussion.
    - **RRM discussion deferred** — surveillance-only pathway.
    - **Cascade testing retained.**
    - **Re-offer MRI surveillance annually.**

rationale_ua: >
  Aggressive-трек (less intensive surveillance) альтернатива для PALB2
  carriers які declining MRI або де MRI inaccessible.

  Компоненти:
    - **Breast surveillance:** annual mammography з 30 років; без routine MRI.
    - **Pancreatic surveillance:** retained для FDR-of-PDAC carriers.
    - **Ovarian surveillance:** symptom-driven.
    - **RRM discussion deferred.**
    - **Cascade testing retained.**
    - **Re-offer MRI surveillance щорічно.**

