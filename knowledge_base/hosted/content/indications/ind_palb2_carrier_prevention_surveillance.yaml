rationale: >
  Standard-track prevention pathway for PALB2 heterozygous carriers per
  NCCN Genetic/Familial High-Risk Assessment Breast/Ovarian + Pancreatic
  2025. PALB2 approaches BRCA2 breast-cancer penetrance and warrants
  BRCA-style management.

  Components:
    - **Breast surveillance:**
      - Annual breast MRI from age 30; annual mammography from age 30
        (alternating MRI + mammography q6mo is acceptable, or
        concurrent annual).
      - Clinical breast examination semi-annually from age 25.
      - Consider risk-reducing mastectomy (RRM) — shared decision-
        making; RRM provides BRCA-style ~95% risk reduction.
    - **Pancreatic surveillance (CAPS Consortium 2022 / NCCN 2025):**
      - Indicated for PALB2 carriers with FDR or SDR of PDAC.
      - Method: alternating EUS + abdominal MRI/MRCP every 12 months
        from age 50 OR 10 years before earliest PDAC in family
        (whichever earlier).
      - Some centers extend pancreatic surveillance to all PALB2
        carriers given baseline lifetime PDAC ~2-3% (still moderately
        elevated vs general population ~1.3%) — controversial.
      - High-volume pancreatic surveillance center preferred.
    - **Ovarian surveillance:**
      - PALB2 ovarian lifetime risk ~5% (modest above population
        ~1.3%). RRSO not routinely recommended on basis of PALB2
        alone (BRCA1/2 thresholds remain anchor).
      - Symptom-driven workup; combined hormonal contraception
        consideration (modest reduction in ovarian cancer risk).
    - **Cascade testing:** FDRs + interested SDRs offered testing.
    - **Reproductive counseling:** PGT-M available.
    - **Chemoprevention discussion:** tamoxifen or raloxifene for
      breast risk reduction — modest effect (estrogen-receptor-positive
      cancers); shared decision-making.
    - **Lifestyle:** standard cancer-prevention.

  In Ukraine, multi-gene panel testing via Institute of Genetics + select
  private labs; PALB2 included in standard hereditary cancer panels.
  Breast MRI at major academic centers. RRM available at oncology
  surgical departments with multidisciplinary discussion.

