expected_outcomes:
  overall_response_rate: >-
    BRCA-style annual mammography + MRI from age 30 shifts breast cancer
    stage at diagnosis to early-stage; 5y OS >95% for early-stage. Risk-
    reducing mastectomy reduces breast cancer incidence ~95% (per BRCA-
    style RRM data extrapolated to PALB2 high-penetrance cohort).
    Pancreatic surveillance in PALB2-FDR-PDAC cohorts shifts to early-
    stage in ~30-60% of detected lesions per CAPS Consortium.

