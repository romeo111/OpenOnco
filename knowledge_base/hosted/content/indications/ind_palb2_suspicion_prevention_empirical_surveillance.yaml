rationale: >
  Aggressive-track companion to IND-PALB2-SUSPICION-PREVENTION-
  TESTING. Patient with pedigree suspicion of germline PALB2 carrier
  state who declines genetic counseling and/or panel testing — for
  any reason (cost, insurance / GINA concerns, psychological /
  cancer-anxiety considerations, family privacy, geographic access
  constraints, religious or cultural objections to genetic testing)
  — is offered empirical enhanced surveillance based on family
  history alone (best-available proxy in the absence of genetic
  confirmation):

  **Breast (women):**
  - Annual mammography starting at age (earliest first-degree
    family breast cancer age) minus 10 years, but no earlier than
    age 30.
  - Annual breast MRI consideration if Tyrer-Cuzick lifetime risk
    ≥20% — PALB2-suspicion pedigrees with multiple early-onset
    breast cancers typically meet this threshold based on family
    history alone, qualifying for insurance-covered MRI in some
    jurisdictions.
  - Clinical breast exam q6-12 months by clinician familiar with
    high-risk surveillance.
  - Patient-performed monthly breast self-exam encouraged.

  **Pancreatic:** PALB2-suspicion families with ≥2 first/second-
  degree relatives with PDAC qualify for CAPS Consortium 2022 high-
  risk surveillance based on family history alone, regardless of
  genetic-testing status (alternating EUS + MRI/MRCP annually from
  age 50 or 10 years before earliest family PDAC). Single-PDAC
  families do NOT qualify empirically — yield is low without
  confirmed carrier status. Refer to high-volume pancreatic
  surveillance center.

  **Ovarian:** Empirical surveillance NOT recommended — PALB2
  ovarian penetrance is too low (~5%) to justify surveillance
  burden even in confirmed carriers; family-history-alone
  surveillance is not justified.

  **Risk-reducing surgery:** NOT offered empirically without
  genetic confirmation. Risk-reducing mastectomy is a major
  irreversible intervention that requires demonstrated carrier
  status to justify the harm/benefit ratio. Patients re-considering
  testing later in life is appropriate and supported.

  **Reproductive counseling:** PGT-M for monogenic disorders
  cannot be offered without an identified familial variant —
  patients planning children should be re-offered genetic testing
  in the reproductive-planning context.

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. Patients who decline testing
  retain access to surveillance benefit, with the explicit caveat
  that empirical surveillance lacks the diagnostic precision of
  confirmed genetic status. Periodic re-discussion of testing is
  appropriate; this pathway does not preclude future testing.

  **Resource-intensity caveat:** Annual breast MRI is expensive
  (~3000-8000 UAH per scan in Ukrainian private centers).
  Pancreatic surveillance via EUS/MRI is available only at
  academic hepatobiliary centers. Empirical lifetime imaging
  surveillance without genetic confirmation may not be a
  sustainable resource allocation; testing-first is the cost-
  effective default at population scale.

rationale_ua: >
  Aggressive-track компаньйон до IND-PALB2-SUSPICION-PREVENTION-
  TESTING. Пацієнт з родовідною підозрою на PALB2 carrier state,
  який відмовляється від генетичного консультування та/або
  панельного тестування, отримує empіричне посилене спостереження
  на основі сімейної історії:

  **Молочна залоза (жінки):**
  - Mammography щорічно з віку (earliest first-degree family breast
    cancer age) мінус 10 років, не раніше 30.
  - Annual breast MRI consideration, якщо Tyrer-Cuzick lifetime
    ризик ≥20%.
  - Clinical breast exam q6-12 міс.
  - Monthly self-exam.

  **Підшлункова:** PALB2-suspicion родини з ≥2 first/second-degree
  PDAC родичами кваліфікуються на CAPS Consortium 2022 high-risk
  surveillance за сімейною історією. Single-PDAC родини НЕ
  кваліфікуються emпірично.

  **Яєчник:** Empіричний скринінг НЕ рекомендований — PALB2
  ovarian penetrance ~5% занадто низька.

  **Risk-reducing хірургія:** НЕ пропонується emпірично без
  genetic confirmation.

  **Reproductive counseling:** PGT-M не може бути запропонована
  без identified familial variant.

  Per CHARTER §11 framing автономії пацієнта.

