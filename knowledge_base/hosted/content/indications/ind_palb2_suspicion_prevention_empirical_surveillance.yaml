expected_outcomes:
  overall_response_rate: >-
    Empirical enhanced surveillance based on family history alone
    (annual mammography from earliest-family-breast-cancer-age minus
    10 years, but no earlier than 30; annual breast MRI if Tyrer-
    Cuzick ≥20% lifetime; clinical breast exam q6 months) is
    expected to capture breast cancer at earliest detectable stage
    in the subset who are actual PALB2 carriers (~10-25% of
    pedigree-suspicion individuals). Does NOT carry the diagnostic
    certainty of germline testing — carriers receive surveillance
    appropriate to their risk tier, but the family misses cascade-
    testing opportunity (~50% of FDRs are carriers) and reproductive
    PGT-M counseling. For PALB2-suspicion families with ≥2 first/
    second-degree PDAC relatives, referral to pancreatic-cancer
    high-risk surveillance program (CAPS Consortium 2022) is
    appropriate regardless of genetic-testing status.

