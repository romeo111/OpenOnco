rationale: >
  Standard-track prevention pathway for individuals with pedigree-
  based suspicion of germline PALB2 carrier state. Two parallel
  referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant for the cancer-predisposing
  carrier state; autosomal recessive for biallelic Fanconi anemia
  complementation group N phenotype — critical distinction),
  penetrance (lifetime breast cancer ~33-58% per Yang et al. JCO
  2020 — comparable to BRCA2; pancreatic ~5-15% in PALB2-FDR-of-
  PDAC subset; ovarian modest ~5% lifetime — does not routinely
  justify RRSO), implications for FDRs (cascade testing if positive
  — ~50% of FDRs are also carriers), GINA / insurance considerations,
  reproductive implications (carrier-by-carrier couples have 25%
  Fanconi-N risk per pregnancy — PGT-M available), psychological
  aspects (cancer-anxiety burden similar to BRCA given comparable
  penetrance). Per ACMG / ASCO / NCCN, pre-test counseling by a
  certified genetic counselor or trained clinician is the standard
  of care before germline testing.

  **(2) Germline multi-gene HBOC/PDAC-inclusive panel testing.**
  Modern panels (e.g., Invitae Common Hereditary Cancers panel,
  Color hereditary cancer panel, GeneDx OncoGene Comprehensive,
  Myriad MyRisk, Ambry CancerNext) cover BRCA1, BRCA2, PALB2,
  CHEK2, ATM, RAD51C, RAD51D, BRIP1, plus contextual genes (TP53,
  PTEN, STK11, CDH1, NF1). PALB2 is on every HBOC panel.
  Variant classification per ACMG framework.

  **Sequel pathway (positive panel — confirmed PALB2 carrier):**
  Transition to PALB2-carrier surveillance pathway
  (IND-PALB2-CARRIER-PREVENTION-SURVEILLANCE — standard track for
  RF-PALB2-CONFIRMED-CARRIER) — BRCA-style management given near-
  BRCA2 penetrance:
  - Annual breast MRI from age 30 alternating q6 months with
    mammography from age 30 (overall imaging every 6 months).
  - Clinical breast exam q6-12mo from age 25-30.
  - Pancreatic surveillance — alternating EUS + abdominal MRI/MRCP
    annually from age 50 OR 10 years before earliest family PDAC,
    for carriers with FDR or SDR of PDAC (CAPS Consortium 2022 /
    NCCN 2025).
  - Ovarian surveillance — generally NOT indicated (penetrance
    too low to justify routine RRSO); symptom-driven workup.
  - Cascade testing of FDRs for the family-specific PALB2 variant.
  - Reproductive counseling: PGT-M available for couples planning
    children.

  **Sequel pathway (positive panel — non-PALB2 variant identified):**
  route to gene-specific carrier pathway (BRCA1/2, ATM, CHEK2,
  RAD51C/D, BRIP1, etc.).

  **Sequel pathway (negative panel for PALB2 and all panel genes):**
  empirical enhanced surveillance based on family history alone is
  offered as the aggressive-track alternative
  (IND-PALB2-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE) —
  quantitative risk model (Tyrer-Cuzick) may indicate residual
  elevated risk warranting enhanced surveillance.

  **Sequel pathway (VUS):** managed as pedigree-suspicion until
  segregation analysis or functional studies reclassify.

  In Ukraine, multi-gene panel testing is available via Institute of
  Genetics + select private labs (~8000-20000 UAH for comprehensive
  HBOC/PDAC panel).

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з родовідною підозрою
  на гермінативний heterozygous carrier PALB2. Два паралельні
  направлення:

  **(1) Направлення на генетичне консультування.** Pre-test
  консультування охоплює: спадкування (autosomal dominant для
  cancer-predisposing carrier; autosomal recessive для biallelic
  Fanconi anemia complementation group N), пенетрантність (lifetime
  breast cancer ~33-58% per Yang et al. JCO 2020 — comparable з
  BRCA2; pancreatic ~5-15% у PALB2-FDR-of-PDAC subset; ovarian
  modest ~5% lifetime — не виправдовує routine RRSO), наслідки
  для FDRs (cascade testing — ~50% FDRs носії), GINA / страхові
  міркування, репродуктивні наслідки (PGT-M доступна).

  **(2) Germline мультигенне HBOC/PDAC-inclusive панельне
  тестування.** Сучасні панелі покривають BRCA1, BRCA2, PALB2,
  CHEK2, ATM, RAD51C, RAD51D, BRIP1. PALB2 — на every HBOC панелі.

  **Наступний шлях (позитивна панель — підтверджений PALB2 carrier):**
  перехід на PALB2-carrier surveillance шлях
  (IND-PALB2-CARRIER-PREVENTION-SURVEILLANCE) — BRCA-style management:
  - Annual breast MRI з 30 років чергуючи q6 міс з mammography
    з 30 років.
  - Clinical breast exam q6-12 міс з 25-30 років.
  - Pancreatic surveillance — alternating EUS + MRI/MRCP щорічно з
    50 років або 10 років до earliest family PDAC для FDR-of-PDAC
    carriers.
  - Ovarian surveillance — generally НЕ indicated; symptom-driven
    workup.
  - Cascade testing FDRs.

  **Наступний шлях (позитивна панель — non-PALB2 variant):**
  маршрутизація на gene-specific carrier шлях.

  **Наступний шлях (негативна панель):** empіричне посилене
  спостереження як aggressive-track альтернатива
  (IND-PALB2-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE).

  В Україні multi-gene panel testing via Institute of Genetics +
  select private labs (~8000-20000 UAH).

