do_not_do:
  - "Не призначати germline тестування без pre-test консультування."
  - "Не трактувати VUS результат як патогенний."
  - "Не пропускати pancreatic surveillance у PALB2 carrier з PDAC сімейною історією — penetrance виправдовує CAPS-протокол."
  - "Не рекомендувати rotation RRSO у PALB2 carriers без значно більшого ovarian-family-history signal — penetrance ~5% не виправдовує routine RRSO."
  - "Не пропускати reproductive PGT-M consultation для carrier-by-carrier пар планують дітей."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling."
  - "Do not treat a VUS result as pathogenic."
  - "Do not skip pancreatic surveillance in a PALB2 carrier with PDAC family history — penetrance justifies CAPS-protocol surveillance."
  - "Do not recommend routine RRSO in PALB2 carriers without significantly elevated ovarian family-history signal — ~5% penetrance does not justify routine RRSO."
  - "Do not skip reproductive PGT-M consultation for carrier-by-carrier couples planning children."

