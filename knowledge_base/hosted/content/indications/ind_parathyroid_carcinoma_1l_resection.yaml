rationale: >
  Diagnosis of parathyroid carcinoma requires histologic evidence of
  invasion (capsular, vascular, soft-tissue, lymph node, or distant
  metastasis) — atypical histology alone is not sufficient (WHO
  Endocrine and Neuroendocrine Tumours, 5th ed., 2022). Because this
  distinction is frequently made only on final pathology, any
  parathyroid mass with clinical features raising suspicion for
  carcinoma should be approached at index surgery with en-bloc
  resection of the parathyroid tumor together with the ipsilateral
  thyroid lobe and central-compartment lymph nodes, without violating
  the tumor capsule. R0 resection is the strongest prognostic factor
  for disease-free and overall survival; enucleation or piecemeal
  removal markedly increases local recurrence risk and should not be
  performed. Germline CDC73/HRPT2 testing is recommended at diagnosis
  for any parathyroid carcinoma to identify Hyperparathyroidism-Jaw
  Tumor (HPT-JT) syndrome and trigger family-cascade testing (see
  BMA-CDC73-GERMLINE-HPT-JT).

sources:
