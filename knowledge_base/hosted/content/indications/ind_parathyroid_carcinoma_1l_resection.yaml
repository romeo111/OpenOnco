id: IND-PARATHYROID-CARCINOMA-1L-RESECTION
plan_track: local_therapy

applicable_to:
  disease_id: DIS-PARATHYROID-CARCINOMA
  line_of_therapy: 1
  stage_requirements:
    - "Localized disease at presentation, including any parathyroid mass with clinical/biochemical/intraoperative features raising suspicion for carcinoma (markedly elevated PTH/calcium, palpable/fixed/invasive mass, recurrent laryngeal nerve involvement) — carcinoma diagnosis itself requires histologic evidence of invasion (capsular/vascular/soft-tissue/lymph node/metastasis) per WHO 2022, which is often confirmed only on final pathology"
    - "Multidisciplinary endocrine-surgery review; index surgery is the single highest-leverage intervention for this disease"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

