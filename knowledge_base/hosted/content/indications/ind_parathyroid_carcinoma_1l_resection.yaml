do_not_do:
  - "Do not enucleate or shell out a parathyroid tumor suspicious for carcinoma — capsule violation markedly increases local recurrence risk."
  - "Do not treat atypical parathyroid adenoma histology alone as sufficient for a carcinoma diagnosis — invasion (capsular/vascular/soft-tissue/lymph node/metastasis) is required."
  - "Do not omit germline CDC73/HRPT2 testing at diagnosis — it identifies HPT-JT syndrome and triggers family-cascade screening."

do_not_do_en:
  - "Do not enucleate or shell out a parathyroid tumor suspicious for carcinoma — capsule violation markedly increases local recurrence risk."
  - "Do not treat atypical parathyroid adenoma histology alone as sufficient for a carcinoma diagnosis — invasion (capsular/vascular/soft-tissue/lymph node/metastasis) is required."
  - "Do not omit germline CDC73/HRPT2 testing at diagnosis — it identifies HPT-JT syndrome and triggers family-cascade screening."

