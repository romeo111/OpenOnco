notes: >
  STUB — coverage-enabling local-therapy indication for
  DIS-PARATHYROID-CARCINOMA. Requires endocrine-surgery / endocrine-
  oncology co-lead signoff before clinical publication (CHARTER §6.1 —
  dev-mode-exempted, safe to merge as draft content). No systemic or
  adjuvant drug regimen is indicated for localized, completely resected
  disease — surgery alone is standard of care; `recommended_regimen` is
  intentionally left unset (surgery-only local_therapy track, mirroring
  IND-MENINGIOMA-1L-RESECTION-RT). This Indication deliberately does
  NOT use the `phases:` / `surgery_id` mechanism (as
  IND-MENINGIOMA-1L-RESECTION-RT does via SUR-MENINGIOMA-RESECTION)
  because no Surgery entity for the en-bloc parathyroidectomy procedure
  has been authored yet — a follow-up authoring pass should add a
  Surgery/Procedure entity (proposed id
  SUR-PARATHYROID-EN-BLOC-RESECTION under
  knowledge_base/hosted/content/procedures/) and wire it via `phases`
  for full parity with the Meningioma pattern. The full procedure (en-
  bloc resection of the parathyroid tumor + ipsilateral thyroid lobe +
  central lymph nodes, no capsule violation) is described here in prose
  (rationale / do_not_do) in the interim.
