rationale: 'IELSG32 trial довів MATRix induction (R-MTX-Cyt-Thiotepa) > R-MTX-Cyt > R-MTX alone для fit ≤70 пацієнтів з CR ~50% (vs 23% для MTX-only). Followed by autoSCT consolidation (BCNU + thiotepa або carmustine + thiotepa). Уникає WBRT toxicity (severe neurocognitive decline особливо у >60).

  '
rationale_ua: >
  Дослідження IELSG32 показало перевагу індукції MATRix (R-MTX-Cyt-Thiotepa) над
  R-MTX-Cyt та монотерапією R-MTX для придатних до трансплантації пацієнтів ≤70
  років — частота повної відповіді (CR) ~50% (проти 23% при застосуванні лише
  MTX). Далі — консолідація аутоТГСК (BCNU + thiotepa або carmustine + thiotepa).
  Дозволяє уникнути токсичності WBRT (тяжке нейрокогнітивне зниження, особливо
  у пацієнтів віком >60 років).
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_08
draft_revision: 3
sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: supports
    relevant_quote_paraphrase: MATRix induction + autoSCT consolidation is preferred 1L for fit PCNSL ≤70
  - source_id: SRC-NCCN-CNS-2025
    position: supports
    relevant_quote_paraphrase: NCCN CNS 2025 endorses HD-MTX-based induction (R-MPV or MATRix) followed by consolidation (autoSCT/thiotepa-based or WBRT) as PCNSL 1L standard
known_controversies:
  - topic: WBRT vs autoSCT consolidation
    positions:
      - position: autoSCT preferred — fewer late neurocognitive effects
        sources:
          - SRC-NCCN-BCELL-2025
      - position: WBRT acceptable якщо autoSCT not feasible
        sources:
          - SRC-NCCN-BCELL-2025
    our_default: autoSCT для fit ≤70; WBRT тільки якщо autoSCT contraindicated
do_not_do:
  - Не призначати стероїди ПЕРЕД діагностичною біопсією — вони можуть змінити морфологію лімфоми (ризик хибнонегативного результату).
  - Не починати HD-MTX без CrCl >50, нормальної гідратації, рятувальної терапії лейковорином, pH сечі >7 — ризик фатального гострого ушкодження нирок.
  - Не пропускати консультацію офтальмолога — очне ураження (~20%) може перебігати безсимптомно.
  - Не призначати інтратекальну хіміотерапію рутинно — ураження ЦСР трапляється рідко (~15%); інтратекальну терапію призначати лише за позитивної цитології ЦСР/проточної цитометрії.
  - Не вводити вінкристин (якщо він входить до будь-якої додаткової схеми) інтратекально — фатально.
do_not_do_en:
  - "Do not give steroids BEFORE diagnostic biopsy — they may destroy lymphoma morphology (false negative)."
  - "Do not start HD-MTX without CrCl >50, normal hydration, leucovorin rescue, urine pH >7 — fatal AKI risk."
  - "Do not skip ophthalmology consult — ocular involvement ~20% may be silent."
  - "Do not give IT chemo routinely — CSF involvement is rare (~15%); IT only if CSF cytology+/positive flow."
  - "Do not administer vincristine (if in any supplementary regimen) intrathecally — fatal."
time_critical: false
last_reviewed: '2026-04-27'
reviewer_signoffs: 0
notes: 'STUB. Тіотепа в Україні може бути обмежена — fall back на R-MPV. HD-MTX потребує hospital admission з мониторингом MTX levels кожні 24h.

  '
