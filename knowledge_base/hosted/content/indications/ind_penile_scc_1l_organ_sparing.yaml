id: IND-PENILE-SCC-1L-ORGAN-SPARING
plan_track: local_therapy

applicable_to:
  disease_id: DIS-PENILE-SCC
  line_of_therapy: 1
  stage_requirements:
    - "Carcinoma in situ (Tis / penile intraepithelial neoplasia, erythroplasia of Queyrat) — topical field-therapy candidate"
    - "Ta / T1a (non-invasive or lamina-propria-confined invasion, favorable grade, no lymphovascular invasion) — laser or local-excision candidate"
    - "Selected small, glans-confined T2 (corpus spongiosum invasion only, favorable anatomy) — glansectomy candidate per MDT review"
    - "Not for T1b or higher-risk features (lymphovascular invasion, poor differentiation) requiring more radical primary surgery — see IND-PENILE-SCC-1L-PENECTOMY-NODAL"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

recommended_regimen:       # organ-sparing = topical/laser/excisional local therapy, not a drug regimen
concurrent_therapy: []
followed_by:
  - "Close surveillance (clinical exam ± biopsy) for local recurrence — organ-sparing approaches carry higher local recurrence rates than penectomy"
  - "Escalation to IND-PENILE-SCC-1L-PENECTOMY-NODAL for local recurrence or margin-positive excision"

evidence_level: low
strength_of_recommendation: conditional

expected_outcomes:
  overall_response_rate: "High local control for Tis with topical/laser therapy in EAU-guideline case series; T1a excision/glansectomy series report favorable local control"
  progression_free_survival: "Local recurrence is more common than after penectomy (the organ-sparing trade-off); most recurrences remain locally salvageable"
  overall_survival_5y: "Excellent for Tis/Ta/T1a confined disease — inguinal nodal status remains the dominant prognostic factor regardless of primary-tumor approach"

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-MRI-PELVIS
  - TEST-CT-CAP
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT

desired_tests: []

rationale: >
  Early-stage penile SCC (Tis, Ta, T1a, and selected small glans-confined
  T2) is managed with organ-sparing, penis-preserving approaches whenever
  tumor extent and MDT assessment allow, per EAU guidelines. Modality
  selection by stage/extent:
  - Tis (carcinoma in situ / erythroplasia of Queyrat / penile
    intraepithelial neoplasia): topical field therapy with 5-fluorouracil
    cream or imiquimod cream (DRUG-IMIQUIMOD) — either agent is an
    accepted option; selection by tolerability and clinician/patient
    preference.
  - Ta / T1a (non-invasive or lamina-propria-confined, favorable grade):
    CO2-laser ablation or wide local excision with organ-sparing intent.
  - Selected small, glans-confined T2 (corpus spongiosum invasion only):
    glansectomy (± split-thickness skin graft resurfacing) in place of
    partial penectomy, after MDT review, to preserve length and function.
  Organ-sparing approaches carry a higher local recurrence rate than
  penectomy but recurrences are generally salvageable with close
  follow-up, and preserve sexual/urinary function — a major
  quality-of-life consideration in this disease. Inguinal nodal
  management (sentinel node biopsy vs surveillance) is determined
  separately, by primary-tumor risk features, and is addressed per MDT;
  low-risk Tis/Ta disease without adverse histology generally does not
  require invasive nodal staging, while T1a with adverse features (LVI,
  poor differentiation) may still warrant nodal staging even when the
  primary is managed with organ preservation — see
  IND-PENILE-SCC-1L-PENECTOMY-NODAL for the detailed nodal-management
  logic (dynamic sentinel node biopsy vs lymphadenectomy by cN status).

rationale_ua: >
  Рання стадія SCC пенісу (Tis, Ta, T1a та відібрані невеликі T2,
  обмежені головкою) лікується органозберігаючими підходами, коли
  розмір пухлини та висновок МДТ це дозволяють, за EAU guidelines.
  Вибір модальності за стадією: Tis — топічна польова терапія
  5-фторурацилом або іміквімодом; Ta/T1a — CO2-лазерна абляція або
  широка локальна ексцизія; відібраний T2 (інвазія лише corpus
  spongiosum, сприятлива анатомія) — глансектомія замість часткової
  пенектомії після МДТ-огляду. Органозберігаючі підходи мають вищу
  частоту локальних рецидивів порівняно з пенектомією, але рецидиви,
  як правило, підлягають рятівному лікуванню; зберігається сексуальна
  та урінарна функція. Ведення пахвинних лімфовузлів визначається
  окремо за факторами ризику первинної пухлини.
