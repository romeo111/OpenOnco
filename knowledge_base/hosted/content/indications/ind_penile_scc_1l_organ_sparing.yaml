sources:
  - source_id: SRC-EAU-PENILE-2024
    position: supports
    relevant_quote_paraphrase: "EAU Penile Cancer Guidelines: organ-sparing approaches (topical therapy, laser, local excision, glansectomy) recommended for Tis/Ta/T1a and selected T2 whenever oncologically appropriate."

do_not_do_en:
  - "Do not choose organ-sparing therapy for T1a with adverse histology (LVI, poor differentiation, T1b+) without MDT discussion of nodal-staging implications."
  - "Do not omit close clinical follow-up after organ-sparing therapy — local recurrence risk is higher than after penectomy and early detection preserves salvageability."
  - "Do not treat glans-confined T2 with glansectomy outside MDT review — confirm margins and depth of invasion are truly amenable to organ preservation."

do_not_do:
  - "Не обирати органозберігаючу терапію при T1a з несприятливою гістологією (LVI, низька диференціація, T1b+) без обговорення на МДТ."
  - "Не пропускати ретельне клінічне спостереження після органозберігаючої терапії — ризик локального рецидиву вищий, ніж після пенектомії."
  - "Не виконувати глансектомію при T2 поза МДТ-оглядом — підтвердити межі резекції та глибину інвазії."

