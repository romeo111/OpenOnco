notes: >
  STUB — Phase 1 (zero-content disease authoring pass). Transcribed from
  DIS-PENILE-SCC narrative (topical 5-FU/imiquimod for Tis; CO2-laser or
  wide local excision for T1a; glansectomy for selected T2) per EAU
  guidelines. No dedicated Surgery/Procedure entities authored for laser
  ablation / local excision / glansectomy (mirrors the no-regimen
  local_therapy pattern already used by IND-MF-EARLY-1L-SKIN-DIRECTED) —
  modality selection stays in prose pending a future Surgery-entity
  authoring pass. DRUG-IMIQUIMOD created as a new Drug stub (previously
  only mentioned in prose elsewhere in the KB). Requires urology /
  dermato-oncology co-lead signoff before clinical publication (CHARTER
  §6.1; dev-mode-exempted for draft merge).
