notes: >
  STUB — Phase 1 (zero-content disease authoring pass). Transcribed from
  DIS-PENILE-SCC narrative (partial/total penectomy for T2-T4; dynamic
  sentinel node biopsy vs modified inguinal lymphadenectomy per cN0 vs
  cN+). No dedicated Surgery/Procedure entities authored for penectomy /
  sentinel node biopsy / inguinal lymphadenectomy (mirrors the
  no-regimen local_therapy pattern already used by
  IND-MF-EARLY-1L-SKIN-DIRECTED) — a future Surgery-entity authoring pass
  could formalize SUR-PENILE-PARTIAL-PENECTOMY, SUR-PENILE-TOTAL-PENECTOMY,
  SUR-PENILE-DSNB, and SUR-PENILE-INGUINAL-LYMPHADENECTOMY as first-class
  entities with IndicationPhase wiring. Requires urology co-lead signoff
  before clinical publication (CHARTER §6.1; dev-mode-exempted for draft
  merge).
