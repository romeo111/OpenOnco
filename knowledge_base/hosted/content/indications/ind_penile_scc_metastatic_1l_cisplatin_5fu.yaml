notes: >
  STUB — Phase 1. Transcribed from DIS-PENILE-SCC narrative ("cisplatin +
  5-FU OR TIP per EAU"). Regimen dosing (REG-CISPLATIN-5FU-PENILE) drafted
  using the standard cisplatin+5-FU SCC-doublet convention (analogous to
  head & neck / cervical / anal SCC use of this doublet) — no
  penile-specific phase III dosing trial exists to cite. Requires
  medical-oncology co-lead signoff before clinical publication (CHARTER
  §6.1; dev-mode-exempted for draft merge).
