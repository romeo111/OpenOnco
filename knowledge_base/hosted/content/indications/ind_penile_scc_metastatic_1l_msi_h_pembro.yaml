notes: >
  STUB — bonus/4th indication beyond the 3 explicitly requested in this
  authoring pass, added because the DIS-PENILE-SCC narrative explicitly
  names "pembrolizumab in MSI-H subset" and nearly every referenced
  entity already exists in the KB (DRUG-PEMBROLIZUMAB,
  REG-PEMBROLIZUMAB-MSI-MONO, BIO-MSI-STATUS, CI-PEMBROLIZUMAB-AUTOIMMUNE,
  RF-ACTIVE-AUTOIMMUNE-DISEASE-ICI-RISK) — low-invention-risk, high
  narrative fidelity. New RF-PENILE-SCC-MSI-H-ACTIONABILITY authored to
  gate this branch in ALGO-PENILE-SCC-1L. Independent review removed a
  proposed secondary citation to SRC-NCCN-BLADDER-2025 (that source is
  the NCCN Bladder Cancer guideline, relates_to_diseases: [DIS-UROTHELIAL]
