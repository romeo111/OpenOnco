id: IND-PENILE-SCC-METASTATIC-1L-TIP
plan_track: aggressive

applicable_to:
  disease_id: DIS-PENILE-SCC
  line_of_therapy: 1
  stage_requirements:
    - "Metastatic (M1) OR regionally advanced/bulky nodal disease, including use as neoadjuvant chemotherapy before consolidative inguinal/pelvic lymphadenectomy in selected regionally advanced cN+ disease per EAU"
    - "MSI-H/dMMR not identified or not tested — see IND-PENILE-SCC-METASTATIC-1L-MSI-H-PEMBRO when MSI-H/dMMR positive"
  biomarker_requirements_required: []
  biomarker_requirements_excluded:
    - biomarker_id: BIO-MSI-STATUS
      value_constraint: "MSI-H"
  demographic_constraints:
    ecog_max: 1
    notes: "ECOG 0-1 and adequate renal/hepatic/marrow reserve required for triplet-chemotherapy tolerability; ECOG 2 or borderline organ function → prefer IND-PENILE-SCC-METASTATIC-1L-CISPLATIN-5FU"

recommended_regimen: REG-TIP-PENILE
concurrent_therapy: []
followed_by:
  - "Consolidative inguinal/pelvic lymphadenectomy for responding regionally advanced nodal disease per MDT (neoadjuvant-intent use)"

evidence_level: low
strength_of_recommendation: conditional

expected_outcomes:
  overall_response_rate: "Small phase II / retrospective series report objective responses in a substantial minority; no large prospective trial exists in this rare disease"
  progression_free_survival: "Limited durable benefit for widely metastatic disease; better outcomes reported when used as neoadjuvant therapy before consolidative surgery in regionally advanced (nodal-only) disease"
  overall_survival_5y: "Poor for metastatic penile SCC — DIS-PENILE-SCC epidemiology reports <20% 5-year OS for stage IV disease"

hard_contraindications: []
red_flags_triggering_alternative:
  - RF-PENILE-SCC-MSI-H-ACTIONABILITY

required_tests:
  - TEST-CT-CAP
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT

desired_tests:
  - TEST-MSI-PCR-OR-NGS
  - TEST-DMMR-IHC

rationale: >
  TIP (paclitaxel + ifosfamide + cisplatin) is the triplet-chemotherapy
  option for metastatic/unresectable penile SCC per EAU guidelines,
  alongside the cisplatin+5-FU doublet
  (IND-PENILE-SCC-METASTATIC-1L-CISPLATIN-5FU). It is more
  myelosuppressive and requires mesna + growth-factor support, so
  triplet-fit patients (ECOG 0-1, adequate organ reserve) are the
  intended population — MDT/patient preference is a valid tiebreaker when
  both regimens are feasible, consistent with EAU listing both as options
  without a strict preference hierarchy. TIP is also used, at selected
  specialized centers, as neoadjuvant chemotherapy before consolidative
  inguinal/pelvic lymphadenectomy in regionally advanced nodal disease —
  response to chemotherapy can render previously unresectable nodal
  disease resectable.

rationale_ua: >
  TIP (паклітаксел + іфосфамід + цисплатин) — триплетний
  хіміотерапевтичний варіант при метастатичній/нерезектабельній SCC
  пенісу за EAU guidelines, поряд з дублетом цисплатин+5-FU. Він більш
  мієлосупресивний та потребує месни + підтримки факторами росту, тому
  призначений пацієнтам, придатним для триплетної терапії (ECOG 0-1,
  адекватний органний резерв). Також застосовується як неоад'ювантна
  хіміотерапія перед консолідуючою лімфаденектомією при регіонально
  поширеному нодальному захворюванні у спеціалізованих центрах.
ukrainian_review_status: pending_clinical_signoff
