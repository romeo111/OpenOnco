sources:
  - source_id: SRC-EAU-PENILE-2024
    position: supports
    relevant_quote_paraphrase: "EAU Penile Cancer Guidelines: TIP (paclitaxel, ifosfamide, cisplatin) as a chemotherapy option for metastatic/unresectable penile SCC, and as neoadjuvant therapy before consolidative surgery in regionally advanced nodal disease."

do_not_do_en:
  - "Do not use TIP in patients with ECOG ≥2 or inadequate renal/hepatic/marrow reserve — prefer the cisplatin+5-FU doublet."
  - "Do not administer ifosfamide without mandatory concurrent mesna and aggressive hydration — hemorrhagic cystitis risk."
  - "Do not treat MSI-H/dMMR-confirmed disease with chemotherapy as the automatic default without considering pembrolizumab (tissue-agnostic MSI-H approval)."

do_not_do:
  - "Не застосовувати TIP у пацієнтів з ECOG ≥2 або недостатнім органним резервом — перевага дублету цисплатин+5-FU."
  - "Не вводити іфосфамід без обов'язкової супутньої месни та агресивної гідратації."
  - "Не лікувати MSI-H/dMMR-підтверджене захворювання хіміотерапією за замовчуванням без розгляду пембролізумабу."

