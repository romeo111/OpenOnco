notes: >
  STUB — Phase 1. Transcribed from DIS-PENILE-SCC narrative ("TIP
  (paclitaxel + ifosfamide + cisplatin) per EAU"). REG-TIP-PENILE dosing
  drafted per the general TIP-triplet convention (paclitaxel d1;
  ifosfamide+cisplatin d1-3 with mandatory mesna; q21d), distinct from the
  germ-cell-tumor-salvage TIP schedule already in this KB
  (REG-TIP-GCT-SALVAGE). Requires medical-oncology co-lead signoff before
  clinical publication (CHARTER §6.1; dev-mode-exempted for draft merge).
