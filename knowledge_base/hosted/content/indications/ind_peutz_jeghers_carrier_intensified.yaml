rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-PEUTZ-JEGHERS-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-PEUTZ-JEGHERS-
  CARRIER-SURVEILLANCE applies (VCE / MR enterography q2-3y from 8-10,
  colonoscopy q2-3y from 18, EGD q2-3y from 8-10, breast MRI from 30,
  pancreatic EUS / MRI q1-2y from 30-35, annual cervical Pap with
  adenoma-malignum awareness, annual testicular exam men, TVUS q1y
  women).

  **Intensification 1 — Earlier pancreatic surveillance initiation:**
  In high-risk PJS kindreds (family pancreatic cancer onset < age 50,
  or proband with smoking / type-2 diabetes / chronic pancreatitis
  co-risk factors), advancing pancreatic surveillance from age 30-35
  to age 25-30 is a shared-decision option. Trade-off: earlier start
  means more lifetime imaging studies + earlier exposure to false-
  positive findings (small cystic lesions in young adults). Center
  must be experienced in PJS-pancreas surveillance to avoid harm from
  unnecessary biopsies / resections.

  **Intensification 2 — Breast risk-reducing options:** Bilateral
  mastectomy in confirmed PJS carriers reduces breast cancer incidence
  to near-zero — same evidence base as BRCA carriers in terms of
  surgical outcomes, though absolute PJS-attributable breast cancer
  risk is somewhat lower than BRCA1 / 2 (~32-54% lifetime vs.
  ~50-72% BRCA1). Shared-decision-making must cover surgical risk,
  psychological impact, reconstructive options, fertility / breast-
  feeding planning, and alternative continued breast MRI surveillance.
  Tamoxifen chemoprevention has lower-tier evidence in PJS than in
  BRCA — discuss only after explicit framing of the weaker PJS-specific
  evidence base.

  **Other intensification considerations (not core to this track):**
    - Empirical prophylactic colectomy is NOT routine — PJS polyps are
      hamartomatous (not adenomatous), and structured colonoscopy with
      polypectomy keeps CRC risk manageable.
    - mTOR-pathway chemoprevention (rapalogs) is investigational in
      PJS — do NOT prescribe outside trial setting despite plausible
      STK11-AMPK-mTOR pathway rationale.

  **Cascade testing remains continuous:** every visit re-confirms
  family testing status.

  Per CHARTER §11: intensified surveillance and risk-reducing surgery
  are shared-decision-making domains. Patient autonomy is paramount;
  standard-track protocol remains the floor.

rationale_ua: >
  Розширений (aggressive) шлях для підтверджених носіїв мутації,
  накладений поверх стандартного протоколу
  IND-PEUTZ-JEGHERS-CARRIER-SURVEILLANCE.

  **Основа:** застосовується весь стандартний нагляд з
  IND-PEUTZ-JEGHERS-CARRIER-SURVEILLANCE (VCE / MR-ентерографія
  кожні 2-3 роки з 8-10 років, колоноскопія кожні 2-3 роки з 18
  років, ЕГДС кожні 2-3 роки з 8-10 років, МРТ молочної залози з
  30 років, ендоскопічне УЗД / МРТ підшлункової залози кожні 1-2
  роки з 30-35 років, щорічний Pap-тест з урахуванням ризику
  adenoma malignum, щорічний огляд яєчок у чоловіків, ТВУЗД
  щороку у жінок).

  **Інтенсифікація 1 — Раніший початок нагляду за підшлунковою
  залозою:** у родинах високого ризику (сімейний рак підшлункової
  залози до 50 років або в пробанда — супутні фактори ризику:
  куріння / цукровий діабет 2 типу / хронічний панкреатит) перенесення
  початку нагляду за підшлунковою залозою з 30-35 на 25-30 років —
  варіант спільного прийняття рішення. Компроміс: більш ранній
  початок означає більше довічних візуалізаційних досліджень і
  раннє зіткнення з хибнопозитивними знахідками (дрібні кістозні
  утворення у молодих дорослих). Центр повинен мати досвід
  нагляду за підшлунковою залозою при PJS, щоб уникнути шкоди від
  необґрунтованих біопсій / резекцій.

  **Інтенсифікація 2 — Варіанти зниження ризику раку молочної
  залози:** двобічна мастектомія у підтверджених носіїв PJS
  знижує захворюваність на рак молочної залози майже до нуля —
  та сама доказова база хірургічних результатів, що й у носіїв
  BRCA, хоча абсолютний PJS-асоційований ризик дещо нижчий, ніж
  при BRCA1/2 (~32-54% довічного ризику проти ~50-72% при BRCA1).
  Спільне прийняття рішення повинно охоплювати хірургічний ризик,
  психологічний вплив, варіанти реконструкції, планування
  фертильності / грудного вигодовування та альтернативу у вигляді
  продовження нагляду МРТ молочної залози. Хіміопрофілактика
  тамоксифеном має доказову базу нижчого рівня при PJS, ніж при
  BRCA, — обговорювати лише після чіткого пояснення слабшої
  PJS-специфічної доказової бази.

  **Інші міркування щодо інтенсифікації (не є основними для цього
  шляху):**
    - Емпірична профілактична колектомія НЕ є рутинною — поліпи
      при PJS є гамартомними (не аденоматозними), і структурована
      колоноскопія з поліпектомією утримує ризик КРР під контролем.
    - Хіміопрофілактика за допомогою препаратів mTOR-шляху
      (рапалогів) є досліджуваною при PJS — не призначати поза
      межами клінічного дослідження, попри теоретичне обґрунтування
      через шлях STK11-AMPK-mTOR.

  **Каскадне тестування залишається постійним:** кожен візит
  повторно підтверджує статус тестування родини.

  Згідно з CHARTER §11: інтенсифікований нагляд і ризик-знижувальна
  хірургія є сферою спільного прийняття рішень. Автономія пацієнта
  є пріоритетною; протокол стандартного шляху залишається мінімальною
  базовою вимогою.

