  overall_response_rate: >-
    Intensified track layers two options on top of standard PJS
    surveillance: (1) earlier pancreatic surveillance initiation
    (age 25-30 vs. age 30-35) in high-risk pedigree (family pancreatic
    cancer < age 50 or proband with smoking / diabetes co-risk);
    (2) breast risk-reducing options (bilateral mastectomy or tamoxifen
    chemoprevention) discussion — PJS breast cancer risk is
    BRCA-comparable but PJS chemoprevention evidence base is weaker
    than BRCA, so shared-decision-making must surface this distinction
    honestly.

