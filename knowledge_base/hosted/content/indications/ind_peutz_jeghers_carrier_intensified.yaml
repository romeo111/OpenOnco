do_not_do:
  - "Не переносити початок нагляду за підшлунковою залозою раніше 25-30 років без родини високого ризику або супутніх факторів ризику — тягар хибнопозитивних результатів і раннє опромінення при візуалізації невиправдані."
  - "Не виконувати емпіричну профілактичну колектомію — поліпи при PJS є гамартомними, а не аденоматозними; структурованої колоноскопії з поліпектомією достатньо."
  - "Не використовувати хіміопрофілактику препаратами mTOR-шляху (рапалогами) поза клінічним дослідженням — при PJS це наразі досліджуваний підхід."
  - "Не подавати ризик-знижувальну мастектомію як таку, що має рівноцінну з BRCA доказову базу — абсолютний PJS-специфічний ризик дещо нижчий; це має бути чітко відображено при спільному прийнятті рішення."
  - "Не пропонувати хіміопрофілактику тамоксифеном як стандарт при PJS — доказова база нижчого рівня, ніж при BRCA."

do_not_do_en:
  - "Do not advance pancreatic surveillance earlier than age 25-30 without high-risk pedigree or co-risk factors — false-positive burden and early imaging exposure are not justified otherwise."
  - "Do not perform empirical prophylactic colectomy — PJS polyps are hamartomatous (not adenomatous); structured colonoscopy with polypectomy is adequate."
  - "Do not use mTOR-pathway chemoprevention (rapalogs) outside a clinical trial — currently investigational in PJS."
  - "Do not present breast risk-reducing mastectomy as having equivalent BRCA evidence base — PJS-specific absolute risk is somewhat lower; shared-decision-making discussion must surface this."
  - "Do not offer tamoxifen chemoprevention as standard in PJS — evidence base is lower-tier than in BRCA."

