rationale: >
  Standard-track confirmed-carrier surveillance pathway for STK11-
  positive carriers per ACG 2015 / NCCN Genetic Familial High-Risk:
  Colorectal.

  **Small-bowel (~13% lifetime cancer; ~50% childhood intussusception
  if untreated):** Video capsule endoscopy (VCE) OR MR enterography
  q2-3y starting age 8-10. Symptomatic episodes (abdominal pain,
  obstruction) trigger immediate imaging. Polyps >1.5 cm or rapidly
  growing → push enteroscopy or surgical resection to prevent
  intussusception. This is the most distinctive PJS surveillance
  intervention.

  **Colorectal (~39% lifetime):** Colonoscopy q2-3y starting age 18
  (earlier if polyps detected on imaging). Polypectomy of all hamartomas
  > 5 mm. Pan-colonic distribution typical.

  **Upper GI (~29% gastric, plus duodenal):** EGD q2-3y starting age
  8-10 — paired with VCE / MR enterography scheduling to consolidate
  anesthesia exposures in children.

  **Breast (women, ~32-54% lifetime — BRCA-comparable):** Annual breast
  MRI starting age 30 (or earlier per family-cluster age-of-onset);
  add mammography from age 30-35. Clinical breast exam q6mo.

  **Pancreatic (~11-36% lifetime — highest hereditary risk):** EUS or
  MRI / MRCP q1-2y starting age 30-35 (PJS is one of the few hereditary
  syndromes with sufficient absolute risk to justify pancreatic
  surveillance per CAPS consortium consensus). HbA1c q1y as adjunctive
  early-diabetes signal.

  **Cervical (women, ~10% lifetime adenoma malignum — rare but
  pathognomonic):** Annual Pap with explicit cytopathology awareness
  of minimal-deviation adenocarcinoma (adenoma malignum) — easily missed
  on routine cytology. Pelvic exam q1y.

  **Ovarian / sex-cord (women, ~8-21% SCTAT):** TVUS q1y from age 25-30
  with awareness of sex-cord tumor with annular tubules (SCTAT) — often
  estrogen-secreting, may present with abnormal bleeding or precocious
  puberty in pediatric carriers.

  **Testicular (men, ~9% Sertoli-cell large-cell calcifying variant):**
  Annual testicular exam from infancy with US for any mass, gynecomastia,
  or short stature. Pre-pubertal Sertoli-cell tumors hormonally active
  (estrogen) → can cause precocious puberty.

  **Mucocutaneous pigmentation:** No surveillance intervention, but
  serves as visible reminder of carrier status at every visit.

  **Cascade testing:** Mandates offer to all first-degree relatives;
  pediatric testing for at-risk children appropriate given the
  childhood-onset surveillance window (age 8-10 starting VCE).

  Per CHARTER §11 patient-autonomy framing; pediatric surveillance
  requires extensive family counseling and age-appropriate consent
  framework.

rationale_ua: >
  Стандартний шлях нагляду для підтверджених носіїв мутації STK11
  згідно з ACG 2015 / NCCN Genetic Familial High-Risk: Colorectal.

  **Тонка кишка (~13% довічного ризику раку; ~50% дитячої інвагінації
  за відсутності лікування):** відеокапсульна ендоскопія (VCE) АБО
  MR-ентерографія кожні 2-3 роки з 8-10 років. Симптомні епізоди
  (біль у животі, обструкція) вимагають негайної візуалізації.
  Поліпи >1.5 см або ті, що швидко ростуть, → push-ентероскопія
  або хірургічна резекція для запобігання інвагінації. Це
  найхарактерніше втручання нагляду при PJS.

  **Товста кишка (~39% довічного ризику):** колоноскопія кожні 2-3
  роки з 18 років (раніше — якщо поліпи виявлено при візуалізації).
  Поліпектомія всіх гамартом >5 мм. Типовим є панколонічне
  поширення.

  **Верхні відділи ШКТ (~29% шлунковий рак, плюс дуоденальний):**
  ЕГДС кожні 2-3 роки з 8-10 років — узгоджується за графіком з VCE
  / MR-ентерографією для зменшення кількості епізодів анестезії у
  дітей.

  **Молочна залоза (жінки, ~32-54% довічного ризику — порівнянно з
  BRCA):** щорічна МРТ молочної залози з 30 років (раніше — за
  раннішим віком дебюту в родині); з 30-35 років додається
  мамографія. Клінічний огляд молочної залози кожні 6 місяців.

  **Підшлункова залоза (~11-36% довічного ризику — найвищий серед
  спадкових синдромів):** ендоскопічне УЗД або МРТ / MRCP кожні 1-2
  роки з 30-35 років (PJS — один з небагатьох спадкових синдромів
  з достатнім абсолютним ризиком, що виправдовує нагляд за
  підшлунковою залозою, за консенсусом консорціуму CAPS). HbA1c
  щороку як додатковий маркер раннього діабету.

  **Шийка матки (жінки, ~10% довічного ризику adenoma malignum —
  рідкісний, але патогномонічний):** щорічний Pap-тест з явною
  цитопатологічною настороженістю щодо мінімально-девіантної
  аденокарциноми (adenoma malignum) — легко пропустити при
  рутинній цитології. Огляд органів малого таза щороку.

  **Яєчники / статевотяжеві пухлини (жінки, ~8-21% SCTAT):** ТВУЗД
  щороку з 25-30 років з настороженістю щодо статевотяжевої пухлини
  з кільцеподібними трубочками (SCTAT) — часто естроген-секретуюча,
  може проявлятися аномальною кровотечею або передчасним статевим
  дозріванням у дітей-носіїв.

  **Яєчко (чоловіки, ~9% великоклітинний кальцифікуючий варіант
  пухлини із клітин Сертолі):** щорічний огляд яєчок з немовлячого
  віку з УЗД за будь-якого утворення, гінекомастії або низькорослості.
  Препубертатні пухлини із клітин Сертолі гормонально активні
  (естроген) → можуть спричиняти передчасне статеве дозрівання.

  **Мукокутанна пігментація:** втручання нагляду не потрібне, але
  слугує видимим нагадуванням про статус носія на кожному візиті.

  **Каскадне тестування:** обов'язково пропонувати всім родичам
  першого ступеня; тестування дітей із групи ризику доцільне з
  огляду на дитячий вік початку нагляду (з 8-10 років для VCE).

  Згідно з CHARTER §11 щодо автономії пацієнта; дитячий нагляд
  потребує розширеного консультування родини та вікововідповідної
  форми згоди.

