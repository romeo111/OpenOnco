do_not_do:
  - "Не пропускати дитячий нагляд за тонкою кишкою — симптомна інвагінація при нелікованому PJS трапляється у ~50% до 20 років, потенційно загрожує життю та потребує хірургічного втручання."
  - "Не виконувати резекцію тонкої кишки без попередньої планової консультації — повторні резекції ведуть до синдрому короткої кишки; мета — поліпектомія через push-ентероскопію / спіральну ентероскопію, де це можливо."
  - "Не використовувати лише рутинну Pap-цитологію для нагляду за шийкою матки — adenoma malignum (мінімально-девіантна аденокарцинома) легко пропустити; необхідна явна цитопатологічна настороженість."
  - "Не пропускати препубертатний огляд яєчок у хлопчиків — великоклітинна кальцифікуюча пухлина із клітин Сертолі гормонально активна і може спричиняти передчасне статеве дозрівання / гінекомастію."
  - "Не пропускати каскадне тестування родичів першого ступеня — кожен візит має документувати статус тестування родини."

do_not_do_en:
  - "Do not skip pediatric small-bowel surveillance — symptomatic intussusception in untreated PJS occurs in ~50% by age 20 and is potentially life-threatening and operation-dependent."
  - "Do not resect small bowel without planning consultation — multiple recurrent resections lead to short-bowel syndrome; goal is polypectomy via push enteroscopy or spiral enteroscopy where possible."
  - "Do not use routine Pap cytology alone for cervical surveillance — adenoma malignum (minimal-deviation adenocarcinoma) is easily missed; explicit cytopathology awareness is required."
  - "Do not skip pre-pubertal testicular exam in boys — large-cell calcifying Sertoli-cell tumor is hormonally active and can cause precocious puberty / gynecomastia."
  - "Do not skip cascade testing of first-degree relatives — every surveillance visit should document family testing status."

