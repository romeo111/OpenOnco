expected_outcomes:
  overall_response_rate: "Empirical PJ-protocol surveillance without genetic confirmation captures small-bowel intussusception + GI cancers at earlier stages. Diagnostic precision lower than confirmed-carrier comparator; non-carriers receive unnecessary intensive surveillance."

