do_not_do:
  - "Не подавати емпіричний нагляд як еквівалент генетичного підтвердження."
  - "Не пропускати періодичне повторне обговорення генетичного тестування — більшість пацієнтів з часом погоджуються."
  - "Не використовувати емпіричний скринінг підшлункової залози (EUS/MRI) за підозри на PJS без тестування — ця рекомендація стосується підтверджених носіїв."

do_not_do_en:
  - "Do not present empirical surveillance as equivalent to genetic confirmation."
  - "Do not skip periodic re-discussion of genetic testing — most patients eventually accept."
  - "Do not use empirical pancreatic screening (EUS/MRI) in decline-testing PJ-suspicion — recommendation is for confirmed carriers."

