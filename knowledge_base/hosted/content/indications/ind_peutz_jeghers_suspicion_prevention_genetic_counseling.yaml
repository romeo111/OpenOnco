rationale: >
  Standard-track prevention pathway for Peutz-Jeghers syndrome (STK11/LKB1) family
  history suspicion. Two parallel referrals:

  **(1) Genetic counseling referral.** Pre-test counseling: autosomal dominant
  inheritance, variable penetrance, cascade testing for relatives, implications
  for reproductive planning (pre-implantation genetic testing option), psychological
  preparation for high cancer risk across multiple organ systems.

  **(2) Germline STK11/LKB1 panel testing.** Modern multi-gene panels cover STK11
  along with the broader hereditary CRC + breast + GI cancer set. Variant
  classification per ACMG framework.

  **Surveillance protocol for confirmed STK11 carriers** (per international PJ
  consensus):
  - Small-bowel surveillance via video capsule endoscopy (VCE) OR MR enterography
    q2-3 years starting age 8-10 (small-bowel hamartomatous polyposis can present
    with intussusception in childhood).
  - Colonoscopy q2-3 years starting age 18.
  - EGD q2-3 years starting age 8-10.
  - Breast MRI from age 30 (women).
  - Pancreatic surveillance discussion (EUS/MRI q1-2y from 30-35) — controversial,
    high-volume center referral.
  - Annual clinical breast/testicular/pelvic exam from puberty.
  - Cervical Pap with adenoma malignum awareness (women).

rationale_ua: >
  Стандартний шлях профілактики для родинної підозри на синдром Peutz-
  Jeghers (STK11/LKB1). Два паралельні направлення:

  **(1) Направлення на генетичне консультування.** Консультування перед
  тестуванням: аутосомно-домінантний тип успадкування, варіабельна
  пенетрантність, каскадне тестування родичів, наслідки для планування
  репродукції (можливість переімплантаційного генетичного тестування),
  психологічна підготовка до високого ризику раку в кількох органних
  системах.

  **(2) Герміногенне панельне тестування STK11/LKB1.** Сучасні мультигенні
  панелі охоплюють STK11 разом із ширшим набором генів спадкового КРР, раку
  молочної залози та інших пухлин ШКТ. Класифікація варіантів за критеріями
  ACMG.

  **Протокол нагляду для підтверджених носіїв STK11** (за міжнародним
  консенсусом щодо PJS):
  - Нагляд за тонкою кишкою за допомогою відеокапсульної ендоскопії (VCE)
    АБО MR-ентерографії кожні 2-3 роки з 8-10 років (гамартомний поліпоз
    тонкої кишки може проявлятися інвагінацією в дитинстві).
  - Колоноскопія кожні 2-3 роки з 18 років.
  - ЕГДС кожні 2-3 роки з 8-10 років.
  - МРТ молочної залози з 30 років (жінки).
  - Обговорення нагляду за підшлунковою залозою (EUS/MRI кожні 1-2 роки з
    30-35 років) — суперечливе питання, направлення до центру з високим
    обсягом досвіду.
  - Щорічний клінічний огляд молочних залоз / яєчок / органів малого таза
    з початку статевого дозрівання.
  - Pap-тест шийки матки з настороженістю щодо adenoma malignum (жінки).

