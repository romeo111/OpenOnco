do_not_do:
  - "Не призначати герміногенне тестування без консультування перед тестуванням."
  - "Не виконувати колоноскопію в дітей без чіткого клінічного показання — гамартоми тонкої кишки можна моніторити за допомогою VCE / MR-ентерографії з меншою інвазивністю."
  - "Не подавати негативний результат панелі як нульовий ризик — залишається залишковий ризик через рідкісні варіанти, не охоплені панеллю."
  - "Не пропускати нагляд за молочною залозою у STK11-позитивних жінок — ризик раку молочної залози становить ~30-55%."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling."
  - "Do not use pediatric colonoscopy without clear clinical indication — small-bowel hamartomas can be monitored via VCE/MR enterography with less invasiveness."
  - "Do not present a negative-panel result as zero-risk — residual risk through rare variants not covered by the panel."
  - "Do not skip breast surveillance in STK11+ women — breast cancer risk ~30-55%."

