desired_tests: []

rationale: >
  AlloHCT is the ONLY curative option for PMF — mandatory
  consideration in ALL transplant-eligible patients with DIPSS-Plus
  intermediate-2 OR high-risk OR MIPSS70+ high-risk OR HMR
  mutations (TP53, ASXL1, EZH2, IDH1/2, SRSF2). 5-y OS post-HCT
  30-65% (DIPSS-stratified) vs <20% high-risk without HCT.
  Ruxolitinib pre-HCT bridging 3-6 months reduces spleen volume +
  symptoms → improves transplant outcomes; taper ruxolitinib 5-7
  days before conditioning to avoid cytokine rebound. Donor
  search initiated CONCURRENTLY with JAKi optimization — donor
  identification can take 3-6 months. Conditioning intensity
  tailored to age + comorbidity. Splenectomy NOT routinely
  recommended pre-HCT (high mortality in MF; only for refractory
  massive splenomegaly per institution). TP53-mutated MF has
  worse outcomes (~20% 5-y OS post-HCT) but HCT still the only
  curative pathway. CRITICAL: do NOT defer alloHCT discussion to
  JAKi failure — long-term JAKi exposure does not delay
  progression and donor search delays compound.

rationale_ua: >
  АлоТГСК (алогенна трансплантація гемопоетичних стовбурових клітин) — ЄДИНИЙ потенційно
  виліковуючий метод лікування ПМФ; обов'язково розглядається у ВСІХ придатних до
  трансплантації пацієнтів із проміжним-2 або високим ризиком за DIPSS-Plus, високим ризиком
  за MIPSS70+ або мутаціями високого молекулярного ризику (HMR: TP53, ASXL1, EZH2, IDH1/2,
  SRSF2). 5-річна загальна виживаність після алоТГСК становить 30-65% (залежно від
  стратифікації за DIPSS-Plus) проти <20% у пацієнтів високого ризику без трансплантації.
  Передтрансплантаційний «місток» руксолітинібом протягом 3-6 місяців зменшує об'єм
  селезінки та симптоми → покращує результати трансплантації; руксолітиніб слід поступово
  відміняти за 5-7 днів до кондиціонування, щоб уникнути синдрому цитокінового викиду. Пошук
  донора розпочинають ОДНОЧАСНО з оптимізацією терапії JAKi — пошук донора може тривати 3-6
  місяців. Інтенсивність кондиціонування підбирають з урахуванням віку та супутньої
  патології. Спленектомію ПЕРЕД трансплантацією зазвичай НЕ рекомендують (висока смертність
  при МФ; розглядається лише за рефрактерної масивної спленомегалії на розсуд закладу). МФ
  із мутацією TP53 має гірші результати (~20% 5-річної загальної виживаності після алоТГСК),
  однак трансплантація залишається єдиним потенційно виліковуючим шляхом. КРИТИЧНО: НЕ
  відкладати обговорення алоТГСК до невдачі терапії JAKi — тривале застосування JAKi не
  уповільнює прогресування захворювання, а затримки в пошуку донора накопичуються.
