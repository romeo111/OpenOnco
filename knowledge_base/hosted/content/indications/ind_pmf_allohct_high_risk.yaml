sources:
  - source_id: SRC-NCCN-MPN-2025
    position: supports
    relevant_quote_paraphrase: "AlloHCT is the only curative option for PMF; mandatory consideration in DIPSS-Plus int-2/high or MIPSS70+ high transplant-eligible patients"
  - source_id: SRC-DIPSS-PLUS-GANGAT-2011
    position: supports
    relevant_quote_paraphrase: "DIPSS-Plus stratifies PMF risk; int-2 and high-risk warrant alloHCT pathway in eligible patients"
  - source_id: SRC-ESMO-MPN-2015
    position: supports
    relevant_quote_paraphrase: "AlloHCT recommended for high-risk MF transplant-eligible patients per ESMO 2015"

do_not_do:
  - "НЕ відкладати обговорення алоТГСК до невдачі терапії JAKi — JAKi не виліковує МФ, а пошук донора триває 3-6 місяців."
  - "НЕ проводити трансплантацію на тлі неконтрольованої інфекції — лімфодеплеція та профілактика реакції трансплантат-проти-господаря (РТПГ) підвищують смертність."
  - "НЕ виконувати спленектомію перед трансплантацією рутинно — висока періопераційна смертність при МФ; лише за рефрактерної масивної спленомегалії на розсуд закладу."
  - "НЕ припиняти руксолітиніб різко перед кондиціонуванням — відміняти поступово протягом 5-7 днів; синдром цитокінового викиду загрожує життю."
  - "НЕ ігнорувати молекулярну рекласифікацію за MIPSS70+ — мутації високого молекулярного ризику (HMR) підвищують ризик і можуть змінити терміни трансплантації."
  - "НЕ забувати про збереження фертильності у молодих пацієнтів перед кондиціонуванням."
  - "НЕ забувати про терміни пошуку донора — пошук міжнародного донора може тривати 2-3 місяці."

do_not_do_en:
  - "Do NOT delay alloHCT discussion until JAKi failure — JAKi does not cure MF, donor search takes 3-6 months."
  - "Do NOT perform HCT with active uncontrolled infection — lymphodepletion + GVHD prophylaxis = high mortality."
  - "Do NOT perform splenectomy before HCT routinely — high peri-op mortality in MF; only for refractory massive splenomegaly per institutional expertise."
  - "Do NOT abrupt-stop ruxolitinib before conditioning — taper 5-7 days; cytokine rebound life-threatening."
  - "Do NOT ignore MIPSS70+ molecular reclassification — HMR mutations increase risk; may change HCT timing."
  - "Do NOT forget fertility preservation in young patients before conditioning."
  - "Do NOT forget donor-search timing — international donor may take 2-3 months."
known_controversies:
  - topic: "Timing of alloHCT for PMF — DIPSS-Plus int-2 vs high-only"
    positions:
      - position: "AlloHCT for ALL transplant-eligible DIPSS-Plus int-2 or high (mandatory)"
        sources: [SRC-NCCN-MPN-2025, SRC-DIPSS-PLUS-GANGAT-2011]
      - position: "Reserve alloHCT for high-risk only (or int-2 with HMR mutations) — int-2 patients often have stable disease for 3-5 years on JAKi without HCT TRM exposure"
        sources: [SRC-NCCN-MPN-2025]
        evidence_note: "Markov modeling supports earlier HCT for high-risk + HMR; int-2 without HMR more nuanced"
    our_default: "AlloHCT for all transplant-eligible high-risk (mandatory); int-2 with HMR mutations; int-2 without HMR — case-by-case based on patient + donor availability"
    rationale: "Mutation profile (HMR) refines risk beyond DIPSS-Plus; goal-directed HCT pathway"

