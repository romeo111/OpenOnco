evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: "Less-frequent surveillance (MRI/MRCP q2-3y instead of annual) captures cholangiocarcinoma at later stage; outcomes inferior to annual-surveillance comparator."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-PSC-CHOLANGIOCARCINOMA-PREVENTION-SURVEILLANCE.
  Used when intensified annual MRI/MRCP cadence is impractical (cost, access,
  patient preference, geographic distance from specialist hepatology). Adopts
  q2-3y MRI/MRCP cadence + symptom-driven evaluation. Per CHARTER §11
  patient-autonomy framing.

rationale_ua: >
  Альтернативний варіант спостереження, супутній до IND-PSC-CHOLANGIOCARCINOMA-
  PREVENTION-SURVEILLANCE. Застосовується, коли інтенсифікований щорічний графік
  МРТ/МРХПГ є практично нездійсненним (вартість, доступність, вибір пацієнта,
  географічна віддаленість від спеціалізованого гепатологічного центру). Передбачає
  проведення МРТ/МРХПГ з періодичністю раз на 2-3 роки та оцінку за клінічними
  симптомами. Відповідає принципу автономії пацієнта згідно з §11 CHARTER.

ukrainian_review_status: pending_clinical_signoff
