do_not_do:
  - "Не застосовувати цей шлях у підгрупі PSC-IBD — потрібне щорічне спостереження через високий ризик колоректального раку (CRC)."
  - "Не ігнорувати тривожні ознаки під час спостереження з періодичністю раз на 2-3 роки — за їх появи негайно переходити на стандартний трек спостереження."
  - "Не подавати цей варіант спостереження як еквівалентний щорічному спостереженню — чутливість виявлення на ранній стадії за такого графіка нижча."

do_not_do_en:
  - "Do not use this pathway in the PSC-IBD subgroup — annual surveillance is required due to high CRC risk."
  - "Do not ignore alarm features during q2-3y cadence — immediate escalation to standard track."
  - "Do not present observation as equivalent to annual surveillance — early-stage detection sensitivity is lower."

