id: IND-PV-1L-ROPEGINTERFERON
plan_track: aggressive

applicable_to:
  disease_id: DIS-PV
  # line_of_therapy intentionally unset: used by algorithms of different LOTs; algorithm is routing authority.
  stage_requirements:
    - "Newly diagnosed PV (or pre-treated <3 years) seeking cytoreductive therapy"
    - "HU-naive OR HU-intolerant with disease-modification goal"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 1
    age_max: 60

recommended_regimen: REG-ROPEGINTERFERON-PV
concurrent_therapy: []
followed_by: []

evidence_level: high
strength_of_recommendation: strong
nccn_category: "1"

expected_outcomes:
  overall_response_rate: "Complete hematologic response 71% vs 51% HU at 36 months (CONTINUATION-PV)"
  complete_response: "Hct <45% + WBC + plt control sustained ≥1 year ~50-60%"
  progression_free_survival: "Disease-modifying potential — JAK2-V617F allele burden reduction substantially greater than HU; long-term implications under study"
  overall_survival_5y: "Mature OS data still maturing; non-inferior to HU for thrombosis-free survival at 36 months"

hard_contraindications: []
red_flags_triggering_alternative:
  - RF-PV-ET-HIGH-THROMBOSIS-RISK
  - RF-PV-ET-PREGNANCY-OR-PLANNING
  - RF-PV-ET-FRAILTY-AGE
  - RF-PV-ET-ORGAN-DYSFUNCTION

required_tests:
  - TEST-CBC
  - TEST-RETICULOCYTE
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-IRON-PANEL
  - TEST-BCR-ABL-JAK2
  - TEST-HBV-SEROLOGY
  - TEST-HCV-ANTIBODY
  - TEST-HIV-SEROLOGY
desired_tests:
  - TEST-BM-ASPIRATE
  - TEST-BM-TREPHINE
  - TEST-ECHO

rationale: >
  Ropeginterferon alfa-2b (Besremi) — long-acting mono-PEGylated
  IFN alfa-2b — is approved 1L cytoreductive for PV regardless of
  HU exposure on basis of PROUD-PV / CONTINUATION-PV phase-3
  (Gisslinger et al., Lancet Haematol 2020). Complete hematologic
  response 71% vs 51% HU at 36 months. Distinct from HU and
  ruxolitinib in disease-modifying potential — substantially
  greater JAK2-V617F allele burden reduction. Particularly
  appropriate for younger fit patients (age <60) seeking
  long-term cytoreductive therapy with disease-modification goal,
  no severe psychiatric history, and ability to tolerate flu-like
  symptoms + thyroid + LFT monitoring. Q2wk SC dosing more
  convenient than weekly PEG-IFNa-2a. CRITICAL: baseline
  psychiatric screen (depression / suicidality boxed warning),
  thyroid panel, LFT, autoantibody screen mandatory. Major
  Ukraine access barrier: not registered.

rationale_ua: >
  Ропегінтерферон альфа-2b (Besremi) — пегільований інтерферон альфа-2b тривалої дії —
  схвалений як цитозниження першої лінії для PV незалежно від попереднього застосування
  HU на підставі досліджень фази 3 PROUD-PV / CONTINUATION-PV (Gisslinger et al.,
  Lancet Haematol 2020). Повна гематологічна відповідь 71% проти 51% на HU через 36
  місяців. Відрізняється від HU та руксолітинібу за потенціалом модифікації перебігу
  захворювання — значно більше зниження алельного тягаря JAK2-V617F. Особливо
  доцільний для молодших придатних пацієнтів (вік <60 років), які прагнуть тривалої
  цитознижувальної терапії з метою модифікації перебігу захворювання, не мають тяжкого
  психіатричного анамнезу та здатні переносити грипоподібні симптоми, а також
  моніторинг функції щитоподібної залози та печінкових проб. Дозування підшкірно раз на
  2 тижні зручніше за щотижневе введення ПЕГ-ІФН-α-2a. КРИТИЧНО ВАЖЛИВО: обов'язковий
  вихідний психіатричний скринінг (депресія/суїцидальність — попередження в інструкції
  для медичного застосування), панель функції щитоподібної залози, печінкові проби,
  скринінг на автоантитіла. Значний бар'єр доступу в Україні: препарат не
  зареєстрований.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_extraction
draft_revision: 1
sources:
  - source_id: SRC-NCCN-MPN-2025
    position: supports
    relevant_quote_paraphrase: "Ropeginterferon alfa-2b is recommended 1L cytoreductive for PV regardless of HU exposure (Cat 1) per PROUD-PV / CONTINUATION-PV"
  - source_id: SRC-PROUD-PV-GISSLINGER-2020
    position: supports
    relevant_quote_paraphrase: "PROUD-PV / CONTINUATION-PV phase-3: ropeginterferon vs HU; CHR 71% vs 51% at 36 mo; substantially greater V617F allele burden reduction"
  - source_id: SRC-ESMO-MPN-2015
    position: supports
    relevant_quote_paraphrase: "Pegylated interferons recommended 1L for PV particularly in younger patients seeking disease-modification"

do_not_do:
  - "НЕ призначати без вихідного психіатричного скринінгу (депресія, суїцидальність) — попередження в інструкції; задокументовані летальні випадки."
  - "НЕ призначати при декомпенсованому захворюванні печінки (Child-Pugh B/C) — ризик автоімунного гепатиту."
  - "НЕ призначати при активному тяжкому автоімунному захворюванні — очікується загострення."
  - "НЕ ігнорувати вихідний ТТГ, панель автоантитіл та повторні печінкові проби — автоімунний тиреоїдит і гепатит є поширеними ускладненнями."
  - "НЕ забувати про аспірин 81-100 мг перорально щодня для профілактики тромбозів (продовження від попереднього етапу лікування PV)."
  - "НЕ продовжувати лікування при тяжкій депресії/суїцидальності — остаточна відміна препарату."
  - "НЕ затверджувати план без визначеного шляху фінансування — препарат не зареєстрований в Україні; за наявності альтернативою є стандартний ПЕГ-ІФН-α-2a (off-label при PV)."

do_not_do_en:
  - "Do NOT prescribe without baseline psychiatric screen (depression, suicidality) — black-box warning, fatal cases documented."
  - "Do NOT prescribe with decompensated liver disease (Child-Pugh B/C) — autoimmune hepatitis risk."
  - "Do NOT prescribe with active severe autoimmune disease — exacerbation expected."
  - "Do NOT ignore baseline TSH + autoantibody panel + serial LFT — autoimmune thyroiditis + hepatitis common."
  - "Do NOT forget aspirin 81-100 mg PO daily for thrombosis prevention (continued from PV pathway)."
  - "Do NOT continue with severe depression / suicidality — permanent discontinuation."
  - "Do NOT confirm plan without funding pathway — drug not registered in Ukraine; standard PEG-IFNa-2a (off-label PV) as alternative if available."
known_controversies:
  - topic: "Ropeginterferon vs HU as 1L for PV in younger patients (<60)"
    positions:
      - position: "Ropeginterferon — disease-modifying potential (V617F allele burden reduction); preferred for younger fit with long-term outlook"
        sources: [SRC-PROUD-PV-GISSLINGER-2020, SRC-NCCN-MPN-2025]
      - position: "HU — cheaper, oral, well-tolerated, decades of experience, similar thrombosis-free survival at 36 months"
        sources: [SRC-NCCN-MPN-2025, SRC-ESMO-MPN-2015]
        evidence_note: "Long-term OS / leukemic transformation outcomes still maturing for ropeginterferon. Cost + access dominant in Ukraine."
    our_default: "HU 1L for most PV (cost, access); ropeginterferon for younger fit (<60) low-risk seeking disease-modification when accessible"
    rationale: "Access defines pathway; disease-modification goal directs choice when access enables it"

time_critical: false
last_reviewed: "2026-04-25"
