  Aggressive-трек (RRSO-declined) альтернатива для RAD51C/RAD51D
  carriers.

  Компоненти:
    - Symptom-driven workup retained.
    - Annual mammography retained з 40 років.
    - Combined hormonal contraception.
    - Cascade testing retained.
    - Re-offer RRSO при кожному visit.

