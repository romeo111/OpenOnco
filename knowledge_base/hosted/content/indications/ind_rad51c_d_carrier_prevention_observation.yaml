desired_tests: []

rationale: >
  Aggressive-track (RRSO-declined) alternative for RAD51C/RAD51D
  carriers.

  Components:
    - Symptom-driven workup retained.
    - Annual mammography retained from age 40.
    - Combined hormonal contraception for pre-RRSO ovarian risk
      reduction.
    - Cascade testing retained.
    - Re-offer RRSO at every visit.

