rationale: >
  Standard-track prevention pathway for RAD51C/RAD51D heterozygous
  carriers per NCCN Genetic/Familial High-Risk Assessment Breast/Ovarian
  + Ovarian 2025. Approaches BRCA-level ovarian penetrance.

  Components:
    - **Ovarian surveillance + RRSO:**
      - No routine population screening.
      - Symptom-driven workup.
      - **RRSO at completed childbearing or age 45-50** per NCCN
        Genetic/Familial 2025.
      - Combined hormonal contraception for pre-RRSO ovarian risk
        reduction.
    - **Breast surveillance:**
      - Annual mammography from age 40 (NCCN moderate-elevated tier
        for RAD51C).
      - Annual breast MRI consideration from age 40 in dense breast +
        family history (modifier-risk subset).
      - Clinical breast examination semi-annually from age 25-30.
    - **Cascade testing:** FDRs offered testing.
    - **Reproductive counseling:** PGT-M available.
    - **Lifestyle:** standard cancer-prevention.

  In Ukraine, multi-gene panel testing via Institute of Genetics;
  RRSO + breast MRI at academic centers.

