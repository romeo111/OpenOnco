expected_outcomes:
  overall_response_rate: >-
    RRSO at completed childbearing or age 45-50 reduces ovarian cancer
    incidence by ~95% (BRCA-style efficacy extrapolation). Enhanced
    breast surveillance with annual mammography + MRI consideration
    shifts breast cancer stage at diagnosis. PARP inhibitor olaparib
    effective in RAD51C/D-mutant established ovarian cancer
    (PROfound, GEN-ALL).

