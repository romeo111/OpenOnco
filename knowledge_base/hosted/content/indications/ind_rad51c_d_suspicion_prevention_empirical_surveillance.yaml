rationale: >
  Aggressive-track companion to IND-RAD51C-D-SUSPICION-PREVENTION-
  TESTING. Patient with pedigree suspicion of germline RAD51C or
  RAD51D carrier state who declines genetic counseling and/or
  panel testing — for any reason (cost, insurance / GINA concerns,
  psychological / cancer-anxiety considerations, family privacy,
  geographic access constraints, religious or cultural objections
  to genetic testing) — is offered empirical management based on
  family history alone:

  **Ovarian symptom-driven workup (primary):**
  - Low threshold for diagnostic pelvic imaging (transvaginal
    ultrasound + abdominopelvic MRI) for any new or persistent
    pelvic symptoms (bloating, early satiety, urinary urgency,
    abdominal-pelvic pain).
  - CA-125 testing for symptomatic patients (not as routine
    screening — UKCTOCS data do not support).
  - Direct gynecologic oncology referral for clinically concerning
    findings.

  **TVUS + CA-125 surveillance (optional, with caveats):**
  - q6 months from age 30-35 may be offered after explicit
    discussion of poor sensitivity (UKCTOCS trial — no mortality
    benefit demonstrated even in BRCA carriers).
  - Should NOT be presented as effective screening — framed as
    "best available proxy" only.

  **Empirical RRSO consideration (more strongly considered than
  for BRIP1-suspicion given BRCA-approaching penetrance):**
  - For RAD51C/D-suspicion patients with strong family history
    (≥2 first/second-degree affected relatives with high-grade
    serous ovarian carcinoma, multi-generation pattern) at
    completed childbearing AND age ≥45, empirical RRSO MAY be
    considered after extensive shared-decision-making — but the
    intervention is irreversible, the family-history-alone risk
    estimation is less precise than genetic-confirmed status,
    and re-offering genetic testing should always precede
    empirical RRSO.
  - For RAD51C/D-suspicion patients with weaker family history
    (single affected relative, late-onset), empirical RRSO is
    NOT recommended.

  **Breast surveillance:** Annual mammography from earliest-
  family-breast-cancer-age minus 10 years (RAD51C has modest
  breast signal; TNBC family-history enrichment may justify MRI
  consideration).

  **Reproductive counseling:** PGT-M for monogenic disorders
  cannot be offered without an identified familial variant —
  patients planning children should be re-offered genetic testing
  in the reproductive-planning context, where the case for PGT-M
  may be especially compelling given the BRCA-approaching
  penetrance.

  **Future cancer treatment counseling:** PARP-inhibitor
  relevance for any future ovarian-cancer diagnosis (PROfound +
  GEN-ALL trials) — this is a downstream consideration but
  reinforces the value of confirmed genetic status if patient
  develops cancer.

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. Patients who decline testing
  retain access to symptom-driven workup and selective
  surveillance, with the explicit caveat that empirical RRSO is
  a high-stakes irreversible intervention best deferred until
  genetic testing has been re-offered. Periodic re-discussion of
  testing is appropriate; this pathway does not preclude future
  testing.

  **Resource-intensity caveat:** TVUS + CA-125 q6 months is
  expensive (~500-1500 UAH per cycle in Ukrainian private centers)
  for limited demonstrated benefit. Empirical RRSO has lifetime
  hormone-replacement-therapy and bone-density implications that
  must be discussed pre-intervention.

rationale_ua: >
  Aggressive-track компаньйон до IND-RAD51C-D-SUSPICION-PREVENTION-
  TESTING. Пацієнт з родовідною підозрою на RAD51C або RAD51D
  carrier state, який відмовляється від генетичного консультування
  та/або панельного тестування, отримує empіричне ведення на основі
  сімейної історії:

  **Ovarian symptom-driven workup (primary):**
  - Низький поріг для diagnostic pelvic imaging при будь-яких
    нових або persistent тазових симптомах.
  - CA-125 при symptomatic пацієнтах (не як routine screening).
  - Direct gynecologic oncology referral для concerning findings.

  **TVUS + CA-125 surveillance (optional, з caveats):**
  - q6 міс з 30-35 років після явного обговорення poor sensitivity.

  **Empіричний RRSO consideration (сильніше враховується ніж
  для BRIP1-suspicion враховуючи BRCA-approaching penetrance):**
  - Для RAD51C/D-suspicion з strong family history (≥2 first/
    second-degree з high-grade serous ovarian, multi-generation
    pattern) при completed childbearing І ≥45 років empіричне
    RRSO МОЖЕ бути розглянуто після extensive shared-decision-
    making — але re-offering genetic testing завжди повинно
    передувати empіричному RRSO.
  - Для weaker family history empіричне RRSO НЕ рекомендоване.

  **Breast surveillance:** Annual mammography з earliest-family-
  breast-cancer-age мінус 10 років.

  **Reproductive counseling:** PGT-M не доступна без identified
  familial variant.

  **Future cancer treatment counseling:** PARP-inhibitor relevance
  для будь-якого майбутнього ovarian-cancer діагнозу.

  Per CHARTER §11 framing автономії пацієнта.

