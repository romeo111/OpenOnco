expected_outcomes:
  overall_response_rate: >-
    Empirical management for RAD51C/D-suspicion patients declining
    testing centers on (1) symptom-driven workup for ovarian/
    abdominal symptoms (low threshold for diagnostic imaging given
    BRCA-approaching family-history-implied risk); (2) optional
    TVUS + CA-125 q6 months explicitly framed as poor-sensitivity
    surveillance (UKCTOCS data — no mortality benefit even in BRCA
    carriers); (3) consideration of empirical RRSO based on family
    history alone — high-stakes decision requiring extensive
    shared-decision-making given the BRCA-approaching penetrance.
    In the RAD51C/D-carrier subset (~10-25% of pedigree-suspicion
    individuals), empirical RRSO timing matches genetic-confirmed
    timing (completed childbearing or 45-50). Outside the carrier
    subset, RRSO is over-treatment.

