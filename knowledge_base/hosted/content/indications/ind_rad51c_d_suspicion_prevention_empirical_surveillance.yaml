do_not_do:
  - "Не презентувати TVUS + CA-125 surveillance як effective screening."
  - "Не виконувати empіричне RRSO без extensive shared-decision-making і повторного offering genetic testing — irreversible intervention з lifetime HRT/bone-density наслідками."
  - "Не пропускати periodic re-discussion про genetic testing — багато пацієнтів врешті приймають тестування у reproductive-planning або pre-RRSO контексті."
  - "Не виконувати empіричне RRSO у пацієнтів з weak family history (single affected relative) — поза evidence base."
  - "Не пропускати PARP-inhibitor counseling як motivator для testing у пацієнтів з reproductive-age cancer concerns."

do_not_do_en:
  - "Do not present TVUS + CA-125 surveillance as effective screening."
  - "Do not perform empirical RRSO without extensive shared-decision-making and re-offering genetic testing — irreversible intervention with lifetime HRT/bone-density sequelae."
  - "Do not skip periodic re-discussion of genetic testing — many patients eventually accept testing in reproductive-planning or pre-RRSO contexts."
  - "Do not perform empirical RRSO in patients with weak family history (single affected relative) — outside the evidence base."
  - "Do not skip PARP-inhibitor counseling as motivator for testing in patients with reproductive-age cancer concerns."

