rationale: >
  Standard-track prevention pathway for individuals with pedigree-
  based suspicion of germline RAD51C or RAD51D carrier state. Two
  parallel referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant for cancer-predisposing
  carrier state; autosomal recessive — RAD51C biallelic Fanconi
  anemia complementation group O, RAD51D more variable —
  distinct from heterozygous carrier state), penetrance (lifetime
  ovarian cancer ~10-15% RAD51C, ~12-20% RAD51D — approaching
  BRCA1/2 levels; modest breast signal RR ~1.5-2.0 for RAD51C
  with some TNBC enrichment), implications for FDRs (cascade
  testing — ~50% of FDRs are also carriers; key consideration is
  identifying female FDRs eligible for RRSO discussion), GINA /
  insurance considerations, reproductive implications (RRSO
  timing considerations relative to childbearing planning are
  central), psychological aspects, PARP-inhibitor relevance for
  any future ovarian-cancer diagnosis. Per ACMG / ASCO / NCCN,
  pre-test counseling by a certified genetic counselor or trained
  clinician is the standard of care before germline testing.

  **(2) Germline multi-gene HBOC panel testing.** Modern panels
  (e.g., Invitae Common Hereditary Cancers panel, Color hereditary
  cancer panel, GeneDx OncoGene Comprehensive, Myriad MyRisk,
  Ambry CancerNext) cover BRCA1, BRCA2, PALB2, CHEK2, ATM, RAD51C,
  RAD51D, BRIP1, plus contextual genes. RAD51C and RAD51D are on
  every modern HBOC panel. Variant classification per ACMG framework.

  **Sequel pathway (positive panel — confirmed RAD51C or RAD51D
  carrier):** Transition to RAD51C/D-carrier surveillance pathway
  (IND-RAD51C-D-CARRIER-PREVENTION-SURVEILLANCE — standard track
  for RF-RAD51C-D-CONFIRMED-CARRIER):
  - RRSO discussion at completed childbearing OR age 45-50,
    whichever later (NCCN Genetic/Familial High-Risk endorsement —
    RAD51C/D approach BRCA-level penetrance, so RRSO recommendation
    is strong).
  - Pre-RRSO TVUS + CA-125 q6 months optionally offered with
    explicit framing as suboptimal vs RRSO.
  - Breast surveillance: individualised by family history — annual
    mammography from age 40 + MRI consideration in additional-risk
    subset (especially RAD51C with TNBC family-history signal).
  - Cascade testing of FDRs for the family-specific variant.
  - Reproductive counseling: PGT-M available for couples planning
    children; RRSO timing relative to family planning is central.
  - Future cancer treatment: PARP inhibitors (olaparib, niraparib,
    rucaparib) active in RAD51C/D-mutant ovarian cancer — relevant
    for any future cancer diagnosis.

  **Sequel pathway (positive panel — BRCA1/2 variant identified):**
  route to BRCA-confirmed carrier pathway (more comprehensive
  surveillance — breast MRI from 25-30, RRSO 35-40 BRCA1 /
  40-45 BRCA2).

  **Sequel pathway (positive panel — BRIP1 variant identified):**
  route to BRIP1-carrier pathway (RRSO at completed childbearing
  or 45-50; less aggressive surveillance than RAD51C/D given
  somewhat lower penetrance).

  **Sequel pathway (positive panel — other variant):** route to
  gene-specific carrier pathway.

  **Sequel pathway (negative panel):** empirical management based
  on family-history-alone risk estimation is offered as the
  aggressive-track alternative
  (IND-RAD51C-D-SUSPICION-PREVENTION-EMPIRICAL-SURVEILLANCE) —
  note that empirical RRSO without confirmed variant is a high-
  stakes intervention; shared-decision-making is paramount.

  **Sequel pathway (VUS):** managed as pedigree-suspicion until
  reclassification.

  In Ukraine, multi-gene panel testing including RAD51C/D is
  available via Institute of Genetics + select private labs
  (~8000-20000 UAH). RRSO is widely available; gynecologic
  oncology consult for RRSO planning recommended.

rationale_ua: >
  Стандартний-трек prevention шлях для осіб з родовідною підозрою
  на гермінативний heterozygous carrier RAD51C або RAD51D. Два
  паралельні направлення:

  **(1) Направлення на генетичне консультування.** Pre-test
  консультування охоплює: спадкування (autosomal dominant для
  cancer-predisposing carrier; autosomal recessive — RAD51C
  biallelic Fanconi anemia complementation group O), пенетрантність
  (lifetime ovarian cancer ~10-15% RAD51C, ~12-20% RAD51D —
  approaching BRCA1/2 levels; modest breast signal RR ~1.5-2.0
  для RAD51C з TNBC enrichment), наслідки для FDRs, GINA /
  страхові міркування, репродуктивні наслідки (RRSO timing relative
  до childbearing planning є central), PARP-inhibitor relevance.

  **(2) Germline мультигенне HBOC панельне тестування.** Сучасні
  панелі покривають RAD51C і RAD51D. Обидва — на every modern
  HBOC панелі.

  **Наступний шлях (позитивна панель — підтверджений RAD51C або
  RAD51D carrier):** перехід на RAD51C/D-carrier surveillance шлях
  (IND-RAD51C-D-CARRIER-PREVENTION-SURVEILLANCE):
  - RRSO discussion при completed childbearing АБО 45-50 років,
    whichever later (NCCN endorsement — RAD51C/D approach BRCA-
    level penetrance, RRSO recommendation strong).
  - Pre-RRSO TVUS + CA-125 q6 міс optionally — explicit framing
    як suboptimal vs RRSO.
  - Breast surveillance: individualised by family history —
    annual mammography з 40 років + MRI consideration у
    additional-risk subset.
  - Cascade testing FDRs.
  - Reproductive counseling: PGT-M доступна.
  - Future cancer treatment: PARP inhibitors активні у RAD51C/D-
    mutant ovarian cancer (PROfound + GEN-ALL trials).

  **Наступний шлях (позитивна панель — BRCA1/2 variant):** route
  на BRCA-confirmed carrier pathway.

  **Наступний шлях (позитивна панель — BRIP1 variant):** route
  на BRIP1-carrier pathway.

  **Наступний шлях (негативна панель):** empіричне ведення на
  основі family-history-alone risk estimation як aggressive-track
  альтернатива (IND-RAD51C-D-SUSPICION-PREVENTION-EMPIRICAL-
  SURVEILLANCE) — empіричне RRSO без confirmed variant — high-
  stakes intervention.

  **Наступний шлях (VUS):** ведеться як родовідна підозра.

  В Україні multi-gene panel включаючи RAD51C/D via Institute of
  Genetics + select private labs (~8000-20000 UAH).

