expected_outcomes:
  overall_response_rate: >-
    Diagnostic yield of multi-gene HBOC panel testing in RAD51C/D-
    suspicion populations: ~10-25% positive carrier identification
    overall (variable by criterion — known-familial-variant cascade
    ~50%, multiple-ovarian-cancer BRCA-negative pedigree ~10-25%,
    multi-generation high-grade serous ovarian pedigree ~15-30%).
    Confirmed RAD51C or RAD51D carriers transition to NCCN-endorsed
    RRSO at completed childbearing or age 45-50. RRSO reduces
    ovarian cancer incidence by ~80-90% and offers documented
    all-cause mortality benefit in BRCA cohorts; extrapolated
    benefit expected in RAD51C/D carriers given comparable lifetime
    risk (~10-20% vs population ~1.5%). PARP inhibitor relevance
    for any future ovarian-cancer diagnosis (PROfound + GEN-ALL
    trials demonstrate HR-deficient activity).

