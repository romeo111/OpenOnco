do_not_do:
  - "Не призначати germline тестування без pre-test консультування — RRSO finality discussion критична."
  - "Не презентувати TVUS + CA-125 surveillance як ефективну альтернативу RRSO — UKCTOCS дані не показують переваги."
  - "Не пропускати RRSO discussion у confirmed RAD51C/D carriers — penetrance approaches BRCA-level і NCCN endorsement strong."
  - "Не використовувати застарілу панель без RAD51C/D — підтвердіть склад панелі перед замовленням."
  - "Не пропускати PARP-inhibitor counseling для confirmed носіїв з будь-яким майбутнім cancer-діагнозом — PROfound + GEN-ALL trials."

do_not_do_en:
  - "Do not order germline testing without pre-test counseling — RRSO finality discussion is critical."
  - "Do not present TVUS + CA-125 surveillance as an effective alternative to RRSO — UKCTOCS data do not show mortality benefit."
  - "Do not skip RRSO discussion in confirmed RAD51C/D carriers — penetrance approaches BRCA-level and NCCN endorsement is strong."
  - "Do not use an outdated panel without RAD51C/D — confirm panel composition before ordering."
  - "Do not skip PARP-inhibitor counseling for confirmed carriers with any future cancer diagnosis — PROfound + GEN-ALL trials."

