rationale: >
  Standard-track prevention pathway for radon-elevated residential exposure. Three components:

  **(1) Radon mitigation** — sub-slab depressurization (the EPA standard), sealing of foundation cracks, increased ventilation. Re-test 24 months post-mitigation to confirm radon levels <4 pCi/L (EPA action threshold).

  **(2) Smoking cessation counseling** — radon-smoking synergy is multiplicative (not additive); smokers with radon-elevated homes carry the highest lung cancer risk. Tobacco cessation is the single most impactful intervention.

  **(3) Annual low-dose CT (LDCT) screening** per USPSTF lung cancer screening criteria adjusted for radon-elevated risk. Standard USPSTF criteria: ages 50-80, ≥20 pack-years smoking history, quit ≤15y. Radon-elevated patients may benefit from screening even with lower pack-year thresholds (individualized).

  Occupational uranium mining or processing exposure carries even higher lung cancer risk — ensure occupational history is captured.

rationale_ua: >
  Стандартний-трек профілактичний підхід для осіб, що проживають в умовах підвищеного
  рівня радону. Три компоненти:

  **(1) Мітигація радону** — підплитова депресуризація (стандарт EPA), герметизація
  тріщин фундаменту, посилена вентиляція. Повторне тестування через 24 місяці після
  мітигації для підтвердження рівня радону <4 pCi/L (порогове значення дії EPA).

  **(2) Консультування щодо відмови від куріння** — синергія радону та куріння є
  мультиплікативною (не адитивною); курці, які проживають у приміщеннях з підвищеним
  рівнем радону, мають найвищий ризик раку легень. Відмова від тютюнопаління —
  найбільш ефективне втручання.

  **(3) Щорічний скринінг за допомогою низькодозової КТ (LDCT)** за критеріями
  скринінгу раку легень USPSTF, скоригованими з урахуванням підвищеного ризику через
  радон. Стандартні критерії USPSTF: вік 50-80 років, ≥20 пачко-років тютюнопаління,
  припинили куріння ≤15 років тому. Пацієнти з підвищеним впливом радону можуть
  отримати користь від скринінгу навіть за нижчих порогів пачко-років
  (індивідуалізовано).

  Професійний вплив (видобуток або переробка урану) пов'язаний із ще вищим ризиком
  раку легень — необхідно ретельно збирати професійний анамнез.

