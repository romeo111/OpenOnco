expected_outcomes:
  overall_response_rate: "Radon mitigation (sub-slab depressurization, ventilation) reduces indoor radon by ~50-80% (EPA). Lung cancer attributable risk from residential radon: ~10-15% in non-smokers and ~50% multiplicative interaction with smoking. Combined mitigation + smoking cessation + LDCT screening produces meaningful incidence + mortality reduction in elevated-radon residential settings."

