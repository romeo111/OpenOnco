do_not_do:
  - "Не пропускати повторне тестування на радон через 24 місяці після мітигації — мітигація може бути неповною."
  - "Не вважати відмову від куріння та мітигацію радону взаємозамінними — необхідні обидва заходи."
  - "Не використовувати рентгенографію грудної клітки замість LDCT для скринінгу раку легень — LDCT має значно вищу чутливість."
  - "Не розпочинати LDCT-скринінг без обговорення ризику випадкових знахідок (у 50% випадків LDCT виявляє знахідку, що потребує подальшого спостереження)."

do_not_do_en:
  - "Do not skip radon re-testing 24 months post-mitigation — mitigation may be incomplete."
  - "Do not treat tobacco cessation and radon mitigation as alternatives — both are needed."
  - "Do not use chest X-ray instead of LDCT for lung cancer screening — LDCT has significantly higher sensitivity."
  - "Do not start LDCT screening without discussing incidental-findings risk (50% of LDCTs have an incidental finding requiring follow-up)."

