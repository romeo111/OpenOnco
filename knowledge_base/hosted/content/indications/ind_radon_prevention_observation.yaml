id: IND-RADON-PREVENTION-OBSERVATION
plan_track: surveillance
intent: prevention

applicable_to:
  disease_id: DIS-NSCLC
  stage_requirements: []
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 3

triggered_by_redflags:
  - RF-RADON-MALIGNANCY-PREVENTION

recommended_regimen: null
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: "Without radon mitigation: continued elevated lung cancer risk. Routine general-population USPSTF screening (no radon-adjustment) captures some early-stage cases but lower sensitivity than radon-adjusted LDCT schedule."

hard_contraindications: []
red_flags_triggering_alternative: []
required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-RADON-PREVENTION-MITIGATION-AND-SCREENING.
  Patient declines radon mitigation (cost, rental status, structural constraints)
  but accepts routine general-population USPSTF lung screening cadence. Smoking
  cessation counseling continues. Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Альтернативний варіант ведення, що доповнює IND-RADON-PREVENTION-MITIGATION-
  AND-SCREENING. Пацієнт відмовляється від усунення радону (через вартість,
  статус оренди житла, структурні обмеження), але погоджується на стандартний
  графік скринінгу раку легені за USPSTF для загальної популяції. Консультування
  щодо відмови від куріння триває. Відповідає принципу автономії пацієнта згідно
  з CHARTER §11.

ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_v03_completion
draft_revision: 2

sources:
  - source_id: SRC-NCCN-BCELL-2025
    position: context

do_not_do:
  - "Не подавати спостереження без усунення радону як рівноцінну альтернативу усуненню радону в поєднанні з LDCT-скринінгом — зниження захворюваності в такому разі не доведено."
  - "Не пропускати консультування щодо відмови від куріння — це найефективніша інтервенція незалежно від того, чи проведено усунення радону."
  - "Не застосовувати цей підхід для осіб, які професійно контактують з ураном (наприклад, шахтарів уранових родовищ) — їхній ризик істотно вищий, і їм потрібне агресивніше спостереження."

do_not_do_en:
  - "Do not present observation as equivalent to mitigation + LDCT — incidence-reduction is absent."
  - "Do not skip smoking cessation counseling — it is the most impactful intervention regardless of mitigation status."
  - "Do not use this pathway in occupational uranium miners — their risk is substantially higher, aggressive surveillance is needed."

