rationale: >
  Standard-track counseling + screening for reproductive-history-elevated cancer
  risk. Components:

  **(1) Risk stratification** — Gail / BCSC / Tyrer-Cuzick risk calculator for
  invasive breast cancer 5y/lifetime risk. Some risk factors are non-modifiable
  (menarche, menopause age), but cumulative risk informs surveillance intensity.

  **(2) HRT minimization** — combined HRT use ≥5y elevates breast cancer risk
  modestly + significantly elevates endometrial cancer risk (unopposed
  estrogen in women with intact uterus is contraindicated). Estrogen-only HRT
  in post-hysterectomy women has more favorable profile.

  **(3) PCOS / anovulation management** — progesterone challenge or combined OCP
  in chronic anovulation reduces endometrial cancer risk substantially.

  **(4) Chemoprevention discussion** for high-risk women — tamoxifen 20mg/d ×5y
  OR raloxifene 60mg/d ×5y (postmenopausal); aromatase inhibitors are
  alternatives. Reduces hormone-receptor-positive breast cancer incidence by
  ~50% but with thromboembolic / endometrial cancer / vasomotor side effects.
  USPSTF Grade B recommendation for women at high risk per accepted models.

  **(5) Screening adherence** — annual mammography per USPSTF (age 40-74);
  endometrial cancer awareness (post-menopausal bleeding evaluation immediate).

rationale_ua: >
  Стандартний трек консультування та скринінгу для ризику, підвищеного
  репродуктивним анамнезом. Компоненти:

  **(1) Стратифікація ризику** — калькулятор ризику Gail / BCSC / Tyrer-Cuzick
  для оцінки 5-річного та довічного ризику інвазивного раку молочної залози.
  Частина факторів ризику є немодифікованими (вік менархе, вік менопаузи),
  але сукупний ризик визначає інтенсивність спостереження.

  **(2) Мінімізація ЗГТ** — застосування комбінованої замісної гормональної
  терапії (ЗГТ) ≥5 років помірно підвищує ризик раку молочної залози та
  суттєво підвищує ризик раку ендометрія (некомпенсована естрогенна терапія
  у жінок зі збереженою маткою протипоказана). Естроген-монотерапія ЗГТ у
  жінок після гістеректомії має сприятливіший профіль.

  **(3) Ведення СПКЯ / ановуляції** — прогестеронова проба або комбіновані
  оральні контрацептиви при хронічній ановуляції суттєво знижують ризик
  раку ендометрія.

  **(4) Обговорення хіміопрофілактики** для жінок високого ризику — тамоксифен
  (tamoxifen) 20 мг/добу ×5 років АБО ралоксифен (raloxifene) 60 мг/добу
  ×5 років (у постменопаузі); інгібітори ароматази є альтернативою. Знижує
  захворюваність на гормон-рецептор-позитивний рак молочної залози приблизно
  на 50%, але з тромбоемболічними, ендометріальними та вазомоторними
  побічними ефектами. Рекомендація USPSTF класу B для жінок високого ризику
  за визнаними моделями.

  **(5) Дотримання скринінгу** — щорічна мамографія за USPSTF (вік 40-74
  роки); настороженість щодо раку ендометрія (негайне обстеження при
  постменопаузальній кровотечі).

