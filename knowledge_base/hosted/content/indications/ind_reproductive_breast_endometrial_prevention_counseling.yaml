do_not_do:
  - "Не призначати некомпенсовану естрогенну ЗГТ жінкам зі збереженою маткою — це підвищує ризик раку ендометрія."
  - "Не використовувати хіміопрофілактику в групі низького ризику — тягар побічних ефектів перевищує користь."
  - "Не ігнорувати постменопаузальну кровотечу — потрібне негайне взяття зразка ендометрія (біопсія)."

do_not_do_en:
  - "Do not prescribe unopposed estrogen HRT to women with intact uterus — endometrial cancer risk."
  - "Do not use chemoprevention in a low-risk cohort — side-effect burden exceeds benefit."
  - "Do not ignore post-menopausal bleeding — immediate endometrial sampling."

