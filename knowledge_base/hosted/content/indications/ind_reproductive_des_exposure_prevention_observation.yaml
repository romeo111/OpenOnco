expected_outcomes:
  overall_response_rate: >-
    Less-intensified pathway for DES-exposed daughters who decline annual
    cytology + accept the residual risk: alternative is general-
    population cervical screening every 3 years per USPSTF, with
    intensified breast surveillance retained. Suboptimal for CCAC early
    detection given the ~40-fold relative risk — counseling should
    emphasize quantitative trade-offs.

