    relevant_quote_paraphrase: >-
      "General-population cervical cancer screening at 3-year intervals
      with cytology alone, age 21-65. DES-exposed daughters fall outside
      the average-risk population and standard-population recommendations
      do not apply directly."

do_not_do:
  - "Не дозволяти 3-річний interval без явного patient acknowledgment квантифікованого elevated ризику."
  - "Не пропускати mammography з 40 років — breast component non-negotiable."

do_not_do_en:
  - "Do not permit 3-year interval without explicit patient acknowledgment of the quantified elevated risk."
  - "Do not skip mammography from age 40 — the breast component is non-negotiable."

known_controversies:
  - topic: "USPSTF average-risk schedule applicability to DES-exposed cohort"
    positions:
      - position: "USPSTF 3-year cytology applies"
        rationale: "No formal exclusion of DES cohort from USPSTF 2018; pragmatic choice when annual schedule is declined."
      - position: "Annual cytology required"
        rationale: "DES-exposed daughters have ~40x CCAC risk; average-risk schedule not formally validated for this cohort."
    our_default: "Default to annual cytology unless explicitly declined after shared decision-making."
    rationale: "Standard pathway recommends annual; this observation pathway exists only with documented patient acceptance of higher residual risk."

