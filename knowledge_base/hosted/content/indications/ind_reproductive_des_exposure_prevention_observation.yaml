rationale: >
  Aggressive-track alternative for DES-exposed daughters who, after
  shared decision-making, prefer less-frequent cervical/vaginal
  surveillance. The default standard-track pathway (annual cytology +
  colposcopy threshold) is markedly preferred for the absolute-risk
  reduction it provides; this alternative pathway exists to honor
  patient autonomy and document the trade-off explicitly.

  Components:
    - Cervical cytology every 3 years per USPSTF 2018 general-population
      schedule (NOT the annual schedule of the standard pathway).
    - Pelvic exam annually with vaginal-wall inspection retained.
    - Mammography from age 40 retained (the breast surveillance
      intensification is non-negotiable given the 2-fold lifetime
      risk).
    - Symptom-driven workup for any abnormal bleeding or new pelvic
      mass.

  Documentation must include explicit patient acknowledgment of the
  elevated CCAC risk and the absolute-risk increase of choosing the
  3-year vs annual cytology interval. Re-evaluate annually for
  patient preference change.

rationale_ua: >
  Aggressive-трек альтернатива для DES-exposed дочок які після shared
  decision-making надають перевагу less-frequent cervical/vaginal
  surveillance. Default стандартний шлях (щорічна cytology + colposcopy
  threshold) markedly preferred за абсолютне ризик-зниження; ця
  альтернатива існує для пошани patient autonomy + explicit документації
  trade-off.

  Компоненти:
    - Cervical cytology кожні 3 роки per USPSTF 2018 general-population
      schedule (НЕ щорічна standard pathway).
    - Pelvic exam щорічно з vaginal-wall inspection.
    - Mammography з 40 років (breast surveillance intensification
      non-negotiable за 2-кратний lifetime ризик).
    - Symptom-driven workup при abnormal bleeding або new pelvic mass.

  Документація має включати explicit patient acknowledgment elevated
  CCAC ризику + абсолютне ризик-збільшення 3-річного vs щорічного
  cytology interval. Re-evaluate щорічно.

