rationale: >
  Standard-track prevention pathway for daughters with confirmed
  in-utero DES exposure (mother prescribed DES 1940-1978 during the
  pregnancy that resulted in this daughter). Surveillance is intensified
  vs general-population schedules given the ~40-fold CCAC risk + ~2-fold
  breast cancer risk.

  **Gynecologic surveillance:**
    - Annual pelvic examination with careful inspection + palpation of
      the entire vagina + cervix (CCAC arises in upper third of vagina
      and cervix; can be missed by routine speculum). Inspect for
      vaginal adenosis (red ectopic columnar epithelium) as marker of
      DES effect.
    - Cervical + vaginal cytology annually from age of first
      intercourse or age 14 (whichever is earlier), not the general-
      population every-3-years interval per USPSTF 2018 because DES
      exposure raises pretest probability of CCAC.
    - Colposcopy with iodine-staining (Schiller test) if any abnormal
      cytology or visible lesion.
    - Endometrial sampling for any abnormal bleeding (uterine anomalies
      such as T-shaped uterus increase obstetric complications but do
      not themselves elevate endometrial cancer risk above general
      population).

  **Breast surveillance:**
    - Begin mammographic screening at age 40 (not age 50 or shared-
      decision-age-45 per USPSTF 2024) per NCCN modifier-risk pathway.
    - Annual mammography; supplemental MRI if additional risk factors
      (family history of BRCA-related cancers, dense breast tissue).
    - Clinical breast examination annually from age 25.

  **Vulvar surveillance:**
    - Inspection at every pelvic examination — DES-exposed daughters
      have small increase in vulvar squamous neoplasia risk (mechanism
      uncertain but observed in cohort follow-up).

  **Reproductive counseling (if planning pregnancy):**
    - Maternal-fetal medicine consultation — DES uterine anomalies
      increase rates of ectopic pregnancy, miscarriage, preterm labor,
      stillbirth.

  **Lifestyle interventions:**
    - Avoid post-menopausal combined HRT (additive estrogen exposure;
      DES-exposed women are already at elevated baseline breast cancer
      risk).
    - Standard cancer-prevention lifestyle (no tobacco, limit alcohol,
      maintain healthy BMI, physical activity).

  **DES-exposed mothers:** also receive intensified breast surveillance
  (annual mammography from age 40, MRI in dense-breast subset). No
  additional gynecologic surveillance beyond general-population schedule
  in mothers.

  In Ukraine, DES was used in the Soviet era (~1950s-1970s); cohort size
  is uncertain. History-taking is the only practical identification
  method. Cervical/vaginal cytology + colposcopy widely available; MRI
  breast screening at major centres in Kyiv, Lviv, Odesa, Kharkiv.

rationale_ua: >
  Стандартний-трек prevention шлях для дочок з підтвердженою in-utero
  DES експозицією (мати призначила DES 1940-1978 під час вагітності, що
  закінчилася народженням цієї дочки). Surveillance інтенсифікована vs
  general-population schedules з огляду на ~40-кратний CCAC ризик +
  ~2-кратний breast cancer ризик.

  **Gynecologic surveillance:**
    - Щорічний pelvic exam з ретельною інспекцією + пальпацією усієї
      вагіни + шийки матки (CCAC виникає у верхній третині вагіни/
      шийки; може бути пропущена rutiной speculum). Інспекція vaginal
      adenosis.
    - Cervical + vaginal cytology щорічно з віку першого статевого
      контакту або 14 років (раніше), не every-3-years per USPSTF 2018.
    - Colposcopy зі Schiller-тестом при abnormal cytology або visible
      lesion.
    - Endometrial sampling при abnormal bleeding.

  **Breast surveillance:**
    - Mammography з 40 років (не 50 per USPSTF 2024) per NCCN modifier-
      risk шлях.
    - Щорічна mammography; supplemental MRI при додаткових ризик-
      факторах.
    - Clinical breast exam щорічно з 25 років.

  **Vulvar surveillance:** інспекція при кожному pelvic exam.

  **Reproductive counseling:** maternal-fetal medicine при плануванні
  вагітності — DES uterine anomalies підвищують ектопічну вагітність,
  миск, preterm labor, stillbirth.

  **Lifestyle:**
    - Уникати post-menopausal combined HRT.
    - Standard cancer-prevention lifestyle.

  **DES-exposed матері:** інтенсифікований breast surveillance.

  В Україні DES використовувався у радянський період (~1950-1970);
  cohort size невідомий. History-taking — єдиний практичний метод.
  Cervical/vaginal cytology + colposcopy широко доступні; MRI breast
  screening у Києві, Львові, Одесі, Харкові.

