sources:
  - source_id: SRC-NCCN-BREAST-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Women with in-utero DES exposure are categorized as elevated breast
      cancer risk and may be candidates for screening MRI in addition to
      mammography, starting at younger ages than population screening."
  - source_id: SRC-NCCN-CERVICAL-2025
    position: supports
    relevant_quote_paraphrase: >-
      "DES-exposed daughters require annual cervical + vaginal cytology
      with colposcopy as indicated due to elevated clear-cell adenocarcinoma
      risk in the upper vagina and cervix."

do_not_do:
  - "Не пропускати careful vaginal-wall inspection — CCAC у верхній третині вагіни легко пропустити rutinный speculum-exam."
  - "Не використовувати combined HRT у post-menopausal DES-exposed жінок — компаундує підвищений baseline breast cancer ризик."
  - "Не відкладати mammography до 50 років — починати з 40 per NCCN modifier-risk шлях."
  - "Не пропускати colposcopy при abnormal cytology — поріг для colposcopy нижчий, ніж у general population з огляду на pre-test ймовірність."

do_not_do_en:
  - "Do not skip careful vaginal-wall inspection — CCAC in the upper third of the vagina is easily missed on routine speculum exam."
  - "Do not use combined HRT in post-menopausal DES-exposed women — compounds elevated baseline breast cancer risk."
  - "Do not delay mammography to age 50 — begin at 40 per NCCN modifier-risk pathway."
  - "Do not skip colposcopy for abnormal cytology — threshold for colposcopy is lower than general population given elevated pretest probability."

