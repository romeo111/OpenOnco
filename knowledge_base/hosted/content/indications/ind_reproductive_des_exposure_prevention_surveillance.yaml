expected_outcomes:
  overall_response_rate: >-
    Intensified gynecologic + breast surveillance in DES-exposed daughters
    shifts CCAC (clear-cell adenocarcinoma) stage at diagnosis from
    advanced-stage III/IV with 30-50% 5y OS to early-stage I with 80-95%
    5y OS, and shifts breast cancer stage at diagnosis with similar
    early-stage advantage given doubled lifetime risk.

