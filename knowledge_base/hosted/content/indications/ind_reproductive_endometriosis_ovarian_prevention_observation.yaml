strength_of_recommendation: conditional
nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Plain symptom-awareness + no organized surveillance pathway for
    endometriosis-only ovarian cancer risk. Outcomes track general-
    population endometriosis cohort; absolute lifetime risk ~1.8% (vs
    1.3% general population). Acceptable when patient declines further
    surveillance after counseling on the modest absolute risk and the
    absence of effective screening tools.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (less surveillance) alternative for endometriosis
  patients without additional ovarian-cancer risk factors who, after
  shared decision-making, prefer not to enter a structured endometrioma-
  monitoring pathway.

  Components:
    - Symptom education only — persistent (≥12 days/month) abdominal
      bloating, early satiety, urinary frequency/urgency, pelvic pain
      new or escalated → prompt evaluation.
    - No scheduled imaging.
    - Continue medical management of endometriosis per gynecology
      (combined hormonal contraception, levonorgestrel IUD, GnRH
      analogues as appropriate for symptom control + fertility
      considerations).
    - Re-evaluate annually; transition to standard-track surveillance
      if new endometrioma, deep infiltrating disease, or family history
      change.

  Acceptable when baseline absolute risk is low and the patient is
  fully informed.

rationale_ua: >
  Aggressive-трек (менше surveillance) альтернатива для endometriosis
  пацієнток без додаткових ovarian-cancer ризик-факторів які після
  shared decision-making надають перевагу не входити у structured
  endometrioma-monitoring шлях.

  Компоненти:
    - Symptom education only.
    - Без scheduled imaging.
    - Продовжити medical management endometriosis per gynecology.
    - Re-evaluate щорічно; transition до standard-track surveillance
      при new endometrioma, deep infiltrating disease, або зміні family
      history.

  Acceptable коли baseline абсолютний ризик низький + пацієнтка повністю
  інформована.

