sources:
  - source_id: SRC-NCCN-OVARIAN-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Population screening for ovarian cancer with CA-125 + TVUS is not
      recommended. Risk-reducing salpingectomy is endorsed at completed
      childbearing or at hysterectomy for benign indications. BSO is
      reserved for higher-risk germline cohorts."
  - source_id: SRC-ESMO-OVARIAN-2024
    position: supports
    relevant_quote_paraphrase: >-
      "Endometriosis confers a modest but reproducible increase in
      ovarian cancer risk for clear-cell and endometrioid histologies;
      surveillance is symptom-driven, not screening-driven."

do_not_do:
  - "Не використовувати CA-125 + TVUS як screening tests у endometriosis cohort — population screening не покращує ovarian cancer mortality."
  - "Не виконувати risk-reducing BSO на основі endometriosis alone — systemic harms перевищують benefit; reserved для germline-high-risk."
  - "Не пропускати germline multigene panel у endometriosis-associated ovarian cancer — впливає на сімейне cascade-testing."

do_not_do_en:
  - "Do not use CA-125 + TVUS as screening tests in the endometriosis cohort — population screening does not improve ovarian cancer mortality."
  - "Do not perform risk-reducing BSO on the basis of endometriosis alone — systemic harms outweigh benefit; reserve for germline-high-risk."
  - "Do not skip germline multigene panel in endometriosis-associated ovarian cancer — affects family cascade-testing."

known_controversies:
  - topic: "Opportunistic salpingectomy mortality benefit in endometriosis subgroup"
    positions:
      - position: "Endorse opportunistic salpingectomy"
        rationale: "SGO + ACOG 2024 endorsement based on tubal-origin theory of HGSOC and observed ~50% ovarian cancer risk reduction in opportunistic-salpingectomy cohorts."
      - position: "Insufficient endometriosis-specific data"
        rationale: "Mortality reduction data are general-population not endometriosis-stratified; absolute benefit smaller given lower baseline risk."
    our_default: "Endorse opportunistic salpingectomy at completed-childbearing benign hysterectomy."
    rationale: "Low marginal harm + mechanistically sound + endorsed by major bodies."

