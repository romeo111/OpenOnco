rationale: >
  Standard-track prevention pathway for endometriosis-associated ovarian
  cancer risk. Importantly, NO population screening for ovarian cancer
  exists — CA-125 + TVUS combinations have repeatedly failed to improve
  ovarian cancer mortality even in higher-risk cohorts (PLCO, UKCTOCS
  long-term follow-up). Surveillance for endometriosis-associated risk
  is therefore symptom-driven + opportunistic risk reduction.

  Components:
    - **Symptom education:** persistent (≥12 days/month) abdominal
      bloating, early satiety, urinary frequency/urgency, pelvic pain
      that is new or escalated beyond baseline endometriosis pain —
      these prompt urgent pelvic exam + TVUS + CA-125 (per ACOG/SGO
      symptom-index workup, not screening tests).
    - **Endometrioma monitoring:** known endometrioma — TVUS at
      endometriosis-specialist or gynecologic-oncology centre at
      diagnosis + every 6-12 months; suspicious change in size,
      vascularity, solid components → surgical assessment.
    - **Risk-reducing salpingectomy:** strongly consider at hysterectomy
      for benign indications + at completed childbearing (Society of
      Gynecologic Oncology + ACOG 2024 endorsement); spares ovaries for
      hormonal function while removing fallopian-tube fimbriae (origin
      of most high-grade serous ovarian cancers).
    - **Risk-reducing BSO:** reserved for patients with additional
      risk factors (BRCA1/2, Lynch, strong family history of ovarian
      cancer); NOT recommended on basis of endometriosis alone given
      systemic harms (early menopause, cardiovascular + bone +
      cognitive consequences).
    - **Medical management of endometriosis:** combined hormonal
      contraception, levonorgestrel IUD, GnRH analogues — these
      treatments suppress endometriosis activity + may modestly reduce
      ovarian cancer risk per observational cohorts but not yet RCT-
      proven for risk reduction.

  **Hereditary work-up:** all women with endometriosis-associated
  ovarian cancer (regardless of histology) should have germline
  multigene panel (NCCN Ovarian 2025); back-translate findings to
  unaffected first-degree relatives via cascade testing.

  In Ukraine, endometriosis is widely recognized in gynecologic
  practice; opportunistic salpingectomy uptake increasing at major
  centres. Genetic-counseling capacity is growing but uneven.

rationale_ua: >
  Стандартний-трек prevention шлях для endometriosis-associated ovarian
  cancer ризику. Важливо: НЕМАЄ population screening для ovarian cancer —
  CA-125 + TVUS combinations repeatedly не покращили ovarian cancer
  mortality навіть у higher-risk cohorts (PLCO, UKCTOCS long-term).
  Surveillance для endometriosis-associated ризику — symptom-driven +
  opportunistic ризик-зниження.

  Компоненти:
    - **Symptom education:** persistent (≥12 днів/міс) abdominal
      bloating, early satiety, urinary frequency/urgency, pelvic pain
      який новий або escalated beyond baseline endometriosis pain —
      урgentний pelvic exam + TVUS + CA-125.
    - **Endometrioma monitoring:** TVUS у endometriosis-specialist або
      gyn-onc centre при діагнозі + кожні 6-12 міс; suspicious change
      → surgical assessment.
    - **Risk-reducing salpingectomy:** strongly consider при hysterectomy
      для benign indications + при completed childbearing.
    - **Risk-reducing BSO:** reserved для пацієнток з додатковими ризик-
      факторами (BRCA1/2, Lynch, strong family history); НЕ recommended
      на основі endometriosis alone.
    - **Medical management endometriosis:** combined hormonal
      contraception, levonorgestrel IUD, GnRH analogues.

  **Hereditary work-up:** всі жінки з endometriosis-associated ovarian
  cancer мають germline multigene panel (NCCN Ovarian 2025); cascade
  testing для first-degree родичів.

  В Україні endometriosis широко recognized; opportunistic salpingectomy
  uptake зростає у major centres. Genetic-counseling capacity нерівна.

