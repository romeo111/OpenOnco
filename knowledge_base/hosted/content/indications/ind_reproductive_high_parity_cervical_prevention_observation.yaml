  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (declined or unavailable surveillance) alternative —
  used to document the gap and route the patient toward symptom-
  awareness only when structured screening / vaccination is declined or
  inaccessible.

  Components:
    - Symptom education: any abnormal bleeding (post-coital,
      intermenstrual, post-menopausal), persistent vaginal discharge,
      pelvic pain → immediate pelvic exam + speculum + cytology.
    - Smoking cessation counseling at every encounter.
    - Re-offer cervical screening + HPV vaccination at every encounter.
    - Document patient autonomy + ensure they have informed consent
      regarding the absolute-risk increase.

  Particularly important in low-resource settings where this may be
  the only achievable pathway pending screening-infrastructure rollout.

rationale_ua: >
  Aggressive-трек (відмова або недоступність surveillance) альтернатива
  — використовується для документації gap + routing пацієнтки до
  symptom-awareness only коли structured screening / vaccination
  declined або недоступне.

  Компоненти:
    - Symptom education: any abnormal bleeding (post-coital,
      intermenstrual, post-menopausal), persistent vaginal discharge,
      pelvic pain → immediate pelvic exam + speculum + cytology.
    - Smoking cessation counseling при кожному encounter.
    - Re-offer cervical screening + HPV vaccination при кожному
      encounter.
    - Документувати patient autonomy + ensure informed consent.

  Особливо важливо у low-resource settings де це може бути єдиний
  achievable шлях pending screening-infrastructure rollout.

