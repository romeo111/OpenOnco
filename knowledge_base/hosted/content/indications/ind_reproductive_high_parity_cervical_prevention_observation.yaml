expected_outcomes:
  overall_response_rate: >-
    Patient-acceptance pathway (declines vaccination, declines structured
    screening). Outcomes track unscreened cervical-cancer mortality
    (much higher than screened cohorts). Acceptable only with explicit
    documented patient understanding + ongoing offer of standard pathway
    at each subsequent encounter.

