expected_outcomes:
  overall_response_rate: >-
    Standard USPSTF-aligned cervical screening + catch-up HPV vaccination
    + smoking cessation in high-parity HPV-positive cohort shifts
    cervical cancer stage at diagnosis from advanced to early (5y OS
    >90% for early-stage vs 17-50% for advanced). HPV vaccination of
    HPV-naive partners interrupts transmission. Excess relative risk from
    high parity is greatest where screening + vaccination are weakest.

