sources:
  - source_id: SRC-NCCN-CERVICAL-2025
    position: supports
    relevant_quote_paraphrase: >-
      "High parity, long-term oral contraceptive use, and tobacco use
      are co-factors in HPV-driven cervical carcinogenesis; cervical
      screening is recommended per USPSTF schedule with attention to
      access in higher-risk subgroups."
  - source_id: SRC-USPSTF-CERVICAL-2018
    position: supports
    relevant_quote_paraphrase: >-
      "Average-risk cervical cancer screening: cytology alone every
      3 years for ages 21-29; HPV primary or co-testing every 5 years
      or cytology every 3 years for ages 30-65."

do_not_do:
  - "Не пропускати catch-up HPV vaccination — корисна навіть після впливу певних HPV-типів."
  - "Не відмовлятися від screening на основі попередньої hysterectomy без знання cervix-збереження + premalignancy history."
  - "Не використовувати high-parity сам по собі як indication для off-schedule screening у HPV-негативних жінок — schedule per USPSTF застосовується."

do_not_do_en:
  - "Do not skip catch-up HPV vaccination — beneficial even after exposure to some HPV types."
  - "Do not waive screening on the basis of prior hysterectomy without knowing cervix-preservation status + premalignancy history."
  - "Do not use high parity alone as an indication for off-schedule screening in HPV-negative women — USPSTF schedule applies."

