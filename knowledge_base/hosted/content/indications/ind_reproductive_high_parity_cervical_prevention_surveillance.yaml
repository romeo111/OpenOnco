rationale: >
  Standard-track prevention pathway for high-parity (≥5 full-term
  pregnancies) women in whom HPV exposure history + parity-related
  hormonal exposure compound cervical cancer risk. Note: this RF
  expects HPV co-positivity to be material — high parity alone in HPV-
  negative women is not by itself an indication for off-schedule
  screening, but the pretest probability of HPV positivity rises with
  parity, particularly in settings where vaccination is incomplete.

  Components:
    - **Cervical screening per USPSTF 2018 / WHO 2021:**
      - Age 21-29: cytology alone every 3 years.
      - Age 30-65: HPV primary screening every 5 years OR co-testing
        (cytology + HPV) every 5 years OR cytology alone every 3 years.
    - **Catch-up HPV vaccination through age 45 per ACIP shared-decision-
      making** if not previously vaccinated. Effectiveness drops with
      age and prior HPV exposure but remains beneficial for previously-
      uninfected HPV types.
    - **Smoking cessation:** synergistic risk factor; pharmacotherapy +
      counseling as needed.
    - **Treat cervical precancer aggressively per LSIL/HSIL guidelines**
      (LEEP, cone biopsy as indicated); recurrence rates higher in this
      cohort, so post-treatment HPV testing schedule may be tightened
      (HPV + cytology at 6, 12, 24 months per ASCCP 2019).
    - **Partner counseling:** HPV vaccination of male partners through
      age 45 reduces transmission.

  In Ukraine, cervical cancer mortality is among the highest in Europe
  (Globocan 2022) and screening + HPV vaccination coverage remain
  suboptimal. High-parity cohort overlaps with rural + lower-SES groups
  with the weakest screening access — addressing access is the largest-
  effect intervention. NSZU covers cytology + HPV testing; HPV
  vaccination is recommended but coverage is incomplete.

rationale_ua: >
  Стандартний-трек prevention шлях для high-parity (≥5 full-term
  вагітностей) жінок у яких HPV expose history + parity-related
  hormonal exposure компаундують cervical cancer ризик. Замітка: цей RF
  очікує HPV ко-позитивність як material — high parity alone у HPV-
  негативних жінок сам по собі не є indication для off-schedule
  screening, але pretest ймовірність HPV positivity зростає з parity,
  особливо у settings де vaccination неповне.

  Компоненти:
    - **Cervical screening per USPSTF 2018 / WHO 2021:**
      - Вік 21-29: cytology alone кожні 3 роки.
      - Вік 30-65: HPV primary screening кожні 5 років АБО co-testing
        кожні 5 років АБО cytology alone кожні 3 роки.
    - **Catch-up HPV vaccination через 45 років per ACIP shared-
      decision-making** якщо раніше не вакцинована.
    - **Smoking cessation:** synergistic ризик-фактор.
    - **Treat cervical precancer aggressively per LSIL/HSIL guidelines**
      (LEEP, cone biopsy); recurrence rates вищі у цьому когорті, тому
      post-treatment HPV testing schedule може бути tightened (HPV +
      cytology у 6, 12, 24 міс per ASCCP 2019).
    - **Partner counseling:** HPV vaccination male partners через 45
      років зменшує transmission.

  В Україні cervical cancer mortality серед найвищих у Європі (Globocan
  2022); screening + HPV vaccination coverage залишаються suboptimal.
  High-parity cohort перекривається з rural + lower-SES групами зі
  слабшим доступом до screening — addressing access — найбільший-effect
  intervention. NSZU покриває cytology + HPV testing; HPV vaccination
  рекомендована але coverage неповне.

