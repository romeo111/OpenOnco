do_not_do:
  - "Не подавати терміни репродуктивного вибору як «помилку» — консультування має бути орієнтованим на майбутнє й фокусуватися на модифікованих факторах."
  - "Не пропускати оцінку потреби в генетичному консультуванні — фактори ризику за сімейним анамнезом окремі, але часто перетинаються в сім'ях із раком молочної залози в молодому віці."
  - "Не призначати раніший скринінг раку молочної залози лише на підставі цього кластера факторів ризику в жінок середнього ризику без обтяженого сімейного анамнезу — застосовується стандартний графік USPSTF."
  - "Не делегувати підтримку грудного вигодовування спеціалістам без досвіду консультування з лактації без надання відповідного ресурсу — це основна перешкода для успішного грудного вигодовування."

do_not_do_en:
  - "Do not present reproductive timing as a 'mistake' — counsel forward-looking, modifiable factors."
  - "Do not skip genetic counseling assessment — family-history RFs are separate but overlap in diagnosed-young families."
  - "Do not order earlier breast cancer screening cadence based on this RF cluster alone in average-risk women without family history — USPSTF cadence applies."
  - "Do not delegate breastfeeding support to non-lactation-consultant without providing the resource — a major barrier to breastfeeding success."

