rationale: >
  Standard-track prevention pathway for late-first-pregnancy + short-
  breastfeeding combination. Components per ACOG + AAP + USPSTF +
  NCCN Breast Cancer Screening:

  **(1) Breastfeeding promotion (forward-looking)** — In current or
  subsequent pregnancies, support exclusive breastfeeding ≥6 months +
  continued breastfeeding through ≥12 months per WHO + AAP. Lactation
  consultant referral for any breastfeeding difficulty. Each 12 months
  of cumulative lifetime breastfeeding reduces breast cancer risk ~4%.

  **(2) Modifiable cancer-protective lifestyle counseling** — Since
  reproductive timing cannot be reversed, double-down on modifiable
  factors:
  - Alcohol: ≤1 drink/day (less is better; each drink/day adds ~7-10%
    breast cancer risk)
  - Physical activity: ≥150 min/week moderate per HHS guidelines
  - Weight management: maintain healthy BMI post-menopause (most-
    impactful single modifiable factor)
  - Mediterranean dietary pattern

  **(3) Breast cancer screening per USPSTF cadence + family history
  modification** —
  - Mammography from age 40-50+ per shared decision-making (USPSTF
    starts age 40 with shared DM, ACS routine 45+)
  - If family history of breast cancer + this RF cluster: shared DM
    about earlier/more-frequent screening + risk assessment
    (Gail / Tyrer-Cuzick / BOADICEA models)
  - If 5-year breast cancer risk ≥1.66% (Gail) OR ≥3% (10-year
    Tyrer-Cuzick): refer for risk-reducing medication discussion
    (tamoxifen/raloxifene/AI) per USPSTF Grade B

  **(4) Genetic counseling referral** if family-history red flags
  present (per NCCN BRCA1/2 / Lynch / Cowden criteria) — these are
  separate from reproductive-history RF but should be assessed.

  Counseling tone: reproductive choices are personal + non-modifiable
  retroactively. Focus on what CAN be done — breastfeeding when feasible,
  lifestyle, screening cadence.

rationale_ua: >
  Стандартний трек профілактики для поєднання пізньої першої вагітності
  та короткого періоду грудного вигодовування. Компоненти узгоджено з
  рекомендаціями ACOG, AAP, USPSTF та NCCN Breast Cancer Screening:

  **(1) Підтримка грудного вигодовування (орієнтована на майбутнє)** —
  у поточній або наступних вагітностях підтримувати виключно грудне
  вигодовування ≥6 місяців із продовженням до ≥12 місяців за
  рекомендаціями WHO та AAP. За будь-яких труднощів із годуванням —
  направлення до консультанта з лактації. Кожні 12 місяців сукупного
  грудного вигодовування протягом життя знижують ризик раку молочної
  залози приблизно на 4%.

  **(2) Консультування щодо модифікованих протипухлинних факторів
  способу життя** — оскільки термін репродуктивного вибору змінити
  заднім числом неможливо, акцент робиться на факторах, що піддаються
  корекції:
  - Алкоголь: ≤1 напій/день (менше — краще; кожен додатковий напій/день
    підвищує ризик раку молочної залози приблизно на 7–10%)
  - Фізична активність: ≥150 хв/тиждень помірного навантаження за
    рекомендаціями HHS
  - Контроль маси тіла: підтримання здорового ІМТ у постменопаузі
    (найвпливовіший окремий модифікований фактор)
  - Середземноморський тип харчування

  **(3) Скринінг раку молочної залози за графіком USPSTF з урахуванням
  сімейного анамнезу** —
  - Мамографія з 40–50 років за принципом спільного прийняття рішень
    (USPSTF рекомендує починати з 40 років зі спільним прийняттям
    рішень, ACS — рутинно з 45 років)
  - за наявності сімейного анамнезу раку молочної залози в поєднанні з
    цим кластером факторів ризику: спільне обговорення більш раннього
    або частішого скринінгу та оцінки ризику (моделі Gail, Tyrer-Cuzick,
    BOADICEA)
  - за 5-річного ризику раку молочної залози ≥1,66% (Gail) або ≥3%
    (10-річний Tyrer-Cuzick): направлення на обговорення медикаментозного
    зниження ризику (тамоксифен/ралоксифен/інгібітор ароматази) за
    класом рекомендацій B USPSTF

  **(4) Направлення на генетичне консультування** за наявності
  «червоних прапорців» сімейного анамнезу (за критеріями NCCN для
  BRCA1/2, синдрому Лінча, синдрому Коудена) — це окремий кластер
  факторів ризику, який, однак, слід оцінити.

  Тон консультування: репродуктивний вибір є особистим і не може бути
  змінений заднім числом. Акцент — на тому, що можливо зробити зараз:
  грудне вигодовування, коли це можливо, модифікація способу життя,
  графік скринінгу.

