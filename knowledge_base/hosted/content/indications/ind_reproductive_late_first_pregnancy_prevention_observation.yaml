    position: context

do_not_do:
  - "Не пропускати скринінг раку молочної залози за USPSTF — базовий графік залишається показаним незалежно від статусу консультування."
  - "Не пропускати оцінку сімейного анамнезу — у сім'ях із багатопоколінним раком молочної залози в молодому віці цей кластер факторів ризику часто перетинається з герміногенною схильністю (BRCA1/2, синдром Коудена, синдром Лі-Фраумені)."
  - "Не наполягати на модифікації способу життя на кожному візиті, якщо пацієнт чітко відмовився — консультувати шанобливо, не порушуючи автономію пацієнта."

do_not_do_en:
  - "Do not skip USPSTF breast cancer screening — base-rate cadence remains indicated regardless of counseling status."
  - "Do not skip family-history assessment — in families with multi-generational young breast cancer, this RF cluster often overlaps with germline susceptibility (BRCA1/2, Cowden, Li-Fraumeni)."
  - "Do not repeat pressure about lifestyle modifications at every visit if the patient has clearly declined — counsel respectfully but do not undermine autonomy."

