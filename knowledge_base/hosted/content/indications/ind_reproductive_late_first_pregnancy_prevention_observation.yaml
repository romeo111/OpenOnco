rationale: >
  Alternative-track companion to IND-REPRODUCTIVE-LATE-FIRST-PREGNANCY-
  PREVENTION-COUNSELING. Patient declines structured lifestyle + breastfeeding
  promotion intervention — receives baseline USPSTF breast cancer screening
  per age, with family-history risk assessment to determine if Gail / Tyrer-
  Cuzick / BOADICEA risk stratification + risk-reducing medication discussion
  applies. Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Альтернативний трек, супровідний до IND-REPRODUCTIVE-LATE-FIRST-
  PREGNANCY-PREVENTION-COUNSELING. Пацієнт відмовляється від
  структурованого втручання щодо способу життя та підтримки грудного
  вигодовування — отримує базовий скринінг раку молочної залози за
  графіком USPSTF відповідно до віку, з оцінкою сімейного анамнезу для
  визначення потреби у стратифікації ризику за моделями Gail,
  Tyrer-Cuzick або BOADICEA. Відповідно до CHARTER §11.

ukrainian_review_status: pending_clinical_signoff
