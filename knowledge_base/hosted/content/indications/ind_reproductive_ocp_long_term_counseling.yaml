do_not_do:
  - "Не подавати ОК як однозначно такі, що підвищують онкоризик, — сумарний баланс є сприятливим для більшості користувачок."
  - "Не пропускати оцінку BRCA1/2, синдрому Лінча, синдрому Коудена перед тривалим застосуванням ОК — розрахунок співвідношення ризику й користі інший."
  - "Не призначати більш ранній скринінг раку молочної залози лише на підставі застосування ОК — застосовується чинний графік USPSTF."
  - "Не покладатися лише на припинення застосування для зниження ризику раку шийки матки — вакцинація проти ВПЛ і скринінг є адекватнішим підходом."
  - "Не позиціонувати захист яєчників як самостійну підставу для продовження застосування ОК після завершення репродуктивного віку за відсутності потреби в контрацепції — співвідношення ризику й користі змінюється."

do_not_do_en:
  - "Do not present OCP as unilaterally cancer-risk-increasing — the net balance is favorable for most users."
  - "Do not skip BRCA1/2 / Lynch / Cowden assessment before long-term OCP — risk-benefit calculus differs."
  - "Do not order earlier breast cancer screening solely based on OCP use — current USPSTF cadence applies."
  - "Do not rely on cessation alone for cervical risk mitigation — HPV vaccination + screening is more adequate."
  - "Do not present ovarian protection as a stand-alone reason to continue OCP beyond reproductive years without contraceptive need — risk-benefit calculus shifts."

