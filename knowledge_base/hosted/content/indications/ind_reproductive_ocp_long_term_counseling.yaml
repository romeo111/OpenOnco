rationale: >
  Standard-track prevention pathway for long-term combined OCP use.
  Components per ACOG Practice Bulletin + NCCN Genetic/Familial Breast +
  USPSTF + IARC Monograph 100A:

  **(1) Full risk-benefit counseling** — NOT a unidirectional risk
  warning. Present FOUR cancer endpoints:
  - Breast: modest risk increment during use + ~5y post-cessation
    (RR ~1.08-1.20). Baseline restored ~10y post-cessation.
  - Cervical: modest risk increment with ≥5y use IN HPV-positive women.
    HPV is necessary cofactor — HPV vaccination + screening Pap/HPV
    co-test address primary risk.
  - Ovarian: ~50% protection at ≥5y use, durable for ≥30y post-cessation.
  - Endometrial: ~50% protection at ≥5y use, durable.

  **(2) Targeted high-risk subgroup assessment** — Strong family history,
  known BRCA1/BRCA2 / Lynch / Cowden / Li-Fraumeni carriers: separate
  shared-decision-making with genetics + breast-oncology before
  initiating or continuing OCP. BRCA1 carriers: OCP may slightly
  increase breast cancer risk but is the most-effective ovarian cancer
  prevention non-surgical option — individualized risk-benefit critical.

  **(3) HPV-related cervical risk mitigation** — HPV vaccination (any
  unvaccinated patient through age 45 considered case-by-case),
  cervical cancer screening per USPSTF (Pap/HPV co-test cadence).
  These largely neutralize the OCP-cervical association.

  **(4) Breast cancer screening per age-appropriate USPSTF cadence** —
  Mammography from age 40-50+ per shared decision-making. Long-term OCP
  use does NOT trigger earlier screening cadence in average-risk women
  (per current USPSTF/ACS).

  **(5) No routine ovarian or endometrial surveillance for OCP users
  per se** — Protection effect makes surveillance unnecessary.

  Counseling outcome may be: continue OCP, switch to non-hormonal
  contraception (IUD, diaphragm, condoms, sterilization), or change
  formulation. All defensible depending on individual priorities + risk
  factors.

rationale_ua: >
  Стандартний трек профілактики для тривалого застосування комбінованих
  оральних контрацептивів (ОК). Компоненти узгоджено з ACOG Practice
  Bulletin, NCCN Genetic/Familial Breast, USPSTF та IARC Monograph 100A:

  **(1) Повне консультування щодо співвідношення ризику й користі** —
  НЕ односторонє попередження про ризик. Представити ЧОТИРИ онкологічні
  кінцеві точки:
  - Молочна залоза: помірне підвищення ризику під час застосування та
    протягом ~5 років після припинення (ВР ~1,08–1,20). Базовий рівень
    відновлюється приблизно через 10 років після припинення.
  - Шийка матки: помірне підвищення ризику при застосуванні ≥5 років у
    ВПЛ-позитивних жінок. ВПЛ є необхідним кофактором — вакцинація
    проти ВПЛ та ко-тестування Pap/ВПЛ усувають основний ризик.
  - Яєчники: ~50% зниження ризику при застосуванні ≥5 років, ефект
    зберігається ≥30 років після припинення.
  - Ендометрій: ~50% зниження ризику при застосуванні ≥5 років, ефект
    стійкий.

  **(2) Цілеспрямована оцінка груп високого ризику** — обтяжений
  сімейний анамнез, відомі носії BRCA1/BRCA2, синдрому Лінча, синдрому
  Коудена, синдрому Лі-Фраумені: окреме спільне прийняття рішень за
  участю генетика та онколога-мамолога перед початком або продовженням
  застосування ОК. Носійки BRCA1: ОК можуть дещо підвищувати ризик раку
  молочної залози, але залишаються найефективнішим нехірургічним
  варіантом профілактики раку яєчників — критично важлива
  індивідуальна оцінка співвідношення ризику й користі.

  **(3) Зниження пов'язаного з ВПЛ ризику раку шийки матки** —
  вакцинація проти ВПЛ (у невакцинованих пацієнток до 45 років питання
  розглядається індивідуально), скринінг раку шийки матки за USPSTF
  (графік ко-тестування Pap/ВПЛ). Ці заходи значною мірою нівелюють
  зв'язок між ОК та раком шийки матки.

  **(4) Скринінг раку молочної залози за віковим графіком USPSTF** —
  мамографія з 40–50 років за принципом спільного прийняття рішень.
  Тривале застосування ОК НЕ є підставою для більш раннього графіка
  скринінгу в жінок середнього ризику (за чинними рекомендаціями
  USPSTF/ACS).

  **(5) Рутинний нагляд за яєчниками або ендометрієм для користувачок
  ОК як таких не показаний** — захисний ефект робить такий нагляд
  непотрібним.

