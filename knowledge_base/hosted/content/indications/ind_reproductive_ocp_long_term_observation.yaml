required_tests: []
desired_tests: []

rationale: >
  Alternative-track companion to IND-REPRODUCTIVE-OCP-LONG-TERM-
  COUNSELING. Patient does not wish to engage with structured risk-
  benefit counseling (counselors unavailable, patient preference,
  family-planning needs override discussion) — receives baseline
  USPSTF cancer screening + symptom-prompted evaluation pathway +
  brief intervention at each clinical contact. Per CHARTER §11
  patient-autonomy framing.

rationale_ua: >
  Альтернативний трек, супровідний до IND-REPRODUCTIVE-OCP-LONG-TERM-
  COUNSELING. Пацієнт не бажає брати участь у структурованому
  консультуванні щодо співвідношення ризику й користі (консультанти
  недоступні, особисті вподобання пацієнта, потреби планування сім'ї
  переважають над обговоренням) — отримує базовий онкологічний
  скринінг за USPSTF, оцінку за появи симптомів та коротке втручання
  під час кожного клінічного контакту. Відповідно до принципу
  автономії пацієнта за CHARTER §11.

