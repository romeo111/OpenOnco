do_not_do:
  - "Не подавати спостереження як нейтральне щодо ризику — співвідношення ризику й користі все одно існує."
  - "Не пропускати ко-тестування Pap/ВПЛ для скринінгу раку шийки матки — ВПЛ є кофактором зв'язку між ОК і раком шийки матки."
  - "Не пропускати мамографію за графіком USPSTF — ризик для молочної залози помірний, але реальний під час застосування."
  - "Не призначати нагляд за яєчниками або ендометрієм — захисний ефект робить його непотрібним."

do_not_do_en:
  - "Do not present observation as risk-neutral — a risk-benefit calculus exists."
  - "Do not skip cervical Pap/HPV co-test screening — HPV cofactor for OCP-cervical association."
  - "Do not skip mammography per USPSTF cadence — breast risk is modest but real during use."
  - "Do not order ovarian/endometrial surveillance — the protective effect makes it unnecessary."

