nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Patient declines progestin restoration (e.g., for fertility actively
    being pursued via clomiphene/letrozole + GnRH-protocol ART). Outcomes
    track untreated PCOS endometrial-risk cohort; symptom-driven biopsy
    remains the safety net. Active fertility window typically time-
    limited; revert to standard progestin-protection pathway after
    completed childbearing.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests: []

rationale: >
  Aggressive-track (no progestin restoration) alternative for PCOS
  patients actively pursuing fertility (cycle stimulation via
  clomiphene/letrozole/gonadotropins; assisted reproductive technology)
  for whom progestin suppression of ovulation is contraindicated by
  goal.

  Components:
    - Symptom-triggered endometrial biopsy retained — any abnormal
      bleeding pattern outside controlled ovulation induction → biopsy.
    - Weight management retained.
    - Metformin retained if T2DM/IR.
    - **Endometrial sampling between cycle attempts** for women with
      prolonged amenorrhea between treatment cycles (>3 months) per
      reproductive-endocrinology discretion.
    - **Transition to standard-track progestin restoration** at
      completion of childbearing — do not allow indefinite drift
      without progestin protection.

  Maximum reasonable duration ~3-5 years in active fertility pursuit;
  beyond this, reproductive endocrinology + gynecologic oncology
  consultation for individualised plan.

rationale_ua: >
  Aggressive-трек (без progestin restoration) альтернатива для PCOS
  пацієнток які активно пересувають fertility (cycle stimulation via
  clomiphene/letrozole/gonadotropins; ART) для яких progestin
  suppression ovulation contraindicated за goal.

  Компоненти:
    - Symptom-triggered endometrial biopsy retained — будь-який abnormal
      bleeding pattern поза controlled ovulation induction → biopsy.
    - Weight management retained.
    - Metformin retained при T2DM/IR.
    - **Endometrial sampling між cycle attempts** для жінок з тривалою
      amenorrhea між treatment cycles (>3 міс) per reproductive-
      endocrinology discretion.
    - **Transition до standard-track progestin restoration** at
      completion of childbearing — не дозволяти indefinite drift без
      progestin protection.

  Максимально reasonable duration ~3-5 років у active fertility
  pursuit; за цим — reproductive endocrinology + gynecologic oncology
  consultation для individualised plan.

