rationale: >
  Standard-track prevention pathway for PCOS-anovulation endometrial
  cancer risk. Core principle: restore cyclical or continuous progestin
  protection of the endometrium + address modifiable risk factors
  (obesity, insulin resistance) + use symptom-driven endometrial
  sampling rather than population-style screening.

  Components:
    - **Progestin restoration** — choose based on patient priorities:
      - Combined hormonal contraception (estrogen + progestin pill,
        patch, ring) if no contraindication and contraception is
        desired.
      - Cyclic medroxyprogesterone acetate 10 mg PO daily ×12-14 days
        each month or oral natural progesterone 200 mg ×12 days each
        month — ensures monthly withdrawal bleed.
      - Levonorgestrel IUD (52 mg) — preferred for patients with
        atypical hyperplasia or for those wanting long-term endometrial
        protection without daily pills; high adherence + efficacious
        regression of CAH.
      - Continuous oral progestin (norethindrone, medroxyprogesterone)
        — alternative when IUD declined.
    - **Weight management** — every 5-10% weight loss reduces
      endometrial cancer risk independently per WCRF/AICR; refer to
      structured weight-loss programs; pharmacotherapy (GLP-1 agonists
      semaglutide/liraglutide if BMI ≥30 or ≥27 with comorbidity) per
      patient preference + payer; bariatric surgery for BMI ≥40 or
      ≥35 with comorbidity.
    - **Metformin** if insulin resistance or T2DM (PCOS-T2DM common);
      additional ovulation-restoration + endometrial-protection signal
      in observational cohorts.
    - **Symptom-triggered endometrial biopsy:**
      - Pre-menopausal: any inter-menstrual spotting >6 months
        cumulative; any amenorrhea >6 months without intentional
        contraception suppression; abnormal pattern of heavy/prolonged
        bleeding.
      - Post-menopausal: any post-menopausal bleeding → urgent
        endometrial biopsy + TVUS.
    - **Routine TVUS or endometrial sampling in asymptomatic PCOS women
      is NOT recommended** (per ACOG; specificity poor in this cohort
      because PCOS endometrium is often thickened without neoplasia).

  Cascade not applicable (PCOS is not a Mendelian condition; first-
  degree relatives have moderately increased PCOS prevalence but no
  established cascade pathway).

  In Ukraine, PCOS is well recognized in endocrinology + gynecology;
  levonorgestrel IUD widely available; weight-management pharmacotherapy
  out-of-pocket for most patients.

rationale_ua: >
  Стандартний-трек prevention шлях для PCOS-anovulation endometrial
  cancer ризику. Core принцип: відновити cyclical або continuous
  progestin protection endometrium + address modifiable risk factors
  (obesity, insulin resistance) + використовувати symptom-driven
  endometrial sampling замість population-style screening.

  Компоненти:
    - **Progestin restoration:**
      - Combined hormonal contraception якщо немає contraindication +
        contraception бажана.
      - Cyclic medroxyprogesterone acetate 10 мг PO щодня ×12-14 днів
        кожного місяця або oral natural progesterone 200 мг ×12 днів.
      - Levonorgestrel IUD (52 мг) — preferred для atypical hyperplasia
        або long-term endometrial protection.
      - Continuous oral progestin.
    - **Weight management** — кожні 5-10% weight loss зменшують
      endometrial cancer ризик; structured weight-loss programs;
      pharmacotherapy (GLP-1 агоністи); bariatric surgery.
    - **Metformin** при insulin resistance або T2DM.
    - **Symptom-triggered endometrial biopsy:**
      - Pre-menopausal: будь-який inter-menstrual spotting >6 міс
        cumulative; amenorrhea >6 міс; abnormal pattern heavy/
        prolonged bleeding.
      - Post-menopausal: будь-яке post-menopausal bleeding →
        urgent endometrial biopsy + TVUS.
    - **Routine TVUS або endometrial sampling у asymptomatic PCOS
      жінок НЕ recommended** (specificity poor).

  В Україні PCOS добре recognized в endocrinology + gynecology;
  levonorgestrel IUD широко доступний; weight-management pharmacotherapy
  out-of-pocket для більшості пацієнток.

