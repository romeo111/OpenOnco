expected_outcomes:
  overall_response_rate: >-
    Progestin restoration + weight management + symptom-triggered
    endometrial biopsy shifts endometrial cancer stage at diagnosis from
    higher-grade/higher-stage (in PCOS, often presenting younger with
    aggressive endometrioid or atypical hyperplasia) to early-stage IA
    G1 with 5y OS >95%. Levonorgestrel IUD additionally regresses
    complex atypical hyperplasia (intraepithelial neoplasia) in ~80% of
    PCOS cohorts at 6-12 months.

