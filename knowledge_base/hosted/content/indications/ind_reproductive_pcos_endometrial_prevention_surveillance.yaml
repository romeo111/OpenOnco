sources:
  - source_id: SRC-ESGO-ENDOMETRIAL-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Women with persistent anovulation including PCOS should receive
      progestin protection (combined hormonal contraception, cyclic
      progestin, or levonorgestrel IUD). Symptom-triggered endometrial
      biopsy is preferred to population screening."
  - source_id: SRC-ESMO-ENDOMETRIAL-2022
    position: supports
    relevant_quote_paraphrase: >-
      "Risk-reduction in chronic anovulation centres on restoring cyclic
      or continuous progestin exposure; weight management and metformin
      provide additive benefit in metabolically affected patients."

do_not_do:
  - "Не використовувати routine TVUS або endometrial sampling як screening у asymptomatic PCOS — high false-positive rate; symptom-driven."
  - "Не відкладати endometrial biopsy при post-menopausal bleeding — мала затримка може дозволити прогресію CAH → invasive."
  - "Не пропускати progestin protection — chronic unopposed estrogen — модифікований ризик."
  - "Не використовувати estrogen-only HRT у PCOS жінок з збереженою маткою — кумулює endometrial risk."

do_not_do_en:
  - "Do not use routine TVUS or endometrial sampling as screening in asymptomatic PCOS — high false-positive rate; symptom-driven only."
  - "Do not delay endometrial biopsy in post-menopausal bleeding — small delay can allow CAH → invasive progression."
  - "Do not skip progestin protection — chronic unopposed estrogen is the modifiable risk."
  - "Do not use estrogen-only HRT in PCOS women with intact uterus — cumulates endometrial risk."

known_controversies:
  - topic: "Metformin endometrial-cancer prevention efficacy in PCOS"
    positions:
      - position: "Endorse metformin for protection"
        rationale: "Observational cohorts + endometrial-hyperplasia regression signal + ovulation-restoration mechanism."
      - position: "Insufficient prevention-RCT evidence"
        rationale: "No RCTs with endometrial-cancer endpoint; protective signal could be confounded by weight loss + glycemic improvement."
    our_default: "Use metformin when insulin-resistance or T2DM is present; do not initiate solely for endometrial protection."
    rationale: "Primary indication is metabolic; endometrial benefit is an acceptable adjunct."

