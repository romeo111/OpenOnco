do_not_do:
  - "Не приймати q6-8 тижневий MRI cadence без access to pediatric anesthesia + центру з досвідом інтерпретації — false-positives ведуть до інвазивних follow-ups у немовляти."
  - "Не подовжувати ATRT-targeted brain MRI surveillance за 8 років — late-onset ATRT надзвичайно рідкісний, signal-to-noise ratio падає."
  - "Не пропонувати risk-reducing salpingo-oophorectomy SMARCA4 жінці до завершення задокументованих репродуктивних рішень — irreversible та emotionally complex."
  - "Не плутати DIS-GLIOMA-LOW-GRADE engine anchor з фактичним спектром — ATRT / MRT / SCCOHT distinct entities, surface in patient-facing render."

do_not_do_en:
  - "Do not adopt the q6-8 week MRI cadence without pediatric-anesthesia access and a center experienced in interpretation — false positives lead to invasive follow-ups in an infant."
  - "Do not extend ATRT-targeted brain MRI surveillance beyond age 8 — late-onset ATRT is exceedingly rare and signal-to-noise ratio drops."
  - "Do not offer risk-reducing salpingo-oophorectomy to a SMARCA4 female before reproductive decisions are documented — irreversible and emotionally complex."
  - "Do not conflate the DIS-GLIOMA-LOW-GRADE engine anchor with the actual tumor spectrum — ATRT / MRT / SCCOHT are distinct entities and must surface in patient-facing render."

