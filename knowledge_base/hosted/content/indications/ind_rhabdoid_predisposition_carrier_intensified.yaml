rationale: >
  Aggressive-observation alternative track for confirmed RTPS1 (SMARCB1)
  / RTPS2 (SMARCA4) carriers, presented for HCP shared-decision-making
  alongside the standard Foulkes / EU-RHAB schedule.

  **Disease-spectrum note.** As with the standard track, the KB anchor
  `DIS-GLIOMA-LOW-GRADE` is the closest available CNS anchor; the
  actual surveilled spectrum is ATRT (CNS embryonal), extracranial MRT
  (kidney / liver / soft tissue), and SCCOHT (SMARCA4 carriers only).

  **(1) Brain MRI q6-8 weeks from birth through age 3, then q3 months
  through age 5, then q12 months through age 8** — tightens the cadence
  in the steepest part of the ATRT incidence curve and extends
  surveillance past age 5 (the standard stopping point) to age 8. The
  evidence base for benefit past age 5 is anecdotal — late-onset ATRT
  in classic SMARCB1 carriers is uncommon — but some families and
  centers prefer the residual coverage.

  **(2) Whole-body MRI q2-3 months through age 5, then q12 months
  through age 10** — tighter peak-window cadence plus extended tail.
  Sedation cumulative burden is a major counter-argument; some centers
  intercalate abdominal US between WB-MRI rounds to reduce GA exposure.

  **(3) SMARCA4 SCCOHT track intensified:** starting from menarche,
  transvaginal US + bimanual exam q6 months (rather than annual), plus
  pelvic MRI annually. Risk-reducing bilateral salpingo-oophorectomy
  is discussed earlier in the reproductive timeline. Counseling burden
  for a teenage carrier is substantial and the trade-off is explicitly
  patient-values-driven, not evidence-mandated.

  **(4) Schwannomatosis pre-symptomatic surveillance** in adolescent /
  adult survivors: total-spine MRI q24 months plus annual neurology
  exam. Less well-validated than the early-childhood ATRT / MRT
  protocol but emerging as best practice in adult RTPS carriers.

  **Rationale for offering this alternative:** the case-fatality rate
  of established ATRT and MRT remains high (median OS <12 months in
  many series despite intensive multimodal therapy), so families
  occasionally request the highest-cadence protocol available. The
  trade-off is repeated GA exposure, parental anxiety, and high
  incidental-finding rate. CHARTER §11 — aggressive intervention
  requires shared decision-making between pediatric neuro-oncologist,
  pediatric oncologist, genetic counselor, and family.

  **Routing intent:** prevention-time HCP-mediated counseling
  alternative to the standard track, NOT a treatment recommendation.

rationale_ua: >
  Альтернативно-трекова Indication для підтверджених носіїв RTPS1
  (SMARCB1) / RTPS2 (SMARCA4), представлена для HCP
  shared-decision-making поряд зі стандартним Foulkes / EU-RHAB
  графіком.

  **Замітка про спектр.** Якір `DIS-GLIOMA-LOW-GRADE` — найближчий CNS
  anchor у KB; фактичний спектр — ATRT (CNS embryonal), екстракраніальна
  MRT, SCCOHT (лише SMARCA4).

  **(1) MRI мозку q6-8 тижнів з народження до 3 років, потім q3
  місяців до 5 років, потім q12 місяців до 8 років** — звужує cadence
  у найкрутіший період пік-захворюваності ATRT і подовжує
  спостереження до 8 років.

  **(2) Whole-body MRI q2-3 місяців до 5 років, потім q12 місяців до
  10 років** — тісніший peak-window cadence плюс подовжений хвіст.
  Sedation cumulative burden — major counter-argument.

  **(3) SMARCA4 SCCOHT track інтенсифікований:** з менархе
  трансвагінальне УЗД + bimanual огляд q6 місяців (замість щорічного),
  плюс pelvic MRI щорічно. Ризик-знижуюча bilateral
  salpingo-oophorectomy обговорюється раніше у репродуктивній
  траєкторії.

  **(4) Pre-symptomatic schwannomatosis surveillance** у підлітковому /
  дорослому віці виживших: total-spine MRI q24 місяців плюс щорічний
  огляд невролога.

  **Обґрунтування:** case-fatality rate встановленої ATRT та MRT
  залишається високим (median OS <12 місяців у багатьох серіях),
  тому сім'ї інколи запитують найвищий-cadence протокол. Trade-off —
  повторна GA-експозиція, батьківська тривога. CHARTER §11.

  **Маршрутизація:** prevention-time альтернатива стандартному треку,
  НЕ лікувальна рекомендація.

