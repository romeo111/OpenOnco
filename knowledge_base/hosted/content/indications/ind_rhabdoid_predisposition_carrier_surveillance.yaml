do_not_do:
  - "Не пропускати q3mo brain MRI у перші 2 роки життя — пік захворюваності ATRT, інтервал детекції критичний для resectability."
  - "Не покладатися лише на абдомінальне УЗД у місце WB-MRI — paraspinal та intrathoracic MRT site missed by US."
  - "Не починати щорічне SCCOHT spotting screening у SMARCA4 жінки до менархе — низька діагностична ефективність до пубертатного fundus."
  - "Не використовувати рутинне CT як screening modality — кумулятивна радіація в malignancy-prone дитини шкідлива; MRI без контрасту як fallback при недоступності."
  - "Не плутати DIS-GLIOMA-LOW-GRADE engine anchor з фактичним спектром пухлин — ATRT / MRT / SCCOHT distinct entities, surface in patient-facing render."

do_not_do_en:
  - "Do not skip q3mo brain MRI during the first 2 years of life — peak ATRT incidence means the detection interval is critical for resectability."
  - "Do not rely on abdominal ultrasound alone in place of WB-MRI — paraspinal and intrathoracic MRT sites are missed by US."
  - "Do not initiate annual SCCOHT screening in a SMARCA4 female before menarche — diagnostic yield is low before pubertal fundus development."
  - "Do not use routine CT as a screening modality — cumulative radiation in a malignancy-prone child is harmful; non-contrast MRI is a fallback when contrast MRI is inaccessible."
  - "Do not conflate the DIS-GLIOMA-LOW-GRADE engine anchor with the actual tumor spectrum — ATRT / MRT / SCCOHT are distinct entities and must surface in patient-facing render."

