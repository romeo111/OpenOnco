do_not_do:
  - "Не subjectувати young child (< 8 років) до whole-body MRI без sedation planning + pediatric MSK-radiology expertise — sedation morbidity + false-positive findings без specialist interpretation."
  - "Не пропонувати prophylactic skin surgery в poikiloderma-areas — non-targeted skin excision не purpose-driven; field treatment + targeted biopsy preferred."
  - "Не використовувати фотодинамічну терапію (PDT) як first-line у RTS — UV-sensitivity hypersensitivity contraindicates aggressive PDT regimens."
  - "Не вважати whole-body MRI definitive — false-positive findings (osteoid osteoma, fibrous dysplasia, pediatric bone marrow heterogeneity) часті; biopsy decisions потребують pediatric MSK-radiology + sarcoma surgery co-discussion."
  - "Не intensifyувати у всіх carriers — high-burden poikiloderma / family osteosarcoma cluster — драйвери; для решти standard-track adequate."

do_not_do_en:
  - "Do not subject a young child (< 8 years) to whole-body MRI without sedation planning and pediatric MSK-radiology expertise — sedation morbidity plus false-positive findings without specialist interpretation."
  - "Do not offer prophylactic skin surgery in poikiloderma-affected areas — non-targeted skin excision is not purpose-driven; field treatment plus targeted biopsy is preferred."
  - "Do not use photodynamic therapy (PDT) as first-line in RTS — UV hypersensitivity contraindicates aggressive PDT regimens."
  - "Do not treat whole-body MRI as definitive — false-positive findings (osteoid osteoma, fibrous dysplasia, pediatric bone marrow heterogeneity) are common; biopsy decisions require pediatric MSK-radiology plus sarcoma-surgery co-discussion."
  - "Do not intensify in all carriers — high-burden poikiloderma or family osteosarcoma cluster are the drivers; standard-track is adequate for the rest."

