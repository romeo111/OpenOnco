expected_outcomes:
  overall_response_rate: >-
    Intensified track layers two options on top of the standard RTS
    surveillance protocol: (1) whole-body MRI q1y replacing plain-film
    skeletal survey during the adolescent peak osteosarcoma window
    (age 10-20) — whole-body MRI sensitivity for small / early
    osteosarcoma exceeds plain films, particularly for pelvis / spine /
    proximal long bones where plain-film coverage is limited;
    (2) intensified dermatologic surveillance (q3-4mo) plus annual
    body photography in poikiloderma-affected areas — pre-cancer
    actinic keratoses / dysplastic skin lesions detected earlier with
    closer follow-up, enabling field treatment (cryotherapy, 5-FU /
    imiquimod) before BCC / SCC develops. Trade-off: MRI sedation
    burden in pediatric carriers, false-positive musculoskeletal
    findings driving unnecessary biopsies, more frequent skin visits
    (anxiety, scheduling burden).

