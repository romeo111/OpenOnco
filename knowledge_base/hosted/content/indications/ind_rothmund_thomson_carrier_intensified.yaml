rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-ROTHMUND-THOMSON-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-ROTHMUND-THOMSON-
  CARRIER-SURVEILLANCE applies (annual skeletal survey, dermatologic
  exam q6-12mo, ophthalmologic exam annually, pre-treatment carrier-
  aware workup if cancer arises).

  **Intensification 1 — Whole-body MRI replacing skeletal survey
  during peak adolescent window:** During age 10-20 (peak osteosarcoma
  incidence in RTS), advance to whole-body MRI q1y (replacing plain-
  film skeletal survey) as a shared-decision option. Rationale:
  whole-body MRI sensitivity for small / early osteosarcoma — especially
  pelvis, spine, proximal humerus / femur where plain-film coverage is
  limited — substantially exceeds skeletal survey. Trade-off: MRI
  sedation needed for younger adolescents who cannot lie still 45-60
  min, false-positive findings (osteoid osteoma, fibrous dysplasia,
  pediatric bone marrow heterogeneity) leading to unnecessary biopsies,
  scheduling / capacity constraints at most centers. Center should
  have pediatric MSK-radiology experience.

  **Intensification 2 — Intensified dermatologic surveillance:**
  Advance dermatologic exam to q3-4mo (from q6-12mo) plus annual
  total-body photography of poikiloderma-affected areas as a
  shared-decision option in adolescent / young-adult carriers.
  Pre-cancer actinic keratoses / dysplastic skin lesions detected
  earlier with closer follow-up enable field treatment (cryotherapy,
  topical 5-FU / imiquimod / diclofenac) before BCC / SCC develops.
  Trade-off: more frequent dermatologic visits (anxiety, scheduling
  burden, false-positive biopsies). Poikiloderma background remains
  the constant challenge — even with photography baseline,
  recognition of new lesions in a heavily-affected canvas requires
  specialized dermatologic experience.

  **Other intensification considerations (not core to this track):**
    - Routine bone-marrow surveillance for hematologic transformation
      is NOT supported by RTS evidence base — Bloom / Fanconi-style
      hematologic surveillance NOT transferable.
    - Prophylactic chemotherapy / chemoprevention is NOT available
      (no RTS-specific chemoprevention exists; RECQL4-deficient cell
      hypersensitivity actually contraindicates most chemoprevention
      candidates).
    - Annual brain MRI is NOT routine — CNS tumor risk in RTS is
      modest and not surveillance-amenable.

  **Cascade testing remains continuous:** every visit re-confirms
  family's testing status. Autosomal-recessive inheritance means
  parents are obligate heterozygous carriers; sibs have 25% homozygous
  risk.

  Per CHARTER §11: intensified surveillance is shared-decision-making.
  Pediatric carrier autonomy + parental autonomy is paramount;
  standard-track protocol remains the floor.

rationale_ua: >
  Aggressive-трекова Indication: накладена поверх IND-ROTHMUND-THOMSON-
  CARRIER-SURVEILLANCE з двома опціями інтенсифікації.

  **Foundation:** Усе стандартне з IND-ROTHMUND-THOMSON-CARRIER-
  SURVEILLANCE.

  **Інтенсифікація 1 — Whole-body MRI replacing skeletal survey під
  час peak adolescent window (10-20 років):** Whole-body MRI q1y —
  shared-decision option. Sensitivity для small / early osteosarcoma
  — especially pelvis, spine, proximal humerus / femur — substantially
  > skeletal survey. Trade-off: MRI sedation для younger adolescents
  (45-60 хв), false-positive findings (osteoid osteoma, fibrous
  dysplasia, pediatric bone marrow heterogeneity), scheduling /
  capacity constraints. Center потребує pediatric MSK-radiology
  experience.

  **Інтенсифікація 2 — Інтенсифікована dermatologic surveillance:**
  Dermatologic exam q3-4mo (з q6-12mo) + annual total-body photography
  poikiloderma-affected areas — shared-decision у adolescent / young-
  adult carriers. Pre-cancer actinic keratoses / dysplastic lesions —
  field treatment (cryotherapy, topical 5-FU / imiquimod / diclofenac)
  до BCC / SCC. Trade-off: more frequent visits, anxiety,
  false-positive biopsies. Poikiloderma background — constant
  challenge.

  **Інші міркування:**
    - Routine bone-marrow surveillance для hematologic transformation
      — NOT supported (Bloom / Fanconi-style surveillance НЕ
      transferable).
    - Prophylactic chemoprevention NOT available (RECQL4-deficient
      hypersensitivity contraindicates більшість chemoprevention
      candidates).
    - Annual brain MRI — NOT routine (CNS tumor risk modest).

  **Cascade тестування continuous:** autosomal-recessive — parents
  obligate heterozygous carriers; sibs 25% homozygous risk.

  Per CHARTER §11: shared-decision-making домен; pediatric carrier
  autonomy + parental autonomy primary.

