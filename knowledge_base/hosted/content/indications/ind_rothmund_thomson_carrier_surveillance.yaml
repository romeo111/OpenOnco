do_not_do:
  - "Не biopsyувати suspected osteosarcoma у community hospital — track contamination + improper biopsy windowing може compromise limb-salvage options; refer до sarcoma-experienced surgical team."
  - "Не start MAP chemotherapy для osteosarcoma у RTS-carrier без alerting team про RECQL4-deficient cell hypersensitivity — dose-modification consideration важлива."
  - "Не використовувати etoposide / topoisomerase II inhibitors як first-line у RTS-carrier malignancy — severe myelotoxicity reported; alternative regimens preferred."
  - "Не пропускати annual ophthalmologic exam з 2-3 років — bilateral juvenile cataracts у ~50% Type II RTS до adolescence; amblyopia prevention потребує timely lensectomy."
  - "Не вважати heterozygous adult relatives cancer-predisposed — поточні дані НЕ підтверджують heterozygous cancer risk; cascade-тестування для reproductive counseling, не surveillance."

do_not_do_en:
  - "Do not biopsy a suspected osteosarcoma in a community hospital — track contamination and improper biopsy windowing can compromise limb-salvage options; refer to a sarcoma-experienced surgical team."
  - "Do not start MAP chemotherapy for osteosarcoma in an RTS carrier without alerting the team to RECQL4-deficient cell hypersensitivity — dose-modification consideration is essential."
  - "Do not use etoposide / topoisomerase II inhibitors as first-line in RTS-carrier malignancy — severe myelotoxicity has been reported; alternative regimens preferred."
  - "Do not skip annual ophthalmologic exam from age 2-3 — bilateral juvenile cataracts develop in ~50% of Type II RTS carriers by adolescence; amblyopia prevention requires timely lensectomy."
  - "Do not treat heterozygous adult relatives as cancer-predisposed — current evidence does not support heterozygous cancer risk; cascade testing is for reproductive counseling, not surveillance."

