rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with biallelic germline RECQL4 pathogenic variants or clinically
  diagnosed RTS Type II (poikiloderma + skeletal anomalies + cancer-
  predisposition phenotype).

  **Osteosarcoma (~30% lifetime; median age 11-12 years):** Annual
  skeletal survey (whole-body plain films of femur / tibia / humerus /
  spine — peak osteosarcoma sites — supplemented by targeted US / MRI
  for any suspicious area). Persistent bone pain (>2 weeks) OR
  palpable mass OR pathologic fracture → immediate plain X-ray
  followed by MRI of the suspicious site; biopsy by sarcoma-experienced
  surgical team only (do NOT biopsy a suspected sarcoma in a community
  hospital — track contamination and limb-salvage planning
  considerations). Most osteosarcomas in RTS arise during the
  adolescent growth spurt (age 10-20) — surveillance intensity peaks
  in this window. Multiple primary osteosarcomas in different bones
  are reported.

  **Non-melanoma skin cancer (BCC + SCC):** Dermatologic exam q6-12mo
  with full-body skin survey. Poikiloderma background (the cardinal
  RTS skin finding from infancy) complicates clinical recognition of
  early skin cancer — biopsy threshold should be LOW. Photoprotection
  counseling: broad-spectrum SPF 50+ sunscreen, sun-protective
  clothing, peak-sun-hour avoidance — especially important given
  RECQL4-deficient cells' UV-damage hypersensitivity. Any suspicious
  lesion → biopsy; Mohs micrographic surgery preferred for excision
  of confirmed lesions.

  **Juvenile cataracts (Type II RTS cardinal feature):** Annual
  ophthalmologic exam from age 2-3 onward; bilateral juvenile cataracts
  develop in ~50% of Type II RTS carriers, often by adolescence.
  Timely lensectomy with IOL implantation for visual rehabilitation;
  amblyopia prevention is the priority in young children.

  **Lymphoma surveillance:** No dedicated routine imaging or
  biochemistry — clinical exam attentive to lymphadenopathy,
  unexplained fever, weight loss, night sweats. Persistent or growing
  lymph nodes → ultrasound + biopsy via standard lymphoma workup.

  **Pre-treatment workup (carrier-aware):** If cancer arises,
  oncology team must be alerted to RECQL4-deficiency hypersensitivity
  BEFORE first chemotherapy / radiotherapy dose:
    - High-dose methotrexate + doxorubicin + cisplatin (MAP) for
      osteosarcoma — given with caution; dose-modification considered
      case-by-case.
    - Etoposide / topoisomerase II inhibitors — particularly
      problematic (severe myelotoxicity reported).
    - Ionizing radiation — dose-modification routine (RECQL4-deficient
      cells show ~2-3-fold radiation sensitivity).
  These are TREATMENT-time considerations surfaced here so render
  alerts the oncologist at the moment of new-cancer diagnosis.

  **Cascade testing:** Confirmed carrier status mandates cascade
  testing of all sibs (autosomal-recessive — sibs have 25%
  homozygous risk, 50% heterozygous-carrier rate, 25% unaffected
  non-carrier). First-degree adult relatives are heterozygous
  carriers and (in current evidence) are NOT cancer-predisposed
  themselves, but cascade pre-marital / pre-conception testing is
  relevant for reproductive planning.

  Per CHARTER §11 patient-autonomy framing: pediatric surveillance
  initiation requires age-appropriate counseling and full family
  engagement.

rationale_ua: >
  Стандартний-трекова Indication для confirmed-carrier RTS surveillance
  per RTS-Registry / NCCN-aligned consensus.

  **Остеосаркома (~30% lifetime; median 11-12 років):** Annual
  skeletal survey (whole-body plain films femur / tibia / humerus /
  spine + targeted US / MRI). Persistent bone pain (>2 тижні) АБО
  palpable mass АБО pathologic fracture → immediate X-ray + MRI
  suspicious site; biopsy ONLY by sarcoma-experienced surgical team
  (do NOT biopsy у community hospital — track contamination + limb-
  salvage planning concerns). Adolescent growth spurt (10-20 років) —
  peak window. Multiple primary osteosarcomas different bones —
  reported.

  **Non-melanoma skin cancer (BCC + SCC):** Dermatologic exam q6-12mo
  з full-body skin survey. Poikiloderma background complicates
  clinical recognition — biopsy threshold LOW. Photoprotection
  counseling: broad-spectrum SPF 50+, sun-protective clothing, peak-
  sun-hour avoidance. Suspicious lesion → biopsy; Mohs micrographic
  surgery для excision.

  **Juvenile cataracts (Type II RTS cardinal feature):** Annual
  ophthalmologic exam з 2-3 років; bilateral juvenile cataracts у
  ~50% Type II RTS, часто до adolescence. Timely lensectomy + IOL для
  visual rehabilitation; amblyopia prevention — пріоритет у young
  children.

  **Lymphoma surveillance:** No dedicated routine imaging /
  biochemistry — clinical exam attentive to lymphadenopathy,
  unexplained fever, weight loss, night sweats.

  **Pre-treatment workup (carrier-aware):** Якщо cancer arises,
  oncology team must бути alerted to RECQL4-deficiency hypersensitivity
  BEFORE first chemotherapy / radiotherapy dose:
    - High-dose methotrexate + doxorubicin + cisplatin (MAP) — з
      caution; dose-modification case-by-case.
    - Etoposide / topoisomerase II inhibitors — problematic (severe
      myelotoxicity reported).
    - Ionizing radiation — dose-modification routine (~2-3-fold
      sensitivity).

  **Cascade тестування:** mandates тестування sibs (autosomal-
  recessive — 25% homozygous risk, 50% heterozygous-carrier rate,
  25% unaffected). Heterozygous adult relatives — НЕ cancer-
  predisposed themselves (поточні дані), але cascade pre-marital /
  pre-conception тестування relevant для reproductive planning.

  Per CHARTER §11 framing автономії пацієнта.

