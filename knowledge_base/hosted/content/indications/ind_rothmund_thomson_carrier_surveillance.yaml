expected_outcomes:
  overall_response_rate: >-
    Structured skeletal + dermatologic surveillance per RTS-Registry /
    NCCN-aligned consensus increases the proportion of osteosarcoma
    diagnoses made at non-metastatic localized stage where MAP (high-
    dose methotrexate + doxorubicin + cisplatin) chemotherapy plus
    limb-salvage surgery achieves ~70% 5-year survival; metastatic /
    delayed-diagnosis osteosarcoma 5-year survival falls to ~30%.
    Skin surveillance with biopsy of suspicious lesions catches
    BCC / SCC at smaller, locally-excisable stage. Ophthalmologic exam
    detects juvenile cataracts (cardinal Type II RTS feature) and
    enables timely lensectomy for visual rehabilitation.

