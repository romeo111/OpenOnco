red_flags_triggering_alternative: []
required_tests: [TEST-CBC]
desired_tests: []

rationale: >
  Alternative-track companion. Empirical surveillance for RTS-suspect
  pedigree (poikiloderma + skeletal / radial-ray anomalies) without
  germline RECQL4 panel confirmation:
  - Baseline + annual skeletal survey OR low-dose whole-body MRI
  - Prompt imaging of new bone pain / swelling
  - Annual whole-body skin exam from adolescence + rigorous
    photoprotection
  - Ophthalmologic exam q1-2y
  - Defer cascade testing pending genetic confirmation

rationale_ua: >
  Альтернативно-трекова Indication. Empirical surveillance для RTS-
  suspect pedigree без RECQL4 confirmation:
  - Baseline + annual skeletal survey АБО low-dose whole-body MRI
  - Prompt imaging нового bone pain / swelling
  - Annual whole-body skin exam з adolescence + photoprotection
  - Ophthalmologic exam q1-2y
  - Cascade testing — після genetic confirmation

