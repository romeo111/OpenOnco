expected_outcomes:
  overall_response_rate: "Empirical RTS-protocol surveillance without genetic confirmation captures osteosarcoma + non-melanoma skin cancer at earlier stage in true Type-II RTS patients (~60-80% of suspicion cohort with poikiloderma + skeletal anomalies), but with lower diagnostic precision and without cascade-testing infrastructure."

