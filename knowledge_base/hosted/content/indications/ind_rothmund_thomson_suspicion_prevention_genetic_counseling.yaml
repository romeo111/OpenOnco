rationale: >
  Standard-track prevention pathway for Rothmund-Thomson syndrome Type-II
  (RECQL4 biallelic) suspicion.

  **(1) Genetic counseling + germline RECQL4 + RecQ-family panel
  testing.** Autosomal recessive inheritance. Differential includes other
  RecQ-helicase disorders — Bloom (BLM), Werner (WRN) — and overlapping
  poikiloderma syndromes (Mendes da Costa, Clericuzio-type / poikiloderma
  with neutropenia / USB1).

  **(2) Confirmed Type-II RTS surveillance protocol** (RTS Registry
  consensus / Wang 2003 / Larizza 2010 + NCCN Bone Sarcoma):
  - Baseline + annual skeletal survey OR low-dose whole-body MRI from
    diagnosis (avoid radiation-dense CT for routine surveillance —
    presumed radiation sensitivity)
  - Prompt imaging of any new bone pain / swelling — low threshold for
    plain film + MRI (osteosarcoma can be multifocal / metachronous in
    RTS, so prior negative scan doesn't exclude new primary)
  - Annual whole-body skin exam by dermatologist from adolescence for
    non-melanoma skin cancer (BCC + cutaneous SCC)
  - Rigorous photoprotection (UV-avoidance + high-SPF sunscreen + UV-
    protective clothing) — photosensitivity component of poikiloderma
  - Ophthalmologic exam q1-2y (juvenile cataracts surveillance)
  - Dental + growth + endocrine evaluation per general syndrome
    management

  **(3) Cascade testing** of at-risk siblings — biallelic RECQL4 siblings
  require full RTS surveillance; heterozygous carriers have no
  established cancer-predisposition phenotype currently.

  **(4) Oncology team coordination ahead of any required therapeutic
  radiation or genotoxic chemotherapy** — reduced-dose / alternative-
  regimen consideration given reported radiation + alkylator sensitivity
  in some RTS series (data less definitive than for FA or A-T).

