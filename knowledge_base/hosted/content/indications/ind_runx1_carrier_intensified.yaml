nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Intensified-track surveillance (q3-month CBC + smear, scheduled
    BMA + NGS every 1-2 years, preemptive HLA + donor germline
    mapping) is justified by the ~35-45% cumulative lifetime myeloid
    malignancy risk in FPD/AML pedigrees and the documented mortality
    benefit of carrier-aware planned induction vs emergency
    presentation. Patient-burden tradeoff (frequent visits, repeat
    sedation for BMA) is shared-decision-making with the carrier per
    CHARTER §11.

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CBC
desired_tests:
  - TEST-PERIPHERAL-SMEAR
  - TEST-BM-ASPIRATE
  - TEST-NGS-MYELOID-PANEL
  - TEST-COAG-PANEL

rationale: >
  Alternative-track companion to IND-RUNX1-CARRIER-SURVEILLANCE.
  Intensified cadence reflects the substantial lifetime malignancy
  risk in classic FPD/AML pedigrees and explicit pre-emptive
  transplant-team engagement.

  **CBC + peripheral smear q3 months from carrier confirmation,
  lifelong:** Double the standard-track cadence. Detection of pre-
  AML clonal evolution (emerging dysplastic features, persistent
  decline in any lineage beyond baseline thrombocytopenia, blast
  appearance) before frank malignancy.

  **Scheduled BMA + cytogenetics + myeloid NGS every 1-2 years from
  carrier confirmation:** Provoked BMA (any unexplained CBC change)
  remains the primary trigger, but scheduled BMA at this cadence is
  added in this track regardless of CBC stability. The myeloid NGS
  panel must include ASXL1, BCOR, monosomy-7 / del(5q), TP53, and
  RUNX1 full coding so that emerging somatic-acquired-clones are
  detected at low burden.

  **Preemptive HLA typing of candidate sibling-donor cohort +
  germline-testing of all candidates:** Performed BEFORE any AML
  diagnosis so that donor identification is not delayed at diagnosis.
  Every candidate sibling donor must be germline-tested for RUNX1
  before designation; RUNX1-carrier siblings are excluded from donor
  candidacy. Unrelated-donor search initiated early if no eligible
  sibling donor identified.

  **Pre-emptive consultation with hereditary-myeloid-program
  transplant team:** Establishes care relationship so that at MDS /
  AML diagnosis, time-to-induction and time-to-alloHCT can be
  optimized. The hereditary-myeloid program at a tertiary academic
  center is the preferred care setting.

  **Structured bleeding-risk plan for major surgery / obstetric
  care:** Pre-procedure platelet-function-aware coagulation
  consultation; tranexamic acid + DDAVP considerations; platelet
  transfusion thresholds individualized; for delivery in a female
  carrier, multidisciplinary obstetric-hematology plan documented
  in advance.

  Per CHARTER §11 patient-autonomy framing: intensified cadence
  carries higher procedural burden and is appropriate only where
  the carrier prefers the higher-intensity option after shared-
  decision-making. Standard track remains evidence-based alternative.

rationale_ua: >
  Альтернативно-трекова Indication, sibling до IND-RUNX1-CARRIER-
  SURVEILLANCE. Інтенсифікована cadence відображає substantial
  довічний malignancy ризик у класичних FPD/AML родоводах і явне
  pre-emptive transplant-team engagement.

  **ЗАК + периферичний мазок q3 місяці від підтвердження носійства,
  життєво:** Подвійна стандартно-трекова cadence. Детекція pre-ГМЛ
  клональної еволюції до франкного malignancy.

  **Запланована BMA + цитогенетика + myeloid NGS кожні 1-2 роки від
  підтвердження носійства:** Provoked BMA (будь-яка нез'ясована зміна
  ЗАК) залишається primary тригером, але запланована BMA на цій
  cadence додана в цьому треку незалежно від CBC stability. Myeloid
  NGS panel має включати ASXL1, BCOR, моносомію-7 / del(5q), TP53,
  і RUNX1 full coding.

  **Pre-emptive HLA-типування кандидат-сиблінг-донор-cohort +
  germline-тестування всіх кандидатів:** Виконується ДО будь-якого
  діагнозу ГМЛ. Кожен кандидат-сиблінг-донор має бути germline-
  тестований на RUNX1 перед призначенням; RUNX1-носії-сиблінги
  виключаються з donor-candidacy. Unrelated-donor search розпочатий
  рано, якщо немає eligible-сиблінга.

  **Pre-emptive консультація з hereditary-myeloid-program transplant-
  team:** Встановлює care-relationship так, що при діагностиці МДС /
  ГМЛ time-to-induction і time-to-alloHCT можуть бути оптимізовані.

  **Структурований bleeding-risk план для major surgery / obstetric
  care:** Pre-procedure platelet-function-aware coagulation
  консультація; tranexamic acid + DDAVP міркування; platelet
  transfusion thresholds індивідуалізовані; для пологів у жінки-носія
  multidisciplinary obstetric-hematology план задокументований
  заздалегідь.

  Per CHARTER §11 framing автономії пацієнта.

