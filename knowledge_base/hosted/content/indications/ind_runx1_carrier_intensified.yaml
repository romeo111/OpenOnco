do_not_do:
  - "Не рекомендувати інтенсифіковану-трек cadence без явного shared-decision-making — patient-burden від q3-month візитів + repeat BMA + repeated sedation значущий і має бути зважений проти marginal-benefit над стандартним треком."
  - "Не пропускати pre-procedure platelet-function-aware coagulation консультацію для major surgery у RUNX1-носія — стандартні coag-panel screening не визначить platelet-function defect."
  - "Не виконувати запланованої BMA без супутнього myeloid NGS panel — somatic-acquired-clones (ASXL1, monosomy-7) at low VAF можуть бути пропущені без NGS, що руйнує сенс intensified-track surveillance."
  - "Не використовувати кандидат-сиблінг-донора, доки germline-screening не завершений — навіть інтенсифікований-track пацієнт не звільняється від цієї вимоги."

do_not_do_en:
  - "Do not recommend the intensified-track cadence without explicit shared-decision-making — patient burden from q3-month visits + repeat BMA + repeated sedation is meaningful and must be weighed against the marginal benefit over the standard track."
  - "Do not skip pre-procedure platelet-function-aware coagulation consultation for major surgery in a RUNX1 carrier — standard coag-panel screening will not detect the platelet-function defect."
  - "Do not perform scheduled BMA without companion myeloid NGS panel — somatic-acquired clones (ASXL1, monosomy-7) at low VAF can be missed without NGS, defeating the purpose of intensified-track surveillance."
  - "Do not use a candidate sibling donor before germline-screening is completed — the intensified-track patient is not exempt from this requirement."

