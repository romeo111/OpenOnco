expected_outcomes:
  overall_response_rate: >-
    Standard-track confirmed-carrier surveillance of germline RUNX1
    (FPD/AML) carriers enables earlier detection of incident MDS / AML
    and T-cell ALL — the documented ~35-45% cumulative lifetime
    incidence of myeloid malignancy in FPD/AML pedigrees (Owen 2008,
    Schmit 2024) justifies lifelong CBC + smear surveillance. Cascade
    germline testing + pre-emptive donor screening reduces the
    documented donor-derived-leukemia risk in FPD/AML kindreds.

