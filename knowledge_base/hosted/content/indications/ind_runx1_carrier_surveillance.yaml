do_not_do:
  - "Не використовувати кандидат-сиблінг-донора без germline-тестування на RUNX1 — donor-derived ГМЛ у FPD/AML — найкраще задокументований сценарій donor-derived-leukemia у hereditary-myeloid літературі."
  - "Не пропонувати antiplatelet терапію (aspirin, clopidogrel) RUNX1-носію без явного шейред-decision-making про bleeding-ризик — baseline platelet-function defect плюс medication potentiates bleeding burden."
  - "Не використовувати лише blood-based germline тестування для cascade screening — somatic-clone contamination може затушувати germline status; buccal / fibroblast / cultured-skin tissue потрібне."
  - "Не пропускати BMA при будь-якому unexplained декременті в WBC або Hb у RUNX1-носія — baseline isolated thrombocytopenia не explains нову зміну в іншій лінії, і pre-test probability MDS / AML значно вища."

do_not_do_en:
  - "Do not use a candidate sibling donor without RUNX1 germline testing — donor-derived AML in FPD/AML is the best-documented donor-derived-leukemia scenario in the hereditary-myeloid literature."
  - "Do not prescribe antiplatelet therapy (aspirin, clopidogrel) to a RUNX1 carrier without explicit shared-decision-making about bleeding risk — baseline platelet-function defect plus medication potentiates the bleeding burden."
  - "Do not rely on blood-only germline testing for cascade screening — somatic-clone contamination can obscure germline status; buccal / fibroblast / cultured-skin tissue is required."
  - "Do not defer BMA on any unexplained decrement in WBC or Hb in a RUNX1 carrier — baseline isolated thrombocytopenia does not explain a new change in another lineage, and the pre-test probability of MDS / AML is substantially elevated."

