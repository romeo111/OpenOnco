rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with a documented germline RUNX1 pathogenic variant (FPD/AML).

  **CBC + peripheral smear q3-6 months, lifelong:** Baseline mild-to-
  moderate thrombocytopenia (platelet count 80-130 x10⁹/L typically)
  is the carrier phenotype; clinical-change thresholds are a new
  decline in any lineage, persistent dysplastic morphology on smear,
  emerging blasts, or unexplained leukocytosis / lymphocytosis (the
  latter prompting a T-ALL-aware differential given the ~5% lifetime
  T-cell ALL risk).

  **BMA + cytogenetics + myeloid NGS at baseline + at any clinical
  change:** Baseline BMA + cytogenetics + targeted NGS within 6-12
  months of carrier confirmation establishes a comparator for future
  surveillance. Provoked BMA (any unexplained CBC change) is the
  primary subsequent trigger. Myeloid NGS panel must capture RUNX1
  (full coding region), ASXL1, BCOR, monosomy-7 / del(5q) emergence,
  and TP53 — these are the documented clonal-evolution events in
  FPD/AML progression to MDS / AML.

  **Annual molecular monitoring:** Quantitative molecular tracking of
  the germline RUNX1 variant + any documented somatic acquired clones
  (ASXL1, BCOR, monosomy-7) is performed annually if a sensitive
  assay is available — VAF dynamics correlate with clinical
  progression risk in FPD/AML cohort data.

  **Bleeding-history review + medication review:** Annual structured
  review of bleeding burden (mucocutaneous, surgical, obstetric);
  medication review for antiplatelet drugs that should be avoided when
  feasible; pre-procedure platelet-function-aware coagulation
  consultation for any planned major surgery / dental procedure.

  **Cascade germline testing for first-degree relatives:** Documented
  buccal / fibroblast / cultured-skin germline confirmation required —
  NOT blood-only (somatic-clone contamination caveat applies to RUNX1
  as it does to CEBPA and DDX41).

  **Donor-screening protocol:** Any candidate sibling donor must be
  germline-tested before HSC mobilization. RUNX1-carrier siblings must
  NOT donate to an affected sibling — donor-derived AML / MDS in
  FPD/AML kindreds is the best-documented donor-derived-leukemia
  scenario in the hereditary-myeloid literature (Owen et al. 2008
  reviewed multiple cases). HLA-typing of candidate donors early
  enables timely donor identification at AML diagnosis.

  Per CHARTER §11 patient-autonomy framing: surveillance cadence and
  BMA threshold are shared-decision-making with the patient and the
  hereditary-myeloid-program team.

rationale_ua: >
  Стандартний-трек шлях спостереження підтверджених носіїв для осіб з
  задокументованим гермінативним патогенним варіантом RUNX1 (FPD/AML).

  **ЗАК + периферичний мазок q3-6 місяців, життєво:** Baseline м'яка-
  помірна тромбоцитопенія (тромбоцити 80-130 x10⁹/л зазвичай) — це
  фенотип носія; порогові клінічно-зміни: новий спад у будь-якій
  лінії, персистуюча displastic morphology на смазку, emerging
  бласти, нез'ясований лейкоцитоз / лімфоцитоз (останній prompts
  T-ALL-aware differential за ~5% довічним T-cell ALL ризиком).

  **BMA + цитогенетика + myeloid NGS на baseline + при будь-якій
  клінічній зміні:** Baseline BMA + цитогенетика + targeted NGS у
  межах 6-12 місяців від підтвердження носійства встановлює
  comparator для майбутнього спостереження. Provoked BMA (будь-яка
  нез'ясована зміна ЗАК) — primary subsequent тригер. Myeloid NGS
  panel має захоплювати RUNX1 (повний coding region), ASXL1, BCOR,
  моносомію-7 / del(5q) emergence, і TP53.

  **Щорічний молекулярний моніторинг:** Кількісний молекулярний
  tracking гермінативного RUNX1 варіанту + будь-яких задокументованих
  acquired clones (ASXL1, BCOR, моносомія-7) виконується щорічно за
  наявності sensitive assay.

  **Bleeding-history огляд + medication огляд:** Щорічний
  структурований огляд bleeding burden (мукокутаний, surgical,
  obstetric); огляд медикаментів для antiplatelet drugs, що мають
  уникатися; pre-procedure platelet-function-aware coagulation
  консультація для будь-якої запланованої major surgery.

  **Cascade germline тестування для родичів першого ступеня:**
  Задокументоване buccal / fibroblast / cultured-skin germline
  підтвердження потрібне — НЕ лише на крові.

  **Donor-screening протокол:** Будь-який кандидат-сиблінг-донор має
  бути germline-тестований перед HSC mobilization. RUNX1-носії-
  сиблінги НЕ можуть донорити ураженому сиблінгу — donor-derived
  ГМЛ / МДС у FPD/AML родоводах — best-documented donor-derived-
  leukemia сценарій у hereditary-myeloid літературі (Owen et al.
  2008).

  Per CHARTER §11 framing автономії пацієнта.

