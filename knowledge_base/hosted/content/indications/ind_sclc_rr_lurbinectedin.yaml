  disease_id: DIS-SCLC
  line_of_therapy: 2
  stage_requirements:
    - "Relapsed or refractory SCLC after platinum-based 1L (CTFI ≥30 days from last platinum dose required for label indication)"
    - "Extensive-stage OR limited-stage with progression after definitive chemoradiation"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

