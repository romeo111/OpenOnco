do_not_do:
  - "Не використовувати HRCT як скринінговий тест у безсимптомних пацієнтів із SSc без ILD — низька діагностична цінність, накопичена променева доза; достатньо PFT та клінічної переоцінки."
  - "Не ігнорувати зниження DLCO >15% або FVC >10% — потребують повторного HRCT для виключення прогресування ILD проти нового злоякісного процесу."
  - "Не пропускати консультування щодо відмови від куріння — найбільш модифікований фактор ризику в популяції пацієнтів із SSc, які курять."
  - "Не призначати імуносупресанти (мікофенолат, циклофосфамід (cyclophosphamide)) без рутинного дерматологічного та онкологічного оглядового спостереження — підвищений ризик неоплазій."
  - "Не відкладати діагностичне обстеження підозрілого вузлика в легенях за критеріями Fleischner/Lung-RADS — рання стадія NSCLC має значно кращі результати лікування."

do_not_do_en:
  - "Do not use HRCT as a screening test in asymptomatic SSc without ILD — low yield, accumulated radiation; PFTs + clinical reassessment suffice."
  - "Do not ignore DLCO decline >15% or FVC decline >10% — these warrant repeat HRCT to distinguish ILD progression from new malignancy."
  - "Do not skip smoking-cessation counseling — the most modifiable risk factor in the SSc + smoking population."
  - "Do not prescribe immunosuppressants (mycophenolate, cyclophosphamide) without routine dermatologic + neoplasia surveillance — elevated neoplasia risk."
  - "Do not delay diagnostic workup of a suspicious pulmonary nodule per Fleischner/Lung-RADS — early-stage NSCLC has materially better outcomes."

