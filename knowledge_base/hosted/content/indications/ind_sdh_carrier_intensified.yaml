    position: context
    relevant_quote_paraphrase: >-
      "Earlier baseline imaging and closer biochemistry interval are
      appropriate intensifications for confirmed SDHx carriers with
      family-specific pediatric-onset PPGL or post-resection
      metastatic-risk kindreds, following shared decision-making."

do_not_do:
  - "Не переносити вихідну візуалізацію на вік 5 років без задокументованого педіатричного дебюту в родині пробанда — тягар седації / анестезії та довічного кумулятивного спостереження не виправданий."
  - "Не застосовувати емпіричне PRRT (177Lu-DOTATATE) у безсимптомного носія — призначати лише при метастатичному / прогресуючому захворюванні."
  - "Не пропускати консультування щодо батьківського успадкування при преконцепційному генетичному консультуванні носіїв SDHD / SDHAF2 — материнський і батьківський шляхи передачі мають кардинально різні наслідки."
  - "Не призначати емпіричну терапію, спрямовану на соматостатинові рецептори (октреотид / ланреотид), безсимптомному носію — призначати лише при симптомному функціонуючому або метастатичному захворюванні."
  - "Не інтенсифікувати біохімічний контроль до кожних 6 місяців у всіх носіїв SDHB — виправдано лише за наявності PPGL в анамнезі або родини високого метастатичного ризику."

do_not_do_en:
  - "Do not advance baseline imaging to age 5 without family-specific pediatric-onset proband — sedation / anesthesia burden and lifelong cumulative surveillance are not justified otherwise."
  - "Do not use empirical PRRT (177Lu-DOTATATE) in an asymptomatic carrier — reserve for metastatic / progressive disease."
  - "Do not skip paternal-inheritance counseling in SDHD / SDHAF2 pre-conception genetic counseling — maternal vs paternal transmission has fundamentally different implications."
  - "Do not prescribe empirical somatostatin-receptor-targeted therapy (octreotide / lanreotide) in an asymptomatic carrier — reserve for symptomatic functional or metastatic disease."
  - "Do not intensify biochemistry to q6mo in all SDHB carriers — reserve for prior-PPGL history or metastatic-risk pedigree."

