do_not_do:
  - "Не пропускати педіатричне спостереження у носіїв SDHB — параганглioми можуть дебютувати в дитячому віці."
  - "Не ігнорувати ризик GIST у SDH-позитивних пацієнтів — підгрупа Carney-Stratakis."
  - "Не обмежувати каскадне тестування SDHD/SDHAF2 материнською лінією — геномний імпринтинг змінює характер успадкування."

do_not_do_en:
  - "Do not skip pediatric surveillance in SDHB carriers — childhood-onset paragangliomas."
  - "Do not ignore GIST awareness in SDH+ — Carney-Stratakis subset."
  - "Do not use maternal-side cascade testing for SDHD/SDHAF2 — imprinting alters inheritance pattern."

