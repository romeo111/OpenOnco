rationale: >
  Standard-track confirmed-carrier surveillance pathway for SDHA-
  positive carriers (paraganglioma syndrome 5 / PGL5).

  **Imaging cadence calibrated to SDHA lower-risk profile:**
    - Whole-body MRI biennially from age 18-20 (no pediatric whole-
      body MRI given adulthood-onset profile — median PPGL onset 30s-
      50s; pediatric MRI not justified by ~10-20% lifetime risk).
    - Head + neck MRI q3y for parasympathetic paraganglioma screening
      (carotid body, jugulo-tympanic, vagal, skull base).
    - Abdominal MRI q2y consolidated with whole-body MRI when feasible
      — covers SDH-deficient GIST + sympathetic abdominal PGL + the
      rare clear-cell / type-2-papillary RCC.
    - 68Ga-DOTATATE PET reserved for staging confirmed lesions (high
      somatostatin-receptor-2 expression in SDHx-PPGL), not routine
      surveillance.

  **Biochemistry — plasma free metanephrines + methoxytyramine (3-MT):**
  Annual seated-rest plasma sample. 3-MT inclusion critical for SDHx-
  associated paragangliomas (frequently dopaminergic / non-norepinephrine-
  secreting; standard metanephrine panel without 3-MT misses these).
  Urinary 24-hour metanephrines + catecholamines acceptable alternative.
  Pre-analytic: 30-min seated rest; avoid food / caffeine / tricyclics
  / sympathomimetics 8-12 hours prior.

  **Cascade testing:** Mandates genetic counseling offer to all first-
  degree relatives; SDHA inheritance is autosomal-dominant without
  SDHD / SDHAF2 maternal-imprinting — penetrant from either parent, so
  both maternal and paternal first-degree relatives are at equal risk.

  **Treatment considerations (referenced — not part of surveillance
  but counseled at carrier visits):** When a PPGL is detected, pre-
  operative alpha-blockade ≥7-14 days (phenoxybenzamine or doxazosin)
  is mandatory before resection — prevents intra-operative hypertensive
  crisis. Cortical-sparing adrenalectomy preferred for unilateral
  pheochromocytoma to preserve adrenal function. SDH-deficient GIST
  managed surgically or by surveillance (imatinib not indicated —
  wild-type c-KIT / PDGFRA biology renders it ineffective).
  Metastatic SDH-deficient PPGL: 131I-MIBG (in tumors with positive
  uptake) or 177Lu-DOTATATE peptide-receptor radionuclide therapy
  (PRRT) per international expert-center protocols (Endocrine Society
  + ENETS).

  Per CHARTER §11: patient autonomy framing — the biennial schedule is
  the recommended cadence but the shared-decision-making window
  permits annual imaging in patients with high anxiety burden or
  closer family-history-driven concerns; conversely the alternative
  symptom-driven track (IND-SDHA-CARRIER-SYMPTOM-DRIVEN) accommodates
  patients prioritising lower imaging burden.

rationale_ua: >
  Стандартний-трек confirmed-carrier surveillance для SDHA-positive
  carriers (paraganglioma syndrome 5 / PGL5).

  **Imaging cadence calibrated до SDHA lower-risk profile:**
    - Whole-body MRI biennially з 18-20 років (без pediatric whole-
      body MRI через adulthood-onset profile — median PPGL onset 30-
      50 років; pediatric MRI не виправданий при ~10-20% lifetime
      ризику).
    - Head + neck MRI q3y для парасимпатичних PGL screening (carotid
      body, jugulo-tympanic, vagal, skull base).
    - Abdominal MRI q2y consolidated з whole-body MRI коли feasible —
      покриває SDH-deficient GIST + sympathetic abdominal PGL + rare
      clear-cell / type-2-papillary RCC.
    - 68Ga-DOTATATE PET — staging confirmed lesions, не routine.

  **Біохімія — plasma free метанефрини + methoxytyramine (3-MT):**
  Annual seated-rest plasma sample. Inclusion 3-MT critical для
  SDHx-associated PGL (frequently dopaminergic; standard metanephrine
  panel без 3-MT misses these). Urinary 24-hour acceptable
  alternative. Pre-analytic: 30-min seated rest; avoid food / caffeine
  / tricyclics 8-12 годин.

  **Cascade тестування:** mandates first-degree родичам; SDHA
  inheritance autosomal-dominant без SDHD / SDHAF2 maternal-imprinting
  — penetrant від будь-якого з батьків.

  **Treatment considerations:** Коли PPGL виявлено — preoperative
  alpha-blockade ≥7-14 днів (phenoxybenzamine або doxazosin) mandatory
  перед resection. Cortical-sparing adrenalectomy preferred при
  unilateral феохромоцитомі. SDH-deficient GIST — surgical /
  surveillance, не imatinib (wild-type c-KIT / PDGFRA — imatinib
  ineffective). Metastatic SDH-deficient PPGL: 131I-MIBG (з positive
  uptake) або 177Lu-DOTATATE PRRT per expert-center protocols.

  Per CHARTER §11: автономія пацієнта — biennial — recommended
  cadence, shared-decision permits annual у high-anxiety або family-
  history-driven concerns; alternative symptom-driven track
  accommodates lower-imaging-burden preference.

