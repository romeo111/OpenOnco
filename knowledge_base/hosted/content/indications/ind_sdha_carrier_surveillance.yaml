expected_outcomes:
  overall_response_rate: >-
    Structured SDHA surveillance per Endocrine Society International
    PPGL Guideline + multi-society SDHx-syndromes consensus detects
    paragangliomas / pheochromocytomas at smaller, biochemically-quiet
    pre-symptomatic stage — amenable to complete surgical resection
    with low operative mortality. SDHA's lower lifetime PPGL risk
    (~10-20%) + adulthood-onset profile + low metastatic potential
    drive the lighter biennial whole-body MRI cadence (vs annual in
    SDHB). SDH-deficient GIST detected indolently — surveillance /
    surgical management rather than imatinib (c-KIT / PDGFRA wild-type
    biology renders imatinib ineffective).

