sources:
  - source_id: SRC-NCCN-NET-2025
    position: context
    relevant_quote_paraphrase: >-
      "Confirmed SDHA carriers enter structured multi-organ surveillance
      with biennial whole-body MRI from late adolescence / early
      adulthood, annual plasma metanephrines + methoxytyramine, head +
      neck MRI q3y, and abdominal MRI for SDH-deficient GIST + RCC.
      Surveillance cadence is calibrated to SDHA's lower lifetime PPGL
      risk (~10-20%) and adulthood-onset profile vs SDHB / SDHD."
  - source_id: SRC-ENDOCRINE-SOCIETY-MEN-2023
    position: context
    relevant_quote_paraphrase: >-
      "Pre-operative alpha-blockade ≥7-14 days with phenoxybenzamine
      or doxazosin and crystalloid loading is mandatory before
      paraganglioma / pheochromocytoma resection."

do_not_do:
  - "Не використовувати тільки standard метанефриновий panel без methoxytyramine — SDHx-associated paragangliomas frequently dopaminergic; 3-MT необхідний для adequate біохімії."
  - "Не виконувати adrenalectomy / PGL resection без preoperative alpha-blockade — intra-operative hypertensive crisis ризик life-threatening; mandatory ≥7-14 днів."
  - "Не використовувати empirical imatinib для SDH-deficient GIST у SDHA carrier — c-KIT та PDGFRA wild-type; ineffective; surveillance / surgical management appropriate."
  - "Не призначати pediatric whole-body MRI у SDHA carrier без family-specific pediatric-onset proband — adulthood-onset profile робить sedation / anesthesia burden + cumulative MRI surveillance не виправданими."
  - "Не пропускати cascade testing offer first-degree родичам — SDHA autosomal-dominant penetrant від будь-якого з батьків, materno- та paterno-line carriers equally at risk."

do_not_do_en:
  - "Do not use a standard metanephrine panel alone without methoxytyramine — SDHx-associated paragangliomas are frequently dopaminergic; 3-MT is necessary for adequate biochemistry."
  - "Do not perform adrenalectomy / PGL resection without preoperative alpha-blockade — intraoperative hypertensive crisis is life-threatening; mandatory ≥7-14 days."
  - "Do not use empirical imatinib for SDH-deficient GIST in an SDHA carrier — c-KIT and PDGFRA wild-type; ineffective; surveillance / surgical management is appropriate."
  - "Do not prescribe pediatric whole-body MRI in an SDHA carrier without a family-specific pediatric-onset proband — the adulthood-onset profile makes sedation / anesthesia burden and cumulative MRI surveillance unjustified."
  - "Do not skip cascade testing offer to first-degree relatives — SDHA is autosomal-dominant penetrant from either parent; maternal-line and paternal-line carriers are equally at risk."

