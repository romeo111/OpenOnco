rationale: >
  Alternative track for SDHA confirmed carriers: replaces scheduled
  biennial whole-body MRI with biochemistry-only surveillance +
  cross-sectional imaging triggered by abnormal biochemistry or signs
  / symptoms. Plan-track labelled "aggressive" in the engine's binary
  framing — clinically this is the LESS-intensive of the two SDHA
  tracks. Patient-shared-decision-making point.

  **Surveillance:**
    - Plasma free metanephrines + methoxytyramine (3-MT) annually
      (same cadence as standard track).
    - NO scheduled whole-body MRI; cross-sectional imaging (whole-body
      MRI or directed CT / MRI) triggered by:
        - Biochemistry abnormality (3-MT or metanephrines elevated).
        - Signs / symptoms (hypertensive paroxysm, palpitations,
          headache, sweating, abdominal mass).
        - Family-history evolution (new affected relative — escalate
          to standard scheduled imaging).
    - Annual clinical visit with blood-pressure measurement, symptom
      review, and re-counseling on transition triggers back to
      scheduled imaging.

  **Counseling re: trade-off:** Lead-time advantage of scheduled
  imaging is forfeit on this track. Symptomatic PPGL presentation
  carries higher operative risk (catecholamine excess + larger tumor
  size + greater haemodynamic lability requiring more extensive
  preoperative alpha-blockade). Patient retains right to revert to
  scheduled-imaging track at any time. Engineered around SDHA's
  ~10-20% lifetime PPGL risk + low metastatic rate — not transferable
  to SDHB (which mandates intensive scheduled imaging).

  **Cascade testing:** Continues identically — offered to all first-
  degree relatives regardless of which surveillance track the carrier
  selects.

  **Treatment considerations** (same as standard track when PPGL
  detected): Pre-operative alpha-blockade ≥7-14 days, cortical-sparing
  adrenalectomy when feasible, surgical / surveillance management of
  SDH-deficient GIST (NOT imatinib), 131I-MIBG / 177Lu-DOTATATE PRRT
  for metastatic SDH-deficient PPGL per international expert-center
  protocols.

  Per CHARTER §11: patient-autonomy framing — this is a legitimate
  shared-decision-making endpoint provided the carrier understands
  the forfeit of lead-time and the higher operative-risk profile of
  symptomatic-presentation PPGL.

rationale_ua: >
  Alternative track для SDHA confirmed carriers: replaces scheduled
  biennial whole-body MRI з biochemistry-only surveillance + cross-
  sectional imaging triggered by abnormal biochemistry / signs /
  symptoms. Plan-track labelled "aggressive" у бінарному engine
  framing — clinically це LESS-intensive з двох SDHA tracks. Patient-
  shared-decision-making point.

  **Surveillance:**
    - Plasma free метанефрини + methoxytyramine (3-MT) annually
      (same cadence що й standard track).
    - НЕМАЄ scheduled whole-body MRI; cross-sectional imaging
      triggered by:
        - Biochemistry abnormality (3-MT / метанефрини підвищені).
        - Signs / symptoms (hypertensive paroxysm, palpitations,
          headache, sweating, abdominal mass).
        - Family-history evolution (new affected relative — escalate
          до scheduled imaging).
    - Annual clinical visit з BP measurement, symptom review, re-
      counseling re: transition triggers назад до scheduled imaging.

  **Counseling re: trade-off:** Lead-time advantage scheduled imaging
  forfeit. Symptomatic PPGL presentation carries higher operative
  ризик (catecholamine excess + larger tumor + greater haemodynamic
  lability — more extensive preoperative alpha-blockade required).
  Patient retains right to revert до scheduled-imaging track. Engineered
  навколо SDHA ~10-20% lifetime PPGL risk + low metastatic rate — НЕ
  transferable до SDHB.

  **Cascade тестування:** continues identically — first-degree
  родичам незалежно від обраного track.

  **Treatment considerations** (same як standard коли PPGL detected):
  preoperative alpha-blockade ≥7-14 днів, cortical-sparing
  adrenalectomy коли feasible, surgical / surveillance для SDH-
  deficient GIST (НЕ imatinib), 131I-MIBG / 177Lu-DOTATATE PRRT для
  metastatic SDH-deficient PPGL.

  Per CHARTER §11: автономія пацієнта — legitimate shared-decision-
  making endpoint якщо carrier розуміє forfeit lead-time + higher
  operative-risk profile symptomatic-presentation PPGL.

