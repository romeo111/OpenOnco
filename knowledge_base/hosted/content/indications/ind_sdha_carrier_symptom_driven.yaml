expected_outcomes:
  overall_response_rate: >-
    Alternative less-intensive track for adult SDHA carriers
    prioritising lower imaging burden / cumulative-MRI exposure /
    healthcare utilisation. Trade-off: replaces scheduled biennial
    whole-body MRI with biochemistry-driven cross-sectional imaging
    (i.e. MRI only when biochemistry abnormal or signs / symptoms
    develop). Acceptable framing for SDHA's lower lifetime PPGL risk
    (~10-20%) + low metastatic potential + adulthood-onset profile;
    NOT acceptable for SDHB or for SDHA carriers with pediatric-
    onset family-specific proband. Patient counselled that lead-time
    advantage of scheduled imaging is forfeit and that symptomatic
    PPGL has higher operative risk profile (catecholamine excess +
    larger tumor size at diagnosis).

