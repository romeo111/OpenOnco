sources:
  - source_id: SRC-NCCN-NET-2025
    position: context
    relevant_quote_paraphrase: >-
      "Symptom-driven and biochemistry-only surveillance has been
      proposed as a shared-decision-making alternative for lower-
      penetrance SDHA carriers prioritising reduced cumulative MRI
      burden. Patient is counselled that lead-time advantage is forfeit
      and symptomatic PPGL has higher operative risk profile."
  - source_id: SRC-ENDOCRINE-SOCIETY-MEN-2023
    position: context
    relevant_quote_paraphrase: >-
      "Cortical-sparing adrenalectomy with bilateral preservation
      strategy and preoperative alpha-blockade reduce post-operative
      adrenal insufficiency risk in hereditary pheochromocytoma
      management."

do_not_do:
  - "Не пропонувати symptom-driven track SDHB / SDHD / SDHC carrier — calibrated тільки для SDHA's lower penetrance + adulthood-onset profile."
  - "Не пропонувати symptom-driven track SDHA carrier з family-specific pediatric-onset proband — child-onset proband shifts management до intensive scheduled imaging."
  - "Не використовувати empirical imatinib для SDH-deficient GIST — c-KIT / PDGFRA wild-type; ineffective; surgical / surveillance management."
  - "Не пропускати annual biochemistry навіть на symptom-driven track — biochemistry triggers cross-sectional imaging; її відсутність нівелює track."
  - "Не виконувати PPGL resection без preoperative alpha-blockade — life-threatening hypertensive crisis ризик; mandatory ≥7-14 днів незалежно від track."

do_not_do_en:
  - "Do not offer the symptom-driven track to SDHB / SDHD / SDHC carriers — it is calibrated only for SDHA's lower penetrance and adulthood-onset profile."
  - "Do not offer the symptom-driven track to an SDHA carrier with a family-specific pediatric-onset proband — child-onset proband shifts management to intensive scheduled imaging."
  - "Do not use empirical imatinib for SDH-deficient GIST — c-KIT / PDGFRA wild-type; ineffective; surgical / surveillance management."
  - "Do not skip annual biochemistry even on the symptom-driven track — biochemistry triggers cross-sectional imaging; omitting it negates the track."
  - "Do not perform PPGL resection without preoperative alpha-blockade — life-threatening hypertensive-crisis risk; mandatory ≥7-14 days regardless of track."

