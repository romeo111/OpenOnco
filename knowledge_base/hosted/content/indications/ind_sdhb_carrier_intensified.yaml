sources:
  - source_id: SRC-NCCN-NET-2025
    position: context
    relevant_quote_paraphrase: >-
      "Earlier baseline imaging (age 5) and closer biochemistry interval
      (q6mo plasma metanephrines + methoxytyramine) plus annual
      functional PET supplement are appropriate intensifications for
      confirmed SDHB carriers in highest-risk subsets — family-specific
      pediatric-onset proband, prior PPGL history, or metastatic-PPGL
      pedigree."
  - source_id: SRC-ENDOCRINE-SOCIETY-MEN-2023
    position: context
    relevant_quote_paraphrase: >-
      "Metastatic SDHB-paraganglioma management includes 131I-MIBG (if
      MIBG-positive on diagnostic scan), 177Lu-DOTATATE peptide-receptor
      radionuclide therapy, cyclophosphamide / vincristine / dacarbazine
      (CVD) cytotoxic chemotherapy, and emerging HIF-2α inhibitor
      belzutifan, per international expert-center protocols."

do_not_do:
  - "Не advanceувати baseline imaging до age 5 без family-specific pediatric-onset proband — sedation / anesthesia burden + lifelong cumulative surveillance не виправдані."
  - "Не intensifyувати biochemistry до q6mo у всіх SDHB carriers — реверв для prior-PPGL history, metastatic pedigree, або documented prior biochemistry signal."
  - "Не використовувати empirical PRRT (177Lu-DOTATATE) у asymptomatic SDHB carrier — реверв для metastatic / progressive disease."
  - "Не виконувати empirical bilateral adrenalectomy у SDHB carrier — cortical-sparing preferred."
  - "Не призначати empirical belzutifan або CVD регімен у asymptomatic carrier — реверв для diagnosed metastatic SDHB-PPGL."

do_not_do_en:
  - "Do not advance baseline imaging to age 5 without a family-specific pediatric-onset proband — sedation / anesthesia burden and lifelong cumulative surveillance are not justified otherwise."
  - "Do not intensify biochemistry to q6mo in all SDHB carriers — reserve for prior-PPGL history, metastatic pedigree, or documented prior biochemistry signal."
  - "Do not use empirical PRRT (177Lu-DOTATATE) in an asymptomatic SDHB carrier — reserve for metastatic / progressive disease."
  - "Do not perform empirical bilateral adrenalectomy in an SDHB carrier — cortical-sparing is preferred."
  - "Do not prescribe empirical belzutifan or CVD regimen in an asymptomatic carrier — reserve for diagnosed metastatic SDHB-PPGL."

