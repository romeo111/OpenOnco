rationale: >
  Aggressive-track SDHB confirmed-carrier pathway layered on top of
  IND-SDHB-CARRIER-SURVEILLANCE.

  **Foundation:** All standard surveillance from IND-SDHB-CARRIER-
  SURVEILLANCE applies — annual whole-body MRI from age 6-10, plasma
  metanephrines + 3-MT q12mo, head + neck MRI q2-3y, abdominal MRI
  q12mo, mandatory pre-operative alpha-blockade for any PPGL resection,
  cortical-sparing adrenalectomy preference, cascade testing.

  **Intensification 1 — Earlier baseline imaging (age 5):** When the
  family-specific proband has documented PPGL or SDH-deficient RCC
  before age 10, advance baseline whole-body MRI from age 6-10 to age
  5 (or earlier if proband even younger). Trade-off: requires age-
  appropriate sedation / general anaesthesia for compliant pediatric
  MRI; high family counselling burden; cumulative MRI-related
  considerations across decades; no IV gadolinium contrast in younger
  children unless specifically indicated.

  **Intensification 2 — Closer biochemistry interval + functional
  imaging supplement (q6mo + annual PET):** For SDHB carriers in
  highest-risk subset:
    - Prior PPGL history (post-resection surveillance — recurrence
      / contralateral primary / metastatic risk).
    - Family pedigree with metastatic SDHB-PPGL (informs propensity
      for metastatic biology in proband-line carriers).
    - Documented prior elevated 3-MT or metanephrine signal requiring
      ongoing monitoring.

  Biochemistry: q6mo plasma metanephrines + 3-MT (vs annual on standard
  track). Any abnormal biochemical signal triggers prompt cross-
  sectional MRI + functional PET imaging — 68Ga-DOTATATE PET (preferred
  for SDHx-PPGL high SSTR2 expression) or 18F-FDG PET (alternative —
  SDHB-PPGL characteristically FDG-avid, sometimes more sensitive than
  DOTATATE in SDHB-driven metastatic disease).

  Functional imaging supplement: annual 18F-FDG PET (preferred for
  SDHB) OR 68Ga-DOTATATE PET in the highest-risk subset as a
  supplement (not replacement) of anatomic MRI; supplementary functional
  imaging targets the early-metastatic-conversion window where small
  metabolic-active lesions may escape annual MRI detection.

  **Treatment considerations (intensified — narrated for shared-
  decision-making):**
    - For diagnosed SDHB-PPGL: complete surgical resection by hereditary-
      PPGL-experienced surgical team in centre with multidisciplinary
      endocrine + oncology + nuclear-medicine team; pre-operative alpha-
      blockade ≥10-14 days (longer than minimum 7-day in SDHB given
      catecholamine excess tolerance).
    - For metastatic SDHB-PPGL: 131I-MIBG (in MIBG-positive tumors;
      SDHB-PPGL frequently MIBG-negative, so DOTATATE PET informs
      eligibility); 177Lu-DOTATATE PRRT (NETTER-1-style protocol);
      CVD (cyclophosphamide / vincristine / dacarbazine) cytotoxic
      regimen; HIF-2α inhibitor belzutifan (approved in VHL-PPGL —
      expanding indication evaluations in SDHB-PPGL).
    - Pre-conception genetic counselling (PGT, prenatal-diagnosis
      options) appropriate for carriers of childbearing age — SDHB
      autosomal-dominant transmission affects 50% of offspring.

  **Cascade testing remains continuous:** every visit re-confirms family
  testing status; critical for pediatric kindred — the family-specific
  age of earliest proband determines whether age-5 or age-6-10 baseline
  applies in the next generation.

  Per CHARTER §11: intensified pediatric surveillance + closer biochemistry
  interval are shared-decision-making domains. Family-specific
  intensification triggers (pediatric-onset proband, prior PPGL history,
  metastatic pedigree) are evidence-based clinical thresholds rather
  than universal SDHB application.

rationale_ua: >
  Aggressive-track SDHB carrier pathway: накладений поверх
  IND-SDHB-CARRIER-SURVEILLANCE.

  **Foundation:** усе standard з IND-SDHB-CARRIER-SURVEILLANCE.

  **Інтенсифікація 1 — Earlier baseline imaging (age 5):** Коли
  family-specific proband має documented PPGL / RCC до 10 років —
  advance baseline whole-body MRI з 6-10 до 5 років (або раніше якщо
  proband молодший). Trade-off: sedation / general anesthesia
  потрібна для compliant pediatric MRI; family counseling burden;
  cumulative MRI considerations; без IV gadolinium у younger дітей.

  **Інтенсифікація 2 — Closer біохімія + functional imaging (q6mo +
  annual PET):** Для SDHB carriers у highest-risk subset:
    - Prior PPGL history (post-resection surveillance).
    - Family pedigree з metastatic SDHB-PPGL.
    - Documented prior elevated 3-MT / метанефрини сигнал.

  Біохімія: q6mo plasma метанефрини + 3-MT. Будь-який abnormal
  biochemical signal triggers prompt cross-sectional MRI + functional
  PET — 68Ga-DOTATATE PET (preferred SSTR2) або 18F-FDG PET (alternative
  — SDHB-PPGL характерно FDG-avid).

  Functional imaging supplement: annual 18F-FDG PET (preferred SDHB)
  АБО 68Ga-DOTATATE PET у highest-risk subset як supplement (не
  replacement) anatomic MRI; targets early-metastatic-conversion вікно.

  **Treatment considerations (intensified):**
    - Diagnosed SDHB-PPGL: complete surgical resection hereditary-PPGL-
      experienced хірургічною командою; pre-operative alpha-blockade
      ≥10-14 днів (longer than 7-day minimum SDHB через catecholamine
      tolerance).
    - Metastatic SDHB-PPGL: 131I-MIBG (з positive uptake; SDHB-PPGL
      frequently MIBG-negative), 177Lu-DOTATATE PRRT, CVD регімен,
      belzutifan (HIF-2α inhibitor approved VHL-PPGL; expanding evaluations
      у SDHB-PPGL).
    - Pre-conception genetic counseling (PGT, prenatal-diagnosis)
      appropriate для carriers childbearing age — SDHB autosomal-
      dominant 50% offspring.

  **Cascade тестування continuous;** family-specific earliest-proband
  вік драйвить age-5 vs age-6-10 baseline у next generation.

  Per CHARTER §11: shared-decision-making домен; family-specific
  intensification triggers — evidence-based clinical thresholds, не
  universal SDHB application.

