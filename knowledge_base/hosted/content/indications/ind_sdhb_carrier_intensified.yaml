expected_outcomes:
  overall_response_rate: >-
    Aggressive-track SDHB carrier surveillance layers two intensifications
    on top of the standard pathway: (1) earlier baseline whole-body MRI
    (age 5 in pediatric-onset kindreds — when family-specific proband
    PPGL or RCC before age 10); (2) closer biochemistry interval
    (q6-mo plasma metanephrines + 3-MT in highest-risk subset — prior
    PPGL history / post-resection / metastatic-PPGL pedigree) plus
    annual 18F-FDG PET or 68Ga-DOTATATE PET functional imaging
    supplement. Trade-off: increased imaging / biochemistry burden,
    more lifetime surveillance visits, sedation burden in pediatric
    carriers, increased anxiety burden — all shared-decision-making
    points. Goal: maximise lead-time advantage for SDHB-associated
    aggressive paragangliomas (metastatic-onset event is the dominant
    SDHB mortality driver — earlier detection narrows the window in
    which a tumor can transition from localised to metastatic).

