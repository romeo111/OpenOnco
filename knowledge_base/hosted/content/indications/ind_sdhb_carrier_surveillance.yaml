sources:
  - source_id: SRC-NCCN-NET-2025
    position: context
    relevant_quote_paraphrase: >-
      "Confirmed SDHB carriers undergo intensive surveillance with
      annual whole-body MRI from age 6-10, plasma metanephrines +
      methoxytyramine annually, head + neck MRI q2-3y, and abdominal
      MRI for sympathetic PGL + SDH-deficient RCC and GIST.
      Pre-operative alpha-blockade ≥7-14 days is mandatory before any
      paraganglioma / pheochromocytoma resection."
  - source_id: SRC-ENDOCRINE-SOCIETY-MEN-2023
    position: context
    relevant_quote_paraphrase: >-
      "Pediatric onset is documented in approximately 10% of SDHB
      pedigrees, and surveillance baseline at age 6-10 (younger if
      family-specific proband younger) is recommended to maximise
      lead-time before the dominant SDHB-PPGL metastatic-event
      mortality driver."

do_not_do:
  - "Не пропускати SDHB pediatric surveillance — whole-body MRI baseline age 6-10 (younger якщо family-specific early-onset proband); pediatric onset documented у ~10% kindreds."
  - "Не використовувати тільки standard метанефриновий panel без methoxytyramine — SDHx-associated paragangliomas frequently dopaminergic; 3-MT необхідний."
  - "Не виконувати PPGL / RCC resection без preoperative alpha-blockade (для PPGL) — intra-operative hypertensive crisis ризик life-threatening; mandatory ≥7-14 днів."
  - "Не використовувати imatinib empirically для SDH-deficient GIST — c-KIT та PDGFRA wild-type; ineffective; surveillance / surgical management appropriate."
  - "Не виконувати empirical bilateral adrenalectomy у SDHB carrier — cortical-sparing adrenalectomy preferred при unilateral феохромоцитомі для preservation адреналової функції."

do_not_do_en:
  - "Do not skip SDHB pediatric surveillance — whole-body MRI baseline age 6-10 (younger if family-specific early-onset proband); pediatric onset is documented in ~10% of kindreds."
  - "Do not use a standard metanephrine panel alone without methoxytyramine — SDHx-associated paragangliomas are frequently dopaminergic; 3-MT is necessary."
  - "Do not perform PPGL / RCC resection without preoperative alpha-blockade (for PPGL) — intraoperative hypertensive-crisis risk is life-threatening; mandatory ≥7-14 days."
  - "Do not use imatinib empirically for SDH-deficient GIST — c-KIT and PDGFRA wild-type; ineffective; surveillance / surgical management is appropriate."
  - "Do not perform empirical bilateral adrenalectomy in an SDHB carrier — cortical-sparing adrenalectomy is preferred for unilateral pheochromocytoma to preserve adrenal function."

