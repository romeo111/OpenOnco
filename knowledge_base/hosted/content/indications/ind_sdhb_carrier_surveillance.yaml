expected_outcomes:
  overall_response_rate: >-
    Structured SDHB surveillance per Endocrine Society International
    PPGL Guideline + Andrews et al. JCEM 2018 international registry
    + ENS-AT collaborative experience detects paragangliomas /
    pheochromocytomas at smaller, pre-symptomatic, biochemically-quiet
    stage — amenable to complete surgical resection with low operative
    mortality and reduced metastatic risk. Early-stage detection is
    particularly impactful for SDHB given the ~30-70% metastatic rate
    of clinically-presenting SDHB-PPGL (vs <10% in earlier-stage
    detected PPGL). SDH-deficient RCC detected at small T1 stage
    allows nephron-sparing surgery. Whole-body MRI annual cadence is
    justified by SDHB's pediatric-onset documentation + aggressive
    metastatic biology + most pediatric kindred experience showing
    benefit of early-stage detection.

