rationale: >
  Standard-track confirmed-carrier intensive surveillance pathway for
  SDHB-positive carriers (paraganglioma syndrome 4 / PGL4) — the
  highest-risk SDHx subunit.

  **Imaging cadence:**
    - Whole-body MRI annually starting age 6-10 (extends brain, neck,
      chest, abdomen, pelvis; some programs add limbs). Younger
      baseline if family-specific proband onset before age 10 (age 5
      acceptable). SDHB pediatric onset documented in ~10% of kindreds
      drives the early baseline.
    - Head + neck MRI q2-3y for parasympathetic paragangliomas (skull
      base, carotid body, vagal, jugulo-tympanic) — even though SDHB
      tumor distribution is predominantly sympathetic-abdominal /
      thoracic, head + neck PGLs do occur.
    - Abdominal MRI annually consolidated with whole-body MRI —
      covers sympathetic peri-aortic / organ-of-Zuckerkandl PGLs +
      SDH-deficient RCC + GIST.
    - 68Ga-DOTATATE PET reserved for staging confirmed lesions (high
      SSTR2 expression); 18F-FDG PET as alternative functional
      modality (SDHB-PPGL characteristically FDG-avid).

  **Biochemistry — plasma free metanephrines + methoxytyramine (3-MT):**
  Annual seated-rest plasma sample. 3-MT inclusion critical for SDHx-
  associated paragangliomas (frequently dopaminergic / non-norepinephrine-
  secreting; standard metanephrine panel without 3-MT misses these).
  Urinary 24-hour metanephrines + catecholamines as alternative.
  Pre-analytic: 30-min seated rest; avoid food / caffeine / tricyclics
  / sympathomimetics 8-12 hours prior.

  **Cascade testing — mandatory:** Genetic counseling offered to all
  first-degree relatives. SDHB inheritance is autosomal-dominant
  without SDHD / SDHAF2 maternal-imprinting — penetrant from either
  parent. Pediatric testing appropriate given documented pediatric
  onset (~10% of pedigrees). Family-tree-based pediatric onset
  determination drives whether age-5 vs age-6-10 baseline whole-body
  MRI applies in the next generation.

  **Treatment considerations (referenced — narrated in patient counselling
  at surveillance visits):**
    - Pre-operative alpha-blockade ≥7-14 days (phenoxybenzamine or
      doxazosin) is MANDATORY before any PPGL resection — prevents
      intra-operative hypertensive crisis and post-resection hypotension.
    - Cortical-sparing adrenalectomy preferred for unilateral
      pheochromocytoma to preserve adrenal function.
    - SDH-deficient RCC: nephron-sparing surgery preferred when feasible
      (small T1 lesions); preserves long-term renal function across
      decades of SDH-deficiency surveillance.
    - SDH-deficient GIST: surgical / surveillance management — imatinib
      ineffective in c-KIT / PDGFRA wild-type biology.
    - Metastatic SDH-deficient PPGL: 131I-MIBG (in tumors with positive
      uptake; SDHB-PPGL frequently MIBG-negative) or 177Lu-DOTATATE
      PRRT per international expert-center protocols (Endocrine Society
      + ENETS). Cytotoxic chemotherapy (cyclophosphamide / vincristine
      / dacarbazine — CVD regimen) historically used for metastatic
      SDHB-PPGL with limited durable benefit; newer HIF-2α inhibitor
      belzutifan is approved in VHL-PPGL and under evaluation in
      broader SDHB-PPGL metastatic disease.

  Per CHARTER §11: pediatric SDHB surveillance protocol requires age-
  appropriate counseling + parental shared-decision-making. Sedation /
  general anesthesia burden for compliant pediatric MRI is acknowledged
  but offset by the aggressive metastatic biology of SDHB-PPGL.

rationale_ua: >
  Стандартний-трек intensive confirmed-carrier surveillance для SDHB-
  positive carriers (paraganglioma syndrome 4 / PGL4) — highest-risk
  SDHx subunit.

  **Imaging cadence:**
    - Whole-body MRI annually з 6-10 років (brain, neck, chest, abdomen,
      pelvis). Younger baseline якщо family-specific proband onset
      до 10 років (age 5 acceptable). SDHB pediatric onset documented
      у ~10% kindreds.
    - Head + neck MRI q2-3y для парасимпатичних PGL.
    - Abdominal MRI annually consolidated з whole-body MRI — sympathetic
      peri-aortic / organ-of-Zuckerkandl PGL + SDH-deficient RCC + GIST.
    - 68Ga-DOTATATE PET — staging confirmed lesions (high SSTR2); 18F-FDG
      PET — alternative functional modality (SDHB-PPGL характерно
      FDG-avid).

  **Біохімія — plasma free метанефрини + methoxytyramine (3-MT):**
  Annual seated-rest plasma. Inclusion 3-MT critical (SDHx-PGL
  frequently dopaminergic). Pre-analytic: 30-min seated rest; avoid
  food / caffeine / tricyclics 8-12 годин.

  **Cascade тестування — mandatory:** first-degree родичам; SDHB
  autosomal-dominant без maternal-imprinting — penetrant від будь-якого
  з батьків. Pediatric testing appropriate. Family-tree pediatric-onset
  determination драйвить age-5 vs age-6-10 baseline whole-body MRI у
  next generation.

  **Treatment considerations:**
    - Preoperative alpha-blockade ≥7-14 днів (phenoxybenzamine /
      doxazosin) MANDATORY перед PPGL resection.
    - Cortical-sparing adrenalectomy preferred при unilateral
      феохромоцитомі.
    - SDH-deficient RCC: nephron-sparing surgery preferred.
    - SDH-deficient GIST: surgical / surveillance, не imatinib.
    - Metastatic SDH-deficient PPGL: 131I-MIBG (з positive uptake;
      SDHB-PPGL frequently MIBG-negative) або 177Lu-DOTATATE PRRT;
      CVD регімен historically; belzutifan (HIF-2α inhibitor) approved
      у VHL-PPGL та під оцінкою у broader SDHB-PPGL metastatic disease.

  Per CHARTER §11: pediatric SDHB surveillance потребує age-appropriate
  counseling + parental shared-decision-making. Sedation / anesthesia
  burden offset by aggressive metastatic biology SDHB-PPGL.

