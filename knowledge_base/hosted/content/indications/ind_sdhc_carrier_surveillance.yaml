sources:
  - source_id: SRC-NCCN-NET-2025
    position: context
    relevant_quote_paraphrase: >-
      "Confirmed SDHC carriers undergo head + neck MRI annually
      starting age 10-15, plasma metanephrines + methoxytyramine
      annually, and abdominal / whole-body MRI q2-3y. Surveillance
      cadence is calibrated to SDHC's lower lifetime PPGL risk
      (~10-15%) and predominantly head + neck parasympathetic
      distribution."
  - source_id: SRC-ENDOCRINE-SOCIETY-MEN-2023
    position: context
    relevant_quote_paraphrase: >-
      "Head + neck paraganglioma surgical management favors hearing-
      and cranial-nerve-preserving microsurgery for resectable lesions;
      stereotactic radiosurgery is acceptable for selected jugulo-
      tympanic and carotid-body tumors. Watchful waiting is acceptable
      for small, non-symptomatic, non-secretory lesions with indolent
      growth on serial imaging."

do_not_do:
  - "Не використовувати тільки standard метанефриновий panel без methoxytyramine — head + neck PGL у SDHC frequently dopaminergic; 3-MT необхідний."
  - "Не виконувати head + neck PGL resection без preoperative alpha-blockade при biochemistry-positive lesion — life-threatening hypertensive crisis ризик навіть у переважно non-secretory anatomy."
  - "Не виконувати extended-radical neck dissection для small carotid-body Shamblin-I lesion — hearing- / cranial-nerve-preservation microsurgery preferred; cranial-nerve sacrifice не виправдане."
  - "Не використовувати imatinib empirically для SDH-deficient GIST у SDHC carrier — c-KIT / PDGFRA wild-type; ineffective."
  - "Не пропускати annual head + neck MRI — dominant SDHC tumor location; lower-frequency cadence (q2-3y) miss малих парафарингеальних / skull-base lesions у hearing-preservation window."

do_not_do_en:
  - "Do not use a standard metanephrine panel alone without methoxytyramine — head + neck PGLs in SDHC are frequently dopaminergic; 3-MT is necessary."
  - "Do not perform head + neck PGL resection without preoperative alpha-blockade for a biochemistry-positive lesion — life-threatening hypertensive-crisis risk even in predominantly non-secretory anatomy."
  - "Do not perform extended-radical neck dissection for a small carotid-body Shamblin-I lesion — hearing- / cranial-nerve-preservation microsurgery is preferred; cranial-nerve sacrifice is not justified."
  - "Do not use empirical imatinib for SDH-deficient GIST in an SDHC carrier — c-KIT / PDGFRA wild-type; ineffective."
  - "Do not skip annual head + neck MRI — the dominant SDHC tumor location; a lower-frequency cadence (q2-3y) misses small parapharyngeal / skull-base lesions within the hearing-preservation window."

