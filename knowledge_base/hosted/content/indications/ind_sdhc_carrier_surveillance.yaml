expected_outcomes:
  overall_response_rate: >-
    Structured SDHC surveillance per Endocrine Society International
    PPGL Guideline + international PPGL registry data detects head +
    neck parasympathetic paragangliomas at smaller, hearing- /
    cranial-nerve-preserving stage — amenable to complete surgical
    resection or stereotactic-radiosurgery management with low morbidity.
    SDHC's lower lifetime PPGL risk (~10-15% per Andrews registry;
    ~25% aggregate in some series) and very low metastatic rate (<5%)
    drive a more focused surveillance protocol (head + neck MRI annually
    rather than annual whole-body MRI as in SDHB). Early-stage detection
    is particularly impactful for head + neck PGLs given cranial-nerve
    proximity — small lesions are amenable to hearing-preservation
    microsurgery or stereotactic radiosurgery, while large lesions
    risk facial-nerve / cochlear-vestibular-nerve / lower-cranial-nerve
    sacrifice.

