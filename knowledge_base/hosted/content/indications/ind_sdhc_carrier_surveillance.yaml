rationale: >
  Standard-track confirmed-carrier surveillance pathway for SDHC-positive
  carriers (paraganglioma syndrome 3 / PGL3).

  **Imaging cadence — head + neck focus:**
    - Head + neck MRI annually starting age 10-15 (parasympathetic
      head + neck PGL is the dominant SDHC tumor) — covers skull base,
      carotid body, jugular foramen, vagal nerve, jugulo-tympanic, and
      parapharyngeal space. High-resolution sequences (thin-cut T2,
      contrast-enhanced T1) recommended for sub-centimeter lesion
      detection.
    - Whole-body MRI q3y (or as locally available) — screens for the
      uncommon sympathetic abdominal PGL + the rare SDH-deficient RCC
      + SDH-deficient GIST; lower frequency than SDHB given much lower
      lifetime risk of those tumors in SDHC.
    - Abdominal MRI q2-3y consolidated with whole-body MRI when feasible.
    - 68Ga-DOTATATE PET reserved for staging confirmed lesions (high
      SSTR2 expression in SDHx-PPGL), not routine surveillance.

  **Biochemistry — plasma free metanephrines + methoxytyramine (3-MT):**
  Annual seated-rest plasma sample. 3-MT inclusion CRITICAL for SDHC
  given the dopaminergic / non-norepinephrine-secreting profile of
  many head + neck PGLs — standard metanephrine panel without 3-MT
  may miss these. Also retains value for the rare secretory PGL and
  for post-resection follow-up. Urinary 24-hour metanephrines +
  catecholamines as alternative. Pre-analytic: 30-min seated rest;
  avoid food / caffeine / tricyclics / sympathomimetics 8-12 hours
  prior.

  **Cascade testing:** Genetic counselling offered to first-degree
  relatives. SDHC inheritance is autosomal-dominant without SDHD /
  SDHAF2 maternal-imprinting — penetrant from either parent, so both
  maternal and paternal first-degree relatives are at equal risk.
  Pediatric testing acceptable but not urgent given SDHC's adolescent
  / adulthood-onset profile (vs SDHB pediatric documentation).

  **Treatment considerations (referenced — narrated at surveillance
  visits):**
    - Pre-operative alpha-blockade ≥7-14 days mandatory before
      resection of any secretory PGL (biochemistry-positive or
      hypertensive paroxysm history).
    - Head + neck PGL surgery: hearing-preservation and cranial-nerve-
      preservation microsurgery by experienced skull-base team
      preferred for resectable lesions; stereotactic radiosurgery
      (gamma-knife or cyber-knife) acceptable alternative for
      jugulo-tympanic / carotid-body lesions when surgical morbidity
      anticipated to be high.
    - Watchful-waiting management acceptable for small (<2cm),
      non-symptomatic, non-secretory head + neck PGLs with documented
      indolent growth pattern on serial MRI — particularly carotid-body
      Shamblin-class-I lesions.
    - SDH-deficient GIST (uncommon in SDHC): surgical / surveillance
      management — imatinib ineffective.
    - Metastatic SDH-deficient PPGL (uncommon in SDHC, <5% of events):
      131I-MIBG, 177Lu-DOTATATE PRRT per expert-center protocols.

  Per CHARTER §11: surveillance intensity calibrated to SDHC's lower
  PPGL risk + lower metastatic potential + head + neck predominance
  — drives the head + neck MRI focus over whole-body MRI cadence.

rationale_ua: >
  Стандартний-трек confirmed-carrier surveillance для SDHC-positive
  carriers (paraganglioma syndrome 3 / PGL3).

  **Imaging cadence — head + neck focus:**
    - Head + neck MRI annually з 10-15 років (парасимпатичні head +
      neck PGL — dominant SDHC tumor) — skull base, carotid body,
      jugular foramen, vagal nerve, jugulo-tympanic, parapharyngeal
      space. High-resolution sequences (thin-cut T2, contrast-enhanced
      T1) для sub-centimeter detection.
    - Whole-body MRI q3y — uncommon sympathetic abdominal PGL + rare
      SDH-deficient RCC + GIST.
    - Abdominal MRI q2-3y consolidated з whole-body MRI коли feasible.
    - 68Ga-DOTATATE PET — staging confirmed lesions, не routine.

  **Біохімія — plasma free метанефрини + methoxytyramine (3-MT):**
  Annual seated-rest plasma sample. Inclusion 3-MT CRITICAL для SDHC
  через dopaminergic / non-norepinephrine-secreting profile багатьох
  head + neck PGL. Pre-analytic: 30-min seated rest; avoid food /
  caffeine / tricyclics 8-12 годин.

  **Cascade тестування:** first-degree родичам; SDHC autosomal-dominant
  без maternal-imprinting — penetrant від будь-якого з батьків.
  Pediatric testing acceptable, але не urgent через SDHC's adolescent
  / adulthood-onset profile.

  **Treatment considerations:**
    - Pre-operative alpha-blockade ≥7-14 днів mandatory перед
      resection будь-якого secretory PGL.
    - Head + neck PGL surgery: hearing-preservation / cranial-nerve-
      preservation microsurgery experienced skull-base командою —
      preferred resectable; stereotactic radiosurgery (gamma-knife /
      cyber-knife) — acceptable alternative jugulo-tympanic /
      carotid-body коли high surgical morbidity.
    - Watchful-waiting — acceptable для small (<2cm) non-symptomatic
      non-secretory head + neck PGL з indolent growth (carotid-body
      Shamblin-class-I).
    - SDH-deficient GIST: surgical / surveillance, не imatinib.
    - Metastatic SDH-deficient PPGL (rare у SDHC): 131I-MIBG /
      177Lu-DOTATATE PRRT.

  Per CHARTER §11: surveillance intensity calibrated до SDHC's lower
  PPGL risk + lower metastatic potential + head + neck predominance.

