    - Annual clinical visit з cranial-nerve examination, audiogram
      review, neck palpation, BP measurement, re-counseling re:
      transition triggers до scheduled imaging.

  **Counseling re: trade-off:** Lead-time advantage scheduled imaging
  forfeit. Symptomatic head + neck PGL — complex surgical profile
  (larger tumor, cranial-nerve compression established, higher
  hearing-loss / facial-nerve / lower-cranial-nerve sacrifice ризик).
  Patient retains right to revert до scheduled-imaging track.

  **Cascade тестування:** continues identically.

  **Treatment considerations:** preoperative alpha-blockade ≥7-14
  днів для biochemistry-positive lesion; hearing-preservation /
  cranial-nerve-preservation microsurgery preferred; stereotactic
  radiosurgery — acceptable alternative jugulo-tympanic / carotid-
  body; watchful-waiting small Shamblin-I non-secretory; 131I-MIBG /
  177Lu-DOTATATE PRRT — rare metastatic SDHC-PPGL.

  Per CHARTER §11: автономія пацієнта — legitimate shared-decision
  endpoint якщо carrier розуміє forfeit lead-time + higher surgical-
  complexity profile.

