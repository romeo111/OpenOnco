rationale: >
  Alternative track for SDHC confirmed carriers: replaces scheduled
  annual head + neck MRI with biochemistry-only + symptom-driven
  cross-sectional imaging. Plan-track labelled "aggressive" in the
  engine's binary framing — clinically this is the LESS-intensive of
  the two SDHC tracks. Patient-shared-decision-making point.

  **Surveillance:**
    - Plasma free metanephrines + methoxytyramine (3-MT) annually
      (same cadence as standard track — 3-MT critical given SDHC
      dopaminergic / non-secretory profile).
    - NO scheduled head + neck MRI; cross-sectional imaging (head +
      neck MRI, abdominal MRI as indicated) triggered by:
        - Biochemistry abnormality (3-MT / metanephrines elevated).
        - Audiologic symptoms (pulsatile tinnitus — particularly
          classic for jugulo-tympanic PGL).
        - Vestibular symptoms (vertigo, balance disturbance, gait
          unsteadiness).
        - Cranial-nerve symptoms (lower-cranial-nerve palsies — IX,
          X, XI, XII — for jugular-foramen PGL; facial-nerve weakness
          for skull-base PGL).
        - Palpable carotid-body mass (carotid pulsation, bruit).
        - Family-history evolution (new affected relative — escalate
          to scheduled imaging).
    - Annual clinical visit with cranial-nerve examination, audiogram
      review, neck palpation, blood-pressure measurement, and
      re-counseling on transition triggers back to scheduled imaging.

  **Counselling re: trade-off:** Lead-time advantage of scheduled
  imaging is forfeit. Symptomatic head + neck PGL presentation
  carries more complex surgical profile (larger tumor, cranial-nerve
  compression already established, higher hearing-loss / facial-nerve
  / lower-cranial-nerve sacrifice risk). Patient retains right to
  revert to scheduled-imaging track at any time. Engineered around
  SDHC's ~10-15% lifetime PPGL risk + <5% metastatic rate — not
  transferable to SDHB.

  **Cascade testing:** Continues identically — offered to all first-
  degree relatives regardless of which surveillance track the carrier
  selects.

  **Treatment considerations** (same as standard track when PPGL
  detected): Pre-operative alpha-blockade ≥7-14 days for biochemistry-
  positive lesion; hearing-preservation / cranial-nerve-preservation
  microsurgery preferred; stereotactic radiosurgery as acceptable
  alternative for selected jugulo-tympanic / carotid-body lesions;
  watchful-waiting for small Shamblin-I non-secretory carotid-body
  lesions; 131I-MIBG / 177Lu-DOTATATE PRRT for rare metastatic SDHC-
  PPGL per international expert-center protocols.

  Per CHARTER §11: patient-autonomy framing — this is a legitimate
  shared-decision-making endpoint provided the carrier understands
  the forfeit of lead-time and the higher surgical-complexity profile
  of symptomatic-presentation head + neck PGL.

rationale_ua: >
  Alternative track для SDHC confirmed carriers: replaces scheduled
  annual head + neck MRI з biochemistry-only + symptom-driven cross-
  sectional imaging. Plan-track labelled "aggressive" у бінарному
  engine framing — clinically це LESS-intensive з двох SDHC tracks.
  Patient-shared-decision-making point.

  **Surveillance:**
    - Plasma free метанефрини + methoxytyramine (3-MT) annually
      (same cadence що й standard track; 3-MT critical через SDHC
      dopaminergic / non-secretory profile).
    - НЕМАЄ scheduled head + neck MRI; cross-sectional imaging
      triggered by:
        - Biochemistry abnormality (3-MT / метанефрини elevated).
        - Audiologic symptoms (pulsatile tinnitus — classic
          jugulo-tympanic PGL).
        - Vestibular symptoms (vertigo, balance disturbance).
        - Cranial-nerve symptoms (lower-cranial-nerve palsies —
          IX, X, XI, XII; facial-nerve weakness).
        - Palpable carotid-body mass (carotid pulsation, bruit).
