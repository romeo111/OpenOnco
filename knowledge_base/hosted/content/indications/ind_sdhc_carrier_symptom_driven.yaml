sources:
  - source_id: SRC-NCCN-NET-2025
    position: context
    relevant_quote_paraphrase: >-
      "Symptom-driven and biochemistry-only surveillance has been
      proposed as a shared-decision-making alternative for lower-
      penetrance SDHC carriers prioritising reduced cumulative MRI
      burden. Patient is counselled that lead-time advantage is forfeit
      and symptomatic head + neck PGL has more complex surgical-
      resection profile."
  - source_id: SRC-ENDOCRINE-SOCIETY-MEN-2023
    position: context
    relevant_quote_paraphrase: >-
      "Watchful-waiting management is acceptable for small (<2cm),
      non-symptomatic, non-secretory carotid-body and jugulo-tympanic
      paragangliomas with documented indolent growth on serial imaging."

do_not_do:
  - "Не пропонувати symptom-driven track SDHB carrier — calibrated тільки для SDHC's lower penetrance + low metastatic profile."
  - "Не пропонувати symptom-driven track SDHC carrier з family-specific pediatric-onset proband — escalate до scheduled imaging."
  - "Не виконувати extended-radical neck dissection при symptomatic head + neck PGL без preoperative imaging staging — anatomy-defining MRI обов'язкове перед resection planning."
  - "Не пропускати annual biochemistry навіть на symptom-driven track — biochemistry triggers cross-sectional imaging; її відсутність нівелює track."
  - "Не виконувати head + neck PGL resection без preoperative alpha-blockade при biochemistry-positive lesion — life-threatening hypertensive crisis ризик навіть у переважно non-secretory anatomy."

do_not_do_en:
  - "Do not offer the symptom-driven track to an SDHB carrier — it is calibrated only for SDHC's lower penetrance and low metastatic profile."
  - "Do not offer the symptom-driven track to an SDHC carrier with a family-specific pediatric-onset proband — escalate to scheduled imaging."
  - "Do not perform extended-radical neck dissection for a symptomatic head + neck PGL without preoperative imaging staging — anatomy-defining MRI is mandatory before resection planning."
  - "Do not skip annual biochemistry even on the symptom-driven track — biochemistry triggers cross-sectional imaging; omitting it negates the track."
  - "Do not perform head + neck PGL resection without preoperative alpha-blockade for a biochemistry-positive lesion — life-threatening hypertensive-crisis risk even in predominantly non-secretory anatomy."

