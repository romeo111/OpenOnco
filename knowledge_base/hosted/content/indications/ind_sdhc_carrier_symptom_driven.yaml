expected_outcomes:
  overall_response_rate: >-
    Alternative less-intensive track for adult SDHC carriers
    prioritising lower imaging burden / cumulative-MRI exposure /
    healthcare utilisation. Trade-off: replaces scheduled annual head
    + neck MRI with biochemistry-driven and symptom-driven cross-
    sectional imaging (MRI only when biochemistry abnormal, audiologic
    / vestibular symptoms develop, or cranial-nerve symptoms emerge).
    Acceptable framing for SDHC's lower lifetime PPGL risk (~10-15%) +
    very low metastatic rate (<5%) + adolescent / adulthood-onset
    profile. Patient counselled that lead-time advantage of scheduled
    imaging is forfeit and that symptomatic head + neck PGL has more
    complex surgical-resection profile (larger tumor size at diagnosis,
    cranial-nerve compression already established, higher risk of
    hearing-loss / facial-nerve sacrifice).

