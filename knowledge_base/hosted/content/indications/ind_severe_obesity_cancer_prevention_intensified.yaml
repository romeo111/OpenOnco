sources:
  - source_id: SRC-WCRF-AICR-CUP-2018
    position: supports
    relevant_quote_paraphrase: >-
      "Severe obesity (BMI ≥40) is convincing or probable
      etiological factor for 13 cancers per Continuous Update
      Project meta-analyses, with largest dose-response signal for
      endometrial (RR ~7-10) and esophageal adenocarcinoma (RR
      ~4-5). Sustained weight loss (≥10% body weight) produces
      cancer-incidence reduction; bariatric surgery in eligible
      severe-obesity patients reduces all-cancer incidence by ~30%
      in long-term cohort follow-up."
  - source_id: SRC-NCCN-BCELL-2025
    position: context

do_not_do:
  - "Не пропускати bariatric-surgery referral discussion у BMI ≥40 candidate — bariatric surgery — найбільш ефективна single intervention для severe-obesity-driven cancer-risk reduction."
  - "Не використовувати тільки dietary advice — modern pharmacotherapy (GLP-1 agonists) achieves substantially greater weight loss."
  - "Не de-intensifyувати cancer screening на basis fitness-for-procedure concerns у severe-obesity patient — colonoscopy + mammography залишаються safe at BMI ≥40 з proper accommodation."
  - "Не пропускати NAFLD/MASH screening — silent F3-F4 fibrosis common у severe-obesity з T2DM; F4 triggers separate HCC-surveillance pathway."
  - "Не нормалізувати severe obesity як 'just lifestyle' — chronic_condition pathophysiology distinct від sedentary-only elevation; metabolic / endocrine drivers (insulin resistance, adipokine dysregulation, sex-hormone metabolism) require structured intervention."
  - "Не використовувати BMI alone у high-muscle-mass athlete — body composition (waist circumference, body-fat percentage) more relevant; the population this RF targets is metabolically-obese severe-obesity."

do_not_do_en:
  - "Do not skip the bariatric-surgery referral discussion in a BMI ≥40 candidate — bariatric surgery is the single most effective intervention for severe-obesity-driven cancer-risk reduction."
  - "Do not rely on dietary advice alone — modern pharmacotherapy (GLP-1 agonists) achieves substantially greater weight loss."
  - "Do not de-intensify cancer screening on the basis of fitness-for-procedure concerns in a severe-obesity patient — colonoscopy and mammography remain safe at BMI ≥40 with proper accommodation."
  - "Do not skip NAFLD/MASH screening — silent F3-F4 fibrosis is common in severe-obesity with T2DM; F4 triggers a separate HCC surveillance pathway."
  - "Do not normalize severe obesity as 'just lifestyle' — chronic-condition pathophysiology is distinct from sedentary-only elevation; metabolic and endocrine drivers (insulin resistance, adipokine dysregulation, sex-hormone metabolism) require structured intervention."
  - "Do not use BMI alone in a high-muscle-mass athlete — body composition (waist circumference, body-fat percentage) is more relevant; the population this RF targets is metabolically-obese severe obesity."

