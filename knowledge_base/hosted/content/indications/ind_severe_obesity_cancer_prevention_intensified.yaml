rationale: >
  Standard-track intensified intervention for severe-obesity
  (BMI ≥40, or BMI ≥35 with obesity-related comorbidity) cancer
  prevention per WCRF/AICR Continuous Update Project + NCCN cancer-
  prevention guidance + ASMBS bariatric-surgery selection criteria.

  **(1) Multidisciplinary weight-loss program referral:**
  - Medical weight loss: dietary counseling (caloric deficit
    structured to ≥0.5-1 kg/week loss), structured physical
    activity, behavioral counseling.
  - Pharmacotherapy: GLP-1 receptor agonists (semaglutide,
    liraglutide), GLP-1/GIP agonists (tirzepatide), or older agents
    (orlistat, phentermine-topiramate, naltrexone-bupropion).
    Modern agents achieve ~15-25% weight loss vs. ~5-10% with older
    agents.
  - Bariatric surgery referral when criteria met: BMI ≥40 alone, or
    BMI ≥35 with documented obesity-related comorbidity (T2DM, sleep
    apnea, NAFLD, hypertension, hyperlipidemia). Sleeve gastrectomy
    or Roux-en-Y gastric bypass per multidisciplinary team
    assessment. Document the discussion + decision in shared-
    decision-making framing — bariatric surgery is a legitimate
    option to present, not a mandate.

  **(2) Intensified cancer screening:**
  - **Breast cancer:** Annual mammography from age 40 (rather than
    the USPSTF biennial-from-50 baseline) — severe-obesity RR ~1.5-2
    for post-menopausal breast cancer + frequently denser breast
    tissue + bariatric-surgery-mediated risk reduction = absolute-
    risk basis for intensification.
  - **Colorectal cancer:** Colonoscopy q10y from age 45 (no upward-
    deferral); FIT q1y as adjunct; do not de-intensify on the basis
    of "fit-for-procedure" concerns.
  - **Endometrial cancer:** No imaging-based screening, but explicit
    symptom education + low-threshold pelvic ultrasound and
    endometrial biopsy for postmenopausal bleeding or perimenopausal
    abnormal bleeding (severe-obesity RR ~7-10 is the largest single-
    cancer effect of severe obesity; symptom-prompted workup is
    high-yield).
  - **Esophageal adenocarcinoma:** No population-cadence screening,
    but document GERD symptoms + Barrett's esophagus screening if
    long-standing GERD; reduce GERD via weight loss.
  - **Hepatocellular carcinoma:** Screen for NAFLD/MASH (FibroScan,
    FIB-4 score, NAFLD activity score). If F3-F4 fibrosis present →
    trigger RF-CHRONIC-CIRRHOSIS-ETIOLOGY-AGNOSTIC-HCC-PREVENTION
    surveillance pathway.
  - **Pancreatic, renal, multiple myeloma, gallbladder:** No
    population-cadence screening; clinical-vigilance basis.

  **(3) Comorbidity management:**
  - T2DM management (metformin first-line per ADA; GLP-1 agonists
    if obesity also present — same agent serves both).
  - Sleep apnea screening + CPAP if confirmed.
  - Hypertension + hyperlipidemia per general guideline.

  **(4) NAFLD/MASH screening and management:**
  - FibroScan or FIB-4 score in all patients with BMI ≥40 and T2DM /
    metabolic syndrome.
  - Pharmacotherapy options (pioglitazone, vitamin E in non-diabetic
    biopsy-proven MASH, resmetirom for biopsy-proven F2-F3 MASH).

  **(5) Patient education:**
  - Counsel that weight loss of ≥10% body weight produces meaningful
    cancer-risk reduction in long-term cohort studies.
  - Cancer-prevention benefit is one of several reasons to engage
    with weight-loss intervention (cardiovascular, metabolic, joint,
    sleep, mortality benefits also accrue).

  Per CHARTER §11 patient-autonomy framing.

rationale_ua: >
  Стандартний-трек intensified intervention для severe-obesity
  (BMI ≥40, або BMI ≥35 з obesity-related comorbidity) cancer
  prevention per WCRF/AICR Continuous Update Project + NCCN cancer-
  prevention guidance + ASMBS bariatric-surgery selection criteria.

  **(1) Multidisciplinary weight-loss program referral:**
  - Medical weight loss: dietary counseling, structured physical
    activity, behavioral counseling.
  - Pharmacotherapy: GLP-1 receptor agonists (semaglutide,
    liraglutide), GLP-1/GIP agonists (tirzepatide); older agents
    (orlistat, phentermine-topiramate, naltrexone-bupropion).
  - Bariatric surgery referral при criteria met: BMI ≥40 alone, або
    BMI ≥35 з documented obesity-related comorbidity. Sleeve
    gastrectomy або Roux-en-Y gastric bypass per multidisciplinary
    team.

  **(2) Intensified cancer screening:**
  - **Breast:** Annual mammography з 40 років.
  - **CRC:** Colonoscopy q10р з 45; FIT q1р як adjunct.
  - **Endometrial:** Explicit symptom education + low-threshold
    pelvic US та endometrial biopsy для postmenopausal bleeding.
  - **Esophageal adenocarcinoma:** Document GERD symptoms +
    Barrett's screening if long-standing GERD.
  - **HCC:** Screen для NAFLD/MASH (FibroScan, FIB-4). При F3-F4 →
    trigger RF-CHRONIC-CIRRHOSIS-ETIOLOGY-AGNOSTIC-HCC-PREVENTION.

  **(3) Comorbidity management:**
  - T2DM management (metformin first-line; GLP-1 agonists якщо
    obesity).
  - Sleep apnea screening + CPAP.
  - Hypertension + hyperlipidemia per general guideline.

  **(4) NAFLD/MASH screening and management:**
  - FibroScan або FIB-4 score у всіх з BMI ≥40 + T2DM / metabolic
    syndrome.
  - Pharmacotherapy options (pioglitazone, vitamin E у non-diabetic
    biopsy-proven MASH, resmetirom для biopsy-proven F2-F3 MASH).

  **(5) Patient education:**
  - Counsel що weight loss ≥10% body weight produces meaningful
    cancer-risk reduction.
  - Cancer-prevention benefit — одна з кількох reasons для engagement
    з weight-loss intervention.

  Per CHARTER §11 framing автономії пацієнта.

