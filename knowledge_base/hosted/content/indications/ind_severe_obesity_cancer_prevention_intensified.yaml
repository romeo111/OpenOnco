expected_outcomes:
  overall_response_rate: >-
    Structured weight-loss intervention (medical + behavioral +
    surgical referral when criteria met) achieves clinically
    meaningful weight loss (≥10% body weight) in 40-70% of engaged
    patients with modern pharmacotherapy (GLP-1 agonists,
    tirzepatide) and 60-80% durably at 5 years with bariatric
    surgery. Bariatric surgery cohort studies (Adams 2007 NEJM +
    updates) document ~30% relative reduction in all-cancer
    incidence over 10+ years, with larger effects for hormonally-
    driven cancers (endometrial ~50% relative reduction; post-
    menopausal breast ~30% reduction). Cancer screening
    intensification (mammography from age 40, colonoscopy from age
    45, NAFLD screening) captures the elevated absolute risk of
    severe-obesity cohort relative to population baseline.

