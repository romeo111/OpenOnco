nccn_category: "2B"

expected_outcomes:
  overall_response_rate: >-
    Population-cadence cancer screening only without structured
    weight-loss intervention. Severe-obesity patients in this track
    retain elevated absolute cancer risk (endometrial RR ~7-10, post-
    menopausal breast RR ~1.5-2, etc.) but receive no weight-loss-
    mediated risk reduction. Outcomes worse than intensified
    comparator on long-term cancer-incidence basis; weight-loss
    intervention is the highest-impact modifiable factor and its
    absence forfeits ~30% relative all-cancer-incidence reduction
    documented in bariatric-surgery cohort studies.

hard_contraindications: []
red_flags_triggering_alternative: []

