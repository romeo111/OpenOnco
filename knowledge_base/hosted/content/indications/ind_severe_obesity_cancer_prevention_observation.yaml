do_not_do:
  - "Не презентувати observation як equivalent intensified — weight-loss-mediated cancer-risk reduction (~30%) недоступна без structured intervention."
  - "Не пропускати endometrial-symptom awareness — найбільший single-cancer effect severe obesity; symptom-prompted workup high-yield навіть без screening protocol."
  - "Не пропускати NAFLD/MASH screening — silent F3-F4 fibrosis common; може trigger окрему HCC-surveillance pathway."
  - "Не пропускати re-engagement weight-loss discussion — patient readiness evolves; declined intervention at one visit не forecloses later engagement."
  - "Не нормалізувати observation як 'patient preference' без quantitative framing — counsel специфічних RR effects (endometrial RR ~7-10 — найбільший effect)."

do_not_do_en:
  - "Do not present observation as equivalent to intensified — weight-loss-mediated cancer-risk reduction (~30%) is unavailable without structured intervention."
  - "Do not skip endometrial-symptom awareness — the largest single-cancer effect of severe obesity; symptom-prompted workup is high-yield even without a screening protocol."
  - "Do not skip NAFLD/MASH screening — silent F3-F4 fibrosis is common and may trigger a separate HCC-surveillance pathway."
  - "Do not skip re-engagement of the weight-loss discussion — patient readiness evolves over time; declined intervention at one visit does not foreclose later engagement."
  - "Do not normalize observation as 'patient preference' without quantitative framing — counsel specific RR effects (endometrial RR ~7-10 is the largest effect)."

