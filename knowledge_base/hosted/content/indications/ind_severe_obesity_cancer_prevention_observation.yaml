  - TEST-CBC
desired_tests: []

rationale: >
  Alternative-track companion to IND-SEVERE-OBESITY-CANCER-
  PREVENTION-INTENSIFIED. Used when:
  - Patient declines structured weight-loss program after informed
    discussion (motivation, financial barriers to GLP-1
    pharmacotherapy, surgical risk-aversion).
  - Access to multidisciplinary bariatric program is impractical
    (rural, low-resource, no GLP-1 pharmacotherapy access).
  - Patient has compounding factors (severe psychiatric comorbidity,
    eating-disorder history, recent surgical recovery) that make
    weight-loss intervention temporally inappropriate — re-evaluate
    at later visit.

  Components:
  - Population-cadence cancer screening per general-population
    guideline (mammography biennial from age 50; colonoscopy q10y
    from age 45 per USPSTF).
  - Endometrial-symptom awareness with low-threshold workup for
    abnormal bleeding remains critical (highest-RR cancer signal in
    severe obesity).
  - Comorbidity management (T2DM, sleep apnea, hypertension)
    continues regardless of weight-loss engagement.
  - NAFLD/MASH screening continues; if F3-F4 fibrosis detected,
    trigger separate cirrhosis-HCC surveillance pathway.
  - Re-engage weight-loss discussion at each clinical contact —
    patient readiness evolves over time; declined intervention at
    one visit does not foreclose later engagement.

  Frame the decision as suboptimal vs. intensified comparator and
  document the informed-decision discussion. Per CHARTER §11
  patient-autonomy framing.

rationale_ua: >
  Альтернативно-трекова Indication. Використовується коли:
  - Пацієнт відмовляється від structured weight-loss program після
    informed discussion (мотивація, financial barriers до GLP-1
    pharmacotherapy, surgical risk-aversion).
  - Доступ до multidisciplinary bariatric program непрактичний.
  - Пацієнт має compounding factors (severe psychiatric comorbidity,
    eating-disorder history, recent surgical recovery) що роблять
    weight-loss intervention temporally inappropriate.

  Компоненти:
  - Population-cadence cancer screening per general-population
    guideline.
  - Endometrial-symptom awareness з low-threshold workup для
    abnormal bleeding (найвищий-RR cancer signal у severe obesity).
  - Comorbidity management (T2DM, sleep apnea, hypertension)
    continues.
  - NAFLD/MASH screening continues; при F3-F4 → trigger cirrhosis-
    HCC surveillance pathway.
  - Re-engage weight-loss discussion при кожному clinical contact.

  Frame decision як suboptimal vs. intensified comparator + document
  informed-decision discussion. Per CHARTER §11.

