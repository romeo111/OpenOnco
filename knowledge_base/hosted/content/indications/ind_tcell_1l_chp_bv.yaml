rationale: BV-CHP evidence and recommendations differ by histology. ESMO-EHA 2025 recommends
  BV-CHP for systemic ALCL in the specified chemotherapy-eligible context; this cannot establish
  universal PTCL-NOS/AITL preference. US labeling includes other CD30-expressing PTCL. The pooled
  ECHELON-2 results are not subtype-specific outcomes, and the trial compared with CHOP, not
  CHOEP. Subtype and regional selection require separate review; transplantation is not an automatic
  consequence of this reference.
rationale_ua: Докази та рекомендації щодо BV-CHP відрізняються за гістологією. ESMO-EHA 2025
  рекомендує BV-CHP для системної ALCL у визначеному контексті придатності до хіміотерапії;
  це не встановлює універсальної переваги для PTCL-NOS/AITL. Американська інструкція включає
  інші CD30-позитивні PTCL. Загальні результати ECHELON-2 не є результатами окремих підтипів;
  порівняння проводили з CHOP, а не CHOEP. Вибір за підтипом і регіоном потребує окремого перегляду;
  трансплантація не є автоматичним наслідком цього довідкового запису.
