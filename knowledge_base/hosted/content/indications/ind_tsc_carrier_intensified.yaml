expected_outcomes:
  overall_response_rate: >-
    Intensified track layers two options on top of the standard TSC
    surveillance protocol: (1) proactive mTOR inhibitor (everolimus,
    sirolimus) initiation for renal AML > 3 cm or growing, AND for
    SEGA showing growth on serial MRI — moves from reactive
    surveillance to active disease modification, replaces or delays
    surgical resection in many cases, but requires lifelong adherence
    + side-effect management; (2) intensified LAM management in adult
    TSC women (sirolimus initiation at lower FEV1 / DLCO decline
    threshold, plus pneumothorax-prevention pleurodesis after first
    pneumothorax rather than awaiting recurrence, plus early lung-
    transplant referral). Trade-off: mTOR inhibitor side-effects
    (stomatitis, hypercholesterolemia, hyperglycemia, infection risk,
    teratogenicity) require ongoing management; pleurodesis
    complicates future lung transplant; long-term mTOR-inhibitor
    therapy in young carriers carries growth / fertility / future-
    cancer-treatment-interaction concerns.

