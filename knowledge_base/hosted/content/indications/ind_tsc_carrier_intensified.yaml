rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-TSC-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-TSC-CARRIER-
  SURVEILLANCE applies (brain MRI q1-3y to age 25, renal MRI q1-3y
  lifelong, infant cardiac echo, female-adult PFT + chest HRCT,
  dermatologic / ophthalmologic / TAND / dental surveillance).

  **Intensification 1 — Proactive mTOR inhibitor therapy:** Moves
  from reactive surveillance to active disease modification:
    - For renal AML > 3 cm OR growing on serial imaging: initiate
      everolimus 10 mg/day (adult) or 4.5 mg/m2/day (pediatric);
      monitor AML volume q6mo on renal MRI; expect 30-50% volume
      reduction in responders; discontinuation typically followed by
      AML re-growth (lifelong-ish therapy implication).
    - For SEGA showing growth: initiate everolimus at standard SEGA
      dosing (4.5-7 mg/m2/day, adjusted to trough 5-10 ng/mL);
      monitor brain MRI q6mo for 2 years then q12mo; expect SEGA
      volume reduction; surgical resection still possible if
      everolimus fails or symptoms develop.
    - Side-effect management: stomatitis is universal (prophylactic
      dexamethasone mouthwash); hypercholesterolemia (statin);
      hyperglycemia (metformin); infection prophylaxis discussed at
      initiation.
    - Teratogenicity: counsel female carriers of reproductive age;
      sirolimus is preferred over everolimus for pregnancy planning
      where mTOR therapy is needed during reproductive years.

  **Intensification 2 — Intensified LAM management in adult TSC
  women:** Move from reactive (sirolimus after FEV1 decline) to
  pre-emptive:
    - Sirolimus initiation at lower threshold — FEV1 decline of
      ~50-70 mL/year or DLCO decline > 10%/year rather than waiting
      for established progression. Trade-off: more years of mTOR-
      inhibitor exposure.
    - Pneumothorax management — pleurodesis (chemical or surgical)
      after first pneumothorax in adult TSC-LAM women, rather than
      awaiting recurrence (TSC-LAM pneumothorax recurrence rate ~70%).
      Note: pleurodesis complicates future lung transplant — must be
      discussed with transplant pulmonology.
    - Lung-transplant referral — earlier referral (when FEV1 falls
      below ~30-40% predicted, rather than waiting for crisis).
      Transplant outcomes in TSC-LAM are favorable; living with sub-
      optimal post-transplant immunosuppression on top of TSC
      systemic disease is the trade-off.

  **Other intensification considerations (not core to this track):**
    - Prophylactic surgery (nephrectomy, anti-epileptic surgical
      resection of cortical tubers) is NOT routine in pre-tumor /
      pre-refractory-epilepsy carriers — reactive only.
    - Annual brain MRI (Toronto-protocol-style) is NOT supported in
      TSC — q1-3y is the consensus; over-imaging in childhood
      compounds sedation-related morbidity without proportional
      benefit.
    - Generalized cancer chemoprevention (rapalogs as cancer
      prevention beyond TSC-specific indications) is investigational.

  **Cascade testing remains continuous:** every visit re-confirms
  family's testing status. Autosomal-dominant — 50% inheritance risk
  in offspring. Parental mosaicism must be considered before
  declaring de-novo.

  Per CHARTER §11: intensified pharmacotherapy + intensified LAM
  management are shared-decision-making domains. Patient autonomy +
  parental autonomy (pediatric carriers) is paramount; standard-
  track protocol remains the floor.

rationale_ua: >
  Aggressive-трекова Indication: накладена поверх IND-TSC-CARRIER-
  SURVEILLANCE з двома опціями інтенсифікації.

  **Foundation:** Усе стандартне з IND-TSC-CARRIER-SURVEILLANCE.

  **Інтенсифікація 1 — Proactive mTOR inhibitor therapy:** Move з
  reactive surveillance до active disease modification:
    - Renal AML > 3 см АБО growing: initiate everolimus 10 мг/день
      (adult) або 4.5 мг/м2/день (pediatric); monitor AML volume
      q6mo на renal MRI; expect 30-50% volume reduction; discontinuation
      typically followed by re-growth (lifelong therapy implication).
    - SEGA growing: initiate everolimus standard SEGA dosing
      (4.5-7 мг/м2/день, trough 5-10 ng/mL); monitor brain MRI q6mo
      x 2 years then q12mo; expect volume reduction; surgical
      resection still possible if everolimus fails / symptoms develop.
    - Side-effect management: stomatitis universal (prophylactic
      dexamethasone mouthwash); hypercholesterolemia (statin);
      hyperglycemia (metformin); infection prophylaxis discussed
      на initiation.
    - Teratogenicity: counsel female carriers reproductive age;
      sirolimus preferred over everolimus для pregnancy planning.

  **Інтенсифікація 2 — Intensified LAM management у adult TSC
  жінок:** Move з reactive до pre-emptive:
    - Sirolimus initiation lower threshold — FEV1 decline ~50-70 mL/year
      АБО DLCO decline > 10%/year замість waiting for established
      progression. Trade-off: more years mTOR-inhibitor exposure.
    - Pneumothorax management — pleurodesis після first pneumothorax
      замість awaiting recurrence (recurrence rate ~70%). Note:
      pleurodesis complicates future lung transplant — must discuss
      з transplant pulmonology.
    - Lung-transplant referral — earlier (FEV1 ~30-40% predicted)
      замість crisis. Outcomes favorable у TSC-LAM.

  **Інші міркування:**
    - Prophylactic surgery (nephrectomy, anti-epileptic surgical
      resection cortical tubers) — NOT routine у pre-tumor / pre-
      refractory carriers; reactive only.
    - Annual brain MRI (Toronto-protocol-style) — NOT supported у TSC
      (q1-3y consensus); over-imaging у childhood = sedation morbidity
      без proportional benefit.
    - Generalized chemoprevention (rapalogs як cancer prevention
      beyond TSC-specific indications) — investigational.

  **Cascade тестування continuous.** Parental mosaicism — must
  consider перед declaring de-novo.

  Per CHARTER §11: shared-decision-making домен.

