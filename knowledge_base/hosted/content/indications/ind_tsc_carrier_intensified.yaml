do_not_do:
  - "Не start everolimus / sirolimus у TSC-carrier без stomatitis prophylaxis (dexamethasone mouthwash) + side-effect counseling (hypercholesterolemia, hyperglycemia, infection, teratogenicity)."
  - "Не interruptувати everolimus / sirolimus поза planned interventions — discontinuation typically followed by AML / SEGA re-growth (lifelong therapy implication critical для counseling)."
  - "Не використовувати pleurodesis у TSC-LAM пацієнтки без transplant pulmonology consultation — pleurodesis complicates future lung transplant; risk / benefit обговорення critical."
  - "Не starting everolimus у young woman карієр reproductive age без contraception / pregnancy-planning counseling — teratogenicity Category D; sirolimus preferred якщо mTOR therapy required під час reproductive years."
  - "Не intensifyувати у всіх carriers — proactive mTOR therapy для AML > 3 см / growing SEGA / FEV1-declining LAM — драйвери; не chemoprevention generic."

do_not_do_en:
  - "Do not start everolimus / sirolimus in a TSC carrier without stomatitis prophylaxis (dexamethasone mouthwash) plus side-effect counseling (hypercholesterolemia, hyperglycemia, infection, teratogenicity)."
  - "Do not interrupt everolimus / sirolimus outside planned interventions — discontinuation is typically followed by AML / SEGA re-growth (lifelong therapy implication is critical for counseling)."
  - "Do not use pleurodesis in a TSC-LAM patient without transplant pulmonology consultation — pleurodesis complicates future lung transplant; risk / benefit discussion is critical."
  - "Do not start everolimus in a young woman carrier of reproductive age without contraception / pregnancy-planning counseling — teratogenicity Category D; sirolimus is preferred if mTOR therapy is required during reproductive years."
  - "Do not intensify in all carriers — proactive mTOR therapy for AML > 3 cm, growing SEGA, or FEV1-declining LAM are the drivers; chemoprevention beyond these indications is investigational."

