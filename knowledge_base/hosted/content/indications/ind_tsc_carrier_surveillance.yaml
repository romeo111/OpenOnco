sources:
  - source_id: SRC-NCCN-KIDNEY-2025
    position: supports
    relevant_quote_paraphrase: >-
      "TSC carriers should undergo periodic renal imaging (MRI or
      contrast US) q1-3y from infancy for angiomyolipoma surveillance;
      AML > 3 cm responsive to everolimus, > 4 cm at increased bleed
      risk warranting embolization or surgery."
  - source_id: SRC-NCCN-CNS-2025
    position: supports
    relevant_quote_paraphrase: >-
      "Brain MRI q1-3y from infancy to age 25 for SEGA surveillance
      in TSC carriers; SEGA growth or symptoms trigger consideration
      of everolimus or surgical resection."

do_not_do:
  - "Не використовувати radical nephrectomy як first-line для TSC-AML — bilateral / multifocal disease typical; kidney preservation матерь, mTOR inhibitor + selective embolization preferred."
  - "Не пропускати ANY-FAMILY-AGE screening — TSC діагноз часто de novo (батьки negative), але mosaicism у parents must be considered перед declaring de novo (somatic mosaicism risk ~10-15%)."
  - "Не пропускати LAM screening у adult TSC жінок з 18 років — pulmonary function + chest HRCT baseline; respiratory симптоми → immediate HRCT."
  - "Не start everolimus / sirolimus у TSC-carrier без monitoring stomatitis (the most common mTOR-inhibitor side-effect), hypercholesterolemia, hyperglycemia, infections — dose-modification often needed."
  - "Не lockувати infants у surveillance MRI / CT без sedation planning + pediatric radiology expertise — accumulated anesthesia exposure y young children — meaningful morbidity factor."
  - "Не treatувати DIS-RCC як definitive disease scope для TSC — anchor approximation (TSC — multi-organ синдром з renal AML + SEGA + LAM + cardiac rhabdomyoma dominating surveillance, не RCC primarily); v0.4 cleanup потребує DIS-TSC-SPECTRUM або DIS-RENAL-AML entity."

do_not_do_en:
  - "Do not use radical nephrectomy as first-line for TSC-AML — bilateral / multifocal disease is typical; kidney preservation matters, and mTOR inhibitor + selective embolization is preferred."
  - "Do not skip family screening — TSC diagnosis is often de novo (parents test negative), but parental mosaicism must be considered before declaring de novo (somatic mosaicism risk ~10-15%)."
  - "Do not skip LAM screening in adult TSC women from age 18 — pulmonary function plus chest HRCT baseline; respiratory symptoms trigger immediate HRCT."
  - "Do not start everolimus / sirolimus in a TSC carrier without monitoring stomatitis (the most common mTOR-inhibitor side-effect), hypercholesterolemia, hyperglycemia, and infections — dose-modification is often needed."
  - "Do not lock infants into surveillance MRI / CT without sedation planning and pediatric radiology expertise — accumulated anesthesia exposure in young children is a meaningful morbidity factor."
  - "Do not treat DIS-RCC as the definitive disease scope for TSC — this is an anchor approximation (TSC is a multi-organ syndrome with renal AML, SEGA, LAM, and cardiac rhabdomyoma dominating surveillance, not RCC primarily); v0.4 cleanup will add a DIS-TSC-SPECTRUM or DIS-RENAL-AML entity."

known_controversies:
  - topic: "Everolimus vs surgical resection for asymptomatic SEGA"
    positions:
      - position: "Everolimus first-line for asymptomatic small / growing SEGA"
        sources: [SRC-NCCN-CNS-2025]
        evidence_note: "EXIST trials (everolimus in TSC-associated SEGA) demonstrated tumor volume reduction without surgical morbidity. Often preferred where SEGA is < 1 cm and ventriculomegaly absent."
      - position: "Neurosurgical resection first-line"
        sources: []
        evidence_note: "Definitive treatment; avoids long-term mTOR-inhibitor side-effects. Preferred when SEGA is large / symptomatic / causes hydrocephalus."
    our_default: "Everolimus for asymptomatic small / growing SEGA; surgery for large / symptomatic"
    rationale: >
      EXIST trials provide RCT evidence for everolimus response; surgical morbidity at foramen-of-Monro location is non-trivial. Shared-decision-making per CHARTER §11.

