rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with germline TSC1 / TSC2 pathogenic variants or clinically diagnosed
  TSC, per International TSC Consensus Conference 2021 protocol.

  **Brain MRI (~10-15% SEGA lifetime; obstructive-hydrocephalus risk):**
  Brain MRI q1-3y from infancy to age 25 (intensified in early
  childhood — first 5 years — when SEGA growth is most active), then
  symptom-driven surveillance thereafter. New SEGA OR documented growth
  on serial MRI → neurosurgical / oncology consultation; surgical
  resection vs everolimus mTOR inhibitor (FDA-approved for TSC-
  associated SEGA) is shared-decision-making — everolimus often
  preferred for asymptomatic small / slow-growing SEGAs given surgical
  morbidity.

  **Renal MRI / contrast US (~80% AML lifetime; ~2-4% RCC):** Renal
  MRI (preferred) or contrast-enhanced US q1-3y from infancy / early
  childhood. Renal AML > 3 cm OR growing OR symptomatic (pain,
  hematuria, hypertension) → urology / interventional radiology
  consultation. Treatment options:
    - mTOR inhibitor (everolimus) — first-line for AML > 3 cm in
      asymptomatic carriers; shrinks AML, reduces bleed risk, can
      defer / avoid surgery.
    - Selective arterial embolization — for symptomatic AML or
      AML > 4 cm without embolization-contraindication.
    - Nephron-sparing surgery (partial nephrectomy) — for suspected
      RCC arising in AML field, or for AML failing mTOR + embolization.
    - Radical nephrectomy avoided where possible — bilateral / multifocal
      disease means kidney preservation matters.

  **Cardiac echo (cardiac rhabdomyoma — infants):** Echocardiogram in
  infancy (or prenatally if discovered during pregnancy). Rhabdomyomas
  typically involute spontaneously by age 5-10. Surveillance into
  adulthood only if persistent. Pre-natal detection of rhabdomyoma
  on fetal echo is a common entry point for TSC diagnosis — triggers
  pediatric genetics workup.

  **Pulmonary function + chest HRCT (~30-40% LAM in adult TSC women):**
  Pulmonary function testing (spirometry + DLCO) baseline at age 18 in
  females. Chest HRCT baseline at age 18 in females. New respiratory
  symptoms (exertional dyspnea, recurrent pneumothorax, chyloperitoneum)
  → immediate HRCT + pulmonology consultation. Sirolimus (rapamycin)
  is FDA-approved for TSC-LAM and slows decline in FEV1 / VC.
  Lung-transplant referral for end-stage LAM. Pneumothorax recurrence
  → chemical pleurodesis discussion.

  **Dermatologic exam q1y:** Facial angiofibromas, shagreen patch,
  ungual fibromas, hypomelanotic macules — surveillance documents
  presence + change but is not surveillance for malignancy (these
  features do not become cancerous). Topical sirolimus, surgical
  / laser treatment for symptomatic / cosmetic concerns.

  **Ophthalmologic exam q1-3y:** Retinal hamartomas (achromic /
  pigmented) — usually asymptomatic; rarely affect vision.

  **Neuropsychiatric (TAND) screening q1y:** Validated TAND-Lifestyle
  Checklist administered by neurodevelopmental specialist; addresses
  behavioral / cognitive / academic concerns that are frequently the
  most-impactful aspect of TSC for patients and families.

  **Dental exam q6mo:** Dental enamel pits and gingival fibromas;
  oral health is otherwise routine.

  **Epilepsy management:** Outside the scope of surveillance per se,
  but tightly integrated — vigabatrin first-line for infantile spasms;
  refractory epilepsy may require surgical resection of seizure-
  generating cortical tubers; ketogenic diet, vagal nerve stimulation,
  responsive neurostimulation as options.

  **Cascade testing:** Autosomal-dominant — first-degree relatives
  have 50% inheritance risk. Cascade testing essential; many TSC
  diagnoses are de novo (the proband's parents test negative — but
  mosaicism in parents must be considered before declaring de novo).

  Per CHARTER §11 patient-autonomy framing: multi-organ surveillance
  burden is substantial; pediatric surveillance initiation requires
  family-engagement counseling. Most TSC carriers benefit from
  multidisciplinary TSC clinic where pediatric neurology, urology,
  cardiology, pulmonology, dermatology, psychiatry coordinate.

rationale_ua: >
  Стандартний-трекова Indication для confirmed-carrier TSC surveillance
  per International TSC Consensus Conference 2021 protocol.

  **Brain MRI (~10-15% SEGA lifetime; obstructive-hydrocephalus risk):**
  Brain MRI q1-3y з infancy до 25 років (intensified у early childhood
  — перші 5 років), потім symptom-driven. New SEGA АБО documented
  growth → neurosurgical / oncology consultation; surgical resection
  vs everolimus mTOR inhibitor (FDA-approved для TSC-SEGA) — shared-
  decision.

  **Renal MRI / contrast US (~80% AML / ~2-4% RCC):** Renal MRI або
  contrast-enhanced US q1-3y з infancy / early childhood. AML > 3 см
  АБО growing АБО symptomatic → urology / IR consultation:
    - mTOR inhibitor (everolimus) — first-line для AML > 3 см
      asymptomatic.
    - Selective arterial embolization — для symptomatic AML / > 4 см.
    - Nephron-sparing surgery — для suspected RCC у AML field, або
      AML failing mTOR + embolization.
    - Radical nephrectomy — avoided where possible (bilateral /
      multifocal disease, kidney preservation matters).

  **Cardiac echo (rhabdomyoma — infants):** Echocardiogram у infancy
  (або prenatally). Spontaneous involution до 5-10 років. Surveillance
  у дорослих only якщо persistent.

  **PFT + chest HRCT (~30-40% LAM у adult TSC жінок):** PFT
  (spirometry + DLCO) baseline 18 років жінки; chest HRCT baseline
  18 років жінки. Respiratory симптоми → immediate HRCT + pulmonology.
  Sirolimus (rapamycin) — FDA-approved для TSC-LAM; lung-transplant
  для end-stage; pneumothorax recurrence → pleurodesis.

  **Dermatologic exam q1y:** Facial angiofibromas, shagreen patch,
  ungual fibromas — surveillance documents без malignancy risk;
  topical sirolimus / laser для symptomatic.

  **Ophthalmologic q1-3y:** Retinal hamartomas — рідко affect vision.

  **TAND screening q1y:** Validated TAND-Lifestyle Checklist —
  behavioral / cognitive / academic concerns frequently most-impactful
  aspect TSC.

  **Dental exam q6mo:** Enamel pits + gingival fibromas.

  **Epilepsy management:** Vigabatrin для infantile spasms; refractory
  epilepsy → surgical resection cortical tubers; ketogenic diet, VNS,
  RNS.

  **Cascade тестування:** autosomal-dominant — 50% inheritance risk;
  cascade essential. De novo діагнози часті — mosaicism у parents
  must be considered.

  Per CHARTER §11 framing автономії пацієнта; multidisciplinary TSC
  clinic ideal.

