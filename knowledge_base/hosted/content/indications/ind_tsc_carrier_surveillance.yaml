expected_outcomes:
  overall_response_rate: >-
    Structured multi-organ surveillance per International TSC Consensus
    Conference 2021 detects SEGA at pre-symptomatic stage where
    surgical resection or mTOR inhibitor (everolimus) deflects the
    obstructive-hydrocephalus emergency; detects renal AML at sizes
    amenable to nephron-sparing intervention (selective embolization
    or mTOR-inhibitor shrinkage) before reaching the > 4 cm bleed-
    risk threshold; detects RCC at smaller stage with better surgical
    options; identifies LAM in adult women at early stage where
    sirolimus slows progression and lung-transplant referral is
    timelier. Cardiac rhabdomyoma surveillance is largely reassurance-
    based (spontaneous involution typical). TAND screening + epilepsy
    management drive neurodevelopmental + quality-of-life outcomes
    irrespective of cancer surveillance.

