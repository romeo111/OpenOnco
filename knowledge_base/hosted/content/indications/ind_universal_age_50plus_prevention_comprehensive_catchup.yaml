do_not_do:
  - "Не призначати безсимптомний скринінг поза межами USPSTF / NCCN-рекомендованих методів (щитоподібна залоза, ротова порожнина, підшлункова залоза, яєчники, ендометрій, сечовий міхур, нирка) — шкода від хибнопозитивних результатів перевищує додаткову користь виявлення в популяції середнього ризику."
  - "Не нехтувати оцінкою очікуваної тривалості життя / супутніх захворювань у пацієнтів ≥75 років — надолуження скринінгу може завдати більше шкоди, ніж користі у дуже ослаблених пацієнтів."
  - "Не призначати низькодозову КТ (LDCT) без підтвердження відповідності критеріям USPSTF (≥20 пачко-років + поточне куріння або відмова ≤15р тому) — шкода від хибнопозитивних результатів і опромінення перевищує користь."
  - "Не пропускати інформовану згоду перед скринінгом ПСА — шкода від гіпердіагностики / надлікування є значною; спільне прийняття рішення обов'язкове."
  - "Не відмовляти в надолуженні скринінгу через соціально-економічні бар'єри чи відсутність страхового покриття — більшість методів доступні через НСЗУ / Medicare / NHS; задокументувати рішення та активно сприяти доступу."

do_not_do_en:
  - "Do not order asymptomatic screening outside USPSTF / NCCN-recommended modalities (thyroid, oral, pancreatic, ovarian, endometrial, bladder, renal) — false-positive harm >> incremental detection benefit in average-risk cohort."
  - "Do not skip life-expectancy / comorbidity overlay in the ≥75 cohort — catch-up screening may have harms outweigh benefits in very-frail patients."
  - "Do not order LDCT without USPSTF-eligibility verification (≥20 pack-year + current smoker or quit ≤15y) — false-positives + radiation exceed benefit."
  - "Do not skip informed-consent for PSA screening — overdiagnosis / overtreatment harms are significant; shared-decision-making is mandatory."
  - "Do not deny catch-up screening on socioeconomic / insurance grounds — most modalities are accessible through NSZU / Medicare / NHS coverage; document determination + actively coordinate access."

