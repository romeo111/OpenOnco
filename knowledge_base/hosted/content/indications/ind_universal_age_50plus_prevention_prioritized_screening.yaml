do_not_do:
  - "Не подавати скринінг однієї модальності як еквівалент комплексного плану — результати гірші."
  - "Не пропускати навчання щодо настороженості до симптомів для відхилених модальностей — оцінка за появою симптомів є резервним варіантом."
  - "Не сприймати бар'єр доступу як незмінний — проактивно координувати шляхи направлення через НСЗУ / Medicare / NHS."
  - "Не відмовляти від FIT як неінвазивного варіанту першого вибору для скринінгу КРР — він суттєво перевищує відсутність скринінгу."
  - "Не призначати низькодозову КТ (LDCT) без підтвердження відповідності критеріям USPSTF — шкода від хибнопозитивних результатів та опромінення поза вікном відповідності критеріям."

do_not_do_en:
  - "Do not present single-modality screening as equivalent to comprehensive plan — outcomes are inferior."
  - "Do not skip symptom-vigilance education for declined modalities — symptom-prompted evaluation is the backup."
  - "Do not accept the access barrier as immutable — proactively coordinate NSZU / Medicare / NHS referral pathways."
  - "Do not deny FIT as the non-invasive CRC first-choice — it substantially exceeds the no-screening baseline."
  - "Do not order LDCT without USPSTF eligibility verification — false-positive harm + radiation outside the eligibility window."

