do_not_do:
  - "Не подавати коротке втручання як еквівалент структурованої програми відмови від куріння — результати гірші, коректне подання критично важливе."
  - "Не обмежувати доступ до скринінгу низькодозовою КТ через відмову від програми — оцінка відповідності критеріям є окремим питанням."
  - "Не пропускати навчання щодо настороженості до симптомів — пацієнти-курці часто зволікають зі зверненням при тривожних симптомах."
  - "Не уникати можливості повторного залучення — кожен рецидив є інформацією; пацієнт може наважитися після шостої невдалої спроби."
  - "Не призначати варениклін / бупропіон без явного попередження щодо ризику депресії / збудження — попередження в чорній рамці відкликано, але просвіта пацієнта залишається важливою."

do_not_do_en:
  - "Do not present brief intervention as equivalent to structured cessation program — outcomes are inferior; framing is critical."
  - "Do not disable LDCT access on the basis of declined-program — eligibility evaluation is a separate axis."
  - "Do not skip symptom-vigilance education — patients in the smoker cohort often delay alarm-symptom presentation."
  - "Do not avoid re-engagement opportunity — every relapse is data; a patient may engage at the sixth attempt after the sixth relapse."
  - "Do not prescribe varenicline / bupropion without depression / agitation flag explicitly framed — black-box warning was withdrawn but patient education remains important."

