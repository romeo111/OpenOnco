do_not_do:
  - "Не подавати лише консультування як еквівалент структурованого втручання — результати гірші; коректне подання критично важливе для спільного прийняття рішення."
  - "Не пропускати можливість повторного залучення — більшість пацієнтів згодом залучаються, коли змінюються мотиваційні тригери."
  - "Не уникати обговорення пов'язаних з ожирінням онкологічних ризиків через побоювання стигматизації — клінічна реальність вимагає чесного, але співчутливого підходу."
  - "Не нормалізувати незаплановану втрату ваги в популяції з ожирінням — парадоксальна ознака може приховувати злоякісне новоутворення і потребує невідкладного обстеження."
  - "Не пропускати скринінг НАЖХП / МАСГ (FIB-4) за наявності метаболічного синдрому — це окреме питання, не пов'язане із залученням до програми зниження ваги."

do_not_do_en:
  - "Do not present counseling-only as equivalent to structured intervention — outcomes are inferior; framing is critical for shared decision-making."
  - "Do not skip re-engagement opportunity — most patients eventually engage when motivational triggers shift."
  - "Do not avoid weight-related obesity-cluster cancer discussions because of weight-stigma concerns — clinical reality requires honest framing with compassion."
  - "Do not normalize unintended weight loss in the obesity cohort — paradoxical presentation with occult malignancy warrants prompt evaluation."
  - "Do not skip NAFLD / MASH screening (FIB-4) when metabolic syndrome is present — separate axis from weight-loss intervention engagement."

