do_not_do:
  - "Не обмежуватися консультуванням щодо зниження ваги без направлення на структуровану програму — узагальнена порада 'менше їсти, більше рухатись' має незначну ефективність."
  - "Не призначати фармакотерапію для зниження ваги без урахування протипоказань (агоністи GLP-1 — за анамнезу медулярного раку щитоподібної залози / MEN2; орлістат — за синдрому мальабсорбції)."
  - "Не скорочувати інтервал колоноскопії для КРР без супутнього анамнезу аденом або обтяженого сімейного анамнезу — саме по собі ожиріння не змінює базовий 10-річний інтервал за USPSTF / NCCN."
  - "Не пропускати обстеження на НАЖХП / MASH за ІМТ ≥30 з метаболічним синдромом — індекс FIB-4 або еластографія недорогі і визначають подальшу тактику скринінгу ГЦК."
  - "Не проводити безсимптомний скринінг ендометрія / щитоподібної залози / нирок / підшлункової залози лише на підставі ожиріння — шкода від хибнопозитивних результатів переважає над додатковою користю виявлення."

do_not_do_en:
  - "Do not present weight-loss counseling without specific structured intervention referral — generic 'eat less, move more' has marginal effectiveness."
  - "Do not prescribe pharmacotherapy weight loss without respecting contraindications (GLP-1 in history of medullary thyroid / MEN2; orlistat in malabsorption)."
  - "Do not intensify CRC colonoscopy interval suddenly without an adenoma-history or family-history co-factor — single risk factor (obesity alone) does not change baseline q10y interval per USPSTF / NCCN."
  - "Do not skip NAFLD / MASH evaluation at BMI ≥30 with metabolic syndrome — FIB-4 score or elastography is low-cost and decides the HCC-surveillance pathway."
  - "Do not use asymptomatic endometrial / thyroid / renal / pancreatic screening on the basis of obesity alone — false-positive harm >> incremental detection benefit."

