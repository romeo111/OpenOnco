do_not_do:
  - "Не пропускати структурований аналіз родоводу за наявності онкологічного анамнезу в будь-якого родича першого ступеня — поверхневе визначення 'обтяжений сімейний анамнез' без тригенераційного родоводу упускає специфічні для синдрому тригери."
  - "Не призначати герміногенне тестування лише на підставі одного випадку раку в родича першого ступеня без тригера за критеріями родоводу — низька діагностична цінність + повторно провокує тривогу через варіанти невизначеного значення (VUS)."
  - "Не подавати визначення 'негативний родовід' як нульовий ризик — глибокі інтронні / регуляторні варіанти, мозаїцизм та обмежена повнота родоводу залишають залишкову епідеміологічну невизначеність."
  - "Не блокувати аналіз родоводу через питання страхування / оплати — передтестове консультування часто покривається страховкою або недороге; бар'єр вартості панельного тестування можна подолати через каскадне тестування родичів індексного випадку."
  - "Не повторно призначати аналіз родоводу без перевірки нових онкологічних подій у родині — родовід динамічний; повторна оцінка кожні 5 років або за нових подій."

do_not_do_en:
  - "Do not skip structured pedigree review in the presence of any first-degree relative cancer — superficial 'family-history positive' without three-generation pedigree misses syndrome-specific triggers."
  - "Do not order germline testing on the basis of a single first-degree relative cancer without a pedigree-criterion trigger — clinically low diagnostic yield + recreates VUS-driven anxiety."
  - "Do not present a negative-pedigree determination as zero-risk — deep intronic / regulatory variants, mosaic disease, and limited-pedigree-information scenarios leave residual epidemiologic uncertainty."
  - "Do not block pedigree review on the basis of insurance / payer — pre-test counseling is often covered or low-cost; panel-testing cost barrier may be addressed through the cascade pathway for index-case relatives."
  - "Do not re-defer pedigree review without checking for new family cancer events — pedigree is dynamic; re-review every 5 years or upon new events."

