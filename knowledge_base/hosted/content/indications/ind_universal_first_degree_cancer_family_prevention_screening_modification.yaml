do_not_do:
  - "Не подавати модифікацію скринінгу з урахуванням сімейного анамнезу як еквівалент герміногенного тестування — діагностична цінність для виявлення носіїв високопенетрантних варіантів значно нижча."
  - "Не пропускати освіту щодо настороженості до симптомів — розпізнавання патернів критично важливе, коли пацієнт не залучений до шляху герміногенного тестування."
  - "Не закривати можливість повторного залучення — пацієнт може повернутися до шляху генетичного консультування за появи нових онкологічних подій у родині або зміни репродуктивних планів."
  - "Не нормалізувати специфічні для локалізації симптоми (утворення в молочній залозі, зміна характеру випорожнень, підозріле на меланому утворення) як 'незначні' в когорті з обтяженим сімейним анамнезом — кожен тривожний симптом потребує негайного обстеження."
  - "Не ігнорувати повторну оцінку родоводу — родовід динамічний; родовід п'ятирічної давності може бути застарілим через нові події в родині."

do_not_do_en:
  - "Do not present family-history-aware screening modification as equivalent to germline testing — diagnostic yield for high-penetrance carrier identification is substantially lower."
  - "Do not skip symptom-vigilance education — pattern recognition is critical when the patient does not engage with the germline pathway."
  - "Do not close the door on re-engagement — patient may return to genetic-counseling pathway upon new family cancer events or reproductive-planning shifts."
  - "Do not normalize site-specific symptoms (breast lump, change in bowel habits, melanoma-suspicious lesion) as 'minor' in family-history cohort — every alarm symptom warrants immediate evaluation."
  - "Do not ignore pedigree re-review — pedigree is dynamic; a pedigree from 5 years ago may be obsolete due to new family events."

