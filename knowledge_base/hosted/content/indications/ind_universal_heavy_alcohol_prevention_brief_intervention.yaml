do_not_do:
  - "Не подавати коротке втручання як еквівалент структурованої програми припинення вживання + фармакотерапії — результати гірші, тому формулювання має бути коректним."
  - "Не пропускати FIB-4 / еластографію за значного вживання алкоголю — обстеження на цироз визначає скринінг ГЦК незалежно від статусу залучення до програми лікування залежності."
  - "Не уникати можливості повторного залучення — більшість пацієнтів зрештою залучаються, коли змінюються мотиваційні тригери."
  - "Не нормалізувати тривожні симптоми (дисфагія, осиплість голосу, ураження слизової рота, втрата ваги) у когорті значного вживання алкоголю — обстеження за симптомами найбільш результативне."
  - "Не відмовляти в підтримці залучення до груп взаємодопомоги (АА, SMART Recovery) на підставі особистих переконань лікаря — це окремий ефективний напрямок."

do_not_do_en:
  - "Do not present brief intervention as equivalent to structured cessation + pharmacotherapy — outcomes are inferior; framing is critical."
  - "Do not skip FIB-4 / elastography in heavy alcohol use — cirrhosis-evaluation pathway decides HCC surveillance regardless of AUD-engagement status."
  - "Do not avoid re-engagement opportunity — most patients eventually engage when motivational triggers shift."
  - "Do not normalize alarm symptoms (dysphagia, hoarseness, oral lesion, weight loss) in the heavy-alcohol cohort — symptom-prompted evaluation is highest yield."
  - "Do not deny mutual-support group engagement (AA, SMART Recovery) on the basis of physician preference — it is a separate effective axis."

