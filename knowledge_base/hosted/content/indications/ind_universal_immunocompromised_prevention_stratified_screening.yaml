do_not_do:
  - "Не використовувати загальнопопуляційну кратність цервікального скринінгу в імунокомпрометованій когорті — прискорена кратність (спочатку щорічна цитологія) за ACOG / ASCCP 2020 обов'язкова."
  - "Не припиняти цервікальний скринінг у 65 років у імунокомпрометованій когорті — підвищений ризик зберігається."
  - "Не пропускати щорічний огляд дерматолога в когорті після трансплантації — стандартизований показник захворюваності на плоскоклітинний рак шкіри ~65-250 вимагає низького порогу для біопсії."
  - "Не нормалізувати нове ураження шкіри / слизової рота / шийки матки / анального каналу в імунокомпрометованій когорті — тривожні симптоми потребують негайного обстеження."
  - "Не відмовляти в моніторингу вірусного навантаження EBV у групі найвищого ризику після трансплантації (EBV-серонегативний реципієнт + серопозитивний донор) — превентивне втручання визначає різницю між успішним лікуванням і прогресуванням до PTLD."

do_not_do_en:
  - "Do not use general-population cervical-screening cadence in the immunocompromised cohort — accelerated cadence (annual cytology initial) per ACOG / ASCCP 2020 is mandatory."
  - "Do not cease cervical screening at age 65 in the immunocompromised cohort — risk elevation persists."
  - "Do not skip annual dermatology in the transplant cohort — SCC SIR ~65-250 with low-threshold biopsy axis."
  - "Do not normalize a new skin lesion / oral lesion / cervical lesion / anal-canal symptom in the immunocompromised cohort — alarm symptoms warrant prompt evaluation."
  - "Do not deny EBV-VL monitoring in the high-risk post-transplant cohort (EBV-seronegative pre-tx + seropositive donor) — preemptive intervention is the difference between treatment success and PTLD progression."

