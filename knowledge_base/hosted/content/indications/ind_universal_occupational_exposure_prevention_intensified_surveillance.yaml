do_not_do:
  - "Не використовувати загальнопопуляційну кратність скринінгу в когорті з множинними впливами — захворюваність суттєво підвищена через синергію впливів."
  - "Не призначати низькодозову КТ без документованого профілю впливу + латентного періоду ≥10 років після першого контакту — шкода від хибнопозитивних результатів перевищує користь за недостатнього латентного періоду."
  - "Не пропускати документацію для компенсації працівникам / медико-юридичну документацію — клінічна документація перетинається з юридичними позовами та епідеміологічним наглядом за громадським здоров'ям."
  - "Не нормалізувати триваючий вплив без консультації щодо зміни умов праці — адекватність засобів індивідуального захисту + моніторинг впливу + направлення до гігієни праці є пріоритетними."
  - "Не відмовляти в обстеженні на мезотеліому в когорті з впливом азбесту за нових плевральних симптомів — ПЕТ-КТ + біопсія призначаються за симптомами, а не за рутинною кратністю."

do_not_do_en:
  - "Do not use general-population screening cadence in the multi-exposure cohort — synergistic-exposure SIR is substantially elevated."
  - "Do not order LDCT without a documented exposure profile + ≥10y latency post-first-exposure — false-positive harm exceeds benefit without adequate latency."
  - "Do not skip workers-compensation / medico-legal documentation — clinical documentation cross-cuts with legal claims and public-health surveillance."
  - "Do not normalize ongoing exposure without workplace-modification consultation — PPE adequacy + exposure monitoring + occupational-health referral are primary."
  - "Do not deny mesothelioma evaluation in the asbestos-exposed cohort at new pleural symptoms — PET-CT + biopsy is symptom-prompted, not routine cadence."

