do_not_do:
  - "Не подавати стандартний скринінг як еквівалент посиленого спостереження в когорті з множинними впливами — результати гірші."
  - "Не пропускати освіту щодо настороженості до симптомів — обстеження за симптомами є резервним варіантом для шляху з відмовою від посиленої кратності."
  - "Не відмовляти в консультації щодо зміни умов праці, якщо пацієнт продовжує зазнавати впливу — напрямок засобів індивідуального захисту / моніторингу впливу окремий від залучення до спостереження."
  - "Не нормалізувати тривожні симптоми (стійкий кашель, незрозуміла гематурія, незагоєне ураження шкіри, новий плевральний випіт) у когорті з впливом — обстеження за симптомами є пріоритетним."
  - "Не відмовляти у формальній медико-юридичній документації, якщо пацієнт потенційно має право на компенсацію працівникам — документація впливу перетинається з юридичним та епідеміологічним наглядом за громадським здоров'ям."

do_not_do_en:
  - "Do not present standard screening as equivalent to intensified surveillance in the multi-exposure cohort — outcomes are inferior."
  - "Do not skip symptom-vigilance education — symptom-prompted evaluation is the backup for the declined-cadence pathway."
  - "Do not deny workplace-modification consultation if the patient is ongoing exposed — PPE / exposure-monitoring axis is separate from surveillance engagement."
  - "Do not normalize alarm symptoms (persistent cough, unexplained hematuria, non-healing skin lesion, new pleural effusion) in the exposed cohort — symptom-prompted evaluation is primary."
  - "Do not deny formal medico-legal documentation if the patient is potentially eligible for workers-compensation / IIDB — exposure documentation cross-cuts with legal + public-health surveillance."

