do_not_do:
  - "Не пропускати передачу резюме перенесеного лікування сімейному лікарю — навіть у сценарії відмови від програми це найцінніший документ."
  - "Не подавати звичайний популяційний скринінг як еквівалент програми спостереження за онковижилими в когорті з перенесеним лікуванням — прогалини в скринінгу пізніх ускладнень суттєво підвищують смертність."
  - "Не пропускати освіту щодо настороженості до симптомів пізніх ускладнень високого ризику — розпізнавання патернів критично важливе, коли спостереження за кратністю не проводиться."
  - "Не закривати можливість повторного залучення — більшість пацієнтів зрештою залучаються за появи симптомів пізніх ускладнень."
  - "Не нормалізувати симптоми пізньої кардіотоксичності (задишка, зниження толерантності до навантажень, набряки) в когорті з опроміненням грудної клітки / антрациклінами через десятиліття після лікування — розпізнавання патернів є різницею між своєчасним направленням до кардіолога та пропущеним діагнозом."

do_not_do_en:
  - "Do not skip treatment-exposure summary handoff to primary-care — even in declined-program scenarios it is the highest-value artifact."
  - "Do not present routine population-screening as equivalent to survivorship program in the exposed cohort — late-effect screening gaps significantly increase mortality."
  - "Do not skip symptom-vigilance education for high-risk late effects — pattern recognition is critical when cadence-based surveillance is declined."
  - "Do not close the door on re-engagement — most patients eventually engage when late-effect symptoms emerge."
  - "Do not normalize late-onset cardiotoxicity symptoms in the anthracycline / chest-RT exposed cohort decades post-treatment — pattern recognition is the difference between prompt cardiology referral and missed diagnosis."

