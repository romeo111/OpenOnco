do_not_do:
  - "Не пропускати документ резюме лікування — це основа для кратності спостереження, зумовленої отриманим лікуванням."
  - "Не використовувати загальнопопуляційну кратність скринінгу для онковижилих з перенесеним лікуванням — жінка з опроміненням грудної клітки потребує МРТ молочної залози з 25 років, а не мамографії кожні 2 роки з 40."
  - "Не відмовляти в доступі до програми спостереження за онковижилими на підставі формулювання 'первинний рак вилікуваний' — смертність від пізніх ускладнень є суттєвим напрямком, окремим від рецидиву первинного раку."
  - "Не пропускати психосоціальне і репродуктивне спостереження — депресія / тривога / посттравматичний стресовий розлад, пов'язаний з раком, є суб'єктивною, але вимірюваною шкодою в когорті онковижилих."
  - "Не нормалізувати симптоми кардіотоксичності (задишка, зниження толерантності до навантажень, набряки) в когорті з антрациклінами / опроміненням грудної клітки — пізня кардіоміопатія може проявитися через десятиліття після лікування."

do_not_do_en:
  - "Do not skip the treatment summary document — it is the foundation for exposure-driven survivorship cadence."
  - "Do not use general-population screening cadence for exposed survivors — chest-RT-exposed females need breast MRI from age 25, not q2y mammography from 40."
  - "Do not deny survivorship-program access on the basis of primary-cancer-cured framing — late-effect mortality is a substantial axis separate from primary-cancer recurrence."
  - "Do not skip psychosocial / reproductive-health surveillance — depression / anxiety / cancer-related PTSD are subjective but quantifiable harms in the survivor cohort."
  - "Do not normalize cardiotoxicity symptoms (dyspnea, exercise intolerance, edema) in the anthracycline / chest-RT-exposed cohort — late-onset cardiomyopathy can manifest decades post-treatment."

