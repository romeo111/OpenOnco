do_not_do:
  - "Не призначати белзутіфан без консультації фахівця з досвідом ведення VHL."
  - "Не використовувати белзутіфан як заміну спостереженню — це додаткове втручання, а не альтернатива."
  - "Не оперувати малі безсимптомні гемангіобластоми ЦНС — для невеликих стабільних утворень перевага надається спостереженню."

do_not_do_en:
  - "Do not prescribe belzutifan without consultation with a VHL-experienced specialist."
  - "Do not use belzutifan as a replacement for surveillance — additive intervention, not an alternative."
  - "Do not operate on small asymptomatic CNS hemangioblastomas — observation is preferred for small stable lesions."

