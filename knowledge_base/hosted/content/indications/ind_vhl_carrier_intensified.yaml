rationale: >
  Alternative-track companion to IND-VHL-CARRIER-SURVEILLANCE. For VHL carriers
  with active surveillance findings (developing renal/CNS/pancreatic lesions
  below resection threshold), this track adds:

  **Consideration of belzutifan (HIF-2α inhibitor)** — FDA-approved 2021 (Welireg)
  for adults with VHL-associated RCC, CNS hemangioblastomas, and pancreatic NETs
  not requiring immediate surgery. Based on LITESPARK-004 single-arm trial:
  ORR ~49% RCC / ~30% CNS hemangioblastoma / ~83% pancreatic NET. Durable responses;
  side effects include anemia and hypoxia (HIF-2α mediates erythropoietin
  regulation).

  **Reduced surgical thresholds for renal lesions** — nephron-sparing surgery at
  lesion ≥3cm remains standard, but earlier intervention may be considered when
  growth kinetics are rapid (≥0.5cm/year).

  **CNS hemangioblastoma resection threshold** — symptomatic OR rapidly enlarging
  lesions; small asymptomatic lesions can be observed with closer interval imaging.

  Per CHARTER §11 patient-autonomy framing: aggressive intervention requires
  shared decision-making about quality-of-life and side-effect profile vs.
  surveillance burden.

rationale_ua: >
  Індикація альтернативного треку, супутня до IND-VHL-CARRIER-SURVEILLANCE.
  Для носіїв VHL з даними активного спостереження (утворення нирок/ЦНС/
  підшлункової залози, що прогресують, але залишаються нижче порогу резекції),
  цей трек додатково передбачає:

  **Розгляд белзутіфана (інгібітор HIF-2α)** — схвалено FDA у 2021 р. (Welireg)
  для дорослих з VHL-асоційованою РСС, гемангіобластомами ЦНС та
  нейроендокринними пухлинами підшлункової залози (NET), які не потребують
  негайного хірургічного втручання. За даними одногрупового дослідження
  LITESPARK-004: ORR ~49% для РСС / ~30% для гемангіобластоми ЦНС / ~83% для
  панкреатичного NET. Відповіді тривалі; серед побічних ефектів — анемія та
  гіпоксія (HIF-2α бере участь у регуляції еритропоетину).

  **Знижені хірургічні пороги для ниркових утворень** — органозберігаюча
  хірургія (часткова нефректомія) при ураженні ≥3 см залишається стандартом,
  але раніше втручання може розглядатися при швидких темпах росту
  (≥0.5 см/рік).

  **Поріг резекції гемангіобластоми ЦНС** — симптоматичні АБО швидко зростаючі
  утворення; малі безсимптомні утворення можна спостерігати з коротшим
  інтервалом візуалізації.

  Відповідно до підходу CHARTER §11 щодо автономії пацієнта: агресивне
  втручання потребує спільного прийняття рішень щодо якості життя та профілю
  побічних ефектів порівняно з тягарем спостереження.

