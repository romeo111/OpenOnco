rationale: >
  Standard-track confirmed-carrier surveillance for VHL syndrome (germline VHL
  pathogenic variant confirmed). Per VHL Alliance Active Surveillance Guidelines:

  **Brain + spine MRI q1y from age 15-16** — CNS hemangioblastomas are the most
  common VHL-associated tumor; surveillance enables resection before symptomatic
  cord compression or hydrocephalus.

  **MRI abdomen (kidneys + adrenals + pancreas) q1-2y from age 15** —
  surveillance for clear-cell RCC (lifetime risk 25-45%), pheochromocytoma
  (10-20%), pancreatic neuroendocrine tumors / serous cystadenomas (10-15%).
  Nephron-sparing surgery (partial nephrectomy) is the standard for renal
  lesions ≥3cm — preserves renal function while removing tumor before metastasis.

  **Ophthalmology q1y from age 1-5** — retinal hemangioblastomas (capillary
  hemangiomas) treated with laser photocoagulation or cryotherapy before vision
  loss.

  **Catecholamines / metanephrines q1y from age 5-10** — pheochromocytoma
  screening; if elevated → MRI adrenals + 24h urine + plasma free metanephrines.

  **Comprehensive audiology q2-3y** — endolymphatic sac tumors (rare but
  characteristic; can cause hearing loss).

  RCC is the leading cause of mortality in adult VHL carriers — adherence to the
  q1-2y abdominal MRI cadence is the highest-priority surveillance item.

rationale_ua: >
  Стандартний трек спостереження за підтвердженими носіями синдрому VHL
  (підтверджений патогенний герміногенний варіант VHL). За настановами VHL Alliance
  Active Surveillance Guidelines:

  **МРТ головного мозку та хребта раз на рік з 15-16 років** — гемангіобластоми
  ЦНС є найпоширенішою VHL-асоційованою пухлиною; спостереження дозволяє
  провести резекцію до появи симптоматичної компресії спинного мозку або
  гідроцефалії.

  **МРТ черевної порожнини (нирки, надниркові залози, підшлункова залоза) раз
  на 1-2 роки з 15 років** — спостереження щодо світлоклітинної РСС (довічний
  ризик 25-45%), феохромоцитоми (10-20%), нейроендокринних пухлин
  підшлункової залози / серозних цистаденом (10-15%). Органозберігаюча
  хірургія (часткова нефректомія) — стандарт для ниркових утворень ≥3 см —
  зберігає функцію нирки, видаляючи пухлину до розвитку метастазів.

  **Офтальмологія раз на рік з 1-5 років** — ретинальні гемангіобластоми
  (капілярні гемангіоми) лікують лазерною фотокоагуляцією або кріотерапією до
  втрати зору.

  **Катехоламіни / метанефрини раз на рік з 5-10 років** — скринінг
  феохромоцитоми; при підвищенні показників → МРТ надниркових залоз +
  24-годинна сеча + плазмові вільні метанефрини.

  **Комплексна аудіологія раз на 2-3 роки** — пухлини ендолімфатичного мішка
  (рідкісні, але характерні; можуть спричиняти втрату слуху).

  РСС — провідна причина смертності серед дорослих носіїв VHL — дотримання
  графіка МРТ черевної порожнини раз на 1-2 роки є найвищим пріоритетом
  спостереження.

