do_not_do:
  - "Не пропускати щорічну МРТ черевної порожнини у носіїв VHL — РСС є провідною причиною смертності серед дорослих."
  - "Не використовувати опромінення всього тіла для спостереження — носії VHL чутливі до радіаційно-індукованих вторинних злоякісних пухлин; перевага надається МРТ без радіаційного навантаження."
  - "Не пропускати дитячу офтальмологію — ретинальні гемангіобластоми можуть з'явитися дуже рано."
  - "Не делегувати спостереження за VHL фахівцю без відповідного досвіду — координація багатьох органів потребує центру з досвідом ведення VHL."

do_not_do_en:
  - "Do not skip annual abdominal MRI in VHL carriers — RCC is the leading cause of mortality in adults."
  - "Do not use whole-body radiation surveillance — VHL carriers are sensitive to radiation-induced secondary malignancies; non-ionizing MRI preferred."
  - "Do not skip pediatric ophthalmology — retinal hemangioblastomas can begin very early."
  - "Do not delegate VHL surveillance to non-specialists — multi-organ coordination requires a VHL-experienced center."

