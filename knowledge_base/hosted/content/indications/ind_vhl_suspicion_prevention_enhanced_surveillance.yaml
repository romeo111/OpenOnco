do_not_do:
  - "Не подавати посилене спостереження як еквівалент генетичного підтвердження — діагностична точність відсутня; перевага каскадного тестування для родичів втрачається; цей компроміс особливо вагомий при VHL через високу інтенсивність дитячого спостереження."
  - "Не пропускати дитячу офтальмологію (раз на рік з 1-5 років) при емпіричному спостереженні у сім'ях з високою підозрою на VHL — ретинальна гемангіобластома є провідною причиною втрати зору і потребує лазерного лікування / кріотерапії за раннього виявлення."
  - "Не пропускати періодичне повторне обговорення генетичного тестування — більшість пацієнтів згодом погоджуються на тестування після додаткових візитів і зниження тривожності, особливо з огляду на перевагу каскадного тестування для дітей."
  - "Не починати дитячі МРТ (за протоколом дорослих) раніше 15-16 років — ризик седації / анестезії при щорічній МРТ у дітей перевищує користь до настання вікового вікна виникнення мозочкової гемангіобластоми."
  - "Не використовувати плазмові вільні метанефрини без підтвердження сечовим тестом при межових значеннях — частота хибнопозитивних результатів плазмового тестування вища; референтні діапазони в дітей відрізняються від дорослих."

do_not_do_en:
  - "Do not present enhanced surveillance as equivalent to genetic confirmation — diagnostic precision is absent; cascade-testing benefit for relatives is lost; this trade-off is particularly weighty in VHL given the high-stakes childhood surveillance protocol."
  - "Do not skip childhood ophthalmology (q1 year from age 1-5) in empirical surveillance of strong VHL families — retinal hemangioblastoma is a leading cause of vision loss and requires laser / cryotherapy at early detection."
  - "Do not skip periodic re-discussion of genetic testing — most patients eventually accept testing after additional visits and reduced anxiety, especially when cascade-testing benefit for children is emphasized."
  - "Do not start childhood MRIs (at adult-protocol cadence) before age 15-16 — pediatric sedation / anesthesia risk at annual MRI cadence exceeds benefit before the cerebellar hemangioblastoma onset window."
  - "Do not use plasma free metanephrines without urine confirmation in borderline values — false-positive rate of plasma testing is higher; pediatric reference ranges differ from adult."

