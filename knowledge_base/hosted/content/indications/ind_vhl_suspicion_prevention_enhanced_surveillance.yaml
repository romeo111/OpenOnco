rationale: >
  Alternative-track companion to IND-VHL-SUSPICION-PREVENTION-GENETIC-
  COUNSELING. Patient with pedigree suspicion of VHL who declines
  genetic counseling and/or germline VHL testing — for any reason
  (cost, insurance concerns, psychological / anxiety considerations,
  family privacy, geographic access constraints, reluctance to
  initiate the lifelong-surveillance commitment in self / children) —
  is offered empirical multi-organ surveillance applied as if VHL
  were confirmed:

  **CNS:** MRI brain + complete spine q1-2 years from age 15-16
  (matches confirmed-carrier protocol because hemangioblastoma onset
  typically falls in this window).

  **Abdomen (kidneys / adrenals / pancreas):** Contrast-enhanced MRI
  abdomen q1-2 years from age 15-16. RCC surveillance with "3-cm rule"
  for tumor-sparing partial nephrectomy. Adrenal pheochromocytoma
  and pancreatic NET captured in the same imaging.

  **Ophthalmology:** Dilated fundoscopy with retinal angiography
  q1 year from age 1-5 — this is the highest-stakes empirical
  recommendation for children of VHL-suspicion families because
  retinal hemangioblastoma onset is childhood and untreated lesions
  cause irreversible vision loss within years.

  **Catecholamines / metanephrines:** Plasma free metanephrines or
  24-hour urine metanephrines q1 year from age 5-10. Annual blood
  pressure check at every primary-care visit.

  **Hearing:** Audiometry q3-5 years from age 15. MRI internal
  auditory canal if symptoms develop.

  Per CHARTER §11 patient-autonomy framing: genetic testing is a
  shared-decision-making domain. VHL is a particularly compelling
  syndrome for genetic confirmation because (1) the surveillance
  burden is high (multi-organ, lifelong, childhood-initiating) and
  asymmetrically benefits true carriers; (2) the cascade-testing
  benefit for relatives is substantial (siblings 50%, children 50%);
  (3) the early-detection mortality / morbidity benefit is well-
  documented (retinal vision preservation, RCC 3-cm rule, pre-
  crisis pheochromocytoma detection). Empirical surveillance preserves
  the early-detection benefit for the index patient but loses the
  cascade-testing benefit; this trade-off should be explicit in
  counseling.

  Routing reconsiderations: if patient eventually accepts germline
  testing, results reroute to (a) confirmed-carrier pathway, (b)
  general-population pathway, or (c) continued pedigree-suspicion if
  VUS.

rationale_ua: >
  Індикація альтернативного треку, супутня до
  IND-VHL-SUSPICION-PREVENTION-GENETIC-COUNSELING. Пацієнту з
  родовідною підозрою на VHL, який відмовляється від генетичного
  консультування та/або герміногенне тестування VHL — з будь-якої
  причини (вартість, страхові міркування, психологічні аспекти /
  тривожність, приватність сімейної інформації, географічні
  обмеження доступу, небажання розпочинати пожиттєве зобов'язання
  щодо спостереження для себе / дітей) — пропонується емпіричне
  мультиорганне спостереження, яке проводиться так, ніби VHL вже
  підтверджено:

  **ЦНС:** МРТ головного мозку та повного хребта раз на 1-2 роки з
  15-16 років (відповідає протоколу підтвердженого носія, оскільки
  виникнення гемангіобластоми зазвичай припадає на цей віковий
  проміжок).

  **Черевна порожнина (нирки / надниркові залози / підшлункова
  залоза):** Контрастна МРТ черевної порожнини раз на 1-2 роки з
  15-16 років. Спостереження за РСС за "правилом 3 см" для
  органозберігаючої часткової нефректомії. Феохромоцитома
  надниркових залоз і панкреатичний NET виявляються при тому самому
  дослідженні.

  **Офтальмологія:** Розширена фундоскопія з ретинальною
  ангіографією раз на рік з 1-5 років — це найвагоміша з емпіричних
  рекомендацій для дітей із сімей з підозрою на VHL, оскільки
  ретинальна гемангіобластома виникає в дитячому віці, а нелікована
  призводить до незворотної втрати зору протягом кількох років.

  **Катехоламіни / метанефрини:** Плазмові вільні метанефрини або
  24-годинні сечові метанефрини раз на рік з 5-10 років. Щорічний
  контроль артеріального тиску при кожному візиті до сімейного
  лікаря.

  **Слух:** Аудіометрія раз на 3-5 років з 15 років. МРТ внутрішнього
  слухового каналу за появи симптомів.

  Відповідно до підходу CHARTER §11 щодо автономії пацієнта:
  генетичне тестування належить до сфери спільного прийняття рішень.
  VHL — особливо переконливий синдром для генетичного підтвердження,
  оскільки (1) тягар спостереження високий (мультиорганний,
  пожиттєвий, починається з дитинства) і асиметрично корисний саме
  справжнім носіям; (2) перевага каскадного тестування для родичів
  суттєва (сибси 50%, діти 50%); (3) користь раннього виявлення для
  смертності/захворюваності добре задокументована (збереження зору,
  правило 3 см для РСС, виявлення феохромоцитоми до розвитку кризу).
  Емпіричне спостереження зберігає перевагу раннього виявлення для
  індексного пацієнта, але втрачає перевагу каскадного тестування;
  цей компроміс має бути чітко озвучений під час консультування.

  Перегляд маршруту: якщо пацієнт згодом погоджується на
  герміногенне тестування, результати перенаправляють до (а) шляху
  підтвердженого носія, (б) шляху загальної популяції, або (в)
  продовження ведення як родовідної підозри — якщо виявлено VUS.

