rationale: >
  Standard-track prevention pathway for individuals with pedigree
  suspicion of Von Hippel-Lindau disease. Three parallel referrals:

  **(1) Genetic counseling referral.** Pre-test counseling covers:
  inheritance pattern (autosomal dominant, near-complete penetrance
  ~90-95% by age 60), implications for family members (cascade
  testing if positive — siblings at 50% risk; children at 50% risk;
  preimplantation genetic diagnosis available; importantly, childhood
  surveillance protocol means early identification of carrier-
  children enables timely intervention for retinal hemangioblastoma
  and pheochromocytoma which emerge in childhood), insurance / GINA
  considerations, psychological aspects of lifelong multi-organ
  surveillance burden. Per ACMG / ASCO guidelines, pre-test counseling
  is the standard of care before germline testing.

  **(2) Germline VHL gene panel testing.** Modern hereditary renal-
  cancer panels (e.g., Invitae renal-cancer panel, Color renal-cancer
  panel) cover VHL (full sequencing + large-deletion / duplication
  analysis — large deletions account for ~30% of VHL pathogenic
  variants and require dedicated MLPA or array-CGH analysis), plus
  the hereditary-RCC differential genes (FH for HLRCC, FLCN for
  Birt-Hogg-Dubé, MET for hereditary papillary RCC, BAP1, SDHB/C/D
  for paraganglioma-pheochromocytoma syndromes, TSC1/2 for tuberous
  sclerosis). Variant classification per ACMG framework.

  **(3) Carrier-confirmation surveillance plan (sequel pathway).**
    Positive VHL carrier → structured multi-organ surveillance per
    VHL Alliance / International VHL Consensus Surveillance Guidelines
    (2020) and NCCN Kidney Cancer Genetic/Familial High-Risk:
    - **CNS:** MRI brain + complete spine q1-2 years from age 15-16
      (cerebellar > spinal > brainstem hemangioblastomas). Lifelong.
    - **Abdomen (kidneys / adrenals / pancreas):** Contrast-enhanced
      MRI abdomen q1-2 years from age 15-16. RCC surveillance with
      the "3-cm rule" — tumor-sparing partial nephrectomy when a
      lesion reaches 3 cm to balance metastatic risk against renal
      function preservation. Pancreatic NETs and adrenal pheochromo-
      cytomas captured in the same imaging.
    - **Ophthalmology:** Dilated fundoscopy with retinal angiography
      q1 year from age 1-5 — yes, this protocol starts in early
      childhood. Retinal hemangioblastomas are one of the earliest
      VHL manifestations and treatable with laser photocoagulation
      or cryotherapy at small sizes, preventing vision loss.
    - **Catecholamines / metanephrines:** Plasma free metanephrines
      or 24-hour urine metanephrines q1 year from age 5-10 (yes,
      childhood) to screen for pheochromocytoma / paraganglioma.
      Annual blood pressure check at every primary-care visit.
    - **Hearing / vestibular:** Audiometry q3-5 years from age 15;
      MRI internal auditory canal if hearing loss or vertigo
      develops (endolymphatic-sac tumor screen).
    - **Reproductive:** Epididymal / broad-ligament cystadenoma
      surveillance per pelvic exam; these are benign but
      pathognomonic.

  Negative result (no pathogenic / likely-pathogenic variant on a
  high-quality panel including large-deletion analysis) → re-
  stratify residual family-history risk; if family history is very
  strong and panel is comprehensive, consider that the proband may
  carry a non-VHL hereditary RCC syndrome (FH / HLRCC, FLCN / BHD,
  SDH-related) and pursue dedicated workup for those. VUS result →
  managed as pedigree suspicion (this Indication) until segregation
  analysis or functional studies clarify.

  Genetic counseling and germline VHL testing are typically covered
  by insurance in the US/EU when pedigree criteria are met; in
  Ukraine, germline testing is available through private labs at
  out-of-pocket cost (~5000-15000 UAH for multi-gene panel; large-
  deletion analysis may be a separate charge).

rationale_ua: >
  Стандартний трек профілактики для осіб з родовідною підозрою на
  хворобу Von Hippel-Lindau. Три паралельні напрями:

  **(1) Направлення на генетичне консультування.** Консультування до
  тестування охоплює: тип спадкування (аутосомно-домінантний, майже
  повна пенетрантність ~90-95% до 60 років), наслідки для членів
  сім'ї (каскадне тестування при позитивному результаті — сибси з
  ризиком 50%; діти з ризиком 50%; доступна передімплантаційна
  генетична діагностика; важливо: дитячий протокол спостереження
  означає, що рання ідентифікація дітей-носіїв уможливлює своєчасне
  втручання при ретинальних гемангіобластомах і феохромоцитомах, які
  проявляються в дитинстві), страхові міркування / питання GINA,
  психологічні аспекти пожиттєвого тягаря мультиорганного
  спостереження. За настановами ACMG / ASCO, консультування до
  тестування є стандартом надання допомоги перед герміногенним
  тестуванням.

  **(2) Герміногенне панельне тестування VHL.** Сучасні панелі для
  спадкової РСС (напр., ниркова панель Invitae, ниркова панель Color)
  охоплюють VHL (повне секвенування + аналіз великих делецій /
  дуплікацій — великі делеції становлять ~30% патогенних варіантів
  VHL і потребують окремого аналізу MLPA або array-CGH), а також
  гени диференційної діагностики спадкової РСС (FH для HLRCC, FLCN
  для синдрому Бірт-Хогг-Дюбе, MET для спадкового папілярного РСС,
  BAP1, SDHB/C/D для синдромів феохромоцитоми/парагангліоми, TSC1/2
  для туберозного склерозу). Класифікація варіантів за критеріями
  ACMG.

  **(3) План спостереження при підтвердженому носійстві (наступний
  етап).** Позитивний носій VHL → структуроване мультиорганне
  спостереження за VHL Alliance / International VHL Consensus
  Surveillance Guidelines (2020) та настановами NCCN щодо
  спадкового/сімейного ризику раку нирки:
    - **ЦНС:** МРТ головного мозку + повний хребет раз на 1-2 роки з
      15-16 років (мозочок > спинний мозок > стовбур мозку за
      частотою гемангіобластом). Пожиттєво.
    - **Черевна порожнина (нирки / надниркові залози / підшлункова
      залоза):** Контрастна МРТ черевної порожнини раз на 1-2 роки з
      15-16 років. Спостереження за РСС за "правилом 3 см" —
      органозберігаюча часткова нефректомія, коли ураження досягає
      3 см, щоб збалансувати метастатичний ризик і збереження
      ниркової функції. Панкреатичні NET і феохромоцитоми
      надниркових залоз виявляються при тому самому дослідженні.
    - **Офтальмологія:** Розширена фундоскопія з ретинальною
      ангіографією раз на рік з 1-5 років — так, цей протокол
      починається у ранньому дитинстві. Ретинальні гемангіобластоми —
      один із найбільш ранніх проявів VHL; піддаються лазерній
      фотокоагуляції або кріотерапії при малих розмірах, що запобігає
      втраті зору.
    - **Катехоламіни / метанефрини:** Плазмові вільні метанефрини
      або 24-годинні сечові метанефрини раз на рік з 5-10 років (так,
      саме в дитинстві) для скринінгу феохромоцитоми / парагангліоми.
      Щорічний контроль артеріального тиску при кожному візиті до
      сімейного лікаря.
    - **Слух / вестибулярна функція:** Аудіометрія раз на 3-5 років
      з 15 років; МРТ внутрішнього слухового каналу за появи
      приглухуватості або запаморочення (скринінг пухлини
      ендолімфатичного мішка).
    - **Репродуктивна система:** Спостереження за епідидимальними /
      цистаденомами широкої зв'язки за даними гінекологічного /
      урологічного огляду; ці утворення доброякісні, але
      патогномонічні.

  Негативний результат (без патогенного / ймовірно патогенного
  варіанту за високоякісною панеллю, що включає аналіз великих
  делецій) → повторна стратифікація залишкового сімейно-історичного
  ризику; якщо сімейний анамнез дуже обтяжений, а панель комплексна,
  слід розглянути, що пробанд може мати інший спадковий синдром РСС,
  не пов'язаний із VHL (FH / HLRCC, FLCN / BHD, SDH-асоційований), і
  перейти до відповідного спеціалізованого обстеження. Результат VUS
  → ведеться як родовідна підозра (ця Indication) до отримання даних
  сегрегаційного аналізу або функціональних досліджень.

  Генетичне консультування та герміногенне тестування VHL зазвичай
  покриваються страхуванням у США/ЄС за відповідності критеріям; в
  Україні герміногенне тестування доступне через приватні
  лабораторії за власний кошт (~5000-15000 грн за мультигенну
  панель; аналіз великих делецій може оплачуватися окремо).

