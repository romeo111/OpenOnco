do_not_do:
  - "Не пропускати скринінг критеріїв прийнятності для біопсії сторожового лімфовузла (розмір пухлини, фокальність, глибина інвазії, огляд/візуалізація пахових вузлів) перед SLNB — невідповідні пацієнтки потребують повної пахово-стегнової лімфаденектомії"
  - "Не пропускати завершальну лімфаденектомію або пахову променеву терапію при позитивному сторожовому вузлі — SLNB окремо валідована ЛИШЕ для SLN-негативного захворювання"
  - "Не пропонувати первинну хірургічну ексцизію при SCC піхви, якщо це порушить функцію сечового міхура, прямої кишки або уретри — надавати перевагу RT-базованому дефінітивному лікуванню"

do_not_do_en:
  - "Do not skip sentinel-lymph-node-biopsy eligibility screening (tumor size, focality, invasion depth, groin exam/imaging) before offering SLNB alone — ineligible patients require complete inguinofemoral lymphadenectomy"
  - "Do not skip completion lymphadenectomy or inguinofemoral RT when the sentinel node is positive — SLNB alone is validated ONLY for SLN-negative disease"
  - "Do not offer primary surgical excision for vaginal SCC where excision would compromise bladder, rectal, or urethral function — prefer RT-based definitive treatment"

