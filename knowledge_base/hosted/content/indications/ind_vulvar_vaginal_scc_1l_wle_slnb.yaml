rationale: >
  Early-stage vulvar SCC (unifocal, <4cm, invasion >1mm, clinically
  node-negative groin) is managed with wide local excision of the
  primary tumor plus inguinal sentinel lymph node biopsy (SLNB),
  replacing routine complete inguinofemoral lymphadenectomy in eligible
  patients. GROINSS-V-I (van der Zee, J Clin Oncol 2008; n=403
  assessable, 259 unifocal SLN-negative) established this paradigm:
  isolated groin recurrence in SLN-negative patients 2.3% (95% CI
  0.6-5%), 3-year survival 97%, with markedly reduced morbidity vs
  complete lymphadenectomy (wound breakdown 11.7% vs 34.0%; cellulitis
  4.5% vs 21.3%; long-term lymphedema 1.9% vs 25.2%). SLN-positive
  patients require completion inguinofemoral lymphadenectomy or,
  per the follow-on GROINSS-V-II trial, inguinofemoral radiotherapy for
  micrometastases ≤2mm — lymphadenectomy remains standard for
  macrometastatic (>2mm) disease. Vaginal SCC is rarely amenable to
  primary surgery given proximity to the bladder, rectum, and urethra;
  local excision is reserved for small, superficial, surgically
  accessible lesions where function can be preserved — most vaginal
  SCC is managed with RT-based definitive treatment instead (see
  IND-VULVAR-VAGINAL-SCC-LA-1L-CISPLATIN-RT).

rationale_ua: >
  Ранньостадійна SCC вульви (уніфокальна, <4см, інвазія >1мм,
  клінічно негативні пахові вузли) лікується широкою локальною
  ексцизією первинної пухлини разом з біопсією пахового сторожового
  лімфовузла (SLNB), що замінює рутинну повну пахово-стегнову
  лімфаденектомію у прийнятних пацієнток. GROINSS-V-I (van der Zee,
  J Clin Oncol 2008; n=403 оцінюваних, 259 уніфокальних SLN-негативних)
  встановило цю парадигму: ізольований пахвовий рецидив у
  SLN-негативних пацієнток 2.3% (95% ДІ 0.6-5%), 3-річна виживаність
  97%, з суттєвим зниженням захворюваності порівняно з повною
  лімфаденектомією (розходження рани 11.7% проти 34.0%; целюліт 4.5%
  проти 21.3%; довгостроковий лімфедема 1.9% проти 25.2%).
  SLN-позитивним пацієнткам потрібна завершальна пахово-стегнова
  лімфаденектомія або, за дослідженням GROINSS-V-II, пахова
  променева терапія при мікрометастазах ≤2мм — лімфаденектомія
  залишається стандартом при макрометастазах (>2мм). SCC піхви рідко
  придатна до первинної хірургії через близькість до сечового міхура,
  прямої кишки та уретри; локальна ексцизія зарезервована для малих,
  поверхневих, хірургічно доступних вогнищ зі збереженням функції —
  більшість SCC піхви лікується RT-базованим дефінітивним лікуванням
  (див. IND-VULVAR-VAGINAL-SCC-LA-1L-CISPLATIN-RT).
