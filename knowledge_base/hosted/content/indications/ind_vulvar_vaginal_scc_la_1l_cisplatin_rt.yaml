do_not_do:
  - "Не розпочинати цисплатин без вирішення гідронефрозу або обструкції сечовивідних шляхів, якщо наявні"
  - "Не відкладати початок променевої терапії — тривалість курсу хіміопроменевої терапії впливає на локальний контроль"
  - "Не призначати цисплатин при кліренсі креатиніну <50 мл/хв без переходу на карбоплатин або відмови від хіміосенсибілізації (див. правила дозової корекції REG-CISPLATIN-RADIOSENS)"

do_not_do_en:
  - "Do not initiate cisplatin without resolving hydronephrosis or urinary tract obstruction if present"
  - "Do not delay radiation therapy initiation — completing chemoradiation in a timely fashion matters for local control"
  - "Do not administer cisplatin at CrCl <50 mL/min without switching to carboplatin or omitting chemosensitization (see REG-CISPLATIN-RADIOSENS dose-adjustment rules)"

