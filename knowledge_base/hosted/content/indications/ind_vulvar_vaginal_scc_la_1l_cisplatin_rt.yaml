id: IND-VULVAR-VAGINAL-SCC-LA-1L-CISPLATIN-RT
plan_track: standard

applicable_to:
  disease_id: DIS-VULVAR-VAGINAL-SCC
  line_of_therapy: 1
  stage_requirements:
    - "Locally advanced vulvar SCC: primary tumor not amenable to surgical resection without unacceptable functional morbidity (urethral, anal sphincter, or bladder involvement), OR clinically/radiologically fixed or ulcerated (bulky) groin nodes, M0"
    - "Vaginal SCC: most cases at diagnosis, given anatomic constraints limiting surgical candidacy — definitive chemoradiation is the primary curative-intent approach regardless of formal FIGO substage"
    - "No distant metastases (M0)"
  biomarker_requirements_required: []
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

recommended_regimen: REG-CISPLATIN-RADIOSENS
concurrent_therapy:
  - "Concurrent external beam radiation therapy (EBRT) to the primary tumor + regional (inguinofemoral ± pelvic) nodes — planned and delivered by radiation oncology; dose/fractionation and any brachytherapy boost are individualized and not modellable in the current OpenOnco Regimen schema (see REG-CISPLATIN-RADIOSENS notes / KNOWLEDGE_SCHEMA_SPECIFICATION §17)"
followed_by:
  - "Response assessment 8-12 weeks post-CRT: clinical exam ± MRI pelvis"
  - "Residual/persistent disease: biopsy confirmation before considering salvage surgery"

evidence_level: low
strength_of_recommendation: conditional
nccn_category:

expected_outcomes: {}

hard_contraindications: []
red_flags_triggering_alternative: []

required_tests:
  - TEST-CT-CAP
  - TEST-MRI-PELVIS
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-CREATININE-CL
desired_tests: []

rationale: >
  Locally advanced vulvar SCC (primary not resectable without
  unacceptable functional morbidity, or bulky/fixed groin nodes) and
  most vaginal SCC (anatomic constraints — proximity to bladder,
  rectum, urethra — limit surgical candidacy) are managed with
  definitive concurrent chemoradiation: weekly cisplatin
  radiosensitization plus external beam RT to the primary tumor and
  regional nodes, mirroring the cisplatin + RT paradigm established for
  locally advanced cervical cancer (GOG-120/NCIC, IND-CERVICAL-LOCALLY-
  ADVANCED-CRT) and extrapolated by gynecologic-oncology practice to
  vulvar and vaginal SCC given the rarity of these tumors precluding
  disease-specific randomized trials. REG-CISPLATIN-RADIOSENS (weekly
  cisplatin 40 mg/m², cap 70 mg, concurrent with EBRT) is reused here
  UNCHANGED from its cervical-cancer authoring — the radiosensitizing
  chemotherapy backbone is identical across these pelvic-SCC
  chemoradiation protocols; only the RT field/dose (individualized by
  radiation oncology to vulvar/vaginal/groin anatomy) differs, and RT
  field/dose is not separately modellable in the current schema. NO
  single pivotal randomized trial establishes cisplatin+RT specifically
  for vulvar/vaginal SCC (unlike GOG-120 for cervical or ACT II for
  anal SCC) — this is an extrapolated standard-of-care pathway pending
  disease-specific evidence; flagged as an open gap for a dedicated
  NCCN Vulvar/Vaginal Cancer Source stub.

rationale_ua: >
  Місцево-поширена SCC вульви (первинна пухлина, не резектабельна без
  неприйнятної функціональної захворюваності, або фіксовані/об'ємні
  пахові вузли) та більшість SCC піхви (анатомічні обмеження —
  близькість до сечового міхура, прямої кишки, уретри — обмежують
  хірургічну придатність) лікуються дефінітивною одночасною
  хіміопроменевою терапією: щотижневий цисплатин-радіосенсибілізатор
  разом з дистанційною променевою терапією на первинну пухлину та
  регіонарні вузли, за аналогією з парадигмою цисплатин + ПТ,
  встановленою для місцево-поширеного цервікального раку (GOG-120/
  NCIC, IND-CERVICAL-LOCALLY-ADVANCED-CRT) та екстрапольованою
  гінекологічно-онкологічною практикою на SCC вульви та піхви з
  огляду на рідкісність цих пухлин, що унеможливлює нозологічно-
  специфічні рандомізовані дослідження. REG-CISPLATIN-RADIOSENS
  (щотижневий цисплатин 40 мг/м², макс. 70 мг, одночасно з EBRT)
  повторно використовується тут БЕЗ ЗМІН з його авторства для
  цервікального раку. Жодне окреме пілотне рандомізоване дослідження
  не встановлює цисплатин+ПТ спеціально для SCC вульви/піхви — це
  екстрапольований стандарт лікування до появи нозологічно-
  специфічних доказів.
