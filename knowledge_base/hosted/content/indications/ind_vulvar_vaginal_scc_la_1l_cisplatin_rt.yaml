notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1; dev-mode-exempted
  per CHARTER §8.3 — draft content only, NOT published/verified clinical
  advice). PARTIAL — RT dose/field not modellable per
  KNOWLEDGE_SCHEMA_SPECIFICATION §17, mirrors the IND-CERVICAL-LOCALLY-
  ADVANCED-CRT pattern exactly. REG-CISPLATIN-RADIOSENS is reused
  UNCHANGED (no existing file was modified) — its own notes/notes_ua
  describe cervical FIGO IB3-IVA dosing context, but the weekly-
  cisplatin component dose (40 mg/m², cap 70mg) is the identical
  radiosensitizing backbone applied here; RT field/dose for
  vulvar/vaginal SCC (primary + groin ± pelvic nodes) is planned by
  radiation oncology, distinct from the cervical pelvic RT +
  brachytherapy field. No vulvar/vaginal-specific pivotal
  chemoradiation RCT was found — evidence is extrapolated from cervical
  (GOG-120) and anal (ACT II) chemoradiation paradigms; flagged as an
  open evidentiary gap rather than asserting invented response-rate
  numbers for this specific disease.
