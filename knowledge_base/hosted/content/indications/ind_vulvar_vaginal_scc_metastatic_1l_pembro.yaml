id: IND-VULVAR-VAGINAL-SCC-METASTATIC-1L-PEMBRO
plan_track: standard

applicable_to:
  disease_id: DIS-VULVAR-VAGINAL-SCC
  line_of_therapy: 1
  stage_requirements:
    - "Metastatic (distant metastatic disease) OR recurrent/persistent vulvar or vaginal SCC not amenable to curative-intent surgery or definitive chemoradiation"
    - "Previously treated advanced disease per KEYNOTE-158 vulvar cohort enrollment (post-platinum / post-chemoradiation or other prior systemic therapy) — positioned here as the 1L systemic option for metastatic disease in this KB pass because no platinum-based cytotoxic chemotherapy Indication is yet authored for vulvar/vaginal SCC (open gap; see notes)"
  biomarker_requirements_required:
    - biomarker_id: BIO-PDL1-CPS
      required: false
      value_constraint: "PD-L1 CPS ≥1 by 22C3 IHC preferred per cross-tumor pembrolizumab-eligibility convention; KEYNOTE-158 vulvar cohort (n=101) showed responses in BOTH PD-L1-positive (ORR 9.5%, n=84) and PD-L1-negative (ORR 28.6%, n=7, wide 95% CI 3.7-71.0%) subgroups — CPS≥1 is NOT a validated hard predictive cutoff for vulvar SCC pembrolizumab response, unlike the CPS≥1 FDA label for cervical cancer (KEYNOTE-826)"
  biomarker_requirements_excluded: []
  demographic_constraints:
    ecog_max: 2

recommended_regimen: REG-PEMBROLIZUMAB-MONO
concurrent_therapy: []
followed_by: []

evidence_level: low
strength_of_recommendation: conditional
nccn_category:

expected_outcomes:
  overall_response_rate: "10.9% (95% CI 5.6-18.7%) all comers (n=101, KEYNOTE-158 vulvar cohort); 9.5% (4.2-17.9%) among 84 PD-L1 CPS≥1 patients; 28.6% (3.7-71.0%) among 7 PD-L1-negative patients (small subgroup)"
  progression_free_survival: "Median PFS 2.1 months (95% CI 2.0-2.1)"
  overall_survival_median: "Median OS 6.2 months (95% CI 4.9-9.4)"

hard_contraindications: []
