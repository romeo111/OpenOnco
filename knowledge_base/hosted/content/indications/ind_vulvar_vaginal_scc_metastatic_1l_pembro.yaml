  - RF-ACTIVE-AUTOIMMUNE-DISEASE-ICI-RISK

required_tests:
  - TEST-PDL1-IHC
  - TEST-CT-CAP
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-TSH
desired_tests: []

rationale: >
  Pembrolizumab monotherapy (200 mg IV q3w, or 400 mg q6w) is an option
  for metastatic or recurrent/persistent vulvar (and, by extension,
  vaginal) SCC not amenable to curative-intent local therapy, based on
  the KEYNOTE-158 basket-trial vulvar cohort (Shapira-Frommer et al.,
  Gynecol Oncol 2022; NCT02628067): n=101 previously treated advanced
  vulvar SCC, ORR 10.9%, median duration of response 20.4 months among
  responders — durable disease control in a minority of patients.
  Responses occurred in both PD-L1-positive and PD-L1-negative
  subgroups, so PD-L1 CPS is included here as an eligibility-informing
  (not hard-gating) biomarker, distinct from the CPS≥1 FDA-label
  requirement for cervical cancer (KEYNOTE-826). Median PFS was short
  (2.1 months), reflecting that most patients do not respond; treatment
  is reasonable to discuss for fit patients given the durability of
  response in the responding subset and the limited alternative
  systemic options authored in this KB for this rare, previously-
  treated population.

rationale_ua: >
  Пембролізумаб у монотерапії (200 мг в/в кожні 3 тижні, або 400 мг
  кожні 6 тижнів) є опцією при метастатичній або рецидивній/
  персистуючій SCC вульви (і, за аналогією, піхви), не придатній до
  курабельного місцевого лікування, на основі кошикового кагорту
  KEYNOTE-158 (Shapira-Frommer та співавт., Gynecol Oncol 2022;
  NCT02628067): n=101 попередньо лікованих поширених SCC вульви, ORR
  10.9%, медіана тривалості відповіді 20.4 місяців серед відповідачів
  — стійкий контроль захворювання у меншості пацієнток. Відповіді
  спостерігались як у PD-L1-позитивних, так і у PD-L1-негативних
  підгрупах, тому статус PD-L1 CPS включено тут як маркер, що
  інформує (а не строго обмежує) вибір, на відміну від вимоги CPS≥1
  у FDA-схваленні для цервікального раку (KEYNOTE-826). Медіана ВБП
  була короткою (2.1 місяців), що відображає відсутність відповіді у
  більшості пацієнток.
