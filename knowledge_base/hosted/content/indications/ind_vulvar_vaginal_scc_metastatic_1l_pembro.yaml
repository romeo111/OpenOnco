sources:
  - source_id: SRC-KEYNOTE-158-VULVAR-SHAPIRA-FROMMER-2022
    position: supports
    relevant_quote_paraphrase: "KEYNOTE-158 vulvar SCC cohort (n=101): ORR 10.9% overall; 9.5% PD-L1 CPS≥1 vs 28.6% PD-L1-negative (small subgroup); median DOR 20.4 months; median PFS 2.1 months; median OS 6.2 months — responses occur regardless of PD-L1 status"

do_not_do:
  - "Не пропускати тестування PD-L1 CPS перед початком лікування, навіть якщо результат не є суворо обмежуючим для цієї нозології"
  - "Не призначати пембролізумаб пацієнткам з активним аутоімунним захворюванням, що потребує системної імуносупресії, без ретельної мультидисциплінарної оцінки ризику/користі"
  - "Не очікувати високої частоти відповіді — ORR ~11%; обговорювати реалістичні очікування з пацієнткою перед початком"

do_not_do_en:
  - "Do not skip PD-L1 CPS testing before treatment, even though the result is not strictly gating for this tumor type"
  - "Do not prescribe pembrolizumab in patients with active autoimmune disease requiring systemic immunosuppression without careful multidisciplinary risk/benefit review"
  - "Do not set expectations for a high response rate — ORR ~11%; discuss realistic expectations with the patient before starting"

