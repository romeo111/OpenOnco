notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1; dev-mode-exempted
  per CHARTER §8.3 — draft content only, NOT published/verified clinical
  advice). KEYNOTE-158 vulvar cohort enrolled PREVIOUSLY TREATED
  advanced disease (typically post-platinum or post-chemoradiation),
  not treatment-naive metastatic disease — this Indication is
  nonetheless positioned as the metastatic '1L systemic' option in
  ALGO-VULVAR-VAGINAL-SCC-1L per this authoring pass's scope, because
  no platinum-based cytotoxic chemotherapy Indication is yet authored
  for metastatic vulvar/vaginal SCC (open gap). PD-L1 CPS gating is a
  cross-tumor convention applied here for consistency with other
  pembrolizumab Indications in this KB, NOT a vulvar-SCC-validated
  cutoff — KEYNOTE-158 vulvar cohort responses occurred regardless of
  PD-L1 status (see RF-VULVAR-VAGINAL-SCC-PDL1-CPS-1-PLUS notes).
  Reuses REG-PEMBROLIZUMAB-MONO and DRUG-PEMBROLIZUMAB entirely
  unchanged — no existing file was modified.
notes_ua: >
  ЧЕРНЕТКА до підпису клінічного співкерівника. Кагорт KEYNOTE-158 при
  SCC вульви включав ПОПЕРЕДНЬО ЛІКОВАНУ поширену хворобу (зазвичай
  після платини або хіміопроменевої терапії), а не нелікованну
  метастатичну хворобу — ця Indication, тим не менш, позиціонується як
  метастатична опція "1L системного лікування" в ALGO-VULVAR-VAGINAL-
  SCC-1L в межах цього етапу, оскільки платино-вмісна цитотоксична
  хіміотерапія для метастатичної SCC вульви/піхви ще не описана
  (відкрита прогалина). Повторно використовує REG-PEMBROLIZUMAB-MONO
  та DRUG-PEMBROLIZUMAB повністю без змін.
