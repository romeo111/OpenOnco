expected_outcomes:
  overall_response_rate: >-
    Intensified track layers two options on top of the standard Werner
    surveillance protocol: (1) whole-body MRI baseline + q2-3y given
    the diverse Werner cancer spectrum (sarcoma + osteosarcoma +
    melanoma + meningioma + thyroid) — full-body screening catches
    pre-symptomatic lesions across multiple primary sites in a single
    study; (2) intensified cardiovascular risk-factor management
    (statin + glycemic optimization to general-population targets +
    aspirin antiplatelet + bone-density q2y with low-threshold
    bisphosphonate / denosumab for premature osteoporosis) — addresses
    the primary mortality driver (~30-40% of Werner deaths) and may
    deliver more years-of-life-extended than incremental cancer
    surveillance. Trade-off: MRI sedation rarely needed in adult
    Werner carriers but scheduling burden + false-positive findings
    significant; intensive cardiovascular intervention carries
    medication-side-effect burden + adherence challenges.

