rationale: >
  Aggressive-track confirmed-carrier pathway layered on top of the
  IND-WERNER-CARRIER-SURVEILLANCE standard protocol.

  **Foundation:** All standard surveillance from IND-WERNER-CARRIER-
  SURVEILLANCE applies (annual full-body skin exam, annual thyroid US,
  cardiac risk-factor surveillance, skeletal pain-driven imaging,
  general-population colonoscopy + mammography).

  **Intensification 1 — Whole-body MRI baseline + periodic
  surveillance:** Whole-body MRI baseline at confirmed-carrier
  diagnosis (typically late adolescence / early 20s when Werner is
  diagnosable on cardinal-features basis) + q2-3y intervals throughout
  adulthood as a shared-decision option. Rationale: the Werner cancer
  spectrum is diverse (sarcoma, osteosarcoma, melanoma — including
  acral / mucosal subtypes that may not be skin-visible — meningioma,
  thyroid) and full-body MRI screens for all of these in one study.
  Particularly useful for asymptomatic mucosal melanomas, deep
  soft-tissue sarcomas, and asymptomatic meningiomas. Trade-off:
  whole-body MRI 60-90 min duration, false-positive findings (benign
  cysts, fibrous dysplasia, atypical-appearance osteoporotic vertebrae,
  hepatic incidentalomas) driving downstream workup, scheduling /
  capacity constraints at most centers. Center should have whole-
  body MRI radiologic expertise.

  **Intensification 2 — Intensified cardiovascular + endocrine
  management:** Active cardiovascular risk-factor management beyond
  general-population targets:
    - Statin therapy initiated at lower LDL threshold (e.g., LDL > 100
      mg/dL even in absence of established atherosclerotic disease)
      given premature-atherosclerosis natural history.
    - Glycemic control to HbA1c target ≤ 6.5% (tighter than general
      diabetes guidelines for the general population) — premature
      type-2 diabetes is a major contributor to Werner cardiovascular
      mortality; tighter control may slow vascular damage.
    - Aspirin antiplatelet considered after age 30 for primary
      prevention (lower threshold than general-population USPSTF
      guidance given premature-atherosclerosis risk).
    - DEXA bone-density q2y from age 25 + bisphosphonate / denosumab
      consideration when T-score < -2.0 (lower threshold than
      general-population osteoporosis guidelines).
    - Endocrinology partnership for hypogonadism + testosterone /
      estradiol replacement discussion.
  Trade-off: medication burden, adherence challenges, side-effect
  profile (statin myalgia, bisphosphonate jaw / esophageal effects,
  aspirin bleeding), polypharmacy considerations in young adult
  carriers.

  **Other intensification considerations (not core to this track):**
    - Annual full-body MRI Toronto-protocol style is NOT supported in
      Werner — Werner is not Li-Fraumeni; the cancer spectrum is
      different and the false-positive burden of annual whole-body
      MRI exceeds the surveillance benefit.
    - mTOR-pathway chemoprevention (rapalogs) is experimental in
      Werner — do NOT prescribe outside trial setting.
    - Prophylactic surgery (thyroidectomy, oophorectomy) is NOT
      routine in Werner — penetrance does not justify in pre-tumor
      carriers; surgery is reactive.

  **Cascade testing remains continuous:** every visit re-confirms
  family's testing status. Autosomal-recessive inheritance — sibs
  25% homozygous risk.

  Per CHARTER §11: intensified surveillance and intensified
  cardiovascular intervention are shared-decision-making domains.
  Patient autonomy is paramount; standard-track protocol remains the
  floor.

rationale_ua: >
  Aggressive-трекова Indication: накладена поверх IND-WERNER-CARRIER-
  SURVEILLANCE з двома опціями інтенсифікації.

  **Foundation:** Усе стандартне з IND-WERNER-CARRIER-SURVEILLANCE.

  **Інтенсифікація 1 — Whole-body MRI baseline + periodic
  surveillance:** Whole-body MRI baseline при confirmed-carrier
  diagnosis (typically late adolescence / early 20s) + q2-3y
  intervals — shared-decision. Werner cancer spectrum diverse
  (sarcoma, osteosarcoma, melanoma — acral / mucosal subtypes що
  можуть НЕ бути skin-visible — meningioma, thyroid). Whole-body MRI
  screens усе в одному study. Trade-off: 60-90 хв duration,
  false-positive findings (benign cysts, fibrous dysplasia, atypical
  osteoporotic vertebrae, hepatic incidentalomas) → downstream workup,
  scheduling / capacity. Center потребує whole-body MRI expertise.

  **Інтенсифікація 2 — Intensified cardiovascular + endocrine
  management:**
    - Statin при lower LDL threshold (>100 mg/dL навіть без established
      atherosclerotic disease).
    - Glycemic control HbA1c ≤ 6.5% (tighter за general guidelines).
    - Aspirin antiplatelet після 30 — primary prevention (lower
      threshold за USPSTF general-population).
    - DEXA q2y з 25 + bisphosphonate / denosumab при T-score < -2.0
      (lower threshold).
    - Endocrinology partnership для hypogonadism + testosterone /
      estradiol replacement.
  Trade-off: medication burden, adherence, side-effects (statin
  myalgia, bisphosphonate jaw / esophageal, aspirin bleeding),
  polypharmacy у young adults.

  **Інші міркування:**
    - Annual full-body MRI Toronto-protocol style — NOT supported
      (Werner ≠ Li-Fraumeni; cancer spectrum different; annual
      false-positive burden > benefit).
    - mTOR-pathway chemoprevention (rapalogs) — experimental; NOT
      prescribe outside trial.
    - Prophylactic surgery (thyroidectomy, oophorectomy) — NOT routine;
      penetrance does not justify; surgery reactive.

  **Cascade тестування continuous.**

  Per CHARTER §11: shared-decision-making домен.

