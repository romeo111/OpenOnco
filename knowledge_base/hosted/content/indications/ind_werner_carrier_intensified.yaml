do_not_do:
  - "Не використовувати annual full-body MRI Toronto-protocol style — Werner ≠ Li-Fraumeni; cancer spectrum different + annual false-positive burden > benefit."
  - "Не пропонувати prophylactic thyroidectomy / oophorectomy у asymptomatic Werner-carriers — penetrance does not justify; surgery reactive."
  - "Не використовувати mTOR-pathway chemoprevention (rapalogs) поза clinical trial — currently investigational у Werner."
  - "Не intensifyувати cardiovascular intervention без primary-care / internal-medicine co-coordination — polypharmacy у young adult може overwhelm adherence; partnership-based approach критичний."
  - "Не пропускати bone-density q2y з 25 років — premature osteoporosis frequent у Werner; T-score < -2.0 виправдовує bisphosphonate / denosumab discussion."

do_not_do_en:
  - "Do not use annual full-body MRI Toronto-protocol style — Werner is not Li-Fraumeni; the cancer spectrum is different and annual false-positive burden exceeds surveillance benefit."
  - "Do not offer prophylactic thyroidectomy or oophorectomy in asymptomatic Werner carriers — penetrance does not justify it; surgery is reactive."
  - "Do not use mTOR-pathway chemoprevention (rapalogs) outside a clinical trial — currently investigational in Werner."
  - "Do not intensify cardiovascular intervention without primary-care / internal-medicine co-coordination — polypharmacy in a young adult can overwhelm adherence; a partnership-based approach is critical."
  - "Do not skip bone-density q2y from age 25 — premature osteoporosis is frequent in Werner; T-score < -2.0 justifies bisphosphonate or denosumab discussion."

