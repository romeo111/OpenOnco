do_not_do:
  - "Не пропускати acral / mucosal melanoma site examination — disproportionately represented у Werner cohort vs general-population melanoma; sclerodermatous background complicates recognition."
  - "Не treatувати differentiated thyroid carcinoma у Werner-carrier conservatively як у general-population — anaplastic-transformation risk виправдовує lower threshold для total thyroidectomy."
  - "Не biopsyувати suspected sarcoma у community hospital — track contamination + improper biopsy windowing може compromise limb-salvage; refer до sarcoma-experienced surgical team."
  - "Не intensifyувати colorectal / breast screening — Werner НЕ конфертує above-baseline CRC / breast risk; general-population guidelines."
  - "Не пропускати cardiovascular risk-factor management — ~30-40% Werner deaths cardiovascular; statin / glycemic / antiplatelet intervention може extend survival irrespective cancer outcomes."

do_not_do_en:
  - "Do not skip acral / mucosal melanoma site examination — these subtypes are disproportionately represented in the Werner cohort vs general-population melanoma; the sclerodermatous background complicates recognition."
  - "Do not treat differentiated thyroid carcinoma in a Werner carrier as conservatively as in the general population — the anaplastic-transformation risk justifies a lower threshold for total thyroidectomy."
  - "Do not biopsy a suspected sarcoma in a community hospital — track contamination and improper biopsy windowing can compromise limb-salvage; refer to a sarcoma-experienced surgical team."
  - "Do not intensify colorectal or breast screening — Werner does not confer above-baseline CRC or breast risk; follow general-population guidelines."
  - "Do not skip cardiovascular risk-factor management — ~30-40% of Werner deaths are cardiovascular; statin, glycemic, and antiplatelet intervention can extend survival irrespective of cancer outcomes."

