expected_outcomes:
  overall_response_rate: >-
    Structured multi-organ surveillance for Werner syndrome
    integrates oncologic + cardiovascular + endocrine pathways given
    the segmental progeroid phenotype. Dermatologic surveillance
    detects acral / mucosal melanomas at earlier stage where surgical
    excision is curative; thyroid US detects follicular / anaplastic
    thyroid carcinoma at smaller size (anaplastic carcinoma 1-year
    survival is < 20% even with modern therapy — early detection of
    pre-anaplastic differentiated lesions is the leverage point);
    skeletal pain-driven imaging catches osteosarcoma /
    soft-tissue-sarcoma at localized stage. Cardiovascular risk
    surveillance (the main mortality driver in Werner cohorts)
    enables statin / glycemic / antiplatelet intervention to extend
    survival irrespective of cancer outcomes.

