rationale: >
  Standard-track confirmed-carrier surveillance pathway for individuals
  with biallelic germline WRN pathogenic variants or clinically
  diagnosed Werner Syndrome (all cardinal + ≥2 minor features).

  **Skin / melanoma (~5-10% lifetime; acral + mucosal enriched):**
  Annual full-body skin exam by dermatologist with explicit attention
  to acral (palms, soles, subungual) and mucosal (oral, genital,
  conjunctival) sites — these subtypes are disproportionately
  represented in Werner cancer cases compared to general-population
  melanoma. Sclerodermatous skin changes complicate clinical
  recognition — biopsy threshold should be LOW. Photoprotection
  counseling still relevant (general cancer prevention) but the
  Werner-specific melanoma pattern is not strictly UV-driven.

  **Thyroid (~10-15% lifetime; anaplastic over-represented):** Annual
  thyroid US with FNA biopsy of any nodule meeting Bethesda criteria.
  Werner-associated anaplastic thyroid carcinoma is particularly poor-
  prognosis — the leverage point is detecting differentiated thyroid
  carcinoma (papillary, follicular) BEFORE anaplastic transformation;
  threshold for thyroidectomy in confirmed DTC should be lower than
  general-population guidelines given the anaplastic-transformation
  risk in Werner.

  **Soft-tissue sarcoma + osteosarcoma (~5-10% + ~3-5% lifetime):**
  Low-threshold imaging for any persistent (>2-3 weeks) musculoskeletal
  pain or palpable mass — plain X-ray + targeted MRI of suspicious
  site. No routine whole-body screening in standard track (reserved
  for intensified track). Biopsy by sarcoma-experienced surgical team
  only — track contamination and limb-salvage planning matter.

  **Meningioma (~5% lifetime):** No dedicated brain imaging in
  standard track — clinical exam attentive to chronic headache,
  visual changes, seizures, cognitive change, focal neurologic deficit.
  Symptomatic presentation → MRI; resection per neurosurgery.

  **Cardiovascular risk (mortality driver — ~30-40% of Werner deaths):**
  Annual lipid panel, fasting glucose / HbA1c, blood pressure;
  echocardiography q3-5y from age 25-30 to baseline LV function.
  Statin therapy commonly indicated by elevated LDL + premature
  atherosclerosis risk profile; metformin / glycemic management for
  type-2 diabetes (frequent comorbidity); antiplatelet considered.
  Cardiovascular management ideally co-coordinated with internal-
  medicine / endocrinology partner.

  **Endocrine / bone health:** Annual bone-density (DEXA) q2y from age
  25-30 given premature osteoporosis; vitamin D + calcium baseline +
  supplementation; bisphosphonate / denosumab considered for established
  osteoporosis in 30s. Hypogonadism (frequent comorbidity) —
  testosterone / estradiol baseline + symptom-driven replacement
  discussion.

  **Hematologic surveillance:** No dedicated routine bone-marrow
  biopsy / cytogenetics — clinical exam + annual CBC (sufficient
  early signal for MDS / AML / MPN given the symptom burden).
  Persistent cytopenias / dysplastic findings → hematology referral.

  **General-population cancer screening:** Colonoscopy + mammography
  per age-appropriate general-population guidelines — Werner does NOT
  appear to confer above-baseline CRC or breast cancer risk; do not
  intensify these inappropriately.

  **Pre-treatment workup (carrier-aware):** If cancer arises,
  oncology team must be alerted to WRN-deficiency chemosensitivity
  (variable but generally elevated to DNA-damaging agents) AND to
  cardiovascular / diabetic comorbidities affecting anthracycline
  dosing, steroid-containing regimens, and cardiotoxic-agent
  selection. These are TREATMENT-time considerations surfaced here
  so render alerts the oncologist at the moment of new-cancer
  diagnosis.

  **Cascade testing:** Autosomal-recessive — sibs have 25% homozygous
  risk; cascade pre-marital / pre-conception testing in relatives is
  relevant for reproductive planning. Heterozygous adult relatives
  are NOT cancer-predisposed in current evidence.

  Per CHARTER §11 patient-autonomy framing: multi-organ surveillance
  burden is substantial; counseling should surface realistic
  expectations + co-decision-making with internal-medicine /
  endocrinology / cardiology partners.

rationale_ua: >
  Стандартний-трекова Indication для confirmed-carrier Werner
  surveillance per International Werner Syndrome Registry / NCCN-
  aligned consensus.

  **Шкіра / меланома (~5-10% lifetime; acral + mucosal enriched):**
  Annual full-body skin exam dermatologist з explicit attention to
  acral (palms, soles, subungual) + mucosal (oral, genital,
  conjunctival) sites — disproportionately represented vs general-
  population melanoma. Sclerodermatous skin complicates clinical
  recognition — biopsy threshold LOW. Photoprotection counseling
  relevant (general cancer prevention).

  **Щитоподібна (~10-15% lifetime; anaplastic over-represented):**
  Annual thyroid US з FNA per Bethesda. Anaplastic thyroid carcinoma
  poor-prognosis — leverage point: detecting differentiated
  carcinoma (papillary, follicular) BEFORE anaplastic transformation;
  threshold для thyroidectomy при confirmed DTC LOWER за general-
  population guidelines.

  **Soft-tissue sarcoma + osteosarcoma (~5-10% + ~3-5%):**
  Low-threshold imaging (>2-3 тижні persistent pain / palpable
  mass) — plain X-ray + targeted MRI. No routine whole-body
  screening у standard-track. Biopsy ONLY sarcoma-experienced
  surgical team.

  **Менінгіома (~5%):** No dedicated brain imaging у standard-track
  — clinical exam attentive до chronic headache, visual changes,
  seizures, cognitive change, focal deficit.

  **Cardiovascular risk (mortality driver — ~30-40% Werner deaths):**
  Annual lipid + fasting glucose / HbA1c + BP; echocardiography q3-5y
  з 25-30 років. Statin therapy — frequently indicated; metformin /
  glycemic management для T2DM; antiplatelet considered. Internal-
  medicine / endocrinology co-coordination.

  **Endocrine / bone health:** Annual DEXA q2y з 25-30 років через
  premature osteoporosis; vitamin D + calcium + supplementation;
  bisphosphonate / denosumab при established osteoporosis у 30s.
  Hypogonadism (frequent) — testosterone / estradiol baseline +
  symptom-driven replacement.

  **Гематологічна surveillance:** No dedicated routine bone-marrow
  / cytogenetics — clinical exam + annual CBC. Persistent
  cytopenias / dysplastic findings → hematology.

  **General-population cancer screening:** Колоноскопія + mammography
  per general-population guidelines (Werner НЕ конфертує above-
  baseline CRC / breast risk).

  **Pre-treatment workup (carrier-aware):** WRN-deficiency
  chemosensitivity + cardiovascular / diabetic комородідності —
  важливі для anthracycline / steroid / cardiotoxic-agent selection.

  **Cascade тестування:** autosomal-recessive — 25% homozygous risk
  у sibs; pre-marital / pre-conception тестування relevant.

  Per CHARTER §11 framing автономії пацієнта; multi-organ
  surveillance burden substantial.

