rationale: >
  Alternative-track companion. Empirical multi-cancer surveillance for
  Werner-suspect pedigree without WRN confirmation:
  - Annual dermatologic exam (acral melanoma focus)
  - Annual thyroid exam + neck ultrasound
  - Annual soft-tissue / MSK exam + low MRI threshold
  - Brain MRI baseline + as-symptoms (meningioma)
  - Concurrent metabolic / cardiovascular comorbidity management
  - General-population screening (breast, colon, cervix)
  - Defer cascade testing pending genetic confirmation

rationale_ua: >
  Альтернативно-трекова Indication. Empirical multi-cancer surveillance
  для Werner-suspect pedigree без WRN confirmation:
  - Annual dermatologic exam (acral melanoma)
  - Annual thyroid exam + neck US
  - Annual soft-tissue / MSK exam + low MRI threshold
  - Brain MRI baseline + as-symptoms
  - Metabolic / cardiovascular comorbidity management
  - General-population screening
  - Cascade testing — після genetic confirmation

