expected_outcomes:
  overall_response_rate: "Empirical Werner-protocol surveillance without genetic confirmation captures soft-tissue sarcoma + osteosarcoma + thyroid cancer + acral melanoma + meningioma at earlier stage in true Werner patients (~70-90% of suspicion cohort with classic progeroid phenotype), but with lower diagnostic precision and without cascade-testing infrastructure."

