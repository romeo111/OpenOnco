rationale: >
  Standard-track prevention pathway for Werner syndrome (WRN biallelic)
  suspicion.

  **(1) Genetic counseling + germline WRN + RecQ-family panel testing.**
  Autosomal recessive inheritance. Differential includes other RecQ-
  helicase disorders (Bloom / BLM, Rothmund-Thomson / RECQL4) and
  atypical-Werner / mandibuloacral-dysplasia-related syndromes (LMNA,
  POLD1).

  **(2) Confirmed-Werner surveillance protocol** (International Registry
  of Werner Syndrome consensus + Lauper 2013 multi-cancer-spectrum
  data):
  - Annual whole-body skin exam by dermatologist from diagnosis —
    acral / palmoplantar lentiginous melanoma awareness (Werner has
    enriched acral / mucosal melanoma versus general-population
    pattern, often arising in scleroderma-like skin)
  - Annual thyroid exam + neck ultrasound — follicular thyroid
    carcinoma surveillance (Werner thyroid cancers skew follicular /
    anaplastic versus papillary)
  - Annual soft-tissue / musculoskeletal exam with low threshold for MRI
    of any new mass — soft-tissue sarcoma + osteosarcoma surveillance
    (often distal-extremity location in Werner)
  - Brain MRI baseline + as-symptoms — meningioma surveillance
  - Annual ophthalmologic exam — bilateral cataracts (typically already
    present at diagnosis; track + manage)
  - Concurrent management of metabolic / cardiovascular comorbidities
    (type-2 DM + atherosclerosis + hypogonadism) — competing-cause
    mortality
  - Age-appropriate general-population cancer screening (breast,
    colon, cervix) as standard

  **(3) Cascade testing** of at-risk relatives — heterozygous WRN
  carriers have no clearly established cancer-predisposition phenotype.

  **(4) Oncology team coordination** ahead of therapeutic radiation or
  alkylator chemotherapy — Werner cells show genomic instability +
  some chemo-resistance patterns; individualize regimen + radiation
  fractionation.

