do_not_do:
  - "Не використовувати цей шлях у пацієнтів із цирозом на тлі хвороби Вільсона — вони потребують запланованого УЗД/AFP раз на 6 міс."
  - "Не подавати спостереження без візуалізації як еквівалент запланованого скринінгу за цирозу на тлі хвороби Вільсона — інтервальний ГЦК може вийти за межі критеріїв Milan із втратою права на трансплантацію."
  - "Не ігнорувати нову декомпенсацію або випадково виявлене утворення печінки — потрібна негайна візуалізація."
  - "Не використовувати цей шлях у хворобі Вільсона з супутнім HBV/HCV — ризик ГЦК зростає мультиплікативно."
  - "Не пропускати періодичне обговорення переходу до повного спостереження — пацієнтів із цирозом на цьому шляху слід переглядати щорічно."

do_not_do_en:
  - "Do not use this pathway in cirrhotic Wilson's — they require scheduled US/AFP every 6 months."
  - "Do not present observation as equivalent to scheduled surveillance in cirrhotic Wilson's — interval HCC risk may push detection beyond Milan with loss of transplant eligibility."
  - "Do not ignore new decompensation or incidental hepatic mass — immediate imaging."
  - "Do not use this pathway in Wilson's with coexisting HBV/HCV — HCC risk is multiplicatively elevated."
  - "Do not skip periodic re-discussion of upgrade — cirrhotic Wilson's on this pathway should be revisited annually."

