id: MDT-CLINICAL-GENETICIST-RARE-SYNDROME
role_id: clinical_geneticist_rare_syndrome
name: Клінічний генетик (рідкісні спадкові синдроми)
names:
  preferred: Clinical geneticist — rare hereditary syndromes
  ukrainian: Клінічний генетик з рідкісних спадкових синдромів
  english: Clinical geneticist (rare hereditary cancer-syndrome diagnosis)
version: 0.1.0
last_reviewed: '2026-05-18'
domain: clinical_genetics
responsibilities:
  - Differential-diagnosis of rare hereditary cancer syndromes that fall
    outside HBOC / Lynch / FAP first-pass panels — Li-Fraumeni, Cowden /
    PHTS, Peutz-Jeghers, Birt-Hogg-Dubé, ataxia-telangiectasia, Fanconi
    anemia, Rothmund-Thomson, Werner, BAP1 TPDS, SDH-deficient PGL/PCC,
    constitutional mismatch-repair deficiency (CMMRD)
  - Dysmorphology + non-oncologic phenotype assessment when a syndrome is
    suspected (skin findings, skeletal, neurodevelopmental, immune)
  - Variant adjudication on multidisciplinary case review — ACMG criteria,
    functional-evidence integration, segregation analysis when probands
    are limited
  - Authoritative diagnostic call for whether a patient meets clinical
    diagnostic criteria for a hereditary syndrome (vs. asymptomatic
    carrier vs. phenocopy)
  - Family-counseling sessions with paediatric implications (CMMRD, RTS,
    AT, Fanconi) including reproductive risk and PGT-M discussion
  - Coordinated handoff back to oncology surveillance / risk-reducing
    surgery once the syndrome is established
required_for_indications:
  - IND-AT-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-WERNER-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-ROTHMUND-THOMSON-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-BHD-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-SDH-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-MEN1-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-MEN2-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-VHL-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-FAMMM-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-PEUTZ-JEGHERS-CARRIER-SURVEILLANCE
  - IND-BAP1-CARRIER-SURVEILLANCE
  - IND-COWDEN-CARRIER-SURVEILLANCE
required_for_diseases:
  - DIS-PHEOCHROMOCYTOMA
  - DIS-MTC
  - DIS-ADRENOCORTICAL-CARCINOMA
  - DIS-RCC
  - DIS-MELANOMA
  - DIS-PDAC
patient_facing_summary:
  ukrainian: >-
    Клінічний генетик — лікар, який ставить діагноз рідкісних спадкових
    онкологічних синдромів, коли стандартна панель (HBOC / Lynch / FAP)
    не дала відповіді. Оцінює зовнішні ознаки, неонкологічні прояви
    (шкіра, кістки, імунна система), інтерпретує складні варіанти
    генів разом з функціональними даними, і дає остаточний висновок
    про діагноз — наприклад, синдром Лі-Фраумені або Каудена. Працює
    в команді з генетичним консультантом і онкологом.
  english: >-
    A clinical geneticist diagnoses rare hereditary cancer syndromes
    when first-line panels (HBOC, Lynch, FAP) come back negative or
    ambiguous. They evaluate physical findings, non-cancer features
    (skin, bone, immune), interpret complex variants with functional
    data, and make the final clinical call — for example, confirming
    Li-Fraumeni or Cowden syndrome. They work alongside the genetic
    counselor and oncology team.
sources:
  - SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
  - SRC-NCCN-GENETIC-FAMILIAL-CRC-2025
  - SRC-ENDOCRINE-SOCIETY-MEN-2023
  - SRC-ASCO-ACMG-LYNCH-2014
notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KSS §20. Pending Clinical Co-Lead sign-off per CHARTER §6.1.
  Distinct from MDT-GENETIC-COUNSELOR-CANCER-RISK: counselor owns
  risk-model run + cascade-testing logistics; clinical geneticist owns
  the diagnostic call and dysmorphology/phenotype work. Escalates
  rare-paediatric phenotypes to subspecialty programs; works with
  psycho-oncology for confirmed carriers with family-impact distress.
