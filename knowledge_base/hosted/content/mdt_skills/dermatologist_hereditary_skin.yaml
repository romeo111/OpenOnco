id: MDT-DERMATOLOGIST-HEREDITARY-SKIN
role_id: dermatologist_hereditary_skin
name: Дерматолог (спадкові + професійні шкірні онкосиндроми)
names:
  preferred: Dermatologist — hereditary + occupational skin-cancer surveillance
  ukrainian: Дерматолог-онколог зі спадкових і професійних синдромів шкіри
  english: Dermatologist (hereditary skin-cancer syndromes + occupational
    skin-cancer surveillance)
version: 0.1.0
last_reviewed: '2026-05-18'
domain: dermatology
responsibilities:
  - Hereditary skin-cancer syndrome surveillance — FAMMM (CDKN2A / CDK4
    germline carriers), Gorlin (PTCH1 BCC syndrome), ataxia-telangiectasia
    (ATM-driven cutaneous risk), Rothmund-Thomson, xeroderma pigmentosum
  - Total-body skin examination cadence per NCCN — FAMMM q3-6mo full-body
    photography, Gorlin q6mo BCC mapping, XP q3mo from infancy
  - Reflectance confocal microscopy + dermatoscopy for atypical
    nevus mapping in high-risk patients
  - Photoprotection counseling — broad-spectrum SPF≥30, sun-avoidance
    behaviour, indoor-tanning cessation
  - Occupational skin-cancer surveillance — UV exposure (outdoor
    workers), arsenic, PAHs / coal-tar, mineral oils
  - Early-stage excision and Mohs-referral pathway for any suspicious
    lesions identified at surveillance
  - Coordination with MDT-GENETIC-COUNSELOR-CANCER-RISK on germline
    testing for atypical-mole + multiple-melanoma patients
required_for_indications:
  - IND-FAMMM-CARRIER-SURVEILLANCE
  - IND-FAMMM-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-AT-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-ROTHMUND-THOMSON-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-LIFESTYLE-UV-EXPOSURE-PREVENTION-PROTECTION
  - IND-ENVIRONMENTAL-OUTDOOR-UV-SKIN-PREVENTION-PHOTOPROTECTION
required_for_diseases:
  - DIS-MELANOMA
  - DIS-BCC
patient_facing_summary:
  ukrainian: >-
    Дерматолог зі спадкових і професійних шкірних онкосиндромів веде
    пацієнтів з підвищеним ризиком меланоми та немеланомного раку шкіри
    — це FAMMM (мутації CDKN2A), синдром Горліна, ксеродерма
    пігментозум, а також працівники з тривалим УФ-впливом, контактом
    з арсеном, кам'яновугільною смолою чи мінеральними оливами. Робить
    повний огляд шкіри з дерматоскопією, фотодокументує атипові
    невуси, координує генетичне тестування і навчає захищатися від
    сонця. При підозрі — направляє на ексцизію або Мохс-хірургію.
  english: >-
    A dermatologist specialising in hereditary and occupational
    skin-cancer syndromes follows patients at increased risk of
    melanoma and non-melanoma skin cancer — including FAMMM (CDKN2A
    mutations), Gorlin syndrome, xeroderma pigmentosum, and workers
    with long-term UV, arsenic, coal-tar, or mineral-oil exposure.
    They perform full-body skin examinations with dermoscopy, photograph
    atypical nevi for tracking, coordinate germline testing, and teach
    sun-safety. Suspicious lesions are referred for excision or Mohs.
sources:
  - SRC-NCCN-MELANOMA-2025
  - SRC-NCCN-SKIN-2025
  - SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
  - SRC-IARC-100D-IONIZING-RADIATION
notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KSS §20. Pending Clinical Co-Lead sign-off per CHARTER §6.1.
  Treatment-time melanoma / NMSC oncology stays with the medical /
  surgical oncologist roles; this role covers the prevention +
  early-detection + carrier-surveillance axis.
