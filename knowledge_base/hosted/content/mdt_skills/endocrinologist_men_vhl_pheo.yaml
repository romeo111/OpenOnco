id: MDT-ENDOCRINOLOGIST-MEN-VHL-PHEO
role_id: endocrinologist_men_vhl_pheo
name: Ендокринолог (MEN / VHL / феохромоцитома)
names:
  preferred: Endocrinologist — MEN / VHL / PCC / ACC surveillance
  ukrainian: Ендокринолог зі спадкових ендокринних онкосиндромів
  english: Endocrinologist (MEN1 / MEN2 / VHL / pheochromocytoma /
    adrenocortical surveillance)
version: 0.1.0
last_reviewed: '2026-05-18'
domain: endocrine_oncology
responsibilities:
  - MEN1 carrier surveillance — primary hyperparathyroidism (calcium,
    PTH), enteropancreatic NETs (gastrin, chromogranin A, pancreatic
    MRI / EUS), pituitary adenoma (prolactin, IGF-1, pituitary MRI)
  - MEN2 carrier surveillance — medullary thyroid carcinoma screening
    (calcitonin), pheochromocytoma (plasma / urinary fractionated
    metanephrines, adrenal imaging), primary hyperparathyroidism
  - MEN2 prophylactic thyroidectomy timing decision (codon-stratified —
    M918T high-risk by ≤1y, cysteine codons C634 by ≤5y, lower-risk
    codons case-by-case)
  - VHL carrier surveillance — pheochromocytoma / paraganglioma
    (metanephrines + abdominal MRI), pancreatic neuroendocrine tumours,
    coordinated with VHL Alliance multi-organ protocol
  - SDHx-driven hereditary PGL/PCC surveillance — whole-body MRI +
    biochemical panels per Endocrine Society guideline
  - Adrenocortical carcinoma surveillance in Li-Fraumeni and BWS
  - Hormone-replacement and post-adrenalectomy steroid management for
    bilateral PCC and post-prophylactic-thyroidectomy patients
required_for_indications:
  - IND-MEN1-CARRIER-SURVEILLANCE
  - IND-MEN2-CARRIER-SURVEILLANCE
  - IND-VHL-CARRIER-SURVEILLANCE
  - IND-SDH-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-MEN1-SUSPICION-PREVENTION-ENHANCED-SURVEILLANCE
  - IND-MEN2-SUSPICION-PREVENTION-ENHANCED-SURVEILLANCE
  - IND-VHL-SUSPICION-PREVENTION-ENHANCED-SURVEILLANCE
required_for_diseases:
  - DIS-PHEOCHROMOCYTOMA
  - DIS-MTC
  - DIS-ADRENOCORTICAL-CARCINOMA
  - DIS-PARATHYROID-CARCINOMA
  - DIS-PITUITARY-ADENOMA
patient_facing_summary:
  ukrainian: >-
    Ендокринолог веде носіїв спадкових синдромів MEN1, MEN2 і VHL —
    щорічно перевіряє кальцій, гастрин, кальцитонін, метанефрини
    залежно від синдрому, призначає МРТ підшлункової / надниркових /
    гіпофіза за протоколом. У MEN2 ухвалює складне рішення про
    профілактичне видалення щитоподібної залози в дитячому віці —
    залежно від конкретної мутації RET. Координує замісну
    гормональну терапію після видалень, працює в одній команді з
    генетиком і онкохірургом.
  english: >-
    An endocrinologist follows carriers of inherited syndromes MEN1,
    MEN2 and VHL — running yearly calcium, gastrin, calcitonin, and
    metanephrine panels appropriate to each syndrome, and ordering
    pancreatic / adrenal / pituitary MRI on a protocol cadence. In
    MEN2 they make the difficult call on the timing of prophylactic
    thyroidectomy in childhood, based on the specific RET mutation.
    They coordinate hormone replacement after surgical removals, in
    one team with the geneticist and surgical oncologist.
sources:
  - SRC-ENDOCRINE-SOCIETY-MEN-2023
  - SRC-NCCN-NET-2025
  - SRC-NCCN-THYROID-2025
  - SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KSS §20. Pending Clinical Co-Lead sign-off per CHARTER §6.1.
  Some referenced IND-* (suspicion-prevention-enhanced-surveillance for
  MEN1 / MEN2 / VHL) may live alongside the genetic-counseling
  indications already cited; loader does not enforce IND-* refs in
  mdt_skills, but these IDs follow the project's IND-<syndrome>-
  SUSPICION-PREVENTION-ENHANCED-SURVEILLANCE naming convention.
