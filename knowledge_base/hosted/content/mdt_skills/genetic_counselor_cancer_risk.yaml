id: MDT-GENETIC-COUNSELOR-CANCER-RISK
role_id: genetic_counselor_cancer_risk
name: Генетичний консультант (онкогенетика)
names:
  preferred: Genetic counselor — cancer risk
  ukrainian: Генетичний консультант з оцінки онкогенетичного ризику
  english: Genetic counselor (cancer risk assessment)
version: 0.1.0
last_reviewed: '2026-05-18'
domain: hereditary_cancer_genetics
responsibilities:
  - Three-generation pedigree construction and ongoing pedigree maintenance
  - Pre-test counseling — risk model interpretation (BRCAPRO, Manchester,
    Tyrer-Cuzick, PREMM5), discussion of test scope (single-gene vs panel),
    benefits / limitations / VUS likelihood, GINA-style protections
  - Informed-consent capture and documentation per NSGC standards
  - Post-test counseling — disclosing positive, negative, and VUS results;
    psychological framing; managing uncertainty
  - Cascade-testing coordination — first-degree relative identification,
    family-letter drafting, proband-led outreach
  - Translation of variant classification (ClinVar / ACMG criteria) into
    actionable surveillance + risk-reducing pathways
  - Triage referral to clinical geneticist for syndromes outside HBOC /
    Lynch / FAP scope, and to psycho-oncology for high-distress carriers
required_for_indications:
  - IND-BRCA-HBOC-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-LYNCH-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-MEN1-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-MEN2-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-VHL-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-FAMMM-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-AT-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-WERNER-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-ROTHMUND-THOMSON-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-BHD-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-SDH-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-UNIVERSAL-FIRST-DEGREE-CANCER-FAMILY-PREVENTION-COUNSELING
  - IND-BRCA-CARRIER-SURVEILLANCE
  - IND-LYNCH-CARRIER-SURVEILLANCE
  - IND-FAMMM-CARRIER-SURVEILLANCE
  - IND-PEUTZ-JEGHERS-CARRIER-SURVEILLANCE
  - IND-COWDEN-CARRIER-SURVEILLANCE
  - IND-BAP1-CARRIER-SURVEILLANCE
required_for_diseases:
