  - DIS-OVARIAN
  - DIS-CRC
  - DIS-PDAC
  - DIS-MELANOMA
patient_facing_summary:
  ukrainian: >-
    Генетичний консультант оцінює родинний онкологічний анамнез,
    пояснює, що означає генетичне тестування, які гени перевіряються,
    і як інтерпретувати результат — особливо коли виявлено варіант
    невизначеного значення (VUS). Допомагає поінформовано вирішити,
    чи тестуватися, координує тестування родичів першого ступеня
    (каскадне тестування) і допомагає скласти план спостереження
    або профілактики, що базується на результаті.
  english: >-
    A genetic counselor reviews your family cancer history, explains
    what genetic testing measures, which genes are tested, and how to
    interpret the result — especially when a variant of uncertain
    significance (VUS) is found. They help you make an informed choice
    about testing, coordinate cascade testing of first-degree relatives,
    and translate the result into a personalized surveillance or
    risk-reduction plan.
sources:
  - SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
  - SRC-NCCN-GENETIC-FAMILIAL-CRC-2025
  - SRC-ASCO-ACMG-LYNCH-2014
  - SRC-EVANS-MANCHESTER-BRCA-2017
  - SRC-BERRY-BRCAPRO-1997
notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KNOWLEDGE_SCHEMA_SPECIFICATION §20. Pending Clinical Co-Lead
  sign-off per CHARTER §6.1. Distinct from MDT-CLINICAL-GENETICIST-RARE-SYNDROME
  — counselors run risk-assessment + cascade-testing workflow; geneticists
  make rare-syndrome diagnostic calls. Escalation: clinical geneticist for
  syndromes beyond HBOC/Lynch/FAP; psycho-oncology on high distress.
