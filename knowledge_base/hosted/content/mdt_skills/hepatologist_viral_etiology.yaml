id: MDT-HEPATOLOGIST-VIRAL-ETIOLOGY
role_id: hepatologist_viral_etiology
name: Гепатолог (вірусна етіологія — HBV / HCV / HCC)
names:
  preferred: Hepatologist — viral-etiology prevention
  ukrainian: Гепатолог із вірусних гепатитів та профілактики ГЦК
  english: Hepatologist (HBV / HCV antiviral prevention + HCC surveillance)
version: 0.1.0
last_reviewed: '2026-05-18'
domain: hepatology
responsibilities:
  - Chronic HBV management — entecavir / tenofovir initiation and lifelong
    monitoring, HBV-DNA suppression targets, prophylaxis ahead of
    immunosuppressive therapy (e.g., anti-CD20)
  - Chronic HCV management — direct-acting antiviral (DAA) regimen
    selection, SVR12 confirmation, post-cure HCC-surveillance enrolment
    for cirrhotic / advanced-fibrosis patients
  - HCC surveillance protocol owner — abdominal ultrasound ± AFP every
    6 months in cirrhosis + post-SVR12 cirrhotics, MRI / multiphasic CT
    when ultrasound is suboptimal (e.g., obesity, NASH cirrhosis)
  - HBV reactivation risk stratification before chemotherapy /
    immunosuppression — owns the prophylactic-antiviral call
  - HCV-driven extra-hepatic malignancy (HCV-MZL, NHL) referral pathway
    between hepatology and hematology
  - Coexisting NAFLD / NASH / alcohol-related liver disease lifestyle
    counseling — overlaps with WCRF/AICR primary-prevention guidance
required_for_indications:
  - IND-CHRONIC-HCV-PREVENTION-DAA
  - IND-CHRONIC-HCV-PREVENTION-OBSERVATION
  - IND-CHRONIC-HCV-HBV-COINFECTION-PREVENTION-COMBINATION-ANTIVIRAL
required_for_diseases:
  - DIS-HCC
  - DIS-HCV-MZL
  - DIS-DLBCL-NOS
patient_facing_summary:
  ukrainian: >-
    Гепатолог веде хронічні вірусні гепатити B і C — два з найбільших
    предотвратимих факторів раку печінки (ГЦК) та деяких лімфом. Призначає
    противірусну терапію (entecavir / tenofovir для HBV; DAA-схеми для
    HCV), підтверджує елімінацію HCV через 12 тижнів (SVR12), і запускає
    програму спостереження за ГЦК у пацієнтів з цирозом або стадією
    фіброзу F3-F4 — УЗД ± АФП кожні 6 місяців. Також координує
    профілактику реактивації HBV перед хімієтерапією.
  english: >-
    A hepatologist manages chronic hepatitis B and C — two of the largest
    preventable drivers of liver cancer (HCC) and several lymphomas.
    They prescribe antiviral therapy (entecavir / tenofovir for HBV;
    direct-acting antivirals for HCV), confirm HCV elimination at week
    12 (SVR12), and enroll patients with cirrhosis or F3-F4 fibrosis in
    HCC surveillance — ultrasound ± AFP every 6 months. They also
    coordinate HBV-reactivation prophylaxis before chemotherapy.
sources:
  - SRC-EASL-HBV-2025
  - SRC-EASL-HCV-2023
  - SRC-AASLD-HBV-2024
  - SRC-AASLD-HCC-2023
  - SRC-AASLD-IDSA-HCV-2023
  - SRC-NCCN-HCC-2025
notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KSS §20. Pending Clinical Co-Lead sign-off per CHARTER §6.1.
  Distinct from MDT-SKILL-INFECTIOUS-DISEASE-HEPATOLOGY (existing combined
  role covering broad HCV/HBV/HIV consults in treatment-time MDT). This
  prevention-axis role is specifically for chronic-viral-etiology
  long-term care + HCC surveillance + carrier-management workflows.
