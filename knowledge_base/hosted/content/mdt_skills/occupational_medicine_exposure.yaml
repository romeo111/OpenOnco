patient_facing_summary:
  ukrainian: >-
    Лікар з професійної медицини оцінює, з якими канцерогенами IARC
    Group 1 ви контактували на роботі — азбест, бензол, кремнієвий
    пил, дизельні вихлопи, радон, іонізуюче випромінювання та інші —
    і будує план посиленого спостереження за цільовими органами:
    наприклад, HRCT легень для азбесту, цитологія сечі для ароматичних
    амінів, аналіз крові для бензолу. Він також документує зв'язок
    діагноз-експозиція для випадків професійних захворювань і
    координується з сімейним лікарем і відповідними спеціалістами.
  english: >-
    An occupational medicine specialist assesses which IARC Group 1
    carcinogens you have been exposed to at work — asbestos, benzene,
    crystalline silica, diesel exhaust, radon, ionising radiation, and
    others — and builds a targeted-organ surveillance plan: HRCT for
    asbestos, urine cytology for aromatic amines, CBC for benzene, and
    so on. They also document the diagnosis-exposure link for
    occupational-disease claims and coordinate with the primary-care
    physician and relevant subspecialists.
