notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KSS §20. Pending Clinical Co-Lead sign-off per CHARTER §6.1.
  Aromatic-amines indication ID follows the project's
  `ind_occ_aromatic_amines_prevention_surveillance.yaml` filename;
  the IND ID file does not have a `-intensified-` segment unlike most
  occupational indications and resolves to
  IND-OCC-AROMATIC-AMINES-PREVENTION-SURVEILLANCE. Loader does not
  enforce IND-* refs on mdt_skills so this is informational rather than
  structural.
