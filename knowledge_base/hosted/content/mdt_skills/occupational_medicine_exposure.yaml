id: MDT-OCCUPATIONAL-MEDICINE-EXPOSURE
role_id: occupational_medicine_exposure
name: Лікар з професійної медицини (IARC Group 1 експозиції)
names:
  preferred: Occupational medicine specialist — IARC Group 1 exposure assessment
  ukrainian: Лікар з професійної медицини (експозиція до канцерогенів
    IARC Group 1, нагляд на робочому місці, експертиза з компенсації)
  english: Occupational medicine specialist (IARC-Group-1 exposure
    assessment, workplace surveillance, worker's compensation)
version: 0.1.0
last_reviewed: '2026-05-18'
domain: occupational_medicine
responsibilities:
  - Occupational-exposure history capture — job tasks, duration,
    co-exposures, PPE adequacy, latency since last exposure (cancers
    can manifest 10-40 years after exposure ends)
  - Quantitative exposure-reconstruction when records are weak —
    industrial-hygiene inference, job-exposure matrices, biomarker
    measurement where available (urinary cotinine, blood lead, etc.)
  - IARC-Group-1 carcinogen-specific surveillance protocols — asbestos
    (HRCT cadence), benzene (CBC + reticulocytes), aromatic amines
    (urine cytology + cystoscopy), silica (HRCT + spirometry), PAHs /
    diesel exhaust, hexavalent chromium, beryllium, cadmium, nickel,
    formaldehyde, ionizing radiation, vinyl chloride, mineral oils, soot
  - Smoking-cessation + dual-exposure risk amplification counseling
    (asbestos × tobacco, radon × tobacco multiplicative risk)
  - Worker's-compensation documentation — diagnosis-causation linkage
    statements per Ukrainian regulation + ILO occupational-disease list
  - Coordination with primary-care prevention navigator (universal
    occupational-exposure indication) and with the hematologist /
    pulmonologist / urologist receiving end-organ surveillance findings
  - Firefighter and painter cohort-specific surveillance (recently
    classified IARC Group 1 / 2A)
required_for_indications:
  - IND-OCC-ASBESTOS-PREVENTION-INTENSIFIED-SURVEILLANCE
