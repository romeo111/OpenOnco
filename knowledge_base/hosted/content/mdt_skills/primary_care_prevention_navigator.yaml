id: MDT-PRIMARY-CARE-PREVENTION-NAVIGATOR
role_id: primary_care_prevention_navigator
name: Сімейний лікар з онкопрофілактики (навігатор)
names:
  preferred: Primary care prevention navigator
  ukrainian: Сімейний лікар / терапевт з компетенцією з онкопрофілактики
  english: Primary-care physician with cancer-prevention expertise
version: 0.1.0
last_reviewed: '2026-05-18'
domain: preventive_oncology
responsibilities:
  - PCP-level cancer risk assessment — family-history intake (≥3-generation
    pedigree screen), lifestyle (tobacco, alcohol, BMI, physical activity,
    UV exposure), occupational / environmental exposure history
  - USPSTF / NCCN screening-cadence implementation across breast, cervical,
    colorectal, lung (LDCT), prostate (shared-decision), HCV, HBV, HIV,
    and skin
  - Vaccination owner for cancer-relevant prevention — HPV catch-up, HBV
    vaccination, S. pneumoniae / influenza in immunocompromised
  - Triage decision — when a patient with a positive family-history
    screen goes to MDT-GENETIC-COUNSELOR-CANCER-RISK vs stays in PCP-led
    intensified surveillance
  - Long-term follow-up of cancer survivors — late-effect monitoring,
    second-primary screening, lifestyle reinforcement
  - First-contact coordination with all other prevention-persona MDT
    skills (hepatologist for chronic HCV/HBV, dermatologist for hereditary
    skin syndromes, occupational medicine for IARC-Group-1 exposures)
required_for_indications:
  - IND-UNIVERSAL-FIRST-DEGREE-CANCER-FAMILY-PREVENTION-COUNSELING
  - IND-UNIVERSAL-AGE-50PLUS-PREVENTION-COMPREHENSIVE-CATCHUP
  - IND-UNIVERSAL-CURRENT-SMOKER-PREVENTION-CESSATION-LDCT
  - IND-UNIVERSAL-IMMUNOCOMPROMISED-PREVENTION-STRATIFIED-SCREENING
  - IND-UNIVERSAL-OCCUPATIONAL-EXPOSURE-PREVENTION-INTENSIFIED-SURVEILLANCE
  - IND-UNIVERSAL-PRIOR-CANCER-PREVENTION-SURVIVORSHIP-PROGRAM
  - IND-LIFESTYLE-TOBACCO-PREVENTION-CESSATION
  - IND-LIFESTYLE-UV-EXPOSURE-PREVENTION-PROTECTION
  - IND-CHRONIC-HCV-PREVENTION-OBSERVATION
  - IND-RADON-PREVENTION-MITIGATION-AND-SCREENING
required_for_diseases:
  - DIS-BREAST
  - DIS-CRC
  - DIS-HCC
  - DIS-MELANOMA
  - DIS-BCC
  - DIS-NSCLC
patient_facing_summary:
  ukrainian: >-
    Сімейний лікар з онкопрофілактики — ваш перший контакт у системі.
    Збирає родинний анамнез, оцінює спосіб життя і професійні впливи,
    призначає скринінги відповідно до віку та ризику (мамографія,
    колоноскопія, низькодозова КТ легень, тести на гепатити), вакцинує
    проти ВПЛ і гепатиту B, і направляє до спеціалізованих фахівців —
    генетика, гепатолога, дерматолога — коли це потрібно. Веде вас
    довгостроково, включно з періодом після завершення лікування.
  english: >-
    A prevention-oriented primary-care physician is your first point of
    contact. They take a family-history pedigree, review lifestyle and
    occupational exposures, run age- and risk-appropriate screening
    (mammography, colonoscopy, low-dose lung CT, hepatitis testing),
    vaccinate against HPV and HBV, and refer you to specialists
    (geneticist, hepatologist, dermatologist) when needed. They follow
    you long-term, including the survivorship period after treatment.
sources:
  - SRC-USPSTF-BREAST-2024
  - SRC-USPSTF-CRC-2021
  - SRC-USPSTF-LUNG-LDCT-2021
  - SRC-USPSTF-CERVICAL-2018
  - SRC-USPSTF-PROSTATE-2018
  - SRC-WCRF-AICR-CUP-2018
  - SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KSS §20. Pending Clinical Co-Lead sign-off per CHARTER §6.1.
  Distinct from MDT-SKILL-PRIMARY-CARE (existing role focused on
  comorbidity management + post-treatment follow-up). This new role
  adds the prevention / risk-assessment / screening-implementation
  axis and is the default first-touch role for the prevention persona.
