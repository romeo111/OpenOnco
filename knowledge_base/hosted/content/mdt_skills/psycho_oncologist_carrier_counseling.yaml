id: MDT-PSYCHO-ONCOLOGIST-CARRIER-COUNSELING
role_id: psycho_oncologist_carrier_counseling
name: Психоонколог (носії спадкових мутацій + сім'ї)
names:
  preferred: Psycho-oncologist — germline carrier + cascade-family support
  ukrainian: Психоонколог зі спадкових онкосиндромів і каскадного тестування
  english: Psycho-oncology support for confirmed germline carriers and
    cascade-testing families
version: 0.1.0
last_reviewed: '2026-05-18'
domain: psychosocial
responsibilities:
  - Pre / post-test psychological assessment for genetic-test candidates —
    baseline distress, coping resources, prior trauma, family dynamics
  - Distress screening (NCCN Distress Thermometer, HADS) for confirmed
    germline carriers at key intervals — result-disclosure, decision-point
    for risk-reducing surgery, surveillance milestones
  - Decisional-conflict counseling for risk-reducing surgery (RRM /
    RRSO in BRCA, prophylactic thyroidectomy in MEN2, total colectomy
    in FAP) — option-grids, values clarification
  - Cascade-testing family-systems work — survivor-guilt in negative
    relatives, "carrier-identity" formation in positives, dynamics
    when results split a sibship
  - Pediatric / adolescent counseling pathway when CMMRD, Li-Fraumeni,
    Fanconi, RTS or AT children are tested
  - Coordination with oncology psychiatry / pharmacotherapy when distress
    escalates beyond psychological-intervention scope
  - Long-term survivorship psychological care — fear-of-recurrence,
    body-image post-prophylactic surgery, fertility-related grief
required_for_indications:
  - IND-BRCA-CARRIER-SURVEILLANCE
  - IND-LYNCH-CARRIER-SURVEILLANCE
  - IND-MEN1-CARRIER-SURVEILLANCE
  - IND-MEN2-CARRIER-SURVEILLANCE
  - IND-VHL-CARRIER-SURVEILLANCE
  - IND-FAMMM-CARRIER-SURVEILLANCE
  - IND-PEUTZ-JEGHERS-CARRIER-SURVEILLANCE
  - IND-COWDEN-CARRIER-SURVEILLANCE
  - IND-BAP1-CARRIER-SURVEILLANCE
  - IND-BRCA-HBOC-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-LYNCH-SUSPICION-PREVENTION-GENETIC-COUNSELING
  - IND-UNIVERSAL-PRIOR-CANCER-PREVENTION-SURVIVORSHIP-PROGRAM
required_for_diseases:
  - DIS-BREAST
  - DIS-OVARIAN
  - DIS-CRC
  - DIS-PHEOCHROMOCYTOMA
  - DIS-MTC
patient_facing_summary:
  ukrainian: >-
    Психоонколог супроводжує людей з підтвердженою спадковою мутацією
    та їхні родини. Зустріч з ним рекомендується перед і після
    генетичного тестування, у момент розкриття результату, перед
    рішенням про профілактичну операцію (наприклад, мастектомію або
    тиреоїдектомію), а також у разі стресу, страху перед скринінгом
    або вини перед родичами. Працює з усією родиною — і з носіями,
    і з тими, кого результат не торкнувся.
  english: >-
    A psycho-oncologist supports people with confirmed inherited
    mutations and their families. Meetings are recommended before and
    after genetic testing, at result disclosure, before deciding on
    risk-reducing surgery (e.g. mastectomy, thyroidectomy), and any
    time distress, screening fear, or family guilt emerges. They work
    with the whole family — both carriers and relatives whose result
    came back negative — through the cascade-testing process.
sources:
  - SRC-NCCN-GENETIC-FAMILIAL-BREAST-OVARIAN-2025
  - SRC-NCCN-GENETIC-FAMILIAL-CRC-2025
  - SRC-ASCO-ACMG-LYNCH-2014
notes: >-
  STUB — prevention-persona role authored 2026-05-18 from CHARTER §3
  amendment + KSS §20. Pending Clinical Co-Lead sign-off per CHARTER §6.1.
  Distinct from MDT-SKILL-PSYCHOLOGIST (existing generic psychosocial
  role focused on treatment-time distress / anxiety / decision support).
  This carrier-counseling axis is specific to germline-mutation
  identification and cascade-testing family-systems work.
