id: MON-ABVD-REGIMEN
linked_to_regimen: REG-ABVD
phases:
- name: baseline
  window: Before starting ABVD
  window_ua: До початку ABVD
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-HBV-SEROLOGY
  - TEST-ECHO
  checkpoints:
  - Assess cardiac function before anthracycline treatment with ECHO or an appropriate
    alternative and ECG; tailor subsequent monitoring to risk and symptoms.
  - Check renal function and electrolytes, including calcium, magnesium and phosphate,
    and liver function; a CMP alone may not contain every required analyte.
  - HBV screening includes HBsAg, anti-HBc and anti-HBs; prophylaxis follows individual
    risk and institutional policy.
  - 'Assess pulmonary risk and select baseline PFT/DLCO according to the applicable
    protocol: eviQ recommends baseline assessment; BSH recommends selective testing
    when further decline could be clinically important. Do not require routine serial
    PFTs for every patient.'
  - Discuss fertility preservation and pregnancy assessment where applicable before
    treatment.
  checkpoints_ua:
  - Оцініть функцію серця перед антрациклінами за допомогою ЕхоКГ або належної альтернативи
    та ЕКГ; подальший моніторинг залежить від ризику й симптомів.
  - Перевірте функцію нирок, електроліти, зокрема кальцій, магній і фосфат, та функцію
    печінки; біохімічна панель CMP може не містити всіх потрібних показників.
  - Скринінг HBV включає HBsAg, anti-HBc та anti-HBs; профілактика залежить від індивідуального
    ризику й локальної політики.
  - 'Оцініть легеневий ризик і визначте потребу в базовому PFT/DLCO за застосовним
    протоколом: eviQ рекомендує базове обстеження, BSH — вибіркове, коли подальше
    погіршення може бути клінічно важливим. Не встановлюйте рутинні серійні PFT для
    всіх пацієнтів.'
  - До лікування обговоріть збереження фертильності й оцінку вагітності, коли це застосовно.
- name: on_treatment
  window: Before each administration on days 1 and 15 of the 28-day cycle, or as clinically
    indicated
  window_ua: Перед кожним введенням у дні 1 і 15 28-денного циклу або за клінічними
    показаннями
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - Assess symptoms, infection, renal function, electrolytes and liver tests; fever
    or suspected infection needs immediate clinical assessment.
  - Do not import R-CHOP ANC or platelet delay thresholds into ABVD. eviQ emphasizes
    maintaining schedule despite isolated blood-count abnormalities; treatment decisions
    require clinical review, especially with infection or other toxicity. G-CSF is
    not routinely required.
  - Assess neuropathy before each treatment; clinically significant neuropathy requires
    review of vinblastine, not vincristine.
  - Check cumulative bleomycin exposure before each treatment. New cough or dyspnoea
    requires prompt assessment for pulmonary toxicity and alternative causes; dedicated
    chest CT is indicated when toxicity is suspected.
  checkpoints_ua:
  - Оцініть симптоми, інфекцію, функцію нирок, електроліти та печінкові показники;
    лихоманка або підозра на інфекцію потребує негайної клінічної оцінки.
  - Не переносіть пороги відстрочки за ANC або тромбоцитами з R-CHOP на ABVD. eviQ
    наголошує на збереженні розкладу при ізольованих змінах показників крові; рішення
    потребує клінічної оцінки, особливо за інфекції або іншої токсичності. G-CSF не
    потрібний рутинно.
  - Оцініть нейропатію перед кожним введенням; клінічно значуща нейропатія потребує
    перегляду вінбластину, а не вінкристину.
  - Перевірте сумарну експозицію блеоміцину перед кожним введенням. Новий кашель або
    задишка потребує швидкої оцінки щодо легеневої токсичності та інших причин; при
    підозрі на токсичність показана КТ грудної клітки.
- name: interim_response_assessment
  window: After 2 ABVD cycles when using an interim PET-adapted Hodgkin protocol
  window_ua: Після 2 циклів ABVD при застосуванні протоколу лімфоми Ходжкіна з адаптацією
    за проміжною PET
  tests:
  - TEST-PET-CT
  checkpoints:
  - Review interim PET response with the treating team. In advanced-stage treatment
    planned for 6 cycles, BSH recommends omitting bleomycin after complete metabolic
    response following 2 cycles in patients under 60; do not apply this automatically
    to early-stage or pediatric protocols.
  checkpoints_ua:
  - Оцініть проміжну PET-відповідь із клінічною командою. При поширеній хворобі й
    запланованих 6 циклах BSH рекомендує відмову від блеоміцину після повної метаболічної
    відповіді за 2 цикли у пацієнтів молодших за 60 років; не застосовуйте це автоматично
    до ранніх стадій або педіатричних протоколів.
- name: end_of_treatment
  window: After completion of the prescribed course; cardiac follow-up according to
    risk
  window_ua: Після завершення призначеного курсу; кардіологічне спостереження відповідно
    до ризику
  tests: []
  checkpoints:
  - Arrange post-anthracycline cardiac monitoring according to risk. eviQ recommends
    ECHO within 12 months in all adults, with earlier monitoring for high-risk patients;
    this is not a fixed six-cycle treatment rule.
  checkpoints_ua:
  - Плануйте кардіологічне спостереження після антрациклінів відповідно до ризику.
    eviQ рекомендує ЕхоКГ протягом 12 місяців для всіх дорослих, із ранішим контролем
    при високому ризику; це не правило фіксованих шести циклів лікування.
sources:
