last_reviewed: null
review_status: pending_clinical_signoff
machine_translated_review_pending: true
notes: Regimen-specific monitoring draft for ABVD; not a staging, biopsy, complete
  survivorship or pediatric treatment protocol. No CD20/DLBCL, IPI, anti-CD20, vincristine
  or 21-day R-CHOP schedule is inherited. ECHO, pulmonary testing and laboratory content
  must be interpreted with clinical context and source protocols. PFT/DLCO is conditional
  and therefore not an unconditional tests-list item. Ukrainian text drafted 2026-10-12;
  pending clinical signoff.
