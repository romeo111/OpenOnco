id: MON-CHP-BV-REGIMEN
linked_to_regimen: REG-CHP-BV
phases:
- name: baseline
  window: Before starting BV-CHP
  window_ua: До початку BV-CHP
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-HBV-SEROLOGY
  - TEST-ECHO
  checkpoints:
  - Assess cardiac function before anthracycline treatment with ECHO or an appropriate
    alternative and ECG; tailor subsequent monitoring to risk and symptoms.
  - Check renal function, electrolytes, liver tests, LDH and blood glucose at baseline;
    tailor repeat testing to clinical circumstances. A CMP alone may not contain every
    required analyte.
  - HBV screening includes HBsAg, anti-HBc and anti-HBs; prophylaxis follows individual
    risk and institutional policy.
  - Discuss fertility preservation and pregnancy assessment where applicable before
    treatment.
  checkpoints_ua:
  - Оцініть функцію серця перед антрациклінами за допомогою ЕхоКГ або належної альтернативи
    та ЕКГ; подальший моніторинг залежить від ризику й симптомів.
  - До початку перевірте функцію нирок, електроліти, печінкові показники, LDH та глюкозу
    крові; повторні перевірки залежать від клінічного стану. CMP може не містити всіх
    потрібних показників.
  - Скринінг HBV включає HBsAg, anti-HBc та anti-HBs; профілактика залежить від індивідуального
    ризику й локальної політики.
  - До лікування обговоріть збереження фертильності й оцінку вагітності, коли це застосовно.
- name: on_treatment
  window: Before each 21-day cycle and prior to administrations as clinically indicated
  window_ua: Перед кожним 21-денним циклом і перед введеннями за клінічними показаннями
  tests:
  - TEST-CBC
  checkpoints:
  - Review blood counts and clinical status before treatment. eviQ 4038 delays treatment
    for ANC <1.0 × 10^9/L until recovery; for platelets <75 × 10^9/L dose modification
    is not generally indicated, but delay may be considered. Do not replace this with
    automatic R-CHOP thresholds.
  - Assess peripheral neuropathy before each treatment and review brentuximab vedotin
    if clinically significant toxicity occurs; vincristine is not a component of BV-CHP.
  - For adults with previously untreated PTCL receiving ADCETRIS+CHP, the US label
    requires primary G-CSF prophylaxis beginning with Cycle 1. eviQ 4038 describes
    clinician-discretion support and adding G-CSF after ANC-related delay; preserve
    this source difference and confirm the applicable label/local protocol. Fever
    or suspected infection still needs urgent assessment.
  checkpoints_ua:
  - Перед лікуванням оцініть показники крові та клінічний стан. eviQ 4038 передбачає
    відстрочку при ANC <1,0 × 10^9/л до відновлення; при тромбоцитах <75 × 10^9/л
    модифікація дози загалом не показана, але відстрочку можуть розглянути. Не замінюйте
    це автоматичними порогами R-CHOP.
  - Оцініть периферичну нейропатію перед кожним введенням і перегляньте брентуксимаб
    ведотин при клінічно значущій токсичності; вінкристин не входить до BV-CHP.
  - Для дорослих із раніше нелікованою PTCL на ADCETRIS+CHP US-інструкція передбачає
    первинну профілактику G-CSF від першого циклу. eviQ 4038 описує підтримку на розсуд
    лікаря та додавання G-CSF після відстрочки через ANC; зберігайте цю відмінність
    джерел і звіряйте застосовну інструкцію та локальний протокол. Лихоманка або підозра
    на інфекцію все одно потребує термінової оцінки.
- name: end_of_treatment
  window: After completion of the prescribed course; cardiac follow-up according to
    risk
  window_ua: Після завершення призначеного курсу; кардіологічне спостереження відповідно
    до ризику
  tests: []
  checkpoints:
  - Arrange post-anthracycline cardiac monitoring according to risk. eviQ recommends
    ECHO within 12 months in all adults, with earlier monitoring for high-risk patients;
    this is not a fixed six-cycle treatment rule.
  checkpoints_ua:
  - Плануйте кардіологічне спостереження після антрациклінів відповідно до ризику.
    eviQ рекомендує ЕхоКГ протягом 12 місяців для всіх дорослих, із ранішим контролем
    при високому ризику; це не правило фіксованих шести циклів лікування.
sources:
- SRC-EVIQ-BV-CHP-4038
- SRC-ADCETRIS-US-LABEL
last_reviewed: null
review_status: pending_clinical_signoff
machine_translated_review_pending: true
notes: Regimen-specific monitoring draft based on eviQ 4038 treatment timing and monitoring
  sections. Not a histological diagnosis, staging, transplant, complete survivorship,
  individualized dosing or pediatric protocol. No CD20-positive DLBCL, double-hit,
  IPI, CNS-IPI or anti-CD20-specific requirements are inherited. Other source protocols
  and local policy may differ. Ukrainian text pending clinical signoff.
