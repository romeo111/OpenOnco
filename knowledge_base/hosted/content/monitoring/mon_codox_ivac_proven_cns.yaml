id: MON-CODOX-IVAC-PROVEN-CNS
name: eviQ proven-CNS CODOX-M / IVAC reference monitoring
linked_to_regimen: REG-CODOX-IVAC-PROVEN-CNS
phases:
- name: baseline
  window: Before specialist review of explicitly selected proven-CNS reference
  window_ua: Перед перевіркою спеціалістом явно обраного довідкового протоколу для доведеного ураження
    ЦНС
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-ECHO
  checkpoints:
  - Confirm high-risk Burkitt, proven CNS status and the selected eviQ variant. Independently assess clinical
    eligibility, organ function and immune/HIV context; variant selection is not clinical approval.
  - Confirm central venous access, tumour-lysis prevention and protocol infection prophylaxis; review
    hepatitis B status and anti-CD20 precautions.
  checkpoints_ua:
  - Підтвердьте високий ризик Беркіта, доведене ураження ЦНС та обраний варіант eviQ. Окремо оцініть клінічну
    придатність, функцію органів та імунний стан/ВІЛ; вибір варіанта не є клінічним погодженням.
  - Перевірте центральний венозний доступ, профілактику лізису пухлини й інфекцій за протоколом; оцініть
    статус гепатиту B та застереження для anti-CD20.
- name: on_treatment
  window: 'CODOX-M blocks: IV methotrexate day 10 and clearance/rescue period'
  window_ua: 'Блоки CODOX-M: внутрішньовенний метотрексат дня 10 та період виведення/порятунку'
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - Before IV methotrexate, verify hydration and alkalinization with urine pH >7. Monitor kidney function
    before, during and after treatment, urine pH and fluid input/output; review interacting medicines
    and third-space fluid.
  - Document the START of IV methotrexate. Confirm IV folinate rescue from hour 36, every 3 hours through
    hour 48, then every 6 hours until methotrexate <0.1 micromol/L. Check methotrexate levels every 24
    hours until clearance; delayed clearance or acute kidney injury needs urgent specialist rescue review.
  - Review neuropathy and mucositis. Keep intrathecal cytarabine and methotrexate separate from IV administration;
    NEVER administer vincristine intrathecally. Oral folinate 24 hours after IT methotrexate has a separate
    clock from IV rescue.
  - Verify the CNS-specific IT calendar and separate IV/IT procedures before every administration; urgently
    assess new or worsening neurological symptoms. Do not mix alternative trial schedules.
  checkpoints_ua:
  - Перед внутрішньовенним метотрексатом перевірте гідратацію й алкалінізацію при pH сечі >7. Контролюйте
    функцію нирок до, під час і після лікування, pH сечі та баланс рідини; перегляньте взаємодії й рідину
    в третіх просторах.
  - Задокументуйте ПОЧАТОК внутрішньовенного метотрексату. Перевірте внутрішньовенний фолінат від години
    36, кожні 3 години до години 48, далі кожні 6 годин до метотрексату <0.1 мікромоль/л. Вимірюйте рівень
    метотрексату кожні 24 години до виведення; затримка виведення чи гостре ураження нирок потребує термінового
    перегляду порятунку спеціалістом.
  - Оцініть нейропатію та мукозит. Інтратекальні цитарабін і метотрексат вводять окремо від внутрішньовенних
    препаратів; вінкристин НІКОЛИ не вводять інтратекально. Пероральний фолінат через 24 години після
    IT-метотрексату має окремий відлік від внутрішньовенного порятунку.
  - Перед кожним введенням перевірте спеціальний IT-календар для ЦНС та окремі процедури IV/IT; терміново
    оцініть нові чи прогресуючі неврологічні симптоми. Не змішуйте альтернативні календарі досліджень.
- name: on_treatment
  window: 'IVAC blocks: before every ifosfamide and high-dose cytarabine dose'
  window_ua: 'Блоки IVAC: перед кожною дозою іфосфаміду й високодозового цитарабіну'
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - Assess neurological function before each ifosfamide dose; new confusion or neurological change requires
    immediate medical review. Confirm mesna and hydration throughout ifosfamide treatment under the institutional
    uroprotection protocol; assess urinary symptoms and fluid status.
  - Assess cerebellar function before each high-dose cytarabine dose; kidney dysfunction increases neurotoxicity
    risk. Confirm corticosteroid eye drops from the first dose until at least 72 hours after the final
    dose.
  checkpoints_ua:
  - Оцініть неврологічний стан перед кожною дозою іфосфаміду; нова сплутаність чи неврологічні зміни потребують
    негайного лікарського огляду. Перевірте месну й гідратацію протягом іфосфаміду за протоколом уропротекції
    закладу; оцініть сечові симптоми та рідинний баланс.
  - Оцініть функцію мозочка перед кожною дозою високодозового цитарабіну; порушення функції нирок підвищує
    ризик нейротоксичності. Перевірте кортикостероїдні очні краплі від першої дози до щонайменше 72 годин
    після останньої.
- name: on_treatment
  window: 'Between blocks: nadir, infection and count recovery review'
  window_ua: 'Між блоками: оцінка надіру, інфекції та відновлення показників крові'
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - 'Confirm block-specific filgrastim: CODOX-M from day 13; IVAC from day 7, continuing until recovery.
    Fever or suspected infection requires urgent assessment despite prophylaxis.'
  - The reference requires at least 21 days between blocks and unsupported ANC >1.0 x10^9/L and platelets
    >75 x10^9/L before the next block; toxicity, organ function and specialist review can require further
    delay or modification.
  checkpoints_ua:
  - 'Перевірте філграстим відповідно до блоку: CODOX-M від дня 13; IVAC від дня 7 до відновлення. Лихоманка
    чи підозра на інфекцію потребує термінової оцінки попри профілактику.'
  - Довідковий протокол вимагає щонайменше 21 день між блоками та ANC >1.0 x10^9/л і тромбоцити >75 x10^9/л
    без підтримки перед наступним блоком; токсичність, функція органів та оцінка спеціаліста можуть вимагати
    додаткової затримки чи зміни.
