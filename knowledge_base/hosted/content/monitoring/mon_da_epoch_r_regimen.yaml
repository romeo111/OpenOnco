id: MON-DA-EPOCH-R-REGIMEN
linked_to_regimen: REG-DA-EPOCH-R
phases:
- name: baseline
  window: Before starting DA-EPOCH-R
  window_ua: До початку DA-EPOCH-R
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-HBV-SEROLOGY
  - TEST-ECHO
  checkpoints:
  - Assess cardiac function, renal/liver function, blood glucose, infection and HBV
    prophylaxis before therapy.
  - Arrange central venous access and a protocol-compatible infusion setup, tumour-lysis
    prophylaxis, PJP prophylaxis and growth-factor support.
  checkpoints_ua:
  - До лікування оцініть функцію серця, нирок і печінки, глюкозу, інфекцію та профілактику
    HBV.
  - Організуйте центральний венозний доступ і сумісну з протоколом інфузійну систему,
    профілактику лізису пухлини, PJP та підтримку факторами росту.
- name: on_treatment
  window: Days 1-4 continuous infusion (96 hours), day 5 cyclophosphamide; assessment
    before each treatment
  window_ua: Безперервна інфузія у дні 1–4 (96 годин), циклофосфамід у день 5; оцінка
    перед кожним введенням
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - Review infusion delivery, line/pump function and adverse events. Assess neuropathy
    from vincristine, cardiac symptoms, fluid status, blood glucose and tumour-lysis
    risk.
  - Confirm protocol-scheduled filgrastim from day 6 until neutrophil recovery. Fever
    or suspected infection requires urgent clinical assessment despite prophylaxis.
  checkpoints_ua:
  - Перевірте інфузію, доступ та інфузомат і небажані явища. Оцініть нейропатію від
    вінкристину, серцеві симптоми, рідинний баланс, глюкозу та ризик лізису пухлини.
  - Перевірте передбачений протоколом філграстим від дня 6 до відновлення нейтрофілів.
    Лихоманка або підозра на інфекцію потребує термінової клінічної оцінки попри профілактику.
- name: on_treatment
  window: 'During every cycle: CBC twice weekly, three days apart, for the next dose-level
    decision'
  window_ua: 'Під час кожного циклу: загальний аналіз крові двічі на тиждень із проміжком
    три дні для вибору наступного рівня дози'
  tests:
  - TEST-CBC
  checkpoints:
  - Record all scheduled ANC measurements and platelet nadir, plus the previous dose
    level; do not escalate with incomplete data. Additional clinically indicated CBCs
    do not substitute for the scheduled nadir series.
  - Apply the DA-EPOCH-specific nadir table with clinical review, including the distinction
    between one/two versus three/more low ANC measurements and the platelet rule.
    Do not inherit generic R-CHOP dose or diagnostic checkpoints.
  checkpoints_ua:
  - Зафіксуйте всі планові виміри ANC, надир тромбоцитів і попередній рівень дози;
    не підвищуйте рівень за неповних даних. Додаткові аналізи за клінічними показаннями
    не замінюють планову серію для надиру.
  - Після клінічної оцінки застосуйте таблицю надиру DA-EPOCH, розрізняючи один-два
    та три чи більше низьких вимірів ANC і враховуючи правило для тромбоцитів. Не
    переносіть загальні дозові або діагностичні перевірки R-CHOP.
- name: on_treatment
  window: Before the next cycle, normally day 21, subject to recovery and protocol
    review
  window_ua: Перед наступним циклом, зазвичай у день 21, за умови відновлення та перевірки
    протоколу
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - eviQ starts the next cycle when ANC is at least 1.0 × 10^9/L and platelets at
    least 100 × 10^9/L. Otherwise review recovery, delay and dose-level selection
    according to the complete protocol; this table does not automatically authorize
    treatment.
  checkpoints_ua:
  - eviQ починає наступний цикл при ANC щонайменше 1,0 × 10^9/л і тромбоцитах щонайменше
    100 × 10^9/л. Інакше оцініть відновлення, відстрочку й рівень дози за повним протоколом;
    таблиця не надає автоматичного дозволу на лікування.
sources:
- SRC-EVIQ-DA-R-EPOCH-783
last_reviewed: null
review_status: pending_clinical_signoff
machine_translated_review_pending: true
notes: DA-EPOCH-R monitoring draft, not an automatic dose calculator. Disease staging,
  response-adapted cycles and CNS treatment require separate protocols. Ukrainian
  text pending clinical signoff.
