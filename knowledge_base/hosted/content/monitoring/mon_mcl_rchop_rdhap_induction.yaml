id: MON-MCL-RCHOP-RDHAP-INDUCTION
linked_to_regimen: REG-MCL-INTENSIVE-RDHAP-AUTOSCT
phases:
- name: baseline
  window: Before alternating induction
  window_ua: До початку чергування індукційних блоків
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-HBV-SEROLOGY
  - TEST-ECHO
  - TEST-ECG
  checkpoints:
  - Assess cardiac function before anthracycline-containing R-CHOP and plan risk-adapted
    monitoring.
  - Check renal function, electrolytes including calcium, magnesium and phosphate,
    liver tests and blood glucose. CMP may not contain every required analyte.
  - Screen HBV with HBsAg, anti-HBc and anti-HBs and arrange prophylaxis according
    to applicable anti-CD20 guidance and local policy.
  checkpoints_ua:
  - Оцініть функцію серця перед антрацикліновмісним R-CHOP і заплануйте моніторинг
    відповідно до ризику.
  - Перевірте функцію нирок, електроліти, зокрема кальцій, магній і фосфат, печінкові
    показники та глюкозу. CMP може не містити всіх потрібних показників.
  - Проведіть скринінг HBV за HBsAg, anti-HBc та anti-HBs і визначте профілактику
    за застосовними рекомендаціями для anti-CD20 та локальним протоколом.
- name: on_treatment_rchop
  window: 'R-CHOP cycles 1, 3, 5: before treatment and as clinically indicated'
  window_ua: 'Цикли R-CHOP 1, 3, 5: перед лікуванням і за клінічними показаннями'
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - Assess neuropathy before each treatment and review vincristine for clinically
    significant toxicity; monitor blood glucose during corticosteroids.
  - Review infection, blood counts, cardiac symptoms and cumulative anthracycline
    exposure; use the applicable MCL protocol rather than DLBCL diagnostic checkpoints.
  checkpoints_ua:
  - Оцініть нейропатію перед кожним введенням і перегляньте вінкристин при клінічно
    значущій токсичності; контролюйте глюкозу під час кортикостероїдів.
  - Оцініть інфекцію, показники крові, серцеві симптоми й сумарну експозицію антрациклінів;
    застосовуйте протокол MCL, а не діагностичні перевірки DLBCL.
- name: on_treatment_rdhap
  window: 'R-DHAP cycles 2, 4, 6: before treatment and before each cytarabine dose'
  window_ua: 'Цикли R-DHAP 2, 4, 6: перед лікуванням і перед кожною дозою цитарабіну'
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - Assess kidney function and electrolytes before cisplatin; confirm individualized
    hydration and fluid-status assessment. Kidney dysfunction requires review of both
    cisplatin and cytarabine.
  - Assess cerebellar function before every high-dose cytarabine dose; kidney dysfunction
    increases neurotoxicity risk. New neurological symptoms require urgent clinical
    assessment before further dosing.
  - Confirm corticosteroid eye drops starting with the first cytarabine dose and continuing
    for at least 72 hours after the final dose, according to the protocol.
  - Monitor tinnitus or hearing change; arrange audiometry if symptoms develop. Review
    neuropathy, blood glucose and infection; fever or suspected infection needs urgent
    clinical assessment.
  checkpoints_ua:
  - Оцініть функцію нирок та електроліти перед цисплатином; перевірте індивідуальний
    план гідратації та стан рідинного балансу. Порушення функції нирок потребує перегляду
    і цисплатину, і цитарабіну.
  - Оцініть функцію мозочка перед кожною дозою високодозового цитарабіну; порушення
    функції нирок підвищує ризик нейротоксичності. Нові неврологічні симптоми потребують
    термінової клінічної оцінки перед подальшим введенням.
  - Перевірте кортикостероїдні очні краплі від першої дози цитарабіну до щонайменше
    72 годин після останньої дози за протоколом.
  - Контролюйте шум у вухах або зміну слуху; при симптомах організуйте аудіометрію.
    Оцініть нейропатію, глюкозу та інфекцію; лихоманка або підозра на інфекцію потребує
    термінової клінічної оцінки.
- name: pre_consolidation_assessment
  window: After induction, before any transplant conditioning
  window_ua: Після індукції, перед будь-яким кондиціонуванням до трансплантації
  tests: []
  checkpoints:
  - Refer to the transplant-specific protocol for conditioning, mobilization, eligibility
    and subsequent surveillance. This induction schedule does not specify these steps
    or a fixed maintenance regimen.
  checkpoints_ua:
  - Застосуйте окремий трансплантаційний протокол для кондиціонування, мобілізації,
    придатності та подальшого спостереження. Цей індукційний розклад не визначає ці
    етапи чи фіксовану підтримувальну схему.
