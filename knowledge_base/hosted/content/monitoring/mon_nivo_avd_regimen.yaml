id: MON-NIVO-AVD-REGIMEN
linked_to_regimen: REG-NIVO-AVD
phases:
- name: baseline
  window: Before starting N+AVD
  window_ua: До початку N+AVD
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  - TEST-HBV-SEROLOGY
  - TEST-ECHO
  - TEST-TSH
  - TEST-CORTISOL-MORNING
  checkpoints:
  - Assess cardiac function before anthracycline treatment with ECHO or an appropriate
    alternative and ECG; tailor subsequent monitoring to risk and symptoms.
  - Check renal function and electrolytes, including calcium, magnesium and phosphate,
    and liver function; a CMP alone may not contain every required analyte.
  - HBV screening includes HBsAg, anti-HBc and anti-HBs; prophylaxis follows individual
    risk and institutional policy.
  - Discuss fertility preservation and pregnancy assessment where applicable before
    treatment.
  - Check blood glucose, thyroid function including free T4 and serum cortisol at
    baseline; assess hepatitis and HIV history. TSH alone is not a complete thyroid
    panel.
  checkpoints_ua:
  - Оцініть функцію серця перед антрациклінами за допомогою ЕхоКГ або належної альтернативи
    та ЕКГ; подальший моніторинг залежить від ризику й симптомів.
  - Перевірте функцію нирок, електроліти, зокрема кальцій, магній і фосфат, та функцію
    печінки; біохімічна панель CMP може не містити всіх потрібних показників.
  - Скринінг HBV включає HBsAg, anti-HBc та anti-HBs; профілактика залежить від індивідуального
    ризику й локальної політики.
  - До лікування обговоріть збереження фертильності й оцінку вагітності, коли це застосовно.
  - До початку перевірте глюкозу крові, функцію щитоподібної залози, зокрема вільний
    T4, та кортизол; оцініть анамнез гепатитів і ВІЛ. Лише TSH не є повною тиреоїдною
    панеллю.
- name: on_treatment
  window: Before each administration on days 1 and 15 of the 28-day cycle, or as clinically
    indicated
  window_ua: Перед кожним введенням у дні 1 і 15 28-денного циклу або за клінічними
    показаннями
  tests:
  - TEST-CBC
  - TEST-CMP
  - TEST-LFT
  - TEST-LDH
  checkpoints:
  - Assess symptoms, infection, renal function, electrolytes and liver tests; fever
    or suspected infection needs immediate clinical assessment.
  - Check blood glucose before each treatment; monitor thyroid function every 4-6
    weeks during treatment and every 12 weeks after completion as indicated. Consider
    cortisol monitoring at the same intervals; adapt to symptoms and institutional
    policy.
  - Assess neuropathy from vinblastine and symptoms of immune-related toxicity before
    each treatment. New cough, dyspnoea, diarrhoea, rash, jaundice, marked weakness
    or cardiac symptoms need prompt clinical review; immune-related events can occur
    after treatment ends.
  - Select growth-factor support according to clinical indication and febrile-neutropenia
    risk; do not inherit an ABVD bleomycin-related restriction or automatic R-CHOP
    count threshold.
  checkpoints_ua:
  - Оцініть симптоми, інфекцію, функцію нирок, електроліти та печінкові показники;
    лихоманка або підозра на інфекцію потребує негайної клінічної оцінки.
  - Перевіряйте глюкозу крові перед кожним введенням; функцію щитоподібної залози
    — кожні 4–6 тижнів під час лікування та кожні 12 тижнів після завершення за показаннями.
    Розгляньте контроль кортизолу з такими самими інтервалами; адаптуйте до симптомів
    і локального протоколу.
  - Перед кожним введенням оцініть нейропатію від вінбластину та симптоми імуноопосередкованої
    токсичності. Новий кашель, задишка, діарея, висип, жовтяниця, виражена слабкість
    або серцеві симптоми потребують швидкої клінічної оцінки; імуноопосередковані
    явища можливі й після завершення лікування.
  - Обирайте підтримку факторами росту відповідно до клінічних показань і ризику фебрильної
    нейтропенії; не переносіть обмеження ABVD, пов’язані з блеоміцином, або автоматичні
    пороги показників крові з R-CHOP.
- name: end_of_treatment
  window: After completion of the prescribed course; cardiac follow-up according to
    risk
  window_ua: Після завершення призначеного курсу; кардіологічне спостереження відповідно
    до ризику
  tests: []
  checkpoints:
  - Arrange post-anthracycline cardiac monitoring according to risk. eviQ recommends
    ECHO within 12 months in all adults, with earlier monitoring for high-risk patients;
    this is not a fixed six-cycle treatment rule.
  checkpoints_ua:
  - Плануйте кардіологічне спостереження після антрациклінів відповідно до ризику.
    eviQ рекомендує ЕхоКГ протягом 12 місяців для всіх дорослих, із ранішим контролем
    при високому ризику; це не правило фіксованих шести циклів лікування.
sources:
- SRC-EVIQ-N-AVD-5035
last_reviewed: null
review_status: pending_clinical_signoff
machine_translated_review_pending: true
notes: Regimen-specific monitoring draft based on eviQ 5035 N-AVD monitoring sections.
  Not a staging, complete survivorship, individualized dose or pediatric treatment
  protocol. No CD20/DLBCL, IPI, anti-CD20, vincristine, 21-day R-CHOP or bleomycin-specific
  monitoring is inherited. Ukrainian text pending clinical signoff.
