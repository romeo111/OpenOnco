id: SUR-LARYNGEAL-TLM
names:
  preferred: "Transoral laser microsurgery (TLM) for early glottic carcinoma"
  ukrainian: "Трансоральна лазерна мікрохірургія (TLM) при ранньому глотичному раку"
  english: "Transoral laser microsurgery (TLM) for early glottic carcinoma"
  synonyms:
    - "Endoscopic laser cordectomy"
    - "Transoral laser cordectomy"

type: transoral_laser_microsurgery
intent: curative

target_organ: larynx_glottis
applicable_diseases:
  - DIS-LARYNGEAL

operative_mortality_pct: "Very low — no external incision; general-anesthesia risk predominates"

common_complications:
  - name: "Dysphonia / voice change"
    frequency: "Common; severity depends on cordectomy extent (European Laryngological Society type)"
  - name: "Transient dysphagia"
    frequency: "Uncommon, usually self-limited"
  - name: "Laryngeal edema / airway compromise requiring tracheostomy"
    frequency: "Rare"
  - name: "Local recurrence requiring repeat TLM, RT, or salvage laryngectomy"
    frequency: "Uncommon in T1-T2N0 disease at experienced centers"

sources:
  - SRC-NCCN-HNSCC-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending H&N surgical Clinical Co-Lead sign-off (CHARTER §6.1).
  Single-modality organ-preserving surgical option for T1-T2N0 glottic
  (occasionally highly selected supraglottic) SCC, with local control
  comparable to definitive RT (~90% per Disease-level narrative).
  Requires specialized microlaryngoscopy expertise and adequate
  transoral exposure; voice outcome is generally best for the most
  limited resections and worsens with more extensive cordectomy.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_draft
draft_revision: 1
