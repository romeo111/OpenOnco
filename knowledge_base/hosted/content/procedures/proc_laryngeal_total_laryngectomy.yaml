id: SUR-LARYNGEAL-TOTAL-LARYNGECTOMY
names:
  preferred: "Total laryngectomy"
  ukrainian: "Тотальна ларингектомія"
  english: "Total laryngectomy (± neck dissection)"
  synonyms:
    - "Total laryngectomy with neck dissection"

type: total_laryngectomy
intent: curative

target_organ: larynx
applicable_diseases:
  - DIS-LARYNGEAL

operative_mortality_pct: "Low in high-volume centers; higher in the salvage (post-RT) setting"

common_complications:
  - name: "Pharyngocutaneous fistula"
    frequency: "More common in salvage (post-RT) laryngectomy than primary surgery"
  - name: "Stomal stenosis"
    frequency: "Uncommon-to-moderate, long-term"
  - name: "Permanent loss of natural voice — requires voice rehabilitation (tracheoesophageal puncture/prosthesis, electrolarynx, or esophageal speech)"
    frequency: "Universal — defining consequence of total laryngectomy"
  - name: "Hypothyroidism"
    frequency: "Common, especially with adjuvant RT / partial thyroidectomy"

sources:
  - SRC-NCCN-HNSCC-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending H&N surgical Clinical Co-Lead sign-off (CHARTER §6.1).
  Definitive surgical option for locally advanced laryngeal SCC not
  suited to (or not preferred for) larynx-preservation chemoradiation
  — extensive cartilage invasion, a pretreatment non-functional
  larynx, or patient preference after MDT counseling on the CRT
  alternative (see RF-LARYNGEAL-POOR-PRESERVATION-CANDIDACY).
  Typically combined with neck dissection and postoperative RT for
  high-risk pathologic features. Requires committed voice
  rehabilitation planning before surgery.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_draft
draft_revision: 1
