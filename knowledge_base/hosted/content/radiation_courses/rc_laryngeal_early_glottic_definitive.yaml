id: RC-LARYNGEAL-EARLY-GLOTTIC-DEFINITIVE
names:
  preferred: "Definitive radiotherapy for early glottic carcinoma (T1-T2N0)"
  ukrainian: "Дефінітивна променева терапія раннього глотичного раку (T1-T2N0)"
  english: "Definitive RT — early glottic SCC, 66 Gy / 33 fx"
  synonyms:
    - "Definitive RT T1-T2 glottic carcinoma"
    - "Conventional fractionation 2 Gy/fx to 66 Gy"

total_dose_gy: 66
fractions: 33
fraction_size_gy: 2.0
target_volume: "Glottic larynx (gross tumor + limited margin); elective nodal irradiation generally omitted for N0 glottic primaries given low nodal-metastasis risk"
schedule: "5 fx/week (Mon-Fri) x ~6.5 weeks"

concurrent_chemo_regimen:
intent: definitive

sources:
  - SRC-NCCN-HNSCC-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending radiation-oncology Clinical Co-Lead sign-off (CHARTER
  §6.1). Representative conventionally-fractionated definitive RT
  course for T1-T2N0 glottic SCC (2 Gy/fraction to 66 Gy), achieving
  ~90% local control per the Disease-level narrative. Hypofractionated
  alternatives (e.g., ~2.25 Gy/fraction to a lower total dose) are
  also used at some centers; exact dose/fractionation and field design
  must be individualized by radiation oncology per tumor extent
  (anterior commissure / subglottic extension, vocal cord mobility).
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_draft
draft_revision: 1
