id: RC-LARYNGEAL-LA-CRT-RTOG9111
names:
  preferred: "Definitive concurrent chemoradiation for larynx preservation (RTOG 91-11)"
  ukrainian: "Дефінітивна конкурентна хіміопроменева терапія для збереження гортані (RTOG 91-11)"
  english: "Larynx-preservation CRT — 70 Gy / 35 fx + concurrent cisplatin (RTOG 91-11)"
  synonyms:
    - "RTOG 91-11 concurrent CRT arm"
    - "Forastiere concurrent chemoradiation"

total_dose_gy: 70
fractions: 35
fraction_size_gy: 2.0
target_volume: "Primary tumor + involved / at-risk cervical lymph nodes (CTV) with PTV margin per institutional protocol"
schedule: "5 fx/week (Mon-Fri) x 7 weeks; concurrent with cisplatin 100 mg/m² days 1, 22, 43"

concurrent_chemo_regimen: REG-CISPLATIN-CONCURRENT-RT-LARYNX
intent: definitive

sources:
  - SRC-RTOG-9111-FORASTIERE-2003
  - SRC-NCCN-HNSCC-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending radiation-oncology Clinical Co-Lead sign-off (CHARTER
  §6.1). RTOG 91-11 (Forastiere NEJM 2003; long-term update JCO 2013)
  concurrent chemoradiation arm — 70 Gy in 35 fractions (2 Gy/fraction)
  over 7 weeks with concurrent cisplatin 100 mg/m² on days 1, 22, and
  43. Achieved the highest larynx-preservation rate (~88% at 2 years)
  among the trial's three arms (induction chemo->RT ~75%; RT alone
  ~70%) without an overall-survival difference among arms. Standard
  nonsurgical larynx-preservation approach for locally advanced
  (stage III-IVA, T2-T4a) laryngeal SCC in patients fit for high-dose
  cisplatin.
ukrainian_review_status: pending_clinical_signoff
