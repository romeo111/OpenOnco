id: RC-LARYNGEAL-POSTOP-ADJUVANT
names:
  preferred: "Postoperative adjuvant radiotherapy after total laryngectomy"
  ukrainian: "Післяопераційна ад'ювантна променева терапія після тотальної ларингектомії"
  english: "Adjuvant RT post-total-laryngectomy, 60 Gy / 30 fx"
  synonyms:
    - "Postoperative RT after laryngectomy ± neck dissection"

total_dose_gy: 60
fractions: 30
fraction_size_gy: 2.0
target_volume: "Surgical bed (laryngectomy site, stoma/tracheostome as indicated) + at-risk cervical nodal levels per pathologic findings"
schedule: "5 fx/week (Mon-Fri) x 6 weeks, generally starting within 6 weeks of surgery"

concurrent_chemo_regimen:
intent: adjuvant

sources:
  - SRC-NCCN-HNSCC-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending radiation-oncology Clinical Co-Lead sign-off (CHARTER
  §6.1). Representative adjuvant RT course after total laryngectomy
  for high-risk pathologic features (close margins, multiple positive
  nodes, perineural/lymphovascular invasion). Positive margins or
  extranodal extension warrant dose escalation and/or addition of
  concurrent chemotherapy per the established postoperative
  chemoradiation evidence base (Bernier EORTC 22931 / Cooper RTOG
  9501 paradigm) — that concurrent postoperative CRT pathway is a
  DELIBERATE GAP, not modeled as a separate Indication/RadiationCourse
  here (no dedicated source authored for it in this pass; see
  disease-file open_gaps). Dose, fractionation, and field design must
  be individualized by radiation oncology.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_draft
draft_revision: 1
