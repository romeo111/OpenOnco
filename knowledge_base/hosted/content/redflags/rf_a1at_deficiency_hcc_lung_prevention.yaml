id: RF-A1AT-DEFICIENCY-HCC-LUNG-PREVENTION
definition: >-
  Alpha-1 antitrypsin (A1AT) deficiency, particularly homozygous PiZZ
  genotype (severe deficiency with serum A1AT typically <11 µM /
  <50 mg/dL), in an individual without a current HCC or lung cancer
  diagnosis. PiZZ confers elevated HCC risk in cirrhotic subset
  (~3-5%/year in adult cirrhotic A1AT-deficient cohorts;
  Pittelkow et al. JAMA 2014; Tanash et al. Gastroenterology 2016) and
  elevated lung cancer risk in smokers + non-smokers (Pittelkow JAMA
  2014; observational cohorts SIR ~2-3 for lung cancer, multiplicatively
  higher with smoking). Underlying pathology: misfolded Z-A1AT
  polymerizes in hepatocytes (hepatic injury → fibrosis → cirrhosis →
  HCC) and absent circulating A1AT permits neutrophil-elastase-mediated
  alveolar destruction (emphysema → field-cancerization-mechanism lung
  cancer risk). PiSZ heterozygotes carry intermediate risk; PiMZ
  carriers near-population risk except with concurrent smoking.
  Smoking cessation is the single highest-impact intervention.
  AASLD HCC surveillance with US ± AFP q6mo in cirrhotic A1AT.
  Prevention-persona RedFlag (§20 ratification 2026-05-18, v0.3
  chronic-condition pilot).
definition_ua: >-
  Дефіцит альфа-1-антитрипсину (A1AT), особливо гомозиготний генотип
  PiZZ (тяжкий дефіцит із сироватковим рівнем A1AT типово <11 мкМ /
  <50 мг/дл), у пацієнта без поточного діагнозу HCC або раку легень.
  PiZZ зумовлює підвищений ризик HCC у підгрупі пацієнтів із цирозом
  (~3-5%/рік у когортах дорослих пацієнтів із цирозом і дефіцитом
  A1AT; Pittelkow, JAMA, 2014; Tanash, Gastroenterology, 2016), а
  також підвищений ризик раку легень як у курців, так і в некурців
  (Pittelkow, JAMA, 2014; за даними обсерваційних когорт SIR ~2-3 для
  раку легень, з мультиплікативним зростанням при курінні). Патогенез:
  неправильно згорнутий Z-варіант A1AT полімеризується в гепатоцитах
  (ушкодження печінки → фіброз → цироз → HCC), а відсутність
  циркулюючого A1AT дозволяє нейтрофільній еластазі руйнувати
  альвеолярну тканину (емфізема → підвищений ризик раку легень через
  механізм канцерогенезу поля ураження). Гетерозиготи PiSZ мають
  проміжний ризик; носії PiMZ мають ризик, близький до популяційного,
  за винятком супутнього куріння. Відмова від куріння — інтервенція
  з найвищим впливом. AASLD рекомендує спостереження щодо HCC з УЗД
  ± АФП кожні 6 міс. у пацієнтів із цирозом і дефіцитом A1AT.
  RedFlag профілю профілактики (ратифікація §20, 2026-05-18, пілот
  хронічних станів v0.3).

