notes: >
  Wave P confirmed-carrier surveillance pathway — germline ANKRD26
  (Thrombocytopenia 2). Fires on documented germline ANKRD26
  pathogenic variant positivity (typically the 5′UTR hotspot) OR
  documented THC2 clinical criteria (lifelong moderate
  thrombocytopenia + RUNX1-negative + ANKRD26-targeted genetic test
  positive). Engine routes to PreventionPlan recommending:
    (a) IND-ANKRD26-CARRIER-SURVEILLANCE (standard) — CBC + smear q6
        months lifelong from carrier confirmation; BMA + myeloid NGS
        panel + cytogenetics at any clinically-concerning change
        (new cytopenia in another lineage, persistent dysplasia on
        smear, unexplained increase in WBC); annual review of bleeding
        history + medication review (avoid antiplatelet drugs when
        feasible); cascade testing to first-degree relatives.
    (b) IND-ANKRD26-CARRIER-INTENSIFIED (aggressive) — standard
        protocol PLUS BMA every 3-5 years even without provoked
        indication; q3-month CBC during pregnancy / perioperative
        windows; preemptive HLA typing on candidate sibling donors
        with germline ANKRD26 screening required before any future
        transplant use; structured-bleeding-risk plan for major
        surgery / obstetric care.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Severity calibrated `major` despite ~5-10% lifetime
  cumulative incidence because (a) prevention-persona RFs in this KB
  use `major` as default for confirmed-carrier syndromes regardless of
  absolute penetrance, and (b) the surveillance-program intensity
  required (lifelong CBC q6mo + donor screening + perioperative
  bleeding planning) matches what `major` signals downstream.

  Penetrance reference: Noris et al. Blood 2011 (78-family ANKRD26
  cohort, leukemia incidence ~5-10% over follow-up); Pippucci et al.
  Am J Hum Genet 2011 (5′UTR identification); Bluteau et al. J Clin
  Invest 2018 (mechanistic).

  Donor implication identical to other germline-myeloid syndromes:
  candidate sibling donors must be screened for ANKRD26 germline
  variants before being used; donor-derived disease has been reported
  in inherited bone marrow failure / predisposition syndromes broadly.
