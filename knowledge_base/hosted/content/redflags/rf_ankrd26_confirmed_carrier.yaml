# ANKRD26 carrier malignancy spectrum: MDS and AML, lifetime risk
# ~5-10% (lower than RUNX1 FPD/AML but established). DIS-MDS-HR +
# DIS-AML anchors. Note: lifetime risk is in the brief's "below 30%"
# bucket, but `minor` severity does not appropriately capture the
# clinical-decision-making impact of a known myeloid-predisposition
# syndrome (mandates lifelong CBC monitoring, donor screening, BMA
# threshold lowering). `major` calibrated to align with the
# surveillance-program intensity, not the absolute incidence number —
# see notes for full context.
