id: RF-ANKRD26-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in ANKRD26
  (Thrombocytopenia 2, THC2; OMIM 188000). Most pathogenic variants
  cluster in the 5′-untranslated region (the ANKRD26 5′UTR hotspot,
  chr10:27,389-27,420), disrupting RUNX1 / FLI1-mediated repression and
  producing a persistent ANKRD26 over-expression phenotype during
  megakaryopoiesis. Patient has had germline panel testing returned
  positive, ideally on buccal / fibroblast germline tissue. The carrier
  presents from birth / childhood with mild-to-moderate isolated
  thrombocytopenia (platelet count 40-120 x10⁹/L typically) plus a
  variably-penetrant bleeding diathesis (mild mucocutaneous bleeding,
  surgical bleeding risk). Lifetime risk of myeloid malignancy
  (MDS or AML) is documented as ~5-10% in cohort series and is lower
  than in classic RUNX1 / FPD/AML pedigrees, but enough to mandate
  lifelong surveillance — the malignant phenotype is similar to other
  germline-myeloid-predisposition spectra (somatic second hits at
  ASXL1, monosomy-7, del(5q) precede frank AML). Prevention-persona
  RedFlag (KSS §20, confirmed-carrier surveillance pathway).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у ANKRD26 (Thrombocytopenia 2, THC2; OMIM 188000). Більшість
  патогенних варіантів кластеризовані в 5′-untranslated region (ANKRD26
  5′UTR hotspot, chr10:27,389-27,420), порушуючи RUNX1 / FLI1-медіовану
  репресію і продукуючи персистуючий ANKRD26 over-expression фенотип
  при мегакаріопоезі. Пацієнт пройшов germline-тестування з позитивним
  результатом, ідеально на buccal / fibroblast germline тканині. Носій
  представляє від народження / дитинства з м'яко-помірною ізольованою
  тромбоцитопенією (тромбоцити 40-120 x10⁹/л зазвичай) плюс варіабельно-
  penetrant bleeding diathesis (м'який мукокутаний bleeding, surgical
  bleeding ризик). Довічний ризик мієлоїдного malignancy (МДС або
  ГМЛ) задокументований як ~5-10% у когортних серіях і нижчий ніж у
  класичних RUNX1 / FPD/AML родоводах, але достатній для життєвого
  спостереження — malignant фенотип схожий з іншими germline-myeloid-
  predisposition спектрами (соматичні "second hits" в ASXL1, моносомія-
  7, del(5q) передують франкному ГМЛ). Prevention-persona RedFlag (KSS
  §20, шлях спостереження підтверджених носіїв).

