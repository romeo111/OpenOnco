notes: >
  Prevention-persona RedFlag for ATM heterozygous carriers. Distinction
  from biallelic A-T phenotype is critical: heterozygotes have cancer
  predisposition only (no neurologic phenotype). Engine routes to
  enhanced breast surveillance + pancreatic surveillance for FDR-of-
  PDAC carriers per CAPS consortium 2022; prostate awareness for males.
  STUB pending two-Co-Lead signoff per CHARTER §6.1 dev-mode.
