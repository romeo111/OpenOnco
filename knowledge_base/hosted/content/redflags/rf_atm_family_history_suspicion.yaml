notes: >
  v0.3 Wave M suspicion variant — pre-testing family-history-suspicion
  counterpart to RF-ATM-CONFIRMED-CARRIER. Fires when family pedigree
  pattern suggests ATM carrier state but germline panel testing has
  not yet been completed. Standard pathway = referral for genetic
  counseling + multi-gene HBOC/PDAC-inclusive panel (covering BRCA1/2,
  PALB2, ATM, CHEK2, RAD51C/D, BRIP1 minimum; pancreatic-extended
  panels add CDKN2A, STK11, MLH1/MSH2/MSH6/PMS2). If panel returns
  positive for ATM, the patient transitions to the
  RF-ATM-CONFIRMED-CARRIER pathway (IND-ATM-CARRIER-PREVENTION-
  SURVEILLANCE for standard track). If panel returns negative for
  ATM but family history remains, empirical surveillance based on
  family-history alone is offered as the aggressive-track
  alternative. Distinct trigger findings from the confirmed-carrier
  RF (carrier RF fires on `germline_atm_pathogenic_variant_confirmed`
  / `germline_atm_likely_pathogenic_variant`; suspicion RF fires on
  family-history-based findings only) — engine cleanly routes one or
  the other based on testing status. STUB pending two-Clinical-Co-
  Lead signoff per CHARTER §6.1 dev-mode. Sources cite NCCN Genetic/
  Familial High-Risk: Breast, Ovarian, and Pancreatic v2.2025 ATM
  testing criteria + CAPS Consortium 2022 familial pancreatic kindred
  testing recommendations.
