id: RF-BARD1-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in BARD1
  (BRCA1-associated RING domain 1) — partner of BRCA1 in the BRCA1-
  BARD1 heterodimer essential for homologous-recombination repair.
  Heterozygous BARD1 carriers have moderate-penetrance breast cancer
  risk (RR ~2.0-3.0; lifetime ~20-30%; some evidence higher in triple-
  negative breast cancer subset). Modest ovarian cancer risk signal
  (RR ~1.5-2.0). Less common multi-gene panel finding (~0.2-0.3% of
  unselected breast cancer cohorts). Patient has confirmed positive
  germline test; no current personal cancer diagnosis in the carrier
  being assessed. Prevention-persona RedFlag (§20, v0.3 moderate-
  penetrance breast/ovarian gene expansion).
definition_ua: >-
  Підтверджений germline pathogenic / likely-pathogenic variant у BARD1
  (BRCA1-associated RING domain 1) — partner BRCA1 у BRCA1-BARD1
  heterodimer essential для homologous-recombination repair.
  Heterozygous BARD1 carriers мають moderate-penetrance breast cancer
  ризик (RR ~2.0-3.0; lifetime ~20-30%; вищий у triple-negative breast
  cancer subset). Modest ovarian cancer ризик signal (RR ~1.5-2.0).
  Less common multi-gene panel finding (~0.2-0.3% unselected breast
  cancer cohorts). Prevention-персона RedFlag (§20, v0.3 moderate-
  penetrance breast/ovarian gene expansion).

