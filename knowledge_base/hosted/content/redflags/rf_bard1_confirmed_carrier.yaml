notes: >
  Prevention-persona RedFlag for BARD1 heterozygous carriers. Engine
  routes to enhanced breast surveillance + ovarian symptom-driven
  workup. NCCN places BARD1 in moderate-elevated breast tier (annual
  mammography from age 40; consider MRI). Triple-negative subset
  signal may justify earlier or MRI-inclusive screening in family-
  history-stratified cohorts. STUB pending two-Co-Lead signoff per
  CHARTER §6.1 dev-mode.
