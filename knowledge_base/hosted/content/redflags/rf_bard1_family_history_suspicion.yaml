id: RF-BARD1-FAMILY-HISTORY-SUSPICION
definition: >-
  Family pedigree pattern suggestive of germline BARD1 heterozygous
  carrier state in an asymptomatic individual who has NOT yet had
  multi-gene panel testing. BARD1 (BRCA1-associated RING domain 1)
  is the obligate partner of BRCA1 in the BRCA1-BARD1 heterodimer
  essential for homologous-recombination repair. Triggers include
  any of (a) first- or second-degree relative with a confirmed BARD1
  pathogenic / likely-pathogenic variant; (b) family-history cluster
  of triple-negative breast cancer in close relatives — BARD1 shows
  enriched signal in the TNBC subset; (c) family-history pattern
  resembling BRCA-style HBOC but with negative BRCA1/2 testing
  in affected relative (BARD1 is one of several moderate-penetrance
  findings in BRCA-negative BRCA-like pedigrees); (d) early-onset
  (<50y) breast cancer in a first-degree relative with negative
  BRCA1/2 panel testing and additional family-history support
  (multiple affected relatives or bilaterality). No current personal
  cancer diagnosis in the at-risk individual being assessed.
  Prevention-persona RedFlag (§20, v0.3 moderate-penetrance breast/
  ovarian gene expansion — pre-testing suspicion variant).
definition_ua: >-
  Сімейний родовід з патерном, що нагадує гермінативний heterozygous
  carrier BARD1, у асимптомної особи, яка ще НЕ пройшла multi-gene
  panel тестування. BARD1 (BRCA1-associated RING domain 1) —
  obligate партнер BRCA1 у BRCA1-BARD1 heterodimer essential для
  homologous-recombination repair. Тригери включають будь-яке з (а)
  родич першого/другого ступеня з підтвердженим патогенним /
  ймовірно-патогенним варіантом BARD1; (б) сімейне накопичення
  triple-negative breast cancer у близьких родичів — BARD1 показує
  enriched signal у TNBC subset; (в) сімейно-історичний патерн що
  нагадує BRCA-style HBOC але з негативним BRCA1/2 тестуванням у
  ураженого родича (BARD1 — один з кількох moderate-penetrance
  findings у BRCA-negative BRCA-like родоводах); (г) early-onset
  (<50р) рак молочної залози у родича першого ступеня з негативним
  BRCA1/2 панельним тестуванням та додатковою сімейно-історичною
  підтримкою.
  Поточний особистий діагноз раку у пацієнта з ризиком відсутній.
  Prevention-персона RedFlag (§20, v0.3 — pre-testing suspicion
  варіант).

