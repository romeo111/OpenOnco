notes: >
  v0.3 Wave M suspicion variant — pre-testing family-history-
  suspicion counterpart to RF-BARD1-CONFIRMED-CARRIER. Fires when
  family pedigree pattern suggests BARD1 carrier state but germline
  panel testing has not yet been completed. Standard pathway =
  referral for genetic counseling + multi-gene HBOC panel. If panel
  returns positive for BARD1, the patient transitions to the
  RF-BARD1-CONFIRMED-CARRIER pathway (annual mammography from age
  40 + MRI consideration; earlier or MRI-inclusive screening in
  family-history-stratified TNBC-enriched cohorts; ovarian
  symptom-driven workup only — modest signal does not justify
  routine ovarian surveillance). Distinct trigger findings from the
  confirmed-carrier RF (carrier RF fires on `germline_bard1_
  pathogenic_variant_confirmed`; suspicion RF fires on family-
  history-based findings only). STUB pending two-Clinical-Co-Lead
  signoff per CHARTER §6.1 dev-mode.
