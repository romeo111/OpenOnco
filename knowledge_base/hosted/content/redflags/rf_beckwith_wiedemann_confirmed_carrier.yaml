id: RF-BECKWITH-WIEDEMANN-CONFIRMED-CARRIER
definition: >-
  Patient has a confirmed Beckwith-Wiedemann syndrome (BWS) molecular
  diagnosis — pathogenic alteration at the 11p15.5 imprinting locus
  (CDKN1C, H19, KCNQ1OT1, IGF2). BWS confers an estimated 5-10% lifetime
  embryonal tumor risk during infancy and early childhood (especially
  Wilms tumor with IC1/H19 hypermethylation subtype, hepatoblastoma
  across subtypes). The risk window is narrow — most tumors arise before
  age 8 — so intensive prevention-time surveillance is critical.
  Prevention-persona confirmed-carrier RedFlag (§20).
definition_ua: >-
  Пацієнт має підтверджений молекулярний діагноз синдрому
  Беквіта-Відемана (BWS) — патогенне порушення локусу імпринтингу 11p15.5
  (CDKN1C, H19, KCNQ1OT1, IGF2). BWS супроводжується ~5-10% довічним
  ризиком ембріональних пухлин у ранньому дитинстві (особливо пухлина
  Вілмса при підтипі IC1/H19 гіперметилювання, гепатобластома при всіх
  підтипах). Вікно ризику вузьке — більшість пухлин виникає до 8 років,
  тому інтенсивне prevention-time спостереження критичне.
  Prevention-persona confirmed-carrier RedFlag (§20).

