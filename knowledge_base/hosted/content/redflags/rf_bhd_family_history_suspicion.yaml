    - finding: "proband_cutaneous_fibrofolliculomas_multiple_with_family_pneumothorax_or_rcc"
      value: true
    - finding: "proband_spontaneous_pneumothorax_with_pulmonary_cysts_basilar_distribution"
      value: true
    - finding: "family_bhd_hybrid_oncocytic_or_chromophobe_rcc"
      value: true

