id: RF-BHD-FAMILY-HISTORY-SUSPICION
definition: >-
  Family or proband pedigree suggestive of Birt-Hogg-Dubé (BHD) syndrome —
  germline FLCN (folliculin, 17p11.2) pathogenic variant in family OR
  characteristic phenotype triad (cutaneous fibrofolliculomas /
  trichodiscomas / acrochordons — typically ≥5 facial / neck / upper-
  trunk lesions appearing 3rd-4th decade + multiple pulmonary cysts
  on chest CT predominantly basilar / subpleural + ≥1 spontaneous
  pneumothorax — often recurrent and earlier-onset than primary
  spontaneous PTX) + family history of bilateral / multifocal renal
  tumors, particularly hybrid chromophobe-oncocytoma /
  hybrid-oncocytic tumors / chromophobe RCC / oncocytoma. Distinct
  from HLRCC (FH-deficient papillary type-2), HPRC (MET papillary
  type-1), VHL (clear-cell), SDH (SDH-deficient). Lifetime RCC risk
  in FLCN carriers ~15-30%. Prevention-persona RedFlag (§20 v0.2-B).
definition_ua: >-
  Сімейний або probandний родовід, підозрілий на Birt-Hogg-Dubé (BHD)
  syndrome — germline FLCN (folliculin, 17p11.2) patogenic variant у
  родині АБО характерна phenotypic тріада (cutaneous fibrofolliculomas
  / trichodiscomas / acrochordons — зазвичай ≥5 facial / neck / upper-
  trunk lesions у 3-4 декаді + multiple pulmonary cysts на chest CT
  переважно basilar / subpleural + ≥1 spontaneous pneumothorax —
  often recurrent і earlier-onset ніж primary spontaneous PTX) +
  family history bilateral / multifocal renal tumors, particularly
  hybrid chromophobe-oncocytoma / hybrid-oncocytic tumors /
  chromophobe RCC / oncocytoma. Відмінний від HLRCC (FH-deficient
  papillary type-2), HPRC (MET papillary type-1), VHL (clear-cell),
  SDH (SDH-deficient). Lifetime RCC risk у FLCN carriers ~15-30%.

trigger:
  type: lab_value
  any_of:
