notes: >
  Prevention-persona RedFlag for BHD/FLCN confirmed carriers. Multi-
  organ surveillance: abdominal MRI q2-3y from age 20 for RCC (avoid
  radiation; many BHD lesions are hybrid oncocytic + slow-growing);
  chest HRCT baseline + symptom-driven (spontaneous pneumothorax
  triggers high-resolution imaging); dermatology q1y for skin
  surveillance. Nephron-sparing surgery (partial nephrectomy) preferred
  for ≤3cm renal lesions given multifocal/bilateral disease pattern.
  STUB pending two-Co-Lead signoff per CHARTER §6.1 dev-mode.
