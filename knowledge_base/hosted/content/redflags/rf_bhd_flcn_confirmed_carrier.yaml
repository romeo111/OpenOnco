id: RF-BHD-FLCN-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in FLCN
  (folliculin) — Birt-Hogg-Dubé syndrome (BHD). Autosomal-dominant.
  Classic clinical triad: fibrofolliculomas (skin papules of face/neck/
  upper trunk, often dermatologic presenting feature), pulmonary cysts +
  spontaneous pneumothorax (cumulative lifetime pneumothorax ~30-40%;
  imaging shows multiple basal/subpleural cysts), and renal cell
  carcinoma (~16-32% lifetime risk; characteristic chromophobe + hybrid
  oncocytic + clear-cell histologies; bilateral + multifocal common;
  often presents younger — 40s-50s — than sporadic RCC). FLCN encodes
  folliculin, an mTOR pathway regulator; loss-of-function variants cause
  BHD. Patient has confirmed positive germline test; no current personal
  cancer diagnosis in the carrier being assessed. Prevention-persona
  RedFlag (§20, v0.3 rare-hereditary expansion Wave P2).
