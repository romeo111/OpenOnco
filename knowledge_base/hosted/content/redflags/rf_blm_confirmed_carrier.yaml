id: RF-BLM-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in the BLM
  gene — Bloom syndrome carrier status. Biallelic BLM inactivation
  causes Bloom syndrome (BS) — autosomal-recessive chromosomal-
  instability disorder with severe growth restriction, photosensitive
  facial erythema, immunodeficiency, and dramatically elevated risk of
  a broad spectrum of cancers (CRC, leukemia, lymphoma, breast, skin)
  with median age of cancer diagnosis ~25-30 years. Heterozygous
  (carrier) status — the focus of this RedFlag — confers a modest
  signal for colorectal cancer (RR ~1.5-2.0) and possibly breast
  cancer (RR ~1.5; evidence less consistent). The Ashkenazi Jewish
  founder variant c.2207_2212delinsTAGATTC (p.Tyr736LeufsTer5; also
  reported as p.Tyr736X / BLM-Ash) has population carrier frequency
  ~1% in Ashkenazi Jews, making BLM carrier testing routine on
  Ashkenazi preconception panels and population-relevant in any
  Ashkenazi-ancestry cancer-risk assessment. No current personal
  cancer diagnosis in the carrier being assessed. Mandates colorectal
  cancer screening with mild intensification, breast-cancer awareness,
  and reproductive counseling (biallelic-Bloom risk to offspring of
  two carriers). Prevention-persona RedFlag (§20, v0.3 wave-N niche
  moderate-penetrance pathway).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант у
  гені BLM — носійство Bloom syndrome. Біалельна інактивація BLM
  спричиняє Bloom syndrome (BS) — аутосомно-рецесивне розлад
  хромосомної нестабільності з тяжким growth restriction,
  photosensitive facial erythema, immunodeficiency та різко підвищеним
  ризиком широкого спектру раків (CRC, leukemia, lymphoma, breast,
  skin) з медіаною віку діагнозу раку ~25-30 років. Гетерозиготний
  (carrier) статус — фокус цього RedFlag — надає modest signal для
  колоректального раку (RR ~1.5-2.0) і можливо раку молочної залози
  (RR ~1.5; докази менш консистентні). Ашкеназі-єврейський founder
  варіант c.2207_2212delinsTAGATTC (p.Tyr736LeufsTer5; також BLM-Ash)
  має population carrier frequency ~1% серед Ашкеназі євреїв. Поточний
  особистий діагноз раку відсутній. Mandates скринінг колоректального
  раку з помірною інтенсифікацією, breast-cancer awareness та
  репродуктивне консультування. Prevention-persona RedFlag (§20, v0.3
  wave-N niche moderate-penetrance шлях).

trigger:
  type: lab_value
  any_of:
    - finding: "germline_blm_pathogenic_variant_confirmed"
      value: true

clinical_direction: investigate

severity: major
priority: 100
category: other
risk_category: genetic

# BLM heterozygote-spectrum: colorectal cancer (RR ~1.5-2.0); possible
# breast (RR ~1.5; inconsistent). Biallelic = Bloom syndrome (early-
# onset multi-cancer phenotype) — outside the asymptomatic-adult
# prevention persona for this RF.
relevant_diseases:
  - DIS-CRC
  - DIS-BREAST

shifts_algorithm: []

