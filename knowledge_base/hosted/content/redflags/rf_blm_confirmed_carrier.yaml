  - SRC-NCCN-COLON-2025

last_reviewed: "2026-05-20"
reviewer_signoffs: 0
notes: >
  v0.3 wave-N niche moderate-penetrance carrier pathway — BLM
  heterozygosity. Fires on documented germline BLM pathogenic variant
  positivity in an asymptomatic individual. Engine routes to
  PreventionPlan recommending:
    (a) IND-BLM-CARRIER-SURVEILLANCE (standard) — CRC screening with
        colonoscopy q5y from age 40 (or 10y before earliest familial
        CRC diagnosis); breast cancer awareness + population-cadence
        screening at standard ages; cascade testing of first-degree
        relatives; reproductive counseling for partners who are also
        carriers (biallelic Bloom syndrome risk to offspring).
    (b) IND-BLM-CARRIER-OBSERVATION (alternative) — population-cadence
        screening only (CRC q10y from age 45 per USPSTF). Counsel that
        this is sub-optimal vs. mildly intensified surveillance
        comparator. Per CHARTER §11 patient-autonomy framing.

  Ashkenazi founder allele context: c.2207_2212delinsTAGATTC
  (p.Tyr736X / BLM-Ash) is the dominant pathogenic variant in
  Ashkenazi Jewish populations (population carrier frequency ~1% —
  approximately 1 in 100). Routine inclusion on Ashkenazi
  preconception panels alongside BRCA1/2 founder variants. NCCN
  Genetic/Familial High-Risk CRC includes BLM in moderate-penetrance
  CRC-gene panels but the recommendation strength is conditional and
  evidence base is described as "limited" — surveillance
  intensification beyond population-cadence is offered for
  informational and shared-decision-making purposes, not as a strong
  mandate.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Source-set TODO: Cleary et al. BLM-Ash CRC risk
  meta-analysis (Cancer Res 2003); Gruber et al. BLM heterozygote CRC
  (Science 2002 — early signal, later contested); Baris et al. updated
  BLM heterozygote cancer-risk analysis (Hum Mol Genet 2007); ongoing
  v0.3 wave-N authoring backlog new SRC entities for BLM-specific
  evidence.

  Lifetime cancer risk in confirmed BLM heterozygotes (NCCN
  Genetic/Familial High-Risk CRC 2025; Baris 2007; Cleary 2003):
    - Colorectal cancer: ~10-12% lifetime; RR ~1.5-2.0 vs. population
      baseline (~5-6%); evidence base described as moderate.
    - Breast cancer (women): possible modest elevation (RR ~1.5);
      evidence inconsistent across cohort studies; not target for
      surveillance intensification beyond population-cadence
      mammography.
    - Other Bloom-spectrum cancers in heterozygotes (leukemia,
      lymphoma, skin cancers): minimal-to-absent signal in
      heterozygotes; reserved as biallelic-Bloom risk only.
