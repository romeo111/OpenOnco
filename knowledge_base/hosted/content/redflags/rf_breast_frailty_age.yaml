id: RF-BREAST-FRAILTY-AGE
definition: "Age ≥75 + ECOG ≥2 + significant comorbidity — anthracycline + dose-dense regimens poorly tolerated; consider TC, weekly paclitaxel, single-agent endocrine, or trastuzumab + chemo of reduced intensity."
definition_ua: "Вік ≥75 + ECOG ≥2 + суттєві коморбідності — антрациклін + доза-щільні режими погано переносяться; розглянути TC, тижневий паклітаксел, ендокринну монотерапію, скорочений HER2-режим."

trigger:
  type: composite_clinical
  all_of:
    - finding: "age_years"
      threshold: 75
      comparator: ">="
    - any_of:
        - finding: "ecog_status"
          threshold: 2
          comparator: ">="
        - finding: "comorbidity_count"
          threshold: 2
          comparator: ">="

clinical_direction: de-escalate
severity: major
priority: 100
category: frailty-age

relevant_diseases: [DIS-BREAST]

sources:
  - SRC-NCCN-BREAST-2025
  - SRC-ESMO-BREAST-EARLY-2024

last_reviewed:
draft: false

notes: >
  Geriatric assessment (G8 / CGA) recommended pre-treatment for ≥70.
  HR+ disease in frail elderly may be managed with endocrine therapy
  alone (favorable risk-benefit). HER2+: trastuzumab + paclitaxel
  weekly or T-DM1 monotherapy alternatives. TNBC: weekly paclitaxel
  or capecitabine.
notes_ua: >
  Геріатрична оцінка (G8 / CGA) рекомендована перед лікуванням у пацієнтів
  віком ≥70 років. При HR+ захворюванні в ослаблених пацієнтів літнього
  віку можливе ведення лише ендокринною терапією (сприятливе
  співвідношення ризику та користі). При HER2+: трастузумаб + тижневий
  паклітаксел або монотерапія T-DM1 як альтернатива. При TNBC: тижневий
  паклітаксел або капецитабін.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_extraction
draft_revision: 1
