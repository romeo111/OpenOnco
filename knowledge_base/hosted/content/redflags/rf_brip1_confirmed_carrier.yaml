id: RF-BRIP1-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in BRIP1
  (BRCA1-interacting protein 1, also FANCJ). Heterozygous BRIP1 carriers
  have established moderate-penetrance ovarian cancer risk (RR ~3.0;
  lifetime ~5-15%; sufficient for NCCN-endorsed risk-reducing salpingo-
  oophorectomy discussion at completed childbearing or age 45-50).
  Possible modest breast cancer signal (controversial; current NCCN does
  not include BRIP1 in elevated breast tier). Biallelic BRIP1 is the
  autosomal-recessive Fanconi anemia complementation group J phenotype,
  distinct from the cancer-predisposition carrier state here. Less
  common multi-gene panel finding (~0.2-0.5% unselected ovarian
  cancer cohorts). Patient has confirmed positive germline test; no
  current personal cancer diagnosis in the carrier being assessed.
  Prevention-persona RedFlag (§20, v0.3 moderate-penetrance ovarian gene
  expansion).
definition_ua: >-
  Підтверджений germline pathogenic / likely-pathogenic variant у
  BRIP1 (BRCA1-interacting protein 1, також FANCJ). Heterozygous
  BRIP1 carriers мають established moderate-penetrance ovarian cancer
  ризик (RR ~3.0; lifetime ~5-15%; sufficient для NCCN-endorsed risk-
  reducing salpingo-oophorectomy discussion при completed childbearing
  або 45-50 років). Possible modest breast cancer signal
  (controversial; NCCN не включає BRIP1 у elevated breast tier).
  Biallelic BRIP1 — autosomal-recessive Fanconi anemia complementation
  group J phenotype. Less common multi-gene panel finding (~0.2-0.5%
  unselected ovarian cancer cohorts). Prevention-персона RedFlag (§20,
  v0.3 moderate-penetrance ovarian gene expansion).

