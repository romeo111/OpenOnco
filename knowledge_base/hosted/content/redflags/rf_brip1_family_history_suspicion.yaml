notes: >
  v0.3 Wave M suspicion variant — pre-testing family-history-
  suspicion counterpart to RF-BRIP1-CONFIRMED-CARRIER. Fires when
  family pedigree pattern suggests BRIP1 carrier state but germline
  panel testing has not yet been completed. Standard pathway =
  referral for genetic counseling + multi-gene HBOC panel covering
  BRCA1/2 + relevant moderate-penetrance ovarian-risk genes (BRIP1,
  RAD51C, RAD51D minimum). If panel returns positive for BRIP1, the
  patient transitions to the RF-BRIP1-CONFIRMED-CARRIER pathway
  with NCCN-endorsed RRSO discussion at completed childbearing or
  age 45-50, no population ovarian cancer screening recommended
  pre-RRSO (TVUS + CA-125 demonstrated poor sensitivity in BRCA-
  carrier cohorts, applies similarly to BRIP1). Distinct trigger
  findings from the confirmed-carrier RF (carrier RF fires on
  `germline_brip1_pathogenic_variant_confirmed`; suspicion RF fires
  on family-history-based findings only). STUB pending two-Clinical-
  Co-Lead signoff per CHARTER §6.1 dev-mode.
