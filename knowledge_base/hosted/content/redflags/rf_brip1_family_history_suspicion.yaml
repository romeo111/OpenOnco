id: RF-BRIP1-FAMILY-HISTORY-SUSPICION
definition: >-
  Family pedigree pattern suggestive of germline BRIP1 heterozygous
  carrier state in an asymptomatic individual who has NOT yet had
  multi-gene panel testing. BRIP1 (BRCA1-interacting protein 1,
  also FANCJ) carriers have established moderate-penetrance ovarian
  cancer risk (RR ~3.0; lifetime ~5-15%) sufficient for NCCN-endorsed
  risk-reducing salpingo-oophorectomy at completed childbearing or
  age 45-50. Triggers include any of (a) first- or second-degree
  relative with a confirmed BRIP1 pathogenic / likely-pathogenic
  variant; (b) family-history cluster of ovarian / fallopian-tube /
  primary peritoneal carcinoma at any age (≥1 first-degree relative
  with high-grade serous histology, or ≥2 affected relatives at any
  age — BRIP1 is the most common moderate-penetrance gene
  identified in BRCA-negative ovarian cancer pedigrees); (c) family
  history of multiple ovarian cancers without confirmed BRCA1/2
  carrier status; (d) BRCA-negative HBOC-spectrum pedigree with
  predominantly ovarian rather than breast clustering — distinct
  from BRCA pattern. No current personal cancer diagnosis in the
  at-risk individual being assessed. Prevention-persona RedFlag
  (§20, v0.3 moderate-penetrance ovarian gene expansion — pre-
  testing suspicion variant).
definition_ua: >-
  Сімейний родовід з патерном, що нагадує гермінативний heterozygous
  carrier BRIP1, у асимптомної особи, яка ще НЕ пройшла multi-gene
  panel тестування. BRIP1 (BRCA1-interacting protein 1, також
  FANCJ) carriers мають established moderate-penetrance ovarian
  cancer ризик (RR ~3.0; lifetime ~5-15%) sufficient для NCCN-
  endorsed risk-reducing salpingo-oophorectomy при completed
  childbearing або 45-50 років. Тригери включають будь-яке з (а)
  родич першого/другого ступеня з підтвердженим патогенним /
  ймовірно-патогенним варіантом BRIP1; (б) сімейне накопичення
  ovarian / fallopian-tube / primary peritoneal carcinoma будь-якого
  віку (≥1 родич першого ступеня з high-grade serous histology
  або ≥2 уражених родичів будь-якого віку — BRIP1 — найпоширеніший
  moderate-penetrance ген ідентифікований у BRCA-negative ovarian
  cancer pedigrees); (в) сімейна історія множинних ovarian раків
  без підтвердженого BRCA1/2 carrier status; (г) BRCA-negative
  HBOC-spectrum родовід з переважно ovarian, а не breast
  clustering.
  Поточний особистий діагноз раку у пацієнта з ризиком відсутній.
  Prevention-персона RedFlag (§20, v0.3 — pre-testing suspicion
  варіант).

