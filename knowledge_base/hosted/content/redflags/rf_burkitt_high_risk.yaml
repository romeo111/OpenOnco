id: RF-BURKITT-HIGH-RISK
definition: Legacy Burkitt high-risk trigger for algorithm review. A fired flag alone does not establish
  eligibility for the encoded high-risk/no-proven-CNS CODOX/IVAC reference.
definition_ua: Застарілий тригер високого ризику Беркіта для перегляду алгоритму. Спрацювання прапорця
  саме по собі не підтверджує придатність закодованого довідкового CODOX/IVAC високого ризику без доведеного
  ураження ЦНС.
trigger:
  type: composite_clinical
  any_of:
  - finding: burkitt_high_risk
    value: true
  - finding: cns_involvement
    value: true
  - finding: ldh_above_3x_uln
    value: true
  - finding: leukemic_phase
    value: true
  - finding: bulky_abdominal
    value: true
clinical_direction: intensify
category: high-risk-biology
priority: 60
relevant_diseases:
- DIS-BURKITT
shifts_algorithm:
- ALGO-BURKITT-1L
sources:
- SRC-NCCN-BCELL-2025
- SRC-ESMO-BURKITT-2024
last_reviewed: null
notes: Trigger logic is retained for legacy trace compatibility, not validated as a complete risk classifier.
  The indication separately requires explicit high-risk and CNS-negative confirmation; CNS involvement
  requires a separate protocol. This flag does not mandate CODOX/IVAC or choose an automatic alternative.
notes_ua: Логіку тригера збережено для сумісності трасування; це не перевірений повний класифікатор ризику.
  Показання окремо вимагає явного підтвердження високого ризику та ЦНС-негативного стану; ураження ЦНС
  потребує окремого протоколу. Прапорець не наказує застосувати CODOX/IVAC чи автоматичну альтернативу.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_09
draft_revision: 2
