id: RF-BURKITT-INFECTION-SCREENING
definition: >
  Active or latent infection requiring resolution / prophylaxis before
  initiating DA-EPOCH-R or CODOX-M/IVAC in Burkitt: HBsAg-positive
  (mandatory anti-CD20 → high HBV reactivation risk), anti-HBc-positive
  (occult HBV), HCV-RNA-positive, HIV-positive (high prevalence in Burkitt
  — endemic and sporadic), or active TB. EBV testing recommended (endemic
  Burkitt EBV-driven; informs prognostication).
definition_ua: >
  Активна або латентна інфекція, що потребує усунення перед початком
  DA-EPOCH-R або CODOX-M/IVAC при Burkitt: HBsAg+ (обов'язкове
  застосування анти-CD20 — високий ризик реактивації HBV), anti-HBc+
  (прихована HBV-інфекція), HCV-РНК+, ВІЛ+ (висока поширеність при
  Burkitt — ендемічна та спорадична форми), активний туберкульоз.
  Рекомендоване тестування на EBV (ендемічний Burkitt EBV-асоційований;
  інформує прогностичну оцінку).

trigger:
  type: lab_value
  any_of:
    - finding: "hbsag"
      value: "positive"
    - finding: "anti_hbc_total"
      value: "positive"
    - finding: "hcv_rna"
      value: "positive"
    - finding: "hiv_status"
      value: "positive"
    - finding: "active_tb"
      value: true

clinical_direction: hold

severity: critical
priority: 60
category: infection-screening

relevant_diseases:
  - DIS-BURKITT

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-ESMO-BURKITT-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  HBsAg+ → entecavir or tenofovir prophylaxis from –7d through +12mo
  post-last anti-CD20 (rituximab in DA-EPOCH-R or CODOX-M/IVAC + R).
  HIV+ Burkitt: 25-40% of adult Burkitt is HIV-associated. Use full-dose
  DA-EPOCH-R per CALGB 50202 / Sparano subgroup — HIV-Burkitt outcomes
  approach HIV-negative when ART optimized. Active TB: full anti-TB
  course before chemoimmuno when feasible (Burkitt is so rapid that
  delays risk progression — MDT decision). PJP prophylaxis (TMP-SMX)
  during and 3-6 mo post-induction.
notes_ua: >
  HBsAg+ → профілактика ентекавіром або тенофовіром від –7 днів до
  +12 міс після останнього введення анти-CD20 (ритуксимаб у складі
  DA-EPOCH-R або CODOX-M/IVAC + R). HIV+ Burkitt: 25-40% дорослих
  випадків Burkitt асоційовані з ВІЛ. Застосовується повнодозова
  DA-EPOCH-R за даними CALGB 50202 / підгрупи Sparano — результати
  лікування HIV-асоційованого Burkitt наближаються до ВІЛ-негативних
  за умови оптимізованої АРТ. Активний туберкульоз: повний курс
  протитуберкульозної терапії перед хіміоімунотерапією, якщо це
  можливо (Burkitt прогресує настільки швидко, що затримка підвищує
  ризик прогресування — рішення приймається на МДТ). Профілактика PJP
  (ко-тримоксазол/TMP-SMX) під час та протягом 3-6 міс після індукції.
