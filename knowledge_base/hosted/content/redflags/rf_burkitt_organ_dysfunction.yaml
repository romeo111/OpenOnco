id: RF-BURKITT-ORGAN-DYSFUNCTION
definition: >
  Baseline organ dysfunction precluding HD-MTX-containing CODOX-M/IVAC or
  full-dose DA-EPOCH-R in Burkitt lymphoma: CrCl <50 (HD-methotrexate
  contraindicated, Burkitt CNS-prophylaxis-mandatory disease), LVEF <50%
  (anthracycline contraindicated), bilirubin >3× ULN (vincristine /
  doxorubicin / methotrexate metabolism), or pulmonary DLCO <60%.
definition_ua: >
  Базова дисфункція органів, що перешкоджає застосуванню HD-MTX-вмісного
  CODOX-M/IVAC чи повнодозової DA-EPOCH-R при Burkitt: CrCl <50
  (високодозовий метотрексат протипоказаний, хоча профілактика ураження
  ЦНС обов'язкова незалежно), LVEF <50% (протипоказання до
  антрацикліну), білірубін >3× ULN (порушує метаболізм вінкристину /
  доксорубіцину / MTX), DLCO <60%.

trigger:
  type: lab_value
  any_of:
    - finding: "creatinine_clearance_ml_min"
      threshold: 50
      comparator: "<"
    - finding: "lvef_percent"
      threshold: 50
      comparator: "<"
    - finding: "bilirubin_ratio_to_uln"
      threshold: 3
      comparator: ">="
    - finding: "dlco_percent"
      threshold: 60
      comparator: "<"

clinical_direction: de-escalate

severity: major
priority: 80
category: organ-dysfunction

relevant_diseases:
  - DIS-BURKITT
sources:
  - SRC-NCCN-BCELL-2025
  - SRC-ESMO-BURKITT-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  Burkitt is curable but CODOX-M/IVAC and HD-MTX require strict renal
  function (≥50 mL/min for HD-MTX systemic; ≥60 preferred). CrCl <50 →
  shift to DA-EPOCH-R (no HD-MTX systemic; IT MTX still feasible) per
  Roschewski et al. NEJM 2020 NCI 9177 trial. LVEF <50%: substitute
  liposomal doxorubicin in DA-EPOCH-R, or pursue lower-intensity
  R-CHOP + IT MTX in palliative intent. CNS prophylaxis is mandatory
  in Burkitt regardless of dose intensity — IT MTX/cytarabine 4-8 doses.
notes_ua: >
  Burkitt виліковний, але CODOX-M/IVAC та високодозовий MTX вимагають
  збереженої ниркової функції (≥50 мл/хв для системного HD-MTX; ≥60
  мл/хв — оптимально). При CrCl <50 → перехід на DA-EPOCH-R (без
  системного HD-MTX; інтратекальний MTX залишається можливим) за
  даними дослідження Roschewski et al. NEJM 2020 (NCI 9177). При
  LVEF <50%: заміна на ліпосомальний доксорубіцин у складі DA-EPOCH-R,
  або схема нижчої інтенсивності R-CHOP + інтратекальний MTX з
  паліативною метою. Профілактика ураження ЦНС обов'язкова при
  Burkitt незалежно від інтенсивності дози — 4-8 введень
  інтратекального MTX/цитарабіну.
