id: RF-CASCADE-BRCA-FDR-POSITIVE
definition: >-
  A first-degree relative of the patient (parent, sibling, or child) has
  a documented positive germline test result for BRCA1 or BRCA2 — the
  canonical HBOC (Hereditary Breast and Ovarian Cancer) spectrum genes.
  The patient themself has NOT yet been germline-tested and has no
  current personal cancer diagnosis. Per autosomal-dominant inheritance,
  the patient carries a **50% prior probability** of also being a BRCA
  carrier — far higher than the ~5-10% positive yield of pedigree-only
  testing populations — providing strong clinical motivation for cascade
  germline testing. Distinct from RF-BRCA-HBOC-FAMILY-HISTORY-SUSPICION
  (fires on pedigree pattern alone, before any relative has tested
  positive) and from RF-BRCA-CONFIRMED-CARRIER (fires after the
  patient's own positive germline test). Prevention-persona RedFlag
  (§20, v0.2-B cascade-testing pilot 2026-05-19).
definition_ua: >-
  Родич першого ступеня пацієнта (батько/мати, рідний брат/сестра або
  дитина) має задокументований позитивний germline test на BRCA1 або
  BRCA2 — канонічні гени HBOC (Hereditary Breast and Ovarian Cancer)
  спектру. Сам пацієнт ще не пройшов germline тестування і не має
  поточного особистого діагнозу раку. За аутосомно-домінантним типом
  успадкування пацієнт має **50% апріорну ймовірність** також бути
  носієм BRCA — суттєво вище за ~5-10% позитив у популяціях родовідної
  підозри — що забезпечує сильну клінічну мотивацію для cascade
  germline тестування. Відрізняється від
  RF-BRCA-HBOC-FAMILY-HISTORY-SUSPICION (спрацьовує на родовід до
  позитиву родича) та від RF-BRCA-CONFIRMED-CARRIER (спрацьовує після
  власного позитиву пацієнта). Prevention-persona RedFlag (§20, v0.2-B
  cascade-testing пілот 2026-05-19).

