notes: >
  v0.2-B cascade-testing pilot (2026-05-19). Fires when a first-degree
  relative (FDR — parent, sibling, child) of an asymptomatic patient
  has a confirmed positive germline test for BRCA1 or BRCA2. Engine
  routes to PreventionPlan recommending:
    (a) IND-CASCADE-BRCA-FDR-POSITIVE-TESTING (standard) — cascade
        BRCA1 / BRCA2 site-specific (familial-variant) testing for the
        patient + pre/post-test genetic counseling, with a low
        threshold to expand to a multi-gene HBOC panel (PALB2, CHEK2,
        ATM, RAD51C/D, BRIP1) if the family phenotype is suggestive of
        a broader hereditary contribution beyond the single relative's
        variant.
    (b) IND-CASCADE-BRCA-FDR-POSITIVE-SURVEILLANCE (alternative) —
        empirical enhanced surveillance per the carrier protocol
        (annual breast MRI from age 25, mammogram from 30, TVUS +
        CA-125 q6mo from 30-35 framed honestly as suboptimal) for
        patients who decline cascade germline testing.

  **50% prior probability** in autosomal-dominant inheritance (one
  parent heterozygous) is the cornerstone of cascade-testing
  cost-effectiveness — vastly outperforms pedigree-only HBOC-suspicion
  populations and supports the strong recommendation to test rather
  than rely on phenotype.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1
  dev-mode exemption.

  Penetrance reference (NCCN Genetic / Familial High-Risk: Breast,
  Ovarian, Pancreatic v2.2025) — if the patient tests positive on
  cascade:
    - Breast (women): BRCA1 ~55-72% lifetime; BRCA2 ~45-69%
    - Ovarian (women): BRCA1 ~39-44%; BRCA2 ~11-17%
    - Male breast: BRCA2 ~6.8%; BRCA1 ~1-5%
    - Pancreatic (PDAC): BRCA2 ~5-10%; BRCA1 ~2-3%
    - Prostate (men): BRCA2 ~20-30% high-grade / metastatic

  Site-specific (familial-variant) testing carries the highest
  positive predictive value and lowest VUS rate per ACMG / ASCO
  cascade testing guidance — the relative's variant is already
  classified, so the patient's result is unambiguous.
