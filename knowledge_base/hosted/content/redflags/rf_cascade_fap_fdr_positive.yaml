id: RF-CASCADE-FAP-FDR-POSITIVE
definition: >-
  A first-degree relative of the patient (parent, sibling, or child) has
  a documented positive germline test result for the APC gene
  (familial adenomatous polyposis — FAP, including the attenuated AFAP
  and Gardner variants). The patient themself has NOT yet been
  germline-tested and has no current personal cancer diagnosis. Per
  autosomal-dominant inheritance, the patient (regardless of current
  age — including pediatric patients) carries a **50% prior
  probability** of also being an APC carrier. Because classic FAP
  surveillance begins at **age 10-12 (annual sigmoidoscopy)** and
  classic FAP carries near-100% lifetime CRC risk by age 40 without
  colectomy, the cascade-testing question is time-critical in pediatric
  first-degree relatives. Distinct from RF-FAP-FAMILY-HISTORY-SUSPICION
  (fires on pedigree pattern alone, before any relative has tested
  positive) and from RF-FAP-CONFIRMED-CARRIER (fires after the
  patient's own positive germline test). Prevention-persona RedFlag
  (§20, v0.2-B cascade-testing pilot 2026-05-19) — severity=critical
  given the childhood-onset surveillance dependency and the
  near-100% CRC penetrance of classic FAP.
definition_ua: >-
  Родич першого ступеня пацієнта (батько/мати, рідний брат/сестра або
  дитина) має задокументований позитивний germline test на ген APC
  (сімейний аденоматозний поліпоз — FAP, включаючи attenuated AFAP та
  Gardner варіанти). Сам пацієнт ще не пройшов germline тестування і
  не має поточного особистого діагнозу раку. За аутосомно-домінантним
  типом успадкування пацієнт (незалежно від поточного віку —
  включаючи педіатричних пацієнтів) має **50% апріорну ймовірність**
  також бути носієм APC. Оскільки surveillance класичного FAP
  починається у **10-12 років (щорічна сигмоїдоскопія)** і класичний
  FAP має майже-100% lifetime ризик КРР до 40 років без колектомії,
  питання cascade тестування є час-критичним у педіатричних родичів
  першого ступеня. Відрізняється від RF-FAP-FAMILY-HISTORY-SUSPICION
  (спрацьовує на родовід до позитиву родича) та від
  RF-FAP-CONFIRMED-CARRIER (спрацьовує після власного позитиву
  пацієнта). Prevention-persona RedFlag (§20, v0.2-B cascade-testing
  пілот 2026-05-19) — severity=critical через childhood-onset
  surveillance dependency та майже-100% CRC пенетрантність
  класичного FAP.

