# brief (~100% lifetime risk in classic FAP without colectomy).
# Duodenal adenocarcinoma anchored via DIS-PDAC as closest upper-GI
# anchor (no DIS-DUODENAL entity); gastric fundic-gland polyposis;
# prostate modestly elevated.
