notes: >
  v0.2-B cascade-testing pilot (2026-05-19). Fires when a first-degree
  relative (FDR — parent, sibling, child) of an asymptomatic patient
  has a confirmed positive germline test for APC. Engine routes to
  PreventionPlan recommending:
    (a) IND-CASCADE-FAP-FDR-POSITIVE-TESTING (standard) — cascade
        site-specific (familial-variant) APC testing for the patient
        **from age 10-12** (childhood-onset surveillance dependency).
        Pre/post-test counseling addresses childhood-onset
        sigmoidoscopy initiation in classic FAP, lifetime CRC risk,
        and prophylactic colectomy timing in late teens / early 20s.
        Modern multi-gene panels include MUTYH for MAP differential
        (autosomal-recessive vs autosomal-dominant FAP).
    (b) IND-CASCADE-FAP-FDR-POSITIVE-SURVEILLANCE (alternative) —
        empirical sigmoidoscopy from age 10-12 per InSiGHT FAP
        protocol for patients who decline cascade germline testing,
        applied as if classic FAP were confirmed until testing
        settles the question. Upper-GI EGD q1-3y from age 25-30 also
        applied empirically.

  **50% prior probability** in autosomal-dominant inheritance (one
  parent heterozygous) — combined with the time-critical childhood
  surveillance start and the near-100% CRC penetrance of classic FAP
  — makes this one of the highest-stakes cascade scenarios in
  pediatric oncology prevention. Severity=critical reflects the
  combination of penetrance + surveillance window.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1
  dev-mode exemption.

  Penetrance reference (NCCN Genetic/Familial High-Risk: Colorectal
  v2.2025) — if the patient tests positive on cascade:
    - CRC: ~100% by age 40 in classic FAP without colectomy;
      ~70-80% by age 80 in attenuated FAP.
    - Duodenal adenocarcinoma: ~5-10% lifetime (post-colectomy
      leading mortality).
    - Gastric fundic-gland polyposis: ~30-50% (most benign).
    - Desmoid tumors: ~10-20% lifetime, often post-surgical.
    - Thyroid (papillary cribriform-morular variant): ~1-2%.
    - Hepatoblastoma in children of FAP families: ~1-2% under age 5.
    - CNS (medulloblastoma — Turcot variant): rare.

  Site-specific (familial-variant) testing carries the highest
  positive predictive value and lowest VUS rate per ACMG / ASCO
  cascade testing guidance.

  **Pediatric cascade testing:** classic FAP is one of the few
  hereditary cancer syndromes where pediatric germline testing is
  the standard of care, because surveillance and surgical decisions
  begin in childhood. Pre-test counseling addresses pediatric-
  specific informed consent + assent (developmental-stage
  appropriate) framework, parental decision-making, and the
  positive-result emotional support pathway. Attenuated FAP (AFAP)
  has later surveillance start (age 18-20) and gives families more
  flexibility on cascade-testing timing.
