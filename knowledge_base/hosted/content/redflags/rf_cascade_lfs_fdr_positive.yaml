id: RF-CASCADE-LFS-FDR-POSITIVE
definition: >-
  A first-degree relative of the patient (parent, sibling, or child) has
  a documented positive germline test result for TP53 (Li-Fraumeni
  Syndrome — one of the most penetrant hereditary cancer syndromes
  known). The patient themself has NOT yet been germline-tested and has
  no current personal cancer diagnosis. Per autosomal-dominant
  inheritance, the patient carries a **50% prior probability** of also
  being a TP53 carrier — combined with the ~70-90% lifetime cancer
  risk of confirmed TP53 carriers and the radiation-avoidance
  implications of confirmed carrier status — this is one of the
  highest-stakes cascade-testing scenarios in clinical oncology
  prevention. Distinct from RF-LI-FRAUMENI-FAMILY-HISTORY-SUSPICION
  (fires on Chompret / classic LFS pedigree criteria before any
  relative has tested positive). Prevention-persona RedFlag (§20,
  v0.2-B cascade-testing pilot 2026-05-19).
definition_ua: >-
  Родич першого ступеня пацієнта (батько/мати, рідний брат/сестра або
  дитина) має задокументований позитивний germline test на TP53
  (синдром Li-Fraumeni — один з найбільш пенетрантних спадкових
  онкосиндромів). Сам пацієнт ще не пройшов germline тестування і не
  має поточного особистого діагнозу раку. За аутосомно-домінантним
  типом успадкування пацієнт має **50% апріорну ймовірність** також
  бути носієм TP53 — у поєднанні з ~70-90% lifetime ризиком раку у
  підтверджених TP53-носіїв та radiation-avoidance імплікаціями
  статусу підтвердженого носія — це один з найбільш high-stakes
  сценаріїв cascade тестування у клінічній онкологічній профілактиці.
  Відрізняється від RF-LI-FRAUMENI-FAMILY-HISTORY-SUSPICION
  (спрацьовує на критерії Chompret / classic LFS до позитиву родича).
  Prevention-persona RedFlag (§20, v0.2-B cascade-testing пілот
  2026-05-19).

trigger:
  type: lab_value
  any_of:
    - finding: "family_first_degree_relative_lfs_carrier_confirmed"
      value: true

clinical_direction: investigate

severity: major
priority: 100
category: other

# §20 prevention extension — drives engine routing to PreventionPlan
# when patient carries this RF and no confirmed Disease (KSS §20.2).
risk_category: genetic

# LFS-spectrum cancers in KB. Breast is the primary risk anchor per
# task brief (commonest LFS-spectrum cancer in adults, mean dx age
# ~33y in confirmed carriers). Sarcoma, AML, GBM included.
# Adrenocortical carcinoma, choroid plexus carcinoma, osteosarcoma do
# not have dedicated DIS-* entities in current KB.
relevant_diseases:
  - DIS-BREAST
  - DIS-SOFT-TISSUE-SARCOMA
  - DIS-AML
  - DIS-GBM

shifts_algorithm: []

