notes: >
  v0.2-B cascade-testing pilot (2026-05-19). Fires when a first-degree
  relative (FDR — parent, sibling, child) of an asymptomatic patient
  has a confirmed positive germline test for TP53 (Li-Fraumeni
  Syndrome). Engine routes to PreventionPlan recommending:
    (a) IND-CASCADE-LFS-FDR-POSITIVE-TESTING (standard) — cascade
        site-specific (familial-variant) TP53 testing for the patient
        + intensive pre/post-test genetic counseling addressing the
        substantial psychological burden of LFS (lifetime cancer risk
        approaches 100%; pediatric onset possible). De novo TP53
        mutations occur — multi-gene panel expansion is appropriate
        if site-specific testing is negative and clinical suspicion
        persists.
    (b) IND-CASCADE-LFS-FDR-POSITIVE-SURVEILLANCE (alternative) —
        empirical Toronto-protocol surveillance (annual whole-body
        MRI + brain MRI + breast MRI from age 20-25 in women +
        colonoscopy q2-5y from age 25 + dermatology + RADIATION
        AVOIDANCE for diagnostics) for patients who decline cascade
        germline testing.

  **50% prior probability** in autosomal-dominant inheritance (one
  parent heterozygous) — combined with the extreme penetrance of TP53
  pathogenic variants — makes this the highest-priority cascade
  scenario by absolute lifetime risk burden.

  **RADIATION AVOIDANCE caveat (critical, if patient tests positive):**
  Confirmed TP53 carriers have documented elevated risk of
  radiation-induced secondary cancers in the treatment field.
  Diagnostic radiation (CT, mammography, X-ray) is minimized in favor
  of MRI / ultrasound when feasible. Therapeutic radiation for index
  cancers in TP53 carriers requires multidisciplinary discussion of
  alternatives. This applies AFTER confirmation — for the pre-cascade
  patient under this RedFlag, standard imaging is acceptable; the
  caveat motivates expedited cascade testing.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1
  dev-mode exemption.

  Penetrance reference (Mai et al. NCI consortium; Bougeard 2015) —
  if the patient tests positive on cascade:
    - Lifetime cumulative cancer risk: ~70% by age 50 in men, ~90%
      by age 50 in women; ≥90% lifetime in both sexes.
    - Breast (women): ~54% by age 70; mean dx age ~33y.
    - Soft-tissue sarcoma: ~15% lifetime.
    - CNS tumor: ~10-15% lifetime.
    - Adrenocortical carcinoma: ~6-13% lifetime (much higher in
      childhood).
    - Multiple primary cancers in lifetime: ~50%.

  **Psychological burden caveat:** LFS cascade testing must explicitly
  address that confirmed carrier status carries lifetime cancer risk
  approaching 100%, with resource-intensive and anxiety-provoking
  surveillance. Pre-test counseling must connect patients to
  LFS-specific support resources (LFS Association, Living LFS).

  Site-specific (familial-variant) testing carries the highest
  positive predictive value and lowest VUS rate per ACMG / ASCO
  cascade testing guidance.
