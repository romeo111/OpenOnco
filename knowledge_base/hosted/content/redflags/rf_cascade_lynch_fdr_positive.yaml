id: RF-CASCADE-LYNCH-FDR-POSITIVE
definition: >-
  A first-degree relative of the patient (parent, sibling, or child) has
  a documented positive germline test result for a Lynch syndrome
  (MMR / EPCAM) gene — MLH1, MSH2, MSH6, PMS2, or EPCAM (3' deletion
  silencing MSH2). The patient themself has NOT yet been germline-tested
  and has no current personal cancer diagnosis. Per autosomal-dominant
  inheritance, the patient carries a **50% prior probability** of also
  being a Lynch carrier — substantially higher than the ~15-25% positive
  yield of pedigree-suspicion testing — providing strong clinical
  motivation for cascade germline testing. Distinct from
  RF-LYNCH-FAMILY-HISTORY-SUSPICION (fires on phenotype / pedigree
  pattern alone, before any relative has tested positive) and from
  RF-LYNCH-CONFIRMED-CARRIER (fires after the patient's own positive
  germline test). Prevention-persona RedFlag (§20, v0.2-B
  cascade-testing pilot 2026-05-19).
definition_ua: >-
  Родич першого ступеня пацієнта (батько/мати, рідний брат/сестра або
  дитина) має задокументований позитивний результат germline тестування
  на ген синдрому Lynch (MMR / EPCAM) — MLH1, MSH2, MSH6, PMS2 або
  EPCAM (3' делеція, що замовчує MSH2). Сам пацієнт ще не пройшов
  germline тестування і не має поточного особистого діагнозу раку. За
  аутосомно-домінантним типом успадкування пацієнт має **50%
  апріорну ймовірність** також бути носієм Lynch — суттєво вище за
  ~15-25% позитивний результат тестування за родовідною підозрою —
  що забезпечує сильну клінічну мотивацію для cascade germline
  тестування. Відрізняється від RF-LYNCH-FAMILY-HISTORY-SUSPICION
  (спрацьовує на фенотип / pedigree pattern до позитиву родича) та
  від RF-LYNCH-CONFIRMED-CARRIER (спрацьовує після власного позитиву
  пацієнта). Prevention-persona RedFlag (§20, v0.2-B
  cascade-testing пілот 2026-05-19).

