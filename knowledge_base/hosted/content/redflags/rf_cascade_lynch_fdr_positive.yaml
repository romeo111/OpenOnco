notes: >
  v0.2-B cascade-testing pilot (2026-05-19). Fires when a first-degree
  relative (FDR — parent, sibling, child) of an asymptomatic patient
  has a confirmed positive germline test for an MMR / EPCAM gene.
  Engine routes to PreventionPlan recommending:
    (a) IND-CASCADE-LYNCH-FDR-POSITIVE-TESTING (standard) — cascade
        germline MMR / EPCAM panel testing for the patient + pre/
        post-test genetic counseling. The known familial variant
        anchors site-specific (single-variant) testing as the most
        efficient first-line option, with expansion to full-gene
        sequencing if site-specific is negative and high suspicion
        persists.
    (b) IND-CASCADE-LYNCH-FDR-POSITIVE-SURVEILLANCE (alternative) —
        empirical enhanced surveillance per the carrier protocol for
        patients who decline cascade germline testing for any reason
        (cost, insurance, psychological, family privacy).

  **50% prior probability** in autosomal-dominant inheritance (one
  parent heterozygous) is the cornerstone of cascade-testing
  cost-effectiveness — vastly outperforms pedigree-suspicion
  populations (~15-25% positive yield) and supports the strong
  recommendation to test rather than rely on phenotype.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1
  dev-mode exemption.

  Penetrance reference (NCCN Genetic / Familial High-Risk: Colorectal
  v2.2025) — if the patient tests positive on cascade:
    - CRC lifetime risk: ~70-80% (MLH1 / MSH2); ~25-50% (MSH6 / PMS2)
    - Endometrial (women): ~40-60% (MLH1 / MSH2); ~17-44% (MSH6)
    - Gastric: ~6-13%; Ovarian: ~4-20%; Urothelial: ~4-25%;
      Pancreas: ~3-6%

  Site-specific (familial-variant) testing carries the highest
  positive predictive value and lowest VUS rate per ACMG / ASCO
  cascade testing guidance — the relative's variant is already
  classified, so the patient's result is unambiguous.
