id: RF-CERVICAL-FRAILTY-AGE
definition: >
  Frailty profile precluding standard cisplatin-based chemoradiation in
  cervical cancer: ECOG ≥3, OR (age ≥75 with Charlson ≥3), OR composite
  (age ≥70 + albumin <3.0 + ≥2 comorbidities). Routes to carboplatin-CRT
  substitution or RT-alone (less efficacy but tolerable).
definition_ua: >
  Профіль frailty, що перешкоджає стандартній хіміопроменевій терапії
  (CRT) на основі цисплатину при раку шийки матки: ECOG ≥3, АБО (вік ≥75
  з Charlson ≥3), АБО композитний профіль (вік ≥70 + альбумін <3.0 +
  ≥2 коморбідності). Веде до заміни на карбоплатин-CRT або проведення
  лише променевої терапії (нижча ефективність, але переноситься краще).

trigger:
  type: composite_score
  any_of:
    - finding: "ecog"
      threshold: 3
      comparator: ">="
    - all_of:
        - finding: "age"
          threshold: 75
          comparator: ">="
        - finding: "charlson_score"
          threshold: 3
          comparator: ">="
    - all_of:
        - finding: "age"
          threshold: 70
          comparator: ">="
        - finding: "albumin_g_dl"
          threshold: 3.0
          comparator: "<"
        - finding: "comorbidity_count"
          threshold: 2
          comparator: ">="

clinical_direction: de-escalate

severity: major
priority: 100
category: frailty-age

relevant_diseases:
  - DIS-CERVICAL
sources:
  - SRC-NCCN-CERVICAL-2025
  - SRC-ESMO-CERVICAL-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  Cisplatin radiosensitizer requires CrCl ≥60 — elderly often fall below.
  Carboplatin-CRT (AUC 2 weekly) is acceptable substitute when cisplatin
  intolerable, though less radiosensitizing per non-randomized comparisons.
  Frail elderly with severe comorbidity: RT-alone (≥80 Gy total to point A
  via brachytherapy boost) preserves curative intent without chemo
  toxicity — 5y OS lower (~50% vs ~70% for CRT in stage III) but
  meaningful palliation. Avoid bevacizumab in elderly with HTN / vascular
  disease.
notes_ua: >
  Цисплатин як радіосенсибілізатор потребує CrCl ≥60 — у пацієнтів
  похилого віку цей показник часто нижчий. Карбоплатин-CRT (AUC 2
  щотижня) є прийнятною заміною за непереносимості цисплатину, хоча за
  даними нерандомізованих порівнянь має меншу радіосенсибілізуючу дію.
  У пацієнтів похилого віку з тяжкою frailty та значною коморбідністю:
  проведення лише променевої терапії (сумарно ≥80 Гр у точці A з
  бустом брахітерапії) зберігає курабельний намір без токсичності
  хіміотерапії — 5-річна ЗВ нижча (~50% проти ~70% для CRT при
  III стадії), однак забезпечує суттєвий паліативний ефект. Уникати
  бевацизумабу у пацієнтів похилого віку з артеріальною гіпертензією /
  судинними захворюваннями.
