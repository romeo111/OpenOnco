id: RF-CERVICAL-INFECTION-SCREENING
definition: >
  Active or unmanaged infection requiring resolution before initiating
  cisplatin-based chemoradiation in cervical cancer: HIV-positive (HPV-driven
  disease — almost universal HIV testing recommended; CD4 informs cisplatin
  dosing and pelvic-RT field tolerance), HBV-positive (reactivation risk on
  prolonged chemoradiation), active pelvic abscess / pyometra (must drain
  before RT), or active TB.
definition_ua: >
  Активна або неконтрольована інфекція, що потребує усунення перед
  початком цисплатин-CRT при раку шийки матки: ВІЛ+ (HPV-асоційоване
  захворювання — тестування на ВІЛ рекомендоване практично універсально;
  CD4 впливає на дозування цисплатину і переносимість тазового
  опромінення), HBV+ (ризик реактивації на тлі тривалої CRT), активний
  абсцес малого тазу / піометра (дренування до початку RT), активний
  туберкульоз.

trigger:
  type: lab_value
  any_of:
    - finding: "hiv_status"
      value: "positive"
    - finding: "hbsag"
      value: "positive"
    - finding: "active_pelvic_infection"
      value: true
    - finding: "active_tb"
      value: true

clinical_direction: hold

severity: major
priority: 60
category: infection-screening

relevant_diseases:
  - DIS-CERVICAL

sources:
  - SRC-NCCN-CERVICAL-2025
  - SRC-ESMO-CERVICAL-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  HIV testing recommended for all cervical cancer patients per NCCN
  (HPV / HIV co-infection extremely common). HIV+ patients tolerate
  cisplatin-CRT with ART optimization; CD4 <200 is relative contraindication
  — coordinate with HIV clinic. HBV+: entecavir/tenofovir prophylaxis
  during prolonged chemo phases. Pelvic abscess / pyometra: percutaneous
  drainage / antibiotics first; RT into infected field worsens necrosis.
  This RF surfaces workup-prerequisites; engine does not switch indication.
notes_ua: >
  Тестування на ВІЛ рекомендоване для всіх пацієнтів з раком шийки
  матки за NCCN (ко-інфекція HPV / ВІЛ трапляється надзвичайно часто).
  ВІЛ-позитивні пацієнти переносять цисплатин-CRT за умови оптимізованої
  АРТ; CD4 <200 є відносним протипоказанням — потребує узгодження зі
  спеціалістом з ВІЛ-інфекції. HBV+: профілактика ентекавіром/тенофовіром
  протягом усього періоду хіміотерапії. Абсцес малого тазу / піометра:
  спочатку черезшкірне дренування / антибіотикотерапія; опромінення
  інфікованого поля погіршує некроз. Цей RF відображає передумови
  обстеження; рушій не змінює показання до лікування.
