id: RF-CHEK2-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic monoallelic variant
  in CHEK2. Most common population variant is c.1100delC truncating
  loss-of-function (~1.5% European population frequency); other
  pathogenic variants include c.444+1G>A (splice), p.Ile157Thr (missense
  with modest effect), and large deletions. Heterozygous CHEK2 carriers
  have moderate-penetrance breast cancer risk (RR ~2.0-3.0; lifetime
  ~20-30% for truncating variants, lower for missense), modest CRC risk
  (RR ~1.5-2.0; lifetime ~5-10% over baseline), prostate cancer (RR
  ~2-3 with high-grade enrichment for c.1100delC), thyroid cancer
  (smaller signal). Most common moderate-penetrance variant in multi-
  gene panels among European-ancestry cohorts. Patient has confirmed
  positive germline test; no current personal cancer diagnosis in the
  carrier being assessed. Prevention-persona RedFlag (§20, v0.3
  moderate-penetrance breast gene expansion).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний
  monoallelic варіант у CHEK2. Найпоширеніший population variant —
  c.1100delC truncating loss-of-function (~1.5% European population
  frequency); інші pathogenic variants — c.444+1G>A (splice),
  p.Ile157Thr (missense з modest effect), large deletions. Heterozygous
  CHEK2 carriers мають moderate-penetrance breast cancer ризик (RR
  ~2.0-3.0; lifetime ~20-30% для truncating variants), modest CRC ризик
  (RR ~1.5-2.0; lifetime ~5-10% over baseline), prostate cancer (RR
  ~2-3 з high-grade enrichment для c.1100delC), thyroid cancer (менший
  signal). Найпоширеніший moderate-penetrance variant у multi-gene
  panels серед European-ancestry cohorts. Prevention-персона RedFlag
  (§20, v0.3 moderate-penetrance breast gene expansion).

