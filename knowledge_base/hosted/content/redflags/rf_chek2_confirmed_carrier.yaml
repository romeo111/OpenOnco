notes: >
  Prevention-persona RedFlag for CHEK2 heterozygous carriers. Risk
  estimates vary substantially by variant: truncating > splice >
  missense. Engine routes to enhanced breast surveillance (annual
  mammography from age 40 + MRI consideration), modestly tightened CRC
  screening (colonoscopy from age 40 with q5y interval per NCCN), and
  prostate awareness from age 40-45 for males with c.1100delC. STUB
  pending two-Co-Lead signoff per CHARTER §6.1 dev-mode.
