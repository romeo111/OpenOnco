notes: >
  v0.3 Wave M suspicion variant — pre-testing family-history-
  suspicion counterpart to RF-CHEK2-CONFIRMED-CARRIER. Fires when
  family pedigree pattern suggests CHEK2 carrier state but germline
  panel testing has not yet been completed. Standard pathway =
  referral for genetic counseling + multi-gene panel testing
  covering BRCA1/2 + relevant moderate-penetrance genes (CHEK2 is
  on every HBOC panel; if CRC family history dominates, an
  expanded CRC-inclusive panel covering Lynch + APC + MUTYH should
  be ordered). If panel returns positive for CHEK2, the patient
  transitions to the RF-CHEK2-CONFIRMED-CARRIER pathway with
  variant-specific surveillance (truncating > splice > missense
  risk tiers). Distinct trigger findings from the confirmed-
  carrier RF (carrier RF fires on `germline_chek2_pathogenic_
  variant_confirmed` / `germline_chek2_1100delc_confirmed`;
  suspicion RF fires on family-history-based findings only).
  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1
  dev-mode.
