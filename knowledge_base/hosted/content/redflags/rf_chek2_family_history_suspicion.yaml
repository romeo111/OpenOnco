id: RF-CHEK2-FAMILY-HISTORY-SUSPICION
definition: >-
  Family pedigree pattern suggestive of germline CHEK2 heterozygous
  carrier state in an asymptomatic individual who has NOT yet had
  multi-gene panel testing. CHEK2 c.1100delC is one of the most
  common moderate-penetrance variants in European-ancestry populations
  (~1.5% carrier frequency). Triggers include any of (a) first- or
  second-degree relative with a confirmed CHEK2 pathogenic / likely-
  pathogenic variant (most commonly c.1100delC); (b) family-history
  cluster of breast cancer (moderate-penetrance ~RR 2-3) plus
  colorectal cancer in close relatives — a recognized CHEK2 multi-
  cancer signature; (c) family history of multiple high-grade
  prostate cancers (CHEK2 c.1100delC has documented high-grade /
  metastatic prostate enrichment); (d) Slavic/Baltic/Polish/Ashkenazi
  ancestry combined with personal or family history of breast,
  colorectal, prostate, or thyroid cancer — CHEK2 c.1100delC has
  elevated founder-mutation prevalence in these populations.
  No current personal cancer diagnosis in the at-risk individual
  being assessed. Prevention-persona RedFlag (§20, v0.3 moderate-
  penetrance breast gene expansion — pre-testing suspicion variant).
definition_ua: >-
  Сімейний родовід з патерном, що нагадує гермінативний heterozygous
  carrier CHEK2, у асимптомної особи, яка ще НЕ пройшла multi-gene
  panel тестування. CHEK2 c.1100delC — один з найпоширеніших
  moderate-penetrance варіантів у European-ancestry populations
  (~1.5% carrier frequency). Тригери включають будь-яке з (а) родич
  першого/другого ступеня з підтвердженим патогенним / ймовірно-
  патогенним варіантом CHEK2 (найчастіше c.1100delC); (б) сімейне
  накопичення раку молочної залози (moderate-penetrance ~RR 2-3)
  плюс колоректального раку у близьких родичів — визнана CHEK2
  multi-cancer signature; (в) сімейна історія множинних high-grade
  prostate раків (CHEK2 c.1100delC має задокументоване high-grade /
  metastatic prostate enrichment); (г) Slavic/Baltic/Polish/
  Ashkenazi походження у поєднанні з особистою або сімейною
  історією раку молочної залози, колоректального, простатичного
  або щитоподібної залози — CHEK2 c.1100delC має підвищену
  засновницьку поширеність у цих популяціях.
  Поточний особистий діагноз раку у пацієнта з ризиком відсутній.
  Prevention-персона RedFlag (§20, v0.3 — pre-testing suspicion
  варіант).

