id: RF-CHL-FRAILTY-AGE
definition: >
  Frailty profile precluding full-dose ABVD or A+AVD in classical Hodgkin
  lymphoma: ECOG ≥3, OR (age ≥60 with ≥2 comorbidities — elderly cHL has
  worse outcomes regardless of regimen), OR composite frailty (age ≥75 +
  Charlson ≥3 + albumin <3.5). Triggers de-escalation to AVD (omit
  bleomycin), VEPEMB (gem-vinorelbine-based), or BV-AVD.
definition_ua: >
  Профіль крихкості, що унеможливлює повнодозову ABVD або A+AVD при
  класичній лімфомі Ходжкіна: ECOG ≥3, АБО (вік ≥60 років у поєднанні
  з ≥2 супутніми захворюваннями — у пацієнтів похилого віку з cHL
  результати лікування гірші незалежно від режиму), АБО комбінована
  крихкість (вік ≥75 років + індекс Charlson ≥3 + альбумін <3.5).
  Зумовлює деескалацію до AVD (без блеоміцину), VEPEMB або BV-AVD.

trigger:
  type: composite_score
  any_of:
    - finding: "ecog"
      threshold: 3
      comparator: ">="
    - all_of:
        - finding: "age"
          threshold: 60
          comparator: ">="
        - finding: "comorbidity_count"
          threshold: 2
          comparator: ">="
    - all_of:
        - finding: "age"
          threshold: 75
          comparator: ">="
        - finding: "charlson_score"
          threshold: 3
          comparator: ">="
        - finding: "albumin_g_dl"
          threshold: 3.5
          comparator: "<"

clinical_direction: de-escalate

severity: major
priority: 100
category: frailty-age

relevant_diseases:
  - DIS-CHL
sources:
  - SRC-NCCN-BCELL-2025
  - SRC-ESMO-HODGKIN-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  Elderly cHL (>60y) outcomes substantially worse — bleomycin pulmonary
  toxicity disproportionately high (>20% pneumonitis with BLEO in age
  ≥60 per German Hodgkin trials); omit bleomycin or use BV substitution
  (A+AVD per ECHELON-1 elderly subgroup — favorable PFS without bleo
  pneumonitis). Frail / unfit: VEPEMB or BV-bendamustine combinations
  (palliative-curative balance). BEACOPP-escalated contraindicated >60y
  due to TRM. CGA-guided dose adjustment essential.
notes_ua: >
  У пацієнтів похилого віку (>60 років) з cHL результати лікування суттєво
  гірші — легенева токсичність блеоміцину непропорційно висока (пневмоніт
  >20% при застосуванні блеоміцину у віці ≥60 років за даними німецьких
  досліджень лімфоми Ходжкіна); блеоміцин слід пропустити або замінити на
  BV (A+AVD за даними підгрупи похилого віку ECHELON-1 — сприятлива
  виживаність без прогресування без блеоміцинового пневмоніту). Крихкі /
  функціонально неспроможні пацієнти: комбінації VEPEMB або
  BV-бендамустин (баланс паліативного та курабельного підходу).
  Ескальований BEACOPP протипоказаний у віці >60 років через ризик
  летальності, пов'язаної з лікуванням (TRM). Корекція дози за
  результатами комплексної геріатричної оцінки (CGA) є обов'язковою.
ukrainian_review_status: pending_clinical_signoff
