notes: >
  Chondrosarcoma metastasizes preferentially to lung — surveillance
  chest CT every 6–12 mo for ≥10 years standard. Pulmonary
  metastasectomy for oligometastatic disease yields long-term
  survival in ~30% of resected patients (extrapolated from sarcoma
  literature). Local recurrence post-resection rate is grade-dependent
  (10% grade I, 50% grade III) — re-biopsy mandatory because grade
  upgrade and dedifferentiation can change adjuvant strategy.
  Pathologic fracture requires en-bloc resection (pre-fracture
  curettage no longer adequate — tumor seeding through fracture
  hematoma). Ollier / Maffucci patients require lifetime imaging
  surveillance — ~25% lifetime malignant transformation risk.
notes_ua: >
  Хондросаркома метастазує переважно в легені — стандартом є контрольна
  КТ грудної клітки кожні 6–12 міс протягом ≥10 років. Метастазектомія
  легень при олігометастатичній хворобі забезпечує тривалу виживаність
  у ~30% прооперованих пацієнтів (за екстраполяцією з даних щодо сарком
  м'яких тканин). Частота локального рецидиву після резекції залежить
  від ступеня злоякісності (10% при grade I, 50% при grade III) —
  повторна біопсія обов'язкова, оскільки підвищення ступеня злоякісності
  та дедиференціація можуть змінити стратегію ад'ювантної терапії.
  Патологічний перелом вимагає en-bloc резекції (кюретаж до перелому
  більше не вважається адекватним — через обсіменіння пухлинними
  клітинами через гематому в зоні перелому). Пацієнти із синдромами
  Ollier / Maffucci потребують довічного візуалізаційного спостереження
  — довічний ризик малігнізації становить ~25%.
