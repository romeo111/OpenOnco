id: RF-CHRONIC-CIRRHOSIS-ETIOLOGY-AGNOSTIC-HCC-PREVENTION
definition: >-
  Established cirrhosis of any etiology (Child-Pugh A, B, or C) when
  the specific cause is either not yet classified, multi-factorial, or
  falls outside the dedicated etiology-specific RedFlags
  (RF-CHRONIC-HBV-MALIGNANCY-PREVENTION for chronic hepatitis B,
  RF-CHRONIC-HCV-NHL-PREVENTION for chronic hepatitis C, and any
  future dedicated RFs for chronic NAFLD/MASH, alpha-1 antitrypsin
  deficiency, hemochromatosis, Wilson disease, autoimmune hepatitis,
  primary biliary cholangitis, primary sclerosing cholangitis). This
  etiology-agnostic anchor exists because the AASLD HCC Guidance
  2023 endorses HCC surveillance in ALL cirrhotic patients regardless
  of underlying cause — the cirrhotic liver itself is the dominant
  HCC risk driver (annual HCC incidence ~1-4% across etiologies, far
  above population baseline ~0.001-0.01%). Surveillance with abdominal
  US ± AFP every 6 months reduces HCC-specific mortality through
  early-stage detection enabling curative-intent treatment (resection,
  ablation, transplant). Prevention-persona RedFlag — distinct from
  etiology-specific RFs by virtue of firing on the cirrhosis
  diagnosis itself rather than on a specific causal exposure.
definition_ua: >-
  Встановлений цироз будь-якої етіології (Child-Pugh A, B або C) коли
  специфічна причина або ще не класифікована, мультифакторна, або
  поза межами dedicated etiology-specific RedFlags (RF-CHRONIC-HBV,
  RF-CHRONIC-HCV, та майбутні dedicated RFs для chronic NAFLD/MASH,
  alpha-1 antitrypsin deficiency, hemochromatosis, Wilson, autoimmune
  hepatitis, PBC, PSC). Цей etiology-agnostic anchor існує тому що
  AASLD HCC Guidance 2023 endorses HCC surveillance у ВСІХ cirrhotic
  пацієнтів незалежно від underlying cause — cirrhotic liver сам по
  собі — dominant HCC risk driver (annual HCC incidence ~1-4% across
  etiologies, far above population baseline ~0.001-0.01%). Surveillance
  з abdominal US ± AFP кожні 6 місяців reduces HCC-specific mortality
  через early-stage detection що дозволяє curative-intent treatment
  (resection, ablation, transplant). Prevention-persona RedFlag —
  distinct від etiology-specific RFs тим, що fires на cirrhosis
  diagnosis сама по собі rather than на specific causal exposure.

