notes: >
  v0.3 wave-N niche pathway — etiology-agnostic cirrhosis HCC
  surveillance. Fires on documented cirrhosis (clinical diagnosis,
  biopsy-proven, or imaging-consistent advanced fibrosis F4) when
  the specific causal etiology is unclassified, multi-factorial, or
  outside the dedicated etiology-specific RFs. This is the workhorse
  RF for the substantial population of cirrhotic patients whose
  etiology is alcoholic (where we currently don't have a dedicated
  alcoholic-cirrhosis RF), NAFLD/MASH (no dedicated RF yet), mixed
  alcoholic-NAFLD, cryptogenic, or hemochromatosis / Wilson / A1AT /
  autoimmune hepatitis (each rare enough that they share this
  etiology-agnostic anchor).

  Engine routes to PreventionPlan recommending:
    (a) IND-CIRRHOSIS-HCC-SURVEILLANCE (standard) — abdominal US +
        AFP q6 months at center experienced with cirrhotic-liver
        imaging; alcohol abstinence; obesity management (NAFLD
        subset); etiology-specific treatment of underlying liver
        disease (HBV antivirals, HCV DAAs, weight loss for NAFLD,
        venesection for hemochromatosis, etc.) where applicable;
        nutrition + sarcopenia management; pre-transplant evaluation
        when MELD ≥15 or HCC found within Milan criteria.
    (b) IND-CIRRHOSIS-HCC-OBSERVATION (alternative) — symptom-driven
        evaluation only when US ± AFP surveillance is impractical
        (access, decompensation precluding transplant candidacy).
        Per CHARTER §11 patient-autonomy framing. Counsel sub-
        optimal vs. structured surveillance.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Source-set TODO: dedicated AASLD HCC Guidance 2023
  (Singal et al. Hepatology 2023) full citation; EASL HCC Guidelines
  2018 / forthcoming update; APASL HCC Consensus; Cancer Genome Atlas
  HCC etiology-stratified surveillance yield data; ongoing v0.3
  wave-N authoring backlog new SRC entities for etiology-agnostic
  cirrhosis HCC evidence base.

  AASLD HCC Guidance 2023 surveillance summary:
    - All cirrhotic patients regardless of etiology — surveillance
      indicated.
    - Modality: abdominal US ± AFP every 6 months. Sensitivity for
      early-stage HCC ~63% US-only, ~80% US+AFP. Specificity high.
    - Hepatobiliary MRI as second-line / problem-solving when US is
      technically inadequate (severe obesity, prior bariatric anatomy,
      severe ascites).
    - Decompensation (Child-Pugh C) without transplant candidacy →
      surveillance cessation may be appropriate (curative options
      lost; patient-autonomy + palliative-framing discussion).
    - Annual HCC incidence by etiology in F4 cirrhotics: HCV-treated
      ~2-4%, HBV ~3-4%, alcoholic ~1-2%, NAFLD ~1-2%, A1AT/
      hemochromatosis ~3-5%, PSC/PBC ~1-3%.
