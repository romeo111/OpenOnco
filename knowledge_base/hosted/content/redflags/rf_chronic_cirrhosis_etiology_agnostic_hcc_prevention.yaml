# HCC is the prevention target. Annual incidence in cirrhosis ~1-4%
# across all etiologies (higher in HCV-cured F4 cirrhotics ~2-4%,
# HBV cirrhotics ~3-4%, NAFLD cirrhotics ~1-2%, alcoholic cirrhotics
# ~1-2%). Surveillance with abdominal US ± AFP q6 months per AASLD
# HCC Guidance 2023 + EASL.
