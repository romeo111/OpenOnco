id: RF-CHRONIC-IBD-CROHNS-SPECIFIC-PREVENTION
definition: >-
  Crohn's disease (CD) with specific features that elevate cancer risk
  beyond the broader RF-IBD-CRC-PREVENTION (which covers UC and Crohn-
  colitis sharing colon-inflammation pathway). This Crohn-specific
  anchor captures the distinct cancer signals: (1) small bowel
  adenocarcinoma — Crohn's patients with chronic small-bowel
  inflammation (especially distal ileum) carry RR ~20-40 vs. population
  baseline for small bowel adenocarcinoma; absolute lifetime risk
  remains low (~0.5-2%) because small-bowel adenocarcinoma is rare at
  baseline, but Crohn's is one of the few definable high-risk cohorts
  worth flagging. (2) Lymphoma — Crohn's disease per se elevates
  lymphoma risk modestly (RR ~1.5-2 in immunosuppressant-naive
  cohorts; higher with anti-TNF + thiopurine combinations, but that
  iatrogenic signal is captured by RF-IATROGENIC-ANTI-TNF-LYMPHOMA-
  PREVENTION and RF-IATROGENIC-AZATHIOPRINE-LONGTERM-PREVENTION).
  (3) Colorectal cancer in extensive Crohn-colitis — captured by RF-
  IBD-CRC-PREVENTION; this Crohn-specific RF adds non-CRC signals
  on top of that overlap. Prevention-persona RedFlag — fires
  COMPLEMENTARY to (not in place of) RF-IBD-CRC-PREVENTION when the
  patient has Crohn's disease with small-bowel involvement.
