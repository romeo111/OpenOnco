  cohorts worth flagging. (2) Lymphoma — Crohn's per se elevates
  lymphoma risk modestly (RR ~1.5-2 у immunosuppressant-naive
  cohorts; higher з anti-TNF + thiopurine combinations, але цей
  iatrogenic signal captured by RF-IATROGENIC-ANTI-TNF-LYMPHOMA-
  PREVENTION + RF-IATROGENIC-AZATHIOPRINE-LONGTERM-PREVENTION).
  (3) Colorectal cancer у extensive Crohn-colitis — captured by RF-
