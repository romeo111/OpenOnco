notes: >
  Prevention-persona RedFlag for MASLD/NAFLD HCC risk. Cirrhotic MASLD
  meets AASLD HCC-surveillance threshold (US ± AFP q6mo). Non-cirrhotic
  advanced fibrosis is a gray zone — closer hepatology follow-up but
  not yet routine surveillance. Major actionable lever: weight loss +
  cardiometabolic management. STUB pending two-Co-Lead signoff per
  CHARTER §6.1 dev-mode.
