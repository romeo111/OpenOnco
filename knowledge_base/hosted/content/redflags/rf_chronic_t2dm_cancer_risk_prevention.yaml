notes: >
  Prevention-persona RedFlag for type-2 diabetes mellitus as multi-organ
  modest cancer risk amplifier. New-onset T2DM ≥50 with weight loss has
  ~1% absolute 3-year risk of pancreatic cancer — actionable
  surveillance signal (EUS or MR-pancreas in high-risk subset per ACG
  2022). Other cancer-risk contributions are background and modify
  population-screening adherence rather than triggering off-schedule
  imaging. STUB pending two-Co-Lead signoff per CHARTER §6.1 dev-mode.
