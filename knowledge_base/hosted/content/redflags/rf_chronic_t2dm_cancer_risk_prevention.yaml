id: RF-CHRONIC-T2DM-CANCER-RISK-PREVENTION
definition: >-
  Established type-2 diabetes mellitus (HbA1c ≥6.5% on two occasions, or
  established T2DM diagnosis on oral hypoglycemics/insulin) confers
  modest but reproducible increases in risk for several cancers: pancreatic
  adenocarcinoma (RR ~1.8-2.0; up to 2.5 for recent-onset T2DM aged >50,
  where new-onset T2DM may be a presenting feature of occult pancreatic
  cancer — Pannala et al. JAMA 2008), colorectal cancer (RR ~1.3-1.4),
  hepatocellular carcinoma in NAFLD/MASLD-driven cirrhosis (RR ~2-3
  multiplicative with NAFLD), endometrial cancer (RR ~2.1; particularly
  with obesity), and post-menopausal breast cancer (RR ~1.2-1.3).
  Putative mechanisms: hyperinsulinemia/IGF-1 axis, chronic inflammation,
  hyperglycemia favoring tumor metabolism, shared obesity/sedentary
  exposures. Risk modifiable: glycemic control, weight management,
  metformin (observational signal for reduced cancer incidence),
  physical activity. Prevention-persona RedFlag (§20 v0.4 chronic-
  condition expansion).
definition_ua: >-
  Established type-2 diabetes mellitus (HbA1c ≥6.5% на двох вимірах, або
  established T2DM з oral hypoglycemics/insulin) дає скромні, але
  відтворювані підвищення ризику для кількох cancers: pancreatic
  adenocarcinoma (RR ~1.8-2.0; до 2.5 для recent-onset T2DM віком >50,
  де new-onset T2DM може бути presenting feature occult pancreatic
  cancer — Pannala et al. JAMA 2008), colorectal cancer (RR ~1.3-1.4),
  hepatocellular carcinoma у NAFLD/MASLD-driven cirrhosis (RR ~2-3
  мультиплікативно з NAFLD), endometrial cancer (RR ~2.1; особливо з
  obesity), post-menopausal breast cancer (RR ~1.2-1.3). Putative
  механізми: hyperinsulinemia/IGF-1 axis, chronic inflammation,
  hyperglycemia, спільні obesity/sedentary експозиції. Ризик
  модифікований: glycemic control, weight management, metformin
  (observational signal), physical activity. Prevention-персона RedFlag
  (§20 v0.4 chronic-condition expansion).

