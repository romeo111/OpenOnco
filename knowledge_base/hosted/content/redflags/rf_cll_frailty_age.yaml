id: RF-CLL-FRAILTY-AGE
definition: >
  Frailty profile influencing CLL regimen selection: ECOG ≥3, OR (age ≥75
  with G8 ≤14), OR composite frailty (age ≥70 + Charlson ≥3 + albumin <3.5)
  — drives selection of fixed-duration V+O (CLL14) over continuous BTKi
  (better tolerability profile in elderly per ELEVATE-TN / SEQUOIA elderly
  subgroups), and absolutely contraindicates chemoimmuno (FCR/BR).
definition_ua: >
  Профіль кволості (frailty), що впливає на вибір режиму при ХЛЛ: ECOG ≥3,
  АБО (вік ≥75 з G8 ≤14), АБО композитна кволість (вік ≥70 + Charlson ≥3 +
  альбумін <3.5) — спрямовує вибір на фіксований курс V+O (CLL14) замість
  безперервної терапії BTKi (краща переносимість у пацієнтів похилого
  віку за підгрупами ELEVATE-TN / SEQUOIA), і абсолютно протипоказує
  хіміоімунотерапію (FCR/BR).

trigger:
  type: composite_score
  any_of:
    - finding: "ecog"
      threshold: 3
      comparator: ">="
    - all_of:
        - finding: "age"
          threshold: 75
          comparator: ">="
        - finding: "g8_score"
          threshold: 14
          comparator: "<="
    - all_of:
        - finding: "age"
          threshold: 70
          comparator: ">="
        - finding: "charlson_score"
          threshold: 3
          comparator: ">="
        - finding: "albumin_g_dl"
          threshold: 3.5
          comparator: "<"
    - finding: "cirs_score"
      threshold: 6
      comparator: ">"

clinical_direction: de-escalate

severity: major
priority: 100
category: frailty-age

relevant_diseases:
  - DIS-CLL
sources:
  - SRC-NCCN-BCELL-2025
  - SRC-ESMO-CLL-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  CIRS (Cumulative Illness Rating Scale) >6 = "unfit" per CLL11 / CLL14
  trial criteria — drives choice of obinutuzumab + venetoclax over
  chemoimmuno. Continuous BTKi (acalabrutinib, zanubrutinib) is also
  appropriate but requires daily compliance + cardiac monitoring;
  V+O is fixed-duration 12 months which many elderly prefer (definite
  end-date, lower long-term toxicity). Avoid ibrutinib first-gen in
  ≥75 with cardiovascular comorbidity. FCR/BR chemoimmuno absolutely
  contraindicated — TRM 5-10% in unfit + minimal benefit over targeted
  therapy.
notes_ua: >
  CIRS (Cumulative Illness Rating Scale) >6 = «unfit» за критеріями
  досліджень CLL11 / CLL14 — визначає вибір обінутузумабу з венетоклаксом
  замість хіміоімунотерапії. Безперервна терапія BTKi (акалабрутиніб,
  занубрутиніб) також прийнятна, але потребує щоденного дотримання
  режиму та кардіомоніторингу; V+O — фіксований курс тривалістю
  12 місяців, який багато пацієнтів похилого віку обирають через
  визначену дату завершення та нижчу довгострокову токсичність. Слід
  уникати ібрутинібу першого покоління у пацієнтів ≥75 років із
  серцево-судинною коморбідністю. Хіміоімунотерапія FCR/BR абсолютно
  протипоказана — летальність, пов'язана з лікуванням (TRM), 5-10% у
  неспроможних пацієнтів при мінімальній перевазі над таргетною
  терапією.
ukrainian_review_status: pending_clinical_signoff
