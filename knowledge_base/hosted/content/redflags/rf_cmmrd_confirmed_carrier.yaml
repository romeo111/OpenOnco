id: RF-CMMRD-CONFIRMED-CARRIER
definition: >-
  Confirmed biallelic germline pathogenic / likely-pathogenic variants
  in a mismatch repair (MMR) gene — MLH1, MSH2, MSH6, or PMS2 — defining
  Constitutional Mismatch Repair Deficiency (CMMRD) syndrome. Rare
  (~1 in 1,000,000) but severely cancer-predisposing autosomal-recessive
  syndrome in pediatric and adolescent patients. Lifetime cancer risk
  approaches 100% by adolescence; first malignancy typically before age
  18, often within first decade. Cancer spectrum: hematologic
  (non-Hodgkin lymphoma, leukemia — often before age 10), CNS
  (medulloblastoma, glioblastoma, supratentorial PNET — often age
  5-15), gastrointestinal (early-onset CRC + small bowel adenoma —
  often age 10-25 with Lynch-like phenotype but more aggressive),
  others (sarcoma, Wilms, pediatric Cushing, NF1-like phenotype
  including café-au-lait macules). Café-au-lait spots in a young
  cancer patient should always prompt CMMRD consideration.
  PMS2 biallelic is the most common CMMRD genotype (most-common Lynch
  gene is also PMS2 in carrier-frequency). Prevention-persona RedFlag
  (§20, v0.3 pediatric predisposition expansion).
definition_ua: >-
  Підтверджені biallelic germline pathogenic / likely-pathogenic
  variants у gene mismatch repair (MMR) — MLH1, MSH2, MSH6, або PMS2 —
  defining Constitutional Mismatch Repair Deficiency (CMMRD) syndrome.
  Rare (~1 у 1,000,000) але severely cancer-predisposing autosomal-
  recessive syndrome у pediatric та adolescent patients. Lifetime
  cancer ризик approaches 100% by adolescence; перший malignancy
  типово before age 18, часто у перший десяток. Cancer spectrum:
  hematologic (non-Hodgkin lymphoma, leukemia — часто before age 10),
  CNS (medulloblastoma, glioblastoma, supratentorial PNET — часто
  age 5-15), gastrointestinal (early-onset CRC + small bowel adenoma —
  часто age 10-25), others (sarcoma, Wilms, pediatric Cushing, NF1-
  like phenotype включаючи café-au-lait macules). Café-au-lait spots у
  young cancer patient завжди мають prompt CMMRD consideration.
  PMS2 biallelic — найпоширеніший CMMRD genotype. Prevention-персона
  RedFlag (§20, v0.3 pediatric predisposition expansion).

