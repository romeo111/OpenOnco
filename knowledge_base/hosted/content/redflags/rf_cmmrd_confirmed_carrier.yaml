notes: >
  Prevention-persona RedFlag for CMMRD confirmed-carrier pediatric
  cohort. Surveillance per Care for CMMRD (C4CMMRD) consortium 2014:
  whole-body MRI annually from diagnosis; brain MRI q6mo from age 2;
  colonoscopy q6mo from age 6; upper GI endoscopy + small-bowel
  capsule annual from age 8; CBC + serum protein electrophoresis +
  abdominal US q6mo. Cascade testing of siblings + parental MMR
  carrier confirmation. Immunotherapy (anti-PD-1) effective in
  established CMMRD-related cancers (Bouffet 2016, Larkin/CheckMate
  series). STUB pending two-Co-Lead signoff per CHARTER §6.1
  dev-mode.
