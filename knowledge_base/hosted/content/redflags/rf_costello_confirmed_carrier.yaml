id: RF-COSTELLO-CONFIRMED-CARRIER
definition: >-
  Patient has a confirmed germline HRAS pathogenic variant — Costello
  syndrome (CS), an autosomal-dominant RASopathy. CS confers an
  estimated 6-15% lifetime malignancy risk concentrated in pediatric
  embryonal sarcomas: embryonal rhabdomyosarcoma (often before age 10,
  the most common malignancy), neuroblastoma, and adolescent/adult
  bladder transitional cell carcinoma. Cardiac comorbidity
  (hypertrophic cardiomyopathy, arrhythmias) is the leading cause of
  non-cancer mortality. Prevention-persona confirmed-carrier RedFlag
  (§20).
definition_ua: >-
  Пацієнт має підтверджений germline HRAS патогенний варіант — синдром
  Костелло (CS), автосомно-домінантна RASopathy. CS супроводжується
  6-15% довічним ризиком злоякісних новоутворень, переважно педіатричних
  ембріональних сарком: ембріональна рабдоміосаркома (часто до 10
  років, найпоширеніша малігнізація), нейробластома, перехідноклітинна
  карцинома сечового міхура у підлітків/дорослих. Кардіальна коморбідність
  (гіпертрофічна кардіоміопатія, аритмії) — провідна причина
  не-онкологічної смертності. Prevention-persona confirmed-carrier
  RedFlag (§20).

