notes: "Prevention-persona Costello syndrome confirmed-carrier RedFlag (pediatric cancer predisposition Wave M). Engine routes to PreventionPlan for embryonal-sarcoma surveillance: abdominal/pelvic US q3-6mo through age 8-10, then urine cytology + bladder US from age 10 lifelong. Cardiac surveillance is comorbidity-driven and handled by paired cardiology pathway, not this RF. STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode. Disease anchor DIS-SOFT-TISSUE-SARCOMA covers embryonal RMS; neuroblastoma + bladder TCC cancer-spectrum noted in rationale of paired Indications."
