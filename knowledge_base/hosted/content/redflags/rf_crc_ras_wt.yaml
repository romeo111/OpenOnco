notes: >
  Sidedness modifier: left-sided primary (splenic flexure to rectum) +
  RAS-WT — anti-EGFR + chemo strongly preferred (mOS ~38 mo with cetux+
  FOLFOX vs ~33 mo with bev+FOLFOX, FIRE-3 left-sided). Right-sided
  primary (cecum to transverse) + RAS-WT — bev + chemo preferred (anti-
  EGFR no benefit or harm in right-sided despite RAS-WT). MSI-H still
  takes priority (RF-CRC-MSI-H-ACTIONABILITY) — pembrolizumab 1L
  regardless of RAS status. BRAF V600E mutation (RF-CRC-BRAF-V600E) is
  a DIFFERENT axis — even RAS-WT BRAF-V600E does NOT respond to anti-EGFR
  alone; routes to encorafenib + cetuximab (BEACON-CRC). HER2 amplification
  (~3% RAS-WT) — trastuzumab + tucatinib or T-DXd second-line option
  (MOUNTAINEER, DESTINY-CRC01). Left-sided + RAS-WT + BRAF-WT + HER2-WT
  + MSS = canonical anti-EGFR target population (~30% of mCRC).
  Resistance evolution: ctDNA monitoring at progression for emerging
  RAS or EGFR-ECD (S492R) mutations — anti-EGFR rechallenge after a
  TKI-free interval (CHRONOS, Sartore-Bianchi 2022) is feasible if
  ctDNA shows RAS-WT clonal reset.
notes_ua: >
  Модифікатор за локалізацією первинної пухлини: лівобічний первинник
  (від селезінкового згину до прямої кишки) + RAS-WT — anti-EGFR +
  хіміотерапія чітко переважні (мОВ ~38 міс з цетук+FOLFOX vs ~33 міс
  з бев+FOLFOX, FIRE-3 left-sided). Правобічний первинник (від сліпої
  до поперечної ободової кишки) + RAS-WT — бев + хіміотерапія переважні
  (anti-EGFR не дає користі або шкодить у правобічних пухлинах попри
  RAS-WT статус). MSI-H усе ще має пріоритет (RF-CRC-MSI-H-ACTIONABILITY)
  — пембролізумаб 1L незалежно від RAS. Мутація BRAF V600E
  (RF-CRC-BRAF-V600E) — ІНША вісь — навіть RAS-WT BRAF-V600E НЕ
  відповідає на монотерапію anti-EGFR; маршрут на енкорафеніб +
  цетуксимаб (BEACON-CRC). Ампліфікація HER2 (~3% RAS-WT) — трастузумаб
  + тукатиніб або T-DXd як опція другої лінії (MOUNTAINEER,
  DESTINY-CRC01). Лівобічний + RAS-WT + BRAF-WT + HER2-WT + MSS =
  канонічна цільова популяція для anti-EGFR (~30% mCRC). Еволюція
  резистентності: ctDNA-моніторинг при прогресії для виявлення нових
  мутацій RAS або EGFR-ECD (S492R) — повторне застосування anti-EGFR
  після інтервалу без TKI (CHRONOS, Sartore-Bianchi 2022) можливе, якщо
  ctDNA показує повернення до RAS-WT клону.
