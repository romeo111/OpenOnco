id: RF-CRC-TRANSFORMATION-PROGRESSION
definition: >
  Rapid progression in CRC: relapse within ≤6 months of completing
  adjuvant chemo (oxaliplatin-resistant phenotype), new peritoneal
  carcinomatosis with ascites + obstruction, OR rapid LDH/CEA doubling
  (>50% rise over 4-8 weeks). Alters 2L+ regimen choice + may
  contraindicate oxaliplatin re-introduction.
definition_ua: >
  Швидке прогресування при КРР: рецидив <6 міс після завершення
  ад'ювантної хіміотерапії (оксаліплатин-резистентний фенотип), новий
  перитонеальний карциноматоз з асцитом та кишковою непрохідністю, АБО
  швидке подвоєння LDH/CEA (підвищення >50% протягом 4-8 тижнів).
  Змінює вибір терапії 2L+, може виключати повторне застосування
  оксаліплатину.

trigger:
  type: composite_score
  any_of:
    - finding: "relapse_within_6mo_adjuvant"
      value: true
    - finding: "new_peritoneal_carcinomatosis_with_obstruction"
      value: true
    - finding: "cea_doubling_4_8wk"
      value: true
    - finding: "ldh_doubling_4_8wk"
      value: true

clinical_direction: intensify
severity: major
priority: 80
category: transformation-progression

relevant_diseases:
  - DIS-CRC

sources:
  - SRC-NCCN-COLON-2025
  - SRC-ESMO-COLON-2024

last_reviewed: "2026-04-26"
draft: false

notes: >
  Oxaliplatin-resistance defined by relapse <6 mo post-adjuvant; this
  group benefits from FOLFIRI ± biologic 2L instead of FOLFOX re-trial.
  Peritoneal-only progression: HIPEC (PRODIGE-7 negative for benefit;
  case-by-case at expert centers). CEA-rise without imaging confirmation
  is NOT progression — always restage by CT/MRI before switching.
notes_ua: >
  Оксаліплатин-резистентність визначається як рецидив <6 міс після
  завершення ад'ювантної терапії; ця група пацієнтів отримує користь
  від FOLFIRI ± біологічний препарат у 2-й лінії замість повторного
  застосування FOLFOX. Ізольоване перитонеальне прогресування: HIPEC
  (за даними PRODIGE-7 користі не показано; рішення ухвалюють
  індивідуально в експертних центрах). Підвищення CEA без підтвердження
  за даними візуалізації НЕ вважається прогресуванням — перед зміною
  терапії завжди потрібне повторне стадіювання за КТ/МРТ.
ukrainian_review_status: pending_clinical_signoff
