id: RF-CRONKHITE-CANADA-CONFIRMED
definition: >-
  Cronkhite-Canada syndrome — acquired non-Mendelian polyposis-
  ectodermal syndrome. Rare (~1000 reported cases globally; primarily
  middle-aged + elderly adults). Clinical presentation: gastrointestinal
  polyposis (juvenile-like, throughout stomach + small bowel + colon
  diffusely) + ectodermal changes (diffuse alopecia, nail dystrophy
  with onycholysis, skin hyperpigmentation) + protein-losing
  enteropathy (hypoalbuminemia, edema, weight loss, electrolyte
  derangement). Lifetime CRC risk ~12-25%; gastric cancer also elevated
  per IPCG case-series. Pathogenesis unclear — autoimmune-like; may
  respond to immunosuppression (prednisone, azathioprine) + nutritional
  support; untreated mortality high (~50% 5-year if uncontrolled).
  Diagnosis is clinical + supported by classic GI biopsy + ectodermal
  pattern. Patient has confirmed clinical diagnosis; no current personal
  cancer diagnosis. Prevention-persona RedFlag (§20, v0.3 rare-acquired
  expansion Wave P2). Genetic etiology unknown but clinically fits the
  predisposition pathway since carriers need life-long GI surveillance.
