notes: >
  Prevention-persona RedFlag for Cronkhite-Canada syndrome. risk_category
  set to chronic_condition (not genetic) because etiology is acquired
  autoimmune-like + non-Mendelian. Surveillance: colonoscopy q1-2y
  from diagnosis; upper endoscopy q1-2y; small-bowel capsule q2y;
  treat active disease with immunosuppression (prednisone taper +
  azathioprine maintenance) + nutritional support (protein replacement,
  electrolyte correction). Mortality reduced markedly with immuno-
  suppression treatment. STUB pending two-Co-Lead signoff per CHARTER
  §6.1 dev-mode.
