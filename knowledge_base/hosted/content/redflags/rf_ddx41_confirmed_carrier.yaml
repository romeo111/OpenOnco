id: RF-DDX41-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in DDX41 —
  most commonly the p.D140fs (p.Asp140fs) Northern European / Ashkenazi
  founder allele, but a growing list of recurrent loss-of-function
  alleles is now recognized worldwide. Patient has had germline panel
  testing returned positive, ideally confirmed on buccal / fibroblast
  germline tissue. The penetrance pattern is distinctive: late-onset
  MDS / AML, typically presenting in the sixth-to-eighth decade
  (median age at AML diagnosis ~66 years), with cumulative MDS / AML
  incidence ~50-70% by age 80 in confirmed-carrier pedigrees. A
  hallmark biologic feature is the somatic DDX41 "second hit"
  (usually p.R525H, the recurrent hot-spot helicase-domain missense)
  acquired in trans within the tumor clone — this molecular pattern is
  diagnostic of germline-DDX41-driven MDS / AML and distinguishes it
  from sporadic disease. Clinical importance: confirmed DDX41 carriers
  with MDS / AML show favorable response to hypomethylating-agent
  therapy (azacitidine, decitabine) and to venetoclax-based combinations
  (Sebert et al. Blood 2024). Prevention-persona RedFlag (KSS §20,
  confirmed-carrier surveillance pathway).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у DDX41 — найчастіше p.D140fs (p.Asp140fs) північно-європейський /
  Ашкеназі founder алель, але recognized список рекурентних loss-of-
  function алелей зростає у всьому світі. Пацієнт пройшов germline-
  тестування з позитивним результатом, ідеально підтвердженим на
  buccal / fibroblast germline тканині. Патерн пенетрантності
  специфічний: пізно-onset МДС / ГМЛ, типово презентує у 6-8 декаді
  (медіана віку діагностики ГМЛ ~66 років), з кумулятивною
  МДС / ГМЛ-incidence ~50-70% до 80 років у підтверджених-носіїв
  родоводах. Ключова біологічна особливість: соматичний DDX41 "second
  hit" (зазвичай p.R525H, рекурентна hot-spot helicase-domain missense)
  набутий в trans у пухлинному клоні — цей молекулярний патерн
  діагностичний для germline-DDX41-driven МДС / ГМЛ і відрізняє його
  від sporadic disease. Клінічне значення: підтверджені DDX41-носії
  з МДС / ГМЛ показують favorable response на hypomethylating-agent
  терапію (азацитидин, децитабін) та на венетоклакс-основані
  комбінації (Sebert et al. Blood 2024). Prevention-persona RedFlag
  (KSS §20, шлях спостереження підтверджених носіїв).

