# DDX41 carrier malignancy spectrum: late-onset MDS (often R525H
# somatic-second-hit pattern), AML evolving from MDS, occasional
# lymphoid malignancies (modest excess, mechanism uncertain). DIS-AML
# + DIS-MDS-HR as primary anchors; DIS-MDS-LR carriers also see
# evolution but engine routes to a single MDS-spectrum-aware track.
