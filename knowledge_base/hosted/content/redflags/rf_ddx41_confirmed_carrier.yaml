reviewer_signoffs: 0
notes: >
  Wave P confirmed-carrier surveillance pathway — germline DDX41. Fires
  on documented germline DDX41 pathogenic variant positivity (any allele
  recognized as germline DDX41 LoF, with p.D140fs the Ashkenazi founder
  and other recurrent alleles in non-Ashkenazi populations). Engine
  routes to PreventionPlan recommending:
    (a) IND-DDX41-CARRIER-SURVEILLANCE (standard) — CBC q6 months from
        age 50 (or from carrier confirmation if later); BMA + cytogenetics
        + myeloid NGS panel at any unexplained cytopenia, persistent
        macrocytosis, or new dysplastic feature on smear; cascade
        testing to all first-degree relatives with documented buccal /
        fibroblast germline confirmation (NOT blood-only; somatic
        DDX41 R525H second-hit clones in carriers can contaminate
        blood-based germline assay).
    (b) IND-DDX41-CARRIER-INTENSIFIED (aggressive) — standard protocol
        PLUS q3-4 month CBC + smear from age 50; BMA + NGS every 2-3
        years from age 50 even without provoked indication; preemptive
        HLA typing on candidate sibling donors with germline DDX41
        screening (sibling carriers must NOT be used as donors —
        donor-derived disease documented in DDX41 syndrome); early
        engagement with hereditary-myeloid-program transplant team to
        avoid time-loss at eventual AML / high-risk MDS diagnosis.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Penetrance reference: Polprasert et al. Cancer Cell 2015
  (original familial DDX41 description); Quesada et al. Am J Hematol
  2019 (cohort of 33 families, median age MDS/AML 66); Sebert et al.
  Blood 2024 (clinical-outcomes-on-HMA cohort, n=153, OS benefit).

  Treatment implication (when MDS/AML emerges): hypomethylating
  agents and venetoclax-based combinations are particularly effective
  in DDX41-driven disease (multiple cohort studies); allogeneic
  transplant remains the only curative modality but timing depends on
  IPSS-M / blast burden + co-occurring mutations + donor screening.
