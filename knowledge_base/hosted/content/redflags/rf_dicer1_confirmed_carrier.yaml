id: RF-DICER1-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in DICER1
  (RNase III endonuclease essential for miRNA biogenesis). Autosomal-
  dominant; moderate-to-high penetrance for a characteristic tumor
  spectrum that combines rare childhood + adolescent + young-adult
  cancers. Cancer spectrum: pleuropulmonary blastoma (PPB, ~5-10%
  lifetime risk, most distinctive — childhood-onset pulmonary cystic /
  solid lesion progression Type I → II → III), Sertoli-Leydig cell
  tumor of the ovary (~6-15% lifetime in female carriers, adolescent /
  young adult), multinodular goiter (~75% lifetime, often presenting
  age 5-20), cystic nephroma (~5-10% childhood), embryonal rhabdomyo-
  sarcoma of cervix / urinary tract, pinealoblastoma + pituitary
  blastoma, nasal chondromesenchymal hamartoma. ~1 in 10,000 population
  frequency; recognition often follows family clustering of multiple
  tumor types. Patient has confirmed positive germline test; no current
  personal cancer diagnosis in the carrier being assessed. Prevention-
  persona RedFlag (§20, v0.3 pediatric predisposition Wave L+M expansion).
definition_ua: >-
  Підтверджений germline pathogenic / likely-pathogenic variant у
  DICER1 (RNase III endonuclease essential для miRNA biogenesis).
  Autosomal-dominant; moderate-to-high penetrance для characteristic
  tumor spectrum що поєднує rare childhood + adolescent + young-adult
  cancers. Cancer spectrum: pleuropulmonary blastoma (PPB, ~5-10%
  lifetime ризик, найхарактерніший — childhood-onset pulmonary cystic /
  solid lesion progression Type I → II → III), Sertoli-Leydig cell
  tumor ovary (~6-15% lifetime у female carriers, adolescent / young
  adult), multinodular goiter (~75% lifetime, presenting age 5-20),
  cystic nephroma (~5-10% childhood), embryonal rhabdomyosarcoma
  cervix / urinary tract, pinealoblastoma + pituitary blastoma, nasal
  chondromesenchymal hamartoma. ~1 у 10,000 population frequency;
  recognition часто follows family clustering multiple tumor types.
  Prevention-персона RedFlag (§20, v0.3 pediatric predisposition Wave
  L+M expansion).

