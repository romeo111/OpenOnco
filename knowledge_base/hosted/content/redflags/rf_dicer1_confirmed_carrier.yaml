notes: >
  Prevention-persona RedFlag for DICER1 confirmed-carrier cohort.
  Pediatric surveillance per International PPB Registry / IDSDB
  recommendations:
    - Chest CT q4-6 mo from birth to age 3, q6-12 mo to age 8.
    - Abdominal US q3-6 mo from birth to age 8.
    - Thyroid US baseline by age 8 + q3-5 y.
    - Pelvic US in female carriers from menarche.
    - Brain MRI baseline + symptom-driven.
  Surgery curative for PPB Type I when detected early; advanced PPB
  Type III (solid component) very aggressive. Risk-reducing
  oophorectomy not endorsed for Sertoli-Leydig prevention. STUB
  pending two-Co-Lead signoff per CHARTER §6.1 dev-mode.
