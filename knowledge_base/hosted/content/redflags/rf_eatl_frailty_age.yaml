id: RF-EATL-FRAILTY-AGE
definition: "Age >70 OR ECOG ≥3 — CHOEP intensity + autoSCT consolidation poorly tolerated; CHOP-based with reduced doses ± brentuximab (CD30+) considered."
definition_ua: "Вік >70 АБО ECOG ≥3 — інтенсивність CHOEP та консолідація аутоТГСК погано переносяться; розглядають CHOP-подібний режим зі зниженими дозами ± брентуксимаб (CD30+)."

trigger:
  type: composite_clinical
  any_of:
    - finding: "age_years"
      threshold: 70
      comparator: ">"
    - finding: "ecog_status"
      threshold: 3
      comparator: ">="

clinical_direction: de-escalate
severity: major
priority: 100
category: frailty-age

relevant_diseases: [DIS-EATL]

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-ESMO-PTCL-2024

last_reviewed: "2026-04-25"
draft: false

notes: >
  EATL is mostly disease of elderly; autoSCT limited by performance status. Reduced-intensity backbone trades cure rates for tolerability.
notes_ua: >
  EATL — переважно захворювання людей похилого віку; застосування аутоТГСК обмежене функціональним статусом.
  Режим зі зниженою інтенсивністю поступається частотою вилікування заради кращої переносимості.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_extraction
draft_revision: 1
