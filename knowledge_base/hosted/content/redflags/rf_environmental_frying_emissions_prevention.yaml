# Anchor — NSCLC (the dominant histology in the East-Asian non-smoking
# women lung-cancer signal that IARC 95 documents). EGFR-mutant
# adenocarcinoma is over-represented in this population, but that is
# a tumor-biology characteristic not encoded at the RF level.
relevant_diseases:
  - DIS-NSCLC

shifts_algorithm: []

