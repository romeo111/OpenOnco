last_reviewed: "2026-05-19"
reviewer_signoffs: 0
notes: >
  Prevention-persona RedFlag — v0.3 IARC 2A probable-carcinogen batch
  (2026-05-19). IARC Group 2A probable — limited human evidence;
  clinical recommendation more conservative than Group 1. IARC
  Monograph 95 (2010) is the canonical evidence anchor and is NOT
  yet a separate SRC entity in KB; cited in notes only.

  Population-specific framing: the lung-cancer signal is most
  characteristic in East Asian non-smoking women (Chinese / Taiwanese /
  Singaporean / Korean / Vietnamese populations) where cooking-emissions
  exposure is sustained over decades on traditional cookware in
  homes with limited ventilation. The same exposure pattern in
  Western kitchens (different cooking-style mix, generally better
  ventilation, lower cumulative dose) carries less population-level
  evidence — but the IARC 2A classification applies wherever
  high-temperature frying with inadequate ventilation occurs.

  Engine routes to 2-track PreventionPlan:
    (a) IND-ENVIRONMENTAL-FRYING-EMISSIONS-PREVENTION-INTENSIFIED-
        SURVEILLANCE (standard) — ventilation-upgrade counseling,
        cooking-method counseling, risk-adjusted LDCT consideration
        when clustering with other lung-cancer risk factors.
    (b) IND-ENVIRONMENTAL-FRYING-EMISSIONS-PREVENTION-OBSERVATION
        (surveillance) — routine general-population care; patient
        declines structured counseling.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

