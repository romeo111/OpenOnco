id: RF-ENVIRONMENTAL-OUTDOOR-UV-SKIN-PREVENTION
definition: >-
  Chronic high cumulative occupational outdoor UV exposure (≥10 years
  outdoor work in high-UV-index latitudes — agricultural workers,
  fishermen, sailors, construction trades, road workers, lifeguards,
  landscapers, equatorial / sub-tropical residence with daily outdoor
  exposure). Solar UV radiation is an IARC Group 1 carcinogen
  (Monograph 100D, 2012) — established etiologic driver of cutaneous
  squamous cell carcinoma (SCC), basal cell carcinoma (BCC), and
  melanoma. Occupational outdoor work raises non-melanoma skin cancer
  (NMSC) risk ~1.5-2x baseline (meta-analyses of outdoor vs indoor
  worker cohorts); melanoma signal is weaker for chronic occupational
  UV but strong for intermittent / sunburn-pattern exposure. Risk
  compounds with Fitzpatrick skin type I-III, age >50, history of
  ≥5 sunburns, immunosuppression (transplant, autoimmune disease on
  therapy). Mechanisms: UVB (290-320 nm) directly mutagenic via CPD
  + 6-4 photoproduct formation in basal keratinocyte DNA, with TP53
  signature mutations; UVA (320-400 nm) penetrates deeper, generates
  ROS, contributes to immunosuppression + photoaging. Distinct from
  RF-LIFESTYLE-UV-EXPOSURE-PREVENTION (which is broader including
  tanning beds + sunburn history + recreational UV); this RF focuses
  specifically on cumulative occupational outdoor UV exposure for
  NMSC risk. Prevention-persona RedFlag (§20 v0.3 environmental
  pilot, 2026-05-18). risk_category=occupational matches the schema
  enum directly here (it is genuinely occupational).
definition_ua: >-
  Хронічний значний кумулятивний професійний вплив УФ-випромінювання
  на відкритому повітрі (≥10 років роботи на відкритому повітрі в
  широтах з високим УФ-індексом — сільськогосподарські робітники,
  рибалки, моряки, будівельники, дорожні робітники, рятувальники,
  ландшафтні робітники, проживання в екваторіальних / субтропічних
  регіонах з щоденним перебуванням на відкритому повітрі). Сонячне
  УФ-випромінювання — канцероген групи 1 за класифікацією IARC
  (Monograph 100D, 2012) — встановлений етіологічний чинник
  плоскоклітинного раку шкіри (SCC), базальноклітинної карциноми
  (BCC) та меланоми. Професійна робота на відкритому повітрі підвищує
  ризик немеланомного раку шкіри (NMSC) приблизно у 1.5-2 рази
  порівняно з вихідним рівнем; сигнал щодо меланоми слабший для
  хронічного професійного УФ-впливу, але сильний для інтермітуючого
  впливу за типом опіку. Ризик посилюється за наявності фототипу
  шкіри за Фітцпатріком I-III, віку >50 років, анамнезу ≥5 сонячних
  опіків, імуносупресії. Відрізняється від RF-LIFESTYLE-UV-EXPOSURE-
  PREVENTION (ширший за охопленням, включає солярії, анамнез опіків
  та рекреаційний УФ-вплив); цей RF стосується саме кумулятивного
  професійного УФ-впливу на відкритому повітрі щодо ризику NMSC.

trigger:
  type: lab_value
  any_of:
    - finding: "occupational_outdoor_work_ge_10y_high_uv_latitude"
      value: true
    - finding: "occupational_outdoor_uv_exposure_documented"
      value: true
    - finding: "agricultural_or_outdoor_trade_history_ge_10y"
      value: true

clinical_direction: investigate

severity: major
priority: 100
category: other

# Direct match — occupational outdoor UV exposure
risk_category: occupational

# Primary anchor — BCC (most-common cumulative-UV-driven cutaneous
# malignancy). SCC + melanoma surfaced via relevant_diseases.
relevant_diseases:
  - DIS-BCC
  - DIS-MELANOMA

shifts_algorithm: []

sources:
  - SRC-NCCN-SKIN-2025
  - SRC-NCCN-MELANOMA-2025

last_reviewed: "2026-05-18"
reviewer_signoffs: 0
notes: "Prevention-persona RedFlag for chronic occupational outdoor UV exposure ≥10y in high-UV-index latitudes. IARC Group 1 solar UV. Distinct from broader RF-LIFESTYLE-UV-EXPOSURE-PREVENTION (which covers tanning beds + sunburn history + recreational UV). Anchored to DIS-BCC per task brief (closest skin DIS to UV-NMSC). Engine routes to PreventionPlan recommending photoprotection counseling + clinical skin exam cadence + patient skin self-exam education + Vitamin D balance. STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode."
