id: RF-ESOPH-FRAILTY-AGE
definition: >
  Frailty profile precluding CROSS / FLOT / definitive CRT in
  esophageal: ECOG ≥3, OR (age ≥75 + Charlson ≥3), OR composite
  (age ≥70 + albumin <3.0 + ≥10% weight loss + sarcopenia).
  Triggers definitive RT-only (palliative-intent), best-supportive-care
  with palliative stenting + nutrition optimization.
definition_ua: >
  Профіль крихкості (frailty), що унеможливлює CROSS / FLOT /
  дефінітивну CRT при раку стравоходу: ECOG ≥3, АБО (вік ≥75 +
  Charlson ≥3), АБО композитний критерій (вік ≥70 + альбумін <3.0 +
  втрата ваги ≥10% + саркопенія). Показана дефінітивна RT-монотерапія
  (паліативного наміру), найкраща підтримувальна терапія (BSC) +
  паліативне стентування + нутритивна оптимізація.

trigger:
  type: composite_score
  any_of:
    - finding: "ecog"
      threshold: 3
      comparator: ">="
    - all_of:
        - finding: "age"
          threshold: 75
          comparator: ">="
        - finding: "charlson_score"
          threshold: 3
          comparator: ">="

clinical_direction: de-escalate
severity: major
priority: 100
category: frailty-age

relevant_diseases:
  - DIS-ESOPHAGEAL

sources: [SRC-NCCN-ESOPHAGEAL-2025, SRC-ESMO-ESOPHAGEAL-2024]
last_reviewed: "2026-04-26"
draft: false

notes: >
  Esophageal cancer disproportionately affects older patients; pre-CROSS
  nutrition optimization (PEG/J-tube) often required. Frail elderly:
  hypofractionated RT 30-40 Gy palliative + stenting for dysphagia
  control.
notes_ua: >
  Рак стравоходу непропорційно частіше вражає осіб похилого віку;
  передопераційна (pre-CROSS) нутритивна оптимізація (PEG/J-tube)
  часто необхідна. У ослаблених пацієнтів похилого віку:
  гіпофракціонована RT 30-40 Gy паліативно + стентування для
  контролю дисфагії.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_extraction
draft_revision: 1
