id: RF-ESOPH-SEVERE-DYSPHAGIA-ASPIRATION
definition: >
  Severe dysphagia with weight loss / aspiration risk in esophageal
  cancer: inability to swallow saliva, recurrent aspiration pneumonia,
  >10% weight loss in 3 months, OR malignant tracheoesophageal fistula.
  Mandates urgent palliative intervention (stenting OR dilation OR
  diversion) BEFORE any definitive systemic / RT therapy.
definition_ua: >
  Тяжка дисфагія з втратою ваги / ризиком аспірації при раку
  стравоходу: неможливість ковтати слину, рецидивна аспіраційна
  пневмонія, втрата ваги >10% за 3 місяці, АБО злоякісна
  трахеостравохідна нориця. Потребує термінового паліативного
  втручання (стентування, АБО дилатація, АБО відведення) ДО будь-якої
  дефінітивної системної / RT-терапії.

trigger:
  type: composite_score
  any_of:
    - finding: "cannot_swallow_saliva"
      value: true
    - finding: "recurrent_aspiration_pneumonia"
      value: true
    - finding: "weight_loss_pct_3mo"
      threshold: 10
      comparator: ">="
    - finding: "tracheoesophageal_fistula"
      value: true

clinical_direction: hold

severity: critical
priority: 40
category: organ-dysfunction

relevant_diseases:
  - DIS-ESOPHAGEAL

sources:
  - SRC-NCCN-ESOPHAGEAL-2025
  - SRC-ESMO-ESOPHAGEAL-2024

last_reviewed: "2026-04-26"
draft: false

notes: >
  Self-expandable esophageal stent OR endoscopic dilation OR PEG/J-tube
  for nutritional support. Tracheoesophageal fistula precludes RT
  (worsens fistula) — covered stent + chemo only. Severe weight loss
  pre-CROSS predicts poor tolerance — pre-treatment nutrition
  optimization mandatory.
notes_ua: >
  Саморозкривний стравохідний стент, АБО ендоскопічна дилатація, АБО
  PEG/J-зонд для нутритивної підтримки. Трахеостравохідна нориця
  унеможливлює RT (погіршує норицю) — лише покритий стент + хіміо-
  терапія. Тяжка втрата ваги перед CROSS прогнозує погану
  переносимість — передопераційна нутритивна оптимізація обов'язкова.
ukrainian_review_status: pending_clinical_signoff
