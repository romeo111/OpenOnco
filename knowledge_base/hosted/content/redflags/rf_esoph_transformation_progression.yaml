id: RF-ESOPH-TRANSFORMATION-PROGRESSION
definition: >
  Aggressive progression in esophageal cancer: residual disease post-CROSS
  (ypT+ or ypN+ at esophagectomy — adjuvant nivolumab CheckMate-577
  indication), peritoneal carcinomatosis with malignant ascites, OR
  rapid clinical decline on first cycle.
definition_ua: >
  Агресивне прогресування при раку стравоходу: резидуальна хвороба
  після CROSS (ypT+ або ypN+ при езофагектомії — показання до
  ад'ювантного ніволумабу за CheckMate-577), перитонеальний
  карциноматоз зі злоякісним асцитом, АБО швидке клінічне погіршення
  на 1-му циклі.

trigger:
  type: composite_score
  any_of:
    - finding: "post_cross_pcr_negative"
      value: true
    - finding: "peritoneal_carcinomatosis_with_ascites"
      value: true
    - finding: "rapid_decline_first_cycle"
      value: true

clinical_direction: intensify
severity: major
priority: 80
category: transformation-progression

relevant_diseases:
  - DIS-ESOPHAGEAL

sources: [SRC-NCCN-ESOPHAGEAL-2025, SRC-ESMO-ESOPHAGEAL-2024]
last_reviewed: "2026-04-26"
draft: false

notes: >
  CheckMate-577: adjuvant nivolumab × 1 year for residual ypT+/ypN+
  post-CROSS — DFS doubled (22 vs 11 mo). Treatment-defining for this
  ~30% of CROSS patients without pCR.
notes_ua: >
  CheckMate-577: ад'ювантний ніволумаб протягом 1 року за наявності
  резидуальної хвороби (ypT+/ypN+) після CROSS — DFS подвоївся (22
  проти 11 міс.). Лікування-визначальний результат для ~30% пацієнтів
  CROSS без pCR.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_extraction
draft_revision: 1
