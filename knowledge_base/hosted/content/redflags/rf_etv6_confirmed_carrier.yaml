# ETV6 carrier malignancy spectrum: pediatric B-ALL (dominant, ~25-30%
# cumulative), adult-onset MDS / AML (~10-15% cumulative). DIS-B-ALL
# anchor primary; DIS-AML + DIS-MDS-HR included because adult
# malignancy spectrum is well-documented. Combined cumulative risk
# (~35-40%) calibrates this carrier syndrome to `major`.
relevant_diseases:
  - DIS-B-ALL
  - DIS-AML
  - DIS-MDS-HR

