id: RF-ETV6-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in ETV6
  (Thrombocytopenia 5, THC5; OMIM 616216). Most pathogenic variants are
  missense alleles in the ETS or PNT (pointed) domain that disrupt
  ETV6 transcription-factor function. Patient has had germline panel
  testing returned positive, ideally on buccal / fibroblast germline
  tissue. The carrier presents from infancy / childhood with mild-to-
  moderate isolated thrombocytopenia (platelet count typically
  50-130 x10⁹/L, with red-cell macrocytosis a documented secondary
  feature) plus variably-penetrant bleeding diathesis. The malignancy
  risk profile is distinctive among the inherited-thrombocytopenia
  syndromes: pediatric B-cell acute lymphoblastic leukemia (B-ALL) is
  the dominant cancer phenotype, with ~25-30% cumulative incidence
  in confirmed-carrier pedigrees and onset typically in the first
  two decades of life. Adult onset MDS / AML accounts for an
  additional ~10-15% cumulative risk. Solid tumors (colorectal, breast,
  thyroid, others) have been reported in ETV6 pedigrees as a modest
  excess, mechanism not yet fully characterized. Prevention-persona
  RedFlag (KSS §20, confirmed-carrier surveillance pathway).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у ETV6 (Thrombocytopenia 5, THC5; OMIM 616216). Більшість патогенних
  варіантів — missense алелі в ETS або PNT (pointed) домені, що
  порушують ETV6 транскрипційну-факторну функцію. Пацієнт пройшов
  germline-тестування з позитивним результатом, ідеально на buccal /
  fibroblast germline тканині. Носій представляє з немовлячого /
  дитячого віку з м'яко-помірною ізольованою тромбоцитопенією
  (тромбоцити типово 50-130 x10⁹/л, з макроцитозом red-cell як
  задокументованою вторинною ознакою) плюс варіабельно-penetrant
  bleeding diathesis. Профіль ризику malignancy специфічний серед
  спадкових тромбоцитопенічних синдромів: педіатричний B-клітинний
  гострий лімфобластний лейкоз (B-ALL) — домінантний раковий фенотип,
  з ~25-30% кумулятивною incidence у підтверджених-носіїв родоводах
  і onset типово у перших двох декадах життя. Дорослий onset МДС /
  ГМЛ становить додаткові ~10-15% кумулятивного ризику. Солідні
  пухлини (колоректальний, breast, thyroid, інші) повідомлені у
  ETV6 родоводах як помірний надлишок, механізм не повністю
  характеризований. Prevention-persona RedFlag (KSS §20, шлях
  спостереження підтверджених носіїв).

