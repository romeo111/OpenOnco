notes: >
  Wave P confirmed-carrier surveillance pathway — germline ETV6
  (Thrombocytopenia 5). Fires on documented germline ETV6 pathogenic
  variant positivity (typically PNT or ETS domain missense) OR
  documented THC5 clinical criteria (childhood-onset thrombocytopenia
  + ETV6-targeted genetic test positive + family pattern of B-ALL or
  inherited thrombocytopenia). Engine routes to PreventionPlan
  recommending:
    (a) IND-ETV6-CARRIER-SURVEILLANCE (standard) — CBC + smear q3-6
        months lifelong from infancy through adulthood; BMA + flow
        cytometry + cytogenetics + myeloid NGS panel at any new /
        unexplained cytopenia, lymphadenopathy, or persistent
        cytological abnormality; pediatric oncology consultation
        on initial carrier confirmation in a child (B-ALL is the
        dominant childhood phenotype and early-detection planning
        differs from adult myeloid surveillance); annual review of
        bleeding history; cascade testing to first-degree relatives
        with documented buccal / fibroblast germline confirmation.
    (b) IND-ETV6-CARRIER-INTENSIFIED (aggressive) — standard protocol
        PLUS q3-month CBC + smear from infancy through age 20 (peak
        pediatric B-ALL incidence); BMA every 2-3 years from age 5
        even without provoked indication during peak risk; preemptive
        HLA typing on candidate sibling donors with germline ETV6
        screening required (sibling carriers must NOT donate);
        structured pediatric-oncology + hematology co-management plan
        from initial confirmation.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Penetrance reference: Noetzli et al. Nat Genet 2015 +
  Zhang et al. Nat Genet 2015 (concurrent original descriptions);
  Topka et al. PLoS Genet 2015; Moriyama et al. Lancet Oncol 2015
  (B-ALL cohort screening showed ~1% of pediatric B-ALL has germline
  ETV6); Feurstein & Godley 2017 review (cumulative malignancy risk
  ~35-40% combining B-ALL pediatric + adult MDS/AML).

  Pediatric-specific consideration: B-ALL treatment in confirmed ETV6
  carriers does NOT require modification per current guidelines, but
  carrier status influences relapse-monitoring intensity and donor
  selection if transplant becomes necessary; sibling-donor germline
  ETV6 testing mandatory pre-transplant.
