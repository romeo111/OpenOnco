id: RF-FAMILIAL-PANCREATIC-CANCER-SYNDROME
definition: >-
  Familial Pancreatic Cancer (FPC) — operational definition: an
  individual with ≥2 first-degree relatives diagnosed with pancreatic
  ductal adenocarcinoma (PDAC), in the absence of a confirmed germline
  pathogenic variant in a known PDAC-susceptibility gene (BRCA1, BRCA2,
  PALB2, ATM, CDKN2A, STK11/Peutz-Jeghers, MLH1/MSH2/MSH6/PMS2/Lynch,
  TP53/Li-Fraumeni, PRSS1/SPINK1 hereditary pancreatitis). Negative
  expanded hereditary-cancer panel + ≥2-FDR PDAC family history
  satisfies the criterion. Lifetime PDAC risk for FPC kindreds is
  estimated at ~7-16% (vs. ~1.6% population baseline); risk scales
  with number of affected FDRs (2 FDR ~7%, 3+ FDR ~16-32%). CAPS
  Consortium 2020 + NCCN Pancreatic 2025 endorse pancreatic
  surveillance with annual MRI/MRCP and/or EUS in FPC kindreds
  starting age 50 (or 10y before youngest familial diagnosis).
  Prevention-persona RedFlag — distinct from RF-CHRONIC-
  PANCREATITIS-PDAC-PREVENTION (chronic pancreatitis is a different
  etiology), distinct from confirmed-carrier RFs for the named
  susceptibility genes (BRCA2, PALB2, etc.), and distinct from
  population-cadence PDAC screening (which is not endorsed in average-
  risk individuals because of low yield).
definition_ua: >-
  Сімейний рак підшлункової залози (FPC) — operational definition:
  індивід з ≥2 first-degree родичами з діагнозом PDAC, за відсутності
  підтвердженого гермінативного патогенного варіанту у відомих PDAC-
  susceptibility генах (BRCA1, BRCA2, PALB2, ATM, CDKN2A, STK11,
  MLH1/MSH2/MSH6/PMS2, TP53, PRSS1/SPINK1). Негативна expanded
  hereditary-cancer panel + ≥2-FDR PDAC family history задовольняє
  критерій. Lifetime PDAC ризик для FPC kindreds оцінюється у ~7-16%
  (vs. ~1.6% population baseline); ризик масштабується з кількістю
  affected FDR (2 FDR ~7%, 3+ FDR ~16-32%). CAPS Consortium 2020 +
  NCCN Pancreatic 2025 endorse pancreatic surveillance з annual
  MRI/MRCP та/або EUS у FPC kindreds з 50 років (або за 10 років до
  наймолодшого сімейного діагнозу). Prevention-persona RedFlag —
  distinct from RF-CHRONIC-PANCREATITIS-PDAC-PREVENTION та confirmed-
  carrier RFs для названих susceptibility генів.

