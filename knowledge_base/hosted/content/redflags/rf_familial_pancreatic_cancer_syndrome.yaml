notes: >
  v0.3 wave-N niche pathway — Familial Pancreatic Cancer (FPC).
  Fires on documented ≥2-FDR PDAC family history AFTER negative
  expanded hereditary-cancer panel (BRCA1, BRCA2, PALB2, ATM, CDKN2A,
  STK11, Lynch MMR genes, TP53, PRSS1/SPINK1). The negative-panel
  requirement is essential — patients positive for any of those genes
  are routed via the corresponding confirmed-carrier RF (which carry
  their own well-defined surveillance recommendations) rather than
  through FPC.

  Severity is `critical` rather than `major` because:
    1. Lifetime PDAC risk in 3+ FDR FPC kindreds (~16-32%) approaches
       BRCA2-carrier PDAC risk (~5-10%) and substantially exceeds
       population baseline (~1.6%).
    2. PDAC carries the worst 5-year OS (~12% overall, ~3% in late-
       stage disease) of any common cancer — surveillance-detected
       early-stage disease offers the best (and arguably only) chance
       at meaningful long-term survival.
    3. The clinical action window is narrow — pancreatic surveillance
       requires referral to an experienced center, and missed
       surveillance opportunities are difficult to recover.

  Engine routes to PreventionPlan recommending:
    (a) IND-FPC-PANCREATIC-SURVEILLANCE (standard) — annual MRI/MRCP
        + EUS alternating (or both annually) from age 50 (or 10y
        before youngest familial diagnosis) at PDAC-experienced
        center; smoking cessation; alcohol moderation; diabetes
        management.
    (b) IND-FPC-PANCREATIC-OBSERVATION (alternative) — symptom-driven
        evaluation when access to PDAC-experienced surveillance center
        is impractical. Per CHARTER §11 patient-autonomy framing.
        Counsel that this is sub-optimal vs. structured surveillance.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Source-set TODO: EUROPAC consortium FPC registry
  publications (Greenhalf 2009; Vasen 2018); Klatte et al. CAPS5
  prospective surveillance results (Gastroenterology 2022); v0.3
  wave-N authoring backlog new SRC entities for FPC-specific evidence.

  Cumulative PDAC risk in FPC by number of affected FDRs (per
  EUROPAC + CAPS Consortium pooled data):
    - 2 affected FDRs: ~7% lifetime (RR ~4-6x baseline)
    - 3 affected FDRs: ~16-18% lifetime (RR ~10-15x baseline)
    - ≥4 affected FDRs: ~32% lifetime (RR ~30x+ baseline)
    - Onset 10+ years younger in successive generations
      (anticipation-like pattern, etiology unclear)

  Surveillance modality considerations:
    - MRI/MRCP non-invasive but lower lesion-level sensitivity for
      sub-cm IPMN / cystic lesions.
    - EUS sensitive for small parenchymal lesions but invasive +
      operator-dependent.
    - Combined annual MRI + EUS (or alternating q6-month) is the
      preferred CAPS Consortium / NCCN approach for FPC kindreds with
      ≥3 affected FDRs.
