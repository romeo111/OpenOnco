  - SRC-EANO-GBM-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  Pseudoprogression occurs in ~30% post-Stupp at 3 mo MRI — does not
  represent true tumor growth (treatment-related inflammation / radiation
  effect); RANO criteria require either second confirmatory MRI or
  outside-RT-field new disease before declaring progression. Confirmed
  recurrence: re-resection if accessible (gross-total benefit per
  retrospective series); systemic options include bevacizumab (BELOB,
  AVAglio — improves PFS, no OS benefit; useful for steroid-sparing
  edema control), regorafenib (REGOMA), lomustine, TMZ rechallenge if
  MGMT-methylated and >12 mo PFS to first TMZ. Tumor-treating fields
  approved for recurrence per EF-11. shifts_algorithm empty pending
  ALGO-GBM-RECURRENT-2L authoring.
notes_ua: >
  Псевдопрогресія трапляється приблизно у 30% пацієнтів після Stupp на МРТ через 3 міс — не є справжнім
  ростом пухлини (запалення / променевий ефект, пов'язані з лікуванням); критерії RANO вимагають або
  другого підтверджувального МРТ, або нового вогнища поза полем опромінення перед констатацією
  прогресування. Підтверджений рецидив: повторна резекція за доступності (перевага тотальної резекції за
  даними ретроспективних серій); системні опції включають бевацизумаб (BELOB, AVAglio — покращує ВБП, без
  переваги в ЗВ; корисний для зменшення набряку зі стероїд-зберігаючим ефектом), регорафеніб (REGOMA),
  ломустин, повторне призначення TMZ за умови MGMT-метильованого статусу та ВБП >12 міс після першого курсу
  TMZ. TTF-терапія (tumor-treating fields) схвалена для рецидиву згідно з EF-11. shifts_algorithm порожній
  до завершення розробки ALGO-GBM-RECURRENT-2L.
