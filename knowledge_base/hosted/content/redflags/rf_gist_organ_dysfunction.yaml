id: RF-GIST-ORGAN-DYSFUNCTION
definition: >
  Baseline organ dysfunction precluding standard imatinib / sunitinib /
  regorafenib / avapritinib in GIST: LVEF <50% (sunitinib + regorafenib
  cardiotoxicity, hypertension), CrCl <30 mL/min (TKI-class dose
  adjustment, especially regorafenib), bilirubin >3× ULN (imatinib /
  avapritinib hepatic clearance — dose-limiting toxicity), or
  uncontrolled hypertension (sunitinib / regorafenib contraindicated).
definition_ua: >
  Вихідна дисфункція органів, яка перешкоджає стандартній терапії
  іматинібом / сунітинібом / регорафенібом / авапритинібом при GIST:
  LVEF <50% (кардіотоксичність сунітинібу + регорафенібу, гіпертензія),
  CrCl <30 (корекція дози TKI, особливо регорафенібу), білірубін >3× ULN
  (печінковий кліренс іматинібу / авапритинібу), неконтрольована
  гіпертензія (сунітиніб / регорафеніб протипоказані).

trigger:
  type: lab_value
  any_of:
    - finding: "lvef_percent"
      threshold: 50
      comparator: "<"
    - finding: "creatinine_clearance_ml_min"
      threshold: 30
      comparator: "<"
    - finding: "bilirubin_ratio_to_uln"
      threshold: 3
      comparator: ">="
    - finding: "uncontrolled_hypertension"
      value: true

clinical_direction: de-escalate

severity: major
priority: 100
category: organ-dysfunction

relevant_diseases:
  - DIS-GIST

sources:
  - SRC-NCCN-GIST-2025
  - SRC-ESMO-SARCOMA-2024

last_reviewed: "2026-04-27"
draft: false

notes: >
  Imatinib well-tolerated in mild-moderate hepatic impairment; severe
  hepatic dysfunction (Child-Pugh C) requires dose reduction. Sunitinib
  (2L) — significant cardiac signal: LVEF decline, hypertension,
  hand-foot syndrome — require baseline ECHO + serial monitoring, hold
  if LVEF drops >15% or below 50%. Regorafenib (3L) — hepatotoxicity
  (FDA boxed warning), severe hand-foot, hypertension — contraindicated
  if Child-Pugh C. Avapritinib carries CNS bleeding signal; QTc
  monitoring not required but cognitive effects observed at 300 mg.
  Uncontrolled hypertension is gating for sunitinib/regorafenib —
  optimize before initiation.
notes_ua: >
  Іматиніб добре переноситься при легкій-помірній печінковій дисфункції;
  тяжка дисфункція (Child-Pugh C) потребує корекції дози. Сунітиніб (2L) —
  значущий кардіологічний сигнал: зниження LVEF, гіпертензія — потрібні
  базова ЕхоКГ та серійний моніторинг, препарат утримати, якщо LVEF
  знижується >15% або опускається <50%. Регорафеніб (3L) — гепатотоксичність
  (попередження FDA у рамці), тяжкий долонно-підошовний синдром,
  гіпертензія — протипоказаний при Child-Pugh C. Авапритиніб має сигнал
  внутрішньочерепних кровотеч; моніторинг QTc не є обов'язковим, але при
  дозі 300 мг спостерігаються когнітивні ефекти. Неконтрольована
  гіпертензія є протипоказанням для призначення сунітинібу/регорафенібу —
  потребує оптимізації до початку терапії.
