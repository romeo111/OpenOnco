id: RF-GIST-TRANSFORMATION-PROGRESSION
definition: "Radiographic progression on imatinib (RECIST progression or new lesion), focal nodule-within-mass pattern on CT, rising SUV on PET, or imatinib trough <1100 ng/mL — requires re-biopsy for secondary KIT mutation, consideration of imatinib dose escalation to 800 mg, or switch to sunitinib / regorafenib / ripretinib."
definition_ua: "Радіологічне прогресування на іматинібі (за критеріями RECIST або нове вогнище), вогнище-у-масі (nodule-within-mass) на КТ, зростання SUV на ПЕТ, або залишкова (trough) концентрація іматинібу <1100 нг/мл — потрібна ребіопсія для виявлення вторинної мутації KIT, ескалація дози іматинібу до 800 мг або перехід на сунітиніб / регорафеніб / рипретиніб."

trigger:
  type: composite_clinical
  any_of:
    - finding: "imatinib_progression_recist"
      value: true
    - finding: "nodule_within_mass_pattern"
      value: true
    - finding: "rising_suv_on_imatinib"
      value: true
    - finding: "imatinib_trough_ng_ml"
      threshold: 1100
      comparator: "<"

clinical_direction: intensify
severity: major
priority: 60
category: transformation-progression

relevant_diseases: [DIS-GIST]

sources:
  - SRC-NCCN-MELANOMA-2025
  - SRC-ONCOKB

last_reviewed: '2026-04-26'
draft: false

notes: >
  Focal progression on imatinib classically arises from secondary KIT
  exon 13 / 14 (ATP-binding) or 17 / 18 (activation-loop) mutations
  emerging clonally. Sequence: dose-escalate to 800 mg if exon 11
  with focal progression and trough low; switch to sunitinib (B2222
  follow-on; ATP-binding mutations preferentially sensitive) at clear
  RECIST progression; regorafenib (GRID) at 3L; ripretinib (INVICTUS,
  switch-control inhibitor with broad coverage of secondary mutations)
  4L. Imatinib trough monitoring (target ≥1100 ng/mL) flags
  pharmacokinetic non-response distinct from biological resistance.
  Nodule-within-mass is a sensitive early imaging sign of resistance
  (Choi response criteria literature).
notes_ua: >
  Фокальне прогресування на іматинібі класично виникає внаслідок вторинних мутацій KIT екзону 13 / 14
  (ATP-зв'язувальна ділянка) або 17 / 18 (активаційна петля), що з'являються клонально. Послідовність дій:
  ескалація дози до 800 мг за наявності екзону 11 з фокальним прогресуванням і низькою залишковою
  концентрацією; перехід на сунітиніб (наступний препарат після B2222; мутації ATP-зв'язувальної ділянки
  переважно чутливі) при чіткому прогресуванні за RECIST; регорафеніб (GRID) у 3-й лінії; рипретиніб
  (INVICTUS, інгібітор switch-control з широким охопленням вторинних мутацій) у 4-й лінії. Моніторинг
  залишкової концентрації (trough) іматинібу (ціль ≥1100 нг/мл) вказує на фармакокінетичну відсутність
  відповіді, відмінну від біологічної резистентності. Вогнище-у-масі (nodule-within-mass) є чутливою ранньою
  рентгенологічною ознакою резистентності (за даними літератури щодо критеріїв відповіді Choi).
