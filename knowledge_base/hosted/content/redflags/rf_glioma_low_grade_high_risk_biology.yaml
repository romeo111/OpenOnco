id: RF-GLIOMA-LOW-GRADE-HIGH-RISK-BIOLOGY
definition: "Low-grade glioma with high-risk molecular features: IDH-wildtype (per WHO 5th ed., reclassified
  as glioblastoma molecular features even if histologically low-grade), CDKN2A/B homozygous deletion,
  TERT-promoter mutation in IDH-wildtype, or 1p/19q intact astrocytoma with poor risk score"
definition_ua: "Гліома низького ступеня з молекулярними факторами високого ризику: IDH-wildtype (за 5-м
  виданням класифікації WHO рекласифікується як молекулярні ознаки гліобластоми), гомозиготна делеція
  CDKN2A/B, мутація промотора TERT при IDH-wt, або 1p/19q-збережена астроцитома з несприятливим прогнозом"

trigger:
  type: composite
  any_of:
  - finding: "idh_wildtype"
    value: true
  - finding: "cdkn2a_b_homozygous_deletion"
    value: true
  - finding: "tert_promoter_mutation"
    value: true
  - finding: "histology_grade_3_features"
    value: true

clinical_direction: intensify

severity: critical
priority: 20
category: high-risk-biology
relevant_diseases:
- DIS-GLIOMA-LOW-GRADE
shifts_algorithm: []

sources:
- SRC-NCCN-CNS-2025
- SRC-EANO-GBM-2024
- SRC-WHO-LNSC-2023

last_reviewed: "2026-04-27"
draft: true
review_status: pending_clinical_signoff
drafted_by: claude_extraction
notes: >
  Per WHO 5th ed.: IDH-wildtype diffuse astrocytoma with EGFR amp / +7-10 /
  TERT-promoter mutation is reclassified as "glioblastoma, IDH-wildtype"
  regardless of histology grade — these patients are managed under
  GBM (DIS-GBM) algorithm, not LGG. Per EANO 2024 + NCCN-CNS LGG:
  CDKN2A/B homozygous deletion in IDH-mut astrocytoma confers grade 4
  behavior. Direction INTENSIFY — shifts to GBM-like management
  (Stupp protocol or aggressive RT + chemotherapy). STUB — requires
  clinical co-lead signoff.
notes_ua: >
  За 5-м виданням класифікації WHO: IDH-wildtype дифузна астроцитома з ампліфікацією EGFR / +7-10 /
  мутацією промотора TERT рекласифікується як «гліобластома, IDH-wildtype» незалежно від гістологічного
  ступеня — такі пацієнти ведуться за алгоритмом GBM (DIS-GBM), а не LGG. За EANO 2024 + NCCN-CNS LGG:
  гомозиготна делеція CDKN2A/B в IDH-мут астроцитомі надає поведінку, еквівалентну grade 4. Напрямок
  ІНТЕНСИФІКУВАТИ — переключає на GBM-подібне ведення (протокол Stupp або агресивна RT + хіміотерапія).
  ЧЕРНЕТКА — потребує підпису клінічного співкерівника.
