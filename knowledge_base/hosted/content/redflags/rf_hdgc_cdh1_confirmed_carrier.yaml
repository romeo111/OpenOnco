notes: >
  Prevention-persona RedFlag for CDH1 / HDGC confirmed carriers per
  IGCLC 2020 international guideline. Prophylactic total gastrectomy
  (PTG) recommended ages 20-30 (range 18-40 per individualised
  discussion); endoscopic surveillance is acknowledged inferior to
  PTG (diffuse-type signet-ring cell foci poorly visible) but offered
  to PTG-declining carriers. Female carriers: BRCA-style breast
  surveillance from age 30. STUB pending two-Co-Lead signoff per
  CHARTER §6.1 dev-mode.
