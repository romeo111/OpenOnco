id: RF-HDGC-CDH1-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in CDH1
  (E-cadherin) — Hereditary Diffuse Gastric Cancer (HDGC) syndrome.
  Autosomal-dominant; highly penetrant. Lifetime diffuse-type (signet
  ring cell) gastric cancer risk ~37-42% by age 80 in females, ~33-37%
  in males (downward-revised from earlier ~70-80% estimates per IGCLC
  2020 + Hansford 2015). Lifetime invasive lobular breast cancer risk
  in female carriers ~37-55% by age 80 (lobular histology dominant;
  ductal less). Other low-frequency cancers reported: cleft lip/palate
  (developmental), signet-ring colon (rare). Linitis plastica
  presentation common when symptomatic. Patient has confirmed positive
  germline test; no current personal cancer diagnosis in the carrier
  being assessed. Prevention-persona RedFlag (§20, v0.3 pediatric
  predisposition expansion — though HDGC carriers are typically adults
  not children; included in pediatric group because IGCLC explicitly
  addresses adolescent decision-making for prophylactic gastrectomy
  timing).
definition_ua: >-
  Підтверджений germline pathogenic / likely-pathogenic variant у CDH1
  (E-cadherin) — Hereditary Diffuse Gastric Cancer (HDGC) syndrome.
  Autosomal-dominant; highly penetrant. Lifetime diffuse-type (signet
  ring cell) gastric cancer ризик ~37-42% by age 80 у жінок, ~33-37%
  у чоловіків (downward-revised з раніших ~70-80% estimates per
  IGCLC 2020 + Hansford 2015). Lifetime invasive lobular breast cancer
  ризик у female carriers ~37-55% by age 80 (lobular histology
  dominant; ductal менше). Інші low-frequency cancers: cleft lip/palate
  (developmental), signet-ring colon (rare). Linitis plastica
  presentation common при symptomatic. Prevention-персона RedFlag
  (§20, v0.3 pediatric predisposition expansion).

