id: RF-HEMOCHROMATOSIS-HCC-PREVENTION
definition: >-
  Hereditary hemochromatosis (HFE-related; C282Y homozygous genotype
  primarily, compound C282Y/H63D heterozygous less common) with
  biochemical or histologic iron overload in an individual without a
  current HCC diagnosis. Strongest genetic HCC risk factor among
  metabolic-genetic liver diseases: relative risk ~20-200x in
  cirrhotic HFE C282Y homozygotes (population baseline rare; absolute
  HCC incidence ~3-5%/year in cirrhotic HH cohorts). Non-cirrhotic
  HFE-positive iron-overload patients carry near-baseline HCC risk;
  the cirrhotic transition is the inflection point. Phlebotomy
  treatment to deplete iron stores (target ferritin <50 ng/mL,
  transferrin saturation <50%) arrests further iron-driven hepatic
  injury but does not reverse established cirrhosis or eliminate
  HCC risk in cirrhotic patients. AASLD HCC surveillance with US ±
  AFP q6mo recommended in HH-associated cirrhosis. Prevention-persona
  RedFlag (§20 ratification 2026-05-18, v0.3 chronic-condition pilot).
definition_ua: >-
  Спадковий гемохроматоз (HFE-асоційований; переважно гомозиготний
  генотип C282Y, рідше — компаунд-гетерозиготний варіант C282Y/H63D)
  з біохімічним або гістологічним перевантаженням залізом у пацієнта
  без поточного діагнозу HCC. Найсильніший генетичний фактор ризику
  HCC серед метаболічно-генетичних захворювань печінки: відносний
  ризик ~20-200x у гомозиготних за HFE C282Y пацієнтів із цирозом
  (популяційний базовий рівень рідкісний; абсолютна захворюваність
  на HCC ~3-5%/рік у когортах HH із цирозом). У HFE-позитивних
  пацієнтів з перевантаженням залізом без цирозу ризик HCC близький
  до базового; перехід до цирозу є переломним моментом. Лікування
  флеботомією для виснаження запасів заліза (цільовий феритин
  <50 нг/мл, насичення трансферину <50%) зупиняє подальше зумовлене
  залізом ушкодження печінки, але не усуває вже сформований цироз і
  не знижує ризик HCC у пацієнтів із цирозом. Скринінг HCC за AASLD
  (УЗД ± AFP кожні 6 міс) рекомендований при HH-асоційованому цирозі.
  RedFlag профілю профілактики (ратифікація §20, 2026-05-18, пілот
  v0.3 щодо хронічних станів).

