id: RF-HGBL-DH-ORGAN-DYSFUNCTION
definition: "Cardiac dysfunction (LVEF <50%) — DA-EPOCH-R (preferred for HGBL-DH/-TH) is anthracycline-intensive;
  cardio-onc consult and dose-modification required."
definition_ua: "Кардіальна дисфункція (LVEF <50%) — DA-EPOCH-R (препарат вибору при HGBL-DH/-TH) є
  антрациклін-інтенсивним режимом; необхідні консультація кардіоонколога та корекція дози."

trigger:
  type: lab_value
  any_of:
  - finding: "lvef_percent"
    threshold: 50
    comparator: "<"


clinical_direction: investigate
severity: major
priority: 100
category: organ-dysfunction

relevant_diseases: [DIS-HGBL-DH]
shifts_algorithm: []

sources:
- SRC-NCCN-BCELL-2025
- SRC-ESMO-DLBCL-2024

last_reviewed: "2026-04-25"
draft: false

notes: >
  DA-EPOCH-R cumulative doxorubicin exceeds R-CHOP; cardio-monitoring should be aggressive in baseline-borderline
  LVEF. Indication-level dose adjustment, not 1L Algorithm shift.
notes_ua: >
  Кумулятивна доза доксорубіцину при DA-EPOCH-R перевищує таку при R-CHOP; кардіомоніторинг має бути
  агресивним при пограничній вихідній LVEF. Корекція дози на рівні показання, а не зміна 1L-алгоритму.
ukrainian_review_status: pending_clinical_signoff
