id: RF-HGBL-DH-TRANSFORMATION-PROGRESSION
definition: "PET-2 progression (Deauville 4-5 with new lesions) or end-of-induction non-CR — HGBL-DH refractory
  disease has very poor outcomes; CAR-T (axi-cel/liso-cel) preferred over salvage chemo."
definition_ua: "PET-2 прогресія (Deauville 4-5 з новими вогнищами) або відсутність CR наприкінці індукції —
  рефрактерна HGBL-DH має дуже поганий прогноз; CAR-T-терапія (axi-cel/liso-cel) є пріоритетною порівняно
  із сальваджевою хіміотерапією."

trigger:
  type: imaging_finding
  any_of:
  - finding: "interim_pet_progression"
    value: true
  - finding: "end_induction_non_cr"
    value: true


clinical_direction: investigate
severity: critical
priority: 100
category: transformation-progression

relevant_diseases: [DIS-HGBL-DH]
shifts_algorithm: []

sources:
- SRC-NCCN-BCELL-2025
- SRC-ESMO-DLBCL-2024

last_reviewed: "2026-04-25"
draft: false

notes: >
  Refractory HGBL-DH 12-month OS ~30% with chemo salvage; ZUMA-12 axi-cel data support CAR-T-first paradigm.
  Sits in 2L Algorithm not 1L; flag drives MDT priority.
notes_ua: >
  Рефрактерна HGBL-DH має 12-місячну загальну виживаність ~30% при сальваджевій хіміотерапії; дані
  дослідження ZUMA-12 (axi-cel) підтверджують перевагу підходу CAR-T-first. Належить до 2L-алгоритму, а не
  1L; прапорець підвищує пріоритет розгляду на MDT.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_09
draft_revision: 3
