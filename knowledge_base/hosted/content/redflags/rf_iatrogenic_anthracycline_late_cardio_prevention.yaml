id: RF-IATROGENIC-ANTHRACYCLINE-LATE-CARDIO-PREVENTION
definition: >-
  Cancer survivor ≥5 years post-completion of curative-intent oncology
  treatment that included cumulative anthracycline exposure
  ≥250 mg/m² (doxorubicin equivalent). Distinct from
  RF-IATROGENIC-ANTHRACYCLINE-CARDIO-PREVENTION (general anthracycline
  cardio surveillance starting at completion): this RF targets the
  long-term cancer-survivor cohort 5y+ post-treatment where surveillance
  cadence is set by Children's Oncology Group Long-Term Follow-Up
  Guidelines (COG-LTFU) + ASCO Cardio-Oncology Survivorship + ESC 2022
  Cardio-Oncology. Late-effect cardiomyopathy incidence rises through
  decades post-exposure — childhood cancer survivors with cumulative
  doxorubicin ≥250 mg/m² have 5-15× HF risk vs. siblings at 30y of
  follow-up (Childhood Cancer Survivor Study). Risk amplifiers concurrent
  chest RT, age <18 or ≥65 at exposure, hypertension/diabetes/CAD.
  Prevention-persona RedFlag (§20 cancer-survivor late-effects pilot).
definition_ua: >-
  Виживший після раку через ≥5 років після завершення протипухлинного
  лікування з куративною метою, яке включало кумулятивну експозицію до
  антрациклінів ≥250 мг/м² (в еквіваленті доксорубіцину). Відрізняється
  від RF-IATROGENIC-ANTHRACYCLINE-CARDIO-PREVENTION (загальний
  кардіологічний нагляд після антрациклінів, що починається одразу
  після завершення лікування): цей RF стосується когорти довгострокових
  виживших через 5+ років після лікування, де періодичність нагляду
  визначається настановами Children's Oncology Group з довгострокового
  спостереження (COG-LTFU), ASCO Cardio-Oncology Survivorship та ESC
  2022 Cardio-Oncology. Частота пізньої кардіоміопатії зростає протягом
  десятиліть після експозиції — виживші після дитячого раку з
  кумулятивною дозою доксорубіцину ≥250 мг/м² мають у 5-15 разів вищий
  ризик серцевої недостатності порівняно з братами/сестрами через 30
  років спостереження (Childhood Cancer Survivor Study). Фактори, що
  посилюють ризик: супутня променева терапія на грудну клітку, вік <18
  або ≥65 років на момент експозиції, артеріальна гіпертензія / цукровий
  діабет / CAD.

trigger:
  type: lab_value
  any_of:
    - finding: "survivor_5y_post_anthracycline_cumulative_ge_250_mg_m2"
      value: true
    - finding: "survivor_anthracycline_plus_chest_rt_late_effect"
      value: true
    - finding: "survivor_pediatric_anthracycline_late_effect"
      value: true

clinical_direction: investigate

severity: major
