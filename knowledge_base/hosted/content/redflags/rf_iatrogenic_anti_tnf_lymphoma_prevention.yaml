id: RF-IATROGENIC-ANTI-TNF-LYMPHOMA-PREVENTION
definition: >-
  Chronic anti-TNF biologic exposure ≥3 years in pediatric, adolescent,
  or young-adult inflammatory bowel disease (IBD) — infliximab,
  adalimumab, certolizumab pegol, golimumab. Modest lymphoma signal:
  most population-based analyses (e.g., DOLCE, Danish nationwide cohort)
  show small absolute-risk excess, dominated by NOT-additive signal
  with concomitant thiopurine (azathioprine / 6-MP) — the most-reported
  rare hepatosplenic T-cell lymphoma (HSTCL) cases occur in young male
  IBD patients on COMBINATION anti-TNF + thiopurine ≥1-2 years, not
  anti-TNF monotherapy. FDA Boxed Warning for anti-TNF + thiopurine
  combination in pediatric / young-adult IBD specifically calls out
  HSTCL risk. Anti-TNF monotherapy in adults aged ≥35: lymphoma RR
  approximately 1.0-1.3 vs background — within statistical noise.
  Pediatric / young-adult cohort is the higher-attention subset; in
  adults the conversation is dominated by combination-therapy
  considerations. Other cancer signals: modest non-melanoma skin
  cancer (synergistic with thiopurine + UV); melanoma signal small
  + inconsistent across studies. NCCN B-cell + ECCO + AAP / NASPGHAN
  IBD-pediatric guidance. Prevention-persona RedFlag — emphasis on
  EBV serology pre-initiation, B-symptom + lymphadenopathy awareness,
  skin examination, periodic discussion of combination-therapy step-
  down where IBD activity allows, vaccination catch-up. (§20 v0.3
  iatrogenic pilot).
definition_ua: >-
  Хронічна експозиція до біологічних препаратів анти-TNF ≥3 років у
  дітей, підлітків або молодих дорослих із запальними захворюваннями
  кишківника (IBD) — інфліксимаб, адалімумаб, цертолізумаб пегол,
  голімумаб. Помірний сигнал щодо лімфоми: більшість популяційних
  аналізів (наприклад, DOLCE, датська національна когорта) показують
  невеликий надлишковий абсолютний ризик, здебільшого не адитивний із
  супутнім прийомом тіопуринів (азатіоприн / 6-MP) — найчастіше
  описані рідкісні випадки гепатоспленічної T-клітинної лімфоми
  (HSTCL) трапляються у молодих чоловіків з IBD на КОМБІНАЦІЇ анти-TNF
  + тіопурин ≥1-2 роки, а не на монотерапії анти-TNF. Попередження в
  рамці FDA (Boxed Warning) щодо комбінації анти-TNF + тіопурин у
  дітей / молодих дорослих з IBD окремо вказує на ризик HSTCL.
  Монотерапія анти-TNF у дорослих віком ≥35 років: відносний ризик
  лімфоми приблизно 1.0-1.3 порівняно з фоновим — у межах
  статистичного шуму. Когорта дітей / молодих дорослих потребує
  підвищеної уваги; у дорослих обговорення зосереджене переважно на
  міркуваннях щодо комбінованої терапії. Інші онкологічні сигнали:
  помірний ризик немеланомного раку шкіри (синергічний з тіопурином +
  УФ-опроміненням); сигнал щодо меланоми малий і непослідовний між
  дослідженнями. Настанови NCCN B-cell + ECCO + AAP / NASPGHAN щодо
  педіатричного IBD. RedFlag персони профілактики — акцент на
  серології EBV перед початком лікування, настороженості щодо
  B-симптомів і лімфаденопатії, огляді шкіри, періодичному обговоренні
  зниження інтенсивності комбінованої терапії там, де активність IBD
  дозволяє, та надолуженні вакцинації.

