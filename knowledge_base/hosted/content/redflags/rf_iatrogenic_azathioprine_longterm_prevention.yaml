id: RF-IATROGENIC-AZATHIOPRINE-LONGTERM-PREVENTION
definition: >-
  Long-term thiopurine exposure ≥3-5 years — azathioprine or its active
  metabolite 6-mercaptopurine (6-MP) — across inflammatory bowel disease
  (Crohn disease, ulcerative colitis), rheumatoid arthritis, systemic
  lupus erythematosus, autoimmune hepatitis, transplant maintenance,
  and other autoimmune indications. IARC Group 1 carcinogen
  (azathioprine). Mechanism: thio-purine metabolites incorporate into
  DNA → impaired mismatch-repair + photo-sensitization (UV-A absorption
  by 6-thioguanine in DNA generates reactive oxygen species). Risk
  profile: lymphoma 4-6x population risk (predominantly diffuse large
  B-cell lymphoma; in some IBD cohorts hepatosplenic T-cell lymphoma
  appears with anti-TNF combination — see separate anti-TNF RF);
  non-melanoma skin cancer (especially SCC) 4-10x background, magnitude
  scaling with cumulative dose-years and UV exposure; modest melanoma
  signal; in IBD specifically: Epstein-Barr virus-driven post-thiopurine
  lymphoma in EBV-seronegative young men (avoid azathioprine in EBV-
  seronegative young-adult IBD patients per ECCO 2019). Prevention-
  persona RedFlag — emphasis on annual skin examination + sun protection,
  EBV serology baseline check in young adults considering azathioprine,
  shared-decision discussion of indication continuation vs alternatives
  (methotrexate for RA, vedolizumab / ustekinumab for IBD where
  acceptable), HPV-vaccination catch-up where applicable, B-symptom
  awareness. (§20 v0.3 iatrogenic pilot).
definition_ua: >-
  Тривала експозиція до тіопуринів ≥3-5 років — азатіоприну або його
  активного метаболіту 6-меркаптопурину (6-MP) — при запальних
  захворюваннях кишківника (IBD, хвороба Крона, виразковий коліт),
  ревматоїдному артриті, системному червоному вовчаку, автоімунному
  гепатиті, підтримувальній терапії після трансплантації та інших
  автоімунних показаннях. Канцероген групи 1 IARC (азатіоприн).
  Механізм: метаболіти тіопуринів вбудовуються в ДНК → порушення
  репарації неспарених основ + фоточутливість (поглинання UV-A
  6-тіогуаніном у ДНК генерує активні форми кисню). Профіль ризику:
  лімфома — у 4-6 разів вищий за популяційний ризик (переважно
  дифузна В-великоклітинна лімфома, DLBCL; у деяких когортах IBD
  гепатоспленічна T-клітинна лімфома трапляється при комбінації з
  анти-TNF — див. окремий RF щодо анти-TNF); немеланомний рак шкіри
  (особливо плоскоклітинний, SCC) — у 4-10 разів вищий за фоновий,
  величина залежить від кумулятивної тривалості прийому та
  УФ-опромінення; помірний сигнал щодо меланоми; специфічно при IBD:
  лімфома, пов'язана з вірусом Епштейна-Барр (EBV), після прийому
  тіопуринів у EBV-серонегативних молодих чоловіків (слід уникати
  призначення азатіоприну EBV-серонегативним молодим дорослим з IBD
  згідно з ECCO 2019). RedFlag персони профілактики — акцент на
  щорічному огляді шкіри та захисті від сонця, базовій серології EBV
  у молодих дорослих, які розглядають азатіоприн, спільному
  обговоренні продовження показання проти альтернатив (метотрексат
  при ревматоїдному артриті, ведолізумаб / устекінумаб при IBD, де
  прийнятно), надолуженні вакцинації проти HPV там, де застосовно,
  настороженості щодо B-симптомів.

