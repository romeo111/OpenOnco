id: RF-IATROGENIC-CALCINEURIN-INHIBITOR-LONGTERM-PREVENTION
definition: >-
  Long-term calcineurin-inhibitor exposure ≥5 years — cyclosporine
  or tacrolimus (prograf, FK-506) — across transplant, autoimmune
  (psoriasis, atopic dermatitis, refractory nephrotic syndrome),
  and ophthalmologic / other indications. IARC Group 1 carcinogen
  (cyclosporine). Mechanism: direct calcineurin-pathway suppression
  of T-cell function plus pro-oncogenic effects (TGF-β upregulation,
  IL-6 induction, impaired DNA repair, anti-apoptotic signaling).
  Risk profile: cutaneous squamous-cell carcinoma 65-100x background
  in transplant cohort (calcineurin-inhibitors are a primary driver
  of this excess), basal-cell carcinoma 10-20x, aggressive SCC
  variant prone to local recurrence + perineural invasion + nodal
  metastasis; Kaposi sarcoma in HHV-8-exposed cohort (KSHV
  reactivation under calcineurin inhibition); cutaneous T-cell
  lymphoma (less common); lip cancer (cumulative UV co-factor);
  modest increase in non-cutaneous cancers (lymphoma, post-transplant
  lymphoproliferative disorder). Cancer signal generally higher with
  cyclosporine than tacrolimus in head-to-head comparisons;
  cyclosporine has the more robust IARC Group 1 designation.
  Prevention-persona RedFlag — emphasis on intensive skin
  surveillance, sun protection, HPV vaccination catch-up, and
  shared-decision discussion of switch to mTOR inhibitor
  (sirolimus / everolimus) in the high-skin-cancer-burden cohort
  (CONVERT trial + ProSparc evidence: mTOR switch reduces new
  SCC incidence). NEVER unilateral switch — coordinated with
  transplant nephrologist / hepatologist / cardiologist or
  dermatologist as appropriate. (§20 v0.3 iatrogenic pilot).
definition_ua: >-
  Тривала експозиція до інгібіторів кальциневрину ≥5 років —
  циклоспорину або такролімусу (програф, FK-506) — при трансплантації,
  автоімунних станах (псоріаз, атопічний дерматит, рефрактерний
  нефротичний синдром) та офтальмологічних / інших показаннях.
  Канцероген групи 1 IARC (циклоспорин). Механізм: пряме пригнічення
  функції T-клітин через кальциневриновий шлях у поєднанні з
  проонкогенними ефектами (посилення TGF-β, індукція IL-6, порушення
  репарації ДНК, антиапоптотична сигналізація). Профіль ризику:
  плоскоклітинний рак шкіри (SCC) — у 65-100 разів вищий за фоновий у
  когорті трансплантованих (інгібітори кальциневрину — основний
  чинник цього надлишку), базальноклітинний рак (BCC) — у 10-20 разів
  вищий, агресивний варіант плоскоклітинного раку схильний до
  місцевого рецидиву + периневральної інвазії + метастазування в
  лімфовузли; саркома Капоші у когорті, експонованій до HHV-8
  (реактивація KSHV на тлі пригнічення кальциневрину); T-клітинна
  лімфома шкіри (рідше); рак губи (кумулятивний УФ-кофактор); помірне
  підвищення некутанних злоякісних пухлин (лімфома, посттрансплантаційний
  лімфопроліферативний розлад). Онкологічний сигнал загалом вищий при
  застосуванні циклоспорину, ніж такролімусу, за прямими порівняннями;
  циклоспорин має більш обґрунтоване віднесення до групи 1 IARC.
  RedFlag персони профілактики — акцент на інтенсивному нагляді за
  шкірою, захисті від сонця, надолуженні вакцинації проти HPV та
  спільному обговоренні переходу на інгібітор mTOR (сиролімус /
  еверолімус) у когорті з високим тягарем раку шкіри (дослідження
  CONVERT і дані ProSparc: перехід на mTOR знижує частоту нового
  плоскоклітинного раку). НІКОЛИ не змінювати терапію одноосібно —
  рішення координується з трансплантологом-нефрологом / гепатологом /
  кардіологом або дерматологом залежно від ситуації.

