id: RF-IATROGENIC-COMBINED-HRT-PREVENTION
definition: >-
  Cumulative use of combined hormone replacement therapy (estrogen +
  progestin / progestogen) ≥5 years in postmenopausal women — IARC
  Group 1 carcinogen (combined menopausal therapy). Elevated risk
  profile: breast cancer +1.2-1.7x with current use, magnitude scaling
  with duration (~+8 cases per 10,000 woman-years per WHI Combined-HRT
  arm at year 5), effect attenuates within 5-10 years of stopping;
  endometrial cancer risk depends on regimen: continuous combined HRT
  (daily estrogen + daily progestin) NEUTRAL or slightly protective vs
  no HRT (~RR 1.0-1.1) — the progestin opposes estrogen-driven
  endometrial proliferation. Sequential / cyclic combined regimens
  (estrogen daily + progestin 10-14 days/month) carry a smaller but
  measurable endometrial-cancer signal (~RR 1.2-1.5) vs continuous
  combined. Estrogen-ALONE HRT in a woman with intact uterus carries
  marked endometrial cancer risk (~RR 5-10) — contraindicated in
  intact-uterus women; covered by separate guideline-level safety
  prohibition rather than this RF. Modest ovarian-cancer signal
  (+1.2-1.4x at ≥5y exposure) per Collaborative Group on Epidemiological
  Studies of Ovarian Cancer 2015. Prevention-persona RedFlag —
  shared decision-making framework with patient: continued HRT
  use if vasomotor symptom benefit > breast/cardiovascular risk
  on individualized basis. NOT a recommendation to stop HRT
  automatically. Prevention-persona RedFlag (§20 v0.3 iatrogenic
  pilot).
definition_ua: >-
  Кумулятивне застосування комбінованої замісної гормональної терапії
  (ЗГТ) (естроген + прогестин / прогестоген) ≥5 років у жінок у
  постменопаузі — канцероген групи 1 IARC (комбінована менопаузальна
  терапія). Підвищений профіль ризику: рак молочної залози — у
  1.2-1.7 раза вищий при поточному застосуванні, величина зростає з
  тривалістю (~+8 випадків на 10 000 жінко-років за даними групи
  комбінованої ЗГТ дослідження WHI на 5-му році), ефект слабшає
  протягом 5-10 років після припинення; ризик раку ендометрія
  залежить від режиму: безперервна комбінована ЗГТ (щоденний естроген
  + щоденний прогестин) НЕЙТРАЛЬНА або дещо протективна порівняно з
  відсутністю ЗГТ (~відносний ризик (ВР) 1.0-1.1) — прогестин
  протидіє естроген-опосередкованій проліферації ендометрія.
  Послідовні / циклічні комбіновані режими (щоденний естроген +
  прогестин 10-14 днів/місяць) несуть менший, але вимірюваний сигнал
  щодо раку ендометрія (~ВР 1.2-1.5) порівняно з безперервною
  комбінованою схемою. Монотерапія естрогеном у жінки зі збереженою
  маткою несе виражений ризик раку ендометрія (~ВР 5-10) —
  протипоказана жінкам зі збереженою маткою; охоплюється окремою
  настановою-забороною на рівні безпеки, а не цим RF. Помірний сигнал
  щодо раку яєчників (+1.2-1.4 раза при експозиції ≥5 років) за даними
  Collaborative Group on Epidemiological Studies of Ovarian Cancer
  2015. RedFlag персони профілактики — модель спільного прийняття
  рішень з пацієнткою: продовження ЗГТ, якщо користь від контролю
  вазомоторних симптомів перевищує ризик для молочної залози /
  серцево-судинної системи, на індивідуалізованій основі. Це НЕ
  рекомендація припиняти ЗГТ автоматично.

