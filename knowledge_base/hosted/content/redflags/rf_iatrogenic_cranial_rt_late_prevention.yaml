id: RF-IATROGENIC-CRANIAL-RT-LATE-PREVENTION
definition: >-
  Cancer survivor ≥5 years post-completion of curative-intent oncology
  treatment that included cranial radiotherapy — most commonly pediatric
  ALL (whole-brain RT or craniospinal), pediatric brain tumor (medulloblastoma,
  ependymoma, low-grade glioma), prophylactic cranial irradiation (PCI) in
  SCLC, primary CNS lymphoma RT, head-and-neck RT with brain in field.
  Three principal late-effect domains: (1) secondary CNS tumors —
  meningioma (highest incidence, latency 15-30y, cumulative 1-3% at 30y),
  high-grade glioma, low-grade glioma; (2) endocrine sequelae from
  hypothalamic-pituitary axis injury — growth hormone deficiency, thyroid
  dysfunction (hypothyroidism from indirect or direct neck-field exposure),
  gonadal dysfunction, ACTH deficiency; (3) neurocognitive late effects —
  attention deficits, processing speed, executive dysfunction, dementia
  risk in older survivors. Surveillance cadence per COG-LTFU + Childhood
  Cancer Survivor Study (CCSS) + NCCN CNS guidelines.
  Prevention-persona RedFlag (§20 cancer-survivor late-effects pilot).
definition_ua: >-
  Виживший після раку через ≥5 років після завершення протипухлинного
  лікування з куративною метою, яке включало краніальну променеву
  терапію — найчастіше при дитячому гострому лімфобластному лейкозі
  (ALL) (тотальне опромінення головного мозку або краніоспінальне
  опромінення), дитячій пухлині головного мозку (медулобластома,
  епендимома, гліома низького ступеня злоякісності), профілактичному
  опроміненні головного мозку (PCI) при дрібноклітинному раку легені
  (SCLC), променевій терапії первинної лімфоми ЦНС, променевій терапії
  голови та шиї з включенням головного мозку в поле опромінення. Три
  основні домени пізніх ефектів: (1) вторинні пухлини ЦНС — менінгіома
  (найвища частота, латентність 15-30 років, кумулятивно 1-3% через 30
  років), гліома високого ступеня злоякісності, гліома низького
  ступеня злоякісності; (2) ендокринні наслідки ураження
  гіпоталамо-гіпофізарної осі — дефіцит гормону росту, дисфункція
  щитоподібної залози (гіпотиреоз через непряму або пряму експозицію
  шийного поля), гонадна дисфункція, дефіцит ACTH; (3) нейрокогнітивні
  пізні ефекти — порушення уваги, швидкості обробки інформації,
  виконавчих функцій, ризик деменції у старших виживших. Періодичність
  нагляду визначається настановами COG-LTFU + Childhood Cancer
  Survivor Study (CCSS) + NCCN CNS.

