id: RF-IATROGENIC-DES-EXPOSURE-PREVENTION
definition: >-
  In-utero exposure to diethylstilbestrol (DES), a synthetic non-
  steroidal estrogen prescribed to pregnant women 1940s-1970s to
  prevent miscarriage and pregnancy complications (US peak 1947-1971;
  withdrawn for this indication 1971; smaller cohorts in Europe used
  through the late 1970s). Daughters of women who took DES during
  pregnancy ("DES daughters") have a markedly elevated risk of clear-
  cell adenocarcinoma of the vagina and cervix (CCA) — a rare cancer
  with a clear bimodal age distribution: peak at 15-25 years
  (historically detected during the first DES surveillance era) and
  a second elevated-risk window persisting through age 40+; cumulative
  lifetime CCA risk in DES-exposed cohort approximately 1 per 1000
  (vs ~1 per million in unexposed) — IARC Group 1 carcinogen for
  this exact exposure. Additionally elevated: cervical intraepithelial
  neoplasia / carcinoma in situ (CIS), structural Müllerian-tract
  anomalies (T-shaped uterus, cervical hood / ridge), modestly
  elevated breast cancer risk after age 40. DES granddaughters
  (third generation) have limited but inconclusive data signals.
  Cohort is aging (DES daughters born 1940-1971 are now 55-86 years
  old in 2026) — still benefits from clinical-exam surveillance
  given prolonged CCA-risk window. Prevention-persona RedFlag
  (§20 v0.3 iatrogenic pilot).
definition_ua: >-
  Внутрішньоутробна експозиція до діетилстильбестролу (DES) —
  синтетичного нестероїдного естрогену, який призначали вагітним
  жінкам у 1940-1970-х роках для запобігання викидню та ускладненням
  вагітності (пік застосування в США 1947-1971; відкликаний за цим
  показанням у 1971 році; менші когорти в Європі застосовували його
  до кінця 1970-х років). Доньки жінок, які приймали DES під час
  вагітності («доньки DES»), мають виражено підвищений ризик
  світлоклітинної аденокарциноми піхви та шийки матки (CCA) —
  рідкісного раку з чітким бімодальним розподілом за віком: перший
  пік у 15-25 років (історично виявлявся в перші роки нагляду за
  DES-експозицією) і друге вікно підвищеного ризику, що зберігається
  після 40 років; кумулятивний довічний ризик CCA в експонованій до
  DES когорті становить приблизно 1 на 1000 (порівняно з ~1 на
  мільйон у неекспонованих) — канцероген групи 1 IARC саме для цієї
  експозиції. Додатково підвищені: цервікальна інтраепітеліальна
  неоплазія / карцинома in situ (CIS), структурні аномалії мюллерової
  протоки (Т-подібна матка, шийковий капюшон / гребінь), помірно
  підвищений ризик раку молочної залози після 40 років. У «онучок
  DES» (третє покоління) сигнали обмежені та непереконливі. Когорта
  старіє (доньки DES, народжені у 1940-1971 роках, у 2026 році мають
  55-86 років) — усе ще потребує клінічного нагляду з огляду на
  тривале вікно ризику CCA.

