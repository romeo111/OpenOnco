last_reviewed: "2026-05-19"
reviewer_signoffs: 0
notes: >
  Prevention-persona RedFlag for I-131 therapeutic-dose lifetime
  cumulative exposure. Surveillance: CBC q12mo for leukemia signal
  (sensitivity modest); breast surveillance per general-population
  USPSTF unless additional risk factors; oral + salivary symptom
  awareness. Highest-impact preventive intervention is hydration +
  lemon-juice sialagogue during I-131 administration (reduces salivary
  gland uptake) — retrospectively non-actionable for prior exposure.
  STUB pending two-Co-Lead signoff per CHARTER §6.1 dev-mode.
