id: RF-IATROGENIC-IODINE131-SECONDARY-PREVENTION
definition: >-
  Therapeutic radioiodine (I-131) exposure for differentiated thyroid
  cancer (DTC) ablation/treatment OR Graves' disease — cumulative
  doses ≥100 mCi (3.7 GBq) lifetime confer small-but-real increased
  risk of secondary malignancies. Strongest signal: leukemia (RR
  ~1.5-2.0 above population baseline; latency 2-10 years), salivary
  gland cancer (RR ~1.3-2.0; latency 5-15 years), breast cancer in
  females (RR ~1.2-1.4; lower-quality evidence, dose-dependent),
  bladder cancer (modest signal). Iodine concentrates in salivary
  glands + stomach + bladder during excretion; non-target dose drives
  secondary cancer signal. Risk modestly higher at younger ages of
  exposure (proliferating tissues more radiosensitive). Prevention-
  persona RedFlag (§20, v0.3 iatrogenic expansion).
definition_ua: >-
  Therapeutic radioiodine (I-131) експозиція для differentiated thyroid
  cancer (DTC) ablation/treatment АБО Graves' disease — cumulative
  doses ≥100 mCi (3.7 GBq) lifetime дають small-but-real increased
  ризик secondary malignancies. Найсильніший signal: leukemia (RR
  ~1.5-2.0 above population baseline; latency 2-10 років), salivary
  gland cancer (RR ~1.3-2.0; latency 5-15 років), breast cancer у жінок
  (RR ~1.2-1.4; lower-quality evidence, dose-dependent), bladder cancer
  (modest signal). Iodine concentrates у salivary glands + stomach +
  bladder during excretion; non-target dose drives secondary cancer
  signal. Ризик скромно вищий при younger ages of exposure
  (proliferating tissues more radiosensitive). Prevention-персона
  RedFlag (§20, v0.3 iatrogenic expansion).

