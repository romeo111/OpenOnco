id: RF-IATROGENIC-LONG-TERM-HRMNL-CONTRACEPTION-PREVENTION
definition: >-
  Cumulative use of estrogen-containing or combined hormonal
  contraception (combined oral contraceptive, combined patch, combined
  vaginal ring) ≥10 years — IARC Group 1 carcinogen (estrogen-progestogen
  combined oral contraceptives). Modest, small-magnitude relative-risk
  elevation: breast cancer +1.2-1.3x during current/recent use (effect
  attenuates within 10 years of stopping; population-level absolute
  increment ~13 extra cases per 100,000 woman-years for ages 35-39);
  cervical cancer +1.5-2.0x at ≥5y use among high-risk HPV-positive
  cohort (mechanism: probable co-factor for HPV persistence + cervical
  squamous-cell carcinoma progression). NOTE: this iatrogenic-persona
  RF is intentionally distinct from RF-REPRODUCTIVE-OCP-LONG-TERM,
  which carries the BALANCED risk-benefit counseling framing
  (substantial ovarian + endometrial protection lifelong). The
  iatrogenic-persona view focuses on the exposure-as-risk axis —
  patient who has already stopped OCP after long use, or who is
  evaluating ongoing breast-screening adequacy + HPV-co-test cadence
  in the context of prior exposure. Prevention-persona RedFlag
  (§20 v0.3 iatrogenic pilot).
definition_ua: >-
  Кумулятивне застосування естроген-вмісної або комбінованої
  гормональної контрацепції (комбіновані оральні контрацептиви,
  комбінований пластир, комбіноване вагінальне кільце) ≥10 років —
  канцероген групи 1 IARC (комбіновані естроген-прогестагенні оральні
  контрацептиви). Помірне підвищення відносного ризику невеликої
  величини: рак молочної залози — у 1.2-1.3 раза вищий під час
  поточного/недавнього застосування (ефект слабшає протягом 10 років
  після припинення; популяційний абсолютний приріст ~13 додаткових
  випадків на 100 000 жінко-років для віку 35-39 років); рак шийки
  матки — у 1.5-2.0 раза вищий при застосуванні ≥5 років у когорті з
  високим ризиком, HPV-позитивній (механізм: імовірний кофактор
  персистенції HPV та прогресії плоскоклітинного раку шийки матки).
  ПРИМІТКА: цей RF ятрогенної персони навмисно відрізняється від
  RF-REPRODUCTIVE-OCP-LONG-TERM, який має ЗБАЛАНСОВАНЕ формулювання
  консультування щодо співвідношення ризику й користі (суттєвий
  довічний захисний ефект щодо раку яєчників та ендометрія). Погляд
  ятрогенної персони зосереджений на осі «експозиція як ризик» —
  пацієнтка, яка вже припинила прийом оральних контрацептивів після
  тривалого застосування, або оцінює адекватність поточного графіка
  скринінгу молочної залози та ко-тестування на HPV у контексті
  попередньої експозиції.

