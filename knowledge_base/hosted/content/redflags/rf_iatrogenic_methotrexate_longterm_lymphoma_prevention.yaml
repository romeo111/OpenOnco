notes: >
  Prevention-persona RedFlag for long-term low-dose MTX exposure (RA,
  psoriasis, IBD). Surveillance: low-threshold workup for unexplained
  lymphadenopathy, B-symptoms, organomegaly, mass — MTX withdrawal +
  observe 8-12 weeks first (~50% regress); persistent → DLBCL-style
  workup. Skin examination annually. STUB pending two-Co-Lead signoff
  per CHARTER §6.1 dev-mode.
