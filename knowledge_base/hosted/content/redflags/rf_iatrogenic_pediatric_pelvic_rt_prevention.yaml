id: RF-IATROGENIC-PEDIATRIC-PELVIC-RT-PREVENTION
definition: >-
  Cancer survivor ≥5 years post-completion of curative-intent oncology
  treatment that included pediatric pelvic radiotherapy. Most commonly:
  Wilms tumor flank/pelvic RT, Ewing sarcoma pelvic primary, pediatric
  rhabdomyosarcoma (genitourinary, paratesticular, bladder/prostate
  primary), Hodgkin lymphoma pelvic field, neuroblastoma abdominopelvic
  RT, testicular GCT pelvic adjuvant (less common in pediatric era).
  Three principal second-primary surveillance domains: (1) bladder
  cancer — radiation cystitis with chronic inflammation drives urothelial
  carcinoma decades later; cumulative risk 2-4% at 25-30y post-pediatric
  pelvic RT; (2) colorectal cancer — radiation field exposure to rectum
  + distal colon; standardized incidence ratio (SIR) 3-5x population
  baseline, cumulative 5-10% at 30y depending on dose + field; (3) other
  pelvic-field secondary cancers (uterine, ovarian if ovaries in field,
  cervical, sarcoma in irradiated bone). Pediatric exposure carries
  substantially higher lifetime second-primary risk vs. adult pelvic RT —
  longer time-at-risk + radiation-sensitive growing tissues. Surveillance
  cadence per COG-LTFU + Childhood Cancer Survivor Study (CCSS) + ACS
  guideline-augmentation. Prevention-persona RedFlag (§20 cancer-survivor
  late-effects pilot).
definition_ua: >-
  Виживший після раку через ≥5 років після завершення протипухлинного
  лікування з куративною метою у дітей, яке включало тазову променеву
  терапію. Найчастіше: фланкове/тазове опромінення при пухлині
  Вілмса, тазове опромінення первинної саркоми Юінга, дитяча
  рабдоміосаркома (сечостатева, паратестикулярна, з первинним
  вогнищем у сечовому міхурі/передміхуровій залозі), тазове поле
  опромінення при лімфомі Ходжкіна, абдомінопельвікальне опромінення
  при нейробластомі. Три основні домени нагляду за вторинними
  первинними пухлинами: (1) рак сечового міхура — променевий цистит
  із хронічним запаленням призводить до уротеліальної карциноми через
  десятиліття; кумулятивний ризик 2-4% через 25-30 років після
  дитячої тазової променевої терапії; (2) колоректальний рак —
  опромінення прямої кишки та дистальної частини ободової кишки в
  полі; SIR у 3-5 разів вищий за популяційний фон, кумулятивно 5-10%
  через 30 років залежно від дози та поля опромінення; (3) інші
  вторинні пухлини тазового поля (матка, яєчники, шийка матки,
  саркома в опроміненій кістці). Опромінення в дитячому віці несе
  суттєво вищий довічний ризик вторинних первинних пухлин порівняно з
  тазовою променевою терапією у дорослих — довший час ризику та
  радіочутливі тканини, що ростуть. Періодичність нагляду
  визначається настановами COG-LTFU + Childhood Cancer Survivor Study
  (CCSS) + доповненнями настанов ACS.

