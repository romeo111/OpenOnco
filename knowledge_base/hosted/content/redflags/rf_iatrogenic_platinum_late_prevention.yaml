id: RF-IATROGENIC-PLATINUM-LATE-PREVENTION
definition: >-
  Cancer survivor with prior cumulative platinum exposure ≥400 mg/m²
  (cisplatin) or AUC-equivalent carboplatin. Most commonly: testicular
  germ-cell tumor BEP cycles (cisplatin 100 mg/m² × 4 = 400 mg/m²),
  ovarian cancer first-line carboplatin/paclitaxel, advanced cervical
  cancer cisplatin-CRT, head-and-neck SCC concurrent cisplatin-CRT,
  esophageal cancer FOLFOX/CROSS regimens, NSCLC adjuvant cisplatin
  doublet. Three principal late-effect domains: (1) cardiovascular —
  cisplatin associated with accelerated atherosclerosis, hypertension,
  endothelial dysfunction, Raynaud phenomenon; coronary events SIR
  1.5-2× population baseline; testicular cancer survivors with BEP
  exposure have 2-3× CV-mortality at 30y; (2) chronic kidney disease —
  cisplatin direct tubular toxicity → persistent GFR decline; ~30% of
  long-term survivors have CKD stage ≥2; magnesium wasting common;
  (3) therapy-related AML / MDS — platinum (especially cisplatin)
  contributes to t-MDS risk via DNA-damage; lower-magnitude than
  topoisomerase-II inhibitors but additive when combined with etoposide
  (BEP regimen). Ototoxicity + peripheral neuropathy + Raynaud syndrome
  + male infertility are additional long-term cisplatin sequelae out-of-
  scope for this RF which focuses on cancer-surveillance + CV/renal
  risk-modification dimensions. Prevention-persona RedFlag (§20 cancer-
  survivor late-effects pilot).
definition_ua: >-
  Виживший після раку з попередньою кумулятивною експозицією до
  платини ≥400 мг/м² (цисплатин) або AUC-еквівалентом карбоплатину.
  Найчастіше: цикли BEP при герміногенній пухлині яєчка (цисплатин
  100 мг/м² × 4 = 400 мг/м²), карбоплатин/паклітаксел першої лінії
  при раку яєчників, цисплатин-хіміопроменева терапія при поширеному
  раку шийки матки, конкурентна цисплатин-хіміопроменева терапія при
  плоскоклітинному раку голови та шиї, режими FOLFOX/CROSS при раку
  стравоходу, ад'ювантний цисплатиновий дублет при NSCLC. Три основні
  домени пізніх ефектів: (1) серцево-судинні — цисплатин асоціюється
  з прискореним атеросклерозом, артеріальною гіпертензією,
  ендотеліальною дисфункцією, синдромом Рейно; коронарні події SIR у
  1.5-2 рази вищий за популяційний фон; виживші після раку яєчка з
  експозицією до BEP мають у 2-3 рази вищу серцево-судинну смертність
  через 30 років; (2) хронічна хвороба нирок (ХХН) — пряма тубулярна
  токсичність цисплатину → стійке зниження GFR; ~30% довгострокових
  виживших мають ХХН стадії ≥2; часте виснаження магнію; (3)
  терапія-асоційований гострий мієлоїдний лейкоз / мієлодиспластичний
  синдром (t-AML / t-MDS) — платина (особливо цисплатин) сприяє
  ризику t-MDS через пошкодження ДНК; менша величина ефекту, ніж у
  інгібіторів топоізомерази II, але адитивна у комбінації з
  етопозидом (режим BEP).

trigger:
  type: lab_value
  any_of:
    - finding: "survivor_platinum_cumulative_ge_400_mg_m2"
      value: true
    - finding: "survivor_cisplatin_late_effect_cv_renal_dimension"
      value: true
    - finding: "survivor_bep_or_high_dose_carboplatin_history"
      value: true

clinical_direction: investigate

severity: major
priority: 100
category: other

risk_category: iatrogenic

# Anchor DIS-AML — secondary t-MDS/t-AML is the cancer surveillance
# anchor; cardiovascular + renal surveillance dimensions are co-managed
# under the same RF firing (no separate cancer disease anchor needed
# for CV/CKD which are non-cancer late effects).
relevant_diseases:
  - DIS-AML

shifts_algorithm: []

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-NCCN-AML-2025
  - SRC-NCCN-TESTICULAR-2025
  - SRC-COG

last_reviewed: "2026-05-18"
reviewer_signoffs: 0
notes: "Cancer-survivor late-effects RedFlag for cumulative platinum ≥400 mg/m². Surveillance domains: cardiovascular risk modification (BP + lipid panel q1y), nephropathy (creatinine + Mg q1y), secondary AML/MDS (CBC q1y). CV risk modification is the highest-yield late-effect domain. STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode."
