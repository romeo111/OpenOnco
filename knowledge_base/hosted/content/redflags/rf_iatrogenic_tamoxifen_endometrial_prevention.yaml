id: RF-IATROGENIC-TAMOXIFEN-ENDOMETRIAL-PREVENTION
definition: >-
  Current or prior tamoxifen exposure ≥5 years in a woman with intact
  uterus (no prior hysterectomy). Tamoxifen is a selective estrogen-
  receptor modulator (SERM) — antagonist in breast tissue (therapeutic
  for ER+ breast cancer + risk reduction) but partial agonist in
  endometrium → ~2-7 fold increased endometrial cancer risk
  (predominantly endometrioid; less commonly serous, carcinosarcoma).
  Cumulative risk ~1-2% over 5y treatment; higher with longer duration
  + post-menopausal status. Endometrial cancers in tamoxifen-exposed
  women often more aggressive histology than spontaneous. Population
  with hysterectomy: this RF does NOT fire (no at-risk organ). Patient
  with ER+ breast cancer (treatment-time persona) ALSO has prevention-
  persona considerations covered by this RF. Prevention-persona RedFlag
  (§20 v0.3 iatrogenic pilot).
definition_ua: >-
  Поточний або перенесений прийом тамоксифену (tamoxifen) ≥5 років у
  жінки зі збереженою маткою (без попередньої гістеректомії). Тамоксифен
  — селективний модулятор естрогенових рецепторів (SERM): антагоніст у
  тканині молочної залози (терапевтичний ефект при ER-позитивному раку
  молочної залози та зниженні ризику), але частковий агоніст в
  ендометрії → підвищення ризику раку ендометрія приблизно у 2-7 разів
  (переважно ендометріоїдний тип; рідше серозний, карциносаркома).
  Кумулятивний ризик ~1-2% за 5 років лікування; вищий при більшій
  тривалості прийому та у постменопаузі. Рак ендометрія у жінок, які
  отримували тамоксифен, часто має більш агресивну гістологію, ніж
  спонтанний. У популяції після гістеректомії цей RF не спрацьовує
  (немає органа-мішені групи ризику). У пацієнтки з ER-позитивним раком
  молочної залози (персона лікування) також діють міркування персони
  prevention, охоплені цим RF. RedFlag персони prevention (§20, v0.3,
  пілот iatrogenic).

