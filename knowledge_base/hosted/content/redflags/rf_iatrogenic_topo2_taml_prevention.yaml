id: RF-IATROGENIC-TOPO2-TAML-PREVENTION
definition: >-
  History of prior topoisomerase-II inhibitor exposure — etoposide,
  teniposide, anthracyclines (doxorubicin, daunorubicin, epirubicin,
  idarubicin, mitoxantrone) — ≥1 year prior. Therapy-related AML following
  topoisomerase-II-inhibitor exposure has distinctive features that
  differ from alkylator-related t-AML: SHORTER median latency (2-3
  years post-exposure vs 5-7y for alkylators), characteristic
  cytogenetics with balanced translocations involving 11q23 (KMT2A/MLL),
  21q22 (RUNX1), or t(15;17) (PML-RARA, APL-like), absence of preceding
  MDS phase, lower TP53 mutation frequency. Higher per-dose risk than
  alkylators in some series. Highest risk: breast cancer survivors
  (anthracycline + cyclophosphamide), pediatric ALL/AML survivors
  (etoposide), testicular cancer survivors (etoposide in BEP).
  Prevention-persona RedFlag (§20 v0.3 iatrogenic pilot).
definition_ua: >-
  Наявність в анамнезі впливу інгібіторів топоізомерази II — етопозиду
  (etoposide), теніпозиду (teniposide), антрациклінів (доксорубіцин,
  даунорубіцин, епірубіцин, ідарубіцин, мітоксантрон) — ≥1 рік тому.
  Терапія-індукований ГМЛ після впливу інгібіторів топоізомерази II має
  характерні особливості, що відрізняють його від терапія-індукованого
  ГМЛ, пов'язаного з алкілюючими агентами: КОРОТШИЙ медіанний латентний
  період (2-3 роки після впливу проти 5-7 років для алкілюючих агентів),
  характерна цитогенетика зі збалансованими транслокаціями за участю
  11q23 (KMT2A/MLL), 21q22 (RUNX1) або t(15;17) (PML-RARA, APL-подібний),
  відсутність попередньої фази МДС, нижча частота мутацій TP53. У деяких
  серіях — вищий ризик на одну дозу порівняно з алкілюючими агентами.
  Найвищий ризик: у тих, хто вижив після раку молочної залози
  (антрациклін + циклофосфамід), у дітей, які вижили після ГЛЛ/ГМЛ
  (етопозид), у тих, хто вижив після раку яєчка (етопозид у складі BEP).
  RedFlag персони prevention (§20, v0.3, пілот iatrogenic).

