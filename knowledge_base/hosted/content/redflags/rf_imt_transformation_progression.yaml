id: RF-IMT-TRANSFORMATION-PROGRESSION
definition: >
  IMT progression on first-line crizotinib (acquired ALK kinase-domain
  resistance mutation L1196M / G1202R / I1171N), dedifferentiation into
  high-grade sarcoma (epithelioid inflammatory myofibroblastic sarcoma
  variant), new metastatic disease, or rapid local progression — triggers
  switch to lorlatinib / alectinib (next-gen ALK), repotrectinib (ROS1),
  or salvage cytotoxic chemotherapy.
definition_ua: >
  Прогресія IMT на 1-й лінії кризотинібу (набута резистентна мутація в
  кіназному домені ALK: L1196M / G1202R / I1171N), дедиференціація в
  саркому високого ступеня (варіант epithelioid inflammatory
  myofibroblastic sarcoma), нова метастатична хвороба або швидке
  локальне прогресування — тригер для переходу на лорлатиніб /
  алектиніб (ALK наступного покоління), репотректиніб (ROS1) або
  сальваджеву цитотоксичну хіміотерапію.

