notes: >
  Wave O confirmed-carrier surveillance pathway — Juvenile Polyposis
  Syndrome (JPS / SMAD4 / BMPR1A). Fires on documented germline SMAD4 /
  BMPR1A pathogenic variant positivity OR clinical-diagnostic criteria
  met in SMAD4 / BMPR1A-negative phenotypic JPS. Engine routes to
  PreventionPlan recommending:
    (a) IND-JPS-CARRIER-SURVEILLANCE (standard) — colonoscopy q1-3y from
        age 12-15 (intensified to every 6 months once polyps appear);
        upper endoscopy q1-3y from age 15 (intensified once polyps
        appear); juvenile-polyp-burden-driven prophylactic colectomy
        decision; SMAD4-specific HHT screening at diagnosis (pulse
        oximetry, contrast echocardiography for pulmonary AVMs, brain
        MRI for cerebral AVMs).
    (b) IND-JPS-CARRIER-INTENSIFIED (aggressive) — standard PLUS earlier
        prophylactic colectomy discussion for polyp-burden patients
        (juvenile-polyp count rapidly exceeding endoscopic-clearance
        capacity) + intensified SMAD4-HHT AVM management discussion.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

  Lifetime cancer risk in confirmed SMAD4 / BMPR1A carriers (NCCN
  Genetic Familial High-Risk: Colorectal v2.2025; Brosens et al. Gut
  2007):
    - Colorectal: ~40% lifetime (range 17-68% across cohorts)
    - Gastric: ~21% lifetime (SMAD4 enriched, BMPR1A modest)
    - Small-bowel adenocarcinoma: ~6-10% lifetime
    - Pancreatic: modest (~5%; weaker than PJS or FAMMM signal)
    - Childhood symptoms: anemia, rectal bleeding, intussusception,
      protein-losing enteropathy from high polyp burden

  SMAD4-HHT overlap (~22% of SMAD4 carriers): pulmonary AVM (with
  paradoxical embolism / stroke risk; peri-procedural air-embolism
  precautions needed), hepatic AVM, cerebral AVM, recurrent epistaxis,
  GI bleeding from telangiectases. BMPR1A carriers do not have HHT
  overlap. Distinction matters for genetic counseling and pre-procedure
  workup.
