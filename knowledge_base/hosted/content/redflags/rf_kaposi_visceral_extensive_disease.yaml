id: RF-KAPOSI-VISCERAL-EXTENSIVE-DISEASE
definition: >-
  Visceral organ involvement (pulmonary, gastrointestinal, or other
  visceral site) OR extensive/rapidly progressive mucocutaneous disease
  (widespread cutaneous lesions, tumor-associated lymphedema, or
  ulceration) in Kaposi sarcoma of any epidemiologic form (AIDS-
  associated, iatrogenic, classic, or endemic). Symptomatic/extensive
  disease of this kind is not expected to be adequately controlled by
  immune restoration (ART / immunosuppression rebalance) or local
  therapy alone and drives escalation to systemic chemotherapy.
definition_ua: >-
  Вісцеральне ураження органів (легені, шлунково-кишковий тракт або
  інший вісцеральний орган) АБО поширене/швидко прогресуюче
  мукокутанне захворювання (розповсюджені шкірні вогнища, пухлина-
  асоційований лімфедема, виразкування) при саркомі Капоші будь-якої
  епідеміологічної форми (ВІЛ-асоційована, ятрогенна, класична,
  ендемічна). Таке симптоматичне/поширене захворювання, як
  очікується, не буде адекватно контрольоватись лише відновленням
  імунітету (АРТ / ребаланс імуносупресії) чи локальною терапією і
  зумовлює ескалацію до системної хіміотерапії.

trigger:
  type: symptom_composite
  any_of:
    - finding: "kaposi_visceral_involvement"
      value: true
    - finding: "kaposi_pulmonary_involvement"
      value: true
    - finding: "kaposi_gi_involvement"
      value: true
    - finding: "kaposi_extensive_cutaneous_disease"
      value: true

clinical_direction: intensify
severity: major
priority: 100
category: risk-score

