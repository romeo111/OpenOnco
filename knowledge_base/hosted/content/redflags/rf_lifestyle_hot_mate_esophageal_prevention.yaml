notes: >
  Prevention-persona RedFlag — v0.3 IARC 2A probable-carcinogen batch
  (2026-05-19). IARC Group 2A probable — limited human evidence;
  clinical recommendation more conservative than Group 1. IARC Monograph
  116 (2016) is the canonical evidence anchor and is NOT yet a separate
  SRC entity in KB; cited in notes only.

  Coexistence with RF-LIFESTYLE-HOT-BEVERAGES-PREVENTION (predecessor
  generic-hot-beverages RF covering teas / coffees / water at ≥65°C
  across all regional traditions) is deliberate. This new RF is the
  maté-specific narrowing — fires on the highly characteristic gourd-
  and-bombilla preparation pattern with documented southern-South-
  American epidemiology, lets the engine surface culturally-tuned
  counseling (target audience: diaspora communities, immigrants from
  Argentina/Brazil/Paraguay/Uruguay/southern Chile). Both RFs may
  fire on the same patient when both thresholds are met; engine
  treats them as additive.

  Crucial framing point: the carcinogen is thermal injury, NOT maté
  per se. Counseling targets temperature (cool to <60°C / wait
  several minutes before drinking) NOT cessation of maté consumption.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

