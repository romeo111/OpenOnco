id: RF-LIFESTYLE-HOT-MATE-ESOPHAGEAL-PREVENTION
definition: >-
  Regular consumption of maté (Ilex paraguariensis infusion) prepared and
  drunk at very high temperatures (≥65°C / ≥149°F) — characteristic of
  traditional gourd-and-bombilla preparation in southern South America
  (Argentina, Brazil, Paraguay, Uruguay, southern Chile) and diaspora
  communities. IARC Monograph 116 (2016) classified drinking very hot
  beverages above 65°C as Group 2A (probably carcinogenic) — limited
  evidence in humans (consistent associations with esophageal squamous
  cell carcinoma in maté-drinking, hot-tea, and hot-coffee cohorts,
  with residual confounding from tobacco / alcohol co-exposure not fully
  excluded), sufficient evidence in experimental animals (thermal injury
  → chronic inflammation → field carcinogenesis in rodent esophagus
  models). Important: at temperatures <60°C, no association is observed;
  maté per se (the herb / its phytochemicals) is NOT classified as
  carcinogenic — the carcinogenic exposure is the thermal injury,
  independent of beverage type. Effect size: maté-attributable ESCC
  OR ~1.5-2.0 in southern South America cohorts (highest in those
  drinking very hot AND tobacco/alcohol co-exposed). Prevention-persona
  RedFlag (§20 ratification 2026-05-18, v0.3 IARC 2A probable-carcinogen
  batch).
definition_ua: >-
  Регулярне споживання матэ (інфузія Ilex paraguariensis), приготованого
  і випитого при дуже високих температурах (≥65°C) — характерне для
  традиційного gourd-and-bombilla приготування в південній Південній
  Америці (Аргентина, Бразилія, Парагвай, Уругвай, південне Чилі) та
  діаспорних спільнотах. IARC Monograph 116 (2016) класифікував
  drinking very hot beverages >65°C як Group 2A (probably carcinogenic) —
  limited evidence in humans (узгоджені асоціації з esophageal squamous
  cell carcinoma в матэ-, hot-tea- та hot-coffee-когортах з residual
  confounding від tobacco / alcohol co-exposure), sufficient evidence
  in experimental animals (thermal injury → chronic inflammation → field
  carcinogenesis в rodent esophagus моделях). Важливо: при <60°C
  асоціація НЕ спостерігається; матэ per se (рослина / її phytochemicals)
  НЕ класифікується як канцероген — канцерогенною експозицією є thermal
  injury, незалежно від типу напою. Розмір ефекту: матэ-attributable
  ESCC OR ~1.5-2.0 в когортах південної Південної Америки (highest при
  drinking very hot AND tobacco/alcohol co-exposed).

