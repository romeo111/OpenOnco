id: RF-LIFESTYLE-LOW-CALCIUM-VIT-D-CRC-PREVENTION
definition: >-
  Combined low dietary calcium intake (<800 mg/day; IOM RDA 1000-1200
  mg/day age-dependent) AND vitamin D deficiency (serum 25-hydroxy-
  vitamin D <30 nmol/L per IOM threshold, <50 nmol/L per Endocrine
  Society). WCRF/AICR Continuous Update Project rates dietary calcium
  as "probable" protective for colorectal cancer — meta-analyzed
  RR ~0.92 per 300 mg/day calcium intake. Vitamin D status (circulating
  25-OH-D) is associated with CRC risk in observational cohorts
  (~30% incidence reduction in highest vs lowest quartile per IARC
  pooled analysis); causal RCT evidence is mixed (VITAL, ViDA trials
  did not show primary CRC-incidence reduction at population doses but
  signal for CRC mortality reduction with vitamin D supplementation).
  Mechanisms: calcium binds bile acids + fatty acids in colonic lumen
  reducing mucosal cytotoxicity; vitamin D regulates colonocyte
  proliferation + differentiation via VDR; both modulate Wnt/β-catenin
  signaling. Combined deficiency compounds risk. Prevention-persona
  RedFlag (§20 v0.3 diet pilot, 2026-05-18).
definition_ua: >-
  Поєднання низького споживання кальцію з їжею (<800 мг/день; IOM RDA
  1000-1200 мг/день залежно від віку) ТА дефіциту вітаміну D (сироватковий
  25-гідроксивітамін D <30 нмоль/л за порогом IOM, <50 нмоль/л за
  Endocrine Society). WCRF/AICR (Continuous Update Project) оцінює
  харчовий кальцій як фактор з "ймовірним" рівнем доказовості
  протективної дії щодо CRC — за метааналізом RR ~0.92 на кожні
  300 мг/день кальцію. Статус вітаміну D (циркулюючий 25-OH-D)
  асоціюється з ризиком CRC в обсерваційних когортах (~30% зниження
  захворюваності у найвищому квартилі порівняно з найнижчим за
  об'єднаним аналізом IARC); причинно-наслідкові докази з РКД
  неоднозначні (дослідження VITAL, ViDA не показали зниження
  захворюваності на CRC при популяційних дозах, але виявили сигнал
  щодо зниження смертності від CRC при прийомі вітаміну D). Механізми:
  кальцій зв'язує жовчні та жирні кислоти у просвіті товстої кишки,
  знижуючи цитотоксичність для слизової оболонки; вітамін D регулює
  проліферацію та диференціювання колоноцитів через VDR; обидва
  модулюють сигнальний шлях Wnt/β-катенін. Поєднаний дефіцит
  підсилює ризик.

