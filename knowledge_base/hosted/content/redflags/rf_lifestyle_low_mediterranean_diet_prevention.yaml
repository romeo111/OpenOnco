id: RF-LIFESTYLE-LOW-MEDITERRANEAN-DIET-PREVENTION
definition: >-
  Low adherence to a Mediterranean dietary pattern (Trichopoulou
  Mediterranean Diet Score [MDS] 0-3 of 9, or PREDIMED-style score in
  the lowest tertile, or 14-item MEDAS <7). Mediterranean dietary
  pattern = high intake of olive oil, vegetables, fruits, whole grains,
  legumes, nuts, fish; moderate dairy + wine with meals; low intake of
  red/processed meat + sweets. EPIC + Nurses' Health Study + PREDIMED
  cohorts: high adherence associated with ~12-15% reduction in overall
  cancer incidence + mortality; strongest signals for CRC, breast,
  gastric, hepatocellular cancers + dietary-pattern co-benefits for
  cardiovascular disease (PREDIMED 2013 RCT primary endpoint).
  Mechanisms: high polyphenol (olive oil, vegetables) + ω-3 fatty acid
  (fish) + fibre + antioxidant content; low pro-inflammatory red/
  processed meat + refined-carbohydrate content; favorable microbiome
  modulation. Prevention-persona RedFlag (§20 v0.3 diet pilot,
  2026-05-18) — represents general dietary-pattern lever distinct from
  single-nutrient RFs (fibre, calcium, etc.) above.
definition_ua: >-
  Низька прихильність до середземноморського харчового патерну (індекс
  Trichopoulou Mediterranean Diet Score [MDS] 0-3 з 9, або показник за
  шкалою PREDIMED у найнижчій терцилі, або 14-пунктова шкала MEDAS <7).
  Середземноморський патерн харчування = високе споживання оливкової
  олії, овочів, фруктів, цільнозернових продуктів, бобових, горіхів,
  риби; помірне споживання молочних продуктів і вина під час їжі;
  низьке споживання червоного/переробленого м'яса та солодощів. Когорти
  EPIC, Nurses' Health Study та PREDIMED: висока прихильність
  асоціюється зі зниженням загальної захворюваності на рак і смертності
  приблизно на 12-15%; найсильніші сигнали — для CRC, раку молочної
  залози, шлунка, гепатоцелюлярної карциноми, а також супутня
  кардіоваскулярна користь (первинна кінцева точка РКД PREDIMED 2013).
  Механізми: високий вміст поліфенолів (оливкова олія, овочі), ω-3
  жирних кислот (риба), харчових волокон і антиоксидантів; низький
  вміст прозапального червоного/переробленого м'яса та рафінованих
  вуглеводів; сприятлива модуляція мікробіому.

trigger:
  type: lab_value
  any_of:
    - finding: "mediterranean_diet_score_lt_4"
      value: true
    - finding: "medas_score_lt_7"
      value: true
    - finding: "predimed_lowest_tertile"
      value: true

clinical_direction: investigate

severity: minor
priority: 110
category: other

risk_category: lifestyle

# Anchor — colorectal cancer (strongest single-tumor evidence in
# Mediterranean-diet meta-analyses). Pattern affects multiple cancer
# types per EPIC/PREDIMED cohort signals but anchor stays focused.
relevant_diseases:
  - DIS-CRC

shifts_algorithm: []

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-NCCN-COLON-2025

