id: RF-LIFESTYLE-SALTY-PICKLED-DIET-GASTRIC-PREVENTION
definition: >-
  Habitual high intake of salt-preserved foods, pickled vegetables, and
  high-salt dishes (>5 g/day sodium chronically). IARC + WCRF/AICR
  evidence supports salt-preserved foods as a probable cause of gastric
  cancer (RR ~1.5-2.0 in high-intake vs low-intake quartiles; Ge et al.
  Gastroenterology 2012 meta-analysis). Mechanism: chronic mucosal
  irritation + Helicobacter pylori synergy + N-nitroso compound
  formation in salted/cured foods (kimchi, salted fish, pickled
  vegetables, jaroma/sauerkraut depending on preparation, soy sauce,
  cured meats). Particularly relevant in East Asian + Eastern European
  populations with high baseline H. pylori prevalence + high pickled-
  food consumption. WHO recommends <5 g/day salt for cancer + cardio-
  vascular prevention. Prevention-persona RedFlag (§20 v0.3 lifestyle
  expansion).
definition_ua: >-
  Habitual high intake salt-preserved foods, pickled vegetables, та
  high-salt dishes (>5 г/день sodium chronically). IARC + WCRF/AICR
  evidence підтримує salt-preserved foods як probable cause gastric
  cancer (RR ~1.5-2.0 у high-intake vs low-intake quartiles; Ge et al.
  Gastroenterology 2012 meta-аналіз). Механізм: chronic mucosal
  irritation + Helicobacter pylori synergy + N-nitroso compound formation
  у salted/cured foods (kimchi, salted fish, pickled vegetables,
  jaroma/sauerkraut depending on preparation, soy sauce, cured meats).
  Особливо relevant у East Asian + Eastern European populations з
  high baseline H. pylori prevalence + high pickled-food consumption.
  WHO рекомендує <5 г/день солі для cancer + cardio-vascular prevention.
  Prevention-персона RedFlag (§20 v0.3 lifestyle expansion).

