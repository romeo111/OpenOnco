notes: >
  Prevention-persona RedFlag for salt/pickle-heavy diet. Counseling:
  reduce to WHO <5 g/day; co-test for H. pylori in high-intake +
  high-prevalence settings (Eastern Europe, East Asia); diet-quality
  intervention (Mediterranean / DASH patterns) provides additional
  cardiovascular benefit. STUB pending two-Co-Lead signoff per CHARTER
  §6.1 dev-mode.
