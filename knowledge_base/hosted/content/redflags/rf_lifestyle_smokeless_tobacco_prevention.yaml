id: RF-LIFESTYLE-SMOKELESS-TOBACCO-PREVENTION
definition: >-
  Habitual use of smokeless tobacco products — chewing tobacco, snus
  (oral nicotine pouch with tobacco), snuff (dry, moist, dipping
  tobacco), gutka/pan masala (South Asian preparations with areca nut
  + tobacco). IARC Group 1 carcinogen (Monograph 89, 2007; reaffirmed
  Monograph 100E). Causally linked to oral cavity cancer (tongue, gum,
  buccal mucosa, floor of mouth — particularly at the placement site),
  esophageal cancer, pancreatic cancer (RR ~1.5-2.0 in Northern
  European snus cohorts; meta-analyses Boffetta + Hashibe 2008). Risk
  of oral cancer markedly elevated in South-Asian gutka/pan masala
  users — RR up to ~10 with combined tobacco + areca nut + lime.
  Cessation reduces risk over time but not to baseline non-user levels;
  oral mucosa changes (leukoplakia, erythroplakia) can regress with
  cessation. Prevention-persona RedFlag (§20 v0.3 lifestyle expansion).
definition_ua: >-
  Habitual використання smokeless tobacco продуктів — chewing tobacco,
  snus (oral nicotine pouch з тютюном), snuff (dry, moist, dipping
  tobacco), gutka/pan masala (South Asian preparations з areca nut +
  tobacco). IARC Group 1 канцероген (Monograph 89, 2007; reaffirmed
  Monograph 100E). Causally пов'язаний з oral cavity cancer (язик,
  ясна, buccal mucosa, дно рота — особливо у placement site),
  esophageal cancer, pancreatic cancer (RR ~1.5-2.0 у Northern
  European snus cohorts). Ризик oral cancer markedly підвищений у
  South-Asian gutka/pan masala users — RR до ~10 з combined tobacco +
  areca nut + lime. Cessation зменшує ризик з часом але не до baseline
  non-user рівнів; oral mucosa changes (leukoplakia, erythroplakia)
  можуть регресувати з cessation. Prevention-персона RedFlag (§20 v0.3
  lifestyle expansion).

