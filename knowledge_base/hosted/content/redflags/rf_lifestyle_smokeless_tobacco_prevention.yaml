notes: >
  Prevention-persona RedFlag for smokeless tobacco. Most modifiable
  cancer exposure in users; cessation pharmacotherapy (nicotine
  replacement, varenicline) is effective. Oral examination at every
  encounter; biopsy any leukoplakia/erythroplakia >2 weeks; visual
  inspection with toluidine blue or autofluorescence in high-burden
  settings. STUB pending two-Co-Lead signoff per CHARTER §6.1 dev-mode.
