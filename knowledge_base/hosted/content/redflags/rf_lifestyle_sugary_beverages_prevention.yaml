id: RF-LIFESTYLE-SUGARY-BEVERAGES-PREVENTION
definition: >-
  High habitual intake of sugar-sweetened beverages (SSBs) — sodas, fruit
  drinks, sports drinks, sweetened teas/coffees — ≥1 serving (~250 mL)
  per day. Associated with increased risk of obesity-related cancers
  including colorectal cancer (RR ~1.2-1.3 in women with ≥2 servings/
  day per Nurses' Health Study II; Hur et al. Gut 2021), pancreatic
  cancer (modest signal in some cohorts), early-onset CRC (under age 50
  — Hur 2021 reported ~RR 2.2 for ≥2 servings/day vs <1/wk), and
  endometrial + post-menopausal breast cancer via obesity pathway.
  Mechanism: rapid glycemic load → insulin/IGF-1 axis activation +
  weight gain + adiposity. SSBs are the largest single dietary source
  of added sugar in many populations. Risk modifiable via substitution
  with water, unsweetened beverages, low-calorie sweeteners (though
  recent evidence raises questions about non-nutritive sweetener safety —
  see controversies). Prevention-persona RedFlag (§20 v0.3 lifestyle
  expansion).
definition_ua: >-
  Habitual high intake sugar-sweetened beverages (SSBs) — sodas, fruit
  drinks, sports drinks, sweetened teas/coffees — ≥1 порція (~250 мл)
  на день. Associated зі збільшеним ризиком obesity-related cancers
  включаючи colorectal cancer (RR ~1.2-1.3 у жінок з ≥2 servings/день
  per Nurses' Health Study II; Hur et al. Gut 2021), pancreatic cancer
  (помірний signal у деяких cohorts), early-onset CRC (до 50 років —
  Hur 2021 reported ~RR 2.2 для ≥2 servings/день vs <1/тиж),
  endometrial + post-menopausal breast cancer via obesity pathway.
  Механізм: rapid glycemic load → insulin/IGF-1 axis активація + weight
  gain + adiposity. SSBs — найбільше джерело added sugar у багатьох
  populations. Ризик модифікований через substitution з water, unsweetened
  beverages, low-calorie sweeteners. Prevention-персона RedFlag (§20
  v0.3 lifestyle expansion).

