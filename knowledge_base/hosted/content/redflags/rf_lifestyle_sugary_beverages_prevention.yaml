notes: >
  Prevention-persona RedFlag for sugar-sweetened beverage habitual
  intake. Counseling: substitute water/unsweetened beverages;
  reduce gradually if abrupt cessation difficult; assess for
  contribution to weight gain + glycemic dysregulation. Modest
  individual RR but very common exposure → large absolute
  population-attributable fraction. STUB pending two-Co-Lead signoff
  per CHARTER §6.1 dev-mode.
