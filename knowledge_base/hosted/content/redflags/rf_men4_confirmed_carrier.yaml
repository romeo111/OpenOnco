notes: >
  Wave O confirmed-carrier surveillance pathway — MEN4 / CDKN1B. Fires
  on documented germline CDKN1B pathogenic variant positivity in an
  asymptomatic individual. Engine routes to PreventionPlan recommending:
    (a) IND-MEN4-CARRIER-SURVEILLANCE (standard) — MEN1-like multi-organ
        screening adapted for MEN4 lower penetrance + later onset:
        annual PTH + ionized Ca + prolactin + IGF-1 + chromogranin-A
        starting from late childhood / adolescence (age 10-15) — later
        than MEN1 (age 5); pituitary MRI q3-5y from age 15 (longer
        interval than MEN1 q3y); abdominal MRI q1-2y from age 20 for
        GEP-NET surveillance.
    (b) IND-MEN4-CARRIER-INTENSIFIED (aggressive) — standard PLUS
        MEN1-equivalent surveillance intervals (rather than MEN4-
        adjusted longer intervals) for high-risk pedigrees + intensified
        gastrinoma / Zollinger-Ellison surveillance + earlier-threshold
        parathyroidectomy decision-making.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Source-set TODO: MEN4-specific surveillance source —
  Pellegata et al. PNAS 2006; ENETS / ESE MEN1 / MEN4 management
  consensus papers; Frederiksen et al. JCEM 2019 (CDKN1B variant
  spectrum review) — Wave O authoring backlog new SRC entities.

  Lifetime tumor risk in confirmed CDKN1B carriers (Frederiksen et
  al. JCEM 2019; Alrezk et al. Endocr Relat Cancer 2017):
    - Primary hyperparathyroidism: ~80% in published series; often
      single-gland adenoma (vs MEN1 multi-glandular hyperplasia) —
      surgical approach may be more conservative.
    - Pituitary adenoma: ~30-40%; ACTH-secreting (Cushing) +
      somatotroph (acromegaly) over-represented vs MEN1 prolactinoma
      predominance.
    - GEP-NET: variable; pancreatic + duodenal + gastric. Gastrinoma
      less common than MEN1.
    - Adrenocortical tumors: modest (~10-20%); mostly non-functioning.
    - Bronchial / thymic NET: rare; thymic NET in male carriers
      similarly aggressive as MEN1 (limited data).
    - Reproductive-tract NET (cervical, testicular): reported in
      registry data; surveillance not standardized.

  MEN4 vs MEN1: Distinctions matter for counseling:
    - Later age-of-onset overall.
    - Parathyroid disease often single-gland (not multi-glandular).
    - Pituitary tumor spectrum tilts toward ACTH / GH (vs prolactinoma).
    - Penetrance variable but generally lower than MEN1.
    - Registry data still evolving — counseling should acknowledge
      uncertainty rather than overstate either reassurance or worry.
