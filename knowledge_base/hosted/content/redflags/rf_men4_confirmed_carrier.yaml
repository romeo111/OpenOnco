id: RF-MEN4-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in CDKN1B
  (p27/Kip1) — Multiple Endocrine Neoplasia type 4 (MEN4). Patient has
  had germline CDKN1B testing returned positive; the pedigree-suspicion
  question is settled. MEN4 is a more recently characterized
  (Pellegata et al. 2006) MEN1-like syndrome — autosomal dominant
  inheritance with overlapping but generally less penetrant tumor
  spectrum than classical MEN1. Tumor distribution: primary
  hyperparathyroidism (most common manifestation, ~80% in series),
  pituitary adenoma (~30-40%, often somatotrophs / corticotrophs),
  GEP-NET (pancreatic + duodenal + gastric — gastrinoma less common
  than in MEN1), adrenocortical tumors (modest), bronchial / thymic
  NET (rare but reported), reproductive-tract neuroendocrine tumors.
  MEN4 has later age-of-onset than MEN1 and less aggressive natural
  history in published series, but registry data are evolving as more
  CDKN1B carriers are identified. No current personal cancer diagnosis
  in the carrier being assessed. Prevention-persona RedFlag (§20, Wave
  O confirmed-carrier surveillance pathway — distinct from any future
  RF-MEN4-FAMILY-HISTORY-SUSPICION that would fire before testing).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант у
  CDKN1B (p27/Kip1) — синдром множинної ендокринної неоплазії типу 4
  (MEN4). Пацієнт пройшов germline CDKN1B-тестування з позитивним
  результатом; питання родовідної підозри вирішене. MEN4 — більш
  recently characterized (Pellegata et al. 2006) MEN1-like синдром —
  autosomal-dominant inheritance з overlapping але generally менш
  penetrant пухлинним спектром ніж classical MEN1. Tumor distribution:
  primary hyperparathyroidism (найчастіший прояв, ~80%), pituitary
  adenoma (~30-40%, часто somatotrophs / corticotrophs), GEP-NET
  (pancreatic + duodenal + gastric — гастринома менш поширена ніж у
  MEN1), adrenocortical tumors (modest), bronchial / thymic NET (рідко
  але reported), reproductive-tract neuroendocrine tumors. MEN4 — later
  age-of-onset ніж MEN1 та менш aggressive natural history у published
  series, але registry data evolving як більше CDKN1B-carriers
  identified. Поточний особистий діагноз раку відсутній. Prevention-
  persona RedFlag (§20, Wave O шлях спостереження підтверджених носіїв).

trigger:
  type: lab_value
  any_of:
    - finding: "germline_cdkn1b_pathogenic_variant_confirmed"
      value: true

clinical_direction: investigate

# MAJOR — multi-organ endocrine surveillance burden but less aggressive
# natural history than classical MEN1 (registry data evolving); later
# onset; PRIMARY-HYPERPARATHYROIDISM most common but typically less
# aggressive than MEN1 multi-glandular hyperplasia.
severity: major
priority: 85
category: other
risk_category: genetic

# MEN4-spectrum: GEP-NETs (DIS-PNET dominant, plus DIS-GI-NET for
# duodenal / bronchial / thymic NETs). Primary hyperparathyroidism +
# pituitary adenoma + adrenocortical tumors managed via endocrinology
# surveillance without dedicated DIS-* entities.
relevant_diseases:
  - DIS-PNET
  - DIS-GI-NET

shifts_algorithm: []

