id: RF-MPN-SECONDARY-LEUKEMIA-PREVENTION
definition: >-
  Myeloproliferative neoplasm (polycythemia vera [PV], essential
  thrombocythemia [ET], or primary myelofibrosis [PMF]) per WHO 2022
  criteria, OR a clinical phenotype suggestive of MPN (driver-mutation
  positivity — JAK2 V617F, JAK2 exon 12, CALR exon 9, or MPL W515 —
  with sustained myeloproliferative blood-count abnormality but not yet
  meeting full WHO criteria) in an individual without a current
  diagnosis of acute myeloid leukemia (AML) or post-MPN myelofibrosis.
  MPN clones carry inherent risk of clonal evolution to higher-grade
  myeloid neoplasia: cumulative risk of leukemic transformation
  (sAML / blast-phase MPN) ~5% in PV, ~3% in ET, ~10-20% in PMF at
  10-15 years; cumulative risk of progression from PV/ET to post-PV/
  post-ET myelofibrosis ~10-15% at 15 years. Standard MPN management
  reduces thrombosis (the dominant short-term mortality driver) but
  does not abolish leukemic-transformation risk. Surveillance with CBC
  + peripheral smear + bone marrow evaluation on cytopenia or blast
  emergence is the standard secondary-prevention approach.
  Prevention-persona RedFlag (§20 ratification 2026-05-18, v0.3
  chronic-condition pilot).
definition_ua: >-
  Мієлопроліферативне новоутворення (поліцитемія вера [PV], есенціальна
  тромбоцитемія [ET] або первинний мієлофіброз [PMF]) за критеріями
  WHO 2022, АБО клінічний фенотип, підозрілий щодо MPN (наявність
  драйверної мутації — JAK2 V617F, JAK2 exon 12, CALR exon 9 або
  MPL W515 — зі стійкою мієлопроліферативною зміною показників крові,
  що ще не відповідає повним критеріям WHO) у пацієнта без поточного
  діагнозу гострого мієлоїдного лейкозу (AML) або мієлофіброзу після
  MPN. Клони MPN несуть притаманний їм ризик клональної еволюції до
  мієлоїдного новоутворення вищого ступеня злоякісності: кумулятивний
  ризик лейкемічної трансформації (sAML / бластна фаза MPN) ~5% при PV,
  ~3% при ET, ~10-20% при PMF за 10-15 років; кумулятивний ризик
  прогресування від PV/ET до мієлофіброзу після PV/ET ~10-15% за
  15 років. Стандартне лікування MPN знижує ризик тромбозу (основного
  фактора смертності у короткостроковій перспективі), але не усуває
  ризику лейкемічної трансформації. Стандартний підхід вторинної
  профілактики — спостереження із загальним аналізом крові, мазком
  периферичної крові та дослідженням кісткового мозку в разі появи
  цитопенії або бластних клітин. RedFlag профілю профілактики
  (ратифікація §20, 2026-05-18, пілотний проєкт v0.3 для хронічних
  станів).

