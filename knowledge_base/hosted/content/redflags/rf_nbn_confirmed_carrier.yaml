notes: >
  v0.3 wave-N niche moderate-penetrance carrier pathway — NBN
  heterozygosity. Fires on documented germline NBN pathogenic variant
  positivity in an asymptomatic individual. Engine routes to
  PreventionPlan recommending:
    (a) IND-NBN-CARRIER-SURVEILLANCE (standard) — annual breast MRI from
        age 30; annual mammography from age 30-35 (alternating with MRI
        q6mo); clinical breast exam q6-12mo from age 25; cascade testing
        of first-degree relatives; reproductive counseling for partners
        who are also carriers (biallelic offspring NBS risk).
    (b) IND-NBN-CARRIER-OBSERVATION (alternative) — population-cadence
        breast screening only; counsel that this is sub-optimal vs.
        intensified MRI surveillance comparator. Per CHARTER §11
        patient-autonomy framing.

  Slavic founder allele context: c.657del5 (p.Lys219AsnfsTer16) is the
  dominant pathogenic variant in Polish, Ukrainian, Czech, Slovak, and
  other Eastern-European populations (population carrier frequency
  ~0.5-1%). The OpenOnco Ukrainian patient cohort therefore has a
  meaningful prior probability for NBN heterozygote breast-cancer risk
  beyond what NCCN's North-American-cohort base rates suggest. NCCN
  Genetic/Familial High-Risk Breast/Ovarian acknowledges NBN as a
  moderate-penetrance breast-cancer gene appropriate for inclusion on
  expanded hereditary-cancer panels but does NOT recommend prophylactic
  bilateral mastectomy on the basis of carrier status alone (in contrast
  to BRCA1/2, where RR-mastectomy is a standard option). Enhanced
  surveillance is the consensus carrier-management approach.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Source-set TODO: Bogdanova et al. NBN heterozygote breast-
  cancer risk meta-analysis (Breast Cancer Res Treat 2008); di Masi et
  al. NBN molecular review (Mutat Res 2012); Damiola et al. CHEK2/NBN/
  PALB2 Slavic founder (Eur J Hum Genet 2014); ongoing v0.3 wave-N
  authoring backlog new SRC entities for NBN-specific evidence.

  Lifetime cancer risk in confirmed NBN heterozygotes (Bogdanova 2008;
  di Masi 2012; NCCN Genetic/Familial High-Risk Breast/Ovarian 2025):
    - Breast cancer (women): ~20-25% lifetime; RR ~2.0-3.0 vs.
      population baseline; some studies suggest higher RR in bilateral
      / early-onset disease.
    - Prostate cancer: modest RR (~1.5-2.0); insufficient evidence
      for dedicated surveillance protocol.
    - Lymphoma (predominantly non-Hodgkin, B-cell): modest RR; no
      surveillance protocol — clinical-vigilance basis.
    - Other Slavic-founder-variant adjacent cancers (melanoma, CRC,
      colorectal): inconsistent signals across cohort studies; not
      target organs for NBN-specific surveillance.
