# NBN heterozygote-spectrum: breast cancer (~20-25% lifetime,
# RR ~2.0-3.0); modest lymphoma / prostate signals. Biallelic = NBS
# phenotype (childhood lymphoid malignancy + immunodeficiency) — outside
# the asymptomatic-adult prevention persona for this RF.
