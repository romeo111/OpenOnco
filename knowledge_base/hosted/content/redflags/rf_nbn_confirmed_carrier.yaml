id: RF-NBN-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in the NBN
  gene (also known as NBS1) — Nijmegen Breakage Syndrome carrier status.
  Biallelic NBN inactivation (homozygous or compound-heterozygous) causes
  Nijmegen Breakage Syndrome (NBS) — autosomal-recessive chromosomal-
  instability disorder with microcephaly, immunodeficiency, growth failure,
  and dramatically elevated lymphoid-malignancy risk (~40% lifetime by
  age 20). Heterozygous (carrier) status — the focus of this RedFlag —
  confers moderate-penetrance breast-cancer risk (RR ~2.0-3.0, lifetime
  ~20-25%) and a more modest signal for lymphoma / prostate cancer. The
  Slavic founder variant c.657del5 (p.Lys219AsnfsTer16) is population-
  prevalent in Polish, Ukrainian, Czech, and other Eastern-European
  populations (~0.5-1% carrier frequency), making NBN moderate-penetrance
  testing particularly relevant for Ukrainian familial breast-cancer
  panels. No current personal cancer diagnosis in the carrier being
  assessed. Mandates enhanced breast-cancer screening and reproductive
  counseling (biallelic risk to offspring of two carriers). Prevention-
  persona RedFlag (§20, v0.3 wave-N niche moderate-penetrance pathway —
  distinct from population-screening BRCA1/2 pathway because NBN is
  panel-tested as part of expanded hereditary-breast-and-ovarian-cancer
  panels rather than a single-gene focus).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант у
  гені NBN (також відомий як NBS1) — носійство Nijmegen Breakage Syndrome.
  Біалельна інактивація NBN (гомозигота / складена гетерозигота) спричиняє
  Nijmegen Breakage Syndrome (NBS) — аутосомно-рецесивне розлад
  хромосомної нестабільності з мікроцефалією, імунодефіцитом, затримкою
  росту та різко підвищеним ризиком лімфоїдних malignancies (~40% lifetime
  до 20 років). Гетерозиготний (carrier) статус — фокус цього RedFlag —
  надає moderate-penetrance ризик раку молочної залози (RR ~2.0-3.0,
  lifetime ~20-25%) і більш помірний сигнал для лімфоми / раку простати.
  Слов'янський founder варіант c.657del5 (p.Lys219AsnfsTer16) популяційно
  поширений у польській, українській, чеській та інших східноєвропейських
  популяціях (~0.5-1% carrier frequency), що робить NBN moderate-
  penetrance тестування особливо релевантним для українських панелей
  familial breast-cancer. Поточний особистий діагноз раку відсутній.
  Mandates посилений скринінг раку молочної залози та репродуктивне
  консультування (біалельний ризик для нащадків двох носіїв). Prevention-
  persona RedFlag (§20, v0.3 wave-N niche moderate-penetrance шлях).

