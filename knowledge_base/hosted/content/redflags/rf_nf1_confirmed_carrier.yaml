notes: >
  Prevention-persona RedFlag for NF1 confirmed-carrier / clinical-
  diagnostic-criteria-met cohort. Multi-organ surveillance: pediatric
  ophthalmology q6-12mo to age 8 (optic glioma); whole-body MRI for
  MPNST surveillance + symptom-driven biopsy of growing/painful/
  neurologically-symptomatic plexiform neurofibromas; women: annual
  mammography from age 30, MRI from age 30-50. STUB pending two-Co-
  Lead signoff per CHARTER §6.1 dev-mode.
