id: RF-NF1-FAMILY-HISTORY-SUSPICION
definition: >-
  Family pedigree pattern suggestive of germline NF1 carrier state in
  an asymptomatic individual who has NOT yet had germline NF1
  sequencing or who does NOT independently meet NIH/Bethesda
  clinical diagnostic criteria for neurofibromatosis type 1 (full-
  criteria-met individuals route to the confirmed-carrier RF). NF1
  is autosomal-dominant with ~1 in 3000 prevalence — most common
  single-gene cancer-predisposition syndrome. Triggers include any
  of (a) first-degree relative with a confirmed NF1 pathogenic /
  likely-pathogenic variant (carrier-by-descent at-risk individual);
  (b) first-degree relative with full NIH-criteria-met clinical NF1
  diagnosis (cutaneous café-au-lait pattern + neurofibromas) but no
  confirmatory genetic testing performed on the at-risk individual;
  (c) family-history pattern of childhood optic pathway glioma in
  one or more first/second-degree relatives — strongly suggestive
  of NF1 in the family (optic pathway glioma rare in general
  population, common in NF1); (d) family-history pattern of
  malignant peripheral nerve sheath tumor (MPNST) — extremely
  uncommon in general population, strongly NF1-suggestive in
  family clusters. No current personal cancer diagnosis in the
  at-risk individual being assessed, AND the at-risk individual
  does NOT independently meet ≥2 NIH/Bethesda criteria (individuals
  meeting criteria are confirmed-carriers by clinical-diagnosis
  pathway). Prevention-persona RedFlag (§20, v0.3 pediatric
  predisposition expansion — pre-testing suspicion variant for
  family-history-only at-risk individuals).
definition_ua: >-
  Сімейний родовід з патерном, що нагадує гермінативний carrier
  NF1, у асимптомної особи, яка ще НЕ пройшла germline NF1
  секвенування або яка НЕ незалежно відповідає NIH/Bethesda
  clinical diagnostic criteria для neurofibromatosis type 1 (full-
  criteria-met особи направляються на confirmed-carrier RF). NF1
  — autosomal-dominant з ~1 у 3000 prevalence — найпоширеніший
  single-gene cancer-predisposition syndrome. Тригери включають
  будь-яке з (а) родич першого ступеня з підтвердженим патогенним /
  ймовірно-патогенним варіантом NF1 (carrier-by-descent at-risk
  особа); (б) родич першого ступеня з full NIH-criteria-met
  clinical NF1 діагнозом але без confirmatory genetic testing у
  at-risk особи; (в) сімейно-історичний патерн дитячої optic
  pathway glioma у одного або більше first/second-degree родичів —
  сильно suggestive NF1 у сім'ї; (г) сімейно-історичний патерн
  malignant peripheral nerve sheath tumor (MPNST) у family
  clusters. Поточний особистий діагноз раку у пацієнта з ризиком
  відсутній, І at-risk особа НЕ незалежно відповідає ≥2 NIH/
  Bethesda criteria. Prevention-персона RedFlag (§20, v0.3
  pediatric predisposition expansion — pre-testing suspicion
  варіант для family-history-only at-risk осіб).

