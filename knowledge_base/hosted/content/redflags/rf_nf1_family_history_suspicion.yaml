notes: >
  v0.3 Wave M suspicion variant — pre-testing family-history-
  suspicion counterpart to RF-NF1-CONFIRMED-CARRIER. Fires when
  family pedigree pattern suggests NF1 carrier state but the at-
  risk individual has not yet had germline NF1 sequencing AND does
  not independently meet ≥2 NIH/Bethesda clinical diagnostic
  criteria. Distinct trigger findings from the confirmed-carrier
  RF — the confirmed-carrier RF fires on `germline_nf1_pathogenic_
  variant_confirmed`, `nih_nf1_clinical_diagnostic_criteria_met`,
  or `germline_nf1_likely_pathogenic_variant`; this suspicion RF
  fires on family-history-only findings. NF1 has an important
  pediatric dimension — at-risk children should have annual
  clinical evaluation by a pediatrician familiar with NF1
  (cutaneous evaluation, neurologic exam, vision testing) before
  formal genetic testing. Genetic testing may be deferred until
  age 5-10 in asymptomatic at-risk children where the clinical
  picture remains equivocal — many NF1 features develop only in
  childhood and the diagnosis becomes clinically evident with
  age. Standard pathway includes referral to a specialty NF1
  clinic (multidisciplinary — pediatric ophthalmology, genetics,
  neurology, dermatology) where available. If germline NF1
  testing returns positive OR NIH criteria are met clinically,
  the patient transitions to the RF-NF1-CONFIRMED-CARRIER pathway
  with multi-organ surveillance (pediatric ophthalmology q6-12mo
  to age 8, whole-body MRI for MPNST surveillance, women: annual
  mammography from age 30 + MRI from 30-50). STUB pending two-
  Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode.
