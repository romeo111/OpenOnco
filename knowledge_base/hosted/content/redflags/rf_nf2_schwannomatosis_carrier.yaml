notes: >
  Gene-specific NF2-related schwannomatosis + SMARCB1-schwannomatosis
  confirmed-carrier RF — CRITICAL severity. Fires on documented
  germline NF2 pathogenic variant, OR germline SMARCB1 schwannomatosis-
  spectrum variant (distinct from N-terminal truncating RTPS variants),
  OR fulfilment of revised Manchester / Baser clinical criteria.

  DISEASE-ANCHOR LIMITATION: DIS-GLIOMA-LOW-GRADE is used as the
  best-available approximation in v0.3 KB — the actual NF2 tumor
  spectrum (vestibular schwannoma + meningioma + spinal ependymoma) has
  no dedicated DIS-* entities yet. Flagged for v0.4 cleanup when
  DIS-VESTIBULAR-SCHWANNOMA / DIS-MENINGIOMA / DIS-EPENDYMOMA entities
  land. The indication-level rationale narrates the actual NF2 tumor
  spectrum + surveillance / treatment specifics — disease-anchor
  inaccuracy does not propagate into the clinical content.

  Engine routes to PreventionPlan:
    (a) IND-NF2-CARRIER-SURVEILLANCE (standard) — brain MRI with thin-
        cut internal-auditory-canal sequences q1-2y from age 10 (or
        baseline at diagnosis if older); whole-spine MRI q3-5y for
        intramedullary / extramedullary schwannomas + ependymomas;
        audiology + speech-discrimination annually; ophthalmology
        q1-2y for juvenile posterior subcapsular cataract + retinal
        hamartoma; dermatology q1-2y for cutaneous schwannomas; brain-
        and-spine MRI baselines obtained earlier if family-specific
        proband had pediatric onset; cascade testing.
    (b) IND-NF2-CARRIER-INTENSIFIED (aggressive) — earlier brain MRI
        baseline (age 5-8 in pediatric-onset kindreds); high-resolution
        IAC sequences q1y; consideration of bevacizumab for growing
        / symptomatic vestibular schwannoma (off-label; expert-center
        indication — preserves / improves hearing in some patients;
        NF2 mTOR pathway research ongoing); shared-decision-making
        re: prophylactic hearing-preservation surgery (microsurgery vs
        stereotactic radiosurgery — radiosurgery debated in NF2 given
        possible secondary-tumor / malignant-transformation reports);
        multidisciplinary NF2 expert-center referral; sign-language /
        cochlear-implant pre-emptive planning.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

  Background — NF2 / SMARCB1-schwannomatosis epidemiology + risk:
    - Bilateral vestibular schwannoma: ~95% of NF2 patients by
      adulthood (hallmark feature); progressive sensorineural hearing
      loss and facial-nerve / trigeminal-nerve symptoms drive
      morbidity.
    - Meningioma: ~60% (often multiple cranial + spinal); cumulative
      burden across decades.
    - Spinal ependymoma: ~30% (often intramedullary cervical /
      thoracic); usually asymptomatic but driver of late morbidity.
    - Juvenile posterior subcapsular lenticular cataract: ~60% (often
      detected in childhood — earliest detectable feature).
    - Retinal hamartoma + epiretinal membrane: additional
      ophthalmologic stigmata.
    - Mosaicism in ~50% of de-novo NF2 cases (variable expressivity;
      cascade-testing in mosaic probands may miss carrier offspring —
      tumor genotyping informative).
    - Median survival historically 36-69y; improving with modern
      surveillance + bevacizumab targeted therapy + expert-center
      management.
    - SMARCB1-schwannomatosis: phenotypic overlap with NF2 (multi-
      tumor schwannoma burden) but typically WITHOUT bilateral
      vestibular schwannoma and WITHOUT high meningioma burden; key
      distinguishing feature is variant-class (carboxy-terminal /
      non-truncating SMARCB1 — schwannomatosis; N-terminal truncating
      SMARCB1 — rhabdoid tumor predisposition syndrome / RTPS).
