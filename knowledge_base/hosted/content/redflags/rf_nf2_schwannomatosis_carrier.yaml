id: RF-NF2-SCHWANNOMATOSIS-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in NF2
  (neurofibromin 2 / merlin / Moesin-Ezrin-Radixin-like protein),
  OR a confirmed germline SMARCB1 schwannomatosis-spectrum variant
  (typically missense / splice / non-truncating in the carboxy-
  terminal domain — DISTINCT from N-terminal truncating SMARCB1
  variants causing rhabdoid tumor predisposition syndrome / RTPS),
  OR fulfilment of the revised Manchester / Baser clinical
  diagnostic criteria for NF2-related schwannomatosis. NF2-related
  schwannomatosis (renamed from neurofibromatosis type 2 in 2022
  international consensus, Plotkin et al. Genet Med 2022) is an
  autosomal-dominant tumor-suppressor syndrome whose hallmark is
  bilateral vestibular schwannoma (~95% of NF2 patients by adulthood)
  + cranial / spinal schwannomas + meningioma (~60% — often multiple;
  cumulative risk drives morbidity) + spinal ependymoma (~30% — often
  intramedullary cervical / thoracic) + juvenile posterior subcapsular
  lenticular cataract (~60%) + retinal hamartoma. Mosaicism is common
  (~50% of de-novo NF2 cases) and gives variable expressivity. Patient
  has had germline NF2 / SMARCB1 testing returned positive on a known
  pedigree-specific variant OR meets clinical diagnostic criteria; no
  current personal cancer diagnosis assumed for the prevention persona
  (active disease routes to the treatment plan). Mandates lifelong
  surveillance: brain MRI with thin-cut internal-auditory-canal
  sequences q1-2y from age 10, spine MRI q3-5y, audiology q1y,
  ophthalmology q1-2y. NF2-related schwannomatosis is a NON-malignant
  syndrome (schwannomas, meningiomas, and ependymomas are
  histologically benign) but tumor burden + brainstem / cranial-nerve
  compression drives morbidity + mortality (median survival historically
  ~36-69 years, improving with modern surveillance + targeted therapy).
  CRITICAL severity justified by tumor burden + bilateral deafness +
  cranial-nerve / brainstem-compression mortality risk.
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у NF2 (neurofibromin 2 / merlin), АБО підтверджений germline SMARCB1
  schwannomatosis-spectrum варіант (зазвичай missense / splice /
  non-truncating у carboxy-terminal domain — DISTINCT від N-terminal
  truncating SMARCB1 варіантів, що викликають rhabdoid tumor
  predisposition syndrome / RTPS), АБО виконання revised Manchester /
  Baser clinical diagnostic criteria для NF2-related schwannomatosis.
  NF2-related schwannomatosis (renamed з neurofibromatosis type 2 у
  2022 international consensus, Plotkin et al. Genet Med 2022) —
  autosomal-dominant tumor-suppressor syndrome, hallmark якого
  bilateral vestibular schwannoma (~95% NF2 пацієнтів до дорослого
  віку) + cranial / spinal schwannomas + meningioma (~60% — часто
  multiple) + spinal ependymoma (~30% — часто intramedullary cervical
  / thoracic) + juvenile posterior subcapsular lenticular cataract
  (~60%) + retinal hamartoma. Mosaicism поширений (~50% de-novo NF2)
  з variable expressivity. Пацієнт має позитивне germline NF2 /
  SMARCB1 тестування на known pedigree-specific варіант АБО відповідає
  clinical diagnostic criteria; поточний особистий діагноз раку
  відсутній для prevention persona. Mandates lifelong спостереження:
  brain MRI з thin-cut internal-auditory-canal sequences q1-2y з 10
  років, spine MRI q3-5y, audiology q1y, ophthalmology q1-2y. NF2-
  related schwannomatosis — NON-malignant синдром (schwannomas,
  meningiomas, ependymomas histologically benign), але tumor burden +
  brainstem / cranial-nerve compression драйвить morbidity +
  mortality (median survival historically ~36-69 років, improving з
  modern surveillance + targeted therapy). CRITICAL severity
  виправдана tumor burden + bilateral deafness + cranial-nerve /
  brainstem-compression mortality risk.

trigger:
  type: lab_value
  any_of:
    - finding: "germline_nf2_pathogenic_variant_confirmed"
      value: true
    - finding: "nf2_clinical_diagnostic_criteria_met"
      value: true
    - finding: "germline_smarcb1_schwannomatosis_variant"
      value: true

clinical_direction: investigate

# CRITICAL per bilateral vestibular schwannoma + brainstem compression
# mortality risk + multi-tumor burden across decades; surveillance from age 10.
severity: critical
priority: 60
category: other
risk_category: genetic

# DIS-GLIOMA-LOW-GRADE used as approximation — NF2 tumor spectrum is
# vestibular schwannoma + meningioma + spinal ependymoma, none of which
# have dedicated DIS-* entities in v0.3 KB. Flagged for v0.4 cleanup
# when DIS-VESTIBULAR-SCHWANNOMA / DIS-MENINGIOMA / DIS-EPENDYMOMA
# entities land.
relevant_diseases:
