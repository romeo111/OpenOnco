id: RF-NPC-EBV-DNA-POST-TREATMENT-SURVEILLANCE
definition: >
  Detectable or rising plasma EBV-DNA (BIO-EBV-DNA, quantitative PCR)
  after completion of definitive treatment (concurrent chemoradiation
  +/- induction, or systemic 1L therapy) for nasopharyngeal carcinoma.
  Post-treatment plasma EBV-DNA is a validated prognostic/surveillance
  biomarker in NPC — persistent detectability or a rising trend can
  precede radiographic relapse by weeks to months, and should prompt
  accelerated re-staging workup rather than waiting for the routine
  imaging interval.
definition_ua: >
  Виявлюваний або зростаючий рівень EBV-ДНК у плазмі (BIO-EBV-DNA,
  кількісна ПЛР) після завершення дефінітивного лікування (одночасна
  хіміопроменева терапія +/- індукція, або системна 1L терапія) при
  назофарингеальній карциномі. EBV-ДНК у плазмі після лікування —
  валідований прогностичний/спостережний біомаркер при NPC: стійка
  виявлюваність або зростаюча динаміка може передувати
  рентгенологічному рецидиву на тижні-місяці, що має спонукати до
  прискореного повторного стадіювання, а не очікування планового
  інтервалу візуалізації.

trigger:
  type: biomarker_threshold
  any_of:
    - finding: "post_treatment_ebv_dna_detectable"
      value: true
    - finding: "post_treatment_ebv_dna_rising"
      value: true

clinical_direction: investigate
severity: major
priority: 100
category: transformation-progression

relevant_diseases:
  - DIS-NPC
shifts_algorithm: []

sources:
