id: RF-OCC-GLYPHOSATE-PREVENTION
definition: >-
  Documented historical occupational exposure to glyphosate-based
  herbicides (most notably Roundup® and generic equivalents) —
  typical high-exposure occupations include agricultural workers
  (row-crop, orchard, and vineyard pesticide applicators), groundskeepers
  and landscape-maintenance staff (golf-course, parks, right-of-way),
  forestry workers, railroad-track vegetation control, and farm-family
  members involved in mixing / loading / application — with cumulative
  high-frequency exposure ≥10 years — in an individual without a current
  glyphosate-attributable malignancy diagnosis. IARC Monograph 112
  (2015) classified glyphosate as Group 2A (probably carcinogenic to
  humans) — limited evidence in humans (positive associations with
  non-Hodgkin lymphoma, particularly diffuse-large-B-cell lymphoma,
  across multiple agricultural-cohort studies; chance / bias /
  confounding by other pesticides not fully excluded), sufficient
  evidence in experimental animals (rodent malignancy at multiple
  sites with chronic high-dose oral glyphosate; mechanistic evidence
  for genotoxicity + oxidative stress in mammalian cells). NOTE: IARC
  classification is contested — EFSA (2015, 2023), EPA (2020), Health
  Canada (2017), and JMPR (2016) reached "unlikely to pose carcinogenic
  risk" conclusions for typical occupational use, differing from IARC
  on the weight given to specific industry-sponsored vs published
  literature. The Agricultural Health Study (AHS, US, 2018 update)
  found no overall association but suggested possible elevated NHL
  risk in the highest exposure quartile. Effect size: meta-analyses
  pooled NHL OR ~1.4-1.5 for highest-exposed strata in retrospective
  case-control; null in AHS overall. Latency for NHL attribution
  10-30 years. There is NO curative intervention for prior exposure —
  exposure cessation (often not applicable to retired workers),
  guideline-baseline NHL symptom awareness, and risk-stratified
  surveillance are the available levers. Prevention-persona RedFlag
  (§20 ratification 2026-05-18, v0.3 IARC 2A probable-carcinogen batch).
definition_ua: >-
  Документований історичний професійний вплив glyphosate-вмісних
  гербіцидів (Roundup® та generic equivalents) — типові високоризикові
  професії: agricultural workers (row-crop, orchard, vineyard pesticide
  applicators), groundskeepers та landscape-maintenance staff (golf-
  course, парки, right-of-way), forestry workers, railroad-track
  vegetation control, та farm-family members залучені до mixing /
  loading / application — з кумулятивною high-frequency expozицією
  ≥10 років — в особи без поточного діагнозу glyphosate-attributable
  malignancy. IARC Monograph 112 (2015) класифікував glyphosate як
  Group 2A (probably carcinogenic) — limited evidence in humans
  (позитивні асоціації з non-Hodgkin lymphoma, особливо DLBCL, в
  багатьох agricultural-cohort studies; chance / bias / confounding
  by other pesticides не повністю виключено), sufficient evidence
  in experimental animals (rodent malignancy при chronic high-dose
  oral glyphosate; mechanistic evidence — genotoxicity + oxidative
  stress). ПРИМІТКА: IARC класифікація — contested; EFSA (2015, 2023),
  EPA (2020), Health Canada (2017), JMPR (2016) дійшли висновку
  "unlikely to pose carcinogenic risk" для typical occupational use,
  різниця з IARC у weight, наданій specific industry-sponsored vs
  published literature. Agricultural Health Study (AHS, US, 2018
  оновлення) не виявив overall association, але suggest possibly
  підвищений NHL risk в highest exposure quartile. Розмір ефекту:
  meta-аналізи pooled NHL OR ~1.4-1.5 для highest-exposed strata в
  retrospective case-control; null в AHS overall. Латентність для
  NHL attribution 10-30 років. КУРАТИВНОГО втручання для попереднього
  впливу НЕМАЄ.

