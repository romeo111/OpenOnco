# Anchor — DLBCL (the primary NHL endpoint in the IARC 112 limited-
# human-evidence summary; other NHL subtypes have less specific
# evidence). Other cancers (multiple myeloma, leukemia) have
# inadequate or contested evidence and are not included.
relevant_diseases:
  - DIS-DLBCL-NOS

shifts_algorithm: []

sources:
  - SRC-NCCN-BCELL-2025

last_reviewed: "2026-05-19"
reviewer_signoffs: 0
notes: >
  Prevention-persona RedFlag — v0.3 IARC 2A probable-carcinogen batch
  (2026-05-19). IARC Group 2A probable — limited human evidence;
  clinical recommendation more conservative than Group 1. IARC
  Monograph 112 (2015) is the canonical evidence anchor and is NOT
  yet a separate SRC entity in KB; cited in notes only.

  Evidence-base contestation: the IARC Group 2A classification is
  not concordant with EFSA / EPA / Health Canada / JMPR
  "unlikely to pose carcinogenic risk" conclusions. This RF is
  authored at severity:minor reflecting both the IARC 2A probable
  evidence quality AND the cross-regulatory disagreement. Counseling
  should disclose the controversy honestly rather than presenting
  IARC as settled science.

  Anchor scope: DLBCL only (the dominant NHL endpoint in IARC 112
  limited-human-evidence summary). Other NHL subtypes (follicular,
  marginal zone, etc.) and other hematologic malignancies (MM, AML)
  carry inadequate or more-contested evidence and are deliberately
  excluded from relevant_diseases.

  Engine routes to 2-track PreventionPlan:
    (a) IND-OCC-GLYPHOSATE-PREVENTION-INTENSIFIED-SURVEILLANCE
        (standard) — symptom-awareness education, annual CBC,
        targeted lymphadenopathy / B-symptom history at routine
        physical, expedited workup for "B-symptom" presentations.
    (b) IND-OCC-GLYPHOSATE-PREVENTION-OBSERVATION (surveillance) —
        routine general-population care; patient declines structured
        surveillance discussion.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

