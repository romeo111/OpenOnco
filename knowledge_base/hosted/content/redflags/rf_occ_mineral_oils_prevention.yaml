reviewer_signoffs: 0
notes: >
  Prevention-persona RedFlag — v0.3 occupational batch-3 pilot. Fires
  when patient profile carries documented ≥10 years occupational
  untreated / mildly-treated mineral-oil exposure AND no confirmed
  mineral-oil-attributable malignancy diagnosis. Engine routes to
  2-track PreventionPlan:
    (a) IND-OCC-MINERAL-OILS-PREVENTION-INTENSIFIED-SURVEILLANCE
        (standard) — annual dermatology consultation with full-skin
        exam (focus on oil-contact areas: face, neck, hands,
        forearms, scrotum); patient counseled to perform monthly
        self-skin-checks; sun-protection counseling for oil-contact
        sites; PPE + oil-soaked-clothing-avoidance counseling if
        active exposure persists.
    (b) IND-OCC-MINERAL-OILS-PREVENTION-OBSERVATION (surveillance) —
        routine general-population care only; patient declines
        annual professional dermatology cadence but receives
        symptom-triggered evaluation and self-skin-check counseling.

  Cohort-anchoring NOTE: scrotal SCC is rare at modern general-
  population baseline but historically constituted a near-
  pathognomonic occupational signature in cotton-mule-spinners
  (Mule's cancer, late-19th-century British textile workers) — this
  is the foundational post-Pott chimney-sweep observation in
  occupational carcinogenesis. Modern at-risk cohorts are
  metal-machinists with pre-1980 straight-mineral-oil MWF exposure
  + automotive workers with chronic used-motor-oil contact.
  Anchor disease is DIS-BCC as closest in-KB cutaneous-cancer
  proxy — DIS-CUTANEOUS-SCC is not a separate KB entity.

  Trigger findings are computed booleans from occupational-history
  intake at the patient-profile layer.

  Evidence base: IARC Monograph 100F (2012); Cruickshank & Squire
  1950 (mule-spinners scrotal SCC historic series); Tolbert 1997
  (US metal-working fluids review); Hogstedt 2017 (Swedish
  metal-working cohort — skin-cancer SIR ~1.3-1.7x).

  Sources TODO: IARC Monograph 100F (2012) as a new SRC entity.
  v0.3 source-authoring backlog.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.
notes_ua: >
  Prevention-persona RedFlag — v0.3 occupational batch-3 пілот.
  Спрацьовує при документованому ≥10 років професійному впливі
  необроблених / слабко-оброблених мінеральних масел без
  підтвердженого діагнозу. Engine маршрутизує до 2-track
  PreventionPlan: (а) intensified — щорічна дерматологічна
  консультація + self-skin-checks + sun-protection + PPE-counseling;
  (б) observation — symptom-triggered тільки. STUB — очікує підпис
