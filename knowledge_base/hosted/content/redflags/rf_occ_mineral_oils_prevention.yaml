id: RF-OCC-MINERAL-OILS-PREVENTION
definition: >-
  Documented historical occupational exposure to untreated or
  mildly-treated mineral oils — typical high-risk occupations
  include machinists / metal-working-fluid (MWF) operators (lathe,
  mill, grinder, screw-machine work with straight or soluble oil
  coolant), automotive engine + transmission repair (used motor oil
  contact), printing-press operators (historic ink + roller-cleaning
  solvent exposure), jute / cotton-mule-spinning operators
  (historical lubricant-spray cohort with documented scrotal-SCC
  excess — "mule-spinner's cancer"), and metal-machining workers
  in heavy-industry settings — with cumulative occupational tenure
  ≥10 years — in an individual without a current mineral-oil-
  associated malignancy diagnosis. Untreated and mildly-treated
  mineral oils are IARC Group 1 carcinogens (Monograph 100F, 2012)
  — established etiologic driver of skin cancer (cutaneous squamous-
  cell carcinoma at sun-exposed AND oil-contact sites: face, hands,
  forearms, scrotum). The historic scrotal-SCC cohort (Mule's
  jute-spinners; British cotton operatives; Lancashire textile
  workers) is foundational occupational-carcinogenesis evidence
  (post-Pott chimney-sweep observation). Modern highly-refined
  (severely-hydrotreated) mineral oils used in current MWF and
  motor oils carry lower risk; risk concentrates in workers with
  pre-1980 historical exposure or in industries that have retained
  less-refined product. Latency to cutaneous SCC is 10-30 years.
  There is NO curative intervention for prior exposure — exposure
  cessation / PPE (if active), avoidance of oil-soaked clothing,
  rigorous skin hygiene, sun-protection at oil-contact sites, and
  annual dermatology consultation with full-skin exam are the
  levers. Prevention-persona RedFlag (§20 ratification 2026-05-18,
  v0.3 occupational batch-3 pilot).
definition_ua: >-
  Документоване історичне професійне впливу необроблених або
  слабко-оброблених мінеральних масел — типові високоризикові
  професії: машиністи / оператори metal-working fluids (MWF)
  (токарна, фрезерна, шліфувальна, screw-machine робота з straight
  або soluble oil coolant), ремонт автомобільних двигунів та
  трансмісій (контакт з використаним motor oil), оператори
  друкарських пресів (історичний вплив фарб + roller-cleaning
  розчинників), jute / cotton-mule-spinning оператори (історична
  cohort з lubricant-spray впливом і задокументованим надлишком
  scrotal-SCC — "mule-spinner's cancer"), працівники
  metal-machining у важкопромислових умовах — з кумулятивним
  професійним стажем ≥10 років — у пацієнта без поточного діагнозу
  mineral-oil-асоційованої малігнізації. Необроблені та слабко-
  оброблені мінеральні масла — канцерогени IARC Group 1
  (Monograph 100F, 2012), встановлений етіологічний драйвер раку
  шкіри (cutaneous SCC на сонцеекспонованих ТА oil-contact
  ділянках: обличчя, руки, передпліччя, мошонка). Історична
  scrotal-SCC cohort (Mule's jute-spinners; British cotton
  operatives; Lancashire textile workers) — foundational
  occupational-carcinogenesis evidence (post-Pott chimney-sweep
  observation). Сучасні highly-refined (severely-hydrotreated)
  мінеральні масла у поточних MWF та motor oils мають нижчий
  ризик; ризик концентрується у працівників з pre-1980
  історичним впливом або у галузях, які зберегли less-refined
  product. Латентність до cutaneous SCC — 10-30 років.
  КУРАТИВНОГО втручання для попереднього впливу НЕМАЄ —
  припинення впливу / PPE (при активному), уникнення oil-soaked
  одягу, рігорозна гігієна шкіри, sun-protection на oil-contact
  ділянках, щорічна дерматологічна консультація з повним оглядом
  шкіри — наявні важелі. Prevention-persona RedFlag
  (§20 ратифікація 2026-05-18, v0.3 occupational batch-3 пілот).

