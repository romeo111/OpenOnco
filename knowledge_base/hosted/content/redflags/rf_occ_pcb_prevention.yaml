last_reviewed: "2026-05-19"
reviewer_signoffs: 0
notes: >
  Prevention-persona RedFlag — v0.3 IARC 2A probable-carcinogen batch
  (2026-05-19). IARC Group 2A probable — limited human evidence;
  clinical recommendation more conservative than Group 1; reclassified
  Group 1 in 2013 IARC Monograph 107 (published 2015) — authored at
  2A-conservative severity per batch scope.

  Reclassification context: PCBs were Group 2A from the 1970s IARC
  assessments through the 2012 update; the 2013 working group
  reclassified to Group 1 based on additional occupational-cohort
  follow-up showing sufficient human evidence for melanoma and
  mechanistic data on dioxin-like congeners. The 2A→1 transition
  affects the evidence-quality narrative but the practical clinical
  recommendations (no curative intervention, surveillance + symptom-
  awareness) are similar at the individual-patient level. This RF
  is intentionally authored to mirror the conservative IARC 2A
  framing of the other batch pilots; a future revision may upgrade
  severity to major to reflect the Group 1 status if maintainer
  review favors that framing.

  Anchor scope: DLBCL only (per task brief, NHL signal). Melanoma
  is the strongest cancer endpoint in the IARC 107 reclassification
  but is not the anchor here. A future Indication can be authored
  for melanoma anchor if maintainer review prioritizes that
  endpoint.

  Engine routes to 2-track PreventionPlan:
    (a) IND-OCC-PCB-PREVENTION-INTENSIFIED-SURVEILLANCE (standard) —
        NHL-symptom-awareness education, annual CBC + LDH,
        dermatologic exam annually (melanoma awareness),
        guideline-baseline breast screening adherence in women.
    (b) IND-OCC-PCB-PREVENTION-OBSERVATION (surveillance) — routine
        general-population care; patient declines structured
        surveillance discussion.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

