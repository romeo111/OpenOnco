id: RF-PALB2-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic monoallelic variant
  in PALB2 (heterozygous; biallelic PALB2 is the autosomal-recessive
  Fanconi anemia complementation group N, distinct from the cancer-
  predisposition carrier state covered here). PALB2 functions in the
  same homologous-recombination repair pathway as BRCA1/BRCA2; carriers
  have moderate-to-high-penetrance breast cancer risk (lifetime ~33-58%
  per Yang et al. JCO 2020 — comparable to BRCA2), pancreatic
  adenocarcinoma (lifetime ~2-3% baseline, ~5-15% in PALB2-FDR-of-
  PDAC cohorts), and ovarian cancer (modest increase, ~5% lifetime).
  Common multi-gene panel finding among unselected breast cancer
  cohorts (~0.5-1%). Patient has confirmed positive germline test; no
  current personal cancer diagnosis in the carrier being assessed.
  Prevention-persona RedFlag (§20, v0.3 moderate-penetrance breast/
  pancreatic gene expansion).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний
  monoallelic варіант у PALB2 (heterozygous; biallelic PALB2 —
  autosomal-recessive Fanconi anemia complementation group N).
  PALB2 функціонує у тому ж homologous-recombination repair pathway
  що й BRCA1/BRCA2; carriers мають moderate-to-high-penetrance breast
  cancer ризик (lifetime ~33-58% per Yang et al. JCO 2020 — comparable
  to BRCA2), pancreatic adenocarcinoma (lifetime ~2-3% baseline,
  ~5-15% у PALB2-FDR-of-PDAC cohorts), ovarian cancer (modest increase,
  ~5% lifetime). Common multi-gene panel finding серед unselected breast
  cancer cohorts (~0.5-1%). Prevention-персона RedFlag (§20, v0.3
  moderate-penetrance breast/pancreatic gene expansion).

