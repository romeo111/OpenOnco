notes: >
  Prevention-persona RedFlag for PALB2 heterozygous carriers. PALB2
  approaches BRCA2 breast-cancer penetrance and warrants BRCA-style
  surveillance with annual breast MRI + mammography from age 30, plus
  pancreatic surveillance (EUS or MRI alternating annually from age 50,
  or 10 years before earliest PDAC in family) for FDR-of-PDAC carriers
  per CAPS consortium 2022. RRSO discussion deferred to BRCA-style
  threshold given lower ovarian penetrance. STUB pending two-Co-Lead
  signoff per CHARTER §6.1 dev-mode.
