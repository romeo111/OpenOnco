id: RF-PALB2-FAMILY-HISTORY-SUSPICION
definition: >-
  Family pedigree pattern suggestive of germline PALB2 heterozygous
  carrier state in an asymptomatic individual who has NOT yet had
  multi-gene panel testing. PALB2 functions in the same homologous-
  recombination repair pathway as BRCA1/BRCA2, and carriers approach
  BRCA2 breast-cancer penetrance (lifetime ~33-58%). Triggers include
  any of (a) first- or second-degree relative with a confirmed PALB2
  pathogenic / likely-pathogenic variant; (b) family-history pattern
  resembling BRCA-style HBOC but with negative BRCA1/2 testing in
  affected relative (PALB2 is the most common moderate-penetrance
  finding in BRCA-negative BRCA-like pedigrees); (c) family history
  of pancreatic adenocarcinoma in ≥2 first/second-degree relatives
  combined with breast cancer in a close relative — PALB2 is the
  second most-common gene (after BRCA2) identified in familial
  PDAC-breast kindreds; (d) early-onset (<50y) breast cancer in a
  first-degree relative with negative BRCA1/2 panel testing.
  No current personal cancer diagnosis in the at-risk individual
  being assessed. Prevention-persona RedFlag (§20, v0.3 moderate-
  penetrance breast/pancreatic gene expansion — pre-testing
  suspicion variant).
definition_ua: >-
  Сімейний родовід з патерном, що нагадує гермінативний heterozygous
  carrier PALB2, у асимптомної особи, яка ще НЕ пройшла multi-gene
  panel тестування. PALB2 функціонує у тому ж homologous-recombination
  repair шляху що й BRCA1/BRCA2, і carriers approach BRCA2 breast-
  cancer пенетрантності (lifetime ~33-58%). Тригери включають
  будь-яке з (а) родич першого/другого ступеня з підтвердженим
  патогенним / ймовірно-патогенним варіантом PALB2; (б) сімейно-
  історичний патерн що нагадує BRCA-style HBOC але з негативним
  BRCA1/2 тестуванням у ураженого родича (PALB2 — найпоширеніший
  moderate-penetrance finding у BRCA-negative BRCA-like родоводах);
  (в) сімейна історія pancreatic adenocarcinoma у ≥2 родичів
  першого/другого ступеня у поєднанні з раком молочної залози у
  близького родича; (г) early-onset (<50р) рак молочної залози у
  родича першого ступеня з негативним BRCA1/2 панельним тестуванням.
  Поточний особистий діагноз раку у пацієнта з ризиком відсутній.
  Prevention-персона RedFlag (§20, v0.3 — pre-testing suspicion
  варіант).

