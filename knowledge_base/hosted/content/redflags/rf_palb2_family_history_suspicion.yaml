notes: >
  v0.3 Wave M suspicion variant — pre-testing family-history-
  suspicion counterpart to RF-PALB2-CONFIRMED-CARRIER. Fires when
  family pedigree pattern suggests PALB2 carrier state but germline
  panel testing has not yet been completed. Standard pathway =
  referral for genetic counseling + multi-gene HBOC/PDAC-inclusive
  panel. If panel returns positive for PALB2, the patient transitions
  to the RF-PALB2-CONFIRMED-CARRIER pathway (IND-PALB2-CARRIER-
  PREVENTION-SURVEILLANCE for standard track — BRCA-style management
  given near-BRCA2 penetrance: annual breast MRI + mammography from
  age 30, pancreatic surveillance for FDR-of-PDAC carriers, RRSO
  discussion deferred to BRCA-style threshold given lower ovarian
  penetrance). Distinct trigger findings from the confirmed-carrier
  RF (carrier RF fires on `germline_palb2_pathogenic_variant_
  confirmed`; suspicion RF fires on family-history-based findings
  only). STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1
  dev-mode. Sources cite NCCN Genetic/Familial High-Risk: Breast,
  Ovarian, and Pancreatic v2.2025 PALB2 testing criteria + Yang et
  al. JCO 2020 lifetime risk estimates.
