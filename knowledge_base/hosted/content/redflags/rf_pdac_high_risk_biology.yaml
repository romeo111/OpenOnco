id: RF-PDAC-HIGH-RISK-BIOLOGY
definition: >
  Actionable molecular biology in PDAC: germline BRCA1/2 (or PALB2 —
  HRD-equivalent → olaparib POLO maintenance after platinum response);
  MSI-H / dMMR (~1% of PDAC — pembrolizumab pan-cancer indication);
  KRAS G12C (~1-2% — sotorasib / adagrasib + cetuximab combinations
  emerging); NRG1-fusion (rare — zenocutuzumab).
definition_ua: >
  Активабельна молекулярна біологія PDAC: герміногенний BRCA1/2 (або
  PALB2 — HRD-еквівалент) → підтримуюча терапія олапарибом (POLO) після
  відповіді на платину; MSI-H / dMMR (~1% PDAC) → пембролізумаб
  (пан-онкологічне показання); KRAS G12C (~1-2%) → соторасиб /
  адаграсиб, з'являються комбінації з цетуксимабом; NRG1-фузія (рідко) →
  зеноцутузумаб.

trigger:
  type: biomarker
  any_of:
    - finding: "brca1_brca2_germline_pathogenic"
      value: true
    - finding: "palb2_germline_pathogenic"
      value: true
    - finding: "msi_status"
      value: "MSI-H"
    - finding: "kras_g12c"
      value: true
    - finding: "nrg1_fusion"
      value: true

clinical_direction: intensify
severity: critical
priority: 60
category: high-risk-biology

relevant_diseases:
  - DIS-PDAC
shifts_algorithm:
  - ALGO-PDAC-METASTATIC-1L

sources: [SRC-NCCN-PANCREATIC-2025, SRC-ESMO-PANCREATIC-2024]
last_reviewed: "2026-04-26"
draft: false

notes: >
  Germline NGS (24-gene HBOC + Lynch panel) + tumor NGS recommended for
  ALL PDAC at diagnosis (NCCN MS-12). POLO trial: olaparib maintenance
  after ≥16 weeks platinum without progression in BRCA1/2-germline mPDAC
  — mPFS 7.4 vs 3.8 mo placebo.
notes_ua: >
  Герміногенне NGS-тестування (24-генна панель HBOC + Lynch) + пухлинне
  NGS рекомендоване для ВСІХ пацієнтів з PDAC на момент діагностики
  (NCCN MS-12). Дослідження POLO: підтримуюча терапія олапарибом після
  ≥16 тижнів терапії препаратами платини без прогресування у пацієнтів з
  герміногенним BRCA1/2-mPDAC — мВБП 7.4 проти 3.8 міс у групі плацебо.
ukrainian_review_status: pending_clinical_signoff
