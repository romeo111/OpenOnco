id: RF-PTLD-HIGH-RISK-BIOLOGY
definition: "Monomorphic PTLD with DLBCL-type morphology / Burkitt-like / T-cell PTLD — chemoimmunotherapy from start (R-CHOP, EPOCH, or T-cell-specific); polymorphic forms may respond to IS-reduction ± rituximab."
definition_ua: "Мономорфна PTLD з DLBCL-морфологією / Burkitt-подібна / Т-клітинна PTLD — хіміоімунотерапія одразу (R-CHOP, EPOCH або специфічна для Т-клітин терапія); поліморфні форми можуть відповідати на зниження імуносупресії ± ритуксимаб."

trigger:
  type: biomarker
  any_of:
    - finding: "ptld_subtype_monomorphic_dlbcl"
      value: true
    - finding: "ptld_subtype_burkitt_like"
      value: true
    - finding: "ptld_subtype_t_cell"
      value: true


clinical_direction: intensify
severity: critical
priority: 100
category: high-risk-biology

relevant_diseases: [DIS-PTLD]
shifts_algorithm: [ALGO-PTLD-1L]

sources:
  - SRC-NCCN-BCELL-2025
  - SRC-ESMO-DLBCL-2024

last_reviewed: "2026-04-25"
draft: false

notes: >
  Histologic subtype is the dominant treatment selector in PTLD. Polymorphic / early-lesion → IS-reduction trial first; monomorphic → chemoimmuno from start. T-cell PTLD is rare and requires CHOP-based without rituximab.
notes_ua: >
  Гістологічний підтип є основним фактором вибору лікування при PTLD.
  Поліморфна форма / рання стадія — спочатку пробне зниження імуносупресії;
  мономорфна форма — хіміоімунотерапія одразу. Т-клітинна PTLD трапляється
  рідко і потребує схем на основі CHOP без ритуксимабу.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_ua_10
draft_revision: 3
