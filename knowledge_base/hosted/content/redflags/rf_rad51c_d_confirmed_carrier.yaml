notes: >
  Prevention-persona RedFlag for RAD51C/RAD51D heterozygous carriers.
  Approaches BRCA-level ovarian penetrance — NCCN endorses RRSO at
  completed childbearing or age 45-50. Breast surveillance:
  individualised by family history; consider annual MRI in additional-
  risk subset. Olaparib PARP inhibitor active in RAD51C/D-mutant
  established ovarian cancer (PROfound + GEN-ALL trials). STUB pending
  two-Co-Lead signoff per CHARTER §6.1 dev-mode.
