id: RF-RAD51C-D-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in RAD51C
  OR RAD51D — RAD51 paralogs essential for homologous-recombination
  repair, partners of BRCA1/BRCA2 in the HR complex. Heterozygous
  carriers have moderate-to-high-penetrance ovarian cancer risk
  (RR ~5.9 RAD51C, RR ~6.6 RAD51D; lifetime ovarian cancer ~10-15%
  RAD51C, ~12-20% RAD51D — approaching BRCA1/2 levels). Modest breast
  cancer signal (RR ~1.5-2.0 for RAD51C; some evidence higher for
  triple-negative subset). Biallelic RAD51C is Fanconi anemia
  complementation group O; biallelic RAD51D more variable. Less
  common multi-gene panel finding (~0.5-1% of unselected ovarian cancer
  cohorts). Patient has confirmed positive germline test in RAD51C or
  RAD51D; no current personal cancer diagnosis in the carrier being
  assessed. Prevention-persona RedFlag (§20, v0.3 moderate-penetrance
  ovarian gene expansion).
definition_ua: >-
  Підтверджений germline pathogenic / likely-pathogenic variant у
