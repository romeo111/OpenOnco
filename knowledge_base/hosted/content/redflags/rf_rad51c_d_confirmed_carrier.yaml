  recombination repair, partners BRCA1/BRCA2 у HR complex. Heterozygous
  carriers мають moderate-to-high-penetrance ovarian cancer ризик
  (RR ~5.9 RAD51C, RR ~6.6 RAD51D; lifetime ovarian cancer ~10-15%
  RAD51C, ~12-20% RAD51D — approaching BRCA1/2 levels). Modest breast
  cancer signal (RR ~1.5-2.0 для RAD51C; higher у triple-negative
  subset). Biallelic RAD51C — Fanconi anemia complementation group O.
  Less common multi-gene panel finding (~0.5-1% unselected ovarian
  cancer cohorts). Prevention-персона RedFlag (§20, v0.3 moderate-
  penetrance ovarian gene expansion).

