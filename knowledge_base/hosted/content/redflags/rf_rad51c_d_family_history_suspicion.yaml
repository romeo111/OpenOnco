notes: >
  v0.3 Wave M suspicion variant — pre-testing family-history-
  suspicion counterpart to RF-RAD51C-D-CONFIRMED-CARRIER. Fires
  when family pedigree pattern suggests RAD51C or RAD51D carrier
  state but germline panel testing has not yet been completed.
  Standard pathway = referral for genetic counseling + multi-gene
  HBOC panel covering BRCA1/2 + RAD51C/D + BRIP1 minimum. If panel
  returns positive for RAD51C or RAD51D, the patient transitions
  to the RF-RAD51C-D-CONFIRMED-CARRIER pathway with NCCN-endorsed
  RRSO at completed childbearing or age 45-50 (RAD51C/D approach
  BRCA-level penetrance), individualised breast surveillance with
  MRI consideration in elevated-family-history subset, and PARP
  inhibitor relevance for any future ovarian-cancer diagnosis
  (PROfound + GEN-ALL trials). Distinct trigger findings from the
  confirmed-carrier RF (carrier RF fires on `germline_rad51c_
  pathogenic_variant_confirmed` / `germline_rad51d_pathogenic_
  variant_confirmed`; suspicion RF fires on family-history-based
  findings only). STUB pending two-Clinical-Co-Lead signoff per
  CHARTER §6.1 dev-mode.
