id: RF-REPRODUCTIVE-BREAST-ENDOMETRIAL-PREVENTION
definition: >-
  Reproductive-history risk factors for hormone-driven cancers (breast +
  endometrial + ovarian primarily): nulliparity, late first pregnancy
  (≥30 years), early menarche (<12 years), late menopause (≥55 years),
  combined hormone replacement therapy (HRT) ≥5 years, OR persistent
  anovulation (PCOS, perimenopause). Each independently confers modest
  RR ~1.2-1.5 for hormone-receptor-positive breast cancer + endometrial
  cancer. Cumulative effect non-trivial. Prevention-persona RedFlag
  (§20 v0.3 reproductive).
definition_ua: >-
  Фактори ризику репродуктивного анамнезу для гормонозалежних онкологічних
  захворювань (переважно рак молочної залози, ендометрія та яєчників):
  відсутність пологів в анамнезі (нульпаритет), пізня перша вагітність
  (≥30 років), рання менархе (<12 років), пізня менопауза (≥55 років),
  комбінована замісна гормональна терапія (ЗГТ) ≥5 років АБО стійка
  ановуляція (СПКЯ, перименопауза). Кожен фактор незалежно надає помірне
  підвищення відносного ризику (ВР ~1.2-1.5) для гормонорецептор-позитивного
  раку молочної залози та раку ендометрія. Кумулятивний ефект значущий.

trigger:
  type: lab_value
  any_of:
    - finding: "nulliparous_age_ge_30"
