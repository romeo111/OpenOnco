id: RF-REPRODUCTIVE-ENDOMETRIOSIS-OVARIAN-PREVENTION
definition: >-
  Long-standing endometriosis (especially endometrioma + deep infiltrating
  forms, duration ≥5 years) is an established risk factor for ovarian
  cancer of clear-cell and endometrioid histologic subtypes (RR ~1.3-1.9
  overall; up to ~3-4 for clear-cell + endometrioid subtypes specifically;
  meta-analyses Pearce 2012, Kvaskoff 2021). Mechanism: chronic pelvic
  inflammation, iron-mediated oxidative stress within endometriomata,
  somatic mutations in ARID1A/PIK3CA arising in atypical endometriosis.
  Absolute lifetime ovarian cancer risk modestly elevated (~1.8% vs
  general population ~1.3%) — counseling balances modest risk increase
  against avoidance of unnecessary BSO in reproductive-age women.
  Prevention-persona RedFlag (§20 v0.3 reproductive expansion).
definition_ua: >-
  Long-standing endometriosis (особливо endometrioma + deep infiltrating
  forms, тривалість ≥5 років) — established risk factor для ovarian cancer
  clear-cell та endometrioid histologic subtypes (RR ~1.3-1.9 загалом;
  до ~3-4 для clear-cell + endometrioid subtypes специфічно; meta-аналізи
  Pearce 2012, Kvaskoff 2021). Механізм: chronic pelvic inflammation,
  iron-mediated oxidative stress в endometriomata, somatic mutations
  ARID1A/PIK3CA в atypical endometriosis. Абсолютний lifetime ovarian
  cancer ризик помірно підвищений (~1.8% vs general population ~1.3%) —
  counseling балансує помірне підвищення ризику проти уникнення
  непотрібного BSO у reproductive-age жінок. Prevention-персона RedFlag
  (§20 v0.3 reproductive expansion).

