notes: >
  Prevention-persona RedFlag for endometriosis-associated ovarian cancer
  risk. NO routine population-screening tool exists (CA-125 + TVUS not
  recommended for general or endometriosis screening per NCCN/USPSTF).
  Counseling: symptom awareness; consider risk-reducing salpingectomy at
  completed childbearing or at hysterectomy for benign indications; BSO
  reserved for those with additional risk factors. STUB pending two-Co-
  Lead signoff per CHARTER §6.1 dev-mode.
