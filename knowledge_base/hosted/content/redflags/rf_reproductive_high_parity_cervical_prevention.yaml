notes: >
  Prevention-persona RedFlag for high-parity cervical risk amplifier in
  HPV-positive women. Counseling: adherence to cervical screening
  per USPSTF/WHO age-and-method schedule; catch-up HPV vaccination
  through age 45 per ACIP shared-decision; smoking cessation
  (synergistic risk). STUB pending two-Co-Lead signoff per CHARTER §6.1
  dev-mode.
