id: RF-REPRODUCTIVE-HIGH-PARITY-CERVICAL-PREVENTION
definition: >-
  High parity (≥5 full-term pregnancies) acting synergistically with HPV
  infection to increase cervical cancer risk approximately 2- to 4-fold
  versus nulliparous HPV-positive women (IARC multi-centre pooled
  case-control studies; Muñoz et al. Lancet 2002). Hypothesized
  mechanisms: hormonal exposure (high parity prolongs estrogen +
  progesterone exposure), maintenance of the transformation zone on the
  ectocervix (more accessible to HPV), traumatic effects of repeated
  vaginal delivery, immunosuppression of pregnancy. Important in
  low-resource settings where HPV vaccination coverage is incomplete and
  cervical screening infrastructure is limited (sub-Saharan Africa,
  parts of South Asia, rural Latin America). In well-screened HPV-
  vaccinated populations the residual contribution is modest. Prevention-
  persona RedFlag (§20 v0.3 reproductive expansion).
definition_ua: >-
  High parity (≥5 full-term вагітностей) синергістично з HPV-інфекцією
  підвищує cervical cancer ризик приблизно 2-4х кратно порівняно з
  nulliparous HPV-позитивними жінками (IARC multi-centre pooled case-
  control studies; Muñoz et al. Lancet 2002). Hypothesized механізми:
  гормональна експозиція (high parity подовжує estrogen + progesterone
  експозицію), maintenance transformation zone на ectocervix, traumatic
  effects repeated vaginal delivery, immunosuppression вагітності. Важливо
  у low-resource settings де HPV vaccination coverage неповне а cervical
  screening infrastructure обмежена (sub-Saharan Africa, parts of South
  Asia, rural Latin America). У well-screened HPV-vaccinated populations
  residual contribution скромний. Prevention-персона RedFlag (§20 v0.3
  reproductive expansion).

