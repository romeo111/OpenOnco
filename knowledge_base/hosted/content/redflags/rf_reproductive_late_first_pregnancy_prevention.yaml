id: RF-REPRODUCTIVE-LATE-FIRST-PREGNANCY-PREVENTION
definition: >-
  Reproductive history combining late first full-term pregnancy (age
  ≥30) OR nulliparity, AND short cumulative lifetime breastfeeding
  duration (<6 months total). Both factors independently confer
  modest increases in hormone-receptor-positive breast cancer risk
  (RR ~1.2-1.4 each) per Collaborative Group on Hormonal Factors in
  Breast Cancer + WCRF/AICR. Breastfeeding is protective in dose-
  dependent fashion (~4% breast cancer risk reduction per 12 months of
  cumulative breastfeeding). Mechanism: cumulative ovulatory cycles +
  unopposed estrogen exposure + delayed terminal differentiation of
  breast ductal epithelium. Effect cumulative with other reproductive
  factors (early menarche, late menopause, nulliparity, HRT).
  Prevention-persona RedFlag (§20 v0.3 reproductive pilot).
definition_ua: >-
  Репродуктивний анамнез, що поєднує пізню першу доношену вагітність (вік
  ≥30 років) АБО відсутність пологів (нульпаритет), З коротким сумарним
  терміном грудного вигодовування протягом життя (<6 місяців загалом).
  Обидва фактори незалежно надають помірне підвищення ризику
  гормонорецептор-позитивного раку молочної залози (ВР ~1.2-1.4 кожен) за
  даними Collaborative Group on Hormonal Factors in Breast Cancer та
  WCRF/AICR. Грудне вигодовування має захисний ефект дозозалежного
  характеру (~4% зниження ризику раку молочної залози на кожні 12 місяців
  сумарного грудного вигодовування). Механізм: кумулятивні овуляторні
  цикли, непротидіяна дія естрогену та затримка термінальної
  диференціації протокового епітелію молочної залози. Ефект кумулятивний
  з іншими репродуктивними факторами (рання менархе, пізня менопауза,
  нульпаритет, ЗГТ).

