id: RF-REPRODUCTIVE-OCP-LONG-TERM
definition: >-
  Long-term combined oral contraceptive use (≥10 cumulative years).
  Mixed cancer risk profile per IARC Monograph 100A + Collaborative
  Group on Hormonal Factors in Breast Cancer + IARC reviews:
  - Modest BREAST cancer risk increase during current use + ~5y post-
    cessation (RR ~1.08-1.20; effect declines after cessation, baseline
    risk restored ~10y post-cessation).
  - Modest CERVICAL cancer risk increase with long-term use in HPV-
    positive women (RR ~1.5 at ≥5y use; effect attenuates post-cessation).
    HPV is the necessary cofactor.
  - SUBSTANTIAL PROTECTION against OVARIAN cancer (~50% reduction at
    ≥5y use, durable for ≥30y post-cessation).
  - SUBSTANTIAL PROTECTION against ENDOMETRIAL cancer (~50% reduction at
    ≥5y use, durable post-cessation).
  - Modest CRC protective association (less robust).
  Net cancer balance is favorable for most users. Prevention-persona
  RedFlag triggers a COUNSELING-BALANCE indication — risk-benefit
  framing, not unidirectional risk warning. (§20 v0.3 reproductive pilot.)
definition_ua: >-
  Тривале застосування комбінованих оральних контрацептивів (КОК) (≥10
  кумулятивних років). Змішаний профіль онкологічного ризику за даними
  IARC Monograph 100A та Collaborative Group on Hormonal Factors in
  Breast Cancer:
  - Помірне підвищення ризику РАКУ МОЛОЧНОЇ ЗАЛОЗИ під час поточного
    застосування КОК та протягом ~5 років після припинення (ВР
    ~1.08-1.20; ефект знижується після припинення, вихідний ризик
    відновлюється приблизно через 10 років після припинення).
  - Помірне підвищення ризику РАКУ ШИЙКИ МАТКИ при тривалому застосуванні
    КОК у ВПЛ-позитивних жінок (ВР ~1.5 при застосуванні ≥5 років; ефект
    послаблюється після припинення). ВПЛ є обов'язковим кофактором.
  - СУТТЄВИЙ ЗАХИСНИЙ ЕФЕКТ щодо РАКУ ЯЄЧНИКІВ (зниження ризику ~50% при
    застосуванні ≥5 років, стійкий протягом ≥30 років після припинення).
  - СУТТЄВИЙ ЗАХИСНИЙ ЕФЕКТ щодо РАКУ ЕНДОМЕТРІЯ (зниження ризику ~50%
    при застосуванні ≥5 років).
  - Помірний захисний зв'язок щодо колоректального раку (менш
    переконливий).
  Загальний онкологічний баланс сприятливий для більшості пацієнток. Це
  формує рекомендацію щодо консультування з оцінкою балансу
  ризик-користь, а не односторонню пересторогу щодо ризику.

