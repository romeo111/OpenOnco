notes: >
  Prevention-persona RedFlag for PCOS-anovulation endometrial risk.
  Separated from the broad reproductive RF for clearer routing — PCOS-
  specific counseling (progestin restoration, metformin, weight loss) is
  distinct from generic reproductive-history counseling. Symptom-driven
  endometrial biopsy in any abnormal bleeding ≥6 months of amenorrhea
  pre-menopausal OR any post-menopausal bleeding. STUB pending two-Co-
  Lead signoff per CHARTER §6.1 dev-mode.
