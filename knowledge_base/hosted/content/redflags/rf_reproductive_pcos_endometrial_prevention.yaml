id: RF-REPRODUCTIVE-PCOS-ENDOMETRIAL-PREVENTION
definition: >-
  Polycystic ovary syndrome (PCOS) with persistent anovulation and
  resulting chronic unopposed estrogen exposure on endometrial epithelium —
  endometrial cancer RR ~2.7 (Haoula et al. Hum Reprod Update 2012);
  earlier age of onset (40s vs typical 60s) common. Often accompanied by
  obesity + insulin resistance + type-2 diabetes — additional independent
  endometrial-cancer risk factors that compound risk multiplicatively.
  Endometrioid (type I) histology predominates. Frequently underrecognized
  in women relying on hormonal contraception that masks anovulation. Risk
  modifiable: combined hormonal contraception (estrogen + progestin) OR
  cyclic progestin OR levonorgestrel IUD restore endometrial protection.
  Weight loss + metformin (in T2DM/IR PCOS) provide additional risk
  reduction. Prevention-persona RedFlag (§20 v0.3 reproductive expansion).
definition_ua: >-
  Polycystic ovary syndrome (PCOS) з persistent anovulation та resulting
  chronic unopposed estrogen exposure на endometrial epithelium —
  endometrial cancer RR ~2.7 (Haoula et al. Hum Reprod Update 2012);
  раніший age of onset (40-і vs typical 60-і) поширений. Часто з
  obesity + insulin resistance + type-2 diabetes — додаткові independent
  endometrial-cancer ризик-фактори, які мультиплікативно компаундують
  ризик. Endometrioid (type I) histology переважає. Часто under-
  recognized у жінок які використовують hormonal contraception що маскує
  anovulation. Ризик модифікований: combined hormonal contraception
  (estrogen + progestin) АБО cyclic progestin АБО levonorgestrel IUD
  відновлюють endometrial protection. Weight loss + metformin (у T2DM/IR
  PCOS) забезпечують додаткове ризик-зниження. Prevention-персона RedFlag
  (§20 v0.3 reproductive expansion).

