id: RF-RHABDOID-PREDISPOSITION-CONFIRMED-CARRIER
definition: >-
  Patient has a confirmed germline pathogenic variant in SMARCB1
  (chromosome 22q11.2) or SMARCA4 (chromosome 19p13.2), defining
  rhabdoid tumor predisposition syndrome type 1 (RTPS1) or type 2
  (RTPS2) respectively. Autosomal-dominant inheritance with near-100%
  penetrance for early-childhood disease in classic SMARCB1 cases.
  Cancer spectrum: atypical teratoid/rhabdoid tumor (ATRT) of the CNS
  with infancy peak, extracranial malignant rhabdoid tumor (MRT) of
  kidney / liver / soft tissue, small cell carcinoma of the ovary
  hypercalcemic type (SCCOHT — SMARCA4 specifically), and schwannomatosis
  in adolescent / adult survivors. The risk window is extremely narrow
  (peak ATRT incidence in the first 2 years of life) so high-cadence
  early surveillance is non-negotiable. Prevention-persona
  confirmed-carrier RedFlag (§20).
definition_ua: >-
  Пацієнт має підтверджений germline патогенний варіант в SMARCB1
  (хромосома 22q11.2) або SMARCA4 (хромосома 19p13.2), що визначає
  rhabdoid tumor predisposition syndrome тип 1 (RTPS1) або тип 2
  (RTPS2). Автосомно-домінантне успадкування з майже-100% пенетрантністю
  для захворювання в ранньому дитинстві у класичних випадках SMARCB1.
  Спектр пухлин: atypical teratoid/rhabdoid tumor (ATRT) ЦНС з піком
  у дитинстві, екстракраніальна malignant rhabdoid tumor (MRT) нирки /
  печінки / м'яких тканин, small cell carcinoma яєчника гіперкальціємічного
  типу (SCCOHT — специфічно SMARCA4), та шваноматоз у підлітковому /
  дорослому віці. Вікно ризику надзвичайно вузьке (пік ATRT — перші 2
  роки життя), тому high-cadence ранє спостереження є необхідним.
  Prevention-persona confirmed-carrier RedFlag (§20).

