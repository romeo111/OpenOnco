notes: "Prevention-persona Rhabdoid Tumor Predisposition Syndrome confirmed-carrier RedFlag (pediatric cancer predisposition Wave M). Engine routes to PreventionPlan for ATRT / MRT / (SMARCA4: SCCOHT) surveillance: brain MRI q3mo from infancy through age 4 then q6mo through age 5, whole-body MRI q3-6mo through age 5. SMARCA4 carriers additionally surveilled for SCCOHT (transvaginal US + pelvic exam starting menarche). Disease anchor DIS-GLIOMA-LOW-GRADE used as closest CNS anchor available in KB — ATRT is a distinct embryonal CNS entity, noted in rationale of paired Indications. STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode."
