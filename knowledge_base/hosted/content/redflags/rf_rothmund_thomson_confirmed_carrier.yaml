notes: >
  Wave O confirmed-carrier surveillance pathway — Rothmund-Thomson
  Syndrome (RTS / RECQL4). Fires on documented germline RECQL4
  biallelic pathogenic variants OR clinical-diagnostic criteria met
  (poikiloderma + sparse hair + skeletal anomalies). Engine routes to
  PreventionPlan recommending:
    (a) IND-ROTHMUND-THOMSON-CARRIER-SURVEILLANCE (standard) — annual
        skeletal survey (whole-body imaging — plain films + targeted
        US / MRI as warranted) + immediate X-ray / MRI of any
        persistent bone pain or palpable mass; dermatologic exam q6-12mo
        with biopsy of any suspicious lesion (poikiloderma background
        complicates clinical recognition); ophthalmologic exam annually
        (juvenile cataracts).
    (b) IND-ROTHMUND-THOMSON-CARRIER-INTENSIFIED (aggressive) — standard
        PLUS whole-body MRI q1y (replacing skeletal survey, especially
        in adolescent peak osteosarcoma years 10-20) + bone-pain
        symptom-driven low-threshold imaging + bone-tumor specialist
        co-management.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Source-set TODO: RTS-specific surveillance source —
  Wang et al. Cancer 2003; International RTS Registry recommendations;
  Larizza et al. Orphanet J Rare Dis 2010 — Wave O authoring backlog
  new SRC entities.

  Lifetime tumor risk in confirmed RECQL4 biallelic carriers (Wang et
  al. Cancer 2003; Larizza et al. 2010):
    - Osteosarcoma: ~30% lifetime; median age 11-12 years; often
      multiple primaries; preferential distal-femur / proximal-tibia
      distribution (similar to sporadic but earlier onset).
    - Non-melanoma skin cancer (BCC + SCC): elevated, especially in
      poikiloderma-affected skin and sun-exposed areas; usually
      adult-onset.
    - Lymphoma (multiple subtypes — Hodgkin, NHL): modest elevation;
      surveillance less standardized.
    - Other rare: gastric, breast, lung, colon — sporadic-pattern
      with modest aggregate elevation.
    - Non-cancer features: poikiloderma (cardinal — present in
      infancy), sparse / brittle hair, juvenile cataracts (Type II
      RTS = RECQL4 + cancer-prone form), skeletal dysplasia (radial
      ray defects, dental anomalies, short stature), GI / GU anomalies.

  Therapy implications if cancer arises: RECQL4-deficient cells
  show hypersensitivity to ionizing radiation and DNA-damaging
  chemotherapy. Osteosarcoma chemotherapy (high-dose methotrexate +
  doxorubicin + cisplatin = MAP) is given with caution; etoposide /
  topoisomerase inhibitors particularly problematic. RT dose
  modification routine. These are TREATMENT-time considerations
  (recorded here for context — RF surfaces them via render to alert
  oncologists at the moment of diagnosis).
