id: RF-ROTHMUND-THOMSON-CONFIRMED-CARRIER
definition: >-
  Confirmed biallelic germline pathogenic / likely-pathogenic variants
  in RECQL4 (RecQ-like helicase 4) — Rothmund-Thomson Syndrome (RTS).
  Patient has had germline RECQL4 testing returned positive in both
  alleles (autosomal-recessive inheritance), or meets clinical
  diagnostic criteria (poikiloderma in infancy + sparse / abnormal hair
  + skeletal anomalies + ± juvenile cataracts). No current personal
  cancer diagnosis in the carrier being assessed (current cancer
  diagnosis routes to treatment-track plan with RTS status driving
  systemic-therapy selection — RECQL4-deficient cells are
  hypersensitive to ionizing radiation and DNA-damaging
  chemotherapy / alkylators, with implications for radiotherapy dose
  modification and avoidance of camptothecin / etoposide-style
  topoisomerase agents). Lifetime osteosarcoma risk ~30%, plus
  non-melanoma skin cancer (especially in poikiloderma-affected skin),
  and lymphoma. Prevention-persona RedFlag (§20, Wave O confirmed-
  carrier surveillance pathway).
definition_ua: >-
  Підтверджені biallelic гермінативні патогенні / ймовірно-патогенні
  варіанти у RECQL4 — синдром Rothmund-Thomson (RTS). Пацієнт пройшов
  germline RECQL4-тестування з позитивним результатом в обох алелях
  (autosomal-recessive inheritance), або відповідає клінічним
  діагностичним критеріям (poikiloderma в infancy + sparse / abnormal
  hair + skeletal anomalies ± juvenile cataracts). Поточний особистий
  діагноз раку відсутній (поточний діагноз раку routes до treatment-
  track plan з RTS-статусом, який визначає systemic-therapy selection
  — RECQL4-deficient клітини гіперчутливі до ionizing radiation та
  DNA-damaging chemotherapy / alkylators, з implications для
  radiotherapy dose modification та avoidance camptothecin / etoposide
  topoisomerase agents). Lifetime osteosarcoma ризик ~30%, плюс
  non-melanoma skin cancer (особливо у poikiloderma-affected skin) та
  лімфома. Prevention-persona RedFlag (§20, Wave O шлях спостереження
  підтверджених носіїв).

