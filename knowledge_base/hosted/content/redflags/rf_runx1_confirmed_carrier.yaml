  - SRC-ELN-AML-2022
  - SRC-ESMO-MDS-2021

last_reviewed: "2026-05-20"
reviewer_signoffs: 0
notes: >
  Wave P confirmed-carrier surveillance pathway — germline RUNX1
  (FPD/AML). Fires on documented germline RUNX1 pathogenic variant
  positivity OR documented FPD/AML clinical criteria (inherited
  thrombocytopenia + dense-granule release defect + family history of
  AML / MDS / T-ALL). Engine routes to PreventionPlan recommending:
    (a) IND-RUNX1-CARRIER-SURVEILLANCE (standard) — CBC + smear q3-6
        months lifelong from carrier confirmation; baseline +
        post-clinical-change BMA with myeloid NGS panel + cytogenetics;
        molecular monitoring (ASXL1, BCOR, monosomy-7 emergence)
        annually; cascade testing to first-degree relatives with
        documented buccal / fibroblast germline confirmation.
    (b) IND-RUNX1-CARRIER-INTENSIFIED (aggressive) — standard protocol
        PLUS HLA typing on cohort + sibling early; q3-month CBC + smear
        (instead of q6); BMA every 1-2 years even without provoked
        indication; preemptive transplant-team consultation; explicit
        donor-screening protocol (sibling donor must be RUNX1-tested
        first, NOT used if a carrier — donor-derived leukemia
        documented in FPD/AML).

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Penetrance reference: Owen et al. Blood 2008; Schmit et al.
  Lancet Haematol 2024; Brown et al. Blood Adv 2020 (cumulative AML/MDS
  incidence 35-45% by age 50-60 in classic pedigrees; T-ALL ~5%
  lifetime). Functional platelet phenotype documented since Dowton et
  al. Blood 1985 (original FPD/AML kindred description).

  Critical donor-implication note: FPD/AML carriers must NOT donate
  bone marrow to an affected sibling — donor-derived leukemia in
  RUNX1 / FPD/AML kindreds is well-documented (Owen et al. 2008
  reviewed multiple cases). Pre-transplant germline testing of any
  HLA-matched sibling donor is mandatory.
