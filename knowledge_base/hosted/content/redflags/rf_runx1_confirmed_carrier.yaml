id: RF-RUNX1-CONFIRMED-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in RUNX1
  (Familial Platelet Disorder with predisposition to AML / MDS — FPD/AML,
  OMIM 601399). Patient has had germline panel testing returned positive,
  often confirmed on buccal / fibroblast tissue to avoid somatic-clone
  contamination of blood. The carrier presents at baseline with mild-to-
  moderate thrombocytopenia (platelet count 80-130 x10⁹/L typically,
  occasionally normal) and a functional platelet aggregation defect
  (deficient dense-granule release; aspirin-like in vitro phenotype) —
  the bleeding burden ranges from asymptomatic to clinically significant
  in surgical / obstetric contexts. Lifetime risk of myeloid malignancy
  (MDS or AML) is ~35-45% in classic FPD/AML pedigrees and somatic
  RUNX1 second hits, ASXL1 + monosomy-7 + del(5q) clonal events
  typically precede frank AML. T-cell lymphoid leukemia risk (~5%
  lifetime) and rare hairy-cell-like presentations have also been
  documented. Prevention-persona RedFlag (KSS §20, confirmed-carrier
  surveillance pathway).
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у RUNX1 (Familial Platelet Disorder with predisposition to AML / MDS —
  FPD/AML, OMIM 601399). Пацієнт пройшов germline-тестування з
  позитивним результатом, часто підтвердженим на buccal / fibroblast
  тканині для уникнення контамінації крові соматичним клоном. Носій
  представляє на baseline м'яко-помірну тромбоцитопенію (тромбоцити
  80-130 x10⁹/л зазвичай, інколи в нормі) та функціональний дефект
  агрегації тромбоцитів (дефіцитний dense-granule release; aspirin-like
  in vitro фенотип) — bleeding burden від асимптомної до клінічно
  значущої при хірургічних / акушерських ситуаціях. Довічний ризик
  мієлоїдного malignancy (МДС або ГМЛ) ~35-45% у класичних FPD/AML
  родоводах і соматичні RUNX1 "second hits", ASXL1 + моносомія-7 +
  del(5q) клональні події зазвичай передують франкному ГМЛ. T-клітинний
  лімфоїдний leukemia ризик (~5% довічно) та рідкісні hairy-cell-like
  презентації також задокументовані. Prevention-persona RedFlag (KSS
  §20, шлях спостереження підтверджених носіїв).

trigger:
  type: lab_value
  any_of:
    - finding: "germline_runx1_pathogenic_variant_confirmed"
      value: true
    - finding: "familial_platelet_disorder_runx1_clinical_criteria_met"
      value: true

clinical_direction: investigate

severity: major
priority: 80
category: other
risk_category: genetic

# RUNX1 carrier malignancy spectrum: AML (dominant, ~30-35% lifetime),
# MDS (often precedes AML, ~10-15%), T-cell ALL (~5% lifetime), rare
# hairy-cell-like presentations. DIS-T-ALL anchor included because
# T-cell ALL is the second most common heme malignancy in FPD/AML.
relevant_diseases:
  - DIS-AML
  - DIS-MDS-HR
  - DIS-T-ALL

shifts_algorithm: []

