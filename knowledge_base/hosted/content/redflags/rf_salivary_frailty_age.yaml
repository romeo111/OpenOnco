last_reviewed: "2026-04-27"
draft: false

notes: >
  Salivary gland cancers span indolent (low-grade mucoepidermoid, acinic
  cell — 10-yr OS >80%) to aggressive (salivary duct, high-grade
  transformation — 5-yr OS ~30%); frailty-age framing must consider
  histology + AR / HER2 / NTRK status. Cisplatin-CRT in elderly carries
  high mucositis + nephrotoxicity rates. Bicalutamide + LHRH (AR+ SDC)
  is well-tolerated even in elderly — comparable efficacy to
  chemotherapy with much lower toxicity (EORTC-1206). Larotrectinib /
  entrectinib (NTRK+) similar — well-tolerated. Geriatric assessment
  (G8) ≥70 recommended before chemoradiation. Consider IMRT alone
  (without chemo) for elderly with locally advanced disease + organ
  dysfunction.
notes_ua: >
  Рак слинних залоз охоплює спектр від індолентних варіантів
  (мукоепідермоїдна карцинома низького ступеня злоякісності,
  ацинарноклітинна карцинома — 10-річна ЗВ >80%) до агресивних (карцинома
  слинної протоки (SDC), трансформація у високий ступінь злоякісності —
  5-річна ЗВ ~30%); оцінка за критерієм «слабкість/вік» має враховувати
  гістологію та статус AR / HER2 / NTRK. Цисплатин у поєднанні з
  хіміопроменевою терапією у літніх пацієнтів супроводжується високою
  частотою мукозиту та нефротоксичності. Бікалутамід + LHRH (при AR+ SDC)
  добре переноситься навіть у літніх пацієнтів — ефективність порівнянна
  з хіміотерапією за значно нижчої токсичності (EORTC-1206). Ларотректиніб
  / ентректиніб (при NTRK+) переносяться так само добре. Гериатрична
  оцінка (G8) ≥70 рекомендована перед хіміопроменевою терапією. Для
  літніх пацієнтів з місцево-поширеним захворюванням та дисфункцією
  органів варто розглянути IMRT без хіміотерапії.
