id: RF-SALIVARY-FRAILTY-AGE
definition: >
  Age ≥75 with ECOG ≥2 or ≥2 comorbidities — cisplatin + RT and
  trastuzumab + chemotherapy combinations poorly tolerated; AR-targeted
  therapy (bicalutamide + LHRH for AR+ SDC) is favored low-toxicity
  alternative; for indolent histologies (low-grade mucoepidermoid /
  acinic cell), watchful waiting is appropriate.
definition_ua: >
  Вік ≥75 з ECOG ≥2 або ≥2 коморбідностями — цисплатин + променева терапія
  та трастузумаб + хіміотерапія погано переносяться; AR-таргетна терапія
  (бікалутамід + LHRH при AR+ SDC) є переважною низькотоксичною
  альтернативою; для індолентних гістологічних варіантів (мукоепідермоїдна
  карцинома низького ступеня злоякісності / ацинарноклітинна карцинома)
  доцільна тактика спостереження.

trigger:
  type: composite_clinical
  all_of:
    - finding: "age_years"
      threshold: 75
      comparator: ">="
    - any_of:
        - finding: "ecog_status"
          threshold: 2
          comparator: ">="
        - finding: "comorbidity_count"
          threshold: 2
          comparator: ">="

clinical_direction: de-escalate
severity: major
priority: 100
category: frailty-age

relevant_diseases: [DIS-SALIVARY]

sources:
  - SRC-ESMO-SALIVARY
