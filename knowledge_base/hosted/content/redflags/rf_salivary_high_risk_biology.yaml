id: RF-SALIVARY-HIGH-RISK-BIOLOGY
definition: >
  Salivary gland carcinoma with actionable molecular driver: ETV6-NTRK3
  fusion (mammary analog secretory carcinoma — ~100% MASC, larotrectinib
  / entrectinib), HER2 amplification (salivary duct carcinoma ~30-40%,
  trastuzumab + chemotherapy), HRAS mutation (SDC ~10-15%, tipifarnib),
  PIK3CA mutation (SDC ~20-30%), AR positivity (~70-80% SDC, androgen
  deprivation), or NOTCH1 mutation (adenoid cystic ~15%, gamma-secretase
  inhibitors in trials) — re-routes from cytotoxic chemotherapy to
  histology-specific targeted therapy.
definition_ua: >
  Карцинома слинних залоз із клінічно значущим молекулярним драйвером:
  фузія ETV6-NTRK3 (мамарно-аналогова секреторна карцинома — MASC, ~100%
  випадків, ларотректиніб / ентректиніб), ампліфікація HER2 (карцинома
  слинної протоки (SDC) ~30-40%, трастузумаб + хіміотерапія), мутація
  HRAS (SDC ~10-15%, типіфарніб), мутація PIK3CA (SDC ~20-30%),
  AR-позитивність (~70-80% SDC, андроген-деприваційна терапія), або
  мутація NOTCH1 (аденоїдно-кістозна карцинома ~15%, інгібітори
  гамма-секретази у клінічних дослідженнях) — змінює тактику лікування з
  цитотоксичної хіміотерапії на гістологічно-специфічну таргетну терапію.

trigger:
  type: biomarker
  any_of:
    - finding: "BIO-NTRK-FUSION"
      value: "positive"
    - finding: "BIO-HER2-SOLID"
      value: "positive"
    - finding: "BIO-HRAS"
      value: "positive"
    - finding: "BIO-PIK3CA-MUTATION"
      value: "positive"
    - finding: "BIO-NOTCH1-MUTATION"
      value: "positive"
    - finding: "androgen_receptor_status"
      value: "positive"

