draft: false

notes: >
  Salivary gland carcinoma is a histology-defined umbrella with distinct
  molecular drivers: MASC ~100% ETV6-NTRK3 fusion → larotrectinib (ORR
  ~80% basket trials). Salivary duct carcinoma (SDC) ~70-80% AR+ →
  bicalutamide + LHRH analog (EORTC-1206 phase 2 confirms benefit);
  ~30-40% HER2+ → trastuzumab + paclitaxel (similar ORR to breast
  cancer trials); HRAS-mutant ~10-15% → tipifarnib (KO-TIP-007 ORR ~38%
  in HRAS-mutant SDC). Adenoid cystic carcinoma ~15% NOTCH1 mutant —
  AL101 / brontictuzumab in trials; otherwise cisplatin-based chemo
  modest activity. Comprehensive histology + molecular profiling at
  diagnosis is now ESMO-recommended for advanced salivary cancer.
notes_ua: >
  Карцинома слинних залоз — парасольковий термін, що об'єднує пухлини
  різної гістології з відмінними молекулярними драйверами: MASC — ~100%
  фузія ETV6-NTRK3 → ларотректиніб (ORR ~80% у кошикових дослідженнях).
  Карцинома слинної протоки (SDC): ~70-80% AR+ → бікалутамід + аналог
  LHRH (EORTC-1206, фаза 2, підтверджує користь); ~30-40% HER2+ →
  трастузумаб + паклітаксел (ORR подібний до досліджень при раку молочної
  залози); HRAS-мутантний варіант ~10-15% → типіфарніб (KO-TIP-007, ORR
  ~38% при HRAS-мутантному SDC). Аденоїдно-кістозна карцинома ~15%
  NOTCH1-мутантна — AL101 / бронтиктузумаб у клінічних дослідженнях; в
  інших випадках хіміотерапія на основі цисплатину має помірну
  активність. Комплексне гістологічне та молекулярне профілювання на
  момент діагностики нині рекомендоване ESMO для поширеного раку слинних
  залоз.
