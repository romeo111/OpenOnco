id: RF-SALIVARY-INFECTION-SCREENING
definition: >
  Active or latent infection requiring resolution / prophylaxis before
  initiating cisplatin-based chemotherapy, trastuzumab, larotrectinib /
  entrectinib, or bicalutamide for advanced salivary gland carcinoma:
  HBsAg-positive (HBV reactivation on cytotoxic + targeted), anti-HBc-
  positive (occult HBV), HIV-positive (ART coordination), or active TB.
definition_ua: >
  Активна або латентна інфекція, що потребує лікування / профілактики
  перед платино-вмісною хіміотерапією, трастузумабом, ларотректинібом /
  ентректинібом або бікалутамідом при поширеній карциномі слинних залоз:
  HBsAg+ (реактивація HBV на тлі цитотоксичної + таргетної терапії),
  anti-HBc+ (окультна HBV-інфекція), HIV+ (координація АРТ), активний
  туберкульоз.

trigger:
  type: lab_value
  any_of:
    - finding: "hbsag"
      value: "positive"
    - finding: "anti_hbc_total"
      value: "positive"
    - finding: "hiv_status"
      value: "positive"
    - finding: "active_tb"
      value: true

clinical_direction: hold

severity: critical
priority: 60
category: infection-screening

relevant_diseases:
  - DIS-SALIVARY

sources:
  - SRC-ESMO-SALIVARY
  - SRC-NCCN-HEAD-AND-NECK

last_reviewed: "2026-04-27"
draft: false

notes: >
  Trastuzumab carries HBV reactivation risk (FDA boxed warning class
  effect for chemoimmunotherapy in HBV-endemic regions). Larotrectinib /
  entrectinib (CYP3A4 substrates) require ART coordination — avoid
  ritonavir-boosted PIs. Bicalutamide / LHRH analogs (AR+ SDC) are
  generally low-risk for HBV reactivation but standard pre-treatment
  screening still applies. Active TB: complete anti-TB before head-and-
  neck RT given mucositis + neutropenia overlap. HBsAg+: entecavir /
  tenofovir prophylaxis. HIV+: PCP prophylaxis if on cytotoxic
  combination chemotherapy.
notes_ua: >
  Трастузумаб несе ризик реактивації HBV (боксоване попередження FDA —
  класовий ефект хіміоімунотерапії в HBV-ендемічних регіонах).
  Ларотректиніб / ентректиніб (субстрати CYP3A4) потребують узгодження
  з АРТ — уникати інгібіторів протеази, посилених ритонавіром. Бікалутамід
  / аналоги LHRH (AR+ SDC) мають загалом низький ризик реактивації HBV,
  але стандартний скринінг перед лікуванням застосовується так само.
  Активний туберкульоз: завершити протитуберкульозну терапію перед
  променевою терапією ділянки голови та шиї — з огляду на накладання
  мукозиту та нейтропенії. HBsAg+: профілактика ентекавіром / тенофовіром.
  HIV+: профілактика ПЦП (пневмоцистної пневмонії) за умови цитотоксичної
  комбінованої хіміотерапії.
