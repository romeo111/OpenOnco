id: RF-SALIVARY-TRANSFORMATION-PROGRESSION
definition: >
  Salivary gland carcinoma progression: high-grade transformation
  (low-grade adenoid cystic / acinic cell to high-grade variant —
  aggressive course), perineural invasion / skull base extension on
  imaging (adenoid cystic dominant pattern), new lung / liver / bone
  metastases, rapid progression on histology-specific targeted therapy,
  or salivary duct carcinoma with rapidly rising tumor markers — triggers
  re-staging, re-biopsy with comprehensive genomic profiling, and salvage
  systemic therapy + RT consideration.
definition_ua: >
  Прогресія карциноми слинних залоз: трансформація у високий ступінь
  злоякісності (аденоїдно-кістозна карцинома низького ступеня
  злоякісності / ацинарноклітинна карцинома → варіант високого ступеня
  злоякісності — агресивний перебіг), периневральна інвазія / поширення
  на основу черепа за даними візуалізації (домінантна модель для
  аденоїдно-кістозної карциноми), нові метастази в легені / печінку /
  кістки, швидке прогресування на гістологічно-специфічній таргетній
  терапії або карцинома слинної протоки зі швидко зростаючими пухлинними
  маркерами — тригерує повторне визначення стадії, повторну біопсію з
  усебічним геномним профілюванням (CGP) та розгляд сальваджової
  системної терапії + RT.

trigger:
  type: composite_clinical
  any_of:
    - finding: "high_grade_transformation"
      value: true
    - finding: "perineural_invasion_skull_base"
      value: true
    - finding: "new_metastatic_disease"
      value: true
    - finding: "rapid_progression_on_targeted_therapy"
      value: true

clinical_direction: hold
severity: critical
priority: 60
category: transformation-progression

