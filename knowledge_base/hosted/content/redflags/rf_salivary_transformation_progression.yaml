last_reviewed: "2026-04-27"
draft: false

notes: >
  Adenoid cystic carcinoma classically has indolent course but
  progressive perineural invasion + late distant relapses (lung, bone)
  10-15 yr post-treatment — surveillance imaging required even in
  apparently "stable" patients. High-grade transformation of low-grade
  histologies (acinic cell, mucoepidermoid) confers worse prognosis,
  often requires intensified RT + cisplatin chemoradiation. Re-biopsy
  at progression captures actionable molecular drivers in ~30-40% (HER2,
  AR, NTRK, HRAS, NOTCH1) — changes salvage choice from cytotoxic to
  targeted. Skull-base extension may benefit from proton-beam RT
  (improves organ-at-risk sparing).
notes_ua: >
  Аденоїдно-кістозна карцинома класично має індолентний перебіг, але з
  прогресуючою периневральною інвазією та пізніми віддаленими рецидивами
  (легені, кістки) через 10-15 років після лікування — візуалізаційний
  нагляд необхідний навіть у пацієнтів з формально «стабільним» перебігом.
  Трансформація у високий ступінь злоякісності при вихідно
  низькозлоякісних гістологічних варіантах (ацинарноклітинна,
  мукоепідермоїдна карцинома) погіршує прогноз і часто потребує
  інтенсифікованої променевої терапії в поєднанні з хіміопроменевою
  терапією на основі цисплатину. Повторна біопсія при прогресії виявляє
  клінічно значущі молекулярні драйвери у ~30-40% випадків (HER2, AR,
  NTRK, HRAS, NOTCH1) — це змінює вибір сальваджової терапії з
  цитотоксичної на таргетну. Поширення на основу черепа може отримати
  користь від протонної променевої терапії (краще збереження органів
  ризику).
