notes: >
  Gene-specific paraganglioma syndrome 5 (PGL5) confirmed-carrier RF.
  Fires on documented germline SDHA pathogenic / likely-pathogenic
  variant positivity in an asymptomatic individual. Distinct from the
  multi-gene RF-SDH-CONFIRMED-CARRIER which fires on the legacy per-
  gene `germline_sdha_pathogenic_variant_confirmed` finding; this RF
  uses `germline_sdha_specific_carrier` to avoid double-firing on
  patients whose pedigree-specific variant is being tracked under the
  new gene-stratified surveillance pathway. Engine routes to
  PreventionPlan recommending:
    (a) IND-SDHA-CARRIER-SURVEILLANCE (standard) — biennial whole-body
        MRI from age 18-20 (no pediatric whole-body MRI given
        adulthood-onset profile); annual plasma free metanephrines +
        methoxytyramine (3-MT preferred — SDHx-associated PGLs
        frequently dopaminergic); head + neck MRI q3y for parasympathetic
        screening; abdominal MRI q2y for SDH-deficient GIST + RCC;
        cascade testing offered to first-degree relatives.
    (b) IND-SDHA-CARRIER-SYMPTOM-DRIVEN (aggressive in the rhetorical
        sense — actually represents a less-intensive symptom-driven
        approach offered as the alternative to scheduled imaging given
        SDHA's lower penetrance; the patient-shared-decision-making
        choice is "scheduled biennial imaging" vs "biochemistry-only
        with symptom-driven cross-sectional"). Some referral centers
        offer this less-intensive option for adult SDHA carriers given
        cumulative-MRI burden vs ~10-20% lifetime PPGL risk trade-off.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

  Lifetime tumor risk in confirmed SDHA carriers (van der Tuin et al.
  JCEM 2018, Bausch et al. JAMA Oncol 2017, Else et al. JCEM 2017
  international registry):
    - PPGL aggregate ~10-20% by age 70 (lower than SDHB ~50% and SDHD
      ~80%); predominantly adulthood-onset (median 30s-50s).
    - SDH-deficient GIST: documented but rare in SDHA; indolent,
      multifocal, wild-type c-KIT / PDGFRA — imatinib-non-responsive.
    - RCC: lower frequency than SDHB; clear-cell or type-2-papillary
      morphology when present.
    - Pituitary adenoma: rare; reported in broader "3PAs"
      (Pituitary + Paraganglioma) association.
    - Inheritance pattern: autosomal-dominant without SDHD / SDHAF2
      maternal-imprinting; penetrant from either parent.
