id: RF-SDHA-SPECIFIC-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in SDHA
  (succinate dehydrogenase complex subunit A) — paraganglioma syndrome
  type 5 (PGL5). SDHA is the newer-recognized SDHx gene with lower and
  later-onset penetrance than SDHB / SDHD: lifetime risk of
  pheochromocytoma + paraganglioma is approximately 10-20% by age 70,
  with most events emerging in adulthood (median 30s-50s) rather than
  pediatric onset. Tumor spectrum also includes SDH-deficient
  gastrointestinal stromal tumor (SDH-deficient GIST — wild-type c-KIT
  and PDGFRA, indolent multifocal biology, imatinib-non-responsive),
  occasional clear-cell / type-2-papillary renal cell carcinoma, and
  rare pituitary adenoma reports in the broader "3PAs" association.
  Inheritance is autosomal-dominant without the SDHD / SDHAF2 maternal-
  imprinting pattern (penetrant from either parent). Patient has had
  germline SDHA testing returned positive on a known pedigree-specific
  variant or via multi-gene panel; pedigree-suspicion question is
  settled and no current personal cancer diagnosis. Surveillance is
  lighter than SDHB given lower penetrance + adulthood onset:
  biennial whole-body MRI from age 18-20 + annual plasma metanephrines
  + methoxytyramine (3-MT). Prevention-persona RedFlag distinct from
  the multi-gene RF-SDH-CONFIRMED-CARRIER (which fires on legacy
  per-gene findings) — this gene-specific RF carries surveillance
  intensity calibrated to SDHA's lower-risk profile.
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у SDHA (succinate dehydrogenase complex subunit A) — paraganglioma
  syndrome type 5 (PGL5). SDHA — newer-recognized SDHx ген з нижчою та
  пізнішою penetrance, ніж SDHB / SDHD: lifetime ризик феохромоцитоми +
  парагангліоми приблизно 10-20% до 70 років, з більшістю подій у
  дорослому віці (медіана 30-50 років), не pediatric onset. Tumor
  spectrum також включає SDH-deficient GIST (wild-type c-KIT / PDGFRA,
  indolent multifocal biology, imatinib-non-responsive), окремі
  clear-cell / type-2-papillary RCC, та рідкісні pituitary adenoma
  у broader "3PAs" association. Успадкування autosomal-dominant без
  SDHD / SDHAF2 maternal-imprinting pattern (penetrant від будь-якого
  з батьків). Пацієнт пройшов germline SDHA-тестування з позитивним
  результатом на known pedigree-specific варіант або multi-gene panel;
  питання родовідної підозри вирішене; поточний особистий діагноз раку
  відсутній. Спостереження lighter порівняно з SDHB через lower
  penetrance + adulthood onset: biennial whole-body MRI з 18-20 років
  + annual plasma метанефрини + methoxytyramine (3-MT). Prevention-
  persona RedFlag distinct від multi-gene RF-SDH-CONFIRMED-CARRIER
  (який fires на legacy per-gene findings) — цей gene-specific RF несе
  surveillance intensity calibrated до SDHA lower-risk profile.

