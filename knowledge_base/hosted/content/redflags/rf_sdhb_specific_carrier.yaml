notes: >
  Gene-specific paraganglioma syndrome 4 (PGL4) confirmed-carrier RF —
  CRITICAL severity. Fires on documented germline SDHB pathogenic /
  likely-pathogenic variant positivity in an asymptomatic individual.
  Distinct from the multi-gene RF-SDH-CONFIRMED-CARRIER which fires on
  the legacy `germline_sdhb_pathogenic_variant_confirmed` finding; this
  RF uses `germline_sdhb_specific_carrier` (or `paraganglioma_pgl4_
  clinical_criteria_met`) to avoid double-firing under the new gene-
  stratified surveillance pathway. Engine routes to PreventionPlan:
    (a) IND-SDHB-CARRIER-SURVEILLANCE (standard) — whole-body MRI
        annually from age 6-10 (younger if family-specific proband
        younger); plasma free metanephrines + methoxytyramine (3-MT)
        q6-12mo; head + neck MRI q2-3y; abdominal MRI annually for
        sympathetic PGL + RCC + GIST; 68Ga-DOTATATE PET reserved for
        staging confirmed lesions (high SSTR2 expression in SDHx-PPGL);
        18F-FDG PET as alternative functional modality (SDHB-PPGL high
        FDG-avidity reported); pre-operative alpha-blockade mandatory
        for any PPGL resection; cascade testing.
    (b) IND-SDHB-CARRIER-INTENSIFIED (aggressive) — earlier baseline
        (age 5 in pediatric-onset kindreds) + q6mo biochemistry +
        functional imaging supplement (annual 18F-FDG PET or 68Ga-
        DOTATATE PET in highest-risk subset — prior PPGL history,
        metastatic pedigree).

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

  Lifetime tumor risk in confirmed SDHB carriers (Andrews et al. JCEM
  2018; Rijken et al. Endocr Relat Cancer 2017; international PPGL
  registry data):
    - PPGL aggregate ~30-50% by age 60 (~50-70% lifetime); predominantly
      sympathetic abdominal + thoracic paragangliomas + pheochromocytoma.
    - Metastatic rate ~30-70% of incident PPGL events (dominant
      mortality driver — far higher than SDHD ~10% / SDHC <5%).
    - RCC ~14% lifetime; often aggressive type-2-papillary or oncocytic
      morphology; nephron-sparing surgery preferred when feasible.
    - SDH-deficient GIST: indolent multifocal, wild-type c-KIT /
      PDGFRA; imatinib-non-responsive.
    - Pediatric onset documented (~10% of kindreds index PPGL before
      age 10) — surveillance baseline age 6-10 (younger if family
      proband younger).
    - Inheritance pattern: autosomal-dominant without SDHD / SDHAF2
      maternal-imprinting.
