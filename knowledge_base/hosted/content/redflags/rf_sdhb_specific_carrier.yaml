id: RF-SDHB-SPECIFIC-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in SDHB
  (succinate dehydrogenase complex subunit B) — paraganglioma syndrome
  type 4 (PGL4). SDHB carries the HIGHEST aggregate lifetime
  paraganglioma + pheochromocytoma risk among the SDHx subunits
  (~30-50% by age 60, ~50-70% lifetime in some kindreds) AND the
  highest metastatic / malignant rate (~30-70% of incident PPGL events
  metastasize, vs <10% in other SDHx subunits). Tumor distribution is
  predominantly sympathetic abdominal + thoracic paragangliomas (peri-
  aortic, organ-of-Zuckerkandl) rather than the head + neck
  parasympathetic distribution characteristic of SDHD / SDHC.
  Additional risk: SDH-deficient renal cell carcinoma (~14% lifetime,
  often aggressive type-2-papillary or oncocytic morphology) and
  SDH-deficient gastrointestinal stromal tumor. Pediatric onset is
  documented — index PPGL events before age 10 occur in ~10% of
  pedigrees. Inheritance is autosomal-dominant without SDHD / SDHAF2
  maternal-imprinting (penetrant from either parent). Mandates the
  most intensive surveillance of any SDHx subunit: whole-body MRI
  annually from age 6-10, plasma metanephrines + methoxytyramine
  (3-MT) q6-12mo, with 18F-FDG PET / 68Ga-DOTATATE PET considered for
  staging confirmed lesions given high SDHB-PPGL FDG-avidity. CRITICAL
  severity justified by pediatric onset + metastatic disease as
  dominant mortality driver. Prevention-persona RedFlag distinct from
  the multi-gene RF-SDH-CONFIRMED-CARRIER — uses
  `germline_sdhb_specific_carrier` finding to avoid double-firing.
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у SDHB (succinate dehydrogenase complex subunit B) — paraganglioma
  syndrome type 4 (PGL4). SDHB несе НАЙВИЩИЙ aggregate lifetime
  PPGL ризик серед SDHx subunits (~30-50% до 60 років, ~50-70%
  lifetime в деяких кіндредах) ТА найвищий metastatic / malignant
  rate (~30-70% incident PPGL events metastasize, vs <10% у інших
  SDHx). Tumor distribution predominantly sympathetic abdominal +
  thoracic paragangliomas (peri-aortic, organ-of-Zuckerkandl), не
  head + neck parasympathetic distribution характерний для SDHD /
  SDHC. Additional risk: SDH-deficient RCC (~14% lifetime, часто
  aggressive type-2-papillary або oncocytic morphology) та
  SDH-deficient GIST. Pediatric onset documented — index PPGL
  events до 10 років у ~10% pedigrees. Успадкування autosomal-
  dominant без SDHD / SDHAF2 maternal-imprinting (penetrant від
  будь-якого з батьків). Mandates найінтенсивніше спостереження
  серед SDHx: whole-body MRI annually з 6-10 років, plasma
  метанефрини + methoxytyramine (3-MT) q6-12mo, з 18F-FDG PET /
  68Ga-DOTATATE PET для staging confirmed lesions через high
  SDHB-PPGL FDG-avidity. CRITICAL severity виправдана pediatric
  onset + metastatic disease як dominant mortality driver.
  Prevention-persona RedFlag distinct від multi-gene
  RF-SDH-CONFIRMED-CARRIER — використовує
  `germline_sdhb_specific_carrier` finding для уникнення
  double-firing.

