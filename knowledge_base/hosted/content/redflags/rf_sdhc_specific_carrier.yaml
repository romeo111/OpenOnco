notes: >
  Gene-specific paraganglioma syndrome 3 (PGL3) confirmed-carrier RF.
  Fires on documented germline SDHC pathogenic / likely-pathogenic
  variant positivity in an asymptomatic individual. Distinct from the
  multi-gene RF-SDH-CONFIRMED-CARRIER which fires on the legacy
  `germline_sdhc_pathogenic_variant_confirmed` finding; this RF uses
  `germline_sdhc_specific_carrier` (or `paraganglioma_pgl3_clinical_
  criteria_met`) to avoid double-firing under the new gene-stratified
  surveillance pathway. Engine routes to PreventionPlan:
    (a) IND-SDHC-CARRIER-SURVEILLANCE (standard) — head + neck MRI
        annually from age 10-15 (parasympathetic-predominant); plasma
        free metanephrines + methoxytyramine q12mo (3-MT critical for
        dopaminergic biochemistry); abdominal MRI q2-3y for the rare
        sympathetic PGL + SDH-deficient RCC / GIST; pre-operative
        alpha-blockade for any secretory PGL resection; cascade
        testing offered to first-degree relatives.
    (b) IND-SDHC-CARRIER-SYMPTOM-DRIVEN (aggressive in the rhetorical
        sense — actually less-intensive symptom-driven track offered as
        the alternative given SDHC's lower penetrance + low metastatic
        rate; some referral centers offer biochemistry-only with cross-
        sectional imaging triggered by signs / symptoms or biochemistry
        abnormalities).

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.

  Lifetime tumor risk in confirmed SDHC carriers (Andrews et al. JCEM
  2018; Niemeijer et al. Endocrinology 2017; international PPGL
  registry data):
    - PPGL aggregate ~10-15% by age 60 (Andrews registry); some series
      ~25% aggregate; predominantly head + neck parasympathetic
      paragangliomas (carotid body, vagal, jugulo-tympanic, skull base).
    - Metastatic rate <5% of incident events (much lower than SDHB).
    - SDH-deficient GIST: documented but uncommon.
    - RCC: uncommon; not the dominant feature.
    - Inheritance pattern: autosomal-dominant without SDHD / SDHAF2
      maternal-imprinting (penetrant from either parent).
    - Biochemistry: head + neck PGLs frequently dopaminergic or non-
      secretory; standard metanephrine panel without 3-MT may miss
      these — 3-MT inclusion is critical when biochemistry is performed.
