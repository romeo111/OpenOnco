id: RF-SDHC-SPECIFIC-CARRIER
definition: >-
  Confirmed germline pathogenic / likely-pathogenic variant in SDHC
  (succinate dehydrogenase complex subunit C) — paraganglioma syndrome
  type 3 (PGL3). SDHC carries a lower lifetime paraganglioma +
  pheochromocytoma risk (~10-15% by age 60 in pooled international
  registry data, lower in some kindreds at ~25% aggregate per Andrews
  et al. JCEM 2018) than SDHB / SDHD, and metastatic disease is rare
  (<5% of incident events). Tumor distribution is predominantly head +
  neck parasympathetic paragangliomas — carotid body, jugulo-tympanic,
  vagal, and skull-base locations — rather than the abdominal /
  thoracic sympathetic distribution characteristic of SDHB. SDH-
  deficient gastrointestinal stromal tumor and renal cell carcinoma
  have been described but are uncommon. Inheritance is autosomal-
  dominant without the SDHD / SDHAF2 maternal-imprinting pattern
  (penetrant from either parent). Patient has had germline SDHC
  testing returned positive on a known pedigree-specific variant or
  via multi-gene panel; pedigree-suspicion question is settled and no
  current personal cancer diagnosis. Surveillance focus is head + neck
  MRI annually from age 10-15 + annual plasma metanephrines +
  methoxytyramine (3-MT) — though dopaminergic / non-secretory head +
  neck PGLs are common, biochemistry retains value for the rare
  secretory event and for post-resection follow-up. Prevention-persona
  RedFlag distinct from the multi-gene RF-SDH-CONFIRMED-CARRIER — uses
  `germline_sdhc_specific_carrier` finding to avoid double-firing.
definition_ua: >-
  Підтверджений гермінативний патогенний / ймовірно-патогенний варіант
  у SDHC (succinate dehydrogenase complex subunit C) — paraganglioma
  syndrome type 3 (PGL3). SDHC несе нижчий lifetime PPGL ризик
  (~10-15% до 60 років у pooled international registry, lower у
  деяких кіндредах при ~25% aggregate за Andrews et al. JCEM 2018),
  ніж SDHB / SDHD, та metastatic disease rare (<5% incident events).
  Tumor distribution predominantly head + neck парасимпатичні PGL —
  carotid body, jugulo-tympanic, vagal та skull-base локації — не
  abdominal / thoracic sympathetic distribution характерний для SDHB.
  SDH-deficient GIST та RCC описані, але рідкісні. Успадкування
  autosomal-dominant без SDHD / SDHAF2 maternal-imprinting pattern
  (penetrant від будь-якого з батьків). Пацієнт пройшов germline
  SDHC-тестування з позитивним результатом на known pedigree-specific
  варіант або multi-gene panel; питання родовідної підозри вирішене;
  поточний особистий діагноз раку відсутній. Surveillance focus —
  head + neck MRI annually з 10-15 років + annual plasma метанефрини
  + methoxytyramine (3-MT) — хоча dopaminergic / non-secretory head +
  neck PGLs поширені, біохімія retains value для rare secretory event
  та post-resection follow-up. Prevention-persona RedFlag distinct від
  multi-gene RF-SDH-CONFIRMED-CARRIER — використовує
  `germline_sdhc_specific_carrier` finding для уникнення
  double-firing.

