id: RF-VULVAR-VAGINAL-SCC-PDL1-CPS-1-PLUS
definition: >
  Previously treated, recurrent, or metastatic vulvar or vaginal
  squamous cell carcinoma with PD-L1 CPS ≥1 by 22C3 IHC. KEYNOTE-158
  (Shapira-Frommer, Gynecol Oncol 2022) evaluated pembrolizumab
  monotherapy in previously treated advanced vulvar SCC (n=101):
  durable responses (ORR 10.9% overall, median DOR 20.4 months among
  responders) occurred in BOTH PD-L1-positive (ORR 9.5%, n=84) and
  PD-L1-negative (ORR 28.6%, n=7 — small subgroup, wide CI) patients.
  CPS≥1 is therefore NOT a validated hard predictive cutoff for vulvar
  SCC pembrolizumab response, unlike the CPS≥1 FDA-label requirement
  for cervical cancer (KEYNOTE-826). This RedFlag surfaces PD-L1 CPS
  status as an eligibility-informing (not strictly gating) marker for
  pembrolizumab access in metastatic/recurrent vulvar-vaginal SCC,
  consistent with cross-tumor pembrolizumab-eligibility practice
  pending a vulvar/vaginal-specific regulatory label.
definition_ua: >
  Попередньо лікована, рецидивна або метастатична плоскоклітинна
  карцинома вульви або піхви з PD-L1 CPS ≥1 за 22C3 IHC. KEYNOTE-158
  (Shapira-Frommer, Gynecol Oncol 2022) оцінював пембролізумаб у
  монотерапії при попередньо лікованій поширеній SCC вульви (n=101):
  стійкі відповіді (ORR 10.9% загалом, медіана DOR 20.4 міс серед
  відповідачів) спостерігались ЯК у PD-L1-позитивних (ORR 9.5%, n=84),
  ТАК і у PD-L1-негативних (ORR 28.6%, n=7 — мала підгрупа, широкий ДІ)
  пацієнтів. Тому CPS≥1 НЕ є валідованим жорстким предиктивним
  порогом для відповіді на пембролізумаб при SCC вульви, на відміну
  від CPS≥1 FDA-label вимоги для цервікального раку (KEYNOTE-826). Цей
  RedFlag відображає статус PD-L1 CPS як маркер, що інформує (але не
  строго обмежує) доступ до пембролізумабу при метастатичній/
  рецидивній SCC вульви-піхви, узгоджено з крос-нозологічною
  практикою pembrolizumab-eligibility до появи вульв/вагінально-
  специфічного регуляторного маркування.

trigger:
  type: biomarker
  any_of:
    - finding: "pdl1_cps"
      threshold: 1
      comparator: ">="
    - finding: "pdl1_cps_22c3"
      threshold: 1
      comparator: ">="
    - finding: "BIO-PDL1-CPS"
      threshold: 1
      comparator: ">="

