notes: >
  Severity set to 'minor' (lower than the analogous
  RF-CERVICAL-PDL1-CPS-1-PLUS, which is 'major') because the vulvar-
  SCC evidence base (KEYNOTE-158 basket cohort, n=101, non-randomized)
  does NOT show a clean PD-L1-positive vs PD-L1-negative response
  differential — unlike cervical cancer's KEYNOTE-826 randomized
  CPS≥1 stratification. This RF is authored as directed by the disease
  narrative ('metastatic — pembrolizumab if PD-L1+') for consistency
  with cross-tumor pembrolizumab-eligibility conventions in this KB,
  but the notes above make the evidentiary caveat explicit so a
  clinical reviewer can recalibrate severity/priority or the ALGO's
  routing logic. STUB pending clinical co-lead signoff (CHARTER §6.1;
  dev-mode-exempted per CHARTER §8.3 — draft content only).
notes_ua: >
  Рівень серйозності встановлено 'minor' (нижче, ніж аналогічний
  RF-CERVICAL-PDL1-CPS-1-PLUS, який має 'major'), оскільки доказова
  база для SCC вульви (кошиковий кагорт KEYNOTE-158, n=101,
  нерандомізоване дослідження) НЕ демонструє чіткої різниці відповіді
  між PD-L1-позитивними та PD-L1-негативними пацієнтами — на відміну
  від рандомізованої CPS≥1-стратифікації KEYNOTE-826 при цервікальному
  раку. Цей RF авторизовано згідно з наративом хвороби ("метастатична
  — пембролізумаб при PD-L1+") для узгодженості з крос-нозологічними
  конвенціями pembrolizumab-eligibility в цій базі знань, але
  зазначені вище примітки роблять доказове застереження явним для
  клінічного рецензента. STUB до підпису клінічного співкерівника
  (CHARTER §6.1; dev-mode-exempted за CHARTER §8.3 — лише чернетковий
  контент).
