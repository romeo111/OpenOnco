id: RF-WERNER-CONFIRMED-CARRIER
definition: >-
  Confirmed biallelic germline pathogenic / likely-pathogenic variants
  in WRN (RECQL2; Werner syndrome RecQ-like helicase) — Werner Syndrome
  (adult progeria). Patient has had germline WRN testing returned
  positive in both alleles (autosomal-recessive inheritance), or meets
  clinical diagnostic criteria (cardinal features all present:
  bilateral cataracts, sclerodermatous skin changes, characteristic
  facies — bird-like, short stature; plus ≥2 minor signs: gray hair
  / alopecia, type-2 diabetes, hypogonadism, osteoporosis, abnormal
  voice, flat feet — typically manifest in late adolescence / 20s).
  No current personal cancer diagnosis in the carrier being assessed.
  Werner syndrome is a premature-aging segmental progeroid syndrome
  with a distinctive cancer spectrum dominated by soft-tissue sarcoma,
  osteosarcoma, melanoma (acral / mucosal subtypes over-represented),
  meningioma, thyroid follicular / anaplastic carcinoma, and
  hematologic malignancies. Cancer incidence + cardiovascular disease
  + type-2 diabetes account for typical mortality in 4th-5th decade.
  Prevention-persona RedFlag (§20, Wave O confirmed-carrier
  surveillance pathway).
definition_ua: >-
  Підтверджені biallelic гермінативні патогенні / ймовірно-патогенні
  варіанти у WRN (RECQL2) — синдром Вернера (adult progeria). Пацієнт
  пройшов germline WRN-тестування з позитивним результатом в обох
  алелях (autosomal-recessive inheritance), або відповідає клінічним
  діагностичним критеріям (cardinal features всі присутні: bilateral
  cataracts, sclerodermatous skin changes, characteristic facies —
  bird-like, low зріст; плюс ≥2 minor signs: gray hair / alopecia,
  type-2 diabetes, hypogonadism, osteoporosis, abnormal voice, flat
  feet — typically late adolescence / 20s). Поточний особистий діагноз
  раку відсутній. Werner — premature-aging segmental progeroid синдром
  з distinctive cancer spectrum: soft-tissue sarcoma, osteosarcoma,
  melanoma (acral / mucosal subtypes over-represented), meningioma,
  thyroid follicular / anaplastic carcinoma, hematologic malignancies.
  Cancer + cardiovascular disease + type-2 diabetes — типова
  смертність у 4-5 декаді. Prevention-persona RedFlag (§20, Wave O
  шлях спостереження підтверджених носіїв).

