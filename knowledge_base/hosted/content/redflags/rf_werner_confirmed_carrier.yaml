notes: >
  Wave O confirmed-carrier surveillance pathway — Werner Syndrome
  (WRN / RECQL2). Fires on documented germline WRN biallelic pathogenic
  variants OR clinical-diagnostic criteria met. Engine routes to
  PreventionPlan recommending:
    (a) IND-WERNER-CARRIER-SURVEILLANCE (standard) — annual full-body
        skin exam by dermatologist (melanoma — acral / mucosal subtypes
        over-represented; sclerodermatous skin complicates recognition);
        annual thyroid US (follicular / anaplastic enrichment);
        cardiac risk-factor surveillance (premature atherosclerosis is
        a defining Werner feature — annual lipid panel, BP, glycemia,
        echo q3-5y); skeletal pain-driven imaging (low threshold for
        X-ray / MRI on any persistent musculoskeletal pain). Cancer-
        screening colonoscopy + mammography per general-population
        guidelines (no Werner-specific elevation of these cancers).
    (b) IND-WERNER-CARRIER-INTENSIFIED (aggressive) — standard PLUS
        whole-body MRI baseline + q2-3y (full-body screening given
        diverse cancer spectrum) + intensified cardiovascular workup
        (statin + glycemic control for premature atherosclerosis) +
        bone-density q2y monitoring with bisphosphonate consideration
        for premature osteoporosis.

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption. Source-set TODO: International Werner Syndrome Registry
  (Japan); Oshima et al. Mech Ageing Dev 2017 — Wave O authoring
  backlog new SRC entities.

  Lifetime tumor risk in confirmed WRN biallelic carriers (Lauper et
  al. PLoS One 2013; International Werner Registry data):
    - Soft-tissue sarcoma: ~5-10% lifetime (over-represented vs
      general population — pleomorphic / leiomyosarcoma subtypes).
    - Osteosarcoma: ~3-5% lifetime; can occur in adulthood (older
      median age than RTS or LFS osteosarcoma).
    - Melanoma: ~5-10% lifetime; acral lentiginous and mucosal
      subtypes notably enriched — distinct from sun-driven cutaneous
      melanoma pattern.
    - Meningioma: ~5% lifetime; usually adult-onset; some atypical.
    - Thyroid carcinoma: ~10-15% lifetime; follicular > papillary >
      anaplastic; anaplastic over-represented vs general population
      (poor-prognosis variant).
    - Hematologic malignancies (MDS, AML, MPN): ~3-5% lifetime;
      typically adult-onset.
    - Other rare: meningothelial / hepatocellular / pituitary — variable.
    - Non-cancer mortality drivers: premature cardiovascular disease
      (~30-40% of Werner deaths); type-2 diabetes complications
      (~20%); these dominate mortality in younger Werner cohorts and
      surveillance addresses them.

  Therapy implications if cancer arises: WRN-deficient cells show
  variable but generally elevated chemosensitivity (especially to
  DNA-damaging agents — topoisomerase inhibitors, alkylators) but
  the pattern is less stereotyped than RTS / Bloom / Fanconi.
  Premature cardiovascular disease + diabetes complicate dosing of
  cardiotoxic agents (anthracyclines) and steroid-containing
  regimens. These are TREATMENT-time considerations recorded for
  render alerting at moment of new-cancer diagnosis.
