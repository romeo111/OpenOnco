id: RF-WERNER-FAMILY-HISTORY-SUSPICION
definition: >-
  Family or proband pedigree suggestive of Werner syndrome — biallelic
  germline WRN (RECQL2) pathogenic variants OR characteristic adult-
  onset progeroid phenotype (lack of pubertal growth spurt + short
  stature + bird-like facies + premature graying / alopecia in 20s +
  bilateral cataracts in 20s-30s + scleroderma-like skin changes
  predominantly on extremities + soft-tissue calcifications + early-
  onset atherosclerosis + type-2 diabetes mellitus + hypogonadism +
  high-pitched voice). Werner syndrome confers broad cancer-spectrum
  predisposition with characteristic enrichment of mesenchymal /
  unusual neoplasms: soft-tissue sarcomas (especially of distal
  extremities), osteosarcoma, follicular thyroid carcinoma, acral
  lentiginous melanoma, meningioma, plus elevated rates of common
  carcinomas. Median age at first malignancy ~37 years. Prevention-
  persona RedFlag (§20 v0.2-B).
definition_ua: >-
  Сімейний або probandний родовід, підозрілий на Werner syndrome —
  biallelic germline WRN (RECQL2) patogenic variants АБО характерний
  adult-onset progeroid фенотип (відсутність pubertal growth spurt +
  short stature + bird-like facies + premature graying / alopecia
  у 20-х + bilateral cataracts у 20-30-х + scleroderma-like skin
  changes на extremities + soft-tissue calcifications + early-
  onset atherosclerosis + type-2 diabetes mellitus + hypogonadism +
  high-pitched voice). Werner syndrome дає broad cancer-spectrum
  predisposition з характерним збагаченням mesenchymal / необычних
  neoplasms: soft-tissue sarcomas (особливо distal extremities),
  osteosarcoma, follicular thyroid carcinoma, acral lentiginous
  melanoma, meningioma, плюс elevated rates common carcinomas.
  Median age first malignancy ~37 років.

