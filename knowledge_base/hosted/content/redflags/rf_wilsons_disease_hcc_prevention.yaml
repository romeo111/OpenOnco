id: RF-WILSONS-DISEASE-HCC-PREVENTION
definition: >-
  Wilson's disease (autosomal recessive ATP7B-mutated copper-transport
  disorder with hepatic and/or neuropsychiatric manifestations; Leipzig
  score ≥4 confirmatory) in an individual without a current HCC
  diagnosis. Historically considered a low-risk cirrhosis etiology for
  HCC, but contemporary cohorts (van Meer et al. Liver Int 2015;
  Pfeiffenberger et al. J Hepatol 2018) report HCC incidence of
  ~0.5-1%/year in cirrhotic Wilson's — exceeding the AASLD 1.5%/year
  surveillance-threshold in the cirrhotic subset. Risk concentrated
  in patients with established cirrhosis (especially decompensated
  disease) and those with prolonged uncontrolled copper accumulation.
  Adherent copper-chelation therapy (penicillamine, trientine, zinc)
  reduces hepatic copper burden but does not eliminate residual HCC
  risk in patients who already developed cirrhosis. AASLD HCC
  surveillance with US ± AFP q6mo recommended in cirrhotic Wilson's.
  Prevention-persona RedFlag (§20 ratification 2026-05-18, v0.3
  chronic-condition pilot).
definition_ua: >-
  Хвороба Вільсона (аутосомно-рецесивний розлад транспорту міді,
  зумовлений мутацією гена ATP7B, з печінковими та/або
  нейропсихіатричними проявами; Leipzig score ≥4 підтверджує діагноз)
  у пацієнта без поточного діагнозу HCC. Історично розглядалася як
  етіологія цирозу з низьким ризиком HCC, але сучасні когорти (van
  Meer, Liver Int 2015; Pfeiffenberger, J Hepatol 2018) повідомляють
  про захворюваність на HCC ~0.5-1%/рік при цирозі внаслідок хвороби
  Вільсона — це перевищує поріг спостереження AASLD у 1.5%/рік для
  підгрупи з цирозом. Ризик зосереджений у пацієнтів із встановленим
  цирозом (особливо декомпенсованим) та з тривалим неконтрольованим
  накопиченням міді. Прихильне лікування хелаторами міді (пеніциламін,
  трієнтин, цинк) знижує накопичення міді в печінці, але не усуває
  залишковий ризик HCC у пацієнтів, які вже мають цироз. Спостереження
  за HCC за AASLD з УЗД ± AFP кожні 6 місяців рекомендоване при цирозі
  внаслідок хвороби Вільсона. Prevention-persona RedFlag (ратифікація
  §20, 2026-05-18, v0.3 пілот хронічного стану).

trigger:
  type: lab_value
  any_of:
    - finding: "wilson_disease_diagnosis_confirmed"
      value: true
    - finding: "wilson_disease_with_cirrhosis"
      value: true
    - finding: "atp7b_mutation_compound_heterozygous_or_homozygous"
      value: true

clinical_direction: investigate

severity: major
priority: 100
category: other

risk_category: chronic_condition

# Cancer being prevented: hepatocellular carcinoma (HCC) in cirrhotic
# Wilson's. DIS-HCC is the primary anchor.
relevant_diseases:
  - DIS-HCC

shifts_algorithm: []

sources:
  - SRC-AASLD-HCC-2023
  - SRC-NCCN-HCC-2025
  - SRC-NCCN-BCELL-2025

last_reviewed: "2026-05-18"
reviewer_signoffs: 0
notes: >
  v0.3 chronic-condition prevention pilot — Wilson's disease / HCC.
  Prevention-persona RedFlag (CHARTER §3 amended 2026-05-18 Path A,
  HCP-mediated). Fires when patient profile shows confirmed Wilson's
  disease (especially with cirrhosis) AND no confirmed HCC. Engine
  routes to PreventionPlan with 2 tracks: AASLD HCC surveillance with
  US + AFP q6mo if cirrhotic + transplant evaluation for advanced
  disease (IND-WILSONS-DISEASE-HCC-PREVENTION-SURVEILLANCE) as standard;
  hepatology-driven observation without scheduled HCC imaging in
  non-cirrhotic Wilson's (IND-WILSONS-DISEASE-HCC-PREVENTION-
  OBSERVATION) as alternative.

  Evidence base:
    - **HCC risk magnitude:** historically rare (case-report literature
      pre-2000) but contemporary cohorts revise upward — van Meer Liver
      Int 2015 (Dutch cohort, HCC incidence ~1%/year in cirrhotic
      Wilson's); Pfeiffenberger J Hepatol 2018 (German multicenter,
      similar). Non-cirrhotic Wilson's HCC incidence remains very low
      (<0.1%/year).
    - **AASLD 2023 guideline:** HCC surveillance with US ± AFP q6mo
      recommended for any cirrhosis with incidence >1.5%/year. Wilson's
      cirrhosis crosses this threshold in modern series → surveillance
      indicated.
    - **Chelation adherence:** patients with consistent adherence to
      penicillamine, trientine, or zinc maintenance therapy reach
      adequate de-coppering and arrest hepatic injury progression; once
      cirrhosis is established, chelation slows but does not reverse
      the HCC trajectory.
    - **Liver transplantation:** indicated for decompensated cirrhosis
      (Child-Pugh C, MELD ≥15) or acute fulminant Wilson's; HCC within
      Milan criteria is a co-indication. 5y post-transplant OS ~85%.

  Coexisting HBV, HCV, or alcohol use elevates HCC risk further —
  patients with these co-factors should receive standard etiology-
  specific antiviral/abstinence interventions per separate RFs
  (RF-HBV-HCC-PREVENTION, RF-HCV-BCELL-NHL-PREVENTION).

  STUB pending two-Clinical-Co-Lead signoff per CHARTER §6.1 dev-mode
  exemption.
notes_ua: >
  v0.3 пілот профілактики хронічних станів — хвороба Вільсона / HCC.
  Prevention-persona RedFlag (поправка до CHARTER §3, 2026-05-18).
  Спрацьовує, коли профіль пацієнта показує підтверджену хворобу
  Вільсона (особливо з цирозом) і відсутній підтверджений HCC.
  Механізм спрямовує до PreventionPlan за двома треками: спостереження
  за HCC за AASLD з УЗД + AFP кожні 6 місяців за наявності цирозу +
  оцінка трансплантації для поширеного захворювання
  (IND-WILSONS-DISEASE-HCC-PREVENTION-SURVEILLANCE) як стандарт;
  спостереження під керівництвом гепатолога без запланованої
  візуалізації для HCC за відсутності цирозу
  (IND-WILSONS-DISEASE-HCC-PREVENTION-OBSERVATION) як альтернатива.

  Доказова база: захворюваність на HCC ~1%/рік при цирозі внаслідок
  хвороби Вільсона (van Meer, Liver Int 2015; Pfeiffenberger, J Hepatol
  2018) — перевищує поріг спостереження AASLD у 1.5%/рік. Хелаційна
  терапія зупиняє подальше ураження печінки, але не змінює вже
  сформовану траєкторію розвитку HCC при цирозі. Трансплантація печінки
  показана при декомпенсованому цирозі або HCC у межах критеріїв Milan.

  Супутні HBV, HCV або вживання алкоголю додатково підвищують ризик HCC.

  Це STUB, що очікує підпис двох Clinical Co-Lead за винятком dev-mode
  §6.1.
