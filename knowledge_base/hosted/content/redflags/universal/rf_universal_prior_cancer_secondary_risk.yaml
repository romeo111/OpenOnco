id: RF-UNIVERSAL-PRIOR-CANCER-SECONDARY-RISK
definition: >-
  Any prior cancer history (any site, treatment completed, currently
  no evidence of active recurrent disease — survivor cohort).
  Secondary-malignancy risk in cancer survivors is well-characterized
  in two cohorts: (1) Childhood Cancer Survivor Study (CCSS) +
  Children's Oncology Group Long-Term Follow-Up (COG-LTFU)
  Guidelines v5.0 — survivors of pediatric cancers face cumulative
  incidence of second neoplasm reaching 20-25% at 30 years post-
  diagnosis, dominated by therapy-related solid tumors (breast in
  chest-RT survivors, CNS in cranial-RT, thyroid in neck-RT,
  sarcoma and gastrointestinal in TBI / alkylator survivors) and
  therapy-related myeloid neoplasms; (2) NCCN Survivorship 2025
  guidelines for adult-cancer survivors — second-primary-cancer
  risk is elevated 1.5-3× general-population baseline depending on
  treatment exposures (anthracycline + chest-RT for Hodgkin and
  breast survivors carries documented late-onset breast-cancer +
  cardiotoxicity risk; alkylator + TBI exposure carries t-MDS / AML
  risk; cyclophosphamide carries urothelial-bladder-cancer risk).
  Universal RedFlag (relevant_diseases ["*"]) — routes to enrollment
  in a structured survivorship surveillance program (NCCN
  Survivorship + COG-LTFU treatment-summary-driven cadence) covering
  cardiotoxicity, secondary-malignancy screening, late-effects
  endocrine / psychosocial / fertility surveillance. Distinct from
  disease-specific survivorship RFs (some authored — e.g.,
  chest-RT-survivor breast surveillance) — this RF is the upstream
  catchment for the universal "prior cancer" claim.
definition_ua: >-
  Будь-який анамнез онкологічного захворювання в минулому (будь-яка
  локалізація, лікування завершено, наразі немає ознак активного
  рецидивуючого захворювання — когорта тих, хто пережив рак). Ризик
  вторинної злоякісної пухлини в осіб, які пережили рак, добре
  охарактеризований у двох когортах: (1) Childhood Cancer Survivor
  Study (CCSS) + настанови Children's Oncology Group Long-Term
  Follow-Up (COG-LTFU) v5.0 — у тих, хто пережив педіатричний рак,
  кумулятивна частота другого новоутворення сягає 20-25% через 30
  років після встановлення діагнозу, переважно за рахунок пов'язаних
  із лікуванням солідних пухлин (молочна залоза — у тих, хто отримав
  ПТ на грудну клітку, ЦНС — після краніальної ПТ, щитоподібна
  залоза — після ПТ на ділянку шиї, саркома та шлунково-кишкові
  пухлини — після TBI/алкілуючих агентів) та пов'язаних із лікуванням
  мієлоїдних новоутворень; (2) настанови NCCN Survivorship 2025 для
  дорослих, які пережили рак, — ризик другої первинної пухлини
  підвищений у 1.5-3 рази порівняно з популяційним фоновим рівнем
  залежно від отриманого лікування (антрацикліни + ПТ на грудну
  клітку при лімфомі Ходжкіна та раку молочної залози асоціюються з
  документованим пізнім раком молочної залози та кардіотоксичністю;
  алкілуючі агенти + TBI — з ризиком t-MDS/AML; циклофосфамід — з
  ризиком уротеліального раку сечового міхура). Універсальний
  RedFlag (relevant_diseases ["*"]) — спрямовує на включення у
  структуровану програму нагляду за особами, які пережили рак (за
  графіком NCCN Survivorship + COG-LTFU, що ґрунтується на резюме
  лікування), яка охоплює кардіотоксичність, скринінг вторинних
  злоякісних пухлин, нагляд за пізніми ендокринними/психосоціальними
  наслідками та фертильністю. Відрізняється від специфічних для
  захворювання RedFlags нагляду (деякі вже описані — напр., нагляд
  за раком молочної залози у тих, хто переніс ПТ на грудну клітку) —
  цей RedFlag є вихідною точкою для універсальної ознаки «попередній
  рак».

