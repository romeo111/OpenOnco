clinical_claims:
- claim_id: bleomycin-usp-international-unit-convention
  text: Bleomycin unit systems must be identified explicitly. The eviQ equivalence
    is 1.5 USP units = 1500 International Units, so 30 USP units = 30000 International
    Units. US product vials are labelled 15 or 30 units of Bleomycin for Injection
    USP. Do not interpret milligram activity as a general mg-by-weight conversion.
  source_ids:
  - SRC-BLEOMYCIN-US-LABEL
  - SRC-EVIQ-ABVD-56
  scope: Unit nomenclature and equivalence only; not individualized dosing, schedule
    selection, cumulative-risk elimination or whole-record clinical approval.
  source_locator: US label Description/How supplied; eviQ 56 v7 treatment schedule
    and dose-equivalence note.
- claim_id: abvd-growth-factor-not-routine-not-prohibited
  text: Growth-factor support is not routinely required with ABVD. It may be considered
    after treatment delays due to sepsis or other patient factors, with pulmonary
    monitoring. The US bleomycin label reports a possible interaction but states randomized
    clinical studies have not demonstrated increased pulmonary complications.
  source_ids:
  - SRC-EVIQ-ABVD-56
  - SRC-BLEOMYCIN-US-LABEL
  scope: ABVD growth-factor selection and uncertainty of the pulmonary interaction
    only; no universal requirement, contraindication or reassurance of zero risk.
  source_locator: eviQ 56 v7 growth-factor note and haematological toxicity guidance;
    US bleomycin label Pulmonary adverse reactions.
- claim_id: chl-bleomycin-pulmonary-assessment-context
  text: For classical Hodgkin lymphoma, BSH recommends selective baseline PFTs including
    DLCO when a further decline could be clinically important, and no routine repeated
    PFTs. Pre-existing lung disease requires individual risk assessment rather than
    a universal DLCO <40% absolute contraindication. eviQ ABVD 56 instead recommends
    baseline assessment and monitoring as clinically appropriate; its stopping criterion
    is DLCO below 30-35% of the pretreatment value, not a 25% decline and not percent
    predicted. New cough or dyspnoea needs prompt clinical assessment and chest CT
    when toxicity is suspected, considering infection and pulmonary embolism. PFTs
    alone do not establish toxicity. These protocol differences must not be merged
    into a universal numeric rule or permission to continue treatment until a threshold
    is reached.
  source_ids:
  - SRC-BSH-CHL-BLEOMYCIN-2025
  - SRC-EVIQ-ABVD-56
  scope: Classical Hodgkin lymphoma pulmonary assessment only; not germ-cell regimen
    guidance, individualized treatment authorization, or whole-record approval.
  source_locator: BSH Table 1 recommendations 1.2, 2.5-2.6 and 4.2-4.5; eviQ 56 v7
    Clinical information/Pulmonary toxicity and Dose modifications/Pulmonary toxicity.
- claim_id: abvd-bleomycin-cumulative-dose-risk
  text: eviQ ABVD 56 specifies checking cumulative exposure before each treatment,
    increased pulmonary risk above 300000 International Units (300 USP units), and
    a maximum cumulative dose of 400000 International Units (400 USP units). The US
    label warns of increased toxicity above 400 USP units and toxicity at lower doses.
    Neither 300 nor 400 USP units is a dose below which pulmonary toxicity is excluded.
  source_ids:
  - SRC-EVIQ-ABVD-56
  - SRC-BLEOMYCIN-US-LABEL
  scope: Cumulative-risk context and the eviQ ABVD maximum only; not a universal 300-USP-unit
    stopping rule or individualized dose authorization.
  source_locator: eviQ 56 v7 Clinical information/Pulmonary toxicity; US label Warning
    and Dosage and Administration.
- claim_id: abvd-regimen-specific-monitoring
  text: ABVD monitoring uses its own 28-day schedule with administrations on days
    1 and 15. Laboratory, cardiac, pulmonary and neuropathy assessment follow ABVD-specific
    guidance. DLBCL/CD20/anti-CD20 checkpoints, IPI, vincristine and generic R-CHOP
    count-based delays must not be inherited. Clinical review remains necessary; isolated
    blood-count abnormalities do not supply a universal ABVD delay threshold.
  source_ids:
  - SRC-EVIQ-ABVD-56
  - SRC-BSH-CHL-BLEOMYCIN-2025
  scope: ABVD monitoring and regimen identity only; not staging, pediatric protocol
    selection, individualized treatment authorization or whole-record approval.
  source_locator: eviQ 56 v7 schedule/Clinical information/Pre-treatment assessment;
    BSH Table 1 recommendations 2.5-2.6, 3.1 and 4.2-4.5.
