last_reviewed: null
review_status: pending_clinical_signoff
notes: 'Long-standing 1L Hodgkin standard (40+ years). Pulmonary toxicity (BPT) ~5-10%
  — DLCO mandatory pre-treatment + serial. NEVER combine with brentuximab (additive
  lung toxicity). G-CSF avoided on ABVD (increases pulmonary toxicity). Modern alternative
  for advanced Hodgkin: A+AVD (ECHELON-1) — brentuximab replaces bleomycin, superior
  OS in advanced disease.

  '
notes_ua: 'Усталений стандарт першої лінії лімфоми Годжкіна понад 40 років. Легенева
  токсичність (BPT) — ~5-10%; вимірювання DLCO обов''язкове до початку лікування та
  серійно в процесі. Поєднання з брентуксимабом (brentuximab vedotin) категорично
  заборонено через адитивну легеневу токсичність. Г-КСФ протипоказаний при ABVD (підсилює
  BPT). Сучасна альтернатива при поширеній лімфомі Годжкіна — A+AVD (ECHELON-1): брентуксимаб
  замінює блеоміцин, показано перевагу за загальною виживаністю.

  '
