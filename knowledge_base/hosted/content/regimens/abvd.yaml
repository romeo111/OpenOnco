review_status: pending_clinical_signoff
notes: 'Long-standing 1L Hodgkin standard (40+ years). Pulmonary toxicity (BPT) ~5-10%
  — Pulmonary assessment should follow the applicable protocol: eviQ recommends baseline
  testing and subsequent monitoring as clinically appropriate; BSH recommends selective
  baseline PFT/DLCO and no routine repeated PFTs for classical Hodgkin lymphoma. New
  respiratory symptoms require prompt assessment; PFTs alone do not diagnose BPT.
  NEVER combine with brentuximab (additive lung toxicity). Growth-factor support is
  not routinely required; it may be considered after delays due to sepsis or other
  patient factors, with monitoring for pulmonary toxicity. Modern alternative for
  advanced Hodgkin: A+AVD (ECHELON-1) — brentuximab replaces bleomycin, superior OS
  in advanced disease.

  '
notes_ua: 'Усталений стандарт першої лінії лімфоми Годжкіна понад 40 років. Легенева
  токсичність (BPT) — ~5-10%; Оцінку функції легень проводять за застосовним протоколом:
  eviQ рекомендує базове обстеження й подальший моніторинг за клінічними показаннями;
  BSH — вибіркове базове PFT/DLCO без рутинного повторення PFT при класичній лімфомі
  Ходжкіна. Нові респіраторні симптоми потребують швидкої оцінки; лише PFT не встановлює
  діагноз легеневої токсичності. Поєднання з брентуксимабом (brentuximab vedotin)
  категорично заборонено через адитивну легеневу токсичність. Г-КСФ не потрібний рутинно
  при ABVD, але його можуть розглянути після затримок через сепсис або інші клінічні
  чинники; потрібен моніторинг легеневої токсичності. Сучасна альтернатива при поширеній
  лімфомі Годжкіна — A+AVD (ECHELON-1): брентуксимаб замінює блеоміцин, показано перевагу
  за загальною виживаністю.

  '
