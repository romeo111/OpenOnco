id: REG-ABVD
name: ABVD (Adriamycin + Bleomycin + Vinblastine + Dacarbazine), 2-6 cycles
name_ua: ABVD (Доксорубіцин + Блеоміцин + Вінбластин + Дакарбазин), 2-6 циклів
alternate_names:
- ABVD
components:
- drug_id: DRUG-DOXORUBICIN
  dose: 25 mg/m²
  schedule: IV days 1+15 of 28-day cycle
  route: IV
- drug_id: DRUG-BLEOMYCIN
  dose: 10 USP units/m²
  schedule: IV days 1+15 of 28-day cycle
  route: IV
- drug_id: DRUG-VINBLASTINE
  dose: 6 mg/m²
  schedule: IV days 1+15 of 28-day cycle
  route: IV
- drug_id: DRUG-DACARBAZINE
  dose: 375 mg/m²
  schedule: IV days 1+15 of 28-day cycle
  route: IV
cycle_length_days: 28
total_cycles: 2-4 (early-stage + ISRT) OR 6 (advanced); response-adapted per interim
  PET-CT Deauville
toxicity_profile: moderate
premedication:
- Aprepitant + dexamethasone + 5-HT3 antagonist (high emetogenicity from dacarbazine)
- Bleomycin test dose 1-2 USP units before first full dose (anaphylactoid risk)
mandatory_supportive_care:
- SUP-ANTIEMETIC-PREMED
monitoring_schedule_id: MON-ABVD-REGIMEN
dose_adjustments:
- condition: New pulmonary symptoms or clinically significant decline in lung function
    during bleomycin
  modification: Urgent clinical assessment for pulmonary toxicity, infection and pulmonary
    embolism; withhold bleomycin while suspected toxicity is assessed. Stop bleomycin
    if pulmonary toxicity is established. An isolated 25% DLCO decline is not a universal
    permanent-stop rule; use the applicable protocol and specialist assessment.
- condition: Increasing cumulative bleomycin exposure, especially >300 USP units
  modification: Check cumulative exposure before each treatment and reassess pulmonary
    risk. eviQ ABVD 56 identifies increased risk above 300 USP units and specifies
    a maximum of 400 USP units (400000 International Units); 300 USP units is not
    an automatic universal stopping dose. Toxicity can occur at lower doses.
- condition: Cumulative anthracycline >300 mg/m²
  modification: Echo + LVEF check
ukraine_availability:
  all_components_registered: true
  all_components_reimbursed: true
sources:
