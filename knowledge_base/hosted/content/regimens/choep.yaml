clinical_claims:
- claim_id: tcell-regimen-specific-monitoring
  text: CHOEP21 monitoring follows its own 21-day regimen and drug-specific toxicity
    assessment. It must not inherit CD20-positive DLBCL, double-hit, IPI, CNS-IPI
    or anti-CD20-specific checkpoints from R-CHOP. Neuropathy assessment concerns
    vincristine; etoposide administrations occur on days 1-3. Count-based delay and
    growth-factor decisions require CHOEP-specific clinical review.
  source_ids:
  - SRC-EVIQ-CHOEP21-630
  scope: Regimen-specific monitoring only; not whole-record dosing, efficacy, eligibility,
    transplant or clinical approval.
  source_locator: eviQ 630 Treatment schedule, Clinical information, Dose modifications/Haematological
    toxicity and Pre-treatment assessment.
