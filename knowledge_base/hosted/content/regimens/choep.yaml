notes: 'Used for fit younger PTCL NOS / AITL when CD30 negative or brentuximab not
  accessible. CHOEP (with etoposide) showed improvement over CHOP in younger T-cell
  patients per Nordic data. 6 cycles + autoSCT consolidation in fit transplant-eligible
  — practice standard for PTCL/AITL despite limited RCT evidence.

  '
notes_ua: 'Застосовується у молодих пацієнтів у задовільному стані з PTCL NOS / AITL
  при CD30-негативному статусі або відсутності доступу до брентуксимабу. CHOEP (з
  етопозидом) продемонстрував перевагу над CHOP у молодших пацієнтів з Т-клітинними
  захворюваннями за даними скандинавських досліджень. 6 циклів + консолідація аутоТГСК
  у придатних до трансплантації пацієнтів — практичний стандарт для PTCL/AITL, незважаючи
  на обмежену доказову базу РКД.

  '
