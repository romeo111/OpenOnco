clinical_claims:
- claim_id: tcell-regimen-specific-monitoring
  text: BV-CHP monitoring follows its own 21-day regimen and drug-specific toxicity
    assessment. It must not inherit CD20-positive DLBCL, double-hit, IPI, CNS-IPI
    or anti-CD20-specific checkpoints from R-CHOP. Neuropathy assessment concerns
    brentuximab vedotin, not vincristine.
  source_ids:
  - SRC-EVIQ-BV-CHP-4038
  scope: Regimen-specific monitoring only; not whole-record dosing, efficacy, eligibility,
    transplant or clinical approval.
  source_locator: eviQ 4038 Treatment schedule, Clinical information, Dose modifications/Haematological
    toxicity and Pre-treatment assessment.
- claim_id: bv-chp-primary-gcsf-us-label
  text: For adults with previously untreated PTCL receiving ADCETRIS plus CHP, the
    US label specifies primary G-CSF prophylaxis beginning with Cycle 1. eviQ 4038
    instead describes use at clinician discretion and secondary support after ANC-related
    delay. Check applicable product information and local policy; fever or suspected
    infection remains urgent despite prophylaxis.
  source_ids:
  - SRC-ADCETRIS-US-LABEL
  - SRC-EVIQ-BV-CHP-4038
  scope: Primary G-CSF with adult previously untreated PTCL/BV-CHP only; not monotherapy,
    all brentuximab regimens or individualized administration timing.
  source_locator: US ADCETRIS label sections 2.4 and 5.3; eviQ 4038 schedule note,
    growth-factor section and haematological toxicity.
