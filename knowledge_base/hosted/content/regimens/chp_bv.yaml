last_reviewed: null
notes: Neuropathy modifications preserve separate US adult 1.8 mg/kg every-3-week chemotherapy
  and eviQ 4038 v3 rules. They are clinician reference text, not automatic dose decisions or
  baseline eligibility approval; other schedules, monotherapy and pediatric rules are distinct.
  The US label does not require the eviQ recovery delay in the same row. Histology-specific
  benefit, regional approval and the remaining six-cycle schedule require separate review.
notes_ua: Правила нейропатії окремо відображають американську інструкцію для дорослих на 1,8
  мг/кг кожні 3 тижні з хіміотерапією та eviQ 4038 v3. Це довідковий текст для лікаря, а не
  автоматичні рішення щодо дози чи початкової придатності; інші розклади, монотерапія та педіатричні
  правила відрізняються. Американська інструкція не встановлює в цьому рядку відстрочку до відновлення,
  описану eviQ. Користь за підтипом, регіональний дозвіл і наявний шестицикловий розклад потребують
  окремого перегляду.
