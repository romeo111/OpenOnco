id: REG-CHP-BV
name: Brentuximab vedotin + CHP (CHP-Bv), 6 cycles (CD30+ T-cell lymphomas)
name_ua: Брентуксимаб ведотин + CHP (CHP-Bv), 6 циклів (CD30+ T-клітинні лімфоми)
alternate_names:
- A+CHP
- Bv-CHP
- ECHELON-2
components:
- drug_id: DRUG-BRENTUXIMAB-VEDOTIN
  dose: 1.8 mg/kg
  schedule: IV day 1 each 21-day cycle × 6
  route: IV
- drug_id: DRUG-CYCLOPHOSPHAMIDE
  dose: 750 mg/m²
  schedule: IV day 1 each cycle
  route: IV
- drug_id: DRUG-DOXORUBICIN
  dose: 50 mg/m²
  schedule: IV day 1 each cycle
  route: IV
- drug_id: DRUG-PREDNISONE
  dose: 100 mg
  schedule: PO days 1-5 each cycle
  route: PO
cycle_length_days: 21
total_cycles: '6'
toxicity_profile: moderate-high
premedication:
- Antihistamine + acetaminophen before brentuximab
- Antiemetic premedications (dexamethasone + 5-HT3 antagonist)
mandatory_supportive_care:
- SUP-PJP-PROPHYLAXIS
- SUP-ANTIEMETIC-PREMED
- SUP-GCSF-NEUTROPENIA
monitoring_schedule_id: MON-CHP-BV-REGIMEN
dose_adjustments:
- condition: 'US label adult 1.8 mg/kg every 3 weeks with chemotherapy: grade 2 sensory neuropathy'
  modification: Same-dose treatment per Table 2; clinician assessment remains required.
  source_refs:
  - SRC-ADCETRIS-US-LABEL
- condition: 'US label adult 1.8 mg/kg every 3 weeks with chemotherapy: grade 2 motor neuropathy'
  modification: Reduce brentuximab vedotin to 1.2 mg/kg, maximum 120 mg, every 3 weeks.
  source_refs:
  - SRC-ADCETRIS-US-LABEL
- condition: 'US label adult 1.8 mg/kg every 3 weeks with chemotherapy: grade 3 sensory neuropathy'
  modification: Reduce brentuximab vedotin to 1.2 mg/kg, maximum 120 mg, every 3 weeks.
  source_refs:
  - SRC-ADCETRIS-US-LABEL
- condition: 'US label adult 1.8 mg/kg every 3 weeks with chemotherapy: grade 3 motor neuropathy
    or grade 4 neuropathy'
  modification: Discontinue brentuximab vedotin.
  source_refs:
  - SRC-ADCETRIS-US-LABEL
- condition: 'eviQ 4038 v3: grade 2 motor or grade 3 sensory neuropathy'
  modification: Delay until grade 1 or baseline, then reduce brentuximab vedotin to 1.2 mg/kg
    every 3 weeks, maximum 120 mg, for subsequent cycles.
  source_refs:
  - SRC-EVIQ-BV-CHP-4038
- condition: 'eviQ 4038 v3: grade 3 or greater motor or grade 4 sensory neuropathy'
  modification: Omit brentuximab vedotin.
  source_refs:
  - SRC-EVIQ-BV-CHP-4038
- condition: Cumulative anthracycline >450-500 mg/m²
  modification: Echo + LVEF check before next dose
ukraine_availability:
  all_components_registered: true
  all_components_reimbursed: false
  notes: Brentuximab not НСЗУ-reimbursed; CHOEP fallback (etoposide replaces brentuximab) when
    not accessible
sources:
- SRC-NCCN-BCELL-2025
- SRC-ADCETRIS-US-LABEL
- SRC-EVIQ-BV-CHP-4038
- SRC-EVIQ-BV-CHP-PATIENT-4038
