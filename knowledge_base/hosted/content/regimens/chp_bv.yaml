last_reviewed: null
notes: 'ECHELON-2 trial (Horwitz 2019): CHP-Bv superior to CHOP for CD30+ systemic
  ALCL + CD30+ PTCL/AITL — improved PFS + OS (~85% 3y PFS for ALCL ALK-). Vincristine
  REPLACED by brentuximab (avoiding additive MMAE neuropathy stack). Patients must
  be CD30+ ≥10% by IHC. ALCL is universally CD30+ → CHP-Bv preferred. PTCL NOS / AITL
  ~40-60% CD30+ → CHP-Bv if expression confirmed; else CHOEP.

  '
notes_ua: 'Дослідження ECHELON-2 (Horwitz 2019): CHP-Bv перевершує CHOP при CD30+
  системній АЛКЛ та CD30+ PTCL/AITL — покращені ВБП та загальна виживаність (~85%
  3-річна ВБП при ALK-негативній АЛКЛ). Вінкристин (vincristine) замінено на брентуксимаб
  (brentuximab vedotin) — уникається кумулятивна MMAE-нейропатія. Умова застосування:
  CD30+ ≥10% за IHC. АЛКЛ є CD30+ у 100% випадків — CHP-Bv є переважним. При PTCL
  NOS / AITL ~40-60% CD30+ — CHP-Bv за підтвердженої експресії; за її відсутності
  — CHOEP.

  '
