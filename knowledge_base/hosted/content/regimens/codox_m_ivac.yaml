id: REG-CODOX-M-IVAC
name: 'Dose-modified R-CODOX-M / R-IVAC: high-risk reference without proven CNS disease (eviQ 4489/4490)'
name_ua: 'Модифікований R-CODOX-M / R-IVAC: довідковий протокол високого ризику без доведеного ураження
  ЦНС (eviQ 4489/4490)'
alternate_names:
- dm R-CODOX-M / R-IVAC (eviQ reference)
components: []
phases:
- name: alternating_block_a
  purpose_ua: Довідковий блок CODOX-M для лімфоми Беркіта високого ризику без доведеного ураження ЦНС;
    цикли 1 і 3. Придатність має перевірити спеціаліст.
  purpose_en: Reference CODOX-M block for high-risk Burkitt without proven CNS disease; cycles 1 and 3.
    Requires specialist verification of applicability.
  duration: Cycles 1 and 3; minimum 21 days between blocks and recovery required
  timing_relative_to: absolute
  optional: false
  components:
  - drug_id: DRUG-RITUXIMAB
    dose: 375 mg/m²
    schedule: IV days 1 and 9 of CODOX-M blocks only
    route: IV
  - drug_id: DRUG-DOXORUBICIN
    dose: 40 mg/m²
    schedule: IV day 1 of CODOX-M blocks only
    route: IV
  - drug_id: DRUG-VINCRISTINE
    dose: 1.5 mg/m² (maximum 2 mg)
    schedule: IV days 1 and 8 of CODOX-M blocks only; NEVER intrathecal
    route: IV
  - drug_id: DRUG-CYCLOPHOSPHAMIDE
    dose: 800 mg/m²
    schedule: IV day 1 of CODOX-M blocks only
    route: IV
  - drug_id: DRUG-CYCLOPHOSPHAMIDE
    dose: 200 mg/m² per day
    schedule: IV days 2-5 of CODOX-M blocks only
    route: IV
  - drug_id: DRUG-CYTARABINE
    dose: 70 mg per dose
    schedule: Intrathecal days 1 and 3 of CODOX-M blocks only, under separate local intrathecal procedure
    route: IT
  - drug_id: DRUG-METHOTREXATE
    dose: 300 mg/m² followed by 2700 mg/m²
    schedule: 'IV day 10: first portion over 1 hour, then second portion over 23 hours; record infusion
      START for rescue clock'
    route: IV
  - drug_id: DRUG-LEUCOVORIN
    dose: 15 mg/m² per dose
    schedule: IV rescue starts 36 hours after IV methotrexate START; every 3 hours during hours 36-48,
      then every 6 hours until methotrexate <0.1 micromol/L; adjust for delayed clearance per protocol
    route: IV
  - drug_id: DRUG-FILGRASTIM
    dose: 5 micrograms/kg per day
    schedule: SC from day 13 of CODOX-M blocks until neutrophil recovery
    route: SC
  - drug_id: DRUG-METHOTREXATE
    dose: 12 mg
    schedule: Intrathecal day 15 of CODOX-M blocks only; clinician may change IT day under local protocol
    route: IT
  - drug_id: DRUG-LEUCOVORIN
    dose: 15 mg once
    schedule: PO 24 hours after INTRATHECAL methotrexate; separate from IV rescue clock
    route: PO
  sources:
  - SRC-EVIQ-BURKITT-CODOX-4489
- name: alternating_block_b
  purpose_ua: Довідковий блок IVAC для лімфоми Беркіта високого ризику без доведеного ураження ЦНС; цикли
    2 і 4. Іфосфамід потребує месни та гідратації.
  purpose_en: Reference IVAC block for high-risk Burkitt without proven CNS disease; cycles 2 and 4. Mesna
    and hydration are required with ifosfamide.
  duration: Cycles 2 and 4; minimum 21 days between blocks and recovery required
  timing_relative_to: previous_phase_completion
  optional: false
  components:
  - drug_id: DRUG-CYTARABINE
    dose: 2000 mg/m² per dose
    schedule: IV over 3 hours, twice daily 12 hours apart on days 1 and 2 of IVAC blocks (four doses)
    route: IV
  - drug_id: DRUG-ETOPOSIDE
    dose: 60 mg/m² per day
    schedule: IV days 1-5 of IVAC blocks only
    route: IV
  - drug_id: DRUG-MESNA
    dose: 360 mg/m²
    schedule: IV loading dose day 1, 60 minutes before first ifosfamide; reference schedule, institutional
      protocols may differ
    route: IV
  - drug_id: DRUG-IFOSFAMIDE
    dose: 1500 mg/m² per day
    schedule: IV over 2 hours on days 1-5 of IVAC blocks only, with mesna and hydration
    route: IV
  - drug_id: DRUG-MESNA
    dose: 1500 mg/m² per day
    schedule: IV over 24 hours on days 1-5 of IVAC blocks; reference schedule, verify continued uroprotection
      under institutional protocol
    route: IV
  - drug_id: DRUG-RITUXIMAB
    dose: 375 mg/m²
    schedule: IV days 3 and 7 of IVAC blocks only
    route: IV
  - drug_id: DRUG-METHOTREXATE
    dose: 12 mg
    schedule: Intrathecal day 5 of IVAC blocks only; clinician may change IT day under local protocol
    route: IT
  - drug_id: DRUG-LEUCOVORIN
    dose: 15 mg once
    schedule: PO 24 hours after INTRATHECAL methotrexate (reference day 6); not the CODOX-M IV rescue
      schedule
    route: PO
  - drug_id: DRUG-FILGRASTIM
    dose: 5 micrograms/kg per day
    schedule: SC from day 7 of IVAC blocks until neutrophil recovery
    route: SC
  sources:
  - SRC-EVIQ-BURKITT-IVAC-4490
cycle_length_days: 21
total_cycles: 'Reference high-risk/no-proven-CNS course: CODOX-M, IVAC, CODOX-M, IVAC; recovery and specialist
  protocol review before each block. Low-risk and proven-CNS schedules are separate.'
toxicity_profile: very-high
premedication:
- Verify local rituximab premedication, antiemetics and tumour-lysis prevention.
- Before HD-MTX, confirm hydration, alkalinization, urine pH >7 and the protocol-specific folinate rescue
  clock.
- IVAC requires mesna/uroprotection and hydration; neurological assessment before ifosfamide and cerebellar
  assessment before cytarabine.
mandatory_supportive_care:
- SUP-PJP-PROPHYLAXIS
- SUP-TLS-PROPHYLAXIS
- SUP-ANTIEMETIC-PREMED
- SUP-GCSF-NEUTROPENIA
monitoring_schedule_id: MON-CODOX-IVAC-REGIMEN
dose_adjustments:
- condition: Low-risk disease, proven CNS involvement, uncertain risk or missing clinical context
  modification: Do not treat this high-risk/no-proven-CNS reference as an applicable individualized prescription.
    Use the separate disease-risk/CNS protocol after specialist review; current track selection remains
    unaudited.
- condition: Older age, frailty, organ dysfunction or toxicity
  modification: Review the selected protocol dose modifications, including methotrexate, cytarabine, ifosfamide
    and mesna. No automatic switch to DA-EPOCH-R based on age alone and no universal CrCl dose recipe.
- condition: Third-space fluid, interacting medications or impaired/delayed methotrexate clearance
  modification: Assess third-space fluid, kidney function and drug interactions before HD-MTX. Delayed
    clearance or acute kidney injury requires urgent specialist management and protocol-specific rescue;
    do not apply one fixed folinate schedule regardless of clearance.
