notes: Scoped reference schedule repair based on eviQ 4489 v1 and 4490 v2, for high-risk Burkitt WITHOUT
  proven CNS disease. This is not original Magrath or LMB and not a universal Burkitt/CNS prescription.
  The indication now requires explicit high-risk and CNS-negative confirmation. Risk classification, broader
  eligibility, ranking and other protocol variants still require separate audits. Age, fitness, efficacy,
  availability and patient watchpoints are not validated by this repair. Mesna schedules may vary by institution.
  Intrathecal procedures must remain separate from IV drug administration; vincristine must NEVER be administered
  intrathecally.
notes_ua: Довідковий розклад виправлено за eviQ 4489 v1 та 4490 v2 для лімфоми Беркіта високого ризику
  БЕЗ доведеного ураження ЦНС. Це не оригінальний Magrath чи LMB і не універсальний протокол для Беркіта/ЦНС.
  Показання тепер вимагає явного підтвердження високого ризику та ЦНС-негативного стану. Класифікація
  ризику, повна придатність, вибір і решта варіантів протоколу потребують окремих аудитів. Вік, придатність,
  ефективність, доступність і пацієнтські симптоми цим виправленням не перевірені. Розклади месни можуть
  відрізнятися між закладами. Інтратекальні процедури проводять окремо від внутрішньовенних введень; вінкристин
  НІКОЛИ не вводять інтратекально.
