id: REG-DA-EPOCH-R
name: Dose-adjusted EPOCH + rituximab (DA-EPOCH-R)
name_ua: EPOCH із коригуванням доз + ритуксимаб (DA-EPOCH-R)
alternate_names:
- DA-EPOCH-R
- Wilson protocol
components:
- drug_id: DRUG-RITUXIMAB
  dose: 375 mg/m²
  schedule: IV day 1 each cycle
  route: IV
- drug_id: DRUG-ETOPOSIDE
  dose: 50 mg/m²/day
  schedule: Continuous IV days 1-4 (96h infusion); dose adjust per ANC nadir prior
    cycle
  route: IV
- drug_id: DRUG-DOXORUBICIN
  dose: 10 mg/m²/day
  schedule: Continuous IV days 1-4 (96h infusion); dose adjust
  route: IV
- drug_id: DRUG-VINCRISTINE
  dose: 0.4 mg/m²/day (no cap)
  schedule: Continuous IV days 1-4 (96h infusion)
  route: IV
- drug_id: DRUG-CYCLOPHOSPHAMIDE
  dose: 750 mg/m² at starting dose level 1; subsequent levels per protocol
  schedule: IV day 5
  route: IV
- drug_id: DRUG-PREDNISONE
  dose: 60 mg/m² BID
  schedule: PO days 1-5
  route: PO
cycle_length_days: 21
total_cycles: 'Disease- and response-specific protocol: eviQ DA-R-EPOCH uses 6-8 cycles;
  risk-adapted Burkitt schedules require a separate protocol, not an automatic universal
  six-cycle course.'
toxicity_profile: high
premedication:
- Standard rituximab premedications first dose
- Aggressive TLS prophylaxis (allopurinol/rasburicase + IV hydration) cycle 1
- Antiemetic regimen + steroids
mandatory_supportive_care:
- SUP-PJP-PROPHYLAXIS
- SUP-TLS-PROPHYLAXIS
- SUP-ANTIEMETIC-PREMED
- SUP-GCSF-NEUTROPENIA
monitoring_schedule_id: MON-DA-EPOCH-R-REGIMEN
dose_adjustments:
- condition: 'Complete scheduled twice-weekly CBC series: ANC ≥0.5 × 10^9/L on all
    measurements, with platelet nadir ≥25 × 10^9/L'
  modification: 'eviQ reference paradigm: increase one dose level above the previous
    cycle after clinical review. Use the applicable dose-level table; above starting
    level 1, adjustments apply to etoposide, doxorubicin and cyclophosphamide. Do
    not calculate an individualized dose from this text.'
  source_refs:
  - SRC-EVIQ-DA-R-EPOCH-783
- condition: 'Complete scheduled twice-weekly CBC series: ANC <0.5 × 10^9/L on one
    or two measurements, with platelet nadir ≥25 × 10^9/L'
  modification: 'eviQ reference paradigm: retain the previous dose level, subject
    to other toxicity and clinical assessment. A single low ANC does not automatically
    require a dose-level reduction.'
  source_refs:
  - SRC-EVIQ-DA-R-EPOCH-783
- condition: 'Complete scheduled twice-weekly CBC series: ANC <0.5 × 10^9/L on three
    or more measurements, or platelet nadir <25 × 10^9/L'
  modification: 'eviQ reference paradigm: reduce one dose level below the previous
    cycle after clinical review. Above starting level 1, use the protocol table for
    etoposide, doxorubicin and cyclophosphamide; below starting level 1, only cyclophosphamide
    is adjusted by this nadir paradigm.'
  source_refs:
  - SRC-EVIQ-DA-R-EPOCH-783
- condition: Incomplete nadir monitoring or missing previous dose level
  modification: Obtain and review the scheduled CBC results and prior dose-level record
    before choosing the next level. Extra CBCs obtained for clinical care do not replace
    the scheduled twice-weekly measurements used by the protocol.
  source_refs:
  - SRC-EVIQ-DA-R-EPOCH-783
- condition: Growth-factor support during DA-EPOCH-R
  modification: eviQ schedules filgrastim from day 6 until neutrophil recovery. This
    support is not restricted to HIV-positive patients; use the applicable protocol
    and clinical review for administration.
  source_refs:
  - SRC-EVIQ-DA-R-EPOCH-783
- condition: CNS involvement or a disease-specific CNS prophylaxis requirement
  modification: Specialist disease-specific protocol assessment is required. DA-R-EPOCH
    has limited CNS penetration; this record does not prescribe a universal intercalated
    HD-MTX schedule or a fixed number of intrathecal doses.
  source_refs:
  - SRC-EVIQ-DA-R-EPOCH-783
