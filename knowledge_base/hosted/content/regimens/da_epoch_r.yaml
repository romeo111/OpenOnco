clinical_claims:
- claim_id: epoch-scheduled-nadir-dose-level-paradigm
  text: eviQ bases nadir dose-level adjustment on scheduled twice-weekly CBCs three days apart. ANC at
    least 0.5 × 10^9/L on every scheduled measurement supports increasing one level; one or two measurements
    below 0.5 supports retaining the level; three or more supports lowering one level. A platelet nadir
    below 25 × 10^9/L also supports lowering one level. Above starting level 1, adjustments involve etoposide,
    doxorubicin and cyclophosphamide; below level 1, only cyclophosphamide changes by this paradigm. Missing
    monitoring does not authorize automatic escalation.
  source_ids:
  - SRC-EVIQ-DA-R-EPOCH-783
  scope: eviQ reference nadir paradigm only; not individualized dose calculation, other toxicity modifications
    or clinical approval.
  source_locator: 'eviQ 783 Dose modifications: Dose adjustment paradigm and ANC/platelet nadir table.'
- claim_id: epoch-growth-factor-and-protocol-context
  text: eviQ DA-R-EPOCH schedules filgrastim from day 6 until neutrophil recovery, without an HIV-only
    restriction. Treatment timing, cycle number and CNS-directed therapy depend on the applicable disease-specific
    protocol; a universal six-cycle Burkitt course or fixed intercalated methotrexate recipe is not established
    by this shared regimen.
  source_ids:
  - SRC-EVIQ-DA-R-EPOCH-783
  scope: Supportive care and protocol context only; no universal individual treatment or CNS dosing instruction.
  source_locator: eviQ 783 Treatment schedule, Blood tests, and Evidence/Burkitt/CNS considerations.
