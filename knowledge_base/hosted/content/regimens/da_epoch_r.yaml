notes: Dose-level selection requires a complete prior-cycle CBC series obtained twice weekly, three days
  apart, and the previous dose level. It is not an automatic response to one low ANC. Platelet nadir and
  other toxicity matter. Growth-factor support and continuous-infusion monitoring are integral to the
  reference regimen. Burkitt risk-adapted cycle counts and CNS-directed therapy are separate protocol
  decisions; the shared record does not establish individualized eligibility, dose or efficacy.
notes_ua: Вибір рівня дози потребує повної серії загальних аналізів крові попереднього циклу двічі на
  тиждень із проміжком три дні та відомого попереднього рівня дози. Один низький ANC не означає автоматичного
  зниження. Враховуйте надир тромбоцитів та іншу токсичність. Підтримка факторами росту й моніторинг безперервної
  інфузії входять до референтної схеми. Кількість циклів при лімфомі Беркіта з адаптацією за ризиком і
  лікування ЦНС визначаються окремими протоколами; спільний запис не встановлює індивідуальної придатності,
  дози чи ефективності.
