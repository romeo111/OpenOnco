id: REG-MCL-INTENSIVE-RDHAP-AUTOSCT
name: 'MCL: alternating R-CHOP/R-DHAP induction followed by an ASCT pathway (MCL Younger-based)'
name_ua: 'MCL: чергування R-CHOP/R-DHAP із подальшою аутоТГСК (за MCL Younger)'
alternate_names:
- MCL Younger
- R-DHAP/R-CHOP alternating
components: []
phases:
- name: induction
  purpose_ua: 'індукція: 6 чергуючих циклів R-CHOP та R-DHAP (3 + 3); анти-CD20 з
    anthracycline-вмісним та HiDAC-вмісним блоками для максимальної ремісії перед
    autoSCT'
  purpose_en: 'induction: 6 alternating cycles R-CHOP and R-DHAP (3 + 3); anti-CD20
    with anthracycline-containing and HiDAC-containing blocks for maximum remission
    before autoSCT'
  duration: ~18 weeks (6 × 21-day cycles)
  timing_relative_to: absolute
  optional: false
  components:
  - drug_id: DRUG-RITUXIMAB
    dose: 375 mg/m²
    schedule: IV day 1 each cycle (R-CHOP + R-DHAP)
    route: IV
  - drug_id: DRUG-CYCLOPHOSPHAMIDE
    dose: 750 mg/m²
    schedule: IV day 1 of R-CHOP cycles only
    route: IV
  - drug_id: DRUG-DOXORUBICIN
    dose: 50 mg/m²
    schedule: IV day 1 of R-CHOP cycles only
    route: IV
  - drug_id: DRUG-VINCRISTINE
    dose: 1.4 mg/m² (cap 2 mg)
    schedule: IV day 1 of R-CHOP cycles only
    route: IV
  - drug_id: DRUG-PREDNISONE
    dose: 100 mg
    schedule: PO days 1-5 of R-CHOP cycles
    route: PO
  - drug_id: DRUG-DEXAMETHASONE
    dose: 40 mg
    schedule: IV days 1-4 of R-DHAP cycles only
    route: IV
  - drug_id: DRUG-CYTARABINE
    dose: 2 g/m² per dose
    schedule: IV over 3 hours, two doses 12 hours apart on day 2 of R-DHAP cycles
      only (cycles 2, 4, 6)
    route: IV
  - drug_id: DRUG-CISPLATIN
    dose: 100 mg/m²
    schedule: IV infusion over 24 hours on day 1 of R-DHAP cycles only (cycles 2,
      4, 6)
    route: IV
  sources:
  - SRC-NCCN-BCELL-2025
  - SRC-EVIQ-MCL-RDHAP-1884
  - SRC-EVIQ-MCL-RCHOP-1883
  - SRC-EVIQ-MCL-ALTERNATING-1855
- name: consolidation_autosct
  purpose_ua: Шлях до аутоТГСК після відповіді на індукцію; кондиціонування потрібно
    визначити в окремому трансплантаційному протоколі
  purpose_en: ASCT pathway after induction response; conditioning must be specified
    in a separate transplant protocol
  duration: single transplant procedure
  timing_relative_to: previous_phase_completion
  optional: false
  components: []
  sources:
  - SRC-NCCN-BCELL-2025
  - SRC-EVIQ-MCL-ALTERNATING-1855
cycle_length_days: 21
total_cycles: 6 alternating induction cycles (3 R-CHOP + 3 R-DHAP); ASCT conditioning
  and any maintenance require a separate protocol
toxicity_profile: high
premedication:
- Standard R-CHOP premedications + cytarabine eye drops + cerebellar exam pre each
  HiDAC
mandatory_supportive_care:
- SUP-PJP-PROPHYLAXIS
- SUP-TLS-PROPHYLAXIS
- SUP-ANTIEMETIC-PREMED
monitoring_schedule_id: MON-MCL-RCHOP-RDHAP-INDUCTION
dose_adjustments:
- condition: Age >65 OR ECOG ≥2 at start
  modification: Generally NOT eligible — route to BTKi-based (REG-ACALABRUTINIB-RITUXIMAB)
  rationale: Tolerability of HiDAC drops sharply with age/frailty
  source_refs:
  - SRC-NCCN-BCELL-2025
- condition: Renal impairment or unreliable estimated kidney function before an R-DHAP
    block
  modification: Specialist assessment of both cisplatin and high-dose cytarabine is
    required. eviQ prefers measured GFR for initial cisplatin dosing when eGFR <60
    mL/min/1.73 m², especially above 50 mg/m² or when estimates are unreliable. Kidney
    dysfunction also increases cytarabine neurotoxicity risk; use the applicable protocol
    rather than a universal cytarabine-only reduction rule.
  source_refs:
  - SRC-EVIQ-MCL-RDHAP-1884
