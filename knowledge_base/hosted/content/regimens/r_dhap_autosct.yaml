last_reviewed: null
notes: 'MCL Younger-based alternating induction: R-CHOP cycles 1, 3, 5 and R-DHAP
  cycles 2, 4, 6. Cisplatin is an essential R-DHAP component and was missing from
  the prior data. This is not the Nordic MCL2 maxi-CHOP/high-dose cytarabine regimen
  or a LyMA-style induction. Transplant conditioning and subsequent maintenance are
  not specified here; alternative conditioning must not inherit trial outcomes automatically.
  This record does not establish current first-line preference or individualized eligibility.'
notes_ua: 'Індукція за MCL Younger: R-CHOP у циклах 1, 3, 5 і R-DHAP у циклах 2, 4,
  6. Цисплатин є складовою R-DHAP; раніше він був відсутній у даних. Це не схема Nordic
  MCL2 із maxi-CHOP/високодозовим цитарабіном і не індукція за LyMA. Кондиціонування
  перед трансплантацією й подальшу підтримку тут не визначено; інше кондиціонування
  не дозволяє автоматично переносити результати дослідження. Запис не встановлює сучасної
  переваги першої лінії чи індивідуальної придатності.'
