clinical_claims:
- claim_id: mcl-rdhap-cisplatin-and-cytarabine-schedule
  text: In eviQ MCL R-DHAP, cisplatin is 100 mg/m² by IV infusion over 24 hours on
    day 1; cytarabine is 2 g/m² per dose by IV infusion over 3 hours twice on day
    2, 12 hours apart. R-DHAP occupies cycles 2, 4 and 6, alternating with R-CHOP
    cycles 1, 3 and 5 at 21-day intervals. These are reference-protocol doses, not
    individualized dosing permission.
  source_ids:
  - SRC-EVIQ-MCL-RDHAP-1884
  - SRC-EVIQ-MCL-RCHOP-1883
  scope: Induction component identity and timing only; not renal dose selection, current
    treatment preference or whole-record approval.
  source_locator: eviQ 1884 v6 and 1883 v6 treatment schedules.
- claim_id: mcl-alternating-protocol-identity
  text: The alternating R-CHOP/R-DHAP induction is distinct from Nordic MCL2 and LyMA
    induction. MCL Younger used a specific conditioning regimen; substituting BEAM
    or another conditioning regimen introduces uncertainty and does not authorize
    automatic transfer of trial outcomes.
  source_ids:
  - SRC-EVIQ-MCL-ALTERNATING-1855
  scope: Protocol identity and conditioning uncertainty only; not transplant prescription,
    maintenance schedule or efficacy estimate.
  source_locator: 'eviQ 1855 v3 Evidence: Nordic MCL2, LyMA and MCL Younger conditioning
    caveat.'
