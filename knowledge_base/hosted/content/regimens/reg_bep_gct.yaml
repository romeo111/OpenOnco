notes_ua: >
  BEP (блеоміцин + етопозид + цисплатин): стандартна 1L хіміотерапія
  пухлин зародкових клітин (ПЗК) яєчка. Блеоміцин (bleomycin) 30 ОД
  в/в дні 2, 9, 16; етопозид (etoposide) 100 мг/м²/добу дні 1-5;
  цисплатин (cisplatin) 20 мг/м²/добу дні 1-5 q21d. Хороший ризик
  (IGCCC): 3 цикли; проміжний/поганий ризик: 4 цикли. Первинна профілактика
  G-КСФ не є обов'язковою для всіх; її обирають за індивідуальним ризиком
  та потребою підтримати дозову інтенсивність за протоколом закладу. Кумулятивна доза
  блеоміцину не повинна перевищувати 360-400 ОД (незворотній легеневий
  фіброз). Після блеоміцину повідомте анестезіологу про легеневий ризик.
  Киснева терапія потребує індивідуальної оцінки та достатньої оксигенації;
  універсальної заборони FiO2 понад 30% цей запис не встановлює. Контроль симптомів у кожному циклі; новий кашель або задишка потребують
  оцінки фахівця та HRCT за підозри токсичності. PFT/DLCO є допоміжними;
  лише за зниженням DLCO автоматично не переходять на EP. Аудіограма до і після BEP.
