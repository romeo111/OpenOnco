clinical_claims:
- claim_id: bleomycin-perioperative-oxygen
  text: Bleomycin exposure warrants perioperative pulmonary-risk assessment. Label
    precautions favor lower oxygen concentrations, but observational evidence does
    not establish a universal FiO2 ceiling. Anesthesia should balance pulmonary risk
    with adequate oxygenation; a fixed limit must not cause inadequate oxygenation.
  source_ids:
  - SRC-BLEOMYCIN-US-LABEL
  - SRC-AAKRE-BLEOMYCIN-PERIOPERATIVE-2014
  - SRC-BLEOMYCIN-OXYGEN-MONITORING-1984
  scope: Perioperative oxygen management after bleomycin only; no verification of
    other BEP dosing or supportive-care statements.
  source_locator: Bleomycin label pulmonary adverse reactions; Aakre 2014 Results/Discussion;
    PMID 6200191 abstract.

- claim_id: bep-individualized-gcsf
  text: Primary G-CSF prophylaxis is not universally required for metastatic testicular
    BEP; clinicians may choose it to maintain dose intensity. Supportive therapy follows
    individual assessment and institutional protocol.
  source_ids:
  - SRC-EVIQ-TESTICULAR-BEP-320
  scope: G-CSF supportive-care selection only; no approval of anticancer dosing, renal
    adjustments or treatment eligibility.
  source_locator: eviQ 320 v9 treatment schedule footnote ** and supportive therapy
    defaults paragraph.
- claim_id: bleomycin-pulmonary-assessment
  text: New cough or dyspnea during bleomycin treatment requires assessment for pulmonary
    toxicity; HRCT is preferred when toxicity is suspected. PFT/DLCO is adjunctive,
    is not a sole automatic stop rule and does not guarantee prevention of pulmonary
    toxicity.
  source_ids:
  - SRC-BLEOMYCIN-UK-BEST-PRACTICE-2018
  scope: Pulmonary symptom assessment and role of PFT/DLCO only; no blanket validation
    of other BEP claims.
  source_locator: 'British Journal of Cancer best-practice guideline: role of PFTs
    and symptom monitoring sections.'
