id: REG-CABERGOLINE-PROLACTINOMA
name: "Cabergoline for prolactinoma (dopamine agonist, first-line)"
name_ua: "Каберголін для пролактиноми (агоніст дофаміну, перша лінія)"
alternate_names:
  - "DA agonist for prolactinoma"
  - "Cabergoline monotherapy"

components:
  - drug_id: DRUG-CABERGOLINE
    dose: "0.25 mg PO twice weekly starting dose (or 0.5 mg PO once weekly)"
    schedule: "Twice weekly; titrate by 0.25-0.5 mg/week increments no more often than every 4 weeks per serum prolactin, to a typical maintenance dose of 0.5-2 mg/week (occasionally higher for resistant macroprolactinoma)"
    route: PO

cycle_length_days:
total_cycles: "Continuous; reassess for dose taper/discontinuation trial after a sustained period (commonly cited as ≥2 years) of biochemical remission and significant tumor shrinkage, per treating endocrinologist"
toxicity_profile: low

premedication: []
mandatory_supportive_care: []
monitoring_schedule_id:

dose_adjustments:
  - condition: "Prolactin not normalized / tumor not shrinking on maximal tolerated dose"
    modification: "Consider dose escalation to maximum tolerated dose before declaring resistance; if truly DA-resistant or intolerant, refer for transsphenoidal surgical evaluation"
    rationale: "Per Disease narrative: surgery reserved for dopamine-agonist-resistant or -intolerant prolactinoma"
    source_refs:
      - SRC-NCCN-CNS-2025

ukraine_availability:
  all_components_registered: true
  all_components_reimbursed: false
  notes: >
    Каберголін (Dostinex) зареєстрований в Україні; НСЗУ-реімбурсація для
    пролактиноми не включена до онкопакету 2025 — переважно out-of-pocket.

sources:
  - SRC-NCCN-CNS-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1). Cabergoline is
  first-line for prolactinoma per the Disease narrative (preferred over
  bromocriptine). Bromocriptine regimen not separately authored in this
  pass — see DIS-PITUITARY-ADENOMA proposal notes.
notes_ua: >
  ЗАГЛУШКА (STUB) до підпису клінічного співкерівника. Каберголін — перша
  лінія терапії пролактиноми.
ukrainian_review_status: pending_clinical_signoff
