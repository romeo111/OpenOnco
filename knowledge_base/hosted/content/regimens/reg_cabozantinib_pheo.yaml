id: REG-CABOZANTINIB-PHEO
name: "Cabozantinib monotherapy (metastatic non-MIBG-avid pheochromocytoma/paraganglioma, alternative to sunitinib)"
name_ua: "Кабозантиніб монотерапія (метастатична MIBG-негативна феохромоцитома/парагангліома, альтернатива сунітинібу)"
alternate_names:
  - "Cabometyx PPGL"
  - "Cabozantinib PPGL"

components:
  - drug_id: DRUG-CABOZANTINIB
    dose: "60 mg PO daily"
    schedule: "Continuous daily dosing; take without food (>=1h before or 2h after meal), mirroring the standard cabozantinib monotherapy dose already used elsewhere in this KB (REG-CABOZANTINIB-RCC, REG-CABOZANTINIB-MTC-1L)"
    route: PO

cycle_length_days: 28
total_cycles: "Until progression or unacceptable toxicity"
toxicity_profile: moderate

premedication: []
mandatory_supportive_care: []
monitoring_schedule_id:

dose_adjustments:
  - condition: "Grade 3 adverse event, or intolerable Grade 2"
    modification: "Hold; reduce to 40 mg daily on resumption"
    rationale: "Standard cabozantinib dose-modification schedule used consistently across other cabozantinib-containing regimens in this KB"
    source_refs:
      - SRC-NCCN-NET-2025
  - condition: "Further dose reduction needed"
    modification: "Reduce to 20 mg daily"
    rationale: "Standard cabozantinib dose-modification schedule"
    source_refs:
      - SRC-NCCN-NET-2025

ukraine_availability:
  all_components_registered: true
  all_components_reimbursed: false
  notes: "Cabozantinib registered in Ukraine (see DRUG-CABOZANTINIB / REG-CABOZANTINIB-RCC). Reimbursement for pheochromocytoma/paraganglioma not confirmed."

sources:
  - SRC-NCCN-NET-2025

last_reviewed: "2026-07-11"
notes: >
  Cabozantinib is an NCCN-listed alternative to sunitinib for metastatic
  non-MIBG-avid PPGL, but rests on smaller single-arm / retrospective
  evidence rather than a randomized trial (unlike sunitinib's FIRSTMAPPP
  RCT -- see REG-SUNITINIB-PHEO). The drafting agent could not confirm a
  specific cabozantinib-in-PPGL trial name/citation with enough
  confidence to author a dedicated Source stub, so this regimen is cited
  only via the existing SRC-NCCN-NET-2025 guideline rather than a
  fabricated trial reference. Dose (60 mg daily) reuses the standard
  cabozantinib monotherapy dose already established in REG-CABOZANTINIB-
  RCC / REG-CABOZANTINIB-MTC-1L in this KB, not an invented number.
  STUB pending clinical co-lead signoff (CHARTER §6.1, dev-mode-exempted).
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_pheo_treatment_pathway
