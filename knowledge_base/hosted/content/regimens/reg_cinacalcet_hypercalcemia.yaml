notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1 — dev-mode-
  exempted draft content). Cinacalcet controls PTH-driven hypercalcemia
  in unresectable, recurrent, or metastatic parathyroid carcinoma; it
  has no direct antitumor effect. Re-resection of accessible disease,
  where surgically feasible, remains the preferred disease-directed
  intervention alongside this regimen in the recurrent/metastatic
  setting (see IND-PARATHYROID-CARCINOMA-2L-CINACALCET) — not encoded
  as a regimen component because surgical feasibility is
  patient/anatomy-specific, not a fixed pharmacologic step.
  Bisphosphonates (DRUG-ZOLEDRONATE) or denosumab (DRUG-DENOSUMAB) are
  complementary options for skeletal-related-event prevention in
  bone-metastatic disease and for hypercalcemia refractory to
  cinacalcet alone — not bundled into this regimen because they act on
  a distinct mechanism (osteoclast-mediated bone turnover vs. PTH
  secretion) and no fixed combination schedule is established in
  guidelines; use per concurrent clinical need alongside this regimen.
notes_ua: >
  СТАБ — очікує підпису клінічного співкерівника. Цинакалцет контролює
  ПТГ-залежну гіперкальціємію при нерезектабельній, рецидивній або
  метастатичній карциномі паращитоподібної залози; прямого
  протипухлинного ефекту не має.
