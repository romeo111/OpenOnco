id: REG-CINACALCET-HYPERCALCEMIA
name: "Cinacalcet for hypercalcemia of parathyroid carcinoma"
name_ua: "Цинакалцет при гіперкальціємії внаслідок карциноми паращитоподібної залози"
alternate_names: ["Calcimimetic therapy for PTC-associated hypercalcemia"]
disease_context: DIS-PARATHYROID-CARCINOMA
plan_track: standard
regimen_type: "calcimimetic_supportive_care"

components:
  - drug_id: DRUG-CINACALCET
    dose: "30 mg PO BID initial; titrate no more than q2-4wk to 60 mg BID → 90 mg BID → 90 mg TID → 90 mg QID (max) to normalize serum calcium"
    schedule: "Continuous, with food; dose escalation guided by serial serum calcium"
    route: PO

total_cycles: "Continuous — until hypercalcemia is controlled, disease progression, or intolerance"

toxicity_profile: low

premedication: []
mandatory_supportive_care: []
monitoring_schedule_id:

dose_adjustments:
  - condition: "Serum calcium normalizes or approaches the lower limit of normal during titration"
    modification: "Hold further dose escalation; consider dose reduction if calcium falls below normal"
    rationale: "Cinacalcet has a narrow therapeutic window between hypercalcemia control and iatrogenic hypocalcemia"
    source_refs: [SRC-NCCN-THYROID-2025]
  - condition: "Symptomatic hypocalcemia or serum calcium below the normal range"
    modification: "Hold cinacalcet; correct calcium; if still indicated, resume at a lower dose once calcium normalizes"
    rationale: "Dose-dependent hypocalcemia is the principal on-target toxicity"
    source_refs: [SRC-NCCN-THYROID-2025]

