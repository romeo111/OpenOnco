id: REG-CISPLATIN-CONCURRENT-RT-LARYNX
name: "Cisplatin concurrent with definitive RT (larynx-preservation CRT; RTOG 91-11)"
name_ua: "Цисплатин одночасно з дефінітивною променевою терапією (ларингоз-берігаюча ХПТ; RTOG 91-11)"
alternate_names:
  - "RTOG 91-11 concurrent chemoradiation arm"
  - "High-dose cisplatin q3weeks + RT (larynx preservation)"

components:
  - drug_id: DRUG-CISPLATIN
    dose: "100 mg/m² IV day 1 (preferred when ECOG 0-1, GFR ≥60, no neuropathy / ototoxicity / heart failure)"
    schedule: "Day 1 of each 21-day cycle x3 cycles (days 1, 22, 43), concurrent with a 7-week definitive RT course"
    route: IV

cycle_length_days: 21
total_cycles: "3 cycles (days 1, 22, 43) concurrent with 70 Gy / 35 fx definitive RT"
toxicity_profile: severe

premedication:
  - "Pre/post-hydration ≥2 L NS, mannitol/furosemide forced diuresis, antiemetic 5HT3 + NK1 + dexamethasone"
mandatory_supportive_care: []
monitoring_schedule_id:

dose_adjustments:
  - condition: "Cisplatin ototoxicity (gr ≥2 hearing loss) or peripheral neuropathy gr ≥2"
    modification: "Hold cisplatin for that cycle; carboplatin substitution is not formally validated in RTOG 91-11 but is a reasonable MDT-directed extrapolation per general NCCN HNSCC CRT practice"
    rationale: "Cumulative cisplatin toxicity"
    source_refs:
      - SRC-NCCN-HNSCC-2025
  - condition: "Cisplatin nephrotoxicity (creatinine increase >25% baseline OR GFR <60) or CrCl <50"
    modification: "Reduce or hold cisplatin per institutional protocol; optimize hydration"
    rationale: "Renal preservation"
    source_refs:
      - SRC-NCCN-HNSCC-2025
  - condition: "ECOG ≥2 or unable to tolerate 3-weekly high-dose cisplatin"
    modification: "MDT discussion — weekly low-dose cisplatin, cetuximab + RT, or primary surgery are extrapolated alternatives not directly tested in RTOG 91-11"
    rationale: "Fitness-driven de-escalation; not an RTOG-91-11-validated substitution"
    source_refs:
      - SRC-NCCN-HNSCC-2025

ukraine_availability:
  all_components_registered: true
  all_components_reimbursed: true
  notes: "Cisplatin widely available and НСЗУ-covered for general oncology use."

sources:
  - SRC-RTOG-9111-FORASTIERE-2003
  - SRC-NCCN-HNSCC-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending Clinical Co-Lead sign-off (CHARTER §6.1). Models the
  concurrent-cisplatin backbone of RTOG 91-11 (Forastiere NEJM 2003):
  cisplatin 100 mg/m² IV days 1, 22, 43 concurrent with 70 Gy / 35 fx
  definitive RT (see RC-LARYNGEAL-LA-CRT-RTOG9111). Carboplatin
  substitution for cisplatin-ineligible patients is NOT formally
  RTOG-91-11-validated — flagged explicitly in dose_adjustments rather
  than presented as trial-proven.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_draft
draft_revision: 1
