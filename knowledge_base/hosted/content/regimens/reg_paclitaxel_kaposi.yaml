id: REG-PACLITAXEL-KAPOSI
name: "Paclitaxel monotherapy (Kaposi sarcoma, post-anthracycline)"
name_ua: "Паклітаксел моно (саркома Капоші, після антрацикліну)"
alternate_names:
  - "Paclitaxel Kaposi sarcoma 2L"

components:
  - drug_id: DRUG-PACLITAXEL
    dose: "NOT YET SPECIFIED -- dose/schedule for this indication has not been verified against a primary source in this KB; do not administer using this stub. See regimen `notes`."
    schedule: "NOT YET SPECIFIED -- pending clinical co-lead verification"
    route: IV
    duration: "Until progression or unacceptable toxicity (typical for taxane monotherapy in this setting)"

cycle_length_days:
total_cycles: "Until progression or unacceptable toxicity"
toxicity_profile: moderate

premedication:
  - "Dexamethasone 20 mg PO at 12h and 6h before infusion (OR 20 mg IV at 30 min before) -- per DRUG-PACLITAXEL mandatory premedication"
  - "Diphenhydramine 50 mg IV at 30 min before infusion"
  - "H2 blocker (ranitidine 50 mg IV or famotidine 20 mg IV) at 30 min before infusion"
mandatory_supportive_care: []

dose_adjustments:
  - condition: "Grade 3-4 peripheral neuropathy"
    modification: "Discontinue paclitaxel per standard taxane dose-modification practice"
    rationale: "Standard paclitaxel neuropathy management (see DRUG-PACLITAXEL entity); cumulative dose-dependent"
    source_refs: []
  - condition: "Grade >=3 hypersensitivity reaction despite premedication"
    modification: "Discontinue; do not rechallenge without allergy/oncology co-management"
    rationale: "Cremophor-EL-mediated hypersensitivity (class effect)"
    source_refs: []

