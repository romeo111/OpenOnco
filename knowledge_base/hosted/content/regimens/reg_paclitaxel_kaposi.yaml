last_reviewed: "2026-07-11"
notes: >
  New Regimen entity reusing the existing DRUG-PACLITAXEL Drug entity.
  DRUG-PACLITAXEL already documents "Kaposi sarcoma (AIDS-related, 2L)"
  as an FDA-approved indication (regulatory_status.fda.indications_brief
  -- pre-existing fact, transcribed not invented, verified by direct
  read of drugs/paclitaxel.yaml during independent review) but its
  typical_dosing field does not carry a Kaposi-specific mg/m²/schedule
  figure, and no KB-verifiable primary source for that figure was
  available at authoring time. Per CHARTER §8.3 ("must NEVER invent a
  dose ..."), the `dose`/`schedule` component fields are deliberately
  left as an explicit flagged gap rather than a fabricated number --
  this is an intentional, disclosed omission, not an authoring
  oversight. The mandatory Cremophor-EL hypersensitivity premedication
  IS transcribed from the existing DRUG-PACLITAXEL entity because that
  fact is dose-independent and already verified in the KB.

  INDEPENDENT REVIEW CORRECTION (2026-07-11): an earlier draft cited
  SRC-NCCN-SKIN-2025 for the dose-adjustment items and the file's
  top-level sources. That source documents only basal-cell/squamous-
  cell skin cancer (confirmed by direct inspection of its own KB
  record) and does not mention Kaposi sarcoma, so citing it here would
  misrepresent evidentiary support; it was removed (`sources: []`,
  empty `source_refs`). This regimen has NO verified source for either
  its (deliberately omitted) dose or its toxicity-management content
  beyond the reused DRUG-PACLITAXEL entity itself -- a real,
  fully-disclosed evidentiary gap. STUB pending two-Clinical-Co-Lead
  signoff (CHARTER §6.1 -- dev-mode-exempted; safe to merge as draft
  content, NOT as published/verified clinical advice; this regimen
  additionally requires a dosing fill-in before it could ever be used
  clinically).
notes_ua: >
  Новий Regimen, що повторно використовує вже наявний Drug
  DRUG-PACLITAXEL. Конкретна доза мг/м² та режим для показання
  саркоми Капоші НЕ вказані навмисно -- на момент авторства не було
  доступного верифікованого джерела в базі. Це свідомо розкрита
  прогалина, а не недогляд. Премедикація проти гіперчутливості
  перенесена з наявного запису Drug, оскільки цей факт не залежить
  від дози. Незалежна перевірка видалила посилання на
  SRC-NCCN-SKIN-2025 (не стосується саркоми Капоші) як недостовірне.
ukrainian_review_status: pending_clinical_signoff
