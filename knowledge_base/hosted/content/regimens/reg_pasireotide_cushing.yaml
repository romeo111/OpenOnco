id: REG-PASIREOTIDE-CUSHING
name: "Pasireotide for Cushing disease (pituitary-directed medical therapy)"
name_ua: "Пасиреотид при хворобі Кушинга (гіпофіз-спрямована медикаментозна терапія)"
alternate_names:
  - "SSTR5-targeted therapy for persistent/recurrent Cushing disease"

components:
  - drug_id: DRUG-PASIREOTIDE
    dose: "0.6 mg SC starting dose"
    schedule: "Twice daily subcutaneous injection, titrated per 24-hour urinary free cortisol / late-night salivary cortisol response and tolerability (product-label range approximately 0.3-0.9 mg SC BID); pasireotide LAR 10 mg IM q4w is an alternative long-acting formulation for surgery-ineligible disease"
    route: SC

cycle_length_days:
total_cycles: "Continuous while cortisol control is maintained and tolerated"
toxicity_profile: moderate

premedication: []
mandatory_supportive_care: []
monitoring_schedule_id:

dose_adjustments:
  - condition: "Hyperglycemia (expected class effect, more pronounced than first-generation SSA)"
    modification: "Baseline and proactive glucose monitoring from treatment initiation; initiate/intensify antihyperglycemic therapy per glycemic response"
    rationale: "Potent SSTR5-mediated insulin/incretin suppression is the dominant on-target toxicity of pasireotide"
    source_refs:
      - SRC-NCCN-CNS-2025
  - condition: "Over-suppression of cortisol (adrenal insufficiency symptoms)"
    modification: "Hold or reduce dose; consider glucocorticoid replacement per endocrinology assessment"
    rationale: "Effective ACTH/cortisol suppression is the therapeutic goal but can overshoot into hypocortisolism"
    source_refs:
      - SRC-NCCN-CNS-2025

ukraine_availability:
  all_components_registered: false
  all_components_reimbursed: false
  notes: >
    Реєстраційний статус Signifor / Signifor LAR в Україні не перевірено в
    цьому чорновому опрацюванні; потребує підтвердження перед публікацією.

sources:
  - SRC-NCCN-CNS-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1). Pasireotide is the
  medical option named first in the Disease narrative for Cushing disease
  ("surgery, pasireotide, ketoconazole/metyrapone/osilodrostat"). The
  steroidogenesis-inhibitor class (ketoconazole, metyrapone, osilodrostat)
  named alongside it is not modeled as a separate Regimen/Drug in this pass
  — see DIS-PITUITARY-ADENOMA proposal notes for the open gap.
notes_ua: >
  ЗАГЛУШКА (STUB) до підпису клінічного співкерівника. Пасиреотид —
  медикаментозна терапія хвороби Кушинга, названа першою в клінічному
  наративі.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_v0_2_a_anchor
draft_revision: 1
