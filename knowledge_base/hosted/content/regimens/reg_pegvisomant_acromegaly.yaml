id: REG-PEGVISOMANT-ACROMEGALY
name: "Pegvisomant for residual acromegaly (GH-receptor antagonist)"
name_ua: "Пегвісомант при резидуальній акромегалії (антагоніст рецептора гормону росту)"
alternate_names:
  - "GH-receptor antagonist monotherapy or add-on for acromegaly"

components:
  - drug_id: DRUG-PEGVISOMANT
    dose: "Loading dose 40 mg SC, then 10 mg SC once daily"
    schedule: "Once daily; titrate in 5 mg increments every 4-6 weeks per serum IGF-1, to a usual maintenance range of 10-30 mg/day (maximum 30 mg/day)"
    route: SC

cycle_length_days:
total_cycles: "Continuous while IGF-1 remains controlled"
toxicity_profile: moderate

premedication: []
mandatory_supportive_care: []
monitoring_schedule_id:

dose_adjustments:
  - condition: "Transaminase elevation on treatment"
    modification: "Monitor LFTs at baseline, monthly for first 6 months, then periodically (more frequently if combined with a somatostatin analogue); hold/reduce dose per hepatotoxicity severity"
    rationale: "Pegvisomant carries a hepatotoxicity signal requiring proactive LFT monitoring"
    source_refs:
      - SRC-NCCN-CNS-2025
  - condition: "Used as add-on to ongoing SSA therapy rather than monotherapy"
    modification: "Combination with lanreotide/octreotide/pasireotide is an accepted strategy that can reduce the pegvisomant dose required for IGF-1 control"
    rationale: "GH-receptor blockade (pegvisomant) and SSTR-mediated GH/IGF-1 suppression (SSA) are complementary, non-overlapping mechanisms"
    source_refs:
      - SRC-NCCN-CNS-2025

ukraine_availability:
  all_components_registered: false
  all_components_reimbursed: false
  notes: >
    Реєстраційний статус пегвісоманту в Україні не перевірено в цьому
    чорновому опрацюванні; потребує підтвердження перед публікацією.

sources:
  - SRC-NCCN-CNS-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1). Used for
  biochemically persistent/residual acromegaly (elevated IGF-1) after
  surgery and/or SSA, per the Disease narrative. Referenced as
  concurrent/escalation therapy from IND-PITUITARY-ADENOMA-1L-ACROMEGALY-
  SURGERY-SSA rather than as its own separate Indication, since it is not a
  distinct line of therapy but an add-on/switch decision within the same
  acromegaly cohort.
notes_ua: >
  ЗАГЛУШКА (STUB) до підпису клінічного співкерівника. Пегвісомант — для
  резидуальної акромегалії після хірургії та/або SSA.
ukrainian_review_status: pending_clinical_signoff
ukrainian_drafted_by: claude_v0_2_a_anchor
draft_revision: 1
