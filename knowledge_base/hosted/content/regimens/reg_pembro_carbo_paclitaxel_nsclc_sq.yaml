id: REG-PEMBRO-CARBO-PACLITAXEL-NSCLC-SQ
name: Pembrolizumab + carboplatin + paclitaxel (squamous NSCLC, first line)
name_ua: Пембролізумаб + карбоплатин + паклітаксел (плоскоклітинний НМРЛ, перша лінія)
components:
- drug_id: DRUG-PEMBROLIZUMAB
  dose: 200 mg IV
  schedule: Day 1 every 21 days; up to 35 cycles total, including induction
  route: IV
- drug_id: DRUG-CARBOPLATIN
  dose: AUC 6 mg/mL/min IV
  schedule: Day 1 of each 21-day cycle, cycles 1-4
  route: IV
- drug_id: DRUG-PACLITAXEL
  dose: 200 mg/m² IV
  schedule: Day 1 of each 21-day cycle, cycles 1-4
  route: IV
cycle_length_days: 21
total_cycles: 4 induction cycles; then pembrolizumab alone, up to 35 total cycles
  or earlier progression/unacceptable toxicity
sources:
- SRC-KEYNOTE-407-PAZ-ARES-2018
- SRC-KEYTRUDA-USPI-2026
last_reviewed: null
reviewers: []
premedication:
- Confirm agent-specific premedication, antiemetic support, blood counts and renal/hepatic
  function with the treating team before treatment. This record is not a complete
  administration protocol.
notes: KEYNOTE-407 trial schedule. Paclitaxel and nab-paclitaxel are alternatives
  and must not be combined. No pemetrexed or pemetrexed maintenance. Selection and
  dose changes require clinician review; no current Ukrainian registration or reimbursement
  claim is made.
notes_ua: Графік дослідження KEYNOTE-407. Паклітаксел і наб-паклітаксел є альтернативами;
  їх не слід поєднувати. Пеметрексед і підтримувальна терапія пеметрекседом не входять
  у цю схему. Вибір лікування та зміна доз потребують клінічної перевірки.
ukrainian_review_status: pending_clinical_signoff
