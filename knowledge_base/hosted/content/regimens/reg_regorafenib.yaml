last_reviewed: "2026-04-25"
notes: >
  CORRECT trial (Grothey 2013): 3L+ chemo-refractory mCRC — regorafenib
  vs placebo improved mOS 6.4 vs 5.0 mo (HR 0.77). Modest absolute
  benefit. ReDOS dose-escalation strategy (Bekaii-Saab 2019) — start
  80 mg, escalate weekly to 160 mg if tolerated — preserves efficacy
  while substantially improving tolerability + treatment continuation
  rate. CONCUR (Asian patients) confirmed activity. CORRECT and
  SUNLIGHT (TAS-102+bev) outcomes broadly similar; SUNLIGHT now
  preferred 3L+ where accessible due to better tolerability profile.
  Hepatotoxicity surveillance critical — weekly LFT cycle 1, then q2w.
notes_ua: >
  Дослідження CORRECT (Grothey 2013): у хіміорефрактерному мКРР у 3-й лінії
  та далі регорафеніб порівняно з плацебо покращував мЗВ — 6,4 проти 5,0 міс.
  (ВР 0,77). Абсолютний виграш помірний. Схема ескалації дози ReDOS
  (Bekaii-Saab 2019) — початок з 80 мг, щотижневе підвищення до 160 мг за
  переносимості — зберігає ефективність і суттєво покращує переносимість та
  частоту продовження лікування. Дослідження CONCUR (азійська популяція)
  підтвердило активність препарату. Результати CORRECT і SUNLIGHT
  (TAS-102 + бевацизумаб) загалом подібні; наразі SUNLIGHT є переважним
  варіантом у 3-й лінії та далі там, де доступний, завдяки кращій
  переносимості. Моніторинг гепатотоксичності критично важливий —
  щотижневий контроль ЛФТ у 1-му циклі, далі кожні 2 тижні.
