id: REG-SSA-ACROMEGALY
name: "Somatostatin analogue for acromegaly (lanreotide first-generation SSA; pasireotide for SSA-refractory disease)"
name_ua: "Аналог соматостатину при акромегалії (ланреотид — SSA першого покоління; пасиреотид при резистентності до SSA)"
alternate_names:
  - "First-generation SSA for acromegaly"
  - "Post-surgical medical therapy for acromegaly"

components:
  - drug_id: DRUG-LANREOTIDE
    dose: "120 mg SC deep subcutaneous injection"
    schedule: "Every 4 weeks (q4w), titrated per IGF-1 response; may extend interval to q6-8w if IGF-1 stably normalized on long-term therapy"
    route: SC

cycle_length_days: 28
total_cycles: "Continuous until IGF-1 normalization is achieved and maintained, or until switched to pegvisomant / pasireotide for inadequate response"
toxicity_profile: low-moderate

premedication: []
mandatory_supportive_care: []
monitoring_schedule_id:

dose_adjustments:
  - condition: "IGF-1 not normalized on maximal lanreotide (or octreotide LAR) dose after adequate trial"
    modification: "Switch to or add pasireotide LAR (DRUG-PASIREOTIDE; second-generation, high-SSTR5-affinity SSA — more effective in a subset of SSA-partial-responders) OR add/switch to pegvisomant (REG-PEGVISOMANT-ACROMEGALY; GH-receptor antagonist) per MDT/endocrinology judgment"
    rationale: "Per Disease narrative: somatostatin analogs (octreotide LAR, lanreotide, pasireotide LAR) and GH-receptor antagonist (pegvisomant) are both listed for residual/persistent acromegaly after surgery"
    source_refs:
      - SRC-NCCN-CNS-2025
  - condition: "Hyperglycemia on SSA therapy"
    modification: "Monitor glucose; initiate/adjust antihyperglycemic therapy — more pronounced with pasireotide than lanreotide/octreotide"
    rationale: "Class effect of somatostatin analogues on insulin/glucagon secretion, exaggerated with SSTR5-active agents"
    source_refs:
      - SRC-NCCN-NET-2025

ukraine_availability:
  all_components_registered: true
  all_components_reimbursed: false
  notes: >
    Ланреотид (Somatuline Autogel) зареєстрований в Україні; НСЗУ-
    реімбурсація для акромегалії не включена до онкопакету 2025.

sources:
  - SRC-NCCN-CNS-2025
  - SRC-NCCN-NET-2025

last_reviewed: "2026-07-11"
reviewer_signoffs: []
notes: >
  STUB pending clinical co-lead signoff (CHARTER §6.1). Lanreotide modeled
  as the representative first-generation SSA per the Disease narrative
  ("somatostatin analogs (octreotide LAR, lanreotide, pasireotide LAR)"),
  mirroring the identical modeling choice already made in
  REG-LANREOTIDE-AUTOGEL-GI-NET / ALGO-PNET-METASTATIC-1L /
  ALGO-GI-NET-ADVANCED-1L. Octreotide LAR is an equivalent alternative
  first-generation SSA but DRUG-OCTREOTIDE does not yet exist in this KB
  (previously flagged as a deferred item in those sibling algorithms) — not
  authored here to stay within this task's scope; open gap noted on
  DIS-PITUITARY-ADENOMA.
notes_ua: >
  ЗАГЛУШКА (STUB) до підпису клінічного співкерівника. Ланреотид —
  представник SSA першого покоління для акромегалії; октреотид LAR є
  еквівалентною альтернативою, але ще не створений як окрема сутність DRUG.
ukrainian_review_status: pending_clinical_signoff
