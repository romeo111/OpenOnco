notes: 'STUB. American Association for the Study of Liver Diseases (AASLD) Practice Guidelines on the diagnosis and management of primary sclerosing cholangitis (PSC), 2010 (Chapman et al, Hepatology 51:660-678). Covers diagnosis (cholangiography — MRCP / ERCP — plus exclusion of secondary causes), distinction from PSC-AIH overlap, management of dominant strictures, screening / surveillance for cholangiocarcinoma (CCA), gallbladder cancer, hepatocellular carcinoma (when cirrhosis present), and colorectal cancer in PSC-IBD (annual colonoscopy from PSC diagnosis). Used by OpenOnco PSC-IBD CRC-surveillance and CCA-surveillance prevention pilots. May be partially superseded by AASLD 2022 PSC Practice Guidance — currency to be re-confirmed by maintainer.'
