notes: 'STUB. American College of Gastroenterology Clinical Guideline for ulcerative colitis in adults (2019). Covers colorectal-cancer-surveillance strategy for long-standing colitis (typically ≥8 yr disease duration for extensive / left-sided colitis), including: starting age, surveillance-interval stratification by extent + duration + PSC co-existence, chromoendoscopy / dye-spray vs high-definition white-light endoscopy preference, biopsy strategy (targeted ± random), dysplasia classification + management (visible vs invisible; LGD vs HGD vs cancer), and colectomy thresholds. Used by OpenOnco IBD-CRC prevention pilots and surveillance algorithms.'
