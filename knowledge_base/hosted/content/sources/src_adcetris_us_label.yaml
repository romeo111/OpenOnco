notes: 'Consulted 2026-10-12: sections 2.4 and 5.3 for primary G-CSF prophylaxis beginning with
  Cycle 1 in adults with previously untreated PTCL receiving ADCETRIS+CHP. Other indications,
  dose modifications and regulatory/availability claims not audited. Additional scoped review
  2026-10-13 of US section 1.5 through official Pfizer labeling: adult previously untreated
  CD30-expressing PTCL includes AITL and PTCL-NOS with CHP. Authorization does not establish
  subgroup superiority, universal CD30 percentage cutoff or Ukrainian/European authorization.
  Scoped review 2026-10-13: sections 4, 5.1 and adult Table 2 at 1.8 mg/kg every 3 weeks with
  chemotherapy. Bleomycin combination contraindication and sensory/motor grade-specific neuropathy
  modifications; no baseline eligibility or whole-label approval.'
