notes: >
  Citation confirmed via PubMed (PMID 37619579) / PMC (PMC10522778) and
  DOI lookup, 2026-07-11. Lancet Diabetes Endocrinol. 2023;11(10):720-730.
  doi:10.1016/S2213-8587(23)00193-6. First randomized trial of adjuvant
  mitotane in low/intermediate-recurrence-risk ACC (inclusion: ENSAT stage
  I-III, R0 resection, Ki-67 <=10%). 45 patients randomized to mitotane vs
  46 to surveillance. 5-year recurrence-free survival 79% (mitotane) vs
  75% (surveillance), HR 0.74 (95% CI 0.30-1.85, not significant); 5-year
  overall survival not significantly different (95% vs 86%). Concludes
  low/intermediate-risk ACC does not clearly benefit from adjuvant
  mitotane. In this KB, this evidence is used to restrict the adjuvant-
  mitotane Indication (IND-ACC-1L-RESECTION-MITOTANE) and its gating
  RedFlag (RF-ACC-HIGH-RECURRENCE-RISK-BIOLOGY) to the higher-recurrence-
  risk population that ADIUVO did NOT enroll (stage III, Ki-67 >10%, or
  incomplete/uncertain resection margin).
