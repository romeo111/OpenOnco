notes: 'STUB. American Gastroenterological Association Clinical Practice Update on management of Lynch syndrome (hereditary non-polyposis colorectal cancer; germline MMR / EPCAM pathogenic variants). Addresses risk-stratified surveillance colonoscopy intervals (commonly q1-2 yr starting age 20-25), endometrial / ovarian surveillance and risk-reducing hysterectomy + BSO timing, gastric / small-bowel / urothelial / pancreatic / CNS extracolonic surveillance, aspirin chemoprevention (CAPP2 data), and immune-checkpoint sensitivity of MSI-H Lynch tumors. Used by OpenOnco hereditary-cancer prevention pilots and Lynch-syndrome surveillance algorithms. Exact citation (lead author / journal volume / pages / DOI) to be confirmed by maintainer before promoting from STUB.'
