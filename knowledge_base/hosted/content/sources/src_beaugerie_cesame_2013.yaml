notes: >
  CESAME (Cancers Et Surrisque Associé aux Maladies inflammatoires
  intestinales En France) French national prospective cohort
  reporting new- and recurrent-cancer incidence in inflammatory
  bowel disease (Crohn's + ulcerative colitis) under thiopurine
  and/or anti-TNF exposure. Establishes the lymphoma signal
  (predominantly non-Hodgkin B-cell, modest RR in
  immunosuppressant-naive cohorts, higher on combination therapy)
  and the colitis-associated colorectal-cancer signal cited in
  RF-CHRONIC-IBD-CROHNS-SPECIFIC-PREVENTION + RF-IATROGENIC-
  ANTI-TNF-LYMPHOMA-PREVENTION. Real-world prospective design
  (~19,000 IBD patient-years follow-up) provides the population-
  level base rates that NCCN / ECCO / AGA consensus guidelines
  reference for risk-counseling and surveillance-cadence rationale.
