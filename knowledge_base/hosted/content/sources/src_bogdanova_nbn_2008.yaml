notes: >
  Slavic-founder NBN c.657del5 (p.Lys219AsnfsTer16) heterozygote
  breast-cancer case-control study and meta-analysis establishing
  the RR ~2.0-3.0 (~20-25% lifetime) estimate cited in
  RF-NBN-CONFIRMED-CARRIER. Belarusian + German + Russian cohorts
  pooled with prior Polish data to confirm the moderate-penetrance
  signal in heterozygous carriers — distinct from the dramatic
  lymphoid-malignancy risk in biallelic Nijmegen Breakage Syndrome.
  Anchors the population-specific testing rationale for Ukrainian /
  Eastern-European hereditary-breast-cancer panels because the
  c.657del5 carrier frequency in Slavic populations (~0.5-1%) makes
  cascade-testing yield meaningful.
