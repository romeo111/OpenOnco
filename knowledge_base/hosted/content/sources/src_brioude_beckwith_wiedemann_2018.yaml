notes: >
  International consensus statement on Beckwith-Wiedemann syndrome
  (BWS) diagnosis + surveillance. Establishes the BWS clinical scoring
  system + molecular subtype-stratified surveillance: abdominal US
  q3mo from birth to age 8 (Wilms detection), AFP q3mo from birth to
  age 4 (hepatoblastoma detection). Surveillance intensity stratified
  by molecular subtype (IC1/H19 hypermethylation = highest Wilms risk;
  pUPD11 = highest hepatoblastoma risk).
