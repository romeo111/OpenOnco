notes: >
  CAPS Consortium 2018 summit consensus on pancreatic-cancer
  surveillance schedule for familial pancreatic cancer (FPC)
  kindreds and germline carriers of PDAC-susceptibility variants.
  Establishes the alternating EUS + MRI/MRCP every 12 months
  cadence from age 50 (or 10 years before the earliest familial
  PDAC diagnosis) cited in IND-FPC-PANCREATIC-SURVEILLANCE and
  related germline-PDAC-risk indications. Companion to the later
  Goggins et al. 2020 update (SRC-CAPS-CONSORTIUM-PANCREATIC-2020,
  which adds Delphi-consensus refinements for ATM, PALB2, BRCA1/2
  carriers); both Canto 2018 and Goggins 2020 are co-cited where
  the underlying surveillance schedule is shared and the 2020
  refinements add new gene-specific guidance.
