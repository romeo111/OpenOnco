notes: >
  Phase 3 multicenter randomized double-blind trial (China):
  camrelizumab + gemcitabine/cisplatin (GP) vs placebo + GP as 1L
  treatment for treatment-naive recurrent or metastatic nasopharyngeal
  carcinoma. Camrelizumab + GP significantly improved progression-free
  survival vs placebo + GP. NMPA (China)-approved indication; NOT
  FDA-approved. Companion trial to JUPITER-02 (toripalimab) in the same
  clinical scenario, no head-to-head comparison between the two PD-1
  agents exists. DOI/PMID/exact page numbers and precise numeric
  point-estimates are DELIBERATELY NOT asserted here — require
  verification against the primary Lancet Oncology publication before
  this stub is used beyond draft/dev-mode content. STUB pending
  Clinical Co-Lead / source-ingestion review.
