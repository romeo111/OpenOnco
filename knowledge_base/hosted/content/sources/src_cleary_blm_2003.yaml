notes: >
  Ashkenazi-Jewish BLM(Ash) founder variant (p.Tyr736X /
  c.2207_2212delinsTAGATTC) heterozygote case-control study in
  Toronto-based Ashkenazi Jewish colorectal-cancer + breast-cancer
  cohorts. Original primary-literature signal for the BLM moderate-
  penetrance CRC risk (RR ~1.5-2.0; ~10-12% lifetime) cited in
  RF-BLM-CONFIRMED-CARRIER. The breast-cancer signal in this paper
  is suggestive but smaller in magnitude than CRC and has been
  inconsistently replicated in subsequent cohorts — the OpenOnco
  Indication framework treats BLM-heterozygote breast risk as
  context-only (no MRI-intensification recommended on BLM-only
  basis) while accepting the CRC q5y-colonoscopy intensification.
