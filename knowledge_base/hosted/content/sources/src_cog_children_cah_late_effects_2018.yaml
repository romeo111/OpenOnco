notes: 'STUB. Children''s Oncology Group Long-Term Follow-Up (LTFU) Guidelines for Survivors of Childhood, Adolescent, and Young Adult Cancers, v5.0 (October 2018). Risk-based, exposure-related clinical practice guideline for screening and management of late effects of pediatric oncology therapy. Cited from prevention pilots for the chronic-glucocorticoid-exposure and congenital-adrenal-hyperplasia (CAH) late-effects context. The "CAH-LATE-EFFECTS-2018" qualifier in the ID likely refers either to a specific LTFU module addressing chronic-steroid sequelae or to a sibling 2018 publication on long-term outcomes in CAH cohorts. Exact citation, journal (if separate publication), volume / pages, PMID and DOI to be confirmed by maintainer before promoting from STUB. Used as a tier-2 referenced source pending verification.'
