notes: >
  Foundational prospective cohort study establishing quantitative
  plasma EBV-DNA (measured by real-time PCR) as a prognostic biomarker
  in advanced nasopharyngeal carcinoma, including its value for
  post-treatment surveillance — persistent post-treatment detectability
  and rising levels on serial monitoring are associated with
  significantly worse outcomes and can precede radiographic relapse.
  Basis for BIO-EBV-DNA's use as a post-treatment surveillance marker
  in NPC (this KB's existing BIO-EBV-DNA entity currently documents
  this concept for NK/T-nasal lymphoma / PTLD only; this source extends
  that same underlying biomarker's evidence base to NPC specifically,
  per RF-NPC-EBV-DNA-POST-TREATMENT-SURVEILLANCE). DOI/PMID/exact page
  numbers DELIBERATELY NOT asserted here — require verification against
  the primary NEJM publication before this stub is used beyond
  draft/dev-mode content.
