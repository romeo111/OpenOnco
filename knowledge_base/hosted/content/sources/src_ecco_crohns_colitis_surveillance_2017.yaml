notes: 'STUB. Third European Evidence-Based Consensus on Diagnosis and Management of Ulcerative Colitis (and Crohn''s disease) by the European Crohn''s and Colitis Organisation (ECCO), published 2017 in Journal of Crohn''s and Colitis. Covers colorectal-cancer surveillance in long-standing IBD: stratification by extent / duration / PSC / family-history / inflammation activity, surveillance start at 8 yr from symptom onset (immediately at PSC diagnosis), risk-tiered surveillance intervals (annual / 2-3 yr / 5 yr), preferred technique (chromoendoscopy with targeted biopsies; HD-WLE acceptable), and dysplasia management. Used by OpenOnco IBD-CRC prevention pilots. The exact module / part (UC Part 1 vs Crohn''s 2017 vs Surgery 2020) cited per indication is to be confirmed by maintainer.'
