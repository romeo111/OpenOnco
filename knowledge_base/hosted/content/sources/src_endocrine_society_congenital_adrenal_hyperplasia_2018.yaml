notes: 'STUB. Endocrine Society Clinical Practice Guideline on congenital adrenal hyperplasia (CAH) due to steroid 21-hydroxylase deficiency, 2018 (Speiser et al, JCEM 103:4043-4088). Covers neonatal screening, diagnosis (17-OHP / cosyntropin testing, CYP21A2 genotyping), classification (classic salt-wasting / classic simple-virilizing / non-classic), glucocorticoid + mineralocorticoid replacement strategy, monitoring for over- vs under-treatment, fertility / pregnancy management, transition to adult care, and adrenal-rest tumor surveillance in testicular and ovarian tissue. OpenOnco cites this CPG for the chronic-glucocorticoid-exposure and adrenal-tumor late-effect context in CAH-related prevention and surveillance pilots.'
