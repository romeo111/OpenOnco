notes: >
  Pheochromocytoma/paraganglioma (PPGL) treatment-pathway authoring
  pass. Cited as the basis for: (1) mandatory preoperative
  alpha-adrenergic blockade (phenoxybenzamine or doxazosin) before any
  PPGL surgery to prevent intraoperative hypertensive crisis; (2)
  plasma free metanephrines as preferred first-line biochemical
  diagnostic test over urinary catecholamines; (3) recommendation for
  germline genetic testing in patients with PPGL; (4) minimally
  invasive (laparoscopic) adrenalectomy preferred for most
  pheochromocytomas, partial (cortical-sparing) adrenalectomy an
  option for selected (bilateral/hereditary) cases. Per PubMed
  abstract (PMID 24893135): "All patients with functional PPGLs
  should undergo preoperative blockade to prevent perioperative
  complications... We recommend minimally invasive adrenalectomy for
  most pheochromocytomas with open resection for most paragangliomas.
  Partial adrenalectomy is an option for selected patients." Title/
  author list/DOI/PMID verified via PubMed this session; full-text
  clinical detail (specific dosing/titration language) not re-read in
  full and remains flagged pending maintainer confirmation.
