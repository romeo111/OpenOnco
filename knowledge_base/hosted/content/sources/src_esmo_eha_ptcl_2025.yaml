precedence_policy: confirmatory
notes: 'Consulted 2026-10-13. Scoped review of PTCL-NOS/TFHL first-line consolidation recommendations
  and the randomized transplant comparison summarized in the guideline. Does not substantiate
  routine allo-CR1 superiority. Direct trial full text not verified; no whole-guideline currency,
  prescribing or individual eligibility approval. Additional scoped review 2026-10-13: first-line
  chemotherapy discussion and recommendations distinguish systemic ALCL from PTCL-NOS/TFHL;
  CHOP/CHOP-like recommendations and limited non-ALCL subgroup evidence do not establish a universal
  BV-CHP preference. No current regional regulatory database or Ukrainian access review.'
