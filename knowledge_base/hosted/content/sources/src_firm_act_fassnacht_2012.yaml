notes: >
  Citation confirmed via PubMed (PMID 22551107) and DOI lookup, 2026-07-11.
  N Engl J Med. 2012;366(23):2189-2197. doi:10.1056/NEJMoa1200966. FIRM-ACT
  (NCT00094497): international phase 3 RCT, 304 patients with advanced
  ACC, randomized to etoposide+doxorubicin+cisplatin+mitotane (EDP-M) vs
  streptozocin+mitotane (Sz-M) as 1L therapy, crossover to the other
  combination permitted at progression. Results confirmed via secondary
  search corroboration: response rate 23.2% (EDP-M) vs 9.2% (Sz-M),
  p<0.001; median PFS 5.0 vs 2.1 months; median OS 14.8 vs 12.0 months
  (p=0.07, not significant — confounded by crossover). Established EDP-M
  as the preferred 1L combination regimen for advanced ACC based on the
  response/PFS advantage despite the non-significant OS difference as
  randomized. Regimen detail (etoposide 100 mg/m² IV days 2-4, doxorubicin
  40 mg/m² IV day 1, cisplatin 40 mg/m² IV days 3-4, every 4 weeks, plus
  continuous oral mitotane targeting blood levels 14-20 mg/L) confirmed
  via search corroboration this session; verify against primary
  publication before treating as clinically authoritative.
