study_design:
  type: RCT
  phase: 2
  n: "78 (39 per arm)"
  population: >
    Adults with sporadic or inherited progressive, metastatic
    pheochromocytoma or paraganglioma; enrolled Dec 2011-Jan 2019 at
    14 academic centres across 4 European countries. 25/78 (32%) had
    germline SDHx variants; 54/78 (69%) had prior systemic therapy.
  intervention: "Sunitinib 37.5 mg PO once daily, continuous dosing"
  comparator: "Placebo, 1:1 randomisation stratified by SDHB status and prior-therapy count; crossover permitted at progression"
  primary_endpoint: "Progression-free rate at 12 months (RECIST 1.1, central review)"
key_results:
  summary: >
    Primary endpoint met: 12-month progression-free survival 36% (90%
    CI 23-50) with sunitinib vs 19% (90% CI 11-31) with placebo. First
    and only randomised, placebo-controlled trial of a systemic agent
    in metastatic PPGL. Per PubMed abstract (PMID 38402886): "This
    first randomised trial supports the use of sunitinib as the
    medical option with the highest level of evidence for anti-tumour
    efficacy in progressive metastatic phaeochromocytomas and
    paragangliomas."
safety:
  summary: >
    Grade 3-4 adverse events (sunitinib vs placebo): asthenia 18% vs
    3%, hypertension 13% vs 10%, back/bone pain 3% vs 8%. Three deaths
    in the sunitinib group (respiratory insufficiency, ALS, rectal
    bleeding -- only the rectal bleeding considered drug-related); two
    deaths in the placebo group (aspiration pneumonia, septic shock).
    Toxicity profile otherwise consistent with sunitinib's established
    class effects -- see DRUG-SUNITINIB key_toxicities.
clinical_significance: >
  FIRSTMAPPP is the only randomized, placebo-controlled trial of a
  systemic agent in metastatic/progressive pheochromocytoma and
  paraganglioma and is the primary evidentiary basis for sunitinib as
  the preferred 1L systemic option in MIBG-negative (or MIBG-avid but
  radiopharmaceutical-ineligible) metastatic PPGL, ahead of
  cabozantinib (which rests on smaller single-arm/retrospective
  evidence per NCCN).
notes: >
  ClinicalTrials.gov NCT01371201. Cited as the primary evidence anchor
  for REG-SUNITINIB-PHEO / IND-PHEO-METASTATIC-1L-SUNITINIB /
  ALGO-PHEO-1L. Data above (design, PFS-12mo rates, grade 3-4 AE
