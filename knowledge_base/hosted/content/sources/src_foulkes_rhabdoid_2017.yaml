notes: >
  AACR Special Issue: Tumor Surveillance Recommendations for Inherited
  Cancer Predisposition Syndromes in Childhood. Establishes the
  Rhabdoid Tumor Predisposition Syndrome (RTPS1/SMARCB1 + RTPS2/
  SMARCA4) surveillance schedule: brain MRI q3mo from infancy to age
  3-4, then q6mo to age 5; whole-body MRI q3-6mo to age 5 for
  extracranial MRT detection. Also covers Gorlin syndrome (PTCH1)
  basal cell + medulloblastoma surveillance.
