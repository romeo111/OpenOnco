notes: >
  GROINSS-V-I (GROningen INternational Study on Sentinel nodes in Vulvar
  cancer): prospective multicenter observational validation study,
  n=403 assessable patients with unifocal T1/T2 (<4 cm) squamous cell
  vulvar cancer (259 with unifocal disease and a negative sentinel
  node). Sentinel node (SN) procedure alone, omitting routine complete
  inguinofemoral lymphadenectomy in SN-negative patients: isolated
  groin recurrence rate 2.3% (95% CI 0.6-5%), 3-year survival rate 97%
  (95% CI 91-99%). Short-term morbidity markedly reduced vs complete
  lymphadenectomy: wound breakdown in the groin 11.7% vs 34.0%
  (p<0.0001); cellulitis 4.5% vs 21.3% (p<0.0001). Established the
  sentinel-node-biopsy paradigm as a safe alternative to routine
  complete inguinofemoral lymphadenectomy in eligible early-stage
  vulvar SCC. Long-term follow-up (Te Grootenhuis et al., Gynecol
  Oncol 2016; PMID 26428940 — not separately ingested as a Source in
  this pass) confirms durability: isolated groin recurrence 2.5% at
  both 5 and 10 years; long-term lymphedema markedly lower with
  SN-only management (1.9% vs 25.2% for complete lymphadenectomy).
  GROINSS-V-II (radiotherapy vs lymphadenectomy for micrometastatic
  sentinel nodes) and GROINSS-V-III (chemoradiation for macrometastatic
  sentinel nodes) are follow-on trials in the same research program,
  not separately ingested here.
