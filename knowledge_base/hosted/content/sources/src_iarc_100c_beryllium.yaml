notes: 'STUB. IARC Group 1 carcinogen review for beryllium and beryllium compounds. Sufficient evidence in humans for cancer of the lung. Occupational settings: beryllium-extraction / refining, beryllium-copper alloy production, nuclear / aerospace / electronics applications, dental laboratories. Used by OpenOnco for beryllium-exposure occupational pilots. Per-section pages and exposure-tier Tables to be filled on next IARC freshness check.'
