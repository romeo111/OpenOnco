notes: 'STUB. IARC Group 1 carcinogen review for hexavalent chromium [Cr(VI)] compounds. Establishes sufficient evidence in humans for cancer of the lung; limited evidence for cancer of the nose / nasal sinuses. Occupational exposures: chromate production, chromate pigment production, chrome plating, stainless-steel welding, ferrochromium production, leather tanning. Cited by OpenOnco occupational-prevention pilots covering chromate / chromium-VI exposure. Per-section pages, table indices, and exact authoring sub-group (Volume 100C Working Group) to be filled on next IARC freshness check.'
