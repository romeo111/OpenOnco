notes: 'STUB. IARC Group 1 carcinogen review for untreated and mildly treated mineral oils (i.e., metalworking fluids in pre-1950s formulations and some legacy lubricant applications). Sufficient evidence in humans for cancer of the skin (scrotum, other body sites); positive associations also reported with cancer of the bladder, lung, and upper aerodigestive tract. Highly treated mineral oils (post-1950s solvent-refined) carry markedly lower risk. Used by OpenOnco for metalworking-fluid / engineering-trade occupational pilots. Per-section pages and exposure-bracket Tables to be filled on next IARC freshness check.'
