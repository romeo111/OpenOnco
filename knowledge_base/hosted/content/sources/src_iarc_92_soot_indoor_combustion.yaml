notes: 'STUB. IARC Group 1 carcinogen evaluations for soot (chimney-sweep exposure — historically the first human occupational carcinogen recognized, Percival Pott 1775) and for indoor emissions from household combustion of coal (with limited evidence for biomass / wood-smoke as Group 2A). Sufficient evidence in humans: soot — cancer of the skin (scrotum) and lung; indoor coal combustion — cancer of the lung. Used by OpenOnco for chimney-sweep / firefighter / household-coal-smoke and biomass-fuel cooking pilots. Per-section pages and exposure-bracket Tables to be filled on next IARC freshness check.'
