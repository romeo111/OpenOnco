notes: 'STUB. IBIS-II (International Breast Cancer Intervention Study II) phase-3 RCT (n=3864): anastrozole 1 mg PO daily × 5 yr versus placebo for breast-cancer chemoprevention in postmenopausal women at high familial / personal-risk for breast cancer. Primary endpoint: incidence of all breast cancers (invasive + DCIS). After median 5.0 yr follow-up: 40 cases in anastrozole arm vs 85 in placebo (HR 0.47; 95% CI 0.32-0.68; p<0.0001), corresponding to ~50% relative-risk reduction. 10-yr follow-up (Cuzick Lancet 2020) confirmed durable benefit. Established anastrozole as a chemoprevention option for high-risk postmenopausal women, alongside tamoxifen / raloxifene / exemestane; cited from OpenOnco breast-cancer-prevention pilots.'
