notes: >
  Landmark Intergroup 0099 phase 3 randomized trial: concurrent
  cisplatin chemoradiation (cisplatin ~100 mg/m² IV q3w concurrent with
  RT) followed by adjuvant cisplatin+5-FU, vs radiation alone, in
  locally advanced nasopharyngeal carcinoma. Established concurrent
  chemoradiation as superior to radiation alone (improved progression-
  free and overall survival) — the foundational evidence for cisplatin
  radiosensitization in NPC, still reflected in modern NCCN/ESMO
  practice. This KB's REG-NPC-GC-INDUCTION-CCRT cites this source ONLY
  for the concurrent-phase superiority claim and cisplatin dose/
  schedule — the trial's original adjuvant cisplatin+5-FU tail is
  deliberately NOT modeled (current practice favors induction-then-CCRT
  instead; see REG-NPC-GC-INDUCTION-CCRT notes). DOI/PMID/exact page
  numbers and precise numeric point-estimates DELIBERATELY NOT asserted
  here — require verification against the primary JCO publication
  before this stub is used beyond draft/dev-mode content.
