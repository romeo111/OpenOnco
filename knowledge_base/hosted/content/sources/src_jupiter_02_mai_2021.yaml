notes: >
  Phase 3 multicenter randomized double-blind trial (China):
  toripalimab + gemcitabine/cisplatin (GP) vs placebo + GP as 1L
  treatment for treatment-naive recurrent or metastatic nasopharyngeal
  carcinoma. Toripalimab + GP significantly improved progression-free
  survival and objective response rate vs placebo + GP; a later
  analysis reportedly also demonstrated an overall survival benefit.
  Basis for FDA approval of toripalimab (Loqtorzi) in Oct 2023 for
  recurrent/metastatic NPC (combination 1L and post-platinum
  monotherapy). DOI/PMID/exact page numbers and precise numeric
  point-estimates (mPFS, HR, ORR) are DELIBERATELY NOT asserted here —
  bibliographic identifiers and exact figures require verification
  against the primary Nature Medicine publication before this stub is
  used for anything beyond draft/dev-mode content. STUB pending
  Clinical Co-Lead / source-ingestion review.
