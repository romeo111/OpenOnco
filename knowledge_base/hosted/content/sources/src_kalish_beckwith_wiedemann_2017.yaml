notes: >
  AACR Special Issue: Tumor Surveillance Recommendations for Inherited
  Cancer Predisposition Syndromes in Childhood. Operational surveillance
  schedule for overgrowth syndromes (Beckwith-Wiedemann, Sotos,
  Simpson-Golabi-Behmel, Perlman) with Wilms + hepatoblastoma risk:
  abdominal US q3mo to age 8 for Wilms, AFP q3mo to age 4 for
  hepatoblastoma. Companion to Brioude 2018 international consensus —
  more concise + oncology-focused.
