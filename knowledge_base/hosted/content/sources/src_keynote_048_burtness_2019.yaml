notes: >
  KEYNOTE-048 phase III randomized trial in untreated recurrent /
  metastatic HNSCC (all subsites including laryngeal primaries):
  pembrolizumab monotherapy vs pembrolizumab + platinum + 5-FU vs
  cetuximab + platinum + 5-FU (EXTREME). Pembrolizumab monotherapy
  improved OS vs EXTREME in PD-L1 CPS >=20 and CPS >=1 populations with
  a more favorable toxicity profile (median OS 14.9 vs 10.7 mo,
  CPS>=20). Pembrolizumab + chemotherapy improved OS vs EXTREME across
  CPS >=1 (median OS 13.6 vs 10.4 mo). Benefit attenuated in the CPS<1
  subgroup. Established the CPS-stratified pembrolizumab-based
  framework as 1L standard of care for recurrent/metastatic HNSCC,
  superseding EXTREME as the default for CPS >=1 disease; EXTREME
  remains preferred for CPS<1 or IO-contraindicated patients.
