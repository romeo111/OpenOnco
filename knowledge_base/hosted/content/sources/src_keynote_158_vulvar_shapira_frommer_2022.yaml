notes: >
  KEYNOTE-158 (NCT02628067) vulvar squamous cell carcinoma cohort:
  non-randomized, multicohort, open-label phase 2 basket trial.
  Pembrolizumab 200 mg IV q3w in previously treated advanced/recurrent
  vulvar SCC, enrolled irrespective of PD-L1 status; n=101. ORR 10.9%
  (95% CI 5.6-18.7%) all comers; 9.5% (4.2-17.9%) among 84 PD-L1-
  positive (CPS≥1) patients; 28.6% (3.7-71.0%) among 7 PD-L1-negative
  patients (very small subgroup, wide CI — NOT a validated PD-L1
  predictive cutoff for this tumor type). Median duration of response
  20.4 months (range 2.1+ to 28.0) among responders. Median PFS 2.1
  months (95% CI 2.0-2.1); median OS 6.2 months (95% CI 4.9-9.4).
  Treatment-related adverse events in 50.5% of patients (grade 3-5:
  11.9%); discontinuation for AE in 5.0%. Basket-trial evidence
  supporting pembrolizumab monotherapy as an option for previously
  treated advanced vulvar SCC — durable responses in a minority of
  patients; response occurred regardless of PD-L1 status, unlike the
  CPS≥1-gated cervical cancer label (KEYNOTE-826).
