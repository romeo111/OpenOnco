notes: 'STUB. MAGIC (Medical Research Council Adjuvant Gastric Infusional Chemotherapy) phase-3 RCT (n=503): perioperative ECF (epirubicin / cisplatin / 5-FU) — 3 pre-op + 3 post-op cycles — versus surgery alone for resectable gastric / gastroesophageal-junction / lower-oesophageal adenocarcinoma. Primary outcome: overall survival. 5-yr OS 36% (ECF) vs 23% (surgery alone), HR 0.75 (95% CI 0.60-0.93; p=0.009); also significant PFS benefit. Established perioperative chemo as a standard of care for resectable gastric / GEJ adenocarcinoma in Western practice; later superseded by FLOT (FLOT4-AIO) for fit patients but remains a landmark reference and is still cited in current ESMO / NCCN gastric guidelines.'
