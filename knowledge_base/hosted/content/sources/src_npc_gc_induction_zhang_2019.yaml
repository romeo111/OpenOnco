notes: >
  Multicenter randomized phase 3 trial (China): gemcitabine + cisplatin
  (GC) induction chemotherapy followed by concurrent chemoradiotherapy
  (CCRT), vs CCRT alone, in locoregionally advanced (higher nodal/
  tumor-burden) nasopharyngeal carcinoma. Reported improved
  recurrence-free survival and overall survival with GC induction added
  before CCRT vs CCRT alone. Established induction GC as a standard
  component of the modern NPC treatment pathway alongside (and largely
  supplanting) the older Intergroup-0099 concurrent+adjuvant paradigm.
  FLAGGED AS LOWER-CONFIDENCE than the other new sources in this bundle
  — general trial existence/design/direction-of-effect is recalled with
  reasonable confidence, but exact author order, DOI/PMID, and precise
  numeric point estimates (recurrence-free-survival %, hazard ratio)
  are NOT asserted with confidence and must be independently verified
  before this stub or any Indication/Regimen citing it is treated as
  anything beyond a dev-mode draft.
