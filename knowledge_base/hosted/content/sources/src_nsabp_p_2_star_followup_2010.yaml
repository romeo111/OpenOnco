notes: 'STUB. NSABP P-2 / STAR (Study of Tamoxifen and Raloxifene) phase-3 chemoprevention RCT (n=19,747 postmenopausal women at increased breast-cancer risk) — long-term follow-up update (median 81 mo). Compared tamoxifen 20 mg PO daily vs raloxifene 60 mg PO daily, each × 5 yr. Update findings: raloxifene retained 76% of the invasive-breast-cancer-reduction efficacy of tamoxifen (RR 1.24; 95% CI 1.05-1.47), with substantially fewer cases of uterine cancer, thromboembolism, and cataracts. No difference in non-invasive (LCIS/DCIS) outcomes; comparable osteoporotic-fracture and overall mortality. Established raloxifene as a viable alternative to tamoxifen for postmenopausal breast-cancer chemoprevention. Cited from OpenOnco breast-cancer-prevention pilots.'
