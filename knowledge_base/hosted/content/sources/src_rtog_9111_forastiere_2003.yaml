notes: >
  RTOG 91-11 phase III randomized trial (three arms: induction
  cisplatin + 5-FU -> RT if responder; concurrent cisplatin 100 mg/m^2
  IV days 1, 22, 43 + RT; RT alone) in locally advanced (stage III-IV,
  T2-T4 excluding very-advanced T4 with cartilage destruction or
  >1 cm tongue-base invasion) laryngeal SCC eligible for organ
  preservation. All arms received RT 70 Gy in 35 fractions (2 Gy/fx)
  over 7 weeks. Concurrent chemoradiation achieved the highest
  larynx-preservation rate at 2 years (~88% vs ~75% induction vs ~70%
  RT alone) without an overall-survival difference among arms.
  Long-term (10-year) follow-up (Forastiere et al., JCO 2013)
  confirmed a durable larynx-preservation advantage for the concurrent
  arm. Established concurrent cisplatin + RT as the standard
  nonsurgical larynx-preservation approach for locally advanced
  laryngeal SCC in cisplatin-fit patients.
