notes: >
  AACR Childhood Cancer Predisposition Special Issue operational
  surveillance schedule for DICER1 syndrome from the International
  DICER1 Syndrome Database (IDSDB) + International Pleuropulmonary
  Blastoma Registry (IPPBR). Provides the explicit cadence used by
  the OpenOnco DICER1 carrier-surveillance indication: chest CT (or
  low-dose chest CT) every 4-6 months from birth to age 3 and every
  6-12 months to age 8 for PPB detection; abdominal ultrasound every
  3-6 months from birth to age 8 for cystic nephroma + embryonal RMS;
  thyroid ultrasound baseline by age 8 and every 3-5 years lifelong;
  pelvic ultrasound in female carriers from menarche through age
  25-30 for Sertoli-Leydig tumor detection. Companion to the existing
  CMMRD (Wimmer 2014, Tabori 2017) and Rhabdoid (Foulkes 2017) AACR
  Special Issue sources.
