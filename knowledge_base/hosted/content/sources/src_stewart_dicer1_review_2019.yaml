notes: >
  Quantitative cancer-spectrum analysis of DICER1 syndrome carriers
  drawn from the International DICER1 Syndrome Database + Inherited
  Bone Marrow Failure Syndromes cohorts. Establishes the
  penetrance estimates cited in RF-DICER1-CONFIRMED-CARRIER:
  pleuropulmonary blastoma ~5-10% lifetime, Sertoli-Leydig cell
  tumor ~6-15% in female carriers, multinodular goiter ~75%, cystic
  nephroma ~5-10% childhood. Stratifies risk by carrier age and sex,
  showing PPB risk concentrated in the 0-6y window and Sertoli-
  Leydig risk in the adolescent / young-adult window — the empirical
  basis for the age-stratified surveillance cadence in the Schultz
  2018 companion guideline.
