notes: >
  AACR Special Issue: Tumor Surveillance Recommendations for Inherited
  Cancer Predisposition Syndromes in Childhood. The Tabori CMMRD
  recommendations are the operational pediatric-oncology surveillance
  schedule: brain MRI q6mo from age 2, colonoscopy q6mo from age 6,
  upper GI + small-bowel video capsule annual from age 8, abdominal US
  q3-6mo, CBC + SPEP q3-6mo. Anti-PD-1 immunotherapy noted as effective
  in established CMMRD-related cancers (universal MSI-high tumor
  phenotype).
